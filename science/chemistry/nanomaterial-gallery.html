<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nanomaterials 3D Visualization</title>
    <meta name="description" content="Nanomaterials 3D visualization. Explore nanoscale geometries, zooming from bulk graphite to 2D graphene, carbon nanotubes, fullerenes, and silver nanoparticles.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM (Removed crossorigin to prevent iframe CORS blocking) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for in-browser JSX transpilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Three.js for 3D Rendering & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <!-- GSAP for smooth kinematics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #0F172A;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #f1f5f9;
        }
        
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }

        /* Range Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #22d3ee;
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 0 0 10px rgba(34, 211, 238, 0.6);
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #334155;
            border-radius: 2px;
        }

        .tab-active {
            background-color: rgba(51, 65, 85, 0.9);
            border-top: 3px solid #22d3ee;
            color: #fff;
        }
        .tab-inactive {
            background-color: rgba(30, 41, 59, 0.4);
            border-top: 3px solid transparent;
            color: #94a3b8;
        }
        .tab-inactive:hover {
            background-color: rgba(51, 65, 85, 0.6);
            color: #e2e8f0;
        }

        canvas {
            display: block;
            border-radius: 0.75rem;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="flex items-center justify-center selection:bg-cyan-500/30">

    <div id="root" class="w-full h-full max-w-7xl max-h-[950px] relative p-2 md:p-4"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- ICON COMPONENTS ---
        const SvgIcon = ({ children, size = 20, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
        );
        const Layers = (p) => <SvgIcon {...p}><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></SvgIcon>;
        const Cylinder = (p) => <SvgIcon {...p}><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"/></SvgIcon>;
        const Hexagon = (p) => <SvgIcon {...p}><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></SvgIcon>;
        const Box = (p) => <SvgIcon {...p}><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></SvgIcon>;

        // --- IMPERATIVE 3D ENGINE ---
        // Decoupled from React to prevent re-render memory leaks and maintain 60fps
        const NanoEngine = {
            scene: null, camera: null, renderer: null, controls: null,
            groups: {},
            activeMode: null,
            silverInstancedMesh: null,
            totalSilverParticles: 1000,
            dummyMatrix: new THREE.Object3D(),
            silverSpacing: 1.0,
            targetSilverSpacing: 1.0,
            grapheneLayers: [],

            init(container) {
                if (this.renderer) return; // Prevent double init

                let width = container.clientWidth || 800;
                let height = container.clientHeight || 600;

                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x0a0f18);
                this.scene.fog = new THREE.FogExp2(0x0a0f18, 0.02);

                this.camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
                
                this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                this.renderer.setSize(width, height);
                this.renderer.setPixelRatio(window.devicePixelRatio);
                container.appendChild(this.renderer.domElement);

                this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
                this.controls.enableDamping = true;
                this.controls.dampingFactor = 0.05;

                // Lighting
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
                this.scene.add(ambientLight);

                const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
                dirLight.position.set(10, 20, 15);
                this.scene.add(dirLight);
                
                const pointLight = new THREE.PointLight(0x22d3ee, 1, 50);
                pointLight.position.set(-5, 0, 10);
                this.scene.add(pointLight);

                // Build Models
                this.buildGraphene();
                this.buildNanotube();
                this.buildFullerene();
                this.buildSilver();

                window.addEventListener('resize', () => {
                    if (!container) return;
                    let w = container.clientWidth;
                    let h = container.clientHeight;
                    if (w > 0 && h > 0) {
                        this.camera.aspect = w / h;
                        this.camera.updateProjectionMatrix();
                        this.renderer.setSize(w, h);
                    }
                });

                this.animate = this.animate.bind(this);
                requestAnimationFrame(this.animate);
            },

            // Generator Helper for Hex Lattices
            generateHexGrid(rings) {
                const R = 1.0; 
                const nodes = new Map(); 
                const bonds = []; 
                
                for (let q = -rings; q <= rings; q++) {
                    for (let r = -rings; r <= rings; r++) {
                        if (Math.abs(q + r) > rings) continue; 
                        const cx = Math.sqrt(3) * R * (q + r/2);
                        const cz = (3/2) * R * r;

                        for (let i = 0; i < 6; i++) {
                            const angle = (Math.PI / 3) * i + (Math.PI / 6);
                            const px = cx + R * Math.cos(angle);
                            const pz = cz + R * Math.sin(angle);
                            
                            const key = `${px.toFixed(2)},${pz.toFixed(2)}`;
                            if (!nodes.has(key)) nodes.set(key, { x: px, y: 0, z: pz });
                            
                            const prevAngle = (Math.PI / 3) * ((i + 5) % 6) + (Math.PI / 6);
                            const prevX = cx + R * Math.cos(prevAngle);
                            const prevZ = cz + R * Math.sin(prevAngle);
                            const prevKey = `${prevX.toFixed(2)},${prevZ.toFixed(2)}`;
                            
                            const id1 = [key, prevKey].sort().join('|');
                            if (!bonds.includes(id1) && nodes.has(prevKey)) {
                                bonds.push({ p1: nodes.get(key), p2: nodes.get(prevKey) });
                            }
                        }
                    }
                }
                return { nodes: Array.from(nodes.values()), bonds };
            },

            buildGraphene() {
                this.groups.graphene = new THREE.Group();
                const cMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.3, metalness: 0.8, transparent: true });
                const bMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.5, metalness: 0.4, transparent: true });

                const grid = this.generateHexGrid(3);

                const buildLayer = (yOffset) => {
                    const layer = new THREE.Group();
                    const atomGeo = new THREE.SphereGeometry(0.35, 16, 16);
                    
                    grid.nodes.forEach(n => {
                        const atom = new THREE.Mesh(atomGeo, cMat.clone());
                        atom.position.set(n.x, 0, n.z);
                        layer.add(atom);
                    });

                    grid.bonds.forEach(b => {
                        const p1 = new THREE.Vector3(b.p1.x, 0, b.p1.z);
                        const p2 = new THREE.Vector3(b.p2.x, 0, b.p2.z);
                        const cyl = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, p1.distanceTo(p2), 8), bMat.clone());
                        cyl.position.copy(p1).add(p2).multiplyScalar(0.5);
                        cyl.lookAt(p2);
                        cyl.rotateX(Math.PI / 2);
                        layer.add(cyl);
                    });

                    layer.position.y = yOffset;
                    return layer;
                };

                for(let i = -2; i <= 2; i++) {
                    const layer = buildLayer(i * 3.5);
                    this.grapheneLayers.push(layer);
                    this.groups.graphene.add(layer);
                }
                
                this.groups.graphene.rotation.x = Math.PI / 6;
                this.groups.graphene.visible = false;
                this.scene.add(this.groups.graphene);
            },

            buildNanotube() {
                this.groups.cnt = new THREE.Group();
                const cMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.3, metalness: 0.8 });
                const bMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.5, metalness: 0.4 });

                // Generate a wider flat grid
                const grid = this.generateHexGrid(5);
                const radius = 4.0; // Tube radius

                // Mathematical Transformation: Wrap 2D plane into 3D cylinder
                const wrapPoint = (p) => {
                    const theta = p.x / radius; // Map X to angle
                    return new THREE.Vector3(radius * Math.cos(theta), p.z, radius * Math.sin(theta));
                };

                const atomGeo = new THREE.SphereGeometry(0.35, 16, 16);
                grid.nodes.forEach(n => {
                    const atom = new THREE.Mesh(atomGeo, cMat);
                    atom.position.copy(wrapPoint(n));
                    this.groups.cnt.add(atom);
                });

                grid.bonds.forEach(b => {
                    const p1 = wrapPoint(b.p1);
                    const p2 = wrapPoint(b.p2);
                    const cyl = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, p1.distanceTo(p2), 8), bMat);
                    cyl.position.copy(p1).add(p2).multiplyScalar(0.5);
                    cyl.lookAt(p2);
                    cyl.rotateX(Math.PI / 2);
                    this.groups.cnt.add(cyl);
                });

                this.groups.cnt.rotation.z = Math.PI / 2;
                this.groups.cnt.visible = false;
                this.scene.add(this.groups.cnt);
            },

            buildFullerene() {
                this.groups.c60 = new THREE.Group();
                const cMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.3, metalness: 0.8 });
                const bMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.5, metalness: 0.4 });

                // Use an Icosahedron (detail 1) as a structural approximation for a Fullerene nanoparticle
                const geo = new THREE.IcosahedronGeometry(4, 1);
                const pos = geo.attributes.position;
                
                const atomGeo = new THREE.SphereGeometry(0.4, 16, 16);
                for (let i = 0; i < pos.count; i++) {
                    let atom = new THREE.Mesh(atomGeo, cMat);
                    atom.position.set(pos.getX(i), pos.getY(i), pos.getZ(i));
                    this.groups.c60.add(atom);
                }

                // Add wireframe bonds
                const edges = new THREE.EdgesGeometry(geo);
                const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({color: 0x94A3B8, linewidth: 3}));
                this.groups.c60.add(line);

                this.groups.c60.visible = false;
                this.scene.add(this.groups.c60);
            },

            buildSilver() {
                const sphereGeo = new THREE.SphereGeometry(0.5, 16, 16);
                const silverMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.2, metalness: 0.9 });
                this.silverInstancedMesh = new THREE.InstancedMesh(sphereGeo, silverMat, this.totalSilverParticles);
                
                let i = 0;
                const offset = 4.5; 
                for (let x = 0; x < 10; x++) {
                    for (let y = 0; y < 10; y++) {
                        for (let z = 0; z < 10; z++) {
                            this.dummyMatrix.position.set(x - offset, y - offset, z - offset);
                            this.dummyMatrix.updateMatrix();
                            this.silverInstancedMesh.setMatrixAt(i, this.dummyMatrix.matrix);
                            this.silverInstancedMesh.userData[`idx_${i}`] = {x: x-offset, y: y-offset, z: z-offset};
                            i++;
                        }
                    }
                }

                this.silverInstancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
                this.silverInstancedMesh.visible = false;
                this.scene.add(this.silverInstancedMesh);
                this.groups.silver = this.silverInstancedMesh;
            },

            setMode(mode) {
                this.activeMode = mode;
                
                // Hide all
                Object.values(this.groups).forEach(g => {
                    if (g) g.visible = false;
                });
                
                // Show target and set camera
                if (this.groups[mode]) {
                    this.groups[mode].visible = true;
                }

                if (mode === 'graphene') {
                    gsap.to(this.camera.position, {x: 0, y: 15, z: 35, duration: 1});
                } else if (mode === 'cnt') {
                    gsap.to(this.camera.position, {x: 0, y: 0, z: 25, duration: 1});
                } else if (mode === 'c60') {
                    gsap.to(this.camera.position, {x: 0, y: 0, z: 15, duration: 1});
                } else if (mode === 'silver') {
                    gsap.to(this.camera.position, {x: 15, y: 15, z: 25, duration: 1});
                }
                
                gsap.to(this.controls.target, {x: 0, y: 0, z: 0, duration: 1});
            },

            setGrapheneZoom(val) {
                const percent = val / 100;
                const startZ = 35;
                const endZ = 12;
                
                gsap.to(this.camera.position, {
                    x: 0, y: 15 * (1-percent), z: startZ - (startZ - endZ) * percent, 
                    duration: 0.5, ease: "power1.out"
                });

                // Fade outer layers to isolate a single 2D sheet
                this.grapheneLayers.forEach((layer, index) => {
                    const distance = Math.abs(index - 2); // Layer 2 is center
                    let targetOpacity = distance === 0 ? 1.0 : 1.0 - (percent * (distance / 2));
                    
                    layer.traverse((child) => {
                        if (child.isMesh) {
                            child.material.opacity = targetOpacity;
                            child.material.depthWrite = targetOpacity > 0.99;
                        }
                    });
                });
            },

            setSilverSpacing(val) {
                this.targetSilverSpacing = 1.0 + (val / 100) * 2.0; 
            },

            animate() {
                requestAnimationFrame(this.animate);
                this.controls.update();

                if (this.activeMode === 'graphene') {
                    this.groups.graphene.rotation.y += 0.002;
                } else if (this.activeMode === 'cnt') {
                    this.groups.cnt.rotation.x += 0.005;
                } else if (this.activeMode === 'c60') {
                    this.groups.c60.rotation.y += 0.005;
                    this.groups.c60.rotation.x += 0.002;
                } else if (this.activeMode === 'silver') {
                    this.silverSpacing += (this.targetSilverSpacing - this.silverSpacing) * 0.1;
                    
                    const time = Date.now() * 0.005;
                    for (let i = 0; i < this.totalSilverParticles; i++) {
                        const gridPos = this.silverInstancedMesh.userData[`idx_${i}`];
                        const jitter = (this.silverSpacing > 1.2) ? Math.sin(time + i) * 0.05 : 0;
                        
                        this.dummyMatrix.position.set(
                            gridPos.x * this.silverSpacing + jitter,
                            gridPos.y * this.silverSpacing + jitter,
                            gridPos.z * this.silverSpacing + jitter
                        );
                        this.dummyMatrix.updateMatrix();
                        this.silverInstancedMesh.setMatrixAt(i, this.dummyMatrix.matrix);
                    }
                    this.silverInstancedMesh.instanceMatrix.needsUpdate = true;
                    this.silverInstancedMesh.rotation.y += 0.001;
                }

                this.renderer.render(this.scene, this.camera);
            }
        };

        // --- REACT APPLICATION ---
        function App() {
            const [mode, setMode] = useState('graphene');
            const [zoomGraphene, setZoomGraphene] = useState(0);
            const [zoomSilver, setZoomSilver] = useState(0);
            const containerRef = useRef(null);

            useEffect(() => {
                if (containerRef.current) {
                    try {
                        NanoEngine.init(containerRef.current);
                        NanoEngine.setMode(mode);
                    } catch(err) {
                        console.error("Initialization error:", err);
                    }
                }
            }, []);

            useEffect(() => { NanoEngine.setMode(mode); }, [mode]);
            useEffect(() => { NanoEngine.setGrapheneZoom(zoomGraphene); }, [zoomGraphene]);
            useEffect(() => { NanoEngine.setSilverSpacing(zoomSilver); }, [zoomSilver]);

            // Silver Math Calculations
            const percent = zoomSilver / 100;
            const n = Math.floor(1 + percent * 999); 
            const s = Math.round(100 - percent * 90); 
            const sa = n * 6 * Math.pow(s, 2);

            return (
                <div className="flex flex-col h-full w-full bg-[#0F172A]">
                    
                    {/* Header */}
                    <header className="flex-shrink-0 text-center space-y-1 py-4">
                        <h1 className="text-3xl md:text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 via-blue-400 to-purple-500">
                            Nanomaterials 3D Visualization
                        </h1>
                        <p className="text-slate-400 text-sm md:text-base">Geometries & Exponential Surface Area Ratios at the Nanoscale</p>
                    </header>

                    {/* Navigation Tabs */}
                    <div className="flex justify-center flex-shrink-0 flex-wrap px-2">
                        <button onClick={() => setMode('graphene')} className={`px-4 md:px-6 py-3 font-semibold rounded-tl-lg transition-colors flex items-center gap-2 ${mode === 'graphene' ? 'tab-active' : 'tab-inactive border-r border-slate-700/50'}`}>
                            <Layers size={18} /> Graphene (2D)
                        </button>
                        <button onClick={() => setMode('cnt')} className={`px-4 md:px-6 py-3 font-semibold transition-colors flex items-center gap-2 ${mode === 'cnt' ? 'tab-active' : 'tab-inactive border-r border-slate-700/50'}`}>
                            <Cylinder size={18} /> Nanotube (1D)
                        </button>
                        <button onClick={() => setMode('c60')} className={`px-4 md:px-6 py-3 font-semibold transition-colors flex items-center gap-2 ${mode === 'c60' ? 'tab-active' : 'tab-inactive border-r border-slate-700/50'}`}>
                            <Hexagon size={18} /> Fullerene C₆₀ (0D)
                        </button>
                        <button onClick={() => setMode('silver')} className={`px-4 md:px-6 py-3 font-semibold rounded-tr-lg transition-colors flex items-center gap-2 ${mode === 'silver' ? 'tab-active' : 'tab-inactive'}`}>
                            <Box size={18} /> Silver NPs
                        </button>
                    </div>

                    {/* Main Workspace */}
                    <div className="flex-grow grid grid-cols-1 md:grid-cols-12 gap-4 min-h-0 bg-slate-900/50 rounded-b-xl rounded-t-none border border-slate-700 p-4">
                        
                        {/* LEFT: WebGL Viewport (Robust Absolute Sizing to prevent 0x0 crash) */}
                        <div className="md:col-span-8 relative rounded-xl border border-slate-600 bg-slate-950 overflow-hidden shadow-[inset_0_0_50px_rgba(0,0,0,0.8)] min-h-[400px]">
                            
                            <div id="webgl-container" ref={containerRef} className="absolute inset-0 w-full h-full"></div>
                            
                            <div className="absolute bottom-4 left-4 bg-slate-900/80 px-3 py-1.5 rounded-lg border border-slate-700 text-xs text-slate-400 flex items-center gap-2 pointer-events-none shadow-md z-10">
                                <span>🖱️ Click & Drag to Rotate</span>
                                <span className="w-px h-3 bg-slate-600"></span>
                                <span>📜 Scroll to Zoom</span>
                            </div>
                        </div>

                        {/* RIGHT: Dynamic Controls & Info */}
                        <div className="md:col-span-4 flex flex-col gap-4 overflow-y-auto custom-scrollbar pr-2">
                            
                            {/* Graphene Panel */}
                            {mode === 'graphene' && (
                                <div className="glass-panel rounded-xl p-5 flex flex-col gap-5 h-full animate-[fadeIn_0.3s_ease-out]">
                                    <div>
                                        <h2 className="text-xl font-bold text-cyan-400 uppercase tracking-widest flex items-center gap-2"><Layers size={20}/> Graphene</h2>
                                        <div className="text-sm font-mono text-blue-300 mt-1">Dimensionality: 2D</div>
                                    </div>
                                    <p className="text-slate-300 text-sm leading-relaxed">
                                        <b>Graphite</b> is a 3D bulk material comprised of stacked sheets of carbon. By isolating a <i>single</i> layer, we obtain <b>Graphene</b>: an ultra-strong, highly conductive 2D hexagonal lattice that is exactly one atom thick.
                                    </p>
                                    <div className="mt-auto p-4 bg-slate-800/80 rounded-lg border border-slate-600 space-y-4">
                                        <div className="flex justify-between text-xs font-bold uppercase text-slate-400 mb-2">
                                            <span className={zoomGraphene < 50 ? "text-cyan-400" : ""}>Bulk Graphite</span>
                                            <span className={zoomGraphene >= 50 ? "text-cyan-400" : ""}>Graphene Sheet</span>
                                        </div>
                                        <input type="range" min="0" max="100" value={zoomGraphene} onChange={(e) => setZoomGraphene(e.target.value)} />
                                        <div className="text-center text-xs text-slate-500 font-mono pt-2">Adjust Z-Axis Isolation</div>
                                    </div>
                                </div>
                            )}

                            {/* Carbon Nanotube Panel */}
                            {mode === 'cnt' && (
                                <div className="glass-panel rounded-xl p-5 flex flex-col gap-5 h-full animate-[fadeIn_0.3s_ease-out]">
                                    <div>
                                        <h2 className="text-xl font-bold text-blue-400 uppercase tracking-widest flex items-center gap-2"><Cylinder size={20}/> Carbon Nanotube</h2>
                                        <div className="text-sm font-mono text-cyan-300 mt-1">Dimensionality: 1D</div>
                                    </div>
                                    <p className="text-slate-300 text-sm leading-relaxed">
                                        A <b>Carbon Nanotube (CNT)</b> is formed when a 2D sheet of graphene is rolled into a seamless 1D cylinder. 
                                    </p>
                                    <ul className="text-sm text-slate-300 list-disc pl-4 space-y-2">
                                        <li><b>Tensile Strength:</b> Among the strongest materials ever discovered due to the seamless $sp^2$ bonded carbon network.</li>
                                        <li><b>Conductivity:</b> Delocalized electrons allow them to conduct electricity efficiently along the length of the tube.</li>
                                    </ul>
                                </div>
                            )}

                            {/* Fullerene Panel */}
                            {mode === 'c60' && (
                                <div className="glass-panel rounded-xl p-5 flex flex-col gap-5 h-full animate-[fadeIn_0.3s_ease-out]">
                                    <div>
                                        <h2 className="text-xl font-bold text-purple-400 uppercase tracking-widest flex items-center gap-2"><Hexagon size={20}/> Fullerene (C₆₀)</h2>
                                        <div className="text-sm font-mono text-pink-300 mt-1">Dimensionality: 0D</div>
                                    </div>
                                    <p className="text-slate-300 text-sm leading-relaxed">
                                        <b>Buckminsterfullerene</b> is a discrete spherical molecule containing exactly 60 carbon atoms. Because it exists as a confined point in space rather than a continuous lattice, it is classified as a 0D nanomaterial.
                                    </p>
                                    <ul className="text-sm text-slate-300 list-disc pl-4 space-y-2">
                                        <li><b>Structure:</b> Forms a truncated icosahedron (like a soccer ball) utilizing both hexagons and pentagons to achieve curvature.</li>
                                        <li><b>Applications:</b> Used in drug delivery (trapping molecules inside the cage) and advanced lubricants.</li>
                                    </ul>
                                </div>
                            )}

                            {/* Silver NPs Panel */}
                            {mode === 'silver' && (
                                <div className="glass-panel rounded-xl p-5 flex flex-col gap-5 h-full animate-[fadeIn_0.3s_ease-out]">
                                    <div>
                                        <h2 className="text-xl font-bold text-purple-400 uppercase tracking-widest flex items-center gap-2"><Box size={20}/> Silver Nanoparticles</h2>
                                        <div className="text-sm font-mono text-pink-300 mt-1">Surface Area to Volume Ratio</div>
                                    </div>
                                    <p className="text-slate-300 text-sm leading-relaxed">
                                        Fracturing a bulk solid into <b>nanoparticles (1-100 nm)</b> preserves total volume but exponentially increases exposed surface area, making them incredible catalysts and antimicrobial agents.
                                    </p>
                                    <div className="mt-2 p-4 bg-slate-800/80 rounded-lg border border-slate-600 space-y-4">
                                        <div className="flex justify-between text-xs font-bold uppercase text-slate-400 mb-2">
                                            <span className={zoomSilver < 50 ? "text-purple-400" : ""}>Bulk Block</span>
                                            <span className={zoomSilver >= 50 ? "text-purple-400" : ""}>Nanoparticles</span>
                                        </div>
                                        <input type="range" min="0" max="100" value={zoomSilver} onChange={(e) => setZoomSilver(e.target.value)} />
                                    </div>
                                    {/* Dynamic Math HUD */}
                                    <div className="bg-slate-950 rounded-lg p-4 border border-slate-700 font-mono flex flex-col gap-2 mt-auto">
                                        <div className="flex justify-between text-xs">
                                            <span className="text-slate-400">Side Length ($s$)</span>
                                            <span className="text-white">{s} nm</span>
                                        </div>
                                        <div className="flex justify-between text-xs">
                                            <span className="text-slate-400">Particle Count ($n$)</span>
                                            <span className="text-white">{n === 1 ? '1 (Bulk)' : n.toLocaleString()}</span>
                                        </div>
                                        <div className="w-full h-px bg-slate-800 my-1"></div>
                                        <div className="flex justify-between text-sm font-bold">
                                            <span className="text-pink-400">Total Surface Area</span>
                                            <span className={`tracking-wider ${percent > 0.8 ? 'text-red-400 drop-shadow-[0_0_8px_rgba(248,113,113,0.8)]' : percent > 0.4 ? 'text-purple-400' : 'text-pink-400'}`}>
                                                {sa.toLocaleString()} nm²
                                            </span>
                                        </div>
                                        <div className="text-[10px] text-slate-500 mt-1">Formula: $n \times 6s^2$</div>
                                    </div>
                                </div>
                            )}

                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
