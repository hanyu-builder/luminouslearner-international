<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Functional Group Spotter | Chemistry Interactive</title>
    <meta name="description" content="Identify functional groups practice. An interactive simulator that evaluates structural regions of complex organic molecules like Aspirin, Aspartame, and Vanillin.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body { 
            background-color: #0F172A; 
            color: #E2E8F0;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden; 
            user-select: none;
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

        /* SVG Hotspot Animations */
        .hotspot-rect {
            fill: rgba(56, 189, 248, 0.0);
            stroke: rgba(56, 189, 248, 0.5);
            stroke-width: 2.5;
            stroke-dasharray: 6 4;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: pulseDash 3s infinite linear;
        }
        .hotspot-rect:hover {
            fill: rgba(56, 189, 248, 0.15);
            stroke: rgba(56, 189, 248, 1);
            stroke-width: 3;
        }
        .hotspot-active {
            fill: rgba(56, 189, 248, 0.25);
            stroke: rgba(56, 189, 248, 1);
            stroke-dasharray: 0;
            stroke-width: 3;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
        }
        .hotspot-solved {
            fill: rgba(16, 185, 129, 0.15);
            stroke: rgba(16, 185, 129, 0.9);
            stroke-dasharray: 0;
            stroke-width: 3;
            cursor: default;
        }

        @keyframes pulseDash {
            to { stroke-dashoffset: -20; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-5px); }
            40% { transform: translateX(5px); }
            60% { transform: translateX(-5px); }
            80% { transform: translateX(5px); }
        }
        .anim-shake {
            animation: shake 0.4s ease-in-out;
        }

        .fade-in-up {
            animation: fadeInUp 0.4s ease-out forwards;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

            amide: { name: 'Amide', desc: 'A carbonyl (C=O) attached directly to a nitrogen atom. Extremely stable; forms peptide bonds in proteins.' },

        const getExamTip = (target, guess) => {

            if (target === 'ester' && guess === 'ether') return "Ethers are just C-O-C. Esters have a Carbonyl (C=O) right next door to the oxygen!";
            if (target === 'phenol' && guess === 'alcohol') return "-OH on a standard chain is an alcohol, but directly on a benzene ring it's a Phenol (which changes its reactivity!).";
            if (target === 'carboxyl' && (guess === 'ketone' || guess === 'alcohol')) return "Don't split it up! A C=O and -OH on the same carbon act together as a single Carboxyl group.";

                        {/* C-H */}
                        <line x1="320" y1="175" x2="350" y2="195" stroke="#94A3B8" strokeWidth="4" />
                        <text x="355" y="205" fill="#E2E8F0" fontSize="24" fontWeight="bold">H</text>
                    </g>
                ),
                regions: [
                    { id: 'cinn_arom', fg: 'aromatic', x: 140, y: 200, w: 110, h: 120 },
                    { id: 'cinn_alk', fg: 'alkene', x: 260, y: 210, w: 70, h: 50 },
                    { id: 'cinn_ald', fg: 'aldehyde', x: 330, y: 150, w: 90, h: 120 }
                ]
            }
        ];

        function App() {
            // --- STATE ---
            const [activeMolId, setActiveMolId] = useState('aspirin');
            const [selectedRegionId, setSelectedRegionId] = useState(null);
            
            // Map of solved regions: { regionId: true }
            const [solvedRegions, setSolvedRegions] = useState({});
            
            // Feedback State
            const [errorShakeId, setErrorShakeId] = useState(null);
            const [lastIdentified, setLastIdentified] = useState(null);
            const [customExamTip, setCustomExamTip] = useState(null);

            const activeMol = useMemo(() => MOLECULES.find(m => m.id === activeMolId), [activeMolId]);
            const selectedRegion = useMemo(() => activeMol.regions.find(r => r.id === selectedRegionId), [selectedRegionId, activeMol]);

            // Global score tracking
            const totalRegions = useMemo(() => MOLECULES.reduce((acc, mol) => acc + mol.regions.length, 0), []);
            const totalSolved = Object.keys(solvedRegions).length;

            // --- HANDLERS ---
            const handleMolSwitch = (id) => {
                setActiveMolId(id);
                setSelectedRegionId(null);
                setLastIdentified(null);
                setCustomExamTip(null);
            };

            const handleRegionClick = (id) => {
                if (solvedRegions[id]) return; // Don't re-select solved regions
                setSelectedRegionId(id);
                setErrorShakeId(null);
                setCustomExamTip(null);
            };

            const handleGuess = (fgKey) => {
                if (!selectedRegion) return;

                if (selectedRegion.fg === fgKey) {
                    // Correct!
                    setSolvedRegions(prev => ({ ...prev, [selectedRegion.id]: true }));
                    setLastIdentified(FG_TYPES[fgKey]);
                    setSelectedRegionId(null);
                    setCustomExamTip(null);
                } else {
                    // Incorrect! Provide pedagogic feedback if applicable.
                    const tip = getExamTip(selectedRegion.fg, fgKey);
                    if (tip) {
                        setCustomExamTip(tip);
                    } else {
                        setCustomExamTip("Not quite. Review the structure and try again!");
                    }

                    setErrorShakeId(fgKey);
                    setTimeout(() => setErrorShakeId(null), 400); // Remove shake class after animation
                }
            };

            const resetProgress = () => {
                setSolvedRegions({});
                setSelectedRegionId(null);
                setLastIdentified(null);
                setCustomExamTip(null);
            };

            // --- RENDER CALCS ---
            const regionsInActive = activeMol.regions.length;
            const solvedInActive = activeMol.regions.filter(r => solvedRegions[r.id]).length;
            const isMolComplete = regionsInActive === solvedInActive;

            return (
                <div className="w-full max-w-7xl h-full flex flex-col bg-slate-900 border border-slate-700 rounded-2xl md:rounded-3xl shadow-2xl overflow-hidden">
                    
                    {/* Header */}
                    <header className="bg-slate-800/80 backdrop-blur p-4 md:p-6 border-b border-slate-700 flex flex-col md:flex-row justify-between items-center shrink-0 z-10 gap-4">
                        <div>
                            <h1 className="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-emerald-400">
                                Functional Group Spotter
                            </h1>
                            <p className="text-slate-400 text-xs mt-1 uppercase tracking-wider font-semibold">
                                Structural Parsing & Identification
                            </p>
                        </div>
                        
                        {/* Global Progress */}
                        <div className="hidden md:flex flex-col items-center justify-center bg-slate-950 px-6 py-2 rounded-xl border border-slate-700">
                            <span className="text-[10px] text-slate-500 uppercase font-bold tracking-widest">Global Mastery</span>
                            <span className="text-lg font-bold text-emerald-400">{totalSolved} / {totalRegions}</span>
                        </div>
                        
                        {/* Molecule Selector */}
                        <div className="w-full md:w-72">
                            <label className="text-[10px] text-slate-400 uppercase font-bold tracking-widest block mb-1">Select Drug Molecule</label>
                            <select 
                                value={activeMolId} onChange={(e) => handleMolSwitch(e.target.value)}
                                className="w-full bg-slate-950 border border-slate-700 text-slate-200 text-sm font-bold rounded-lg p-2.5 outline-none focus:border-sky-500 transition-colors cursor-pointer"
                            >
                                {MOLECULES.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
                            </select>
                        </div>
                    </header>

                    {/* Main Workspace Layout */}
                    <div className="flex-grow flex flex-col lg:flex-row overflow-hidden relative min-h-0">
                        
                        {/* LEFT PANEL: Interactive SVG Viewer */}
                        <div className="w-full h-[45%] lg:h-auto lg:w-7/12 p-4 lg:p-8 border-b lg:border-b-0 lg:border-r border-slate-700 flex flex-col justify-start bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-800/50 to-slate-950 overflow-hidden relative">
                            
                            <h2 className="text-xs font-bold text-slate-500 uppercase tracking-widest flex justify-between items-end shrink-0 z-10">
                                <span>{activeMol.name} <span className="font-mono ml-2 text-sky-300">({activeMol.formula})</span></span>
                                <span className={`px-2 py-0.5 rounded border transition-colors ${isMolComplete ? 'bg-emerald-900/30 border-emerald-500 text-emerald-400 shadow-[0_0_10px_rgba(16,185,129,0.3)]' : 'bg-slate-800 border-slate-600'}`}>
                                    {solvedInActive} / {regionsInActive} Found
                                </span>
                            </h2>
                            <p className="text-sm text-slate-400 mt-2 shrink-0 z-10 hidden sm:block">{activeMol.desc}</p>

                            {/* SVG Container */}
                            <div className="flex-grow flex items-center justify-center relative mt-2 md:mt-4 min-h-0">
                                
                                {isMolComplete && (
                                    <div className="absolute top-2 md:top-4 bg-emerald-500 text-white px-4 py-1.5 rounded-full text-[10px] md:text-xs font-bold uppercase tracking-widest shadow-[0_0_15px_rgba(16,185,129,0.5)] z-20 fade-in-up">
                                        Molecule Fully Identified!
                                    </div>
                                )}

                                <svg viewBox="0 0 500 500" className="w-full h-full max-w-[400px] max-h-[400px] drop-shadow-2xl">
                                    {/* The Base Molecule */}
                                    {activeMol.render()}

                                    {/* The Interactive Regions (Hotspots) */}
                                    {activeMol.regions.map(region => {
                                        const isSolved = solvedRegions[region.id];
                                        const isSelected = selectedRegionId === region.id;
                                        
                                        return (
                                            <g key={region.id}>
                                                <rect 
                                                    x={region.x} y={region.y} 
                                                    width={region.w} height={region.h} 
                                                    rx="10"
                                                    onClick={() => handleRegionClick(region.id)}
                                                    className={`
                                                        ${isSolved ? 'hotspot-solved' : isSelected ? 'hotspot-active' : 'hotspot-rect'}
                                                    `}
                                                />
                                                {/* Label for solved regions */}
                                                {isSolved && (
                                                    <text 
                                                        x={region.x + region.w/2} y={region.y + region.h/2} 
                                                        fill="#10B981" fontSize="12" fontWeight="bold" textAnchor="middle" 
                                                        className="pointer-events-none drop-shadow-md"
                                                    >
                                                        ✓ {FG_TYPES[region.fg].name}
                                                    </text>
                                                )}
                                            </g>
                                        );
                                    })}
                                </svg>
                            </div>

                            {/* Floating hint to click hotspots */}
                            {solvedInActive === 0 && !selectedRegionId && (
                                <div className="absolute bottom-4 md:bottom-6 left-1/2 -translate-x-1/2 bg-sky-900/80 backdrop-blur px-3 md:px-4 py-2 rounded-full border border-sky-500 text-[9px] md:text-[10px] uppercase tracking-widest text-sky-200 pointer-events-none flex items-center gap-2 z-10 shadow-[0_0_15px_rgba(56,189,248,0.3)] animate-pulse w-max">
                                    <svg className="w-4 h-4 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path></svg>
                                    Click flashing dashed regions to begin
                                </div>
                            )}

                        </div>

                        {/* RIGHT PANEL: Logic Engine & Multiple Choice */}
                        <div className="w-full h-[55%] lg:h-auto lg:w-5/12 bg-slate-900 flex flex-col z-10 overflow-hidden">
                            
                            <div className="p-4 lg:p-8 flex-grow overflow-y-auto custom-scroll flex flex-col gap-4 md:gap-6">
                                
                                <div className="flex justify-between items-center border-b border-slate-800 pb-2 shrink-0">
                                    <h2 className="text-xs font-bold text-slate-500 uppercase tracking-widest">Identification Panel</h2>
                                    <button onClick={resetProgress} className="text-[10px] font-bold text-slate-400 hover:text-white bg-slate-800 px-3 py-1.5 rounded transition-colors">RESET ALL</button>
                                </div>

                                {!selectedRegion ? (
                                    <div className="flex-grow flex flex-col items-center justify-center opacity-60 text-center py-8">
                                        <svg className="w-16 h-16 mb-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                                        <p className="text-lg font-bold text-slate-300">Waiting for Input...</p>
                                        <p className="text-sm mt-2 max-w-xs text-slate-400">Select a highlighted functional group on the molecule diagram to identify it.</p>
                                    </div>
                                ) : (
                                    <div className="flex flex-col gap-4 fade-in-up">
                                        <div className="bg-sky-900/20 border border-sky-500/50 p-4 rounded-xl text-center shadow-inner relative overflow-hidden">
                                            <div className="absolute top-0 left-0 w-full h-1 bg-sky-500"></div>
                                            <p className="text-sky-300 font-bold text-lg">Region Selected!</p>
                                            <p className="text-xs text-slate-400 mt-1">Identify the correct functional group from the library below.</p>
                                        </div>

                                        {/* Error Tip Popup */}
                                        {customExamTip && (
                                            <div className="bg-rose-900/20 border border-rose-500/50 p-3 rounded-lg flex items-start gap-3 fade-in-up">
                                                <span className="text-rose-400 mt-0.5">⚠️</span>
                                                <p className="text-xs text-rose-200 font-medium leading-relaxed">{customExamTip}</p>
                                            </div>
                                        )}

                                        <div className="grid grid-cols-2 gap-2 mt-2">
                                            {FG_OPTIONS.map(fgKey => (
                                                <button 
                                                    key={fgKey}
                                                    onClick={() => handleGuess(fgKey)}
                                                    className={`p-3 rounded-lg border-2 text-xs font-bold text-left transition-all flex items-center justify-center text-center
                                                        ${errorShakeId === fgKey 
                                                            ? 'bg-rose-900/50 border-rose-500 text-rose-200 anim-shake' 
                                                            : 'bg-slate-800 border-slate-700 text-slate-300 hover:bg-slate-700 hover:border-slate-500 active:scale-95'}`}
                                                >
                                                    {FG_TYPES[fgKey].name}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                )}

                            </div>

                            {/* Educational Tooltip Footer */}
                            <div className="p-4 lg:p-6 bg-slate-950 border-t border-slate-800 shrink-0 min-h-[100px] md:min-h-[140px]">
                                <h3 className="text-[9px] md:text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2 md:mb-3">Structural Insights</h3>
                                {lastIdentified ? (
                                    <div className="bg-emerald-900/10 border-l-4 border-emerald-500 p-3 md:p-4 rounded-r-xl fade-in-up">
                                        <h4 className="text-xs md:text-sm font-bold text-emerald-400 mb-1">{lastIdentified.name}</h4>
                                        <p className="text-[10px] md:text-xs text-slate-300 leading-relaxed">{lastIdentified.desc}</p>
                                    </div>
                                ) : (
                                    <p className="text-[10px] md:text-xs text-slate-600 italic">Successfully identify a functional group to reveal structural insights here.</p>
                                )}
                            </div>

                        </div>

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
