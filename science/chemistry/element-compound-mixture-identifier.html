<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Element, Compound, Mixture | Particulate Simulator</title>
  <meta name="description" content="Interactive particulate diagram simulator. Classify elements, compounds, and mixtures by examining their molecular and atomic arrangements.">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for in-browser JSX transpilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { background-color: #0F172A; margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    
    /* Custom Scrollbar */
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(30, 41, 59, 0.5); }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(71, 85, 105, 0.8); border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 1); }
  </style>
</head>
<body class="bg-slate-900 text-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- ICON COMPONENTS (Fixed for Browser Environment) ---
    const SvgIcon = ({ children, size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
    );
    const RefreshCcw = (p) => <SvgIcon {...p}><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21h5v-5"/></SvgIcon>;
    const Info = (p) => <SvgIcon {...p}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></SvgIcon>;
    const CheckCircle2 = (p) => <SvgIcon {...p}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></SvgIcon>;
    const XCircle = (p) => <SvgIcon {...p}><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></SvgIcon>;
    const GripHorizontal = (p) => <SvgIcon {...p}><circle cx="12" cy="9" r="1"/><circle cx="19" cy="9" r="1"/><circle cx="5" cy="9" r="1"/><circle cx="12" cy="15" r="1"/><circle cx="19" cy="15" r="1"/><circle cx="5" cy="15" r="1"/></SvgIcon>;

    // --- PARTICULATE SVG GENERATORS ---

    const renderMonoatomicGas = (color) => (
      <svg viewBox="0 0 100 100" className="w-full h-full drop-shadow-md">
        <circle cx="20" cy="30" r="6" fill={color} />
        <circle cx="70" cy="20" r="6" fill={color} />
        <circle cx="40" cy="70" r="6" fill={color} />
        <circle cx="80" cy="75" r="6" fill={color} />
        <circle cx="15" cy="80" r="6" fill={color} />
        <circle cx="50" cy="40" r="6" fill={color} />
      </svg>
    );

    const renderDiatomicGas = (color) => (
      <svg viewBox="0 0 100 100" className="w-full h-full drop-shadow-md">
        <g transform="translate(25, 25) rotate(45)"><circle cx="-5" cy="0" r="6" fill={color} /><circle cx="5" cy="0" r="6" fill={color} /></g>
        <g transform="translate(75, 30) rotate(-20)"><circle cx="-5" cy="0" r="6" fill={color} /><circle cx="5" cy="0" r="6" fill={color} /></g>
        <g transform="translate(45, 75) rotate(70)"><circle cx="-5" cy="0" r="6" fill={color} /><circle cx="5" cy="0" r="6" fill={color} /></g>
        <g transform="translate(80, 80) rotate(10)"><circle cx="-5" cy="0" r="6" fill={color} /><circle cx="5" cy="0" r="6" fill={color} /></g>
        <g transform="translate(15, 70) rotate(-60)"><circle cx="-5" cy="0" r="6" fill={color} /><circle cx="5" cy="0" r="6" fill={color} /></g>
      </svg>
    );

    const renderSolidLattice = (color) => (
      <svg viewBox="0 0 100 100" className="w-full h-full drop-shadow-md">
        {Array.from({ length: 4 }).map((_, row) =>
          Array.from({ length: 4 }).map((_, col) => (
            <circle key={`${row}-${col}`} cx={25 + col * 16} cy={25 + row * 16} r="7" fill={color} />
          ))
        )}
      </svg>
    );

    const renderWaterMolecules = () => (
      <svg viewBox="0 0 100 100" className="w-full h-full drop-shadow-md">
        {[
          { x: 30, y: 30, r: 20 }, { x: 75, y: 25, r: -40 },
          { x: 50, y: 70, r: 160 }, { x: 20, y: 80, r: 80 },
          { x: 80, y: 75, r: -110 }
        ].map((pos, i) => (
          <g key={i} transform={`translate(${pos.x}, ${pos.y}) rotate(${pos.r})`}>
            <circle cx="0" cy="0" r="8" fill="#ef4444" /> {/* Oxygen */}
            <circle cx="-7" cy="-6" r="4.5" fill="#f8fafc" /> {/* Hydrogen */}
            <circle cx="7" cy="-6" r="4.5" fill="#f8fafc" /> {/* Hydrogen */}
          </g>
        ))}
      </svg>
    );

    const renderCompoundLattice = () => (
      <svg viewBox="0 0 100 100" className="w-full h-full drop-shadow-md">
        {Array.from({ length: 4 }).map((_, row) =>
          Array.from({ length: 4 }).map((_, col) => {
            const isNa = (row + col) % 2 === 0;
            return (
              <circle key={`${row}-${col}`} cx={25 + col * 16} cy={25 + row * 16} r={isNa ? "6" : "8"} fill={isNa ? "#a855f7" : "#22c55e"} />
            );
          })
        )}
      </svg>
    );

    const renderGasMixture = () => (
      <svg viewBox="0 0 100 100" className="w-full h-full drop-shadow-md">
        {/* Diatomic O2 */}
        <g transform="translate(20, 20) rotate(45)"><circle cx="-5" cy="0" r="6" fill="#ef4444" /><circle cx="5" cy="0" r="6" fill="#ef4444" /></g>
        <g transform="translate(80, 70) rotate(-30)"><circle cx="-5" cy="0" r="6" fill="#ef4444" /><circle cx="5" cy="0" r="6" fill="#ef4444" /></g>
        
        {/* Diatomic N2 */}
        <g transform="translate(70, 25) rotate(15)"><circle cx="-6" cy="0" r="7" fill="#3b82f6" /><circle cx="6" cy="0" r="7" fill="#3b82f6" /></g>
        <g transform="translate(30, 80) rotate(80)"><circle cx="-6" cy="0" r="7" fill="#3b82f6" /><circle cx="6" cy="0" r="7" fill="#3b82f6" /></g>
        
        {/* Monoatomic Ar */}
        <circle cx="50" cy="50" r="5" fill="#22c55e" />
        <circle cx="15" cy="50" r="5" fill="#22c55e" />
      </svg>
    );

    const renderLiquidMixture = () => (
      <svg viewBox="0 0 100 100" className="w-full h-full drop-shadow-md">
        {/* Water Molecules */}
        {[ { x: 25, y: 35, r: 40 }, { x: 70, y: 75, r: -20 }, { x: 40, y: 80, r: 110 } ].map((pos, i) => (
          <g key={`w-${i}`} transform={`translate(${pos.x}, ${pos.y}) rotate(${pos.r})`}>
            <circle cx="0" cy="0" r="8" fill="#ef4444" />
            <circle cx="-7" cy="-6" r="4.5" fill="#f8fafc" />
            <circle cx="7" cy="-6" r="4.5" fill="#f8fafc" />
          </g>
        ))}
        {/* Dissolved Ions (NaCl) */}
        <circle cx="75" cy="30" r="6" fill="#a855f7" />
        <circle cx="20" cy="70" r="8" fill="#22c55e" />
        <circle cx="50" cy="20" r="8" fill="#22c55e" />
      </svg>
    );

    // Added: Solid Mixture (Alloy)
    const renderAlloy = () => (
      <svg viewBox="0 0 100 100" className="w-full h-full drop-shadow-md">
        {/* Main Lattice (Iron) */}
        {Array.from({ length: 4 }).map((_, row) =>
          Array.from({ length: 4 }).map((_, col) => (
            <circle key={`fe-${row}-${col}`} cx={25 + col * 16} cy={25 + row * 16} r="7" fill="#94a3b8" />
          ))
        )}
        {/* Interstitial Atoms (Carbon) */}
        <circle cx="33" cy="33" r="3" fill="#334155" />
        <circle cx="65" cy="49" r="3" fill="#334155" />
        <circle cx="49" cy="65" r="3" fill="#334155" />
        <circle cx="81" cy="33" r="3" fill="#334155" />
      </svg>
    );

    // --- GAME DATA ---
    const INITIAL_ITEMS = [
      { id: 'item-1', category: 'element', name: 'Helium Gas (He)', render: () => renderMonoatomicGas('#fcd34d') },
      { id: 'item-2', category: 'element', name: 'Oxygen Gas (O₂)', render: () => renderDiatomicGas('#ef4444') },
      { id: 'item-3', category: 'element', name: 'Solid Iron (Fe)', render: () => renderSolidLattice('#94a3b8') },
      { id: 'item-4', category: 'compound', name: 'Pure Water (H₂O)', render: () => renderWaterMolecules() },
      { id: 'item-5', category: 'compound', name: 'Table Salt (NaCl)', render: () => renderCompoundLattice() },
      { id: 'item-6', category: 'mixture', name: 'Air (N₂, O₂, Ar)', render: () => renderGasMixture() },
      { id: 'item-7', category: 'mixture', name: 'Saltwater (H₂O + NaCl)', render: () => renderLiquidMixture() },
      { id: 'item-8', category: 'mixture', name: 'Steel (Alloy: Fe + C)', render: () => renderAlloy() }, // Pedagogical addition
    ];

    function App() {
      const [pool, setPool] = useState([...INITIAL_ITEMS].sort(() => Math.random() - 0.5));
      const [bins, setBins] = useState({ element: [], compound: [], mixture: [] });
      const [feedback, setFeedback] = useState(null); 
      const [score, setScore] = useState(0);

      // Drag Handlers
      const handleDragStart = (e, item, source) => {
        e.dataTransfer.setData('application/json', JSON.stringify({ item, source }));
        e.dataTransfer.effectAllowed = 'move';
      };

      const handleDragOver = (e) => {
        e.preventDefault(); // Required to allow dropping
        e.dataTransfer.dropEffect = 'move';
      };

      const handleDrop = (e, targetBin) => {
        e.preventDefault();
        try {
          const data = JSON.parse(e.dataTransfer.getData('application/json'));
          const { item, source } = data;

          // Prevent dropping into the same bin it came from
          if (source === targetBin) return;

          // Core Logic / Validation
          if (item.category === targetBin) {
            // Correct Placement
            setFeedback({ message: `Correct! ${item.name} is a(n) ${targetBin}.`, type: 'success' });
            setScore(s => s + 1);
            
            // Move item
            if (source === 'pool') {
              setPool(prev => prev.filter(i => i.id !== item.id));
            } else {
              setBins(prev => ({ ...prev, [source]: prev[source].filter(i => i.id !== item.id) }));
            }
            
            setBins(prev => ({
              ...prev,
              [targetBin]: [...prev[targetBin], item]
            }));

          } else {
            // Incorrect Placement
            setFeedback({ message: `Incorrect. Look closely at the particles in ${item.name}.`, type: 'error' });
          }

          // Clear feedback after 2.5s
          setTimeout(() => setFeedback(null), 2500);

        } catch (err) {
          console.error("Drop parsing error", err);
        }
      };

      const resetGame = () => {
        setPool([...INITIAL_ITEMS].sort(() => Math.random() - 0.5));
        setBins({ element: [], compound: [], mixture: [] });
        setScore(0);
        setFeedback(null);
      };

      const isComplete = pool.length === 0;

      return (
        <div className="min-h-screen bg-slate-900 text-slate-200 font-sans p-4 md:p-8 flex flex-col items-center selection:bg-cyan-500/30">
          
          {/* Header */}
          <header className="max-w-4xl w-full text-center mb-8 space-y-3">
            <h1 className="text-3xl md:text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 via-purple-400 to-orange-400">
              Visual Guide: Element, Compound, Mixture
            </h1>
            <p className="text-slate-400 text-sm md:text-base max-w-2xl mx-auto leading-relaxed">
              Analyze the particulate diagrams below. Drag and drop each discrete bounding box into the correct classification bin based on its molecular composition.
            </p>
          </header>

          {/* Main Game Area */}
          <div className="w-full max-w-6xl flex flex-col gap-8">
            
            {/* Drop Bins */}
            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              
              {/* Element Bin */}
              <div 
                onDragOver={handleDragOver} 
                onDrop={(e) => handleDrop(e, 'element')}
                className="flex flex-col bg-slate-800/50 rounded-2xl border-2 border-cyan-500/30 overflow-hidden shadow-lg transition-colors hover:border-cyan-400"
              >
                <div className="bg-cyan-900/40 p-3 border-b border-cyan-500/30 flex justify-between items-center">
                  <h2 className="text-cyan-300 font-bold uppercase tracking-widest flex items-center gap-2">
                    <div className="w-3 h-3 rounded-full bg-cyan-400"></div> Elements
                  </h2>
                  <span className="text-xs text-cyan-200/50 font-mono">{bins.element.length} items</span>
                </div>
                <div className="p-4 min-h-[160px] flex flex-wrap gap-3 content-start">
                  {bins.element.length === 0 && <p className="text-slate-500 text-sm italic w-full text-center mt-8">Drag elements here</p>}
                  {bins.element.map(item => (
                    <div key={item.id} className="w-16 h-16 rounded-lg bg-slate-900 border border-cyan-500/50 p-1 relative group">
                      <div className="w-full h-full pointer-events-none">
                        {item.render()}
                      </div>
                      <div className="absolute -bottom-8 left-1/2 -translate-x-1/2 bg-slate-800 text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap z-10 pointer-events-none shadow-lg">
                        {item.name}
                      </div>
                    </div>
                  ))}
                </div>
                <div className="bg-slate-900/50 p-3 text-xs text-slate-400 border-t border-slate-700/50">
                  Only ONE type of atom present. Can be monoatomic or molecular.
                </div>
              </div>

              {/* Compound Bin */}
              <div 
                onDragOver={handleDragOver} 
                onDrop={(e) => handleDrop(e, 'compound')}
                className="flex flex-col bg-slate-800/50 rounded-2xl border-2 border-purple-500/30 overflow-hidden shadow-lg transition-colors hover:border-purple-400"
              >
                <div className="bg-purple-900/40 p-3 border-b border-purple-500/30 flex justify-between items-center">
                  <h2 className="text-purple-300 font-bold uppercase tracking-widest flex items-center gap-2">
                    <div className="w-3 h-3 rounded-full bg-purple-400"></div> Compounds
                  </h2>
                  <span className="text-xs text-purple-200/50 font-mono">{bins.compound.length} items</span>
                </div>
                <div className="p-4 min-h-[160px] flex flex-wrap gap-3 content-start">
                  {bins.compound.length === 0 && <p className="text-slate-500 text-sm italic w-full text-center mt-8">Drag compounds here</p>}
                  {bins.compound.map(item => (
                    <div key={item.id} className="w-16 h-16 rounded-lg bg-slate-900 border border-purple-500/50 p-1 relative group">
                      <div className="w-full h-full pointer-events-none">
                        {item.render()}
                      </div>
                      <div className="absolute -bottom-8 left-1/2 -translate-x-1/2 bg-slate-800 text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap z-10 pointer-events-none shadow-lg">
                        {item.name}
                      </div>
                    </div>
                  ))}
                </div>
                <div className="bg-slate-900/50 p-3 text-xs text-slate-400 border-t border-slate-700/50">
                  TWO or more types of atoms chemically bonded in a fixed ratio.
                </div>
              </div>

              {/* Mixture Bin */}
              <div 
                onDragOver={handleDragOver} 
                onDrop={(e) => handleDrop(e, 'mixture')}
                className="flex flex-col bg-slate-800/50 rounded-2xl border-2 border-orange-500/30 overflow-hidden shadow-lg transition-colors hover:border-orange-400"
              >
                <div className="bg-orange-900/40 p-3 border-b border-orange-500/30 flex justify-between items-center">
                  <h2 className="text-orange-300 font-bold uppercase tracking-widest flex items-center gap-2">
                    <div className="w-3 h-3 rounded-full bg-orange-400"></div> Mixtures
                  </h2>
                  <span className="text-xs text-orange-200/50 font-mono">{bins.mixture.length} items</span>
                </div>
                <div className="p-4 min-h-[160px] flex flex-wrap gap-3 content-start">
                  {bins.mixture.length === 0 && <p className="text-slate-500 text-sm italic w-full text-center mt-8">Drag mixtures here</p>}
                  {bins.mixture.map(item => (
                    <div key={item.id} className="w-16 h-16 rounded-lg bg-slate-900 border border-orange-500/50 p-1 relative group">
                      <div className="w-full h-full pointer-events-none">
                        {item.render()}
                      </div>
                      <div className="absolute -bottom-8 left-1/2 -translate-x-1/2 bg-slate-800 text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap z-10 pointer-events-none shadow-lg">
                        {item.name}
                      </div>
                    </div>
                  ))}
                </div>
                <div className="bg-slate-900/50 p-3 text-xs text-slate-400 border-t border-slate-700/50">
                  Multiple pure substances physically combined, not chemically bonded.
                </div>
              </div>

            </div>

            {/* Feedback Bar */}
            <div className="h-12 flex justify-center items-center">
              {feedback && (
                <div className={`flex items-center gap-2 px-6 py-2 rounded-full font-semibold animate-bounce shadow-lg ${feedback.type === 'success' ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/50' : 'bg-red-500/20 text-red-300 border border-red-500/50'}`}>
                  {feedback.type === 'success' ? <CheckCircle2 size={18} /> : <XCircle size={18} />}
                  {feedback.message}
                </div>
              )}
            </div>

            {/* Item Pool / Conveyor Belt */}
            <div className="bg-slate-800/80 rounded-2xl p-6 border border-slate-700 shadow-2xl relative min-h-[220px]">
              
              <div className="flex justify-between items-end mb-4 border-b border-slate-700 pb-2">
                <h3 className="text-slate-300 font-semibold uppercase tracking-widest flex items-center gap-2">
                  <GripHorizontal className="text-slate-500" size={18} />
                  Sorting Pool
                </h3>
                <span className="text-slate-500 font-mono text-sm">Remaining: {pool.length}</span>
              </div>

              {!isComplete ? (
                <div className="flex flex-wrap gap-4 justify-center">
                  {pool.map((item) => (
                    <div
                      key={item.id}
                      draggable
                      onDragStart={(e) => handleDragStart(e, item, 'pool')}
                      className="w-28 flex flex-col items-center gap-2 cursor-grab active:cursor-grabbing bg-slate-900 rounded-xl p-3 border border-slate-600 hover:border-blue-400 hover:shadow-[0_0_15px_rgba(96,165,250,0.4)] transition-all transform hover:-translate-y-1"
                    >
                      <div className="w-20 h-20 bg-slate-950 rounded-lg border border-slate-800 overflow-hidden flex items-center justify-center p-1 pointer-events-none">
                        {item.render()}
                      </div>
                      <span className="text-xs text-center text-slate-300 font-medium leading-tight select-none pointer-events-none">
                        {item.name}
                      </span>
                    </div>
                  ))}
                </div>
              ) : (
                <div className="flex flex-col items-center justify-center py-6 animate-pulse">
                  <CheckCircle2 size={48} className="text-emerald-400 mb-2" />
                  <h2 className="text-2xl font-bold text-white tracking-wide">Classification Complete!</h2>
                  <p className="text-emerald-300 text-sm mt-1">Perfect score: {score}/{INITIAL_ITEMS.length}</p>
                </div>
              )}

              {/* Reset Button */}
              <div className="absolute -top-5 right-6">
                <button 
                  onClick={resetGame}
                  className="bg-slate-700 hover:bg-slate-600 text-white p-3 rounded-full shadow-lg border border-slate-500 transition-transform hover:rotate-180 duration-500"
                  title="Reset Engine"
                >
                  <RefreshCcw size={20} />
                </button>
              </div>
            </div>

            {/* Legend / Info Footer */}
            <div className="flex items-start gap-3 bg-slate-900/50 p-4 rounded-xl border border-slate-800 max-w-3xl mx-auto">
              <Info className="text-blue-400 shrink-0 mt-0.5" size={20} />
              <p className="text-xs text-slate-400 leading-relaxed">
                <strong className="text-slate-300">Pedagogical Key:</strong> This engine uses visual bounding boxes. 
                Identical spheres (atoms) bonded or unbonded represent <span className="text-cyan-300 font-semibold">Elements</span>. 
                Multi-colored spheres chemically bonded in identical arrangements represent <span className="text-purple-300 font-semibold">Compounds</span>. 
                A randomized mix of different elements and/or compounds in the same box represents a <span className="text-orange-300 font-semibold">Mixture</span>.
              </p>
            </div>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
