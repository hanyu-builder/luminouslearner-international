            // Visual detachment logic for Lanthanides & Actinides
            if (z >= 57 && z <= 71) { displayRow = 9; displayCol = z - 57 + 4; }
            if (z >= 89 && z <= 103) { displayRow = 10; displayCol = z - 89 + 4; }

            let stpShort = '(s)';

            const liquidZ = [35, 80];

            const isElementActive = (el) => {
                if (!activeFilter) return true;
                if (activeFilter.type === 'category') return el.cat === activeFilter.value;
                if (activeFilter.type === 'block') return el.block === activeFilter.value;
                if (activeFilter.type === 'group') return el.group === activeFilter.value;
                return true;
            };

            return (
                <div className="h-screen bg-[#020617] text-slate-200 font-sans selection:bg-blue-500/30 flex flex-col overflow-hidden">
                    
                    {/* Header & Controls */}
                    <header className="p-3 md:p-4 border-b border-slate-800 bg-slate-900 shadow-md flex flex-col lg:flex-row justify-between items-center gap-4 shrink-0 z-20">
                        <div className="text-center lg:text-left">
                            <h1 className="text-xl md:text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 tracking-tight">
                                Interactive Periodic Table of Elements
                            </h1>
                            <p className="text-xs text-slate-400 font-mono mt-0.5">Array Database & Quantum Block Visualizer</p>
                        </div>
                        
                        {/* Toggle Switches / Filters */}
                        <div className="flex flex-wrap gap-2 justify-center lg:justify-end max-w-4xl">
                            <FilterButton label="Alkali Metals" active={activeFilter?.value === 'alkali-metal'} onClick={() => handleFilter('category', 'alkali-metal')} colorClass="text-red-400 bg-red-900/20 border-red-800/50 hover:border-red-500" />
                            <FilterButton label="Halogens" active={activeFilter?.value === 'halogen'} onClick={() => handleFilter('category', 'halogen')} colorClass="text-indigo-400 bg-indigo-900/20 border-indigo-800/50 hover:border-indigo-500" />
                            <FilterButton label="Transition Metals" active={activeFilter?.value === 'transition-metal'} onClick={() => handleFilter('category', 'transition-metal')} colorClass="text-yellow-400 bg-yellow-900/20 border-yellow-800/50 hover:border-yellow-500" />
                            
                            <div className="w-px h-6 bg-slate-700 mx-1 hidden sm:block"></div>
                            
                            <FilterButton label="s-block" active={activeFilter?.value === 's'} onClick={() => handleFilter('block', 's')} colorClass="text-sky-300 bg-sky-900/20 border-sky-800/50 hover:border-sky-500" />
                            <FilterButton label="p-block" active={activeFilter?.value === 'p'} onClick={() => handleFilter('block', 'p')} colorClass="text-sky-300 bg-sky-900/20 border-sky-800/50 hover:border-sky-500" />
                            <FilterButton label="d-block" active={activeFilter?.value === 'd'} onClick={() => handleFilter('block', 'd')} colorClass="text-sky-300 bg-sky-900/20 border-sky-800/50 hover:border-sky-500" />
                            <FilterButton label="f-block" active={activeFilter?.value === 'f'} onClick={() => handleFilter('block', 'f')} colorClass="text-sky-300 bg-sky-900/20 border-sky-800/50 hover:border-sky-500" />
                            
                            {activeFilter && (
                                <button onClick={() => setActiveFilter(null)} className="px-3 py-1 text-xs font-bold rounded-full bg-slate-700 text-white hover:bg-slate-600 transition-colors ml-1 shadow-sm">
                                    Clear Filters
                                </button>
                            )}
                        </div>
                    </header>

                    {/* Main Table Area (Scrollable to prevent crushing on small screens) */}
                    <main className="flex-1 overflow-x-auto overflow-y-hidden custom-scroll p-4 md:p-6 flex items-center justify-start md:justify-center relative bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-slate-900 to-[#020617]">
                        
                        {/* CSS Grid for Periodic Table (18 columns) */}
                        <div className="grid grid-cols-18 gap-[3px] md:gap-1 lg:gap-1.5 w-full min-w-[900px] max-w-[1400px] relative pb-8">
                            
                            {/* Integrated Hover Display Panel */}
                            <div className="col-start-3 col-end-13 row-start-1 row-end-4 p-4 md:p-6 m-1 md:m-2 bg-slate-800/60 border border-slate-600/50 rounded-2xl backdrop-blur-md shadow-2xl flex gap-5 z-0 items-center transition-all duration-300">
                                {/* Huge Element Symbol */}
                                <div className={`w-24 h-24 md:w-32 md:h-32 shrink-0 rounded-2xl flex flex-col items-center justify-center border-2 shadow-inner ${CAT_STYLES[hoveredElement.cat].bg} ${CAT_STYLES[hoveredElement.cat].border}`}>
                                    <span className="text-slate-400 font-mono text-sm absolute top-2 left-3 font-bold">{hoveredElement.z}</span>
                                    <span className={`text-5xl md:text-6xl font-bold font-mono ${CAT_STYLES[hoveredElement.cat].text}`}>
                                        {hoveredElement.sym}
                                    </span>
                                </div>
                                
                                {/* Detailed Data */}
                                <div className="flex-1 flex flex-col justify-center">
                                    <div className="mb-3">
                                        <div className="flex items-baseline gap-3 mb-1">
                                            <h2 className="text-2xl md:text-3xl font-bold text-white tracking-tight">{hoveredElement.name}</h2>
                                            <span className="text-sm font-mono text-slate-400 font-semibold">{hoveredElement.stpState} {hoveredElement.stpShort}</span>
                                        </div>
                                        <span className={`inline-block px-2.5 py-0.5 text-[10px] md:text-xs font-bold rounded uppercase tracking-widest shadow-sm ${CAT_STYLES[hoveredElement.cat].bg} ${CAT_STYLES[hoveredElement.cat].text} border ${CAT_STYLES[hoveredElement.cat].border}`}>
                                            {hoveredElement.cat.replace('-', ' ')}
                                        </span>
                                    </div>
                                    
                                    <div className="grid grid-cols-2 md:grid-cols-3 gap-x-4 gap-y-3 font-mono text-xs md:text-sm">
                                        <div className="bg-slate-900/50 p-2 rounded border border-slate-700/50">
                                            <span className="text-slate-500 block text-[10px] uppercase tracking-wider mb-0.5">Atomic Mass</span>
                                            <span className="text-slate-200 font-bold">{hoveredElement.mass} amu</span>
                                        </div>
                                        <div className="bg-slate-900/50 p-2 rounded border border-slate-700/50">
                                            <span className="text-slate-500 block text-[10px] uppercase tracking-wider mb-0.5">Atomic Radius</span>
                                            <span className="text-slate-200 font-bold">{hoveredElement.radius} {hoveredElement.radius !== 'N/A' && 'pm'}</span>
                                        </div>
                                        <div className="bg-slate-900/50 p-2 rounded border border-slate-700/50">
                                            <span className="text-slate-500 block text-[10px] uppercase tracking-wider mb-0.5">Electronegativity</span>
                                            <span className="text-slate-200 font-bold">{hoveredElement.en}</span>
                                        </div>
                                        <div className="col-span-2 md:col-span-3 bg-slate-900/80 p-2.5 rounded border border-slate-600/50 flex justify-between items-center mt-1 shadow-inner">
                                            <div>
                                                <span className="text-slate-500 block text-[10px] uppercase tracking-wider mb-0.5">Electronic Configuration</span>
                                                <span className="text-sky-300 font-bold text-sm">{hoveredElement.config}</span>
                                            </div>
                                            <div className="text-right">
                                                <span className="text-slate-500 block text-[10px] uppercase tracking-wider mb-0.5">Quantum Block</span>
                                                <span className="text-white font-bold uppercase">{hoveredElement.block}-block</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Render All Elements */}
                            {elements.map((el) => {
                                const active = isElementActive(el);
                                const isHovered = hoveredZ === el.z;
                                const style = CAT_STYLES[el.cat] || CAT_STYLES['unknown'];

                                return (
                                    <div
                                        key={el.z}
                                        onMouseEnter={() => setHoveredZ(el.z)}
                                        className={`
                                            relative group cursor-pointer rounded border element-card
                                            flex flex-col items-center justify-center p-1 aspect-square
                                            ${style.bg} ${style.border}
                                            ${active ? 'opacity-100 hover:scale-125 hover:z-20 hover:shadow-[0_0_20px_rgba(255,255,255,0.2)]' : 'opacity-15 grayscale pointer-events-none'}
                                            ${isHovered ? 'ring-2 ring-white scale-110 z-10 shadow-lg' : ''}
                                        `}
                                        style={{
                                            gridColumnStart: el.displayCol,
                                            gridRowStart: el.displayRow,
                                        }}
                                    >
                                        <span className={`absolute top-0.5 left-1 text-[8px] md:text-[9px] font-mono font-bold leading-none transition-colors ${isHovered ? 'text-white' : 'text-slate-400'}`}>
                                            {el.z}
                                        </span>
                                        <span className={`text-[13px] md:text-base lg:text-lg font-bold font-mono mt-2 leading-none transition-colors ${isHovered ? 'text-white drop-shadow-md' : style.text}`}>
                                            {el.sym}
                                        </span>
                                        <span className={`hidden md:block text-[7px] lg:text-[9px] truncate w-full text-center mt-1 leading-tight transition-colors px-0.5 ${isHovered ? 'text-slate-200' : 'text-slate-500'}`}>
                                            {el.name}
                                        </span>
                                    </div>
                                );
                            })}

                            {/* Lanthanide / Actinide Gap Indicators (Visual Only) */}
                            <div className="col-start-3 row-start-6 flex items-center justify-center text-[10px] md:text-xs font-mono text-pink-500/60 border border-dashed border-pink-500/40 rounded aspect-square bg-pink-900/10">
                                57-71
                            </div>
                            <div className="col-start-3 row-start-7 flex items-center justify-center text-[10px] md:text-xs font-mono text-rose-500/60 border border-dashed border-rose-500/40 rounded aspect-square bg-rose-900/10">
                                89-103
                            </div>

                        </div>
                    </main>
                </div>
            );
        }

        // Reusable Filter Button Component
        function FilterButton({ label, active, onClick, colorClass }) {
            return (
                <button
                    onClick={onClick}
                    className={`
                        px-3 py-1.5 text-xs font-bold rounded-full border transition-all duration-300
                        ${colorClass}
                        ${active ? 'ring-2 ring-white scale-105 shadow-[0_0_15px_rgba(255,255,255,0.15)] opacity-100' : 'opacity-60 hover:opacity-100 hover:scale-105 hover:shadow-md'}
                    `}
                >
                    {label}
                </button>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
