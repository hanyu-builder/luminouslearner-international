<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formula Mass Calculator</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        /* Subtle pulse for valid inputs */
        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 15px rgba(20, 184, 166, 0.1); }
            50% { box-shadow: 0 0 25px rgba(20, 184, 166, 0.3); }
        }
        .valid-glow { animation: glowPulse 2s infinite; }
    </style>
</head>
<body class="bg-[#0F172A] m-0 p-0 overflow-hidden text-slate-100 font-sans">
    
    <!-- Primary SEO Keyword -->
    <span class="hidden">Formula mass calculator online</span>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        // --- SCIENTIFIC DATABASE: ATOMIC MASSES ---
        const ATOMIC_MASSES = {
            "H": 1.008, "He": 4.0026, "Li": 6.94, "Be": 9.0122, "B": 10.81, "C": 12.011, "N": 14.007, "O": 15.999, "F": 18.998, "Ne": 20.180,
            "Na": 22.990, "Mg": 24.305, "Al": 26.982, "Si": 28.085, "P": 30.974, "S": 32.06, "Cl": 35.45, "Ar": 39.95, "K": 39.098, "Ca": 40.078,
            "Sc": 44.956, "Ti": 47.867, "V": 50.942, "Cr": 51.996, "Mn": 54.938, "Fe": 55.845, "Co": 58.933, "Ni": 58.693, "Cu": 63.546, "Zn": 65.38,
            "Ga": 69.723, "Ge": 72.63, "As": 74.922, "Se": 78.971, "Br": 79.904, "Kr": 83.798, "Rb": 85.468, "Sr": 87.62, "Y": 88.906, "Zr": 91.224,
            "Nb": 92.906, "Mo": 95.95, "Tc": 98, "Ru": 101.07, "Rh": 102.91, "Pd": 106.42, "Ag": 107.87, "Cd": 112.41, "In": 114.82, "Sn": 118.71,
            "Sb": 121.76, "Te": 127.60, "I": 126.90, "Xe": 131.29, "Cs": 132.91, "Ba": 137.33, "La": 138.91, "Ce": 140.12, "Pr": 140.91, "Nd": 144.24,
            "Pm": 145, "Sm": 150.36, "Eu": 151.96, "Gd": 157.25, "Tb": 158.93, "Dy": 162.50, "Ho": 164.93, "Er": 167.26, "Tm": 168.93, "Yb": 173.05, "Lu": 174.97,
            "Hf": 178.49, "Ta": 180.95, "W": 183.84, "Re": 186.21, "Os": 190.23, "Ir": 192.22, "Pt": 195.08, "Au": 196.97, "Hg": 200.59, "Tl": 204.38,
            "Pb": 207.2, "Bi": 208.98, "Po": 209, "At": 210, "Rn": 222, "Fr": 223, "Ra": 226, "Ac": 227, "Th": 232.04, "Pa": 231.04, "U": 238.03
        };

        // Categorized examples covering highly-tested exam compounds
        const CATEGORIZED_EXAMPLES = [
            {
                category: "Common Acids & Bases",
                items: [
                    { formula: 'HCl', name: 'Hydrochloric Acid' },
                    { formula: 'H2SO4', name: 'Sulfuric Acid' },
                    { formula: 'HNO3', name: 'Nitric Acid' },
                    { formula: 'NaOH', name: 'Sodium Hydroxide' },
                    { formula: 'NH3', name: 'Ammonia' }
                ]
            },
            {
                category: "Important Salts & Hydrates",
                items: [
                    { formula: 'NaCl', name: 'Sodium Chloride' },
                    { formula: 'CaCO3', name: 'Calcium Carbonate' },
                    { formula: 'KMnO4', name: 'Potassium Permanganate' },
                    { formula: 'AgNO3', name: 'Silver Nitrate' },
                    { formula: 'CuSO4.5H2O', name: 'Copper(II) Sulfate Pentahydrate' },
                    { formula: 'Na2CO3.10H2O', name: 'Washing Soda' }
                ]
            },
            {
                category: "Organic Compounds",
                items: [
                    { formula: 'CH4', name: 'Methane' },
                    { formula: 'C2H5OH', name: 'Ethanol' },
                    { formula: 'C6H12O6', name: 'Glucose' },
                    { formula: 'CH3COOH', name: 'Ethanoic Acid' },
                    { formula: 'C8H18', name: 'Octane' }
                ]
            },
            {
                category: "Gases & Others",
                items: [
                    { formula: 'H2O', name: 'Water' },
                    { formula: 'CO2', name: 'Carbon Dioxide' },
                    { formula: 'O2', name: 'Oxygen Gas' },
                    { formula: 'H2O2', name: 'Hydrogen Peroxide' }
                ]
            }
        ];

        // Unique colors for visual breakdown
        const ELEMENT_COLORS = {
            "H": "#F8FAFC", "C": "#475569", "O": "#EF4444", "N": "#3B82F6", 
            "S": "#EAB308", "Cl": "#10B981", "Na": "#A855F7", "Ca": "#F97316",
            "K": "#D946EF", "Fe": "#78716C", "Cu": "#0EA5E9", "Mg": "#94A3B8",
            "Ag": "#E2E8F0", "Al": "#CBD5E1", "P": "#F59E0B", "Mn": "#C084FC"
        };
        const DEFAULT_COLOR = "#0EA5E9";

        // --- CORE PARSER ALGORITHM (Upgraded to support Hydrates) ---
        function parseFormula(formula) {
            // Split by dot or asterisk to isolate hydrated water molecules (e.g. CuSO4.5H2O)
            const parts = formula.split(/[\.\*]/);
            let finalCounts = {};
            let finalError = null;

            for (let p = 0; p < parts.length; p++) {
                let part = parts[p];
                if (!part) continue;

                let globalMultiplier = 1;
                // If it's a hydrate part (p > 0), it might start with a main coefficient
                if (p > 0) {
                    let m = part.match(/^[0-9]+/);
                    if (m) {
                        globalMultiplier = parseInt(m[0]);
                        part = part.substring(m[0].length);
                    }
                }

                let i = 0;
                function parseGroup() {
                    let counts = {};
                    while (i < part.length && part[i] !== ')') {
                        if (part[i] === '(') {
                            i++;
                            let groupCounts = parseGroup();
                            if (i >= part.length || part[i] !== ')') {
                                finalError = "Missing closing parenthesis ')'.";
                                return counts;
                            }
                            i++; // skip ')'
                            let multi = 0;
                            while (i < part.length && /[0-9]/.test(part[i])) {
                                multi = multi * 10 + parseInt(part[i]);
                                i++;
                            }
                            multi = multi === 0 ? 1 : multi;
                            
                            // Multiply inner group counts
                            for (let el in groupCounts) {
                                counts[el] = (counts[el] || 0) + groupCounts[el] * multi;
                            }
                        } else {
                            // Match Element (Uppercase + optional lowercase)
                            let match = part.substring(i).match(/^([A-Z][a-z]?)/);
                            if (!match) {
                                if (part[i] !== ' ') finalError = `Invalid character '${part[i]}' at position ${i + 1}.`;
                                i++;
                                continue;
                            }
                            let el = match[1];
                            if (!ATOMIC_MASSES[el]) {
                                finalError = `Unknown element '${el}'.`;
                            }
                            i += el.length;
                            
                            // Match Subscript Number
                            let multi = 0;
                            while (i < part.length && /[0-9]/.test(part[i])) {
                                multi = multi * 10 + parseInt(part[i]);
                                i++;
                            }
                            multi = multi === 0 ? 1 : multi;
                            counts[el] = (counts[el] || 0) + multi;
                        }
                    }
                    return counts;
                }

                const partCounts = parseGroup();
                if (i < part.length && part[i] === ')') {
                    finalError = "Unmatched closing parenthesis ')'.";
                }

                // Merge partCounts into finalCounts applying the hydrate globalMultiplier
                for (let el in partCounts) {
                    finalCounts[el] = (finalCounts[el] || 0) + partCounts[el] * globalMultiplier;
                }
            }

            return { counts: finalCounts, error: finalError };
        }

        // Helper to render formula with subscripts and hydrate dots nicely
        function renderFormattedFormula(formulaStr) {
            if (!formulaStr) return <span className="text-slate-500">Enter a formula...</span>;
            const parts = [];
            let currentStr = "";
            let isHydrateCoeff = false;

            for (let i = 0; i < formulaStr.length; i++) {
                const char = formulaStr[i];
                if (char === '.' || char === '*') {
                    if (currentStr) parts.push(<span key={i + 's'}>{currentStr}</span>);
                    parts.push(<span key={i} className="mx-1 font-black text-teal-400">·</span>);
                    currentStr = "";
                    isHydrateCoeff = true; // Numbers immediately following a dot are coefficients, not subscripts
                } else if (/[0-9]/.test(char)) {
                    if (isHydrateCoeff) {
                        currentStr += char; 
                    } else {
                        if (currentStr) parts.push(<span key={i + 's'}>{currentStr}</span>);
                        parts.push(<sub key={i} className="text-[0.7em] leading-none opacity-80">{char}</sub>);
                        currentStr = "";
                    }
                } else {
                    isHydrateCoeff = false; 
                    currentStr += char;
                }
            }
            if (currentStr) parts.push(<span key="end">{currentStr}</span>);
            return <>{parts}</>;
        }

        function App() {
            const [formulaInput, setFormulaInput] = useState("CuSO4.5H2O");

            // Compute data every time input changes
            const engineResult = useMemo(() => {
                const cleanInput = formulaInput.replace(/\s+/g, '');
                if (!cleanInput) return { counts: {}, totalMass: 0, elements: [], error: null };

                const { counts, error } = parseFormula(cleanInput);
                
                let totalMass = 0;
                let elements = [];

                for (let el in counts) {
                    const qty = counts[el];
                    const atomicMass = ATOMIC_MASSES[el] || 0;
                    const subtotal = qty * atomicMass;
                    totalMass += subtotal;
                    
                    elements.push({
                        symbol: el,
                        quantity: qty,
                        atomicMass: atomicMass,
                        subtotal: subtotal,
                        color: ELEMENT_COLORS[el] || DEFAULT_COLOR,
                        percent: 0 // Calculated below
                    });
                }

                // Calculate mass percentages
                if (totalMass > 0) {
                    elements.forEach(el => {
                        el.percent = (el.subtotal / totalMass) * 100;
                    });
                }

                // Sort elements by mass contribution
                elements.sort((a, b) => b.subtotal - a.subtotal);

                return { counts, totalMass, elements, error };
            }, [formulaInput]);

            return (
                <div className="flex flex-col h-screen w-full select-none">
                    
                    {/* HEADER */}
                    <header className="h-[10%] min-h-[70px] bg-[#1E293B] border-b border-slate-700 flex items-center justify-between px-8 shadow-md z-20 shrink-0">
                        <div>
                            <h1 className="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-teal-400 to-indigo-400 flex items-center gap-2">
                                🔢 Formula Mass Calculator
                            </h1>
                            <p className="text-xs text-slate-400 mt-1 font-mono">Real-time Molecular Weight & Composition Analyzer</p>
                        </div>
                    </header>

                    {/* MAIN CONTENT AREA */}
                    <main className="flex-1 flex w-full h-[90%] p-4 gap-4 min-h-0">
                        
                        {/* LEFT PANEL: INPUT & EXAMPLES */}
                        <section className="w-1/2 flex flex-col gap-4">
                            
                            {/* Smart Input Box */}
                            <div className={`bg-[#1E293B] rounded-xl border-2 p-6 shadow-xl shrink-0 transition-colors duration-300 ${engineResult.error ? 'border-red-500/50' : engineResult.totalMass > 0 ? 'border-teal-500/50 valid-glow' : 'border-slate-700'}`}>
                                <h2 className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Chemical Formula Input</h2>
                                
                                <input 
                                    type="text" 
                                    value={formulaInput}
                                    onChange={(e) => setFormulaInput(e.target.value)}
                                    placeholder="e.g. C6H12O6 or CuSO4.5H2O"
                                    className="w-full bg-slate-900 border border-slate-600 rounded-lg p-4 text-3xl font-mono text-white focus:border-teal-500 outline-none transition-colors"
                                    spellCheck="false"
                                />

                                {/* Formatted Display & Error */}
                                <div className="mt-4 h-8 flex items-center justify-between">
                                    <div className="text-2xl font-bold text-teal-300 tracking-wider font-mono">
                                        {renderFormattedFormula(formulaInput)}
                                    </div>
                                    {engineResult.error && (
                                        <div className="text-red-400 text-sm font-bold flex items-center gap-2 bg-red-900/20 px-3 py-1 rounded">
                                            <span>⚠️</span> {engineResult.error}
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* Categorized Examples Catalog */}
                            <div className="flex-1 bg-[#1E293B] rounded-xl border border-slate-700 shadow-lg flex flex-col min-h-0 overflow-hidden">
                                <div className="p-4 border-b border-slate-700 bg-slate-800/50 shrink-0">
                                    <h2 className="text-xs font-bold text-slate-400 uppercase tracking-widest">Common Exam Formulas Catalog</h2>
                                </div>
                                
                                <div className="flex-1 overflow-y-auto custom-scrollbar p-4 flex flex-col gap-6">
                                    {CATEGORIZED_EXAMPLES.map((category, cIdx) => (
                                        <div key={cIdx}>
                                            <h3 className="text-[10px] text-teal-500 font-bold uppercase tracking-widest mb-3 border-b border-slate-700/50 pb-1">
                                                {category.category}
                                            </h3>
                                            <div className="flex flex-wrap gap-2">
                                                {category.items.map((ex, idx) => (
                                                    <button
                                                        key={idx}
                                                        onClick={() => setFormulaInput(ex.formula)}
                                                        className="bg-slate-800 hover:bg-slate-700 border border-slate-600 px-3 py-2 rounded-lg flex flex-col items-start transition-all hover:-translate-y-0.5 hover:shadow-lg hover:border-teal-500/50"
                                                    >
                                                        <span className="font-mono text-base font-bold text-slate-200">{renderFormattedFormula(ex.formula)}</span>
                                                        <span className="text-[9px] text-slate-400 uppercase tracking-wider mt-1">{ex.name}</span>
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                        </section>

                        {/* RIGHT PANEL: ARITHMETIC ENGINE & BREAKDOWN */}
                        <section className="w-1/2 flex flex-col gap-4">
                            
                            {/* Total Mass Output */}
                            <div className="bg-gradient-to-br from-slate-800 to-slate-900 rounded-xl border border-teal-500/30 p-8 shadow-lg flex flex-col items-center justify-center relative overflow-hidden shrink-0">
                                <div className="absolute top-0 right-0 w-48 h-48 bg-teal-500/10 rounded-full blur-3xl pointer-events-none"></div>
                                
                                <h2 className="text-sm font-bold text-teal-400 uppercase tracking-widest mb-2 z-10">Total Formula Mass (Molar Mass)</h2>
                                <div className="flex items-baseline gap-3 z-10">
                                    <span className="text-6xl font-black text-white drop-shadow-md tracking-tighter">
                                        {engineResult.totalMass > 0 ? engineResult.totalMass.toFixed(3) : "0.000"}
                                    </span>
                                    <span className="text-xl text-slate-400 font-bold">g/mol</span>
                                </div>
                            </div>

                            {/* Constituent Breakdown Table */}
                            <div className="flex-1 bg-[#1A2235] rounded-xl border border-slate-700 shadow-inner p-6 flex flex-col overflow-hidden min-h-0">
                                <h2 className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4 flex justify-between shrink-0">
                                    <span>Arithmetic Breakdown</span>
                                    <span>Element • Mass × Qty = Subtotal</span>
                                </h2>

                                {engineResult.elements.length === 0 ? (
                                    <div className="flex-1 flex items-center justify-center text-slate-600 font-mono italic">
                                        Waiting for valid formula input...
                                    </div>
                                ) : (
                                    <div className="flex-1 overflow-y-auto custom-scrollbar pr-2 flex flex-col gap-3">
                                        {engineResult.elements.map((el, idx) => (
                                            <div key={idx} className="bg-slate-800/80 border border-slate-700 rounded-lg p-4 flex flex-col relative overflow-hidden group hover:bg-slate-800 transition-colors shrink-0">
                                                
                                                {/* Background Percentage Bar */}
                                                <div 
                                                    className="absolute top-0 left-0 bottom-0 opacity-10 transition-all duration-700"
                                                    style={{ width: `${el.percent}%`, backgroundColor: el.color }}
                                                ></div>

                                                <div className="flex justify-between items-center relative z-10">
                                                    <div className="flex items-center gap-4">
                                                        <div 
                                                            className="w-12 h-12 rounded flex items-center justify-center text-2xl font-black text-white shadow-inner"
                                                            style={{ backgroundColor: el.color }}
                                                        >
                                                            {el.symbol}
                                                        </div>
                                                        <div className="flex flex-col">
                                                            <span className="text-sm text-slate-400">Atomic Mass</span>
                                                            <span className="font-mono text-lg font-bold text-slate-200">{el.atomicMass.toFixed(3)}</span>
                                                        </div>
                                                    </div>

                                                    <div className="flex items-center gap-4 md:gap-6">
                                                        <div className="text-slate-500 font-black text-xl">×</div>
                                                        <div className="flex flex-col items-center">
                                                            <span className="text-sm text-slate-400">Quantity</span>
                                                            <span className="font-mono text-xl font-bold text-white">{el.quantity}</span>
                                                        </div>
                                                        <div className="text-slate-500 font-black text-xl">=</div>
                                                        <div className="flex flex-col items-end min-w-[100px]">
                                                            <span className="text-sm text-slate-400">Subtotal</span>
                                                            <span className="font-mono text-xl font-bold" style={{ color: el.color }}>{el.subtotal.toFixed(3)}</span>
                                                        </div>
                                                    </div>
                                                </div>

                                                {/* Visual Composition Hint */}
                                                <div className="w-full flex justify-end mt-2 relative z-10">
                                                    <span className="text-[10px] uppercase font-bold text-slate-500 tracking-wider">
                                                        {el.percent.toFixed(1)}% of total mass
                                                    </span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>

                        </section>

                    </main>
                </div>
            );
        }

        // Initialize React
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
