<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Period 3 & 4 Oxides Acid Base Properties | Chemistry Simulator</title>
    <meta name="description" content="Explore period 3 and 4 oxides acid base properties. Interactive simulator illustrating the transition from basic ionic lattices to acidic covalent molecules.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: { 850: '#151e2e', 900: '#0F172A', 950: '#020617' },
                        oxide: {
                            basic: '#8B5CF6',    // Violet
                            ampho: '#10B981',    // Emerald
                            acidic: '#F43F5E',   // Rose
                            neutral: '#38BDF8'   // Sky
                        }
                    }
                }
            }
        }
    </script>

    <!-- p5.js for Visual Canvas & Animation Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    
    <!-- Chart.js for Trend Analysis -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { margin: 0; background-color: #020617; font-family: 'Inter', sans-serif; overflow: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .bg-grid {
            background-image: radial-gradient(circle at 2px 2px, rgba(30, 41, 59, 0.4) 1px, transparent 0);
            background-size: 30px 30px;
        }

        /* Active Oxide Button Styling */
        .oxide-btn.active {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255,255,255,0.2);
            border-color: #F8FAFC;
        }

        /* Digital Font for pH Meter */
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        .font-digital { font-family: 'Share Tech Mono', monospace; }
    </style>
</head>
<body class="text-slate-200 selection:bg-rose-500 selection:text-white min-h-screen bg-grid flex items-center justify-center p-4 md:p-8">

    <div id="root" class="w-full h-full max-w-7xl max-h-[900px] flex flex-col md:flex-row rounded-3xl overflow-hidden shadow-2xl border border-slate-800 bg-slate-950">
        
        <!-- Left Panel: Timeline & Information -->
        <aside class="w-full md:w-[450px] lg:w-[500px] bg-slate-900 border-b md:border-b-0 md:border-r border-slate-800 flex flex-col z-20 shrink-0">
            
            <header class="p-6 border-b border-slate-800 flex items-center gap-3 shrink-0">
                <div class="p-2 bg-rose-500/20 rounded-xl text-rose-400">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m8 17 4 4 4-4"/></svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-rose-400 to-orange-400 leading-tight">
                        Oxide Properties Table
                    </h1>
                    <p class="text-xs text-slate-400 mt-1 font-mono">Period 3 & 4 Trends</p>
                </div>
            </header>

            <div class="flex flex-col flex-grow overflow-y-auto no-scrollbar p-6 space-y-6">
                
                <!-- Period Timeline selector -->
                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest flex items-center gap-2">
                            1. Select Oxide
                        </h2>
                        <!-- Period Toggle -->
                        <div class="flex bg-slate-950 rounded-lg p-1 border border-slate-800">
                            <button id="btn-p3" class="px-3 py-1 text-[10px] font-bold uppercase rounded-md bg-slate-800 text-rose-400 transition-colors">Period 3</button>
                            <button id="btn-p4" class="px-3 py-1 text-[10px] font-bold uppercase rounded-md text-slate-500 hover:text-slate-300 transition-colors">Period 4</button>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-4 gap-2" id="oxide-grid">
                        <!-- Populated via JS -->
                    </div>
                    
                    <div class="flex justify-between items-center text-[10px] uppercase font-bold tracking-wider mt-2 px-1">
                        <span class="text-violet-400">Basic (Ionic)</span>
                        <span class="text-rose-400">Acidic (Covalent)</span>
                    </div>
                    <div class="h-1 w-full rounded-full bg-gradient-to-r from-violet-500 via-emerald-500 to-rose-500"></div>
                </div>

                <!-- Chemical Properties Data Card -->
                <div class="bg-slate-950 p-5 rounded-2xl border border-slate-800 shadow-inner flex flex-col gap-4 relative overflow-hidden transition-all duration-300 shrink-0" id="data-card">
                    <!-- Dynamic Accent Line -->
                    <div id="card-accent" class="absolute top-0 left-0 w-full h-1 bg-slate-500"></div>
                    
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-[10px] text-slate-500 uppercase tracking-widest font-bold block mb-1">Formula</span>
                            <span id="ui-formula" class="text-3xl font-bold text-white tracking-wide">Na₂O</span>
                        </div>
                        <div class="text-right">
                            <span class="text-[10px] text-slate-500 uppercase tracking-widest font-bold block mb-1">State at RTP</span>
                            <span id="ui-state" class="text-sm font-medium text-slate-300 bg-slate-800 px-2 py-1 rounded">Solid</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4 border-t border-slate-800 pt-4">
                        <div>
                            <span class="text-[10px] text-slate-500 uppercase tracking-widest font-bold block mb-1">Structure</span>
                            <span id="ui-structure" class="text-sm text-slate-200">Giant Ionic</span>
                        </div>
                        <div>
                            <span class="text-[10px] text-slate-500 uppercase tracking-widest font-bold block mb-1">Acid/Base Nature</span>
                            <span id="ui-nature" class="text-sm font-bold">Strongly Basic</span>
                        </div>
                    </div>

                    <div class="border-t border-slate-800 pt-4">
                        <span class="text-[10px] text-slate-500 uppercase tracking-widest font-bold block mb-2">Reaction with Water</span>
                        <div class="bg-slate-900 p-3 rounded-lg border border-slate-700 font-mono text-sm text-slate-300 text-center overflow-x-auto whitespace-nowrap" id="ui-equation">
                            Na₂O(s) + H₂O(l) → 2NaOH(aq)
                        </div>
                    </div>
                </div>

                <!-- Action Button -->
                <div class="mt-auto pt-2 shrink-0">
                    <button id="btn-react" class="w-full bg-gradient-to-r from-rose-600 to-orange-600 hover:from-rose-500 hover:to-orange-500 text-white font-bold py-4 rounded-xl transition-all shadow-lg active:scale-[0.98] flex items-center justify-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 3h15"/><path d="M6 3v16a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V3"/><path d="M6 14h12"/></svg>
                        Dissolve in Water
                    </button>
                    <button id="btn-reset" class="w-full mt-3 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 font-bold py-3 rounded-xl transition-all hidden">
                        Reset Beaker
                    </button>
                </div>

            </div>
        </aside>

        <!-- Right Panel: Visualizer Laboratory & Graph -->
        <main class="flex-grow relative flex flex-col bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-slate-800 to-slate-950 overflow-hidden">
            
            <!-- Top Half: p5.js Visualizer -->
            <div class="relative w-full h-[55%] shrink-0">
                <!-- Digital pH Meter Overlay -->
                <div class="absolute top-4 right-4 md:top-6 md:right-6 bg-slate-900/90 backdrop-blur-md border border-slate-700 p-4 rounded-2xl shadow-2xl z-20 w-40 border-t-4 border-t-rose-500 transition-colors duration-500" id="ph-meter-border">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">pH Meter</span>
                        <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse" id="ph-status-led"></div>
                    </div>
                    
                    <div class="bg-slate-950 border border-slate-800 rounded-xl p-2 text-center shadow-inner relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-full h-1/2 bg-white/5"></div>
                        <div class="font-digital text-3xl text-emerald-400 tracking-wider" id="ph-display">7.00</div>
                    </div>
                    
                    <div class="mt-3 flex justify-between items-center">
                        <span class="text-[9px] text-slate-500 uppercase">Indicator</span>
                        <div class="w-3 h-3 rounded-full border border-slate-600 bg-green-500 transition-colors duration-1000" id="indicator-color"></div>
                    </div>
                </div>

                <!-- p5.js Container -->
                <div id="p5-container" class="w-full h-full relative z-10 cursor-default"></div>
            </div>

            <!-- Bottom Half: Trend Analysis Chart -->
            <div class="w-full h-[45%] bg-slate-900 border-t border-slate-800 p-5 shadow-inner relative z-20 flex flex-col">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 flex items-center gap-2 shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
                    pH Trend Analysis
                </h3>
                <div class="flex-grow w-full relative">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>

        </main>

    </div>

    <!-- Application Logic -->
    <script>
        // --- DATABASE ---
        const PERIOD_3 = [
            { id: 'Na2O', formula: 'Na₂O', name: 'Sodium Oxide', state: 'Solid', structure: 'Giant Ionic', nature: 'Strongly Basic', pH: 14.0, eq: 'Na₂O(s) + H₂O(l) → 2NaOH(aq)', color: '#8B5CF6', physState: 'solid' }, // Violet
            { id: 'MgO', formula: 'MgO', name: 'Magnesium Oxide', state: 'Solid', structure: 'Giant Ionic', nature: 'Weakly Basic', pH: 9.0, eq: 'MgO(s) + H₂O(l) ⇌ Mg(OH)₂(aq)', color: '#3B82F6', physState: 'solid' },  // Blue
            { id: 'Al2O3', formula: 'Al₂O₃', name: 'Aluminum Oxide', state: 'Solid', structure: 'Giant Ionic (Cov. Char.)', nature: 'Amphoteric', pH: 7.0, eq: 'Insoluble in water. No reaction.', color: '#10B981', physState: 'solid' }, // Green
            { id: 'SiO2', formula: 'SiO₂', name: 'Silicon Dioxide', state: 'Solid', structure: 'Giant Covalent', nature: 'Weakly Acidic', pH: 7.0, eq: 'Insoluble in water. No reaction.', color: '#10B981', physState: 'solid' }, // Green
            { id: 'P4O10', formula: 'P₄O₁₀', name: 'Phosphorus(V) Oxide', state: 'Solid', structure: 'Simple Molecular', nature: 'Strongly Acidic', pH: 2.0, eq: 'P₄O₁₀(s) + 6H₂O(l) → 4H₃PO₄(aq)', color: '#EF4444', physState: 'solid' }, // Red
            { id: 'SO3', formula: 'SO₃', name: 'Sulfur Trioxide', state: 'Gas / Liquid', structure: 'Simple Molecular', nature: 'Strongly Acidic', pH: 1.0, eq: 'SO₃(g) + H₂O(l) → H₂SO₄(aq)', color: '#DC2626', physState: 'gas' }, // Deep Red
            { id: 'Cl2O7', formula: 'Cl₂O₇', name: 'Dichlorine Heptoxide', state: 'Liquid', structure: 'Simple Molecular', nature: 'Strongly Acidic', pH: 0.5, eq: 'Cl₂O₇(l) + H₂O(l) → 2HClO₄(aq)', color: '#991B1B', physState: 'liquid' } // Darkest Red
        ];

        const PERIOD_4 = [
            { id: 'K2O', formula: 'K₂O', name: 'Potassium Oxide', state: 'Solid', structure: 'Giant Ionic', nature: 'Strongly Basic', pH: 14.0, eq: 'K₂O(s) + H₂O(l) → 2KOH(aq)', color: '#8B5CF6', physState: 'solid' },
            { id: 'CaO', formula: 'CaO', name: 'Calcium Oxide', state: 'Solid', structure: 'Giant Ionic', nature: 'Basic', pH: 10.0, eq: 'CaO(s) + H₂O(l) ⇌ Ca(OH)₂(aq)', color: '#6366F1', physState: 'solid' },
            { id: 'Ga2O3', formula: 'Ga₂O₃', name: 'Gallium Oxide', state: 'Solid', structure: 'Giant Ionic', nature: 'Amphoteric', pH: 7.0, eq: 'Insoluble in water. No reaction.', color: '#10B981', physState: 'solid' },
            { id: 'GeO2', formula: 'GeO₂', name: 'Germanium Dioxide', state: 'Solid', structure: 'Giant Covalent', nature: 'Amphoteric/Weak Acidic', pH: 7.0, eq: 'Insoluble in water. No reaction.', color: '#10B981', physState: 'solid' },
            { id: 'As4O6', formula: 'As₄O₆', name: 'Arsenic(III) Oxide', state: 'Solid', structure: 'Simple Molecular', nature: 'Weakly Acidic', pH: 5.0, eq: 'As₄O₆(s) + 6H₂O(l) ⇌ 4H₃AsO₃(aq)', color: '#F59E0B', physState: 'solid' },
            { id: 'SeO2', formula: 'SeO₂', name: 'Selenium Dioxide', state: 'Solid', structure: 'Simple Molecular', nature: 'Acidic', pH: 2.0, eq: 'SeO₂(s) + H₂O(l) → H₂SeO₃(aq)', color: '#EF4444', physState: 'solid' },
            { id: 'Br2O', formula: 'Br₂O', name: 'Dibromine Monoxide', state: 'Liquid / Gas', structure: 'Simple Molecular', nature: 'Strongly Acidic', pH: 1.0, eq: 'Br₂O(l) + H₂O(l) → 2HBrO(aq)', color: '#DC2626', physState: 'liquid' }
        ];

        // --- GLOBAL STATE ---
        let currentPeriodData = PERIOD_3;
        let activeOxide = currentPeriodData[0];
        let simState = 'idle'; // 'idle', 'reacting', 'done'
        
        let currentPH = 7.0;
        let targetPH = 7.0;

        let trendChart;

        // --- DOM Elements ---
        const uiFormula = document.getElementById('ui-formula');
        const uiState = document.getElementById('ui-state');
        const uiStructure = document.getElementById('ui-structure');
        const uiNature = document.getElementById('ui-nature');
        const uiEquation = document.getElementById('ui-equation');
        const cardAccent = document.getElementById('card-accent');
        
        const btnReact = document.getElementById('btn-react');
        const btnReset = document.getElementById('btn-reset');
        
        const phDisplay = document.getElementById('ph-display');
        const indicatorColor = document.getElementById('indicator-color');
        const phMeterBorder = document.getElementById('ph-meter-border');
        const phStatusLed = document.getElementById('ph-status-led');

        const btnP3 = document.getElementById('btn-p3');
        const btnP4 = document.getElementById('btn-p4');

        // --- INITIALIZATION ---
        function buildGrid() {
            const grid = document.getElementById('oxide-grid');
            grid.innerHTML = ''; // Clear existing
            currentPeriodData.forEach(ox => {
                const btn = document.createElement('button');
                btn.className = `oxide-btn p-3 bg-slate-900 border-2 border-slate-700 rounded-xl font-bold text-sm text-slate-300 transition-all ${ox.id === activeOxide.id ? 'active' : ''}`;
                btn.innerText = ox.formula;
                btn.onclick = () => selectOxide(ox, btn);
                grid.appendChild(btn);
            });
        }

        function selectOxide(ox, btnElement) {
            if (simState !== 'idle') return; // Lock UI during reaction

            activeOxide = ox;
            
            // Update UI Styling
            document.querySelectorAll('.oxide-btn').forEach(b => b.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');
            else {
                // If called programmatically (like on period switch), find the button
                const btns = document.querySelectorAll('.oxide-btn');
                if(btns.length > 0) btns[0].classList.add('active');
            }

            // Populate Card
            uiFormula.innerText = ox.formula;
            uiState.innerText = ox.state;
            uiStructure.innerText = ox.structure;
            uiNature.innerText = ox.nature;
            uiNature.style.color = ox.color;
            uiEquation.innerText = ox.eq;
            cardAccent.style.backgroundColor = ox.color;

            updateChart();
        }

        function setPeriod(period) {
            if (simState !== 'idle') return;
            
            if (period === 3) {
                currentPeriodData = PERIOD_3;
                btnP3.className = "px-3 py-1 text-[10px] font-bold uppercase rounded-md bg-slate-800 text-rose-400 transition-colors";
                btnP4.className = "px-3 py-1 text-[10px] font-bold uppercase rounded-md text-slate-500 hover:text-slate-300 transition-colors";
            } else {
                currentPeriodData = PERIOD_4;
                btnP4.className = "px-3 py-1 text-[10px] font-bold uppercase rounded-md bg-slate-800 text-rose-400 transition-colors";
                btnP3.className = "px-3 py-1 text-[10px] font-bold uppercase rounded-md text-slate-500 hover:text-slate-300 transition-colors";
            }
            buildGrid();
            selectOxide(currentPeriodData[0]); // Auto select first
        }

        function hexToRgb(hex) {
            let result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : {r: 0, g: 255, b: 0};
        }

        // --- CHART.JS INTEGRATION ---
        function initChart() {
            const ctx = document.getElementById('trendChart').getContext('2d');
            trendChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Grp 1', 'Grp 2', 'Grp 13', 'Grp 14', 'Grp 15', 'Grp 16', 'Grp 17'],
                    datasets: [{
                        label: 'pH Level',
                        data: [],
                        borderColor: '#475569',
                        borderWidth: 2,
                        pointBackgroundColor: [],
                        pointBorderColor: '#0F172A',
                        pointBorderWidth: 2,
                        pointRadius: [],
                        pointHoverRadius: 8,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { 
                            min: 0, max: 14, 
                            grid: { color: 'rgba(30, 41, 59, 0.5)' }, 
                            ticks: { color: '#64748B', stepSize: 2 },
                            title: { display: true, text: 'pH Level', color: '#94A3B8', font: {size: 10} }
                        },
                        x: { 
                            grid: { color: 'rgba(30, 41, 59, 0.5)' }, 
                            ticks: { color: '#64748B' } 
                        }
                    },
                    plugins: { 
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return `pH: ${context.parsed.y}`;
                                }
                            }
                        }
                    }
                }
            });
            updateChart();
        }

        function updateChart() {
            if(!trendChart) return;
            const dataSet = currentPeriodData.map(o => o.pH);
            const pointColors = currentPeriodData.map(o => o.color);
            const pointRadii = currentPeriodData.map(o => o.id === activeOxide.id ? 8 : 4);
            
            trendChart.data.datasets[0].data = dataSet;
            trendChart.data.datasets[0].pointBackgroundColor = pointColors;
            trendChart.data.datasets[0].pointRadius = pointRadii;
            trendChart.update();
        }

        // --- P5.JS SKETCH ---
        const sketch = (p) => {
            let cx, cy;
            let particles = [];
            
            // Colors
            const COLOR_NEUTRAL = p.color(34, 197, 94); // Green pH 7
            let currentWaterColor = COLOR_NEUTRAL;
            let targetWaterColor = COLOR_NEUTRAL;

            p.setup = () => {
                const container = document.getElementById('p5-container');
                p.createCanvas(container.offsetWidth, container.offsetHeight);
                cx = p.width / 2;
                cy = p.height / 2;
            };

            p.draw = () => {
                p.clear();
                
                // 1. Logic Updates
                if (simState === 'reacting') {
                    // Smoothly interpolate pH value
                    currentPH = p.lerp(currentPH, targetPH, 0.02);
                    phDisplay.innerText = currentPH.toFixed(2);
                    
                    // Smoothly interpolate Color
                    currentWaterColor = p.lerpColor(currentWaterColor, targetWaterColor, 0.02);
                    
                    // Update DOM colors
                    indicatorColor.style.backgroundColor = currentWaterColor.toString('#rrggbb');
                    if (currentPH < 7) {
                        phDisplay.style.color = '#F43F5E';
                        phMeterBorder.style.borderColor = '#F43F5E';
                    } else if (currentPH > 7) {
                        phDisplay.style.color = '#8B5CF6';
                        phMeterBorder.style.borderColor = '#8B5CF6';
                    }

                    // Check if done
                    if (Math.abs(currentPH - targetPH) < 0.05) {
                        simState = 'done';
                        currentPH = targetPH;
                        phDisplay.innerText = currentPH.toFixed(2);
                        phStatusLed.classList.remove('animate-pulse');
                        phStatusLed.style.backgroundColor = '#94A3B8';
                        btnReset.classList.remove('hidden');
                    }
                }

                // Adjust positioning dynamically since container height is smaller now
                const bW = 160;
                const bH = 180;
                const bTop = cy - 30;

                // 2. Draw Particles (Dropping oxide)
                for (let i = particles.length - 1; i >= 0; i--) {
                    let pt = particles[i];
                    pt.y += pt.vy;
                    pt.x += pt.vx;
                    
                    p.noStroke();
                    if (activeOxide.physState === 'gas') {
                        // Gas clouds
                        p.fill(200, 200, 200, pt.alpha);
                        p.circle(pt.x, pt.y, pt.size);
                        pt.alpha -= 2;
                        pt.size += 0.5;
                        if (pt.alpha <= 0) particles.splice(i, 1);
                    } else if (activeOxide.physState === 'liquid') {
                        // Liquid drops
                        p.fill(200, 200, 200, 150);
                        p.ellipse(pt.x, pt.y, pt.size, pt.size * 1.5);
                        if (pt.y > bTop + 50) particles.splice(i, 1); // Hit water
                    } else {
                        // Solid cubes/crystals
                        p.fill(200, 200, 200);
                        p.rect(pt.x, pt.y, pt.size, pt.size);
                        // Solids can sit at bottom if insoluble
                        if (pt.y > bTop + bH - 30) {
                            if (activeOxide.pH === 7.0) {
                                pt.vy = 0; pt.vx = 0; // Pile up
                            } else {
                                pt.size -= 0.5; // Dissolve
                                if (pt.size <= 0) particles.splice(i, 1);
                            }
                        }
                    }
                }

                // 3. Draw Beaker
                // Water Fill
                p.noStroke();
                currentWaterColor.setAlpha(150);
                p.fill(currentWaterColor);
                p.rect(cx - bW/2 + 5, bTop + 40, bW - 10, bH - 45, 0, 0, 15, 15);
                
                // Meniscus
                p.ellipse(cx, bTop + 40, bW - 10, 15);

                // Beaker Glass
                p.stroke('#64748B');
                p.strokeWeight(6);
                p.noFill();
                p.beginShape();
                p.vertex(cx - bW/2, bTop);
                p.vertex(cx - bW/2, bTop + bH - 20);
                p.quadraticVertex(cx - bW/2, bTop + bH, cx - bW/2 + 20, bTop + bH);
                p.vertex(cx + bW/2 - 20, bTop + bH);
                p.quadraticVertex(cx + bW/2, bTop + bH, cx + bW/2, bTop + bH - 20);
                p.vertex(cx + bW/2, bTop);
                p.endShape();
                
                // Lip
                p.strokeWeight(4);
                p.line(cx - bW/2 - 10, bTop, cx + bW/2 + 10, bTop);

                // Glass Glare
                p.noStroke();
                p.fill(255, 255, 255, 30);
                p.rect(cx - bW/2 + 15, bTop + 20, 20, bH - 40, 10);
            };

            p.windowResized = () => {
                const container = document.getElementById('p5-container');
                p.resizeCanvas(container.offsetWidth, container.offsetHeight);
                cx = p.width / 2;
                cy = p.height / 2;
            };

            // Public method to trigger reaction
            window.startReaction = () => {
                if (simState !== 'idle') return;
                
                simState = 'reacting';
                targetPH = activeOxide.pH;
                
                const rgb = hexToRgb(activeOxide.color);
                targetWaterColor = p.color(rgb.r, rgb.g, rgb.b);

                phStatusLed.classList.add('animate-pulse');
                phStatusLed.style.backgroundColor = '#10B981';

                // Spawn Particles based on state
                let numParts = activeOxide.physState === 'gas' ? 30 : 50;
                for (let i = 0; i < numParts; i++) {
                    setTimeout(() => {
                        particles.push({
                            x: cx + p.random(-40, 40),
                            y: cy - 150 - p.random(0, 100),
                            vx: p.random(-0.5, 0.5),
                            vy: p.random(2, 5),
                            size: p.random(4, 10),
                            alpha: 200
                        });
                    }, i * 50);
                }
            };

            window.resetReaction = () => {
                simState = 'idle';
                currentPH = 7.0;
                targetPH = 7.0;
                currentWaterColor = COLOR_NEUTRAL;
                targetWaterColor = COLOR_NEUTRAL;
                particles = [];
                
                phDisplay.innerText = "7.00";
                phDisplay.style.color = '#10B981';
                phMeterBorder.style.borderColor = '#10B981';
                indicatorColor.style.backgroundColor = '#22c55e'; // Tailwind green-500
            };
        };

        // --- BINDINGS ---
        buildGrid();
        initChart();
        selectOxide(activeOxide);
        
        new p5(sketch, 'p5-container');

        btnP3.addEventListener('click', () => setPeriod(3));
        btnP4.addEventListener('click', () => setPeriod(4));

        btnReact.addEventListener('click', () => {
            btnReact.classList.add('hidden');
            window.startReaction();
        });

        btnReset.addEventListener('click', () => {
            btnReset.classList.add('hidden');
            btnReact.classList.remove('hidden');
            window.resetReaction();
        });

    </script>
</body>
</html>
