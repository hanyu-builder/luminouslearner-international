<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organic Chemistry Tests Interactive Simulator</title>
  <meta name="description" content="Organic chemistry tests interactive simulator. Emulates visual diagnostic logic of a qualitative organic lab using Boolean engines for Tollens, Bradys, and Bromine tests.">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for in-browser JSX transpilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { background-color: #0F172A; margin: 0; overflow: hidden; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    
    /* Custom Scrollbar */
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(30, 41, 59, 0.5); }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(71, 85, 105, 0.8); border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 1); }

    /* Animations */
    @keyframes effervescence {
      0% { transform: translateY(0) scale(1); opacity: 0.8; }
      100% { transform: translateY(-80px) scale(1.5); opacity: 0; }
    }
    .animate-bubble { animation: effervescence 1.2s ease-in infinite; }

    @keyframes drop-fall {
      0% { transform: translateY(-50px); opacity: 1; }
      100% { transform: translateY(100px); opacity: 0; }
    }
    .animate-drop { animation: drop-fall 0.5s ease-in forwards; }

    /* Precipitate textures */
    .bg-precipitate {
      background-image: radial-gradient(#d97706 15%, transparent 16%), radial-gradient(#d97706 15%, transparent 16%);
      background-size: 8px 8px;
      background-position: 0 0, 4px 4px;
    }

    .bg-white-precipitate {
      background-color: rgba(255, 255, 255, 0.2);
      background-image: radial-gradient(#cbd5e1 20%, transparent 21%), radial-gradient(#cbd5e1 20%, transparent 21%);
      background-size: 8px 8px;
      background-position: 0 0, 4px 4px;
    }
    
    /* Silver mirror texture */
    .bg-silver-mirror {
      background: linear-gradient(135deg, #cbd5e1 0%, #f1f5f9 40%, #94a3b8 60%, #cbd5e1 100%);
      box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- ICON COMPONENTS ---
    const SvgIcon = ({ children, size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
    );
    const Activity = (p) => <SvgIcon {...p}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12" /></SvgIcon>;
    const FlaskConical = (p) => <SvgIcon {...p}><path d="M10 2v7.31L2 20.24a2 2 0 0 0 1.76 2.76h16.48a2 2 0 0 0 1.76-2.76L14 9.31V2"/><path d="M8.5 2h7"/><path d="M10 10l5.5-5.5"/></SvgIcon>;
    const Droplet = (p) => <SvgIcon {...p}><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></SvgIcon>;
    const Sun = (p) => <SvgIcon {...p}><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></SvgIcon>;
    const Cpu = (p) => <SvgIcon {...p}><rect width="16" height="16" x="4" y="4" rx="2"/><rect width="6" height="6" x="9" y="9" rx="1"/><path d="M15 2v2"/><path d="M15 20v2"/><path d="M2 15h2"/><path d="M2 9h2"/><path d="M20 15h2"/><path d="M20 9h2"/><path d="M9 2v2"/><path d="M9 20v2"/></SvgIcon>;
    const Search = (p) => <SvgIcon {...p}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></SvgIcon>;
    const Eye = (p) => <SvgIcon {...p}><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></SvgIcon>;
    const ShieldQuestion = (p) => <SvgIcon {...p}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9.1 9a3 3 0 0 1 5.82 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></SvgIcon>;
    const GitCompare = (p) => <SvgIcon {...p}><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7"/><path d="M11 18H8a2 2 0 0 1-2-2V9"/></SvgIcon>;

    // --- ORGANIC CHEMISTRY LOGIC ENGINE ---
    
    // The unknown samples provided to the student (Expanded to 8 critical compounds)
    const MYSTERY_LIQUIDS = [
      { id: 'A', type: 'alkene', name: 'Cyclohexene', trueFunc: 'Alkene (C=C)' },
      { id: 'B', type: 'alkane', name: 'Hexane', trueFunc: 'Alkane (C-C)' },
      { id: 'C', type: 'aldehyde', name: 'Ethanal', trueFunc: 'Aldehyde (-CHO)' },
      { id: 'D', type: 'ketone', name: 'Propanone', trueFunc: 'Ketone (C=O)' },
      { id: 'E', type: 'carboxylic', name: 'Ethanoic Acid', trueFunc: 'Carboxylic Acid (-COOH)' },
      { id: 'F', type: 'alcohol', name: 'Ethanol', trueFunc: '1°/2° Alcohol (-OH)' },
      { id: 'G', type: 'tertiary_alcohol', name: '2-Methylpropan-2-ol', trueFunc: '3° Alcohol (-OH)' },
      { id: 'H', type: 'phenol', name: 'Phenol', trueFunc: 'Phenol (Ar-OH)' }
    ];

    const REAGENTS = {
      'br2': { id: 'br2', name: 'Bromine Water', formula: 'Br₂(aq)', initColor: 'rgba(217, 119, 6, 0.7)' }, // Orange
      'tollens': { id: 'tollens', name: 'Tollens\' Reagent', formula: '[Ag(NH₃)₂]⁺', initColor: 'rgba(255, 255, 255, 0.05)' }, // Colorless
      'bradys': { id: 'bradys', name: 'Brady\'s Reagent', formula: '2,4-DNPH', initColor: 'rgba(234, 88, 12, 0.6)' }, // Orange solution
      'dichromate': { id: 'dichromate', name: 'Acidified K₂Cr₂O₇', formula: 'Cr₂O₇²⁻ / H⁺', initColor: 'rgba(249, 115, 22, 0.8)' }, // Orange
      'kmno4': { id: 'kmno4', name: 'Acidified KMnO₄', formula: 'MnO₄⁻ / H⁺', initColor: 'rgba(168, 85, 247, 0.8)' }, // Purple
      'carbonate': { id: 'carbonate', name: 'Sodium Carbonate', formula: 'Na₂CO₃(aq)', initColor: 'rgba(255, 255, 255, 0.05)' } // Colorless
    };

    // Expanded Versus Mode Pairs to cover common exam "trick" scenarios
    const VERSUS_PAIRS = [
      { id: 'v1', name: 'Alkane vs Alkene', desc: 'Hexane vs Cyclohexene', left: 'B', right: 'A' },
      { id: 'v2', name: 'Aldehyde vs Ketone', desc: 'Ethanal vs Propanone', left: 'C', right: 'D' },
      { id: 'v3', name: '1° Alcohol vs 3° Alcohol', desc: 'Ethanol vs 2-Methylpropan-2-ol', left: 'F', right: 'G' },
      { id: 'v4', name: 'Alcohol vs Carboxylic Acid', desc: 'Ethanol vs Ethanoic Acid', left: 'F', right: 'E' },
      { id: 'v5', name: 'Phenol vs Alcohol', desc: 'Phenol vs Ethanol', left: 'H', right: 'F' },
      { id: 'v6', name: 'Phenol vs Carboxylic Acid', desc: 'Phenol vs Ethanoic Acid', left: 'H', right: 'E' },
      { id: 'v7', name: 'Aldehyde vs Alcohol', desc: 'Ethanal vs Ethanol', left: 'C', right: 'F' },
      { id: 'v8', name: 'Ketone vs Alkene', desc: 'Propanone vs Cyclohexene', left: 'D', right: 'A' }
    ];

    // The Boolean Engine defining empirical outcomes
    const getReactionOutcome = (liquidType, reagentId, uvOn) => {
      // Default: No reaction (just mixing colors)
      let outcome = {
        reacted: false,
        visualColor: REAGENTS[reagentId].initColor,
        visualClass: '',
        observation: 'No visible change. Solution remains the color of the reagent.',
        logic: 'Functional group absent or unreactive to this reagent.'
      };

      if (reagentId === 'br2') {
        if (liquidType === 'alkene') {
          outcome = { reacted: true, visualColor: 'rgba(255, 255, 255, 0.05)', visualClass: '', observation: 'Immediate decolorization (Orange ➔ Colorless).', logic: 'Electrophilic addition readily occurs across C=C double bond.' };
        } else if (liquidType === 'phenol') {
          outcome = { reacted: true, visualColor: 'rgba(255, 255, 255, 0.05)', visualClass: 'bg-white-precipitate', observation: 'Decolorization AND formation of a white precipitate.', logic: 'Multiple electrophilic substitutions occur readily on the highly activated aromatic ring, forming 2,4,6-tribromophenol (s).' };
        } else if (liquidType === 'alkane' && uvOn) {
          outcome = { reacted: true, visualColor: 'rgba(255, 255, 255, 0.05)', visualClass: 'transition-colors duration-[3000ms]', observation: 'Slow decolorization under UV light.', logic: 'Free radical substitution requires UV energy to homolytically break the Br-Br bond.' };
        } else if (liquidType === 'alkane' && !uvOn) {
          outcome.observation = 'Remains orange. (Requires UV light to initiate substitution).';
          outcome.logic = 'Alkanes are saturated and unreactive without UV initiation.';
        }
      } 
      
      else if (reagentId === 'tollens') {
        if (liquidType === 'aldehyde') {
          outcome = { reacted: true, visualColor: '', visualClass: 'bg-silver-mirror', observation: 'Silver mirror forms on test tube walls.', logic: 'Aldehyde oxidized to carboxylate; Ag⁺ is reduced to solid Ag.' };
        }
      } 
      
      else if (reagentId === 'bradys') {
        if (liquidType === 'aldehyde' || liquidType === 'ketone') {
          outcome = { reacted: true, visualColor: 'rgba(234, 179, 8, 0.9)', visualClass: 'bg-precipitate', observation: 'Yellow-orange precipitate forms.', logic: 'Nucleophilic addition-elimination (condensation) specific to carbonyl (C=O) groups.' };
        }
      } 
      
      else if (reagentId === 'dichromate') {
        if (liquidType === 'alcohol' || liquidType === 'aldehyde') {
          outcome = { reacted: true, visualColor: 'rgba(34, 197, 94, 0.7)', visualClass: 'transition-colors duration-1000', observation: 'Color change from Orange ➔ Green.', logic: 'Oxidation of 1°/2° alcohol or aldehyde. Cr(VI) (orange) is reduced to Cr(III) (green).' };
        } else if (liquidType === 'tertiary_alcohol') {
          outcome.observation = 'Remains orange. No reaction occurs.';
          outcome.logic = '3° Alcohols lack a hydrogen atom on the central carbon, preventing oxidation.';
        }
      } 
      
      else if (reagentId === 'kmno4') {
        if (liquidType === 'alcohol' || liquidType === 'aldehyde' || liquidType === 'alkene') {
          outcome = { reacted: true, visualColor: 'rgba(255, 255, 255, 0.05)', visualClass: 'transition-colors duration-1000', observation: 'Decolorization (Purple ➔ Colorless).', logic: 'Oxidation of the organic compound. Mn(VII) is reduced to Mn(II).' };
        } else if (liquidType === 'tertiary_alcohol') {
          outcome.observation = 'Remains purple. No reaction occurs.';
          outcome.logic = '3° Alcohols resist oxidation because they lack an alpha-hydrogen.';
        }
      } 
      
      else if (reagentId === 'carbonate') {
        if (liquidType === 'carboxylic') {
          outcome = { reacted: true, visualColor: 'rgba(255, 255, 255, 0.05)', visualClass: 'bubbles-active', observation: 'Vigorous effervescence (bubbles of colorless gas).', logic: 'Acid-base reaction. Carboxylic acid is strong enough to displace CO₂ from carbonates.' };
        } else if (liquidType === 'phenol') {
          outcome.observation = 'No effervescence. No reaction occurs.';
          outcome.logic = 'Phenols are weak acids, but NOT strong enough to displace CO₂ from carbonates.';
        }
      }

      return outcome;
    };

    // Sub-component for rendering a single test tube dynamically
    const TestTube = ({ liquid, outcome, isDropping, reagentColor, revealMode }) => {
      let currentLiquidColor = 'rgba(255, 255, 255, 0.05)';
      let currentLiquidClass = '';
      
      if (outcome && !isDropping) {
        currentLiquidColor = outcome.visualColor;
        currentLiquidClass = outcome.visualClass;
      } else if (isDropping && reagentColor) {
        currentLiquidColor = reagentColor;
      }

      return (
        <div className="flex flex-col items-center flex-1 max-w-[150px]">
          {/* Reagent Dropper Visual */}
          <div className="h-12 w-full flex flex-col items-center z-20 relative">
            {reagentColor && (
              <div className={`transition-opacity duration-300 ${isDropping ? 'opacity-0' : 'opacity-100'}`}>
                <Droplet size={32} style={{ color: reagentColor }} />
              </div>
            )}
            {isDropping && reagentColor && (
              <div className="w-4 h-6 rounded-full absolute top-2 animate-drop" style={{ backgroundColor: reagentColor }}></div>
            )}
          </div>

          {/* Central Test Tube SVG */}
          <div className="relative w-full h-48 z-10 mb-3 flex justify-center">
            {/* Floating Bubbles */}
            {currentLiquidClass.includes('bubbles-active') && !isDropping && (
              <div className="absolute w-24 h-full bottom-0 flex justify-around items-end z-0 pointer-events-none px-4 pb-8">
                  <div className="w-2 h-2 bg-white rounded-full animate-bubble" style={{ animationDelay: '0s' }}></div>
                  <div className="w-3 h-3 bg-white rounded-full animate-bubble" style={{ animationDelay: '0.4s' }}></div>
                  <div className="w-1 h-1 bg-white rounded-full animate-bubble" style={{ animationDelay: '0.2s' }}></div>
                  <div className="w-2 h-2 bg-white rounded-full animate-bubble" style={{ animationDelay: '0.6s' }}></div>
                  <div className="w-3 h-3 bg-white rounded-full animate-bubble" style={{ animationDelay: '0.8s' }}></div>
              </div>
            )}

            <svg viewBox="0 0 100 200" className="w-24 h-full drop-shadow-2xl relative z-10">
              <path d="M 20,80 L 20,170 Q 20,190 50,190 Q 80,190 80,170 L 80,80 Z" fill={currentLiquidColor} className={currentLiquidClass.includes('bg-') ? '' : currentLiquidClass} />
              
              {currentLiquidClass.includes('bg-') && !isDropping && (
                <foreignObject x="20" y="80" width="60" height="110">
                  <div xmlns="http://www.w3.org/1999/xhtml" className={`w-full h-full rounded-b-full ${currentLiquidClass}`}></div>
                </foreignObject>
              )}
              
              <path d="M 15,10 L 15,15 L 20,15 L 20,170 Q 20,190 50,190 Q 80,190 80,170 L 80,15 L 85,15 L 85,10" fill="none" stroke="rgba(203, 213, 225, 0.5)" strokeWidth="4" strokeLinejoin="round" />
              <line x1="15" y1="10" x2="85" y2="10" stroke="rgba(203, 213, 225, 0.5)" strokeWidth="4" strokeLinecap="round" />
              <path d="M 25,20 L 25,165 Q 30,180 50,180 Q 70,180 70,165 L 70,20 Z" fill="rgba(255,255,255,0.08)" pointerEvents="none" />
            </svg>
            
            <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 opacity-30 font-black text-3xl pointer-events-none select-none z-20 mix-blend-overlay">
              {liquid.id}
            </div>
          </div>
          <div className="text-center">
            <div className="font-bold text-slate-300 text-sm">{revealMode ? liquid.name : `Sample ${liquid.id}`}</div>
            {revealMode && <div className="text-[10px] text-emerald-400 font-mono tracking-wider">{liquid.trueFunc}</div>}
          </div>
        </div>
      );
    };

    function App() {
      const [appMode, setAppMode] = useState('single'); // 'single' or 'versus'
      const [activeLiquidId, setActiveLiquidId] = useState('A');
      const [activePairId, setActivePairId] = useState('v1');
      const [activeReagent, setActiveReagent] = useState(null);
      const [uvLightOn, setUvLightOn] = useState(false);
      const [isDropping, setIsDropping] = useState(false);
      const [revealMode, setRevealMode] = useState(false);

      const activeLiquid = MYSTERY_LIQUIDS.find(l => l.id === activeLiquidId);
      const activePair = VERSUS_PAIRS.find(p => p.id === activePairId);
      const leftLiquid = MYSTERY_LIQUIDS.find(l => l.id === activePair.left);
      const rightLiquid = MYSTERY_LIQUIDS.find(l => l.id === activePair.right);
      
      // Calculate outcomes for single mode
      const currentOutcome = activeReagent && appMode === 'single'
        ? getReactionOutcome(activeLiquid.type, activeReagent, uvLightOn)
        : null;

      // Calculate outcomes for versus mode
      const outcomeLeft = activeReagent && appMode === 'versus' ? getReactionOutcome(leftLiquid.type, activeReagent, uvLightOn) : null;
      const outcomeRight = activeReagent && appMode === 'versus' ? getReactionOutcome(rightLiquid.type, activeReagent, uvLightOn) : null;

      // Handlers
      const selectLiquid = (id) => {
        setActiveLiquidId(id);
        setActiveReagent(null);
        setUvLightOn(false);
        setRevealMode(false);
      };

      const selectPair = (id) => {
        setActivePairId(id);
        setActiveReagent(null);
        setUvLightOn(false);
        setRevealMode(false);
      };

      const applyReagent = (reagentId) => {
        if (activeReagent === reagentId) return; // Prevent spamming
        setActiveReagent(reagentId);
        setIsDropping(true);
        // Turn off UV automatically when changing reagents for safety
        setUvLightOn(false); 
        
        setTimeout(() => {
          setIsDropping(false);
        }, 500); // Animation duration
      };

      const toggleUvLight = () => {
        setUvLightOn(!uvLightOn);
      };

      return (
        <div className="min-h-screen bg-slate-900 flex flex-col font-sans overflow-hidden selection:bg-emerald-500/30">
          
          {/* HEADER (SEO Keyword Included) */}
          <header className="flex justify-between items-center px-6 py-4 bg-slate-800/80 border-b border-slate-700 shadow-lg shrink-0">
            <div className="flex items-center gap-3">
              <FlaskConical className="text-emerald-400" size={28} />
              <div>
                <h1 className="text-2xl font-bold bg-gradient-to-r from-emerald-400 to-cyan-500 bg-clip-text text-transparent">
                  Organic Chemistry Tests Interactive
                </h1>
                <p className="text-xs text-slate-400 font-medium">Qualitative Lab Diagnostic Engine</p>
              </div>
            </div>
            
            <div className="flex items-center gap-4">
              {/* App Mode Toggle */}
              <div className="flex items-center gap-1 bg-slate-900 p-1 rounded-lg border border-slate-700">
                <button 
                  onClick={() => { setAppMode('single'); setActiveReagent(null); }} 
                  className={`px-3 py-1.5 text-xs font-bold rounded-md transition-all flex items-center gap-1 ${appMode === 'single' ? 'bg-slate-700 text-emerald-400 shadow' : 'text-slate-500 hover:text-slate-300'}`}
                >
                  <Search size={14}/> Single Mode
                </button>
                <button 
                  onClick={() => { setAppMode('versus'); setActiveReagent(null); }} 
                  className={`px-3 py-1.5 text-xs font-bold rounded-md transition-all flex items-center gap-1 ${appMode === 'versus' ? 'bg-slate-700 text-amber-400 shadow' : 'text-slate-500 hover:text-slate-300'}`}
                >
                  <GitCompare size={14}/> Versus Mode
                </button>
              </div>

              <button 
                onClick={() => setRevealMode(!revealMode)}
                className={`flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-bold transition-colors ${revealMode ? 'bg-amber-600 hover:bg-amber-500 text-white shadow-[0_0_10px_rgba(217,119,6,0.5)]' : 'bg-slate-700 hover:bg-slate-600 text-slate-200'}`}
              >
                {revealMode ? <Eye size={16} /> : <ShieldQuestion size={16} />}
                {revealMode ? 'Hide Identities' : 'Reveal Identities'}
              </button>
            </div>
          </header>

          <main className="flex-1 flex gap-4 p-4 overflow-hidden max-h-[calc(100vh-80px)]">
            
            {/* LEFT PANEL: The Rack or Pairs List */}
            <div className="w-1/4 bg-slate-800/50 border border-slate-700 rounded-2xl p-4 flex flex-col shadow-inner shrink-0">
              <h2 className="text-sm uppercase tracking-widest text-slate-400 font-bold mb-4 flex items-center gap-2">
                {appMode === 'single' ? <><Search size={16} /> Mystery Samples</> : <><GitCompare size={16} /> Distinguish Pairs</>}
              </h2>
              
              <div className="flex-1 overflow-y-auto custom-scrollbar pr-2 flex flex-col gap-3">
                {appMode === 'single' ? (
                  MYSTERY_LIQUIDS.map((liquid) => {
                    const isActive = activeLiquidId === liquid.id;
                    return (
                      <button 
                        key={liquid.id}
                        onClick={() => selectLiquid(liquid.id)}
                        className={`relative flex items-center gap-4 p-3 rounded-xl border text-left transition-all duration-300
                          ${isActive 
                            ? 'border-emerald-500 bg-emerald-900/20 shadow-[0_0_15px_rgba(16,185,129,0.15)] transform scale-105 z-10' 
                            : 'border-slate-700 bg-slate-800 hover:bg-slate-700/50 hover:border-slate-500'}
                        `}
                      >
                        <div className="w-6 h-10 border-2 border-slate-400/50 rounded-b-full border-t-0 flex items-end justify-center pb-1 relative bg-slate-900">
                          <div className="w-4 h-4 bg-white/10 rounded-b-full"></div>
                          <span className="absolute -bottom-5 text-xs font-bold text-slate-500">TUBE</span>
                        </div>
                        <div className="ml-2">
                          <h3 className={`font-black text-xl ${isActive ? 'text-emerald-400' : 'text-slate-200'}`}>
                            Sample {liquid.id}
                          </h3>
                          <p className={`text-[11px] mt-1 font-mono tracking-wider ${revealMode ? 'text-amber-400 font-bold' : 'text-slate-500'}`}>
                            {revealMode ? liquid.trueFunc : 'Unknown Organic Liquid'}
                          </p>
                        </div>
                      </button>
                    );
                  })
                ) : (
                  VERSUS_PAIRS.map((pair) => {
                    const isActive = activePairId === pair.id;
                    return (
                      <button 
                        key={pair.id}
                        onClick={() => selectPair(pair.id)}
                        className={`flex flex-col p-3 rounded-xl border text-left transition-all duration-300
                          ${isActive 
                            ? 'border-amber-500 bg-amber-900/20 shadow-[0_0_15px_rgba(245,158,11,0.15)] transform scale-105 z-10' 
                            : 'border-slate-700 bg-slate-800 hover:bg-slate-700/50 hover:border-slate-500'}
                        `}
                      >
                        <h3 className={`font-black text-sm ${isActive ? 'text-amber-400' : 'text-slate-200'}`}>
                          {pair.name}
                        </h3>
                        <p className={`text-[11px] mt-1 font-mono tracking-wider ${revealMode ? 'text-emerald-400 font-bold' : 'text-slate-500'}`}>
                          {revealMode ? pair.desc : `Sample ${pair.left} vs Sample ${pair.right}`}
                        </p>
                      </button>
                    );
                  })
                )}
              </div>
            </div>

            {/* CENTER PANEL: Testing Area */}
            <div className="w-2/4 flex flex-col gap-4">
              
              {/* Reagent Shelf */}
              <div className="bg-slate-800 rounded-2xl p-4 border border-slate-700 shadow-xl shrink-0">
                <h3 className="text-[10px] text-slate-400 font-bold tracking-widest uppercase mb-3 text-center">Reagent Shelf (Click to Apply)</h3>
                <div className="flex justify-center gap-2 flex-wrap">
                  {Object.values(REAGENTS).map(reagent => (
                    <button 
                      key={reagent.id}
                      onClick={() => applyReagent(reagent.id)}
                      className={`py-2 px-3 rounded-lg border-2 flex flex-col items-center justify-center transition-all min-w-[100px]
                        ${activeReagent === reagent.id 
                          ? 'border-cyan-400 bg-cyan-900/30 shadow-[0_0_10px_rgba(34,211,238,0.2)]' 
                          : 'border-slate-600 bg-slate-700 hover:bg-slate-600'}
                      `}
                    >
                      <span className="text-xs font-bold text-slate-200">{reagent.name}</span>
                      <span className="text-[10px] font-mono text-slate-400 mt-1">{reagent.formula}</span>
                    </button>
                  ))}
                </div>
              </div>

              {/* The Testing Bench */}
              <div className="flex-1 bg-slate-800/80 rounded-2xl p-6 border border-slate-700 flex flex-col items-center justify-end relative shadow-inner overflow-hidden">
                <div className="absolute top-4 left-6 text-slate-500 text-xs uppercase font-bold tracking-widest">Testing Bench</div>
                
                {/* UV Light Toggle (Conditional) */}
                <div className={`absolute top-4 right-6 transition-opacity duration-300 ${activeReagent === 'br2' ? 'opacity-100' : 'opacity-0 pointer-events-none'}`}>
                  <button 
                    onClick={toggleUvLight}
                    className={`flex items-center gap-2 px-3 py-2 rounded-lg border-2 font-bold text-xs transition-all shadow-lg
                      ${uvLightOn 
                        ? 'border-purple-400 bg-purple-900/40 text-purple-300 shadow-[0_0_20px_rgba(192,132,252,0.4)]' 
                        : 'border-slate-600 bg-slate-800 text-slate-400 hover:bg-slate-700'}
                    `}
                  >
                    <Sun size={16} className={uvLightOn ? 'animate-spin-slow' : ''} />
                    UV LIGHT {uvLightOn ? 'ON' : 'OFF'}
                  </button>
                </div>

                {/* UV Beam Visual */}
                {uvLightOn && activeReagent === 'br2' && (
                  <div className="absolute top-0 right-1/4 w-32 h-[80%] bg-gradient-to-b from-purple-500/20 to-transparent transform -skew-x-12 pointer-events-none z-0"></div>
                )}

                <div className="flex items-end justify-center w-full z-10 relative">
                   {appMode === 'single' ? (
                      <TestTube liquid={activeLiquid} outcome={currentOutcome} isDropping={isDropping} reagentColor={activeReagent ? REAGENTS[activeReagent].initColor : null} revealMode={revealMode} />
                   ) : (
                      <div className="flex items-end justify-center gap-8 w-full max-w-lg">
                        <TestTube liquid={leftLiquid} outcome={outcomeLeft} isDropping={isDropping} reagentColor={activeReagent ? REAGENTS[activeReagent].initColor : null} revealMode={revealMode} />
                        <div className="pb-24 text-slate-500 font-black text-2xl italic">VS</div>
                        <TestTube liquid={rightLiquid} outcome={outcomeRight} isDropping={isDropping} reagentColor={activeReagent ? REAGENTS[activeReagent].initColor : null} revealMode={revealMode} />
                      </div>
                   )}
                </div>
                
                {/* Rack Base */}
                <div className="w-[80%] h-4 bg-slate-700 rounded-full border-t border-slate-500 shadow-xl z-0 mt-4"></div>

              </div>
            </div>

            {/* RIGHT PANEL: Logic Gate Engine & Results */}
            <div className="w-1/4 bg-slate-800 rounded-2xl border border-slate-700 flex flex-col overflow-hidden shadow-xl shrink-0">
              <div className="p-4 bg-slate-700/50 border-b border-slate-600 flex items-center gap-2">
                <Cpu size={18} className="text-cyan-400" />
                <h2 className="text-sm uppercase tracking-widest text-slate-200 font-bold">Diagnostic Computer</h2>
              </div>
              
              <div className="p-5 flex flex-col h-full overflow-y-auto custom-scrollbar">
                
                {!activeReagent ? (
                  <div className="flex-1 flex flex-col items-center justify-center text-center opacity-50">
                    <Activity size={48} className="mb-4 text-slate-500" />
                    <p className="text-sm font-medium">Select a reagent from the shelf to perform a diagnostic test.</p>
                  </div>
                ) : appMode === 'single' ? (
                  <div className="flex flex-col gap-6 h-full">
                    
                    {/* Single Mode Observation Block */}
                    <div>
                      <p className="text-[10px] text-slate-500 uppercase tracking-widest font-bold mb-2">Empirical Observation</p>
                      <div className="bg-slate-900 border border-slate-700 p-4 rounded-xl shadow-inner min-h-[80px] flex items-center">
                        {isDropping ? (
                          <span className="text-slate-500 font-mono text-sm animate-pulse">Running test...</span>
                        ) : (
                          <span className={`font-medium text-sm leading-relaxed ${currentOutcome.reacted ? 'text-emerald-300' : 'text-slate-300'}`}>
                            {currentOutcome.observation}
                          </span>
                        )}
                      </div>
                    </div>

                    {/* Single Mode Boolean Logic Block */}
                    <div className="flex-1 flex flex-col">
                      <p className="text-[10px] text-slate-500 uppercase tracking-widest font-bold mb-2">Boolean Logic Engine</p>
                      <div className="bg-slate-900 border border-slate-700 p-4 rounded-xl font-mono text-xs text-slate-300 flex-1 shadow-inner relative overflow-hidden">
                        
                        {isDropping ? (
                          <div className="absolute inset-0 flex items-center justify-center bg-slate-900/80 z-10">
                            <Activity className="animate-spin text-cyan-500" size={24} />
                          </div>
                        ) : null}

                        <div className="mb-2"><span className="text-purple-400 font-bold">const</span> sample = <span className="text-purple-300">'{activeLiquid.id}'</span>;</div>
                        <div className="mb-2"><span className="text-cyan-400 font-bold">const</span> reagent = <span className="text-cyan-300">'{activeReagent}'</span>;</div>
                        <div className="mb-2"><span className="text-amber-400 font-bold">const</span> uv_light = <span className="text-amber-300">{uvLightOn ? 'true' : 'false'}</span>;</div>
                        
                        <div className="my-3 border-b border-slate-700"></div>
                        
                        <div className="mb-2 text-slate-500">// Evaluating functional group...</div>
                        
                        {/* Dynamic Logic String based on Reagent */}
                        <div className="mb-4 text-slate-400 leading-relaxed">
                          if (<span className="text-white">reagent</span> == '{activeReagent}') {'{'} <br/>
                          &nbsp;&nbsp;return checkGroup(); <br/>
                          {'}'}
                        </div>

                        <div className="my-3 border-b border-slate-700"></div>
                        <div className="mb-1 text-[10px] uppercase text-slate-500">Diagnostic Deduction:</div>
                        
                        <div className={`p-2 rounded border ${currentOutcome.reacted ? 'bg-emerald-900/30 border-emerald-500/50 text-emerald-300' : 'bg-slate-800 border-slate-600 text-slate-400'}`}>
                          {currentOutcome.logic}
                        </div>
                      </div>
                    </div>

                  </div>
                ) : (
                  <div className="flex flex-col gap-4 h-full">
                    {/* Versus Mode Comparison Block */}
                    <p className="text-[10px] text-slate-500 uppercase tracking-widest font-bold mb-1">Comparison Engine</p>
                    
                    <div className="bg-slate-900 border border-slate-700 p-4 rounded-xl shadow-inner relative overflow-hidden">
                      {isDropping && (
                        <div className="absolute inset-0 flex items-center justify-center bg-slate-900/80 z-10">
                          <Activity className="animate-spin text-cyan-500" size={24} />
                        </div>
                      )}
                      <h4 className="font-bold text-emerald-400 mb-1">{revealMode ? leftLiquid.name : `Sample ${leftLiquid.id}`}</h4>
                      <p className={`text-xs ${outcomeLeft.reacted ? 'text-slate-200' : 'text-slate-400'}`}>{outcomeLeft.observation}</p>
                    </div>

                    <div className="bg-slate-900 border border-slate-700 p-4 rounded-xl shadow-inner relative overflow-hidden">
                      {isDropping && (
                        <div className="absolute inset-0 flex items-center justify-center bg-slate-900/80 z-10">
                          <Activity className="animate-spin text-cyan-500" size={24} />
                        </div>
                      )}
                      <h4 className="font-bold text-amber-400 mb-1">{revealMode ? rightLiquid.name : `Sample ${rightLiquid.id}`}</h4>
                      <p className={`text-xs ${outcomeRight.reacted ? 'text-slate-200' : 'text-slate-400'}`}>{outcomeRight.observation}</p>
                    </div>

                    <div className={`mt-auto p-4 rounded-xl border text-sm shadow-lg ${
                       !isDropping && outcomeLeft.reacted !== outcomeRight.reacted 
                       ? 'bg-emerald-900/30 border-emerald-500/50 text-emerald-300' 
                       : 'bg-rose-900/30 border-rose-500/50 text-rose-300'
                    }`}>
                       {!isDropping ? (
                         outcomeLeft.reacted !== outcomeRight.reacted 
                         ? <><div className="font-bold mb-1 flex items-center gap-1">✅ Distinguishable</div> The reagent yields unique visual results for each compound.</>
                         : <><div className="font-bold mb-1 flex items-center gap-1">❌ Indistinguishable</div> The reagent produces the same visual outcome for both compounds.</>
                       ) : <span className="opacity-50">Evaluating...</span>}
                    </div>

                  </div>
                )}
                
              </div>
            </div>

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
