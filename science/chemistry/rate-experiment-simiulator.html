<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rate of Reaction Simulation | Lab Simulator</title>
    <meta name="description" content="Interactive rate of reaction simulation. Explore how surface area, temperature, and concentration affect the rate of hydrogen gas evolution using a virtual gas syringe.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: { 850: '#151e2e', 900: '#0F172A', 950: '#020617' },
                        rxn: {
                            acid: 'rgba(14, 165, 233, 0.3)', // Sky 500 low opacity
                            mg: '#94A3B8',       // Slate 400
                            gas: '#E2E8F0',      // Slate 200
                            chart: '#0EA5E9',    // Sky 500
                            success: '#10B981'   // Emerald
                        }
                    }
                }
            }
        }
    </script>

    <!-- p5.js for Visual Canvas Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    
    <!-- Chart.js for Graph Plotting -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { margin: 0; background-color: #020617; overflow: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Custom Sliders */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
            width: 100%;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 18px; width: 18px;
            border-radius: 50%;
            background: #0EA5E9;
            cursor: pointer;
            margin-top: -7px;
            box-shadow: 0 0 10px rgba(14, 165, 233, 0.6);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px;
            cursor: pointer;
            background: #334155;
            border-radius: 2px;
        }

        /* Custom Radio Buttons */
        .radio-custom:checked + div {
            border-color: #0EA5E9;
            background-color: rgba(14, 165, 233, 0.1);
        }
        .radio-custom:checked + div .radio-dot {
            background-color: #0EA5E9;
            transform: scale(1);
        }
    </style>
</head>
<body class="text-slate-200 font-sans selection:bg-sky-500 selection:text-white flex items-center justify-center h-screen max-h-[1000px] w-full">

    <div class="w-full h-full flex flex-col md:flex-row">
        
        <!-- Left Panel: Controls & Telemetry -->
        <aside class="w-full md:w-[400px] lg:w-[420px] bg-slate-900 border-b md:border-b-0 md:border-r border-slate-700 flex flex-col z-10 shadow-2xl h-[45vh] md:h-full shrink-0">
            
            <!-- Header -->
            <div class="p-6 pb-4 border-b border-slate-800">
                <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-sky-400 to-blue-500 leading-tight">
                    Rate of Reaction Lab
                </h1>
                <p class="text-xs text-slate-400 mt-1">Mg(s) + 2HCl(aq) → MgCl₂(aq) + H₂(g)</p>
            </div>

            <div class="flex flex-col flex-grow overflow-y-auto no-scrollbar p-6 space-y-6">
                
                <!-- Independent Variables -->
                <div class="space-y-5">
                    <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider border-b border-slate-800 pb-2">Independent Variables</h2>
                    
                    <!-- Concentration -->
                    <div>
                        <div class="flex justify-between items-end mb-2">
                            <label class="text-sm font-medium text-slate-300">Acid Molarity [HCl]</label>
                            <span id="val-conc" class="font-mono text-sky-400 font-bold">1.0 M</span>
                        </div>
                        <input type="range" id="slider-conc" min="0.5" max="2.0" step="0.1" value="1.0">
                    </div>

                    <!-- Temperature -->
                    <div>
                        <div class="flex justify-between items-end mb-2">
                            <label class="text-sm font-medium text-slate-300">Temperature (T)</label>
                            <span id="val-temp" class="font-mono text-rose-400 font-bold">25 °C</span>
                        </div>
                        <input type="range" id="slider-temp" min="20" max="60" step="1" value="25">
                    </div>

                    <!-- Surface Area -->
                    <div>
                        <label class="text-sm font-medium text-slate-300 mb-2 block">Metal Form (Surface Area)</label>
                        <div class="grid grid-cols-3 gap-2">
                            <label class="cursor-pointer relative">
                                <input type="radio" name="sa-form" value="block" class="radio-custom sr-only" checked>
                                <div class="border border-slate-700 rounded-lg p-2 flex flex-col items-center justify-center transition-colors">
                                    <div class="w-3 h-3 rounded-full border-2 border-slate-500 mb-1 flex items-center justify-center">
                                        <div class="w-1.5 h-1.5 rounded-full bg-transparent transform scale-0 transition-transform radio-dot"></div>
                                    </div>
                                    <span class="text-xs text-slate-300">Block</span>
                                </div>
                            </label>
                            <label class="cursor-pointer relative">
                                <input type="radio" name="sa-form" value="granules" class="radio-custom sr-only">
                                <div class="border border-slate-700 rounded-lg p-2 flex flex-col items-center justify-center transition-colors">
                                    <div class="w-3 h-3 rounded-full border-2 border-slate-500 mb-1 flex items-center justify-center">
                                        <div class="w-1.5 h-1.5 rounded-full bg-transparent transform scale-0 transition-transform radio-dot"></div>
                                    </div>
                                    <span class="text-xs text-slate-300">Granules</span>
                                </div>
                            </label>
                            <label class="cursor-pointer relative">
                                <input type="radio" name="sa-form" value="powder" class="radio-custom sr-only">
                                <div class="border border-slate-700 rounded-lg p-2 flex flex-col items-center justify-center transition-colors">
                                    <div class="w-3 h-3 rounded-full border-2 border-slate-500 mb-1 flex items-center justify-center">
                                        <div class="w-1.5 h-1.5 rounded-full bg-transparent transform scale-0 transition-transform radio-dot"></div>
                                    </div>
                                    <span class="text-xs text-slate-300">Powder</span>
                                </div>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Control Buttons -->
                <div class="flex gap-3 pt-2 border-t border-slate-800">
                    <button id="btn-start" class="flex-grow bg-gradient-to-r from-sky-600 to-blue-600 hover:from-sky-500 hover:to-blue-500 text-white font-bold py-3 rounded-xl transition-all shadow-lg active:scale-[0.98]">
                        Start Experiment
                    </button>
                    <button id="btn-reset" class="px-6 bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-200 font-bold py-3 rounded-xl transition-all active:scale-[0.98]">
                        Reset
                    </button>
                </div>

                <!-- Collision Theory Telemetry -->
                <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 shadow-inner flex flex-col gap-3">
                    <h2 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest border-b border-slate-800 pb-2">
                        Kinetics Telemetry
                    </h2>
                    
                    <div class="flex justify-between items-end">
                        <span class="text-xs text-slate-400">Current Rate (dV/dt)</span>
                        <div class="flex items-baseline gap-1">
                            <span id="tel-rate" class="font-mono text-xl text-emerald-400">0.00</span>
                            <span class="text-[10px] text-slate-500">cm³/s</span>
                        </div>
                    </div>
                    
                    <div class="flex justify-between items-end">
                        <span class="text-xs text-slate-400">Total Volume (V)</span>
                        <div class="flex items-baseline gap-1">
                            <span id="tel-vol" class="font-mono text-xl text-sky-400">0.0</span>
                            <span class="text-[10px] text-slate-500">cm³</span>
                        </div>
                    </div>
                    
                    <div class="flex justify-between items-end">
                        <span class="text-xs text-slate-400">Apparent k (k_obs)</span>
                        <span id="tel-k" class="font-mono text-sm text-purple-400">0.000</span>
                    </div>
                </div>

            </div>
        </aside>

        <!-- Right Panel: Visualizer & Graph -->
        <main class="flex-grow relative bg-slate-950 flex flex-col h-[55vh] md:h-full overflow-hidden">
            
            <!-- Top Half: p5.js Laboratory -->
            <div id="p5-container" class="w-full h-1/2 border-b border-slate-800 relative bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-slate-900 to-slate-950">
                <!-- p5.js canvas mounts here -->
            </div>

            <!-- Bottom Half: Chart.js Graph -->
            <div class="w-full h-1/2 p-4 relative">
                <canvas id="reactionChart"></canvas>
            </div>

        </main>

    </div>

    <!-- Application Logic -->
    <script>
        // --- GLOBAL SIMULATION STATE ---
        let simState = {
            isRunning: false,
            time: 0,
            volume: 0,
            maxVolume: 100, // cm^3
            rate: 0,
            k_obs: 0,
            
            // Parameters
            conc: 1.0,
            temp: 25,
            form: 'block',
            
            // Visual Data
            bubbles: [],
            chartData: []
        };

        let myChart;

        // --- DOM ELEMENTS ---
        const ui = {
            sliderConc: document.getElementById('slider-conc'),
            sliderTemp: document.getElementById('slider-temp'),
            valConc: document.getElementById('val-conc'),
            valTemp: document.getElementById('val-temp'),
            radiosForm: document.getElementsByName('sa-form'),
            btnStart: document.getElementById('btn-start'),
            btnReset: document.getElementById('btn-reset'),
            telRate: document.getElementById('tel-rate'),
            telVol: document.getElementById('tel-vol'),
            telK: document.getElementById('tel-k')
        };

        // --- CHART.JS SETUP ---
        function initChart() {
            const ctx = document.getElementById('reactionChart').getContext('2d');
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: [{
                        label: 'Volume of H₂ (cm³)',
                        data: simState.chartData,
                        borderColor: '#0EA5E9', // Sky 500
                        backgroundColor: 'rgba(14, 165, 233, 0.1)',
                        borderWidth: 2,
                        pointRadius: 0,
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false, // Turn off for real-time performance
                    scales: {
                        x: {
                            type: 'linear',
                            title: { display: true, text: 'Time (s)', color: '#94A3B8' },
                            min: 0,
                            max: 60, // Auto-scales later if needed
                            grid: { color: '#1E293B' },
                            ticks: { color: '#64748B' }
                        },
                        y: {
                            title: { display: true, text: 'Volume (cm³)', color: '#94A3B8' },
                            min: 0,
                            max: 110,
                            grid: { color: '#1E293B' },
                            ticks: { color: '#64748B' }
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: { enabled: false }
                    }
                }
            });
        }

        function updateChart() {
            // Auto expand X axis if needed
            if (simState.time > myChart.options.scales.x.max - 5) {
                myChart.options.scales.x.max += 60;
            }
            myChart.update();
        }

        // --- KINETICS ENGINE ---
        function calculateConstants() {
            // Base rate constant
            const k_base = 0.008; 
            
            // Surface Area multiplier
            let sa_factor = 1;
            if (simState.form === 'granules') sa_factor = 3.5;
            if (simState.form === 'powder') sa_factor = 10.0;
            
            // Concentration multiplier (Order = 1 with respect to [HCl] for visual pacing, realistically it's complex, let's use 1.5 to show strong effect)
            let conc_factor = Math.pow(simState.conc, 1.5);
            
            // Temperature multiplier (Arrhenius approximation: rate doubles every ~10 deg C)
            // 1.0717^10 ≈ 2.0
            let temp_factor = Math.pow(1.0717, simState.temp - 20);
            
            simState.k_obs = k_base * sa_factor * conc_factor * temp_factor;
            ui.telK.innerText = simState.k_obs.toFixed(4);
        }

        function stepPhysics(deltaTimeSec) {
            if (!simState.isRunning || simState.volume >= simState.maxVolume * 0.999) {
                if (simState.isRunning && simState.volume >= simState.maxVolume * 0.999) {
                    ui.btnStart.innerText = "Completed";
                    simState.isRunning = false;
                    simState.rate = 0;
                    updateTelemetry();
                }
                return;
            }

            // Time step
            simState.time += deltaTimeSec;

            // Integration: V(t) = V_max * (1 - e^(-kt))
            const newVol = simState.maxVolume * (1 - Math.exp(-simState.k_obs * simState.time));
            
            // Rate: dV/dt = V_max * k * e^(-kt)
            simState.rate = simState.maxVolume * simState.k_obs * Math.exp(-simState.k_obs * simState.time);
            
            simState.volume = newVol;

            // Update Chart Data array
            simState.chartData.push({ x: simState.time, y: simState.volume });

            updateTelemetry();
        }

        function updateTelemetry() {
            ui.telVol.innerText = simState.volume.toFixed(1);
            ui.telRate.innerText = simState.rate.toFixed(2);
        }

        // --- P5.JS VISUAL LABORATORY ---
        const sketch = (p) => {
            let cx, cy; // Center of canvas
            let lastChartUpdate = 0;

            p.setup = () => {
                const container = document.getElementById('p5-container');
                p.createCanvas(container.offsetWidth, container.offsetHeight);
                cx = p.width / 2;
                cy = p.height / 2;
                p.frameRate(60);
            };

            p.draw = () => {
                p.clear();

                // 1. Step Physics Engine (using real delta time)
                let dt = p.deltaTime / 1000.0; 
                // Speed up simulation time slightly for better UX (1 real sec = 2 sim secs)
                if (simState.isRunning) stepPhysics(dt * 2.0); 

                // 2. Draw Apparatus
                drawApparatus(p);

                // 3. Update Chart every ~100ms
                if (simState.isRunning && p.millis() - lastChartUpdate > 100) {
                    updateChart();
                    lastChartUpdate = p.millis();
                }
            };

            p.windowResized = () => {
                const container = document.getElementById('p5-container');
                p.resizeCanvas(container.offsetWidth, container.offsetHeight);
                cx = p.width / 2;
                cy = p.height / 2;
            };

            function drawApparatus(p) {
                p.push();
                
                // Layout logic
                const flaskX = p.width * 0.3;
                const flaskY = p.height * 0.7;
                const syringeX = p.width * 0.55;
                const syringeY = p.height * 0.3;

                // --- 1. Draw Liquid in Flask ---
                p.fill(14, 165, 233, 50); // rxn.acid
                p.noStroke();
                p.beginShape();
                p.vertex(flaskX - 45, flaskY + 45);
                p.vertex(flaskX + 45, flaskY + 45);
                p.vertex(flaskX + 30, flaskY - 10);
                p.vertex(flaskX - 30, flaskY - 10);
                p.endShape(p.CLOSE);

                // --- 2. Draw Magnesium ---
                p.fill('#94A3B8');
                p.stroke('#64748B');
                p.strokeWeight(1);
                
                // Diminish mass as volume increases (volume represents consumed Mg)
                const massRemaining = 1.0 - (simState.volume / simState.maxVolume);
                
                if (massRemaining > 0.01) {
                    if (simState.form === 'block') {
                        let size = 30 * Math.sqrt(massRemaining);
                        p.rect(flaskX - size/2, flaskY + 45 - size, size, size, 4);
                    } 
                    else if (simState.form === 'granules') {
                        p.randomSeed(42); // Consistent layout
                        let num = 8;
                        for(let i=0; i<num; i++) {
                            let size = 12 * Math.sqrt(massRemaining);
                            let rx = flaskX - 25 + p.random(50);
                            let ry = flaskY + 45 - size/2 - p.random(10);
                            p.circle(rx, ry, size);
                        }
                    } 
                    else if (simState.form === 'powder') {
                        p.randomSeed(42);
                        let num = 40;
                        for(let i=0; i<num; i++) {
                            let size = 4 * Math.sqrt(massRemaining);
                            let rx = flaskX - 35 + p.random(70);
                            let ry = flaskY + 45 - size/2 - p.random(15);
                            p.circle(rx, ry, size);
                        }
                    }
                }

                // --- 3. Draw Bubbles ---
                // Spawn bubbles based on rate
                if (simState.isRunning && simState.rate > 0.1) {
                    // Number of bubbles to spawn this frame
                    let spawnCount = Math.floor(simState.rate * 0.2); 
                    if (p.random() < (simState.rate * 0.2) % 1) spawnCount++;
                    
                    for(let i=0; i<spawnCount; i++) {
                        simState.bubbles.push({
                            x: flaskX + p.random(-30, 30),
                            y: flaskY + 40,
                            r: p.random(2, 6),
                            speed: p.random(1, 3)
                        });
                    }
                }

                // Update and draw bubbles
                p.fill('rgba(255, 255, 255, 0.6)');
                p.noStroke();
                for (let i = simState.bubbles.length - 1; i >= 0; i--) {
                    let b = simState.bubbles[i];
                    b.y -= b.speed;
                    // Wiggle
                    b.x += p.sin(b.y * 0.1) * 0.5;
                    p.circle(b.x, b.y, b.r);
                    
                    // Remove if reaches top of liquid
                    if (b.y < flaskY - 10) {
                        simState.bubbles.splice(i, 1);
                    }
                }

                // --- 4. Draw Flask Outline ---
                p.stroke('#CBD5E1'); // Slate 300
                p.strokeWeight(3);
                p.noFill();
                p.beginShape();
                // Left side
                p.vertex(flaskX - 15, flaskY - 60); // Lip
                p.vertex(flaskX - 15, flaskY - 30); // Neck
                p.vertex(flaskX - 50, flaskY + 40); // Base curve
                p.vertex(flaskX - 40, flaskY + 50); // Bottom left
                // Bottom
                p.vertex(flaskX + 40, flaskY + 50); // Bottom right
                // Right side
                p.vertex(flaskX + 50, flaskY + 40); // Base curve
                p.vertex(flaskX + 15, flaskY - 30); // Neck
                p.vertex(flaskX + 15, flaskY - 60); // Lip
                p.endShape();

                // Rubber bung
                p.fill('#475569'); // Slate 600
                p.noStroke();
                p.rect(flaskX - 15, flaskY - 65, 30, 15, 2);

                // --- 5. Draw Delivery Tube ---
                p.stroke('#94A3B8');
                p.strokeWeight(6);
                p.noFill();
                p.beginShape();
                p.vertex(flaskX, flaskY - 60); // Through bung
                p.vertex(flaskX, flaskY - 80); // Up
                p.vertex(syringeX - 20, flaskY - 80); // Across
                p.vertex(syringeX - 20, syringeY); // Down to syringe
                p.vertex(syringeX, syringeY); // Into syringe
                p.endShape();
                // Inner hollow tube for visuals
                p.stroke('#0F172A');
                p.strokeWeight(2);
                p.beginShape();
                p.vertex(flaskX, flaskY - 60);
                p.vertex(flaskX, flaskY - 80);
                p.vertex(syringeX - 20, flaskY - 80);
                p.vertex(syringeX - 20, syringeY);
                p.vertex(syringeX, syringeY);
                p.endShape();

                // --- 6. Draw Gas Syringe ---
                // Syringe Body
                p.fill('rgba(255,255,255,0.05)');
                p.stroke('#64748B');
                p.strokeWeight(2);
                p.rect(syringeX, syringeY - 15, 200, 30, 2);
                
                // Syringe Markings
                p.stroke('rgba(255,255,255,0.2)');
                p.strokeWeight(1);
                for(let i=10; i<190; i+=10) {
                    let h = (i % 50 === 0) ? 10 : 5;
                    p.line(syringeX + i, syringeY + 15, syringeX + i, syringeY + 15 - h);
                }

                // Plunger
                // Calculate plunger position based on volume (0 to 100 mapped to 0 to 180px)
                let plungerDist = p.map(simState.volume, 0, 100, 0, 180);
                
                p.fill('#475569');
                p.stroke('#334155');
                // Plunger Head
                p.rect(syringeX + plungerDist, syringeY - 13, 8, 26, 2);
                // Plunger Shaft
                p.rect(syringeX + plungerDist + 8, syringeY - 3, 50, 6);
                // Plunger Handle
                p.rect(syringeX + plungerDist + 58, syringeY - 10, 8, 20, 2);

                p.pop();
            }
        };

        // --- DOM EVENT LISTENERS ---
        
        function updateUIState() {
            // Read inputs
            simState.conc = parseFloat(ui.sliderConc.value);
            simState.temp = parseInt(ui.sliderTemp.value);
            
            for (let radio of ui.radiosForm) {
                if (radio.checked) simState.form = radio.value;
            }

            // Update Labels
            ui.valConc.innerText = simState.conc.toFixed(1) + ' M';
            ui.valTemp.innerText = simState.temp + ' °C';

            calculateConstants();
        }

        ui.sliderConc.addEventListener('input', updateUIState);
        ui.sliderTemp.addEventListener('input', updateUIState);
        ui.radiosForm.forEach(r => r.addEventListener('change', updateUIState));

        ui.btnStart.addEventListener('click', () => {
            if (!simState.isRunning && simState.volume < simState.maxVolume) {
                simState.isRunning = true;
                ui.btnStart.innerText = "Pause Experiment";
                ui.sliderConc.disabled = true;
                ui.sliderTemp.disabled = true;
                ui.radiosForm.forEach(r => r.disabled = true);
            } else {
                simState.isRunning = false;
                ui.btnStart.innerText = simState.volume >= simState.maxVolume ? "Completed" : "Resume Experiment";
            }
        });

        ui.btnReset.addEventListener('click', () => {
            simState.isRunning = false;
            simState.time = 0;
            simState.volume = 0;
            simState.rate = 0;
            simState.chartData.length = 0; // Clear array while keeping reference
            simState.bubbles = [];
            
            ui.btnStart.innerText = "Start Experiment";
            ui.sliderConc.disabled = false;
            ui.sliderTemp.disabled = false;
            ui.radiosForm.forEach(r => r.disabled = false);

            myChart.options.scales.x.max = 60; // Reset chart scale
            myChart.update();
            updateTelemetry();
        });

        // --- BOOTSTRAP ---
        initChart();
        updateUIState();
        new p5(sketch, 'p5-container');

    </script>
</body>
</html>
