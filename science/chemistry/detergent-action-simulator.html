<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soap and Detergent Cleansing Action Animation | Simulator</title>
    <meta name="description" content="Soap and detergent cleansing action animation. A physics-based particulate simulation modeling amphiphilic surfactant molecules, emulsification, and micelle formation.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { 
            margin: 0; 
            background-color: #0F172A; 
            color: #E2E8F0;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow-x: hidden;
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Custom range sliders */
        input[type="range"] {
            -webkit-appearance: none;
            background: transparent;
            width: 100%;
        }
        input[type="range"]::-webkit-slider-runnable-track {
            height: 8px;
            border-radius: 4px;
            background: #1E293B;
            border: 1px solid #334155;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: currentColor;
            margin-top: -9px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            transition: transform 0.1s;
            border: 2px solid white;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }

        @keyframes agitateSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .anim-spin-fast {
            animation: agitateSpin 0.5s linear infinite;
        }
    </style>
</head>
<body>

    <div id="root" class="w-full min-h-screen max-h-[1200px] flex justify-center items-center p-2 md:p-4"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- PHYSICS ENGINE CONSTANTS ---
        const CANVAS_W = 800;
        const CANVAS_H = 500;
        const FABRIC_Y = 430; // Where the fabric surface starts
        
        const MAX_DETERGENTS = 250;
        const OIL_BLOBS_INIT = [
            { id: 1, x: 400, y: FABRIC_Y - 45, r: 70, attached: true, vx: 0, vy: 0, coverage: 0 }
        ];

        function App() {
            // --- STATE ---
            const [detergentLevel, setDetergentLevel] = useState(0); // 0 to 100
            const [isAgitating, setIsAgitating] = useState(false);
            const [statusMsg, setStatusMsg] = useState("Oil is strongly bound to the fabric surface. Add detergent to begin.");

            const canvasRef = useRef(null);
            const requestRef = useRef();

            // Mutable physics state (refs to avoid React render lag)
            const engineState = useRef({
                oil: JSON.parse(JSON.stringify(OIL_BLOBS_INIT)),
                detergents: [], // { x, y, vx, vy, angle }
                agitationTimer: 0
            });

            // --- PHYSICS ENGINE LOOP ---
            const updatePhysics = () => {
                const state = engineState.current;
                const activeDetergentCount = Math.floor((detergentLevel / 100) * MAX_DETERGENTS);

                // 1. Manage Detergent Population
                while (state.detergents.length < activeDetergentCount) {
                    state.detergents.push({
                        x: Math.random() * CANVAS_W,
                        y: Math.random() * (CANVAS_H / 3), // Spawn near top
                        vx: (Math.random() - 0.5) * 2,
                        vy: Math.random() * 2,
                        angle: Math.random() * Math.PI * 2
                    });
                }
                while (state.detergents.length > activeDetergentCount) {
                    state.detergents.pop();
                }

                // Agitation Mechanics
                let agitationForce = 0;
                if (state.agitationTimer > 0) {
                    agitationForce = 3.0; // High random kinetic energy
                    state.agitationTimer--;
                    if (state.agitationTimer === 0) setIsAgitating(false);
                }

                // Reset oil coverage trackers
                state.oil.forEach(o => o.coverage = 0);

                // 2. Detergent Kinematics (Amphiphilic Behavior)
                state.detergents.forEach(d => {
                    // Brownian motion / Water flow
                    d.vx += (Math.random() - 0.5) * (0.2 + agitationForce);
                    d.vy += (Math.random() - 0.5) * (0.2 + agitationForce);

                    // Find nearest oil droplet
                    let nearestOil = null;
                    let minDist = Infinity;
                    
                    state.oil.forEach(o => {
                        const dist = Math.hypot(o.x - d.x, o.y - d.y);
                        if (dist < minDist) {
                            minDist = dist;
                            nearestOil = o;
                        }
                    });

                    // Interaction with Oil (Hydrophobic tail attracts, Hydrophilic head stays out)
                    if (nearestOil && minDist < nearestOil.r + 80) {
                        // Angle towards the center of the oil
                        const angleToOil = Math.atan2(nearestOil.y - d.y, nearestOil.x - d.x);
                        
                        // Rotate detergent so tail points IN (angle is head->tail, so we point tail at oil)
                        // Soft angle interpolation for smooth turning
                        const targetAngle = angleToOil;
                        d.angle += Math.atan2(Math.sin(targetAngle - d.angle), Math.cos(targetAngle - d.angle)) * 0.1;

                        // Spring force to attach to the surface of the oil droplet
                        const targetDist = nearestOil.r + 6; // Sit just on the boundary
                        const springForce = (minDist - targetDist) * 0.05;
                        
                        d.vx += Math.cos(angleToOil) * springForce;
                        d.vy += Math.sin(angleToOil) * springForce;

                        // Track how many are attached for micelle logic
                        if (minDist < nearestOil.r + 15) {
                            nearestOil.coverage += 1;
                        }
                    }

                    // Water surface boundary (float down)
                    if (d.y < 20) d.vy += 0.5;
                    
                    // Fabric boundary (bounce)
                    if (d.y > FABRIC_Y - 5) { d.y = FABRIC_Y - 5; d.vy *= -0.5; }

                    // Walls
                    if (d.x < 10) { d.x = 10; d.vx *= -0.5; }
                    if (d.x > CANVAS_W - 10) { d.x = CANVAS_W - 10; d.vx *= -0.5; }

                    // Apply velocity with friction
                    d.x += d.vx;
                    d.y += d.vy;
                    d.vx *= 0.92;
                    d.vy *= 0.92;
                });

                // 3. Oil Droplet Kinematics
                let totalDetached = 0;
                let nextOil = [];
                
                // Step 3a: Emulsification (Splitting of large droplets)
                state.oil.forEach(o => {
                    // Split condition: Agitating, has some detergent coverage, and is large enough
                    if (state.agitationTimer > 0 && o.r > 25 && o.coverage > o.r * 0.3 && Math.random() < 0.08) {
                        const newR = o.r * 0.707; // Conservation of area
                        nextOil.push({ ...o, id: Math.random(), r: newR, x: o.x - 12, vx: o.vx - 3, attached: o.attached });
                        nextOil.push({ ...o, id: Math.random(), r: newR, x: o.x + 12, vx: o.vx + 3, attached: o.attached });
                    } else {
                        nextOil.push(o);
                    }
                });
                state.oil = nextOil;

                // Step 3b: Micelle-Micelle Electrostatic Repulsion
                for (let i = 0; i < state.oil.length; i++) {
                    for (let j = i + 1; j < state.oil.length; j++) {
                        const o1 = state.oil[i];
                        const o2 = state.oil[j];
                        const dx = o1.x - o2.x;
                        const dy = o1.y - o2.y;
                        const dist = Math.hypot(dx, dy);
                        // Buffer size represents the negatively charged hydrophilic heads repelling
                        const minDist = o1.r + o2.r + 25; 
                        
                        if (dist < minDist && dist > 0) {
                            const force = (minDist - dist) * 0.08; 
                            o1.vx += (dx / dist) * force;
                            o1.vy += (dy / dist) * force;
                            o2.vx -= (dx / dist) * force;
                            o2.vy -= (dy / dist) * force;
                        }
                    }
                }

                // Step 3c: Movement & Detachment
                state.oil.forEach(o => {
                    // Determine if it should detach from fabric
                    const requiredCoverage = o.r * 0.5;
                    
                    if (o.attached && o.coverage >= requiredCoverage && state.agitationTimer > 0) {
                        o.attached = false; // Emulsified and lifted!
                    }

                    if (o.attached) {
                        // Stuck to fabric
                        o.vy += 0.5; // Gravity pulling down onto fabric
                        if (o.y > FABRIC_Y - o.r / 2) {
                            o.y = FABRIC_Y - o.r / 2;
                            o.vy = 0;
                        }
                        // Slight jiggle if agitating
                        if (state.agitationTimer > 0) {
                            o.x += (Math.random() - 0.5) * 3;
                        }
                    } else {
                        // Free floating Micelle
                        totalDetached++;
                        
                        // Buoyancy / drifting up
                        o.vy -= 0.04; 
                        
                        // Agitation forces
                        if (state.agitationTimer > 0) {
                            o.vx += (Math.random() - 0.5) * 2;
                            o.vy += (Math.random() - 0.5) * 2;
                        }

                        // Bounce off walls
                        if (o.x < o.r + 10) { o.x = o.r + 10; o.vx *= -0.5; }
                        if (o.x > CANVAS_W - o.r - 10) { o.x = CANVAS_W - o.r - 10; o.vx *= -0.5; }
                        
                        // Bounce off fabric (electrostatic repulsion prevents redeposition)
                        if (o.y > FABRIC_Y - o.r - 10) { o.y = FABRIC_Y - o.r - 10; o.vy *= -0.5; }
                        
                        // Float near surface
                        if (o.y < o.r + 20) { o.y = o.r + 20; o.vy *= -0.5; }
                    }

                    o.x += o.vx;
                    o.y += o.vy;
                    o.vx *= 0.90; // Friction
                    o.vy *= 0.90; // Friction
                });

                // 4. Status Message Updates
                if (totalDetached === state.oil.length && state.oil.length > 1) {
                    setStatusMsg("Oil emulsified! Micelles repel each other due to negative charges, preventing redeposition.");
                } else if (totalDetached > 0) {
                    setStatusMsg("Emulsification in progress. Large stains are breaking apart and lifting off!");
                } else if (detergentLevel > 20) {
                    setStatusMsg("Surfactants are surrounding the oil. Mechanical agitation is needed to lift it.");
                } else {
                    setStatusMsg("Oil is strongly bound to the fabric surface. Add detergent to begin.");
                }

                // 5. Draw Everything
                drawCanvas();

                requestRef.current = requestAnimationFrame(updatePhysics);
            };

            const drawCanvas = () => {
                const ctx = canvasRef.current.getContext('2d');
                const state = engineState.current;

                // Clear Water Background
                ctx.fillStyle = '#0F172A'; // Slate 900 base
                ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
                
                // Draw Water Tint based on detergent level
                ctx.fillStyle = `rgba(14, 165, 233, ${0.1 + (detergentLevel / 100) * 0.2})`; // Sky blue tint
                ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

                // Draw Fabric Bottom
                ctx.fillStyle = '#1E293B';
                ctx.fillRect(0, FABRIC_Y, CANVAS_W, CANVAS_H - FABRIC_Y);
                // Fabric texture lines
                ctx.strokeStyle = '#334155';
                ctx.lineWidth = 2;
                for (let i = 0; i < CANVAS_W; i += 20) {
                    ctx.beginPath(); ctx.moveTo(i, FABRIC_Y); ctx.lineTo(i + 20, CANVAS_H); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(i + 20, FABRIC_Y); ctx.lineTo(i, CANVAS_H); ctx.stroke();
                }

                // Draw Oil Droplets
                state.oil.forEach(o => {
                    ctx.beginPath();
                    ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
                    
                    // Create gradient for 3D oil look
                    const grd = ctx.createRadialGradient(o.x - o.r/3, o.y - o.r/3, o.r/10, o.x, o.y, o.r);
                    grd.addColorStop(0, '#FCD34D'); // Amber/Gold light
                    grd.addColorStop(1, '#B45309'); // Dark amber shadow
                    
                    ctx.fillStyle = grd;
                    ctx.fill();
                    ctx.strokeStyle = '#78350F';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                });

                // Draw Detergent Molecules
                state.detergents.forEach(d => {
                    ctx.save();
                    ctx.translate(d.x, d.y);
                    ctx.rotate(d.angle);

                    // Hydrophobic Tail (Zig-zag line pointing towards angle 0)
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(4, -3);
                    ctx.lineTo(8, 3);
                    ctx.lineTo(12, -3);
                    ctx.lineTo(16, 0);
                    ctx.strokeStyle = '#94A3B8'; // Slate 400
                    ctx.lineWidth = 1.5;
                    ctx.stroke();

                    // Hydrophilic Head (Circle at the base)
                    ctx.beginPath();
                    ctx.arc(0, 0, 4, 0, Math.PI * 2);
                    ctx.fillStyle = '#38BDF8'; // Sky blue
                    ctx.fill();
                    ctx.strokeStyle = '#0284C7';
                    ctx.lineWidth = 1;
                    ctx.stroke();

                    ctx.restore();
                });
            };

            // Init Engine
            useEffect(() => {
                requestRef.current = requestAnimationFrame(updatePhysics);
                return () => cancelAnimationFrame(requestRef.current);
            }, [detergentLevel]); // Depend on detergent level to sync the loop closure

            // --- USER ACTIONS ---
            const triggerAgitation = () => {
                engineState.current.agitationTimer = 180; // 3 seconds at 60fps
                setIsAgitating(true);
            };

            const resetSimulation = () => {
                engineState.current.oil = JSON.parse(JSON.stringify(OIL_BLOBS_INIT));
                engineState.current.detergents = [];
                engineState.current.agitationTimer = 0;
                setDetergentLevel(0);
                setIsAgitating(false);
            };

            return (
                <div className="w-full max-w-7xl h-full flex flex-col bg-slate-900 border border-slate-700 rounded-3xl shadow-2xl overflow-hidden">
                    
                    {/* Header */}
                    <header className="bg-slate-800/80 backdrop-blur p-5 border-b border-slate-700 flex flex-col md:flex-row justify-between items-center shrink-0 z-10 gap-4">
                        <div>
                            <h1 className="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-indigo-500">
                                Soap & Detergent Cleansing Action
                            </h1>
                            <p className="text-slate-400 text-xs mt-1 uppercase tracking-wider font-semibold">
                                Amphiphilic Micelle Emulsification Simulator
                            </p>
                        </div>
                        <button 
                            onClick={resetSimulation}
                            className="px-4 py-2 bg-slate-800 text-slate-300 text-xs font-bold uppercase tracking-widest rounded-lg border border-slate-600 hover:bg-slate-700 hover:text-white transition-colors"
                        >
                            Drain & Reset
                        </button>
                    </header>

                    {/* Main Workspace Layout */}
                    <div className="flex-grow flex flex-col lg:flex-row overflow-hidden relative">
                        
                        {/* LEFT PANEL: The Canvas "Washing Machine" */}
                        <div className="w-full lg:w-8/12 bg-slate-950 relative border-b lg:border-b-0 lg:border-r border-slate-700 overflow-hidden flex flex-col">
                            
                            {/* Live Status Banner */}
                            <div className="absolute top-4 left-4 right-4 bg-slate-800/80 backdrop-blur border border-slate-600 px-4 py-3 rounded-xl shadow-lg z-10 flex items-center gap-3">
                                <div className={`w-3 h-3 rounded-full shrink-0 ${engineState.current.oil.every(o => !o.attached) ? 'bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.8)]' : 'bg-amber-500 shadow-[0_0_8px_rgba(245,158,11,0.8)] animate-pulse'}`}></div>
                                <span className="text-sm text-slate-200 font-medium">{statusMsg}</span>
                            </div>

                            {/* Main Physics Canvas */}
                            <canvas 
                                ref={canvasRef} 
                                width={CANVAS_W} 
                                height={CANVAS_H} 
                                className="w-full h-full object-cover"
                            />

                        </div>

                        {/* RIGHT PANEL: Controls & Chemical Theory */}
                        <div className="w-full lg:w-4/12 flex flex-col z-10 overflow-y-auto hide-scrollbar bg-slate-900">
                            
                            {/* Controls Section */}
                            <div className="p-6 border-b border-slate-800 space-y-8 bg-slate-800/30">
                                
                                {/* Add Detergent Slider */}
                                <div>
                                    <div className="flex justify-between items-end mb-3">
                                        <label className="text-sm font-bold text-sky-400 uppercase tracking-widest flex items-center gap-2">
                                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                                            Add Detergent
                                        </label>
                                        <span className="font-mono text-sm text-sky-300 font-bold bg-sky-900/40 px-2 py-0.5 rounded border border-sky-500/30">
                                            {detergentLevel}%
                                        </span>
                                    </div>
                                    <input 
                                        type="range" min="0" max="100" step="1" 
                                        value={detergentLevel} 
                                        onChange={(e) => setDetergentLevel(parseInt(e.target.value))}
                                        className="text-sky-500"
                                    />
                                    <p className="text-[10px] text-slate-400 mt-3 leading-relaxed">
                                        Surfactant molecules enter the water. Watch how their hydrophobic tails naturally seek out and penetrate the non-polar oil droplet.
                                    </p>
                                </div>

                                {/* Mechanical Agitation Button */}
                                <div>
                                    <button 
                                        onClick={triggerAgitation}
                                        disabled={isAgitating}
                                        className={`w-full py-4 rounded-xl font-bold text-sm uppercase tracking-widest transition-all flex items-center justify-center gap-3 shadow-lg
                                            ${isAgitating 
                                                ? 'bg-indigo-900/50 text-indigo-300 border border-indigo-500/50 cursor-not-allowed' 
                                                : 'bg-indigo-600 hover:bg-indigo-500 text-white active:scale-[0.98]'}`}
                                    >
                                        <svg className={`w-5 h-5 ${isAgitating ? 'anim-spin-fast' : ''}`} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                                        {isAgitating ? 'Agitating Machine...' : 'Start Agitation'}
                                    </button>
                                    <p className="text-[10px] text-slate-400 mt-3 leading-relaxed">
                                        Mechanical action provides the kinetic energy needed to break the oil's attraction to the fabric, allowing the micelles to lift off into suspension.
                                    </p>
                                </div>
                                
                            </div>

                            {/* Educational Panel */}
                            <div className="p-6 flex-grow flex flex-col gap-5">
                                <h3 className="text-xs font-bold text-slate-500 uppercase tracking-widest border-b border-slate-800 pb-2">Molecular Structure</h3>
                                
                                {/* Molecule Legend */}
                                <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 flex items-center justify-center gap-6">
                                    {/* SVG Drawing of the Molecule */}
                                    <svg width="80" height="40" viewBox="0 0 80 40" className="shrink-0 drop-shadow-md">
                                        <path d="M 60 20 L 45 12 L 30 28 L 15 12 L 0 20" fill="none" stroke="#94A3B8" strokeWidth="3" strokeLinejoin="round"/>
                                        <circle cx="65" cy="20" r="10" fill="#38BDF8" stroke="#0284C7" strokeWidth="2" />
                                    </svg>
                                    <div className="text-xs text-slate-300 space-y-1">
                                        <div className="flex items-center gap-2">
                                            <span className="w-3 h-3 rounded-full bg-sky-400 border border-sky-600 inline-block"></span>
                                            <span className="font-bold text-sky-400">Hydrophilic Head</span>
                                            <span className="text-[10px] text-slate-500">(Polar, loves water)</span>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <span className="w-4 h-1 bg-slate-400 inline-block rounded"></span>
                                            <span className="font-bold text-slate-400">Hydrophobic Tail</span>
                                            <span className="text-[10px] text-slate-500">(Non-polar, loves oil)</span>
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-emerald-900/10 border border-emerald-500/20 p-4 rounded-xl mt-auto">
                                    <h4 className="text-sm font-bold text-emerald-400 mb-2">What is Emulsification?</h4>
                                    <p className="text-xs text-slate-300 leading-relaxed mb-3">
                                        Oil and water do not mix. Detergents act as an <strong>emulsifier</strong>. By surrounding the oil with their hydrophobic tails, they break large stains into spherical structures called <strong>Micelles</strong>.
                                    </p>
                                    <p className="text-xs text-slate-300 leading-relaxed">
                                        The outer surface of the micelle is coated in negatively-charged hydrophilic heads. These like charges <strong>repel each other</strong>, preventing the oil droplets from binding back together (redeposition)!
                                    </p>
                                </div>

                            </div>

                        </div>

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
