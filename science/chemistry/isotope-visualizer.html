<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isotope Visualizer | Nuclear Stability Engine</title>
    <meta name="description" content="Isotopes animation chemistry. Interactive nuclear physics and chemistry simulator visualizing atomic mass, stability, and nucleon packing.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React, ReactDOM, and Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { margin: 0; background-color: #0F172A; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; overflow: hidden; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* Subtle pulse for radioactive isotopes */
        @keyframes dangerPulse {
            0% { box-shadow: inset 0 0 20px rgba(234, 179, 8, 0.1); }
            50% { box-shadow: inset 0 0 50px rgba(234, 179, 8, 0.3); }
            100% { box-shadow: inset 0 0 20px rgba(234, 179, 8, 0.1); }
        }
        @keyframes toxicPulse {
            0% { box-shadow: inset 0 0 20px rgba(239, 68, 68, 0.1); }
            50% { box-shadow: inset 0 0 60px rgba(239, 68, 68, 0.4); }
            100% { box-shadow: inset 0 0 20px rgba(239, 68, 68, 0.1); }
        }
        .pulse-radioactive { animation: dangerPulse 3s infinite ease-in-out; }
        .pulse-unstable { animation: toxicPulse 2s infinite ease-in-out; }
    </style>
</head>
<body class="text-slate-200 h-screen w-full flex flex-col select-none">
    
    <div id="root" class="h-full w-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- SCIENTIFIC DATABASE: ISOTOPES ---
        const ELEMENTS = [
            { z: 1, symbol: 'H', name: 'Hydrogen', defaultN: 0 },
            { z: 2, symbol: 'He', name: 'Helium', defaultN: 2 },
            { z: 6, symbol: 'C', name: 'Carbon', defaultN: 6 },
            { z: 8, symbol: 'O', name: 'Oxygen', defaultN: 8 },
            { z: 17, symbol: 'Cl', name: 'Chlorine', defaultN: 18 },
            { z: 92, symbol: 'U', name: 'Uranium', defaultN: 146 }
        ];

        // Map of Mass Number (A) -> Isotope Data
        const ISOTOPE_DATA = {
            1: { // Hydrogen
                1: { type: 'stable', abundance: '99.98%', halfLife: 'Stable', notes: 'Protium: The only stable isotope without neutrons.' },
                2: { type: 'stable', abundance: '0.015%', halfLife: 'Stable', notes: 'Deuterium: Used in heavy water and nuclear reactors.' },
                3: { type: 'radioactive', abundance: 'Trace', halfLife: '12.32 years', notes: 'Tritium: Used in fusion reactors and self-powered lighting.' }
            },
            2: { // Helium
                3: { type: 'stable', abundance: '0.0001%', halfLife: 'Stable', notes: 'Helium-3: Rare on Earth, highly sought for nuclear fusion.' },
                4: { type: 'stable', abundance: '99.999%', halfLife: 'Stable', notes: 'Alpha particle: Extremely stable \'magic\' nucleus.' },
                5: { type: 'unstable', abundance: '0%', halfLife: '7.6×10⁻²² s', notes: 'Highly unstable. Instantly ejects a neutron.' }
            },
            6: { // Carbon
                11: { type: 'radioactive', abundance: '0%', halfLife: '20.3 minutes', notes: 'Used in PET scans in medicine.' },
                12: { type: 'stable', abundance: '98.9%', halfLife: 'Stable', notes: 'Standard basis for Atomic Mass.' },
                13: { type: 'stable', abundance: '1.1%', halfLife: 'Stable', notes: 'NMR active: Used heavily in organic chemistry analysis.' },
                14: { type: 'radioactive', abundance: 'Trace', halfLife: '5,730 years', notes: 'Basis of radiocarbon dating for organic materials.' }
            },
            8: { // Oxygen
                15: { type: 'radioactive', abundance: '0%', halfLife: '122 seconds', notes: 'Positron emitter used in medical imaging.' },
                16: { type: 'stable', abundance: '99.76%', halfLife: 'Stable', notes: 'Most abundant isotope of oxygen.' },
                17: { type: 'stable', abundance: '0.04%', halfLife: 'Stable', notes: 'NMR active oxygen isotope.' },
                18: { type: 'stable', abundance: '0.20%', halfLife: 'Stable', notes: 'Used in paleoclimatology to measure ancient global temperatures.' }
            },
            17: { // Chlorine
                35: { type: 'stable', abundance: '75.78%', halfLife: 'Stable', notes: 'Major isotope contributing to an atomic mass of ~35.5 amu.' },
                36: { type: 'radioactive', abundance: 'Trace', halfLife: '3.01×10⁵ years', notes: 'Cosmogenic isotope used for dating groundwater.' },
                37: { type: 'stable', abundance: '24.22%', halfLife: 'Stable', notes: 'Minor stable isotope.' }
            },
            92: { // Uranium
                233: { type: 'radioactive', abundance: '0%', halfLife: '1.59×10⁵ years', notes: 'Fissile material bred from Thorium-232.' },
                234: { type: 'radioactive', abundance: '0.005%', halfLife: '2.45×10⁵ years', notes: 'Trace isotope occurring in the U-238 decay chain.' },
                235: { type: 'radioactive', abundance: '0.72%', halfLife: '7.04×10⁸ years', notes: 'The primary fissile isotope used in nuclear reactors and weapons.' },
                238: { type: 'radioactive', abundance: '99.27%', halfLife: '4.47×10⁹ years', notes: 'Depleted uranium. Half-life is roughly the age of the Earth.' }
            }
        };

        function App() {
            const [selectedZ, setSelectedZ] = useState(6); // Default to Carbon
            const [neutronCount, setNeutronCount] = useState(6);

            const currentElement = ELEMENTS.find(e => e.z === selectedZ);
            const massNumber = selectedZ + neutronCount;
            
            // Look up isotope data; default to highly unstable
            const isotopeKey = ISOTOPE_DATA[selectedZ]?.[massNumber];
            const isotopeInfo = isotopeKey || { 
                type: 'unstable', 
                abundance: '0%', 
                halfLife: 'Extremely Short', 
                notes: 'Highly unstable or artificial isotope not found in nature.' 
            };

            // Event Handlers
            const handleElementChange = (e) => {
                const newZ = parseInt(e.target.value);
                const newEl = ELEMENTS.find(el => el.z === newZ);
                setSelectedZ(newZ);
                setNeutronCount(newEl.defaultN);
            };

            const addNeutron = () => setNeutronCount(n => n + 1);
            const removeNeutron = () => setNeutronCount(n => Math.max(0, n - 1));

            // Dynamic background class based on stability
            const canvasBgClass = isotopeInfo.type === 'stable' 
                ? 'bg-[#1A2235]' 
                : isotopeInfo.type === 'radioactive' 
                    ? 'bg-[#1A2235] pulse-radioactive' 
                    : 'bg-[#1A2235] pulse-unstable';

            return (
                <div className="bg-[#0F172A] text-slate-100 min-h-screen h-screen w-full flex flex-col font-sans overflow-hidden select-none">
                    
                    {/* HEADER */}
                    <header className="h-[10%] min-h-[70px] bg-[#1E293B] border-b border-slate-700 flex items-center justify-between px-4 md:px-8 shadow-md z-20 shrink-0">
                        <div>
                            <h1 className="text-xl md:text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-rose-400 to-orange-400 flex items-center gap-2">
                                ⚛️ Isotope Visualizer
                            </h1>
                            <p className="text-xs text-slate-400 mt-1 hidden md:block">Atomic Mass Balancing & Nuclear Stability Engine</p>
                        </div>
                        <div className="flex items-center gap-2 md:gap-4 bg-slate-900 border border-slate-700 px-3 py-1.5 md:py-2 rounded-lg">
                            <span className="text-[10px] md:text-xs font-bold text-slate-400 uppercase tracking-widest hidden sm:inline">Element:</span>
                            <select 
                                value={selectedZ} 
                                onChange={handleElementChange}
                                className="bg-slate-800 text-rose-300 font-bold border border-slate-600 rounded p-1 outline-none cursor-pointer"
                            >
                                {ELEMENTS.map(el => (
                                    <option key={el.z} value={el.z}>{el.name} ({el.symbol})</option>
                                ))}
                            </select>
                        </div>
                    </header>

                    {/* MAIN CONTENT AREA */}
                    <main className="flex-1 flex flex-col md:flex-row w-full p-4 gap-4 overflow-hidden">
                        
                        {/* LEFT PANEL: CONTROLS & ANALYSIS */}
                        <section className="w-full md:w-1/3 min-w-[320px] flex flex-col gap-4 overflow-y-auto custom-scrollbar pr-1 md:pr-2">
                            
                            {/* Isotope Notation Panel */}
                            <div className="bg-gradient-to-br from-[#1E293B] to-slate-900 rounded-xl border border-slate-700 p-6 shadow-lg flex items-center justify-center relative overflow-hidden shrink-0">
                                {/* Decorative Background */}
                                <div className="absolute top-0 left-0 w-32 h-32 bg-rose-500/10 rounded-full blur-3xl -ml-10 -mt-10 pointer-events-none"></div>
                                
                                {/* Proper Standard Isotopic Notation */}
                                <div className="flex items-center gap-1 z-10">
                                    <div className="flex flex-col items-end justify-center font-serif font-bold text-slate-300 mr-1 leading-none">
                                        <div className="text-orange-400 text-2xl md:text-3xl transition-all duration-300" title="Mass Number (Protons + Neutrons)">
                                            {massNumber}
                                        </div>
                                        <div className="text-rose-400 text-xl md:text-2xl transition-all duration-300 mt-0.5" title="Atomic Number (Protons)">
                                            {selectedZ}
                                        </div>
                                    </div>
                                    <div className="text-7xl md:text-8xl font-black text-white tracking-tighter drop-shadow-lg font-serif">
                                        {currentElement.symbol}
                                    </div>
                                </div>
                            </div>

                            {/* Nucleon Controls */}
                            <div className="bg-[#1E293B] rounded-xl border border-slate-700 p-5 shadow-lg flex flex-col gap-5 shrink-0">
                                <h2 className="text-xs font-bold text-slate-400 uppercase tracking-widest border-b border-slate-700 pb-2">Nuclear Composition</h2>
                                
                                {/* Protons (Fixed) */}
                                <div className="flex items-center justify-between bg-slate-900/50 p-3 rounded-lg border border-slate-700/50">
                                    <div className="flex items-center gap-3">
                                        <div className="w-8 h-8 rounded-full bg-rose-500/20 border-2 border-rose-500 text-rose-300 flex items-center justify-center font-black shadow-[0_0_10px_rgba(244,63,94,0.3)]">+</div>
                                        <div>
                                            <div className="text-sm font-bold text-slate-200">Protons (Z)</div>
                                            <div className="text-[10px] text-slate-500">Defines the Element</div>
                                        </div>
                                    </div>
                                    <div className="text-2xl font-mono font-bold text-rose-400 px-4">{selectedZ}</div>
                                </div>

                                {/* Neutrons (Variable) */}
                                <div className="flex items-center justify-between bg-slate-900/50 p-3 rounded-lg border border-orange-500/30 shadow-inner">
                                    <div className="flex items-center gap-3">
                                        <div className="w-8 h-8 rounded-full bg-orange-500/20 border-2 border-orange-500 text-orange-300 flex items-center justify-center font-black shadow-[0_0_10px_rgba(249,115,22,0.3)]">0</div>
                                        <div>
                                            <div className="text-sm font-bold text-slate-200">Neutrons (N)</div>
                                            <div className="text-[10px] text-orange-400/80">Defines the Isotope</div>
                                        </div>
                                    </div>
                                    
                                    <div className="flex items-center gap-2">
                                        <button onClick={removeNeutron} className="w-8 h-8 flex items-center justify-center bg-slate-700 hover:bg-slate-600 rounded font-bold text-xl transition-colors border border-slate-500 active:scale-95" disabled={neutronCount === 0}>-</button>
                                        <div className="text-2xl font-mono font-bold text-orange-400 min-w-[2.5rem] text-center">{neutronCount}</div>
                                        <button onClick={addNeutron} className="w-8 h-8 flex items-center justify-center bg-slate-700 hover:bg-slate-600 rounded font-bold text-xl transition-colors border border-slate-500 active:scale-95">+</button>
                                    </div>
                                </div>
                            </div>

                            {/* Stability & Data Dashboard */}
                            <div className="flex-1 min-h-[220px] bg-[#1E293B] rounded-xl border border-slate-700 p-5 shadow-lg flex flex-col gap-4">
                                <h2 className="text-xs font-bold text-slate-400 uppercase tracking-widest border-b border-slate-700 pb-2">Thermodynamic Stability</h2>
                                
                                {/* Stability Meter */}
                                <div className={`p-4 rounded-lg border-2 flex items-center gap-3 transition-colors duration-500 ${
                                    isotopeInfo.type === 'stable' ? 'bg-emerald-900/20 border-emerald-500/50 text-emerald-400' :
                                    isotopeInfo.type === 'radioactive' ? 'bg-amber-900/20 border-amber-500/50 text-amber-400' :
                                    'bg-red-900/20 border-red-500/50 text-red-400'
                                }`}>
                                    <div className="text-3xl drop-shadow-md">
                                        {isotopeInfo.type === 'stable' ? '✅' : isotopeInfo.type === 'radioactive' ? '⚠️' : '☢️'}
                                    </div>
                                    <div>
                                        <div className="font-black uppercase tracking-wider">
                                            {isotopeInfo.type === 'stable' ? 'Stable Isotope' : isotopeInfo.type === 'radioactive' ? 'Radioactive' : 'Highly Unstable'}
                                        </div>
                                        <div className="text-xs opacity-80 mt-1">
                                            {isotopeInfo.type === 'stable' 
                                                ? 'Does not decay over time.' 
                                                : `Decays to a more stable state. Half-life: ${isotopeInfo.halfLife}`}
                                        </div>
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 gap-4 mt-2">
                                    <div className="bg-slate-900 p-3 rounded border border-slate-700 shadow-inner">
                                        <div className="text-[10px] text-slate-400 uppercase tracking-wider mb-1">Natural Abundance</div>
                                        <div className="text-lg font-mono font-bold text-slate-200">{isotopeInfo.abundance}</div>
                                    </div>
                                    <div className="bg-slate-900 p-3 rounded border border-slate-700 shadow-inner flex flex-col justify-center">
                                        <div className="text-[10px] text-slate-400 uppercase tracking-wider mb-1">Atomic Mass (Approx)</div>
                                        <div className="text-lg font-mono font-bold text-slate-200">{massNumber} amu</div>
                                    </div>
                                </div>
                                
                                <div className="mt-auto pt-4 text-xs text-slate-400 italic bg-slate-900/30 p-3 rounded border border-slate-800">
                                    <strong>Note:</strong> {isotopeInfo.notes}
                                </div>
                            </div>
                        </section>

                        {/* RIGHT PANEL: NUCLEUS ANIMATION CANVAS */}
                        <section className={`w-full md:w-2/3 rounded-xl border border-slate-700 shadow-inner relative overflow-hidden flex flex-col items-center justify-center transition-all duration-1000 ${canvasBgClass}`}>
                            
                            <div className="absolute top-4 left-4 z-10 pointer-events-none">
                                <div className="bg-slate-900/80 backdrop-blur px-4 py-2 rounded-lg border border-slate-600 shadow-lg flex items-center gap-3">
                                    <span className="text-sm font-bold text-slate-200 uppercase tracking-wider">Nucleus Visualizer</span>
                                </div>
                            </div>
                            
                            <div className="absolute top-4 right-4 z-10 pointer-events-none flex flex-col md:flex-row gap-2 md:gap-4 text-[10px] font-bold uppercase">
                                <div className="flex items-center gap-1 bg-slate-900/80 backdrop-blur px-2 py-1 rounded border border-slate-700 shadow-lg">
                                    <span className="w-3 h-3 rounded-full bg-rose-500 shadow-[0_0_5px_rgba(244,63,94,1)]"></span> Proton (+)
                                </div>
                                <div className="flex items-center gap-1 bg-slate-900/80 backdrop-blur px-2 py-1 rounded border border-slate-700 shadow-lg">
                                    <span className="w-3 h-3 rounded-full bg-orange-500 shadow-[0_0_5px_rgba(249,115,22,1)]"></span> Neutron (0)
                                </div>
                            </div>

                            <div className="w-full h-full relative">
                                <NucleusCanvas protons={selectedZ} neutrons={neutronCount} />
                            </div>
                            
                            <div className="absolute bottom-6 font-mono text-slate-500 text-xs md:text-sm tracking-widest pointer-events-none opacity-50 bg-slate-900/50 px-3 py-1 rounded">
                                Rendering {massNumber} Nucleons (Fermat's Spiral)
                            </div>
                        </section>

                    </main>
                </div>
            );
        }

        // --- SUB-COMPONENT: CANVAS PHYSICS ENGINE ---
        function NucleusCanvas({ protons, neutrons }) {
            const canvasRef = useRef(null);
            const particlesRef = useRef([]);

            // Generate target packing positions using Fermat's Spiral for natural clustering
            useEffect(() => {
                const total = protons + neutrons;
                const particles = [];
                
                // Create unassigned array of types, then shuffle them so protons/neutrons mix naturally
                const types = Array(protons).fill('p').concat(Array(neutrons).fill('n'));
                // Simple Fisher-Yates shuffle
                for (let i = types.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [types[i], types[j]] = [types[j], types[i]];
                }

                // Dynamic scaling based on total nucleons to fit on screen
                // Base radius of a nucleon
                const baseR = total > 150 ? 6 : total > 50 ? 10 : 16; 
                const spacingFactor = baseR * 1.5;

                for (let i = 0; i < total; i++) {
                    // Fermat's spiral equation
                    const r = spacingFactor * Math.sqrt(i);
                    const theta = i * 137.508 * (Math.PI / 180); // Golden angle in radians

                    particles.push({
                        id: i,
                        type: types[i],
                        targetX: r * Math.cos(theta),
                        targetY: r * Math.sin(theta),
                        // Random offset for organic animation
                        phase: Math.random() * Math.PI * 2,
                        speed: 0.05 + Math.random() * 0.05,
                        radius: baseR
                    });
                }

                particlesRef.current = particles;
            }, [protons, neutrons]);

            // Animation Loop
            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let animationId;
                let time = 0;
                
                // Track dimensions to prevent clearing unless resized
                let currentWidth = canvas.clientWidth;
                let currentHeight = canvas.clientHeight;
                canvas.width = currentWidth;
                canvas.height = currentHeight;

                const render = () => {
                    // Handle Resize dynamically efficiently
                    if (canvas.clientWidth !== currentWidth || canvas.clientHeight !== currentHeight) {
                        currentWidth = canvas.clientWidth;
                        currentHeight = canvas.clientHeight;
                        canvas.width = currentWidth;
                        canvas.height = currentHeight;
                    }

                    const cx = canvas.width / 2;
                    const cy = canvas.height / 2;

                    ctx.clearRect(0, 0, canvas.width, canvas.height);

                    // Draw strong nuclear force "glow" binding them
                    if (particlesRef.current.length > 0) {
                        // Calculate approx bounding radius of the spiral
                        const maxR = Math.sqrt(particlesRef.current.length) * (particlesRef.current[0].radius * 1.5);
                        const glowGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, maxR * 1.5);
                        glowGrad.addColorStop(0, 'rgba(139, 92, 246, 0.2)'); // Violet glow for strong force
                        glowGrad.addColorStop(1, 'rgba(15, 23, 42, 0)');
                        ctx.fillStyle = glowGrad;
                        ctx.beginPath();
                        ctx.arc(cx, cy, maxR * 1.5, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    // Draw Nucleons
                    particlesRef.current.forEach(p => {
                        // Organic vibration simulating nuclear movement
                        const jiggleX = Math.cos(time * p.speed + p.phase) * (p.radius * 0.25);
                        const jiggleY = Math.sin(time * p.speed + p.phase) * (p.radius * 0.25);
                        
                        const x = cx + p.targetX + jiggleX;
                        const y = cy + p.targetY + jiggleY;

                        ctx.beginPath();
                        ctx.arc(x, y, p.radius, 0, Math.PI * 2);

                        if (p.type === 'p') {
                            // Proton Styling
                            ctx.fillStyle = '#F43F5E'; // Rose-500
                            ctx.fill();
                            
                            // Inner highlight for 3D effect
                            ctx.beginPath();
                            ctx.arc(x - p.radius*0.25, y - p.radius*0.25, p.radius*0.35, 0, Math.PI*2);
                            ctx.fillStyle = 'rgba(255,255,255,0.4)';
                            ctx.fill();

                            // Plus sign if big enough
                            if (p.radius > 8) {
                                ctx.fillStyle = 'rgba(255,255,255,0.9)';
                                ctx.textAlign = 'center';
                                ctx.textBaseline = 'middle';
                                ctx.font = `bold ${p.radius * 1.2}px sans-serif`;
                                ctx.fillText('+', x, y + 1);
                            }
                        } else {
                            // Neutron Styling
                            ctx.fillStyle = '#F97316'; // Orange-500
                            ctx.fill();

                            // Inner highlight for 3D effect
                            ctx.beginPath();
                            ctx.arc(x - p.radius*0.25, y - p.radius*0.25, p.radius*0.35, 0, Math.PI*2);
                            ctx.fillStyle = 'rgba(255,255,255,0.4)';
                            ctx.fill();
                        }
                    });

                    time += 1;
                    animationId = requestAnimationFrame(render);
                };

                render();

                return () => cancelAnimationFrame(animationId);
            }, []);

            return (
                <canvas 
                    ref={canvasRef} 
                    className="w-full h-full cursor-crosshair"
                />
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
