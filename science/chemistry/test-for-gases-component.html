<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>The Gas Detective - Testing for Gases Chemistry Interactive</title>
  <meta name="description" content="Testing for gases chemistry interactive simulator. Identify unknown gaseous products using empirical diagnostic logic like burning splints and limewater.">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for in-browser JSX transpilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { background-color: #0F172A; margin: 0; overflow: hidden; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    
    /* Custom Scrollbar */
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(30, 41, 59, 0.5); }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(71, 85, 105, 0.8); border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 1); }

    /* Drag over state */
    .drag-over {
      border-color: #38bdf8 !important;
      background-color: rgba(56, 189, 248, 0.1) !important;
      transform: scale(1.05);
    }

    /* Gas Bubbles */
    @keyframes bubble-rise {
      0% { transform: translateY(0) scale(0.8); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateY(-120px) scale(1.2); opacity: 0; }
    }
    .anim-bubble { animation: bubble-rise 2s infinite ease-in; }

    /* Starburst Squeaky Pop */
    @keyframes squeaky-pop {
      0% { transform: scale(0); opacity: 1; }
      50% { transform: scale(1.5); opacity: 1; }
      100% { transform: scale(2); opacity: 0; }
    }
    .anim-pop { animation: squeaky-pop 0.5s ease-out forwards; }

    /* Relighting Splint */
    @keyframes relight {
      0% { transform: scaleY(0.2); opacity: 0.5; }
      100% { transform: scaleY(1.5); opacity: 1; }
    }
    .anim-relight { animation: relight 0.5s ease-in forwards; transform-origin: bottom; }

    /* Splint Dying */
    @keyframes extinguish {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }
    .anim-extinguish { animation: extinguish 0.5s ease-in forwards; }

    /* Limewater Cloudiness */
    @keyframes milky {
      0% { fill: rgba(255, 255, 255, 0.05); }
      100% { fill: rgba(255, 255, 255, 0.8); }
    }
    .anim-milky { animation: milky 2s ease-in forwards; }

    /* Litmus Paper Dynamic Animations */
    @keyframes bleach-blue {
      0% { background-color: #3b82f6; } /* Blue */
      30% { background-color: #ef4444; } /* Red (Acidic intermediate) */
      100% { background-color: #f8fafc; } /* Bleached White */
    }
    .anim-bleach-blue { animation: bleach-blue 2.5s ease-in forwards; }

    @keyframes bleach-red {
      0% { background-color: #ef4444; } /* Red */
      100% { background-color: #f8fafc; } /* Bleached White */
    }
    .anim-bleach-red { animation: bleach-red 2.5s ease-in forwards; }

    @keyframes turn-blue {
      0% { background-color: #ef4444; } /* Red */
      100% { background-color: #3b82f6; } /* Blue */
    }
    .anim-turn-blue { animation: turn-blue 1.5s ease-in forwards; }

    @keyframes turn-red {
      0% { background-color: #3b82f6; } /* Blue */
      100% { background-color: #ef4444; } /* Red */
    }
    .anim-turn-red { animation: turn-red 1.5s ease-in forwards; }

    @keyframes drop-in {
      from { transform: translateY(-20px) translateX(-50%); opacity: 0; }
      to { transform: translateY(0) translateX(-50%); opacity: 1; }
    }
    .anim-drop-in { animation: drop-in 0.3s ease-out forwards; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- ICON COMPONENTS ---
    const SvgIcon = ({ children, size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
    );
    const Activity = (p) => <SvgIcon {...p}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12" /></SvgIcon>;
    const Info = (p) => <SvgIcon {...p}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></SvgIcon>;
    const Eye = (p) => <SvgIcon {...p}><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></SvgIcon>;
    const EyeOff = (p) => <SvgIcon {...p}><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></SvgIcon>;
    const RefreshCw = (p) => <SvgIcon {...p}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></SvgIcon>;
    const Flame = (p) => <SvgIcon {...p}><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></SvgIcon>;
    const Beaker = (p) => <SvgIcon {...p}><path d="M4.5 3h15"/><path d="M6 3v16a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V3"/><path d="M14 9h4"/></SvgIcon>;
    const FileText = (p) => <SvgIcon {...p}><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></SvgIcon>;
    const CheckCircle2 = (p) => <SvgIcon {...p}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></SvgIcon>;
    const XCircle = (p) => <SvgIcon {...p}><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></SvgIcon>;
    const Search = (p) => <SvgIcon {...p}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></SvgIcon>;

    // --- CHEMICAL DATABASE ---
    const GASES = [
      { id: 'h2', name: 'Hydrogen', formula: 'H₂', color: 'rgba(255, 255, 255, 0.05)', hint: 'Colorless' },
      { id: 'o2', name: 'Oxygen', formula: 'O₂', color: 'rgba(255, 255, 255, 0.05)', hint: 'Colorless' },
      { id: 'co2', name: 'Carbon Dioxide', formula: 'CO₂', color: 'rgba(255, 255, 255, 0.05)', hint: 'Colorless' },
      { id: 'cl2', name: 'Chlorine', formula: 'Cl₂', color: 'rgba(132, 204, 22, 0.15)', hint: 'Pale Yellow-Green' },
      { id: 'nh3', name: 'Ammonia', formula: 'NH₃', color: 'rgba(255, 255, 255, 0.05)', hint: 'Colorless, Pungent Odor' } // The crucial 5th gas
    ];

    const TOOLS = [
      { id: 'burning_splint', name: 'Burning Splint', icon: Flame, color: 'text-amber-500', desc: 'Introduces an active flame/ignition source.' },
      { id: 'glowing_splint', name: 'Glowing Splint', icon: Flame, color: 'text-rose-400', desc: 'A splint with glowing embers, lacking an active flame.' },
      { id: 'limewater', name: 'Limewater', icon: Beaker, color: 'text-slate-300', desc: 'Aqueous Calcium Hydroxide solution [Ca(OH)₂].' },
      { id: 'litmus_blue', name: 'Damp Blue Litmus', icon: FileText, color: 'text-blue-400', desc: 'Indicator paper. Turns red in acids, bleaches in oxidizers.' },
      { id: 'litmus_red', name: 'Damp Red Litmus', icon: FileText, color: 'text-red-400', desc: 'Indicator paper. Turns blue in the presence of alkalis/bases.' }
    ];

    // --- REACTION LOGIC ENGINE ---
    const evaluateReaction = (gasId, toolId) => {
      // Default: Negative test
      let result = {
        success: false,
        observation: 'No characteristic change.',
        equation: 'No specific reaction.',
        logic: 'The gas does not possess the chemical properties required to react with this testing agent.'
      };

      if (toolId === 'burning_splint') {
        if (gasId === 'h2') {
          result = { success: true, observation: 'Burns with a "squeaky pop" sound.', equation: '2H₂(g) + O₂(g) ➔ 2H₂O(l)', logic: 'Hydrogen is highly flammable. The small explosion is the rapid combustion of H₂ forming water.' };
        } else if (gasId === 'o2') {
           result.observation = 'Flame burns brighter/steadier.';
        } else {
           result.observation = 'Flame is extinguished.';
           result.logic = 'Gas does not support combustion, depriving the flame of oxygen.';
        }
      } 
      else if (toolId === 'glowing_splint') {
        if (gasId === 'o2') {
          result = { success: true, observation: 'The glowing splint relights into a full flame.', equation: 'C(s) + O₂(g) ➔ CO₂(g)', logic: 'Oxygen strongly supports combustion. The concentrated O₂ rapidly accelerates the oxidation of the carbon embers.' };
        } else {
          result.observation = 'The glowing embers extinguish.';
        }
      }
      else if (toolId === 'limewater') {
        if (gasId === 'co2') {
          result = { success: true, observation: 'Limewater turns milky/cloudy.', equation: 'Ca(OH)₂(aq) + CO₂(g) ➔ CaCO₃(s) + H₂O(l)', logic: 'Carbon dioxide reacts with calcium hydroxide to form a suspension of insoluble calcium carbonate (white precipitate).' };
        } else {
          result.observation = 'Limewater remains clear and colorless.';
        }
      }
      else if (toolId === 'litmus_blue') {
        if (gasId === 'cl2') {
          result = { success: true, observation: 'Paper turns red, then bleaches white.', equation: 'Cl₂(g) + H₂O(l) ➔ HCl(aq) + HClO(aq)', logic: 'Chlorine dissolves to form acidic HCl (turns litmus red) and hypochlorous acid (HClO), a powerful bleaching agent that turns it white.' };
        } else if (gasId === 'co2') {
          result.observation = 'Turns slightly red/pink.';
          result.logic = 'Forms weak carbonic acid (H₂CO₃), but does not bleach. (Not the defining test for CO₂).';
        } else {
          result.observation = 'Litmus paper remains blue.';
          result.logic = 'Gas is neutral or basic. Blue litmus only tests for acidity or bleaching agents.';
        }
      }
      else if (toolId === 'litmus_red') {
        if (gasId === 'nh3') {
          result = { success: true, observation: 'Paper turns blue.', equation: 'NH₃(g) + H₂O(l) ⇌ NH₄⁺(aq) + OH⁻(aq)', logic: 'Ammonia is the only common alkaline gas. It dissolves in the damp paper to form hydroxide ions, raising the pH.' };
        } else if (gasId === 'cl2') {
          result.observation = 'Paper bleaches white.';
          result.logic = 'Chlorine is a powerful bleaching agent and will bleach both red and blue litmus paper.';
        } else {
          result.observation = 'Litmus paper remains red.';
          result.logic = 'Gas is neutral or acidic. Red litmus only tests for alkalinity.';
        }
      }

      return result;
    };

    function App() {
      // Shuffled tubes on mount
      const [tubes, setTubes] = useState([]);
      const [revealed, setRevealed] = useState(false);
      
      // Testing State
      const [activeTool, setActiveTool] = useState(null);
      const [dragOverTube, setDragOverTube] = useState(null);
      const [testState, setTestState] = useState(null); // { tubeId, toolId, result }

      const shuffleTubes = () => {
        setTubes([...GASES].sort(() => 0.5 - Math.random()));
        setTestState(null);
        setRevealed(false);
      };

      useEffect(() => {
        shuffleTubes();
      }, []);

      // --- DRAG AND DROP HANDLERS ---
      const handleDragStart = (e, toolId) => {
        setActiveTool(toolId);
        e.dataTransfer.effectAllowed = 'copy';
        e.dataTransfer.setData('toolId', toolId);
      };

      const handleDragOver = (e, tubeId) => {
        e.preventDefault();
        if (dragOverTube !== tubeId) setDragOverTube(tubeId);
      };

      const handleDragLeave = () => {
        setDragOverTube(null);
      };

      const handleDrop = (e, tubeId) => {
        e.preventDefault();
        setDragOverTube(null);
        setActiveTool(null);
        
        const toolId = e.dataTransfer.getData('toolId');
        if (!toolId) return;

        const gas = tubes.find(t => t.id === tubeId);
        const result = evaluateReaction(gas.id, toolId);

        setTestState({ tubeId, toolId, result, gasName: gas.name, gasFormula: gas.formula, gasId: gas.id });
      };

      // Helper to determine litmus paper dynamic color class
      const getLitmusClass = (toolId, gasId) => {
        if (toolId === 'litmus_blue') {
          if (gasId === 'cl2') return 'anim-bleach-blue';
          if (gasId === 'co2') return 'anim-turn-red';
          return 'bg-blue-500';
        }
        if (toolId === 'litmus_red') {
          if (gasId === 'nh3') return 'anim-turn-blue';
          if (gasId === 'cl2') return 'anim-bleach-red';
          return 'bg-red-500';
        }
        return '';
      };

      // --- VISUAL ANIMATION COMPONENTS ---
      // Dynamically renders the tool interacting with the tube based on test state
      const renderToolInteraction = (tubeId) => {
        if (!testState || testState.tubeId !== tubeId) return null;
        const { toolId, result, gasId } = testState;

        return (
          <div className="absolute -top-10 left-1/2 flex flex-col items-center z-30 anim-drop-in pointer-events-none origin-bottom">
            
            {/* Burning Splint Visuals */}
            {toolId === 'burning_splint' && (
              <div className="relative">
                <div className="w-1.5 h-16 bg-yellow-800 rounded-sm"></div>
                {result.success ? (
                  /* Squeaky Pop! */
                  <div className="absolute -top-8 -left-8 w-16 h-16">
                     <svg viewBox="0 0 100 100" className="w-full h-full anim-pop">
                       <path d="M50 0 L60 40 L100 50 L60 60 L50 100 L40 60 L0 50 L40 40 Z" fill="#fbbf24" stroke="#f59e0b" strokeWidth="2"/>
                       <text x="50" y="55" fill="#991b1b" fontSize="20" fontWeight="black" textAnchor="middle">POP!</text>
                     </svg>
                  </div>
                ) : (
                  /* Flame dies or burns */
                  <div className="absolute -top-4 -left-1.5 w-4 h-6">
                    <svg viewBox="0 0 24 24" className={`w-full h-full ${result.observation.includes('extinguished') ? 'anim-extinguish' : ''}`}>
                      <path d="M12 2C12 2 5 10 5 15C5 18.866 7.68629 22 12 22C16.3137 22 19 18.866 19 15C19 10 12 2 12 2Z" fill="#f97316"/>
                      <path d="M12 8C12 8 8 13 8 16C8 18.2091 9.79086 20 12 20C14.2091 20 16 18.2091 16 16C16 13 12 8 12 8Z" fill="#fde047"/>
                    </svg>
                  </div>
                )}
              </div>
            )}

            {/* Glowing Splint Visuals */}
            {toolId === 'glowing_splint' && (
              <div className="relative">
                <div className="w-1.5 h-16 bg-slate-700 rounded-sm relative overflow-hidden">
                  <div className="absolute top-0 left-0 w-full h-2 bg-rose-500 animate-pulse"></div>
                </div>
                {result.success && (
                  <div className="absolute -top-6 -left-2 w-6 h-8">
                    <svg viewBox="0 0 24 24" className="w-full h-full anim-relight">
                      <path d="M12 2C12 2 5 10 5 15C5 18.866 7.68629 22 12 22C16.3137 22 19 18.866 19 15C19 10 12 2 12 2Z" fill="#f97316"/>
                      <path d="M12 8C12 8 8 13 8 16C8 18.2091 9.79086 20 12 20C14.2091 20 16 18.2091 16 16C16 13 12 8 12 8Z" fill="#fde047"/>
                    </svg>
                  </div>
                )}
              </div>
            )}

            {/* Limewater Dropper */}
            {toolId === 'limewater' && (
              <div className="relative">
                <Pipette size={32} className="text-slate-300 transform -rotate-12" />
                <div className="w-2 h-2 bg-slate-100 rounded-full absolute -bottom-2 right-4 anim-extinguish"></div>
              </div>
            )}

            {/* Litmus Paper */}
            {(toolId === 'litmus_blue' || toolId === 'litmus_red') && (
              <div className="relative">
                <div className={`w-4 h-12 rounded-sm border border-black/20 shadow-md ${getLitmusClass(toolId, gasId)}`}></div>
              </div>
            )}

          </div>
        );
      };

      // Dummy component since Pipette isn't natively defined above
      const Pipette = (p) => <SvgIcon {...p}><path d="m2 22 1-1h3l9-9"/><path d="M3 21v-3l9-9"/><path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3l.4.4Z"/></SvgIcon>;

      return (
        <div className="min-h-screen bg-slate-900 text-slate-100 flex flex-col font-sans overflow-hidden selection:bg-cyan-500/30">
          
          {/* HEADER */}
          <header className="flex justify-between items-center px-6 py-4 bg-slate-800/80 border-b border-slate-700 shadow-lg shrink-0">
            <div className="flex items-center gap-3">
              <Search className="text-emerald-400" size={28} />
              <div>
                <h1 className="text-2xl font-bold bg-gradient-to-r from-emerald-400 to-cyan-500 bg-clip-text text-transparent">
                  The Gas Detective
                </h1>
                <p className="text-xs text-slate-400 font-medium">Testing for Gases Chemistry Interactive</p>
              </div>
            </div>
            
            <div className="flex gap-3">
              <button 
                onClick={() => setRevealed(!revealed)}
                className={`flex items-center gap-2 px-4 py-2 rounded-lg text-xs font-bold transition-all ${revealed ? 'bg-amber-600 text-white shadow-[0_0_10px_rgba(217,119,6,0.5)]' : 'bg-slate-700 text-slate-200 hover:bg-slate-600'}`}
              >
                {revealed ? <EyeOff size={14} /> : <Eye size={14} />}
                {revealed ? 'Hide Identities' : 'Reveal Identities'}
              </button>
              <button 
                onClick={shuffleTubes}
                className="flex items-center gap-2 px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs font-bold text-slate-200 transition-colors"
              >
                <RefreshCw size={14} /> Shuffle Gases
              </button>
            </div>
          </header>

          <main className="flex-1 flex gap-4 p-4 overflow-hidden max-h-[calc(100vh-80px)]">
            
            {/* LEFT PANEL: Diagnostic Reference */}
            <div className="w-1/4 bg-slate-800/50 border border-slate-700 rounded-2xl p-5 flex flex-col overflow-y-auto custom-scrollbar shadow-inner shrink-0">
              <h2 className="text-xs uppercase tracking-widest text-slate-400 font-bold mb-4 flex items-center gap-2 border-b border-slate-700 pb-2">
                <Info size={16} /> Diagnostic Methods
              </h2>
              
              <div className="flex flex-col gap-3">
                {TOOLS.map(tool => {
                  const Icon = tool.icon;
                  return (
                    <div key={tool.id} className="bg-slate-900 border border-slate-700 rounded-xl p-3 shadow-sm">
                      <div className={`flex items-center gap-2 font-bold text-sm mb-1 ${tool.color}`}>
                        <Icon size={16} /> {tool.name}
                      </div>
                      <p className="text-[11px] text-slate-400 leading-relaxed">
                        {tool.desc}
                      </p>
                    </div>
                  );
                })}
              </div>

              <div className="mt-auto pt-4 border-t border-slate-700">
                <p className="text-[10px] text-slate-500 font-bold uppercase tracking-widest mb-2">Instructions</p>
                <p className="text-xs text-slate-400 leading-relaxed">
                  Drag a testing tool from the right panel and drop it onto any test tube to perform the diagnostic test. Observe the reaction to identify the gas.
                </p>
              </div>
            </div>

            {/* CENTER PANEL: The Lab Bench */}
            <div className="w-2/4 bg-slate-800/80 border border-slate-700 rounded-2xl p-6 shadow-xl flex flex-col relative overflow-hidden items-center justify-end">
              <div className="absolute top-4 left-6 text-slate-500 text-xs uppercase font-bold tracking-widest">Laboratory Bench</div>
              
              <div className="flex gap-4 md:gap-8 w-full justify-center pb-8 px-4">
                {tubes.map((gas, index) => {
                  const isHovered = dragOverTube === gas.id;
                  const isTestingThis = testState?.tubeId === gas.id;
                  
                  // Specific reaction styles applied directly to the tube
                  let tubeFluidClass = "";
                  if (isTestingThis) {
                    if (testState.toolId === 'limewater') {
                      tubeFluidClass = testState.result.success ? "anim-milky" : "";
                    }
                  }

                  return (
                    <div 
                      key={gas.id}
                      className="flex flex-col items-center relative"
                      onDragOver={(e) => handleDragOver(e, gas.id)}
                      onDragLeave={handleDragLeave}
                      onDrop={(e) => handleDrop(e, gas.id)}
                    >
                      {/* Tool Animation Overlay */}
                      {renderToolInteraction(gas.id)}

                      {/* Interactive Drop Zone Highlighting */}
                      <div className={`absolute -inset-4 rounded-xl border-2 transition-all duration-200 pointer-events-none z-0 ${isHovered ? 'drag-over' : 'border-transparent'}`}></div>

                      {/* SVG Test Tube */}
                      <div className="w-12 md:w-16 h-40 md:h-48 relative z-10">
                        {/* Bubbles */}
                        <div className="absolute w-full h-full bottom-0 flex justify-around items-end z-0 pointer-events-none px-2 pb-4">
                           <div className="w-1.5 h-1.5 bg-white/40 rounded-full anim-bubble" style={{ animationDelay: '0s' }}></div>
                           <div className="w-2 h-2 bg-white/40 rounded-full anim-bubble" style={{ animationDelay: '0.4s' }}></div>
                           <div className="w-1 h-1 bg-white/40 rounded-full anim-bubble" style={{ animationDelay: '0.8s' }}></div>
                        </div>

                        <svg viewBox="0 0 100 300" className="w-full h-full drop-shadow-lg overflow-visible">
                          {/* Liquid (if Limewater is added) */}
                          <path 
                            d="M 20,200 L 20,270 Q 20,290 50,290 Q 80,290 80,270 L 80,200 Z" 
                            fill={isTestingThis && testState.toolId === 'limewater' ? "rgba(255, 255, 255, 0.05)" : "transparent"} 
                            className={tubeFluidClass}
                          />
                          {/* Gas Background Tint */}
                          <path d="M 20,20 L 20,270 Q 20,290 50,290 Q 80,290 80,270 L 80,20 Z" fill={gas.color} />
                          {/* Glass Tube */}
                          <path d="M 15,10 L 15,20 L 20,20 L 20,270 Q 20,290 50,290 Q 80,290 80,270 L 80,20 L 85,20 L 85,10" fill="none" stroke="rgba(203, 213, 225, 0.5)" strokeWidth="4" strokeLinecap="round" />
                          <line x1="15" y1="10" x2="85" y2="10" stroke="rgba(203, 213, 225, 0.5)" strokeWidth="4" strokeLinecap="round" />
                          <path d="M 25,30 L 25,260 Q 30,280 50,280 Q 70,280 70,260 L 70,30 Z" fill="rgba(255,255,255,0.08)" pointerEvents="none" />
                        </svg>
                      </div>

                      {/* Label */}
                      <div className="mt-4 text-center z-10 bg-slate-900 border border-slate-700 px-3 py-1 rounded-lg shadow-inner min-w-[60px]">
                        <div className="text-xs font-bold text-slate-300">Tube {index + 1}</div>
                        {revealed && (
                          <div className="font-mono font-black text-cyan-400 mt-1">{gas.formula}</div>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>

              {/* Wooden Rack Base */}
              <div className="w-full max-w-lg h-6 bg-amber-900/40 rounded border-t-4 border-amber-800/50 shadow-2xl absolute bottom-6 z-0"></div>

            </div>

            {/* RIGHT PANEL: Tools Inventory & Output Engine */}
            <div className="w-1/4 bg-slate-800 rounded-2xl border border-slate-700 flex flex-col overflow-hidden shadow-xl shrink-0">
              
              {/* Tool Rack */}
              <div className="p-4 bg-slate-700/50 border-b border-slate-600 shrink-0">
                <h2 className="text-xs uppercase tracking-widest text-slate-200 font-bold mb-3">Testing Tools</h2>
                <div className="grid grid-cols-2 gap-2">
                  {TOOLS.map(tool => {
                    const Icon = tool.icon;
                    return (
                      <div 
                        key={tool.id}
                        draggable
                        onDragStart={(e) => handleDragStart(e, tool.id)}
                        className={`flex flex-col items-center justify-center p-2 rounded-xl border-2 border-slate-600 bg-slate-800 cursor-grab active:cursor-grabbing hover:border-cyan-400 hover:bg-slate-700 transition-all ${activeTool === tool.id ? 'opacity-50' : ''}`}
                        title="Drag me to a test tube"
                      >
                        <Icon size={20} className={`mb-1 ${tool.color}`} />
                        <span className="text-[10px] font-bold text-slate-300 text-center leading-tight">{tool.name}</span>
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* Logic Classifier Output */}
              <div className="p-5 flex flex-col flex-1 bg-slate-900/40 overflow-y-auto custom-scrollbar">
                <div className="flex items-center gap-2 mb-4 text-cyan-400">
                  <Activity size={18} /> <h2 className="text-xs uppercase tracking-widest font-bold">Diagnostic Output</h2>
                </div>

                {!testState ? (
                  <div className="flex-1 flex items-center justify-center text-center opacity-40">
                    <p className="text-xs font-medium px-4 leading-relaxed">Awaiting empirical testing. Drag a tool to a tube to begin logging data.</p>
                  </div>
                ) : (
                  <div className="flex flex-col gap-4 animate-drop-in">
                    
                    {/* Status Badge */}
                    <div className={`p-3 rounded-lg border shadow-sm flex items-center gap-3 ${testState.result.success ? 'bg-emerald-900/30 border-emerald-500/50 text-emerald-300' : 'bg-slate-800 border-slate-600 text-slate-300'}`}>
                      {testState.result.success ? <CheckCircle2 className="shrink-0" /> : <XCircle className="shrink-0" />}
                      <span className="text-sm font-bold">{testState.result.success ? 'Positive Match' : 'Negative Test'}</span>
                    </div>

                    <div className="bg-slate-900 border border-slate-700 p-4 rounded-xl shadow-inner flex flex-col gap-3 text-xs leading-relaxed">
                      
                      <div>
                        <span className="text-[10px] text-slate-500 uppercase tracking-widest font-bold block mb-1">Visual Observation</span>
                        <span className={`font-medium ${testState.result.success ? 'text-white' : 'text-slate-400'}`}>
                          {testState.result.observation}
                        </span>
                      </div>

                      {testState.result.success && (
                        <>
                          <div className="border-t border-slate-800 pt-3">
                            <span className="text-[10px] text-slate-500 uppercase tracking-widest font-bold block mb-1">Chemical Logic</span>
                            <span className="text-slate-300">{testState.result.logic}</span>
                          </div>
                          
                          <div className="border-t border-slate-800 pt-3">
                            <span className="text-[10px] text-slate-500 uppercase tracking-widest font-bold block mb-1">Chemical Equation</span>
                            <span className="font-mono font-bold text-cyan-400">{testState.result.equation}</span>
                          </div>

                          <div className="mt-2 bg-emerald-900/20 border border-emerald-500/30 p-2 rounded text-center">
                            <span className="text-[10px] uppercase tracking-widest text-emerald-500 font-bold block">Identity Confirmed</span>
                            <span className="text-lg font-black text-emerald-400">{testState.gasName} ({testState.gasFormula})</span>
                          </div>
                        </>
                      )}

                      {!testState.result.success && (
                        <div className="border-t border-slate-800 pt-3 text-slate-500 italic">
                          This test does not uniquely identify the gas. Try another tool.
                        </div>
                      )}
                    </div>

                  </div>
                )}
              </div>

            </div>

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
