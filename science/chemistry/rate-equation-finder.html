<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Rate Equation Finder | Initial Rates Method</title>
    <meta name="description" content="Master the rate equation initial rates method. An analytical logic engine processing initial rate data to deduce reaction orders and rate constants.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: { 850: '#151e2e', 900: '#0F172A', 950: '#020617' },
                        rate: {
                            primary: '#8B5CF6',   // Violet
                            secondary: '#D946EF', // Fuchsia
                            success: '#10B981',   // Emerald
                            error: '#F43F5E',     // Rose
                            a: '#38BDF8',         // Sky
                            b: '#FBBF24'          // Amber
                        }
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- KaTeX for Math Typesetting -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js" crossorigin="anonymous"></script>

    <style>
        body { margin: 0; background-color: #020617; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .bg-grid {
            background-image: radial-gradient(circle at 2px 2px, rgba(30, 41, 59, 0.4) 1px, transparent 0);
            background-size: 30px 30px;
        }

        /* KaTeX Overrides for Dark Mode */
        .katex { color: #e2e8f0; }
        .katex-display { margin: 0; padding: 10px 0; overflow-x: auto; overflow-y: hidden; }
        .katex .text-sky { color: #38BDF8; }
        .katex .text-amber { color: #FBBF24; }
        .katex .text-emerald { color: #10B981; }
    </style>
</head>
<body class="text-slate-200 selection:bg-violet-500 selection:text-white min-h-screen bg-grid flex items-center justify-center p-4 md:p-8">

    <div id="root" class="w-full max-w-6xl"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Database of Kinetic Experiments ---
        const EXPERIMENTS = [
            {
                id: 'exp1',
                name: 'Scenario A: 1st Order & 2nd Order',
                equation: 'A + 2B \\rightarrow C + D',
                trueOrderA: 1,
                trueOrderB: 2,
                data: [
                    { exp: 1, concA: 0.10, concB: 0.10, rate: 0.002 },
                    { exp: 2, concA: 0.20, concB: 0.10, rate: 0.004 },
                    { exp: 3, concA: 0.10, concB: 0.20, rate: 0.008 }
                ],
                // Hint logic based on typical student errors
                hintA: "Compare Experiments 1 and 2. [B] is held constant while [A] is doubled. How does the rate change?",
                hintB: "Compare Experiments 1 and 3. [A] is held constant while [B] is doubled. How does the rate change?"
            },
            {
                id: 'exp2',
                name: 'Scenario B: 2nd Order & Zero Order',
                equation: '2A + B \\rightarrow 3C',
                trueOrderA: 2,
                trueOrderB: 0,
                data: [
                    { exp: 1, concA: 0.15, concB: 0.25, rate: 0.045 },
                    { exp: 2, concA: 0.30, concB: 0.25, rate: 0.180 },
                    { exp: 3, concA: 0.15, concB: 0.50, rate: 0.045 }
                ],
                hintA: "Compare Experiments 1 and 2. [A] is doubled, and [B] is constant. The rate quadruples (x4). What order gives 2^m = 4?",
                hintB: "Compare Experiments 1 and 3. [B] is doubled, but the rate remains exactly the same. What does this mean?"
            },
            {
                id: 'exp3',
                name: 'Scenario C: 1st Order & 1st Order',
                equation: 'A + B \\rightarrow Products',
                trueOrderA: 1,
                trueOrderB: 1,
                data: [
                    { exp: 1, concA: 0.05, concB: 0.05, rate: 0.015 },
                    { exp: 2, concA: 0.10, concB: 0.05, rate: 0.030 },
                    { exp: 3, concA: 0.05, concB: 0.15, rate: 0.045 }
                ],
                hintA: "Compare Experiments 1 and 2. [A] doubles, rate doubles.",
                hintB: "Compare Experiments 1 and 3. [B] triples (0.05 to 0.15), and the rate also triples (0.015 to 0.045)."
            }
        ];

        // --- UI Icons ---
        const Calculator = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="16" y1="14" x2="16" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></svg>;
        const Flask = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 2v17.5A2.5 2.5 0 0 1 6.5 22A2.5 2.5 0 0 1 4 19.5V2"/><path d="M20 2v17.5a2.5 2.5 0 0 1-2.5 2.5a2.5 2.5 0 0 1-2.5-2.5V2"/><path d="M3 2h7"/><path d="M14 2h7"/><path d="M9 16H4"/><path d="M20 16h-5"/></svg>;
        const CheckCircle = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>;
        const AlertCircle = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>;

        // --- KaTeX Wrapper Component ---
        const Latex = ({ math, block = false }) => {
            const containerRef = useRef(null);
            useEffect(() => {
                if (containerRef.current && window.katex) {
                    try {
                        katex.render(math, containerRef.current, {
                            displayMode: block,
                            throwOnError: false,
                            strict: false,
                            macros: {
                                "\\A": "\\textcolor{#38BDF8}{\\text{[A]}}",
                                "\\B": "\\textcolor{#FBBF24}{\\text{[B]}}"
                            }
                        });
                    } catch (e) { console.error(e); }
                }
            }, [math, block]);
            return <span ref={containerRef} />;
        };

        function App() {
            // State
            const [activeExpId, setActiveExpId] = useState(EXPERIMENTS[0].id);
            const [userOrderA, setUserOrderA] = useState('');
            const [userOrderB, setUserOrderB] = useState('');
            
            const [isVerified, setIsVerified] = useState(false);
            const [feedback, setFeedback] = useState(null);

            const [customData, setCustomData] = useState([
                { exp: 1, concA: 0.10, concB: 0.10, rate: 0.010 },
                { exp: 2, concA: 0.20, concB: 0.10, rate: 0.020 },
                { exp: 3, concA: 0.10, concB: 0.20, rate: 0.040 }
            ]);

            let exp;
            if (activeExpId === 'custom') {
                const d1 = customData[0], d2 = customData[1], d3 = customData[2];
                // Automatically calculate true orders based on Custom Data
                let m = 0, n = 0;
                if (d2.concA > 0 && d1.concA > 0 && d2.rate > 0 && d1.rate > 0) {
                    m = Math.round(Math.log(d2.rate / d1.rate) / Math.log(d2.concA / d1.concA));
                }
                if (d3.concB > 0 && d1.concB > 0 && d3.rate > 0 && d1.rate > 0) {
                    n = Math.round(Math.log(d3.rate / d1.rate) / Math.log(d3.concB / d1.concB));
                }
                if (isNaN(m) || !isFinite(m)) m = 0;
                if (isNaN(n) || !isFinite(n)) n = 0;

                exp = {
                    id: 'custom',
                    name: 'Custom Experimental Data',
                    equation: '\\text{A} + \\text{B} \\rightarrow \\text{Products}',
                    trueOrderA: m,
                    trueOrderB: n,
                    data: customData,
                    hintA: "Compare Experiments 1 and 2 to find the order with respect to [A].",
                    hintB: "Compare Experiments 1 and 3 to find the order with respect to [B]."
                };
            } else {
                exp = EXPERIMENTS.find(e => e.id === activeExpId);
            }

            const handleCustomChange = (index, field, value) => {
                const newData = [...customData];
                newData[index][field] = value === '' ? '' : parseFloat(value);
                setCustomData(newData);
            };

            // Handlers
            const handleVerify = () => {
                const m = parseInt(userOrderA);
                const n = parseInt(userOrderB);

                if (isNaN(m) || isNaN(n)) {
                    setFeedback({ type: 'error', msg: 'Please select an order for both Reactant A and B.' });
                    setIsVerified(false);
                    return;
                }

                if (activeExpId === 'custom') {
                    const d1 = customData[0], d2 = customData[1], d3 = customData[2];
                    if (d1.concA === '' || d1.concB === '' || d1.rate === '' || d2.concA === '' || d2.concB === '' || d2.rate === '' || d3.concA === '' || d3.concB === '' || d3.rate === '') {
                        setFeedback({ type: 'error', msg: 'Please fill in all concentration and rate fields before verifying.' });
                        setIsVerified(false);
                        return;
                    }
                    if (d1.concB !== d2.concB) {
                        setFeedback({ type: 'error', msg: 'For this engine to work properly, [B] must be held constant between Exp 1 and Exp 2.' });
                        setIsVerified(false);
                        return;
                    }
                    if (d1.concA !== d3.concA) {
                        setFeedback({ type: 'error', msg: 'For this engine to work properly, [A] must be held constant between Exp 1 and Exp 3.' });
                        setIsVerified(false);
                        return;
                    }
                    if (d1.concA === d2.concA || d1.concB === d3.concB) {
                        setFeedback({ type: 'error', msg: 'Concentrations must change between experiments to deduce the order.' });
                        setIsVerified(false);
                        return;
                    }
                }

                if (m === exp.trueOrderA && n === exp.trueOrderB) {
                    setFeedback({ type: 'success', msg: 'Correct! The orders have been correctly deduced. See the mathematical breakdown below.' });
                    setIsVerified(true);
                } else {
                    setIsVerified(false);
                    // Targeted hints based on what they got wrong
                    let msg = '';
                    if (m !== exp.trueOrderA) msg += `Hint for A: ${exp.hintA} `;
                    if (n !== exp.trueOrderB) msg += `Hint for B: ${exp.hintB}`;
                    setFeedback({ type: 'error', msg: msg });
                }
            };

            const handleReset = () => {
                setUserOrderA('');
                setUserOrderB('');
                setIsVerified(false);
                setFeedback(null);
            };

            // Derive specific values for the mathematical proof
            const d1 = exp.data[0];
            const d2 = exp.data[1]; // A changes, B constant
            const d3 = exp.data[2]; // B changes, A constant

            const rateRatioA = d2.rate / d1.rate;
            const concRatioA = d2.concA / d1.concA;
            
            const rateRatioB = d3.rate / d1.rate;
            const concRatioB = d3.concB / d1.concB;

            // Calculate k using Experiment 1 data
            const calcK = d1.rate / (Math.pow(d1.concA, exp.trueOrderA) * Math.pow(d1.concB, exp.trueOrderB));
            const totalOrder = exp.trueOrderA + exp.trueOrderB;
            
            // Unit derivation based on total order
            let kUnits = '';
            if (totalOrder === 0) kUnits = 'M\\cdot s^{-1}';
            else if (totalOrder === 1) kUnits = 's^{-1}';
            else if (totalOrder === 2) kUnits = 'M^{-1}\\cdot s^{-1}';
            else if (totalOrder === 3) kUnits = 'M^{-2}\\cdot s^{-1}';

            return (
                <div className="w-full bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl overflow-hidden flex flex-col min-h-[600px]">
                    
                    {/* Header */}
                    <header className="p-6 md:p-8 border-b border-slate-800 bg-slate-950 flex flex-col md:flex-row justify-between items-center gap-6">
                        <div className="flex items-center gap-4">
                            <div className="p-3 bg-violet-500/20 rounded-xl text-violet-400">
                                <Flask />
                            </div>
                            <div>
                                <h1 className="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-violet-400 to-fuchsia-400">
                                    Rate Equation Finder
                                </h1>
                                <p className="text-sm text-slate-400 mt-1">Initial Rates Method Engine</p>
                            </div>
                        </div>
                        
                        <div className="w-full md:w-auto">
                            <label className="text-xs font-semibold text-slate-500 uppercase tracking-wider block mb-2">Select Experimental Data</label>
                            <select 
                                className="w-full md:w-80 bg-slate-900 border border-slate-700 rounded-xl p-3 text-slate-200 outline-none focus:border-violet-500 transition-colors shadow-inner font-medium text-sm cursor-pointer"
                                value={activeExpId}
                                onChange={(e) => {
                                    setActiveExpId(e.target.value);
                                    handleReset();
                                }}
                            >
                                {EXPERIMENTS.map(e => (
                                    <option key={e.id} value={e.id}>{e.name}</option>
                                ))}
                                <option value="custom">Custom Experimental Data</option>
                            </select>
                        </div>
                    </header>

                    {/* Main Content Grid */}
                    <div className="grid grid-cols-1 lg:grid-cols-2 flex-grow">
                        
                        {/* Left Panel: Data & Deduction */}
                        <section className="p-6 md:p-8 border-b lg:border-b-0 lg:border-r border-slate-800 bg-slate-900/50 flex flex-col">
                            
                            {/* Reaction Info */}
                            <div className="bg-slate-950 border border-slate-800 rounded-2xl p-5 shadow-inner mb-6 text-center">
                                <span className="block text-[10px] text-slate-500 uppercase tracking-widest font-bold mb-2">Chemical Equation</span>
                                <div className="text-lg text-slate-200">
                                    <Latex math={exp.equation} block={true} />
                                </div>
                            </div>

                            {/* Data Table */}
                            <div className="mb-8">
                                <h2 className="text-xs font-bold text-slate-400 uppercase tracking-widest flex items-center gap-2 mb-4">
                                    <Calculator className="w-4 h-4 text-slate-500" /> Experimental Data
                                </h2>
                                {activeExpId === 'custom' && !isVerified && (
                                    <p className="text-[10px] text-violet-400 mb-2 font-medium">
                                        For proper derivation: Exp 1 & 2 must hold [B] constant. Exp 1 & 3 must hold [A] constant.
                                    </p>
                                )}
                                <div className="overflow-x-auto rounded-xl border border-slate-700 shadow-lg">
                                    <table className="w-full text-center text-sm">
                                        <thead className="bg-slate-800 text-slate-300">
                                            <tr>
                                                <th className="p-3 font-semibold border-b border-r border-slate-700">Exp</th>
                                                <th className="p-3 font-semibold border-b border-r border-slate-700 text-rate-a">[A]₀ (M)</th>
                                                <th className="p-3 font-semibold border-b border-r border-slate-700 text-rate-b">[B]₀ (M)</th>
                                                <th className="p-3 font-semibold border-b border-slate-700 text-emerald-400">Initial Rate (M/s)</th>
                                            </tr>
                                        </thead>
                                        <tbody className="bg-slate-950">
                                            {exp.data.map((row, index) => (
                                                <tr key={row.exp} className="hover:bg-slate-900/50 transition-colors">
                                                    <td className="p-3 border-b border-r border-slate-800 text-slate-400 font-bold">{row.exp}</td>
                                                    <td className="p-3 border-b border-r border-slate-800 font-mono text-slate-300">
                                                        {activeExpId === 'custom' && !isVerified ? (
                                                            <input type="number" step="0.01" className="w-20 bg-slate-900 border border-slate-700 rounded p-1 text-center text-slate-200 outline-none focus:border-rate-a" value={row.concA} onChange={e => handleCustomChange(index, 'concA', e.target.value)} />
                                                        ) : Number(row.concA || 0).toFixed(2)}
                                                    </td>
                                                    <td className="p-3 border-b border-r border-slate-800 font-mono text-slate-300">
                                                        {activeExpId === 'custom' && !isVerified ? (
                                                            <input type="number" step="0.01" className="w-20 bg-slate-900 border border-slate-700 rounded p-1 text-center text-slate-200 outline-none focus:border-rate-b" value={row.concB} onChange={e => handleCustomChange(index, 'concB', e.target.value)} />
                                                        ) : Number(row.concB || 0).toFixed(2)}
                                                    </td>
                                                    <td className="p-3 border-b border-slate-800 font-mono text-slate-300">
                                                        {activeExpId === 'custom' && !isVerified ? (
                                                            <input type="number" step="0.001" className="w-24 bg-slate-900 border border-slate-700 rounded p-1 text-center text-emerald-400 outline-none focus:border-emerald-500" value={row.rate} onChange={e => handleCustomChange(index, 'rate', e.target.value)} />
                                                        ) : Number(row.rate || 0).toFixed(3)}
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                            {/* Interactive Deduction Area */}
                            <div className="bg-violet-500/5 border border-violet-500/20 rounded-2xl p-6 shadow-inner mt-auto">
                                <h3 className="text-sm font-bold text-violet-400 mb-4 uppercase tracking-widest">Deduce Reaction Orders</h3>
                                <p className="text-xs text-slate-400 mb-4">Analyze how the rate changes when only one concentration is altered. Determine the exponent (order) for each reactant.</p>
                                
                                <div className="flex flex-col md:flex-row gap-4 mb-6">
                                    <div className="flex-1">
                                        <label className="text-[10px] uppercase text-rate-a font-bold mb-1 block">Order w.r.t [A] (m)</label>
                                        <select 
                                            className="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-slate-200 outline-none focus:border-rate-a cursor-pointer text-sm"
                                            value={userOrderA} onChange={(e) => setUserOrderA(e.target.value)} disabled={isVerified}
                                        >
                                            <option value="" disabled>Select Order...</option>
                                            <option value="0">Zero Order (0)</option>
                                            <option value="1">First Order (1)</option>
                                            <option value="2">Second Order (2)</option>
                                        </select>
                                    </div>
                                    <div className="flex-1">
                                        <label className="text-[10px] uppercase text-rate-b font-bold mb-1 block">Order w.r.t [B] (n)</label>
                                        <select 
                                            className="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-slate-200 outline-none focus:border-rate-b cursor-pointer text-sm"
                                            value={userOrderB} onChange={(e) => setUserOrderB(e.target.value)} disabled={isVerified}
                                        >
                                            <option value="" disabled>Select Order...</option>
                                            <option value="0">Zero Order (0)</option>
                                            <option value="1">First Order (1)</option>
                                            <option value="2">Second Order (2)</option>
                                        </select>
                                    </div>
                                </div>

                                {feedback && (
                                    <div className={`mb-4 border px-4 py-3 rounded-xl flex items-start gap-3 text-sm animate-in fade-in ${feedback.type === 'success' ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400' : 'bg-rose-500/10 border-rose-500/30 text-rose-400'}`}>
                                        {feedback.type === 'success' ? <CheckCircle className="shrink-0 mt-0.5" /> : <AlertCircle className="shrink-0 mt-0.5" />}
                                        <p>{feedback.msg}</p>
                                    </div>
                                )}

                                {!isVerified ? (
                                    <button 
                                        onClick={handleVerify}
                                        className="w-full bg-gradient-to-r from-violet-600 to-fuchsia-600 hover:from-violet-500 hover:to-fuchsia-500 text-white font-bold py-3 rounded-xl transition-all shadow-lg active:scale-[0.98]"
                                    >
                                        Verify Orders
                                    </button>
                                ) : (
                                    <button 
                                        onClick={handleReset}
                                        className="w-full bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-200 font-bold py-3 rounded-xl transition-all active:scale-[0.98]"
                                    >
                                        Reset Form
                                    </button>
                                )}
                            </div>

                        </section>

                        {/* Right Panel: Algorithmic Resolution */}
                        <section className="p-6 md:p-8 bg-slate-950 flex flex-col relative overflow-hidden">
                            
                            {!isVerified ? (
                                <div className="flex-grow flex flex-col items-center justify-center border-2 border-dashed border-slate-800 rounded-2xl text-slate-500 p-8 text-center bg-slate-900/30">
                                    <Calculator className="w-12 h-12 opacity-20 mb-4" />
                                    <h3 className="font-bold text-slate-400">Awaiting Deduction</h3>
                                    <p className="text-sm mt-2 max-w-sm">Correctly identify the reaction orders on the left to unlock the step-by-step mathematical derivation and the calculation of the rate constant (k).</p>
                                </div>
                            ) : (
                                <div className="flex-grow flex flex-col gap-6 animate-in fade-in slide-in-from-bottom-4 duration-500">
                                    
                                    {/* Overall Rate Equation */}
                                    <div className="bg-slate-900 border border-emerald-500/50 rounded-2xl p-5 shadow-xl text-center relative overflow-hidden">
                                        <div className="absolute top-0 left-0 w-full h-1 bg-emerald-500"></div>
                                        <span className="text-[10px] font-bold text-emerald-500 uppercase tracking-widest mb-1 block">Final Rate Law</span>
                                        <div className="text-xl md:text-2xl text-white">
                                            <Latex math={`\\text{Rate} = k\\A^{${exp.trueOrderA}}\\B^{${exp.trueOrderB}}`} block={true} />
                                        </div>
                                    </div>

                                    {/* Mathematical Derivation */}
                                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl flex-grow overflow-y-auto no-scrollbar">
                                        <h3 className="text-xs font-bold text-slate-400 uppercase tracking-widest border-b border-slate-800 pb-3 mb-4">
                                            Step-by-Step Resolution
                                        </h3>
                                        
                                        {/* Deriving Order for A */}
                                        <div className="mb-8">
                                            <span className="inline-block bg-slate-950 border border-slate-800 text-rate-a text-[10px] font-bold px-2 py-1 rounded mb-3 uppercase">1. Finding Order of A (m)</span>
                                            <p className="text-sm text-slate-400 mb-2">Compare Exp 2 and Exp 1 (where [B] is constant):</p>
                                            <div className="text-slate-300 overflow-x-auto no-scrollbar pb-2">
                                                <Latex math={`\\frac{\\text{Rate}_2}{\\text{Rate}_1} = \\frac{k\\A_2^m\\B_2^n}{k\\A_1^m\\B_1^n}`} block={true} />
                                                <Latex math={`\\frac{${d2.rate}}{${d1.rate}} = \\left(\\frac{${d2.concA}}{${d1.concA}}\\right)^m`} block={true} />
                                                <Latex math={`${rateRatioA} = (${concRatioA})^m \\implies \\mathbf{m = ${exp.trueOrderA}}`} block={true} />
                                            </div>
                                        </div>

                                        {/* Deriving Order for B */}
                                        <div className="mb-8">
                                            <span className="inline-block bg-slate-950 border border-slate-800 text-rate-b text-[10px] font-bold px-2 py-1 rounded mb-3 uppercase">2. Finding Order of B (n)</span>
                                            <p className="text-sm text-slate-400 mb-2">Compare Exp 3 and Exp 1 (where [A] is constant):</p>
                                            <div className="text-slate-300 overflow-x-auto no-scrollbar pb-2">
                                                <Latex math={`\\frac{\\text{Rate}_3}{\\text{Rate}_1} = \\frac{k\\A_3^m\\B_3^n}{k\\A_1^m\\B_1^n}`} block={true} />
                                                <Latex math={`\\frac{${d3.rate}}{${d1.rate}} = \\left(\\frac{${d3.concB}}{${d1.concB}}\\right)^n`} block={true} />
                                                <Latex math={`${rateRatioB} = (${concRatioB})^n \\implies \\mathbf{n = ${exp.trueOrderB}}`} block={true} />
                                            </div>
                                        </div>

                                        {/* Calculating Rate Constant k */}
                                        <div>
                                            <span className="inline-block bg-slate-950 border border-slate-800 text-violet-400 text-[10px] font-bold px-2 py-1 rounded mb-3 uppercase">3. Calculating Rate Constant (k)</span>
                                            <p className="text-sm text-slate-400 mb-2">Substitute data from Exp 1 back into the rate law:</p>
                                            <div className="text-slate-300 overflow-x-auto no-scrollbar pb-2">
                                                <Latex math={`k = \\frac{\\text{Rate}_1}{\\A_1^{${exp.trueOrderA}}\\B_1^{${exp.trueOrderB}}}`} block={true} />
                                                <Latex math={`k = \\frac{${d1.rate}}{(${d1.concA})^{${exp.trueOrderA}}(${d1.concB})^{${exp.trueOrderB}}}`} block={true} />
                                                <Latex math={`\\mathbf{k = ${calcK.toFixed(3)} \\text{ ${kUnits}}}`} block={true} />
                                            </div>
                                        </div>

                                    </div>
                                </div>
                            )}

                        </section>
                    </div>

                </div>
            );
        }

        // --- Render Application ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
