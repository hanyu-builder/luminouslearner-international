<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limiting Reactant Calculator Interactive</title>
    <!-- Primary SEO Keyword: Limiting reactant calculator interactive -->
    <meta name="description" content="Use this limiting reactant calculator interactive tool to visualize stoichiometric ratios, identify limiting reagents, and calculate excess mass.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Plotly.js for interactive charts -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>

    <!-- React, ReactDOM, and Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        
        /* Custom range slider styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: currentColor;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #334155;
            border-radius: 2px;
        }
    </style>
</head>
<body class="bg-[#0F172A] text-slate-200 h-screen max-h-[1000px] overflow-hidden flex flex-col font-sans select-none">
    
    <div id="root" class="h-full w-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- ICONS ---
        const AlertIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>;
        const BeakerIcon = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M4.5 3h15"></path><path d="M6 3v16a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V3"></path><path d="M6 14h12"></path></svg>;
        const SlidersIcon = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>;

        function App() {
            // --- STATE MANAGEMENT ---
            // Reactant A
            const [massA, setMassA] = useState(50); // Slidable
            const [mmA, setMmA] = useState(20);
            const [coeffA, setCoeffA] = useState(2);

            // Reactant B
            const [massB, setMassB] = useState(60); // Slidable
            const [mmB, setMmB] = useState(30);
            const [coeffB, setCoeffB] = useState(1);

            // Product P
            const [mmP, setMmP] = useState(70);
            const [coeffP, setCoeffP] = useState(2);

            const chartRef = useRef(null);

            // --- STOICHIOMETRIC ENGINE ---
            const results = useMemo(() => {
                // 1. Calculate Initial Moles
                const molesA = massA / mmA;
                const molesB = massB / mmB;

                // 2. Calculate Stoichiometric Ratios (Moles / Coefficient)
                const ratioA = molesA / coeffA;
                const ratioB = molesB / coeffB;

                // 3. Identify Limiting Reagent
                let limiting = null;
                let excess = null;
                let limitingRatio = 0;

                if (ratioA < ratioB - 0.0001) {
                    limiting = 'A';
                    excess = 'B';
                    limitingRatio = ratioA;
                } else if (ratioB < ratioA - 0.0001) {
                    limiting = 'B';
                    excess = 'A';
                    limitingRatio = ratioB;
                } else {
                    limiting = 'Balanced';
                    limitingRatio = ratioA; // they are equal
                }

                // 4. Calculate Product Yield
                const molesP = limitingRatio * coeffP;
                const massP = molesP * mmP;

                // 5. Calculate Leftover Excess
                let remMolesA = 0;
                let remMassA = 0;
                let remMolesB = 0;
                let remMassB = 0;

                if (limiting === 'A') {
                    remMolesB = molesB - (limitingRatio * coeffB);
                    remMassB = remMolesB * mmB;
                } else if (limiting === 'B') {
                    remMolesA = molesA - (limitingRatio * coeffA);
                    remMassA = remMolesA * mmA;
                }

                return {
                    molesA, molesB,
                    ratioA, ratioB,
                    limiting,
                    molesP, massP,
                    remMolesA, remMassA,
                    remMolesB, remMassB
                };
            }, [massA, mmA, coeffA, massB, mmB, coeffB, mmP, coeffP]);

            // --- PLOTLY.JS VISUALIZATION ---
            useEffect(() => {
                if (!chartRef.current || !window.Plotly) return;

                const trace1 = {
                    x: ['Reactant A', 'Reactant B', 'Product P'],
                    y: [
                        results.molesA - results.remMolesA, // Consumed A
                        results.molesB - results.remMolesB, // Consumed B
                        results.molesP                      // Produced P
                    ],
                    name: 'Consumed / Produced (mol)',
                    type: 'bar',
                    marker: { color: ['rgba(59, 130, 246, 0.8)', 'rgba(168, 85, 247, 0.8)', 'rgba(16, 185, 129, 0.8)'] }
                };

                const trace2 = {
                    x: ['Reactant A', 'Reactant B', 'Product P'],
                    y: [
                        results.remMolesA, // Excess A
                        results.remMolesB, // Excess B
                        0                  // Product has no excess
                    ],
                    name: 'Excess Remaining (mol)',
                    type: 'bar',
                    marker: { color: 'rgba(239, 68, 68, 0.7)' }
                };

                const data = [trace1, trace2];

                const layout = {
                    barmode: 'stack',
                    paper_bgcolor: 'transparent',
                    plot_bgcolor: 'transparent',
                    font: { color: '#94a3b8', family: 'Inter, ui-sans-serif, system-ui' },
                    margin: { t: 20, b: 40, l: 40, r: 20 },
                    legend: { orientation: 'h', y: 1.1, x: 0.5, xanchor: 'center' },
                    xaxis: { showgrid: false },
                    yaxis: { 
                        title: 'Moles (mol)',
                        gridcolor: '#334155',
                        zerolinecolor: '#475569'
                    }
                };

                const config = { responsive: true, displayModeBar: false };

                Plotly.newPlot(chartRef.current, data, layout, config);
            }, [results]);

            // --- UI COMPONENTS ---
            const NumberInput = ({ label, value, onChange }) => (
                <div className="flex flex-col">
                    <label className="text-[10px] text-slate-500 uppercase font-bold mb-1">{label}</label>
                    <input 
                        type="number" min="0.1" step="any"
                        value={value} onChange={e => onChange(parseFloat(e.target.value) || 0)}
                        className="bg-slate-900 border border-slate-700 rounded p-1.5 text-slate-200 text-sm font-mono focus:border-blue-500 outline-none"
                    />
                </div>
            );

            return (
                <div className="flex flex-col h-full w-full">
                    {/* Header */}
                    <header className="bg-[#1E293B] border-b border-slate-800 p-4 shrink-0 flex justify-between items-center z-10">
                        <div>
                            <h1 className="text-xl md:text-2xl font-bold text-white flex items-center gap-2">
                                <SlidersIcon className="text-purple-400 w-6 h-6" /> Limiting Reagent Calculator
                            </h1>
                            <p className="text-xs md:text-sm text-slate-400 mt-1">Adjust masses to visualize stoichiometry and identify the limiting factor.</p>
                        </div>
                        <div className="hidden md:flex bg-slate-900 border border-slate-700 px-3 py-1.5 rounded-lg font-mono text-xs text-slate-400">
                            Stoichiometric Ratio = <span className="text-emerald-400 ml-1">Moles / Coefficient</span>
                        </div>
                    </header>

                    {/* Main Workspace */}
                    <main className="flex-1 flex flex-col lg:flex-row gap-4 p-4 overflow-hidden max-w-7xl w-full mx-auto">
                        
                        {/* LEFT PANEL: Inputs & Sliders */}
                        <section className="flex flex-col gap-4 w-full lg:w-1/3 shrink-0 overflow-y-auto pr-2">
                            
                            {/* Reactant A Control */}
                            <div className={`p-4 rounded-xl border ${results.limiting === 'A' ? 'bg-blue-900/20 border-blue-500 shadow-[0_0_15px_rgba(59,130,246,0.2)]' : 'bg-[#1E293B] border-slate-700'}`}>
                                <div className="flex justify-between items-center mb-3">
                                    <h2 className="font-bold text-blue-400 flex items-center gap-2">
                                        <div className="w-3 h-3 rounded-full bg-blue-500"></div> Reactant A
                                    </h2>
                                    {results.limiting === 'A' && <span className="text-[10px] bg-blue-500 text-white px-2 py-0.5 rounded font-bold uppercase tracking-wider">Limiting</span>}
                                </div>
                                
                                <div className="grid grid-cols-2 gap-3 mb-4">
                                    <NumberInput label="Coefficient" value={coeffA} onChange={setCoeffA} />
                                    <NumberInput label="Molar Mass (g/mol)" value={mmA} onChange={setMmA} />
                                </div>
                                
                                <div className="mb-1 flex justify-between items-end">
                                    <label className="text-xs text-slate-400 font-bold">Starting Mass</label>
                                    <span className="font-mono text-blue-300 font-bold">{massA.toFixed(1)} g</span>
                                </div>
                                <input 
                                    type="range" min="0" max="200" step="0.5" 
                                    value={massA} onChange={e => setMassA(parseFloat(e.target.value))}
                                    className="text-blue-500 w-full"
                                />
                                <div className="mt-3 text-xs text-slate-500 flex justify-between font-mono">
                                    <span>Available Moles: {results.molesA.toFixed(2)}</span>
                                    <span>Ratio: {results.ratioA.toFixed(2)}</span>
                                </div>
                            </div>

                            {/* Reactant B Control */}
                            <div className={`p-4 rounded-xl border ${results.limiting === 'B' ? 'bg-purple-900/20 border-purple-500 shadow-[0_0_15px_rgba(168,85,247,0.2)]' : 'bg-[#1E293B] border-slate-700'}`}>
                                <div className="flex justify-between items-center mb-3">
                                    <h2 className="font-bold text-purple-400 flex items-center gap-2">
                                        <div className="w-3 h-3 rounded-full bg-purple-500"></div> Reactant B
                                    </h2>
                                    {results.limiting === 'B' && <span className="text-[10px] bg-purple-500 text-white px-2 py-0.5 rounded font-bold uppercase tracking-wider">Limiting</span>}
                                </div>
                                
                                <div className="grid grid-cols-2 gap-3 mb-4">
                                    <NumberInput label="Coefficient" value={coeffB} onChange={setCoeffB} />
                                    <NumberInput label="Molar Mass (g/mol)" value={mmB} onChange={setMmB} />
                                </div>
                                
                                <div className="mb-1 flex justify-between items-end">
                                    <label className="text-xs text-slate-400 font-bold">Starting Mass</label>
                                    <span className="font-mono text-purple-300 font-bold">{massB.toFixed(1)} g</span>
                                </div>
                                <input 
                                    type="range" min="0" max="200" step="0.5" 
                                    value={massB} onChange={e => setMassB(parseFloat(e.target.value))}
                                    className="text-purple-500 w-full"
                                />
                                <div className="mt-3 text-xs text-slate-500 flex justify-between font-mono">
                                    <span>Available Moles: {results.molesB.toFixed(2)}</span>
                                    <span>Ratio: {results.ratioB.toFixed(2)}</span>
                                </div>
                            </div>

                            {/* Product P Setup */}
                            <div className="p-4 rounded-xl bg-[#1E293B] border border-slate-700 opacity-90">
                                <h2 className="font-bold text-emerald-400 flex items-center gap-2 mb-3">
                                    <div className="w-3 h-3 rounded-full bg-emerald-500"></div> Target Product P
                                </h2>
                                <div className="grid grid-cols-2 gap-3">
                                    <NumberInput label="Coefficient" value={coeffP} onChange={setCoeffP} />
                                    <NumberInput label="Molar Mass (g/mol)" value={mmP} onChange={setMmP} />
                                </div>
                            </div>

                        </section>

                        {/* RIGHT PANEL: Results & Charts */}
                        <section className="flex flex-col gap-4 w-full lg:w-2/3 h-full">
                            
                            {/* Headline Stats Dashboard */}
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 shrink-0">
                                
                                <div className="bg-[#1E293B] rounded-xl p-4 border border-slate-700 flex flex-col justify-center items-center text-center">
                                    <span className="text-xs text-slate-400 uppercase font-bold tracking-wider mb-1">Limiting Reagent</span>
                                    {results.limiting === 'Balanced' ? (
                                        <span className="text-xl font-black text-slate-300">Perfectly Balanced</span>
                                    ) : (
                                        <span className={`text-4xl font-black ${results.limiting === 'A' ? 'text-blue-400' : 'text-purple-400'}`}>
                                            Reactant {results.limiting}
                                        </span>
                                    )}
                                </div>

                                <div className="bg-[#1E293B] rounded-xl p-4 border border-emerald-900/50 flex flex-col justify-center items-center text-center shadow-[inset_0_-2px_10px_rgba(16,185,129,0.05)]">
                                    <span className="text-xs text-emerald-500/70 uppercase font-bold tracking-wider mb-1">Theoretical Yield (P)</span>
                                    <span className="text-3xl font-black text-emerald-400 font-mono">{results.massP.toFixed(1)} g</span>
                                    <span className="text-xs text-slate-500 mt-1">{results.molesP.toFixed(2)} mol</span>
                                </div>

                                <div className="bg-[#1E293B] rounded-xl p-4 border border-red-900/30 flex flex-col justify-center items-center text-center">
                                    <span className="text-xs text-red-400/70 uppercase font-bold tracking-wider mb-1">Excess Remaining</span>
                                    <span className="text-3xl font-black text-red-400 font-mono">
                                        {results.limiting === 'Balanced' ? '0.0' : (results.limiting === 'A' ? results.remMassB.toFixed(1) : results.remMassA.toFixed(1))} g
                                    </span>
                                    <span className="text-xs text-slate-500 mt-1">
                                        {results.limiting === 'Balanced' ? '--' : `Reactant ${results.limiting === 'A' ? 'B' : 'A'}`}
                                    </span>
                                </div>

                            </div>

                            {/* Plotly Chart Container */}
                            <div className="bg-[#1E293B] rounded-xl border border-slate-700 p-4 flex-1 flex flex-col min-h-[300px]">
                                <div className="flex justify-between items-center border-b border-slate-800 pb-2 mb-2 shrink-0">
                                    <h3 className="text-sm font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                                        <BeakerIcon className="w-4 h-4 text-slate-400" /> Molar Distribution
                                    </h3>
                                </div>
                                <div className="flex-1 w-full relative" ref={chartRef}>
                                    {/* Plotly Injects Here */}
                                </div>
                            </div>

                        </section>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
