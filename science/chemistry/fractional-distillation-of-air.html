<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Fractional Distillation of Liquid Air</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Cryogenic Animations */
        @keyframes bubbleRise {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            20% { opacity: 0.8; }
            100% { transform: translateY(-250px) scale(1.2); opacity: 0; }
        }
        .anim-bubble { animation: bubbleRise 2.5s infinite ease-in; transform-origin: center; }

        @keyframes gasFlow {
            0% { stroke-dashoffset: 20; }
            100% { stroke-dashoffset: 0; }
        }
        .anim-flow { animation: gasFlow 0.5s infinite linear; }

        @keyframes frostPulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }
        .anim-frost { animation: frostPulse 3s infinite ease-in-out; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        /* Range slider styling for cold theme */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #F8FAFC;
            border: 3px solid #0F172A;
            cursor: pointer;
            margin-top: -10px;
            box-shadow: 0 0 12px rgba(56,189,248,0.8);
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:active {
            transform: scale(1.15);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: linear-gradient(90deg, #1E3A8A 0%, #3B82F6 50%, #EF4444 100%);
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-[#020617] m-0 p-0 overflow-hidden text-slate-100 font-sans select-none">
    
    <!-- Primary SEO Keyword -->
    <span class="hidden">Fractional distillation of liquid air animation</span>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        // --- ICON COMPONENTS ---
        const SvgIcon = ({ children, size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
        );
        const AlertCircle = (p) => <SvgIcon {...p}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></SvgIcon>;

        // --- SCIENTIFIC DATA ---
        const GASES = [
            { id: 'N2', name: 'Nitrogen', formula: 'N₂', bp: -196, bpRange: [-197, -195], color: '#3B82F6', fraction: 78.09 },
            { id: 'Ar', name: 'Argon', formula: 'Ar', bp: -186, bpRange: [-187, -185], color: '#A855F7', fraction: 0.93 },
            { id: 'O2', name: 'Oxygen', formula: 'O₂', bp: -183, bpRange: [-184, -182], color: '#EF4444', fraction: 20.95 },
        ];

        function App() {
            const [temperature, setTemperature] = useState(-200);

            // Thermodynamic Math Engine
            // Calculates the percentage of each gas that has boiled into vapor based on temperature
            const states = useMemo(() => {
                const getCollected = (temp, [start, end]) => {
                    if (temp <= start) return 0;
                    if (temp >= end) return 100;
                    return ((temp - start) / (end - start)) * 100;
                };

                const n2Col = getCollected(temperature, GASES[0].bpRange);
                const arCol = getCollected(temperature, GASES[1].bpRange);
                const o2Col = getCollected(temperature, GASES[2].bpRange);

                return {
                    N2: { collected: n2Col, liquid: 100 - n2Col, isBoiling: n2Col > 0 && n2Col < 100 },
                    Ar: { collected: arCol, liquid: 100 - arCol, isBoiling: arCol > 0 && arCol < 100 },
                    O2: { collected: o2Col, liquid: 100 - o2Col, isBoiling: o2Col > 0 && o2Col < 100 }
                };
            }, [temperature]);

            // Determine which gas is currently active for UI feedback
            let activeGas = null;
            if (states.N2.isBoiling) activeGas = GASES[0];
            else if (states.Ar.isBoiling) activeGas = GASES[1];
            else if (states.O2.isBoiling) activeGas = GASES[2];

            return (
                <div className="flex flex-col h-screen w-full selection:bg-cyan-500/30">
                    
                    {/* HEADER */}
                    <header className="h-[10%] min-h-[70px] bg-[#0F172A] border-b border-slate-700 flex items-center justify-between px-8 shadow-md z-20 shrink-0">
                        <div>
                            <h1 className="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-300 to-cyan-300 flex items-center gap-2">
                                ❄️ Cryogenic Fractional Distillation
                            </h1>
                            <p className="text-xs text-slate-400 mt-1 font-mono">Separating Liquefied Air via Boiling Point Differentials</p>
                        </div>
                        <div className="flex items-center gap-4">
                            <div className="bg-slate-900 border border-slate-700 px-6 py-2 rounded-lg text-center flex flex-col justify-center min-w-[120px] relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-full h-full bg-blue-500/10 anim-frost pointer-events-none"></div>
                                <span className="text-[10px] text-slate-400 uppercase tracking-wider relative z-10 font-bold">Temperature</span>
                                <span className={`text-2xl font-mono font-bold relative z-10 transition-colors ${temperature > -190 ? 'text-orange-300' : 'text-blue-300'}`}>
                                    {temperature.toFixed(1)}°C
                                </span>
                            </div>
                        </div>
                    </header>

                    {/* MAIN CONTENT AREA */}
                    <main className="flex-1 flex w-full h-[90%] p-4 gap-4 min-h-0">
                        
                        {/* LEFT PANEL: CONTROLS & DATA */}
                        <section className="w-1/3 min-w-[320px] flex flex-col gap-4 overflow-y-auto custom-scrollbar pr-2">
                            
                            {/* Temperature Control */}
                            <div className="bg-[#0F172A] rounded-xl border border-slate-700 p-6 shadow-lg flex flex-col gap-6 relative overflow-hidden shrink-0">
                                <div className="absolute top-0 right-0 w-32 h-32 bg-blue-500/5 rounded-full blur-3xl pointer-events-none"></div>
                                
                                <h2 className="text-xs font-bold text-slate-400 uppercase tracking-widest border-b border-slate-700 pb-2">Thermal Controller</h2>
                                
                                <div>
                                    <div className="flex justify-between items-center mb-4">
                                        <span className="text-xs text-blue-400 font-bold">-200°C (Coldest)</span>
                                        <span className="text-xs text-red-400 font-bold">-175°C (Warmer)</span>
                                    </div>
                                    <input 
                                        type="range" 
                                        min="-200" max="-175" step="0.5"
                                        value={temperature} 
                                        onChange={(e) => setTemperature(parseFloat(e.target.value))}
                                        className="w-full"
                                    />
                                    <p className="text-[10px] text-slate-500 mt-4 italic text-center leading-relaxed">
                                        Slowly increase the temperature to observe sequential boiling. Gases will evaporate from the liquid mixture as their specific boiling points are reached.
                                    </p>
                                </div>
                            </div>

                            {/* Active Process Feedback */}
                            <div className={`shrink-0 rounded-xl border p-6 shadow-lg transition-colors duration-500 flex flex-col justify-center relative overflow-hidden min-h-[140px] ${
                                activeGas ? 'bg-slate-900 border-slate-600' : 'bg-[#0F172A] border-slate-700'
                            }`}>
                                <h2 className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Current Phase Activity</h2>
                                
                                {activeGas ? (
                                    <div className="animate-fade-in" key={activeGas.id}>
                                        <div className="flex items-center gap-3 mb-2">
                                            <div className="w-4 h-4 rounded-full animate-pulse" style={{ backgroundColor: activeGas.color, boxShadow: `0 0 10px ${activeGas.color}` }}></div>
                                            <span className="text-2xl font-bold" style={{ color: activeGas.color }}>{activeGas.name} ({activeGas.formula})</span>
                                        </div>
                                        <div className="text-4xl font-mono font-black text-white mb-2">{activeGas.bp}°C</div>
                                        <p className="text-sm text-slate-300 leading-relaxed">
                                            At {temperature}°C, <strong>{activeGas.name}</strong> reaches its boiling point. It evaporates from the liquid mixture, rises up the fractionating column, and is routed to its collection chamber.
                                        </p>
                                    </div>
                                ) : (
                                    <div className="text-slate-500 italic text-sm">
                                        {temperature <= GASES[0].bpRange[0] 
                                            ? "Mixture is entirely liquid. Waiting for thermal increase..." 
                                            : temperature >= GASES[2].bpRange[1]
                                                ? "All major components have been successfully boiled off and collected."
                                                : "Temperature is between boiling points. Currently no active phase changes."}
                                    </div>
                                )}
                            </div>

                            {/* Composition Dashboard */}
                            <div className="bg-[#0F172A] rounded-xl border border-slate-700 p-5 shadow-lg flex flex-col gap-4 shrink-0">
                                <h2 className="text-xs font-bold text-slate-400 uppercase tracking-widest border-b border-slate-700 pb-2">Gas Collection Status</h2>
                                
                                <div className="flex flex-col gap-3">
                                    {GASES.map(gas => {
                                        const colPercent = states[gas.id].collected;
                                        return (
                                            <div key={gas.id} className="bg-slate-800/50 p-3 rounded border border-slate-700">
                                                <div className="flex justify-between items-center mb-1">
                                                    <span className="text-sm font-bold text-slate-300">{gas.name} <span className="text-xs text-slate-500 font-mono">BP: {gas.bp}°C</span></span>
                                                    <span className="text-xs font-mono font-bold" style={{ color: gas.color }}>
                                                        {Math.floor(colPercent)}% Collected
                                                    </span>
                                                </div>
                                                <div className="w-full bg-slate-900 rounded-full h-1.5 overflow-hidden">
                                                    <div 
                                                        className="h-full rounded-full transition-all duration-300" 
                                                        style={{ width: `${colPercent}%`, backgroundColor: gas.color }}
                                                    ></div>
                                                </div>
                                            </div>
                                        )
                                    })}
                                </div>
                            </div>

                            {/* Pedagogical Note */}
                            <div className="bg-[#0F172A] rounded-xl border border-slate-700 p-5 shadow-lg flex flex-col gap-2 shrink-0 mt-auto">
                                <h2 className="text-xs font-bold text-amber-500 uppercase tracking-widest flex items-center gap-1">
                                    <AlertCircle size={14} /> Exam Note: Pre-Purification
                                </h2>
                                <p className="text-[11px] text-slate-400 leading-relaxed">
                                    Before air is liquefied at these extreme temperatures, <strong>Water Vapor (H₂O)</strong> and <strong>Carbon Dioxide (CO₂)</strong> must be removed. Because their freezing points are much higher, they would turn into solid ice and block the cryogenic pipes!
                                </p>
                            </div>

                        </section>

                        {/* RIGHT PANEL: APPARATUS CANVAS */}
                        <section className="w-2/3 bg-[#0B1121] rounded-xl border border-slate-700 p-6 shadow-inner relative overflow-hidden flex items-center justify-center">
                            
                            <CryogenicSVG states={states} gases={GASES} />

                        </section>

                    </main>
                </div>
            );
        }

        // --- APPARATUS SVG COMPONENT ---
        function CryogenicSVG({ states, gases }) {
            
            // Calculate stacked liquid heights for the main flask
            // Total height available in the flask graphic is 140 units (from y=380 to y=520)
            const MAX_HEIGHT = 140;
            
            // Proportional heights based on remaining liquid percentages (each gas out of 100)
            // We scale so that when all are at 100% liquid, they perfectly fill the MAX_HEIGHT
            const n2H = (states.N2.liquid / 100) * (MAX_HEIGHT / 3);
            const arH = (states.Ar.liquid / 100) * (MAX_HEIGHT / 3);
            const o2H = (states.O2.liquid / 100) * (MAX_HEIGHT / 3);

            // Stack them properly from the bottom up (Bottom is y=520, which maps to h=140 from y=380)
            // O2 is at the bottom (highest boiling point, stays liquid longest)
            const o2Y = MAX_HEIGHT - o2H;
            const arY = o2Y - arH;
            const n2Y = arY - n2H;

            // Generate Bubbles dynamically based on which gas is boiling
            const renderBubbles = () => {
                const bubbles = [];
                gases.forEach((gas) => {
                    if (states[gas.id].isBoiling) {
                        for (let i = 0; i < 6; i++) {
                            bubbles.push(
                                <circle 
                                    key={`${gas.id}-${i}`}
                                    cx={150 + (Math.random() - 0.5) * 20} // Tighter spread to go up the column
                                    cy={480 + (Math.random() * 20)} 
                                    r={Math.random() * 3 + 2} 
                                    fill={gas.color} 
                                    className="anim-bubble"
                                    style={{ animationDelay: `${Math.random()}s`, animationDuration: `${1.5 + Math.random()}s` }}
                                />
                            );
                        }
                    }
                });
                return bubbles;
            };

            return (
                <div className="w-full h-full max-w-[800px] relative">
                    <svg viewBox="0 0 800 600" className="w-full h-full">
                        
                        <defs>
                            <clipPath id="flask-clip">
                                <circle cx="150" cy="450" r="70" />
                            </clipPath>
                            <clipPath id="tank-n2-clip"><rect x="450" y="50" width="100" height="120" rx="10" /></clipPath>
                            <clipPath id="tank-ar-clip"><rect x="450" y="220" width="100" height="120" rx="10" /></clipPath>
                            <clipPath id="tank-o2-clip"><rect x="450" y="390" width="100" height="120" rx="10" /></clipPath>
                            
                            {/* Frost gradient for the outside of the flask */}
                            <radialGradient id="frostGrad" cx="50%" cy="50%" r="50%">
                                <stop offset="80%" stopColor="transparent" />
                                <stop offset="100%" stopColor="rgba(255,255,255,0.4)" />
                            </radialGradient>
                        </defs>

                        {/* --- PIPING INFRASTRUCTURE --- */}
                        <g id="pipes" fill="none" stroke="#475569" strokeWidth="8" strokeLinejoin="round" strokeLinecap="round">
                            {/* Fractionating Column (Replaces simple vertical pipe) */}
                            <rect x="130" y="110" width="40" height="200" fill="rgba(255,255,255,0.05)" strokeWidth="4" />
                            
                            {/* Fractionating Column Baffles/Trays */}
                            <g stroke="#94A3B8" strokeWidth="3">
                                <line x1="130" y1="140" x2="160" y2="140" />
                                <line x1="170" y1="170" x2="140" y2="170" />
                                <line x1="130" y1="200" x2="160" y2="200" />
                                <line x1="170" y1="230" x2="140" y2="230" />
                                <line x1="130" y1="260" x2="160" y2="260" />
                                <line x1="170" y1="290" x2="140" y2="290" />
                            </g>

                            {/* Horizontal delivery branches to tanks */}
                            <path d="M 150 110 L 450 110" /> {/* N2 Branch (Top of column) */}
                            <path d="M 170 280 L 450 280" /> {/* Ar Branch (Middle of column) */}
                            <path d="M 150 450 L 450 450" /> {/* O2 Branch (Directly from flask side) */}
                        </g>

                        {/* Animated Gas Flows (Overlay on pipes) */}
                        <g fill="none" strokeWidth="4" strokeDasharray="10 10">
                            {states.N2.isBoiling && <path d="M 150 380 L 150 110 L 450 110" stroke={gases[0].color} className="anim-flow" />}
                            {states.Ar.isBoiling && <path d="M 150 380 L 150 280 L 450 280" stroke={gases[1].color} className="anim-flow" />}
                            {states.O2.isBoiling && <path d="M 150 380 L 150 450 L 450 450" stroke={gases[2].color} className="anim-flow" />}
                        </g>

                        {/* --- LIQUID AIR FLASK --- */}
                        <g id="main-flask">
                            {/* Liquid Stack */}
                            <g clipPath="url(#flask-clip)">
                                {/* Background for empty space */}
                                <rect x="80" y="380" width="140" height="140" fill="rgba(255,255,255,0.02)" />
                                
                                {/* O2 Layer (Bottom) */}
                                <rect x="80" y={380 + o2Y} width="140" height={o2H} fill={gases[2].color} opacity="0.8" className="transition-all duration-300" />
                                {/* Ar Layer (Middle) */}
                                <rect x="80" y={380 + arY} width="140" height={arH} fill={gases[1].color} opacity="0.8" className="transition-all duration-300" />
                                {/* N2 Layer (Top) */}
                                <rect x="80" y={380 + n2Y} width="140" height={n2H} fill={gases[0].color} opacity="0.8" className="transition-all duration-300" />
                                
                                {/* Bubbles */}
                                {renderBubbles()}
                            </g>
                            
                            {/* Glass Outline (Flask neck connects perfectly to column bottom at y=310) */}
                            <path d="M 130 310 L 130 385 A 70 70 0 1 0 170 385 L 170 310 Z" fill="url(#frostGrad)" stroke="#94A3B8" strokeWidth="4" className="anim-frost" />
                            <text x="150" y="550" fill="#94A3B8" fontSize="14" fontWeight="bold" textAnchor="middle" letterSpacing="2">LIQUID AIR</text>
                            
                            {/* Insulation Box indicating extreme cold */}
                            <rect x="70" y="370" width="160" height="160" fill="none" stroke="#38BDF8" strokeWidth="2" strokeDasharray="5 5" opacity="0.5" />
                            <text x="150" y="570" fill="#38BDF8" fontSize="10" textAnchor="middle" opacity="0.7">CRYOGENIC CHAMBER</text>
                        </g>

                        {/* --- COLLECTION TANKS --- */}
                        {/* N2 Tank (Top) */}
                        <g id="tank-n2">
                            <g clipPath="url(#tank-n2-clip)">
                                <rect x="450" y="50" width="100" height="120" fill="rgba(255,255,255,0.05)" />
                                <rect x="450" y={50 + (120 - (states.N2.collected * 1.2))} width="100" height={states.N2.collected * 1.2} fill={gases[0].color} opacity="0.5" className="transition-all duration-300" />
                            </g>
                            <rect x="450" y="50" width="100" height="120" rx="10" fill="none" stroke="#94A3B8" strokeWidth="4" />
                            <rect x="490" y="40" width="20" height="10" fill="#475569" />
                            <text x="500" y="115" fill="#FFF" fontSize="24" fontWeight="black" textAnchor="middle">{gases[0].formula}</text>
                            <text x="630" y="100" fill={gases[0].color} fontSize="14" fontWeight="bold">Nitrogen Gas</text>
                            <text x="630" y="120" fill="#94A3B8" fontSize="12">BP: -196°C</text>
                        </g>

                        {/* Ar Tank (Middle) */}
                        <g id="tank-ar">
                            <g clipPath="url(#tank-ar-clip)">
                                <rect x="450" y="220" width="100" height="120" fill="rgba(255,255,255,0.05)" />
                                <rect x="450" y={220 + (120 - (states.Ar.collected * 1.2))} width="100" height={states.Ar.collected * 1.2} fill={gases[1].color} opacity="0.5" className="transition-all duration-300" />
                            </g>
                            <rect x="450" y="220" width="100" height="120" rx="10" fill="none" stroke="#94A3B8" strokeWidth="4" />
                            <rect x="490" y="210" width="20" height="10" fill="#475569" />
                            <text x="500" y="285" fill="#FFF" fontSize="24" fontWeight="black" textAnchor="middle">{gases[1].formula}</text>
                            <text x="630" y="270" fill={gases[1].color} fontSize="14" fontWeight="bold">Argon Gas</text>
                            <text x="630" y="290" fill="#94A3B8" fontSize="12">BP: -186°C</text>
                        </g>

                        {/* O2 Tank (Bottom) */}
                        <g id="tank-o2">
                            <g clipPath="url(#tank-o2-clip)">
                                <rect x="450" y="390" width="100" height="120" fill="rgba(255,255,255,0.05)" />
                                <rect x="450" y={390 + (120 - (states.O2.collected * 1.2))} width="100" height={states.O2.collected * 1.2} fill={gases[2].color} opacity="0.5" className="transition-all duration-300" />
                            </g>
                            <rect x="450" y="390" width="100" height="120" rx="10" fill="none" stroke="#94A3B8" strokeWidth="4" />
                            <rect x="490" y="380" width="20" height="10" fill="#475569" />
                            <text x="500" y="455" fill="#FFF" fontSize="24" fontWeight="black" textAnchor="middle">{gases[2].formula}</text>
                            <text x="630" y="440" fill={gases[2].color} fontSize="14" fontWeight="bold">Oxygen Gas</text>
                            <text x="630" y="460" fill="#94A3B8" fontSize="12">BP: -183°C</text>
                        </g>

                        {/* Valves (Change color based on boiling state) */}
                        <circle cx="300" cy="110" r="12" fill={states.N2.isBoiling ? gases[0].color : '#334155'} stroke="#1E293B" strokeWidth="4" className="transition-colors duration-300" />
                        <circle cx="300" cy="280" r="12" fill={states.Ar.isBoiling ? gases[1].color : '#334155'} stroke="#1E293B" strokeWidth="4" className="transition-colors duration-300" />
                        <circle cx="300" cy="450" r="12" fill={states.O2.isBoiling ? gases[2].color : '#334155'} stroke="#1E293B" strokeWidth="4" className="transition-colors duration-300" />
                        
                    </svg>
                </div>
            );
        }

        // Initialize React
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
