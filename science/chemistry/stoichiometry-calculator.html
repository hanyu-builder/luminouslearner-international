<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stoichiometry Practice Simulator</title>
    <!-- Primary SEO Keyword: Stoichiometry practice simulator -->
    <meta name="description" content="Master chemical conversions with this stoichiometry practice simulator. Snap calculation blocks into the correct dimensional analysis sequence to solve mass-to-mass and mass-to-volume problems.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React, ReactDOM, and Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        
        /* Drag & Drop Visual Feedback */
        .slot-active { background-color: rgba(59, 130, 246, 0.2); border-color: #3b82f6; }
        .block-dragging { opacity: 0.5; transform: scale(0.95); }
        
        /* Engine Glow */
        .engine-active {
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.15);
            border-color: #10b981;
        }
    </style>
</head>
<body class="bg-[#0F172A] text-slate-200 h-screen max-h-[1000px] overflow-hidden flex flex-col font-sans select-none">
    
    <div id="root" class="h-full w-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- INLINE ICONS ---
        const PuzzleIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19.439 7.85c-.049.322.059.648.289.878l1.568 1.568c.47.47.706 1.087.706 1.704s-.235 1.233-.706 1.704l-1.611 1.611a.98.98 0 0 1-.837.276c-.47-.07-.952.151-1.251.549a1.71 1.71 0 0 0-.309 1.182c.039.31-.044.62-.227.876L15.4 19.863c-.42.593-1.037.954-1.745 1.053a2.44 2.44 0 0 1-2.19-.714l-1.026-1.026a1.21 1.21 0 0 0-.859-.354 1.2 1.2 0 0 0-.86.354l-1.026 1.026a2.44 2.44 0 0 1-2.19.714 2.46 2.46 0 0 1-1.745-1.053l-1.66-2.339a1.18 1.18 0 0 1-.227-.876 1.71 1.71 0 0 0-.309-1.182 1.53 1.53 0 0 0-1.251-.55.98.98 0 0 1-.837-.276L2.3 12.992c-.47-.47-.706-1.087-.706-1.704s.235-1.233.706-1.704l1.568-1.568c.23-.23.338-.556.289-.878a1.72 1.72 0 0 0-.877-1.236 1.53 1.53 0 0 0-1.353-.105.98.98 0 0 1-.88-.139L.3 4.318A2.45 2.45 0 0 1 0 2.5a2.47 2.47 0 0 1 1.52-1.92l2.339-1.042a1.18 1.18 0 0 1 1.182.13 1.71 1.71 0 0 0 1.956.126 1.53 1.53 0 0 0 .55-1.251C7.477.22 7.798 0 8.12 0c.617 0 1.234.235 1.704.706l1.611 1.611a.98.98 0 0 1 .276.837c-.07.47.151.952.549 1.251.36.262.827.35 1.182.309.31-.039.62.044.876.227l2.339 1.66c.593.42.954 1.037 1.053 1.745.1.708-.135 1.416-.653 1.934z"></path></svg>;
        const LockIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>;
        const UnlockIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-emerald-400"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path></svg>;
        const ArrowRight = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>;
        const CheckCircle = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-emerald-400"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>;

        // --- BLOCK DEFINITIONS ---
        const BLOCKS = {
            mass_in: { id: 'mass_in', title: 'Start with Mass (g)', color: 'bg-blue-600', short: 'Input Mass' },
            to_moles: { id: 'to_moles', title: '÷ Molar Mass (A)', color: 'bg-indigo-600', short: 'To Moles' },
            ratio: { id: 'ratio', title: '× Ratio (B/A)', color: 'bg-purple-600', short: 'Molar Ratio' },
            to_out: { id: 'to_out', title: '× Conversion Factor (B)', color: 'bg-emerald-600', short: 'Output' }
        };
        const CORRECT_SEQUENCE = ['mass_in', 'to_moles', 'ratio', 'to_out'];

        function App() {
            // --- STATE ---
            // Chemical Input State
            const [massA, setMassA] = useState(15.5);
            const [mmA, setMmA] = useState(32.0);
            const [coeffA, setCoeffA] = useState(2);
            
            const [mmB, setMmB] = useState(18.0);
            const [coeffB, setCoeffB] = useState(3);
            const [outputType, setOutputType] = useState('mass'); // 'mass' or 'gas'

            // Pipeline State (4 Slots)
            const [slots, setSlots] = useState([null, null, null, null]);
            const [draggedId, setDraggedId] = useState(null);
            const [draggedOverIndex, setDraggedOverIndex] = useState(null);

            // --- DRAG AND DROP LOGIC ---
            const handleDragStart = (e, id) => {
                setDraggedId(id);
                e.dataTransfer.setData('text/plain', id);
                e.dataTransfer.effectAllowed = 'move';
            };

            const handleDragOver = (e, index) => {
                e.preventDefault();
                setDraggedOverIndex(index);
            };

            const handleDragLeave = () => {
                setDraggedOverIndex(null);
            };

            const handleDrop = (e, index) => {
                e.preventDefault();
                setDraggedOverIndex(null);
                const id = e.dataTransfer.getData('text/plain');
                if (!id) return;

                const newSlots = [...slots];
                // Remove block from its old position if it exists
                const oldIndex = newSlots.indexOf(id);
                if (oldIndex !== -1) newSlots[oldIndex] = null;
                
                // Place block in new position (overwriting whatever was there, which goes back to toolbox)
                newSlots[index] = id;
                setSlots(newSlots);
                setDraggedId(null);
            };

            const removeBlock = (index) => {
                const newSlots = [...slots];
                newSlots[index] = null;
                setSlots(newSlots);
            };

            // --- COMPUTATION ENGINE ---
            const isPipelineCorrect = useMemo(() => {
                return slots.every((val, index) => val === CORRECT_SEQUENCE[index]);
            }, [slots]);

            const calculations = useMemo(() => {
                if (!isPipelineCorrect) return null;
                
                const step1 = massA;
                const step2 = step1 / mmA;
                const step3 = step2 * (coeffB / coeffA);
                const step4 = outputType === 'mass' ? (step3 * mmB) : (step3 * 24.0); // 24.0 L/mol at RTP

                return {
                    molesA: step2,
                    molesB: step3,
                    finalOut: step4
                };
            }, [isPipelineCorrect, massA, mmA, coeffA, mmB, coeffB, outputType]);

            // --- UI HELPERS ---
            const availableBlocks = Object.keys(BLOCKS).filter(id => !slots.includes(id));

            return (
                <div className="flex flex-col h-full w-full">
                    {/* Header */}
                    <header className="bg-[#1E293B] border-b border-slate-800 p-4 shrink-0 flex flex-col md:flex-row justify-between items-center z-10 gap-3">
                        <div>
                            <h1 className="text-xl md:text-2xl font-bold text-white flex items-center gap-2">
                                <PuzzleIcon /> Stoichiometry Practice Simulator
                            </h1>
                            <p className="text-xs md:text-sm text-slate-400 mt-1">Assemble the dimensional analysis pipeline to unlock the calculation engine.</p>
                        </div>
                        <div className="bg-slate-900 border border-slate-700 px-4 py-2 rounded-lg font-mono text-xs flex gap-4 text-slate-400 shadow-inner">
                            <span className="flex items-center gap-1"><div className="w-2 h-2 rounded-full bg-blue-500"></div> A (Known)</span>
                            <ArrowRight />
                            <span className="flex items-center gap-1"><div className="w-2 h-2 rounded-full bg-emerald-500"></div> B (Unknown)</span>
                        </div>
                    </header>

                    {/* Main Workspace */}
                    <main className="flex-1 flex flex-col lg:flex-row gap-6 p-4 md:p-6 overflow-hidden max-w-7xl w-full mx-auto">
                        
                        {/* LEFT: Chemical Parameters */}
                        <section className="flex flex-col gap-4 w-full lg:w-1/3 shrink-0 overflow-y-auto pr-2">
                            <div className="bg-[#1E293B] p-5 rounded-xl border border-slate-700 shadow-lg">
                                <h2 className="text-sm uppercase font-bold text-slate-400 mb-4 border-b border-slate-700 pb-2 flex items-center gap-2">
                                    <span className="bg-blue-900 text-blue-400 px-2 py-0.5 rounded">1</span> Reactant A Data
                                </h2>
                                <div className="space-y-3">
                                    <div className="flex flex-col gap-1">
                                        <label className="text-xs font-bold text-slate-500">Given Mass (g)</label>
                                        <input type="number" min="0" step="any" value={massA} onChange={e => setMassA(parseFloat(e.target.value) || 0)} 
                                            className="bg-slate-900 border border-slate-600 rounded p-2 text-blue-300 font-mono focus:border-blue-500 outline-none w-full"/>
                                    </div>
                                    <div className="flex gap-3">
                                        <div className="flex flex-col gap-1 flex-1">
                                            <label className="text-xs font-bold text-slate-500">Coefficient</label>
                                            <input type="number" min="1" value={coeffA} onChange={e => setCoeffA(parseInt(e.target.value) || 1)} 
                                                className="bg-slate-900 border border-slate-600 rounded p-2 text-slate-200 font-mono focus:border-blue-500 outline-none w-full"/>
                                        </div>
                                        <div className="flex flex-col gap-1 flex-1">
                                            <label className="text-xs font-bold text-slate-500">Molar Mass (g/mol)</label>
                                            <input type="number" min="0.1" step="any" value={mmA} onChange={e => setMmA(parseFloat(e.target.value) || 0)} 
                                                className="bg-slate-900 border border-slate-600 rounded p-2 text-slate-200 font-mono focus:border-blue-500 outline-none w-full"/>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="bg-[#1E293B] p-5 rounded-xl border border-slate-700 shadow-lg">
                                <h2 className="text-sm uppercase font-bold text-slate-400 mb-4 border-b border-slate-700 pb-2 flex items-center gap-2">
                                    <span className="bg-emerald-900 text-emerald-400 px-2 py-0.5 rounded">2</span> Product B Data
                                </h2>
                                <div className="space-y-3">
                                    <div className="flex gap-3">
                                        <div className="flex flex-col gap-1 flex-1">
                                            <label className="text-xs font-bold text-slate-500">Coefficient</label>
                                            <input type="number" min="1" value={coeffB} onChange={e => setCoeffB(parseInt(e.target.value) || 1)} 
                                                className="bg-slate-900 border border-slate-600 rounded p-2 text-slate-200 font-mono focus:border-emerald-500 outline-none w-full"/>
                                        </div>
                                        <div className="flex flex-col gap-1 flex-1">
                                            <label className="text-xs font-bold text-slate-500">Molar Mass (g/mol)</label>
                                            <input type="number" min="0.1" step="any" value={mmB} onChange={e => setMmB(parseFloat(e.target.value) || 0)} 
                                                className="bg-slate-900 border border-slate-600 rounded p-2 text-slate-200 font-mono focus:border-emerald-500 outline-none w-full"/>
                                        </div>
                                    </div>
                                    <div className="flex flex-col gap-1">
                                        <label className="text-xs font-bold text-slate-500">Desired Output Form</label>
                                        <div className="flex gap-2">
                                            <button onClick={() => setOutputType('mass')} className={`flex-1 py-1.5 rounded text-xs font-bold transition ${outputType === 'mass' ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-slate-400 border border-slate-600'}`}>
                                                Mass (g)
                                            </button>
                                            <button onClick={() => setOutputType('gas')} className={`flex-1 py-1.5 rounded text-xs font-bold transition ${outputType === 'gas' ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-slate-400 border border-slate-600'}`}>
                                                Gas Volume (L)
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </section>

                        {/* RIGHT: Puzzle & Engine */}
                        <section className="flex flex-col gap-6 w-full lg:w-2/3 h-full overflow-y-auto">
                            
                            {/* The Toolbox */}
                            <div className="bg-[#1E293B] rounded-xl border border-slate-700 p-4 shadow-lg shrink-0">
                                <h3 className="text-xs uppercase font-bold text-slate-400 mb-3 tracking-wider">Toolbox: Drag Blocks to Pipeline</h3>
                                <div className="flex flex-wrap gap-3 min-h-[60px] p-2 bg-slate-900/50 rounded-lg border border-slate-800 border-dashed">
                                    {availableBlocks.length === 0 && <span className="text-sm text-slate-600 italic m-auto">All blocks deployed</span>}
                                    {availableBlocks.map(id => {
                                        const block = BLOCKS[id];
                                        return (
                                            <div key={id} draggable onDragStart={(e) => handleDragStart(e, id)}
                                                 className={`${block.color} text-white px-4 py-2 rounded shadow-md cursor-grab active:cursor-grabbing font-bold text-sm transform transition hover:-translate-y-1 hover:shadow-lg flex items-center gap-2`}>
                                                {block.short}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            {/* The Pipeline */}
                            <div className="flex flex-col gap-2 shrink-0 relative">
                                <div className="absolute top-1/2 left-0 w-full h-1 bg-slate-800 -z-10 -translate-y-1/2 rounded-full"></div>
                                <div className="flex justify-between gap-2 overflow-x-auto pb-4">
                                    {[0, 1, 2, 3].map(index => {
                                        const blockId = slots[index];
                                        const isHovered = draggedOverIndex === index;
                                        
                                        return (
                                            <div key={index} 
                                                onDragOver={(e) => handleDragOver(e, index)}
                                                onDragLeave={handleDragLeave}
                                                onDrop={(e) => handleDrop(e, index)}
                                                className={`flex-1 min-w-[120px] h-24 rounded-xl border-2 border-dashed flex flex-col items-center justify-center transition-all p-2 relative
                                                ${isHovered ? 'slot-active scale-105' : 'border-slate-600 bg-[#1E293B]'}
                                                ${blockId ? 'border-solid shadow-lg border-transparent ' + BLOCKS[blockId].color : ''}`}>
                                                
                                                {blockId ? (
                                                    <div className="w-full h-full flex flex-col items-center justify-center text-center cursor-grab active:cursor-grabbing"
                                                         draggable onDragStart={(e) => handleDragStart(e, blockId)}>
                                                        <span className="text-white font-bold text-sm drop-shadow-md leading-tight">{BLOCKS[blockId].title}</span>
                                                        <button onClick={() => removeBlock(index)} className="absolute -top-2 -right-2 bg-slate-800 text-slate-300 rounded-full w-6 h-6 flex items-center justify-center border border-slate-600 hover:bg-red-500 hover:text-white transition">×</button>
                                                    </div>
                                                ) : (
                                                    <span className="text-slate-500 text-xs font-bold uppercase tracking-wider text-center">Step {index + 1}</span>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            {/* Calculation Engine Output */}
                            <div className={`flex-1 rounded-xl border-2 p-6 transition-all duration-500 flex flex-col relative overflow-hidden ${isPipelineCorrect ? 'bg-[#0F172A] engine-active' : 'bg-slate-900 border-slate-800'}`}>
                                
                                {!isPipelineCorrect ? (
                                    <div className="m-auto flex flex-col items-center text-center opacity-50">
                                        <LockIcon />
                                        <h3 className="mt-4 font-bold text-slate-300 text-lg">Engine Locked</h3>
                                        <p className="text-sm text-slate-500 mt-2 max-w-sm">Place the calculation blocks in the correct stoichiometric sequence (Dimensional Analysis) to run the calculation.</p>
                                    </div>
                                ) : (
                                    <div className="w-full h-full flex flex-col animate-fade-in">
                                        <div className="flex items-center justify-between border-b border-emerald-900/30 pb-4 mb-4">
                                            <h3 className="text-emerald-400 font-bold flex items-center gap-2"><UnlockIcon /> Computation Engine Active</h3>
                                            <CheckCircle />
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 flex-1">
                                            {/* Step-by-step Math */}
                                            <div className="bg-[#1E293B] rounded-lg p-4 border border-slate-700 font-mono text-sm space-y-4">
                                                <div className="flex justify-between items-center text-slate-400">
                                                    <span>1. Moles of A:</span>
                                                    <span className="text-blue-300">{massA} / {mmA} = <span className="font-bold text-white">{calculations.molesA.toFixed(3)} mol</span></span>
                                                </div>
                                                <div className="flex justify-between items-center text-slate-400">
                                                    <span>2. Molar Ratio:</span>
                                                    <span className="text-purple-300">{coeffB} / {coeffA}</span>
                                                </div>
                                                <div className="flex justify-between items-center text-slate-400">
                                                    <span>3. Moles of B:</span>
                                                    <span className="text-white font-bold">{calculations.molesB.toFixed(3)} mol</span>
                                                </div>
                                                <div className="flex justify-between items-center pt-3 border-t border-slate-700 text-slate-400">
                                                    <span>4. Final Factor:</span>
                                                    <span className="text-emerald-300">× {outputType === 'mass' ? mmB : '24.0 (RTP)'}</span>
                                                </div>
                                            </div>

                                            {/* Final Result Display */}
                                            <div className="bg-emerald-900/10 rounded-lg border border-emerald-800/30 p-6 flex flex-col items-center justify-center text-center shadow-[inset_0_0_20px_rgba(16,185,129,0.05)]">
                                                <span className="text-xs uppercase font-bold text-emerald-500 tracking-widest mb-2">Final Answer</span>
                                                <div className="text-5xl font-black text-white font-mono break-all">
                                                    {calculations.finalOut.toFixed(2)}
                                                </div>
                                                <span className="text-emerald-400 mt-2 font-bold text-lg">
                                                    {outputType === 'mass' ? 'Grams (g)' : 'Liters (L)'} of B
                                                </span>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>

                        </section>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
