<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Covalent Bonding Dot & Cross Diagram Simulator</title>
    <meta name="description" content="Interactive Covalent bonding dot and cross diagram simulator. Drag and share valence electrons to fulfill the octet rule.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: { 850: '#151e2e', 900: '#0F172A', 950: '#020617' },
                        bond: {
                            dot: '#38BDF8',    // Cyan
                            cross: '#F43F5E',  // Rose
                            success: '#10B981' // Emerald
                        }
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #0F172A; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        #draw-area {
            background-image: radial-gradient(circle at 2px 2px, #1e293b 1px, transparent 0);
            background-size: 40px 40px;
            background-position: -19px -19px;
            touch-action: none; /* Crucial for mobile dragging */
        }

        /* Success Pulse Animation */
        @keyframes successPulse {
            0% { filter: drop-shadow(0 0 5px rgba(16, 185, 129, 0.4)); stroke: #10B981; }
            50% { filter: drop-shadow(0 0 25px rgba(16, 185, 129, 0.8)); stroke: #34D399; }
            100% { filter: drop-shadow(0 0 5px rgba(16, 185, 129, 0.4)); stroke: #10B981; }
        }
        .orbital-success {
            animation: successPulse 2s infinite ease-in-out;
            stroke-width: 4px;
        }
        
        .electron {
            cursor: grab;
            transition: transform 0.1s;
        }
        .electron:active {
            cursor: grabbing;
            transform: scale(1.2);
        }
    </style>
</head>
<body class="text-slate-200 font-sans selection:bg-cyan-500 selection:text-white">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Data Dictionary ---
        const MOLECULES = {
            H2: { id: 'H2', name: 'Hydrogen (H₂)', a1: 'H', a2: 'H', v1: 1, v2: 1, t1: 2, t2: 2, shared: 2, desc: "A single covalent bond sharing 1 pair of electrons." },
            Cl2: { id: 'Cl2', name: 'Chlorine (Cl₂)', a1: 'Cl', a2: 'Cl', v1: 7, v2: 7, t1: 8, t2: 8, shared: 2, desc: "A single covalent bond sharing 1 pair to reach octets." },
            O2: { id: 'O2', name: 'Oxygen (O₂)', a1: 'O', a2: 'O', v1: 6, v2: 6, t1: 8, t2: 8, shared: 4, desc: "A double covalent bond sharing 2 pairs of electrons." },
            N2: { id: 'N2', name: 'Nitrogen (N₂)', a1: 'N', a2: 'N', v1: 5, v2: 5, t1: 8, t2: 8, shared: 6, desc: "A triple covalent bond sharing 3 pairs of electrons." },
            HCl: { id: 'HCl', name: 'Hydrogen Chloride (HCl)', a1: 'H', a2: 'Cl', v1: 1, v2: 7, t1: 2, t2: 8, shared: 2, desc: "Hydrogen needs a duet, Chlorine needs an octet." }
        };

        // --- SVG Icons ---
        const CheckCircle = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>;
        const Info = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>;
        const Refresh = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>;

        function App() {
            // -- State --
            const [activeMol, setActiveMol] = useState(MOLECULES.O2);
            const [electrons, setElectrons] = useState([]);
            const [draggedId, setDraggedId] = useState(null);
            const [counts, setCounts] = useState({ left: 0, right: 0, shared: 0 });
            const [isSuccess, setIsSuccess] = useState(false);
            
            const svgRef = useRef(null);

            // Orbital Geometry Constants
            const L_CENTER = { x: 220, y: 200 };
            const R_CENTER = { x: 380, y: 200 };
            const RADIUS = 140;

            // -- Initialization --
            const initMolecule = (mol) => {
                const newElectrons = [];
                let idCounter = 0;

                // Scatter Atom 1 (Dots) strictly on the left
                for (let i = 0; i < mol.v1; i++) {
                    const angle = Math.PI/2 + (Math.PI * i / Math.max(1, mol.v1 - 1)); // Spread along left arc
                    newElectrons.push({
                        id: `e${idCounter++}`,
                        type: 'dot',
                        x: L_CENTER.x + Math.cos(angle) * (RADIUS - 40) - 20,
                        y: L_CENTER.y + Math.sin(angle) * (RADIUS - 40)
                    });
                }

                // Scatter Atom 2 (Crosses) strictly on the right
                for (let i = 0; i < mol.v2; i++) {
                    const angle = -Math.PI/2 + (Math.PI * i / Math.max(1, mol.v2 - 1)); // Spread along right arc
                    newElectrons.push({
                        id: `e${idCounter++}`,
                        type: 'cross',
                        x: R_CENTER.x + Math.cos(angle) * (RADIUS - 40) + 20,
                        y: R_CENTER.y + Math.sin(angle) * (RADIUS - 40)
                    });
                }

                setElectrons(newElectrons);
                setIsSuccess(false);
                evaluateSystem(newElectrons, mol);
            };

            useEffect(() => {
                initMolecule(activeMol);
            }, [activeMol]);

            // -- Physics & Logic Engine --
            const getSVGCoords = (evt) => {
                const pt = svgRef.current.createSVGPoint();
                if (evt.touches && evt.touches.length > 0) {
                    pt.x = evt.touches[0].clientX;
                    pt.y = evt.touches[0].clientY;
                } else {
                    pt.x = evt.clientX;
                    pt.y = evt.clientY;
                }
                return pt.matrixTransform(svgRef.current.getScreenCTM().inverse());
            };

            const evaluateSystem = (currentElectrons, mol) => {
                let left = 0;
                let right = 0;
                let shared = 0;

                currentElectrons.forEach(e => {
                    const distL = Math.hypot(e.x - L_CENTER.x, e.y - L_CENTER.y);
                    const distR = Math.hypot(e.x - R_CENTER.x, e.y - R_CENTER.y);
                    
                    const inLeft = distL <= RADIUS;
                    const inRight = distR <= RADIUS;

                    if (inLeft && inRight) {
                        shared++; left++; right++;
                    } else if (inLeft) {
                        left++;
                    } else if (inRight) {
                        right++;
                    }
                });

                setCounts({ left, right, shared });
                
                if (left === mol.t1 && right === mol.t2 && shared === mol.shared) {
                    setIsSuccess(true);
                } else {
                    setIsSuccess(false);
                }
            };

            // -- Drag Event Handlers --
            const handlePointerDown = (e, id) => {
                if (isSuccess) return; // Lock if won
                e.stopPropagation();
                setDraggedId(id);
            };

            const handlePointerMove = (e) => {
                if (!draggedId || isSuccess) return;
                e.preventDefault(); // Prevent scrolling on touch
                const coords = getSVGCoords(e);
                
                setElectrons(prev => prev.map(el => 
                    el.id === draggedId ? { ...el, x: coords.x, y: coords.y } : el
                ));
            };

            const handlePointerUp = () => {
                if (draggedId) {
                    setDraggedId(null);
                    evaluateSystem(electrons, activeMol);
                }
            };

            // -- Render Helpers --
            const drawElectron = (el) => {
                if (el.type === 'dot') {
                    return <circle cx={el.x} cy={el.y} r="8" fill="#38BDF8" className="drop-shadow-md" />;
                } else {
                    return (
                        <g transform={`translate(${el.x}, ${el.y})`} className="drop-shadow-md">
                            <line x1="-7" y1="-7" x2="7" y2="7" stroke="#F43F5E" strokeWidth="4" strokeLinecap="round" />
                            <line x1="-7" y1="7" x2="7" y2="-7" stroke="#F43F5E" strokeWidth="4" strokeLinecap="round" />
                        </g>
                    );
                }
            };

            return (
                <div className="flex flex-col md:flex-row h-screen max-h-[1000px] w-full bg-slate-950">
                    
                    {/* Left Panel: UI & Telemetry */}
                    <aside className="w-full md:w-[380px] lg:w-[420px] bg-slate-900 border-b md:border-b-0 md:border-r border-slate-700 flex flex-col z-10 shadow-2xl h-[45vh] md:h-full shrink-0">
                        
                        <div className="p-6 pb-4 border-b border-slate-800 flex justify-between items-start">
                            <div>
                                <h1 className="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-blue-500">
                                    Covalent Bond Sharer
                                </h1>
                                <p className="text-xs text-slate-400 mt-1">2D Orbital Overlap Engine</p>
                            </div>
                        </div>

                        <div className="flex flex-col flex-grow overflow-y-auto no-scrollbar p-6 space-y-6">
                            
                            {/* Molecule Selector */}
                            <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700">
                                <label className="text-xs font-semibold text-slate-400 uppercase tracking-wider block mb-2">Target Molecule</label>
                                <select 
                                    className="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-slate-200 outline-none focus:border-cyan-500 transition-colors shadow-inner"
                                    value={activeMol.id}
                                    onChange={(e) => setActiveMol(MOLECULES[e.target.value])}
                                >
                                    {Object.values(MOLECULES).map(m => (
                                        <option key={m.id} value={m.id}>{m.name}</option>
                                    ))}
                                </select>
                                <p className="text-xs text-slate-500 mt-3 flex items-start gap-2">
                                    <Info className="shrink-0 text-cyan-500 w-4 h-4" />
                                    {activeMol.desc}
                                </p>
                            </div>

                            {/* Telemetry Panel */}
                            <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 shadow-inner flex flex-col gap-4">
                                <h2 className="text-xs font-semibold text-slate-400 uppercase tracking-wider flex justify-between items-center">
                                    Orbital Telemetry
                                    <button onClick={() => initMolecule(activeMol)} className="text-slate-500 hover:text-cyan-400 transition-colors" title="Reset Electrons">
                                        <Refresh />
                                    </button>
                                </h2>

                                {/* Atom 1 Status */}
                                <div>
                                    <div className="flex justify-between text-sm mb-1">
                                        <span className="text-bond-dot font-bold">Left Atom ({activeMol.a1})</span>
                                        <span className={`${counts.left === activeMol.t1 ? 'text-bond-success' : 'text-slate-300'} font-mono`}>
                                            {counts.left} / {activeMol.t1} e⁻
                                        </span>
                                    </div>
                                    <div className="w-full bg-slate-800 rounded-full h-1.5">
                                        <div className={`h-1.5 rounded-full transition-all ${counts.left === activeMol.t1 ? 'bg-bond-success' : 'bg-bond-dot'}`} style={{width: `${Math.min(100, (counts.left/activeMol.t1)*100)}%`}}></div>
                                    </div>
                                </div>

                                {/* Atom 2 Status */}
                                <div>
                                    <div className="flex justify-between text-sm mb-1">
                                        <span className="text-bond-cross font-bold">Right Atom ({activeMol.a2})</span>
                                        <span className={`${counts.right === activeMol.t2 ? 'text-bond-success' : 'text-slate-300'} font-mono`}>
                                            {counts.right} / {activeMol.t2} e⁻
                                        </span>
                                    </div>
                                    <div className="w-full bg-slate-800 rounded-full h-1.5">
                                        <div className={`h-1.5 rounded-full transition-all ${counts.right === activeMol.t2 ? 'bg-bond-success' : 'bg-bond-cross'}`} style={{width: `${Math.min(100, (counts.right/activeMol.t2)*100)}%`}}></div>
                                    </div>
                                </div>

                                {/* Shared Status */}
                                <div className="pt-2 border-t border-slate-800">
                                    <div className="flex justify-between text-sm mb-1">
                                        <span className="text-slate-300 font-bold">Shared Intersection</span>
                                        <span className={`${counts.shared === activeMol.shared ? 'text-bond-success' : 'text-slate-300'} font-mono`}>
                                            {counts.shared} / {activeMol.shared} e⁻
                                        </span>
                                    </div>
                                </div>
                            </div>

                            {/* Success State */}
                            {isSuccess && (
                                <div className="bg-emerald-500/20 border border-emerald-500/50 p-4 rounded-xl flex items-center gap-4 animate-in fade-in slide-in-from-bottom-4 duration-500">
                                    <div className="bg-emerald-500 p-2 rounded-full text-slate-900">
                                        <CheckCircle />
                                    </div>
                                    <div>
                                        <h3 className="text-emerald-400 font-bold text-sm">Octet Rule Satisfied!</h3>
                                        <p className="text-emerald-200/70 text-xs mt-1">Both atomic shells are stable.</p>
                                    </div>
                                </div>
                            )}

                        </div>
                    </aside>

                    {/* Right Panel: Interactive Visualizer */}
                    <main className="flex-grow relative bg-slate-950 flex flex-col h-[55vh] md:h-full overflow-hidden">
                        
                        <svg 
                            ref={svgRef}
                            id="draw-area"
                            className="w-full h-full cursor-crosshair"
                            viewBox="0 0 600 400"
                            preserveAspectRatio="xMidYMid meet"
                            onPointerMove={handlePointerMove}
                            onPointerUp={handlePointerUp}
                            onPointerLeave={handlePointerUp}
                            onTouchMove={handlePointerMove}
                            onTouchEnd={handlePointerUp}
                        >
                            <defs>
                                <radialGradient id="leftGlow" cx="50%" cy="50%" r="50%">
                                    <stop offset="80%" stopColor="transparent" />
                                    <stop offset="100%" stopColor="rgba(56, 189, 248, 0.15)" />
                                </radialGradient>
                                <radialGradient id="rightGlow" cx="50%" cy="50%" r="50%">
                                    <stop offset="80%" stopColor="transparent" />
                                    <stop offset="100%" stopColor="rgba(244, 63, 94, 0.15)" />
                                </radialGradient>
                            </defs>

                            {/* Left Orbital */}
                            <circle 
                                cx={L_CENTER.x} cy={L_CENTER.y} r={RADIUS} 
                                fill={isSuccess ? "rgba(16, 185, 129, 0.1)" : "url(#leftGlow)"}
                                stroke={isSuccess ? "#10B981" : "#1e293b"} 
                                strokeWidth="3"
                                className={isSuccess ? "orbital-success" : "transition-colors duration-500"}
                            />
                            
                            {/* Right Orbital */}
                            <circle 
                                cx={R_CENTER.x} cy={R_CENTER.y} r={RADIUS} 
                                fill={isSuccess ? "rgba(16, 185, 129, 0.1)" : "url(#rightGlow)"}
                                stroke={isSuccess ? "#10B981" : "#1e293b"} 
                                strokeWidth="3"
                                className={isSuccess ? "orbital-success" : "transition-colors duration-500"}
                            />

                            {/* Atom Cores */}
                            <g transform={`translate(${L_CENTER.x}, ${L_CENTER.y})`}>
                                <circle cx="0" cy="0" r="25" fill="#0F172A" stroke="#38BDF8" strokeWidth="2" />
                                <text x="0" y="6" textAnchor="middle" fill="#38BDF8" fontSize="18" fontWeight="bold">{activeMol.a1}</text>
                            </g>

                            <g transform={`translate(${R_CENTER.x}, ${R_CENTER.y})`}>
                                <circle cx="0" cy="0" r="25" fill="#0F172A" stroke="#F43F5E" strokeWidth="2" />
                                <text x="0" y="6" textAnchor="middle" fill="#F43F5E" fontSize="18" fontWeight="bold">{activeMol.a2}</text>
                            </g>

                            {/* Electrons */}
                            {electrons.map(el => (
                                <g 
                                    key={el.id}
                                    className="electron"
                                    onPointerDown={(e) => handlePointerDown(e, el.id)}
                                    onTouchStart={(e) => handlePointerDown(e, el.id)}
                                >
                                    {/* Invisible larger hit area for easier grabbing */}
                                    <circle cx={el.x} cy={el.y} r="20" fill="transparent" />
                                    {drawElectron(el)}
                                </g>
                            ))}
                        </svg>

                        {/* Interactive Hint Overlay */}
                        {!isSuccess && (
                            <div className="absolute bottom-6 left-1/2 -translate-x-1/2 bg-slate-900/80 backdrop-blur-md border border-slate-700/50 text-slate-300 text-xs py-2 px-6 rounded-full pointer-events-none shadow-xl flex items-center gap-2 whitespace-nowrap">
                                <svg className="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path></svg>
                                Drag electrons into the overlapping intersection
                            </div>
                        )}
                    </main>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
