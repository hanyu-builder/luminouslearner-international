<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chemical Test for Water Simulator</title>
  <meta name="description" content="Interactive chemistry simulator for testing the presence of water using anhydrous Cobalt(II) Chloride and Copper(II) Sulfate.">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for in-browser JSX transpilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { background-color: #0F172A; margin: 0; overflow: hidden; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    
    /* Custom Scrollbar */
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(30, 41, 59, 0.5); }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(71, 85, 105, 0.8); border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 1); }
  </style>
</head>
<body class="bg-slate-900 text-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // --- ICON COMPONENTS (Fixed for Browser Environment) ---
    const SvgIcon = ({ children, size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
    );
    const Droplet = (p) => <SvgIcon {...p}><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></SvgIcon>;
    const Info = (p) => <SvgIcon {...p}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></SvgIcon>;
    const RefreshCw = (p) => <SvgIcon {...p}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></SvgIcon>;
    const Beaker = (p) => <SvgIcon {...p}><path d="M4.5 3h15"/><path d="M6 3v16a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V3"/><path d="M14 9h4"/></SvgIcon>;
    const PlayCircle = (p) => <SvgIcon {...p}><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></SvgIcon>;

    // --- CANVAS RENDERER COMPONENT ---
    // Handles the requestAnimationFrame loop and custom drawing logic for both tests.
    const ChemicalCanvas = ({ type, liquid, trigger, onAnimationComplete }) => {
      const canvasRef = useRef(null);
      
      // Mutable animation state to avoid React re-renders during 60fps drawing
      const anim = useRef({
        state: 'idle', // 'idle', 'dropping', 'spreading', 'done'
        dropY: 20,
        spreadRadius: 0,
        particles: []
      });

      // Initialize powder particles for Copper Sulfate
      useEffect(() => {
        if (type === 'copper') {
          const pts = [];
          // Generate a mound of particles
          for (let i = 0; i < 400; i++) {
            const angle = Math.random() * Math.PI;
            const radius = Math.random() * 70; 
            const x = 150 + Math.cos(angle) * radius;
            // Bell curve for mound height
            const moundHeight = 50 * Math.exp(-(Math.pow(radius, 2)) / 800);
            const y = 160 - Math.random() * moundHeight;
            pts.push({ x, y, r: Math.random() * 3 + 1.5 });
          }
          anim.current.particles = pts;
        }
      }, [type]);

      // Trigger animation when prop changes
      useEffect(() => {
        if (trigger > 0) {
          anim.current.state = 'dropping';
          anim.current.dropY = 20;
          anim.current.spreadRadius = 0;
        } else if (trigger === 0) {
          anim.current.state = 'idle';
          anim.current.dropY = 20;
          anim.current.spreadRadius = 0;
        }
      }, [trigger]);

      // Main drawing loop
      useEffect(() => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        const drawDropper = (x, y) => {
          ctx.fillStyle = '#cbd5e1'; // glass
          ctx.fillRect(x - 6, y - 40, 12, 40);
          ctx.beginPath();
          ctx.moveTo(x - 6, y);
          ctx.lineTo(x, y + 15);
          ctx.lineTo(x + 6, y);
          ctx.fill();
          ctx.fillStyle = '#334155'; // bulb
          ctx.fillRect(x - 12, y - 70, 24, 30);
        };

        const drawDroplet = (x, y) => {
          // Water is light blue, ethanol is slightly yellowish/clear
          ctx.fillStyle = liquid === 'water' ? 'rgba(56, 189, 248, 0.8)' : 'rgba(253, 230, 138, 0.6)';
          ctx.beginPath();
          ctx.arc(x, y, 5, 0, Math.PI);
          ctx.lineTo(x, y - 8);
          ctx.fill();
        };

        const render = () => {
          // Clear canvas
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          const cx = canvas.width / 2;

          // 1. Draw Substrate (Paper or Powder)
          if (type === 'cobalt') {
            // Cobalt(II) Chloride Paper
            ctx.fillStyle = '#1e3a8a'; // Anhydrous Blue
            ctx.fillRect(50, 60, 200, 120);
            
            // Add texture
            ctx.fillStyle = 'rgba(255,255,255,0.05)';
            for(let i=0; i<100; i++) {
               ctx.fillRect(50 + Math.random()*200, 60 + Math.random()*120, 2, 2);
            }

            // Hydration Spread
            if (anim.current.spreadRadius > 0) {
              ctx.save();
              // Clip to paper bounds
              ctx.beginPath();
              ctx.rect(50, 60, 200, 120);
              ctx.clip();
              
              const grad = ctx.createRadialGradient(cx, 120, 0, cx, 120, anim.current.spreadRadius);
              if (liquid === 'water') {
                grad.addColorStop(0, '#ec4899'); // Hydrated Pink
                grad.addColorStop(1, 'rgba(236, 72, 153, 0)');
              } else {
                grad.addColorStop(0, 'rgba(15, 23, 42, 0.4)'); // Just wet/dark
                grad.addColorStop(1, 'rgba(15, 23, 42, 0)');
              }
              ctx.fillStyle = grad;
              ctx.arc(cx, 120, anim.current.spreadRadius, 0, Math.PI * 2);
              ctx.fill();
              ctx.restore();
            }

          } else if (type === 'copper') {
            // Anhydrous Copper(II) Sulfate Powder
            anim.current.particles.forEach(p => {
              // Check distance to drop center (cx, 140)
              const dist = Math.hypot(p.x - cx, p.y - 140);
              
              if (dist < anim.current.spreadRadius && liquid === 'water') {
                ctx.fillStyle = '#3b82f6'; // Hydrated Bright Blue
              } else if (dist < anim.current.spreadRadius && liquid === 'ethanol') {
                ctx.fillStyle = '#cbd5e1'; // Just wet/grayish
              } else {
                ctx.fillStyle = '#f8fafc'; // Anhydrous White
              }
              
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
              ctx.fill();
              
              // Shadow/3D effect
              ctx.fillStyle = 'rgba(0,0,0,0.1)';
              ctx.arc(p.x, p.y + 1, p.r, 0, Math.PI * 2);
              ctx.fill();
            });
          }

          // 2. Animation Logic & Rendering Dropper
          if (anim.current.state === 'idle') {
            // Base state
          } else if (anim.current.state === 'dropping') {
            drawDropper(cx, 30);
            drawDroplet(cx, anim.current.dropY);
            anim.current.dropY += 5; // Fall speed
            
            const targetY = type === 'cobalt' ? 120 : 140;
            if (anim.current.dropY >= targetY) {
              anim.current.state = 'spreading';
            }
          } else if (anim.current.state === 'spreading') {
            drawDropper(cx, 30);
            anim.current.spreadRadius += 2; // Spread speed
            
            if (anim.current.spreadRadius > 80) {
              anim.current.state = 'done';
              if (onAnimationComplete) onAnimationComplete(type, liquid);
            }
          } else if (anim.current.state === 'done') {
            // Hold final state, dropper leaves
            anim.current.spreadRadius = 80;
          }

          animationFrameId = window.requestAnimationFrame(render);
        };

        render();

        return () => {
          window.cancelAnimationFrame(animationFrameId);
        };
      }, [type, liquid, onAnimationComplete]);

      return (
        <canvas 
          ref={canvasRef} 
          width={300} 
          height={200} 
          className="w-full h-auto bg-slate-950 rounded-lg border border-slate-700 shadow-inner"
        />
      );
    };

    // --- MAIN APPLICATION ---
    function App() {
      const [selectedLiquid, setSelectedLiquid] = useState('water'); // 'water' | 'ethanol'
      
      // Triggers act as counters to force re-animations
      const [triggerCobalt, setTriggerCobalt] = useState(0);
      const [triggerCopper, setTriggerCopper] = useState(0);
      
      // Result states
      const [cobaltResult, setCobaltResult] = useState(null);
      const [copperResult, setCopperResult] = useState(null);

      const handleAnimationComplete = useCallback((testType, liquidUsed) => {
        if (testType === 'cobalt') {
          setCobaltResult(liquidUsed === 'water' ? 'positive' : 'negative');
        } else {
          setCopperResult(liquidUsed === 'water' ? 'positive' : 'negative');
        }
      }, []);

      const resetLab = () => {
        setTriggerCobalt(0);
        setTriggerCopper(0);
        setCobaltResult(null);
        setCopperResult(null);
      };

      return (
        <div className="min-h-screen bg-slate-900 text-slate-200 font-sans p-4 md:p-8 flex flex-col items-center">
          
          {/* Header */}
          <header className="max-w-4xl w-full text-center mb-8 space-y-3">
            <h1 className="text-3xl md:text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 via-cyan-400 to-pink-400">
              Chemical Test for Water
            </h1>
            <p className="text-slate-400 text-sm md:text-base max-w-2xl mx-auto leading-relaxed">
              Explore the hydration mechanics of transition metal complexes. Observe the structural color change when water molecules act as ligands, coordinating to anhydrous salts.
            </p>
          </header>

          <div className="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            {/* LEFT PANEL: Controls & Liquid Selection */}
            <div className="lg:col-span-4 flex flex-col gap-4">
              
              <div className="bg-slate-800/60 rounded-xl p-5 border border-slate-700 shadow-lg">
                <h2 className="text-lg font-bold text-cyan-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                  <Beaker size={20} /> Select Reagent
                </h2>
                
                <div className="space-y-3">
                  <label className={`flex items-center gap-3 p-4 rounded-lg cursor-pointer border-2 transition-all ${selectedLiquid === 'water' ? 'border-cyan-400 bg-cyan-900/30' : 'border-slate-600 bg-slate-800 hover:border-slate-500'}`}>
                    <input type="radio" name="liquid" value="water" checked={selectedLiquid === 'water'} onChange={() => setSelectedLiquid('water')} className="hidden" />
                    <div className="flex-grow">
                      <span className="font-bold text-slate-200 block">Distilled Water</span>
                      <span className="text-xs font-mono text-cyan-300">H₂O (l)</span>
                    </div>
                    <Droplet className="text-cyan-400" size={24} />
                  </label>

                  <label className={`flex items-center gap-3 p-4 rounded-lg cursor-pointer border-2 transition-all ${selectedLiquid === 'ethanol' ? 'border-amber-400 bg-amber-900/30' : 'border-slate-600 bg-slate-800 hover:border-slate-500'}`}>
                    <input type="radio" name="liquid" value="ethanol" checked={selectedLiquid === 'ethanol'} onChange={() => setSelectedLiquid('ethanol')} className="hidden" />
                    <div className="flex-grow">
                      <span className="font-bold text-slate-200 block">Absolute Ethanol</span>
                      <span className="text-xs font-mono text-amber-300">C₂H₅OH (l)</span>
                    </div>
                    <Droplet className="text-amber-400" size={24} />
                  </label>
                </div>

                <p className="text-xs text-slate-400 mt-4 leading-relaxed">
                  * Note: This is a qualitative test for the <b>presence</b> of water, not its purity. Ethanol is provided as a negative control.
                </p>

                <button onClick={resetLab} className="mt-6 w-full py-3 bg-slate-700 hover:bg-slate-600 font-bold rounded-lg transition text-sm flex items-center justify-center gap-2 shadow-md">
                  <RefreshCw size={16} /> Wash Workbenches
                </button>
              </div>

            </div>

            {/* RIGHT PANEL: The Workbenches */}
            <div className="lg:col-span-8 flex flex-col md:flex-row gap-6">
              
              {/* Cobalt(II) Chloride Test */}
              <div className="flex-1 bg-slate-800/60 rounded-xl p-5 border border-slate-700 shadow-lg flex flex-col">
                <div className="flex justify-between items-start mb-4">
                  <div>
                    <h3 className="text-md font-bold text-pink-400 uppercase tracking-widest">Test 1</h3>
                    <p className="text-sm font-semibold text-slate-300">Cobalt(II) Chloride Paper</p>
                  </div>
                  <button 
                    onClick={() => setTriggerCobalt(c => c + 1)}
                    disabled={triggerCobalt > 0 && !cobaltResult}
                    className="bg-pink-600 hover:bg-pink-500 disabled:bg-slate-700 text-white p-2 rounded-full transition shadow-md"
                    title="Add Drop"
                  >
                    <PlayCircle size={24} />
                  </button>
                </div>

                {/* Canvas Container */}
                <div className="mb-4">
                  <ChemicalCanvas type="cobalt" liquid={selectedLiquid} trigger={triggerCobalt} onAnimationComplete={handleAnimationComplete} />
                </div>

                {/* Logic / Equations */}
                <div className="flex-grow bg-slate-900/80 p-4 rounded-lg border border-slate-700 text-sm">
                  <div className="font-mono text-xs text-slate-400 mb-2 border-b border-slate-700 pb-2">
                    <span className="text-blue-400">CoCl₂ (s)</span> + <span className="text-cyan-300">6H₂O (l)</span> &rarr; <span className="text-pink-400">CoCl₂·6H₂O (s)</span>
                  </div>
                  
                  {!cobaltResult ? (
                    <p className="text-slate-400 italic text-xs leading-relaxed">
                      Anhydrous cobalt(II) chloride is blue. Awaiting liquid addition...
                    </p>
                  ) : cobaltResult === 'positive' ? (
                    <div className="animate-pulse">
                      <p className="text-pink-300 font-bold mb-1">POSITIVE: Water Detected!</p>
                      <p className="text-slate-300 text-xs leading-relaxed">
                        Water molecules form coordinate bonds with the Co<sup>2+</sup> ion, forming the octahedral hexaaquacobalt(II) complex. This changes the d-orbital splitting, absorbing green light and reflecting <b>pink</b>.
                      </p>
                    </div>
                  ) : (
                    <div className="">
                      <p className="text-amber-300 font-bold mb-1">NEGATIVE: No Water</p>
                      <p className="text-slate-300 text-xs leading-relaxed">
                        Ethanol merely wets the paper. Lacking sufficient hydration enthalpy to displace the chloride ligands, the complex remains tetrahedral and <b>blue</b>.
                      </p>
                    </div>
                  )}
                </div>
              </div>

              {/* Copper(II) Sulfate Test */}
              <div className="flex-1 bg-slate-800/60 rounded-xl p-5 border border-slate-700 shadow-lg flex flex-col">
                <div className="flex justify-between items-start mb-4">
                  <div>
                    <h3 className="text-md font-bold text-blue-400 uppercase tracking-widest">Test 2</h3>
                    <p className="text-sm font-semibold text-slate-300">Anhydrous Copper(II) Sulfate</p>
                  </div>
                  <button 
                    onClick={() => setTriggerCopper(c => c + 1)}
                    disabled={triggerCopper > 0 && !copperResult}
                    className="bg-blue-600 hover:bg-blue-500 disabled:bg-slate-700 text-white p-2 rounded-full transition shadow-md"
                    title="Add Drop"
                  >
                    <PlayCircle size={24} />
                  </button>
                </div>

                {/* Canvas Container */}
                <div className="mb-4">
                  <ChemicalCanvas type="copper" liquid={selectedLiquid} trigger={triggerCopper} onAnimationComplete={handleAnimationComplete} />
                </div>

                {/* Logic / Equations */}
                <div className="flex-grow bg-slate-900/80 p-4 rounded-lg border border-slate-700 text-sm">
                  <div className="font-mono text-xs text-slate-400 mb-2 border-b border-slate-700 pb-2">
                    <span className="text-slate-200">CuSO₄ (s)</span> + <span className="text-cyan-300">5H₂O (l)</span> &rarr; <span className="text-blue-400">CuSO₄·5H₂O (s)</span>
                  </div>
                  
                  {!copperResult ? (
                    <p className="text-slate-400 italic text-xs leading-relaxed">
                      Anhydrous copper(II) sulfate powder is white. Awaiting liquid addition...
                    </p>
                  ) : copperResult === 'positive' ? (
                    <div className="animate-pulse">
                      <p className="text-blue-300 font-bold mb-1">POSITIVE: Water Detected!</p>
                      <p className="text-slate-300 text-xs leading-relaxed">
                        Water acts as a ligand, hydrating the Cu<sup>2+</sup> ions. Four water molecules coordinate directly to the copper, changing its crystal field energy to absorb red/orange light and reflect vibrant <b>blue</b>.
                      </p>
                    </div>
                  ) : (
                    <div className="">
                      <p className="text-amber-300 font-bold mb-1">NEGATIVE: No Water</p>
                      <p className="text-slate-300 text-xs leading-relaxed">
                        Ethanol fails to hydrate the Cu<sup>2+</sup> ions. Without aqueous ligands to alter the d-d transitions, the powder remains <b>white</b> (colorless).
                      </p>
                    </div>
                  )}
                </div>
              </div>

            </div>

          </div>

          {/* Info Footer */}
          <div className="mt-8 flex items-start gap-3 bg-slate-800/40 p-4 rounded-xl border border-slate-700 max-w-4xl mx-auto w-full">
            <Info className="text-cyan-400 shrink-0 mt-0.5" size={20} />
            <p className="text-xs text-slate-400 leading-relaxed">
              <strong className="text-slate-300">Chemistry Note:</strong> These are <i>chemical</i> tests indicating the presence of water molecules via hydration. To determine if a sample is <i>pure</i> water (a physical test), you must measure its exact boiling point (100&deg;C) or freezing point (0&deg;C) at 1 atmosphere of pressure.
            </p>
          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
