<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metal Displacement Reactions Simulator</title>
  <meta name="description" content="Interactive metal displacement reactions simulator. Predict binary logic gate reactions using the reactivity series and auto-generate balanced chemical equations.">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for in-browser JSX transpilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { background-color: #0F172A; margin: 0; overflow: hidden; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    
    /* Custom Scrollbar */
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(30, 41, 59, 0.5); }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(71, 85, 105, 0.8); border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 1); }

    /* Drag over animation */
    .drag-over { border-color: #38bdf8 !important; background-color: rgba(56, 189, 248, 0.1) !important; transform: scale(1.02); }

    /* Bubbling animation for Alkali/Water reactions */
    @keyframes bubble {
      0% { transform: translateY(0) scale(1); opacity: 0.8; }
      100% { transform: translateY(-80px) scale(1.8); opacity: 0; }
    }
    .animate-bubble { animation: bubble 1s ease-in infinite; }

    /* Dissolving metal animation */
    @keyframes dissolve {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(0.2); opacity: 0; }
    }
    .animate-dissolve { animation: dissolve 3s forwards; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- ICON COMPONENTS ---
    const SvgIcon = ({ children, size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
    );
    const Activity = (p) => <SvgIcon {...p}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12" /></SvgIcon>;
    const CheckCircle2 = (p) => <SvgIcon {...p}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></SvgIcon>;
    const XCircle = (p) => <SvgIcon {...p}><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></SvgIcon>;
    const Info = (p) => <SvgIcon {...p}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></SvgIcon>;
    const Beaker = (p) => <SvgIcon {...p}><path d="M4.5 3h15"/><path d="M6 3v16a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V3"/><path d="M14 9h4"/></SvgIcon>;
    const Cpu = (p) => <SvgIcon {...p}><rect width="16" height="16" x="4" y="4" rx="2"/><rect width="6" height="6" x="9" y="9" rx="1"/><path d="M15 2v2"/><path d="M15 20v2"/><path d="M2 15h2"/><path d="M2 9h2"/><path d="M20 15h2"/><path d="M20 9h2"/><path d="M9 2v2"/><path d="M9 20v2"/></SvgIcon>;
    const RefreshCw = (p) => <SvgIcon {...p}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></SvgIcon>;
    const AlertTriangle = (p) => <SvgIcon {...p}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></SvgIcon>;

    // --- CHEMISTRY DATA ENGINE ---
    const FULL_SERIES = [
      { sym: 'K', name: 'Potassium' }, { sym: 'Na', name: 'Sodium' }, { sym: 'Ca', name: 'Calcium' },
      { sym: 'Mg', name: 'Magnesium' }, { sym: 'Al', name: 'Aluminum' }, { sym: 'Zn', name: 'Zinc' },
      { sym: 'Fe', name: 'Iron' }, { sym: 'Pb', name: 'Lead' }, { sym: 'H', name: 'Hydrogen' },
      { sym: 'Cu', name: 'Copper' }, { sym: 'Ag', name: 'Silver' }, { sym: 'Au', name: 'Gold' }
    ];
    
    const REACTIVITY_SERIES = FULL_SERIES.map(m => m.sym);

    const METALS = {
      'Na': { name: 'Sodium', sym: 'Na', charge: 1, color: 'bg-slate-100', hex: '#f8fafc' },
      'Mg': { name: 'Magnesium', sym: 'Mg', charge: 2, color: 'bg-slate-300', hex: '#cbd5e1' },
      'Al': { name: 'Aluminum', sym: 'Al', charge: 3, color: 'bg-slate-400', hex: '#94a3b8' },
      'Zn': { name: 'Zinc', sym: 'Zn', charge: 2, color: 'bg-slate-500', hex: '#64748b' },
      'Fe': { name: 'Iron', sym: 'Fe', charge: 2, color: 'bg-stone-500', hex: '#78716c' },
      'Cu': { name: 'Copper', sym: 'Cu', charge: 2, color: 'bg-amber-600', hex: '#d97706' },
      'Ag': { name: 'Silver', sym: 'Ag', charge: 1, color: 'bg-gray-200', hex: '#e5e7eb' }
    };

    const SOLUTIONS = [
      { id: 'NaCl', name: 'Sodium Chloride', cation: 'Na', anion: 'Cl', charge: 1, color: 'rgba(255, 255, 255, 0.05)' },
      { id: 'MgSO₄', name: 'Magnesium Sulfate', cation: 'Mg', anion: 'SO₄', charge: 2, color: 'rgba(255, 255, 255, 0.05)' },
      { id: 'Al₂(SO₄)₃', name: 'Aluminum Sulfate', cation: 'Al', anion: 'SO₄', charge: 2, color: 'rgba(255, 255, 255, 0.05)' },
      { id: 'ZnSO₄', name: 'Zinc Sulfate', cation: 'Zn', anion: 'SO₄', charge: 2, color: 'rgba(255, 255, 255, 0.05)' },
      { id: 'FeSO₄', name: 'Iron(II) Sulfate', cation: 'Fe', anion: 'SO₄', charge: 2, color: 'rgba(167, 243, 208, 0.4)' },
      { id: 'CuSO₄', name: 'Copper(II) Sulfate', cation: 'Cu', anion: 'SO₄', charge: 2, color: 'rgba(56, 189, 248, 0.6)' },
      { id: 'AgNO₃', name: 'Silver Nitrate', cation: 'Ag', anion: 'NO₃', charge: 1, color: 'rgba(255, 255, 255, 0.05)' }
    ];

    // --- AUTO-EQUATION GENERATOR ---
    const getFormula = (m, mC, a, aC) => {
        if (mC === 1 && aC === 1) return `${m}${a}`;
        if (mC === 2 && aC === 2) return `${m}${a}`;
        if (mC === 3 && aC === 3) return `${m}${a}`;
        if (mC === 1 && aC === 2) return `${m}₂${a}`;
        if (mC === 2 && aC === 1) return `${m}${a.includes('O') ? `(${a})₂` : `${a}₂`}`;
        if (mC === 3 && aC === 1) return `${m}${a.includes('O') ? `(${a})₃` : `${a}₃`}`;
        if (mC === 3 && aC === 2) return `${m}₂${a.includes('O') ? `(${a})₃` : `${a}₃`}`;
        return `${m}${a}`;
    };

    const getSolutionColor = (cationSym) => {
      if (cationSym === 'Cu') return 'rgba(56, 189, 248, 0.6)'; // Blue
      if (cationSym === 'Fe') return 'rgba(167, 243, 208, 0.4)'; // Pale Green
      return 'rgba(255, 255, 255, 0.05)'; // Colorless
    };

    const generateEquation = (metalSym, sol) => {
      const mC = METALS[metalSym].charge;
      const cC = METALS[sol.cation].charge;
      const a = sol.anion;
      const aC = sol.charge;
      const cSym = sol.cation;

      // Universal Stoichiometry Balancing Algorithm
      const gcd = (a, b) => b === 0 ? a : gcd(b, a % b);

      const x = aC / gcd(cC, aC);
      const y = cC / gcd(cC, aC);
      const u = aC / gcd(mC, aC);
      const v = mC / gcd(mC, aC);

      const k2 = v / gcd(y, v);
      const k3 = y / gcd(y, v);
      const k1 = k3 * u;
      const k4 = k2 * x;

      const formatCoeff = (k) => k === 1 ? '' : k;
      
      const salt1 = getFormula(cSym, cC, a, aC);
      const salt2 = getFormula(metalSym, mC, a, aC);

      const eq = `${formatCoeff(k1)}${metalSym}(s) + ${formatCoeff(k2)}${salt1}(aq) ➔ ${formatCoeff(k3)}${salt2}(aq) + ${formatCoeff(k4)}${cSym}(s)`;

      return {
        equation: eq,
        productColor: getSolutionColor(metalSym)
      };
    };

    function App() {
      const [activeSolutionId, setActiveSolutionId] = useState('CuSO₄');
      const [droppedMetal, setDroppedMetal] = useState(null);
      // type: 'displacement', 'alkali', 'none', null
      const [reactionState, setReactionState] = useState({ type: null, data: null });
      const [isDragOver, setIsDragOver] = useState(false);

      const activeSolution = SOLUTIONS.find(s => s.id === activeSolutionId);

      // --- DRAG AND DROP HANDLERS ---
      const handleDragStart = (e, metalSym) => {
        e.dataTransfer.setData('metalId', metalSym);
      };

      const handleDragOver = (e) => {
        e.preventDefault();
        setIsDragOver(true);
      };

      const handleDragLeave = () => {
        setIsDragOver(false);
      };

      const handleDrop = (e) => {
        e.preventDefault();
        setIsDragOver(false);
        const metalSym = e.dataTransfer.getData('metalId');
        if (!metalSym) return;

        setDroppedMetal(metalSym);
        
        // --- LOGIC GATE ENGINE ---
        const isAlkali = ['K', 'Na', 'Ca'].includes(metalSym);

        if (isAlkali) {
          // Solvents Reactivity Override
          setReactionState({ 
            type: 'alkali', 
            data: { 
              equation: `2${metalSym}(s) + 2H₂O(l) ➔ 2${metalSym}OH(aq) + H₂(g)`,
              productColor: activeSolution.color // Water reacts, salt stays untouched mostly
            } 
          });
          return;
        }

        const metalIndex = REACTIVITY_SERIES.indexOf(metalSym);
        const cationIndex = REACTIVITY_SERIES.indexOf(activeSolution.cation);
        
        // Logical check: Lower index means higher reactivity in our array
        const didReact = metalIndex < cationIndex;
        
        if (didReact) {
          const eqData = generateEquation(metalSym, activeSolution);
          setReactionState({ type: 'displacement', data: eqData });
        } else {
          setReactionState({ type: 'none', data: null });
        }
      };

      const resetBench = () => {
        setDroppedMetal(null);
        setReactionState({ type: null, data: null });
      };

      const changeSolution = (id) => {
        setActiveSolutionId(id);
        resetBench();
      };

      // Calculate Visual Colors dynamically based on reaction state
      const currentLiquidColor = reactionState.type === 'displacement' && reactionState.data 
        ? reactionState.data.productColor 
        : activeSolution.color;

      return (
        <div className="min-h-screen bg-slate-900 flex flex-col font-sans overflow-hidden selection:bg-cyan-500/30">
          
          {/* HEADER (SEO Optimization) */}
          <header className="flex justify-between items-center px-6 py-4 bg-slate-800/80 border-b border-slate-700 shadow-lg shrink-0">
            <div className="flex items-center gap-3">
              <Activity className="text-cyan-400" size={28} />
              <div>
                <h1 className="text-2xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">
                  Metal Displacement Reactions Simulator
                </h1>
                <p className="text-xs text-slate-400 font-medium">Binary Logic Gate & Reactivity Predictor</p>
              </div>
            </div>
          </header>

          <main className="flex-1 flex gap-4 p-4 overflow-hidden max-h-[calc(100vh-80px)]">
            
            {/* LEFT PANEL: Reactivity Series */}
            <div className="w-1/4 bg-slate-800/50 border border-slate-700 rounded-2xl p-4 flex flex-col overflow-hidden shadow-inner">
              <h2 className="text-sm uppercase tracking-widest text-slate-400 font-bold mb-3 flex items-center gap-2 shrink-0">
                <Info size={16} /> Reactivity Series
              </h2>
              
              <div className="flex-1 overflow-y-auto custom-scrollbar pr-2 flex flex-col gap-1">
                <div className="text-[10px] text-slate-500 text-center font-bold tracking-widest mb-1">MOST REACTIVE</div>
                
                {FULL_SERIES.map((item, idx) => {
                  const isDropped = droppedMetal === item.sym;
                  const isCation = activeSolution.cation === item.sym;
                  let highlightClass = "border-slate-700 bg-slate-800/30 text-slate-400";
                  let badge = null;

                  if (isDropped) {
                    highlightClass = "border-cyan-500 bg-cyan-900/30 text-cyan-300 font-bold transform scale-105 shadow-lg shadow-cyan-900/50 z-10";
                    badge = <span className="text-[10px] bg-cyan-600 text-white px-2 py-0.5 rounded-full ml-auto">Elemental Metal</span>;
                  } else if (isCation) {
                    highlightClass = "border-purple-500 bg-purple-900/30 text-purple-300 font-bold transform scale-105 shadow-lg shadow-purple-900/50 z-10";
                    badge = <span className="text-[10px] bg-purple-600 text-white px-2 py-0.5 rounded-full ml-auto">Aqueous Cation</span>;
                  }

                  return (
                    <div key={item.sym} className={`flex items-center gap-3 p-2 rounded-lg border transition-all duration-300 ${highlightClass}`}>
                      <span className="font-mono text-xs opacity-50 w-4">{idx}</span>
                      <span className="font-bold text-lg w-8">{item.sym}</span>
                      <span className="text-sm hidden xl:block">{item.name}</span>
                      {badge}
                    </div>
                  );
                })}

                <div className="text-[10px] text-slate-500 text-center font-bold tracking-widest mt-1">LEAST REACTIVE</div>
              </div>
            </div>

            {/* CENTER PANEL: Interactive Bench */}
            <div className="w-2/4 flex flex-col gap-4">
              
              {/* Draggable Metal Inventory */}
              <div className="bg-slate-800 rounded-2xl p-4 border border-slate-700 shadow-xl shrink-0">
                <h3 className="text-[10px] text-slate-400 font-bold tracking-widest uppercase mb-3 text-center">Drag Elemental Metal to Test</h3>
                <div className="flex justify-center gap-3">
                  {Object.values(METALS).map(metal => (
                    <div 
                      key={metal.sym}
                      draggable
                      onDragStart={(e) => handleDragStart(e, metal.sym)}
                      className={`w-14 h-14 rounded-xl cursor-grab active:cursor-grabbing border-b-4 border-slate-900 flex flex-col items-center justify-center shadow-lg hover:translate-y-[-2px] transition-transform ${metal.color}`}
                      title={metal.name}
                    >
                      <span className="font-bold text-slate-900 text-lg">{metal.sym}</span>
                    </div>
                  ))}
                </div>
              </div>

              {/* The Beaker / Drop Zone */}
              <div 
                onDragOver={handleDragOver}
                onDragLeave={handleDragLeave}
                onDrop={handleDrop}
                className={`flex-1 bg-slate-800/80 rounded-2xl p-6 border-2 border-dashed transition-all duration-300 flex flex-col items-center justify-end relative shadow-inner overflow-hidden
                  ${isDragOver ? 'drag-over' : 'border-slate-700'} 
                  ${reactionState.type === 'displacement' ? 'border-emerald-500/50 bg-emerald-900/10' : ''}
                  ${reactionState.type === 'alkali' ? 'border-amber-500/50 bg-amber-900/10' : ''}
                  ${reactionState.type === 'none' ? 'border-rose-500/50 bg-rose-900/10' : ''}
                `}
              >
                <div className="absolute top-4 left-6 text-slate-500 text-xs uppercase font-bold tracking-widest">Reaction Vessel</div>
                
                {/* Reset Button */}
                {droppedMetal && (
                  <button onClick={resetBench} className="absolute top-4 right-6 bg-slate-700 hover:bg-slate-600 text-slate-200 p-2 rounded-lg flex items-center gap-2 text-xs font-bold transition-colors z-30 shadow-md">
                    <RefreshCw size={14} /> Clear Vessel
                  </button>
                )}

                {/* Floating Bubbles if ALKALI reaction occurs (H2 gas) */}
                {reactionState.type === 'alkali' && (
                  <div className="absolute w-32 h-40 bottom-12 flex justify-around items-end z-20 pointer-events-none">
                     <div className="w-2 h-2 bg-white/80 rounded-full animate-bubble" style={{ animationDelay: '0s' }}></div>
                     <div className="w-3 h-3 bg-white/80 rounded-full animate-bubble" style={{ animationDelay: '0.2s' }}></div>
                     <div className="w-1 h-1 bg-white/80 rounded-full animate-bubble" style={{ animationDelay: '0.4s' }}></div>
                     <div className="w-2 h-2 bg-white/80 rounded-full animate-bubble" style={{ animationDelay: '0.1s' }}></div>
                     <div className="w-3 h-3 bg-white/80 rounded-full animate-bubble" style={{ animationDelay: '0.5s' }}></div>
                     <div className="w-2 h-2 bg-white/80 rounded-full animate-bubble" style={{ animationDelay: '0.3s' }}></div>
                  </div>
                )}

                {/* SVG Beaker */}
                <div className="relative w-48 h-56 z-10 mt-10">
                  {/* Metal Block inside beaker */}
                  {droppedMetal && (
                    <div 
                      className={`absolute bottom-[38px] left-1/2 -translate-x-1/2 w-10 h-10 rounded transition-colors duration-1000 shadow-inner z-10 border-b-4 border-black/30 flex items-center justify-center overflow-visible
                        ${reactionState.type === 'alkali' ? 'animate-dissolve' : ''}
                      `}
                      style={{ backgroundColor: METALS[droppedMetal].hex }}
                    >
                      {/* Crumbly texture effect if DISPLACEMENT / Deposit Layer */}
                      {reactionState.type === 'displacement' && (
                        <div 
                          className="absolute inset-[-4px] rounded border-[3px] border-dashed transition-all duration-1000 opacity-100 z-20 pointer-events-none"
                          style={{ 
                            borderColor: METALS[activeSolution.cation].hex,
                            backgroundColor: `${METALS[activeSolution.cation].hex}D9` // Coated with displaced metal
                          }}
                        ></div>
                      )}
                      <span className="font-bold text-black/60 text-base z-30 select-none mix-blend-overlay relative">{droppedMetal}</span>
                    </div>
                  )}

                  <svg viewBox="0 0 100 120" className="w-full h-full drop-shadow-2xl relative z-20 pointer-events-none">
                    {/* Liquid Layer */}
                    <path 
                      d="M 25,50 L 25,100 Q 25,110 50,110 Q 75,110 75,100 L 75,50 Z" 
                      fill={currentLiquidColor} 
                      className="transition-all duration-1000" 
                    />
                    
                    {/* Beaker Glass Outline */}
                    <path 
                      d="M 20,10 L 20,15 L 25,15 L 25,100 Q 25,110 50,110 Q 75,110 75,100 L 75,15 L 80,15 L 80,10" 
                      fill="none" stroke="rgba(203, 213, 225, 0.4)" strokeWidth="3" strokeLinejoin="round" 
                    />
                    <line x1="20" y1="10" x2="80" y2="10" stroke="rgba(203, 213, 225, 0.4)" strokeWidth="3" strokeLinecap="round" />
                    
                    {/* Volume marks */}
                    <line x1="25" y1="40" x2="35" y2="40" stroke="rgba(203, 213, 225, 0.3)" strokeWidth="2" />
                    <line x1="25" y1="60" x2="30" y2="60" stroke="rgba(203, 213, 225, 0.3)" strokeWidth="2" />
                    <line x1="25" y1="80" x2="35" y2="80" stroke="rgba(203, 213, 225, 0.3)" strokeWidth="2" />
                    
                    {/* Front Glass Highlight */}
                    <path d="M 30,55 L 30,95 Q 35,100 50,100 Q 70,100 70,95 L 70,55 Z" fill="rgba(255,255,255,0.05)" />
                  </svg>
                </div>

                {/* Target Solution Label */}
                <div className="absolute top-[40%] left-1/2 -translate-x-1/2 -translate-y-1/2 z-0 opacity-10 flex flex-col items-center select-none pointer-events-none">
                   <Beaker size={64} />
                   <span className="font-black text-2xl mt-2 tracking-widest">{activeSolution.id}</span>
                </div>

                {!droppedMetal && !isDragOver && (
                  <p className="absolute bottom-8 text-slate-500 font-medium animate-pulse">Drop metal here to test reaction</p>
                )}
              </div>

              {/* Solution Selection Dock */}
              <div className="bg-slate-800 rounded-2xl border border-slate-700 shadow-xl shrink-0 p-2 flex overflow-x-auto custom-scrollbar">
                {SOLUTIONS.map(sol => (
                  <button 
                    key={sol.id}
                    onClick={() => changeSolution(sol.id)}
                    className={`flex-1 min-w-[90px] py-2 px-2 flex flex-col items-center justify-center rounded-xl transition-all font-mono text-sm
                      ${activeSolutionId === sol.id ? 'bg-purple-600 text-white shadow-lg shadow-purple-900/50 border border-purple-400' : 'text-slate-400 hover:bg-slate-700 border border-transparent'}
                    `}
                  >
                    <span className="font-bold text-xs">{sol.id}</span>
                    <span className="text-[9px] opacity-70 tracking-wider uppercase mt-0.5">Solution</span>
                  </button>
                ))}
              </div>

            </div>

            {/* RIGHT PANEL: Logic Gate Engine & Results */}
            <div className="w-1/4 bg-slate-800 rounded-2xl border border-slate-700 flex flex-col overflow-hidden shadow-xl shrink-0">
              <div className="p-4 bg-slate-700/50 border-b border-slate-600 flex items-center gap-2">
                <Cpu size={18} className="text-emerald-400" />
                <h2 className="text-sm uppercase tracking-widest text-slate-200 font-bold">Predictor Engine</h2>
              </div>
              
              <div className="p-5 flex flex-col h-full overflow-y-auto custom-scrollbar">
                
                {/* Status Dashboard */}
                <div className="mb-6">
                  <p className="text-[10px] text-slate-500 uppercase tracking-widest font-bold mb-2">Algorithm Status</p>
                  
                  {!droppedMetal ? (
                    <div className="bg-slate-900 border border-slate-700 p-4 rounded-xl flex items-center gap-3 text-slate-400">
                      <div className="w-3 h-3 bg-amber-500 rounded-full animate-pulse shadow-[0_0_8px_rgba(245,158,11,0.6)]"></div>
                      <span className="text-sm font-medium">Awaiting input...</span>
                    </div>
                  ) : reactionState.type === 'alkali' ? (
                    <div className="flex flex-col gap-3">
                      {/* Alkali Exception Logic */}
                      <div className="bg-slate-900 border border-slate-700 p-4 rounded-xl font-mono text-xs text-slate-300">
                        <div className="mb-2"><span className="text-cyan-400 font-bold">var</span> metal = <span className="text-cyan-300">'{droppedMetal}'</span>;</div>
                        <div className="mb-2"><span className="text-purple-400 font-bold">var</span> solvent = <span className="text-purple-300">'H₂O'</span>;</div>
                        <div className="my-3 border-b border-slate-700"></div>
                        <div className="mb-2 text-slate-400">// Exception Override: Alkali Metals</div>
                        <div className="flex items-center gap-2">
                          <span>if (['K', 'Na', 'Ca'].includes({droppedMetal}))</span>
                          <span className="text-slate-500">➔</span>
                          <span className="text-amber-400 font-bold bg-amber-900/40 px-1 rounded">EXPLOSIVE</span>
                        </div>
                      </div>

                      {/* Visual Cue Alert */}
                      <div className="p-4 rounded-xl border flex items-start gap-3 shadow-lg bg-amber-900/30 border-amber-500 text-amber-200">
                        <AlertTriangle className="shrink-0 text-amber-400 mt-0.5" />
                        <div>
                          <p className="font-bold text-sm leading-none mb-1">Solvent Reaction!</p>
                          <p className="text-[11px] opacity-90 leading-snug">
                            {METALS[droppedMetal].name} is an alkali metal. It is so intensely reactive that it violently attacks the <b>water</b> solvent to produce Hydrogen gas, rather than displacing the cation.
                          </p>
                        </div>
                      </div>
                    </div>
                  ) : (
                    <div className="flex flex-col gap-3">
                      {/* Standard Logic Check Steps */}
                      <div className="bg-slate-900 border border-slate-700 p-4 rounded-xl font-mono text-xs text-slate-300">
                        <div className="mb-2"><span className="text-cyan-400 font-bold">var</span> metal = <span className="text-cyan-300">'{droppedMetal}'</span>;</div>
                        <div className="mb-2"><span className="text-purple-400 font-bold">var</span> cation = <span className="text-purple-300">'{activeSolution.cation}'</span>;</div>
                        <div className="my-3 border-b border-slate-700"></div>
                        <div className="mb-2 text-slate-400">// Checking array index position...</div>
                        <div className="mb-2">
                          <span className="text-amber-400">Index(</span>{droppedMetal}<span className="text-amber-400">)</span>: {REACTIVITY_SERIES.indexOf(droppedMetal)}
                        </div>
                        <div className="mb-2">
                          <span className="text-amber-400">Index(</span>{activeSolution.cation}<span className="text-amber-400">)</span>: {REACTIVITY_SERIES.indexOf(activeSolution.cation)}
                        </div>
                        <div className="my-3 border-b border-slate-700"></div>
                        <div className="flex items-center gap-2">
                          <span>if ({REACTIVITY_SERIES.indexOf(droppedMetal)} &lt; {REACTIVITY_SERIES.indexOf(activeSolution.cation)})</span>
                          <span className="text-slate-500">➔</span>
                          <span className={reactionState.type === 'displacement' ? 'text-emerald-400 font-bold bg-emerald-900/40 px-1 rounded' : 'text-rose-400 font-bold bg-rose-900/40 px-1 rounded'}>
                            {reactionState.type === 'displacement' ? 'TRUE' : 'FALSE'}
                          </span>
                        </div>
                      </div>

                      {/* Visual Cue Alert */}
                      <div className={`p-4 rounded-xl border flex items-start gap-3 shadow-lg ${reactionState.type === 'displacement' ? 'bg-emerald-900/30 border-emerald-500 text-emerald-200' : 'bg-rose-900/30 border-rose-500 text-rose-200'}`}>
                        {reactionState.type === 'displacement' ? <CheckCircle2 className="shrink-0 text-emerald-400 mt-0.5" /> : <XCircle className="shrink-0 text-rose-400 mt-0.5" />}
                        <div>
                          <p className="font-bold text-sm leading-none mb-1">{reactionState.type === 'displacement' ? 'Displacement Triggered!' : 'No Reaction.'}</p>
                          <p className="text-[11px] opacity-80 leading-snug">
                            {reactionState.type === 'displacement' 
                              ? `Because ${METALS[droppedMetal].name} is higher in the reactivity series, it displaces ${METALS[activeSolution.cation].name} from its compound, forming a solid crust.` 
                              : `Because ${METALS[droppedMetal].name} is lower in the reactivity series, it cannot displace ${METALS[activeSolution.cation].name}.`}
                          </p>
                        </div>
                      </div>
                    </div>
                  )}
                </div>

                {/* Auto-Generated Equation */}
                <div className="mt-auto">
                  <p className="text-[10px] text-slate-500 uppercase tracking-widest font-bold mb-2">Chemical Equation</p>
                  <div className={`bg-slate-900 rounded-xl border p-4 flex items-center justify-center min-h-[80px] transition-colors duration-500 
                    ${reactionState.type === 'displacement' ? 'border-emerald-500 shadow-[0_0_15px_rgba(16,185,129,0.15)]' : ''} 
                    ${reactionState.type === 'alkali' ? 'border-amber-500 shadow-[0_0_15px_rgba(245,158,11,0.15)]' : ''} 
                    ${reactionState.type === 'none' ? 'border-slate-700' : ''}`}
                  >
                    {reactionState.data ? (
                      <span className="font-mono font-bold text-sm text-center text-slate-100 leading-relaxed">
                        {reactionState.data.equation.split('➔').map((part, i) => (
                          <React.Fragment key={i}>
                            {i === 1 ? <><br/><span className={reactionState.type === 'alkali' ? "text-amber-400 px-2 text-lg" : "text-emerald-400 px-2 text-lg"}>➔</span><br/></> : null}
                            <span>{part}</span>
                          </React.Fragment>
                        ))}
                      </span>
                    ) : (
                      <span className="text-slate-600 font-mono text-sm">--</span>
                    )}
                  </div>
                </div>

              </div>
            </div>

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
