<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molarity and Dilution Calculator | Chemistry Simulator</title>
    <meta name="description" content="Molarity and dilution calculator simulator. Explore the conservation of moles during volumetric expansion using the M1V1 = M2V2 equation.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: { 850: '#151e2e', 900: '#0F172A', 950: '#020617' },
                        chem: {
                            solute: '#0EA5E9',   // Sky 500
                            water: '#E0F2FE',    // Sky 100
                            highlight: '#F43F5E' // Rose 500
                        }
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- p5.js for Particle Physics & Visuals -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>

    <style>
        body { margin: 0; background-color: #020617; font-family: 'Inter', sans-serif; overflow: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .bg-grid {
            background-image: radial-gradient(circle at 2px 2px, rgba(30, 41, 59, 0.4) 1px, transparent 0);
            background-size: 30px 30px;
        }

        /* Custom Range Slider */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
            width: 100%;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px; width: 20px;
            border-radius: 50%;
            background: #0EA5E9;
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 0 0 10px rgba(14, 165, 233, 0.6);
            border: 2px solid #FFF;
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:active {
            transform: scale(1.2);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px;
            cursor: pointer;
            background: #334155;
            border-radius: 2px;
        }
        
        /* Specific track for the water addition slider */
        input[type=range].water-slider::-webkit-slider-thumb {
            background: #38BDF8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.8);
        }
        input[type=range].water-slider::-webkit-slider-runnable-track {
            background: linear-gradient(to right, #0EA5E9, #E0F2FE);
        }
    </style>
</head>
<body class="text-slate-200 selection:bg-sky-500 selection:text-white min-h-screen bg-grid flex items-center justify-center p-4 md:p-8">

    <div id="root" class="w-full h-full max-w-6xl max-h-[900px] flex rounded-3xl overflow-hidden shadow-2xl border border-slate-800 bg-slate-950"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Icons ---
        const Droplet = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>;
        const Beaker = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4.5 3h15"/><path d="M6 3v16a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V3"/><path d="M6 14h12"/></svg>;
        const FlaskConical = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10 2v7.31"/><path d="M14 9.31V2"/><path d="M8.5 2h7"/><path d="M14 9.31 6.5 21.5h11L10 9.31"/><path d="M5.5 18.5h13"/></svg>;
        const Info = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>;

        function App() {
            // --- React State ---
            // Initial conditions
            const [m1, setM1] = useState(2.0); // Molarity (mol/L)
            const [v1, setV1] = useState(50);  // Volume (mL)
            
            // Final conditions
            const [v2, setV2] = useState(50);  // Diluted Volume (mL)
            const MAX_V = 500;

            // Derived
            const moles = (m1 * (v1 / 1000));
            const m2 = (m1 * v1) / v2;

            const p5ContainerRef = useRef(null);

            // --- Enforce Constraints ---
            useEffect(() => {
                if (v2 < v1) setV2(v1); // Can't have final volume less than initial
            }, [v1, v2]);

            // --- Bridge State to p5.js global context ---
            useEffect(() => {
                window.simState = { m1, v1, m2, v2, moles, maxV: MAX_V };
                
                // If initial conditions change (moles change), reset particles
                if (window.regenerateParticles) {
                    window.regenerateParticles();
                }
            }, [m1, v1, v2, moles]);

            // --- Initialize p5.js Canvas ---
            useEffect(() => {
                if (!p5ContainerRef.current) return;

                const sketch = (p) => {
                    let particles = [];
                    
                    const MARGIN_BOTTOM = 60;
                    const FLASK_W = 160;
                    const FLASK_H = 400;

                    // Generate particles representing solute molecules
                    window.regenerateParticles = () => {
                        if (!window.simState) return;
                        particles = [];
                        // Scale visually: 1 mole = 50 particles
                        const numParticles = Math.max(10, Math.floor(window.simState.moles * 150));
                        
                        const cx = p.width / 2;
                        const cy = p.height - MARGIN_BOTTOM;
                        
                        // Map initial volume to height
                        let initialLiqH = p.map(window.simState.v1, 0, window.simState.maxV, 0, FLASK_H);
                        
                        for (let i = 0; i < numParticles; i++) {
                            particles.push({
                                x: cx + p.random(-FLASK_W/2 + 10, FLASK_W/2 - 10),
                                y: cy - p.random(10, initialLiqH - 10),
                                vx: p.random(-1, 1),
                                vy: p.random(-1, 1),
                                radius: p.random(3, 5)
                            });
                        }
                    };

                    p.setup = () => {
                        const container = p5ContainerRef.current;
                        p.createCanvas(container.offsetWidth, container.offsetHeight);
                        window.regenerateParticles();
                    };

                    p.draw = () => {
                        p.clear();
                        const state = window.simState;
                        if (!state) return;

                        const cx = p.width / 2;
                        const cy = p.height - MARGIN_BOTTOM;

                        // Calculate current liquid height based on V2
                        let liqH = p.map(state.v2, 0, state.maxV, 0, FLASK_H);
                        let liqTop = cy - liqH;

                        // --- 1. Draw Liquid ---
                        p.noStroke();
                        // Opacity represents concentration (M2). Max expected is ~5M.
                        let alpha = p.map(state.m2, 0, 5, 20, 200);
                        p.fill(14, 165, 233, alpha); // Sky Blue
                        
                        p.beginShape();
                        p.vertex(cx - FLASK_W/2, cy);
                        p.vertex(cx + FLASK_W/2, cy);
                        p.vertex(cx + FLASK_W/2, liqTop);
                        p.vertex(cx - FLASK_W/2, liqTop);
                        p.endShape(p.CLOSE);

                        // Draw liquid meniscus
                        p.fill(255, 255, 255, 40);
                        p.ellipse(cx, liqTop, FLASK_W, 15);

                        // --- 2. Update and Draw Particles (Moles) ---
                        p.fill(255, 255, 255, 200);
                        p.stroke('#0284c7'); // Darker sky blue
                        p.strokeWeight(1);
                        
                        particles.forEach(pt => {
                            // Brownian motion
                            pt.x += pt.vx;
                            pt.y += pt.vy;
                            pt.vx += p.random(-0.2, 0.2);
                            pt.vy += p.random(-0.2, 0.2);

                            // Damping
                            pt.vx *= 0.98;
                            pt.vy *= 0.98;

                            // Constrain to liquid bounds
                            if (pt.x < cx - FLASK_W/2 + pt.radius) { pt.x = cx - FLASK_W/2 + pt.radius; pt.vx *= -1; }
                            if (pt.x > cx + FLASK_W/2 - pt.radius) { pt.x = cx + FLASK_W/2 - pt.radius; pt.vx *= -1; }
                            
                            // Bottom of flask
                            if (pt.y > cy - pt.radius) { pt.y = cy - pt.radius; pt.vy *= -1; }
                            
                            // Dynamic top of liquid (Allows them to expand as water is added)
                            if (pt.y < liqTop + pt.radius + 5) { 
                                pt.y = liqTop + pt.radius + 5; 
                                pt.vy *= -1; 
                            }

                            p.circle(pt.x, pt.y, pt.radius * 2);
                        });

                        // --- 3. Draw Beaker/Cylinder Overlay ---
                        p.stroke('#64748B');
                        p.strokeWeight(4);
                        p.noFill();
                        
                        p.beginShape();
                        p.vertex(cx - FLASK_W/2, cy - FLASK_H - 20); // Left top
                        p.vertex(cx - FLASK_W/2, cy);                // Left bottom
                        p.vertex(cx + FLASK_W/2, cy);                // Right bottom
                        p.vertex(cx + FLASK_W/2, cy - FLASK_H - 20); // Right top
                        p.endShape();

                        // Base rounding
                        p.strokeWeight(2);
                        p.stroke('#334155');
                        p.ellipse(cx, cy, FLASK_W, 20);
                        p.ellipse(cx, cy - FLASK_H - 20, FLASK_W, 20); // Top opening

                        // Markings
                        p.stroke('#475569');
                        p.strokeWeight(2);
                        p.textAlign(p.RIGHT, p.CENTER);
                        p.textSize(12);
                        p.fill('#94A3B8');
                        p.noStroke();
                        
                        for (let vol = 100; vol <= state.maxV; vol += 100) {
                            let mY = cy - p.map(vol, 0, state.maxV, 0, FLASK_H);
                            p.stroke('#475569');
                            p.line(cx - FLASK_W/2, mY, cx - FLASK_W/2 + 15, mY);
                            p.noStroke();
                            p.text(vol, cx - FLASK_W/2 - 5, mY);
                        }
                    };

                    p.windowResized = () => {
                        const container = p5ContainerRef.current;
                        p.resizeCanvas(container.offsetWidth, container.offsetHeight);
                        window.regenerateParticles();
                    };
                };

                const myp5 = new p5(sketch, p5ContainerRef.current);
                return () => myp5.remove(); // Cleanup
            }, []);

            return (
                <div className="w-full flex flex-col md:flex-row h-full">
                    
                    {/* Left Panel: UI & Equation */}
                    <aside className="w-full md:w-[420px] bg-slate-900 border-b md:border-b-0 md:border-r border-slate-800 flex flex-col z-20 shrink-0">
                        
                        <header className="p-6 border-b border-slate-800 flex items-center gap-3">
                            <div className="p-2 bg-sky-500/20 rounded-xl text-sky-400">
                                <FlaskConical />
                            </div>
                            <div>
                                <h1 className="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-sky-400 to-indigo-400 leading-tight">
                                    Molarity & Dilution
                                </h1>
                                <p className="text-xs text-slate-400 font-mono mt-1">M₁V₁ = M₂V₂ Equation</p>
                            </div>
                        </header>

                        <div className="flex flex-col flex-grow overflow-y-auto no-scrollbar p-6 space-y-6">
                            
                            {/* Step 1: Initial Solution */}
                            <div className="space-y-4">
                                <h2 className="text-xs font-bold text-slate-400 uppercase tracking-widest flex items-center gap-2">
                                    <Beaker className="w-4 h-4" /> 1. Initial Stock Solution
                                </h2>
                                
                                {/* M1 Slider */}
                                <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 shadow-inner">
                                    <div className="flex justify-between items-end mb-2">
                                        <label className="text-xs font-medium text-slate-300">Initial Molarity (M₁)</label>
                                        <span className="font-mono text-sky-400 font-bold">{m1.toFixed(2)} M</span>
                                    </div>
                                    <input type="range" min="0.1" max="5.0" step="0.1" value={m1} onChange={(e) => setM1(parseFloat(e.target.value))} />
                                </div>

                                {/* V1 Slider */}
                                <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 shadow-inner">
                                    <div className="flex justify-between items-end mb-2">
                                        <label className="text-xs font-medium text-slate-300">Initial Volume (V₁)</label>
                                        <span className="font-mono text-sky-400 font-bold">{v1} mL</span>
                                    </div>
                                    <input type="range" min="10" max="250" step="10" value={v1} onChange={(e) => setV1(parseInt(e.target.value))} />
                                </div>
                            </div>

                            {/* Info Box: Conservation of Moles */}
                            <div className="bg-emerald-500/10 border border-emerald-500/30 p-4 rounded-xl flex items-start gap-3">
                                <Info className="text-emerald-400 shrink-0 mt-0.5" />
                                <div>
                                    <p className="text-xs text-emerald-100/80 leading-relaxed font-medium">
                                        <strong>Conservation of Moles:</strong> Moles = Molarity × Volume.<br/>
                                        Current solute: <span className="font-bold text-emerald-400">{moles.toFixed(3)} moles</span>. <br/>
                                        Adding water expands volume but does <i>not</i> add solute particles.
                                    </p>
                                </div>
                            </div>

                            {/* Step 2: Add Water (Dilution) */}
                            <div className="space-y-4 pt-4 border-t border-slate-800 mt-auto">
                                <h2 className="text-xs font-bold text-slate-400 uppercase tracking-widest flex items-center gap-2">
                                    <Droplet className="w-4 h-4 text-sky-400" /> 2. Dilution Process
                                </h2>
                                
                                <div className="bg-sky-500/5 p-5 rounded-xl border border-sky-500/30 shadow-lg relative overflow-hidden">
                                    <div className="flex justify-between items-end mb-4 relative z-10">
                                        <label className="text-sm font-bold text-white uppercase tracking-wider">Add Distilled Water</label>
                                        <div className="text-right">
                                            <span className="block text-[10px] text-sky-300 uppercase">Final Volume (V₂)</span>
                                            <span className="font-mono text-2xl text-sky-400 font-bold">{v2} mL</span>
                                        </div>
                                    </div>
                                    
                                    <div className="relative z-10">
                                        <input 
                                            type="range" 
                                            min={v1} // Can't go below initial volume
                                            max={MAX_V} 
                                            step="10" 
                                            value={v2} 
                                            onChange={(e) => setV2(parseInt(e.target.value))}
                                            className="water-slider"
                                        />
                                        <div className="flex justify-between text-[10px] text-slate-400 mt-2 font-mono">
                                            <span>{v1}mL (Min)</span>
                                            <span className="text-sky-300">+{v2 - v1}mL Added</span>
                                            <span>{MAX_V}mL (Max)</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </aside>

                    {/* Right Panel: Visualizer & Live Math */}
                    <main className="flex-grow relative flex flex-col bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-slate-800 to-slate-950 overflow-hidden">
                        
                        {/* Live Equation Telemetry Board */}
                        <div className="absolute top-6 left-6 right-6 md:left-auto md:right-8 bg-slate-900/90 backdrop-blur-md border border-slate-700 p-5 rounded-2xl shadow-2xl z-20 md:w-80">
                            <h3 className="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-3 border-b border-slate-800 pb-2">
                                Live Calculation
                            </h3>
                            
                            <div className="space-y-2 font-mono text-sm">
                                <div className="flex justify-between items-center text-slate-400">
                                    <span>M₁ × V₁</span>
                                    <span>=</span>
                                    <span>M₂ × V₂</span>
                                </div>
                                <div className="flex justify-between items-center text-slate-300">
                                    <span>{m1.toFixed(2)} × {v1}</span>
                                    <span>=</span>
                                    <span>M₂ × {v2}</span>
                                </div>
                            </div>

                            <div className="bg-slate-950 border border-slate-800 rounded-lg p-4 mt-4 text-center">
                                <span className="text-[10px] text-slate-500 uppercase tracking-widest block mb-1">New Concentration (M₂)</span>
                                <div className="flex items-baseline justify-center gap-2">
                                    <span className="font-mono text-3xl font-bold text-rose-400">{m2.toFixed(3)}</span>
                                    <span className="text-xs text-rose-500 font-bold">M</span>
                                </div>
                                <span className="text-[9px] text-slate-500 mt-2 block leading-tight">
                                    Color intensity drops as volume expands.
                                </span>
                            </div>
                        </div>

                        {/* p5.js Container */}
                        <div ref={p5ContainerRef} className="w-full flex-grow relative z-10"></div>

                    </main>

                </div>
            );
        }

        // --- Render Application ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
