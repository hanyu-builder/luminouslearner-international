<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molarity and Dilution Calculator | Chemistry Simulator</title>
    <meta name="description" content="Molarity and dilution calculator. Interactive chemistry simulator computing the conservation of moles during volumetric expansion using M1V1 = M2V2.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- KaTeX for Math Equation Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

    <style>
        body { 
            margin: 0; 
            background-color: #0F172A; 
            color: #E2E8F0;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
        }

        /* Custom scrollbar */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Custom range sliders */
        input[type="range"] {
            -webkit-appearance: none;
            background: transparent;
            width: 100%;
        }
        input[type="range"]::-webkit-slider-runnable-track {
            height: 6px;
            border-radius: 3px;
            background: #334155;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: currentColor;
            margin-top: -7px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
        
        /* Water drop animation */
        @keyframes drop {
            0% { transform: translateY(-20px) scaleY(1); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(120px) scaleY(1.5); opacity: 0; }
        }
        .animate-drop {
            animation: drop 0.8s infinite;
        }
    </style>
</head>
<body>

    <div id="root" class="w-full h-screen max-h-[1000px] flex justify-center items-center p-4"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- SOLUTE DATABASE ---
        const SOLUTES = {
            cuso4: { name: 'Copper(II) Sulfate', formula: 'CuSO_4', colorRGB: '59, 130, 246', hex: '#3B82F6' },    // Blue
            kmno4: { name: 'Potassium Permanganate', formula: 'KMnO_4', colorRGB: '168, 85, 247', hex: '#A855F7' }, // Purple
            k2cr2o7: { name: 'Potassium Dichromate', formula: 'K_2Cr_2O_7', colorRGB: '249, 115, 22', hex: '#F97316' }, // Orange
            nicl2: { name: 'Nickel(II) Chloride', formula: 'NiCl_2', colorRGB: '16, 185, 129', hex: '#10B981' }       // Green
        };

        // --- KATEX COMPONENT ---
        const TeX = ({ math, block = false }) => {
            const containerRef = useRef(null);
            useEffect(() => {
                if (containerRef.current) {
                    try {
                        katex.render(math, containerRef.current, {
                            displayMode: block,
                            throwOnError: false,
                            strict: false
                        });
                    } catch (e) {
                        console.error("KaTeX error:", e);
                    }
                }
            }, [math, block]);
            return <span ref={containerRef} className={block ? "block w-full overflow-x-auto pb-2 text-center" : ""} />;
        };

        function App() {
            // --- STATE ---
            const [soluteKey, setSoluteKey] = useState('cuso4');
            const [M1, setM1] = useState(5.0);   // Initial Molarity (M)
            const [V1, setV1] = useState(250);   // Initial Volume (mL)
            const [V2, setV2] = useState(250);   // Final Volume (mL)
            const [isPouring, setIsPouring] = useState(false);

            const MAX_VOLUME = 1000;
            const MAX_MOLARITY = 10.0;

            // --- CALCULATIONS (M1V1 = M2V2) ---
            // Ensure V2 is never less than V1
            useEffect(() => {
                if (V2 < V1) setV2(V1);
            }, [V1, V2]);

            const solute = SOLUTES[soluteKey];
            const moles = (M1 * V1) / 1000; // n = C * V
            const M2 = (M1 * V1) / V2;      // M2 = (M1*V1)/V2

            // Handle Dilution Slider Interaction
            const handleAddWater = (val) => {
                setV2(val);
                setIsPouring(val > V1);
            };

            const stopPouring = () => setIsPouring(false);

            // --- VISUAL ENGINE (Particles & Color) ---
            // Generate a fixed number of particles based ONLY on initial moles (Conservation of Mass)
            // useMemo ensures they don't randomly shift positions during re-renders.
            const particles = useMemo(() => {
                const numParticles = Math.floor(moles * 120); // Scale factor for visual density
                const arr = [];
                for (let i = 0; i < numParticles; i++) {
                    arr.push({
                        x: Math.random(), // 0.0 to 1.0 (normalized)
                        y: Math.random(), // 0.0 to 1.0 (normalized)
                        size: Math.random() * 2 + 1.5,
                        opacity: Math.random() * 0.5 + 0.4
                    });
                }
                return arr;
            }, [moles]);

            // Calculate SVG visuals
            const svgHeight = 280;
            const flaskBottomY = 280;
            const flaskMaxLiquidHeight = 220; // Maximum pixels the liquid can rise
            const liquidHeightPixels = (V2 / MAX_VOLUME) * flaskMaxLiquidHeight; 
            
            // Color intensity maps to M2 (Opacity approaches 1 as M2 approaches MAX_MOLARITY)
            const colorIntensity = Math.min(1.0, Math.max(0.08, Math.pow(M2 / MAX_MOLARITY, 0.7)));

            return (
                <div className="w-full max-w-6xl h-full flex flex-col bg-slate-900 border border-slate-700 rounded-3xl shadow-2xl overflow-hidden">
                    
                    {/* Header */}
                    <header className="bg-slate-800/80 backdrop-blur p-6 border-b border-slate-700 flex flex-col md:flex-row justify-between items-center shrink-0 z-10 gap-4">
                        <div>
                            <h1 className="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-indigo-500">
                                Molarity Dilution Calculator
                            </h1>
                            <p className="text-slate-400 text-xs mt-1 uppercase tracking-wider font-semibold">
                                Conservation of Moles ($M_1V_1 = M_2V_2$)
                            </p>
                        </div>
                        
                        {/* Solute Selection */}
                        <div className="w-full md:w-64">
                            <label className="text-[10px] text-slate-400 uppercase font-bold tracking-widest block mb-1">Select Solute</label>
                            <select 
                                value={soluteKey} onChange={(e) => setSoluteKey(e.target.value)}
                                className="w-full bg-slate-950 border border-slate-700 text-slate-200 text-sm rounded-lg p-2 outline-none focus:border-indigo-500 transition-colors"
                            >
                                {Object.entries(SOLUTES).map(([key, s]) => <option key={key} value={key}>{s.name}</option>)}
                            </select>
                        </div>
                    </header>

                    {/* Main Workspace Layout */}
                    <div className="flex-grow flex flex-col lg:flex-row overflow-hidden relative bg-slate-950">
                        
                        {/* LEFT PANEL: Virtual Laboratory (Visual Engine) */}
                        <div className="w-full lg:w-5/12 p-8 border-b lg:border-b-0 lg:border-r border-slate-700 flex flex-col justify-center items-center relative bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-slate-800 to-slate-950">
                            
                            {/* Water Pouring Animation */}
                            {isPouring && (
                                <div className="absolute top-12 flex flex-col items-center z-20">
                                    <div className="w-1.5 h-4 bg-sky-300 rounded-full animate-drop shadow-[0_0_8px_rgba(125,211,252,0.8)]"></div>
                                    <div className="w-2 h-6 bg-sky-400 rounded-full animate-drop shadow-[0_0_8px_rgba(56,189,248,0.8)]" style={{animationDelay: '0.2s'}}></div>
                                    <div className="w-1.5 h-3 bg-sky-200 rounded-full animate-drop shadow-[0_0_8px_rgba(186,230,253,0.8)]" style={{animationDelay: '0.4s'}}></div>
                                </div>
                            )}

                            {/* Flask SVG */}
                            <div className="relative w-64 h-80 drop-shadow-[0_0_25px_rgba(0,0,0,0.4)]">
                                <svg width="100%" height="100%" viewBox="0 0 200 300" className="overflow-visible">
                                    
                                    <defs>
                                        {/* Erlenmeyer Flask Shape for Clipping Liquid */}
                                        <clipPath id="flaskClip">
                                            <path d="M 85 40 L 115 40 L 115 120 L 175 270 C 180 285 170 300 150 300 L 50 300 C 30 300 20 285 25 270 L 85 120 Z" />
                                        </clipPath>
                                    </defs>

                                    {/* Back Glass */}
                                    <path d="M 85 40 L 115 40 L 115 120 L 175 270 C 180 285 170 300 150 300 L 50 300 C 30 300 20 285 25 270 L 85 120 Z" fill="rgba(255,255,255,0.03)" stroke="#475569" strokeWidth="4" />
                                    
                                    {/* Flask Lip */}
                                    <rect x="80" y="30" width="40" height="10" rx="3" fill="rgba(255,255,255,0.1)" stroke="#475569" strokeWidth="3" />

                                    {/* Volume Markings */}
                                    <g stroke="#64748B" strokeWidth="2" opacity="0.6">
                                        <line x1="120" y1="240" x2="130" y2="240" />
                                        <text x="135" y="244" fill="#94A3B8" fontSize="10">250</text>
                                        
                                        <line x1="110" y1="180" x2="120" y2="180" />
                                        <text x="125" y="184" fill="#94A3B8" fontSize="10">500</text>

                                        <line x1="114" y1="115" x2="124" y2="115" />
                                        <text x="129" y="119" fill="#94A3B8" fontSize="10">1000</text>
                                    </g>

                                    {/* LIQUID GROUP (Clipped to Flask Shape) */}
                                    <g clipPath="url(#flaskClip)">
                                        {/* Colored Liquid Base */}
                                        <rect 
                                            x="0" 
                                            y={flaskBottomY - liquidHeightPixels} 
                                            width="200" 
                                            height={liquidHeightPixels} 
                                            fill={`rgba(${solute.colorRGB}, ${colorIntensity})`} 
                                            className="transition-all duration-300 ease-out"
                                        />

                                        {/* Particles representing Moles */}
                                        {particles.map((p, i) => (
                                            <circle 
                                                key={i}
                                                // X maps across the 200 width bounding box
                                                cx={p.x * 200} 
                                                // Y maps dynamically from the bottom up to the CURRENT liquid height
                                                cy={flaskBottomY - (p.y * liquidHeightPixels)} 
                                                r={p.size}
                                                fill="#ffffff"
                                                opacity={p.opacity}
                                                className="transition-all duration-300 ease-out"
                                            />
                                        ))}
                                    </g>

                                    {/* Front Glass Reflection */}
                                    <path d="M 60 270 L 100 150" fill="none" stroke="rgba(255,255,255,0.2)" strokeWidth="8" strokeLinecap="round" />
                                </svg>
                            </div>

                            {/* Real-time Molarity Callout */}
                            <div className="absolute bottom-8 bg-slate-950/80 backdrop-blur border border-slate-700 px-8 py-4 rounded-2xl shadow-xl flex flex-col items-center">
                                <span className="text-[10px] text-slate-400 uppercase tracking-widest font-bold mb-1">Current Concentration</span>
                                <span className="text-4xl font-mono font-bold" style={{ color: solute.hex }}>
                                    {M2.toFixed(3)} <span className="text-xl text-slate-300">M</span>
                                </span>
                            </div>

                        </div>

                        {/* RIGHT PANEL: Controls & Calculations */}
                        <div className="w-full lg:w-7/12 flex flex-col overflow-y-auto hide-scrollbar">
                            
                            {/* Controls Section */}
                            <div className="p-8 border-b border-slate-800 bg-slate-900">
                                <h2 className="text-sm font-bold text-slate-400 uppercase tracking-widest border-b border-slate-800 pb-2 mb-6">Preparation & Dilution Controls</h2>
                                
                                {/* Initial Concentration Slider */}
                                <div className="space-y-2 mb-6">
                                    <div className="flex justify-between items-end">
                                        <label className="text-sm font-bold text-indigo-400">Initial Concentration ($M_1$)</label>
                                        <span className="font-mono text-lg text-white bg-slate-950 px-2 py-1 rounded border border-slate-700">{M1.toFixed(2)} M</span>
                                    </div>
                                    <input 
                                        type="range" min="0.1" max="10.0" step="0.1" 
                                        value={M1} 
                                        onChange={(e) => setM1(parseFloat(e.target.value))}
                                        className="text-indigo-500"
                                    />
                                </div>

                                {/* Initial Volume Slider */}
                                <div className="space-y-2 mb-8">
                                    <div className="flex justify-between items-end">
                                        <label className="text-sm font-bold text-sky-400">Initial Volume ($V_1$)</label>
                                        <span className="font-mono text-lg text-white bg-slate-950 px-2 py-1 rounded border border-slate-700">{V1.toFixed(0)} mL</span>
                                    </div>
                                    <input 
                                        type="range" min="50" max="1000" step="10" 
                                        value={V1} 
                                        onChange={(e) => setV1(parseFloat(e.target.value))}
                                        className="text-sky-500"
                                    />
                                </div>

                                {/* DILUTION SLIDER (Adds Water) */}
                                <div className="p-6 bg-sky-900/10 border border-sky-500/30 rounded-2xl relative overflow-hidden shadow-inner">
                                    <div className="absolute top-0 right-0 bg-sky-500 text-white text-[10px] font-bold px-3 py-1 rounded-bl-lg uppercase tracking-wider">
                                        Action
                                    </div>
                                    <div className="flex justify-between items-end mb-4">
                                        <label className="text-sm font-bold text-white flex items-center gap-2">
                                            <svg className="w-5 h-5 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                                            Add Distilled Water ($V_2$)
                                        </label>
                                        <div className="text-right">
                                            <span className="font-mono text-2xl text-sky-300 font-bold">{V2.toFixed(0)} mL</span>
                                            <span className="block text-[10px] text-sky-400/70 font-mono text-right mt-0.5">
                                                +{Math.max(0, V2 - V1).toFixed(0)} mL H₂O added
                                            </span>
                                        </div>
                                    </div>
                                    <input 
                                        type="range" min={V1} max="1000" step="5" 
                                        value={V2} 
                                        onChange={(e) => handleAddWater(parseFloat(e.target.value))}
                                        onMouseUp={stopPouring}
                                        onTouchEnd={stopPouring}
                                        className="text-sky-400 w-full"
                                    />
                                    <p className="text-[10px] text-slate-400 mt-4 leading-relaxed">
                                        Slide to dilute. Notice how volumetric expansion spreads out the solute particles. The <strong className="text-white">total number of moles remains strictly identical</strong>, decreasing the mathematical concentration.
                                    </p>
                                </div>
                            </div>

                            {/* Math / Calculations Section */}
                            <div className="p-8 flex-grow flex flex-col gap-6 bg-slate-950">
                                
                                <div className="flex justify-between items-end border-b border-slate-800 pb-2">
                                    <h2 className="text-sm font-bold text-slate-500 uppercase tracking-widest">Algebraic Proof</h2>
                                    <div className="bg-emerald-900/20 px-3 py-1 rounded text-xs font-mono font-bold text-emerald-400 border border-emerald-500/30">
                                        Moles (n) = {moles.toFixed(3)} mol <span className="opacity-70">(Constant)</span>
                                    </div>
                                </div>

                                <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 text-center shadow-inner flex flex-col gap-6">
                                    
                                    {/* M1V1 = M2V2 Base Equation */}
                                    <div className="text-white text-2xl font-bold">
                                        <TeX math="M_1 V_1 = M_2 V_2" />
                                    </div>
                                    
                                    {/* Substituted Equation */}
                                    <div className="text-slate-300 text-xl bg-slate-950 border border-slate-800 py-3 rounded-lg">
                                        <TeX math={`(${M1.toFixed(2)})(${V1.toFixed(0)}) = M_2 (${V2.toFixed(0)})`} />
                                    </div>

                                    {/* Isolated Equation */}
                                    <div className="text-slate-300 text-xl">
                                        <TeX math={`M_2 = \\frac{(${M1.toFixed(2)})(${V1.toFixed(0)})}{${V2.toFixed(0)}}`} />
                                    </div>

                                    {/* Final Result */}
                                    <div className="bg-indigo-900/20 border border-indigo-500/30 rounded-xl p-4 inline-block mx-auto mt-2">
                                        <div className="text-indigo-100 text-2xl">
                                            <TeX math={`M_2 = \\mathbf{${M2.toFixed(3)}\\text{ M}}`} />
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </div>

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
