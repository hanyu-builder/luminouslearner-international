<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Physical vs Chemical Changes Animation</title>
  <meta name="description" content="Physical vs chemical changes animation. A binary logic classifier validating thermodynamic state changes versus molecular bond cleavage.">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for in-browser JSX transpilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { background-color: #0F172A; margin: 0; overflow: hidden; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    
    /* Custom Scrollbar */
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(30, 41, 59, 0.5); }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(71, 85, 105, 0.8); border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 1); }

    /* Particulate Animations */
    
    /* Liquid Jiggle */
    @keyframes jiggle {
      0% { transform: translate(0, 0) rotate(0deg); }
      25% { transform: translate(1px, -1px) rotate(2deg); }
      50% { transform: translate(-1px, 0px) rotate(-1deg); }
      75% { transform: translate(0px, 1px) rotate(1deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }
    .anim-liquid { animation: jiggle 2s infinite ease-in-out; }

    /* Gas Float */
    @keyframes float {
      0% { transform: translate(0, 0) rotate(0deg); }
      33% { transform: translate(5px, -10px) rotate(10deg); }
      66% { transform: translate(-5px, -5px) rotate(-10deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }
    .anim-float { animation: float 6s infinite ease-in-out; }

    /* Boiling Gas (Physical) */
    @keyframes boil-up {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-200px) rotate(360deg); opacity: 0; }
    }
    .anim-gas { animation: boil-up 3s infinite linear; }

    /* Gas Bubble (Chemical) */
    @keyframes bubble-up {
      0% { transform: translateY(0) scale(0.5); opacity: 0; }
      20% { opacity: 1; transform: translateY(-20px) scale(1); }
      100% { transform: translateY(-200px) scale(1.2); opacity: 0; }
    }
    .anim-bubble { animation: bubble-up 2.5s infinite linear; }

    /* Fade out / Fade in */
    .fade-out { animation: fadeOut 1s forwards; }
    @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }
    
    .fade-in { animation: fadeIn 1s forwards; opacity: 0; }
    @keyframes fadeIn { to { opacity: 1; } }

    /* Burner Flame Animation - Scaled from local origin to prevent float bug */
    @keyframes flicker {
      0%, 100% { transform: scaleY(1); opacity: 0.9; }
      50% { transform: scaleY(1.2); opacity: 1; }
    }
    .anim-flame { animation: flicker 0.2s infinite alternate; }
    
    /* Electrode Zap */
    @keyframes zap {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; filter: drop-shadow(0 0 8px #38bdf8); }
    }
    .anim-zap { animation: zap 0.1s infinite; }

    .tab-active {
        background-color: rgba(51, 65, 85, 0.9);
        border-top: 3px solid #22d3ee;
        color: #fff;
    }
    
    .tab-inactive {
        background-color: rgba(30, 41, 59, 0.4);
        border-top: 3px solid transparent;
        color: #94a3b8;
    }
    
    .tab-inactive:hover {
        background-color: rgba(51, 65, 85, 0.6);
        color: #e2e8f0;
    }

    /* Custom buttons for Quiz module */
    .quiz-btn {
        background: rgba(51, 65, 85, 0.8);
        border: 1px solid #475569;
        transition: all 0.15s;
    }
    .quiz-btn:hover {
        transform: scale(1.02);
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    // --- ICON COMPONENTS ---
    const SvgIcon = ({ children, size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
    );
    const Activity = (p) => <SvgIcon {...p}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12" /></SvgIcon>;
    const Info = (p) => <SvgIcon {...p}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></SvgIcon>;
    const Flame = (p) => <SvgIcon {...p}><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></SvgIcon>;
    const Zap = (p) => <SvgIcon {...p}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></SvgIcon>;
    const Cpu = (p) => <SvgIcon {...p}><rect width="16" height="16" x="4" y="4" rx="2"/><rect width="6" height="6" x="9" y="9" rx="1"/><path d="M15 2v2"/><path d="M15 20v2"/><path d="M2 15h2"/><path d="M2 9h2"/><path d="M20 15h2"/><path d="M20 9h2"/><path d="M9 2v2"/><path d="M9 20v2"/></SvgIcon>;
    const Award = (p) => <SvgIcon {...p}><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></SvgIcon>;
    const Sparkles = (p) => <SvgIcon {...p}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275Z"/><path d="m5 3 1 2.5L8.5 6 6 7 5 9.5 4 7 1.5 6 4 5Z"/><path d="m19 17 1 2.5 2.5.5-2.5 1-1 2.5-1-2.5-2.5-1 2.5-1Z"/></SvgIcon>;

    // --- MOLECULE RENDERERS ---
    const H2O = ({ x, y, rot = 0 }) => (
      <g transform={`translate(${x}, ${y}) rotate(${rot})`}>
        <line x1="0" y1="0" x2="-8" y2="8" stroke="#94a3b8" strokeWidth="2"/>
        <line x1="0" y1="0" x2="8" y2="8" stroke="#94a3b8" strokeWidth="2"/>
        <circle cx="-8" cy="8" r="4" fill="#f8fafc" stroke="#475569" strokeWidth="1"/>
        <circle cx="8" cy="8" r="4" fill="#f8fafc" stroke="#475569" strokeWidth="1"/>
        <circle cx="0" cy="0" r="7" fill="#ef4444" stroke="#7f1d1d" strokeWidth="1"/>
      </g>
    );

    const O2 = ({ x, y, rot = 0 }) => (
      <g transform={`translate(${x}, ${y}) rotate(${rot})`}>
        <line x1="-5" y1="0" x2="5" y2="0" stroke="#94a3b8" strokeWidth="3"/>
        <circle cx="-6" cy="0" r="7" fill="#ef4444" stroke="#7f1d1d" strokeWidth="1"/>
        <circle cx="6" cy="0" r="7" fill="#ef4444" stroke="#7f1d1d" strokeWidth="1"/>
      </g>
    );

    const H2 = ({ x, y, rot = 0 }) => (
      <g transform={`translate(${x}, ${y}) rotate(${rot})`}>
        <line x1="-3" y1="0" x2="3" y2="0" stroke="#94a3b8" strokeWidth="2"/>
        <circle cx="-4" cy="0" r="4" fill="#f8fafc" stroke="#475569" strokeWidth="1"/>
        <circle cx="4" cy="0" r="4" fill="#f8fafc" stroke="#475569" strokeWidth="1"/>
      </g>
    );

    const CH4 = ({ x, y, rot = 0 }) => (
      <g transform={`translate(${x}, ${y}) rotate(${rot})`}>
        <line x1="0" y1="0" x2="0" y2="-10" stroke="#94a3b8" strokeWidth="2"/>
        <line x1="0" y1="0" x2="0" y2="10" stroke="#94a3b8" strokeWidth="2"/>
        <line x1="0" y1="0" x2="-10" y2="0" stroke="#94a3b8" strokeWidth="2"/>
        <line x1="0" y1="0" x2="10" y2="0" stroke="#94a3b8" strokeWidth="2"/>
        <circle cx="0" cy="-10" r="4" fill="#f8fafc" stroke="#475569" strokeWidth="1"/>
        <circle cx="0" cy="10" r="4" fill="#f8fafc" stroke="#475569" strokeWidth="1"/>
        <circle cx="-10" cy="0" r="4" fill="#f8fafc" stroke="#475569" strokeWidth="1"/>
        <circle cx="10" cy="0" r="4" fill="#f8fafc" stroke="#475569" strokeWidth="1"/>
        <circle cx="0" cy="0" r="7" fill="#4b5563" stroke="#1f2937" strokeWidth="1"/>
      </g>
    );

    const CO2 = ({ x, y, rot = 0 }) => (
      <g transform={`translate(${x}, ${y}) rotate(${rot})`}>
        <line x1="-12" y1="2" x2="12" y2="2" stroke="#94a3b8" strokeWidth="2"/>
        <line x1="-12" y1="-2" x2="12" y2="-2" stroke="#94a3b8" strokeWidth="2"/>
        <circle cx="-12" cy="0" r="7" fill="#ef4444" stroke="#7f1d1d" strokeWidth="1"/>
        <circle cx="12" cy="0" r="7" fill="#ef4444" stroke="#7f1d1d" strokeWidth="1"/>
        <circle cx="0" cy="0" r="7" fill="#4b5563" stroke="#1f2937" strokeWidth="1"/>
      </g>
    );

    const Ion = ({ x, y, type }) => (
      <g transform={`translate(${x}, ${y})`}>
        <circle cx="0" cy="0" r="8" fill={type === 'Na' ? '#a855f7' : '#22c55e'} />
        <text x="0" y="3" fontSize="10" fill="#fff" textAnchor="middle" fontWeight="bold">
          {type === 'Na' ? '+' : '-'}
        </text>
      </g>
    );

    // --- GENERATORS ---
    const genRandomPos = (count, yMin, yMax) => Array.from({length: count}).map(() => ({
      x: 40 + (Math.random() * 120), y: yMin + (Math.random() * (yMax-yMin)), rot: Math.random() * 360, delay: Math.random() * 2
    }));

    const genLattice = (rows, cols, startX, startY, spacing) => {
      const arr = [];
      for(let r=0; r<rows; r++) {
        for(let c=0; c<cols; c++) {
          arr.push({ x: startX + c*spacing, y: startY + r*spacing });
        }
      }
      return arr;
    };

    // --- DATA MODULES ---
    const PHYSICAL_DATA = {
      boiling: {
        id: 'boiling', name: 'Boiling Water', eq: 'H₂O(l) ➔ H₂O(g)',
        btnIdle: 'Apply Heat (Boil)', btnActive: 'Remove Heat', icon: Flame,
        desc: '> Evaluating... TRUE: Intermolecular forces overcome. Molecules distance increased, but H-O covalent bonds remain strictly intact. Substance identity preserved.'
      },
      melting: {
        id: 'melting', name: 'Melting Ice', eq: 'H₂O(s) ➔ H₂O(l)',
        btnIdle: 'Apply Heat (Melt)', btnActive: 'Freeze', icon: Flame,
        desc: '> Evaluating... TRUE: Thermal energy disrupts the rigid hydrogen-bonded crystal lattice, turning it into a fluid. Intramolecular bonds are untouched.'
      },
      dissolving: {
        id: 'dissolving', name: 'Dissolving Salt', eq: 'NaCl(s) ➔ Na⁺(aq) + Cl⁻(aq)',
        btnIdle: 'Stir (Dissolve)', btnActive: 'Evaporate', icon: Activity,
        desc: '> Evaluating... TRUE: Ionic lattice dissociates into solvated ions. No new molecular substances are formed. Original salt can be recovered via physical evaporation.'
      }
    };

    const CHEMICAL_DATA = {
      electrolysis: {
        id: 'electrolysis', name: 'Electrolysis of Water', eq: '2H₂O(l) ➔ 2H₂(g) + O₂(g)',
        btnIdle: 'Electrolyze (Split)', btnActive: 'Power Off', icon: Zap,
        desc: '> Evaluating... TRUE: High electrical energy forced intramolecular covalent bond cleavage. Atoms rearranged into entirely novel diatomic substances (H₂ and O₂).'
      },
      combustion: {
        id: 'combustion', name: 'Combustion of Methane', eq: 'CH₄(g) + 2O₂(g) ➔ CO₂(g) + 2H₂O(g)',
        btnIdle: 'Ignite Spark', btnActive: 'Reset Gases', icon: Flame,
        desc: '> Evaluating... TRUE: C-H and O=O bonds are broken. New C=O and O-H bonds are formed. Irreversible creation of new chemical species releasing thermal energy.'
      },
      rusting: {
        id: 'rusting', name: 'Oxidation of Iron', eq: '4Fe(s) + 3O₂(g) ➔ 2Fe₂O₃(s)',
        btnIdle: 'Expose to Oxygen', btnActive: 'Restore Iron', icon: Activity,
        desc: '> Evaluating... TRUE: Free oxygen molecules chemically attack the iron metallic lattice, forming a new ionic compound (Iron(III) Oxide) with different properties.'
      }
    };

    // --- QUIZ EXAMPLES ---
    const QUIZ_EXAMPLES = [
      { id: 1, text: 'Melting of Ice', type: 'physical', reason: 'Change of state (Solid → Liquid). No new substance formed.' },
      { id: 2, text: 'Rusting of Iron', type: 'chemical', reason: 'New substance formed: Iron Oxide (Rust).' },
      { id: 3, text: 'Tearing Paper', type: 'physical', reason: 'Only shape changes. It is still paper.' },
      { id: 4, text: 'Burning Wood', type: 'chemical', reason: 'Irreversible. Ash and smoke are new substances.' },
      { id: 5, text: 'Dissolving Sugar', type: 'physical', reason: 'Sugar molecules disperse but remain sugar. Reversible by evaporation.' },
      { id: 6, text: 'Souring of Milk', type: 'chemical', reason: 'Bacteria produce acid. New substance formed (sour taste).' },
      { id: 7, text: 'Boiling Water', type: 'physical', reason: 'Change of state (Liquid → Gas). Molecules are unchanged (H₂O).' },
      { id: 8, text: 'Frying an Egg', type: 'chemical', reason: 'Proteins are denatured by heat. Permanent chemical change.' },
      { id: 9, text: 'Mixing Sand & Salt', type: 'physical', reason: 'No reaction occurs. Can be separated physically.' },
      { id: 10, text: 'Photosynthesis', type: 'chemical', reason: 'CO₂ and Water turn into Glucose and Oxygen.' },
      { id: 11, text: 'Sublimation of Dry Ice', type: 'physical', reason: 'Solid CO₂ turns directly to gas. No chemical change.' },
      { id: 12, text: 'Browning of Apple', type: 'chemical', reason: 'Enzymatic oxidation produces new brown pigments.' }
    ];

    function App() {
      // Navigation tab state: 'lab' | 'quiz'
      const [appMode, setAppMode] = useState('lab');

      // --- LAB STATE ---
      const [physType, setPhysType] = useState('boiling');
      const [chemType, setChemType] = useState('electrolysis');
      const [physActive, setPhysActive] = useState(false);
      const [chemActive, setChemActive] = useState(false);

      // --- QUIZ STATE ---
      const [quizIndex, setQuizIndex] = useState(0);
      const [quizScore, setQuizScore] = useState(0);
      const [quizStreak, setQuizStreak] = useState(0);
      const [userGuess, setUserGuess] = useState(null); // 'physical' or 'chemical'
      const [showAnswer, setShowAnswer] = useState(false);

      // Reset animations on type change
      useEffect(() => setPhysActive(false), [physType]);
      useEffect(() => setChemActive(false), [chemType]);

      // Memoized Positions for consistency
      const liquidPositions = useMemo(() => genRandomPos(12, 160, 240), []);
      const gasPos = useMemo(() => genRandomPos(6, 60, 140), []);
      const iceLattice = useMemo(() => genLattice(4, 5, 60, 180, 20), []);
      const saltLattice = useMemo(() => genLattice(4, 4, 70, 190, 18), []);
      const ironLattice = useMemo(() => genLattice(3, 7, 45, 200, 18), []);
      
      const h2Positions = useMemo(() => genRandomPos(10, 60, 100), []);
      const o2Positions = useMemo(() => genRandomPos(5, 120, 140), []);

      const pData = PHYSICAL_DATA[physType];
      const cData = CHEMICAL_DATA[chemType];
      const PIcon = pData.icon;
      const CIcon = cData.icon;

      // --- QUIZ LOGIC ---
      const currentQuestion = QUIZ_EXAMPLES[quizIndex];

      const handleQuizAnswer = (type) => {
        if (showAnswer) return;
        setUserGuess(type);
        setShowAnswer(true);

        if (type === currentQuestion.type) {
          setQuizScore(s => s + 10);
          setQuizStreak(st => st + 1);
        } else {
          setQuizStreak(0);
        }
      };

      const handleNextQuestion = () => {
        setUserGuess(null);
        setShowAnswer(false);
        setQuizIndex((prev) => (prev + 1) % QUIZ_EXAMPLES.length);
      };

      return (
        <div className="min-h-screen bg-slate-900 flex flex-col font-sans overflow-hidden selection:bg-cyan-500/30">
          
          {/* HEADER */}
          <header className="flex justify-between items-center px-6 py-4 bg-slate-800/80 border-b border-slate-700 shadow-lg shrink-0">
            <div className="flex items-center gap-3">
              <Activity className="text-cyan-400" size={28} />
              <div>
                <h1 className="text-2xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">
                  Physical vs Chemical Changes
                </h1>
                <p className="text-xs text-slate-400 font-medium">Particulate-Level Diagnostic Guide</p>
              </div>
            </div>

            {/* Navigation Tabs */}
            <div className="flex bg-slate-900 p-1 rounded-lg border border-slate-700">
              <button 
                onClick={() => setAppMode('lab')} 
                className={`px-4 py-2 text-xs font-bold rounded-md transition-all ${appMode === 'lab' ? 'bg-slate-700 text-cyan-400 shadow' : 'text-slate-500 hover:text-slate-300'}`}
              >
                🧮 Interactive Lab
              </button>
              <button 
                onClick={() => setAppMode('quiz')} 
                className={`px-4 py-2 text-xs font-bold rounded-md transition-all ${appMode === 'quiz' ? 'bg-slate-700 text-purple-400 shadow' : 'text-slate-500 hover:text-slate-300'}`}
              >
                🎯 Practice Quiz
              </button>
            </div>
          </header>

          <main className="flex-grow flex gap-4 p-4 overflow-hidden max-h-[calc(100vh-80px)] min-h-0">
            
            {/* === MODE 1: INTERACTIVE LAB === */}
            {appMode === 'lab' && (
              <React.Fragment>
                {/* LEFT PANEL: Theory Definitions */}
                <div className="w-1/4 bg-slate-800/50 border border-slate-700 rounded-2xl p-5 flex flex-col overflow-y-auto custom-scrollbar shadow-inner shrink-0">
                  <h2 className="text-sm uppercase tracking-widest text-slate-400 font-bold mb-4 flex items-center gap-2">
                    <Info size={16} /> Classification Logic
                  </h2>
                  
                  <div className="flex flex-col gap-4">
                    {/* Physical Change */}
                    <div className="p-4 bg-slate-900 border border-slate-700 rounded-xl shadow-sm border-l-4 border-l-amber-500">
                      <strong className="text-amber-400 text-sm font-bold uppercase tracking-wider block mb-2">Physical Change</strong>
                      <ul className="text-xs text-slate-300 space-y-2 list-disc pl-4">
                        <li>Alters the <strong>form or state</strong> of matter (e.g., solid to liquid to gas, dissolving).</li>
                        <li>Does <span className="text-rose-400 font-bold">NOT</span> change the chemical identity.</li>
                        <li>Overcomes <strong>Intermolecular Forces</strong> (forces <em>between</em> molecules).</li>
                        <li>Easily reversible by physical means (e.g., cooling, evaporating).</li>
                      </ul>
                    </div>

                    {/* Chemical Change */}
                    <div className="p-4 bg-slate-900 border border-slate-700 rounded-xl shadow-sm border-l-4 border-l-emerald-500">
                      <strong className="text-emerald-400 text-sm font-bold uppercase tracking-wider block mb-2">Chemical Change</strong>
                      <ul className="text-xs text-slate-300 space-y-2 list-disc pl-4">
                        <li>Creates entirely <strong>new substances</strong> with different properties.</li>
                        <li>Cleaves <strong>Intramolecular Bonds</strong> (covalent/ionic bonds <em>within</em> the molecule).</li>
                        <li>Requires significantly more energy to break atomic bonds.</li>
                        <li>Generally irreversible by simple physical means.</li>
                      </ul>
                    </div>
                  </div>
                </div>

                {/* CENTER PANEL: Dual Animation Panes */}
                <div className="w-3/4 flex gap-4">
                  
                  {/* --- PHYSICAL CHANGE PANE --- */}
                  <div className="flex-1 bg-slate-800/80 border border-slate-700 rounded-2xl shadow-xl flex flex-col relative overflow-hidden">
                    
                    {/* Controls */}
                    <div className="p-4 border-b border-slate-700 bg-slate-800 flex justify-between items-center z-20">
                      <select 
                        value={physType} 
                        onChange={(e) => setPhysType(e.target.value)}
                        className="bg-slate-900 border border-slate-600 text-amber-400 text-xs font-bold rounded px-3 py-2 outline-none focus:border-amber-400 cursor-pointer"
                      >
                        <option value="boiling">Boiling Water (l ➔ g)</option>
                        <option value="melting">Melting Ice (s ➔ l)</option>
                        <option value="dissolving">Dissolving Salt (s ➔ aq)</option>
                      </select>
                      
                      <button 
                        onClick={() => setPhysActive(!physActive)}
                        className={`flex items-center gap-2 px-4 py-2 rounded-lg text-xs font-bold transition-all shadow-lg ${physActive ? 'bg-amber-600 text-white shadow-amber-900/50' : 'bg-slate-700 text-slate-200 hover:bg-slate-600'}`}
                      >
                        <PIcon size={16} /> {physActive ? pData.btnActive : pData.btnIdle}
                      </button>
                    </div>

                    {/* SVG Visualizer */}
                    <div className="flex-1 relative flex items-end justify-center pb-12">
                      <svg viewBox="0 0 200 300" className="w-full h-full max-h-[350px] overflow-visible">
                        
                        {/* Beaker Back Liquid (Dynamic based on state) */}
                        <path d="M 40,150 L 40,240 Q 40,250 50,250 L 150,250 Q 160,250 160,240 L 160,150 Z" 
                              fill="rgba(56, 189, 248, 0.1)" 
                              className={`transition-all duration-1000 ${physType === 'melting' && !physActive ? 'opacity-0' : 'opacity-100'}`} />
                        
                        {/* --- PHYSICAL RENDER LOGIC --- */}
                        {physType === 'boiling' && liquidPositions.map((pos, i) => (
                           <g key={i} className={physActive ? 'anim-gas' : 'anim-liquid'} style={{ animationDelay: `${pos.delay}s`, transformOrigin: `${pos.x}px ${pos.y}px` }}>
                             <H2O x={pos.x} y={pos.y} rot={pos.rot} />
                           </g>
                        ))}

                        {physType === 'melting' && (
                          physActive ? (
                            liquidPositions.map((pos, i) => (
                               <g key={i} className="anim-liquid fade-in" style={{ animationDelay: `${pos.delay}s`, transformOrigin: `${pos.x}px ${pos.y}px` }}>
                                 <H2O x={pos.x} y={pos.y} rot={pos.rot} />
                               </g>
                            ))
                          ) : (
                            iceLattice.map((pos, i) => (
                              <H2O key={i} x={pos.x} y={pos.y} rot={(i%2)*60} className="fade-in" />
                            ))
                          )
                        )}

                        {physType === 'dissolving' && (
                          <>
                            {/* Always show some water */}
                            {liquidPositions.slice(0,6).map((pos, i) => (
                               <g key={`w-${i}`} className="anim-liquid" style={{ animationDelay: `${pos.delay}s`, transformOrigin: `${pos.x}px ${pos.y}px` }}><H2O x={pos.x} y={pos.y} rot={pos.rot} /></g>
                            ))}
                            {/* Salt lattice vs Free ions */}
                            {saltLattice.map((pos, i) => {
                               const isNa = (i % 2 === 0);
                               return physActive ? (
                                 <g key={`ion-${i}`} className="anim-float fade-in" style={{ animationDelay: `${(i*0.3)%2}s` }}>
                                   <Ion x={40 + (Math.random()*120)} y={160 + (Math.random()*80)} type={isNa ? 'Na' : 'Cl'} />
                                 </g>
                               ) : (
                                 <g key={`lat-${i}`} className="fade-in">
                                   <Ion x={pos.x} y={pos.y} type={isNa ? 'Na' : 'Cl'} />
                                 </g>
                               );
                            })}
                          </>
                        )}

                        {/* Beaker Glass Outline */}
                        <path d="M 30,50 L 35,50 L 40,50 L 40,240 Q 40,250 50,250 L 150,250 Q 160,250 160,240 L 160,50 L 165,50 L 170,50" fill="none" stroke="rgba(203, 213, 225, 0.5)" strokeWidth="4" strokeLinecap="round" />
                        <path d="M 45,160 L 45,230 Q 50,240 70,240 Q 100,240 100,230 L 100,160 Z" fill="rgba(255,255,255,0.05)" pointerEvents="none" />

                        {/* Burner Visual - FIX: separated translate coordinates from scaleY to prevent float bug */}
                        {(physType === 'boiling' || physType === 'melting') && (
                          <g>
                            <rect x="70" y="260" width="60" height="20" fill="#334155" rx="4" />
                            <rect x="90" y="280" width="20" height="20" fill="#334155" />
                            {physActive && (
                              <g transform="translate(100, 260)">
                                <g className="anim-flame" style={{ transformOrigin: '0px 0px' }}>
                                  <path d="M 0,0 Q -15,-20 0,-40 Q 15,-20 0,0" fill="#f97316" opacity="0.8" />
                                  <path d="M 0,0 Q -8,-10 0,-20 Q 8,-10 0,0" fill="#fde047" />
                                </g>
                              </g>
                            )}
                          </g>
                        )}
                      </svg>
                    </div>

                    {/* Logic Engine Output */}
                    <div className="h-40 bg-slate-900 border-t border-slate-700 p-4 flex flex-col z-20 shrink-0">
                      <div className="flex items-center gap-2 mb-2 text-amber-400">
                        <Cpu size={16} /> <span className="text-[10px] uppercase font-bold tracking-widest">Logic Classifier Output</span>
                      </div>
                      <div className="bg-slate-800 rounded-lg p-3 font-mono text-xs text-slate-300 flex-1 border border-slate-700 shadow-inner flex flex-col justify-center">
                        <div className="text-center font-bold text-sm mb-2 text-white">{pData.eq}</div>
                        <div className={physActive ? 'text-amber-300' : 'text-slate-500'}>
                          {physActive ? pData.desc : '> Awaiting physical input...'}
                        </div>
                      </div>
                    </div>
                  </div>


                  {/* --- CHEMICAL CHANGE PANE --- */}
                  <div className="flex-1 bg-slate-800/80 border border-slate-700 rounded-2xl shadow-xl flex flex-col relative overflow-hidden">
                    
                    {/* Controls */}
                    <div className="p-4 border-b border-slate-700 bg-slate-800 flex justify-between items-center z-20">
                      <select 
                        value={chemType} 
                        onChange={(e) => setChemType(e.target.value)}
                        className="bg-slate-900 border border-slate-600 text-emerald-400 text-xs font-bold rounded px-3 py-2 outline-none focus:border-emerald-400 cursor-pointer"
                      >
                        <option value="electrolysis">Electrolysis of Water</option>
                        <option value="combustion">Combustion of Methane</option>
                        <option value="rusting">Oxidation of Iron</option>
                      </select>
                      
                      <button 
                        onClick={() => setChemActive(!chemActive)}
                        className={`flex items-center gap-2 px-4 py-2 rounded-lg text-xs font-bold transition-all shadow-lg ${chemActive ? 'bg-cyan-600 text-white shadow-cyan-900/50' : 'bg-slate-700 text-slate-200 hover:bg-slate-600'}`}
                      >
                        <CIcon size={16} /> {chemActive ? cData.btnActive : cData.btnIdle}
                      </button>
                    </div>

                    {/* SVG Visualizer */}
                    <div className="flex-1 relative flex items-end justify-center pb-12">
                      <svg viewBox="0 0 200 300" className="w-full h-full max-h-[350px] overflow-visible">
                        
                        {/* Background varies by reaction */}
                        {chemType === 'electrolysis' && (
                          <path d="M 40,150 L 40,240 Q 40,250 50,250 L 150,250 Q 160,250 160,240 L 160,150 Z" fill="rgba(56, 189, 248, 0.1)" />
                        )}
                        {chemType === 'combustion' && (
                          <rect x="30" y="40" width="140" height="220" fill="rgba(255,255,255,0.02)" rx="10" />
                        )}

                        {/* --- CHEMICAL RENDER LOGIC --- */}
                        
                        {/* ELECTROLYSIS */}
                        {chemType === 'electrolysis' && (
                          <>
                            <rect x="60" y="180" width="10" height="70" fill="#475569" stroke="#94a3b8" strokeWidth="2" rx="2" />
                            <rect x="130" y="180" width="10" height="70" fill="#475569" stroke="#94a3b8" strokeWidth="2" rx="2" />
                            <path d="M 65,160 L 65,10 L 90,10" fill="none" stroke="#334155" strokeWidth="3" />
                            <path d="M 135,160 L 135,10 L 110,10" fill="none" stroke="#334155" strokeWidth="3" />
                            <rect x="90" y="0" width="20" height="20" fill="#f8fafc" stroke="#334155" strokeWidth="2" />
                            <rect x="90" y="10" width="20" height="10" fill="#0f172a" />
                            {chemActive && <path d="M 95,10 L 105,10 L 100,5 Z" fill="#38bdf8" className="anim-zap" />}

                            {liquidPositions.map((pos, i) => (
                               <g key={i} className={chemActive ? 'fade-out' : 'anim-liquid'} style={{ animationDelay: `${pos.delay}s`, transformOrigin: `${pos.x}px ${pos.y}px` }}>
                                 <H2O x={pos.x} y={pos.y} rot={pos.rot} />
                               </g>
                            ))}
                            {chemActive && h2Positions.map((pos, i) => (
                              <g key={`h2-${i}`} className="anim-bubble" style={{ animationDelay: `${pos.delay}s`, transformOrigin: `${pos.x}px 240px` }}>
                                <H2 x={pos.x} y={240} rot={pos.rot} />
                              </g>
                            ))}
                            {chemActive && o2Positions.map((pos, i) => (
                              <g key={`o2-${i}`} className="anim-bubble" style={{ animationDelay: `${pos.delay}s`, transformOrigin: `${pos.x}px 240px` }}>
                                <O2 x={pos.x} y={240} rot={pos.rot} />
                              </g>
                            ))}
                          </>
                    )}

                    {/* COMBUSTION */}
                    {chemType === 'combustion' && (
                      <>
                        {!chemActive ? (
                          <g className="fade-in">
                            <CH4 x={60} y={100} rot={45} className="anim-float" style={{animationDelay: '0s'}} />
                            <CH4 x={140} y={180} rot={15} className="anim-float" style={{animationDelay: '1s'}} />
                            <O2 x={100} y={60} rot={80} className="anim-float" style={{animationDelay: '0.5s'}} />
                            <O2 x={50} y={200} rot={20} className="anim-float" style={{animationDelay: '1.5s'}} />
                            <O2 x={150} y={100} rot={120} className="anim-float" style={{animationDelay: '0.8s'}} />
                            <O2 x={100} y={220} rot={40} className="anim-float" style={{animationDelay: '1.2s'}} />
                          </g>
                        ) : (
                          <g className="fade-in">
                            <CO2 x={60} y={100} rot={45} className="anim-float" style={{animationDelay: '0s'}} />
                            <CO2 x={140} y={180} rot={15} className="anim-float" style={{animationDelay: '1s'}} />
                            <H2O x={100} y={60} rot={80} className="anim-float" style={{animationDelay: '0.5s'}} />
                            <H2O x={50} y={200} rot={20} className="anim-float" style={{animationDelay: '1.5s'}} />
                            <H2O x={150} y={100} rot={120} className="anim-float" style={{animationDelay: '0.8s'}} />
                            <H2O x={100} y={220} rot={40} className="anim-float" style={{animationDelay: '1.2s'}} />
                            
                            {/* Transient Flame Effect */}
                            <circle cx="100" cy="150" r="80" fill="#f97316" className="fade-out" style={{filter: 'blur(20px)'}} />
                          </g>
                        )}
                      </>
                    )}

                    {/* RUSTING */}
                    {chemType === 'rusting' && (
                      <>
                        {/* O2 Molecules falling down if active (Aligned to correct variable name) */}
                        {o2Positions.map((pos, i) => (
                           <g key={`o2-${i}`} className={chemActive ? 'fade-out' : 'anim-float'} style={{ animationDelay: `${pos.delay}s`, transition: 'transform 1s', transform: chemActive ? `translate(${pos.x}px, 200px)` : `translate(${pos.x}px, ${pos.y}px)` }}>
                             <O2 x={0} y={0} rot={pos.rot} />
                           </g>
                        ))}
                        
                        {/* Iron Lattice */}
                        {ironLattice.map((pos, i) => {
                          const isRust = chemActive && (i%2 !== 0); // Mix of Fe and O
                          return (
                            <circle 
                              key={`fe-${i}`} 
                              cx={pos.x} 
                              cy={pos.y} 
                              r={isRust ? "9" : "8"} 
                              fill={isRust ? "#b91c1c" : "#94a3b8"} 
                              className="transition-all duration-1000"
                            />
                          );
                        })}
                      </>
                    )}

                    {/* Container Outline */}
                    {chemType === 'combustion' ? (
                      <rect x="30" y="40" width="140" height="220" fill="none" stroke="rgba(203, 213, 225, 0.5)" strokeWidth="4" rx="10" />
                    ) : (
                      <path d="M 30,50 L 35,50 L 40,50 L 40,240 Q 40,250 50,250 L 150,250 Q 160,250 160,240 L 160,50 L 165,50 L 170,50" fill="none" stroke="rgba(203, 213, 225, 0.5)" strokeWidth="4" strokeLinecap="round" />
                    )}
                  </svg>
                </div>

                {/* Logic Engine Output */}
                <div className="h-40 bg-slate-900 border-t border-slate-700 p-4 flex flex-col z-20 shrink-0">
                  <div className="flex items-center gap-2 mb-2 text-cyan-400">
                    <Cpu size={16} /> <span className="text-[10px] uppercase font-bold tracking-widest">Logic Classifier Output</span>
                  </div>
                  <div className="bg-slate-800 rounded-lg p-3 font-mono text-xs text-slate-300 flex-1 border border-slate-700 shadow-inner flex flex-col justify-center">
                    <div className="text-center font-bold text-sm mb-2 text-white">{cData.eq}</div>
                    <div className={chemActive ? 'text-cyan-300' : 'text-slate-500'}>
                      {chemActive ? cData.desc : '> Awaiting chemical/energy input...'}
                    </div>
                  </div>
                </div>
              </div>

                </div>
              </React.Fragment>
            )}

            {/* === MODE 2: INTERACTIVE PRACTICE QUIZ === */}
            {appMode === 'quiz' && (
              <div className="w-full flex flex-col gap-6 fade-in h-full overflow-y-auto custom-scrollbar p-1">
                
                {/* Quiz HUD */}
                <div className="flex justify-between items-center bg-slate-800 border border-slate-700 p-4 rounded-xl shadow-lg shrink-0">
                  <div className="text-slate-300 font-bold uppercase tracking-wider text-sm flex items-center gap-2">
                    <Award className="text-purple-400" size={18} /> Score: <span className="text-purple-400 font-black text-xl">{quizScore}</span>
                  </div>
                  <div className="text-slate-300 font-bold uppercase tracking-wider text-sm flex items-center gap-2">
                    <Sparkles className="text-cyan-400" size={18} /> Streak: <span className="text-cyan-400 font-black text-xl">{quizStreak}</span>
                  </div>
                </div>

                {/* Question Area */}
                <div className="flex-grow flex flex-col justify-center items-center bg-slate-850 rounded-2xl border-2 border-slate-700 p-8 shadow-inner min-h-[220px] relative">
                  <span className="text-slate-500 uppercase font-bold tracking-widest text-xs mb-3">Identify the type of change:</span>
                  <h2 className="text-white font-black text-4xl md:text-5xl text-center tracking-wide drop-shadow-md mb-6">
                    {currentQuestion.text}
                  </h2>

                  {/* Guessing Buttons */}
                  {!showAnswer ? (
                    <div className="flex gap-4 w-full max-w-md mt-2">
                      <button 
                        onClick={() => handleQuizAnswer('physical')}
                        className="flex-1 bg-amber-600 hover:bg-amber-500 active:scale-95 text-white font-black py-4 rounded-xl shadow-md uppercase tracking-wider transition-all text-sm cursor-pointer"
                      >
                        Physical Change
                      </button>
                      <button 
                        onClick={() => handleQuizAnswer('chemical')}
                        className="flex-1 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-black py-4 rounded-xl shadow-md uppercase tracking-wider transition-all text-sm cursor-pointer"
                      >
                        Chemical Change
                      </button>
                    </div>
                  ) : (
                    <div className="w-full max-w-2xl flex flex-col items-center">
                      {/* Diagnostic Alert Box */}
                      <div className={`w-full p-5 rounded-xl border flex gap-3 shadow-lg items-center ${userGuess === currentQuestion.type ? 'bg-emerald-950/40 border-emerald-500 text-emerald-200' : 'bg-rose-950/40 border-rose-500 text-rose-200'}`}>
                        <div className="text-3xl">
                          {userGuess === currentQuestion.type ? '✅' : '❌'}
                        </div>
                        <div>
                          <p className="font-bold text-lg mb-1">
                            {userGuess === currentQuestion.type ? 'Correct Answer!' : 'Incorrect Classification'}
                          </p>
                          <p className="text-sm opacity-90">
                            <strong>{currentQuestion.text}</strong> is a <span className="uppercase font-bold">{currentQuestion.type} change</span>.
                          </p>
                        </div>
                      </div>

                      {/* Scientific Explanatory Card */}
                      <div className="w-full bg-slate-900 border border-slate-700 p-4 rounded-xl mt-4 text-slate-300 text-sm leading-relaxed text-center font-mono">
                        <span className="font-bold uppercase tracking-widest text-xs text-slate-500 block mb-1">Deductive Reasoning:</span>
                        {currentQuestion.reason}
                      </div>

                      {/* Next Question Controller */}
                      <button 
                        onClick={handleNextQuestion}
                        className="mt-6 px-8 py-3 bg-purple-600 hover:bg-purple-500 text-white font-bold rounded-xl transition-all shadow-md active:scale-95 text-sm uppercase tracking-widest cursor-pointer"
                      >
                        Next Challenge ⏭
                      </button>
                    </div>
                  )}
                </div>

                {/* Progress Indicators */}
                <div className="flex gap-1 justify-center shrink-0 pb-2">
                  {QUIZ_EXAMPLES.map((_, i) => (
                    <div 
                      key={i} 
                      className={`h-2 rounded-full transition-all duration-300 ${
                        i === quizIndex 
                          ? 'w-8 bg-purple-500' 
                          : i < quizIndex 
                            ? 'w-2 bg-purple-900/60' 
                            : 'w-2 bg-slate-800'
                      }`}
                    ></div>
                  ))}
                </div>

              </div>
            )}

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
