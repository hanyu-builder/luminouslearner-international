<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chloroalkali Process Membrane Cell Animation</title>
  <meta name="description" content="Interactive chloroalkali process membrane cell animation and mercury cell comparison. Explore the specific ion migration physics and the environmental transition to selective polymer membranes.">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for in-browser JSX transpilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { background-color: #0F172A; margin: 0; overflow: hidden; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    
    /* Custom Scrollbar */
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(30, 41, 59, 0.5); }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(71, 85, 105, 0.8); border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 1); }

    /* SVG Animations */
    @keyframes bubble-up {
      0% { transform: translateY(0) scale(0.5); opacity: 0; }
      20% { opacity: 0.8; }
      100% { transform: translateY(-120px) scale(1.5); opacity: 0; }
    }
    
    @keyframes flow-right {
      0% { transform: translateX(0); }
      100% { transform: translateX(20px); }
    }

    @keyframes ion-migrate-down {
      0% { transform: translate(0, 0); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translate(0, 120px); opacity: 0; }
    }

    @keyframes ion-migrate-right {
      0% { transform: translate(0, 0); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translate(140px, 0); opacity: 0; }
    }

    @keyframes ion-migrate-anode {
      0% { transform: translate(0, 0); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translate(-60px, 0); opacity: 0; }
    }

    .anim-bubble { animation: bubble-up 2s ease-in infinite; }
    .anim-flow { stroke-dasharray: 10 10; animation: flow-right 1s linear infinite; }
    .anim-na-down { animation: ion-migrate-down 3s ease-in-out infinite; }
    .anim-na-right { animation: ion-migrate-right 3s ease-in-out infinite; }
    .anim-cl-left { animation: ion-migrate-anode 3s ease-in-out infinite; }
    
    /* Highlight states */
    .dimmed { opacity: 0.15; transition: opacity 0.5s ease; filter: grayscale(100%); }
    .highlighted { opacity: 1; transition: opacity 0.5s ease; filter: drop-shadow(0 0 8px currentColor); }

  </style>
</head>
<body class="bg-slate-900 text-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // --- ICON COMPONENTS ---
    const SvgIcon = ({ children, size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
    );
    const Activity = (p) => <SvgIcon {...p}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12" /></SvgIcon>;
    const Info = (p) => <SvgIcon {...p}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></SvgIcon>;
    const AlertTriangle = (p) => <SvgIcon {...p}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></SvgIcon>;
    const ShieldCheck = (p) => <SvgIcon {...p}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></SvgIcon>;
    const MousePointer = (p) => <SvgIcon {...p}><path d="m3 3 7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/><path d="m13 13 6 6"/></SvgIcon>;

    function App() {
      // Tracking state: 'none' | 'mercury' | 'membrane'
      const [trackingMode, setTrackingMode] = useState('none');

      // Helper to determine classes for visual fading
      const getOpacityClass = (targetMode) => {
        if (trackingMode === 'none') return '';
        return trackingMode === targetMode ? 'highlighted' : 'dimmed';
      };

      return (
        <div className="min-h-screen bg-slate-900 flex flex-col font-sans overflow-hidden selection:bg-cyan-500/30">
          
          {/* HEADER (SEO Keyword Included) */}
          <header className="flex justify-between items-center px-6 py-4 bg-slate-800/80 border-b border-slate-700 shadow-lg shrink-0">
            <div className="flex items-center gap-3">
              <Activity className="text-cyan-400" size={28} />
              <div>
                <h1 className="text-2xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">
                  Chloroalkali Process Membrane Cell Animation
                </h1>
                <p className="text-xs text-slate-400 font-medium">Comparative Electrolytic Physics Engine</p>
              </div>
            </div>
            <button 
              onClick={() => setTrackingMode('none')}
              className="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs font-bold text-slate-200 transition-colors"
            >
              Reset View
            </button>
          </header>

          <main className="flex-1 flex gap-4 p-4 overflow-hidden max-h-[calc(100vh-80px)]">
            
            {/* LEFT PANEL: Theory & Context */}
            <div className="w-1/4 bg-slate-800/50 border border-slate-700 rounded-2xl p-5 flex flex-col overflow-y-auto custom-scrollbar shadow-inner shrink-0">
              <h2 className="text-sm uppercase tracking-widest text-slate-400 font-bold mb-4 flex items-center gap-2">
                <Info size={16} /> Reaction Physics
              </h2>
              
              <div className="bg-slate-900/50 rounded-xl p-4 border border-slate-700 mb-4">
                <p className="text-[10px] text-slate-400 uppercase font-bold tracking-wider mb-2">Overall Process</p>
                <div className="font-mono text-[11px] text-slate-200 text-center font-bold tracking-wider">
                  2NaCl(aq) + 2H₂O(l) ➔ 2NaOH(aq) + Cl₂(g) + H₂(g)
                </div>
              </div>

              <div className="flex flex-col gap-4 text-sm">
                
                {/* Mercury Cell Info */}
                <div className={`p-4 rounded-xl border transition-all duration-500 ${trackingMode === 'mercury' ? 'bg-amber-900/30 border-amber-500 shadow-[0_0_15px_rgba(245,158,11,0.2)]' : 'bg-slate-800 border-slate-600'}`}>
                  <div className="flex items-center justify-between mb-2">
                    <strong className="text-amber-400 flex items-center gap-2"><AlertTriangle size={16}/> Legacy: Mercury Cell</strong>
                  </div>
                  
                  <div className="font-mono text-[10px] bg-slate-900 p-2 rounded text-slate-300 mb-2 text-left">
                    <div className="text-emerald-400 mb-1">Anode(+): 2Cl⁻ ➔ Cl₂ + 2e⁻</div>
                    <div className="text-amber-400">Cathode(-): Na⁺ + e⁻ + Hg ➔ Na(Hg)</div>
                  </div>
                  
                  <p className="text-[10px] text-amber-200 mb-3 leading-relaxed border-l-2 border-amber-500 pl-2">
                    <strong>Exam Note (Overpotential):</strong> Normally, H⁺ is reduced easier than Na⁺. However, Mercury has a very high <em>hydrogen overpotential</em> (a kinetic barrier to forming H₂ gas). This allows Na⁺ to be reduced instead, dissolving into the mercury as an amalgam!
                  </p>

                  <button 
                    onClick={() => setTrackingMode('mercury')}
                    className="w-full flex items-center justify-center gap-2 py-2 bg-amber-600/20 hover:bg-amber-600/40 text-amber-300 border border-amber-500/50 rounded text-xs font-bold transition-colors mt-auto"
                  >
                    <MousePointer size={14} /> Track Na⁺ (Amalgamation)
                  </button>
                </div>

                {/* Membrane Cell Info */}
                <div className={`p-4 rounded-xl border transition-all duration-500 flex-1 flex flex-col ${trackingMode === 'membrane' ? 'bg-emerald-900/30 border-emerald-500 shadow-[0_0_15px_rgba(16,185,129,0.2)]' : 'bg-slate-800 border-slate-600'}`}>
                  <div className="flex items-center justify-between mb-2">
                    <strong className="text-emerald-400 flex items-center gap-2"><ShieldCheck size={16}/> Modern: Membrane Cell</strong>
                  </div>
                  
                  <div className="font-mono text-[10px] bg-slate-900 p-2 rounded text-slate-300 mb-2 text-left">
                    <div className="text-emerald-400 mb-1">Anode(+): 2Cl⁻ ➔ Cl₂ + 2e⁻</div>
                    <div className="text-blue-300">Cathode(-): 2H₂O + 2e⁻ ➔ H₂ + 2OH⁻</div>
                  </div>

                  <p className="text-[10px] text-emerald-200 mb-3 leading-relaxed border-l-2 border-emerald-500 pl-2">
                    <strong>Exam Note (Purity):</strong> The selective polymer membrane only allows positive ions (Na⁺) through. It blocks Cl⁻ from mixing with OH⁻ (which would disproportionate into bleach, NaClO). This ensures the production of highly pure NaOH.
                  </p>

                  <button 
                    onClick={() => setTrackingMode('membrane')}
                    className="w-full flex items-center justify-center gap-2 py-2 bg-emerald-600/20 hover:bg-emerald-600/40 text-emerald-300 border border-emerald-500/50 rounded text-xs font-bold transition-colors mt-auto"
                  >
                    <MousePointer size={14} /> Track Na⁺ (Membrane)
                  </button>
                </div>

              </div>
            </div>

            {/* RIGHT PANEL: Side-by-Side SVG Simulators */}
            <div className="w-3/4 flex flex-col xl:flex-row gap-4">
              
              {/* === MERCURY CELL SIMULATOR === */}
              <div className={`flex-1 bg-slate-800/80 border-2 rounded-2xl p-4 shadow-xl flex flex-col relative overflow-hidden transition-all duration-700 ${trackingMode === 'mercury' ? 'border-amber-500' : 'border-slate-700'}`}>
                <div className="absolute top-4 left-6 text-slate-500 text-xs uppercase font-bold tracking-widest z-20">Flowing Mercury Cell</div>
                
                <div className={`flex-1 w-full h-full relative flex items-center justify-center mt-6 ${getOpacityClass('mercury')}`}>
                  <svg viewBox="0 0 400 400" className="w-full h-full max-h-[350px]">
                    {/* Background Brine Pool */}
                    <rect x="20" y="80" width="360" height="240" fill="rgba(56, 189, 248, 0.15)" rx="10" />
                    <text x="35" y="100" fill="#38bdf8" fontSize="12" fontWeight="bold">Concentrated NaCl (Brine)</text>
                    
                    {/* Anodes (Titanium) */}
                    <rect x="80" y="40" width="40" height="150" fill="#475569" stroke="#94a3b8" strokeWidth="3" rx="4" />
                    <rect x="280" y="40" width="40" height="150" fill="#475569" stroke="#94a3b8" strokeWidth="3" rx="4" />
                    <text x="100" y="30" fill="#94a3b8" fontSize="14" fontWeight="bold" textAnchor="middle">Anode (+)</text>
                    <text x="300" y="30" fill="#94a3b8" fontSize="14" fontWeight="bold" textAnchor="middle">Anode (+)</text>

                    {/* Chlorine Bubbles (Cl2) */}
                    <g className="text-emerald-400">
                      <circle cx="100" cy="180" r="5" fill="currentColor" className="anim-bubble" style={{animationDelay: '0s'}} />
                      <circle cx="90" cy="170" r="4" fill="currentColor" className="anim-bubble" style={{animationDelay: '0.5s'}} />
                      <circle cx="110" cy="160" r="6" fill="currentColor" className="anim-bubble" style={{animationDelay: '1s'}} />
                      <text x="100" y="150" fill="currentColor" fontSize="14" fontWeight="bold" textAnchor="middle" opacity="0.8">Cl₂</text>

                      <circle cx="300" cy="180" r="5" fill="currentColor" className="anim-bubble" style={{animationDelay: '0.2s'}} />
                      <circle cx="290" cy="170" r="4" fill="currentColor" className="anim-bubble" style={{animationDelay: '0.7s'}} />
                      <circle cx="310" cy="160" r="6" fill="currentColor" className="anim-bubble" style={{animationDelay: '1.2s'}} />
                      <text x="300" y="150" fill="currentColor" fontSize="14" fontWeight="bold" textAnchor="middle" opacity="0.8">Cl₂</text>
                    </g>

                    {/* Flowing Mercury Cathode (Bottom) */}
                    <path d="M 10,270 L 390,270 L 390,330 L 10,330 Z" fill="url(#hgGradient)" rx="10" />
                    <line x1="20" y1="300" x2="380" y2="300" stroke="#cbd5e1" strokeWidth="4" className="anim-flow" />
                    <text x="200" y="320" fill="#1e293b" fontSize="16" fontWeight="bold" textAnchor="middle">Flowing Hg Cathode (-)</text>
                    
                    {/* SVG Gradient Definition */}
                    <defs>
                      <linearGradient id="hgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stopColor="#94a3b8" />
                        <stop offset="50%" stopColor="#f8fafc" />
                        <stop offset="100%" stopColor="#64748b" />
                      </linearGradient>
                    </defs>

                    {/* Na+ Ions Migrating Down */}
                    <g className={`transition-all duration-500 ${trackingMode === 'mercury' ? 'text-amber-400 drop-shadow-[0_0_10px_rgba(251,191,36,0.8)]' : 'text-blue-400'}`}>
                      <g className="anim-na-down" style={{animationDelay: '0s'}}>
                        <circle cx="200" cy="150" r="10" fill="currentColor" />
                        <text x="200" y="154" fill="#0f172a" fontSize="10" fontWeight="bold" textAnchor="middle">Na⁺</text>
                      </g>
                      <g className="anim-na-down" style={{animationDelay: '1s'}}>
                        <circle cx="160" cy="120" r="10" fill="currentColor" />
                        <text x="160" y="124" fill="#0f172a" fontSize="10" fontWeight="bold" textAnchor="middle">Na⁺</text>
                      </g>
                      <g className="anim-na-down" style={{animationDelay: '2s'}}>
                        <circle cx="240" cy="130" r="10" fill="currentColor" />
                        <text x="240" y="134" fill="#0f172a" fontSize="10" fontWeight="bold" textAnchor="middle">Na⁺</text>
                      </g>
                    </g>
                    
                    {/* Amalgam output arrow */}
                    <path d="M 370,290 L 420,290" fill="none" stroke="#f59e0b" strokeWidth="4" strokeLinecap="round" strokeDasharray="4 4" className="anim-flow" opacity={trackingMode === 'mercury' ? 1 : 0} />
                    <text x="350" y="280" fill="#f59e0b" fontSize="12" fontWeight="bold" opacity={trackingMode === 'mercury' ? 1 : 0}>Na/Hg</text>

                  </svg>
                </div>
                
                {/* Specific Tracking Overlay Info */}
                {trackingMode === 'mercury' && (
                  <div className="absolute bottom-4 left-6 right-6 bg-slate-900/90 border border-amber-500/50 p-3 rounded-xl backdrop-blur text-xs text-amber-200 animate-pulse shadow-xl z-20 text-center">
                    <strong>Na⁺ Tracking:</strong> The sodium ions are attracted downwards to the negative mercury pool. Due to Hydrogen's high overpotential on mercury, Na⁺ is reduced instead, dissolving into the liquid mercury to form a sodium amalgam.
                  </div>
                )}
              </div>

              {/* === MEMBRANE CELL SIMULATOR === */}
              <div className={`flex-1 bg-slate-800/80 border-2 rounded-2xl p-4 shadow-xl flex flex-col relative overflow-hidden transition-all duration-700 ${trackingMode === 'membrane' ? 'border-emerald-500' : 'border-slate-700'}`}>
                <div className="absolute top-4 left-6 text-slate-500 text-xs uppercase font-bold tracking-widest z-20">Ion-Exchange Membrane Cell</div>
                
                <div className={`flex-1 w-full h-full relative flex items-center justify-center mt-6 ${getOpacityClass('membrane')}`}>
                  <svg viewBox="0 0 400 400" className="w-full h-full max-h-[350px]">
                    
                    {/* Left Compartment (Anode / Brine) */}
                    <rect x="20" y="40" width="170" height="300" fill="rgba(56, 189, 248, 0.2)" rx="5" />
                    <text x="105" y="320" fill="#38bdf8" fontSize="12" fontWeight="bold" textAnchor="middle">Saturated Brine</text>
                    <rect x="60" y="60" width="20" height="200" fill="#475569" stroke="#94a3b8" strokeWidth="2" rx="2" />
                    <text x="70" y="50" fill="#94a3b8" fontSize="14" fontWeight="bold" textAnchor="middle">Anode (+)</text>

                    {/* Right Compartment (Cathode / Water & NaOH) */}
                    <rect x="210" y="40" width="170" height="300" fill="rgba(167, 243, 208, 0.15)" rx="5" />
                    <text x="295" y="320" fill="#34d399" fontSize="12" fontWeight="bold" textAnchor="middle">Pure Dilute NaOH</text>
                    <rect x="320" y="60" width="20" height="200" fill="#94a3b8" stroke="#cbd5e1" strokeWidth="2" rx="2" />
                    <text x="330" y="50" fill="#cbd5e1" fontSize="14" fontWeight="bold" textAnchor="middle">Cathode (-)</text>

                    {/* The Cation-Exchange Membrane */}
                    <rect x="190" y="40" width="20" height="300" fill="rgba(16, 185, 129, 0.4)" stroke="#10b981" strokeWidth="2" strokeDasharray="5 5" />
                    <text x="200" y="30" fill="#10b981" fontSize="10" fontWeight="bold" textAnchor="middle">Selective Membrane</text>

                    {/* Chlorine Bubbles (Anode) */}
                    <g className="text-emerald-400">
                      <circle cx="70" cy="220" r="5" fill="currentColor" className="anim-bubble" style={{animationDelay: '0.1s'}} />
                      <circle cx="60" cy="210" r="4" fill="currentColor" className="anim-bubble" style={{animationDelay: '0.6s'}} />
                      <text x="60" y="120" fill="currentColor" fontSize="14" fontWeight="bold" opacity="0.8">Cl₂</text>
                    </g>

                    {/* Hydrogen Bubbles (Cathode) */}
                    <g className="text-blue-300">
                      <circle cx="330" cy="220" r="5" fill="currentColor" className="anim-bubble" style={{animationDelay: '0.3s'}} />
                      <circle cx="340" cy="210" r="4" fill="currentColor" className="anim-bubble" style={{animationDelay: '0.8s'}} />
                      <text x="340" y="120" fill="currentColor" fontSize="14" fontWeight="bold" opacity="0.8">H₂</text>
                    </g>

                    {/* Cl- Ions Migrating Left */}
                    <g className="text-emerald-500">
                      <g className="anim-cl-left" style={{animationDelay: '0.5s'}}>
                        <circle cx="160" cy="180" r="10" fill="currentColor" opacity="0.5" />
                        <text x="160" y="184" fill="#0f172a" fontSize="10" fontWeight="bold" textAnchor="middle">Cl⁻</text>
                      </g>
                    </g>

                    {/* Na+ Ions Migrating Right (Through Membrane) */}
                    <g className={`transition-all duration-500 ${trackingMode === 'membrane' ? 'text-emerald-400 drop-shadow-[0_0_12px_rgba(16,185,129,0.9)]' : 'text-blue-400'}`}>
                      <g className="anim-na-right" style={{animationDelay: '0s'}}>
                        <circle cx="120" cy="150" r="10" fill="currentColor" />
                        <text x="120" y="154" fill="#0f172a" fontSize="10" fontWeight="bold" textAnchor="middle">Na⁺</text>
                      </g>
                      <g className="anim-na-right" style={{animationDelay: '1s'}}>
                        <circle cx="130" cy="230" r="10" fill="currentColor" />
                        <text x="130" y="234" fill="#0f172a" fontSize="10" fontWeight="bold" textAnchor="middle">Na⁺</text>
                      </g>
                      <g className="anim-na-right" style={{animationDelay: '2s'}}>
                        <circle cx="110" cy="100" r="10" fill="currentColor" />
                        <text x="110" y="104" fill="#0f172a" fontSize="10" fontWeight="bold" textAnchor="middle">Na⁺</text>
                      </g>
                    </g>

                    {/* OH- static on right side */}
                    <g className="text-pink-400" opacity={trackingMode === 'membrane' ? 1 : 0.4}>
                       <circle cx="280" cy="150" r="10" fill="currentColor" opacity="0.4"/>
                       <text x="280" y="154" fill="#fff" fontSize="9" fontWeight="bold" textAnchor="middle">OH⁻</text>
                       <circle cx="260" cy="230" r="10" fill="currentColor" opacity="0.4"/>
                       <text x="260" y="234" fill="#fff" fontSize="9" fontWeight="bold" textAnchor="middle">OH⁻</text>
                    </g>

                  </svg>
                </div>

                {/* Specific Tracking Overlay Info */}
                {trackingMode === 'membrane' && (
                  <div className="absolute bottom-4 left-6 right-6 bg-slate-900/90 border border-emerald-500/50 p-3 rounded-xl backdrop-blur text-xs text-emerald-200 animate-pulse shadow-xl z-20 text-center">
                    <strong>Na⁺ Tracking:</strong> Driven by the electric field, Na⁺ ions pass seamlessly through the Nafion membrane to the cathode. The membrane actively blocks Cl⁻ and OH⁻ from crossing, preventing the formation of bleach (NaClO) and ensuring pure NaOH is collected.
                  </div>
                )}
              </div>

            </div>

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
