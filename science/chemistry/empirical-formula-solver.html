<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Empirical Formula Calculator</title>
    <meta name="description" content="Empirical formula calculator. Derives the simplest integer ratio from mass or percentage composition.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: { 850: '#151e2e', 900: '#0F172A', 950: '#020617' }
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM (Production builds) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel (Compiles JSX in the browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { margin: 0; background-color: #020617; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-slate-200 font-sans selection:bg-indigo-500 selection:text-white">

    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // --- Inline Icon Components (Replacing Lucide Imports) ---
        const Beaker = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M4.5 3h15"/><path d="M6 3v16a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V3"/><path d="M6 14h12"/></svg>
        );
        const CalculatorIcon = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></svg>
        );
        const ArrowRight = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        );
        const Info = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        );
        const AlertTriangle = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
        );

        // --- Data Dictionary ---
        const ATOMIC_MASSES = {
            C: { mass: 12.011, name: 'Carbon', color: 'text-sky-400', bg: 'bg-sky-400/10' },
            H: { mass: 1.008, name: 'Hydrogen', color: 'text-slate-100', bg: 'bg-slate-100/10' },
            O: { mass: 15.999, name: 'Oxygen', color: 'text-rose-400', bg: 'bg-rose-400/10' },
            N: { mass: 14.007, name: 'Nitrogen', color: 'text-emerald-400', bg: 'bg-emerald-400/10' }
        };

        // --- Main Application Component ---
        function App() {
            const [inputs, setInputs] = useState({ C: '', H: '', O: '', N: '' });
            const [inputType, setInputType] = useState('percentage'); // 'percentage' or 'mass'
            const [results, setResults] = useState(null);
            const [error, setError] = useState('');

            const handleInputChange = (el, value) => {
                // Only allow positive numbers and decimals
                if (value === '' || /^\d*\.?\d*$/.test(value)) {
                    setInputs(prev => ({ ...prev, [el]: value }));
                }
            };

            const calculateEmpiricalFormula = () => {
                setError('');
                
                // 1. Parse and validate inputs
                const parsedData = Object.entries(inputs)
                    .map(([el, val]) => ({ el, val: parseFloat(val) }))
                    .filter(item => !isNaN(item.val) && item.val > 0);

                if (parsedData.length === 0) {
                    setError('Please enter at least one element value greater than 0.');
                    setResults(null);
                    return;
                }

                if (inputType === 'percentage') {
                    const total = parsedData.reduce((sum, item) => sum + item.val, 0);
                    if (Math.abs(total - 100) > 1.5) {
                        setError(`Warning: Percentages sum to ${total.toFixed(2)}%, which is not close to 100%. Assuming 100g total sample anyway for calculation.`);
                    }
                }

                // 2. Convert to Moles
                let step1 = parsedData.map(item => ({
                    ...item,
                    moles: item.val / ATOMIC_MASSES[item.el].mass
                }));

                // 3. Find smallest mole value
                const minMoles = Math.min(...step1.map(item => item.moles));

                // 4. Divide by smallest to get pseudo-ratio
                let step2 = step1.map(item => ({
                    ...item,
                    ratio: item.moles / minMoles
                }));

                // 5. Find integer multiplier (check 1 through 10)
                let multiplier = 1;
                for (let i = 1; i <= 10; i++) {
                    const allInts = step2.every(item => {
                        const val = item.ratio * i;
                        // Check if it's within a 0.08 tolerance of a whole number
                        return Math.abs(val - Math.round(val)) <= 0.08;
                    });
                    if (allInts) {
                        multiplier = i;
                        break;
                    }
                }

                // 6. Apply multiplier and round to final integer
                const finalData = step2.map(item => ({
                    ...item,
                    finalInt: Math.round(item.ratio * multiplier)
                }));

                // 7. Construct Formula String
                const order = ['C', 'H', 'N', 'O'];
                finalData.sort((a, b) => order.indexOf(a.el) - order.indexOf(b.el));
                
                const displayFormula = finalData
                    .map(item => `${item.el}${item.finalInt > 1 ? `<sub>${item.finalInt}</sub>` : ''}`)
                    .join('');

                setResults({
                    steps: finalData,
                    minMoles,
                    multiplier,
                    displayFormula
                });
            };

            return (
                <div className="min-h-screen p-4 md:p-8 flex items-center justify-center">
                    <div className="max-w-6xl w-full grid grid-cols-1 lg:grid-cols-12 gap-8">
                        
                        {/* Left Panel: Inputs & Controls */}
                        <div className="lg:col-span-4 space-y-6">
                            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
                                <div className="flex items-center gap-3 mb-2">
                                    <div className="p-2 bg-indigo-500/20 rounded-lg text-indigo-400">
                                        <Beaker size={24} />
                                    </div>
                                    <h1 className="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-violet-400">
                                        Empirical Formula
                                    </h1>
                                </div>
                                <p className="text-sm text-slate-400 mb-6 leading-relaxed">
                                    Enter the mass or percentage composition. The algorithmic parser will derive the simplest integer ratio.
                                </p>

                                <div className="mb-6">
                                    <label className="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2 block">
                                        Input Type
                                    </label>
                                    <div className="flex bg-slate-950 rounded-lg p-1 border border-slate-800">
                                        <button
                                            onClick={() => setInputType('percentage')}
                                            className={`flex-1 text-sm py-2 rounded-md font-medium transition-colors ${inputType === 'percentage' ? 'bg-slate-800 text-indigo-400 shadow' : 'text-slate-400 hover:text-slate-200'}`}
                                        >
                                            Percentage (%)
                                        </button>
                                        <button
                                            onClick={() => setInputType('mass')}
                                            className={`flex-1 text-sm py-2 rounded-md font-medium transition-colors ${inputType === 'mass' ? 'bg-slate-800 text-indigo-400 shadow' : 'text-slate-400 hover:text-slate-200'}`}
                                        >
                                            Mass (g)
                                        </button>
                                    </div>
                                </div>

                                <div className="space-y-4">
                                    {Object.keys(ATOMIC_MASSES).map(el => (
                                        <div key={el} className="flex items-center gap-3">
                                            <div className={`w-12 h-12 rounded-xl flex items-center justify-center font-bold text-xl ${ATOMIC_MASSES[el].bg} ${ATOMIC_MASSES[el].color} border border-slate-700/50`}>
                                                {el}
                                            </div>
                                            <div className="flex-1 relative">
                                                <input
                                                    type="text"
                                                    value={inputs[el]}
                                                    onChange={(e) => handleInputChange(el, e.target.value)}
                                                    placeholder="0.00"
                                                    className="w-full bg-slate-950 border border-slate-700 rounded-xl py-3 pl-4 pr-12 text-slate-100 font-mono focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none transition-all"
                                                />
                                                <span className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 font-mono text-sm">
                                                    {inputType === 'percentage' ? '%' : 'g'}
                                                </span>
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                <button
                                    onClick={calculateEmpiricalFormula}
                                    className="w-full mt-8 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold py-4 rounded-xl transition-all shadow-lg active:scale-[0.98] flex items-center justify-center gap-2"
                                >
                                    <CalculatorIcon size={20} />
                                    Calculate Formula
                                </button>
                            </div>

                            {/* Educational Note */}
                            <div className="bg-slate-900/50 border border-slate-800 rounded-2xl p-5 shadow-inner">
                                <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-2">
                                    <Info size={14} /> Algorithm Mechanics
                                </h3>
                                <ol className="text-sm text-slate-400 space-y-2 list-decimal list-inside">
                                    <li>Assume 100g total (if %).</li>
                                    <li>Divide mass by Atomic Mass to get Moles.</li>
                                    <li>Divide all moles by the smallest mole value.</li>
                                    <li>Scale to nearest whole integers.</li>
                                </ol>
                            </div>
                        </div>

                        {/* Right Panel: Results & Step-by-Step Table */}
                        <div className="lg:col-span-8 flex flex-col h-full">
                            {error && (
                                <div className="mb-4 bg-rose-500/10 border border-rose-500/20 text-rose-400 px-4 py-3 rounded-xl flex items-start gap-3">
                                    <AlertTriangle size={20} className="shrink-0 mt-0.5" />
                                    <p className="text-sm">{error}</p>
                                </div>
                            )}

                            {!results ? (
                                <div className="flex-1 bg-slate-900/30 border border-slate-800 border-dashed rounded-2xl flex flex-col items-center justify-center text-slate-500 min-h-[400px]">
                                    <Beaker size={48} className="mb-4 opacity-20" />
                                    <p>Enter values and click calculate to view the breakdown.</p>
                                </div>
                            ) : (
                                <div className="flex-1 bg-slate-900 border border-slate-800 rounded-2xl p-6 md:p-8 shadow-2xl flex flex-col animate-in fade-in slide-in-from-bottom-4 duration-500">
                                    
                                    <h2 className="text-lg font-bold text-slate-200 mb-6 border-b border-slate-800 pb-4">
                                        Algorithmic Derivation Table
                                    </h2>

                                    <div className="overflow-x-auto rounded-xl border border-slate-800 shadow-inner bg-slate-950">
                                        <table className="w-full text-left text-sm whitespace-nowrap">
                                            <thead className="bg-slate-900 text-slate-400 uppercase text-xs tracking-wider">
                                                <tr>
                                                    <th className="px-4 py-4 font-semibold">Element</th>
                                                    <th className="px-4 py-4 font-semibold">Mass / %</th>
                                                    <th className="px-4 py-4 font-semibold">Atomic Mass</th>
                                                    <th className="px-4 py-4 font-semibold text-indigo-400">Step 1: Moles</th>
                                                    <th className="px-4 py-4 font-semibold text-violet-400">Step 2: Ratio</th>
                                                    <th className="px-4 py-4 font-semibold text-emerald-400">Step 3: Integer</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-800/50">
                                                {results.steps.map((row, idx) => (
                                                    <tr key={idx} className="hover:bg-slate-900/50 transition-colors">
                                                        <td className="px-4 py-4 font-bold flex items-center gap-2">
                                                            <span className={`w-2 h-2 rounded-full bg-current ${ATOMIC_MASSES[row.el].color}`}></span>
                                                            {row.el}
                                                        </td>
                                                        <td className="px-4 py-4 font-mono text-slate-300">
                                                            {row.val.toFixed(2)}{inputType === 'percentage' ? '%' : 'g'}
                                                        </td>
                                                        <td className="px-4 py-4 font-mono text-slate-400">
                                                            &divide; {ATOMIC_MASSES[row.el].mass}
                                                        </td>
                                                        <td className="px-4 py-4 font-mono text-indigo-300 bg-indigo-500/5">
                                                            = {row.moles.toFixed(4)}
                                                        </td>
                                                        <td className="px-4 py-4 font-mono text-violet-300 bg-violet-500/5">
                                                            &divide; {results.minMoles.toFixed(4)} = {row.ratio.toFixed(3)}
                                                        </td>
                                                        <td className="px-4 py-4 font-mono text-emerald-300 bg-emerald-500/5 font-bold">
                                                            {results.multiplier > 1 ? `× ${results.multiplier} = ` : ''}
                                                            {row.finalInt}
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>

                                    {/* Multiplier Alert (if applicable) */}
                                    {results.multiplier > 1 && (
                                        <div className="mt-4 p-4 bg-amber-500/10 border border-amber-500/20 rounded-xl flex items-start gap-3">
                                            <Info size={20} className="text-amber-400 shrink-0 mt-0.5" />
                                            <p className="text-sm text-amber-200">
                                                <strong>Scaling Factor Applied:</strong> A pseudo-ratio ended in a fraction. All values were multiplied by <strong>{results.multiplier}</strong> to achieve the simplest whole-number integers.
                                            </p>
                                        </div>
                                    )}

                                    {/* Final Result Panel */}
                                    <div className="mt-auto pt-8">
                                        <div className="bg-gradient-to-br from-slate-950 to-slate-900 border border-slate-700 p-6 rounded-2xl flex items-center justify-between shadow-inner">
                                            <div>
                                                <p className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Final Result</p>
                                                <p className="text-slate-300 text-sm">Simplest integer ratio calculated.</p>
                                            </div>
                                            <div className="flex items-center gap-4">
                                                <ArrowRight className="text-slate-600 hidden md:block" />
                                                <div 
                                                    className="text-4xl md:text-5xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-emerald-400 to-cyan-400"
                                                    dangerouslySetInnerHTML={{ __html: results.displayFormula }}
                                                />
                                            </div>
                                        </div>
                                    </div>

                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // --- Render Application ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
