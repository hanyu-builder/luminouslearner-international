<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oxidation Number Calculator | Interactive Chemistry Tool</title>
    <meta name="description" content="Oxidation number calculator. A visual, algorithmic parser that assigns oxidation states based on electronegativity rules and algebraic molecular charges.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: { 850: '#151e2e', 900: '#0F172A', 950: '#020617' },
                        ox: {
                            primary: '#8B5CF6',   // Violet
                            secondary: '#D946EF', // Fuchsia
                            success: '#10B981',   // Emerald
                            warning: '#F59E0B',   // Amber
                            error: '#EF4444'      // Red
                        }
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM (Production builds) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel (Compiles JSX in the browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { margin: 0; background-color: #020617; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .bg-grid {
            background-image: radial-gradient(circle at 2px 2px, rgba(30, 41, 59, 0.5) 1px, transparent 0);
            background-size: 30px 30px;
        }
        
        /* Math block styling */
        .math-block {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        }
    </style>
</head>
<body class="text-slate-200 font-sans selection:bg-violet-500 selection:text-white bg-grid min-h-screen flex items-center justify-center p-4 md:p-8">

    <div id="root" class="w-full max-w-6xl"></div>

    <script type="text/babel">
        const { useState } = React;

        // --- SVG Icons ---
        const Calculator = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect><line x1="8" y1="6" x2="16" y2="6"></line><line x1="16" y1="14" x2="16" y2="18"></line><path d="M16 10h.01"></path><path d="M12 10h.01"></path><path d="M8 10h.01"></path><path d="M12 14h.01"></path><path d="M8 14h.01"></path><path d="M12 18h.01"></path><path d="M8 18h.01"></path></svg>;
        const AlertCircle = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>;
        const Check = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>;
        const Info = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>;

        // --- Ruleset Engine ---
        const OXIDATION_RULES = [
            { check: (el) => el === 'F', state: -1, reason: "Fluorine is the most electronegative element; it is always -1." },
            { check: (el) => ['Li', 'Na', 'K', 'Rb', 'Cs'].includes(el), state: 1, reason: "Group 1 Alkali Metals are always +1." },
            { check: (el) => ['Be', 'Mg', 'Ca', 'Sr', 'Ba'].includes(el), state: 2, reason: "Group 2 Alkaline Earth Metals are always +2." },
            { check: (el) => el === 'Al', state: 3, reason: "Aluminum is always +3." },
            { check: (el) => el === 'H', state: 1, reason: "Hydrogen is assigned +1 (bonded to non-metals)." },
            { check: (el) => el === 'O', state: -2, reason: "Oxygen is highly electronegative and is typically assigned -2." },
            { check: (el) => ['Cl', 'Br', 'I'].includes(el), state: -1, reason: "Halogens are typically -1 (unless bonded to O or F)." }
        ];

        function formatState(num) {
            if (num > 0) return `+${num}`;
            if (num === 0) return `0`;
            return `${num}`;
        }

        function App() {
            const [inputFormula, setInputFormula] = useState('');
            const [results, setResults] = useState(null);
            const [error, setError] = useState('');

            const parseAndAnalyze = () => {
                setError('');
                setResults(null);
                
                if (!inputFormula.trim()) {
                    setError('Please enter a chemical formula.');
                    return;
                }

                let formula = inputFormula.replace(/\s+/g, '');
                let charge = 0;
                let log = [];
                let assignedStates = {};

                // 1. Extract Charge (e.g. ^2-, ^-2, ^+, ^-)
                const chargeMatch = formula.match(/\^([+-]?\d*[+-]?)$/);
                if (chargeMatch) {
                    let cStr = chargeMatch[1];
                    // Normalize charge strings
                    if (cStr === '+' || cStr === '1+') cStr = '+1';
                    if (cStr === '-' || cStr === '1-') cStr = '-1';
                    if (cStr.endsWith('-')) cStr = '-' + cStr.slice(0, -1);
                    if (cStr.endsWith('+')) cStr = '+' + cStr.slice(0, -1);
                    
                    charge = parseInt(cStr);
                    if (isNaN(charge)) charge = 0;
                    
                    formula = formula.replace(/\^.*$/, ''); // Remove charge from formula string
                    log.push(`Detected net molecular charge of ${formatState(charge)}.`);
                } else {
                    log.push(`No charge detected. Assuming net molecular charge is 0.`);
                }

                // 2. Extract Elements and Counts
                // Matches Capital letter followed by optional lowercase, then optional digits
                const elementRegex = /([A-Z][a-z]*)(\d*)/g;
                let match;
                const elementCounts = {};
                let elementFound = false;

                while ((match = elementRegex.exec(formula)) !== null) {
                    elementFound = true;
                    const el = match[1];
                    const count = parseInt(match[2]) || 1;
                    // Aggregate counts (e.g. CH3COOH -> C:2, H:4, O:2)
                    elementCounts[el] = (elementCounts[el] || 0) + count; 
                }

                if (!elementFound) {
                    setError('Could not parse any valid elements. Use proper capitalization (e.g., NaCl, H2SO4).');
                    return;
                }

                const uniqueElements = Object.keys(elementCounts);

                // 3. Apply Oxidation Rules
                if (uniqueElements.length === 1) {
                    // Rule 0: Free Elements or Monatomic Ions
                    const el = uniqueElements[0];
                    const state = charge / elementCounts[el];
                    assignedStates[el] = state;
                    log.push(`Elemental substance or monatomic ion detected. Oxidation state is derived directly from the charge: ${formatState(charge)} / ${elementCounts[el]} = ${formatState(state)}.`);
                } else {
                    // Hierarchical Rule Parsing
                    for (let rule of OXIDATION_RULES) {
                        let unassigned = uniqueElements.filter(e => assignedStates[e] === undefined);
                        
                        // If only one unknown is left, stop applying hard rules. We must solve algebraically to balance the charge.
                        if (unassigned.length === 1) break;

                        for (let el of unassigned) {
                            if (rule.check(el)) {
                                assignedStates[el] = rule.state;
                                log.push(`Assigned ${el} = ${formatState(rule.state)} (${rule.reason})`);
                            }
                        }
                    }

                    // 4. Algebraic Resolution for the final unknown
                    let unassigned = uniqueElements.filter(e => assignedStates[e] === undefined);
                    
                    if (unassigned.length === 1) {
                        const target = unassigned[0];
                        let sumOfKnowns = 0;
                        
                        for (let el in assignedStates) {
                            sumOfKnowns += assignedStates[el] * elementCounts[el];
                        }
                        
                        const remainder = charge - sumOfKnowns;
                        const calculatedState = remainder / elementCounts[target];
                        
                        assignedStates[target] = calculatedState;
                        log.push(`Algebraic Resolution: Calculated ${target} = ${formatState(calculatedState)} to balance the net charge.`);
                    } else if (unassigned.length > 1) {
                        setError(`Formula contains too many unknown variables (${unassigned.join(', ')}). The standard ruleset cannot resolve this without more context.`);
                        return;
                    } else {
                        // Edge case: All elements were assigned by hard rules (e.g. H2O -> H=+1, O=-2). Check if it balances!
                        let sum = 0;
                        for (let el in assignedStates) sum += assignedStates[el] * elementCounts[el];
                        
                        if (sum !== charge) {
                            log.push(`⚠️ WARNING: The sum of the states (${formatState(sum)}) does not equal the net charge (${formatState(charge)}). This indicates an exception to the standard rules (e.g., a peroxide).`);
                        }
                    }
                }

                // Format final results payload
                setResults({
                    formulaText: formula,
                    charge: charge,
                    elementCounts: elementCounts,
                    states: assignedStates,
                    log: log
                });
            };

            const handleKeyPress = (e) => {
                if (e.key === 'Enter') parseAndAnalyze();
            };

            return (
                <div className="w-full grid grid-cols-1 lg:grid-cols-12 gap-8">
                    
                    {/* Left Panel: Inputs & Ruleset Log */}
                    <div className="lg:col-span-5 space-y-6 flex flex-col">
                        <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
                            <div className="flex items-center gap-3 mb-2">
                                <div className="p-2 bg-violet-500/20 rounded-lg text-violet-400">
                                    <Calculator />
                                </div>
                                <h1 className="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-violet-400 to-fuchsia-400">
                                    Oxidation Calculator
                                </h1>
                            </div>
                            <p className="text-sm text-slate-400 mb-6 leading-relaxed">
                                Enter a chemical formula. The algorithm applies electronegativity rules to algebraically solve for oxidation states.
                            </p>

                            <div className="relative mb-4">
                                <label className="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2 block">
                                    Chemical Formula & Charge
                                </label>
                                <input
                                    type="text"
                                    value={inputFormula}
                                    onChange={(e) => setInputFormula(e.target.value)}
                                    onKeyPress={handleKeyPress}
                                    placeholder="e.g. KMnO4, SO4^-2, H2O2"
                                    className="w-full bg-slate-950 border-2 border-slate-700 rounded-xl py-4 px-4 text-slate-100 font-mono text-lg focus:border-violet-500 focus:ring-1 focus:ring-violet-500 outline-none transition-all shadow-inner"
                                    autoComplete="off"
                                    spellCheck="false"
                                />
                                <div className="mt-2 flex items-start gap-2 text-xs text-slate-500">
                                    <Info className="shrink-0 w-4 h-4 text-violet-400" />
                                    <span>Use <strong>^</strong> to indicate charge (e.g., <code className="text-slate-300 bg-slate-800 px-1 rounded">SO4^-2</code>). Grouping brackets are automatically expanded/flattened.</span>
                                </div>
                            </div>

                            <button
                                onClick={parseAndAnalyze}
                                className="w-full bg-gradient-to-r from-violet-600 to-fuchsia-600 hover:from-violet-500 hover:to-fuchsia-500 text-white font-bold py-4 rounded-xl transition-all shadow-lg shadow-violet-900/50 active:scale-[0.98] mt-2"
                            >
                                Analyze Oxidation States
                            </button>
                        </div>

                        {/* Ruleset Application Log */}
                        {results && (
                            <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 shadow-inner flex-grow animate-in fade-in slide-in-from-left-4 duration-500">
                                <h2 className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                                    Algorithmic Parser Log
                                </h2>
                                <ul className="space-y-3 text-sm">
                                    {results.log.map((entry, idx) => (
                                        <li key={idx} className="flex gap-3 text-slate-300">
                                            <span className="text-violet-400 font-mono text-xs mt-0.5">[{idx+1}]</span>
                                            <span dangerouslySetInnerHTML={{ __html: entry.replace(/([-+]\d+(?:\.\d+)?)/g, '<strong class="text-white">$1</strong>') }} />
                                        </li>
                                    ))}
                                </ul>
                            </div>
                        )}
                    </div>

                    {/* Right Panel: Visual Equation & Results */}
                    <div className="lg:col-span-7 flex flex-col h-full">
                        {error && (
                            <div className="mb-6 bg-red-500/10 border border-red-500/30 text-red-400 px-4 py-4 rounded-xl flex items-start gap-3 animate-in fade-in">
                                <AlertCircle className="shrink-0 mt-0.5" />
                                <p className="text-sm font-medium">{error}</p>
                            </div>
                        )}

                        {!results && !error && (
                            <div className="flex-1 bg-slate-900/30 border border-slate-800 border-dashed rounded-2xl flex flex-col items-center justify-center text-slate-500 min-h-[400px]">
                                <div className="p-4 bg-slate-800/50 rounded-full mb-4">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="opacity-50"><path d="M12 2v20"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                                </div>
                                <p className="font-medium">Awaiting formula input.</p>
                                <p className="text-sm mt-1">Equation breakdown will appear here.</p>
                            </div>
                        )}

                        {results && (
                            <div className="flex-1 flex flex-col gap-6">
                                
                                {/* Result Badges */}
                                <div className="grid grid-cols-2 md:grid-cols-3 gap-4 animate-in fade-in slide-in-from-bottom-4 duration-500 delay-100">
                                    {Object.entries(results.states).map(([el, state], idx) => (
                                        <div key={el} className="bg-slate-900 border border-slate-700 rounded-2xl p-5 shadow-xl relative overflow-hidden group">
                                            <div className="absolute -right-4 -top-4 text-7xl font-bold text-slate-800/50 group-hover:scale-110 transition-transform select-none">
                                                {el}
                                            </div>
                                            <div className="relative z-10">
                                                <span className="block text-xs font-semibold text-slate-400 uppercase tracking-widest mb-1">Atom</span>
                                                <span className="block text-2xl font-bold text-white mb-4">{el}</span>
                                                
                                                <span className="block text-xs font-semibold text-slate-400 uppercase tracking-widest mb-1">Oxidation State</span>
                                                <span className={`inline-block px-3 py-1 rounded-lg font-mono font-bold text-lg border ${state > 0 ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400' : state < 0 ? 'bg-rose-500/10 border-rose-500/30 text-rose-400' : 'bg-slate-700 border-slate-600 text-slate-300'}`}>
                                                    {formatState(state)}
                                                </span>
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                {/* Visual Equation Breakdown */}
                                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 md:p-8 shadow-xl mt-auto animate-in fade-in slide-in-from-bottom-4 duration-500 delay-200">
                                    <h3 className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-6 border-b border-slate-800 pb-4 flex items-center gap-2">
                                        <Calculator className="w-4 h-4" /> Algebraic Verification
                                    </h3>
                                    
                                    <div className="math-block bg-slate-950 p-6 rounded-xl border border-slate-800/80 shadow-inner overflow-x-auto whitespace-nowrap text-lg text-slate-300 space-y-4">
                                        
                                        {/* Step 1: The Setup */}
                                        <div className="flex items-center gap-2">
                                            {Object.entries(results.elementCounts).map(([el, count], idx, arr) => (
                                                <span key={el} className="flex items-center">
                                                    <span className="text-slate-500">{count}</span>
                                                    <span className="text-violet-400 font-bold ml-1">{el}</span>
                                                    {idx < arr.length - 1 && <span className="mx-3 text-slate-600">+</span>}
                                                </span>
                                            ))}
                                            <span className="mx-3 text-slate-500">=</span>
                                            <span className="text-white font-bold">{formatState(results.charge)}</span>
                                        </div>

                                        {/* Step 2: Substituting Values */}
                                        <div className="flex items-center gap-2">
                                            {Object.entries(results.elementCounts).map(([el, count], idx, arr) => {
                                                const state = results.states[el];
                                                const colorClass = state > 0 ? 'text-emerald-400' : state < 0 ? 'text-rose-400' : 'text-slate-300';
                                                return (
                                                    <span key={el} className="flex items-center">
                                                        <span className="text-slate-500">{count}(</span>
                                                        <span className={`${colorClass} font-bold`}>{formatState(state)}</span>
                                                        <span className="text-slate-500">)</span>
                                                        {idx < arr.length - 1 && <span className="mx-3 text-slate-600">+</span>}
                                                    </span>
                                                );
                                            })}
                                            <span className="mx-3 text-slate-500">=</span>
                                            <span className="text-white font-bold">{formatState(results.charge)}</span>
                                        </div>

                                        {/* Step 3: The Math */}
                                        <div className="flex items-center gap-2 border-t border-slate-800/50 pt-4 mt-2">
                                            {Object.entries(results.elementCounts).map(([el, count], idx, arr) => {
                                                const total = count * results.states[el];
                                                const colorClass = total > 0 ? 'text-emerald-400' : total < 0 ? 'text-rose-400' : 'text-slate-300';
                                                return (
                                                    <span key={el} className="flex items-center">
                                                        <span className={`${colorClass} font-bold`}>{formatState(total)}</span>
                                                        {idx < arr.length - 1 && <span className="mx-3 text-slate-600"> </span>}
                                                    </span>
                                                );
                                            })}
                                            <span className="mx-3 text-slate-500">=</span>
                                            <span className="text-white font-bold">{formatState(results.charge)}</span>
                                        </div>
                                    </div>

                                    {/* Final Verification Check */}
                                    <div className="mt-6 flex items-center justify-end gap-2 text-sm text-emerald-400 font-medium bg-emerald-500/10 py-2 px-4 rounded-lg w-max ml-auto">
                                        <Check className="w-4 h-4" /> Equation Balanced
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                </div>
            );
        }

        // --- Render Application ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
