<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Redox Titration Simulator Online</title>
  <meta name="description" content="Interactive redox titration simulator online. Learn quantitative analysis and electron transfer equivalence using KMnO4 and Fe2+, or Iodine and Thiosulfate.">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for in-browser JSX transpilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { background-color: #0F172A; margin: 0; }
    
    /* Custom Scrollbar */
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(30, 41, 59, 0.5); }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(71, 85, 105, 0.8); border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 1); }

    /* Calibrated Dripping Animations (Nozzle tip -> Flask liquid surface) */
    @keyframes drip-stream {
      0% { top: 0px; opacity: 1; height: 10px; }
      85% { opacity: 0.95; height: 16px; }
      100% { top: 78px; opacity: 0; height: 6px; }
    }
    @keyframes drip-single {
      0% { top: 0px; opacity: 1; height: 7px; }
      80% { opacity: 1; height: 11px; }
      100% { top: 78px; opacity: 0; height: 5px; }
    }
    .animate-drip-stream {
      animation: drip-stream 0.24s linear infinite;
    }
    .animate-drip-single {
      animation: drip-single 0.35s ease-in forwards;
    }

    /* Magnetic Stir Bar Spin */
    @keyframes spin-magnetic { 
      0% { transform: translateX(-50%) rotate(0deg); }
      100% { transform: translateX(-50%) rotate(360deg); } 
    }
    .animate-spin-slow { 
      animation: spin-magnetic 0.9s linear infinite; 
    }

    /* Prevent accidental callouts/selection when holding buttons on touchscreens */
    .no-touch-callout {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // --- ICON COMPONENTS ---
    const SvgIcon = ({ children, size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
    );
    const Activity = (p) => <SvgIcon {...p}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12" /></SvgIcon>;
    const Droplet = (p) => <SvgIcon {...p}><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></SvgIcon>;
    const FlaskConical = (p) => <SvgIcon {...p}><path d="M10 2v7.31L2 20.24a2 2 0 0 0 1.76 2.76h16.48a2 2 0 0 0 1.76-2.76L14 9.31V2"/><path d="M8.5 2h7"/><path d="M10 10l5.5-5.5"/></SvgIcon>;
    const RotateCcw = (p) => <SvgIcon {...p}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></SvgIcon>;
    const RefreshCw = (p) => <SvgIcon {...p}><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></SvgIcon>;
    const Calculator = (p) => <SvgIcon {...p}><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></SvgIcon>;
    const Info = (p) => <SvgIcon {...p}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></SvgIcon>;

    // --- REACTION DEFINITIONS ---
    const REACTIONS = {
      kmno4: {
        id: 'kmno4',
        titrantText: 'KMnO4',
        analyteText: 'Fe2+',
        titrantNode: <span>KMnO<sub>4</sub></span>,
        analyteNode: <span>Fe<sup>2+</sup></span>,
        tabLabel: <span>KMnO<sub>4</sub> / Fe<sup>2+</sup></span>,
        titrantConc: 0.020,
        analyteVol: 25.0,
        ratioTitrant: 1,
        ratioAnalyte: 5,
        minConc: 0.050,
        maxConc: 0.150,
        titrantColor: 'bg-purple-700/85',
        titrantDrop: 'bg-purple-500',
        titrantMeniscus: 'bg-purple-300/60',
        plumeFill: 'rgba(168, 85, 247, 0.45)',
        eqReactant1: <span>MnO<sub>4</sub><sup>−</sup><sub>(aq)</sub></span>,
        eqReactant2: <span>5Fe<sup>2+</sup><sub>(aq)</sub> + 8H<sup>+</sup><sub>(aq)</sub></span>,
        eqProducts: <span>Mn<sup>2+</sup><sub>(aq)</sub> + 5Fe<sup>3+</sup><sub>(aq)</sub> + 4H<sub>2</sub>O<sub>(l)</sub></span>,
        eqColors: ['text-purple-400', 'text-emerald-400'],
        insight: <span>1 mole of KMnO<sub>4</sub> oxidizes exactly 5 moles of Fe<sup>2+</sup>. Permanganate acts as its own indicator, turning pale pink at the endpoint.</span>,
        insightColor: 'text-purple-200',
        insightBg: 'bg-purple-900/20 border-purple-500/30',
        getFlaskColor: (addedVol, targetVol) => {
          const ratio = targetVol === 0 ? 0 : Number((addedVol / targetVol).toFixed(4));
          if (ratio === 0) return 'rgba(167, 243, 208, 0.42)'; // Pale Green
          
          if (ratio < 1.00) {
            const r = Math.floor(167 + (250 - 167) * ratio);
            const g = Math.floor(243 + (240 - 243) * ratio);
            const b = Math.floor(208 + (200 - 208) * ratio);
            return `rgba(${r}, ${g}, ${b}, 0.42)`;
          }
          
          if (ratio >= 1.00 && ratio <= 1.02) return 'rgba(244, 114, 182, 0.52)'; // Pale Pink Endpoint
          
          const overshotRatio = Math.min((ratio - 1.02) * 20, 1);
          const r = Math.floor(244 - (244 - 128) * overshotRatio);
          const g = Math.floor(114 - (114 - 0) * overshotRatio);
          const b = Math.floor(182 - (182 - 128) * overshotRatio);
          const a = 0.52 + (0.38 * overshotRatio);
          return `rgba(${r}, ${g}, ${b}, ${a})`;
        },
        getVisualStatus: (ratio) => {
          if (ratio === 0) return "Initial (Pale green Fe²⁺)";
          if (ratio < 1.00) return "Titrating (MnO₄⁻ decolorized as Fe³⁺ forms)";
          if (ratio <= 1.02) return "End Point Reached! (Permanent Pale Pink)";
          return "Over-titrated (Excess purple MnO₄⁻)";
        }
      },
      iodine: {
        id: 'iodine',
        titrantText: 'Na2S2O3',
        analyteText: 'I2',
        titrantNode: <span>Na<sub>2</sub>S<sub>2</sub>O<sub>3</sub></span>,
        analyteNode: <span>I<sub>2</sub></span>,
        tabLabel: <span>S<sub>2</sub>O<sub>3</sub><sup>2−</sup> / I<sub>2</sub></span>,
        titrantConc: 0.100,
        analyteVol: 25.0,
        ratioTitrant: 2,
        ratioAnalyte: 1,
        minConc: 0.040,
        maxConc: 0.090,
        titrantColor: 'bg-sky-100/30',
        titrantDrop: 'bg-slate-200',
        titrantMeniscus: 'bg-slate-300/50',
        plumeFill: 'rgba(226, 232, 240, 0.35)',
        eqReactant1: <span>2S<sub>2</sub>O<sub>3</sub><sup>2−</sup><sub>(aq)</sub></span>,
        eqReactant2: <span>I<sub>2(aq)</sub></span>,
        eqProducts: <span>S<sub>4</sub>O<sub>6</sub><sup>2−</sup><sub>(aq)</sub> + 2I<sup>−</sup><sub>(aq)</sub></span>,
        eqColors: ['text-sky-300', 'text-amber-400'],
        insight: <span>Starch indicator is added only when the solution fades to pale yellow, forming a sharp dark blue-black complex just before the colorless endpoint.</span>,
        insightColor: 'text-amber-200',
        insightBg: 'bg-amber-900/20 border-amber-500/30',
        getFlaskColor: (addedVol, targetVol) => {
          const ratio = targetVol === 0 ? 0 : Number((addedVol / targetVol).toFixed(4));
          if (ratio === 0) return 'rgba(180, 83, 9, 0.82)'; // Dark Brown (I2)
          if (ratio < 0.90) {
            const p = ratio / 0.90;
            const r = Math.floor(180 + (253 - 180) * p);
            const g = Math.floor(83 + (230 - 83) * p);
            const b = Math.floor(9 + (138 - 9) * p);
            return `rgba(${r}, ${g}, ${b}, 0.62)`;
          }
          if (ratio < 1.00) return 'rgba(15, 23, 42, 0.92)'; // Dark Blue-Black (Starch Complex)
          return 'rgba(240, 248, 255, 0.16)'; // Colorless Endpoint
        },
        getVisualStatus: (ratio) => {
          if (ratio === 0) return "Initial (Dark brown I₂ solution)";
          if (ratio < 0.90) return "Titrating (Brown fading to pale straw-yellow)";
          if (ratio < 1.00) return "Starch Indicator Added (Blue-black complex)";
          if (ratio <= 1.02) return "End Point Reached! (Colorless)";
          return "Over-titrated (Colorless, excess S₂O₃²⁻)";
        }
      }
    };

    function App() {
      const [activeReactionId, setActiveReactionId] = useState('kmno4');
      const activeReaction = REACTIONS[activeReactionId];

      const [actualAnalyteConc, setActualAnalyteConc] = useState(0);
      const [targetVolume, setTargetVolume] = useState(0);
      const [addedVol, setAddedVol] = useState(0.00);
      const [trialNumber, setTrialNumber] = useState(1);
      const [previousTrialVol, setPreviousTrialVol] = useState(null);

      const [flowState, setFlowState] = useState('stopped'); // 'stopped' | 'pour' | 'drop'
      const [plumeActive, setPlumeActive] = useState(false);
      const flowInterval = useRef(null);
      const dropTimeout = useRef(null);

      const [userCalculatedConc, setUserCalculatedConc] = useState('');
      const [feedback, setFeedback] = useState({ status: 'idle', message: '' });

      const clearAllTimers = useCallback(() => {
        if (flowInterval.current) {
          clearInterval(flowInterval.current);
          flowInterval.current = null;
        }
        if (dropTimeout.current) {
          clearTimeout(dropTimeout.current);
          dropTimeout.current = null;
        }
      }, []);

      const generateNewExperiment = useCallback(() => {
        clearAllTimers();
        const reaction = REACTIONS[activeReactionId];
        const conc = Math.round((Math.random() * (reaction.maxConc - reaction.minConc) + reaction.minConc) * 1000) / 1000;
        setActualAnalyteConc(conc);

        const requiredVol = Math.round(((conc * reaction.analyteVol * reaction.ratioTitrant) / (reaction.titrantConc * reaction.ratioAnalyte)) * 100) / 100;
        setTargetVolume(requiredVol);

        setAddedVol(0.00);
        setTrialNumber(1);
        setPreviousTrialVol(null);
        setFlowState('stopped');
        setPlumeActive(false);
        setUserCalculatedConc('');
        setFeedback({ status: 'idle', message: '' });
      }, [activeReactionId, clearAllTimers]);

      // Refill burette & reset flask WITHOUT changing the unknown concentration (supports Rough -> Precise trials)
      const resetSameSample = () => {
        clearAllTimers();
        if (addedVol > 0) {
          setPreviousTrialVol(addedVol);
          setTrialNumber(prev => prev + 1);
        }
        setAddedVol(0.00);
        setFlowState('stopped');
        setPlumeActive(false);
        setFeedback({ status: 'idle', message: '' });
      };

      useEffect(() => {
        generateNewExperiment();
      }, [generateNewExperiment]);

      // --- ROBUST TITRATION FLOW CONTROLS ---
      const stopPouring = useCallback(() => {
        if (flowInterval.current) {
          clearInterval(flowInterval.current);
          flowInterval.current = null;
        }
        setFlowState(prev => (prev === 'pour' ? 'stopped' : prev));
        setPlumeActive(false);
      }, []);

      const startPouring = (e) => {
        // Ignore right-clicks
        if (e && e.button !== undefined && e.button !== 0) return;
        if (addedVol >= 50) return;

        clearAllTimers();
        setFlowState('pour');
        setPlumeActive(true);

        // Immediate tick so short holds feel responsive
        setAddedVol(prev => Math.min(Math.round((prev + 0.10) * 100) / 100, 50));

        flowInterval.current = setInterval(() => {
          setAddedVol(prev => {
            if (prev >= 50) {
              clearInterval(flowInterval.current);
              flowInterval.current = null;
              setFlowState('stopped');
              setPlumeActive(false);
              return 50;
            }
            const next = Math.min(Math.round((prev + 0.10) * 100) / 100, 50);
            if (next >= 50) {
              clearInterval(flowInterval.current);
              flowInterval.current = null;
              setFlowState('stopped');
              setPlumeActive(false);
            }
            return next;
          });
        }, 55);
      };

      const addSingleDrop = () => {
        if (addedVol >= 50) return;
        clearAllTimers();
        setFlowState('drop');
        setPlumeActive(true);
        setAddedVol(prev => Math.min(Math.round((prev + 0.05) * 100) / 100, 50));

        dropTimeout.current = setTimeout(() => {
          setFlowState('stopped');
          setPlumeActive(false);
          dropTimeout.current = null;
        }, 360);
      };

      // Global safety listener so releasing pointer outside button or iframe stops pouring cleanly
      useEffect(() => {
        const handleGlobalUp = () => {
          if (flowInterval.current) {
            stopPouring();
          }
        };
        window.addEventListener('pointerup', handleGlobalUp);
        window.addEventListener('blur', handleGlobalUp);
        return () => {
          window.removeEventListener('pointerup', handleGlobalUp);
          window.removeEventListener('blur', handleGlobalUp);
          clearAllTimers();
        };
      }, [stopPouring, clearAllTimers]);

      // --- TWO-TIER EVALUATION LOGIC ---
      const checkAnswer = () => {
        const parsedConc = parseFloat(userCalculatedConc);
        if (isNaN(parsedConc) || parsedConc <= 0) {
          setFeedback({ status: 'error', message: 'Please enter a valid positive molarity value (e.g. 0.085).' });
          return;
        }

        const errorMargin = 0.002;
        const diffTrue = Math.abs(parsedConc - actualAnalyteConc);
        const mathBasedOnBurette = (addedVol * activeReaction.titrantConc * activeReaction.ratioAnalyte) / (activeReaction.analyteVol * activeReaction.ratioTitrant);
        const diffMath = Math.abs(parsedConc - mathBasedOnBurette);

        if (diffTrue <= errorMargin) {
          setFeedback({
            status: 'success',
            message: `Excellent! The true concentration is ${actualAnalyteConc.toFixed(3)} M (exact equivalence at ${targetVolume.toFixed(2)} cm³). Both your titration technique and stoichiometry are spot on.`
          });
        } else if (diffMath <= errorMargin) {
          const direction = addedVol > targetVolume ? 'overshot' : 'stopped before';
          setFeedback({
            status: 'warning',
            message: `Your stoichiometry math is correct for ${addedVol.toFixed(2)} cm³, bit you ${direction} the endpoint! Click "Refill Burette (Same Sample)" to run a precise trial using ${addedVol.toFixed(2)} cm³ as your rough guide.`
          });
        } else {
          setFeedback({
            status: 'error',
            message: `Incorrect calculation (${parsedConc.toFixed(3)} M). Check your burette reading (${addedVol.toFixed(2)} cm³) and make sure you apply the ${activeReaction.ratioTitrant}:${activeReaction.ratioAnalyte} mole ratio between ${activeReaction.titrantText} and ${activeReaction.analyteText}.`
          });
        }
      };

      const currentRatio = targetVolume === 0 ? 0 : Number((addedVol / targetVolume).toFixed(4));
      const currentColor = activeReaction.getFlaskColor(addedVol, targetVolume);
      const isBuretteEmpty = addedVol >= 50;
      const isStarchActive = activeReactionId === 'iodine' && currentRatio >= 0.90 && currentRatio < 1.00;
      const isAtEndpoint = currentRatio >= 1.00 && currentRatio <= 1.02;

      return (
        <div className="min-h-screen lg:h-screen bg-slate-900 flex flex-col font-sans lg:overflow-hidden">
          
          {/* COMPACT HEADER */}
          <header className="flex flex-wrap justify-between items-center gap-3 px-4 sm:px-6 py-3 bg-slate-800/90 border-b border-slate-700 shadow-md shrink-0">
            <div className="flex items-center gap-3">
              <Activity className={activeReactionId === 'kmno4' ? 'text-purple-400' : 'text-amber-400'} size={24} />
              <div>
                <h1
                  className="text-lg sm:text-xl font-bold bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent leading-tight"
                  style={activeReactionId === 'iodine' ? { backgroundImage: 'linear-gradient(to right, #fbbf24, #f59e0b)' } : {}}
                >
                  Redox Titration Simulator Online
                </h1>
                <p className="text-[11px] text-slate-400 font-medium">Quantitative Analysis &amp; Equivalence Engine</p>
              </div>
            </div>

            <div className="flex items-center gap-2">
              <button
                onClick={resetSameSample}
                title="Refill burette to 0.00 cm³ and retry the exact same unknown concentration"
                className="flex items-center gap-1.5 px-3 py-1.5 bg-slate-700/80 hover:bg-slate-600 border border-slate-600 rounded-lg text-xs font-semibold text-slate-200 transition-colors"
              >
                <RefreshCw size={14} /> Refill Burette (Same Sample)
              </button>
              <button
                onClick={generateNewExperiment}
                className="flex items-center gap-1.5 px-3.5 py-1.5 bg-indigo-600/90 hover:bg-indigo-500 rounded-lg text-xs font-bold text-white shadow transition-colors"
              >
                <RotateCcw size={14} /> New Unknown Sample
              </button>
            </div>
          </header>

          {/* MAIN RESPONSIVE 3-COLUMN WORKSPACE */}
          <main className="flex-1 min-h-0 grid grid-cols-1 lg:grid-cols-12 gap-3 sm:gap-4 p-3 sm:p-4 lg:overflow-hidden">
            
            {/* LEFT PANEL: Theory & Setup */}
            <section className="lg:col-span-3 bg-slate-800/50 border border-slate-700 rounded-2xl p-4 flex flex-col lg:min-h-0 lg:overflow-y-auto custom-scrollbar shadow-inner">
              
              {/* Reaction Selector */}
              <div className="flex bg-slate-900 p-1 rounded-lg border border-slate-700 mb-4 shrink-0 shadow-inner">
                <button
                  onClick={() => setActiveReactionId('kmno4')}
                  className={`flex-1 py-2 text-xs font-bold rounded-md transition-all ${activeReactionId === 'kmno4' ? 'bg-slate-700 text-purple-300 shadow' : 'text-slate-400 hover:text-slate-200'}`}
                >
                  {REACTIONS.kmno4.tabLabel}
                </button>
                <button
                  onClick={() => setActiveReactionId('iodine')}
                  className={`flex-1 py-2 text-xs font-bold rounded-md transition-all ${activeReactionId === 'iodine' ? 'bg-slate-700 text-amber-300 shadow' : 'text-slate-400 hover:text-slate-200'}`}
                >
                  {REACTIONS.iodine.tabLabel}
                </button>
              </div>

              <h2 className="text-xs uppercase tracking-widest text-slate-300 font-bold mb-2.5 flex items-center gap-2">
                <Info size={15} /> Stoichiometry
              </h2>
              
              <div className="bg-slate-900/60 rounded-xl p-3.5 border border-slate-700 mb-4">
                <p className="text-[11px] text-slate-400 uppercase font-bold tracking-wider mb-1.5">Balanced Redox Equation</p>
                <div className="font-mono text-xs text-slate-200 leading-relaxed overflow-x-auto pb-1 custom-scrollbar">
                  <span className={`font-bold ${activeReaction.eqColors[0]}`}>{activeReaction.eqReactant1}</span>
                  {' + '}
                  <span className={`font-bold ${activeReaction.eqColors[1]}`}>{activeReaction.eqReactant2}</span>
                  <br />
                  <span className="text-slate-500">→ </span>
                  {activeReaction.eqProducts}
                </div>
                <div className={`mt-2.5 p-2.5 border rounded-lg text-xs ${activeReaction.insightBg} ${activeReaction.insightColor} leading-relaxed`}>
                  <span className="font-bold">Lab Note: </span>{activeReaction.insight}
                </div>
              </div>

              <div className="flex-1 flex flex-col gap-2.5">
                <h2 className="text-xs uppercase tracking-widest text-slate-400 font-bold flex items-center gap-2 border-b border-slate-700 pb-1.5">
                  <FlaskConical size={15} /> Known Variables
                </h2>
                
                <div className="flex justify-between items-center p-2.5 bg-slate-800 rounded-lg border border-slate-600/80">
                  <span className="text-xs text-slate-300">Titrant [{activeReaction.titrantNode}]</span>
                  <span className={`font-mono text-sm font-bold ${activeReaction.eqColors[0]}`}>{activeReaction.titrantConc.toFixed(3)} M</span>
                </div>
                
                <div className="flex justify-between items-center p-2.5 bg-slate-800 rounded-lg border border-slate-600/80">
                  <span className="text-xs text-slate-300">Analyte Vol ({activeReaction.analyteNode})</span>
                  <span className={`font-mono text-sm font-bold ${activeReaction.eqColors[1]}`}>{activeReaction.analyteVol.toFixed(1)} cm³</span>
                </div>

                <div className="flex justify-between items-center p-2.5 bg-slate-900 rounded-lg border-2 border-dashed border-slate-600 mt-1">
                  <span className="text-xs text-slate-400">Unknown [{activeReaction.analyteNode}]</span>
                  <span className="font-mono text-sm font-bold text-cyan-400">? M</span>
                </div>
                <p className="text-[11px] text-slate-400 italic px-1 mt-1 leading-snug">
                  Tip: Run a fast rough trial first, then click <span className="text-slate-300 font-semibold">Refill Burette</span> to approach the endpoint drop-by-drop.
                </p>
              </div>
            </section>

            {/* CENTER PANEL: Laboratory Apparatus & Guaranteed-Visible Controls */}
            <section className="lg:col-span-6 bg-slate-800/80 border border-slate-700 rounded-2xl p-4 sm:p-5 shadow-xl flex flex-col justify-between min-h-[520px] lg:min-h-0 relative">
              
              {/* Top Bench Status & Digital Burette HUD (shrink-0 prevents overlap) */}
              <div className="flex justify-between items-start gap-2 shrink-0 z-20">
                <div>
                  <div className="text-slate-400 text-xs uppercase font-bold tracking-widest">Laboratory Bench</div>
                  <div className="flex items-center gap-2 mt-1">
                    <span className="px-2 py-0.5 text-[11px] font-semibold rounded bg-slate-900 text-slate-300 border border-slate-700">
                      Trial #{trialNumber}
                    </span>
                    {previousTrialVol !== null && (
                      <span className="px-2 py-0.5 text-[11px] font-mono rounded bg-slate-900/80 text-slate-400 border border-slate-700/80">
                        Prev: {previousTrialVol.toFixed(2)} cm³
                      </span>
                    )}
                  </div>
                </div>

                {/* Burette Reading HUD */}
                <div className="bg-slate-900 px-3.5 py-2 rounded-xl border border-slate-600 shadow-lg text-right min-w-[130px]">
                  <div className="text-[10px] text-slate-400 uppercase tracking-widest font-bold">Burette Reading</div>
                  <div className={`text-2xl sm:text-3xl font-mono font-black leading-tight ${activeReaction.eqColors[0]}`}>
                    {addedVol.toFixed(2)}<span className="text-xs ml-1 opacity-75">cm³</span>
                  </div>
                </div>
              </div>

              {/* Dynamic Scalable Apparatus (Flexes smoothly between 600px and 1080p+ screens) */}
              <div className="flex-1 min-h-0 flex flex-col items-center justify-center py-2 relative select-none">
                
                {/* Indicator / Endpoint Floating Pill */}
                {(isStarchActive || isAtEndpoint) && (
                  <div className={`mb-1 px-3 py-0.5 rounded-full text-[11px] font-bold border shadow-sm z-20 transition-all ${
                    isAtEndpoint
                      ? 'bg-emerald-950/90 border-emerald-500/60 text-emerald-300'
                      : 'bg-blue-950/90 border-blue-400/50 text-blue-200'
                  }`}>
                    {isAtEndpoint ? '✓ Equivalence Endpoint Reached' : 'Starch Indicator Active (Blue-Black)'}
                  </div>
                )}

                {/* BURETTE ASSEMBLY (Flexible height so controls below are NEVER pushed off-screen) */}
                <div className="flex-1 w-24 min-h-[120px] max-h-[250px] flex flex-col items-center relative z-10">
                  {/* Glass Graduated Tube */}
                  <div className="relative flex-1 w-8 border-x-2 border-b-2 border-slate-300/40 rounded-b-sm bg-slate-100/5 overflow-hidden shadow-inner">
                    {/* Scale Markings (0 to 50 cm³) */}
                    <div className="absolute inset-0 flex flex-col justify-between py-1.5 z-20 pointer-events-none">
                      {[0, 10, 20, 30, 40, 50].map((mark) => (
                        <div key={mark} className="flex items-center w-full">
                          <div className="w-2.5 h-px bg-slate-300/70"></div>
                          <span className="text-[8px] font-mono text-slate-300/80 ml-0.5 leading-none">{mark}</span>
                        </div>
                      ))}
                    </div>

                    {/* Liquid Column inside Burette */}
                    <div
                      className={`absolute bottom-0 w-full transition-all duration-75 z-10 ${activeReaction.titrantColor}`}
                      style={{ height: `${((50 - addedVol) / 50) * 100}%` }}
                    >
                      {!isBuretteEmpty && (
                        <div className={`w-full h-1 absolute top-0 ${activeReaction.titrantMeniscus}`}></div>
                      )}
                    </div>
                  </div>

                  {/* Interactive Stopcock Valve */}
                  <div className="w-11 h-4 bg-slate-700 rounded flex items-center justify-center border border-slate-500 shrink-0 shadow">
                    <div
                      className={`w-14 h-1.5 rounded-full transition-transform duration-150 ${
                        flowState === 'pour'
                          ? 'bg-indigo-400 rotate-90'
                          : flowState === 'drop'
                          ? 'bg-cyan-300 rotate-45'
                          : 'bg-slate-400 rotate-0'
                      }`}
                    ></div>
                  </div>

                  {/* Burette Delivery Tip */}
                  <div className="w-2 h-2.5 border-x border-b border-slate-300/40 rounded-b-sm bg-slate-100/10 shrink-0"></div>
                </div>

                {/* CALIBRATED DRIP ZONE (Directly bridges nozzle tip and flask neck) */}
                <div className="h-7 w-6 shrink-0 relative flex justify-center overflow-visible z-0">
                  {flowState === 'pour' && (
                    <div className={`w-1.5 rounded-full absolute ${activeReaction.titrantDrop} animate-drip-stream`}></div>
                  )}
                  {flowState === 'drop' && (
                    <div className={`w-1.5 rounded-full absolute ${activeReaction.titrantDrop} animate-drip-single`}></div>
                  )}
                </div>

                {/* CONICAL FLASK & MAGNETIC STIRRER */}
                <div className="shrink-0 flex flex-col items-center -mt-1 z-10">
                  <div className="relative w-28 h-28 sm:w-32 sm:h-32 flex justify-center">
                    <svg viewBox="0 0 100 100" className="w-full h-full drop-shadow-2xl relative z-10">
                      {/* Flask Solution Fill */}
                      <path
                        d="M 35,42 L 20,85 Q 15,95 50,95 Q 85,95 80,85 L 65,42 Z"
                        fill={currentColor}
                        className="transition-colors duration-300"
                      />

                      {/* Transient Local Mixing Plume as Titrant Enters */}
                      {plumeActive && currentRatio < 1.00 && (
                        <ellipse
                          cx="50"
                          cy="58"
                          rx="11"
                          ry="7"
                          fill={activeReaction.plumeFill}
                          className="animate-pulse"
                        />
                      )}

                      {/* Glassware Outline */}
                      <path
                        d="M 40,5 L 40,35 L 20,85 Q 15,95 50,95 Q 85,95 80,85 L 60,35 L 60,5"
                        fill="none"
                        stroke="rgba(203, 213, 225, 0.45)"
                        strokeWidth="3"
                        strokeLinejoin="round"
                      />
                      <line x1="35" y1="5" x2="65" y2="5" stroke="rgba(203, 213, 225, 0.45)" strokeWidth="3.5" strokeLinecap="round" />

                      {/* Glass Specular Highlight */}
                      <path d="M 37,46 L 25,80 Q 22,88 50,88 Q 78,88 75,80 L 63,46 Z" fill="rgba(255,255,255,0.08)" />
                    </svg>

                    {/* Spinning Magnetic Stir Bar */}
                    <div className="absolute bottom-4 left-1/2 w-7 h-1.5 bg-white/90 rounded-full animate-spin-slow shadow z-20 pointer-events-none"></div>
                  </div>

                  {/* Stirrer Hotplate Base */}
                  <div className="w-36 sm:w-44 h-4 bg-slate-700 border-t-2 border-slate-500 rounded-t-md rounded-b shadow-xl relative">
                    <div className="absolute top-1 left-1/2 -translate-x-1/2 w-12 h-1 bg-emerald-400/60 rounded-full"></div>
                  </div>
                </div>
              </div>

              {/* TITRATION CONTROLS BAR (shrink-0 guarantees permanent visibility on all screens) */}
              <div className="shrink-0 pt-3 border-t border-slate-700/70 z-20">
                <div className="grid grid-cols-2 gap-3">
                  <button
                    type="button"
                    disabled={isBuretteEmpty}
                    onPointerDown={startPouring}
                    onPointerUp={stopPouring}
                    onPointerLeave={stopPouring}
                    onPointerCancel={stopPouring}
                    onContextMenu={(e) => e.preventDefault()}
                    onKeyDown={(e) => {
                      if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) {
                        e.preventDefault();
                        startPouring();
                      }
                    }}
                    onKeyUp={(e) => {
                      if (e.key === ' ' || e.key === 'Enter') {
                        e.preventDefault();
                        stopPouring();
                      }
                    }}
                    className={`no-touch-callout py-3 px-4 rounded-xl font-bold text-sm sm:text-base flex items-center justify-center gap-2 shadow-lg transition-all ${
                      isBuretteEmpty
                        ? 'bg-slate-700/50 text-slate-500 cursor-not-allowed'
                        : flowState === 'pour'
                        ? 'bg-indigo-500 text-white ring-2 ring-indigo-300 scale-[0.99]'
                        : 'bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white shadow-indigo-950/60'
                    }`}
                  >
                    <Droplet size={18} className="fill-current shrink-0" />
                    <span>{flowState === 'pour' ? 'Pouring...' : 'Hold to Pour'}</span>
                  </button>

                  <button
                    type="button"
                    disabled={isBuretteEmpty}
                    onClick={addSingleDrop}
                    className={`no-touch-callout py-3 px-4 rounded-xl font-bold text-sm sm:text-base border flex items-center justify-center gap-2 transition-all ${
                      isBuretteEmpty
                        ? 'bg-slate-800/50 border-slate-700 text-slate-500 cursor-not-allowed'
                        : 'bg-slate-700 hover:bg-slate-600 active:bg-slate-500 text-slate-100 border-slate-500/80 shadow'
                    }`}
                  >
                    <Droplet size={18} className="shrink-0" />
                    <span>Add 1 Drop <span className="text-xs font-normal opacity-75">(+0.05 cm³)</span></span>
                  </button>
                </div>
                {isBuretteEmpty && (
                  <p className="text-center text-xs text-amber-400 mt-2 font-medium">
                    Burette limit (50.00 cm³) reached. Click "Refill Burette (Same Sample)" above to retry.
                  </p>
                )}
              </div>

            </section>

            {/* RIGHT PANEL: Data & Calculation */}
            <section className="lg:col-span-3 bg-slate-800 rounded-2xl border border-slate-700 flex flex-col lg:min-h-0 overflow-hidden shadow-xl">
              <div className="p-3.5 bg-slate-700/50 border-b border-slate-600 flex items-center gap-2 shrink-0">
                <Calculator size={17} className="text-cyan-400" />
                <h2 className="text-xs uppercase tracking-widest text-slate-200 font-bold">Analysis &amp; Results</h2>
              </div>
              
              <div className="p-4 flex flex-col flex-1 lg:overflow-y-auto custom-scrollbar">
                
                <div className="mb-5">
                  <p className="text-[11px] text-slate-400 uppercase tracking-widest font-bold mb-2">Visual Observations</p>
                  <div className="flex items-center gap-3 p-3 bg-slate-900 rounded-lg border border-slate-700">
                    <div
                      className="w-6 h-6 rounded-full border border-slate-500 shadow-inner shrink-0 transition-colors duration-300"
                      style={{ backgroundColor: currentColor }}
                    ></div>
                    <span className="text-xs font-medium text-slate-200 leading-snug">
                      {activeReaction.getVisualStatus(currentRatio)}
                    </span>
                  </div>
                </div>

                <div className="mb-4">
                  <p className="text-[11px] text-slate-400 uppercase tracking-widest font-bold mb-1.5">Calculate Unknown</p>
                  <p className="text-xs text-slate-400 mb-3 leading-relaxed">
                    Record the burette volume at the endpoint and apply the{' '}
                    <span className="text-slate-200 font-semibold">{activeReaction.ratioTitrant}:{activeReaction.ratioAnalyte}</span>{' '}
                    stoichiometric ratio to find [{activeReaction.analyteNode}].
                  </p>
                  
                  <div className="flex flex-col gap-2.5">
                    <label className="text-xs font-bold text-slate-300">
                      Calculated [{activeReaction.analyteNode}] (mol/L):
                    </label>
                    <input
                      type="number"
                      step="0.001"
                      value={userCalculatedConc}
                      onChange={(e) => setUserCalculatedConc(e.target.value)}
                      onKeyDown={(e) => { if (e.key === 'Enter') checkAnswer(); }}
                      placeholder="e.g. 0.085"
                      className="bg-slate-900 border border-slate-600 rounded-lg p-2.5 text-white font-mono text-sm focus:outline-none focus:border-cyan-400 transition-colors"
                    />
                    <button
                      type="button"
                      onClick={checkAnswer}
                      className="bg-cyan-600 hover:bg-cyan-500 active:bg-cyan-700 text-white font-bold py-2.5 rounded-lg text-sm shadow transition-colors"
                    >
                      Check Answer
                    </button>
                  </div>
                </div>

                {/* Feedback Display */}
                {feedback.status !== 'idle' && (
                  <div className={`mt-auto p-3.5 rounded-xl border text-xs ${
                    feedback.status === 'success'
                      ? 'bg-emerald-900/30 border-emerald-500/70 text-emerald-200'
                      : feedback.status === 'warning'
                      ? 'bg-amber-900/30 border-amber-500/70 text-amber-200'
                      : 'bg-rose-900/30 border-rose-500/70 text-rose-200'
                  }`}>
                    <p className="font-bold mb-1 text-sm">
                      {feedback.status === 'success'
                        ? '✓ Correct!'
                        : feedback.status === 'warning'
                        ? '⚠ Almost There (Endpoint Missed)'
                        : '✕ Check Your Calculation'}
                    </p>
                    <p className="leading-relaxed opacity-95">{feedback.message}</p>
                  </div>
                )}
                
              </div>
            </section>

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
