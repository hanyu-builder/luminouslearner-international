<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redox Titration Simulator Online</title>
  <meta name="description" content="Interactive redox titration simulator online. Learn quantitative analysis and electron transfer equivalence using KMnO4 and Fe2+, or Iodine and Thiosulfate.">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for in-browser JSX transpilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { background-color: #0F172A; margin: 0; overflow: hidden; }
    
    /* Custom Scrollbar */
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(30, 41, 59, 0.5); }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(71, 85, 105, 0.8); border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 1); }

    /* Dripping Animation */
    @keyframes drip {
      0% { top: 0px; opacity: 1; height: 5px; }
      80% { opacity: 1; height: 15px; }
      100% { top: 180px; opacity: 0; height: 5px; }
    }
    .animate-drip {
      animation: drip 0.4s linear infinite;
    }
    .animate-drip-slow {
      animation: drip 1.5s linear infinite;
    }

    /* Magnetic Mix Animation Fix */
    @keyframes spin-magnetic { 
        0% { transform: translateX(-50%) rotate(0deg); }
        100% { transform: translateX(-50%) rotate(360deg); } 
    }
    .animate-spin-slow { 
        animation: spin-magnetic 1s linear infinite; 
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // --- ICON COMPONENTS ---
    const SvgIcon = ({ children, size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
    );
    const Activity = (p) => <SvgIcon {...p}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12" /></SvgIcon>;
    const Droplet = (p) => <SvgIcon {...p}><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></SvgIcon>;
    const FlaskConical = (p) => <SvgIcon {...p}><path d="M10 2v7.31L2 20.24a2 2 0 0 0 1.76 2.76h16.48a2 2 0 0 0 1.76-2.76L14 9.31V2"/><path d="M8.5 2h7"/><path d="M10 10l5.5-5.5"/></SvgIcon>;
    const RotateCcw = (p) => <SvgIcon {...p}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></SvgIcon>;
    const Calculator = (p) => <SvgIcon {...p}><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></SvgIcon>;
    const Info = (p) => <SvgIcon {...p}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></SvgIcon>;

    // --- REACTION DEFINITIONS ---
    const REACTIONS = {
      kmno4: {
        id: 'kmno4',
        titrant: 'KMnO₄',
        analyte: 'Fe²⁺',
        titrantConc: 0.020,
        analyteVol: 25.0,
        ratioTitrant: 1,
        ratioAnalyte: 5,
        minConc: 0.050,
        maxConc: 0.150,
        titrantColor: 'bg-purple-700/80',
        titrantDrop: 'bg-purple-500',
        titrantMeniscus: 'bg-purple-400/50',
        eqReactants: ['MnO₄⁻(aq)', '5Fe²⁺(aq) + 8H⁺(aq)'],
        eqProducts: 'Mn²⁺(aq) + 5Fe³⁺(aq) + 4H₂O(l)',
        eqColors: ['text-purple-400', 'text-green-400'],
        insight: '1 mole of KMnO₄ reacts with exactly 5 moles of Fe²⁺. KMnO₄ acts as its own indicator.',
        insightColor: 'text-purple-200',
        insightBg: 'bg-purple-900/20 border-purple-500/30',
        getFlaskColor: (addedVol, targetVol) => {
          // Prevent epsilon errors at boundary
          const ratio = targetVol === 0 ? 0 : Number((addedVol / targetVol).toFixed(4));
          
          if (ratio === 0) return 'rgba(167, 243, 208, 0.4)'; // Pale Green
          
          if (ratio < 1.00) {
            // Pale green to faint yellow/orange (Fe3+ formation)
            const r = Math.floor(167 + (250 - 167) * ratio);
            const g = Math.floor(243 + (240 - 243) * ratio);
            const b = Math.floor(208 + (200 - 208) * ratio);
            return `rgba(${r}, ${g}, ${b}, 0.4)`;
          }
          
          if (ratio >= 1.00 && ratio <= 1.02) return 'rgba(244, 114, 182, 0.5)'; // Pale Pink Endpoint
          
          // Overtitrated: Deepens to dark purple rapidly
          const overshotRatio = Math.min((ratio - 1.02) * 20, 1);
          const r = Math.floor(244 - (244 - 128) * overshotRatio);
          const g = Math.floor(114 - (114 - 0) * overshotRatio);
          const b = Math.floor(182 - (182 - 128) * overshotRatio);
          const a = 0.5 + (0.4 * overshotRatio);
          return `rgba(${r}, ${g}, ${b}, ${a})`;
        },
        getVisualStatus: (ratio) => {
          if (ratio === 0) return "Initial (Fe²⁺ only)";
          if (ratio < 1.00) return "Titrating (Fe³⁺ forming, MnO₄⁻ decolorized)";
          if (ratio <= 1.02) return "End Point Reached! (Pale Pink)";
          return "Over-titrated (Excess MnO₄⁻)";
        }
      },
      iodine: {
        id: 'iodine',
        titrant: 'Na₂S₂O₃',
        analyte: 'I₂',
        titrantConc: 0.100,
        analyteVol: 25.0,
        ratioTitrant: 2,
        ratioAnalyte: 1,
        minConc: 0.040,
        maxConc: 0.090, 
        titrantColor: 'bg-sky-100/30',
        titrantDrop: 'bg-slate-300',
        titrantMeniscus: 'bg-slate-400/30',
        eqReactants: ['2S₂O₃²⁻(aq)', 'I₂(aq)'],
        eqProducts: 'S₄O₆²⁻(aq) + 2I⁻(aq)',
        eqColors: ['text-slate-300', 'text-amber-500'],
        insight: 'Starch indicator is added ONLY when the solution turns pale yellow. If added too early, iodine binds irreversibly.',
        insightColor: 'text-amber-200',
        insightBg: 'bg-amber-900/20 border-amber-500/30',
        getFlaskColor: (addedVol, targetVol) => {
          const ratio = targetVol === 0 ? 0 : Number((addedVol / targetVol).toFixed(4));
          
          if (ratio === 0) return 'rgba(180, 83, 9, 0.8)'; // Dark Brown (I2)
          if (ratio < 0.90) {
            const p = ratio / 0.90;
            // Fades from Brown to Pale Yellow
            const r = Math.floor(180 + (253 - 180) * p);
            const g = Math.floor(83 + (230 - 83) * p);
            const b = Math.floor(9 + (138 - 9) * p);
            return `rgba(${r}, ${g}, ${b}, 0.6)`;
          }
          if (ratio < 1.00) return 'rgba(15, 23, 42, 0.9)'; // Dark Blue/Black (Starch Indicator Added)
          return 'rgba(240, 248, 255, 0.15)'; // Colorless End Point and beyond
        },
        getVisualStatus: (ratio) => {
          if (ratio === 0) return "Initial (I₂ - Brown)";
          if (ratio < 0.90) return "Titrating (I₂ fades to yellow)";
          if (ratio < 1.00) return "Starch Added (Blue-Black complex)";
          if (ratio <= 1.02) return "End Point Reached! (Colorless)";
          return "Over-titrated (Excess S₂O₃²⁻)";
        }
      }
    };

    function App() {
      const [activeReactionId, setActiveReactionId] = useState('kmno4');
      const activeReaction = REACTIONS[activeReactionId];

      const [actualAnalyteConc, setActualAnalyteConc] = useState(0); 
      const [targetVolume, setTargetVolume] = useState(0);
      const [addedVol, setAddedVol] = useState(0.00);
      
      const [flowState, setFlowState] = useState('stopped');
      const flowInterval = useRef(null);

      const [userCalculatedConc, setUserCalculatedConc] = useState('');
      const [feedback, setFeedback] = useState({ status: 'idle', message: '' });

      const generateNewExperiment = useCallback(() => {
        const reaction = REACTIONS[activeReactionId];
        // Generate random concentration within specified bounds
        const conc = Math.round((Math.random() * (reaction.maxConc - reaction.minConc) + reaction.minConc) * 1000) / 1000;
        setActualAnalyteConc(conc);
        
        // Stoichiometry Formula: V_titrant = (M_analyte * V_analyte * ratio_titrant) / (M_titrant * ratio_analyte)
        const requiredVol = (conc * reaction.analyteVol * reaction.ratioTitrant) / (reaction.titrantConc * reaction.ratioAnalyte);
        setTargetVolume(requiredVol);
        
        setAddedVol(0.00);
        setFlowState('stopped');
        setUserCalculatedConc('');
        setFeedback({ status: 'idle', message: '' });
      }, [activeReactionId]);

      useEffect(() => {
        generateNewExperiment();
      }, [generateNewExperiment]);

      // --- TITRATION CONTROLS ---
      const handleFlow = (action) => {
        if (addedVol >= 50) return;

        if (action === 'pour') {
          setFlowState('pour');
          flowInterval.current = setInterval(() => {
            setAddedVol(prev => Math.min(Math.round((prev + 0.1) * 100) / 100, 50));
          }, 50); // Fast flow
        } else if (action === 'drop') {
          setFlowState('drop');
          setAddedVol(prev => Math.min(Math.round((prev + 0.05) * 100) / 100, 50)); // Single drop
        } else {
          setFlowState('stopped');
          clearInterval(flowInterval.current);
        }
      };

      const stopFlow = () => {
        setFlowState('stopped');
        clearInterval(flowInterval.current);
      };

      useEffect(() => {
        return () => clearInterval(flowInterval.current);
      }, []);

      // --- TWO-TIER EVALUATION LOGIC ---
      const checkAnswer = () => {
        const parsedConc = parseFloat(userCalculatedConc);
        if (isNaN(parsedConc)) {
          setFeedback({ status: 'error', message: 'Please enter a valid number.' });
          return;
        }

        const errorMargin = 0.002;
        const diffTrue = Math.abs(parsedConc - actualAnalyteConc);
        
        // Calculate what the student's answer *should* be based on their current burette reading
        const mathBasedOnBurette = (addedVol * activeReaction.titrantConc * activeReaction.ratioAnalyte) / (activeReaction.analyteVol * activeReaction.ratioTitrant);
        const diffMath = Math.abs(parsedConc - mathBasedOnBurette);

        if (diffTrue <= errorMargin) {
          // Perfect scenario
          setFeedback({ status: 'success', message: `Excellent! The true concentration was ${actualAnalyteConc.toFixed(3)} M. Your calculation is accurate.` });
        } else if (diffMath <= errorMargin) {
          // Good math, bad titration technique
          setFeedback({ status: 'error', message: `Your math is correct for the volume you recorded (${addedVol.toFixed(2)} cm³), but you overshot/undershot the endpoint! The true endpoint was at ${targetVolume.toFixed(2)} cm³. Reset and try again carefully.` });
        } else {
          // Bad math
          setFeedback({ status: 'error', message: `Incorrect calculation. You entered ${parsedConc.toFixed(3)} M. Ensure you are using the correct ${activeReaction.ratioTitrant}:${activeReaction.ratioAnalyte} molar ratio and reading your burette correctly.` });
        }
      };

      const currentRatio = targetVolume === 0 ? 0 : Number((addedVol / targetVolume).toFixed(4));
      const currentColor = activeReaction.getFlaskColor(addedVol, targetVolume);

      return (
        <div className="min-h-screen bg-slate-900 flex flex-col font-sans overflow-hidden">
          
          {/* HEADER */}
          <header className="flex justify-between items-center px-6 py-4 bg-slate-800/80 border-b border-slate-700 shadow-lg shrink-0">
            <div className="flex items-center gap-3">
              <Activity className={activeReactionId === 'kmno4' ? 'text-purple-400' : 'text-amber-400'} size={28} />
              <div>
                <h1 className="text-2xl font-bold bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent" style={activeReactionId === 'iodine' ? { backgroundImage: 'linear-gradient(to right, #fbbf24, #f59e0b)' } : {}}>
                  Redox Titration Simulator Online
                </h1>
                <p className="text-xs text-slate-400 font-medium">Quantitative Analysis Engine</p>
              </div>
            </div>
            <button 
              onClick={generateNewExperiment}
              className="flex items-center gap-2 px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-bold text-slate-200 transition-colors"
            >
              <RotateCcw size={16} /> New Unknown Sample
            </button>
          </header>

          <main className="flex-1 flex gap-4 p-4 overflow-hidden max-h-[calc(100vh-80px)]">
            
            {/* LEFT PANEL: Theory & Setup */}
            <div className="w-1/4 bg-slate-800/50 border border-slate-700 rounded-2xl p-5 flex flex-col overflow-y-auto custom-scrollbar shadow-inner">
              
              {/* Reaction Selector */}
              <div className="flex bg-slate-900 p-1 rounded-lg border border-slate-700 mb-6 shrink-0 shadow-inner">
                <button 
                  onClick={() => setActiveReactionId('kmno4')}
                  className={`flex-1 py-2 text-xs font-bold rounded-md transition-all ${activeReactionId === 'kmno4' ? 'bg-slate-700 text-purple-400 shadow' : 'text-slate-500 hover:text-slate-300'}`}
                >
                  KMnO₄ / Fe²⁺
                </button>
                <button 
                  onClick={() => setActiveReactionId('iodine')}
                  className={`flex-1 py-2 text-xs font-bold rounded-md transition-all ${activeReactionId === 'iodine' ? 'bg-slate-700 text-amber-400 shadow' : 'text-slate-500 hover:text-slate-300'}`}
                >
                  S₂O₃²⁻ / I₂
                </button>
              </div>

              <h2 className="text-sm uppercase tracking-widest text-slate-200 font-bold mb-4 flex items-center gap-2">
                <Info size={16} /> Stoichiometry
              </h2>
              
              <div className="bg-slate-900/50 rounded-xl p-4 border border-slate-700 mb-6">
                <p className="text-xs text-slate-400 uppercase font-bold tracking-wider mb-2">Target Reaction</p>
                <div className="font-mono text-[13px] text-slate-200 leading-relaxed overflow-x-auto whitespace-nowrap pb-2 custom-scrollbar">
                  <span className={`font-bold ${activeReaction.eqColors[0]}`}>{activeReaction.eqReactants[0]}</span> + <span className={`font-bold ${activeReaction.eqColors[1]}`}>{activeReaction.eqReactants[1]}</span><br/>
                  <span className="text-slate-500">→</span> {activeReaction.eqProducts}
                </div>
                <div className={`mt-3 p-2 border rounded text-xs ${activeReaction.insightBg} ${activeReaction.insightColor} leading-relaxed`}>
                  <span className="font-bold">Pedagogical Note:</span> {activeReaction.insight}
                </div>
              </div>

              <div className="flex-1 flex flex-col gap-3">
                <h2 className="text-sm uppercase tracking-widest text-slate-400 font-bold flex items-center gap-2 border-b border-slate-700 pb-2">
                  <FlaskConical size={16} /> Known Variables
                </h2>
                
                <div className="flex justify-between items-center p-3 bg-slate-800 rounded-lg border border-slate-600">
                  <span className="text-sm text-slate-300">Titrant [{activeReaction.titrant}]</span>
                  <span className={`font-mono font-bold ${activeReaction.eqColors[0]}`}>{activeReaction.titrantConc.toFixed(3)} M</span>
                </div>
                
                <div className="flex justify-between items-center p-3 bg-slate-800 rounded-lg border border-slate-600">
                  <span className="text-sm text-slate-300">Analyte Vol ({activeReaction.analyte})</span>
                  <span className={`font-mono font-bold ${activeReaction.eqColors[1]}`}>{activeReaction.analyteVol.toFixed(1)} cm³</span>
                </div>

                <div className="flex justify-between items-center p-3 bg-slate-900 rounded-lg border-2 border-dashed border-slate-600 mt-2">
                  <span className="text-sm text-slate-400">Analyte [{activeReaction.analyte}]</span>
                  <span className="font-mono font-bold text-slate-500">? M</span>
                </div>
                <p className="text-[11px] text-slate-500 italic px-1 mt-2">Goal: Titrate to the exact endpoint to find the unknown concentration.</p>
              </div>
            </div>

            {/* CENTER PANEL: Apparatus (Burette + Flask) */}
            <div className="w-2/4 bg-slate-800/80 border border-slate-700 rounded-2xl p-6 shadow-xl flex flex-col relative overflow-hidden">
              <div className="absolute top-4 left-6 text-slate-500 text-xs uppercase font-bold tracking-widest">Laboratory Bench</div>
              
              {/* Burette Reading HUD */}
              <div className="absolute top-4 right-6 bg-slate-900 p-3 rounded-xl border border-slate-600 shadow-lg text-center min-w-[120px]">
                <div className="text-[10px] text-slate-400 uppercase tracking-widest font-bold mb-1">Burette Reading</div>
                <div className={`text-3xl font-mono font-black ${activeReaction.eqColors[0]}`}>
                  {addedVol.toFixed(2)}<span className="text-sm ml-1 opacity-70">cm³</span>
                </div>
              </div>

              {/* Visual Apparatus Setup */}
              <div className="flex-1 flex flex-col items-center justify-end pb-10 relative mt-16">
                
                {/* BURETTE */}
                <div className="relative w-16 h-[350px] flex justify-center z-10">
                  {/* Glass Tube */}
                  <div className="absolute top-0 w-8 h-full border-x-4 border-b-4 border-slate-300/30 rounded-b-md bg-slate-100/5 overflow-hidden">
                    {/* Measurement markings */}
                    <div className="absolute top-0 w-full h-full flex flex-col justify-between py-2 opacity-50 z-20 pointer-events-none">
                      {[...Array(11)].map((_, i) => (
                        <div key={i} className="w-3 h-px bg-slate-400 ml-0"></div>
                      ))}
                    </div>
                    
                    {/* Liquid inside Burette */}
                    <div 
                      className={`absolute bottom-0 w-full transition-all duration-75 z-10 ${activeReaction.titrantColor}`}
                      style={{ height: `${((50 - addedVol) / 50) * 100}%` }}
                    >
                      <div className={`w-full h-1 absolute top-0 ${activeReaction.titrantMeniscus}`}></div> {/* Meniscus */}
                    </div>
                  </div>
                  
                  {/* Tap/Stopcock */}
                  <div className="absolute -bottom-6 w-12 h-6 bg-slate-700 rounded flex items-center justify-center border-2 border-slate-600">
                    <div className="w-16 h-2 bg-slate-400 rounded-full"></div>
                  </div>
                  {/* Dripping tip */}
                  <div className="absolute -bottom-10 w-2 h-4 border-x-2 border-b-2 border-slate-300/30 rounded-b-sm bg-slate-100/5"></div>
                </div>

                {/* ANIMATED DRIP */}
                <div className="absolute h-48 w-1 flex justify-center z-0" style={{ bottom: '120px' }}>
                  {(flowState === 'pour' || flowState === 'drop') && (
                    <div className={`w-1 rounded-full absolute ${activeReaction.titrantDrop} ${flowState === 'pour' ? 'animate-drip' : 'animate-drip-slow'}`}></div>
                  )}
                </div>

                {/* FLASK */}
                <div className="relative w-40 h-40 mt-12 z-10 flex justify-center">
                  <svg viewBox="0 0 100 100" className="w-full h-full drop-shadow-2xl relative z-10">
                    {/* Flask Back Liquid Layer */}
                    <path d="M 35,40 L 20,85 Q 15,95 50,95 Q 85,95 80,85 L 65,40 Z" fill={currentColor} className="transition-colors duration-300" />
                    
                    {/* Flask Outline */}
                    <path d="M 40,5 L 40,35 L 20,85 Q 15,95 50,95 Q 85,95 80,85 L 60,35 L 60,5" fill="none" stroke="rgba(203, 213, 225, 0.4)" strokeWidth="3" strokeLinejoin="round" />
                    <line x1="35" y1="5" x2="65" y2="5" stroke="rgba(203, 213, 225, 0.4)" strokeWidth="4" strokeLinecap="round" />
                    
                    {/* Front Liquid Highlight */}
                    <path d="M 37,45 L 25,80 Q 22,88 50,88 Q 78,88 75,80 L 63,45 Z" fill="rgba(255,255,255,0.1)" />
                  </svg>

                  {/* Magnetic Stirrer Bar */}
                  <div className="absolute bottom-6 left-1/2 w-8 h-2 bg-slate-100 rounded-full animate-spin-slow drop-shadow z-20 pointer-events-none"></div>
                </div>
                
                {/* Magnetic Stirrer Plate */}
                <div className="w-48 h-6 bg-slate-700 border-t-2 border-slate-500 rounded-t-lg rounded-b shadow-2xl mt-1 z-0 relative">
                  <div className="absolute top-1 left-1/2 -translate-x-1/2 w-16 h-1 bg-slate-600 rounded-full"></div>
                </div>

              </div>

              {/* Titration Controls */}
              <div className="flex gap-4 mt-auto">
                <button 
                  onMouseDown={() => handleFlow('pour')}
                  onMouseUp={stopFlow}
                  onMouseLeave={stopFlow}
                  onTouchStart={() => handleFlow('pour')}
                  onTouchEnd={stopFlow}
                  className="flex-1 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-indigo-900/50 flex flex-col items-center gap-1 transition-colors select-none"
                >
                  <Droplet size={20} className="fill-current" /> Hold to Pour
                </button>
                <button 
                  onClick={() => handleFlow('drop')}
                  className="flex-1 bg-slate-700 hover:bg-slate-600 active:bg-slate-500 text-slate-200 font-bold py-4 rounded-xl border border-slate-600 flex flex-col items-center gap-1 transition-colors select-none"
                >
                  <Droplet size={20} /> Add 1 Drop
                </button>
              </div>

            </div>

            {/* RIGHT PANEL: Data & Calculation */}
            <div className="w-1/4 bg-slate-800 rounded-2xl border border-slate-700 flex flex-col overflow-hidden shadow-xl shrink-0">
              <div className="p-4 bg-slate-700/50 border-b border-slate-600 flex items-center gap-2">
                <Calculator size={18} className="text-cyan-400" />
                <h2 className="text-sm uppercase tracking-widest text-slate-200 font-bold">Analysis & Results</h2>
              </div>
              
              <div className="p-5 flex flex-col h-full overflow-y-auto custom-scrollbar">
                
                <div className="mb-6">
                  <p className="text-xs text-slate-400 uppercase tracking-widest font-bold mb-2">Visual Observations</p>
                  <div className="flex items-center gap-3 p-3 bg-slate-900 rounded border border-slate-700">
                    <div className="w-6 h-6 rounded-full border border-slate-600 shadow-inner transition-colors duration-300" style={{backgroundColor: currentColor}}></div>
                    <span className="text-[13px] font-medium text-slate-300 leading-tight">
                      {activeReaction.getVisualStatus(currentRatio)}
                    </span>
                  </div>
                </div>

                <div className="mb-6">
                  <p className="text-xs text-slate-400 uppercase tracking-widest font-bold mb-2">Calculate Unknown</p>
                  <p className="text-[11px] text-slate-500 mb-3 leading-relaxed">
                    Read the burette volume at the endpoint. Use the stoichiometric ratio to calculate the original concentration of {activeReaction.analyte}.
                  </p>
                  
                  <div className="flex flex-col gap-3">
                    <label className="text-xs font-bold text-slate-300">Calculated [{activeReaction.analyte}] (Molarity):</label>
                    <input 
                      type="number" 
                      step="0.001"
                      value={userCalculatedConc}
                      onChange={(e) => setUserCalculatedConc(e.target.value)}
                      placeholder="e.g. 0.125"
                      className="bg-slate-900 border border-slate-600 rounded p-3 text-white font-mono focus:outline-none focus:border-cyan-400 transition-colors"
                    />
                    <button 
                      onClick={checkAnswer}
                      className="bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-2 rounded transition-colors"
                    >
                      Check Answer
                    </button>
                  </div>
                </div>

                {/* Feedback Display */}
                {feedback.status !== 'idle' && (
                  <div className={`mt-auto p-4 rounded-lg border text-sm ${
                    feedback.status === 'success' ? 'bg-emerald-900/30 border-emerald-500 text-emerald-200' : 'bg-rose-900/30 border-rose-500 text-rose-200'
                  }`}>
                    <p className="font-bold mb-1">{feedback.status === 'success' ? 'Correct!' : 'Incorrect'}</p>
                    <p className="text-xs leading-relaxed opacity-90">{feedback.message}</p>
                  </div>
                )}
                
              </div>
            </div>

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
