<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salt Preparation Guide | Chemistry Interactive</title>
    <meta name="description" content="Salt preparation chemistry interactive. A decision-tree algorithm and virtual lab guiding students through the synthesis of soluble and insoluble salts.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { 
            margin: 0; 
            background-color: #0F172A; 
            color: #E2E8F0;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden; 
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }

        /* Animations for Lab Apparatus */
        @keyframes pour {
            0% { transform: scaleY(0); transform-origin: top; opacity: 0; }
            10% { transform: scaleY(1); opacity: 1; }
            90% { transform: scaleY(1); opacity: 1; }
            100% { transform: scaleY(0); transform-origin: bottom; opacity: 0; }
        }
        .animate-pour { animation: pour 2s infinite ease-in-out; }

        @keyframes drip {
            0% { transform: translateY(0) scale(0.8); opacity: 1; }
            50% { transform: translateY(30px) scale(1); opacity: 1; }
            100% { transform: translateY(40px) scale(0.5); opacity: 0; }
        }
        .animate-drip { animation: drip 1.5s infinite ease-in; }

        @keyframes flame {
            0%, 100% { transform: scaleY(1) scaleX(1); opacity: 0.9; }
            50% { transform: scaleY(1.1) scaleX(0.95); opacity: 1; }
        }
        .animate-flame { animation: flame 0.2s infinite alternate; transform-origin: bottom center; }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .animate-slide-in { animation: slideInRight 0.4s ease-out forwards; }
    </style>
</head>
<body>

    <div id="root" class="w-full h-screen max-h-[1000px] flex justify-center items-center p-4"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- DATABASE: SALT LOGIC & REACTANTS ---
        const SALT_DB = {
            cuso4: { 
                id: 'cuso4', name: "Copper(II) Sulfate", formula: "CuSO₄", 
                type: "soluble", isSPA: false, method: "Excess Solid", color: "#3B82F6", // Blue
                reqReagent1: "Sulfuric Acid (H₂SO₄)", reqReagent2: "Copper(II) Oxide (CuO)",
                steps: [
                    { title: "Add Excess Solid", desc: "Add insoluble CuO to warm H₂SO₄ until no more dissolves. This ensures all acid reacts.", type: "mix_solid" },
                    { title: "Filtration", desc: "Filter the mixture to remove the unreacted, excess CuO. The filtrate is aqueous CuSO₄.", type: "filter" },
                    { title: "Evaporation", desc: "Heat the filtrate in an evaporating dish to evaporate some water, leaving a saturated solution.", type: "heat" },
                    { title: "Crystallization", desc: "Allow the solution to cool. Blue CuSO₄ crystals will form. Filter, wash with cold water, and dry.", type: "crystals" }
                ]
            },
            nacl: { 
                id: 'nacl', name: "Sodium Chloride", formula: "NaCl", 
                type: "soluble", isSPA: true, method: "Titration", color: "#F8FAFC", // White/Clear
                reqReagent1: "Hydrochloric Acid (HCl)", reqReagent2: "Sodium Hydroxide (NaOH)",
                steps: [
                    { title: "Titration (with indicator)", desc: "Add acid from a burette to a known volume of alkali until the indicator changes color. Record volume.", type: "titrate" },
                    { title: "Titration (without indicator)", desc: "Repeat the exact titration using the recorded volume, but WITHOUT indicator, to get pure NaCl(aq).", type: "titrate_pure" },
                    { title: "Evaporation", desc: "Heat the pure solution to evaporate off the water until it is saturated.", type: "heat" },
                    { title: "Crystallization", desc: "Cool to form white NaCl crystals. Filter and dry between filter papers.", type: "crystals" }
                ]
            },
            baso4: { 
                id: 'baso4', name: "Barium Sulfate", formula: "BaSO₄", 
                type: "insoluble", isSPA: false, method: "Precipitation", color: "#E2E8F0", // White precipitate
                reqReagent1: "Barium Nitrate (Ba(NO₃)₂)", reqReagent2: "Sodium Sulfate (Na₂SO₄)",
                steps: [
                    { title: "Mixing", desc: "Mix two soluble salts (e.g., Barium Nitrate and Sodium Sulfate). A white precipitate of BaSO₄ forms immediately.", type: "mix_liquid" },
                    { title: "Filtration", desc: "Filter the mixture. The insoluble BaSO₄ is trapped in the filter paper as the residue.", type: "filter" },
                    { title: "Washing", desc: "Wash the residue on the filter paper with distilled water to remove soluble impurities.", type: "wash" },
                    { title: "Drying", desc: "Carefully press the residue between layers of filter paper to dry the pure Barium Sulfate.", type: "dry" }
                ]
            },
            mgno32: { 
                id: 'mgno32', name: "Magnesium Nitrate", formula: "Mg(NO₃)₂", 
                type: "soluble", isSPA: false, method: "Excess Solid", color: "#F8FAFC", // Clear
                reqReagent1: "Nitric Acid (HNO₃)", reqReagent2: "Magnesium Carbonate (MgCO₃)",
                steps: [
                    { title: "Add Excess Solid", desc: "Add insoluble MgCO₃ to HNO₃ until effervescence stops and solid remains. All acid has reacted.", type: "mix_solid_gas" },
                    { title: "Filtration", desc: "Filter to remove the excess MgCO₃. The filtrate is pure Mg(NO₃)₂(aq).", type: "filter" },
                    { title: "Evaporation", desc: "Heat the filtrate gently to evaporate water and create a saturated solution.", type: "heat" },
                    { title: "Crystallization", desc: "Cool to crystallize. Filter the crystals and dry them carefully.", type: "crystals" }
                ]
            }
        };

        const REAGENTS_1 = ["Hydrochloric Acid (HCl)", "Sulfuric Acid (H₂SO₄)", "Nitric Acid (HNO₃)", "Barium Nitrate (Ba(NO₃)₂)", "Sodium Chloride (NaCl)"];
        const REAGENTS_2 = ["Copper(II) Oxide (CuO)", "Sodium Hydroxide (NaOH)", "Sodium Sulfate (Na₂SO₄)", "Magnesium Carbonate (MgCO₃)", "Silver Nitrate (AgNO₃)"];

        function App() {
            // --- STATE ---
            const [stage, setStage] = useState(0); // 0: Select Salt, 1: Select Reactants, 2: Lab Simulator
            const [activeSaltKey, setActiveSaltKey] = useState(null);
            
            const [selectedR1, setSelectedR1] = useState("");
            const [selectedR2, setSelectedR2] = useState("");
            const [feedback, setFeedback] = useState({ show: false, isCorrect: false, msg: "" });

            const [currentStep, setCurrentStep] = useState(0);

            const activeSalt = activeSaltKey ? SALT_DB[activeSaltKey] : null;

            // --- HANDLERS ---
            const handleSelectSalt = (key) => {
                setActiveSaltKey(key);
                setStage(1);
                setSelectedR1("");
                setSelectedR2("");
                setFeedback({ show: false });
            };

            const evaluateReactants = () => {
                if (!selectedR1 || !selectedR2) {
                    setFeedback({ show: true, isCorrect: false, msg: "Please select both reagents." });
                    return;
                }

                // Check correct combination (order doesn't strictly matter for UI, but let's check both ways)
                const isCorrect = 
                    (selectedR1 === activeSalt.reqReagent1 && selectedR2 === activeSalt.reqReagent2) ||
                    (selectedR1 === activeSalt.reqReagent2 && selectedR2 === activeSalt.reqReagent1);

                if (isCorrect) {
                    setFeedback({ show: true, isCorrect: true, msg: "Perfect! Correct reagents chosen for this methodology." });
                    setTimeout(() => {
                        setStage(2);
                        setCurrentStep(0);
                    }, 1500);
                } else {
                    setFeedback({ show: true, isCorrect: false, msg: `Incorrect. Hint: Think about what acid provides the anion, and what base/salt provides the cation for ${activeSalt.name}.` });
                }
            };

            const resetApp = () => {
                setStage(0);
                setActiveSaltKey(null);
                setFeedback({ show: false });
                setCurrentStep(0);
            };

            // --- UI COMPONENTS ---
            const renderLabApparatus = (stepData, saltData) => {
                const color = saltData.color;
                
                switch(stepData.type) {
                    case 'mix_solid':
                    case 'mix_solid_gas':
                    case 'mix_liquid':
                        return (
                            <svg viewBox="0 0 200 200" className="w-full h-full">
                                {/* Beaker Base */}
                                <path d="M 50 150 C 50 160 60 170 100 170 C 140 170 150 160 150 150 L 150 50 L 50 50 Z" fill="rgba(30,41,59,0.5)" stroke="#475569" strokeWidth="4" />
                                {/* Liquid level */}
                                <path d="M 53 100 L 147 100 L 147 150 C 147 158 135 167 100 167 C 65 167 53 158 53 150 Z" fill={color} fillOpacity="0.6" className="transition-all duration-1000"/>
                                {/* Adding something */}
                                {stepData.type === 'mix_solid' || stepData.type === 'mix_solid_gas' ? (
                                    <circle cx="100" cy="140" r="15" fill="#0F172A" stroke="#475569" strokeWidth="2" className="animate-pulse" />
                                ) : (
                                    <rect x="95" y="10" width="10" height="90" fill="#E2E8F0" className="animate-pour" />
                                )}
                                {/* Gas Bubbles */}
                                {stepData.type === 'mix_solid_gas' && (
                                    <g>
                                        <circle cx="90" cy="120" r="4" fill="white" className="animate-drip" style={{animationDuration: '1s'}} />
                                        <circle cx="110" cy="110" r="3" fill="white" className="animate-drip" style={{animationDuration: '1.2s'}} />
                                    </g>
                                )}
                            </svg>
                        );
                    case 'titrate':
                    case 'titrate_pure':
                        return (
                            <svg viewBox="0 0 200 200" className="w-full h-full">
                                {/* Burette */}
                                <rect x="95" y="10" width="10" height="90" fill="rgba(255,255,255,0.1)" stroke="#475569" strokeWidth="2"/>
                                <rect x="92" y="90" width="16" height="6" fill="#64748B" />
                                {/* Drip */}
                                <circle cx="100" cy="100" r="3" fill="#38BDF8" className="animate-drip" />
                                {/* Conical Flask */}
                                <path d="M 85 110 L 115 110 L 140 180 C 145 190 130 195 100 195 C 70 195 55 190 60 180 Z" fill="rgba(30,41,59,0.5)" stroke="#475569" strokeWidth="4"/>
                                <path d="M 70 150 L 130 150 L 137 180 C 140 188 125 192 100 192 C 75 192 60 188 63 180 Z" fill={stepData.type === 'titrate' ? "#F43F5E" : color} fillOpacity={stepData.type === 'titrate' ? "0.3" : "0.6"} className="transition-colors duration-1000"/>
                            </svg>
                        );
                    case 'filter':
                        return (
                            <svg viewBox="0 0 200 200" className="w-full h-full">
                                {/* Filter Funnel */}
                                <path d="M 50 30 L 150 30 L 105 100 L 105 130 L 95 130 L 95 100 Z" fill="rgba(255,255,255,0.05)" stroke="#475569" strokeWidth="4"/>
                                {/* Filter Paper with Residue */}
                                <path d="M 60 40 L 140 40 L 100 95 Z" fill="#F8FAFC" opacity="0.8"/>
                                <circle cx="100" cy="75" r="15" fill={saltData.type === 'insoluble' ? color : "#0F172A"} opacity="0.9" />
                                {/* Flask */}
                                <path d="M 85 120 L 115 120 L 140 190 C 145 195 130 195 100 195 C 70 195 55 195 60 190 Z" fill="rgba(30,41,59,0.5)" stroke="#475569" strokeWidth="4"/>
                                {/* Filtrate */}
                                <path d="M 70 160 L 130 160 L 137 190 C 140 193 125 193 100 193 C 75 193 60 193 63 190 Z" fill={saltData.type === 'soluble' ? color : "transparent"} fillOpacity="0.6"/>
                                {/* Drip */}
                                <circle cx="100" cy="135" r="2" fill={saltData.type === 'soluble' ? color : "rgba(255,255,255,0.5)"} className="animate-drip" />
                            </svg>
                        );
                    case 'heat':
                        return (
                            <svg viewBox="0 0 200 200" className="w-full h-full">
                                {/* Flame */}
                                <path d="M 100 130 Q 115 160 100 180 Q 85 160 100 130 Z" fill="#F43F5E" className="animate-flame" />
                                {/* Tripod */}
                                <line x1="70" y1="120" x2="60" y2="190" stroke="#475569" strokeWidth="4" />
                                <line x1="130" y1="120" x2="140" y2="190" stroke="#475569" strokeWidth="4" />
                                <line x1="50" y1="120" x2="150" y2="120" stroke="#475569" strokeWidth="6" />
                                {/* Evaporating Dish */}
                                <path d="M 60 90 C 60 130 140 130 140 90" fill="rgba(255,255,255,0.1)" stroke="#94A3B8" strokeWidth="4" />
                                <path d="M 65 95 C 65 125 135 125 135 95" fill={color} fillOpacity="0.7" />
                                {/* Steam */}
                                <path d="M 90 80 Q 95 60 90 40" stroke="rgba(255,255,255,0.3)" strokeWidth="3" fill="none" className="animate-drip" />
                                <path d="M 110 85 Q 105 65 110 45" stroke="rgba(255,255,255,0.3)" strokeWidth="3" fill="none" className="animate-drip" style={{animationDelay: '0.5s'}} />
                            </svg>
                        );
                    case 'crystals':
                    case 'dry':
                        return (
                            <svg viewBox="0 0 200 200" className="w-full h-full">
                                {/* Petri dish / Filter Paper */}
                                <ellipse cx="100" cy="150" rx="60" ry="20" fill="rgba(255,255,255,0.1)" stroke="#475569" strokeWidth="2" />
                                {/* Crystals */}
                                <polygon points="90,140 100,130 110,140 100,150" fill={color} stroke="rgba(255,255,255,0.5)" strokeWidth="1" />
                                <polygon points="70,145 80,135 90,145 80,155" fill={color} stroke="rgba(255,255,255,0.5)" strokeWidth="1" />
                                <polygon points="115,148 125,138 135,148 125,158" fill={color} stroke="rgba(255,255,255,0.5)" strokeWidth="1" />
                                <polygon points="95,152 102,146 110,152 102,158" fill={color} stroke="rgba(255,255,255,0.5)" strokeWidth="1" />
                            </svg>
                        );
                    case 'wash':
                        return (
                            <svg viewBox="0 0 200 200" className="w-full h-full">
                                {/* Wash bottle tip */}
                                <path d="M 150 20 C 130 20 110 40 110 60" fill="none" stroke="#64748B" strokeWidth="4" />
                                {/* Stream of water */}
                                <path d="M 110 60 L 100 100" stroke="#38BDF8" strokeWidth="2" strokeDasharray="4" className="animate-pour" />
                                {/* Filter Funnel */}
                                <path d="M 50 80 L 150 80 L 105 130 L 105 160 L 95 160 L 95 130 Z" fill="rgba(255,255,255,0.05)" stroke="#475569" strokeWidth="4"/>
                                {/* Residue */}
                                <circle cx="100" cy="110" r="15" fill={color} opacity="0.9" />
                            </svg>
                        );
                    default:
                        return null;
                }
            };

            return (
                <div className="w-full max-w-6xl h-full flex flex-col bg-slate-900 border border-slate-700 rounded-3xl shadow-2xl overflow-hidden">
                    
                    {/* Header */}
                    <header className="bg-slate-800/80 backdrop-blur p-5 border-b border-slate-700 flex justify-between items-center shrink-0 z-10">
                        <div>
                            <h1 className="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-teal-400 to-blue-500">
                                Salt Preparation Guide
                            </h1>
                            <p className="text-slate-400 text-xs mt-1 uppercase tracking-wider font-semibold">
                                Logic Engine & Virtual Laboratory
                            </p>
                        </div>
                        {stage > 0 && (
                            <button onClick={resetApp} className="text-xs font-bold text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-lg border border-slate-600 transition-colors">
                                RESET LAB
                            </button>
                        )}
                    </header>

                    {/* Main Workspace Layout */}
                    <div className="flex-grow flex flex-col lg:flex-row overflow-hidden relative">
                        
                        {/* LEFT PANEL: Decision Engine & Inputs */}
                        <div className="w-full lg:w-5/12 bg-slate-900 border-r border-slate-700 flex flex-col z-10">
                            
                            {/* Logic Tracker */}
                            <div className="p-6 border-b border-slate-800 bg-slate-850">
                                <h2 className="text-[10px] text-slate-500 font-bold uppercase tracking-widest mb-4">Algorithm Progress</h2>
                                <div className="flex flex-col gap-2 relative">
                                    <div className="absolute left-3 top-2 bottom-2 w-0.5 bg-slate-700"></div>
                                    
                                    <div className={`flex items-center gap-3 relative z-10 ${stage >= 0 ? 'opacity-100' : 'opacity-40'}`}>
                                        <div className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold border-2 ${stage >= 0 ? 'bg-teal-500 border-teal-500 text-white' : 'bg-slate-800 border-slate-600 text-slate-400'}`}>1</div>
                                        <span className="text-sm font-semibold text-slate-200">Target Salt Identification</span>
                                    </div>
                                    <div className={`flex items-center gap-3 relative z-10 ${stage >= 1 ? 'opacity-100' : 'opacity-40'}`}>
                                        <div className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold border-2 ${stage >= 1 ? 'bg-blue-500 border-blue-500 text-white' : 'bg-slate-800 border-slate-600 text-slate-400'}`}>2</div>
                                        <span className="text-sm font-semibold text-slate-200">Solubility Rules & Reagents</span>
                                    </div>
                                    <div className={`flex items-center gap-3 relative z-10 ${stage >= 2 ? 'opacity-100' : 'opacity-40'}`}>
                                        <div className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold border-2 ${stage >= 2 ? 'bg-indigo-500 border-indigo-500 text-white' : 'bg-slate-800 border-slate-600 text-slate-400'}`}>3</div>
                                        <span className="text-sm font-semibold text-slate-200">Physical Separation Method</span>
                                    </div>
                                </div>
                            </div>

                            {/* Dynamic Input Area */}
                            <div className="p-6 flex-grow overflow-y-auto hide-scrollbar">
                                
                                {stage === 0 && (
                                    <div className="animate-slide-in">
                                        <h3 className="text-sm font-bold text-teal-400 mb-4 uppercase tracking-wider">Select Target Salt</h3>
                                        <div className="grid grid-cols-1 gap-3">
                                            {Object.values(SALT_DB).map(salt => (
                                                <button 
                                                    key={salt.id} 
                                                    onClick={() => handleSelectSalt(salt.id)}
                                                    className="bg-slate-800 hover:bg-slate-700 border border-slate-600 hover:border-teal-500 p-4 rounded-xl text-left transition-all group flex justify-between items-center"
                                                >
                                                    <div>
                                                        <div className="text-white font-bold text-lg group-hover:text-teal-300 transition-colors">{salt.name}</div>
                                                        <div className="text-slate-400 font-mono text-sm mt-1">{salt.formula}</div>
                                                    </div>
                                                    <div className="text-slate-500 group-hover:text-teal-400">→</div>
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {stage === 1 && activeSalt && (
                                    <div className="animate-slide-in flex flex-col h-full">
                                        
                                        {/* Logic Output */}
                                        <div className="bg-slate-950 border border-slate-800 rounded-xl p-4 mb-6 shadow-inner">
                                            <div className="text-[10px] text-slate-500 uppercase font-bold tracking-widest mb-1">Target</div>
                                            <div className="text-xl text-white font-bold mb-3">{activeSalt.name} <span className="text-sm text-slate-400 font-mono ml-2">{activeSalt.formula}</span></div>
                                            
                                            <div className="flex flex-wrap gap-2 mb-3">
                                                <span className={`px-2 py-1 text-xs font-bold rounded uppercase ${activeSalt.type === 'soluble' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'}`}>
                                                    {activeSalt.type === 'soluble' ? 'Soluble in Water' : 'Insoluble in Water'}
                                                </span>
                                                {activeSalt.type === 'soluble' && (
                                                    <span className={`px-2 py-1 text-xs font-bold rounded uppercase ${activeSalt.isSPA ? 'bg-amber-500/20 text-amber-400' : 'bg-slate-700 text-slate-300'}`}>
                                                        {activeSalt.isSPA ? 'SPA Salt (Group 1/NH₄)' : 'Non-SPA Salt'}
                                                    </span>
                                                )}
                                            </div>

                                            <div className="text-sm text-blue-300 font-semibold border-t border-slate-800 pt-3 mt-1">
                                                Engine Output: Methodology required is <span className="uppercase text-blue-400 font-bold px-1 bg-blue-500/10 rounded">{activeSalt.method}</span>
                                            </div>
                                        </div>

                                        {/* Reagent Selectors */}
                                        <div className="space-y-4">
                                            <h3 className="text-sm font-bold text-blue-400 mb-2 uppercase tracking-wider">Select Required Reagents</h3>
                                            
                                            <div>
                                                <label className="text-xs text-slate-400 font-semibold mb-1 block">Solution / Acid</label>
                                                <select 
                                                    value={selectedR1} onChange={(e) => setSelectedR1(e.target.value)}
                                                    className="w-full bg-slate-800 border border-slate-600 text-slate-200 text-sm rounded-lg p-3 outline-none focus:border-blue-500 transition-colors"
                                                >
                                                    <option value="" disabled>Select Reagent 1...</option>
                                                    {REAGENTS_1.map(r => <option key={r} value={r}>{r}</option>)}
                                                </select>
                                            </div>

                                            <div>
                                                <label className="text-xs text-slate-400 font-semibold mb-1 block">Solid / Base / Solution 2</label>
                                                <select 
                                                    value={selectedR2} onChange={(e) => setSelectedR2(e.target.value)}
                                                    className="w-full bg-slate-800 border border-slate-600 text-slate-200 text-sm rounded-lg p-3 outline-none focus:border-blue-500 transition-colors"
                                                >
                                                    <option value="" disabled>Select Reagent 2...</option>
                                                    {REAGENTS_2.map(r => <option key={r} value={r}>{r}</option>)}
                                                </select>
                                            </div>
                                        </div>

                                        {/* Feedback Area */}
                                        {feedback.show && (
                                            <div className={`mt-4 p-3 rounded-lg text-sm font-medium border ${feedback.isCorrect ? 'bg-emerald-900/20 border-emerald-500/50 text-emerald-300' : 'bg-rose-900/20 border-rose-500/50 text-rose-300'}`}>
                                                {feedback.msg}
                                            </div>
                                        )}

                                        <div className="mt-auto pt-6">
                                            <button 
                                                onClick={evaluateReactants}
                                                className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl shadow-lg transition-all transform hover:scale-[1.02] active:scale-[0.98]"
                                            >
                                                EVALUATE & PROCEED
                                            </button>
                                        </div>
                                    </div>
                                )}

                                {stage === 2 && activeSalt && (
                                    <div className="animate-slide-in flex flex-col h-full justify-center text-center px-4">
                                        <div className="w-16 h-16 bg-indigo-500/20 border-2 border-indigo-500 rounded-full flex items-center justify-center mx-auto mb-4 text-indigo-400">
                                            <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                                        </div>
                                        <h3 className="text-xl font-bold text-white mb-2">Algorithm Complete</h3>
                                        <p className="text-slate-400 text-sm leading-relaxed">
                                            Methodology locked. Execute the physical separation steps in the Virtual Laboratory pane.
                                        </p>
                                    </div>
                                )}

                            </div>
                        </div>

                        {/* RIGHT PANEL: Virtual Laboratory Viewer */}
                        <div className="w-full lg:w-7/12 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-slate-800 to-slate-950 flex flex-col relative">
                            
                            {stage < 2 ? (
                                // Idle State
                                <div className="absolute inset-0 flex flex-col items-center justify-center opacity-30 text-slate-400 pointer-events-none p-8 text-center">
                                    <svg className="w-32 h-32 mb-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="1"><path strokeLinecap="round" strokeLinejoin="round" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                                    <p className="text-xl font-semibold">Virtual Laboratory Offline</p>
                                    <p className="text-sm mt-2">Awaiting target salt selection and methodology logic clearance.</p>
                                </div>
                            ) : (
                                // Active Lab State
                                <div className="absolute inset-0 flex flex-col animate-slide-in">
                                    
                                    {/* Apparatus Viewer */}
                                    <div className="flex-grow flex items-center justify-center p-8 relative">
                                        <div className="w-64 h-64 md:w-80 md:h-80 relative drop-shadow-[0_0_25px_rgba(0,0,0,0.5)]">
                                            {/* Render specific SVG based on current step */}
                                            {renderLabApparatus(activeSalt.steps[currentStep], activeSalt)}
                                        </div>

                                        {/* Step indicator pills top right */}
                                        <div className="absolute top-6 right-6 flex gap-2">
                                            {activeSalt.steps.map((s, idx) => (
                                                <div key={idx} className={`w-3 h-3 rounded-full transition-colors ${idx === currentStep ? 'bg-indigo-500 shadow-[0_0_8px_rgba(99,102,241,0.8)]' : idx < currentStep ? 'bg-slate-600' : 'bg-slate-800 border border-slate-700'}`}></div>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Step Description & Controls */}
                                    <div className="h-48 md:h-56 bg-slate-900/90 backdrop-blur border-t border-slate-700 p-6 flex flex-col shadow-[0_-10px_30px_rgba(0,0,0,0.3)]">
                                        
                                        <div className="flex justify-between items-start mb-4">
                                            <div>
                                                <span className="text-indigo-400 font-bold text-[10px] uppercase tracking-widest block mb-1">Step {currentStep + 1} of {activeSalt.steps.length}</span>
                                                <h3 className="text-xl md:text-2xl font-bold text-white">{activeSalt.steps[currentStep].title}</h3>
                                            </div>
                                            <div className="bg-slate-800 px-3 py-1 rounded text-xs font-mono text-slate-300 border border-slate-700">
                                                {activeSalt.method}
                                            </div>
                                        </div>

                                        <p className="text-slate-400 text-sm md:text-base leading-relaxed max-w-2xl flex-grow">
                                            {activeSalt.steps[currentStep].desc}
                                        </p>

                                        {/* Navigation */}
                                        <div className="flex justify-between mt-auto pt-4">
                                            <button 
                                                onClick={() => setCurrentStep(Math.max(0, currentStep - 1))}
                                                disabled={currentStep === 0}
                                                className="px-6 py-2 rounded-lg font-bold text-sm bg-slate-800 text-slate-300 hover:bg-slate-700 disabled:opacity-30 disabled:hover:bg-slate-800 transition-colors"
                                            >
                                                ← PREVIOUS
                                            </button>
                                            
                                            {currentStep < activeSalt.steps.length - 1 ? (
                                                <button 
                                                    onClick={() => setCurrentStep(Math.min(activeSalt.steps.length - 1, currentStep + 1))}
                                                    className="px-6 py-2 rounded-lg font-bold text-sm bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg shadow-indigo-500/20 transition-all transform hover:-translate-y-0.5"
                                                >
                                                    NEXT STEP →
                                                </button>
                                            ) : (
                                                <button 
                                                    onClick={resetApp}
                                                    className="px-6 py-2 rounded-lg font-bold text-sm bg-emerald-600 hover:bg-emerald-500 text-white shadow-lg shadow-emerald-500/20 transition-all"
                                                >
                                                    FINISH SYNTHESIS
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            )}

                        </div>

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
