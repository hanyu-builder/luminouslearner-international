<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Equilibrium Constant Kc Calculator | Interactive Simulator</title>
    <!-- Primary SEO Keyword: Equilibrium constant Kc calculator -->
    <meta name="description" content="Use this interactive equilibrium constant Kc calculator to parse chemical equations, reject solid and liquid phases, and calculate the final Kc value using mass action expressions.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Math.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>

    <!-- KaTeX for Math & Chemical Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <!-- mhchem extension for rendering chemical formulas seamlessly -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/mhchem.min.js"></script>

    <!-- React, ReactDOM, and Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        
        .katex-display { margin: 0 !important; }
        
        /* Smooth fade for elements */
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-[#0F172A] text-slate-200 h-screen max-h-[1000px] overflow-hidden flex flex-col font-sans select-none">

    <div id="root" class="h-full w-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- ICONS ---
        const CalculatorIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-purple-400"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect><line x1="8" y1="6" x2="16" y2="6"></line><line x1="16" y1="14" x2="16" y2="18"></line><path d="M16 10h.01"></path><path d="M12 10h.01"></path><path d="M8 10h.01"></path><path d="M12 14h.01"></path><path d="M8 14h.01"></path><path d="M12 18h.01"></path><path d="M8 18h.01"></path></svg>;
        const AlertIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>;
        const CheckIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>;

        // --- KATEX WRAPPER COMPONENT ---
        const KaTeX = ({ math, block = false }) => {
            const containerRef = useRef(null);
            
            useEffect(() => {
                if (containerRef.current) {
                    try {
                        katex.render(math, containerRef.current, {
                            displayMode: block,
                            throwOnError: false,
                            strict: false
                        });
                    } catch (e) {
                        console.error("KaTeX error:", e);
                    }
                }
            }, [math, block]);

            return <span ref={containerRef} className={block ? "text-2xl" : "text-base"} />;
        };

        function App() {
            // --- STATE ---
            const [equationInput, setEquationInput] = useState("N2(g) + 3H2(g) <=> 2NH3(g)");
            const [parsedEq, setParsedEq] = useState({ reactants: [], products: [], isValid: false, error: "" });
            const [concentrations, setConcentrations] = useState({ "N2": 1.0, "H2": 0.5, "NH3": 2.0 });

            // --- CHEMICAL EQUATION PARSER ENGINE ---
            useEffect(() => {
                const parse = (eq) => {
                    // Split by equilibrium arrows
                    const sides = eq.split(/<=>|⇌|->|=/);
                    if (sides.length !== 2) return { isValid: false, error: "Requires exactly one equilibrium arrow (e.g., <=>)" };

                    const extractSpecies = (str) => {
                        // Regex: matches (optional coeff) (formula) (state)
                        // Formula matches any valid chemical characters, lazy match up to the state symbols
                        const regex = /(\d*)\s*([A-Za-z0-9\+\-\(\)\[\]]+?)\s*\((g|aq|s|l)\)/ig;
                        const items = [];
                        let match;
                        while ((match = regex.exec(str)) !== null) {
                            items.push({
                                coeff: parseInt(match[1]) || 1,
                                formula: match[2],
                                state: match[3].toLowerCase(),
                                id: Math.random().toString(36).substr(2, 9)
                            });
                        }
                        return items;
                    };

                    const reactants = extractSpecies(sides[0]);
                    const products = extractSpecies(sides[1]);

                    if (reactants.length === 0 && products.length === 0) {
                        return { isValid: false, error: "No valid species found. Format required: Formula(state), e.g., H2O(l)" };
                    }

                    return { reactants, products, isValid: true, error: "" };
                };

                setParsedEq(parse(equationInput));
            }, [equationInput]);

            // Ensure concentrations object has entries for newly parsed species
            useEffect(() => {
                if (!parsedEq.isValid) return;
                
                const newConcs = { ...concentrations };
                const allSpecies = [...parsedEq.reactants, ...parsedEq.products];
                
                allSpecies.forEach(item => {
                    if (newConcs[item.formula] === undefined) {
                        newConcs[item.formula] = 1.0; // Default to 1.0 M
                    }
                });
                setConcentrations(newConcs);
            }, [parsedEq]);

            // --- CALCULATION ENGINE ---
            const calculations = useMemo(() => {
                if (!parsedEq.isValid) return { kc: 0, expression: "" };

                const activeReactants = parsedEq.reactants.filter(i => i.state === 'g' || i.state === 'aq');
                const activeProducts = parsedEq.products.filter(i => i.state === 'g' || i.state === 'aq');

                // 1. Build KaTeX Expression
                const buildTerm = (items) => {
                    if (items.length === 0) return '1';
                    return items.map(item => {
                        let term = `\\ce{[${item.formula}]}`;
                        if (item.coeff > 1) term += `^{${item.coeff}}`;
                        return term;
                    }).join(' \\cdot ');
                };

                const numStr = buildTerm(activeProducts);
                const denStr = buildTerm(activeReactants);
                const expression = `K_c = \\frac{${numStr}}{${denStr}}`;

                // 2. Compute Numerical Value using math.js
                let num = math.bignumber(1);
                activeProducts.forEach(item => {
                    const c = math.bignumber(concentrations[item.formula] || 0);
                    num = math.multiply(num, math.pow(c, item.coeff));
                });

                let den = math.bignumber(1);
                activeReactants.forEach(item => {
                    const c = math.bignumber(concentrations[item.formula] || 0);
                    den = math.multiply(den, math.pow(c, item.coeff));
                });

                let kcValue = 0;
                let isInfinity = false;
                
                if (math.equal(den, 0)) {
                    isInfinity = true;
                } else {
                    kcValue = math.divide(num, den);
                }

                // Format number nicely
                let displayVal = "0";
                if (isInfinity) {
                    displayVal = "\\infty";
                } else {
                    const numVal = Number(kcValue);
                    if (numVal > 1e4 || (numVal < 1e-4 && numVal > 0)) {
                        displayVal = numVal.toExponential(4);
                    } else {
                        displayVal = math.format(kcValue, { notation: 'fixed', precision: 4 }).replace(/\.?0+$/, '');
                    }
                }

                return {
                    expression,
                    displayVal,
                    numStr, denStr
                };
            }, [parsedEq, concentrations]);

            // --- UI HANDLERS ---
            const handleConcChange = (formula, val) => {
                setConcentrations(prev => ({
                    ...prev,
                    [formula]: Math.max(0, parseFloat(val) || 0)
                }));
            };

            const loadPreset = (eq) => {
                setEquationInput(eq);
            };

            // --- SUB-COMPONENTS ---
            const SpeciesCard = ({ item, type }) => {
                const isActive = item.state === 'g' || item.state === 'aq';
                const colorTheme = type === 'reactants' ? 'blue' : 'emerald';

                return (
                    <div className={`p-3 rounded-lg border relative overflow-hidden transition-colors
                        ${isActive ? `bg-slate-900 border-slate-600` : `bg-slate-900/40 border-slate-800 opacity-60`}`}>
                        
                        {/* Coefficient badge */}
                        <div className={`absolute top-0 left-0 h-full w-8 flex items-center justify-center font-black text-lg 
                            ${isActive ? `bg-${colorTheme}-900/50 text-${colorTheme}-400` : `bg-slate-800 text-slate-500`}`}>
                            {item.coeff}
                        </div>

                        <div className="ml-10 flex justify-between items-center">
                            <div className="flex flex-col">
                                <span className="font-bold text-white text-lg"><KaTeX math={`\\ce{${item.formula}}`} /></span>
                                <span className={`text-xs uppercase tracking-widest font-bold 
                                    ${isActive ? 'text-slate-400' : 'text-red-400'}`}>
                                    State: ({item.state})
                                </span>
                            </div>

                            {isActive ? (
                                <div className="flex items-center gap-2">
                                    <input 
                                        type="number" min="0" step="any"
                                        value={concentrations[item.formula] || 0}
                                        onChange={(e) => handleConcChange(item.formula, e.target.value)}
                                        className={`bg-slate-800 border border-${colorTheme}-500/50 rounded p-1.5 w-24 text-right text-white font-mono focus:outline-none focus:border-${colorTheme}-400`}
                                    />
                                    <span className="text-slate-500 font-bold">M</span>
                                </div>
                            ) : (
                                <span className="text-xs bg-red-900/20 text-red-400 px-2 py-1 rounded border border-red-800/50">
                                    Rejected
                                </span>
                            )}
                        </div>
                    </div>
                );
            };

            return (
                <div className="flex flex-col h-full w-full">
                    
                    {/* Header */}
                    <header className="bg-[#1E293B] border-b border-slate-800 p-4 shrink-0 flex flex-col md:flex-row justify-between items-center z-10 gap-4 shadow-lg">
                        <div>
                            <h1 className="text-xl md:text-2xl font-bold text-white flex items-center gap-2 tracking-tight">
                                <CalculatorIcon /> Equilibrium Constant Calculator
                            </h1>
                            <p className="text-xs md:text-sm text-slate-400 mt-1">
                                Parses coefficients into exponents & rejects solid/liquid phases automatically.
                            </p>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={() => loadPreset("N2(g) + 3H2(g) <=> 2NH3(g)")} className="text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-600 px-3 py-1.5 rounded transition">Haber Process</button>
                            <button onClick={() => loadPreset("CaCO3(s) <=> CaO(s) + CO2(g)")} className="text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-600 px-3 py-1.5 rounded transition">Heterogeneous</button>
                            <button onClick={() => loadPreset("CH3COOH(aq) + H2O(l) <=> CH3COO-(aq) + H3O+(aq)")} className="text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-600 px-3 py-1.5 rounded transition">Weak Acid</button>
                        </div>
                    </header>

                    {/* Main Workspace */}
                    <main className="flex-1 flex flex-col lg:flex-row gap-6 p-4 md:p-6 overflow-hidden max-w-7xl w-full mx-auto">
                        
                        {/* LEFT PANEL: Equation & Inputs */}
                        <section className="flex flex-col gap-6 w-full lg:w-1/2 shrink-0 overflow-y-auto pr-2">
                            
                            {/* Equation Parser */}
                            <div className="bg-[#1E293B] p-5 rounded-xl border border-slate-700 shadow-lg shrink-0">
                                <h2 className="text-sm uppercase font-bold text-slate-400 mb-3 tracking-wider flex items-center gap-2">
                                    <span className="bg-purple-900 text-purple-400 px-2 py-0.5 rounded">1</span> Chemical Equation
                                </h2>
                                
                                <input 
                                    type="text" 
                                    value={equationInput}
                                    onChange={(e) => setEquationInput(e.target.value)}
                                    placeholder="e.g. 2H2(g) + O2(g) <=> 2H2O(g)"
                                    className="w-full bg-slate-900 border border-slate-600 rounded-lg p-4 text-white font-mono text-lg tracking-wide focus:border-purple-500 focus:ring-2 focus:ring-purple-900 outline-none transition-all"
                                />

                                {!parsedEq.isValid && (
                                    <div className="mt-3 flex items-start gap-2 text-xs text-amber-500 bg-amber-900/20 border border-amber-800 p-2 rounded">
                                        <AlertIcon /> {parsedEq.error}
                                    </div>
                                )}
                                
                                {parsedEq.isValid && (
                                    <div className="mt-3 flex items-center gap-2 text-xs text-emerald-400 bg-emerald-900/20 border border-emerald-800 p-2 rounded">
                                        <CheckIcon /> Equation parsed successfully.
                                    </div>
                                )}
                            </div>

                            {/* Concentration Inputs */}
                            {parsedEq.isValid && (
                                <div className="bg-[#1E293B] p-5 rounded-xl border border-slate-700 shadow-lg flex-1 flex flex-col fade-in">
                                    <h2 className="text-sm uppercase font-bold text-slate-400 mb-4 tracking-wider flex items-center gap-2 border-b border-slate-700 pb-2 shrink-0">
                                        <span className="bg-purple-900 text-purple-400 px-2 py-0.5 rounded">2</span> Equilibrium Concentrations
                                    </h2>
                                    
                                    <div className="flex-1 overflow-y-auto space-y-6">
                                        {/* Reactants */}
                                        <div className="space-y-2">
                                            <h3 className="text-xs uppercase text-blue-400 font-bold tracking-widest pl-1">Reactants</h3>
                                            {parsedEq.reactants.map((item, idx) => (
                                                <SpeciesCard key={`r-${idx}`} item={item} type="reactants" />
                                            ))}
                                        </div>
                                        
                                        {/* Products */}
                                        <div className="space-y-2">
                                            <h3 className="text-xs uppercase text-emerald-400 font-bold tracking-widest pl-1">Products</h3>
                                            {parsedEq.products.map((item, idx) => (
                                                <SpeciesCard key={`p-${idx}`} item={item} type="products" />
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}

                        </section>

                        {/* RIGHT PANEL: Calculation Output */}
                        <section className="flex flex-col gap-6 w-full lg:w-1/2 h-full">
                            
                            {/* Mass Action Expression */}
                            <div className="bg-[#1E293B] rounded-xl border border-slate-700 p-6 shadow-lg flex flex-col items-center justify-center min-h-[250px] relative overflow-hidden fade-in">
                                <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-500 to-emerald-500"></div>
                                <h2 className="text-sm uppercase font-bold text-slate-400 tracking-wider absolute top-4 left-6">Mass Action Expression</h2>
                                
                                {parsedEq.isValid ? (
                                    <div className="w-full flex items-center justify-center p-4 bg-slate-900/50 rounded-xl border border-slate-800 shadow-inner overflow-x-auto">
                                        <KaTeX math={calculations.expression} block={true} />
                                    </div>
                                ) : (
                                    <div className="text-slate-500 italic">Awaiting valid equation...</div>
                                )}
                            </div>

                            {/* Numerical Result */}
                            <div className="bg-gradient-to-br from-[#1E293B] to-slate-900 rounded-xl border border-purple-900/50 p-6 shadow-lg flex-1 flex flex-col justify-center items-center relative overflow-hidden fade-in">
                                <div className="absolute -right-20 -top-20 w-64 h-64 bg-purple-600/10 rounded-full blur-3xl pointer-events-none"></div>
                                
                                <h2 className="text-sm uppercase font-bold text-purple-400 tracking-wider mb-2">Equilibrium Constant (K_c)</h2>
                                
                                {parsedEq.isValid ? (
                                    <div className="text-center z-10">
                                        <div className="text-6xl md:text-7xl font-black text-white font-mono break-all tracking-tighter">
                                            <KaTeX math={calculations.displayVal} block={true} />
                                        </div>
                                        <div className="mt-6 text-sm text-slate-400 max-w-sm text-center mx-auto bg-slate-900 border border-slate-700 p-3 rounded">
                                            {calculations.displayVal === "\\infty" ? 
                                                "Denominator is zero. Pure products or divided by zero concentration." : 
                                                "Calculated by evaluating the product of product concentrations over reactant concentrations, raised to their stoichiometric powers."}
                                        </div>
                                    </div>
                                ) : (
                                    <div className="text-slate-500 italic z-10">--</div>
                                )}
                            </div>

                        </section>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
