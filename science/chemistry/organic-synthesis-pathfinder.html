<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organic Chemistry Synthesis Practice | Interactive Map</title>
    <!-- Primary SEO Keyword: Organic chemistry synthesis practice -->
    <meta name="description" content="Master organic chemistry synthesis practice with this interactive map. Select starting and end functional groups to build retrosynthetic pathways or use the Pathfinder to reveal complete routes.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React, ReactDOM, and Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        
        /* Drag & Drop Visuals */
        .drop-zone { transition: all 0.2s ease; border: 2px dashed #475569; }
        .drop-zone.drag-over { background-color: rgba(59, 130, 246, 0.2); border-color: #3b82f6; }
        
        /* Node Animations */
        .status-correct { border-color: #10b981 !important; box-shadow: 0 0 15px rgba(16, 185, 129, 0.3); }
        .status-incorrect { border-color: #ef4444 !important; box-shadow: 0 0 15px rgba(239, 68, 68, 0.3); animation: shake 0.4s; }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            50% { transform: translateX(4px); }
            75% { transform: translateX(-4px); }
        }

        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Animation for Pathfinder reveal */
        .step-card { opacity: 0; transform: translateY(20px); animation: reveal 0.5s ease-out forwards; }
        @keyframes reveal { to { opacity: 1; transform: translateY(0); } }

        /* Chemistry Subscripts */
        sub { font-size: 0.7em; bottom: -0.25em; }
        sup { font-size: 0.7em; top: -0.4em; }
    </style>
</head>

        // --- DATABASE ---
        const GROUPS = {

            primary_alcohol: { id: 'primary_alcohol', html: 'R-CH<sub>2</sub>OH', name: 'Primary Alcohol', colorClass: 'text-cyan-400', bgClass: 'bg-cyan-900/30' },

            ester: { id: 'ester', html: 'R-COO-R\'', name: 'Ester', colorClass: 'text-purple-400', bgClass: 'bg-purple-900/30' },

            nitrile: { id: 'nitrile', html: 'R-CN', name: 'Nitrile', colorClass: 'text-orange-400', bgClass: 'bg-orange-900/30' },
            amine: { id: 'amine', html: 'R-CH<sub>2</sub>NH<sub>2</sub>', name: 'Amine', colorClass: 'text-blue-400', bgClass: 'bg-blue-900/30' },
            acyl_chloride: { id: 'acyl_chloride', html: 'R-COCl', name: 'Acyl Chloride', colorClass: 'text-red-300', bgClass: 'bg-red-800/30' },
            hydroxynitrile: { id: 'hydroxynitrile', html: 'R-CH(OH)CN', name: 'Hydroxynitrile', colorClass: 'text-teal-400', bgClass: 'bg-teal-900/30' }
        };

        const CONDITIONS = {
            uv_halogen: { id: 'uv_halogen', html: 'X<sub>2</sub> / UV light', name: 'Free Radical Sub.' },
            hx: { id: 'hx', html: 'HX(g) / Room Temp', name: 'Electrophilic Add.' },
            hydrate: { id: 'hydrate', html: 'H<sub>2</sub>O(g) / H<sub>3</sub>PO<sub>4</sub><br>300°C', name: 'Hydration (Markovnikov)' },
            hydroboration: { id: 'hydroboration', html: '1. BH<sub>3</sub>, THF<br>2. H<sub>2</sub>O<sub>2</sub>, OH<sup>-</sup>', name: 'Hydroboration (Anti-Mark.)' },
            naoh_aq: { id: 'naoh_aq', html: 'NaOH(aq) / Reflux', name: 'Nucleophilic Sub.' },
            kcn: { id: 'kcn', html: 'KCN in ethanol / Reflux', name: 'Nucleophilic Sub.', extendsChain: true }, 
            nh3: { id: 'nh3', html: 'Excess NH<sub>3</sub> in ethanol / Heat', name: 'Nucleophilic Sub.' },
            ox_mild: { id: 'ox_mild', html: 'K<sub>2</sub>Cr<sub>2</sub>O<sub>7</sub> / H<sup>+</sup><br>Distil', name: 'Mild Oxidation' },
            ox_strong: { id: 'ox_strong', html: 'K<sub>2</sub>Cr<sub>2</sub>O<sub>7</sub> / H<sup>+</sup><br>Reflux', name: 'Strong Oxidation' },
            reduce_lialh4: { id: 'reduce_lialh4', html: 'LiAlH<sub>4</sub> in dry ether', name: 'Strong Reduction' },
            reduce_nabh4: { id: 'reduce_nabh4', html: 'NaBH<sub>4</sub>(aq)', name: 'Mild Reduction' },
            hydrolysis_acid: { id: 'hydrolysis_acid', html: 'Dilute H<sup>+</sup>(aq) / Reflux', name: 'Acid Hydrolysis' },
            hydrolysis_ester: { id: 'hydrolysis_ester', html: 'Dilute Acid or Alkali / Reflux', name: 'Hydrolysis' },
            h2o_cold: { id: 'h2o_cold', html: 'Cold H<sub>2</sub>O', name: 'Hydrolysis' },
            esterify: { id: 'esterify', html: 'Alcohol + Conc. H<sub>2</sub>SO<sub>4</sub><br>Heat', name: 'Esterification' },

            amide_form: { id: 'amide_form', html: 'Conc. NH<sub>3</sub> / Room Temp', name: 'Amide Formation' },
            esterify_acyl: { id: 'esterify_acyl', html: 'Alcohol / Room Temp', name: 'Esterification (Fast)' },
            dehydrohalogenation: { id: 'dehydrohalogenation', html: 'NaOH in ethanol / Reflux', name: 'Elimination' },
            dehydration: { id: 'dehydration', html: 'Conc. H<sub>2</sub>SO<sub>4</sub><br>170°C', name: 'Dehydration' },
            hydrogenation: { id: 'hydrogenation', html: 'H<sub>2</sub>(g) / Ni catalyst<br>150°C', name: 'Hydrogenation' },
            hcn_kcn: { id: 'hcn_kcn', html: 'HCN + KCN catalyst', name: 'Nucleophilic Addition', extendsChain: true },
            hofmann: { id: 'hofmann', html: 'Br<sub>2</sub> / NaOH(aq) / Heat', name: 'Hofmann Degradation', reducesChain: true }

        // Standard Syllabus Pathways
        const PATHWAYS = [
            // --- 1-STEP CONVERSIONS ---
            { start: 'alkane', target: 'halogenoalkane', steps: 1, solution: { conditions: ['uv_halogen'], intermediates: [] }, desc: 'Free radical substitution.' },
            
            { start: 'alkene', target: 'alkane', steps: 1, solution: { conditions: ['hydrogenation'], intermediates: [] }, desc: 'Electrophilic addition of hydrogen (reduction/saturation).' },
            { start: 'alkene', target: 'halogenoalkane', steps: 1, solution: { conditions: ['hx'], intermediates: [] }, desc: 'Electrophilic addition of a hydrogen halide.' },
            { start: 'alkene', target: 'primary_alcohol', steps: 1, solution: { conditions: ['hydroboration'], intermediates: [] }, desc: 'Anti-Markovnikov addition of water to form a primary alcohol.' },
            { start: 'alkene', target: 'secondary_alcohol', steps: 1, solution: { conditions: ['hydrate'], intermediates: [] }, desc: 'Markovnikov addition of water using a strong acid catalyst.' },
            
            { start: 'halogenoalkane', target: 'alkene', steps: 1, solution: { conditions: ['dehydrohalogenation'], intermediates: [] }, desc: 'Elimination of a hydrogen halide to form a double bond.' },
            { start: 'halogenoalkane', target: 'primary_alcohol', steps: 1, solution: { conditions: ['naoh_aq'], intermediates: [] }, desc: 'Nucleophilic substitution using aqueous hydroxide.' },
            { start: 'halogenoalkane', target: 'nitrile', steps: 1, solution: { conditions: ['kcn'], intermediates: [] }, desc: 'Nucleophilic substitution extending the carbon chain by one.' },
            { start: 'halogenoalkane', target: 'amine', steps: 1, solution: { conditions: ['nh3'], intermediates: [] }, desc: 'Nucleophilic substitution to form a primary amine.' },
            
            { start: 'primary_alcohol', target: 'halogenoalkane', steps: 1, solution: { conditions: ['socl2'], intermediates: [] }, desc: 'Nucleophilic substitution of an alcohol to form a halogenoalkane.' },
            { start: 'primary_alcohol', target: 'alkene', steps: 1, solution: { conditions: ['dehydration'], intermediates: [] }, desc: 'Elimination of water to form a double bond.' },
            { start: 'primary_alcohol', target: 'aldehyde', steps: 1, solution: { conditions: ['ox_mild'], intermediates: [] }, desc: 'Partial oxidation. Requires distillation to prevent further oxidation.' },
            { start: 'primary_alcohol', target: 'carboxylic_acid', steps: 1, solution: { conditions: ['ox_strong'], intermediates: [] }, desc: 'Complete oxidation under reflux.' },
            { start: 'primary_alcohol', target: 'ester', steps: 1, solution: { conditions: ['esterify'], intermediates: [] }, desc: 'Condensation reaction forming an ester.' },
            
            { start: 'secondary_alcohol', target: 'alkene', steps: 1, solution: { conditions: ['dehydration'], intermediates: [] }, desc: 'Elimination of water to form a double bond.' },
            { start: 'secondary_alcohol', target: 'ketone', steps: 1, solution: { conditions: ['ox_strong'], intermediates: [] }, desc: 'Oxidation of a secondary alcohol.' },
            
            { start: 'aldehyde', target: 'carboxylic_acid', steps: 1, solution: { conditions: ['ox_strong'], intermediates: [] }, desc: 'Oxidation of an aldehyde.' },
            { start: 'aldehyde', target: 'primary_alcohol', steps: 1, solution: { conditions: ['reduce_nabh4'], intermediates: [] }, desc: 'Mild reduction of an aldehyde.' },
            { start: 'aldehyde', target: 'hydroxynitrile', steps: 1, solution: { conditions: ['hcn_kcn'], intermediates: [] }, desc: 'Nucleophilic addition extending the carbon chain.' },
            
            { start: 'ketone', target: 'secondary_alcohol', steps: 1, solution: { conditions: ['reduce_nabh4'], intermediates: [] }, desc: 'Mild reduction of a ketone.' },
            { start: 'ketone', target: 'hydroxynitrile', steps: 1, solution: { conditions: ['hcn_kcn'], intermediates: [] }, desc: 'Nucleophilic addition extending the carbon chain.' },
            
            { start: 'carboxylic_acid', target: 'primary_alcohol', steps: 1, solution: { conditions: ['reduce_lialh4'], intermediates: [] }, desc: 'Strong reduction of a carboxylic acid.' },
            { start: 'carboxylic_acid', target: 'acyl_chloride', steps: 1, solution: { conditions: ['socl2'], intermediates: [] }, desc: 'Conversion to a highly reactive acyl chloride.' },
            { start: 'carboxylic_acid', target: 'ester', steps: 1, solution: { conditions: ['esterify'], intermediates: [] }, desc: 'Condensation reaction forming an ester.' },
            
            { start: 'acyl_chloride', target: 'carboxylic_acid', steps: 1, solution: { conditions: ['h2o_cold'], intermediates: [] }, desc: 'Violent hydrolysis of an acyl chloride at room temperature.' },
            { start: 'acyl_chloride', target: 'amide', steps: 1, solution: { conditions: ['amide_form'], intermediates: [] }, desc: 'Rapid formation of an amide.' },
            { start: 'acyl_chloride', target: 'ester', steps: 1, solution: { conditions: ['esterify_acyl'], intermediates: [] }, desc: 'Rapid formation of an ester without heating/catalyst.' },
            
            { start: 'ester', target: 'carboxylic_acid', steps: 1, solution: { conditions: ['hydrolysis_ester'], intermediates: [] }, desc: 'Acidic or alkaline hydrolysis of an ester.' },
            
            { start: 'nitrile', target: 'carboxylic_acid', steps: 1, solution: { conditions: ['hydrolysis_acid'], intermediates: [] }, desc: 'Acid hydrolysis of a nitrile.' },
            { start: 'nitrile', target: 'amine', steps: 1, solution: { conditions: ['reduce_lialh4'], intermediates: [] }, desc: 'Reduction of a nitrile to a primary amine.' },
            
            { start: 'amide', target: 'carboxylic_acid', steps: 1, solution: { conditions: ['hydrolysis_acid'], intermediates: [] }, desc: 'Acid hydrolysis of an amide.' },
            { start: 'amide', target: 'amine', steps: 1, solution: { conditions: ['hofmann'], intermediates: [] }, desc: 'Hofmann degradation to form an amine with one less carbon.' },
            
            // --- 2-STEP CONVERSIONS ---
            { start: 'alkane', target: 'alkene', steps: 2, solution: { conditions: ['uv_halogen', 'dehydrohalogenation'], intermediates: ['halogenoalkane'] }, desc: 'Functionalize an alkane via free radical substitution, followed by elimination.' },
            { start: 'alkane', target: 'primary_alcohol', steps: 2, solution: { conditions: ['uv_halogen', 'naoh_aq'], intermediates: ['halogenoalkane'] }, desc: 'Functionalize an unreactive alkane and convert it to an alcohol.' },
            { start: 'alkane', target: 'amine', steps: 2, solution: { conditions: ['uv_halogen', 'nh3'], intermediates: ['halogenoalkane'] }, desc: 'From an unreactive alkane to a reactive amine.' },
            
            { start: 'alkene', target: 'primary_alcohol', steps: 2, solution: { conditions: ['hx', 'naoh_aq'], intermediates: ['halogenoalkane'] }, desc: 'Indirect synthesis of an alcohol via a halogenoalkane intermediate.' },
            { start: 'alkene', target: 'carboxylic_acid', steps: 2, solution: { conditions: ['hydroboration', 'ox_strong'], intermediates: ['primary_alcohol'] }, desc: 'Synthesize a carboxylic acid from a simple alkene via a primary alcohol.' },
            { start: 'alkene', target: 'ketone', steps: 2, solution: { conditions: ['hydrate', 'ox_strong'], intermediates: ['secondary_alcohol'] }, desc: 'Hydration of an alkene (Markovnikov addition) to form a secondary alcohol, followed by oxidation.' },
            { start: 'alkene', target: 'amine', steps: 2, solution: { conditions: ['hx', 'nh3'], intermediates: ['halogenoalkane'] }, desc: 'Convert an alkene to a primary aliphatic amine via a halogen intermediate.' },
            
            { start: 'halogenoalkane', target: 'carboxylic_acid', steps: 2, solution: { conditions: ['kcn', 'hydrolysis_acid'], intermediates: ['nitrile'] }, desc: 'Extend the carbon chain by one (+1 C) and hydrolyze to form a carboxylic acid.' },
            { start: 'halogenoalkane', target: 'ester', steps: 2, solution: { conditions: ['naoh_aq', 'esterify'], intermediates: ['primary_alcohol'] }, desc: 'Convert to an alcohol first, then esterify.' },
            { start: 'halogenoalkane', target: 'alkane', steps: 2, solution: { conditions: ['dehydrohalogenation', 'hydrogenation'], intermediates: ['alkene'] }, desc: 'Convert to an alkene via elimination, followed by catalytic hydrogenation.' },
            
            { start: 'primary_alcohol', target: 'amide', steps: 2, solution: { conditions: ['ox_strong', 'amide_form'], intermediates: ['carboxylic_acid'] }, desc: 'Oxidize an alcohol completely, then convert to an amide. (Note: Can also go via Acyl Chloride in 3 steps for better yield).' },
            { start: 'primary_alcohol', target: 'amine', steps: 2, solution: { conditions: ['socl2', 'nh3'], intermediates: ['halogenoalkane'] }, desc: 'Convert alcohol to a better leaving group (halogen), then undergo nucleophilic substitution with ammonia.' },
            { start: 'primary_alcohol', target: 'nitrile', steps: 2, solution: { conditions: ['socl2', 'kcn'], intermediates: ['halogenoalkane'] }, desc: 'Convert to a halogenoalkane, then extend the carbon chain via nucleophilic substitution.' },
            
            { start: 'carboxylic_acid', target: 'amide', steps: 2, solution: { conditions: ['socl2', 'amide_form'], intermediates: ['acyl_chloride'] }, desc: 'Convert an acid into a highly reactive intermediate, then to an amide.' },
            { start: 'carboxylic_acid', target: 'amine', steps: 2, solution: { conditions: ['socl2', 'amide_form'], intermediates: ['amide'] }, desc: 'Convert to an amide, then use Hofmann Degradation to step-down the carbon chain.' }, 
            
            { start: 'nitrile', target: 'ester', steps: 2, solution: { conditions: ['hydrolysis_acid', 'esterify'], intermediates: ['carboxylic_acid'] }, desc: 'Hydrolyze the nitrile to a carboxylic acid, followed by condensation with an alcohol.' }
        ];

        // --- PATHFINDER ALGORITHM (BFS) ---
        const findPath = (startId, endId) => {
            if (startId === endId) return [];
            let queue = [[{ node: startId, condition: null }]];
            let visited = new Set();
            visited.add(startId);

            // Build adjacency list strictly from 1-step conversions
            const adj = {};
            PATHWAYS.filter(p => p.steps === 1).forEach(p => {
                if (!adj[p.start]) adj[p.start] = [];
                adj[p.start].push({ to: p.target, condition: p.solution.conditions[0] });
            });

            while (queue.length > 0) {
                let path = queue.shift();
                let lastStep = path[path.length - 1];
                let currentNode = lastStep.node;

                if (currentNode === endId) {
                    return path.slice(1); // Return path excluding the start node initial entry
                }

                if (adj[currentNode]) {
                    for (let edge of adj[currentNode]) {
                        if (!visited.has(edge.to)) {
                            visited.add(edge.to);
                            let newPath = [...path, { node: edge.to, condition: edge.condition }];
                            queue.push(newPath);
                        }
                    }
                }
            }
            return null; // No path found
        };

        const PRESETS = [
            { title: "Step-up: Alkene to Carboxylic Acid", start: 'alkene', end: 'carboxylic_acid', desc: "Extend chain via Nitrile or direct hydration + oxidation." },
            { title: "Step-down: Carboxylic Acid to Amine", start: 'carboxylic_acid', end: 'amine', desc: "Using Hofmann Degradation to remove a carbon." },
            { title: "Alcohol to Amide", start: 'primary_alcohol', end: 'amide', desc: "Via Carboxylic Acid or Acyl Chloride." },
            { title: "Halogenoalkane to Ester", start: 'halogenoalkane', end: 'ester', desc: "Convert to alcohol first, then esterify." },
            { title: "Alkane to Amine", start: 'alkane', end: 'amine', desc: "From unreactive alkane to reactive amine." }
        ];

        function App() {
            // --- GLOBAL APP MODE ---
            const [appMode, setAppMode] = useState('practice'); // 'practice' or 'pathfinder'

            // --- PRACTICE MODE STATE ---
            const [startPoint, setStartPoint] = useState('alkene');
            const [endPoint, setEndPoint] = useState('primary_alcohol');
            const [availablePathways, setAvailablePathways] = useState([]);
            const [selectedPathIndex, setSelectedPathIndex] = useState(0);
            const puzzle = availablePathways[selectedPathIndex] || null;
            const [slots, setSlots] = useState({ conditions: [], molecules: [] });
            const [validation, setValidation] = useState({ conditions: [], molecules: [], isChecked: false, isSuccess: false });
            const [draggedItem, setDraggedItem] = useState(null);
            const [dragOverInfo, setDragOverInfo] = useState(null);
            const [showSolutionModal, setShowSolutionModal] = useState(false);

            // --- PATHFINDER MODE STATE ---
            const [pfStart, setPfStart] = useState('alkene');
            const [pfEnd, setPfEnd] = useState('carboxylic_acid');
            
            // Calculate dynamic path via BFS
            const pfPath = useMemo(() => {
                return findPath(pfStart, pfEnd);
            }, [pfStart, pfEnd]);

            let totalCChange = 0;
            if (pfPath) {
                totalCChange = pfPath.reduce((acc, step) => {
                    const cond = CONDITIONS[step.condition];
                    if (cond && cond.extendsChain) return acc + 1;
                    if (cond && cond.reducesChain) return acc - 1;
                    return acc;
                }, 0);
            }

            // --- PRACTICE MODE LOGIC ---
            useEffect(() => {
                if (appMode !== 'practice') return;
                const foundPathways = PATHWAYS.filter(p => p.start === startPoint && p.target === endPoint)
                                              .sort((a, b) => a.steps - b.steps);
                setAvailablePathways(foundPathways);
                setSelectedPathIndex(0);
            }, [startPoint, endPoint, appMode]);

            useEffect(() => {
                if (appMode !== 'practice') return;
                if (puzzle) {
                    setSlots({
                        conditions: Array(puzzle.steps).fill(null),
                        molecules: Array(puzzle.steps - 1).fill(null)
                    });
                    setValidation({
                        conditions: Array(puzzle.steps).fill(null),
                        molecules: Array(puzzle.steps - 1).fill(null),
                        isChecked: false,
                        isSuccess: false
                    });
                }
            }, [puzzle, appMode]);

            const resetPuzzle = () => {
                if (!puzzle) return;
                setSlots({
                    conditions: Array(puzzle.steps).fill(null),
                    molecules: Array(puzzle.steps - 1).fill(null)
                });
                setValidation({
                    conditions: Array(puzzle.steps).fill(null),
                    molecules: Array(puzzle.steps - 1).fill(null),
                    isChecked: false,
                    isSuccess: false
                });
            };

            const handleDragStart = (e, item, type) => {
                setDraggedItem({ ...item, type });
                e.dataTransfer.effectAllowed = 'copy';
                e.dataTransfer.setData('text/plain', item.id);
            };

            const handleDragOver = (e, index, type) => {
                e.preventDefault();
                if (draggedItem && draggedItem.type === type) {
                    setDragOverInfo({ index, type });
                }
            };

            const handleDragLeave = () => {
                setDragOverInfo(null);
            };

            const handleDrop = (e, index, type) => {
                e.preventDefault();
                setDragOverInfo(null);
                
                if (draggedItem && draggedItem.type === type) {
                    const newSlots = { ...slots };
                    newSlots[type === 'condition' ? 'conditions' : 'molecules'][index] = draggedItem.id;
                    setSlots(newSlots);
                    setValidation(prev => ({ ...prev, isChecked: false })); 
                }
                setDraggedItem(null);
            };

            const removeSlotItem = (index, type) => {
                const newSlots = { ...slots };
                newSlots[type === 'condition' ? 'conditions' : 'molecules'][index] = null;
                setSlots(newSlots);
                setValidation(prev => ({ ...prev, isChecked: false }));
            };

            const verifySynthesis = () => {
                if (!puzzle) return;
                let allCorrect = true;
                
                const condVals = slots.conditions.map((c, i) => {
                    const isCorrect = c === puzzle.solution.conditions[i];
                    if (!isCorrect) allCorrect = false;
                    return isCorrect;
                });
                
                const molVals = slots.molecules.map((m, i) => {
                    const isCorrect = m === puzzle.solution.intermediates[i];
                    if (!isCorrect) allCorrect = false;
                    return isCorrect;
                });

                if (slots.conditions.includes(null) || slots.molecules.includes(null)) {
                    allCorrect = false;
                }

                setValidation({
                    conditions: condVals,
                    molecules: molVals,
                    isChecked: true,
                    isSuccess: allCorrect
                });
            };

            // --- RENDER HELPERS (Practice Mode) ---
            const renderConditionSlot = (index) => {
                const itemId = slots.conditions[index];
                const item = itemId ? CONDITIONS[itemId] : null;
                const isOver = dragOverInfo && dragOverInfo.type === 'condition' && dragOverInfo.index === index;
                
                let valClass = '';
                if (validation.isChecked) {
                    valClass = validation.conditions[index] ? 'status-correct' : 'status-incorrect';
                }

                return (
                    <div className="flex flex-col items-center justify-center relative w-48 mx-2 shrink-0">
                        <div className="absolute top-1/2 left-0 w-full h-1 bg-slate-600 -translate-y-1/2 z-0"></div>
                        <div className="absolute top-1/2 right-0 w-3 h-3 border-t-4 border-r-4 border-slate-600 transform rotate-45 -translate-y-1/2 -translate-x-1 z-0"></div>
                        
                        <div 
                            onDragOver={(e) => handleDragOver(e, index, 'condition')}
                            onDragLeave={handleDragLeave}
                            onDrop={(e) => handleDrop(e, index, 'condition')}
                            className={`relative z-10 w-40 min-h-[64px] bg-[#1E293B] rounded-lg border-2 flex items-center justify-center p-2 text-center cursor-pointer shadow-md
                                ${isOver ? 'border-purple-500 bg-purple-900/20' : 'border-slate-500'}
                                ${!item ? 'border-dashed' : 'border-solid bg-slate-800'}
                                ${valClass}
                            `}
                        >
                            {item ? (
                                <div className="flex flex-col items-center justify-center w-full relative">
                                    {item.extendsChain && <span className="absolute -top-6 -left-3 bg-emerald-600 text-white text-[9px] font-bold px-1.5 py-0.5 rounded-full border border-emerald-400 shadow-sm z-20">+1 C</span>}
                                    {item.reducesChain && <span className="absolute -top-6 -left-3 bg-rose-600 text-white text-[9px] font-bold px-1.5 py-0.5 rounded-full border border-rose-400 shadow-sm z-20">-1 C</span>}
                                    <span dangerouslySetInnerHTML={{ __html: item.html }} className="text-[11px] font-mono text-purple-300"></span>
                                    <button onClick={() => removeSlotItem(index, 'condition')} className="absolute -top-2 -right-2 bg-slate-700 hover:bg-red-500 rounded-full w-5 h-5 flex items-center justify-center text-white text-xs transition z-20">×</button>
                                </div>
                            ) : (
                                <span className="text-[10px] uppercase font-bold text-slate-500 tracking-wider">Drop Conditions</span>
                            )}
                        </div>
                    </div>
                );
            };

            const renderMoleculeSlot = (index) => {
                const itemId = slots.molecules[index];
                const item = itemId ? GROUPS[itemId] : null;
                const isOver = dragOverInfo && dragOverInfo.type === 'molecule' && dragOverInfo.index === index;
                
                let valClass = '';
                if (validation.isChecked) {
                    valClass = validation.molecules[index] ? 'status-correct' : 'status-incorrect';
                }

                return (
                    <div 
                        onDragOver={(e) => handleDragOver(e, index, 'molecule')}
                        onDragLeave={handleDragLeave}
                        onDrop={(e) => handleDrop(e, index, 'molecule')}
                        className={`relative z-10 w-40 min-h-[80px] bg-slate-900 rounded-xl border-2 flex flex-col items-center justify-center p-3 text-center shrink-0 shadow-lg
                            ${isOver ? 'border-blue-500 bg-blue-900/20' : 'border-slate-500'}
                            ${!item ? 'border-dashed' : 'border-solid'}
                            ${valClass}
                        `}
                    >
                        {item ? (
                            <div className="flex flex-col items-center justify-center w-full">
                                <span className="text-[10px] text-slate-400 uppercase tracking-widest mb-1">{item.name}</span>
                                <span dangerouslySetInnerHTML={{ __html: item.html }} className="text-sm font-bold font-mono text-blue-400"></span>
                                <button onClick={() => removeSlotItem(index, 'molecule')} className="absolute -top-2 -right-2 bg-slate-700 hover:bg-red-500 rounded-full w-5 h-5 flex items-center justify-center text-white text-xs transition">×</button>
                            </div>
                        ) : (
                            <span className="text-[10px] uppercase font-bold text-slate-500 tracking-wider">Drop Intermediate</span>
                        )}
                    </div>
                );
            };

            return (
                <div className="flex flex-col h-full w-full">
                    {/* Header */}
                    <header className="bg-[#1E293B] border-b border-slate-800 p-4 shrink-0 flex flex-col sm:flex-row justify-between items-center z-20 shadow-lg gap-4">
                        <div>
                            <h1 className="text-xl md:text-2xl font-bold text-white flex items-center gap-2 tracking-tight">
                                <Icons.Map /> Organic Synthesis Map
                            </h1>
                            <p className="text-xs md:text-sm text-slate-400 mt-1 hidden sm:block">
                                Construct functional group interconversion pathways.
                            </p>
                        </div>
                        <div className="flex bg-slate-900 border border-slate-700 p-1 rounded-lg">
                            <button 
                                onClick={() => setAppMode('practice')} 
                                className={`px-4 py-1.5 rounded-md text-xs font-bold transition ${appMode === 'practice' ? 'bg-purple-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}>
                                Practice Mode
                            </button>
                            <button 
                                onClick={() => setAppMode('pathfinder')} 
                                className={`px-4 py-1.5 rounded-md text-xs font-bold transition ${appMode === 'pathfinder' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}>
                                Pathfinder
                            </button>
                        </div>
                    </header>

                    {/* MAIN CONTENT: PRACTICE MODE */}
                    {appMode === 'practice' && (
                        <main className="flex-1 flex flex-col lg:flex-row gap-6 p-4 md:p-6 overflow-hidden max-w-7xl w-full mx-auto fade-in">
                            
                            {/* LEFT: Task & Validation */}
                            <section className="flex flex-col gap-4 w-full lg:w-80 shrink-0 overflow-y-auto pr-2">
                                <div className="bg-[#1E293B] p-5 rounded-xl border border-slate-700 shadow-lg flex flex-col gap-4">
                                    <h2 className="text-sm uppercase font-bold text-slate-400 border-b border-slate-700 pb-2">1. Select Target Pathway</h2>
                                    
                                    <div className="flex flex-col gap-1">
                                        <label className="text-[10px] uppercase font-bold text-slate-500 tracking-wider">Starting Point</label>
                                        <select value={startPoint} onChange={e => setStartPoint(e.target.value)}
                                            className="bg-slate-900 border border-slate-600 rounded p-2 text-white font-bold outline-none focus:border-purple-500 w-full">
                                            {Object.values(GROUPS).map(g => <option key={g.id} value={g.id}>{g.name}</option>)}
                                        </select>
                                    </div>

                                    <div className="flex flex-col gap-1">
                                        <label className="text-[10px] uppercase font-bold text-slate-500 tracking-wider">End Point</label>
                                        <select value={endPoint} onChange={e => setEndPoint(e.target.value)}
                                            className="bg-slate-900 border border-slate-600 rounded p-2 text-white font-bold outline-none focus:border-purple-500 w-full">
                                            {Object.values(GROUPS).map(g => <option key={g.id} value={g.id}>{g.name}</option>)}
                                        </select>
                                    </div>

                                    {/* Alternate Pathway Selector */}
                                    {availablePathways.length > 1 && (
                                        <div className="flex flex-col gap-1 mt-2 p-3 bg-blue-900/20 border border-blue-500/30 rounded-lg fade-in">
                                            <label className="text-[10px] uppercase font-bold text-blue-400 tracking-wider mb-1">Multiple Routes Detected</label>
                                            <div className="flex gap-2">
                                                {availablePathways.map((p, idx) => (
                                                    <button key={idx} onClick={() => setSelectedPathIndex(idx)}
                                                        className={`flex-1 py-1.5 text-xs font-bold rounded transition ${selectedPathIndex === idx ? 'bg-blue-600 text-white shadow-md' : 'bg-slate-800 text-slate-400 border border-slate-600 hover:bg-slate-700'}`}>
                                                        {p.steps}-Step Route
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                    
                                    {puzzle ? (
                                        <div className="bg-purple-900/20 border border-purple-800/50 p-3 rounded-lg fade-in mt-1">
                                            <p className="text-xs text-slate-300 leading-relaxed">{puzzle.desc}</p>
                                        </div>
                                    ) : (
                                        <div className="bg-rose-900/20 border border-rose-800/50 p-3 rounded-lg fade-in mt-1">
                                            <p className="text-xs text-rose-300 leading-relaxed font-bold">No standard syllabus pathway defined for this direct combination. Switch to Pathfinder to search all possibilities.</p>
                                        </div>
                                    )}
                                </div>

                                <div className="bg-[#1E293B] p-5 rounded-xl border border-slate-700 shadow-lg flex-1 flex flex-col gap-4">
                                    <h2 className="text-sm uppercase font-bold text-slate-400 border-b border-slate-700 pb-2">Analysis Panel</h2>
                                    
                                    <div className="flex-1 flex flex-col justify-center items-center text-center p-4">
                                        {!puzzle ? (
                                            <div className="text-slate-500 text-sm italic">Pathway inactive.</div>
                                        ) : validation.isChecked ? (
                                            validation.isSuccess ? (
                                                <div className="fade-in">
                                                    <div className="w-16 h-16 bg-emerald-500/20 rounded-full flex items-center justify-center mx-auto mb-3 text-emerald-400">
                                                        <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>
                                                    </div>
                                                    <h3 className="text-xl font-bold text-emerald-400">Synthesis Valid</h3>
                                                    <p className="text-xs text-slate-400 mt-2">The reaction pathway is chemically sound.</p>
                                                </div>
                                            ) : (
                                                <div className="fade-in">
                                                    <div className="w-16 h-16 bg-red-500/20 rounded-full flex items-center justify-center mx-auto mb-3 text-red-400">
                                                        <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                                                    </div>
                                                    <h3 className="text-xl font-bold text-red-400">Invalid Pathway</h3>
                                                    <p className="text-xs text-slate-400 mt-2">Check highlighted red nodes for errors in reagents or intermediates.</p>
                                                </div>
                                            )
                                        ) : (
                                            <div className="text-slate-500 text-sm italic">
                                                Construct the map and click verify.
                                            </div>
                                        )}
                                    </div>

                                    {puzzle && (
                                        <div className="flex flex-col gap-2 mt-auto">
                                            <div className="flex gap-2">
                                                <button onClick={resetPuzzle} className="bg-slate-800 border border-slate-600 hover:bg-slate-700 text-white px-3 py-2 rounded font-bold transition flex items-center justify-center">
                                                    <Icons.Refresh />
                                                </button>
                                                <button onClick={verifySynthesis} className="flex-1 bg-purple-600 hover:bg-purple-500 text-white px-4 py-2 rounded font-bold transition flex items-center justify-center gap-2 shadow-lg shadow-purple-900/50">
                                                    <Icons.Check /> Verify Synthesis
                                                </button>
                                            </div>
                                            <button onClick={() => setShowSolutionModal(true)} className="w-full bg-slate-800 border border-slate-600 hover:bg-slate-700 text-slate-300 font-bold py-2 rounded transition flex items-center justify-center gap-2 text-xs">
                                                <Icons.BookOpen /> Show Complete Route (Revision)
                                            </button>
                                        </div>
                                    )}
                                </div>
                            </section>

                            {/* CENTER: The Flowchart Canvas */}
                            <section className="flex-1 flex flex-col min-w-0">
                                <div className="bg-[#1E293B] rounded-xl border border-slate-700 p-6 shadow-lg h-full flex flex-col relative overflow-hidden">
                                    <h2 className="text-sm uppercase font-bold text-slate-400 border-b border-slate-700 pb-2 mb-8">2. Reaction Pathway Map</h2>
                                    
                                    <div className="flex-1 overflow-x-auto flex items-center px-4 pb-4">
                                        {!puzzle ? (
                                            <div className="m-auto text-slate-500 italic flex flex-col items-center gap-2 opacity-50">
                                                <Icons.Map />
                                                <span>Map is awaiting a valid pathway selection.</span>
                                            </div>
                                        ) : (
                                            <div className="flex items-center mx-auto min-w-max fade-in">
                                                
                                                {/* START NODE */}
                                                <div className="relative z-10 w-40 min-h-[80px] bg-slate-800 rounded-xl border-2 border-emerald-500 flex flex-col items-center justify-center p-3 text-center shrink-0 shadow-[0_0_20px_rgba(16,185,129,0.15)]">
                                                    <span className="absolute -top-3 left-1/2 -translate-x-1/2 bg-emerald-900/80 text-emerald-400 text-[10px] px-2 py-0.5 rounded uppercase font-bold tracking-widest border border-emerald-500">Start</span>
                                                    <span className="text-[10px] text-slate-400 uppercase tracking-widest mb-1 mt-1">{GROUPS[puzzle.start].name}</span>
                                                    <span dangerouslySetInnerHTML={{ __html: GROUPS[puzzle.start].html }} className="text-sm font-bold font-mono text-emerald-400"></span>
                                                </div>

                                                {/* DYNAMIC STEPS */}
                                                {Array.from({ length: puzzle.steps }).map((_, i) => (
                                                    <React.Fragment key={i}>
                                                        {renderConditionSlot(i)}
                                                        {i < puzzle.steps - 1 && renderMoleculeSlot(i)}
                                                    </React.Fragment>
                                                ))}

                                                {/* TARGET NODE */}
                                                <div className="relative z-10 w-40 min-h-[80px] bg-slate-800 rounded-xl border-2 border-rose-500 flex flex-col items-center justify-center p-3 text-center shrink-0 shadow-[0_0_20px_rgba(244,63,94,0.15)]">
                                                    <span className="absolute -top-3 left-1/2 -translate-x-1/2 bg-rose-900/80 text-rose-400 text-[10px] px-2 py-0.5 rounded uppercase font-bold tracking-widest border border-rose-500">Target</span>
                                                    <span className="text-[10px] text-slate-400 uppercase tracking-widest mb-1 mt-1">{GROUPS[puzzle.target].name}</span>
                                                    <span dangerouslySetInnerHTML={{ __html: GROUPS[puzzle.target].html }} className="text-sm font-bold font-mono text-rose-400"></span>
                                                </div>

                                            </div>
                                        )}
                                    </div>
                                </div>
                            </section>

                            {/* RIGHT: Inventory / Toolbox */}
                            <section className="flex flex-col gap-4 w-full lg:w-72 shrink-0 overflow-y-auto">
                                
                                {/* Reagents / Conditions */}
                                <div className="bg-[#1E293B] rounded-xl border border-slate-700 p-4 shadow-lg flex flex-col h-1/2 opacity-100 transition-opacity" style={{ opacity: puzzle ? 1 : 0.3 }}>
                                    <h2 className="text-sm uppercase font-bold text-purple-400 border-b border-purple-900/50 pb-2 mb-3 flex items-center gap-2">
                                        <Icons.Flask /> Reagents & Conditions
                                    </h2>
                                    <div className="flex-1 overflow-y-auto pr-1 flex flex-col gap-2">
                                        {Object.values(CONDITIONS).map(cond => (
                                            <div 
                                                key={cond.id} 
                                                draggable={!!puzzle}
                                                onDragStart={(e) => handleDragStart(e, cond, 'condition')}
                                                className={`relative bg-slate-800 border border-slate-600 p-2 rounded transition ${puzzle ? 'cursor-grab active:cursor-grabbing hover:border-purple-500 hover:bg-slate-700' : 'cursor-not-allowed opacity-50'}`}
                                            >
                                                {cond.extendsChain && <span className="absolute -top-2 -left-2 bg-emerald-600 text-white text-[9px] font-bold px-1.5 py-0.5 rounded-full border border-emerald-400 shadow-sm z-10">+1 C</span>}
                                                {cond.reducesChain && <span className="absolute -top-2 -left-2 bg-rose-600 text-white text-[9px] font-bold px-1.5 py-0.5 rounded-full border border-rose-400 shadow-sm z-10">-1 C</span>}
                                                <div className="text-[10px] text-slate-400 font-bold uppercase mb-1">{cond.name}</div>
                                                <div dangerouslySetInnerHTML={{ __html: cond.html }} className="text-xs font-mono text-purple-300"></div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* Intermediates */}
                                <div className="bg-[#1E293B] rounded-xl border border-slate-700 p-4 shadow-lg flex flex-col h-1/2 opacity-100 transition-opacity" style={{ opacity: puzzle ? 1 : 0.3 }}>
                                    <h2 className="text-sm uppercase font-bold text-blue-400 border-b border-blue-900/50 pb-2 mb-3 flex items-center gap-2">
                                        <Icons.Molecule /> Functional Groups
                                    </h2>
                                    <div className="flex-1 overflow-y-auto pr-1 flex flex-col gap-2">
                                        {Object.values(GROUPS).filter(m => !puzzle || (m.id !== puzzle.start && m.id !== puzzle.target)).map(mol => (
                                            <div 
                                                key={mol.id} 
                                                draggable={!!puzzle}
                                                onDragStart={(e) => handleDragStart(e, mol, 'molecule')}
                                                className={`bg-slate-800 border border-slate-600 p-2 rounded flex flex-col transition ${puzzle ? 'cursor-grab active:cursor-grabbing hover:border-blue-500 hover:bg-slate-700' : 'cursor-not-allowed opacity-50'}`}
                                            >
                                                <span dangerouslySetInnerHTML={{ __html: mol.html }} className="font-bold font-mono text-blue-400 text-sm"></span>
                                                <span className="text-[10px] text-slate-400 mt-1 uppercase tracking-wider">{mol.name}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                            </section>
                        </main>
                    )}

                    {/* MAIN CONTENT: PATHFINDER MODE */}
                    {appMode === 'pathfinder' && (
                        <main className="flex-1 flex flex-col lg:flex-row p-0 overflow-hidden w-full fade-in">
                            
                            {/* Sidebar: Controls & Examples */}
                            <div className="w-full lg:w-80 bg-slate-900 border-r border-slate-800 p-6 flex flex-col gap-6 overflow-y-auto shrink-0 shadow-xl z-10">
                                
                                {/* Selectors */}
                                <div className="space-y-4">
                                    <div className="bg-slate-800 p-4 rounded-2xl border border-slate-700">
                                        <label className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-2">
                                            <Icons.MapPin /> Starting Material
                                        </label>
                                        <select 
                                            value={pfStart} 
                                            onChange={(e) => setPfStart(e.target.value)}
                                            className="w-full bg-slate-900 text-white p-3 rounded-xl border border-slate-600 focus:border-emerald-500 outline-none font-bold"
                                        >
                                            {Object.values(GROUPS).map(g => (
                                                <option key={g.id} value={g.id}>{g.name}</option>
                                            ))}
                                        </select>
                                    </div>

                                    <div className="flex justify-center -my-3 relative z-10">
                                        <div className="bg-slate-700 p-1 rounded-full border-4 border-slate-900">
                                            <Icons.ArrowDown />
                                        </div>
                                    </div>

                                    <div className="bg-slate-800 p-4 rounded-2xl border border-slate-700">
                                        <label className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-2">
                                            <Icons.Flag /> Target Product
                                        </label>
                                        <select 
                                            value={pfEnd} 
                                            onChange={(e) => setPfEnd(e.target.value)}
                                            className="w-full bg-slate-900 text-white p-3 rounded-xl border border-slate-600 focus:border-emerald-500 outline-none font-bold"
                                        >
                                            {Object.values(GROUPS).map(g => (
                                                <option key={g.id} value={g.id} disabled={g.id === pfStart}>{g.name}</option>
                                            ))}
                                        </select>
                                    </div>
                                </div>

                                {/* Presets */}
                                <div className="mt-auto">
                                    <label className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3 block">Common Routes</label>
                                    <div className="space-y-2">
                                        {PRESETS.map((ex, i) => (
                                            <button 
                                                key={i}
                                                onClick={() => { setPfStart(ex.start); setPfEnd(ex.end); }}
                                                className="w-full text-left p-3 rounded-xl bg-slate-800/50 hover:bg-slate-800 border border-slate-700 hover:border-slate-600 transition-all group"
                                            >
                                                <div className="text-sm font-bold text-emerald-400 group-hover:text-emerald-300">{ex.title}</div>

                            <div className="flex-1 bg-[#0F172A] relative overflow-y-auto">
                                <div className="max-w-4xl mx-auto p-8 md:p-12 min-h-full flex flex-col">
                                    
                                    {/* Route Summary Header */}
                                    <div className="flex items-center justify-between mb-12 border-b border-slate-800 pb-6">
                                        <div>
                                            <h2 className="text-2xl font-bold text-white flex items-center gap-3">
                                                Complete Route
                                                {pfPath && <span className="px-3 py-1 bg-emerald-500/20 text-emerald-400 text-xs rounded-full border border-emerald-500/50">{pfPath.length} Steps</span>}
                                            </h2>
                                            <div className="flex items-center gap-2 mt-2 text-slate-400 font-mono text-sm">
                                                <span>{GROUPS[pfStart].name}</span>
                                                <Icons.ArrowRight />
                                                <span>{GROUPS[pfEnd].name}</span>
                                            </div>
                                        </div>
                                        <div className="hidden md:block text-right">
                                            <div className="text-xs font-bold text-slate-500 uppercase mb-1">Carbon Chain Change</div>
                                            <div className="text-sm text-white">
                                                <span className={totalCChange > 0 ? 'text-emerald-400 font-bold' : totalCChange < 0 ? 'text-rose-400 font-bold' : 'text-slate-400'}>
                                                    {totalCChange > 0 ? `+${totalCChange} Step Up` : 
                                                     totalCChange < 0 ? `${totalCChange} Step Down` : 'No Change'}
                                                </span>
                                            </div>
                                        </div>
                                    </div>

                                    {/* The Vertical Path Visualization */}
                                    <div className="relative flex-1 pb-20">
                                        {/* Vertical connecting line */}
                                        <div className="absolute left-8 top-4 bottom-0 w-1 bg-slate-800 rounded-full"></div>

                                        {!pfPath ? (
                                            <div className="flex flex-col items-center justify-center h-64 text-slate-500 fade-in">
                                                <Icons.SearchX />
                                                <p className="mt-4 font-bold text-slate-400">No direct synthesis path found in the database.</p>
                                                <p className="text-xs mt-2">Try an intermediate target first or evaluate if the reaction requires more complex functionalization.</p>
                                            </div>
                                        ) : (
                                            <>
                                                {/* START NODE */}
                                                <div className="relative pl-24 mb-8 step-card" style={{animationDelay: '0ms'}}>
                                                    <div className="absolute left-0 top-0 w-16 h-16 bg-slate-800 rounded-2xl border-4 border-[#0F172A] flex items-center justify-center shadow-lg z-10">
                                                        <div className="font-bold text-white text-xs">START</div>
                                                    </div>
                                                    <div className={`p-5 rounded-2xl border border-slate-700 ${GROUPS[pfStart].bgClass}`}>
                                                        <h3 className={`text-xl font-bold ${GROUPS[pfStart].colorClass}`}>{GROUPS[pfStart].name}</h3>
                                                        <p className="text-slate-300 font-mono mt-1 text-sm" dangerouslySetInnerHTML={{ __html: GROUPS[pfStart].html }}></p>
                                                    </div>
                                                </div>

                                                {/* STEPS */}
                                                {pfPath.map((step, idx) => {
                                                    const group = GROUPS[step.node];
                                                    const rxn = CONDITIONS[step.condition];
                                                    
                                                    return (
                                                        <div key={idx} className="relative pl-24 mb-8 step-card" style={{animationDelay: `${(idx+1) * 150}ms`}}>
                                                            
                                                            {/* Reaction Card */}
                                                            <div className="mb-4 -ml-4">
                                                                <div className="inline-block bg-slate-900 border border-slate-600 rounded-lg p-3 shadow-xl transform -translate-y-2 relative">
                                                                    {rxn.extendsChain && <span className="absolute -top-3 -right-3 bg-emerald-600 text-white text-[9px] font-bold px-1.5 py-0.5 rounded-full border border-emerald-400 shadow-sm">+1 C</span>}
                                                                    {rxn.reducesChain && <span className="absolute -top-3 -right-3 bg-rose-600 text-white text-[9px] font-bold px-1.5 py-0.5 rounded-full border border-rose-400 shadow-sm">-1 C</span>}
                                                                    
                                                                    <div className="text-xs text-slate-500 uppercase font-bold mb-1 flex items-center gap-1">
                                                                        <Icons.Flask /> Reagents & Conditions
                                                                    </div>
                                                                    <div className="font-mono font-bold text-purple-300 text-sm" dangerouslySetInnerHTML={{ __html: rxn.html }}></div>
                                                                    <div className="flex items-center gap-2 mt-2">
                                                                        <span className="text-[10px] bg-slate-800 px-2 py-0.5 rounded text-slate-300 border border-slate-700">{rxn.name}</span>
                                                                    </div>
                                                                </div>
                                                            </div>

                                                            {/* Icon Node */}
                                                            <div className="absolute left-0 top-12 w-16 h-16 bg-slate-800 rounded-2xl border-4 border-[#0F172A] flex items-center justify-center shadow-lg z-10">
                                                                <span className="text-slate-500 font-mono text-sm">{idx + 1}</span>
                                                            </div>

                                                            {/* Compound Card */}
                                                            <div className={`p-5 rounded-2xl border border-slate-700 shadow-md transition-all hover:scale-[1.01] ${group.bgClass}`}>
                                                                <div className="flex justify-between items-start">
                                                                    <div>
                                                                        <h3 className={`text-xl font-bold ${group.colorClass}`}>{group.name}</h3>
                                                                        <p className="text-slate-200 font-mono mt-1 text-sm" dangerouslySetInnerHTML={{ __html: group.html }}></p>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    );
                                                })}

                                                {/* END NODE (Visual Marker) */}
                                                <div className="absolute left-6 bottom-0 w-4 h-4 bg-emerald-500 rounded-full border-4 border-[#0F172A] z-20"></div>
                                            </>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </main>
                    )}

                    {/* SOLUTION MODAL (Practice Mode Only) */}
                    {showSolutionModal && puzzle && appMode === 'practice' && (
                        <div className="absolute inset-0 z-50 flex items-center justify-center bg-[#0F172A]/80 backdrop-blur-sm p-4 fade-in">
                            <div className="bg-[#1E293B] border-2 border-slate-600 rounded-2xl p-6 max-w-4xl w-full shadow-2xl flex flex-col">
                                
                                <div className="flex justify-between items-center border-b border-slate-700 pb-4 mb-6">
                                    <h2 className="text-xl font-bold text-white flex items-center gap-2">
                                        <Icons.BookOpen /> Complete Route: {GROUPS[puzzle.start].name} to {GROUPS[puzzle.target].name}
                                    </h2>
                                    <button onClick={() => setShowSolutionModal(false)} className="text-slate-400 hover:text-white transition">
                                        <Icons.X />
                                    </button>
                                </div>

                                <div className="flex items-center overflow-x-auto pb-4 gap-4 justify-center">
                                    
                                    {/* START */}
                                    <div className="flex flex-col items-center justify-center p-3 text-center shrink-0">
                                        <span className="text-[10px] text-slate-400 uppercase tracking-widest mb-2">{GROUPS[puzzle.start].name}</span>
                                        <span dangerouslySetInnerHTML={{ __html: GROUPS[puzzle.start].html }} className="text-xl font-bold font-mono text-emerald-400"></span>
                                    </div>

                                    {Array.from({ length: puzzle.steps }).map((_, i) => {
                                        const cond = CONDITIONS[puzzle.solution.conditions[i]];
                                        return (
                                        <React.Fragment key={i}>
                                            {/* CONDITION ARROW */}
                                            <div className="flex flex-col items-center justify-center relative w-48 shrink-0">
                                                <div className="absolute top-1/2 left-0 w-full h-1 bg-slate-500 -translate-y-1/2 z-0"></div>
                                                <div className="absolute top-1/2 right-0 w-3 h-3 border-t-4 border-r-4 border-slate-500 transform rotate-45 -translate-y-1/2 -translate-x-1 z-0"></div>
                                                <div className="relative z-10 bg-[#1E293B] px-3 py-2 text-center rounded border border-slate-600">
                                                    {cond.extendsChain && <span className="absolute -top-3 -left-3 bg-emerald-600 text-white text-[9px] font-bold px-1.5 py-0.5 rounded-full border border-emerald-400 shadow-sm">+1 C</span>}
                                                    {cond.reducesChain && <span className="absolute -top-3 -left-3 bg-rose-600 text-white text-[9px] font-bold px-1.5 py-0.5 rounded-full border border-rose-400 shadow-sm">-1 C</span>}
                                                    <span dangerouslySetInnerHTML={{ __html: cond.html }} className="text-[10px] font-mono text-purple-300 leading-tight block"></span>
                                                </div>
                                            </div>

                                            {/* INTERMEDIATE OR TARGET */}
                                            {i < puzzle.steps - 1 ? (
                                                <div className="flex flex-col items-center justify-center p-3 text-center shrink-0">
                                                    <span className="text-[10px] text-slate-400 uppercase tracking-widest mb-2">{GROUPS[puzzle.solution.intermediates[i]].name}</span>
                                                    <span dangerouslySetInnerHTML={{ __html: GROUPS[puzzle.solution.intermediates[i]].html }} className="text-xl font-bold font-mono text-blue-400"></span>
                                                </div>
                                            ) : (
                                                <div className="flex flex-col items-center justify-center p-3 text-center shrink-0">
                                                    <span className="text-[10px] text-slate-400 uppercase tracking-widest mb-2">{GROUPS[puzzle.target].name}</span>
                                                    <span dangerouslySetInnerHTML={{ __html: GROUPS[puzzle.target].html }} className="text-xl font-bold font-mono text-rose-400"></span>
                                                </div>
                                            )}
                                        </React.Fragment>
                                    )})}

                                </div>

                                <div className="mt-4 pt-4 border-t border-slate-700 flex justify-end">
                                    <button onClick={() => setShowSolutionModal(false)} className="bg-slate-700 hover:bg-slate-600 text-white px-6 py-2 rounded-lg font-bold transition">
                                        Close
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
