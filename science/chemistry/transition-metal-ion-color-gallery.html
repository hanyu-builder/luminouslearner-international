<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition Metal Ion Colors Interactive | Chemistry Gallery</title>
    <meta name="description" content="Transition metal ion colors interactive. A colorimetric mapping database linking oxidation states to aqueous colors, including reactions with NaOH and NH3.">
    
    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { 
            margin: 0; 
            background-color: #0F172A; 
            color: #E2E8F0;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow-x: hidden;
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        
        .liquid-transition {
            transition: fill 0.8s ease-in-out, fill-opacity 0.8s ease-in-out, stop-color 0.8s ease-in-out, opacity 0.8s ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-in {
            animation: slideIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body>

    <div id="root" class="w-full min-h-screen max-h-[1200px] flex justify-center items-center p-4"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- DATABASE: TRANSITION METALS & REAGENTS ---
        const TM_DATA = {
            Sc: { an: 21, name: 'Scandium', electron: '[Ar] 3d¹ 4s²', states: {
                '+3': { base: { color: '#FFFFFF', opacity: 0.05, label: 'Colorless Solution', species: '[Sc(H₂O)₆]³⁺' } }
            }},
            Ti: { an: 22, name: 'Titanium', electron: '[Ar] 3d² 4s²', states: {
                '+3': { base: { color: '#8B5CF6', opacity: 0.8, label: 'Violet Solution', species: '[Ti(H₂O)₆]³⁺' } },
                '+4': { base: { color: '#FFFFFF', opacity: 0.05, label: 'Colorless Solution', species: 'TiO²⁺ (aq)' } }
            }},
            V: { an: 23, name: 'Vanadium', electron: '[Ar] 3d³ 4s²', states: {
                '+2': { base: { color: '#A855F7', opacity: 0.85, label: 'Purple Solution', species: '[V(H₂O)₆]²⁺' } },
                '+3': { base: { color: '#22C55E', opacity: 0.85, label: 'Green Solution', species: '[V(H₂O)₆]³⁺' } },
                '+4': { base: { color: '#3B82F6', opacity: 0.85, label: 'Blue Solution', species: '[VO(H₂O)₅]²⁺' } },
                '+5': { base: { color: '#EAB308', opacity: 0.85, label: 'Yellow Solution', species: '[VO₂(H₂O)₄]⁺' } }
            }},
            Cr: { an: 24, name: 'Chromium', electron: '[Ar] 3d⁵ 4s¹', states: {
                '+2': { base: { color: '#3B82F6', opacity: 0.7, label: 'Blue Solution', species: '[Cr(H₂O)₆]²⁺' } },
                '+3': { 
                    base: { color: '#16A34A', opacity: 0.85, label: 'Green Solution', species: '[Cr(H₂O)₆]³⁺' },
                    reactions: {
                        naoh_drops: { color: '#4ADE80', opacity: 0.9, label: 'Grey-Green Precipitate', species: 'Cr(OH)₃ (s)', isPpt: true },
                        naoh_excess: { color: '#14532D', opacity: 0.95, label: 'Dark Green Solution', species: '[Cr(OH)₆]³⁻', isPpt: false },
                        nh3_drops: { color: '#4ADE80', opacity: 0.9, label: 'Grey-Green Precipitate', species: 'Cr(OH)₃ (s)', isPpt: true },
                        nh3_excess: { color: '#9333EA', opacity: 0.9, label: 'Purple Solution', species: '[Cr(NH₃)₆]³⁺', isPpt: false }
                    }
                },
                '+6': { base: { color: '#F97316', opacity: 0.95, label: 'Orange Solution', species: 'Cr₂O₇²⁻' } }
            }},
            Mn: { an: 25, name: 'Manganese', electron: '[Ar] 3d⁵ 4s²', states: {
                '+2': { 
                    base: { color: '#F472B6', opacity: 0.3, label: 'Pale Pink Solution', species: '[Mn(H₂O)₆]²⁺' },
                    reactions: {
                        naoh_drops: { color: '#E5E5E5', opacity: 0.8, label: 'Off-White Precipitate', species: 'Mn(OH)₂ (s)', isPpt: true },
                        naoh_excess: { color: '#E5E5E5', opacity: 0.8, label: 'Insoluble Precipitate', species: 'Mn(OH)₂ (s)', isPpt: true },
                        nh3_drops: { color: '#E5E5E5', opacity: 0.8, label: 'Off-White Precipitate', species: 'Mn(OH)₂ (s)', isPpt: true },
                        nh3_excess: { color: '#E5E5E5', opacity: 0.8, label: 'Insoluble Precipitate', species: 'Mn(OH)₂ (s)', isPpt: true }
                    }
                },
                '+6': { base: { color: '#15803D', opacity: 0.9, label: 'Green Solution', species: 'MnO₄²⁻' } },
                '+7': { base: { color: '#9333EA', opacity: 0.95, label: 'Deep Purple Solution', species: 'MnO₄⁻' } }
            }},
            Fe: { an: 26, name: 'Iron', electron: '[Ar] 3d⁶ 4s²', states: {
                '+2': { 
                    base: { color: '#86EFAC', opacity: 0.5, label: 'Pale Green Solution', species: '[Fe(H₂O)₆]²⁺' },
                    reactions: {
                        naoh_drops: { color: '#166534', opacity: 0.9, label: 'Green Precipitate', species: 'Fe(OH)₂ (s)', isPpt: true },
                        naoh_excess: { color: '#166534', opacity: 0.9, label: 'Insoluble Precipitate', species: 'Fe(OH)₂ (s)', isPpt: true },
                        nh3_drops: { color: '#166534', opacity: 0.9, label: 'Green Precipitate', species: 'Fe(OH)₂ (s)', isPpt: true },
                        nh3_excess: { color: '#166534', opacity: 0.9, label: 'Insoluble Precipitate', species: 'Fe(OH)₂ (s)', isPpt: true }
                    }
                },
                '+3': { 
                    base: { color: '#CA8A04', opacity: 0.8, label: 'Yellow Solution', species: '[Fe(H₂O)₅(OH)]²⁺' },
                    reactions: {
                        naoh_drops: { color: '#991B1B', opacity: 0.95, label: 'Red-Brown Precipitate', species: 'Fe(OH)₃ (s)', isPpt: true },
                        naoh_excess: { color: '#991B1B', opacity: 0.95, label: 'Insoluble Precipitate', species: 'Fe(OH)₃ (s)', isPpt: true },
                        nh3_drops: { color: '#991B1B', opacity: 0.95, label: 'Red-Brown Precipitate', species: 'Fe(OH)₃ (s)', isPpt: true },
                        nh3_excess: { color: '#991B1B', opacity: 0.95, label: 'Insoluble Precipitate', species: 'Fe(OH)₃ (s)', isPpt: true }
                    }
                }
            }},
            Co: { an: 27, name: 'Cobalt', electron: '[Ar] 3d⁷ 4s²', states: {
                '+2': { 
                    base: { color: '#F43F5E', opacity: 0.8, label: 'Pink Solution', species: '[Co(H₂O)₆]²⁺' },
                    reactions: {
                        naoh_drops: { color: '#2563EB', opacity: 0.9, label: 'Blue Precipitate', species: 'Co(OH)₂ (s)', isPpt: true },
                        naoh_excess: { color: '#2563EB', opacity: 0.9, label: 'Insoluble Precipitate', species: 'Co(OH)₂ (s)', isPpt: true },
                        nh3_drops: { color: '#2563EB', opacity: 0.9, label: 'Blue Precipitate', species: 'Co(OH)₂ (s)', isPpt: true },
                        nh3_excess: { color: '#D97706', opacity: 0.85, label: 'Pale Yellow Solution', species: '[Co(NH₃)₆]²⁺', isPpt: false }
                    }
                }
            }},
            Ni: { an: 28, name: 'Nickel', electron: '[Ar] 3d⁸ 4s²', states: {
                '+2': { 
                    base: { color: '#10B981', opacity: 0.85, label: 'Green Solution', species: '[Ni(H₂O)₆]²⁺' },
                    reactions: {
                        naoh_drops: { color: '#047857', opacity: 0.95, label: 'Green Precipitate', species: 'Ni(OH)₂ (s)', isPpt: true },
                        naoh_excess: { color: '#047857', opacity: 0.95, label: 'Insoluble Precipitate', species: 'Ni(OH)₂ (s)', isPpt: true },
                        nh3_drops: { color: '#047857', opacity: 0.95, label: 'Green Precipitate', species: 'Ni(OH)₂ (s)', isPpt: true },
                        nh3_excess: { color: '#3B82F6', opacity: 0.9, label: 'Blue Solution', species: '[Ni(NH₃)₆]²⁺', isPpt: false }
                    }
                }
            }},
            Cu: { an: 29, name: 'Copper', electron: '[Ar] 3d¹⁰ 4s¹', states: {
                '+2': { 
                    base: { color: '#0EA5E9', opacity: 0.85, label: 'Blue Solution', species: '[Cu(H₂O)₆]²⁺' },
                    reactions: {
                        naoh_drops: { color: '#60A5FA', opacity: 0.9, label: 'Pale Blue Precipitate', species: 'Cu(OH)₂ (s)', isPpt: true },
                        naoh_excess: { color: '#60A5FA', opacity: 0.9, label: 'Insoluble Precipitate', species: 'Cu(OH)₂ (s)', isPpt: true },
                        nh3_drops: { color: '#60A5FA', opacity: 0.9, label: 'Pale Blue Precipitate', species: 'Cu(OH)₂ (s)', isPpt: true },
                        nh3_excess: { color: '#1E3A8A', opacity: 0.95, label: 'Deep Blue Solution', species: '[Cu(NH₃)₄(H₂O)₂]²⁺', isPpt: false }
                    }
                }
            }},
            Zn: { an: 30, name: 'Zinc', electron: '[Ar] 3d¹⁰ 4s²', states: {
                '+2': { 
                    base: { color: '#FFFFFF', opacity: 0.05, label: 'Colorless Solution', species: '[Zn(H₂O)₆]²⁺' },
                    reactions: {
                        naoh_drops: { color: '#FFFFFF', opacity: 0.8, label: 'White Precipitate', species: 'Zn(OH)₂ (s)', isPpt: true },
                        naoh_excess: { color: '#FFFFFF', opacity: 0.05, label: 'Colorless Solution', species: '[Zn(OH)₄]²⁻', isPpt: false },
                        nh3_drops: { color: '#FFFFFF', opacity: 0.8, label: 'White Precipitate', species: 'Zn(OH)₂ (s)', isPpt: true },
                        nh3_excess: { color: '#FFFFFF', opacity: 0.05, label: 'Colorless Solution', species: '[Zn(NH₃)₄]²⁺', isPpt: false }
                    }
                }
            }}
        };

        function App() {
            // --- STATE ---
            const [selectedElement, setSelectedElement] = useState('Cu');
            const [selectedState, setSelectedState] = useState('+2');
            
            // Reagent State: 0 = None, 1 = Drops, 2 = Excess
            const [naohLevel, setNaohLevel] = useState(0); 
            const [nh3Level, setNh3Level] = useState(0);

            // --- HANDLERS ---
            const handleElementChange = (symbol) => {
                setSelectedElement(symbol);
                const availableStates = Object.keys(TM_DATA[symbol].states);
                setSelectedState(availableStates[0]);
                resetReagents();
            };

            const handleStateChange = (state) => {
                setSelectedState(state);
                resetReagents();
            };

            const resetReagents = () => {
                setNaohLevel(0);
                setNh3Level(0);
            };

            const handleNaohClick = () => {
                if (naohLevel === 0) {
                    setNaohLevel(1);
                    setNh3Level(0); // Cannot mix both in this sim
                } else if (naohLevel === 1) {
                    setNaohLevel(2);
                }
            };

            const handleNh3Click = () => {
                if (nh3Level === 0) {
                    setNh3Level(1);
                    setNaohLevel(0); // Cannot mix both in this sim
                } else if (nh3Level === 1) {
                    setNh3Level(2);
                }
            };

            // --- DATA RESOLUTION ---
            const elementData = TM_DATA[selectedElement];
            const stateData = elementData.states[selectedState];
            const hasReactions = !!stateData.reactions;

            // Determine what is currently in the flask
            let currentDisplay = stateData.base;
            
            if (hasReactions) {
                if (naohLevel === 1) currentDisplay = stateData.reactions.naoh_drops;
                if (naohLevel === 2) currentDisplay = stateData.reactions.naoh_excess;
                if (nh3Level === 1) currentDisplay = stateData.reactions.nh3_drops;
                if (nh3Level === 2) currentDisplay = stateData.reactions.nh3_excess;
            }

            const { color, opacity, label, species, isPpt } = currentDisplay;

            return (
                <div className="w-full max-w-7xl h-full flex flex-col bg-slate-900 border border-slate-700 rounded-3xl shadow-2xl overflow-hidden">
                    
                    {/* Header */}
                    <header className="bg-slate-800/80 backdrop-blur p-6 border-b border-slate-700 flex flex-col md:flex-row justify-between items-center shrink-0 z-10 gap-4">
                        <div>
                            <h1 className="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-fuchsia-400 to-indigo-500">
                                Transition Metal Ions Gallery
                            </h1>
                            <p className="text-slate-400 text-xs mt-1 uppercase tracking-wider font-semibold">
                                Colorimetric Mapping & Reagent Testing Lab
                            </p>
                        </div>
                    </header>

                    {/* Main Workspace Layout */}
                    <div className="flex-grow flex flex-col lg:flex-row overflow-hidden relative bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-800 to-slate-950">
                        
                        {/* LEFT PANEL: Selection & Reagents */}
                        <div className="w-full lg:w-5/12 p-6 lg:p-8 border-b lg:border-b-0 lg:border-r border-slate-700 flex flex-col justify-start overflow-y-auto hide-scrollbar z-10">
                            
                            <h2 className="text-sm text-slate-400 font-bold uppercase tracking-widest border-b border-slate-700 pb-2 mb-6">
                                The 3d Block (Row 4)
                            </h2>

                            {/* Mini Periodic Table */}
                            <div className="grid grid-cols-5 gap-2 mb-6">
                                {Object.entries(TM_DATA).map(([symbol, data]) => (
                                    <button
                                        key={symbol}
                                        onClick={() => handleElementChange(symbol)}
                                        className={`relative p-2 rounded-lg border-2 flex flex-col items-center justify-center transition-all duration-200
                                            ${selectedElement === symbol 
                                                ? 'bg-indigo-600 border-indigo-400 shadow-[0_0_15px_rgba(99,102,241,0.5)] transform scale-105 z-10' 
                                                : 'bg-slate-800 border-slate-700 hover:border-slate-500 hover:bg-slate-700'}`}
                                    >
                                        <span className={`text-xl font-bold ${selectedElement === symbol ? 'text-white' : 'text-slate-300'}`}>{symbol}</span>
                                    </button>
                                ))}
                            </div>

                            {/* Element Details & Oxidation State Selector */}
                            <div key={`info-${selectedElement}`} className="bg-slate-800/50 border border-slate-700 rounded-2xl p-6 shadow-inner animate-slide-in mb-6">
                                <div className="flex justify-between items-start mb-6">
                                    <div>
                                        <h3 className="text-2xl font-bold text-white">{elementData.name}</h3>
                                        <p className="text-indigo-400 font-mono text-sm mt-1">{elementData.electron}</p>
                                    </div>
                                </div>
                                <h4 className="text-xs font-bold text-slate-500 uppercase tracking-widest mb-3">Oxidation State</h4>
                                <div className="flex flex-wrap gap-3">
                                    {Object.keys(elementData.states).map(state => (
                                        <button
                                            key={state}
                                            onClick={() => handleStateChange(state)}
                                            className={`px-4 py-2 rounded-xl font-mono font-bold border-2 transition-all duration-300
                                                ${selectedState === state 
                                                    ? 'bg-slate-100 text-slate-900 border-white shadow-lg' 
                                                    : 'bg-slate-900 text-slate-400 border-slate-700 hover:border-slate-500'}`}
                                        >
                                            {state}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* REAGENT TESTING LAB */}
                            <div className={`border rounded-2xl p-6 transition-all duration-300 ${hasReactions ? 'bg-slate-900 border-slate-600' : 'bg-slate-900/50 border-slate-800 opacity-50 pointer-events-none'}`}>
                                <div className="flex justify-between items-center mb-6">
                                    <h4 className="text-sm font-bold text-sky-400 uppercase tracking-widest">Reagent Testing</h4>
                                    <button onClick={resetReagents} className="text-[10px] font-bold tracking-widest bg-slate-800 text-slate-400 border border-slate-700 px-3 py-1.5 rounded hover:bg-slate-700 hover:text-white transition-colors">RESET</button>
                                </div>

                                {hasReactions ? (
                                    <div className="space-y-4">
                                        {/* NaOH Control */}
                                        <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                                            <div className="flex justify-between items-center mb-3">
                                                <span className="text-sm font-bold text-sky-400">NaOH (aq)</span>
                                                <span className={`text-[10px] uppercase tracking-widest font-bold px-2 py-1 rounded transition-colors ${naohLevel === 0 ? 'bg-slate-800 text-slate-500' : naohLevel === 1 ? 'bg-sky-900/50 text-sky-300 border border-sky-500/50' : 'bg-sky-500 text-white shadow-[0_0_10px_rgba(14,165,233,0.5)]'}`}>
                                                    {naohLevel === 0 ? 'None' : naohLevel === 1 ? 'Few Drops' : 'Excess Added'}
                                                </span>
                                            </div>
                                            <button 
                                                onClick={handleNaohClick}
                                                disabled={naohLevel === 2}
                                                className="w-full py-2.5 rounded-lg font-bold text-sm transition-all bg-sky-600 hover:bg-sky-500 text-white disabled:opacity-50 disabled:cursor-not-allowed shadow-lg"
                                            >
                                                {naohLevel === 0 ? '+ ADD FEW DROPS' : naohLevel === 1 ? '+ ADD EXCESS' : 'MAXIMUM ADDED'}
                                            </button>
                                        </div>

                                        {/* NH3 Control */}
                                        <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                                            <div className="flex justify-between items-center mb-3">
                                                <span className="text-sm font-bold text-fuchsia-400">NH₃ (aq)</span>
                                                <span className={`text-[10px] uppercase tracking-widest font-bold px-2 py-1 rounded transition-colors ${nh3Level === 0 ? 'bg-slate-800 text-slate-500' : nh3Level === 1 ? 'bg-fuchsia-900/50 text-fuchsia-300 border border-fuchsia-500/50' : 'bg-fuchsia-500 text-white shadow-[0_0_10px_rgba(217,70,239,0.5)]'}`}>
                                                    {nh3Level === 0 ? 'None' : nh3Level === 1 ? 'Few Drops' : 'Excess Added'}
                                                </span>
                                            </div>
                                            <button 
                                                onClick={handleNh3Click}
                                                disabled={nh3Level === 2}
                                                className="w-full py-2.5 rounded-lg font-bold text-sm transition-all bg-fuchsia-600 hover:bg-fuchsia-500 text-white disabled:opacity-50 disabled:cursor-not-allowed shadow-lg"
                                            >
                                                {nh3Level === 0 ? '+ ADD FEW DROPS' : nh3Level === 1 ? '+ ADD EXCESS' : 'MAXIMUM ADDED'}
                                            </button>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="py-6 flex justify-center">
                                        <p className="text-xs text-slate-500 text-center max-w-[200px]">No standard qualitative analysis reactions for this specific ion state.</p>
                                    </div>
                                )}
                            </div>

                        </div>

                        {/* RIGHT PANEL: Volumetric Flask & Output */}
                        <div className="w-full lg:w-7/12 p-6 lg:p-10 flex flex-col justify-center items-center relative overflow-y-auto hide-scrollbar bg-slate-900/50">
                            
                            {/* SVG Volumetric Flask Rendering */}
                            <div className="relative w-64 h-80 md:w-80 md:h-[400px] shrink-0 animate-float drop-shadow-[0_20px_30px_rgba(0,0,0,0.5)] mb-6 md:mb-10">
                                <svg width="100%" height="100%" viewBox="0 0 200 300" className="overflow-visible">
                                    
                                    <defs>
                                        <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                                            <stop offset="0%" stopColor={color} className="liquid-transition" />
                                            <stop offset="50%" stopColor={color} stopOpacity="0.8" className="liquid-transition" />
                                            <stop offset="100%" stopColor={color} stopOpacity="0.5" className="liquid-transition" />
                                        </linearGradient>

                                        <clipPath id="volFlaskClip">
                                            <path d="M 90 20 L 110 20 L 110 140 C 110 160 160 180 160 250 C 160 290 130 295 100 295 C 70 295 40 290 40 250 C 40 180 90 160 90 140 Z" />
                                        </clipPath>
                                    </defs>

                                    {/* Back Glass of Flask */}
                                    <path d="M 90 20 L 110 20 L 110 140 C 110 160 160 180 160 250 C 160 290 130 295 100 295 C 70 295 40 290 40 250 C 40 180 90 160 90 140 Z" fill="rgba(255,255,255,0.02)" stroke="#475569" strokeWidth="4" />
                                    
                                    <line x1="85" y1="90" x2="115" y2="90" stroke="#94A3B8" strokeWidth="2" />
                                    
                                    {/* Flask Lip */}
                                    <rect x="85" y="10" width="30" height="10" rx="3" fill="rgba(255,255,255,0.1)" stroke="#475569" strokeWidth="3" />

                                    {/* LIQUID GROUP (Clipped to Flask Shape) */}
                                    <g clipPath="url(#volFlaskClip)">
                                        
                                        {/* Main Liquid Base (Becomes cloudy/opaque if precipitate exists) */}
                                        <rect 
                                            x="0" y="120" width="200" height="180" 
                                            fill="url(#liquidGrad)"
                                            opacity={isPpt ? 0.95 : opacity}
                                            className="liquid-transition"
                                        />
                                        
                                        {/* Liquid Meniscus */}
                                        <ellipse 
                                            cx="100" cy="120" rx="10" ry="3" 
                                            fill={color}
                                            opacity={isPpt ? 0.9 : Math.min(1, opacity + 0.2)}
                                            className="liquid-transition"
                                        />

                                        {/* PRECIPITATE VISUALIZATION (Sediment at bottom) */}
                                        <path 
                                            d="M 40 260 C 70 240 130 250 160 270 L 150 295 C 130 295 70 295 50 295 Z"
                                            fill={color}
                                            className={`liquid-transition ${isPpt ? 'opacity-100' : 'opacity-0'}`}
                                            stroke="rgba(0,0,0,0.2)" strokeWidth="2"
                                        />
                                        
                                        {/* Texture dots for precipitate */}
                                        <g className={`liquid-transition ${isPpt ? 'opacity-40' : 'opacity-0'}`} fill="#000000">
                                            <circle cx="80" cy="270" r="2" /><circle cx="100" cy="280" r="1.5" />
                                            <circle cx="120" cy="265" r="2" /><circle cx="70" cy="285" r="2.5" />
                                            <circle cx="140" cy="280" r="1.5" /><circle cx="110" cy="290" r="2" />
                                        </g>

                                    </g>

                                    {/* Front Glass Reflection (Shine) */}
                                    <path d="M 60 250 C 50 200 80 160 95 130" fill="none" stroke="rgba(255,255,255,0.2)" strokeWidth="6" strokeLinecap="round" />
                                </svg>
                            </div>

                            {/* Dynamic Readout Box */}
                            <div className="w-full px-4 lg:px-8 flex justify-center z-20 shrink-0">
                                <div className={`backdrop-blur px-8 py-5 rounded-2xl shadow-2xl flex flex-col items-center w-full max-w-sm transition-all duration-300 border
                                    ${isPpt ? 'bg-slate-950 border-slate-600' : 'bg-slate-900/90 border-slate-700'}`}>
                                    
                                    <span className="text-[10px] text-slate-400 uppercase tracking-widest font-bold mb-1">
                                        Observed Status
                                    </span>
                                    <span 
                                        className="text-2xl md:text-3xl font-bold liquid-transition text-center"
                                        style={{ color: color === '#FFFFFF' ? '#94A3B8' : color }}
                                    >
                                        {label}
                                    </span>
                                    
                                    <div className="w-full h-px bg-slate-800 my-3"></div>
                                    
                                    <span className="text-[10px] text-slate-500 uppercase tracking-widest font-bold mb-1">
                                        Dominant Chemical Species
                                    </span>
                                    <span className="text-lg font-mono text-white font-bold">
                                        {species}
                                    </span>
                                </div>
                            </div>

                        </div>

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
