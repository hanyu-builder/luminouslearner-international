<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percentage Yield Calculator</title>
    <!-- Primary SEO Keyword: Percentage yield calculator chemistry -->
    <meta name="description" content="Percentage yield calculator chemistry tool. Evaluate synthetic efficiency visually.">
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load D3.js -->
    <script src="https://d3js.org/d3.v7.min.js"></script>

    <!-- Load React, ReactDOM, and Babel for standalone browser usage -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
</head>
<body class="bg-[#0F172A] text-slate-200 min-h-screen overflow-hidden">
    
    <!-- The React App will render inside this div -->
    <div id="root"></div>

    <!-- React Application Logic -->
    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- INLINE SVG ICONS ---
        const AlertCircleIcon = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>;
        const ArrowRightIcon = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>;
        const BeakerIcon = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M4.5 3h15"></path><path d="M6 3v16a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V3"></path><path d="M6 14h12"></path></svg>;
        const ScaleIcon = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"></path><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"></path><path d="M7 21h10"></path><path d="M12 3v18"></path><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"></path></svg>;
        const ActivityIcon = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>;
        const InfoIcon = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>;

        function App() {
            // --- 1. STATE MANAGEMENT ---
            // Reactant State
            const [rMass, setRMass] = useState(10);
            const [rUnit, setRUnit] = useState('g');
            const [rMolarMass, setRMolarMass] = useState(100);
            const [rCoeff, setRCoeff] = useState(1);

            // Product State
            const [pMass, setPMass] = useState(8);
            const [pUnit, setPUnit] = useState('g');
            const [pMolarMass, setPMolarMass] = useState(50);
            const [pCoeff, setPCoeff] = useState(1);

            // System State
            const [d3Loaded, setD3Loaded] = useState(false);
            const chartRef = useRef(null);

            // Check if D3 is loaded (it is loaded via CDN in <head>)
            useEffect(() => {
                if (window.d3) setD3Loaded(true);
            }, []);

            // --- 2. DIMENSIONAL ANALYSIS & CALCULATIONS ---
            const results = useMemo(() => {
                let isValid = true;
                let warnings = [];

                if (rMass < 0 || pMass < 0 || rMolarMass <= 0 || pMolarMass <= 0 || rCoeff <= 0 || pCoeff <= 0) {
                    isValid = false;
                    warnings.push("All inputs must be positive numbers > 0.");
                }

                if (!isValid) return { isValid: false, warnings };

                let rGrams = 0;
                let rMoles = 0;
                if (rUnit === 'g') {
                    rGrams = rMass;
                    rMoles = rMass / rMolarMass;
                } else if (rUnit === 'kg') {
                    rGrams = rMass * 1000;
                    rMoles = rGrams / rMolarMass;
                } else if (rUnit === 'mol') {
                    rMoles = rMass;
                    rGrams = rMoles * rMolarMass;
                }

                const pTheoreticalMoles = rMoles * (pCoeff / rCoeff);
                const pTheoreticalGrams = pTheoreticalMoles * pMolarMass;

                let pActualGrams = 0;
                let pActualMoles = 0;
                if (pUnit === 'g') {
                    pActualGrams = pMass;
                    pActualMoles = pMass / pMolarMass;
                } else if (pUnit === 'kg') {
                    pActualGrams = pMass * 1000;
                    pActualMoles = pActualGrams / pMolarMass;
                } else if (pUnit === 'mol') {
                    pActualMoles = pMass;
                    pActualGrams = pActualMoles * pMolarMass;
                }

                let yieldPct = 0;
                if (pTheoreticalGrams > 0) {
                    yieldPct = (pActualGrams / pTheoreticalGrams) * 100;
                }

                if (yieldPct > 100) {
                    warnings.push("Yield exceeds 100%. Check for unreacted impurities, solvent retention, or input errors.");
                }

                return {
                    isValid: true,
                    warnings,
                    rMoles,
                    pTheoreticalMoles,
                    pTheoreticalGrams,
                    pActualGrams,
                    yieldPct
                };
            }, [rMass, rUnit, rMolarMass, rCoeff, pMass, pUnit, pMolarMass, pCoeff]);

            // --- 3. D3.JS VISUALIZATION ---
            useEffect(() => {
                if (!d3Loaded || !chartRef.current || !results.isValid) return;

                const d3 = window.d3;
                const container = d3.select(chartRef.current);
                container.selectAll("*").remove();

                const margin = { top: 30, right: 30, bottom: 40, left: 60 };
                const width = chartRef.current.clientWidth - margin.left - margin.right;
                const height = 280 - margin.top - margin.bottom;

                const svg = container
                    .append("svg")
                    .attr("width", width + margin.left + margin.right)
                    .attr("height", height + margin.top + margin.bottom)
                    .append("g")
                    .attr("transform", `translate(${margin.left},${margin.top})`);

                const data = [
                    { label: "Theoretical Yield", value: results.pTheoreticalGrams, color: "#3b82f6" },
                    { label: "Actual Yield", value: results.pActualGrams, color: results.yieldPct > 100 ? "#ef4444" : "#10b981" }
                ];

                const maxVal = d3.max(data, d => d.value) * 1.2 || 10;

                const x = d3.scaleBand()
                    .domain(data.map(d => d.label))
                    .range([0, width])
                    .padding(0.3);

                const y = d3.scaleLinear()
                    .domain([0, maxVal])
                    .nice()
                    .range([height, 0]);

                svg.append("g")
                    .attr("class", "grid")
                    .attr("color", "#334155")
                    .attr("stroke-dasharray", "3,3")
                    .attr("opacity", 0.5)
                    .call(d3.axisLeft(y).tickSize(-width).tickFormat(""));

                svg.append("g")
                    .attr("transform", `translate(0,${height})`)
                    .call(d3.axisBottom(x))
                    .attr("color", "#94a3b8")
                    .attr("font-size", "12px");

                svg.append("g")
                    .call(d3.axisLeft(y))
                    .attr("color", "#94a3b8")
                    .attr("font-size", "12px");

                svg.append("text")
                    .attr("transform", "rotate(-90)")
                    .attr("y", 0 - margin.left)
                    .attr("x", 0 - (height / 2))
                    .attr("dy", "1em")
                    .style("text-anchor", "middle")
                    .style("fill", "#64748b")
                    .text("Mass (grams)");

                svg.selectAll(".bar")
                    .data(data)
                    .enter()
                    .append("rect")
                    .attr("class", "bar")
                    .attr("x", d => x(d.label))
                    .attr("width", x.bandwidth())
                    .attr("fill", d => d.color)
                    .attr("rx", 4)
                    .attr("y", y(0))
                    .attr("height", 0)
                    .transition()
                    .duration(800)
                    .ease(d3.easeCubicOut)
                    .attr("y", d => y(d.value))
                    .attr("height", d => height - y(d.value));

                svg.selectAll(".label")
                    .data(data)
                    .enter()
                    .append("text")
                    .attr("class", "label")
                    .attr("x", d => x(d.label) + x.bandwidth() / 2)
                    .attr("y", d => y(d.value) - 10)
                    .attr("text-anchor", "middle")
                    .style("fill", "#f8fafc")
                    .style("font-size", "12px")
                    .style("font-weight", "bold")
                    .text(d => `${d.value.toFixed(2)} g`)
                    .style("opacity", 0)
                    .transition()
                    .delay(400)
                    .duration(400)
                    .style("opacity", 1);

            }, [results, d3Loaded]);

            // --- 4. RENDER COMPONENTS ---
            const InputGroup = ({ label, value, onChange, placeholder }) => (
                <div className="flex flex-col gap-1 w-full">
                    <label className="text-xs text-slate-400 font-semibold">{label}</label>
                    <input
                        type="number"
                        min="0"
                        step="any"
                        value={value}
                        onChange={(e) => onChange(parseFloat(e.target.value) || 0)}
                        placeholder={placeholder}
                        className="bg-slate-900 border border-slate-700 rounded-md p-2 text-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition font-mono"
                    />
                </div>
            );

            return (
                <div className="flex flex-col h-screen font-sans select-none overflow-hidden">
                    
                    <header className="bg-[#1E293B] border-b border-slate-800 p-4 shadow-md shrink-0">
                        <div className="max-w-6xl mx-auto flex items-center justify-between">
                            <div>
                                <h1 className="text-2xl font-bold text-white tracking-tight flex items-center gap-2">
                                    <ActivityIcon className="text-blue-400 w-6 h-6" /> Percentage Yield Calculator
                                </h1>
                                <p className="text-sm text-slate-400 mt-1 hidden sm:block">
                                    Percentage yield calculator chemistry tool. Evaluate synthetic efficiency visually.
                                </p>
                            </div>
                            <div className="bg-slate-900 border border-slate-700 px-4 py-2 rounded-lg font-mono text-xs text-center hidden md:block">
                                <span className="text-slate-500">Formula:</span><br/>
                                <span className="text-blue-400 font-bold">% Yield</span> = (Actual / Theoretical) &times; 100
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 w-full max-w-6xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 overflow-y-auto">
                        
                        <section className="col-span-1 lg:col-span-5 flex flex-col gap-6">
                            
                            <div className="bg-[#1E293B] border border-slate-800 rounded-xl p-5 shadow-lg relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-1 h-full bg-blue-500"></div>
                                <div className="flex items-center gap-2 mb-4">
                                    <ScaleIcon className="text-blue-400 w-5 h-5" />
                                    <h2 className="text-sm uppercase tracking-wider text-slate-300 font-bold">1. Limiting Reactant</h2>
                                </div>
                                
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="col-span-2 sm:col-span-1">
                                        <InputGroup label="Mass / Amount" value={rMass} onChange={setRMass} placeholder="10" />
                                    </div>
                                    <div className="col-span-2 sm:col-span-1 flex flex-col gap-1">
                                        <label className="text-xs text-slate-400 font-semibold">Unit</label>
                                        <div className="flex bg-slate-900 border border-slate-700 rounded-md p-1">
                                            {['g', 'kg', 'mol'].map(u => (
                                                <button
                                                    key={u}
                                                    onClick={() => setRUnit(u)}
                                                    className={`flex-1 text-xs py-1 rounded transition ${rUnit === u ? 'bg-blue-500 text-white font-bold' : 'text-slate-400 hover:text-slate-200'}`}
                                                >
                                                    {u}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                    <InputGroup label="Molar Mass (g/mol)" value={rMolarMass} onChange={setRMolarMass} placeholder="100.0" />
                                    <InputGroup label="Stoichiometric Coeff." value={rCoeff} onChange={setRCoeff} placeholder="1" />
                                </div>
                                {results.isValid && rUnit !== 'mol' && (
                                    <div className="mt-4 pt-3 border-t border-slate-800 text-xs text-slate-500 flex justify-between font-mono">
                                        <span>Calculated Moles:</span>
                                        <span className="text-blue-300">{results.rMoles.toFixed(4)} mol</span>
                                    </div>
                                )}
                            </div>

                            <div className="flex justify-center text-slate-600 -my-3">
                                <ArrowRightIcon className="w-6 h-6 rotate-90 lg:rotate-0" />
                            </div>

                            <div className="bg-[#1E293B] border border-slate-800 rounded-xl p-5 shadow-lg relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-1 h-full bg-emerald-500"></div>
                                <div className="flex items-center gap-2 mb-4">
                                    <BeakerIcon className="text-emerald-400 w-5 h-5" />
                                    <h2 className="text-sm uppercase tracking-wider text-slate-300 font-bold">2. Actual Product</h2>
                                </div>
                                
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="col-span-2 sm:col-span-1">
                                        <InputGroup label="Actual Mass / Amount" value={pMass} onChange={setPMass} placeholder="8.0" />
                                    </div>
                                    <div className="col-span-2 sm:col-span-1 flex flex-col gap-1">
                                        <label className="text-xs text-slate-400 font-semibold">Unit</label>
                                        <div className="flex bg-slate-900 border border-slate-700 rounded-md p-1">
                                            {['g', 'kg', 'mol'].map(u => (
                                                <button
                                                    key={u}
                                                    onClick={() => setPUnit(u)}
                                                    className={`flex-1 text-xs py-1 rounded transition ${pUnit === u ? 'bg-emerald-500 text-white font-bold' : 'text-slate-400 hover:text-slate-200'}`}
                                                >
                                                    {u}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                    <InputGroup label="Molar Mass (g/mol)" value={pMolarMass} onChange={setPMolarMass} placeholder="50.0" />
                                    <InputGroup label="Stoichiometric Coeff." value={pCoeff} onChange={setPCoeff} placeholder="1" />
                                </div>
                            </div>

                        </section>

                        <section className="col-span-1 lg:col-span-7 flex flex-col gap-6">
                            
                            <div className="bg-[#1E293B] border border-slate-800 rounded-xl p-6 shadow-lg flex flex-col items-center justify-center relative">
                                <h2 className="text-sm uppercase tracking-wider text-slate-400 font-bold mb-4">Calculated Percentage Yield</h2>
                                
                                {results.isValid ? (
                                    <div className="text-center w-full">
                                        <div className="text-7xl font-black tracking-tighter mb-2">
                                            <span className={results.yieldPct > 100 ? "text-red-400" : "text-white"}>
                                                {results.yieldPct.toFixed(1)}
                                            </span>
                                            <span className="text-3xl text-slate-500 ml-1">%</span>
                                        </div>
                                        
                                        <div className="flex justify-center gap-6 mt-6 pt-6 border-t border-slate-800">
                                            <div className="text-center font-mono">
                                                <div className="text-xs text-slate-500 uppercase">Theoretical Yield</div>
                                                <div className="text-lg text-blue-400 font-bold">{results.pTheoreticalGrams.toFixed(2)} g</div>
                                            </div>
                                            <div className="w-px bg-slate-800"></div>
                                            <div className="text-center font-mono">
                                                <div className="text-xs text-slate-500 uppercase">Actual Yield</div>
                                                <div className="text-lg text-emerald-400 font-bold">{results.pActualGrams.toFixed(2)} g</div>
                                            </div>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="text-slate-500 italic py-10 text-center">
                                        Please enter valid positive numbers to calculate yield.
                                    </div>
                                )}

                                {results.warnings.map((warn, idx) => (
                                    <div key={idx} className="mt-4 w-full bg-red-900/20 border border-red-800/50 rounded-lg p-3 flex gap-3 items-start text-sm text-red-400">
                                        <AlertCircleIcon className="w-5 h-5 shrink-0 mt-0.5" />
                                        <p>{warn}</p>
                                    </div>
                                ))}
                            </div>

                            <div className="bg-[#1E293B] border border-slate-800 rounded-xl p-6 shadow-lg flex-1 min-h-[350px] flex flex-col">
                                <div className="flex items-center justify-between mb-2 border-b border-slate-800 pb-4">
                                    <h2 className="text-sm uppercase tracking-wider text-slate-400 font-bold flex items-center gap-2">
                                        <ActivityIcon className="w-4 h-4" /> Visual Analysis (D3.js)
                                    </h2>
                                    {!d3Loaded && <span className="text-xs text-slate-500 animate-pulse">Loading engine...</span>}
                                </div>
                                
                                <div className="flex-1 w-full relative pt-4" ref={chartRef}>
                                    {/* D3 SVG injects here */}
                                </div>

                                <div className="mt-4 bg-slate-900/50 rounded p-3 text-xs text-slate-400 flex items-start gap-2">
                                    <InfoIcon className="w-4 h-4 shrink-0 text-blue-400" />
                                    <p>Dimensional analysis engine automatically maps kilograms and moles into base grams for accurate theoretical vs. actual mass comparison rendering.</p>
                                </div>
                            </div>

                        </section>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
