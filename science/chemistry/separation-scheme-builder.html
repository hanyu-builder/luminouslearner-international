<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Chemical Separation Techniques Interactive | Science Simulator</title>
    <!-- Primary SEO Keyword: Chemical separation techniques interactive -->
    <meta name="description" content="Master physical separation methodologies with this chemical separation techniques interactive simulator. Build pipelines using filtration, distillation, and magnetic separation.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React, ReactDOM, and Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        
        /* Drag & Drop Visual Feedback */
        .pipeline-drop-zone { transition: background-color 0.2s, border-color 0.2s; }
        .pipeline-drop-zone.drag-over { background-color: rgba(59, 130, 246, 0.2); border-color: #3b82f6; }
        
        /* Engine Animations */
        .node-active {
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
            border-color: #10b981;
            transform: scale(1.05);
            transition: all 0.3s ease;
        }
        .node-error {
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
            border-color: #ef4444;
            animation: shake 0.4s ease-in-out;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-[#0F172A] text-slate-200 h-screen max-h-[1000px] overflow-hidden flex flex-col font-sans select-none">
    
    <div id="root" class="h-full w-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- ICONS ---
        const Icons = {
            Filter: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>,
            Magnet: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 11V7a8 8 0 0 1 16 0v4"></path><path d="M4 11h4v4H4z"></path><path d="M16 11h4v4h-4z"></path></svg>,
            Sun: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>,
            Flask: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a2.5 2.5 0 0 0 2.227 3.45h10.106a2.5 2.5 0 0 0 2.227-3.45l-5.069-10.127A2 2 0 0 1 14 9.527V2"></path><path d="M8.5 2h7"></path><path d="M7 16h10"></path></svg>,
            Thermometer: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"></path><path d="M12 9v4"></path></svg>,
            Droplets: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7 2.9 7 2.9s-2.29 6.16-2.29 6.16C3.57 10 3 11.1 3 12.25c0 2.22 1.8 4.05 4 4.05z"></path><path d="M12.56 6.6A10.97 10.97 0 0 0 14 3.02c.5 2.5 2 4.9 4 6.5s3 3.5 3 5.5a6.98 6.98 0 0 1-11.91 4.97"></path></svg>,
            Layers: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>,
            Paper: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>,
            Trash: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>,
            Clear: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>,
            ArrowRight: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>,
            Play: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>,
            Check: () => <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-emerald-400"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
        };

        // --- DATABASE ---
        const DB = {
            sand: { id: 'sand', name: 'Sand (SiO₂)', state: 's', sol: false, mag: false, bp: 2230, color: '#d4d4d8' },
            salt: { id: 'salt', name: 'Salt (NaCl)', state: 's', sol: true, mag: false, bp: 1465, color: '#f8fafc' },
            water: { id: 'water', name: 'Water (H₂O)', state: 'l', sol: true, mag: false, bp: 100, color: '#3b82f6' },
            ethanol: { id: 'ethanol', name: 'Ethanol', state: 'l', sol: true, mag: false, bp: 78, color: '#c084fc' },
            iron: { id: 'iron', name: 'Iron Filings', state: 's', sol: false, mag: true, bp: 2862, color: '#475569' },
            sulfur: { id: 'sulfur', name: 'Sulfur Powder', state: 's', sol: false, mag: false, bp: 444, color: '#facc15' },
            iodine: { id: 'iodine', name: 'Iodine (I₂)', state: 's', sol: false, mag: false, bp: 184, color: '#4c1d95' },
            oil: { id: 'oil', name: 'Vegetable Oil', state: 'l', sol: false, mag: false, bp: 300, color: '#fde047', immiscible: true },
            dyes: { id: 'dyes', name: 'Food Dyes', state: 's', sol: true, mag: false, bp: 500, color: '#ef4444', isDye: true },
            glass: { id: 'glass', name: 'Broken Glass', state: 's', sol: false, mag: false, bp: 1700, color: '#94a3b8' },
        };

        const MIXTURES = [
            { 
                group: "Basic Mixtures", 
                items: [
                    { id: 'mix1', name: 'Muddy Saltwater', goal: 'Isolate Sand, Salt, and Water.', components: [DB.sand, DB.salt, DB.water] },
                    { id: 'mix_dry', name: 'Sand & Salt (Dry Mixture)', goal: 'Isolate Sand and Salt.', components: [DB.sand, DB.salt] },
                    { id: 'mix2', name: 'Ethanol + Water (Miscible Liquids)', goal: 'Isolate Ethanol and Water.', components: [DB.ethanol, DB.water] },
                    { id: 'mix_oil', name: 'Oil + Water (Immiscible Liquids)', goal: 'Isolate Oil and Water.', components: [DB.oil, DB.water] },
                    { id: 'mix3', name: 'Salt Water (Solution)', goal: 'Isolate Salt and Water.', components: [DB.salt, DB.water] },
                    { id: 'mix4', name: 'Iodine in Water (Suspension)', goal: 'Isolate Iodine and Water.', components: [DB.iodine, DB.water] },
                    { id: 'mix_dyes', name: 'Food Dye Solution', goal: 'Isolate Dyes and Water.', components: [DB.dyes, DB.water] },
                    { id: 'mix5', name: 'Iron & Sulfur (Solid Mixture)', goal: 'Isolate Iron and Sulfur.', components: [DB.iron, DB.sulfur] }
                ]
            },
            { 
                group: "Real-World Boss Levels", 
                items: [
                    { id: 'boss1', name: 'Survival Mode (Desalination)', goal: 'You need pure, drinkable water. Isolate components without losing the water to the atmosphere!', components: [DB.sand, DB.salt, DB.water] },
                    { id: 'boss2', name: 'The Perfume Factory Spill', goal: 'A vat of perfume shattered! Recover the pure ethanol from the broken glass and water.', components: [DB.glass, DB.ethanol, DB.water] },
                    { id: 'boss3', name: 'E-Waste Recovery', goal: 'Recover magnetic metals from crushed plastic and glass.', components: [DB.glass, DB.iron] }
                ]
            }
        ];

        const ALL_MIXTURES = MIXTURES.flatMap(g => g.items);

        const TOOLS = {
            add_water: { id: 'add_water', name: 'Add Water', icon: 'Droplets', color: 'border-cyan-500', desc: 'Adds water to dissolve soluble solids.' },
            filtration: { id: 'filtration', name: 'Filtration', icon: 'Filter', color: 'border-blue-500', desc: 'Separates insoluble solids from liquids/solutions.' },
            sep_funnel: { id: 'sep_funnel', name: 'Separatory Funnel', icon: 'Layers', color: 'border-teal-500', desc: 'Separates immiscible liquids of different densities.' },
            chromatography: { id: 'chromatography', name: 'Chromatography', icon: 'Paper', color: 'border-pink-500', desc: 'Separates soluble colored compounds (dyes).' },
            evaporation: { id: 'evaporation', name: 'Evaporation', icon: 'Sun', color: 'border-orange-500', desc: 'Recovers a soluble solid. Vaporizes and destroys the liquid.' },
            simple_dist: { id: 'simple_dist', name: 'Simple Distillation', icon: 'Flask', color: 'border-purple-500', desc: 'Separates a liquid from a soluble solid, recovering both.' },
            frac_dist: { id: 'frac_dist', name: 'Fractional Distillation', icon: 'Thermometer', color: 'border-rose-500', desc: 'Separates miscible liquids with different boiling points.' },
            magnetic: { id: 'magnetic', name: 'Magnetic Separation', icon: 'Magnet', color: 'border-slate-400', desc: 'Extracts ferromagnetic solids from non-magnetic mixtures.' }
        };

        function App() {
            // --- STATE ---
            const [selectedMixId, setSelectedMixId] = useState('mix1');
            const [pipeline, setPipeline] = useState([]);
            
            // Simulation State
            const [simState, setSimState] = useState({
                status: 'idle', // idle, running, success, fail
                currentStep: -1,
                isolated: [],
                activeMix: ALL_MIXTURES.find(m => m.id === 'mix1').components,
                lost: [],
                errorMsg: null
            });

            const [isDragOver, setIsDragOver] = useState(false);

            // Resets
            useEffect(() => {
                const mix = ALL_MIXTURES.find(m => m.id === selectedMixId);
                setPipeline([]);
                setSimState({ status: 'idle', currentStep: -1, isolated: [], activeMix: mix.components, lost: [], errorMsg: null });
            }, [selectedMixId]);

            const activeMixture = ALL_MIXTURES.find(m => m.id === selectedMixId);

            // --- DRAG AND DROP ---
            const handleDragStart = (e, toolId) => {
                e.dataTransfer.setData('text/plain', toolId);
                e.dataTransfer.effectAllowed = 'copy';
            };

            const handleDragOver = (e) => {
                e.preventDefault();
                setIsDragOver(true);
            };

            const handleDragLeave = () => {
                setIsDragOver(false);
            };

            const handleDrop = (e) => {
                e.preventDefault();
                setIsDragOver(false);
                if (simState.status === 'running') return;

                const toolId = e.dataTransfer.getData('text/plain');
                if (TOOLS[toolId]) {
                    setPipeline([...pipeline, toolId]);
                }
            };

            const removeTool = (index) => {
                if (simState.status === 'running') return;
                const newPipeline = [...pipeline];
                newPipeline.splice(index, 1);
                setPipeline(newPipeline);
                setSimState(prev => ({ ...prev, status: 'idle', currentStep: -1, isolated: [], activeMix: activeMixture.components, lost: [], errorMsg: null }));
            };

            const clearPipeline = () => {
                if (simState.status === 'running') return;
                setPipeline([]);
                setSimState(prev => ({ ...prev, status: 'idle', currentStep: -1, isolated: [], activeMix: activeMixture.components, lost: [], errorMsg: null }));
            };

            // --- SEPARATION LOGIC ENGINE ---
            const applyTool = (toolId, mix) => {
                let isolated = [];
                let nextMix = [];
                let lost = [];
                let error = null;

                const hasLiquid = mix.some(c => c.state === 'l');
                const liquids = mix.filter(c => c.state === 'l').sort((a,b) => a.bp - b.bp);

                switch (toolId) {
                    case 'add_water':
                        if (mix.some(c => c.id === 'water')) {
                            error = "Water is already present in the mixture.";
                        } else {
                            nextMix = [...mix, DB.water];
                            isolated = [];
                        }
                        break;
                    case 'filtration':
                        if (!hasLiquid) {
                            error = "Cannot filter a dry solid mixture. A liquid solvent carrier is required.";
                        } else {
                            isolated = mix.filter(c => c.state === 's' && !c.sol); // Insoluble solids
                            nextMix = mix.filter(c => c.state === 'l' || (c.state === 's' && c.sol)); // Filtrate
                        }
                        break;
                    case 'sep_funnel':
                        const immis = mix.filter(c => c.immiscible);
                        const misL = mix.filter(c => c.state === 'l' && !c.immiscible);
                        if (immis.length > 0 && misL.length > 0) {
                            isolated = immis; // Immiscible layer separated
                            nextMix = mix.filter(c => !c.immiscible);
                        } else {
                            error = "Separatory funnels require liquids that form distinct immiscible layers (e.g., oil and water).";
                        }
                        break;
                    case 'chromatography':
                        const dyes = mix.filter(c => c.isDye);
                        if (dyes.length > 0) {
                            isolated = dyes;
                            nextMix = mix.filter(c => !c.isDye);
                        } else {
                            error = "Paper chromatography is an analytical technique used mainly to separate coloured compounds/dyes. It is not suitable for bulk separation of this mixture.";
                        }
                        break;
                    case 'magnetic':
                        isolated = mix.filter(c => c.mag);
                        nextMix = mix.filter(c => !c.mag);
                        break;
                    case 'evaporation':
                        if (!hasLiquid) {
                            error = "No liquid to evaporate.";
                        } else {
                            lost = mix.filter(c => c.state === 'l'); // Liquid is destroyed
                            nextMix = mix.filter(c => c.state === 's'); // Solids left behind
                        }
                        break;
                    case 'simple_dist':
                        if (!hasLiquid) {
                            error = "No liquid to distill.";
                        } else if (mix.some(c => c.isDye)) {
                            error = "Simple distillation will thermally degrade delicate food dyes. Use an analytical technique instead.";
                        } else if (liquids.length > 1 && (liquids[1].bp - liquids[0].bp < 25)) {
                            error = "Simple distillation cannot cleanly separate liquids with boiling points this close. They will co-distill.";
                        } else {
                            isolated = [liquids[0]]; // Distillate
                            nextMix = mix.filter(c => c.id !== liquids[0].id); // Residue
                        }
                        break;
                    case 'frac_dist':
                        if (liquids.length < 2) {
                            error = "Fractional distillation is intended specifically for separating mixtures of multiple miscible liquids.";
                        } else {
                            isolated = [liquids[0]]; // Lowest BP distills first
                            nextMix = mix.filter(c => c.id !== liquids[0].id);
                        }
                        break;
                    default:
                        break;
                }

                return { isolated, nextMix, lost, error };
            };

            const runSimulation = async () => {
                if (pipeline.length === 0) return;

                let currentMix = [...activeMixture.components];
                let currentIsolated = [];
                let currentLost = [];

                setSimState({ status: 'running', currentStep: 0, isolated: [], activeMix: currentMix, lost: [], errorMsg: null });

                for (let i = 0; i < pipeline.length; i++) {
                    await new Promise(r => setTimeout(r, 1200)); // Animation delay

                    const result = applyTool(pipeline[i], currentMix);
                    
                    if (result.error) {
                        setSimState(prev => ({ ...prev, status: 'fail', currentStep: i, errorMsg: result.error }));
                        return;
                    }

                    currentMix = result.nextMix;
                    currentIsolated = [...currentIsolated, ...result.isolated];
                    currentLost = [...currentLost, ...result.lost];

                    setSimState(prev => ({
                        ...prev,
                        currentStep: i + 1,
                        isolated: currentIsolated,
                        activeMix: currentMix,
                        lost: currentLost
                    }));
                }

                await new Promise(r => setTimeout(r, 800));

                // Auto-isolate if only 1 pure component remains in active mix
                if (currentMix.length === 1) {
                    currentIsolated.push(currentMix[0]);
                    currentMix = [];
                }

                // Check Success Condition (Must isolate ALL original components cleanly with 0 lost)
                const uniqueIsolatedIds = new Set(currentIsolated.map(c => c.id));
                const startingIds = activeMixture.components.map(c => c.id);
                const allOriginalsIsolated = startingIds.every(id => uniqueIsolatedIds.has(id));

                if (allOriginalsIsolated && currentLost.length === 0 && currentMix.length === 0) {
                    setSimState(prev => ({ ...prev, status: 'success', activeMix: currentMix, isolated: currentIsolated }));
                } else {
                    let msg = "Sequence completed, but separation failed. ";
                    if (currentLost.length > 0) msg += "Some components were lost/destroyed. ";
                    if (currentMix.length > 1) msg += "The final mixture is still impure. ";
                    if (!allOriginalsIsolated) msg += "You did not recover all original components. ";
                    setSimState(prev => ({ ...prev, status: 'fail', activeMix: currentMix, isolated: currentIsolated, errorMsg: msg }));
                }
            };

            // --- RENDER HELPERS ---
            const ComponentTag = ({ comp }) => (
                <div className="flex items-center gap-1.5 bg-slate-800 border border-slate-600 px-2 py-1 rounded text-[10px] font-bold shadow-sm fade-in">
                    <div className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: comp.color }}></div>
                    {comp.name}
                </div>
            );

            return (
                <div className="flex flex-col h-full w-full">
                    {/* Header */}
                    <header className="bg-[#1E293B] border-b border-slate-800 p-4 shrink-0 flex justify-between items-center z-20 shadow-lg">
                        <div>
                            <h1 className="text-xl md:text-2xl font-bold text-white flex items-center gap-2 tracking-tight">
                                <svg className="w-6 h-6 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                                Chemical Separation Techniques Interactive
                            </h1>
                            <p className="text-xs md:text-sm text-slate-400 mt-1 hidden sm:block">
                                Analyze physical properties to build valid isolation pipelines.
                            </p>
                        </div>
                    </header>

                    {/* Main Workspace */}
                    <main className="flex-1 flex flex-col lg:flex-row gap-6 p-4 md:p-6 overflow-hidden max-w-7xl w-full mx-auto">
                        
                        {/* LEFT: Mixture & Properties */}
                        <section className="flex flex-col gap-4 w-full lg:w-80 shrink-0 overflow-y-auto pr-2">
                            <div className="bg-[#1E293B] p-5 rounded-xl border border-slate-700 shadow-lg flex flex-col gap-4">
                                <h2 className="text-sm uppercase font-bold text-slate-400 border-b border-slate-700 pb-2">1. Select Scenario</h2>
                                
                                <select value={selectedMixId} onChange={e => setSelectedMixId(e.target.value)} disabled={simState.status === 'running'}
                                    className="bg-slate-900 border border-slate-600 rounded p-2 text-white font-bold outline-none focus:border-indigo-500 w-full disabled:opacity-50">
                                    {MIXTURES.map((group, gIdx) => (
                                        <optgroup key={gIdx} label={group.group} className="text-slate-500 uppercase tracking-widest text-[10px]">
                                            {group.items.map(m => <option key={m.id} value={m.id} className="text-white text-sm normal-case">{m.name}</option>)}
                                        </optgroup>
                                    ))}
                                </select>
                                
                                <div className="bg-indigo-900/20 border border-indigo-800/50 p-3 rounded-lg">
                                    <span className="text-[10px] uppercase font-bold text-indigo-400 tracking-widest block mb-1">Target Goal</span>
                                    <span className="text-sm text-slate-200 font-bold">{activeMixture.goal}</span>
                                </div>
                            </div>

                            <div className="bg-[#1E293B] p-5 rounded-xl border border-slate-700 shadow-lg flex-1 flex flex-col gap-3">
                                <h2 className="text-sm uppercase font-bold text-slate-400 border-b border-slate-700 pb-2">Physical Properties Matrix</h2>
                                
                                <div className="flex-1 overflow-y-auto">
                                    <table className="w-full text-xs text-left">
                                        <thead>
                                            <tr className="text-slate-500 border-b border-slate-700">
                                                <th className="py-2">Component</th>
                                                <th className="py-2">State</th>
                                                <th className="py-2">Water Soluble / Miscible</th>
                                                <th className="py-2">B.P. (°C)</th>
                                                <th className="py-2">Mag.</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {activeMixture.components.map(c => (
                                                <tr key={c.id} className="border-b border-slate-800/50 text-slate-300">
                                                    <td className="py-2 font-bold flex items-center gap-1">
                                                        <div className="w-2 h-2 rounded-full shrink-0" style={{backgroundColor: c.color}}></div>
                                                        <span className="truncate">{c.name.split(' ')[0]}</span>
                                                    </td>
                                                    <td className="py-2 uppercase">{c.state}</td>
                                                    <td className="py-2">{c.immiscible ? 'No' : (c.sol ? 'Yes' : 'No')}</td>
                                                    <td className="py-2">{c.bp}</td>
                                                    <td className="py-2">{c.mag ? 'Yes' : 'No'}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </section>

                        {/* CENTER: The Pipeline */}
                        <section className="flex-1 flex flex-col gap-4 min-w-0">
                            
                            <div className="bg-[#1E293B] rounded-xl border border-slate-700 p-5 shadow-lg shrink-0 flex flex-col gap-4">
                                <div className="flex justify-between items-center border-b border-slate-700 pb-2">
                                    <h2 className="text-sm uppercase font-bold text-slate-400">2. Processing Pipeline</h2>
                                    <div className="flex gap-2">
                                        <button onClick={clearPipeline} disabled={pipeline.length === 0 || simState.status === 'running'} 
                                            className="bg-slate-700 hover:bg-slate-600 text-slate-300 px-3 py-1.5 rounded font-bold text-xs transition flex items-center gap-1 disabled:opacity-50 disabled:cursor-not-allowed">
                                            <Icons.Clear /> Clear
                                        </button>
                                        <button onClick={runSimulation} disabled={pipeline.length === 0 || simState.status === 'running'} 
                                            className="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-1.5 rounded font-bold text-xs transition flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                                            <Icons.Play /> Run Sequence
                                        </button>
                                    </div>
                                </div>

                                {/* Drag/Drop Pipeline Area */}
                                <div 
                                    onDragOver={handleDragOver}
                                    onDragLeave={handleDragLeave}
                                    onDrop={handleDrop}
                                    className={`w-full min-h-[140px] rounded-xl border-2 border-dashed flex items-center gap-4 overflow-x-auto p-4 pipeline-drop-zone
                                        ${isDragOver ? 'drag-over' : 'border-slate-600 bg-slate-900/50'}
                                    `}
                                >
                                    {pipeline.length === 0 && <span className="m-auto text-slate-500 italic text-sm pointer-events-none">Drag apparatus here from the toolbox...</span>}
                                    
                                    {pipeline.map((toolId, idx) => {
                                        const tool = TOOLS[toolId];
                                        const Icon = Icons[tool.icon];
                                        const isActive = simState.currentStep === idx && simState.status === 'running';
                                        const isError = simState.currentStep === idx && simState.status === 'fail';

                                        return (
                                            <React.Fragment key={`${toolId}-${idx}`}>
                                                <div className={`relative shrink-0 w-28 h-28 rounded-lg bg-slate-800 border-2 flex flex-col items-center justify-center gap-2 transition-all group
                                                    ${tool.color} 
                                                    ${isActive ? 'node-active' : ''}
                                                    ${isError ? 'node-error' : ''}
                                                `}>
                                                    <Icon />
                                                    <span className="text-[10px] font-bold text-center px-1 leading-tight">{tool.name}</span>
                                                    
                                                    {simState.status !== 'running' && (
                                                        <button onClick={() => removeTool(idx)} className="absolute -top-2 -right-2 w-6 h-6 bg-slate-700 hover:bg-red-500 rounded-full flex items-center justify-center text-white opacity-0 group-hover:opacity-100 transition shadow-md">
                                                            <Icons.Trash />
                                                        </button>
                                                    )}
                                                </div>
                                                {idx < pipeline.length - 1 && <Icons.ArrowRight className="text-slate-600 shrink-0" />}
                                            </React.Fragment>
                                        );
                                    })}
                                </div>
                            </div>

                            {/* Simulation Results Bins */}
                            <div className="bg-[#1E293B] rounded-xl border border-slate-700 p-5 shadow-lg flex-1 flex flex-col relative overflow-hidden">
                                <h2 className="text-sm uppercase font-bold text-slate-400 border-b border-slate-700 pb-2 mb-4">3. Results & Products</h2>
                                
                                <div className="grid grid-cols-3 gap-4 flex-1">
                                    
                                    {/* Active Mix */}
                                    <div className="bg-slate-900/80 border border-slate-700 rounded-lg p-3 flex flex-col gap-2">
                                        <span className="text-[10px] uppercase font-bold text-slate-500 tracking-widest text-center border-b border-slate-800 pb-1">Active Mixture</span>
                                        <div className="flex flex-wrap gap-2 content-start flex-1 p-1">
                                            {simState.activeMix.map(c => <ComponentTag key={`am-${c.id}`} comp={c} />)}
                                            {simState.activeMix.length === 0 && <span className="text-xs italic text-slate-600 m-auto">Empty</span>}
                                        </div>
                                    </div>

                                    {/* Isolated Pure */}
                                    <div className="bg-emerald-900/10 border border-emerald-800/40 rounded-lg p-3 flex flex-col gap-2 shadow-[inset_0_0_20px_rgba(16,185,129,0.05)]">
                                        <span className="text-[10px] uppercase font-bold text-emerald-500 tracking-widest text-center border-b border-emerald-900/50 pb-1">Isolated Pure Substances</span>
                                        <div className="flex flex-wrap gap-2 content-start flex-1 p-1">
                                            {simState.isolated.map((c, i) => <ComponentTag key={`iso-${c.id}-${i}`} comp={c} />)}
                                            {simState.isolated.length === 0 && <span className="text-xs italic text-slate-600 m-auto">Empty</span>}
                                        </div>
                                    </div>

                                    {/* Lost/Destroyed */}
                                    <div className="bg-rose-900/10 border border-rose-800/40 rounded-lg p-3 flex flex-col gap-2">
                                        <span className="text-[10px] uppercase font-bold text-rose-500 tracking-widest text-center border-b border-rose-900/50 pb-1">Lost to Environment</span>
                                        <div className="flex flex-wrap gap-2 content-start flex-1 p-1">
                                            {simState.lost.map((c, i) => <ComponentTag key={`lst-${c.id}-${i}`} comp={c} />)}
                                            {simState.lost.length === 0 && <span className="text-xs italic text-slate-600 m-auto">Empty</span>}
                                        </div>
                                    </div>

                                </div>

                                {/* Status Overlay */}
                                {simState.status === 'success' && (
                                    <div className="absolute inset-0 bg-slate-900/90 backdrop-blur-sm z-20 flex flex-col items-center justify-center fade-in text-center p-4">
                                        <Icons.Check />
                                        <h2 className="text-3xl font-black text-emerald-400 mt-4 mb-2 tracking-tight">Separation Successful!</h2>
                                        <p className="text-slate-300 max-w-lg">You successfully isolated all pure components of the mixture without losing any to the environment.</p>
                                        <button onClick={() => setSimState(prev => ({...prev, status: 'idle'}))} className="mt-6 bg-slate-800 border border-slate-600 hover:bg-slate-700 px-6 py-2 rounded-lg font-bold text-sm transition">Continue Exploring</button>
                                    </div>
                                )}

                                {simState.status === 'fail' && simState.errorMsg && (
                                    <div className="mt-4 bg-rose-900/30 border border-rose-500 rounded-lg p-3 text-sm text-rose-300 font-bold fade-in flex items-center gap-3">
                                        <svg className="w-6 h-6 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                                        {simState.errorMsg}
                                    </div>
                                )}

                            </div>

                        </section>

                        {/* RIGHT: Toolbox */}
                        <section className="flex flex-col gap-4 w-full lg:w-64 shrink-0 overflow-y-auto">
                            <div className="bg-[#1E293B] rounded-xl border border-slate-700 p-5 shadow-lg flex-1 flex flex-col gap-3">
                                <h2 className="text-sm uppercase font-bold text-slate-400 border-b border-slate-700 pb-2">Apparatus Toolbox</h2>
                                <p className="text-[10px] text-slate-500 mb-2">Drag an apparatus into the processing pipeline.</p>
                                
                                <div className="flex flex-col gap-3 flex-1 overflow-y-auto pr-1 pb-4">
                                    {Object.values(TOOLS).map(tool => {
                                        const Icon = Icons[tool.icon];
                                        return (
                                            <div 
                                                key={tool.id} 
                                                draggable 
                                                onDragStart={(e) => handleDragStart(e, tool.id)}
                                                className={`bg-slate-800 border-l-4 ${tool.color} p-3 rounded shadow cursor-grab active:cursor-grabbing hover:bg-slate-700 transition transform hover:-translate-y-1`}
                                            >
                                                <div className="flex items-center gap-2 text-white font-bold text-sm mb-1">
                                                    <Icon /> {tool.name}
                                                </div>
                                                <p className="text-[10px] text-slate-400 leading-tight">{tool.desc}</p>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </section>

                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
