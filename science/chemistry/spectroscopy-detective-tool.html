<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Spectroscopy Detective | Infrared Spectroscopy Interpretation Practice</title>
    <meta name="description" content="Infrared spectroscopy interpretation practice. Interactive simulator integrating IR spectroscopy, Mass Spectrometry, and empirical data to deduce molecular structures.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Chart.js for rendering Spectra -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { 
            margin: 0; 
            background-color: #0F172A; 
            color: #E2E8F0;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden; 
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }

        /* Custom scrollbar for clue panel */
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 10px rgba(14, 165, 233, 0.2); }
            50% { box-shadow: 0 0 20px rgba(14, 165, 233, 0.6); }
        }
        .animate-pulse-glow {
            animation: pulse-glow 2s infinite ease-in-out;
        }

        @keyframes unlockSlide {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .clue-unlocked {
            animation: unlockSlide 0.3s ease-out forwards;
        }
    </style>
</head>
<body>

    <div id="root" class="w-full min-h-screen max-h-[1200px] flex justify-center items-center p-2 md:p-4"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- DATABASE OF COMPOUNDS & SPECTRA ---
        const COMPOUNDS_DB = {
            ethanol: {
                id: 'ethanol', name: 'Ethanol', formula: 'C2H6O', group: 'Alcohol',
                empirical: { C: 52.1, H: 13.1, O: 34.8, N: 0 },
                irPeaks: [
                    { center: 3350, w: 120, s: 75 }, // Broad O-H
                    { center: 2950, w: 40, s: 60 },  // sp3 C-H
                    { center: 1050, w: 30, s: 70 }   // C-O
                ],
                ms: { labels: [15, 27, 29, 31, 45, 46], data: [15, 10, 30, 100, 40, 25] },
                clues: {
                    ir_1: { type: 'IR', text: 'Broad, strong absorption at ~3350 cm⁻¹. Indicates an O-H stretch (alcohol).', color: '#0EA5E9', min: 3100, max: 3600 },
                    ir_2: { type: 'IR', text: 'Sharp absorptions just below 3000 cm⁻¹. Indicates sp³ C-H stretches.', color: '#10B981', min: 2800, max: 3000 },
                    ir_3: { type: 'IR', text: 'Strong absorption at ~1050 cm⁻¹. Indicates a C-O single bond stretch.', color: '#F59E0B', min: 950, max: 1150 },
                    ms_1: { type: 'MS', text: 'Molecular Ion Peak (M⁺) at m/z = 46. Molar mass is 46 g/mol.', color: '#F43F5E', val: 46 },
                    ms_2: { type: 'MS', text: 'Base Peak at m/z = 31. Corresponds to stable [CH₂OH]⁺ fragment.', color: '#D946EF', val: 31 }
                }
            },
            ethanoic_acid: {
                id: 'ethanoic_acid', name: 'Ethanoic Acid', formula: 'C2H4O2', group: 'Carboxylic Acid',
                empirical: { C: 40.0, H: 6.7, O: 53.3, N: 0 },
                irPeaks: [
                    { center: 3000, w: 350, s: 80 }, // VERY Broad O-H (Acid)
                    { center: 2950, w: 30, s: 40 },  // sp3 C-H (often swallowed by OH)
                    { center: 1710, w: 30, s: 85 },  // C=O
                    { center: 1250, w: 40, s: 70 }   // C-O
                ],
                ms: { labels: [15, 43, 45, 60], data: [20, 100, 80, 50] },
                clues: {
                    ir_1: { type: 'IR', text: 'Extremely broad absorption from 2500-3300 cm⁻¹. Indicates carboxylic O-H stretch.', color: '#0EA5E9', min: 2500, max: 3300 },
                    ir_2: { type: 'IR', text: 'Strong, sharp peak at ~1710 cm⁻¹. Indicates a C=O carbonyl stretch.', color: '#F43F5E', min: 1650, max: 1750 },
                    ms_1: { type: 'MS', text: 'Molecular Ion (M⁺) at m/z = 60.', color: '#F43F5E', val: 60 },
                    ms_2: { type: 'MS', text: 'Base Peak at m/z = 43. Corresponds to [CH₃CO]⁺ acylium ion.', color: '#D946EF', val: 43 }
                }
            },
            propanone: {
                id: 'propanone', name: 'Propanone', formula: 'C3H6O', group: 'Ketone',
                empirical: { C: 62.0, H: 10.4, O: 27.6, N: 0 },
                irPeaks: [
                    { center: 2950, w: 40, s: 50 },  // sp3 C-H
                    { center: 1715, w: 30, s: 90 }   // C=O
                ],
                ms: { labels: [15, 43, 58], data: [30, 100, 25] },
                clues: {
                    ir_1: { type: 'IR', text: 'Strong, sharp peak at ~1715 cm⁻¹. Indicates a C=O carbonyl stretch (ketone).', color: '#F43F5E', min: 1650, max: 1750 },
                    ir_2: { type: 'IR', text: 'Absence of broad peak >3000 cm⁻¹. Indicates NO O-H or N-H bonds.', color: '#94A3B8', min: 3100, max: 3600 },
                    ms_1: { type: 'MS', text: 'Molecular Ion (M⁺) at m/z = 58.', color: '#F43F5E', val: 58 },
                    ms_2: { type: 'MS', text: 'Base Peak at m/z = 43. Loss of a methyl group forming [CH₃CO]⁺.', color: '#D946EF', val: 43 }
                }
            },
            ethyl_ethanoate: {
                id: 'ethyl_ethanoate', name: 'Ethyl Ethanoate', formula: 'C4H8O2', group: 'Ester',
                empirical: { C: 54.5, H: 9.1, O: 36.4, N: 0 },
                irPeaks: [
                    { center: 2950, w: 40, s: 50 },  // sp3 C-H
                    { center: 1740, w: 30, s: 90 },  // C=O (Ester is typically higher, ~1740)
                    { center: 1200, w: 40, s: 75 }   // C-O
                ],
                ms: { labels: [29, 43, 61, 88], data: [30, 100, 20, 15] },
                clues: {
                    ir_1: { type: 'IR', text: 'Strong peak at ~1740 cm⁻¹. Higher frequency C=O indicates an ester.', color: '#F43F5E', min: 1680, max: 1780 },
                    ir_2: { type: 'IR', text: 'Strong peaks in 1000-1300 cm⁻¹ region. Indicates multiple C-O stretches.', color: '#F59E0B', min: 1000, max: 1300 },
                    ms_1: { type: 'MS', text: 'Molecular Ion (M⁺) at m/z = 88.', color: '#F43F5E', val: 88 },
                    ms_2: { type: 'MS', text: 'Base peak at m/z = 43 [CH₃CO]⁺. Also note m/z 29 [C₂H₅]⁺.', color: '#D946EF', val: 43 }
                }
            },
            benzaldehyde: {
                id: 'benzaldehyde', name: 'Benzaldehyde', formula: 'C7H6O', group: 'Aldehyde',
                empirical: { C: 79.2, H: 5.7, O: 15.1, N: 0 },
                irPeaks: [
                    { center: 3050, w: 30, s: 40 },  // sp2 C-H (Aromatic)
                    { center: 2850, w: 20, s: 35 },  // Aldehydic C-H
                    { center: 2750, w: 20, s: 35 },  // Aldehydic C-H
                    { center: 1700, w: 30, s: 90 },  // C=O (Conjugated is lower, ~1700)
                    { center: 1600, w: 20, s: 50 },  // Ar C=C
                    { center: 1450, w: 20, s: 50 }   // Ar C=C
                ],
                ms: { labels: [51, 77, 105, 106], data: [20, 80, 100, 60] },
                clues: {
                    ir_1: { type: 'IR', text: 'Peak just above 3000 cm⁻¹. Indicates sp² C-H (alkene/aromatic).', color: '#10B981', min: 3000, max: 3150 },
                    ir_2: { type: 'IR', text: 'Doublet at ~2750 and ~2850 cm⁻¹. Characteristic of an aldehydic C-H.', color: '#38BDF8', min: 2700, max: 2900 },
                    ir_3: { type: 'IR', text: 'C=O stretch at ~1700 cm⁻¹. Slightly lower frequency indicates conjugation (aromatic ring).', color: '#F43F5E', min: 1650, max: 1750 },
                    ms_1: { type: 'MS', text: 'Base peak at m/z = 105. Loss of an H atom from the molecular ion (106) forming [M-1]⁺.', color: '#D946EF', val: 105 },
                    ms_2: { type: 'MS', text: 'Strong peak at m/z = 77. Characteristic of a Phenyl cation [C₆H₅]⁺.', color: '#8B5CF6', val: 77 }
                }
            },
            phenol: {
                id: 'phenol', name: 'Phenol', formula: 'C6H6O', group: 'Phenol',
                empirical: { C: 76.6, H: 6.4, O: 17.0, N: 0 },
                irPeaks: [
                    { center: 3300, w: 150, s: 80 }, // Broad O-H
                    { center: 3050, w: 30, s: 45 },  // sp2 C-H
                    { center: 1600, w: 20, s: 60 },  // Ar C=C
                    { center: 1500, w: 20, s: 60 },  // Ar C=C
                    { center: 1200, w: 30, s: 65 }   // C-O (Phenolic)
                ],
                ms: { labels: [39, 66, 94], data: [30, 40, 100] },
                clues: {
                    ir_1: { type: 'IR', text: 'Broad absorption at ~3300 cm⁻¹. Indicates O-H stretch.', color: '#0EA5E9', min: 3100, max: 3600 },
                    ir_2: { type: 'IR', text: 'Sharp peaks at ~1600 and ~1500 cm⁻¹. Characteristic of aromatic C=C ring stretches.', color: '#10B981', min: 1450, max: 1650 },
                    ms_1: { type: 'MS', text: 'Molecular Ion and Base Peak at m/z = 94.', color: '#F43F5E', val: 94 },
                    ms_2: { type: 'MS', text: 'Peak at m/z = 66. Loss of CO (M-28), typical of phenols.', color: '#D946EF', val: 66 }
                }
            },
            ethanamide: {
                id: 'ethanamide', name: 'Ethanamide', formula: 'C2H5NO', group: 'Amide',
                empirical: { C: 40.7, H: 8.5, N: 23.7, O: 27.1 },
                irPeaks: [
                    { center: 3350, w: 60, s: 65 },  // N-H (Doublet for 1° amide)
                    { center: 3180, w: 60, s: 65 },  // N-H (Doublet for 1° amide)
                    { center: 2950, w: 40, s: 40 },  // sp3 C-H
                    { center: 1680, w: 35, s: 85 }   // C=O (Amide)
                ],
                ms: { labels: [15, 44, 59], data: [15, 100, 60] },
                clues: {
                    ir_1: { type: 'IR', text: 'Distinct "doublet" absorption at ~3200-3400 cm⁻¹. Characteristic of a primary amine/amide (-NH₂).', color: '#0EA5E9', min: 3100, max: 3500 },
                    ir_2: { type: 'IR', text: 'Strong peak at ~1680 cm⁻¹. C=O carbonyl stretch (amides typically absorb lower than ketones).', color: '#F43F5E', min: 1620, max: 1720 },
                    ms_1: { type: 'MS', text: 'Molecular Ion (M⁺) at m/z = 59. The odd mass strongly suggests nitrogen is present!', color: '#F43F5E', val: 59 },
                    ms_2: { type: 'MS', text: 'Base Peak at m/z = 44. Corresponds to the [CONH₂]⁺ fragment.', color: '#D946EF', val: 44 }
                }
            }
        };

        const FORMULA_OPTIONS = ["C2H6O", "C2H4O2", "C3H6O", "C4H8O2", "C7H6O", "C6H6O", "C2H5NO"];
        const GROUP_OPTIONS = ["Alcohol", "Carboxylic Acid", "Ketone", "Ester", "Aldehyde", "Phenol", "Amide"];

        // --- DATA SIMULATION ENGINE ---
        // Mathematically models Transmittance dips based on Wavenumber and compound peaks
        const generateIRData = (peaks) => {
            const points = [];
            for (let x = 4000; x >= 500; x -= 5) {
                let y = 95 + Math.random() * 4; // Base transmittance noise
                
                peaks.forEach(p => {
                    let dist = Math.abs(x - p.center);
                    y -= p.s * Math.exp(-Math.pow(dist / p.w, 2));
                });

                // Fingerprint region noise (C-H, C-C bending)
                if (x < 1500) {
                    y -= Math.random() * 15;
                    if (Math.abs(x - 1380) < 15 || Math.abs(x - 1450) < 15) {
                        y -= 20; 
                    }
                }
                points.push({ x, y: Math.max(0, Math.min(100, y)) });
            }
            return points;
        };

        function App() {
            // --- STATE ---
            const [appMode, setAppMode] = useState('learn'); // 'learn' or 'challenge'
            
            const [activeCompoundId, setActiveCompoundId] = useState('ethanol');
            const [activeTab, setActiveTab] = useState('IR'); // 'IR' or 'MS'
            const [unlockedClues, setUnlockedClues] = useState([]);
            
            // Quiz State
            const [selectedFormula, setSelectedFormula] = useState('');
            const [selectedFunctionalGroup, setSelectedFunctionalGroup] = useState('');
            const [isSolved, setIsSolved] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');

            // Chart Refs
            const irCanvasRef = useRef(null);
            const msCanvasRef = useRef(null);
            const chartInstanceRef = useRef(null);

            const activeCompound = COMPOUNDS_DB[activeCompoundId];

            // Generate IR points only when compound changes
            const irPoints = useMemo(() => generateIRData(activeCompound.irPeaks), [activeCompoundId]);

            // Mode Switching / Compound Setup
            useEffect(() => {
                setIsSolved(false);
                setSelectedFormula('');
                setSelectedFunctionalGroup('');
                setErrorMsg('');
                
                if (appMode === 'learn') {
                    // Unlock all clues instantly in learn mode
                    setUnlockedClues(Object.keys(activeCompound.clues));
                } else if (appMode === 'challenge') {
                    // Pick a random compound and lock clues
                    const keys = Object.keys(COMPOUNDS_DB);
                    const randomKey = keys[Math.floor(Math.random() * keys.length)];
                    setActiveCompoundId(randomKey);
                    setUnlockedClues([]);
                }
            }, [appMode]); // Runs on mode change

            // Keep learning mode clues unlocked if user switches compounds manually
            useEffect(() => {
                if (appMode === 'learn') {
                    setUnlockedClues(Object.keys(activeCompound.clues));
                }
            }, [activeCompoundId, appMode]);

            // --- CHART.JS RENDERING ---
            useEffect(() => {
                if (chartInstanceRef.current) chartInstanceRef.current.destroy();

                if (activeTab === 'IR' && irCanvasRef.current) {
                    const ctx = irCanvasRef.current.getContext('2d');
                    chartInstanceRef.current = new Chart(ctx, {
                        type: 'line',
                        data: {
                            datasets: [{
                                label: 'Transmittance (%)',
                                data: irPoints,
                                borderColor: '#0EA5E9',
                                borderWidth: 2,
                                pointRadius: 0,
                                pointHoverRadius: 5,
                                tension: 0.1
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            interaction: { mode: 'nearest', intersect: false },
                            plugins: {
                                legend: { display: false },
                                tooltip: {
                                    callbacks: { label: (ctx) => `T: ${ctx.parsed.y.toFixed(1)}% at ${ctx.parsed.x} cm⁻¹` }
                                }
                            },
                            scales: {
                                x: {
                                    type: 'linear', reverse: true, min: 500, max: 4000,
                                    title: { display: true, text: 'Wavenumber (cm⁻¹)', color: '#94A3B8' },
                                    grid: { color: '#1E293B' }, ticks: { color: '#64748B' }
                                },
                                y: {
                                    min: 0, max: 100,
                                    title: { display: true, text: 'Transmittance (%)', color: '#94A3B8' },
                                    grid: { color: '#1E293B' }, ticks: { color: '#64748B' }
                                }
                            },
                            onClick: (e, activeElements, chart) => {
                                if (appMode === 'challenge') {
                                    const xValue = chart.scales.x.getValueForPixel(e.x);
                                    handlePeakClick('IR', xValue);
                                }
                            }
                        }
                    });
                } else if (activeTab === 'MS' && msCanvasRef.current) {
                    const ctx = msCanvasRef.current.getContext('2d');
                    chartInstanceRef.current = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: activeCompound.ms.labels,
                            datasets: [{
                                label: 'Relative Abundance (%)',
                                data: activeCompound.ms.data,
                                backgroundColor: '#F43F5E',
                                barThickness: 6 
                            }]
                        },
                        options: {
                            responsive: true, maintainAspectRatio: false,
                            plugins: {
                                legend: { display: false },
                                tooltip: { callbacks: { label: (ctx) => `Abundance: ${ctx.parsed.y}% (m/z: ${ctx.label})` } }
                            },
                            scales: {
                                x: {
                                    title: { display: true, text: 'Mass-to-Charge Ratio (m/z)', color: '#94A3B8' },
                                    grid: { display: false }, ticks: { color: '#64748B' }
                                },
                                y: {
                                    min: 0, max: 100,
                                    title: { display: true, text: 'Relative Abundance (%)', color: '#94A3B8' },
                                    grid: { color: '#1E293B' }, ticks: { color: '#64748B' }
                                }
                            },
                            onClick: (e, activeElements) => {
                                if (appMode === 'challenge' && activeElements.length > 0) {
                                    const idx = activeElements[0].index;
                                    const mzValue = activeCompound.ms.labels[idx];
                                    handlePeakClick('MS', mzValue);
                                }
                            }
                        }
                    });
                }

                return () => {
                    if (chartInstanceRef.current) chartInstanceRef.current.destroy();
                };
            }, [activeTab, irPoints, activeCompoundId, appMode]);

            // --- LOGIC ENGINE ---
            const handlePeakClick = (type, val) => {
                const clues = Object.entries(activeCompound.clues);
                let unlockedId = null;

                for (let [id, clue] of clues) {
                    if (clue.type === type) {
                        // Generous hitboxes for IR
                        if (type === 'IR' && val >= clue.min && val <= clue.max) {
                            unlockedId = id; break;
                        } else if (type === 'MS' && val === clue.val) {
                            unlockedId = id; break;
                        }
                    }
                }

                if (unlockedId && !unlockedClues.includes(unlockedId)) {
                    setUnlockedClues(prev => [...prev, unlockedId]);
                }
            };

            const verifyDeduction = () => {
                if (selectedFormula === activeCompound.formula && selectedFunctionalGroup === activeCompound.group) {
                    setIsSolved(true);
                    setErrorMsg('');
                } else {
                    setErrorMsg('Incorrect combination. Review your clues and empirical data!');
                    setTimeout(() => setErrorMsg(''), 4000); 
                }
            };

            const startNewChallenge = () => {
                setIsSolved(false);
                setSelectedFormula('');
                setSelectedFunctionalGroup('');
                setUnlockedClues([]);
                setErrorMsg('');
                
                // Pick a new random compound
                const keys = Object.keys(COMPOUNDS_DB);
                const randomKey = keys[Math.floor(Math.random() * keys.length)];
                setActiveCompoundId(randomKey);
            };

            // --- RENDER HELPERS ---
            const totalClues = Object.keys(activeCompound.clues).length;
            
            // Bug Fix: Only count clues that actually belong to the CURRENT active compound. 
            // This prevents brief visual glitches in the progress bar during state transitions.
            const validUnlockedCount = unlockedClues.filter(id => activeCompound.clues[id]).length;
            const progress = Math.min(100, (validUnlockedCount / totalClues) * 100);
            
            const emp = activeCompound.empirical;

            return (
                <div className="w-full max-w-7xl h-full flex flex-col bg-slate-900 border border-slate-700 rounded-3xl shadow-2xl overflow-hidden">
                    
                    {/* Header */}
                    <header className="bg-slate-800/80 backdrop-blur p-5 border-b border-slate-700 flex flex-col md:flex-row justify-between items-center shrink-0 z-10 gap-4">
                        <div>
                            <h1 className="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-fuchsia-500">
                                Spectroscopy Detective
                            </h1>
                            <div className="flex items-center gap-3 mt-2">
                                <button 
                                    onClick={() => setAppMode('learn')}
                                    className={`text-[10px] uppercase tracking-widest font-bold px-3 py-1 rounded-full transition-colors ${appMode === 'learn' ? 'bg-sky-500 text-white' : 'bg-slate-800 text-slate-500 hover:text-slate-300'}`}
                                >
                                    Learning Mode
                                </button>
                                <button 
                                    onClick={() => setAppMode('challenge')}
                                    className={`text-[10px] uppercase tracking-widest font-bold px-3 py-1 rounded-full transition-colors ${appMode === 'challenge' ? 'bg-fuchsia-500 text-white' : 'bg-slate-800 text-slate-500 hover:text-slate-300'}`}
                                >
                                    Challenge Mode
                                </button>
                            </div>
                        </div>

                        {/* Top Right Controls based on Mode */}
                        {appMode === 'learn' ? (
                            <div className="w-full md:w-72">
                                <label className="text-[10px] text-slate-400 uppercase font-bold tracking-widest block mb-1">Study Compound</label>
                                <select 
                                    value={activeCompoundId} onChange={(e) => setActiveCompoundId(e.target.value)}
                                    className="w-full bg-slate-950 border border-slate-700 text-sky-300 text-sm font-bold rounded-lg p-2 outline-none focus:border-sky-500 transition-colors cursor-pointer"
                                >
                                    {Object.entries(COMPOUNDS_DB).map(([key, data]) => <option key={key} value={key}>{data.name} ({data.formula})</option>)}
                                </select>
                            </div>
                        ) : (
                            <div className="w-full md:w-64">
                                <div className="flex justify-between text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">
                                    <span>Clues Extracted</span>
                                    <span className={validUnlockedCount === totalClues ? 'text-emerald-400' : ''}>
                                        {validUnlockedCount} / {totalClues}
                                    </span>
                                </div>
                                <div className="w-full h-2 bg-slate-800 rounded-full overflow-hidden">
                                    <div className="h-full bg-gradient-to-r from-sky-500 to-fuchsia-500 transition-all duration-500 ease-out" style={{ width: `${progress}%` }}></div>
                                </div>
                            </div>
                        )}
                    </header>

                    {/* Main Workspace Layout */}
                    <div className="flex-grow flex flex-col lg:flex-row overflow-hidden relative">
                        
                        {/* LEFT PANEL: Interactive Spectra Viewer */}
                        <div className="w-full lg:w-7/12 p-6 lg:p-8 border-b lg:border-b-0 lg:border-r border-slate-700 flex flex-col justify-start overflow-hidden bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-800/50 to-slate-950">
                            
                            {/* Tabs */}
                            <div className="flex gap-4 mb-6 shrink-0">
                                <button 
                                    onClick={() => setActiveTab('IR')}
                                    className={`px-6 py-2.5 rounded-xl font-bold text-sm transition-all border-2
                                        ${activeTab === 'IR' ? 'bg-sky-500/20 text-sky-400 border-sky-500/50 shadow-[0_0_15px_rgba(14,165,233,0.2)]' : 'bg-slate-900 text-slate-500 border-slate-800 hover:border-slate-600'}`}
                                >
                                    Infrared (IR) Spectrum
                                </button>
                                <button 
                                    onClick={() => setActiveTab('MS')}
                                    className={`px-6 py-2.5 rounded-xl font-bold text-sm transition-all border-2
                                        ${activeTab === 'MS' ? 'bg-fuchsia-500/20 text-fuchsia-400 border-fuchsia-500/50 shadow-[0_0_15px_rgba(217,70,239,0.2)]' : 'bg-slate-900 text-slate-500 border-slate-800 hover:border-slate-600'}`}
                                >
                                    Mass Spectrometry (MS)
                                </button>
                            </div>

                            {/* Chart Container */}
                            <div className={`flex-grow w-full bg-slate-900 border border-slate-700 rounded-2xl p-4 shadow-inner relative ${appMode === 'challenge' && !isSolved ? 'animate-pulse-glow' : ''}`}>
                                
                                {appMode === 'challenge' && !isSolved && (
                                    <div className="absolute top-6 right-6 bg-slate-800/80 backdrop-blur text-[10px] text-slate-300 px-3 py-1.5 rounded-lg border border-slate-600 uppercase tracking-widest z-10 pointer-events-none">
                                        Target the major peaks to extract clues
                                    </div>
                                )}

                                <div className="w-full h-full relative">
                                    {activeTab === 'IR' && <canvas ref={irCanvasRef}></canvas>}
                                    {activeTab === 'MS' && <canvas ref={msCanvasRef}></canvas>}
                                </div>

                            </div>
                        </div>

                        {/* RIGHT PANEL: Clues, Empirical Data, & Deduction Engine */}
                        <div className="w-full lg:w-5/12 bg-slate-900 flex flex-col z-10 overflow-hidden">
                            
                            {/* Scrollable Context Area */}
                            <div className="p-6 lg:p-8 flex-grow overflow-y-auto custom-scroll space-y-8">
                                
                                {/* Header based on Mode */}
                                {appMode === 'learn' ? (
                                    <div className="bg-sky-900/20 border border-sky-500/30 p-5 rounded-xl">
                                        <h2 className="text-[10px] font-bold text-sky-400 uppercase tracking-widest mb-1">Compound Identity</h2>
                                        <p className="text-2xl font-bold text-white">{activeCompound.name} <span className="text-sm text-slate-400 font-mono ml-2">({activeCompound.formula})</span></p>
                                        <p className="text-sm font-semibold text-sky-300 mt-1">Functional Group: {activeCompound.group}</p>
                                    </div>
                                ) : (
                                    <div className="bg-slate-950 p-5 rounded-xl border border-slate-800 flex justify-between items-center">
                                        <div>
                                            <h2 className="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1">Target</h2>
                                            <p className="text-xl font-bold text-slate-300 font-mono">Unknown Compound X</p>
                                        </div>
                                        <svg className="w-8 h-8 text-fuchsia-500 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                    </div>
                                )}

                                {/* Empirical Data Box */}
                                <div>
                                    <h2 className="text-xs font-bold text-slate-500 uppercase tracking-widest border-b border-slate-800 pb-2 mb-4">Empirical Analysis</h2>
                                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                                        <span className="text-[10px] uppercase text-slate-500 font-bold block mb-1">Elemental Composition</span>
                                        <div className="flex gap-4 font-mono text-sm text-slate-300">
                                            <span>C: <span className="text-white">{emp.C}%</span></span>
                                            <span>H: <span className="text-white">{emp.H}%</span></span>
                                            {emp.O > 0 && <span>O: <span className="text-white">{emp.O}%</span></span>}
                                            {emp.N > 0 && <span>N: <span className="text-white">{emp.N}%</span></span>}
                                        </div>
                                    </div>
                                </div>

                                {/* Extracted Clues Ledger */}
                                <div>
                                    <h2 className="text-xs font-bold text-slate-500 uppercase tracking-widest border-b border-slate-800 pb-2 mb-4">
                                        {appMode === 'learn' ? 'Key Spectral Features (Cheat Sheet)' : 'Extracted Structural Clues'}
                                    </h2>
                                    <div className="space-y-3 min-h-[200px]">
                                        {unlockedClues.length === 0 ? (
                                            <div className="h-full flex flex-col items-center justify-center opacity-40 text-center py-8">
                                                <svg className="w-12 h-12 mb-3 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                                                <p className="text-sm font-semibold">No clues extracted yet.</p>
                                                <p className="text-xs mt-1">Interact with the spectra on the left.</p>
                                            </div>
                                        ) : (
                                            unlockedClues.map((id, index) => {
                                                const clue = activeCompound.clues[id];
                                                // Safety Check: If the clue doesn't belong to the active compound, skip rendering it
                                                if (!clue) return null;
                                                
                                                return (
                                                    <div key={id} className="bg-slate-800/50 p-3 rounded-lg border border-slate-700 flex gap-3 clue-unlocked shadow-sm" style={{ animationDelay: `${index * 0.05}s` }}>
                                                        <div 
                                                            className="px-2 py-1 rounded text-[10px] font-bold h-fit shrink-0"
                                                            style={{ backgroundColor: `${clue.color}20`, color: clue.color, border: `1px solid ${clue.color}50` }}
                                                        >
                                                            {clue.type}
                                                        </div>
                                                        <p className="text-sm text-slate-300 leading-relaxed">{clue.text}</p>
                                                    </div>
                                                )
                                            })
                                        )}
                                    </div>
                                </div>

                            </div>

                            {/* Sticky Deduction Footer (Only in Challenge Mode) */}
                            {appMode === 'challenge' && (
                                <div className="p-6 bg-slate-950 border-t border-slate-800 shrink-0">
                                    
                                    {isSolved ? (
                                        <div className="bg-emerald-900/20 border border-emerald-500/50 p-5 rounded-2xl flex flex-col gap-4 animate-unlockSlide">
                                            <div className="flex items-center gap-4">
                                                <div className="p-3 bg-emerald-500/20 text-emerald-400 rounded-full shrink-0">
                                                    <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7"></path></svg>
                                                </div>
                                                <div>
                                                    <h3 className="text-lg font-bold text-emerald-400 uppercase tracking-widest mb-1">Compound Identified</h3>
                                                    <p className="text-xl font-bold text-white">{activeCompound.name} ({activeCompound.formula})</p>
                                                    <p className="text-xs text-emerald-200/70 mt-1">{activeCompound.group}. Matches empirical data, fragmentation pattern, and IR frequencies perfectly.</p>
                                                </div>
                                            </div>
                                            <button 
                                                onClick={startNewChallenge}
                                                className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition-all shadow-lg"
                                            >
                                                NEXT CHALLENGE →
                                            </button>
                                        </div>
                                    ) : (
                                        <div className="space-y-4">
                                            <h2 className="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Final Deduction</h2>
                                            
                                            <div className="flex gap-3">
                                                <select 
                                                    value={selectedFormula} onChange={(e) => setSelectedFormula(e.target.value)}
                                                    className="w-1/2 bg-slate-900 border border-slate-700 text-slate-200 text-sm rounded-lg p-2.5 outline-none focus:border-sky-500 transition-colors cursor-pointer"
                                                >
                                                    <option value="" disabled>Molecular Formula...</option>
                                                    {FORMULA_OPTIONS.map(f => <option key={f} value={f}>{f}</option>)}
                                                </select>
                                                
                                                <select 
                                                    value={selectedFunctionalGroup} onChange={(e) => setSelectedFunctionalGroup(e.target.value)}
                                                    className="w-1/2 bg-slate-900 border border-slate-700 text-slate-200 text-sm rounded-lg p-2.5 outline-none focus:border-fuchsia-500 transition-colors cursor-pointer"
                                                >
                                                    <option value="" disabled>Functional Group...</option>
                                                    {GROUP_OPTIONS.map(g => <option key={g} value={g}>{g}</option>)}
                                                </select>
                                            </div>

                                            <button 
                                                onClick={verifyDeduction}
                                                disabled={!selectedFormula || !selectedFunctionalGroup}
                                                className="w-full bg-slate-200 hover:bg-white disabled:bg-slate-800 text-slate-900 disabled:text-slate-500 font-bold py-3.5 rounded-xl transition-all shadow-lg active:scale-[0.98]"
                                            >
                                                SUBMIT TRIANGULATION
                                            </button>
                                            
                                            {/* Dynamic Error Message */}
                                            {errorMsg && (
                                                <div className="text-rose-400 text-xs text-center mt-2 font-bold animate-pulse">
                                                    {errorMsg}
                                                </div>
                                            )}
                                        </div>
                                    )}

                                </div>
                            )}

                        </div>

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
