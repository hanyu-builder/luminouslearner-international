<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Addition Polymerization Maker | Animation Simulator</title>
    <meta name="description" content="Interactive addition polymerization animation. Visualize radical chain propagation as monomers like ethene and propene form long polymer chains.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: { 850: '#151e2e', 900: '#0F172A', 950: '#020617' },
                        poly: {
                            carbon: '#06B6D4',   // Cyan
                            hydrogen: '#F8FAFC', // White
                            chlorine: '#10B981', // Emerald
                            methyl: '#F59E0B',   // Amber
                            radical: '#F43F5E',  // Rose
                            bond: '#94A3B8'      // Slate 400
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- p5.js Library for Animation Physics and Rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #0F172A; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        #canvas-container {
            background-image: radial-gradient(circle at 2px 2px, #1e293b 1px, transparent 0);
            background-size: 40px 40px;
            background-position: -19px -19px;
        }

        /* Custom Range Slider styling */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px; width: 16px;
            border-radius: 50%;
            background: #06B6D4;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px;
            cursor: pointer;
            background: #334155;
            border-radius: 2px;
        }
    </style>
</head>
<body class="flex flex-col md:flex-row h-screen max-h-[1000px] w-full text-slate-100 font-sans selection:bg-cyan-500 selection:text-white">

    <!-- Left Panel: Controls & Telemetry -->
    <aside class="w-full md:w-[380px] lg:w-[420px] bg-slate-900 border-b md:border-b-0 md:border-r border-slate-700 flex flex-col z-10 shadow-2xl overflow-y-auto no-scrollbar h-[45vh] md:h-full shrink-0">
        
        <!-- Header -->
        <div class="p-6 pb-4 border-b border-slate-800">
            <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-blue-500">
                Addition Polymerization
            </h1>
            <p class="text-xs text-slate-400 mt-1">Radical Chain Propagation Animation</p>
        </div>

        <!-- Controls -->
        <div class="p-6 flex flex-col gap-6">
            
            <!-- Monomer Selection -->
            <div class="space-y-3">
                <label class="text-sm font-semibold text-slate-300 uppercase tracking-wider block">1. Select Monomer</label>
                <div class="grid grid-cols-1 gap-2">
                    <label class="flex items-center gap-3 p-3 bg-slate-800 border border-slate-700 rounded-lg cursor-pointer hover:border-cyan-500 transition-colors">
                        <input type="radio" name="monomer" value="ethene" checked class="text-cyan-500 focus:ring-cyan-500 bg-slate-900 border-slate-600">
                        <div class="flex-grow">
                            <span class="block text-sm font-bold text-slate-200">Ethene (Ethylene)</span>
                            <span class="block text-xs text-slate-500">Forms: Polyethylene (PE)</span>
                        </div>
                        <div class="w-6 h-6 rounded-full bg-poly-hydrogen border-2 border-slate-600 flex items-center justify-center text-[10px] text-slate-900 font-bold">H</div>
                    </label>
                    
                    <label class="flex items-center gap-3 p-3 bg-slate-800 border border-slate-700 rounded-lg cursor-pointer hover:border-cyan-500 transition-colors">
                        <input type="radio" name="monomer" value="propene" class="text-cyan-500 focus:ring-cyan-500 bg-slate-900 border-slate-600">
                        <div class="flex-grow">
                            <span class="block text-sm font-bold text-slate-200">Propene (Propylene)</span>
                            <span class="block text-xs text-slate-500">Forms: Polypropylene (PP)</span>
                        </div>
                        <div class="w-6 h-6 rounded-full bg-poly-methyl border-2 border-slate-600 flex items-center justify-center text-[9px] text-white font-bold">CH₃</div>
                    </label>

                    <label class="flex items-center gap-3 p-3 bg-slate-800 border border-slate-700 rounded-lg cursor-pointer hover:border-cyan-500 transition-colors">
                        <input type="radio" name="monomer" value="chloroethene" class="text-cyan-500 focus:ring-cyan-500 bg-slate-900 border-slate-600">
                        <div class="flex-grow">
                            <span class="block text-sm font-bold text-slate-200">Chloroethene</span>
                            <span class="block text-xs text-slate-500">Forms: Polyvinyl Chloride (PVC)</span>
                        </div>
                        <div class="w-6 h-6 rounded-full bg-poly-chlorine border-2 border-slate-600 flex items-center justify-center text-[10px] text-white font-bold">Cl</div>
                    </label>
                </div>
            </div>

            <!-- Chain Length Slider -->
            <div class="space-y-3 bg-slate-800/50 p-4 rounded-xl border border-slate-700/50">
                <div class="flex justify-between items-end">
                    <label class="text-sm font-semibold text-slate-300 uppercase tracking-wider">2. Chain Length (n)</label>
                    <span id="n-display" class="font-mono text-cyan-400 font-bold text-lg">6</span>
                </div>
                <input type="range" id="chain-length" min="3" max="12" value="6" class="w-full">
            </div>

            <!-- Action Buttons -->
            <div class="flex gap-3 pt-2">
                <button id="btn-initiate" class="flex-grow bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold py-3 rounded-xl transition-all shadow-lg shadow-cyan-900/50 active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed">
                    Initiate Reaction
                </button>
                <button id="btn-reset" class="px-6 bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-200 font-bold py-3 rounded-xl transition-all active:scale-[0.98]">
                    Reset
                </button>
            </div>
            
            <!-- Scientific Info Panel -->
            <div class="mt-2 p-4 bg-slate-900 rounded-xl border border-slate-700 shadow-inner">
                <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Reaction Mechanics</h3>
                <p id="mech-desc" class="text-sm text-slate-300 leading-relaxed">
                    Monomers are currently floating freely. A carbon-carbon double bond (π bond) holds them together.
                </p>
                <div class="mt-3 p-2 bg-slate-950 rounded border border-slate-800 font-mono text-xs text-center text-cyan-300 overflow-x-auto whitespace-nowrap">
                    <span id="eq-left">n CH₂=CH₂</span> <span class="text-slate-500 mx-2">→</span> <span id="eq-right">-(CH₂-CH₂)_n-</span>
                </div>
            </div>

        </div>
    </aside>

    <!-- Right Panel: Canvas Area -->
    <main class="flex-grow relative bg-slate-950 flex flex-col h-[55vh] md:h-full">
        <!-- p5.js will attach here -->
        <div id="canvas-container" class="absolute inset-0 w-full h-full"></div>
        
        <!-- Status Overlay -->
        <div class="absolute bottom-6 left-1/2 -translate-x-1/2 bg-slate-900/80 backdrop-blur-md border border-slate-700/50 text-slate-300 text-xs py-2 px-4 rounded-full pointer-events-none flex items-center gap-2 shadow-xl">
            <span id="status-indicator" class="w-2 h-2 rounded-full bg-slate-500"></span>
            <span id="status-text">Status: Idle</span>
        </div>
    </main>

    <!-- Simulation Engine -->
    <script>
        // --- DATA DICTIONARY ---
        const MONOMER_DATA = {
            ethene: { name: "Ethene", polymer: "Polyethylene", rGroup: "H", color: "#F8FAFC", eq: "CH₂=CH₂" },
            propene: { name: "Propene", polymer: "Polypropylene", rGroup: "CH₃", color: "#F59E0B", eq: "CH₂=CH(CH₃)" },
            chloroethene: { name: "Chloroethene", polymer: "Polyvinyl Chloride", rGroup: "Cl", color: "#10B981", eq: "CH₂=CHCl" }
        };

        // --- GLOBAL SIMULATION STATE ---
        let currentType = 'ethene';
        let chainLength = 6;
        let simulationState = 'idle'; // 'idle', 'aligning', 'propagating', 'finished'
        
        // --- p5.js INSTANCE ---
        const sketch = (p) => {
            let monomers = [];
            let initiator = null;
            let terminator = null;
            let currentPropagatorIndex = -1;
            let propagationTimer = 0;

            // Visual layout constants
            const C_RADIUS = 16;
            const H_RADIUS = 10;
            const BOND_LENGTH = 30; // internal C=C distance
            const CHAIN_SPACING = 75; // distance between aligned monomers

            p.setup = () => {
                let container = document.getElementById('canvas-container');
                p.createCanvas(container.offsetWidth, container.offsetHeight);
                p.textAlign(p.CENTER, p.CENTER);
                p.rectMode(p.CENTER);
                resetSimulation();
            };

            p.draw = () => {
                p.clear();

                // 1. State Machine Logic & Physics Updates
                if (simulationState === 'idle') {
                    monomers.forEach(m => m.float(p));
                } 
                else if (simulationState === 'aligning') {
                    let allAligned = true;
                    monomers.forEach((m, index) => {
                        let targetX = p.width/2 - ((chainLength-1) * CHAIN_SPACING)/2 + (index * CHAIN_SPACING);
                        let targetY = p.height/2;
                        m.lerpTo(targetX, targetY, 0, 0.05);
                        if (!m.isAtTarget(targetX, targetY)) allAligned = false;
                    });
                    
                    if (allAligned) {
                        simulationState = 'propagating';
                        currentPropagatorIndex = 0;
                        updateStatusUI('Reacting...', '#F43F5E'); // Rose (Radical color)
                        
                        // Spawn Initiator (Radical)
                        let firstMonomerX = p.width/2 - ((chainLength-1) * CHAIN_SPACING)/2;
                        initiator = new Radical(p, firstMonomerX - 100, p.height/2, firstMonomerX - BOND_LENGTH, p.height/2, 'R');
                    }
                }
                else if (simulationState === 'propagating') {
                    // Lock monomers in place
                    monomers.forEach(m => m.float(p, 0)); // 0 movement

                    // Initiator flies in
                    if (currentPropagatorIndex === 0 && initiator.state === 'flying') {
                        initiator.update();
                        if (initiator.state === 'attached') {
                            monomers[0].breakDoubleBond();
                        }
                    }

                    // Cascade chain reaction
                    if (currentPropagatorIndex >= 0 && currentPropagatorIndex < chainLength) {
                        let currentMonomer = monomers[currentPropagatorIndex];
                        
                        if (currentMonomer.state === 'breaking') {
                            currentMonomer.animateBondBreaking();
                        } else if (currentMonomer.state === 'radical') {
                            // Bond broken, right arm extending. Move to next monomer.
                            if (currentPropagatorIndex < chainLength - 1) {
                                currentPropagatorIndex++;
                                setTimeout(() => {
                                    monomers[currentPropagatorIndex].breakDoubleBond();
                                }, 300); // Small delay for visual cascade effect
                            } else {
                                // Reached the end
                                currentPropagatorIndex++;
                            }
                        }
                    } else if (currentPropagatorIndex >= chainLength) {
                        // Termination phase
                        if (!terminator) {
                            let lastMonomerX = p.width/2 - ((chainLength-1) * CHAIN_SPACING)/2 + ((chainLength-1) * CHAIN_SPACING);
                            terminator = new Radical(p, lastMonomerX + 100, p.height/2, lastMonomerX + BOND_LENGTH, p.height/2, 'R');
                        }
                        terminator.update();
                        if (terminator.state === 'attached') {
                            simulationState = 'finished';
                            updateStatusUI('Polymerization Complete', '#10B981'); // Emerald
                            document.getElementById('btn-initiate').disabled = false;
                        }
                    }
                }
                else if (simulationState === 'finished') {
                    // Gentle unified drift for the whole polymer
                    let driftY = p.sin(p.frameCount * 0.02) * 10;
                    let startX = p.width/2 - ((chainLength-1) * CHAIN_SPACING)/2;
                    
                    p.push();
                    p.translate(0, driftY);
                    
                    // Draw Brackets for repeating unit
                    p.stroke('#94A3B8');
                    p.strokeWeight(2);
                    p.noFill();
                    // Left bracket
                    p.line(startX - 45, p.height/2 - 40, startX - 55, p.height/2 - 40);
                    p.line(startX - 55, p.height/2 - 40, startX - 55, p.height/2 + 40);
                    p.line(startX - 45, p.height/2 + 40, startX - 55, p.height/2 + 40);
                    
                    // Right bracket
                    let endX = startX + (chainLength-1) * CHAIN_SPACING;
                    p.line(endX + 45, p.height/2 - 40, endX + 55, p.height/2 - 40);
                    p.line(endX + 55, p.height/2 - 40, endX + 55, p.height/2 + 40);
                    p.line(endX + 45, p.height/2 + 40, endX + 55, p.height/2 + 40);
                    
                    p.fill('#94A3B8');
                    p.noStroke();
                    p.textSize(16);
                    p.text('n', endX + 65, p.height/2 + 40);
                    p.pop();

                    monomers.forEach(m => m.setGlobalOffset(0, driftY));
                    if (initiator) initiator.setGlobalOffset(0, driftY);
                    if (terminator) terminator.setGlobalOffset(0, driftY);
                }

                // 2. Render Loop
                // Draw connecting chains first so they are under atoms
                if (simulationState === 'propagating' || simulationState === 'finished') {
                    p.stroke('#94A3B8');
                    p.strokeWeight(4);
                    for (let i = 0; i < chainLength - 1; i++) {
                        let m1 = monomers[i];
                        let m2 = monomers[i+1];
                        if (m1.state === 'radical' || m1.state === 'polymerized') {
                            // Draw connecting line extending from right of m1 to left of m2
                            let m1RightCX = m1.x + m1.globalOffX + (BOND_LENGTH/2) * p.cos(m1.angle);
                            let m1RightCY = m1.y + m1.globalOffY + (BOND_LENGTH/2) * p.sin(m1.angle);
                            
                            // Line extends based on animation frame
                            let currentExt = m1.armExtension; 
                            let targetExtX = m2.x + m2.globalOffX - (BOND_LENGTH/2) * p.cos(m2.angle);
                            let targetExtY = m2.y + m2.globalOffY - (BOND_LENGTH/2) * p.sin(m2.angle);
                            
                            let drawX = p.lerp(m1RightCX, targetExtX, currentExt);
                            let drawY = p.lerp(m1RightCY, targetExtY, currentExt);
                            
                            p.line(m1RightCX, m1RightCY, drawX, drawY);
                        }
                    }
                }

                if (initiator) initiator.draw();
                monomers.forEach(m => m.draw(p));
                if (terminator) terminator.draw();
            };

            p.windowResized = () => {
                let container = document.getElementById('canvas-container');
                p.resizeCanvas(container.offsetWidth, container.offsetHeight);
                if(simulationState === 'finished') resetSimulation(); // Easy layout fix on resize
            };

            // Expose reset to global scope for the button
            window.resetSimulation = () => {
                monomers = [];
                initiator = null;
                terminator = null;
                simulationState = 'idle';
                currentPropagatorIndex = -1;
                
                // Initialize floating monomers
                for (let i = 0; i < chainLength; i++) {
                    monomers.push(new Monomer(
                        p, 
                        p.random(100, p.width - 100), 
                        p.random(100, p.height - 100), 
                        currentType
                    ));
                }
                
                updateStatusUI('Idle', '#64748B'); // Slate 500
                document.getElementById('btn-initiate').disabled = false;
                
                // Update UI text
                const rGroup = MONOMER_DATA[currentType].rGroup;
                document.getElementById('eq-left').innerText = `n ${MONOMER_DATA[currentType].eq}`;
                document.getElementById('eq-right').innerText = `-[CH₂-CH(${rGroup})]-ₙ`;
                document.getElementById('mech-desc').innerText = `Monomers are currently floating freely. A carbon-carbon double bond (π bond) holds them together.`;
            };

            window.initiateReaction = () => {
                if (simulationState !== 'idle') return;
                simulationState = 'aligning';
                document.getElementById('btn-initiate').disabled = true;
                updateStatusUI('Aligning monomers...', '#EAB308'); // Yellow
                document.getElementById('mech-desc').innerText = `An initiator radical (R•) is introduced. The high-energy unpaired electron attacks the π bond of the first monomer, breaking it open and starting the chain reaction.`;
            };

            // --- CLASSES ---

            class Radical {
                constructor(p, startX, startY, targetX, targetY, text) {
                    this.p = p;
                    this.x = startX;
                    this.y = startY;
                    this.targetX = targetX;
                    this.targetY = targetY;
                    this.text = text;
                    this.state = 'flying';
                    this.progress = 0;
                    this.globalOffX = 0;
                    this.globalOffY = 0;
                }
                update() {
                    if (this.state === 'flying') {
                        this.progress += 0.05;
                        this.x = this.p.lerp(this.x, this.targetX, 0.1);
                        this.y = this.p.lerp(this.y, this.targetY, 0.1);
                        if (this.p.dist(this.x, this.y, this.targetX, this.targetY) < 2) {
                            this.state = 'attached';
                            this.x = this.targetX;
                            this.y = this.targetY;
                        }
                    }
                }
                setGlobalOffset(x, y) { this.globalOffX = x; this.globalOffY = y; }
                draw() {
                    let drawX = this.x + this.globalOffX;
                    let drawY = this.y + this.globalOffY;
                    
                    // Draw connecting line to carbon if attached
                    if (this.state === 'attached') {
                        this.p.stroke('#94A3B8');
                        this.p.strokeWeight(4);
                        this.p.line(drawX, drawY, drawX + (this.x < this.p.width/2 ? BOND_LENGTH : -BOND_LENGTH), drawY);
                    }

                    // Radical Group Circle
                    this.p.fill('#334155');
                    this.p.stroke('#94A3B8');
                    this.p.strokeWeight(2);
                    this.p.circle(drawX, drawY, 24);
                    
                    // Text
                    this.p.fill('#F8FAFC');
                    this.p.noStroke();
                    this.p.textSize(12);
                    this.p.text(this.text, drawX, drawY);

                    // Unpaired Electron (Glowing Red Dot)
                    if (this.state === 'flying') {
                        this.p.fill('#F43F5E');
                        this.p.circle(drawX + 12, drawY - 8, 6);
                        // Glow
                        this.p.fill('rgba(244, 63, 94, 0.3)');
                        this.p.circle(drawX + 12, drawY - 8, 14);
                    }
                }
            }

            class Monomer {
                constructor(p, x, y, type) {
                    this.p = p;
                    this.x = x;
                    this.y = y;
                    this.vx = p.random(-1, 1);
                    this.vy = p.random(-1, 1);
                    this.angle = p.random(p.TWO_PI);
                    this.vAngle = p.random(-0.02, 0.02);
                    this.type = type;
                    
                    this.state = 'double_bond'; // 'double_bond', 'breaking', 'radical', 'polymerized'
                    this.piBondAlpha = 255;
                    this.armExtension = 0; // 0 to 1
                    
                    this.data = MONOMER_DATA[type];
                    this.globalOffX = 0;
                    this.globalOffY = 0;
                }

                float(p, friction = 1) {
                    this.x += this.vx * friction;
                    this.y += this.vy * friction;
                    this.angle += this.vAngle * friction;
                    
                    // Bounce off walls
                    if (this.x < 50 || this.x > p.width - 50) this.vx *= -1;
                    if (this.y < 50 || this.y > p.height - 50) this.vy *= -1;
                }

                lerpTo(tx, ty, tAngle, amt) {
                    this.x = this.p.lerp(this.x, tx, amt);
                    this.y = this.p.lerp(this.y, ty, amt);
                    
                    // Shortest path angle lerp
                    let diff = tAngle - this.angle;
                    while (diff < -this.p.PI) diff += this.p.TWO_PI;
                    while (diff > this.p.PI) diff -= this.p.TWO_PI;
                    this.angle += diff * amt;
                }

                isAtTarget(tx, ty) {
                    return this.p.dist(this.x, this.y, tx, ty) < 1;
                }

                breakDoubleBond() {
                    this.state = 'breaking';
                }

                animateBondBreaking() {
                    this.piBondAlpha -= 15;
                    if (this.piBondAlpha <= 0) {
                        this.piBondAlpha = 0;
                        this.state = 'radical';
                    }
                }

                setGlobalOffset(x, y) {
                    this.globalOffX = x;
                    this.globalOffY = y;
                }

                draw(p) {
                    p.push();
                    p.translate(this.x + this.globalOffX, this.y + this.globalOffY);
                    p.rotate(this.angle);

                    let cDist = BOND_LENGTH / 2;

                    // --- DRAW BONDS ---
                    p.stroke('#94A3B8');
                    p.strokeWeight(4);
                    p.strokeCap(p.ROUND);
                    
                    // Sigma bond (Always there)
                    p.line(-cDist, 0, cDist, 0);

                    // Pi bond (Fades out when reacting)
                    if (this.piBondAlpha > 0) {
                        p.stroke(148, 163, 184, this.piBondAlpha); // Slate with alpha
                        p.line(-cDist, -8, cDist, -8);
                    }

                    // Radical / Extension Animation logic
                    if (this.state === 'radical' || this.state === 'polymerized') {
                        if (this.armExtension < 1) {
                            this.armExtension += 0.1;
                        } else {
                            this.state = 'polymerized'; // Arm fully extended
                        }
                    }

                    // Draw Radical Electron dot (moves from left C to right C during breaking)
                    if (this.state === 'breaking' || (this.state === 'radical' && this.armExtension < 1)) {
                        p.fill('#F43F5E');
                        p.noStroke();
                        // Put it on the right carbon
                        p.circle(cDist + 10, -10, 6);
                        p.fill('rgba(244, 63, 94, 0.3)');
                        p.circle(cDist + 10, -10, 14);
                    }

                    // --- DRAW ATOMS ---
                    // Helper to draw an atom
                    const drawAtom = (ax, ay, r, col, txt, tCol, tSize=10) => {
                        // Bond to center carbon
                        p.stroke('#64748B');
                        p.strokeWeight(3);
                        // Determine which carbon to connect to based on x pos
                        let centerCX = ax < 0 ? -cDist : cDist;
                        p.line(centerCX, 0, ax, ay);

                        p.fill(col);
                        p.stroke('#334155');
                        p.strokeWeight(2);
                        p.circle(ax, ay, r*2);
                        p.fill(tCol);
                        p.noStroke();
                        p.textSize(tSize);
                        p.text(txt, ax, ay);
                    };

                    // Draw 4 substituent groups (Top Left, Bottom Left, Top Right, Bottom Right)
                    let hOffX = 18;
                    let hOffY = 22;

                    // Left Carbon groups (Always Hydrogen for these monomers)
                    drawAtom(-cDist - hOffX, -hOffY, H_RADIUS, '#F8FAFC', 'H', '#0F172A');
                    drawAtom(-cDist - hOffX, hOffY, H_RADIUS, '#F8FAFC', 'H', '#0F172A');
                    
                    // Right Carbon groups (Top is H, Bottom is R-group)
                    drawAtom(cDist + hOffX, -hOffY, H_RADIUS, '#F8FAFC', 'H', '#0F172A');
                    
                    // Draw specialized R-group
                    let rGroupText = this.data.rGroup;
                    let rGroupColor = this.data.color;
                    let rSize = (currentType === 'propene') ? 16 : 12; // slightly larger circle for CH3
                    let tSize = (currentType === 'propene') ? 8 : 10;
                    drawAtom(cDist + hOffX, hOffY, rSize, rGroupColor, rGroupText, currentType === 'ethene' ? '#0F172A' : '#FFFFFF', tSize);

                    // Draw the two central Carbons last (so they sit on top of bonds)
                    p.fill('#06B6D4'); // Cyan
                    p.stroke('#0891B2');
                    p.strokeWeight(2);
                    p.circle(-cDist, 0, C_RADIUS*2);
                    p.circle(cDist, 0, C_RADIUS*2);
                    
                    p.fill('#FFFFFF');
                    p.noStroke();
                    p.textSize(12);
                    p.text('C', -cDist, 0);
                    p.text('C', cDist, 0);

                    p.pop();
                }
            }
        };

        // --- DOM EVENT LISTENERS & UI LOGIC ---
        
        // Initialize p5 instance
        let myp5 = new p5(sketch, 'canvas-container');

        // Monomer Selection
        document.querySelectorAll('input[name="monomer"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                currentType = e.target.value;
                if(window.resetSimulation) window.resetSimulation();
            });
        });

        // Chain Length Slider
        document.getElementById('chain-length').addEventListener('input', (e) => {
            chainLength = parseInt(e.target.value);
            document.getElementById('n-display').innerText = chainLength;
            if(window.resetSimulation) window.resetSimulation();
        });

        // Buttons
        document.getElementById('btn-initiate').addEventListener('click', () => {
            if(window.initiateReaction) window.initiateReaction();
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            if(window.resetSimulation) window.resetSimulation();
        });

        // UI Helper
        function updateStatusUI(text, color) {
            document.getElementById('status-text').innerText = `Status: ${text}`;
            document.getElementById('status-indicator').style.backgroundColor = color;
        }

    </script>
</body>
</html>
