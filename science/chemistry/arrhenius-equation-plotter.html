<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Arrhenius Equation Graph Plotter | Interactive Chemistry</title>
    <!-- Primary SEO Keyword: Arrhenius equation graph plotter -->
    <meta name="description" content="Calculate and visualize Activation Energy (Ea) with this Arrhenius equation graph plotter. Input T and k data to automatically generate the linear regression plot.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- D3.js & Math.js -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>

    <!-- React, ReactDOM, and Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        
        /* Table Inputs */
        input[type="number"] { -moz-appearance: textfield; }
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        
        /* D3 CSS */
        .axis-label { font-family: monospace; font-size: 12px; font-weight: bold; fill: #94a3b8; }
        .axis path, .axis line { stroke: #475569; }
        .axis text { fill: #cbd5e1; font-family: monospace; font-size: 11px; }
        .grid line { stroke: #334155; stroke-opacity: 0.5; stroke-dasharray: 4,4; }
        .grid path { stroke-width: 0; }
        
        .tooltip {
            position: absolute;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #334155;
            color: #f8fafc;
            padding: 8px;
            border-radius: 6px;
            pointer-events: none;
            font-family: monospace;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 50;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body class="bg-[#0F172A] text-slate-200 h-screen max-h-[1000px] overflow-hidden flex flex-col font-sans select-none">

    <div id="root" class="h-full w-full flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const UNIVERSAL_GAS_CONSTANT = 8.314; // J / (mol * K)

        // --- ICONS ---
        const ChartIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-orange-500"><path d="M3 3v18h18"></path><path d="m19 9-5 5-4-4-3 3"></path></svg>;
        const PlusIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
        const TrashIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>;

        function App() {
            // --- STATE ---
            const [points, setPoints] = useState([
                { id: '1', T: 300, k: 0.0019 },
                { id: '2', T: 310, k: 0.0050 },
                { id: '3', T: 320, k: 0.0121 },
                { id: '4', T: 330, k: 0.0274 },
                { id: '5', T: 340, k: 0.0592 }
            ]);

            const d3ContainerRef = useRef(null);
            const tooltipRef = useRef(null);

            // --- DATA TRANSFORMATION & REGRESSION ENGINE ---
            const processedData = useMemo(() => {
                const validData = [];
                for (let p of points) {
                    const T = parseFloat(p.T);
                    const k = parseFloat(p.k);
                    if (!isNaN(T) && !isNaN(k) && T > 0 && k > 0) {
                        validData.push({
                            id: p.id,
                            T, k,
                            x: 1 / T,          // 1/T
                            y: Math.log(k)     // ln(k)
                        });
                    }
                }
                return validData;
            }, [points]);

            const regression = useMemo(() => {
                const n = processedData.length;
                if (n < 2) return null;

                let sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;
                for (let p of processedData) {
                    sumX += p.x;
                    sumY += p.y;
                    sumXY += p.x * p.y;
                    sumXX += p.x * p.x;
                }

                const slope = (n * sumXY - sumX * sumY) / (n * sumXX - sumX * sumX);
                const intercept = (sumY - slope * sumX) / n;

                // R-squared
                const yMean = sumY / n;
                let ssTot = 0, ssRes = 0;
                for (let p of processedData) {
                    ssTot += Math.pow(p.y - yMean, 2);
                    const yPred = slope * p.x + intercept;
                    ssRes += Math.pow(p.y - yPred, 2);
                }
                const rSquared = ssTot === 0 ? 1 : (1 - (ssRes / ssTot));

                // Scientific outputs
                const Ea = -slope * UNIVERSAL_GAS_CONSTANT; // Joules/mol
                const Ea_kJ = Ea / 1000;
                const A = Math.exp(intercept);

                return { slope, intercept, rSquared, Ea_kJ, A };
            }, [processedData]);

            // --- UI HANDLERS ---
            const handleInput = (id, field, value) => {
                setPoints(pts => pts.map(p => p.id === id ? { ...p, [field]: value } : p));
            };

            const addRow = () => {
                setPoints([...points, { id: Date.now().toString(), T: '', k: '' }]);
            };

            const removeRow = (id) => {
                if (points.length <= 2) return; // Require at least 2 points
                setPoints(pts => pts.filter(p => p.id !== id));
            };

            // --- D3 VISUALIZATION ---
            useEffect(() => {
                if (!d3ContainerRef.current) return;
                
                const container = d3.select(d3ContainerRef.current);
                container.selectAll("*").remove();

                if (processedData.length < 2 || !regression) {
                    container.append('text')
                        .attr('x', '50%').attr('y', '50%')
                        .attr('text-anchor', 'middle')
                        .attr('fill', '#64748b')
                        .text('Please enter at least 2 valid points (T > 0, k > 0) to plot.');
                    return;
                }

                const rect = d3ContainerRef.current.getBoundingClientRect();
                const margin = { top: 30, right: 30, bottom: 60, left: 70 };
                const width = rect.width - margin.left - margin.right;
                const height = rect.height - margin.top - margin.bottom;

                const svg = container.append('svg')
                    .attr('width', rect.width)
                    .attr('height', rect.height)
                    .append('g')
                    .attr('transform', `translate(${margin.left},${margin.top})`);

                const tooltip = d3.select(tooltipRef.current);

                // Scales with padding
                const xExtent = d3.extent(processedData, d => d.x);
                const xPad = (xExtent[1] - xExtent[0]) * 0.1 || xExtent[0]*0.1;
                const xScale = d3.scaleLinear()
                    .domain([xExtent[0] - xPad, xExtent[1] + xPad])
                    .range([0, width]);

                const yExtent = d3.extent(processedData, d => d.y);
                const yPad = (yExtent[1] - yExtent[0]) * 0.1 || Math.abs(yExtent[0]*0.1);
                const yScale = d3.scaleLinear()
                    .domain([yExtent[0] - yPad, yExtent[1] + yPad])
                    .range([height, 0]);

                // Gridlines
                svg.append("g")
                    .attr("class", "grid")
                    .attr("transform", `translate(0,${height})`)
                    .call(d3.axisBottom(xScale).ticks(8).tickSize(-height).tickFormat(""));

                svg.append("g")
                    .attr("class", "grid")
                    .call(d3.axisLeft(yScale).ticks(8).tickSize(-width).tickFormat(""));

                // Axes
                const xAxis = d3.axisBottom(xScale).tickFormat(d3.format(".2e"));
                const yAxis = d3.axisLeft(yScale).tickFormat(d3.format(".2f"));

                svg.append('g')
                    .attr('class', 'axis')
                    .attr('transform', `translate(0,${height})`)
                    .call(xAxis);

                svg.append('g')
                    .attr('class', 'axis')
                    .call(yAxis);

                // Labels
                svg.append('text')
                    .attr('class', 'axis-label')
                    .attr('x', width / 2)
                    .attr('y', height + 45)
                    .attr('text-anchor', 'middle')
                    .text('1 / T (K⁻¹)');

                svg.append('text')
                    .attr('class', 'axis-label')
                    .attr('transform', 'rotate(-90)')
                    .attr('x', -height / 2)
                    .attr('y', -50)
                    .attr('text-anchor', 'middle')
                    .text('ln(k)');

                // Line of Best Fit
                const x1 = xScale.domain()[0];
                const x2 = xScale.domain()[1];
                const y1 = regression.slope * x1 + regression.intercept;
                const y2 = regression.slope * x2 + regression.intercept;

                svg.append('line')
                    .attr('x1', xScale(x1))
                    .attr('y1', yScale(y1))
                    .attr('x2', xScale(x2))
                    .attr('y2', yScale(y2))
                    .style('stroke', '#ef4444') // Red-500
                    .style('stroke-width', 3)
                    .style('stroke-dasharray', '5,5')
                    .style('opacity', 0)
                    .transition().duration(800)
                    .style('opacity', 0.8);

                // Data Points
                svg.selectAll('.dot')
                    .data(processedData)
                    .enter()
                    .append('circle')
                    .attr('class', 'dot')
                    .attr('cx', d => xScale(d.x))
                    .attr('cy', d => yScale(d.y))
                    .attr('r', 6)
                    .style('fill', '#22d3ee') // Cyan-400
                    .style('stroke', '#0F172A')
                    .style('stroke-width', 2)
                    .style('cursor', 'crosshair')
                    .on('mouseover', (event, d) => {
                        d3.select(event.currentTarget).style('fill', '#fbbf24').attr('r', 8);
                        tooltip.style('opacity', 1)
                            .html(`T: ${d.T} K<br/>k: ${d.k}<br/><br/>1/T: ${d.x.toExponential(3)}<br/>ln(k): ${d.y.toFixed(3)}`)
                            .style('left', (event.pageX + 10) + 'px')
                            .style('top', (event.pageY - 20) + 'px');
                    })
                    .on('mousemove', (event) => {
                        tooltip.style('left', (event.pageX + 10) + 'px')
                               .style('top', (event.pageY - 20) + 'px');
                    })
                    .on('mouseout', (event) => {
                        d3.select(event.currentTarget).style('fill', '#22d3ee').attr('r', 6);
                        tooltip.style('opacity', 0);
                    });

            }, [processedData, regression]);

            // --- RENDER ---
            return (
                <div className="flex flex-col h-full w-full">
                    {/* Header */}
                    <header className="bg-[#1E293B] border-b border-slate-800 p-4 shrink-0 flex justify-between items-center z-10 shadow-lg">
                        <div>
                            <h1 className="text-xl md:text-2xl font-bold text-white flex items-center gap-2 tracking-tight">
                                <ChartIcon /> Arrhenius Plotter
                            </h1>
                            <p className="text-xs md:text-sm text-slate-400 mt-1 hidden sm:block">
                                Calculates Activation Energy ($E_a$) via dynamic linear regression plotting.
                            </p>
                        </div>
                        <div className="hidden md:flex bg-slate-900 border border-slate-700 px-4 py-2 rounded-lg font-mono text-xs text-slate-300 flex-col shadow-inner">
                            <span className="text-slate-500 font-sans uppercase tracking-widest text-[10px] mb-1">Arrhenius Equation</span>
                            <span>ln(k) = <span className="text-red-400">(-E<sub>a</sub> / R)</span>(1/T) + ln(A)</span>
                        </div>
                    </header>

                    {/* Main Workspace */}
                    <main className="flex-1 flex flex-col lg:flex-row gap-6 p-4 md:p-6 overflow-hidden max-w-7xl w-full mx-auto">
                        
                        {/* LEFT PANEL: Data Table */}
                        <section className="flex flex-col gap-4 w-full lg:w-[450px] shrink-0 overflow-y-auto pr-2">
                            <div className="bg-[#1E293B] rounded-xl border border-slate-700 p-5 shadow-lg flex flex-col gap-4 h-full">
                                <h2 className="text-sm uppercase font-bold text-slate-300 tracking-wider border-b border-slate-700 pb-2">1. Kinetic Data Input</h2>
                                
                                <div className="flex-1 overflow-y-auto pr-2">
                                    <table className="w-full text-sm font-mono text-left border-separate border-spacing-y-2">
                                        <thead>
                                            <tr className="text-slate-500">
                                                <th className="font-bold pb-2">Temp (K)</th>
                                                <th className="font-bold pb-2">Rate Constant (k)</th>
                                                <th className="w-10"></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {points.map((p, index) => (
                                                <tr key={p.id} className="bg-slate-900/50">
                                                    <td className="p-1 rounded-l">
                                                        <input 
                                                            type="number" step="any"
                                                            value={p.T}
                                                            onChange={(e) => handleInput(p.id, 'T', e.target.value)}
                                                            className="w-full bg-transparent border border-slate-600 focus:border-orange-500 rounded p-2 text-white outline-none"
                                                            placeholder="e.g. 300"
                                                        />
                                                    </td>
                                                    <td className="p-1">
                                                        <input 
                                                            type="number" step="any"
                                                            value={p.k}
                                                            onChange={(e) => handleInput(p.id, 'k', e.target.value)}
                                                            className="w-full bg-transparent border border-slate-600 focus:border-cyan-500 rounded p-2 text-white outline-none"
                                                            placeholder="e.g. 0.001"
                                                        />
                                                    </td>
                                                    <td className="p-1 rounded-r text-center">
                                                        <button 
                                                            onClick={() => removeRow(p.id)}
                                                            disabled={points.length <= 2}
                                                            className="text-slate-500 hover:text-red-400 disabled:opacity-30 disabled:cursor-not-allowed transition p-1"
                                                            title="Remove Row">
                                                            <TrashIcon />
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>

                                <button 
                                    onClick={addRow}
                                    className="w-full bg-slate-800 border border-slate-600 hover:bg-slate-700 text-slate-300 font-bold py-2 px-4 rounded transition flex items-center justify-center gap-2 mt-2">
                                    <PlusIcon /> Add Data Point
                                </button>
                                
                                {/* Processed Data Preview */}
                                <div className="mt-4 pt-4 border-t border-slate-700">
                                    <h3 className="text-[10px] uppercase font-bold text-slate-500 tracking-wider mb-2">Calculated Arrays (1/T, ln(k))</h3>
                                    <div className="max-h-24 overflow-y-auto text-[10px] font-mono text-slate-400 bg-slate-900 p-2 rounded border border-slate-800">
                                        {processedData.length > 0 ? (
                                            processedData.map((d, i) => (
                                                <div key={i} className="flex justify-between border-b border-slate-800 last:border-0 py-1">
                                                    <span>x: {d.x.toExponential(3)}</span>
                                                    <span>y: {d.y.toFixed(4)}</span>
                                                </div>
                                            ))
                                        ) : (
                                            <span className="italic">No valid data to transform.</span>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </section>

                        {/* RIGHT PANEL: Graph & Results */}
                        <section className="flex-1 flex flex-col gap-6 min-w-0">
                            
                            {/* Analysis Dashboard */}
                            <div className="bg-[#1E293B] rounded-xl border border-slate-700 p-5 shadow-lg shrink-0 flex flex-col sm:flex-row gap-4 justify-between items-center relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-1 h-full bg-orange-500"></div>
                                
                                <div className="flex-1">
                                    <span className="text-[10px] uppercase font-bold text-slate-500 tracking-widest block mb-1">Activation Energy (E<sub>a</sub>)</span>
                                    <div className="text-3xl font-black text-orange-400 font-mono tracking-tighter flex items-end gap-2">
                                        {regression ? regression.Ea_kJ.toFixed(2) : '--'}
                                        <span className="text-sm font-bold text-slate-400 mb-1">kJ/mol</span>
                                    </div>
                                </div>
                                
                                <div className="w-px h-12 bg-slate-700 hidden sm:block"></div>

                                <div className="flex-1">
                                    <span className="text-[10px] uppercase font-bold text-slate-500 tracking-widest block mb-1">Frequency Factor (A)</span>
                                    <div className="text-2xl font-black text-white font-mono tracking-tighter">
                                        {regression ? regression.A.toExponential(2) : '--'}
                                    </div>
                                </div>

                                <div className="w-px h-12 bg-slate-700 hidden sm:block"></div>

                                <div className="flex-1">
                                    <span className="text-[10px] uppercase font-bold text-slate-500 tracking-widest block mb-1">Fit Quality (R²)</span>
                                    <div className={`text-2xl font-black font-mono tracking-tighter ${regression && regression.rSquared >= 0.95 ? 'text-emerald-400' : 'text-red-400'}`}>
                                        {regression ? regression.rSquared.toFixed(4) : '--'}
                                    </div>
                                </div>
                            </div>

                            {/* D3 Graph Area */}
                            <div className="bg-[#1E293B] rounded-xl border border-slate-700 shadow-lg flex-1 flex flex-col relative overflow-hidden p-2">
                                <h3 className="text-xs uppercase font-bold text-slate-400 tracking-widest absolute top-4 left-6 z-10">Arrhenius Plot</h3>
                                
                                <div ref={d3ContainerRef} className="flex-1 w-full h-full relative"></div>
                                
                                {/* Linear Equation Overlay */}
                                {regression && (
                                    <div className="absolute bottom-6 right-6 bg-slate-900/80 border border-slate-700 p-3 rounded-lg backdrop-blur-sm shadow-xl pointer-events-none">
                                        <span className="text-[10px] uppercase font-bold text-slate-500 tracking-widest block mb-1">Regression Equation</span>
                                        <div className="text-sm font-mono text-slate-200">
                                            y = <span className="text-red-400">{regression.slope.toFixed(2)}</span>x + {regression.intercept.toFixed(2)}
                                        </div>
                                    </div>
                                )}
                            </div>

                        </section>
                    </main>
                    
                    {/* Floating Tooltip */}
                    <div ref={tooltipRef} className="tooltip"></div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
