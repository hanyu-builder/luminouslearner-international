<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Strong and Weak Acids Simulator Interactive</title>
    <meta name="description" content="Strong and weak acids simulator. Visually compare complete ionization of strong acids with partial dissociation of weak acids, including pH and conductivity testing.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Matter.js for Particle Physics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: #38bdf8; cursor: pointer; margin-top: -6px; box-shadow: 0 0 10px rgba(56, 189, 248, 0.6); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #334155; border-radius: 2px; }

        .bulb-glow { transition: box-shadow 0.3s ease, background-color 0.3s ease, opacity 0.3s ease; }
    </style>
</head>
<body class="bg-[#0F172A] text-slate-200 h-screen max-h-[1000px] overflow-hidden flex flex-col font-sans select-none">

    <!-- Header -->
    <header class="bg-[#1E293B] border-b border-slate-800 p-4 shrink-0 flex justify-between items-center z-10 shadow-lg">
        <div>
            <h1 class="text-xl md:text-2xl font-bold text-white flex items-center gap-2 tracking-tight">
                <span class="text-sky-400">💧</span> Strong vs Weak Acids Simulator
            </h1>
            <p class="text-xs md:text-sm text-slate-400 mt-1">
                Contrast complete ionization ($K_a \gg 1$) with partial dissociation.
            </p>
        </div>
        <div class="hidden md:flex bg-slate-900 border border-slate-700 px-3 py-1.5 rounded-lg font-mono text-xs text-slate-400 flex-col gap-1 shadow-inner">
            <span class="flex items-center gap-2">
                <div class="w-3 h-3 rounded-full bg-red-500"></div> H⁺ (Hydronium)
            </span>
            <span class="flex items-center gap-2">
                <div class="w-3 h-3 rounded-full bg-slate-500 flex items-center justify-center">
                    <div class="w-1.5 h-1.5 rounded-full bg-red-500 absolute ml-1.5"></div>
                </div> Intact Molecule (HA)
            </span>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 flex flex-col md:flex-row gap-4 p-4 overflow-hidden w-full max-w-7xl mx-auto">
        
        <!-- BEAKER A (LEFT) -->
        <section class="flex-1 bg-[#1E293B] rounded-xl border border-slate-700 shadow-lg flex flex-col overflow-hidden relative">
            <div class="absolute top-0 left-0 w-full h-1 bg-blue-500 z-20"></div>
            
            <div class="p-4 border-b border-slate-800 bg-slate-800/50 flex flex-col gap-3 z-10">
                <div class="flex justify-between items-center">
                    <h2 class="text-sm uppercase font-bold text-slate-300 tracking-wider">Solution A</h2>
                    <select id="acid-select-a" class="bg-slate-900 border border-slate-600 rounded p-1.5 text-sm text-white font-bold outline-none focus:border-blue-500 transition-colors">
                        <option value="HCl" data-ka="1e6" data-type="strong">Hydrochloric Acid (HCl) - Strong</option>
                        <option value="H2SO4" data-ka="1e6" data-type="diprotic">Sulfuric Acid (H₂SO₄) - Diprotic</option>
                        <option value="HNO3" data-ka="1e6" data-type="strong">Nitric Acid (HNO₃) - Strong</option>
                        <option value="CH3COOH" data-ka="1.8e-5" data-type="weak">Acetic Acid (CH₃COOH) - Weak</option>
                        <option value="HF" data-ka="6.6e-4" data-type="weak">Hydrofluoric Acid (HF) - Weak</option>
                        <option value="H2O" data-ka="1e-14" data-type="water">Pure Water (H₂O) - Neutral</option>
                    </select>
                </div>
                
                <div class="flex flex-col gap-1">
                    <div class="flex justify-between text-xs text-slate-400 font-bold">
                        <span>Concentration (M)</span>
                        <span id="conc-val-a" class="font-mono text-blue-300">1.00 M</span>
                    </div>
                    <input type="range" id="conc-slider-a" min="0.01" max="1.0" step="0.01" value="1.00">
                </div>

                <div class="grid grid-cols-3 gap-2 mt-1">
                    <div class="bg-slate-900 rounded border border-slate-700 p-2 text-center shadow-inner">
                        <div class="text-[10px] text-slate-500 uppercase font-bold">pH</div>
                        <div id="ph-val-a" class="font-mono text-lg font-black text-white">0.00</div>
                    </div>
                    <div class="bg-slate-900 rounded border border-slate-700 p-2 text-center shadow-inner">
                        <div class="text-[10px] text-slate-500 uppercase font-bold">% Dissociated</div>
                        <div id="diss-val-a" class="font-mono text-lg font-black text-emerald-400">100%</div>
                    </div>
                    <div class="bg-slate-900 rounded border border-slate-700 p-2 text-center flex flex-col justify-center items-center shadow-inner">
                        <div class="text-[10px] text-slate-500 uppercase font-bold">Conductivity</div>
                        <div class="w-full h-2 bg-slate-800 rounded-full mt-1 overflow-hidden relative">
                            <div id="cond-bar-a" class="h-full bg-yellow-400 w-full transition-all duration-300 shadow-[0_0_8px_rgba(250,204,21,0.8)]"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="flex-1 relative bg-[#0B1120] flex items-end justify-center" id="container-a">
                <div class="absolute top-4 left-1/2 -translate-x-1/2 flex flex-col items-center pointer-events-none z-20">
                    <div class="w-16 h-16 rounded-full border-2 border-slate-600 flex items-center justify-center relative overflow-hidden bg-slate-900/50">
                        <div id="bulb-a" class="absolute inset-0 bulb-glow bg-yellow-400 opacity-100" style="box-shadow: 0 0 40px 10px rgba(250, 204, 21, 0.8);"></div>
                        <svg class="w-8 h-8 text-white relative z-10 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
                    </div>
                    <div class="flex gap-4">
                        <div class="w-2 h-24 bg-gradient-to-b from-slate-500 to-slate-400 border border-slate-700 rounded-b-sm"></div>
                        <div class="w-2 h-24 bg-gradient-to-b from-slate-500 to-slate-400 border border-slate-700 rounded-b-sm"></div>
                    </div>
                </div>
                <div class="absolute bottom-0 w-full h-[65%] bg-blue-500/10 border-t border-blue-400/30"></div>
                <canvas id="canvas-a" class="absolute inset-0 z-10 pointer-events-none"></canvas>
            </div>
        </section>

        <!-- BEAKER B (RIGHT) -->
        <section class="flex-1 bg-[#1E293B] rounded-xl border border-slate-700 shadow-lg flex flex-col overflow-hidden relative">
            <div class="absolute top-0 left-0 w-full h-1 bg-purple-500 z-20"></div>
            
            <div class="p-4 border-b border-slate-800 bg-slate-800/50 flex flex-col gap-3 z-10">
                <div class="flex justify-between items-center">
                    <h2 class="text-sm uppercase font-bold text-slate-300 tracking-wider">Solution B</h2>
                    <select id="acid-select-b" class="bg-slate-900 border border-slate-600 rounded p-1.5 text-sm text-white font-bold outline-none focus:border-purple-500 transition-colors">
                        <option value="HCl" data-ka="1e6" data-type="strong">Hydrochloric Acid (HCl) - Strong</option>
                        <option value="H2SO4" data-ka="1e6" data-type="diprotic">Sulfuric Acid (H₂SO₄) - Diprotic</option>
                        <option value="HNO3" data-ka="1e6" data-type="strong">Nitric Acid (HNO₃) - Strong</option>
                        <option value="CH3COOH" data-ka="1.8e-5" data-type="weak" selected>Acetic Acid (CH₃COOH) - Weak</option>
                        <option value="HF" data-ka="6.6e-4" data-type="weak">Hydrofluoric Acid (HF) - Weak</option>
                        <option value="H2O" data-ka="1e-14" data-type="water">Pure Water (H₂O) - Neutral</option>
                    </select>
                </div>
                
                <div class="flex flex-col gap-1">
                    <div class="flex justify-between text-xs text-slate-400 font-bold">
                        <span>Concentration (M)</span>
                        <span id="conc-val-b" class="font-mono text-purple-300">1.00 M</span>
                    </div>
                    <input type="range" id="conc-slider-b" min="0.01" max="1.0" step="0.01" value="1.00">
                </div>

                <div class="grid grid-cols-3 gap-2 mt-1">
                    <div class="bg-slate-900 rounded border border-slate-700 p-2 text-center shadow-inner">
                        <div class="text-[10px] text-slate-500 uppercase font-bold">pH</div>
                        <div id="ph-val-b" class="font-mono text-lg font-black text-white">2.37</div>
                    </div>
                    <div class="bg-slate-900 rounded border border-slate-700 p-2 text-center shadow-inner">
                        <div class="text-[10px] text-slate-500 uppercase font-bold">% Dissociated</div>
                        <div id="diss-val-b" class="font-mono text-lg font-black text-emerald-400">0.4%</div>
                    </div>
                    <div class="bg-slate-900 rounded border border-slate-700 p-2 text-center flex flex-col justify-center items-center shadow-inner">
                        <div class="text-[10px] text-slate-500 uppercase font-bold">Conductivity</div>
                        <div class="w-full h-2 bg-slate-800 rounded-full mt-1 overflow-hidden relative">
                            <div id="cond-bar-b" class="h-full bg-yellow-400 w-[1%] transition-all duration-300"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="flex-1 relative bg-[#0B1120] flex items-end justify-center" id="container-b">
                <div class="absolute top-4 left-1/2 -translate-x-1/2 flex flex-col items-center pointer-events-none z-20">
                    <div class="w-16 h-16 rounded-full border-2 border-slate-600 flex items-center justify-center relative overflow-hidden bg-slate-900/50">
                        <div id="bulb-b" class="absolute inset-0 bulb-glow bg-yellow-400 opacity-5" style="box-shadow: 0 0 0px 0px rgba(250, 204, 21, 0);"></div>
                        <svg class="w-8 h-8 text-white relative z-10 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
                    </div>
                    <div class="flex gap-4">
                        <div class="w-2 h-24 bg-gradient-to-b from-slate-500 to-slate-400 border border-slate-700 rounded-b-sm"></div>
                        <div class="w-2 h-24 bg-gradient-to-b from-slate-500 to-slate-400 border border-slate-700 rounded-b-sm"></div>
                    </div>
                </div>
                <div class="absolute bottom-0 w-full h-[65%] bg-purple-500/10 border-t border-purple-400/30"></div>
                <canvas id="canvas-b" class="absolute inset-0 z-10 pointer-events-none"></canvas>
            </div>
        </section>

    </main>

    <script>
        function calculateEquilibrium(conc, kaStr, type) {
            const C = parseFloat(conc);
            let H_plus, dissociationPct;

            if (type === 'strong') {
                H_plus = C;
                dissociationPct = 100;
            } else if (type === 'diprotic') {
                H_plus = C * 2;
                dissociationPct = 100;
            } else if (type === 'water') {
                H_plus = 1e-7;
                dissociationPct = 0;
            } else {
                const Ka = parseFloat(kaStr);
                H_plus = (-Ka + Math.sqrt(Ka * Ka + 4 * Ka * C)) / 2;
                dissociationPct = (H_plus / C) * 100;
            }

            const pH = -Math.log10(H_plus);
            
            // Adjust conductivity mapping based on user rules:
            // H2SO4 (max 2.0M H+) = 100%
            // HCl (max 1.0M H+) = 50%
            // Weak Acid = 30-40%
            // Water = 0% totally dim
            let conductivityNorm;
            if (type === 'water') {
                conductivityNorm = 0.0;
            } else if (type === 'diprotic' || type === 'strong') {
                conductivityNorm = H_plus / 2.0; 
            } else {
                conductivityNorm = 0.1 + Math.pow(H_plus, 0.3);
            }
            // Clamp between 0 and 1
            conductivityNorm = Math.max(0, Math.min(1, conductivityNorm));

            return {
                pH: type === 'water' ? '7.00' : pH.toFixed(2),
                dissociation: type === 'water' ? '0.0' : (dissociationPct < 0.1 ? dissociationPct.toExponential(1) : dissociationPct.toFixed(1)),
                conductivity: conductivityNorm,
                alpha: dissociationPct / 100,
                type: type
            };
        }

        function createBeakerSimulator(prefix) {
            const dom = {
                select: document.getElementById(`acid-select-${prefix}`),
                concSlider: document.getElementById(`conc-slider-${prefix}`),
                concVal: document.getElementById(`conc-val-${prefix}`),
                phVal: document.getElementById(`ph-val-${prefix}`),
                dissVal: document.getElementById(`diss-val-${prefix}`),
                condBar: document.getElementById(`cond-bar-${prefix}`),
                bulb: document.getElementById(`bulb-${prefix}`),
                container: document.getElementById(`container-${prefix}`),
                canvas: document.getElementById(`canvas-${prefix}`)
            };

            const ctx = dom.canvas.getContext('2d');
            
            const Engine = Matter.Engine,
                  Render = Matter.Render,
                  Runner = Matter.Runner,
                  Bodies = Matter.Bodies,
                  Composite = Matter.Composite,
                  Body = Matter.Body;

            const engine = Engine.create();
            engine.world.gravity.y = 0; 
            const runner = Runner.create();
            
            let particles = [];
            let width, height, liquidY;

            function resize() {
                const rect = dom.container.getBoundingClientRect();
                width = rect.width;
                height = rect.height;
                dom.canvas.width = width;
                dom.canvas.height = height;
                liquidY = height * 0.35; 

                Composite.clear(engine.world);
                particles = [];
                
                const wallOptions = { isStatic: true, friction: 0 };
                Composite.add(engine.world, [
                    Bodies.rectangle(width/2, height+25, width, 50, wallOptions),
                    Bodies.rectangle(-25, height/2, 50, height, wallOptions),
                    Bodies.rectangle(width+25, height/2, 50, height, wallOptions),
                    Bodies.rectangle(width/2, liquidY-25, width, 50, wallOptions)
                ]);

                updatePhysicsState();
            }

            function updatePhysicsState() {
                const opt = dom.select.options[dom.select.selectedIndex];
                const type = opt.dataset.type;
                const conc = dom.concSlider.value;
                const eq = calculateEquilibrium(conc, opt.dataset.ka, type);

                if (type === 'water') {
                    dom.concVal.textContent = `Pure`;
                    dom.concSlider.disabled = true;
                    dom.concSlider.classList.add('opacity-50');
                } else {
                    dom.concVal.textContent = `${parseFloat(conc).toFixed(2)} M`;
                    dom.concSlider.disabled = false;
                    dom.concSlider.classList.remove('opacity-50');
                }
                
                dom.phVal.textContent = eq.pH;
                dom.dissVal.textContent = `${eq.dissociation}%`;
                
                const condPct = (eq.conductivity * 100).toFixed(1);
                dom.condBar.style.width = `${Math.max(1, condPct)}%`;
                
                if (eq.conductivity >= 0.45) {
                    dom.condBar.style.boxShadow = `0 0 8px rgba(250,204,21,0.8)`;
                } else {
                    dom.condBar.style.boxShadow = 'none';
                }
                
                const glowIntensity = eq.conductivity;
                dom.bulb.style.opacity = glowIntensity;
                dom.bulb.style.boxShadow = `0 0 ${glowIntensity * 40}px ${glowIntensity * 15}px rgba(250, 204, 21, ${glowIntensity * 0.8})`;

                const targetBaseUnits = type === 'water' ? 0 : Math.max(5, Math.floor(parseFloat(conc) * 40)); 
                const targetDissociated = Math.round(targetBaseUnits * eq.alpha);
                const targetIntact = targetBaseUnits - targetDissociated;

                let dissCount = targetDissociated;
                let intactCount = targetIntact;
                
                if (eq.alpha < 1 && eq.alpha > 0 && dissCount === 0 && type !== 'water') {
                    dissCount = 1;
                    intactCount = Math.max(0, intactCount - 1);
                }

                Composite.remove(engine.world, particles);
                particles = [];

                const particleOptions = { restitution: 0.9, frictionAir: 0.05, density: 0.001 };

                for (let i = 0; i < intactCount; i++) {
                    const x = 20 + Math.random() * (width - 40);
                    const y = liquidY + 20 + Math.random() * (height - liquidY - 40);
                    
                    const molecule = Body.create({
                        parts: [
                            Bodies.circle(x - 8, y, 10, { render: { type: 'HA_Base' } }),
                            Bodies.circle(x + 8, y, 6, { render: { type: 'HA_Proton' } })
                        ],
                        frictionAir: 0.05
                    });
                    molecule.customType = 'HA';
                    particles.push(molecule);
                }

                for (let i = 0; i < dissCount; i++) {
                    let xH = 20 + Math.random() * (width - 40);
                    let yH = liquidY + 20 + Math.random() * (height - liquidY - 40);
                    let hIon = Bodies.circle(xH, yH, 6, particleOptions);
                    hIon.customType = 'H+';
                    particles.push(hIon);

                    if (type === 'diprotic') {
                        let xH2 = 20 + Math.random() * (width - 40);
                        let yH2 = liquidY + 20 + Math.random() * (height - liquidY - 40);
                        let hIon2 = Bodies.circle(xH2, yH2, 6, particleOptions);
                        hIon2.customType = 'H+';
                        particles.push(hIon2);
                    }

                    let xA = 20 + Math.random() * (width - 40);
                    let yA = liquidY + 20 + Math.random() * (height - liquidY - 40);
                    let aIon = Bodies.circle(xA, yA, 10, particleOptions);
                    aIon.customType = type === 'diprotic' ? 'A2-' : 'A-';
                    particles.push(aIon);
                }

                Composite.add(engine.world, particles);
            }

            function renderLoop() {
                ctx.clearRect(0, 0, width, height);

                particles.forEach(p => {
                    Body.applyForce(p, p.position, {
                        x: (Math.random() - 0.5) * 0.0001,
                        y: (Math.random() - 0.5) * 0.0001
                    });
                });

                particles.forEach(p => {
                    ctx.beginPath();
                    
                    if (p.customType === 'HA') {
                        const base = p.parts[1];
                        const proton = p.parts[2];
                        
                        ctx.arc(base.position.x, base.position.y, 10, 0, 2 * Math.PI);
                        ctx.fillStyle = '#64748b';
                        ctx.fill();
                        
                        ctx.beginPath();
                        ctx.arc(proton.position.x, proton.position.y, 6, 0, 2 * Math.PI);
                        ctx.fillStyle = '#ef4444'; 
                        ctx.fill();

                    } else if (p.customType === 'H+') {
                        ctx.arc(p.position.x, p.position.y, 6, 0, 2 * Math.PI);
                        ctx.fillStyle = '#ef4444';
                        ctx.fill();
                        ctx.fillStyle = '#ffffff';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.font = '10px monospace';
                        ctx.fillText('+', p.position.x, p.position.y + 1);

                    } else if (p.customType === 'A-' || p.customType === 'A2-') {
                        ctx.arc(p.position.x, p.position.y, 10, 0, 2 * Math.PI);
                        ctx.fillStyle = prefix === 'a' ? '#3b82f6' : '#a855f7'; 
                        ctx.fill();
                        ctx.fillStyle = '#ffffff';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.font = '14px monospace';
                        ctx.fillText(p.customType === 'A2-' ? '2-' : '-', p.position.x, p.position.y + 1);
                    }
                });

                requestAnimationFrame(renderLoop);
            }

            dom.select.addEventListener('change', updatePhysicsState);
            dom.concSlider.addEventListener('input', updatePhysicsState);
            window.addEventListener('resize', resize);

            resize();
            Runner.run(runner, engine);
            renderLoop();
        }

        window.onload = function() {
            createBeakerSimulator('a');
            createBeakerSimulator('b');
        };
    </script>
</body>
</html>
