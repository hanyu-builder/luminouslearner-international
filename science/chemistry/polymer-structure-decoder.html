<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identify Monomer from Polymer Interactive | Structure Decoder</title>
    <meta name="description" content="Use this tool to identify monomer from polymer interactive simulations. Crop the repeating unit and decode addition and condensation polymers dynamically.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: { 850: '#151e2e', 900: '#0F172A', 950: '#020617' },
                        poly: {
                            primary: '#0ea5e9',   // Sky 500
                            secondary: '#8b5cf6', // Violet 500
                            success: '#10b981',   // Emerald 500
                            error: '#f43f5e',     // Rose 500
                        }
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { margin: 0; background-color: #020617; overflow: hidden; font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .bg-grid {
            background-image: radial-gradient(circle at 2px 2px, rgba(30, 41, 59, 0.5) 1px, transparent 0);
            background-size: 30px 30px;
        }

        /* SVG Element Transitions */
        .svg-anim {
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Custom Range Slider */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
            width: 100%;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 18px; width: 18px;
            border-radius: 50%;
            background: #0ea5e9;
            cursor: pointer;
            margin-top: -7px;
            box-shadow: 0 0 10px rgba(14, 165, 233, 0.5);
            border: 2px solid #fff;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px;
            cursor: pointer;
            background: #334155;
            border-radius: 2px;
        }
    </style>
</head>
<body class="text-slate-200 selection:bg-sky-500 selection:text-white flex items-center justify-center h-screen max-h-[1000px] w-full bg-grid">

    <div id="root" class="w-full h-full"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Icons ---
        const ScanSearch = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3"/><path d="m16 16-1.9-1.9"/></svg>;
        const CheckCircle = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>;
        const AlertCircle = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>;

        // --- Polymer Database ---
        // t = top substituent, b = bottom substituent, c = core backbone atom
        const POLYMERS = {
            // --- Addition Polymers ---
            pe: { 
                id: 'pe', name: 'Polyethylene (PE)', monomer: 'Ethene', uses: 'Plastic bags, bottles', type: 'Addition', targetWidth: 2,
                chain: Array(8).fill({t:'H', b:'H', c:'C'})
            },
            pp: { 
                id: 'pp', name: 'Polypropylene (PP)', monomer: 'Propene', uses: 'Thermal clothing, containers', type: 'Addition', targetWidth: 2,
                chain: [{t:'H',b:'H',c:'C'}, {t:'H',b:'CH₃',c:'C'}, {t:'H',b:'H',c:'C'}, {t:'H',b:'CH₃',c:'C'}, {t:'H',b:'H',c:'C'}, {t:'H',b:'CH₃',c:'C'}, {t:'H',b:'H',c:'C'}, {t:'H',b:'CH₃',c:'C'}]
            },
            pvc: { 
                id: 'pvc', name: 'Polyvinyl Chloride (PVC)', monomer: 'Chloroethene', uses: 'Water pipes, window frames', type: 'Addition', targetWidth: 2,
                chain: [{t:'H',b:'H',c:'C'}, {t:'H',b:'Cl',c:'C'}, {t:'H',b:'H',c:'C'}, {t:'H',b:'Cl',c:'C'}, {t:'H',b:'H',c:'C'}, {t:'H',b:'Cl',c:'C'}, {t:'H',b:'H',c:'C'}, {t:'H',b:'Cl',c:'C'}]
            },
            ptfe: { 
                id: 'ptfe', name: 'PTFE (Teflon)', monomer: 'Tetrafluoroethene', uses: 'Non-stick cookware, pipe tape', type: 'Addition', targetWidth: 2,
                chain: Array(8).fill({t:'F', b:'F', c:'C'})
            },
            ps: { 
                id: 'ps', name: 'Polystyrene (PS)', monomer: 'Styrene', uses: 'Protective packaging, disposable cups', type: 'Addition', targetWidth: 2,
                chain: [{t:'H',b:'H',c:'C'}, {t:'H',b:'C₆H₅',c:'C'}, {t:'H',b:'H',c:'C'}, {t:'H',b:'C₆H₅',c:'C'}, {t:'H',b:'H',c:'C'}, {t:'H',b:'C₆H₅',c:'C'}, {t:'H',b:'H',c:'C'}, {t:'H',b:'C₆H₅',c:'C'}]
            },
            // --- Condensation Polymers ---
            polyester: {
                id: 'polyester', name: 'Polyester (PET)', monomer: 'Diol + Dicarboxylic Acid', uses: 'Clothing, plastic bottles', type: 'Condensation', targetWidth: 6,
                chain: [
                    {t:'', b:'', c:'O'}, {t:'', b:'', c:'R'}, {t:'', b:'', c:'O'}, {t:'=O', b:'', c:'C'}, {t:'', b:'', c:"R'"}, {t:'=O', b:'', c:'C'},
                    {t:'', b:'', c:'O'}, {t:'', b:'', c:'R'}
                ]
            },
            nylon: {
                id: 'nylon', name: 'Nylon 6,6 (Polyamide)', monomer: 'Diamine + Dicarboxylic Acid', uses: 'Fabrics, ropes, gears', type: 'Condensation', targetWidth: 6,
                chain: [
                    {t:'H', b:'', c:'N'}, {t:'', b:'', c:'R'}, {t:'H', b:'', c:'N'}, {t:'=O', b:'', c:'C'}, {t:'', b:'', c:"R'"}, {t:'=O', b:'', c:'C'},
                    {t:'H', b:'', c:'N'}, {t:'', b:'', c:'R'}
                ]
            }
        };

        function App() {
            // --- State ---
            const [activePolymerId, setActivePolymerId] = useState('polyester');
            const [scannerPos, setScannerPos] = useState(0);   
            const [scannerWidth, setScannerWidth] = useState(6); 
            const [isDecoded, setIsDecoded] = useState(false);
            const [errorMsg, setErrorMsg] = useState(null);

            const polymer = POLYMERS[activePolymerId];
            
            // Constrain scanner position if width changes
            useEffect(() => {
                if (scannerPos > 8 - scannerWidth) setScannerPos(8 - scannerWidth);
            }, [scannerWidth, scannerPos]);

            // --- Handlers ---
            const handleSelectPolymer = (id) => {
                setActivePolymerId(id);
                setIsDecoded(false);
                setErrorMsg(null);
                setScannerPos(0);
                setScannerWidth(POLYMERS[id].targetWidth); // Auto-suggest width for UX
            };

            const handleDecode = () => {
                // Algorithmic Validation
                if (polymer.type === 'Addition') {
                    if (scannerWidth !== 2) {
                        setErrorMsg(`Incorrect repeating unit size. Addition polymers are formed from alkene monomers (C=C), meaning the repeating unit must contain exactly 2 backbone carbons.`);
                        return;
                    }
                } else if (polymer.type === 'Condensation') {
                    if (scannerWidth !== 6) {
                        setErrorMsg(`Incorrect repeating unit size. This condensation polymer forms via the linking of two monomers, producing a 6-block repeating unit.`);
                        return;
                    }
                    const startAtom = polymer.chain[scannerPos].c;
                    if (startAtom !== 'O' && startAtom !== 'N') {
                        setErrorMsg(`Incorrect framing. While technically repeating, structurally we identify the unit starting from the heteroatom (O or N) of the diol/diamine.`);
                        return;
                    }
                }

                setErrorMsg(null);
                setIsDecoded(true);
            };

            const handleReset = () => {
                setIsDecoded(false);
                setErrorMsg(null);
            };

            // --- SVG Generation Helpers ---
            const renderPolymerChain = () => {
                const elements = [];
                const SPACING = 80;
                const START_X = 70;
                const BASE_Y = 200;

                for (let i = 0; i < 8; i++) {
                    const cx = START_X + (i * SPACING);
                    const topSub = polymer.chain[i].t;
                    const botSub = polymer.chain[i].b;
                    const coreAtom = polymer.chain[i].c;
                    
                    const isSelected = i >= scannerPos && i < scannerPos + scannerWidth;
                    
                    // Decoded Animation Transformation
                    let animX = cx;
                    let animY = BASE_Y;
                    let opacity = 1;
                    
                    if (isDecoded) {
                        if (!isSelected) {
                            opacity = 0; 
                        } else {
                            const localIndex = i - scannerPos; 
                            if (polymer.type === 'Addition') {
                                animX = 310 + (localIndex * 80); // Center the 2 carbons
                            } else {
                                // Condensation: split into two monomers
                                const M1_START = 150;
                                const M2_START = 430;
                                const COND_SPACING = 60;
                                if (localIndex < 3) {
                                    animX = M1_START + (localIndex * COND_SPACING); // Diol / Diamine
                                } else {
                                    animX = M2_START + ((localIndex - 3) * COND_SPACING); // Diacid
                                }
                            }
                        }
                    }

                    // --- DRAW BONDS ---
                    // Backbone Horizontal Bond
                    if (i > 0) {
                        const prevIsSelected = (i - 1) >= scannerPos && (i - 1) < scannerPos + scannerWidth;
                        const isBrokenEsterAmideLink = isDecoded && polymer.type === 'Condensation' && (i - scannerPos === 3);
                        const showBond = !isDecoded || (isSelected && prevIsSelected && !isBrokenEsterAmideLink);
                        
                        let bondX1 = animX - (isDecoded && polymer.type === 'Condensation' ? 60 : SPACING);
                        let bondX2 = animX;
                        
                        elements.push(
                            <line key={`bond-h-${i}`} x1={bondX1} y1={animY} x2={bondX2} y2={animY} 
                                  stroke="#64748B" strokeWidth="4" className="svg-anim" opacity={showBond ? 1 : 0} />
                        );
                    }

                    // Substituent Bonds (Only if substituent exists)
                    if (topSub) {
                        if (topSub === '=O') {
                            // Double vertical bond
                            elements.push(
                                <line key={`bond-t1-${i}`} x1={animX-4} y1={animY} x2={animX-4} y2={animY - 50} stroke="#64748B" strokeWidth="4" className="svg-anim" opacity={opacity} />,
                                <line key={`bond-t2-${i}`} x1={animX+4} y1={animY} x2={animX+4} y2={animY - 50} stroke="#64748B" strokeWidth="4" className="svg-anim" opacity={opacity} />
                            );
                        } else {
                            // Single vertical bond
                            elements.push(<line key={`bond-t-${i}`} x1={animX} y1={animY} x2={animX} y2={animY - 50} stroke="#64748B" strokeWidth="4" className="svg-anim" opacity={opacity} />);
                        }
                    }
                    if (botSub) {
                        elements.push(<line key={`bond-b-${i}`} x1={animX} y1={animY} x2={animX} y2={animY + 50} stroke="#64748B" strokeWidth="4" className="svg-anim" opacity={opacity} />);
                    }

                    // --- DRAW ATOMS ---
                    // Core Atom
                    const isHetero = coreAtom !== 'C' && coreAtom !== 'R' && coreAtom !== "R'";
                    elements.push(
                        <g key={`c-${i}`} className="svg-anim" transform={`translate(${animX}, ${animY})`} opacity={opacity}>
                            <circle cx="0" cy="0" r="22" fill="#1E293B" stroke={isHetero ? "#f43f5e" : "#0ea5e9"} strokeWidth="2" />
                            <text x="0" y="5" textAnchor="middle" fill="#f8fafc" fontSize="16" fontWeight="bold">{coreAtom}</text>
                        </g>
                    );

                    // Top Substituent Text
                    if (topSub) {
                        const topText = topSub === '=O' ? 'O' : topSub;
                        elements.push(<text key={`sub-t-${i}`} x={animX} y={animY - 65} textAnchor="middle" fill={topSub === '=O' ? "#f43f5e" : "#cbd5e1"} fontSize="16" fontWeight="bold" className="svg-anim" opacity={opacity}>{topText}</text>);
                    }

                    // Bottom Substituent Text
                    if (botSub) {
                        const botColor = (botSub !== 'H') ? '#f43f5e' : '#cbd5e1'; 
                        elements.push(<text key={`sub-b-${i}`} x={animX} y={animY + 75} textAnchor="middle" fill={botColor} fontSize="16" fontWeight="bold" className="svg-anim" opacity={opacity}>{botSub}</text>);
                    }
                }

                // --- RESTORATION ANIMATIONS (DECODED STATE) ---
                if (isDecoded) {
                    if (polymer.type === 'Addition') {
                        // Restore C=C Double Bond
                        elements.push(
                            <line key="double-bond-1" x1="310" y1={BASE_Y - 8} x2="390" y2={BASE_Y - 8} stroke="#10b981" strokeWidth="4" className="svg-anim animate-[pulse_1s_ease-in-out_infinite]" />,
                            <line key="double-bond-2" x1="310" y1={BASE_Y + 8} x2="390" y2={BASE_Y + 8} stroke="#10b981" strokeWidth="4" className="svg-anim animate-[pulse_1s_ease-in-out_infinite]" />
                        );
                    } else if (polymer.type === 'Condensation') {
                        // Hydrolysis: Add H and OH groups back to the monomers
                        const M1_START = 150; 
                        const M2_START = 430; 
                        const COND_SPACING = 60;
                        const RESTORE_COLOR = "#10b981";

                        // Monomer 1: Diol/Diamine Left End (H-)
                        elements.push(
                            <line key="m1-left-bond" x1={M1_START - 50} y1={BASE_Y} x2={M1_START - 22} y2={BASE_Y} stroke={RESTORE_COLOR} strokeWidth="4" strokeDasharray="4,4" className="svg-anim animate-[pulse_1s_ease-in-out_infinite]" />,
                            <text key="m1-left-text" x={M1_START - 65} y={BASE_Y + 6} fill={RESTORE_COLOR} fontSize="18" fontWeight="bold">H</text>
                        );
                        // Monomer 1: Diol/Diamine Right End (-H)
                        elements.push(
                            <line key="m1-right-bond" x1={M1_START + 2*COND_SPACING + 22} y1={BASE_Y} x2={M1_START + 2*COND_SPACING + 50} y2={BASE_Y} stroke={RESTORE_COLOR} strokeWidth="4" strokeDasharray="4,4" className="svg-anim animate-[pulse_1s_ease-in-out_infinite]" />,
                            <text key="m1-right-text" x={M1_START + 2*COND_SPACING + 65} y={BASE_Y + 6} fill={RESTORE_COLOR} fontSize="18" fontWeight="bold" textAnchor="middle">H</text>
                        );
                        
                        // Monomer 2: Diacid Left End (HO-)
                        elements.push(
                            <line key="m2-left-bond" x1={M2_START - 50} y1={BASE_Y} x2={M2_START - 22} y2={BASE_Y} stroke={RESTORE_COLOR} strokeWidth="4" strokeDasharray="4,4" className="svg-anim animate-[pulse_1s_ease-in-out_infinite]" />,
                            <text key="m2-left-text" x={M2_START - 70} y={BASE_Y + 6} fill={RESTORE_COLOR} fontSize="18" fontWeight="bold">HO</text>
                        );
                        // Monomer 2: Diacid Right End (-OH)
                        elements.push(
                            <line key="m2-right-bond" x1={M2_START + 2*COND_SPACING + 22} y1={BASE_Y} x2={M2_START + 2*COND_SPACING + 50} y2={BASE_Y} stroke={RESTORE_COLOR} strokeWidth="4" strokeDasharray="4,4" className="svg-anim animate-[pulse_1s_ease-in-out_infinite]" />,
                            <text key="m2-right-text" x={M2_START + 2*COND_SPACING + 70} y={BASE_Y + 6} fill={RESTORE_COLOR} fontSize="18" fontWeight="bold" textAnchor="middle">OH</text>
                        );
                    }
                }

                return elements;
            };

            return (
                <div className="w-full h-full flex flex-col md:flex-row">
                    
                    {/* Left Panel: UI & Controls */}
                    <aside className="w-full md:w-[400px] lg:w-[420px] bg-slate-900 border-b md:border-b-0 md:border-r border-slate-700 flex flex-col z-10 shadow-2xl h-[45vh] md:h-full shrink-0">
                        
                        <div className="p-6 pb-4 border-b border-slate-800 flex items-center gap-3">
                            <div className="p-2 bg-sky-500/20 rounded-lg text-sky-400">
                                <ScanSearch />
                            </div>
                            <div>
                                <h1 className="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-sky-400 to-blue-500 leading-tight">
                                    Polymer Structure<br/>Decoder
                                </h1>
                            </div>
                        </div>

                        <div className="flex flex-col flex-grow overflow-y-auto no-scrollbar p-6 space-y-6">
                            
                            {/* Gallery Selection */}
                            <div className="space-y-3">
                                <h2 className="text-xs font-semibold text-slate-400 uppercase tracking-wider block mb-1">1. Select Polymer</h2>
                                <div className="grid grid-cols-2 gap-2">
                                    {Object.values(POLYMERS).map(p => (
                                        <button 
                                            key={p.id}
                                            onClick={() => handleSelectPolymer(p.id)}
                                            className={`p-2 text-xs font-bold rounded-lg border transition-all flex flex-col items-center gap-1 ${activePolymerId === p.id ? 'bg-sky-500/20 border-sky-500 text-sky-400 shadow-[0_0_10px_rgba(14,165,233,0.3)]' : 'bg-slate-800 border-slate-700 text-slate-400 hover:border-slate-500 hover:text-slate-200'}`}
                                        >
                                            <span>{p.name.split(' (')[0]}</span>
                                            <span className={`text-[9px] px-1.5 rounded-sm ${p.type === 'Addition' ? 'bg-indigo-500/20 text-indigo-300' : 'bg-orange-500/20 text-orange-300'}`}>{p.type}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* Cropping Tool Controls */}
                            <div className={`space-y-5 bg-slate-950 p-4 rounded-xl border border-slate-800 shadow-inner transition-opacity ${isDecoded ? 'opacity-50 pointer-events-none' : 'opacity-100'}`}>
                                <h2 className="text-xs font-semibold text-slate-400 uppercase tracking-wider block border-b border-slate-800 pb-2">2. Isolate Repeating Unit</h2>
                                
                                {/* Width Slider */}
                                <div>
                                    <div className="flex justify-between items-end mb-2">
                                        <label className="text-xs font-medium text-slate-300">Crop Width (Blocks)</label>
                                        <span className="font-mono text-sky-400 font-bold">{scannerWidth}</span>
                                    </div>
                                    <input type="range" min="1" max="8" value={scannerWidth} onChange={(e) => setScannerWidth(parseInt(e.target.value))} />
                                </div>

                                {/* Position Slider */}
                                <div>
                                    <div className="flex justify-between items-end mb-2">
                                        <label className="text-xs font-medium text-slate-300">Scanner Position</label>
                                    </div>
                                    <input type="range" min="0" max={8 - scannerWidth} value={scannerPos} onChange={(e) => setScannerPos(parseInt(e.target.value))} />
                                </div>
                            </div>

                            {/* Action Button & Validation */}
                            <div className="pt-2">
                                {!isDecoded ? (
                                    <button 
                                        onClick={handleDecode}
                                        className="w-full bg-gradient-to-r from-sky-600 to-blue-600 hover:from-sky-500 hover:to-blue-500 text-white font-bold py-3 rounded-xl transition-all shadow-lg active:scale-[0.98]"
                                    >
                                        Decode Monomers
                                    </button>
                                ) : (
                                    <button 
                                        onClick={handleReset}
                                        className="w-full bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-200 font-bold py-3 rounded-xl transition-all active:scale-[0.98]"
                                    >
                                        Reset Scanner
                                    </button>
                                )}

                                {errorMsg && (
                                    <div className="mt-4 bg-rose-500/10 border border-rose-500/30 text-rose-400 px-3 py-3 rounded-xl flex items-start gap-2 text-xs">
                                        <AlertCircle className="shrink-0 mt-0.5 w-4 h-4" />
                                        <p>{errorMsg}</p>
                                    </div>
                                )}

                                {isDecoded && (
                                    <div className="mt-4 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 px-4 py-4 rounded-xl flex flex-col gap-2 animate-in fade-in slide-in-from-bottom-4 duration-500">
                                        <div className="flex items-center gap-2 font-bold text-sm">
                                            <CheckCircle className="w-5 h-5" /> 
                                            Polymerization Reversed!
                                        </div>
                                        <p className="text-xs text-emerald-200/70">
                                            {polymer.type === 'Addition' 
                                                ? "The repeating unit was isolated and the single backbone bond was algorithmically restored to its original alkene double bond (C=C)."
                                                : "The ester/amide bond was hydrolyzed to restore the original diol/diamine and dicarboxylic acid monomers."}
                                        </p>
                                    </div>
                                )}
                            </div>

                        </div>
                    </aside>

                    {/* Right Panel: Interactive Scanner Visualizer */}
                    <main className="flex-grow relative flex flex-col h-[55vh] md:h-full overflow-hidden">
                        
                        {/* Title Bar */}
                        <div className="absolute top-6 left-1/2 -translate-x-1/2 bg-slate-900/80 backdrop-blur-md border border-slate-700/50 px-6 py-2 rounded-full shadow-xl z-20 flex flex-col items-center">
                            <span className="text-[10px] text-slate-400 uppercase tracking-widest font-bold">Target Structure</span>
                            <span className={`font-mono text-lg font-bold transition-colors ${isDecoded ? 'text-emerald-400' : 'text-slate-200'}`}>
                                {isDecoded ? polymer.monomer : polymer.name}
                            </span>
                        </div>

                        {/* Main Canvas Area */}
                        <div className="w-full h-full flex items-center justify-center">
                            <svg viewBox="0 0 700 400" className="w-full max-w-[800px] h-auto drop-shadow-2xl overflow-visible">
                                
                                {/* Background Continuation Lines for Polymer */}
                                <g className="svg-anim" opacity={isDecoded ? 0 : 1}>
                                    <line x1="20" y1="200" x2="50" y2="200" stroke="#475569" strokeWidth="4" strokeDasharray="6,4" />
                                    <line x1="650" y1="200" x2="680" y2="200" stroke="#475569" strokeWidth="4" strokeDasharray="6,4" />
                                    <text x="10" y="180" fill="#64748B" fontSize="14" fontWeight="bold">n</text>
                                    <text x="680" y="180" fill="#64748B" fontSize="14" fontWeight="bold">n</text>
                                </g>

                                {/* The Cropping / Scanner Overlay */}
                                {!isDecoded && (
                                    <g className="svg-anim" transform={`translate(${70 + scannerPos * 80}, 0)`}>
                                        <rect 
                                            x="-35" y="80" 
                                            width={(scannerWidth * 80) - 10} height="240" 
                                            rx="12"
                                            fill="rgba(14, 165, 233, 0.1)" 
                                            stroke="#0ea5e9" strokeWidth="2" strokeDasharray="8,4"
                                            className="animate-[pulse_2s_ease-in-out_infinite]"
                                        />
                                        <text x="-25" y="70" fill="#0ea5e9" fontSize="12" fontWeight="bold" className="uppercase tracking-widest">Crop Window</text>
                                    </g>
                                )}

                                {/* Render Dynamic Polymer / Monomer Structure */}
                                {renderPolymerChain()}

                            </svg>
                        </div>
                        
                        {/* Educational Hint Overlay */}
                        {!isDecoded && (
                            <div className="absolute bottom-6 right-6 bg-slate-900 border border-slate-700 text-slate-400 text-[11px] p-4 rounded-xl shadow-xl max-w-xs text-right">
                                Use the sliders to position the crop window over the exact repeating unit. Look for the smallest pattern that repeats continuously.
                            </div>
                        )}

                    </main>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
