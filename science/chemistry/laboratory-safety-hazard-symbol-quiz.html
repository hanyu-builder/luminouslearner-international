<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chemistry Lab Safety Symbols Quiz | Interactive Simulator</title>
    <!-- Primary SEO Keyword: Chemistry lab safety symbols quiz -->
    <meta name="description" content="Test your knowledge with this chemistry lab safety symbols quiz. Map GHS hazard pictograms to chemical examples and safe handling protocols in a gamified simulation.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React, ReactDOM, and Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        
        @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fade-in 0.4s ease-out forwards; }
        
        @keyframes shake {
          0%, 100% { transform: translateX(0); }
          25% { transform: translateX(-5px) rotate(-1deg); }
          50% { transform: translateX(5px) rotate(1deg); }
          75% { transform: translateX(-5px) rotate(-1deg); }
        }
        .animate-shake { animation: shake 0.4s ease-in-out; }
    </style>
</head>
<body class="bg-[#0F172A] text-slate-200 h-screen overflow-hidden font-sans select-none">

    <div id="root" class="h-full w-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        // --- ICONS (Replaced lucide-react with inline SVGs for standalone compatibility) ---
        const Flame = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path></svg>;
        const Skull = ({ className, strokeWidth=2 }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round"><circle cx="9" cy="12" r="1"></circle><circle cx="15" cy="12" r="1"></circle><path d="M8 20v2h8v-2"></path><path d="m12.5 17-.5-1-.5 1h1z"></path><path d="M16 20a2 2 0 0 0 1.56-3.25 8 8 0 1 0-11.12 0A2 2 0 0 0 8 20"></path></svg>;
        const AlertCircle = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>;
        const Droplets = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7 2.9 7 2.9s-2.29 6.16-2.29 6.16C3.57 10 3 11.1 3 12.25c0 2.22 1.8 4.05 4 4.05z"></path><path d="M12.56 6.6A10.97 10.97 0 0 0 14 3.02c.5 2.5 2 4.9 4 6.5s3 3.5 3 5.5a6.98 6.98 0 0 1-11.91 4.97"></path></svg>;
        const Leaf = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"></path><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"></path></svg>;
        const Orbit = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"></circle><circle cx="19" cy="5" r="2"></circle><circle cx="5" cy="19" r="2"></circle><path d="M10.4 21.9a10 10 0 0 0 9.17-5.55"></path><path d="M13.6 2.1a10 10 0 0 0-9.17 5.55"></path></svg>;
        const ShieldAlert = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg>;
        const Play = ({ className, fill="none" }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>;
        const RotateCcw = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>;
        const CheckCircle2 = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="m9 12 2 2 4-4"></path></svg>;
        const XCircle = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="m15 9-6 6"></path><path d="m9 9 6 6"></path></svg>;
        const Timer = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="10" y1="2" x2="14" y2="2"></line><line x1="12" y1="14" x2="15" y2="11"></line><circle cx="12" cy="14" r="8"></circle></svg>;
        const Award = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="8" r="7"></circle><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline></svg>;

        // --- GHS DATABASE ---
        const GHS_DATA = [
          { 
            id: 'flammable', 
            name: 'Flammable', 
            icon: Flame, 
            chem: 'Acetone', 
            protocol: 'Store away from oxidizers and heat sources in a flammables cabinet.' 
          },
          { 
            id: 'corrosive', 
            name: 'Corrosive', 
            icon: Droplets, 
            chem: 'Concentrated Sulfuric Acid', 
            protocol: 'Wear heavy-duty chemical-resistant gloves and a rubber apron.' 
          },
          { 
            id: 'toxic', 
            name: 'Acute Toxicity', 
            icon: Skull, 
            chem: 'Sodium Cyanide', 
            protocol: 'Handle strictly inside a certified fume hood. Avoid all exposure.' 
          },
          { 
            id: 'irritant', 
            name: 'Health Hazard / Irritant', 
            icon: AlertCircle, 
            chem: 'Dilute Hydrochloric Acid', 
            protocol: 'Avoid skin contact; flush immediately with water if exposed.' 
          },
          { 
            id: 'oxidizer', 
            name: 'Oxidizing', 
            icon: Orbit, 
            chem: 'Potassium Permanganate', 
            protocol: 'Keep strictly separated from flammable and organic materials.' 
          },
          { 
            id: 'environmental', 
            name: 'Environmental Hazard', 
            icon: Leaf, 
            chem: 'Lead(II) Nitrate', 
            protocol: 'Dispose of in designated heavy metal hazardous waste containers.' 
          }
        ];

        // --- GHS PICTOGRAM COMPONENT ---
        const GHSBorder = ({ children }) => (
          <div className="relative w-32 h-32 flex items-center justify-center bg-white transform rotate-45 border-[6px] border-red-600 rounded-sm shadow-lg shrink-0">
            <div className="transform -rotate-45 text-black flex items-center justify-center">
              {children}
            </div>
          </div>
        );

        // --- MAIN APPLICATION ---
        function App() {
          const [gameState, setGameState] = useState('start'); // start, play, end
          const [score, setScore] = useState(0);
          const [timeLeft, setTimeLeft] = useState(60);
          const [question, setQuestion] = useState(null);
          
          // Drag & Drop visual states
          const [isDraggingOver, setIsDraggingOver] = useState(false);
          const [dropFeedback, setDropFeedback] = useState('idle'); // idle, correct, wrong

          // --- GAME LOGIC ---
          const generateQuestion = useCallback(() => {
            // Pick a random target hazard
            const target = GHS_DATA[Math.floor(Math.random() * GHS_DATA.length)];
            
            // Pick question type (ask for chemical or protocol)
            const askType = Math.random() > 0.5 ? 'chem' : 'protocol';
            
            // Generate distractors
            const distractors = GHS_DATA.filter(item => item.id !== target.id)
              .sort(() => 0.5 - Math.random())
              .slice(0, 3)
              .map(item => ({ id: item.id, text: item[askType] }));
              
            // Combine and shuffle options
            const options = [
              { id: target.id, text: target[askType] },
              ...distractors
            ].sort(() => 0.5 - Math.random());

            setQuestion({
              target,
              askType,
              options
            });
            setDropFeedback('idle');
          }, []);

          const startGame = () => {
            setScore(0);
            setTimeLeft(60);
            setGameState('play');
            generateQuestion();
          };

          const handleTimeOut = useCallback(() => {
            setGameState('end');
          }, []);

          // Timer Effect
          useEffect(() => {
            let timer;
            if (gameState === 'play' && timeLeft > 0) {
              timer = setInterval(() => {
                setTimeLeft(prev => prev - 1);
              }, 1000);
            } else if (timeLeft === 0 && gameState === 'play') {
              handleTimeOut();
            }
            return () => clearInterval(timer);
          }, [gameState, timeLeft, handleTimeOut]);

          // --- DRAG AND DROP HANDLERS ---
          const handleDragStart = (e, optionId) => {
            e.dataTransfer.setData('text/plain', optionId);
            e.dataTransfer.effectAllowed = 'move';
          };

          const handleDragOver = (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            setIsDraggingOver(true);
          };

          const handleDragLeave = () => {
            setIsDraggingOver(false);
          };

          const handleDrop = (e) => {
            e.preventDefault();
            setIsDraggingOver(false);
            
            const droppedId = e.dataTransfer.getData('text/plain');
            if (!droppedId || !question) return;

            if (droppedId === question.target.id) {
              // Correct Match
              setDropFeedback('correct');
              setScore(prev => prev + 10);
              setTimeout(() => {
                generateQuestion();
              }, 800);
            } else {
              // Wrong Match
              setDropFeedback('wrong');
              setScore(prev => Math.max(0, prev - 5));
              setTimeout(() => {
                setDropFeedback('idle');
              }, 800);
            }
          };

          // --- RENDER HELPERS ---
          const TargetIcon = question ? question.target.icon : Flame;

          return (
            <div className="flex flex-col h-full w-full">
              
              {/* HEADER */}
              <header className="bg-[#1E293B] border-b border-slate-800 p-4 shadow-md shrink-0">
                <div className="max-w-5xl mx-auto flex items-center justify-between">
                  <div>
                    <h1 className="text-xl md:text-2xl font-bold text-white tracking-tight flex items-center gap-2">
                      <ShieldAlert className="text-emerald-400 w-6 h-6" /> 
                      Chemistry Lab Safety Symbols Quiz
                    </h1>
                    <p className="text-xs md:text-sm text-slate-400 mt-1">
                      GHS Pictogram mapping and emergency response assessment.
                    </p>
                  </div>
                  
                  {gameState === 'play' && (
                    <div className="flex items-center gap-6 bg-slate-900 border border-slate-700 px-4 py-2 rounded-lg font-mono">
                      <div className="flex flex-col items-center">
                        <span className="text-[10px] text-slate-500 uppercase">Score</span>
                        <span className="text-lg font-black text-emerald-400 flex items-center gap-1">
                          <Award className="w-4 h-4" /> {score}
                        </span>
                      </div>
                      <div className="w-px h-8 bg-slate-700"></div>
                      <div className="flex flex-col items-center">
                        <span className="text-[10px] text-slate-500 uppercase">Time</span>
                        <span className={`text-lg font-black flex items-center gap-1 ${timeLeft <= 10 ? 'text-red-400 animate-pulse' : 'text-blue-400'}`}>
                          <Timer className="w-4 h-4" /> 0:{timeLeft.toString().padStart(2, '0')}
                        </span>
                      </div>
                    </div>
                  )}
                </div>
              </header>

              {/* MAIN WORKSPACE */}
              <main className="flex-1 w-full max-w-5xl mx-auto p-4 md:p-6 flex flex-col justify-center relative overflow-hidden">
                
                {/* === START SCREEN === */}
                {gameState === 'start' && (
                  <div className="max-w-2xl mx-auto bg-[#1E293B] border border-slate-700 rounded-2xl p-8 shadow-2xl text-center transform transition animate-fade-in">
                    <div className="flex justify-center mb-6">
                      <GHSBorder><Skull className="w-16 h-16" strokeWidth={1.5} /></GHSBorder>
                    </div>
                    <h2 className="text-3xl font-black text-white mb-4">GHS Hazard Identification</h2>
                    <p className="text-slate-400 mb-8 leading-relaxed max-w-lg mx-auto">
                      Test your knowledge of the Globally Harmonized System (GHS) pictograms. 
                      You will have 60 seconds to accurately map hazard symbols to their corresponding chemical examples and safe handling protocols.
                    </p>
                    <div className="flex justify-center gap-6 mb-8 text-sm font-mono text-slate-500">
                      <span className="bg-slate-900 px-4 py-2 rounded-lg border border-slate-800"><strong className="text-emerald-400">+10</strong> Correct Drop</span>
                      <span className="bg-slate-900 px-4 py-2 rounded-lg border border-slate-800"><strong className="text-red-400">-5</strong> Incorrect Drop</span>
                    </div>
                    <button 
                      onClick={startGame}
                      className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-lg py-4 px-12 rounded-full shadow-lg shadow-emerald-900/50 transition transform hover:-translate-y-1 active:translate-y-0 flex items-center gap-2 mx-auto"
                    >
                      <Play fill="currentColor" className="w-5 h-5" /> Start Assessment
                    </button>
                  </div>
                )}

                {/* === PLAY SCREEN === */}
                {gameState === 'play' && question && (
                  <div className="flex flex-col w-full max-w-4xl mx-auto gap-10 animate-fade-in">
                    
                    {/* Top Section: Target */}
                    <div className="flex flex-col md:flex-row gap-8 items-center justify-center pt-4">
                      
                      {/* Pictogram Display */}
                      <div className="flex flex-col items-center gap-4">
                        <GHSBorder>
                          <TargetIcon className="w-16 h-16" strokeWidth={1.5} />
                        </GHSBorder>
                        <div className="bg-slate-800 border border-slate-700 px-4 py-1.5 rounded-full text-xs font-bold text-slate-300 tracking-widest uppercase shadow-inner">
                          Target Hazard
                        </div>
                      </div>

                      {/* Drop Zone */}
                      <div 
                        onDragOver={handleDragOver}
                        onDragLeave={handleDragLeave}
                        onDrop={handleDrop}
                        className={`
                          w-full max-w-md h-40 border-4 border-dashed rounded-2xl flex flex-col items-center justify-center p-6 text-center transition-all duration-300
                          ${dropFeedback === 'correct' ? 'bg-emerald-900/40 border-emerald-500 shadow-[0_0_30px_rgba(16,185,129,0.3)] scale-105' : 
                            dropFeedback === 'wrong' ? 'bg-red-900/40 border-red-500 shadow-[0_0_30px_rgba(239,68,68,0.3)] animate-shake' : 
                            isDraggingOver ? 'bg-blue-900/20 border-blue-500 shadow-lg scale-105' : 'bg-slate-900/50 border-slate-700 hover:border-slate-600'}
                        `}
                      >
                        {dropFeedback === 'correct' ? (
                          <>
                            <CheckCircle2 className="w-12 h-12 text-emerald-400 mb-2" />
                            <span className="font-bold text-emerald-400 text-lg">Correct Match!</span>
                          </>
                        ) : dropFeedback === 'wrong' ? (
                          <>
                            <XCircle className="w-12 h-12 text-red-400 mb-2" />
                            <span className="font-bold text-red-400 text-lg">Hazard Mismatch!</span>
                          </>
                        ) : (
                          <>
                            <div className="w-12 h-12 rounded-full bg-slate-800 flex items-center justify-center mb-3">
                              <div className="w-6 h-6 border-2 border-slate-500 border-dashed rounded text-slate-500 flex items-center justify-center text-xs">+</div>
                            </div>
                            <span className="font-bold text-slate-300">
                              Drag the correct <span className="text-blue-400">{question.askType === 'chem' ? 'Chemical Example' : 'Handling Protocol'}</span> here.
                            </span>
                          </>
                        )}
                      </div>
                    </div>

                    {/* Bottom Section: Draggable Options */}
                    <div className="bg-[#1E293B] border border-slate-700 rounded-2xl p-6 shadow-xl relative">
                      <h3 className="text-xs font-bold text-slate-500 uppercase tracking-widest absolute -top-3 left-8 bg-[#1E293B] px-2">
                        Available Options
                      </h3>
                      
                      <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                        {question.options.map((opt, idx) => (
                          <div 
                            key={`${opt.id}-${idx}`}
                            draggable
                            onDragStart={(e) => handleDragStart(e, opt.id)}
                            className="bg-slate-800 border border-slate-600 rounded-xl p-4 cursor-grab active:cursor-grabbing hover:bg-slate-700 hover:border-blue-500 transition-all shadow-md hover:shadow-xl hover:-translate-y-1 flex items-center justify-center text-center min-h-[100px]"
                          >
                            <span className={`text-sm font-semibold leading-snug ${question.askType === 'chem' ? 'text-blue-300 font-mono' : 'text-slate-300'}`}>
                              {opt.text}
                            </span>
                          </div>
                        ))}
                      </div>
                    </div>

                  </div>
                )}

                {/* === END SCREEN === */}
                {gameState === 'end' && (
                  <div className="max-w-md mx-auto bg-[#1E293B] border border-slate-700 rounded-2xl p-8 shadow-2xl text-center transform transition animate-fade-in relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-full h-2 bg-emerald-500"></div>
                    
                    <Award className="w-20 h-20 text-emerald-400 mx-auto mb-4" />
                    <h2 className="text-3xl font-black text-white mb-2">Assessment Complete</h2>
                    <p className="text-slate-400 mb-6">Time is up! Here is your final safety compliance score.</p>
                    
                    <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 mb-8 shadow-inner">
                      <span className="text-xs uppercase font-bold text-slate-500 tracking-widest">Final Score</span>
                      <div className="text-7xl font-black text-emerald-400 font-mono mt-2">{score}</div>
                    </div>

                    <button 
                      onClick={startGame}
                      className="w-full bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white font-bold py-4 rounded-xl transition flex justify-center items-center gap-2"
                    >
                      <RotateCcw className="w-5 h-5" /> Retake Assessment
                    </button>
                  </div>
                )}

              </main>

            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
