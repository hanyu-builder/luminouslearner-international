<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chemical Kinetics Graph Plotter | Interactive Chemistry Simulator</title>
    <meta name="description" content="Chemical kinetics graph plotter. An automated differential plotting tool generating concentration-time curves and instantaneous rates via tangent slopes.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: { 850: '#151e2e', 900: '#0F172A', 950: '#020617' },
                        kinetics: {
                            curve: '#38BDF8',   // Sky Blue
                            tangent: '#F43F5E', // Rose Red
                            point: '#FBBF24',   // Amber
                            success: '#10B981'  // Emerald
                        }
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel (Compiles JSX in the browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Plotly.js -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>

    <style>
        body { margin: 0; background-color: #020617; overflow: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Custom Scrubber Slider */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
            width: 100%;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px; width: 20px;
            border-radius: 50%;
            background: #F43F5E;
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 0 0 10px rgba(244, 63, 94, 0.6);
            border: 2px solid #FFF;
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:active {
            transform: scale(1.2);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px;
            cursor: pointer;
            background: #334155;
            border-radius: 2px;
        }
        
        /* Plotly overrides for dark theme */
        .js-plotly-plot .plotly .modebar {
            background: transparent !important;
        }
    </style>
</head>
<body class="text-slate-200 font-sans selection:bg-sky-500 selection:text-white flex items-center justify-center h-screen max-h-[1000px] w-full">

    <div id="root" class="w-full h-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Icons ---
        const LineChart = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>;
        const Table2 = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/><path d="M15 3v18"/></svg>;
        const Play = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>;

        // --- Data Generation & Presets ---
        const PRESETS = {
            FIRST_ORDER: {
                name: "First Order Decay",
                desc: "Rate depends on concentration to the first power. Exponential decay curve.",
                generate: () => {
                    let d = [];
                    for(let t=0; t<=100; t+=5) d.push({ t, c: 100 * Math.exp(-0.03 * t) });
                    return d;
                }
            },
            SECOND_ORDER: {
                name: "Second Order Decay",
                desc: "Rate depends on concentration squared. Steeper initial drop, longer tail.",
                generate: () => {
                    let d = [];
                    for(let t=0; t<=100; t+=5) d.push({ t, c: 1 / (0.001 * t + 1/100) });
                    return d;
                }
            },
            ZERO_ORDER: {
                name: "Zero Order Decay",
                desc: "Rate is constant and independent of concentration. Linear decay.",
                generate: () => {
                    let d = [];
                    for(let t=0; t<=100; t+=5) d.push({ t, c: Math.max(0, 100 - 0.8 * t) });
                    return d;
                }
            }
        };

        function App() {
            // State
            const [activePreset, setActivePreset] = useState('FIRST_ORDER');
            const [data, setData] = useState(PRESETS.FIRST_ORDER.generate());
            const [selectedIndex, setSelectedIndex] = useState(5);
            const [customInput, setCustomInput] = useState("");
            const [isCustom, setIsCustom] = useState(false);
            const [error, setError] = useState("");
            
            const plotDivRef = useRef(null);

            // --- Math Engine: Derivative & Tangent ---
            const calculateTangent = (idx, dataset) => {
                if (dataset.length < 2) return { slope: 0, line: [] };

                let slope = 0;
                
                // Central Difference for internal points, Forward/Backward for edges
                if (idx === 0) {
                    slope = (dataset[1].c - dataset[0].c) / (dataset[1].t - dataset[0].t);
                } else if (idx === dataset.length - 1) {
                    slope = (dataset[idx].c - dataset[idx-1].c) / (dataset[idx].t - dataset[idx-1].t);
                } else {
                    slope = (dataset[idx+1].c - dataset[idx-1].c) / (dataset[idx+1].t - dataset[idx-1].t);
                }

                const point = dataset[idx];
                
                // Calculate line coordinates for visual representation
                // Span the tangent line 30% of the total x-axis range
                const xRange = dataset[dataset.length-1].t - dataset[0].t;
                const deltaX = xRange * 0.15; 
                
                const x1 = Math.max(dataset[0].t - deltaX, point.t - deltaX);
                const x2 = Math.min(dataset[dataset.length-1].t + deltaX, point.t + deltaX);
                
                const y1 = slope * (x1 - point.t) + point.c;
                const y2 = slope * (x2 - point.t) + point.c;

                return { 
                    slope, 
                    line: { x: [x1, x2], y: [y1, y2] }
                };
            };

            // --- Plotly Renderer ---
            const renderPlot = () => {
                if (!plotDivRef.current || data.length === 0) return;

                const { slope, line } = calculateTangent(selectedIndex, data);
                const currentPoint = data[selectedIndex];

                // Trace 1: The smooth concentration curve
                const traceMain = {
                    x: data.map(d => d.t),
                    y: data.map(d => d.c),
                    mode: 'lines+markers',
                    type: 'scatter',
                    name: '[Concentration]',
                    line: { shape: 'spline', color: '#38BDF8', width: 3 },
                    marker: { size: 6, color: '#0284C7' },
                    hoverinfo: 'x+y'
                };

                // Trace 2: The Tangent Line
                const traceTangent = {
                    x: line.x,
                    y: line.y,
                    mode: 'lines',
                    type: 'scatter',
                    name: 'Tangent (Slope)',
                    line: { color: '#F43F5E', width: 2, dash: 'dash' },
                    hoverinfo: 'none'
                };

                // Trace 3: Highlighted Point
                const tracePoint = {
                    x: [currentPoint.t],
                    y: [currentPoint.c],
                    mode: 'markers',
                    type: 'scatter',
                    name: 'Selected Time',
                    marker: { size: 14, color: '#F43F5E', line: { color: '#FFF', width: 2 } },
                    hoverinfo: 'none'
                };

                const layout = {
                    paper_bgcolor: 'rgba(0,0,0,0)',
                    plot_bgcolor: 'rgba(0,0,0,0)',
                    font: { color: '#94A3B8', family: 'Inter, sans-serif' },
                    margin: { t: 40, r: 20, b: 50, l: 60 },
                    xaxis: { 
                        title: 'Time (s)', 
                        gridcolor: '#1E293B',
                        zerolinecolor: '#334155'
                    },
                    yaxis: { 
                        title: 'Concentration (M)', 
                        gridcolor: '#1E293B',
                        zerolinecolor: '#334155',
                        rangemode: 'tozero'
                    },
                    showlegend: false,
                    hovermode: 'closest',
                    transition: { duration: 200, easing: 'cubic-in-out' }
                };

                const config = { responsive: true, displayModeBar: false };

                Plotly.react(plotDivRef.current, [traceMain, traceTangent, tracePoint], layout, config);
            };

            // Re-render plot when data or selected index changes
            useEffect(() => {
                renderPlot();
            }, [data, selectedIndex]);

            // --- Handlers ---
            const handlePresetChange = (e) => {
                const key = e.target.value;
                setActivePreset(key);
                setIsCustom(false);
                setError("");
                const newData = PRESETS[key].generate();
                setData(newData);
                setSelectedIndex(Math.floor(newData.length / 2));
            };

            const handleCustomSubmit = () => {
                try {
                    const rows = customInput.trim().split('\n');
                    const newData = [];
                    for (let row of rows) {
                        const cols = row.split(',').map(s => parseFloat(s.trim()));
                        if (cols.length >= 2 && !isNaN(cols[0]) && !isNaN(cols[1])) {
                            newData.push({ t: cols[0], c: cols[1] });
                        }
                    }
                    
                    if (newData.length < 3) {
                        setError("Please provide at least 3 valid comma-separated rows (Time, Concentration).");
                        return;
                    }

                    // Sort by time ascending
                    newData.sort((a, b) => a.t - b.t);
                    
                    setData(newData);
                    setIsCustom(true);
                    setError("");
                    setSelectedIndex(Math.floor(newData.length / 2));
                } catch (err) {
                    setError("Parsing error. Ensure format is: Time, Concentration");
                }
            };

            // Math derivation for display
            const { slope } = calculateTangent(selectedIndex, data);
            const currentPoint = data[selectedIndex];
            const instantaneousRate = Math.abs(slope); // Rate is positive magnitude of consumption

            return (
                <div className="w-full h-full flex flex-col md:flex-row">
                    
                    {/* Left Panel: UI & Controls */}
                    <aside className="w-full md:w-[400px] lg:w-[450px] bg-slate-900 border-b md:border-b-0 md:border-r border-slate-700 flex flex-col z-10 shadow-2xl h-[50vh] md:h-full shrink-0">
                        
                        <div className="p-6 pb-4 border-b border-slate-800">
                            <div className="flex items-center gap-3 mb-1">
                                <div className="p-2 bg-sky-500/20 rounded-lg text-sky-400">
                                    <LineChart />
                                </div>
                                <h1 className="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-sky-400 to-blue-500 leading-tight">
                                    Chemical Kinetics<br/>Graph Plotter
                                </h1>
                            </div>
                            <p className="text-xs text-slate-400 mt-2">Differential Plotting & Tangent Engine</p>
                        </div>

                        <div className="flex flex-col flex-grow overflow-y-auto no-scrollbar p-6 space-y-6">
                            
                            {/* Data Source Selector */}
                            <div className="space-y-3">
                                <label className="text-xs font-semibold text-slate-400 uppercase tracking-wider block">Data Source</label>
                                <select 
                                    className="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-slate-200 outline-none focus:border-sky-500 transition-colors shadow-inner"
                                    value={isCustom ? 'CUSTOM' : activePreset}
                                    onChange={handlePresetChange}
                                >
                                    {Object.keys(PRESETS).map(key => (
                                        <option key={key} value={key}>{PRESETS[key].name}</option>
                                    ))}
                                    <option value="CUSTOM">Custom Data Input (CSV)</option>
                                </select>
                                
                                {!isCustom ? (
                                    <p className="text-xs text-slate-500 leading-relaxed border-l-2 border-slate-700 pl-3">
                                        {PRESETS[activePreset].desc}
                                    </p>
                                ) : (
                                    <div className="animate-in fade-in slide-in-from-top-2">
                                        <textarea 
                                            className="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-slate-300 font-mono text-sm outline-none focus:border-sky-500 h-24 shadow-inner"
                                            placeholder="Time, Concentration&#10;0, 100&#10;5, 80&#10;10, 60"
                                            value={customInput}
                                            onChange={e => setCustomInput(e.target.value)}
                                        ></textarea>
                                        <button 
                                            onClick={handleCustomSubmit}
                                            className="w-full mt-2 bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-200 text-sm font-bold py-2 rounded-lg transition-colors flex items-center justify-center gap-2"
                                        >
                                            <Play /> Plot Custom Data
                                        </button>
                                        {error && <p className="text-xs text-rose-400 mt-2">{error}</p>}
                                    </div>
                                )}
                            </div>

                            {/* Data Table Preview */}
                            <div className="bg-slate-950 rounded-xl border border-slate-800 flex flex-col overflow-hidden max-h-48 shadow-inner">
                                <div className="bg-slate-800 text-xs font-semibold text-slate-400 uppercase tracking-wider p-2 flex justify-between border-b border-slate-700">
                                    <span className="flex items-center gap-2"><Table2 /> Data Points ({data.length})</span>
                                </div>
                                <div className="overflow-y-auto no-scrollbar p-2 flex-grow">
                                    <table className="w-full text-right text-sm">
                                        <thead>
                                            <tr className="text-slate-500 border-b border-slate-800">
                                                <th className="font-normal pb-1 pr-4">Time (s)</th>
                                                <th className="font-normal pb-1 pr-2">[C] (M)</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {data.map((d, i) => (
                                                <tr key={i} className={`${i === selectedIndex ? 'bg-sky-500/10 text-sky-400 font-bold' : 'text-slate-400'} transition-colors`}>
                                                    <td className="py-1 pr-4 border-b border-slate-800/50">{d.t.toFixed(1)}</td>
                                                    <td className="py-1 pr-2 border-b border-slate-800/50">{d.c.toFixed(3)}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                        </div>
                    </aside>

                    {/* Right Panel: Interactive Plot & Scrubber */}
                    <main className="flex-grow relative bg-slate-950 flex flex-col h-[50vh] md:h-full overflow-hidden p-4 md:p-8">
                        
                        {/* Instantaneous Rate Telemetry Board */}
                        <div className="absolute top-4 right-4 md:top-8 md:right-8 bg-slate-900/90 backdrop-blur-md border border-slate-700 p-5 rounded-2xl shadow-2xl z-20 min-w-[280px]">
                            <h3 className="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-4 border-b border-slate-800 pb-2">
                                Differential Analysis
                            </h3>
                            
                            <div className="space-y-4">
                                <div className="flex justify-between items-end">
                                    <span className="text-xs text-slate-400">Current Time (t)</span>
                                    <span className="font-mono text-xl text-slate-200">{currentPoint?.t.toFixed(1)} s</span>
                                </div>
                                
                                <div className="flex justify-between items-end">
                                    <span className="text-xs text-slate-400">Concentration [C]</span>
                                    <span className="font-mono text-xl text-sky-400">{currentPoint?.c.toFixed(3)} M</span>
                                </div>

                                <div className="pt-3 border-t border-slate-800">
                                    <span className="text-[10px] text-slate-500 uppercase tracking-widest block mb-1">Tangent Slope (d[C]/dt)</span>
                                    <span className="font-mono text-lg text-rose-400">{slope.toFixed(4)}</span>
                                </div>

                                <div className="bg-slate-950 border border-slate-800 rounded-lg p-3 mt-2">
                                    <span className="text-[10px] text-slate-500 uppercase tracking-widest block mb-1">Instantaneous Rate</span>
                                    <div className="flex items-baseline gap-2">
                                        <span className="font-mono text-2xl font-bold text-emerald-400">{instantaneousRate.toFixed(4)}</span>
                                        <span className="text-xs text-slate-400">M/s</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Plotly Container */}
                        <div className="w-full flex-grow relative bg-slate-900 border border-slate-800 rounded-2xl shadow-inner overflow-hidden flex items-center justify-center">
                            {data.length > 0 ? (
                                <div ref={plotDivRef} className="w-full h-full"></div>
                            ) : (
                                <span className="text-slate-500">No data to plot</span>
                            )}
                        </div>

                        {/* Interactive Scrubber Tool */}
                        <div className="mt-6 bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-lg flex items-center gap-6">
                            <div className="whitespace-nowrap">
                                <span className="block text-[10px] text-slate-500 uppercase tracking-widest font-bold">Scrubber Tool</span>
                                <span className="text-sm text-slate-300">Slide to snap tangent</span>
                            </div>
                            
                            <div className="flex-grow flex items-center gap-4">
                                <span className="text-xs font-mono text-slate-500">{data[0]?.t}s</span>
                                <input 
                                    type="range" 
                                    min="0" 
                                    max={data.length - 1} 
                                    value={selectedIndex}
                                    onChange={(e) => setSelectedIndex(parseInt(e.target.value))}
                                />
                                <span className="text-xs font-mono text-slate-500">{data[data.length-1]?.t}s</span>
                            </div>
                        </div>

                    </main>

                </div>
            );
        }

        // --- Render Application ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
