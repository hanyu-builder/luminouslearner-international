<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Catalyst Energy Profile Diagram | Kinetics Explorer</title>
    <meta name="description" content="Catalyst energy profile diagram interactive simulator. Explore Arrhenius collision theory, Maxwell-Boltzmann distributions, and reaction pathways.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Plotly.js for Scientific Graphing -->
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { 
            margin: 0; 
            background-color: #0F172A; 
            color: #E2E8F0;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden; 
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Custom range sliders */
        input[type="range"] {
            -webkit-appearance: none;
            background: transparent;
            width: 100%;
        }
        input[type="range"]::-webkit-slider-runnable-track {
            height: 6px;
            border-radius: 3px;
            background: #334155;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: currentColor;
            margin-top: -6px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* Toggle Switch Animation */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #10B981;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #10B981;
        }
    </style>
</head>
<body>

    <div id="root" class="w-full h-screen max-h-[1000px] flex justify-center items-center p-2 md:p-4"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- MATH ENGINE FOR PLOTLY ---
        
        // Generates the Energy Profile Curve using a logistic step + Gaussian peak
        const generateEnergyProfile = (Er, Ep, Ea) => {
            const data = [];
            for (let x = 0; x <= 100; x++) {
                // Logistic drop/rise from Reactants to Products
                const base = Er + (Ep - Er) / (1 + Math.exp(-0.15 * (x - 50)));
                // Amplitude calculation ensuring the peak exactly hits Er + Ea
                const amp = Ea + (Er - Ep)/2;
                // Gaussian curve centered at x=50
                const peak = amp * Math.exp(-0.003 * Math.pow(x - 50, 2));
                data.push({ x, y: base + peak });
            }
            return data;
        };

        // Generates the Maxwell-Boltzmann surrogate function curve: y = (x / T^2) * e^(-x/T)
        // Scaled visually so the peak is readable.
        const generateMBDistribution = (T) => {
            const data = [];
            for (let x = 0; x <= 200; x++) {
                // To keep visually normalized, we scale the Y output relative to T
                const y = (x / Math.pow(T, 2)) * Math.exp(-x / T) * 1000;
                data.push({ x, y });
            }
            return data;
        };

        // Calculates the definite integral of the surrogate MB function from Ea to Infinity
        // Representing the fraction of particles with Energy > Ea
        // Formula: Integral = e^(-Ea/T) * (1 + Ea/T)
        const calculateSuccessFraction = (Ea, T) => {
            return Math.exp(-Ea / T) * (1 + Ea / T);
        };

        // --- REACT COMPONENTS ---

        function App() {
            // --- STATE ---
            const [isCatalyzed, setIsCatalyzed] = useState(false);
            
            // Thermodynamic & Kinetic Variables
            const [temperature, setTemperature] = useState(30); // Defines spread of MB curve
            const [baseEa, setBaseEa] = useState(120); // Uncatalyzed Activation Energy
            const [catalystEfficiency, setCatalystEfficiency] = useState(40); // % reduction in Ea
            
            // Constants for the simulation
            const Er = 40; // Energy of Reactants
            const Ep = 20; // Energy of Products (Exothermic)

            // Derived values
            const catEa = baseEa * (1 - catalystEfficiency / 100);

            const fracUncat = calculateSuccessFraction(baseEa, temperature);
            const fracCat = calculateSuccessFraction(catEa, temperature);
            const rateMultiplier = fracCat / fracUncat;

            // Refs for Plotly divs
            const epGraphRef = useRef(null);
            const mbGraphRef = useRef(null);

            // --- PLOTLY RENDERING (ENERGY PROFILE) ---
            useEffect(() => {
                if (!epGraphRef.current) return;

                const uncatData = generateEnergyProfile(Er, Ep, baseEa);
                const catData = generateEnergyProfile(Er, Ep, catEa);

                const traceUncat = {
                    x: uncatData.map(d => d.x),
                    y: uncatData.map(d => d.y),
                    mode: 'lines',
                    name: 'Uncatalyzed Pathway',
                    line: { color: '#F43F5E', width: 4 },
                    hoverinfo: 'none'
                };

                const traceCat = {
                    x: catData.map(d => d.x),
                    y: catData.map(d => d.y),
                    mode: 'lines',
                    name: 'Catalyzed Pathway',
                    line: { color: '#10B981', width: 4, dash: 'dash' },
                    visible: isCatalyzed ? true : false,
                    hoverinfo: 'none'
                };

                // Annotations
                const annotations = [
                    {
                        x: 10, y: Er, text: 'Reactants',
                        showarrow: false, font: { color: '#94A3B8' }, yanchor: 'bottom', yshift: 5
                    },
                    {
                        x: 90, y: Ep, text: 'Products',
                        showarrow: false, font: { color: '#94A3B8' }, yanchor: 'bottom', yshift: 5
                    }
                ];

                const layout = {
                    paper_bgcolor: 'rgba(0,0,0,0)',
                    plot_bgcolor: 'rgba(0,0,0,0)',
                    margin: { t: 20, r: 20, l: 50, b: 40 },
                    xaxis: { 
                        title: 'Reaction Progress', color: '#64748B', 
                        showgrid: false, zeroline: false, showticklabels: false 
                    },
                    yaxis: { 
                        title: 'Potential Energy (kJ/mol)', color: '#64748B', 
                        showgrid: true, gridcolor: '#1E293B', zeroline: false,
                        range: [0, 220]
                    },
                    showlegend: false,
                    annotations: annotations
                };

                Plotly.react(epGraphRef.current, [traceUncat, traceCat], layout, {displayModeBar: false, responsive: true});
            }, [baseEa, catEa, isCatalyzed]);

            // --- PLOTLY RENDERING (MAXWELL-BOLTZMANN) ---
            useEffect(() => {
                if (!mbGraphRef.current) return;

                const mbData = generateMBDistribution(temperature);
                const xVals = mbData.map(d => d.x);
                const yVals = mbData.map(d => d.y);

                // Main Curve
                const traceMain = {
                    x: xVals,
                    y: yVals,
                    mode: 'lines',
                    name: 'Distribution',
                    line: { color: '#38BDF8', width: 3 },
                    hoverinfo: 'none'
                };

                // Filled Area (Uncatalyzed) - E > baseEa
                const uncatFillX = xVals.filter(x => x >= baseEa);
                const uncatFillY = uncatFillX.map(x => mbData.find(d => d.x === x).y);
                const traceFillUncat = {
                    x: [baseEa, ...uncatFillX, 200],
                    y: [0, ...uncatFillY, 0],
                    fill: 'tozeroy',
                    type: 'scatter',
                    name: 'E > Ea (Uncat)',
                    fillcolor: 'rgba(244, 63, 94, 0.4)', // Rose with opacity
                    line: { width: 0 },
                    hoverinfo: 'none'
                };

                // Filled Area (Catalyzed) - catEa < E < baseEa (The extra area gained)
                const catFillX = xVals.filter(x => x >= catEa && x < baseEa);
                const catFillY = catFillX.map(x => mbData.find(d => d.x === x).y);
                const traceFillCat = {
                    x: [catEa, ...catFillX, baseEa, baseEa],
                    y: [0, ...catFillY, mbData.find(d=>d.x === baseEa)?.y || 0, 0],
                    fill: 'tozeroy',
                    type: 'scatter',
                    name: 'Extra Collisions',
                    fillcolor: 'rgba(16, 185, 129, 0.5)', // Emerald with opacity
                    line: { width: 0 },
                    visible: isCatalyzed ? true : false,
                    hoverinfo: 'none'
                };

                // Vertical lines for thresholds
                const shapes = [
                    {
                        type: 'line', x0: baseEa, x1: baseEa, y0: 0, y1: 15,
                        line: { color: '#F43F5E', width: 2, dash: 'dot' }
                    }
                ];
                const annotations = [
                    { x: baseEa, y: 15.5, text: 'Ea', showarrow: false, font: {color: '#F43F5E'} }
                ];

                if (isCatalyzed) {
                    shapes.push({
                        type: 'line', x0: catEa, x1: catEa, y0: 0, y1: 15,
                        line: { color: '#10B981', width: 2, dash: 'dot' }
                    });
                    annotations.push(
                        { x: catEa, y: 15.5, text: 'Ea(cat)', showarrow: false, font: {color: '#10B981'} }
                    );
                }

                const layout = {
                    paper_bgcolor: 'rgba(0,0,0,0)',
                    plot_bgcolor: 'rgba(0,0,0,0)',
                    margin: { t: 20, r: 20, l: 50, b: 40 },
                    xaxis: { 
                        title: 'Kinetic Energy (E)', color: '#64748B', 
                        showgrid: false, zeroline: false, range: [0, 200]
                    },
                    yaxis: { 
                        title: 'Number of Particles', color: '#64748B', 
                        showgrid: false, zeroline: false, showticklabels: false,
                        range: [0, 16] // Fixed Y range to prevent bouncing when T changes
                    },
                    showlegend: false,
                    shapes: shapes,
                    annotations: annotations
                };

                Plotly.react(mbGraphRef.current, [traceMain, traceFillUncat, traceFillCat], layout, {displayModeBar: false, responsive: true});
            }, [temperature, baseEa, catEa, isCatalyzed]);

            // --- RENDER HELPERS ---
            // Format multiplier beautifully (e.g., handles massive numbers like 2.5x10^4)
            const formatMultiplier = (val) => {
                if (val < 1000) return val.toFixed(1) + 'x';
                return val.toExponential(2) + 'x';
            };

            return (
                <div className="w-full max-w-7xl h-full flex flex-col bg-slate-900 border border-slate-700 rounded-3xl shadow-2xl overflow-hidden">
                    
                    {/* Header */}
                    <header className="bg-slate-800/80 backdrop-blur p-4 md:p-6 border-b border-slate-700 flex justify-between items-center shrink-0 z-10">
                        <div>
                            <h1 className="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-500">
                                Catalyst Profile Explorer
                            </h1>
                            <p className="text-slate-400 text-xs mt-1 uppercase tracking-wider font-semibold">
                                Arrhenius Mathematical Engine & Reaction Pathways
                            </p>
                        </div>
                        
                        {/* THE MASTER TOGGLE */}
                        <div className="flex items-center gap-3 bg-slate-950 px-4 py-2 rounded-xl border border-slate-800">
                            <span className={`text-sm font-bold uppercase tracking-wider ${isCatalyzed ? 'text-emerald-400' : 'text-slate-500'}`}>
                                Enable Catalyst
                            </span>
                            <div className="relative inline-block w-12 align-middle select-none transition duration-200 ease-in">
                                <input 
                                    type="checkbox" 
                                    name="toggle" 
                                    id="toggle" 
                                    checked={isCatalyzed}
                                    onChange={() => setIsCatalyzed(!isCatalyzed)}
                                    className="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 border-slate-700 appearance-none cursor-pointer z-10 top-0 left-0 transition-all duration-300"
                                />
                                <label htmlFor="toggle" className="toggle-label block overflow-hidden h-6 rounded-full bg-slate-700 cursor-pointer transition-colors duration-300"></label>
                            </div>
                        </div>
                    </header>

                    {/* Main Workspace */}
                    <div className="flex-grow flex flex-col overflow-y-auto hide-scrollbar">
                        
                        {/* Upper Section: The Graphs Side-by-Side */}
                        <div className="flex flex-col lg:flex-row border-b border-slate-800 h-[350px] md:h-[400px] shrink-0">
                            
                            {/* Energy Profile Diagram */}
                            <div className="w-full lg:w-1/2 p-4 flex flex-col border-r border-slate-800 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-800/50 to-transparent">
                                <h2 className="text-xs font-bold text-slate-500 uppercase tracking-widest text-center mb-2">Energy Profile Diagram</h2>
                                <div className="flex-grow w-full relative">
                                    <div ref={epGraphRef} className="absolute inset-0"></div>
                                </div>
                            </div>

                            {/* Maxwell-Boltzmann Distribution */}
                            <div className="w-full lg:w-1/2 p-4 flex flex-col bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-800/50 to-transparent">
                                <h2 className="text-xs font-bold text-slate-500 uppercase tracking-widest text-center mb-2">Maxwell-Boltzmann Distribution</h2>
                                <div className="flex-grow w-full relative">
                                    <div ref={mbGraphRef} className="absolute inset-0"></div>
                                </div>
                            </div>

                        </div>

                        {/* Lower Section: Controls & Telemetry */}
                        <div className="flex flex-col lg:flex-row flex-grow bg-slate-950 relative">
                            
                            {/* Controls Left */}
                            <div className="w-full lg:w-1/2 p-6 lg:p-8 border-r border-slate-800 flex flex-col gap-6">
                                <h3 className="text-sm font-bold text-slate-400 uppercase tracking-widest border-b border-slate-800 pb-2">Variables</h3>
                                
                                {/* Temperature Slider */}
                                <div className="space-y-2">
                                    <div className="flex justify-between items-end">
                                        <label className="text-sm font-bold text-sky-400">Temperature (Kinetic Energy)</label>
                                        <span className="font-mono text-white bg-slate-900 px-2 py-1 rounded text-sm border border-slate-700">T-Scale: {temperature.toFixed(1)}</span>
                                    </div>
                                    <input 
                                        type="range" min="15" max="60" step="1" 
                                        value={temperature} 
                                        onChange={(e) => setTemperature(parseFloat(e.target.value))}
                                        className="text-sky-500"
                                    />
                                    <p className="text-[10px] text-slate-500">Flattens and shifts the distribution curve to the right.</p>
                                </div>

                                {/* Base Activation Energy Slider */}
                                <div className="space-y-2">
                                    <div className="flex justify-between items-end">
                                        <label className="text-sm font-bold text-rose-400">Standard Activation Energy ($E_a$)</label>
                                        <span className="font-mono text-white bg-slate-900 px-2 py-1 rounded text-sm border border-slate-700">{baseEa} kJ/mol</span>
                                    </div>
                                    <input 
                                        type="range" min="60" max="180" step="5" 
                                        value={baseEa} 
                                        onChange={(e) => setBaseEa(parseFloat(e.target.value))}
                                        className="text-rose-500"
                                    />
                                    <p className="text-[10px] text-slate-500">The minimum energy barrier required for a successful collision.</p>
                                </div>

                                {/* Catalyst Efficiency Slider */}
                                <div className={`space-y-2 transition-opacity duration-300 ${isCatalyzed ? 'opacity-100' : 'opacity-30 pointer-events-none'}`}>
                                    <div className="flex justify-between items-end">
                                        <label className="text-sm font-bold text-emerald-400">Catalyst Pathway Efficiency</label>
                                        <span className="font-mono text-emerald-300 bg-emerald-900/20 px-2 py-1 rounded text-sm border border-emerald-500/30">-{catalystEfficiency}% $E_a$</span>
                                    </div>
                                    <input 
                                        type="range" min="10" max="80" step="5" 
                                        value={catalystEfficiency} 
                                        onChange={(e) => setCatalystEfficiency(parseFloat(e.target.value))}
                                        className="text-emerald-500"
                                    />
                                    <p className="text-[10px] text-emerald-500/70">A catalyst provides an alternative pathway with a lower activation energy threshold.</p>
                                </div>

                            </div>

                            {/* Telemetry Right */}
                            <div className="w-full lg:w-1/2 p-6 lg:p-8 flex flex-col justify-center relative overflow-hidden">
                                
                                {/* Background Watermark */}
                                <div className="absolute -right-10 -bottom-10 opacity-5 pointer-events-none">
                                    <svg width="300" height="300" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1" strokeLinecap="round" strokeLinejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                                </div>

                                <h3 className="text-sm font-bold text-slate-400 uppercase tracking-widest border-b border-slate-800 pb-2 mb-6 z-10">Kinetics Analysis</h3>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6 z-10">
                                    {/* Uncatalyzed Stats */}
                                    <div className="bg-rose-900/10 border border-rose-500/20 p-4 rounded-xl flex flex-col justify-between">
                                        <span className="text-[10px] text-rose-400 uppercase tracking-widest font-bold mb-2">Base Successful Collisions</span>
                                        <div className="flex items-baseline gap-1">
                                            <span className="text-2xl font-mono text-white font-bold">{(fracUncat * 10000).toPrecision(3)}</span>
                                            <span className="text-xs text-slate-500">units</span>
                                        </div>
                                    </div>

                                    {/* Catalyzed Stats */}
                                    <div className={`border p-4 rounded-xl flex flex-col justify-between transition-colors duration-500 ${isCatalyzed ? 'bg-emerald-900/20 border-emerald-500/50 shadow-[0_0_15px_rgba(16,185,129,0.15)]' : 'bg-slate-900/50 border-slate-800 opacity-50'}`}>
                                        <span className={`text-[10px] uppercase tracking-widest font-bold mb-2 ${isCatalyzed ? 'text-emerald-400' : 'text-slate-500'}`}>Catalyzed Collisions</span>
                                        <div className="flex items-baseline gap-1">
                                            <span className="text-2xl font-mono text-white font-bold">{isCatalyzed ? (fracCat * 10000).toPrecision(3) : '---'}</span>
                                            <span className="text-xs text-slate-500">units</span>
                                        </div>
                                    </div>
                                </div>

                                {/* The Big Reveal Box */}
                                <div className={`mt-auto p-6 rounded-2xl border-2 transition-all duration-500 relative overflow-hidden z-10
                                    ${isCatalyzed ? 'bg-indigo-900/30 border-indigo-500 shadow-[0_0_30px_rgba(99,102,241,0.2)]' : 'bg-slate-900 border-slate-700'}`}>
                                    
                                    <div className="flex flex-col">
                                        <span className={`text-xs font-bold uppercase tracking-widest mb-1 transition-colors ${isCatalyzed ? 'text-indigo-400' : 'text-slate-500'}`}>Reaction Rate Multiplier</span>
                                        <div className="flex items-baseline gap-2">
                                            <span className={`text-5xl font-mono font-bold transition-all duration-1000 ${isCatalyzed ? 'text-white' : 'text-slate-600'}`}>
                                                {isCatalyzed ? formatMultiplier(rateMultiplier) : '1.0x'}
                                            </span>
                                            {isCatalyzed && <span className="text-indigo-300 font-bold text-sm animate-pulse">FASTER</span>}
                                        </div>
                                    </div>
                                    
                                    <p className={`text-xs mt-4 leading-relaxed transition-colors ${isCatalyzed ? 'text-indigo-200' : 'text-slate-500'}`}>
                                        {isCatalyzed 
                                            ? "Mathematical insight: Because the Maxwell-Boltzmann distribution drops exponentially, a small linear decrease in activation energy results in an exponential increase in the number of particles that possess enough energy to react." 
                                            : "Enable the catalyst above to see how an alternative reaction pathway fundamentally alters the reaction kinetics."}
                                    </p>
                                </div>

                            </div>
                        </div>

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
