<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hess's Law Calculations Interactive - Cycle Solver</title>
  <meta name="description" content="Hess's law calculations interactive simulator. A vector-based thermodynamic pathfinding engine validating the principle of energy conservation via energy cycles.">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for in-browser JSX transpilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { background-color: #0F172A; margin: 0; overflow: hidden; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    
    /* Custom Scrollbar */
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(30, 41, 59, 0.5); }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(71, 85, 105, 0.8); border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 1); }

    /* Interactive Vector Arrows */
    .vector-arrow { transition: all 0.3s ease; cursor: pointer; }
    .vector-arrow:hover .line { stroke-width: 6px; filter: drop-shadow(0 0 8px currentColor); }
    .vector-hitbox { stroke: transparent; stroke-width: 30px; fill: none; cursor: pointer; }
    
    /* Animations */
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .anim-slide-up { animation: slideUp 0.4s ease-out forwards; }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
      50% { box-shadow: 0 0 15px 5px rgba(16, 185, 129, 0.2); }
    }
    .solved-glow { animation: pulse-glow 2s infinite; border-color: #10b981 !important; }

    @keyframes dash-flow {
      to { stroke-dashoffset: -20; }
    }
    .flow-dash { stroke-dasharray: 6 6; animation: dash-flow 1s linear infinite; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- ICON COMPONENTS ---
    const SvgIcon = ({ children, size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
    );
    const Activity = (p) => <SvgIcon {...p}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12" /></SvgIcon>;
    const Info = (p) => <SvgIcon {...p}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></SvgIcon>;
    const CheckCircle2 = (p) => <SvgIcon {...p}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></SvgIcon>;
    const Calculator = (p) => <SvgIcon {...p}><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></SvgIcon>;
    const Waypoints = (p) => <SvgIcon {...p}><circle cx="12" cy="4.5" r="2.5"/><path d="m10.2 6.3-3.9 3.9"/><circle cx="4.5" cy="12" r="2.5"/><path d="M7 12h10"/><circle cx="19.5" cy="12" r="2.5"/><path d="m13.8 17.7 3.9-3.9"/><circle cx="12" cy="19.5" r="2.5"/></SvgIcon>;
    const GitMerge = (p) => <SvgIcon {...p}><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M6 21V9a9 9 0 0 0 9 9"/></SvgIcon>;

    // --- THERMODYNAMIC SCENARIO DATABASE ---
    // defaultDir: 1 implies Left->Right or Top->Bottom relative to the cycle origin points.
    // defaultDir: -1 implies the arrow points opposite to the logical forward path.
    const SCENARIOS = [
      {
        id: 1,
        title: "Reaction Enthalpy from Formation Data",
        desc: "Calculate the enthalpy of combustion of Methane using standard enthalpies of formation.",
        targetLabel: "ΔH_r",
        targetText: "CH₄(g) + 2O₂(g) ➔ CO₂(g) + 2H₂O(l)",
        reactants: "CH₄(g) + 2O₂(g)",
        products: "CO₂(g) + 2H₂O(l)",
        intermediates: "C(s) + 2H₂(g) + 2O₂(g)",
        intLabel: "Constituent Elements",
        path1: { label: "ΔH₁", value: -74.8, defaultDir: -1, desc: "ΔH_f of Reactants" }, // Points Elements -> Reactants
        path2: { label: "ΔH₂", value: -965.1, defaultDir: 1, desc: "ΔH_f of Products" }   // Points Elements -> Products
      },
      {
        id: 2,
        title: "Formation Enthalpy from Combustion Data",
        desc: "Calculate the enthalpy of formation of Ethane from its constituent elements.",
        targetLabel: "ΔH_f",
        targetText: "2C(s) + 3H₂(g) ➔ C₂H₆(g)",
        reactants: "2C(s) + 3H₂(g)",
        products: "C₂H₆(g)",
        intermediates: "2CO₂(g) + 3H₂O(l)",
        intLabel: "Combustion Products",
        path1: { label: "ΔH₁", value: -1644.4, defaultDir: 1, desc: "Combustion of Elements" }, // Reactants -> Combustion Products
        path2: { label: "ΔH₂", value: -1559.7, defaultDir: -1, desc: "Combustion of Ethane" }   // Products -> Combustion Products
      },
      {
        id: 3,
        title: "Reaction Enthalpy from Combustion Data",
        desc: "Determine the enthalpy change for the hydration of Ethene into Ethanol.",
        targetLabel: "ΔH_r",
        targetText: "C₂H₄(g) + H₂O(l) ➔ C₂H₅OH(l)",
        reactants: "C₂H₄(g) + H₂O(l)",
        products: "C₂H₅OH(l)",
        intermediates: "2CO₂(g) + 2H₂O(l)",
        intLabel: "Combustion Products",
        path1: { label: "ΔH₁", value: -1411.0, defaultDir: 1, desc: "Combustion of Ethene" }, // Reactants -> Combustion Products
        path2: { label: "ΔH₂", value: -1367.0, defaultDir: -1, desc: "Combustion of Ethanol" } // Products -> Combustion Products
      },
      {
        id: 4,
        title: "Enthalpy of Solution Cycle",
        desc: "Calculate the enthalpy of solution of Sodium Chloride (Lattice vs Hydration).",
        targetLabel: "ΔH_sol",
        targetText: "NaCl(s) ➔ Na⁺(aq) + Cl⁻(aq)",
        reactants: "NaCl(s)",
        products: "Na⁺(aq) + Cl⁻(aq)",
        intermediates: "Na⁺(g) + Cl⁻(g)",
        intLabel: "Gaseous Ions",
        path1: { label: "ΔH_lat", value: -788.0, defaultDir: -1, desc: "Lattice Enthalpy (Formation)" }, // Gaseous Ions -> Solid Lattice
        path2: { label: "ΔH_hyd", value: -784.0, defaultDir: 1, desc: "Hydration Enthalpy of Ions" } // Gaseous Ions -> Aqueous
      },
      {
        id: 5,
        title: "Thermal Decomposition Cycle",
        desc: "Determine the enthalpy change for the thermal decomposition of Calcium Carbonate.",
        targetLabel: "ΔH_r",
        targetText: "CaCO₃(s) ➔ CaO(s) + CO₂(g)",
        reactants: "CaCO₃(s)",
        products: "CaO(s) + CO₂(g)",
        intermediates: "Ca(s) + C(s) + 1½O₂(g)",
        intLabel: "Constituent Elements",
        path1: { label: "ΔH₁", value: -1206.9, defaultDir: -1, desc: "Formation of CaCO₃" }, // Elements -> Reactants
        path2: { label: "ΔH₂", value: -1028.6, defaultDir: 1, desc: "Formation of CaO & CO₂" } // Elements -> Products
      },
      {
        id: 6,
        title: "Contact Process (Oxidation)",
        desc: "Calculate the enthalpy of reaction for the oxidation of Sulfur Dioxide to Sulfur Trioxide.",
        targetLabel: "ΔH_r",
        targetText: "SO₂(g) + ½O₂(g) ➔ SO₃(g)",
        reactants: "SO₂(g) + ½O₂(g)",
        products: "SO₃(g)",
        intermediates: "S(s) + 1½O₂(g)",
        intLabel: "Constituent Elements",
        path1: { label: "ΔH₁", value: -296.8, defaultDir: -1, desc: "Formation of SO₂" }, // Elements -> Reactants
        path2: { label: "ΔH₂", value: -395.7, defaultDir: 1, desc: "Formation of SO₃" } // Elements -> Products
      }
    ];

    // --- SVG HELPER COMPONENTS ---
    // An intelligent Arrow component that visually flips based on `dir` parameter (1 or -1)
    const DirectedArrow = ({ x1, y1, x2, y2, dir, color, label, value, onClick }) => {
      // Determine start and end points based on direction
      const startX = dir === 1 ? x1 : x2;
      const startY = dir === 1 ? y1 : y2;
      const endX = dir === 1 ? x2 : x1;
      const endY = dir === 1 ? y2 : y1;

      // Label positioning (midpoint)
      const midX = (x1 + x2) / 2;
      const midY = (y1 + y2) / 2;

      // Calculate angle for arrowhead rotation
      const angle = Math.atan2(endY - startY, endX - startX) * (180 / Math.PI);

      return (
        <g className="vector-arrow" onClick={onClick} style={{ color }}>
          {/* Invisible fat line for easier clicking */}
          <line x1={x1} y1={y1} x2={x2} y2={y2} className="vector-hitbox" />
          
          {/* Visible Line */}
          <line x1={startX} y1={startY} x2={endX} y2={endY} stroke="currentColor" strokeWidth="4" className="line transition-all duration-300" />
          
          {/* Arrowhead */}
          <polygon 
            points="0,-8 16,0 0,8" 
            fill="currentColor" 
            transform={`translate(${endX}, ${endY}) rotate(${angle})`} 
            className="transition-all duration-300"
          />

          {/* Value Label Box */}
          <rect x={midX - 50} y={midY - 15} width="100" height="30" fill="#0f172a" stroke="currentColor" strokeWidth="2" rx="6" />
          <text x={midX} y={midY + 4} fill="#f8fafc" fontSize="12" fontWeight="bold" textAnchor="middle" pointerEvents="none">
            {label} = {value}
          </text>
        </g>
      );
    };

    function App() {
      const [activeScenarioId, setActiveScenarioId] = useState(1);
      const scenario = SCENARIOS.find(s => s.id === activeScenarioId);

      // Vector directions: 1 (forward path), -1 (reverse path)
      const [dir1, setDir1] = useState(scenario.path1.defaultDir);
      const [dir2, setDir2] = useState(scenario.path2.defaultDir);

      // Reset vectors when scenario changes
      useEffect(() => {
        setDir1(scenario.path1.defaultDir);
        setDir2(scenario.path2.defaultDir);
      }, [scenario]);

      // --- LOGIC ENGINE ---
      // A Hess cycle is "aligned" when vectors create a continuous path: Reactants -> Intermediates -> Products.
      // This means dir1 MUST be 1, and dir2 MUST be 1.
      const isAligned = dir1 === 1 && dir2 === 1;

      // The mathematical equation relies on the user's vector flips.
      // If the user flipped the arrow from its given default direction, we invert the mathematical sign.
      const sign1 = dir1 === scenario.path1.defaultDir ? 1 : -1;
      const sign2 = dir2 === scenario.path2.defaultDir ? 1 : -1;

      const calcValue1 = sign1 * scenario.path1.value;
      const calcValue2 = sign2 * scenario.path2.value;
      const finalDeltaH = calcValue1 + calcValue2;

      // Coordinate Layout for the SVG Cycle (Optimized to prevent text overlap)
      const layout = {
        reactants: { x: 150, y: 100, w: 200, h: 70 },
        products: { x: 550, y: 100, w: 200, h: 70 },
        intermediates: { x: 350, y: 320, w: 240, h: 70 }
      };

      return (
        <div className="min-h-screen bg-slate-900 text-slate-100 flex flex-col font-sans overflow-hidden selection:bg-emerald-500/30">
          
          {/* HEADER */}
          <header className="flex justify-between items-center px-6 py-4 bg-slate-800/80 border-b border-slate-700 shadow-lg shrink-0">
            <div className="flex items-center gap-3">
              <Waypoints className="text-emerald-400" size={28} />
              <div>
                <h1 className="text-2xl font-bold bg-gradient-to-r from-emerald-400 to-cyan-500 bg-clip-text text-transparent">
                  Hess's Law Calculations Interactive
                </h1>
                <p className="text-xs text-slate-400 font-medium font-mono">Vector Pathfinding & Energy Cycle Engine</p>
              </div>
            </div>
            
            <div className="flex gap-2 max-w-xl overflow-x-auto custom-scrollbar pb-1">
               {SCENARIOS.map((s) => (
                 <button 
                   key={s.id} onClick={() => setActiveScenarioId(s.id)}
                   className={`px-4 py-2 rounded-lg text-xs font-bold transition-all whitespace-nowrap shadow-lg ${activeScenarioId === s.id ? 'bg-emerald-600 text-white shadow-emerald-900/50' : 'bg-slate-800 border border-slate-700 text-slate-400 hover:bg-slate-700 hover:text-slate-200'}`}
                 >
                   Example {s.id}
                 </button>
               ))}
            </div>
          </header>

          <main className="flex-1 flex gap-4 p-4 overflow-hidden max-h-[calc(100vh-80px)]">
            
            {/* LEFT PANEL: Theory & Instructions */}
            <div className="w-1/4 bg-slate-800/50 border border-slate-700 rounded-2xl p-5 flex flex-col overflow-y-auto custom-scrollbar shadow-inner shrink-0">
              <h2 className="text-sm uppercase tracking-widest text-slate-400 font-bold mb-4 flex items-center gap-2 border-b border-slate-700 pb-2">
                <Info size={16} /> Thermodynamic Principles
              </h2>
              
              <div className="bg-slate-900/80 rounded-xl p-4 border border-slate-700 mb-6 shadow-sm">
                <strong className="text-emerald-400 text-sm font-bold uppercase tracking-wider block mb-2">Hess's Law</strong>
                <p className="text-xs text-slate-300 leading-relaxed italic">
                  "The total enthalpy change for a chemical reaction is independent of the route by which the chemical reaction takes place, provided the initial and final conditions are the same."
                </p>
              </div>

              <div className="flex flex-col gap-4">
                <div className="p-3 bg-slate-800 rounded-lg border-l-4 border-l-cyan-500 shadow-sm">
                  <strong className="text-slate-200 block mb-1 text-sm"><GitMerge size={14} className="inline mr-1"/> Vector Pathfinding</strong>
                  <p className="text-xs text-slate-400 leading-relaxed">
                    To solve for the unknown <strong>Direct Route</strong> (<span className="text-emerald-400 font-mono">ΔH_r</span>), you must construct an equivalent continuous <strong>Indirect Route</strong> through the intermediate node.
                  </p>
                </div>
                
                <div className="p-3 bg-slate-800 rounded-lg border-l-4 border-l-amber-500 shadow-sm">
                  <strong className="text-slate-200 block mb-1 text-sm"><Activity size={14} className="inline mr-1"/> Reversing Vectors</strong>
                  <p className="text-xs text-slate-400 leading-relaxed">
                    If given data points the wrong way, <strong>click the arrow</strong> to reverse its direction. Reversing a chemical pathway mathematically <strong>inverts its sign</strong> (+ becomes -, and vice versa).
                  </p>
                </div>
              </div>

              <div className="mt-auto bg-emerald-900/20 border border-emerald-500/50 rounded-xl p-4 text-center">
                 <p className="text-xs font-bold text-emerald-400 uppercase tracking-widest mb-1">Your Objective</p>
                 <p className="text-xs text-slate-300 leading-relaxed">Click the blue and purple arrows to create a continuous fluid path from Reactants ➔ Intermediates ➔ Products.</p>
              </div>
            </div>

            {/* CENTER PANEL: Interactive Hess Cycle (SVG Engine) */}
            <div className={`w-2/4 bg-slate-800/80 border-2 rounded-2xl p-6 shadow-xl flex flex-col relative overflow-hidden transition-all duration-500 ${isAligned ? 'solved-glow' : 'border-slate-700'}`}>
              <div className="absolute top-4 left-6 text-slate-500 text-xs uppercase font-bold tracking-widest z-10">Interactive Cycle Canvas</div>
              
              <div className="flex-1 w-full relative flex items-center justify-center mt-8">
                 <svg viewBox="0 0 700 450" className="w-full h-full overflow-visible drop-shadow-2xl">
                    
                    {/* --- TARGET ARROW (Top, Direct Route) --- */}
                    <g>
                      <line 
                        x1={layout.reactants.x + layout.reactants.w/2 + 20} y1={layout.reactants.y} 
                        x2={layout.products.x - layout.products.w/2 - 20} y2={layout.products.y} 
                        stroke={isAligned ? "#10b981" : "#475569"} 
                        strokeWidth="5" 
                        className={isAligned ? "flow-dash transition-colors duration-500" : "transition-colors duration-500"} 
                        strokeDasharray={isAligned ? "10 10" : "none"}
                      />
                      <polygon points="0,-10 20,0 0,10" fill={isAligned ? "#10b981" : "#475569"} transform={`translate(${layout.products.x - layout.products.w/2 - 10}, ${layout.products.y})`} className="transition-colors duration-500" />
                      
                      <rect x={(layout.reactants.x + layout.products.x)/2 - 60} y={layout.reactants.y - 35} width="120" height="30" fill="#0f172a" stroke={isAligned ? "#10b981" : "#475569"} strokeWidth="2" rx="6" className="transition-colors duration-500" />
                      <text x={(layout.reactants.x + layout.products.x)/2} y={layout.reactants.y - 15} fill={isAligned ? "#34d399" : "#94a3b8"} fontSize="14" fontWeight="bold" textAnchor="middle" className="transition-colors duration-500">{scenario.targetLabel} = ?</text>
                    </g>

                    {/* --- INTERACTIVE ARROWS (Indirect Route) --- */}
                    {/* Path 1: Reactants <--> Intermediates */}
                    <DirectedArrow 
                      x1={layout.reactants.x} y1={layout.reactants.y + layout.reactants.h/2 + 10} 
                      x2={layout.intermediates.x - 40} y2={layout.intermediates.y - layout.intermediates.h/2 - 10} 
                      dir={dir1} color="#0ea5e9" label={scenario.path1.label} value={scenario.path1.value}
                      onClick={() => setDir1(dir1 === 1 ? -1 : 1)}
                    />

                    {/* Path 2: Intermediates <--> Products */}
                    <DirectedArrow 
                      x1={layout.intermediates.x + 40} y1={layout.intermediates.y - layout.intermediates.h/2 - 10} 
                      x2={layout.products.x} y2={layout.products.y + layout.products.h/2 + 10} 
                      dir={dir2} color="#c084fc" label={scenario.path2.label} value={scenario.path2.value}
                      onClick={() => setDir2(dir2 === 1 ? -1 : 1)}
                    />

                    {/* --- NODES (Chemical States) --- */}
                    {/* Reactants Node */}
                    <g transform={`translate(${layout.reactants.x - layout.reactants.w/2}, ${layout.reactants.y - layout.reactants.h/2})`}>
                      <rect width={layout.reactants.w} height={layout.reactants.h} fill="#1e293b" stroke="#3b82f6" strokeWidth="2" rx="10" />
                      <text x={layout.reactants.w/2} y="26" fill="#94a3b8" fontSize="12" fontWeight="bold" textAnchor="middle" textTransform="uppercase">Reactants</text>
                      <text x={layout.reactants.w/2} y="48" fill="#f8fafc" fontSize="16" fontWeight="black" textAnchor="middle">{scenario.reactants}</text>
                    </g>

                    {/* Products Node */}
                    <g transform={`translate(${layout.products.x - layout.products.w/2}, ${layout.products.y - layout.products.h/2})`}>
                      <rect width={layout.products.w} height={layout.products.h} fill="#1e293b" stroke="#3b82f6" strokeWidth="2" rx="10" />
                      <text x={layout.products.w/2} y="26" fill="#94a3b8" fontSize="12" fontWeight="bold" textAnchor="middle" textTransform="uppercase">Products</text>
                      <text x={layout.products.w/2} y="48" fill="#f8fafc" fontSize="16" fontWeight="black" textAnchor="middle">{scenario.products}</text>
                    </g>

                    {/* Intermediates Node */}
                    <g transform={`translate(${layout.intermediates.x - layout.intermediates.w/2}, ${layout.intermediates.y - layout.intermediates.h/2})`}>
                      <rect width={layout.intermediates.w} height={layout.intermediates.h} fill="#1e293b" stroke="#64748b" strokeWidth="2" rx="10" />
                      <text x={layout.intermediates.w/2} y="26" fill="#94a3b8" fontSize="12" fontWeight="bold" textAnchor="middle" textTransform="uppercase">{scenario.intLabel}</text>
                      <text x={layout.intermediates.w/2} y="48" fill="#f8fafc" fontSize="16" fontWeight="black" textAnchor="middle">{scenario.intermediates}</text>
                    </g>

                 </svg>
              </div>
            </div>

            {/* RIGHT PANEL: Live Calculation Engine */}
            <div className="w-1/4 bg-slate-800 rounded-2xl border border-slate-700 flex flex-col overflow-hidden shadow-xl shrink-0">
              <div className="p-4 bg-slate-700/50 border-b border-slate-600 flex items-center gap-2 shrink-0">
                <Calculator size={18} className="text-cyan-400" />
                <h2 className="text-xs uppercase tracking-widest text-slate-200 font-bold">Algebraic Engine</h2>
              </div>
              
              <div className="p-5 flex flex-col h-full overflow-y-auto custom-scrollbar gap-5 bg-slate-900/40">
                
                <div className="flex flex-col gap-2">
                  <h3 className="font-bold text-slate-200 text-lg leading-tight">{scenario.title}</h3>
                  <p className="text-xs text-slate-400 leading-relaxed border-l-2 border-slate-600 pl-2">{scenario.desc}</p>
                </div>

                {/* Given Data Block */}
                <div className="bg-slate-900 border border-slate-700 rounded-xl p-4 shadow-inner">
                  <p className="text-[10px] uppercase tracking-widest text-slate-500 font-bold mb-3">Empirical Data Provided</p>
                  <div className="flex justify-between items-center text-xs py-2 border-b border-slate-800">
                    <span className="text-cyan-400 font-bold">{scenario.path1.label} <span className="text-slate-500 font-normal ml-1">({scenario.path1.desc})</span></span>
                    <span className="font-mono font-bold text-sm">{scenario.path1.value > 0 ? '+' : ''}{scenario.path1.value}</span>
                  </div>
                  <div className="flex justify-between items-center text-xs py-2">
                    <span className="text-purple-400 font-bold">{scenario.path2.label} <span className="text-slate-500 font-normal ml-1">({scenario.path2.desc})</span></span>
                    <span className="font-mono font-bold text-sm">{scenario.path2.value > 0 ? '+' : ''}{scenario.path2.value}</span>
                  </div>
                </div>

                {/* Live Algebraic Construction */}
                <div className="flex-1 flex flex-col">
                   <p className="text-[10px] uppercase tracking-widest text-slate-500 font-bold mb-2">Live Equation Builder</p>
                   
                   <div className={`flex-1 rounded-xl p-5 border flex flex-col justify-center transition-all duration-300 ${isAligned ? 'bg-emerald-900/20 border-emerald-500 shadow-[0_0_15px_rgba(16,185,129,0.1)]' : 'bg-slate-900 border-slate-700 shadow-inner'}`}>
                     
                     <div className="font-mono text-sm leading-loose">
                        <div className="text-emerald-400 font-bold mb-3 text-lg border-b border-slate-800 pb-2">{scenario.targetLabel} = </div>
                        
                        {/* Term 1 */}
                        <div className="flex items-center gap-2 pl-2">
                          <span className="text-cyan-400 w-8">{scenario.path1.label}</span>
                          <span className={`font-bold px-2 py-0.5 rounded text-[10px] uppercase tracking-wider ${sign1 === 1 ? 'bg-slate-800 text-slate-400' : 'bg-rose-900/50 text-rose-400'}`}>
                            {sign1 === 1 ? 'Forward' : 'Reversed'}
                          </span>
                          <span className="text-slate-500 ml-auto">➔</span>
                          <span className={`font-bold w-16 text-right ${sign1 === 1 ? 'text-slate-300' : 'text-rose-300'}`}>
                            {calcValue1 > 0 ? '+' : ''}{calcValue1.toFixed(1)}
                          </span>
                        </div>

                        {/* Term 2 */}
                        <div className="flex items-center gap-2 pl-2 mt-2">
                          <span className="text-purple-400 w-8">{scenario.path2.label}</span>
                          <span className={`font-bold px-2 py-0.5 rounded text-[10px] uppercase tracking-wider ${sign2 === 1 ? 'bg-slate-800 text-slate-400' : 'bg-rose-900/50 text-rose-400'}`}>
                            {sign2 === 1 ? 'Forward' : 'Reversed'}
                          </span>
                          <span className="text-slate-500 ml-auto">➔</span>
                          <span className={`font-bold w-16 text-right ${sign2 === 1 ? 'text-slate-300' : 'text-rose-300'}`}>
                            {calcValue2 > 0 ? '+' : ''}{calcValue2.toFixed(1)}
                          </span>
                        </div>

                        <div className="border-t border-slate-700 my-4"></div>

                        {/* Result Output */}
                        {isAligned ? (
                          <div className="flex flex-col items-center justify-center anim-slide-up mt-2 bg-emerald-950/50 p-3 rounded-lg border border-emerald-800">
                             <span className="text-emerald-400 font-bold text-xs uppercase tracking-widest mb-1">Calculated Enthalpy</span>
                             <div className="text-white font-black text-2xl">
                               {finalDeltaH > 0 ? '+' : ''}{finalDeltaH.toFixed(1)} <span className="text-sm text-emerald-500 font-bold">kJ/mol</span>
                             </div>
                          </div>
                        ) : (
                          <div className="flex items-start gap-2 mt-3 text-amber-500/80 bg-amber-900/20 p-3 rounded-lg border border-amber-900/50 text-[11px] font-sans leading-relaxed">
                            <Activity className="shrink-0 mt-0.5" size={16}/>
                            Invalid thermodynamic path. Ensure vectors form a continuous flowing route from Reactants to Products.
                          </div>
                        )}
                     </div>
                   </div>
                </div>

              </div>
            </div>

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
