<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Periodic Table Trends Grapher | Interactive Chemistry Simulator</title>
    <!-- Primary SEO Keyword: Periodic table trends grapher -->
    <meta name="description" content="Explore atomic properties with this periodic table trends grapher. Visualize atomic radius, electronegativity, and ionization energy trends across periods and down groups.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Plotly.js for Scientific Graphing -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>

    <!-- React, ReactDOM, and Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        
        /* Element Hover Animations */
        .pt-element { transition: all 0.2s ease-in-out; }
        .pt-element.highlighted { 
            transform: scale(1.15); 
            z-index: 10; 
            box-shadow: 0 0 15px currentColor;
            border-color: white;
        }

        /* Category Colors */
        .cat-alkali { background-color: rgba(239, 68, 68, 0.2); border-color: rgba(239, 68, 68, 0.5); color: #fca5a5; }
        .cat-alkaline { background-color: rgba(249, 115, 22, 0.2); border-color: rgba(249, 115, 22, 0.5); color: #fdba74; }
        .cat-transition { background-color: rgba(234, 179, 8, 0.2); border-color: rgba(234, 179, 8, 0.5); color: #fde047; }
        .cat-post-transition { background-color: rgba(16, 185, 129, 0.2); border-color: rgba(16, 185, 129, 0.5); color: #6ee7b7; }
        .cat-metalloid { background-color: rgba(20, 184, 166, 0.2); border-color: rgba(20, 184, 166, 0.5); color: #5eead4; }
        .cat-nonmetal { background-color: rgba(56, 189, 248, 0.2); border-color: rgba(56, 189, 248, 0.5); color: #7dd3fc; }
        .cat-halogen { background-color: rgba(99, 102, 241, 0.2); border-color: rgba(99, 102, 241, 0.5); color: #a5b4fc; }
        .cat-noble { background-color: rgba(168, 85, 247, 0.2); border-color: rgba(168, 85, 247, 0.5); color: #d8b4fe; }

        /* Plotly overrides */
        .js-plotly-plot .plotly .modebar { display: none !important; }
    </style>
</head>
<body class="bg-[#0F172A] text-slate-200 h-screen overflow-hidden flex flex-col font-sans select-none">

    <div id="root" class="h-full w-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- ICONS ---
        const ChartLineIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-emerald-400"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>;
        const InfoIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>;

        // --- DATABASE ---
        // Elements Z=1 to Z=36 (Periods 1-4)
        const ELEMENTS = [
            { z: 1, sym: 'H', name: 'Hydrogen', group: 1, period: 1, cat: 'cat-nonmetal', radius: 53, ionization: 1312, en: 2.20, mp: 14 },
            { z: 2, sym: 'He', name: 'Helium', group: 18, period: 1, cat: 'cat-noble', radius: 31, ionization: 2372, en: null, mp: 1 },
            { z: 3, sym: 'Li', name: 'Lithium', group: 1, period: 2, cat: 'cat-alkali', radius: 167, ionization: 520, en: 0.98, mp: 454 },
            { z: 4, sym: 'Be', name: 'Beryllium', group: 2, period: 2, cat: 'cat-alkaline', radius: 112, ionization: 899, en: 1.57, mp: 1560 },
            { z: 5, sym: 'B', name: 'Boron', group: 13, period: 2, cat: 'cat-metalloid', radius: 87, ionization: 801, en: 2.04, mp: 2349 },
            { z: 6, sym: 'C', name: 'Carbon', group: 14, period: 2, cat: 'cat-nonmetal', radius: 67, ionization: 1086, en: 2.55, mp: 3800 },
            { z: 7, sym: 'N', name: 'Nitrogen', group: 15, period: 2, cat: 'cat-nonmetal', radius: 56, ionization: 1402, en: 3.04, mp: 63 },
            { z: 8, sym: 'O', name: 'Oxygen', group: 16, period: 2, cat: 'cat-nonmetal', radius: 48, ionization: 1314, en: 3.44, mp: 54 },
            { z: 9, sym: 'F', name: 'Fluorine', group: 17, period: 2, cat: 'cat-halogen', radius: 42, ionization: 1681, en: 3.98, mp: 53 },
            { z: 10, sym: 'Ne', name: 'Neon', group: 18, period: 2, cat: 'cat-noble', radius: 38, ionization: 2080, en: null, mp: 24 },
            { z: 11, sym: 'Na', name: 'Sodium', group: 1, period: 3, cat: 'cat-alkali', radius: 190, ionization: 496, en: 0.93, mp: 371 },
            { z: 12, sym: 'Mg', name: 'Magnesium', group: 2, period: 3, cat: 'cat-alkaline', radius: 145, ionization: 738, en: 1.31, mp: 923 },
            { z: 13, sym: 'Al', name: 'Aluminum', group: 13, period: 3, cat: 'cat-post-transition', radius: 118, ionization: 578, en: 1.61, mp: 933 },
            { z: 14, sym: 'Si', name: 'Silicon', group: 14, period: 3, cat: 'cat-metalloid', radius: 111, ionization: 786, en: 1.90, mp: 1687 },
            { z: 15, sym: 'P', name: 'Phosphorus', group: 15, period: 3, cat: 'cat-nonmetal', radius: 98, ionization: 1012, en: 2.19, mp: 317 },
            { z: 16, sym: 'S', name: 'Sulfur', group: 16, period: 3, cat: 'cat-nonmetal', radius: 88, ionization: 1000, en: 2.58, mp: 388 },
            { z: 17, sym: 'Cl', name: 'Chlorine', group: 17, period: 3, cat: 'cat-halogen', radius: 79, ionization: 1251, en: 3.16, mp: 172 },
            { z: 18, sym: 'Ar', name: 'Argon', group: 18, period: 3, cat: 'cat-noble', radius: 71, ionization: 1521, en: null, mp: 84 },
            { z: 19, sym: 'K', name: 'Potassium', group: 1, period: 4, cat: 'cat-alkali', radius: 243, ionization: 419, en: 0.82, mp: 337 },
            { z: 20, sym: 'Ca', name: 'Calcium', group: 2, period: 4, cat: 'cat-alkaline', radius: 194, ionization: 590, en: 1.00, mp: 1115 },
            { z: 21, sym: 'Sc', name: 'Scandium', group: 3, period: 4, cat: 'cat-transition', radius: 184, ionization: 633, en: 1.36, mp: 1814 },
            { z: 22, sym: 'Ti', name: 'Titanium', group: 4, period: 4, cat: 'cat-transition', radius: 176, ionization: 659, en: 1.54, mp: 1941 },
            { z: 23, sym: 'V', name: 'Vanadium', group: 5, period: 4, cat: 'cat-transition', radius: 171, ionization: 651, en: 1.63, mp: 2183 },
            { z: 24, sym: 'Cr', name: 'Chromium', group: 6, period: 4, cat: 'cat-transition', radius: 166, ionization: 653, en: 1.66, mp: 2180 },
            { z: 25, sym: 'Mn', name: 'Manganese', group: 7, period: 4, cat: 'cat-transition', radius: 166, ionization: 717, en: 1.55, mp: 1519 },
            { z: 26, sym: 'Fe', name: 'Iron', group: 8, period: 4, cat: 'cat-transition', radius: 156, ionization: 762, en: 1.83, mp: 1811 },
            { z: 27, sym: 'Co', name: 'Cobalt', group: 9, period: 4, cat: 'cat-transition', radius: 152, ionization: 760, en: 1.88, mp: 1768 },
            { z: 28, sym: 'Ni', name: 'Nickel', group: 10, period: 4, cat: 'cat-transition', radius: 149, ionization: 737, en: 1.91, mp: 1728 },
            { z: 29, sym: 'Cu', name: 'Copper', group: 11, period: 4, cat: 'cat-transition', radius: 145, ionization: 745, en: 1.90, mp: 1358 },
            { z: 30, sym: 'Zn', name: 'Zinc', group: 12, period: 4, cat: 'cat-transition', radius: 142, ionization: 906, en: 1.65, mp: 693 },
            { z: 31, sym: 'Ga', name: 'Gallium', group: 13, period: 4, cat: 'cat-post-transition', radius: 136, ionization: 579, en: 1.81, mp: 303 },
            { z: 32, sym: 'Ge', name: 'Germanium', group: 14, period: 4, cat: 'cat-metalloid', radius: 125, ionization: 762, en: 2.01, mp: 1211 },
            { z: 33, sym: 'As', name: 'Arsenic', group: 15, period: 4, cat: 'cat-metalloid', radius: 114, ionization: 947, en: 2.18, mp: 1090 },
            { z: 34, sym: 'Se', name: 'Selenium', group: 16, period: 4, cat: 'cat-nonmetal', radius: 103, ionization: 941, en: 2.55, mp: 494 },
            { z: 35, sym: 'Br', name: 'Bromine', group: 17, period: 4, cat: 'cat-halogen', radius: 94, ionization: 1140, en: 2.96, mp: 266 },
            { z: 36, sym: 'Kr', name: 'Krypton', group: 18, period: 4, cat: 'cat-noble', radius: 88, ionization: 1351, en: 3.00, mp: 116 }
        ];

        const PROPERTIES = {
            ionization: { 
                key: 'ionization', 
                title: '1st Ionization Energy', 
                unit: 'kJ/mol', 
                color: '#3b82f6', // blue-500
                desc: "The energy required to remove the outermost electron from a neutral atom in its gaseous state. Notice the spikes at Noble Gases (stable octets) and drops at Alkali Metals."
            },
            radius: { 
                key: 'radius', 
                title: 'Atomic Radius', 
                unit: 'pm', 
                color: '#10b981', // emerald-500
                desc: "The total distance from an atom's nucleus to the outermost orbital of electron. Notice how radius strictly decreases across a period (increasing effective nuclear charge) and jumps down a group."
            },
            en: { 
                key: 'en', 
                title: 'Electronegativity (Pauling Scale)', 
                unit: '', 
                color: '#a855f7', // purple-500
                desc: "An atom's ability to attract shared electrons in a covalent bond. Fluorine is the most electronegative element. Noble gases are typically excluded from the Pauling scale."
            },
            mp: { 
                key: 'mp', 
                title: 'Melting Point', 
                unit: 'K', 
                color: '#f97316', // orange-500
                desc: "The temperature at which a solid becomes a liquid. Peaks often correspond to giant covalent networks (like Carbon/Diamond) or strong metallic lattices."
            }
        };

        const FILTERS = [
            { id: 'all', label: 'All Elements (Z=1 to 36)', fn: () => true },
            { id: 'g1', label: 'Group 1 (Alkali Metals)', fn: e => e.group === 1 },
            { id: 'g2', label: 'Group 2 (Alkaline Earth)', fn: e => e.group === 2 },
            { id: 'g17', label: 'Group 17 (Halogens)', fn: e => e.group === 17 },
            { id: 'g18', label: 'Group 18 (Noble Gases)', fn: e => e.group === 18 },
            { id: 'p2', label: 'Period 2', fn: e => e.period === 2 },
            { id: 'p3', label: 'Period 3', fn: e => e.period === 3 },
            { id: 'p4', label: 'Period 4', fn: e => e.period === 4 }
        ];

        function App() {
            // --- STATE ---
            const [selectedPropKey, setSelectedPropKey] = useState('ionization');
            const [selectedFilterId, setSelectedFilterId] = useState('all');
            const [hoveredZ, setHoveredZ] = useState(null);
            
            const plotRef = useRef(null);

            const activeProp = PROPERTIES[selectedPropKey];
            const currentFilter = FILTERS.find(f => f.id === selectedFilterId);

            // --- PLOTLY GRAPH RENDERING ---
            useEffect(() => {
                if (!plotRef.current) return;

                const plotDiv = plotRef.current;

                // Filter out null values for proper connection mapping and apply current user filter
                const xData = [];
                const yData = [];
                const textData = [];
                const colorData = [];
                
                ELEMENTS.forEach(el => {
                    if (el[selectedPropKey] !== null && currentFilter.fn(el)) {
                        xData.push(el.z);
                        yData.push(el[selectedPropKey]);
                        textData.push(el.sym);
                        // Highlight hovered point
                        colorData.push(hoveredZ === el.z ? '#facc15' : activeProp.color);
                    }
                });

                const trace = {
                    x: xData,
                    y: yData,
                    text: textData,
                    mode: 'lines+markers+text',
                    textposition: 'top center',
                    textfont: {
                        family: 'monospace',
                        size: 11,
                        color: '#94a3b8'
                    },
                    marker: {
                        size: 10,
                        color: colorData,
                        line: { color: '#0F172A', width: 2 }
                    },
                    line: {
                        color: activeProp.color,
                        width: 3,
                        shape: 'linear'
                    },
                    hovertemplate: `<b>%{text}</b> (Z=%{x})<br>${activeProp.title}: %{y} ${activeProp.unit}<extra></extra>`
                };

                // Annotations for visual grouping (Only show period shading if 'all' is selected)
                const shapes = selectedFilterId === 'all' ? [
                    // Period 2 Bg
                    { type: 'rect', xref: 'x', yref: 'paper', x0: 2.5, x1: 10.5, y0: 0, y1: 1, fillcolor: 'rgba(255,255,255,0.02)', line: {width: 0}, layer: 'below' },
                    // Period 3 Bg
                    { type: 'rect', xref: 'x', yref: 'paper', x0: 10.5, x1: 18.5, y0: 0, y1: 1, fillcolor: 'rgba(255,255,255,0.05)', line: {width: 0}, layer: 'below' },
                    // Period 4 Bg
                    { type: 'rect', xref: 'x', yref: 'paper', x0: 18.5, x1: 36.5, y0: 0, y1: 1, fillcolor: 'rgba(255,255,255,0.02)', line: {width: 0}, layer: 'below' }
                ] : [];

                const annotations = selectedFilterId === 'all' ? [
                    { xref: 'x', yref: 'paper', x: 6.5, y: 0.05, text: 'Period 2', showarrow: false, font: {color: '#64748b', size: 10} },
                    { xref: 'x', yref: 'paper', x: 14.5, y: 0.05, text: 'Period 3', showarrow: false, font: {color: '#64748b', size: 10} },
                    { xref: 'x', yref: 'paper', x: 27.5, y: 0.05, text: 'Period 4 (incl. Transition Metals)', showarrow: false, font: {color: '#64748b', size: 10} }
                ] : [];

                const layout = {
                    paper_bgcolor: 'transparent',
                    plot_bgcolor: 'transparent',
                    margin: { t: 20, r: 20, b: 50, l: 60 },
                    xaxis: {
                        title: { text: 'Atomic Number (Z)', font: { color: '#94a3b8' } },
                        tickfont: { color: '#64748b' },
                        gridcolor: '#1e293b',
                        zeroline: false
                    },
                    yaxis: {
                        title: { text: `${activeProp.title} ${activeProp.unit ? `(${activeProp.unit})` : ''}`, font: { color: '#94a3b8' } },
                        tickfont: { color: '#64748b' },
                        gridcolor: '#1e293b',
                        zerolinecolor: '#1e293b'
                    },
                    shapes: shapes,
                    annotations: annotations,
                    hovermode: 'closest',
                    transition: { duration: 400, easing: 'cubic-in-out' }
                };

                Plotly.react(plotDiv, [trace], layout, { responsive: true });

                // Event Listeners for Hover Syncing
                plotDiv.on('plotly_hover', (data) => {
                    if (data.points && data.points.length > 0) {
                        setHoveredZ(data.points[0].x);
                    }
                });

                plotDiv.on('plotly_unhover', () => {
                    setHoveredZ(null);
                });

            }, [selectedPropKey, hoveredZ, selectedFilterId]);

            // --- RENDER HELPERS ---
            // Build Periodic Table Grid
            const renderPeriodicTable = () => {
                const cells = [];
                for (let period = 1; period <= 4; period++) {
                    for (let group = 1; group <= 18; group++) {
                        const el = ELEMENTS.find(e => e.period === period && e.group === group);
                        
                        if (el) {
                            const isHighlighted = hoveredZ === el.z;
                            const isFilteredOut = !currentFilter.fn(el);
                            
                            cells.push(
                                <div 
                                    key={el.z}
                                    onMouseEnter={() => setHoveredZ(el.z)}
                                    onMouseLeave={() => setHoveredZ(null)}
                                    className={`pt-element relative flex flex-col items-center justify-center border rounded p-1 cursor-default
                                        ${el.cat} ${isHighlighted ? 'highlighted' : ''} ${isFilteredOut ? 'opacity-20 grayscale' : 'opacity-100'}`}
                                    style={{ gridColumn: group, gridRow: period }}
                                    title={`${el.name} (Z=${el.z})\n${activeProp.title}: ${el[selectedPropKey] || 'N/A'}`}
                                >
                                    <span className="absolute top-0.5 left-1 text-[8px] opacity-70 font-mono">{el.z}</span>
                                    <span className="font-bold text-sm leading-tight">{el.sym}</span>
                                    <span className="text-[8px] opacity-80 leading-none truncate w-full text-center">
                                        {el[selectedPropKey] !== null ? el[selectedPropKey] : '-'}
                                    </span>
                                </div>
                            );
                        }
                    }
                }
                return cells;
            };

            return (
                <div className="flex flex-col h-full w-full">
                    {/* Header */}
                    <header className="bg-[#1E293B] border-b border-slate-800 p-4 shrink-0 flex justify-between items-center z-20 shadow-lg">
                        <div>
                            <h1 className="text-xl md:text-2xl font-bold text-white flex items-center gap-2 tracking-tight">
                                <ChartLineIcon /> Periodic Table Trends Grapher
                            </h1>
                            <p className="text-xs md:text-sm text-slate-400 mt-1 hidden sm:block">
                                Visualize data variations across periods and down groups.
                            </p>
                        </div>
                        <div className="hidden md:flex bg-slate-900 border border-slate-700 px-4 py-1.5 rounded-lg font-mono text-xs text-slate-400 flex-col shadow-inner items-center">
                            <span className="text-[10px] text-slate-500 uppercase tracking-widest font-sans">Elements Plotted</span>
                            <span className="text-emerald-400 font-bold text-sm">Hydrogen to Krypton</span>
                        </div>
                    </header>

                    {/* Main Workspace */}
                    <main className="flex-1 flex flex-col p-4 md:p-6 overflow-hidden max-w-7xl w-full mx-auto gap-4">
                        
                        {/* TOP SECTION: Controls & Periodic Table */}
                        <div className="flex flex-col lg:flex-row gap-4 h-[40%] shrink-0">
                            
                            {/* Controls Panel */}
                            <div className="bg-[#1E293B] rounded-xl border border-slate-700 p-5 shadow-lg w-full lg:w-80 flex flex-col gap-4 overflow-y-auto">
                                <div>
                                    <h2 className="text-sm uppercase font-bold text-slate-300 tracking-wider border-b border-slate-700 pb-2">1. Select Property</h2>
                                    <select 
                                        value={selectedPropKey}
                                        onChange={(e) => setSelectedPropKey(e.target.value)}
                                        className="w-full bg-slate-900 border border-slate-600 rounded p-2.5 text-slate-200 outline-none focus:border-emerald-500 font-bold transition-colors cursor-pointer mt-2"
                                    >
                                        {Object.values(PROPERTIES).map(p => (
                                            <option key={p.key} value={p.key}>{p.title}</option>
                                        ))}
                                    </select>
                                </div>

                                <div>
                                    <h2 className="text-sm uppercase font-bold text-slate-300 tracking-wider border-b border-slate-700 pb-2">2. Filter Data</h2>
                                    <select 
                                        value={selectedFilterId}
                                        onChange={(e) => setSelectedFilterId(e.target.value)}
                                        className="w-full bg-slate-900 border border-slate-600 rounded p-2.5 text-slate-200 outline-none focus:border-emerald-500 font-bold transition-colors cursor-pointer mt-2"
                                    >
                                        {FILTERS.map(f => (
                                            <option key={f.id} value={f.id}>{f.label}</option>
                                        ))}
                                    </select>
                                </div>

                                <div className="bg-slate-900/50 rounded-lg border border-slate-700 p-3 mt-auto flex gap-2">
                                    <InfoIcon />
                                    <p className="text-[10px] text-slate-400 leading-relaxed">
                                        {activeProp.desc}
                                    </p>
                                </div>

                                <div className="text-[10px] text-slate-500 italic mt-1">
                                    Hover over the graph points or the table elements to sync highlights.
                                </div>
                            </div>

                            {/* Periodic Table View */}
                            <div className="bg-[#1E293B] rounded-xl border border-slate-700 p-4 shadow-lg flex-1 overflow-x-auto flex flex-col">
                                <h2 className="text-xs uppercase font-bold text-slate-400 tracking-widest mb-3 shrink-0">3. Interactive Periodic Table (Periods 1-4)</h2>
                                
                                <div className="flex-1 min-w-[800px] flex items-center justify-center pb-2">
                                    <div className="grid grid-cols-18 gap-1 w-full h-full max-h-[220px]">
                                        {/* CSS Grid dynamically populated */}
                                        {renderPeriodicTable()}
                                    </div>
                                </div>
                            </div>

                        </div>

                        {/* BOTTOM SECTION: Graph */}
                        <div className="bg-[#1E293B] rounded-xl border border-slate-700 shadow-lg flex-1 relative flex flex-col overflow-hidden">
                            <h2 className="text-xs uppercase font-bold text-slate-400 tracking-widest absolute top-4 left-6 z-10 flex items-center gap-2">
                                4. Data Visualization Engine
                            </h2>
                            
                            <div ref={plotRef} className="w-full h-full pt-8 pb-2 px-2"></div>
                        </div>

                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
