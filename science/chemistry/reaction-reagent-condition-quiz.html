<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organic Chemistry Reagents Quiz | Reagent Master</title>
    <meta name="description" content="Organic chemistry reagents quiz. Test your knowledge of organic transformations, reagents, and physical conditions with this interactive flashcard simulator.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { 
            margin: 0; 
            background-color: #0F172A; 
            color: #E2E8F0;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden; 
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        /* Shake animation for incorrect answers */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }
        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }

        /* Smooth reveal for explanations */
        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-reveal {
            animation: slideUpFade 0.4s ease-out forwards;
        }
    </style>
</head>
<body>

    <div id="root" class="w-full h-screen max-h-[1000px] flex justify-center items-center p-4"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        // --- ORGANIC CHEMISTRY DATABASE ---
        // Uses Unicode subscripts for clean formatting without innerHTML issues
        const REAGENTS_POOL = [
            'Acidified KMnO₄', 'Acidified K₂Cr₂O₇', 'LiAlH₄', 'NaBH₄', 
            'Br₂ in CCl₄', 'Cl₂(g)', 'H₂(g)', 'NaOH(aq)', 'NaOH(ethanol)', 'Concentrated H₂SO₄'
        ];

        const CONDITIONS_POOL = [
            'Heat under reflux', 'Distill with heat', 'Room temp, dark', 
            'UV light', 'Ni catalyst, 150°C', 'Warm', 'Heat to 170°C'
        ];

        const REACTIONS = [
            {
                id: 1,
                type: 'Oxidation (Complete)',
                reactant: 'CH₃CH₂OH (Ethanol)',
                product: 'CH₃COOH (Ethanoic Acid)',
                correctReagent: 'Acidified KMnO₄',
                correctCondition: 'Heat under reflux',
                explanation: 'Primary alcohols are fully oxidized to carboxylic acids using a strong oxidizing agent like acidified KMnO₄ under reflux (to prevent the intermediate aldehyde from escaping).'
            },
            {
                id: 2,
                type: 'Oxidation (Partial)',
                reactant: 'CH₃CH₂OH (Ethanol)',
                product: 'CH₃CHO (Ethanal)',
                correctReagent: 'Acidified K₂Cr₂O₇',
                correctCondition: 'Distill with heat',
                explanation: 'To stop oxidation at the aldehyde stage, a milder oxidizing agent is used, and the aldehyde is distilled off immediately as it forms (since it has a lower boiling point than the alcohol).'
            },
            {
                id: 3,
                type: 'Reduction',
                reactant: 'CH₃COOH (Ethanoic Acid)',
                product: 'CH₃CH₂OH (Ethanol)',
                correctReagent: 'LiAlH₄',
                correctCondition: 'Room temp, dry ether',
                explanation: 'Carboxylic acids are extremely resistant to reduction. They require a powerful reducing agent like Lithium Aluminium Hydride (LiAlH₄) in a dry ether solvent (it reacts violently with water).'
            },
            {
                id: 4,
                type: 'Electrophilic Addition',
                reactant: 'CH₂=CH₂ (Ethene)',
                product: 'CH₂BrCH₂Br (1,2-dibromoethane)',
                correctReagent: 'Br₂ in CCl₄',
                correctCondition: 'Room temp, dark',
                explanation: 'Alkenes undergo electrophilic addition with halogens at room temperature. The reaction occurs in the dark, distinguishing it from free-radical substitution. The reddish-brown bromine water turns colorless.'
            },
            {
                id: 5,
                type: 'Free-Radical Substitution',
                reactant: 'CH₄ (Methane)',
                product: 'CH₃Cl (Chloromethane)',
                correctReagent: 'Cl₂(g)',
                correctCondition: 'UV light',
                explanation: 'Alkanes are generally unreactive. They only react with halogens via a free-radical mechanism, which requires high-energy UV light to undergo homolytic fission and initiate the radical chain reaction.'
            },
            {
                id: 6,
                type: 'Nucleophilic Substitution',
                reactant: 'CH₃CH₂Br (Bromoethane)',
                product: 'CH₃CH₂OH (Ethanol)',
                correctReagent: 'NaOH(aq)',
                correctCondition: 'Heat under reflux',
                explanation: 'Haloalkanes undergo nucleophilic substitution to form alcohols. The nucleophile is the OH⁻ ion from aqueous sodium hydroxide. Heat under reflux accelerates this substitution.'
            },
            {
                id: 7,
                type: 'Elimination',
                reactant: 'CH₃CH₂Br (Bromoethane)',
                product: 'CH₂=CH₂ (Ethene)',
                correctReagent: 'NaOH(ethanol)',
                correctCondition: 'Heat under reflux',
                explanation: 'When dissolved in ethanol instead of water, the OH⁻ ion acts as a strong base rather than a nucleophile, causing an elimination reaction that removes HBr to form an alkene.'
            },
            {
                id: 8,
                type: 'Dehydration (Elimination)',
                reactant: 'CH₃CH₂OH (Ethanol)',
                product: 'CH₂=CH₂ (Ethene)',
                correctReagent: 'Concentrated H₂SO₄',
                correctCondition: 'Heat to 170°C',
                explanation: 'Alcohols can be dehydrated to form alkenes using a strong, concentrated acid catalyst like H₂SO₄ or H₃PO₄ at very high temperatures.'
            }
        ];

        // Utility: Shuffle array
        const shuffle = (array) => [...array].sort(() => Math.random() - 0.5);

        function App() {
            // --- STATE ---
            const [currentReaction, setCurrentReaction] = useState(null);
            const [options, setOptions] = useState({ reagents: [], conditions: [] });
            
            const [selectedReagent, setSelectedReagent] = useState(null);
            const [selectedCondition, setSelectedCondition] = useState(null);
            
            const [hasAnswered, setHasAnswered] = useState(false);
            const [isCorrect, setIsCorrect] = useState(null);
            
            const [score, setScore] = useState(0);
            const [streak, setStreak] = useState(0);
            const [questionsAnswered, setQuestionsAnswered] = useState(0);

            // --- QUIZ LOGIC ---
            const generateQuestion = () => {
                // Pick a random reaction (avoiding immediate repeats if possible)
                let nextReaction = REACTIONS[Math.floor(Math.random() * REACTIONS.length)];
                if (currentReaction && nextReaction.id === currentReaction.id) {
                    nextReaction = REACTIONS[(REACTIONS.indexOf(nextReaction) + 1) % REACTIONS.length];
                }

                // Generate multiple choice options (1 correct + 3 random distractors)
                const distractorReagents = shuffle(REAGENTS_POOL.filter(r => r !== nextReaction.correctReagent)).slice(0, 3);
                const distractorConditions = shuffle(CONDITIONS_POOL.filter(c => c !== nextReaction.correctCondition && c !== 'Room temp, dry ether')).slice(0, 3);
                
                // Special case for dry ether to ensure it appears if needed
                if (nextReaction.correctCondition === 'Room temp, dry ether') {
                    // Do nothing, it's correct
                }

                setOptions({
                    reagents: shuffle([nextReaction.correctReagent, ...distractorReagents]),
                    conditions: shuffle([nextReaction.correctCondition, ...distractorConditions])
                });

                setCurrentReaction(nextReaction);
                setSelectedReagent(null);
                setSelectedCondition(null);
                setHasAnswered(false);
                setIsCorrect(null);
            };

            // Initial load
            useEffect(() => {
                generateQuestion();
            }, []);

            const handleSubmit = () => {
                if (!selectedReagent || !selectedCondition) return;

                const correct = 
                    selectedReagent === currentReaction.correctReagent && 
                    selectedCondition === currentReaction.correctCondition;

                setIsCorrect(correct);
                setHasAnswered(true);
                setQuestionsAnswered(prev => prev + 1);

                if (correct) {
                    setScore(prev => prev + 1);
                    setStreak(prev => prev + 1);
                } else {
                    setStreak(0);
                }
            };

            // --- RENDER HELPERS ---
            if (!currentReaction) return null;

            return (
                <div className="w-full max-w-5xl h-full flex flex-col bg-slate-900 border border-slate-700 rounded-3xl shadow-2xl overflow-hidden">
                    
                    {/* Header */}
                    <header className="bg-slate-800/50 p-5 border-b border-slate-700 flex justify-between items-center shrink-0">
                        <div>
                            <h1 className="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-orange-500">
                                Reagent Master Quiz
                            </h1>
                            <p className="text-slate-400 text-xs mt-1 uppercase tracking-wider">
                                Organic Chemistry Reagents Quiz
                            </p>
                        </div>
                        
                        {/* Score Board */}
                        <div className="flex gap-4">
                            <div className="bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 flex flex-col items-center shadow-inner">
                                <span className="text-[10px] text-slate-500 uppercase font-bold">Score</span>
                                <span className="text-xl font-mono text-cyan-400 font-bold">{score}/{questionsAnswered}</span>
                            </div>
                            <div className="bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 flex flex-col items-center shadow-inner">
                                <span className="text-[10px] text-slate-500 uppercase font-bold">Streak</span>
                                <span className="text-xl font-mono text-amber-400 font-bold flex items-center gap-1">
                                    {streak > 2 && <span className="text-amber-500 text-sm">🔥</span>}
                                    {streak}
                                </span>
                            </div>
                        </div>
                    </header>

                    {/* Main Workspace */}
                    <div className="flex-grow flex flex-col overflow-y-auto hide-scrollbar p-6 gap-6 relative">
                        
                        {/* The Flashcard (Reaction Scheme) */}
                        <div className={`w-full bg-slate-800 border-2 rounded-2xl p-8 shadow-xl transition-all duration-300 relative overflow-hidden
                            ${hasAnswered ? (isCorrect ? 'border-emerald-500/50 bg-emerald-950/20' : 'border-rose-500/50 bg-rose-950/20 animate-shake') : 'border-slate-700'}`}>
                            
                            {/* Reaction Type Badge */}
                            <div className="absolute top-0 left-0 bg-slate-700/50 text-slate-300 text-[10px] uppercase font-bold px-3 py-1 rounded-br-lg">
                                {currentReaction.type} Transformation
                            </div>

                            <div className="flex flex-col md:flex-row items-center justify-center gap-8 mt-4">
                                
                                {/* Reactant Box */}
                                <div className="flex flex-col items-center w-full md:w-1/3">
                                    <div className="text-[10px] text-cyan-500 uppercase font-bold tracking-widest mb-2">Reactant</div>
                                    <div className="bg-slate-900 border border-cyan-500/30 p-4 rounded-xl w-full text-center shadow-[inset_0_0_15px_rgba(6,182,212,0.1)]">
                                        <span className="text-lg font-mono text-slate-200">{currentReaction.reactant.split(' ')[0]}</span>
                                        <div className="text-xs text-slate-400 mt-1">{currentReaction.reactant.split(' ')[1].replace(/[()]/g, '')}</div>
                                    </div>
                                </div>

                                {/* Arrow & Reagents Area */}
                                <div className="flex flex-col items-center justify-center w-full md:w-1/3 relative py-4">
                                    
                                    {/* Selected Reagent Display */}
                                    <div className={`text-sm font-bold text-center mb-2 min-h-[20px] transition-colors
                                        ${hasAnswered ? (isCorrect ? 'text-emerald-400' : 'text-rose-400') : 'text-amber-400'}`}>
                                        {selectedReagent ? selectedReagent : '?'}
                                    </div>
                                    
                                    {/* The Arrow */}
                                    <div className="w-full flex items-center justify-center text-slate-500 relative">
                                        <div className={`w-full h-1 rounded-full transition-colors ${hasAnswered ? (isCorrect ? 'bg-emerald-500' : 'bg-rose-500') : 'bg-slate-600'}`}></div>
                                        <div className={`absolute right-0 w-3 h-3 rotate-45 border-t-[3px] border-r-[3px] rounded-sm transition-colors transform translate-x-1 ${hasAnswered ? (isCorrect ? 'border-emerald-500' : 'border-rose-500') : 'border-slate-600'}`}></div>
                                    </div>

                                    {/* Selected Condition Display */}
                                    <div className={`text-xs font-mono text-center mt-2 min-h-[16px] transition-colors
                                        ${hasAnswered ? (isCorrect ? 'text-emerald-400/80' : 'text-rose-400/80') : 'text-slate-400'}`}>
                                        {selectedCondition ? selectedCondition : 'Physical Condition?'}
                                    </div>

                                </div>

                                {/* Product Box */}
                                <div className="flex flex-col items-center w-full md:w-1/3">
                                    <div className="text-[10px] text-emerald-500 uppercase font-bold tracking-widest mb-2">Product</div>
                                    <div className="bg-slate-900 border border-emerald-500/30 p-4 rounded-xl w-full text-center shadow-[inset_0_0_15px_rgba(16,185,129,0.1)]">
                                        <span className="text-lg font-mono text-slate-200">{currentReaction.product.split(' ')[0]}</span>
                                        <div className="text-xs text-slate-400 mt-1">{currentReaction.product.split(' ')[1].replace(/[()]/g, '')}</div>
                                    </div>
                                </div>

                            </div>
                        </div>

                        {/* Interactive Selections & Feedback */}
                        {!hasAnswered ? (
                            <div className="flex flex-col md:flex-row gap-6 flex-grow animate-reveal">
                                
                                {/* Reagent Selection */}
                                <div className="w-full md:w-1/2 flex flex-col gap-3">
                                    <h3 className="text-xs font-bold text-amber-500 uppercase tracking-widest border-b border-slate-700 pb-2">1. Select Reagent</h3>
                                    <div className="grid grid-cols-1 gap-2">
                                        {options.reagents.map((r, i) => (
                                            <button 
                                                key={i}
                                                onClick={() => setSelectedReagent(r)}
                                                className={`p-3 text-sm font-semibold rounded-xl border text-left transition-all
                                                    ${selectedReagent === r 
                                                        ? 'bg-amber-500/20 border-amber-500 text-amber-300 shadow-[0_0_10px_rgba(245,158,11,0.2)]' 
                                                        : 'bg-slate-950 border-slate-800 text-slate-300 hover:bg-slate-800 hover:border-slate-600'}`}
                                            >
                                                {r}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* Condition Selection */}
                                <div className="w-full md:w-1/2 flex flex-col gap-3">
                                    <h3 className="text-xs font-bold text-slate-400 uppercase tracking-widest border-b border-slate-700 pb-2">2. Select Physical Condition</h3>
                                    <div className="grid grid-cols-1 gap-2">
                                        {options.conditions.map((c, i) => (
                                            <button 
                                                key={i}
                                                onClick={() => setSelectedCondition(c)}
                                                className={`p-3 text-sm font-mono rounded-xl border text-left transition-all
                                                    ${selectedCondition === c 
                                                        ? 'bg-slate-700 border-slate-400 text-white shadow-md' 
                                                        : 'bg-slate-950 border-slate-800 text-slate-400 hover:bg-slate-800 hover:border-slate-600'}`}
                                            >
                                                {c}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                            </div>
                        ) : (
                            /* Feedback Panel */
                            <div className={`w-full flex-grow rounded-2xl p-6 flex flex-col justify-center animate-reveal border
                                ${isCorrect ? 'bg-emerald-900/10 border-emerald-500/30' : 'bg-rose-900/10 border-rose-500/30'}`}>
                                
                                <div className="flex items-start gap-4">
                                    <div className={`p-3 rounded-full ${isCorrect ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'}`}>
                                        {isCorrect ? (
                                            <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7"></path></svg>
                                        ) : (
                                            <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M6 18L18 6M6 6l12 12"></path></svg>
                                        )}
                                    </div>
                                    <div>
                                        <h2 className={`text-2xl font-bold ${isCorrect ? 'text-emerald-400' : 'text-rose-400'}`}>
                                            {isCorrect ? 'Correct Transformation!' : 'Incorrect Combination'}
                                        </h2>
                                        
                                        {!isCorrect && (
                                            <div className="mt-3 bg-slate-950/50 p-3 rounded-lg border border-slate-800 text-sm">
                                                <span className="text-slate-500 block text-[10px] uppercase tracking-widest font-bold mb-1">Correct Answer</span>
                                                <span className="text-amber-400 font-semibold">{currentReaction.correctReagent}</span> under <span className="font-mono text-slate-300">{currentReaction.correctCondition}</span>
                                            </div>
                                        )}

                                        <p className="mt-4 text-slate-300 leading-relaxed text-sm md:text-base">
                                            {currentReaction.explanation}
                                        </p>
                                    </div>
                                </div>

                            </div>
                        )}

                        {/* Action Bar (Sticky Bottom) */}
                        <div className="mt-auto pt-4 border-t border-slate-800 flex justify-end">
                            {!hasAnswered ? (
                                <button 
                                    onClick={handleSubmit}
                                    disabled={!selectedReagent || !selectedCondition}
                                    className="bg-gradient-to-r from-cyan-600 to-blue-500 hover:from-cyan-500 hover:to-blue-400 disabled:opacity-50 disabled:grayscale text-white font-bold py-3 px-8 rounded-xl shadow-[0_0_15px_rgba(6,182,212,0.4)] transition-all transform hover:scale-[1.02] active:scale-[0.98]"
                                >
                                    EVALUATE TRANSFORMATION
                                </button>
                            ) : (
                                <button 
                                    onClick={generateQuestion}
                                    className="bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 px-8 rounded-xl border border-slate-500 shadow-lg transition-all transform hover:scale-[1.02] active:scale-[0.98]"
                                >
                                    NEXT REACTION →
                                </button>
                            )}
                        </div>

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
