<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Calorimetry Lab Simulator</title>
    <meta name="description" content="Calorimetry experiment simulator. Compute heat transfer (q=mcΔT) using a thermodynamic physics model. Interactive experiments for Combustion, Neutralisation, and Dissolution.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { 
            margin: 0; 
            background-color: #0F172A; 
            color: #E2E8F0;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden; 
        }
        
        /* Custom range sliders */
        input[type="range"] {
            -webkit-appearance: none;
            background: transparent;
            width: 100%;
        }
        input[type="range"]::-webkit-slider-runnable-track {
            height: 6px;
            border-radius: 3px;
            background: #334155;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: currentColor;
            margin-top: -5px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* Animations */
        @keyframes flicker {
            0%, 100% { transform: scaleY(1) scaleX(1); opacity: 0.9; }
            25% { transform: scaleY(1.1) scaleX(0.95); opacity: 1; }
            50% { transform: scaleY(0.95) scaleX(1.05); opacity: 0.8; }
            75% { transform: scaleY(1.05) scaleX(0.98); opacity: 0.95; }
        }
        .animate-flame {
            transform-origin: bottom center;
            animation: flicker 0.15s infinite alternate;
        }
        
        @keyframes stir {
            0% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
            100% { transform: rotate(-5deg); }
        }
        .animate-stir {
            transform-origin: top center;
            animation: stir 0.5s ease-in-out infinite;
        }

        /* Thermometer Liquid Transition */
        .thermo-liquid {
            transition: height 0.1s linear, y 0.1s linear, fill 0.5s ease;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>

    <div id="root" class="w-full h-screen max-h-[1000px] flex justify-center items-center p-4"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- THERMODYNAMIC CONSTANTS ---
        const C_WATER = 4.18; // J / g·°C
        const ROOM_TEMP = 25.0; 
        const BOILING_POINT = 100.0;
        const FREEZING_POINT = 0.0;

        // Fuel Database (Combustion)
        const FUELS = {
            methanol: { name: 'Methanol (CH₃OH)', molarMass: 32.04, deltaHc: -726 },   // kJ/mol
            ethanol: { name: 'Ethanol (C₂H₅OH)', molarMass: 46.07, deltaHc: -1367 },   // kJ/mol
            propanol: { name: 'Propanol (C₃H₇OH)', molarMass: 60.10, deltaHc: -2021 }  // kJ/mol
        };

        // Salts Database (Dissolution)
        const SALTS = {
            nh4no3: { name: 'Ammonium Nitrate (Endothermic)', formula: 'NH₄NO₃', molarMass: 80.04, deltaH: 25.69 }, // Positive = Endothermic
            cacl2: { name: 'Calcium Chloride (Exothermic)', formula: 'CaCl₂', molarMass: 110.98, deltaH: -81.33 },
            naoh: { name: 'Sodium Hydroxide (Exothermic)', formula: 'NaOH', molarMass: 40.00, deltaH: -44.51 }
        };

        // Neutralisation Constants
        const NEUT_DELTA_H = -57.1; // kJ/mol for Strong Acid + Strong Base

        // Insulation Profiles (Newton's Cooling)
        const INSULATION = {
            poor: { label: 'Poor (Copper Can/No Lid)', efficiency: 0.40, coolingRate: 0.005 },
            good: { label: 'Good (Polystyrene Cup)', efficiency: 0.95, coolingRate: 0.001 },
            perfect: { label: 'Perfect (Idealized)', efficiency: 1.00, coolingRate: 0.000 }
        };

        function App() {
            // --- STATE MANAGEMENT ---
            
            const [experimentType, setExperimentType] = useState('combustion'); // combustion, neutralisation, dissolution
            
            // Common Inputs
            const [insulationKey, setInsulationKey] = useState('poor');
            
            // Combustion Inputs
            const [waterVolume, setWaterVolume] = useState(100); 
            const [fuelType, setFuelType] = useState('ethanol');
            const [fuelMass, setFuelMass] = useState(1.0); 
            
            // Neutralisation Inputs
            const [acidVol, setAcidVol] = useState(50);
            const [baseVol, setBaseVol] = useState(50);
            const [molarity, setMolarity] = useState(1.0);

            // Dissolution Inputs
            const [solventVol, setSolventVol] = useState(100);
            const [soluteType, setSoluteType] = useState('nh4no3');
            const [soluteMass, setSoluteMass] = useState(5.0);
            
            // Simulation State
            const [simStatus, setSimStatus] = useState('idle'); // idle, reacting, cooling, finished
            const [temperature, setTemperature] = useState(ROOM_TEMP);
            const [timeElapsed, setTimeElapsed] = useState(0); // seconds (max 180)
            
            // Graph & Extreme Values
            const [history, setHistory] = useState([{ t: 0, temp: ROOM_TEMP }]);
            const [peakTemp, setPeakTemp] = useState(ROOM_TEMP); // Furthest temp from room temp

            // Refs for the simulation loop
            const requestRef = useRef();
            const lastTimeRef = useRef();
            const stateRef = useRef({
                temp: ROOM_TEMP,
                time: 0,
                status: 'idle',
                reactedAmount: 0 // Track reaction progress
            });

            // Handle switching experiments
            useEffect(() => {
                handleReset();
                if (experimentType === 'combustion') setInsulationKey('poor');
                else setInsulationKey('good'); // Coffee cup calorimeters
            }, [experimentType]);

            // Sync refs
            useEffect(() => {
                stateRef.current.status = simStatus;
            }, [simStatus]);

            // --- THE PHYSICS ENGINE LOOP ---
            const updatePhysics = (timestamp) => {
                if (!lastTimeRef.current) lastTimeRef.current = timestamp;
                const deltaTime = (timestamp - lastTimeRef.current) / 1000;
                lastTimeRef.current = timestamp;

                let { temp, time, status, reactedAmount } = stateRef.current;

                if (status === 'idle' || status === 'finished') {
                    requestRef.current = requestAnimationFrame(updatePhysics);
                    return;
                }

                // Advance simulation time (Speed up 5x)
                const simTimeStep = deltaTime * 5; 
                time += simTimeStep;

                // Stop at exactly 180 seconds
                if (time >= 180) {
                    time = 180;
                    status = 'finished';
                    setSimStatus('finished');
                }

                const insul = INSULATION[insulationKey];
                let heatAddedJoules = 0; // Positive for exo, Negative for endo

                if (status === 'reacting') {
                    if (experimentType === 'combustion') {
                        const burnRate = 0.2; // g/s
                        const massToBurn = Math.min(burnRate * simTimeStep, fuelMass - reactedAmount);
                        reactedAmount += massToBurn;

                        if (massToBurn > 0) {
                            const moles = massToBurn / FUELS[fuelType].molarMass;
                            const heatReleased = moles * Math.abs(FUELS[fuelType].deltaHc) * 1000;
                            heatAddedJoules = heatReleased * insul.efficiency; // Heat lost to room immediately
                        } else {
                            status = 'cooling';
                            setSimStatus('cooling');
                        }
                    } 
                    else if (experimentType === 'neutralisation') {
                        const reactTime = 2.0; // Reaction completes in 2 seconds
                        const molesLimit = Math.min(acidVol, baseVol) * (molarity / 1000);
                        const totalHeat = molesLimit * Math.abs(NEUT_DELTA_H) * 1000;
                        
                        if (reactedAmount < reactTime) {
                            heatAddedJoules = (totalHeat / reactTime) * simTimeStep;
                            reactedAmount += simTimeStep;
                        } else {
                            status = 'cooling';
                            setSimStatus('cooling');
                        }
                    }
                    else if (experimentType === 'dissolution') {
                        const reactTime = 3.0; // Dissolves over 3 seconds
                        const salt = SALTS[soluteType];
                        const moles = soluteMass / salt.molarMass;
                        // If deltaH is positive (Endo), heatAddedJoules is NEGATIVE
                        const totalHeat = moles * (-salt.deltaH) * 1000; 

                        if (reactedAmount < reactTime) {
                            heatAddedJoules = (totalHeat / reactTime) * simTimeStep;
                            reactedAmount += simTimeStep;
                        } else {
                            status = 'cooling';
                            setSimStatus('cooling');
                        }
                    }
                }

                // Apply Heat Transfer (ΔT = q / mc)
                let currentMass = 100;
                if (experimentType === 'combustion') currentMass = waterVolume;
                else if (experimentType === 'neutralisation') currentMass = acidVol + baseVol;
                else if (experimentType === 'dissolution') currentMass = solventVol + soluteMass;

                if (heatAddedJoules !== 0) {
                    const deltaT_gain = heatAddedJoules / (currentMass * C_WATER);
                    temp += deltaT_gain;
                }

                // Newton's Law of Cooling
                const tempDiff = temp - ROOM_TEMP; 
                // If tempDiff > 0 (hot), it loses heat. If tempDiff < 0 (cold), it gains heat from room!
                const deltaT_loss = insul.coolingRate * tempDiff * simTimeStep;
                temp -= deltaT_loss;

                // Cap at physical limits
                temp = Math.min(temp, BOILING_POINT);
                temp = Math.max(temp, FREEZING_POINT);

                // Update State Refs
                stateRef.current = { temp, time, status, reactedAmount };

                // Commit to React State conditionally to save performance
                if (Math.floor(time * 10) % 5 === 0 || status === 'finished') {
                    setTemperature(temp);
                    setTimeElapsed(time);
                    
                    setPeakTemp(prev => {
                        return Math.abs(temp - ROOM_TEMP) > Math.abs(prev - ROOM_TEMP) ? temp : prev;
                    });
                    
                    setHistory(prev => {
                        // Prevent duplicates and keep timeline clean
                        const last = prev[prev.length - 1];
                        if (last && Math.abs(last.t - time) < 0.1) return prev;
                        return [...prev, { t: time, temp: temp }];
                    });
                }

                requestRef.current = requestAnimationFrame(updatePhysics);
            };

            useEffect(() => {
                requestRef.current = requestAnimationFrame(updatePhysics);
                return () => cancelAnimationFrame(requestRef.current);
            }, [waterVolume, fuelType, fuelMass, acidVol, baseVol, molarity, solventVol, soluteType, soluteMass, insulationKey, experimentType]);

            // --- CONTROLS ---
            const handleIgnite = () => {
                if (simStatus !== 'idle') return;
                setHistory([{ t: 0, temp: ROOM_TEMP }]);
                setTimeElapsed(0);
                setPeakTemp(ROOM_TEMP);
                stateRef.current = { temp: ROOM_TEMP, time: 0, status: 'reacting', reactedAmount: 0 };
                lastTimeRef.current = performance.now();
                setSimStatus('reacting');
            };

            const handleReset = () => {
                setSimStatus('idle');
                setTemperature(ROOM_TEMP);
                setTimeElapsed(0);
                setPeakTemp(ROOM_TEMP);
                setHistory([{ t: 0, temp: ROOM_TEMP }]);
                stateRef.current = { temp: ROOM_TEMP, time: 0, status: 'idle', reactedAmount: 0 };
            };

            // --- RENDER HELPERS ---
            const isExo = peakTemp >= ROOM_TEMP;
            const deltaT = peakTemp - ROOM_TEMP;
            
            let calcMass = 0;
            let calcMoles = 0;
            let theoreticalDH = 0;
            
            if (experimentType === 'combustion') {
                calcMass = waterVolume;
                calcMoles = stateRef.current.reactedAmount / FUELS[fuelType].molarMass;
                theoreticalDH = FUELS[fuelType].deltaHc;
            } else if (experimentType === 'neutralisation') {
                calcMass = acidVol + baseVol;
                calcMoles = Math.min(acidVol, baseVol) * (molarity / 1000);
                theoreticalDH = NEUT_DELTA_H;
            } else if (experimentType === 'dissolution') {
                calcMass = solventVol + soluteMass;
                calcMoles = soluteMass / SALTS[soluteType].molarMass;
                theoreticalDH = SALTS[soluteType].deltaH;
            }

            const currentQ = calcMass * C_WATER * (temperature - ROOM_TEMP); // J
            const peakQ = calcMass * C_WATER * deltaT; // J
            const expDH = calcMoles > 0 ? -(peakQ / 1000) / calcMoles : 0; // kJ/mol

            return (
                <div className="w-full max-w-7xl h-full bg-slate-900 border border-slate-700 rounded-3xl shadow-2xl flex flex-col overflow-hidden">
                    
                    {/* Header */}
                    <header className="bg-slate-800/50 p-4 border-b border-slate-700 flex justify-between items-center shrink-0">
                        <div>
                            <h1 className="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-400 flex items-center gap-2">
                                <svg className="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                                Calorimetry Lab Simulator
                            </h1>
                            <div className="flex gap-2 mt-2">
                                {['combustion', 'neutralisation', 'dissolution'].map(type => (
                                    <button
                                        key={type}
                                        onClick={() => setExperimentType(type)}
                                        disabled={simStatus !== 'idle'}
                                        className={`px-3 py-1 text-xs font-bold rounded uppercase tracking-wider transition-colors disabled:opacity-50
                                            ${experimentType === type ? 'bg-indigo-500 text-white shadow-md' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}`}
                                    >
                                        {type}
                                    </button>
                                ))}
                            </div>
                        </div>
                        
                        {/* Global Status Pill */}
                        <div className={`px-4 py-1.5 rounded-full text-sm font-bold tracking-wider uppercase border 
                            ${simStatus === 'idle' ? 'bg-slate-800 text-slate-400 border-slate-600' : 
                              simStatus === 'reacting' ? 'bg-rose-500/20 text-rose-400 border-rose-500/50 animate-pulse' : 
                              simStatus === 'finished' ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/50' :
                              'bg-sky-500/20 text-sky-400 border-sky-500/50'}`}>
                            {simStatus === 'idle' ? 'Ready' : simStatus === 'reacting' ? 'Reacting...' : simStatus === 'finished' ? 'Complete (180s)' : 'Logging...'}
                        </div>
                    </header>

                    {/* Main Content Workspace */}
                    <div className="flex-grow flex flex-col lg:flex-row overflow-hidden">
                        
                        {/* LEFT COLUMN: Visualizer & Graph */}
                        <div className="w-full lg:w-7/12 flex flex-col border-r border-slate-700 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-slate-800 to-slate-900">
                            
                            {/* Visual Setup (Calorimeter) */}
                            <div className="h-3/5 relative flex justify-center items-end pb-12 border-b border-slate-700">
                                
                                {/* Live Digital Thermometer Readout */}
                                <div className="absolute top-6 right-6 bg-slate-950/80 backdrop-blur border border-slate-700 p-4 rounded-xl shadow-xl">
                                    <p className="text-xs text-slate-400 uppercase tracking-widest mb-1">Temperature</p>
                                    <p className={`text-4xl font-mono font-bold ${temperature < ROOM_TEMP ? 'text-blue-400' : 'text-emerald-400'}`}>
                                        {temperature.toFixed(1)} <span className="text-xl">°C</span>
                                    </p>
                                    <p className="text-right text-[10px] text-slate-500 mt-1">{timeElapsed.toFixed(1)} / 180s</p>
                                </div>

                                {/* SVG Lab Apparatus */}
                                <div className="relative w-64 h-80">
                                    
                                    {/* Thermometer SVG */}
                                    <div className={`absolute left-1/2 bottom-[140px] z-20 transition-transform ${experimentType === 'combustion' ? '-translate-x-1/2' : 'translate-x-4'}`}>
                                        <svg width="20" height="200" viewBox="0 0 20 200">
                                            <rect x="5" y="0" width="10" height="180" rx="5" fill="#1E293B" stroke="#475569" strokeWidth="2"/>
                                            <circle cx="10" cy="185" r="10" fill="#1E293B" stroke="#475569" strokeWidth="2"/>
                                            {/* Dynamic Liquid - Maps 0C to 100C */}
                                            <rect x="7" y={170 - ((temperature/100) * 160)} width="6" height={10 + ((temperature/100) * 160)} fill={temperature < ROOM_TEMP ? "#3B82F6" : "#EF4444"} className="thermo-liquid"/>
                                            <circle cx="10" cy="185" r="6" fill={temperature < ROOM_TEMP ? "#3B82F6" : "#EF4444"} className="transition-colors duration-500" />
                                        </svg>
                                    </div>

                                    {/* APPARATUS RENDER BASED ON EXPERIMENT */}
                                    {experimentType === 'combustion' ? (
                                        <>
                                            {/* Copper Can */}
                                            <div className="absolute bottom-[80px] left-1/2 -translate-x-1/2 z-10 w-32 h-36 border-4 border-orange-700/80 bg-orange-600/20 backdrop-blur-[2px] rounded-b-xl shadow-[inset_0_-10px_20px_rgba(194,65,12,0.3)] flex flex-col justify-end overflow-hidden">
                                                <div className="w-full bg-sky-500/40 border-t-2 border-sky-400/50 transition-all duration-300" style={{ height: `${(waterVolume / 500) * 100}%` }}></div>
                                            </div>

                                            {/* Draft Shield */}
                                            {insulationKey !== 'poor' && (
                                                <div className="absolute bottom-[75px] left-1/2 -translate-x-1/2 z-30 w-40 h-44 border-2 border-slate-500/40 bg-slate-400/5 rounded-t-xl border-b-0 pointer-events-none">
                                                    {insulationKey === 'perfect' && <div className="w-full h-4 bg-slate-500/60 rounded-t-xl"></div>}
                                                </div>
                                            )}

                                            {/* Spirit Burner */}
                                            <div className="absolute bottom-0 left-1/2 -translate-x-1/2 z-20 flex flex-col items-center">
                                                <div className={`h-16 w-12 flex justify-center items-end opacity-0 transition-opacity duration-300 ${simStatus === 'reacting' ? 'opacity-100' : ''}`}>
                                                    <svg viewBox="0 0 40 60" className="animate-flame w-full h-full drop-shadow-[0_0_15px_rgba(244,63,94,0.8)]">
                                                        <path d="M20 0 Q30 30 40 40 A20 20 0 0 1 0 40 Q10 30 20 0" fill="url(#flameGrad)"/>
                                                        <path d="M20 20 Q25 40 30 45 A10 10 0 0 1 10 45 Q15 40 20 20" fill="#FDE047"/>
                                                        <defs>
                                                            <linearGradient id="flameGrad" x1="0" y1="1" x2="0" y2="0">
                                                                <stop offset="0%" stopColor="#2563EB" />
                                                                <stop offset="40%" stopColor="#F97316" />
                                                                <stop offset="100%" stopColor="#F43F5E" />
                                                            </linearGradient>
                                                        </defs>
                                                    </svg>
                                                </div>
                                                <div className="w-6 h-4 bg-slate-400 rounded-t-sm"></div>
                                                <div className="w-20 h-14 bg-slate-800/80 border-2 border-slate-600 rounded-b-xl shadow-lg relative overflow-hidden">
                                                    <div className="absolute bottom-0 w-full bg-amber-500/30 border-t border-amber-500/50 transition-all" style={{ height: `${((fuelMass - stateRef.current.reactedAmount) / 5) * 100}%` }}></div>
                                                </div>
                                            </div>
                                        </>
                                    ) : (
                                        <>
                                            {/* Coffee Cup Calorimeter (Styrofoam) */}
                                            <div className="absolute bottom-[20px] left-1/2 -translate-x-1/2 z-10 w-36 h-40 border-4 border-slate-200 bg-slate-100/90 rounded-b-2xl shadow-xl flex flex-col justify-end overflow-hidden">
                                                {/* Solution inside cup */}
                                                <div className={`w-full transition-all duration-300 border-t-2 ${experimentType === 'neutralisation' ? 'bg-purple-500/20 border-purple-400/50' : 'bg-blue-500/20 border-blue-400/50'}`} style={{ height: `${(calcMass / 250) * 100}%` }}></div>
                                            </div>
                                            
                                            {/* Cup Lid & Insulation rendering */}
                                            <div className="absolute bottom-[160px] left-1/2 -translate-x-1/2 z-30 w-40 h-6 border-b-4 border-slate-300 bg-slate-200 rounded-t-xl flex justify-center shadow-md">
                                                {/* Hole for thermometer/stirrer */}
                                                <div className="w-4 h-full bg-slate-800 rounded-full mx-2"></div>
                                                <div className="w-4 h-full bg-slate-800 rounded-full mx-2"></div>
                                            </div>

                                            {/* Glass Stirrer */}
                                            <div className={`absolute bottom-[40px] left-1/2 -translate-x-8 w-2 h-48 bg-white/40 border border-white/60 rounded-full z-20 ${simStatus === 'reacting' ? 'animate-stir' : ''}`}></div>

                                            {/* Animated Powder/Drops during reaction */}
                                            {simStatus === 'reacting' && experimentType === 'dissolution' && (
                                                <div className="absolute bottom-[100px] left-1/2 -translate-x-1/2 z-20 w-10 h-10 border-2 border-dashed border-slate-400 rounded-full animate-spin"></div>
                                            )}
                                        </>
                                    )}
                                    
                                </div>
                            </div>

                            {/* 180 Second Graph (Temp vs Time) */}
                            <div className="h-2/5 p-4 flex flex-col">
                                <h3 className="text-xs font-bold text-slate-500 uppercase tracking-widest mb-2 flex justify-between">
                                    <span>Real-Time Cooling Curve</span>
                                    <span>180 SECONDS</span>
                                </h3>
                                <div className="flex-grow bg-slate-950/50 rounded-xl border border-slate-800 relative overflow-hidden p-2">
                                    <svg width="100%" height="100%" preserveAspectRatio="none" viewBox="0 0 200 100">
                                        {/* Grid Lines (Y-Axis: 0 to 100) */}
                                        <line x1="0" y1="25" x2="200" y2="25" stroke="#1E293B" strokeWidth="0.5"/>
                                        <line x1="0" y1="50" x2="200" y2="50" stroke="#1E293B" strokeWidth="0.5"/>
                                        <line x1="0" y1="75" x2="200" y2="75" stroke="#1E293B" strokeWidth="0.5"/>
                                        
                                        {/* Polyline Graph */}
                                        <polyline 
                                            fill="none" 
                                            stroke={peakTemp < ROOM_TEMP ? "#3B82F6" : "#F43F5E"} 
                                            strokeWidth="2" 
                                            points={history.map(pt => {
                                                // Map time strictly up to 180s onto 200px width
                                                const x = (pt.t / 180) * 200;
                                                // Map temp from 0C to 100C onto 100px height (inverted)
                                                const y = 100 - ((pt.temp / 100) * 100);
                                                return `${x},${y}`;
                                            }).join(' ')}
                                        />

                                        {/* 180s End Marker */}
                                        <line x1="200" y1="0" x2="200" y2="100" stroke="#EF4444" strokeWidth="2" strokeDasharray="4"/>
                                    </svg>
                                    
                                    {/* Axis Labels (CSS positioned) */}
                                    <div className="absolute top-2 left-2 text-[10px] text-slate-500">100°C</div>
                                    <div className="absolute bottom-2 left-2 text-[10px] text-slate-500">0°C</div>
                                    <div className="absolute bottom-2 right-2 text-[10px] text-rose-500 font-bold">180s</div>
                                    <div className="absolute bottom-2 left-1/2 -translate-x-1/2 text-[10px] text-slate-500">90s</div>
                                </div>
                            </div>
                        </div>

                        {/* RIGHT COLUMN: Controls & Thermodynamics Analysis */}
                        <div className="w-full lg:w-5/12 bg-slate-900 flex flex-col overflow-y-auto hide-scrollbar">
                            
                            {/* Inputs Section */}
                            <div className="p-6 border-b border-slate-800 space-y-5">
                                <h2 className="text-sm font-bold text-slate-400 uppercase tracking-widest border-b border-slate-800 pb-2">Variables & Settings</h2>
                                
                                {/* Dynamic Inputs based on Experiment Type */}
                                {experimentType === 'combustion' && (
                                    <>
                                        <div className="space-y-2">
                                            <div className="flex justify-between"><label className="text-sm text-sky-400 font-semibold">Mass of Water</label><span className="font-mono text-sm">{waterVolume} g</span></div>
                                            <input type="range" min="50" max="300" step="10" value={waterVolume} onChange={(e) => setWaterVolume(Number(e.target.value))} disabled={simStatus !== 'idle'} className="text-sky-500 disabled:opacity-50" />
                                        </div>
                                        <div className="space-y-2">
                                            <label className="text-sm text-orange-400 font-semibold block">Fuel Type</label>
                                            <div className="grid grid-cols-3 gap-2">
                                                {Object.entries(FUELS).map(([key, data]) => (
                                                    <button key={key} onClick={() => setFuelType(key)} disabled={simStatus !== 'idle'} className={`py-2 text-xs rounded border transition-colors disabled:opacity-50 ${fuelType === key ? 'bg-orange-500/20 border-orange-500 text-orange-300' : 'bg-slate-950 border-slate-700 text-slate-400 hover:bg-slate-800'}`}>{data.name.split(' ')[0]}</button>
                                                ))}
                                            </div>
                                        </div>
                                        <div className="space-y-2">
                                            <div className="flex justify-between"><label className="text-sm text-rose-400 font-semibold">Fuel Mass to Burn</label><span className="font-mono text-sm">{fuelMass.toFixed(1)} g</span></div>
                                            <input type="range" min="0.1" max="5.0" step="0.1" value={fuelMass} onChange={(e) => setFuelMass(Number(e.target.value))} disabled={simStatus !== 'idle'} className="text-rose-500 disabled:opacity-50" />
                                        </div>
                                    </>
                                )}

                                {experimentType === 'neutralisation' && (
                                    <>
                                        <div className="space-y-2">
                                            <div className="flex justify-between"><label className="text-sm text-rose-400 font-semibold">Acid Volume (HCl)</label><span className="font-mono text-sm">{acidVol} mL</span></div>
                                            <input type="range" min="10" max="100" step="5" value={acidVol} onChange={(e) => setAcidVol(Number(e.target.value))} disabled={simStatus !== 'idle'} className="text-rose-500 disabled:opacity-50" />
                                        </div>
                                        <div className="space-y-2">
                                            <div className="flex justify-between"><label className="text-sm text-blue-400 font-semibold">Base Volume (NaOH)</label><span className="font-mono text-sm">{baseVol} mL</span></div>
                                            <input type="range" min="10" max="100" step="5" value={baseVol} onChange={(e) => setBaseVol(Number(e.target.value))} disabled={simStatus !== 'idle'} className="text-blue-500 disabled:opacity-50" />
                                        </div>
                                        <div className="space-y-2">
                                            <div className="flex justify-between"><label className="text-sm text-purple-400 font-semibold">Concentration (Molarity)</label><span className="font-mono text-sm">{molarity.toFixed(1)} M</span></div>
                                            <input type="range" min="0.5" max="3.0" step="0.1" value={molarity} onChange={(e) => setMolarity(Number(e.target.value))} disabled={simStatus !== 'idle'} className="text-purple-500 disabled:opacity-50" />
                                        </div>
                                    </>
                                )}

                                {experimentType === 'dissolution' && (
                                    <>
                                        <div className="space-y-2">
                                            <div className="flex justify-between"><label className="text-sm text-sky-400 font-semibold">Solvent Volume (Water)</label><span className="font-mono text-sm">{solventVol} mL</span></div>
                                            <input type="range" min="50" max="200" step="10" value={solventVol} onChange={(e) => setSolventVol(Number(e.target.value))} disabled={simStatus !== 'idle'} className="text-sky-500 disabled:opacity-50" />
                                        </div>
                                        <div className="space-y-2">
                                            <label className="text-sm text-emerald-400 font-semibold block">Salt/Solute Type</label>
                                            <select 
                                                value={soluteType} onChange={(e) => setSoluteType(e.target.value)} disabled={simStatus !== 'idle'}
                                                className="w-full bg-slate-950 border border-slate-700 text-slate-300 text-sm rounded-lg p-2.5 outline-none"
                                            >
                                                {Object.entries(SALTS).map(([key, data]) => (
                                                    <option key={key} value={key}>{data.name}</option>
                                                ))}
                                            </select>
                                        </div>
                                        <div className="space-y-2">
                                            <div className="flex justify-between"><label className="text-sm text-amber-400 font-semibold">Mass of Solute</label><span className="font-mono text-sm">{soluteMass.toFixed(1)} g</span></div>
                                            <input type="range" min="1.0" max="20.0" step="0.5" value={soluteMass} onChange={(e) => setSoluteMass(Number(e.target.value))} disabled={simStatus !== 'idle'} className="text-amber-500 disabled:opacity-50" />
                                        </div>
                                    </>
                                )}

                                {/* Insulation */}
                                <div className="space-y-2 pt-2 border-t border-slate-800">
                                    <label className="text-xs text-slate-400 font-semibold block">Insulation Setting (Heat Loss)</label>
                                    <div className="bg-slate-950 p-1 rounded-lg flex border border-slate-800">
                                        {Object.entries(INSULATION).map(([key, data]) => (
                                            <button key={key} onClick={() => setInsulationKey(key)} disabled={simStatus !== 'idle'}
                                                className={`flex-1 py-1.5 text-xs font-semibold rounded-md transition-all disabled:opacity-50 ${insulationKey === key ? 'bg-slate-700 text-white shadow' : 'text-slate-500 hover:text-slate-300'}`}
                                            >
                                                {key.charAt(0).toUpperCase() + key.slice(1)}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* Action Buttons */}
                                <div className="flex gap-4 pt-2">
                                    {simStatus === 'idle' || simStatus === 'finished' ? (
                                        <button onClick={handleIgnite} className="flex-1 bg-gradient-to-r from-indigo-600 to-blue-500 hover:from-indigo-500 hover:to-blue-400 text-white font-bold py-3 px-4 rounded-xl shadow-[0_0_15px_rgba(99,102,241,0.4)] transition-all transform hover:scale-[1.02] active:scale-[0.98]">
                                            START EXPERIMENT
                                        </button>
                                    ) : (
                                        <button onClick={handleReset} className="flex-1 bg-slate-800 hover:bg-slate-700 text-rose-400 font-bold py-3 px-4 rounded-xl border border-slate-600 transition-all">
                                            STOP & RESET
                                        </button>
                                    )}
                                </div>
                            </div>

                            {/* Live Physics Calculations Section */}
                            <div className="p-6 bg-slate-950 flex-grow flex flex-col gap-4">
                                <h2 className="text-sm font-bold text-slate-500 uppercase tracking-widest border-b border-slate-800 pb-2">Data Analysis</h2>
                                
                                {/* q = mcΔT Telemetry */}
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="bg-slate-900 border border-slate-800 p-3 rounded-xl">
                                        <p className="text-[10px] text-slate-400 uppercase">Extreme Temp</p>
                                        <p className={`text-xl font-mono ${!isExo ? 'text-blue-400' : 'text-emerald-400'}`}>{peakTemp.toFixed(1)} °C</p>
                                    </div>
                                    <div className="bg-slate-900 border border-slate-800 p-3 rounded-xl">
                                        <p className="text-[10px] text-slate-400 uppercase">Temp Change (ΔT)</p>
                                        <p className={`text-xl font-mono ${!isExo ? 'text-blue-400' : 'text-emerald-400'}`}>
                                            {deltaT > 0 ? '+' : ''}{deltaT.toFixed(1)} °C
                                        </p>
                                    </div>
                                </div>

                                <div className="bg-slate-800/30 border border-slate-700/50 p-4 rounded-xl">
                                    <p className="text-xs text-slate-300 font-semibold mb-2">Heat Transfer (q = mcΔT)</p>
                                    <div className="flex flex-wrap gap-x-2 gap-y-1 font-mono text-sm text-slate-400 items-center">
                                        <span>q</span> <span>=</span>
                                        <span className="text-sky-400">{calcMass.toFixed(1)}g</span> <span>×</span>
                                        <span>4.18</span> <span>×</span>
                                        <span className={!isExo ? "text-blue-400" : "text-emerald-400"}>{Math.abs(deltaT).toFixed(1)}°C</span>
                                    </div>
                                    <div className="mt-2 flex justify-between items-end">
                                        <span className="text-xs text-slate-500">
                                            {isExo ? "Heat generated (+)" : "Heat absorbed from water (-)"}
                                        </span>
                                        <span className="text-lg font-mono font-bold text-slate-200">
                                            {Math.abs(peakQ / 1000).toFixed(2)} <span className="text-sm">kJ</span>
                                        </span>
                                    </div>
                                </div>

                                <div className="bg-indigo-900/10 border border-indigo-900/30 p-4 rounded-xl mt-auto">
                                    <div className="flex justify-between items-center mb-1">
                                        <p className="text-xs text-indigo-400 font-semibold">
                                            {experimentType === 'combustion' ? 'Enthalpy of Combustion (ΔH_c)' : 
                                             experimentType === 'neutralisation' ? 'Enthalpy of Neutralisation (ΔH_n)' : 
                                             'Enthalpy of Solution (ΔH_s)'}
                                        </p>
                                    </div>
                                    <p className="text-[10px] text-slate-500 mb-2 leading-tight">Calculated from experimental peak data (ΔH = -q / n).</p>
                                    
                                    <div className="flex justify-between items-end border-t border-indigo-900/30 pt-2">
                                        <span className="text-xs text-slate-400 font-mono">
                                            - ({(peakQ/1000).toFixed(2)} kJ / {calcMoles.toFixed(4)} mol)
                                        </span>
                                        <span className={`text-lg font-mono font-bold ${expDH > 0 ? 'text-blue-400' : 'text-rose-400'}`}>
                                            {calcMoles > 0 ? `${expDH > 0 ? '+' : ''}${expDH.toFixed(1)} kJ/mol` : '0 kJ/mol'}
                                        </span>
                                    </div>
                                    
                                    {simStatus === 'finished' && (
                                        <div className="mt-2 text-[10px] text-amber-500 bg-amber-500/10 p-2 rounded">
                                            * Note discrepancy from theoretical value ({theoreticalDH > 0 ? '+' : ''}{theoreticalDH} kJ/mol) due to heat exchange with surroundings over the 180s period!
                                        </div>
                                    )}
                                </div>

                            </div>
                        </div>

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
