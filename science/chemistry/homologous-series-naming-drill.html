<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>IUPAC Nomenclature Practice Online | Naming Drill</title>
    <meta name="description" content="Master chemistry with this IUPAC nomenclature practice online tool. Generate random molecules, evaluate naming rules, and get step-by-step structural hints.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#151e2e',
                            900: '#0F172A',
                            950: '#020617',
                        },
                        iupac: {
                            primary: '#6366F1',   // Indigo
                            secondary: '#8B5CF6', // Violet
                            success: '#10B981',   // Emerald
                            error: '#F43F5E',     // Rose
                            warning: '#F59E0B'    // Amber
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- SmilesDrawer for robust 2D chemical structure rendering -->
    <script src="https://unpkg.com/smiles-drawer@1.0.10/dist/smiles-drawer.min.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #0F172A; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        #molecule-canvas {
            background-image: radial-gradient(circle at 2px 2px, #1e293b 1px, transparent 0);
            background-size: 30px 30px;
        }

        /* Animations */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .animate-shake { animation: shake 0.3s ease-in-out; }
        
        @keyframes successPop {
            0% { transform: scale(0.95); opacity: 0; }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-success { animation: successPop 0.5s ease-out forwards; }
    </style>
</head>
<body class="flex flex-col md:flex-row h-screen max-h-[1000px] w-full text-slate-100 font-sans selection:bg-indigo-500 selection:text-white">

    <!-- Left Panel: Interaction & Rule Engine -->
    <aside class="w-full md:w-[400px] lg:w-[450px] bg-slate-900 border-b md:border-b-0 md:border-r border-slate-700 flex flex-col z-10 shadow-2xl h-[50vh] md:h-full">
        
        <!-- Header -->
        <div class="p-6 pb-4 border-b border-slate-800 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-violet-400">
                    IUPAC Naming Drill
                </h1>
                <p class="text-xs text-slate-400 mt-1">Rule-Based Nomenclature Engine</p>
            </div>
            <div class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-1 text-center">
                <span class="text-[10px] text-slate-400 block uppercase">Streak</span>
                <span id="streak-counter" class="text-lg font-bold text-iupac-success">0</span>
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-6 flex flex-col gap-4">
            <label class="text-sm font-semibold text-slate-300 uppercase tracking-wider flex justify-between items-end">
                <span>Systematic IUPAC Name</span>
                <button onclick="generateRandomMolecule()" class="text-xs text-indigo-400 hover:text-indigo-300 transition-colors flex items-center gap-1">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    Skip / Next
                </button>
            </label>
            
            <input type="text" id="iupac-input" placeholder="e.g., 2,3-dimethylbutane" 
                class="w-full bg-slate-950 border-2 border-slate-700 rounded-xl p-4 text-slate-100 font-mono text-sm outline-none focus:border-indigo-500 transition-colors shadow-inner"
                autocomplete="off" spellcheck="false">
            
            <button id="check-btn" onclick="evaluateAnswer()" class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold py-3 rounded-xl transition-all shadow-lg active:scale-[0.98]">
                Evaluate Name
            </button>

            <!-- Feedback Engine Output -->
            <div id="feedback-panel" class="hidden rounded-xl p-4 mt-2 text-sm border">
                <!-- Content injected via JS -->
            </div>
        </div>

        <!-- Hints Section -->
        <div class="p-6 flex-grow overflow-y-auto no-scrollbar border-t border-slate-800 bg-slate-900/50">
            <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-4 flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                Step-by-Step Hints
            </h2>
            
            <div class="space-y-3">
                <button onclick="showHint(1)" id="btn-hint-1" class="w-full text-left bg-slate-800 border border-slate-700 hover:border-slate-500 p-3 rounded-lg text-sm text-slate-300 transition-colors">
                    1. Identify Principal Group
                </button>
                <div id="hint-1-content" class="hidden text-sm text-indigo-300 pl-4 border-l-2 border-indigo-500"></div>

                <button onclick="showHint(2)" id="btn-hint-2" class="w-full text-left bg-slate-800 border border-slate-700 hover:border-slate-500 p-3 rounded-lg text-sm text-slate-300 transition-colors">
                    2. Longest Carbon Chain
                </button>
                <div id="hint-2-content" class="hidden text-sm text-indigo-300 pl-4 border-l-2 border-indigo-500"></div>

                <button onclick="showHint(3)" id="btn-hint-3" class="w-full text-left bg-slate-800 border border-slate-700 hover:border-slate-500 p-3 rounded-lg text-sm text-slate-300 transition-colors">
                    3. Numbering Direction
                </button>
                <div id="hint-3-content" class="hidden text-sm text-indigo-300 pl-4 border-l-2 border-indigo-500"></div>
            </div>
        </div>
    </aside>

    <!-- Right Panel: Molecular Viewer -->
    <main class="flex-grow relative bg-slate-950 flex flex-col h-[50vh] md:h-full justify-center items-center">
        <!-- Interactive Canvas -->
        <canvas id="molecule-canvas" class="w-full h-full cursor-crosshair"></canvas>
        
        <!-- Formula Display -->
        <div class="absolute top-6 right-6 bg-slate-900/80 backdrop-blur border border-slate-700 text-slate-300 text-sm py-2 px-4 rounded-lg font-mono shadow-xl flex flex-col items-end">
            <span class="text-xs text-slate-500 uppercase tracking-widest">Formula</span>
            <span id="formula-display" class="font-bold text-indigo-400 text-lg">CnH2n+2</span>
        </div>

        <div class="absolute bottom-6 left-1/2 -translate-x-1/2 text-slate-500 text-xs py-2 px-4 pointer-events-none text-center">
            2D skeletal structure rendered dynamically.<br>Hydrogen atoms attached to carbons are implied.
        </div>
    </main>

    <!-- IUPAC Engine Logic -->
    <script>
        // --- 1. MOLECULE DATABASE & RULES ---
        
        // Dictionary of practice molecules with structural metadata for hints and common mistakes
        const MOLECULE_DB = [
            {
                smiles: "CC(C)C",
                formula: "C4H10",
                exactNames: ["2-methylpropane", "methylpropane", "isobutane"],
                wrongPatterns: {
                    "butane": "There are only 3 carbons in the longest continuous chain.",
                    "1-methylpropane": "A methyl group on the 1st carbon simply extends the longest chain to butane."
                },
                hints: {
                    1: "Alkanes have the suffix '-ane'. All bonds are single.",
                    2: "The longest continuous chain has 3 carbons (prop-).",
                    3: "Numbering from left or right gives the substituent (methyl) locant 2."
                }
            },
            {
                smiles: "CCC(C)CC",
                formula: "C6H14",
                exactNames: ["3-methylpentane"],
                wrongPatterns: {
                    "2-ethylbutane": "Find the *longest* continuous chain. A 5-carbon chain is longer than a 4-carbon chain.",
                    "hexane": "Count the longest continuous straight line, it's not 6."
                },
                hints: {
                    1: "Only single bonds exist. Suffix is '-ane'.",
                    2: "The longest continuous path you can trace without lifting your pen contains 5 carbons (pent-).",
                    3: "The substituent is a 1-carbon group (methyl). Numbering from either side puts it on carbon 3."
                }
            },
            {
                smiles: "CC(C)C(C)C",
                formula: "C6H14",
                exactNames: ["2,3-dimethylbutane"],
                wrongPatterns: {
                    "2,3-methylbutane": "If there are two identical substituents, you must use the prefix 'di-'.",
                    "3,2-dimethylbutane": "Locants must be listed in increasing numerical order.",
                    "dimethylbutane": "You must specify the exact locants for both methyl groups."
                },
                hints: {
                    1: "Alkane principal group. Suffix '-ane'.",
                    2: "Longest continuous chain is 4 carbons (but-).",
                    3: "There are two methyl groups. Numbering from either side gives locants 2 and 3."
                }
            },
            {
                smiles: "CC(O)CC",
                formula: "C4H10O",
                exactNames: ["butan-2-ol", "2-butanol"],
                wrongPatterns: {
                    "3-butanol": "Number from the end that gives the principal functional group (-OH) the lowest number.",
                    "butan-3-ol": "Number from the end that gives the principal functional group (-OH) the lowest number.",
                    "butanol": "You must specify the position of the hydroxyl group."
                },
                hints: {
                    1: "The principal functional group is a hydroxyl (-OH). The suffix is '-ol'.",
                    2: "The longest chain containing the hydroxyl carbon has 4 carbons (butan-).",
                    3: "Number from left to right so the -OH is on carbon 2, not 3."
                }
            },
            {
                smiles: "CC(=O)C",
                formula: "C3H6O",
                exactNames: ["propan-2-one", "2-propanone", "acetone", "propanone"],
                wrongPatterns: {
                    "propanal": "This is a ketone (carbonyl between carbons), not an aldehyde (carbonyl at the end).",
                },
                hints: {
                    1: "The principal functional group is a ketone (C=O). The suffix is '-one'.",
                    2: "The main carbon chain has 3 carbons (propan-).",
                    3: "The carbonyl carbon is at position 2 regardless of which side you number from."
                }
            },
            {
                smiles: "CC=CC",
                formula: "C4H8",
                exactNames: ["but-2-ene", "2-butene"],
                wrongPatterns: {
                    "but-3-ene": "Number from the end that gives the double bond the lowest locant.",
                    "butene": "You must specify the location of the double bond."
                },
                hints: {
                    1: "The molecule contains a double bond. The suffix is '-ene'.",
                    2: "The longest chain containing the double bond has 4 carbons (but-).",
                    3: "Numbering from either side gives the double bond starting at carbon 2."
                }
            },
            {
                smiles: "ClC(C)CC",
                formula: "C4H9Cl",
                exactNames: ["2-chlorobutane"],
                wrongPatterns: {
                    "3-chlorobutane": "Number the chain to give the substituent the lowest possible number.",
                    "chlorobutane": "Specify the position of the chlorine atom."
                },
                hints: {
                    1: "Halogens are treated as substituents. Suffix is still '-ane'. Use prefix 'chloro-'.",
                    2: "Longest continuous chain is 4 carbons (but-).",
                    3: "Number from left to right to give chlorine locant 2 instead of 3."
                }
            },
            {
                smiles: "CCCC(CC)CCC",
                formula: "C9H20",
                exactNames: ["4-ethylheptane"],
                wrongPatterns: {
                    "4-propylhexane": "Find the *longest* continuous carbon chain. A 7-carbon chain is longer than a 6-carbon chain."
                },
                hints: {
                    1: "Standard alkane. Suffix '-ane'.",
                    2: "Trace carefully! The longest path has 7 carbons (hept-), leaving a 2-carbon branch.",
                    3: "The branch is an ethyl group. Numbering from either end of the 7-carbon chain puts it at position 4."
                }
            }
        ];

        // --- 2. APPLICATION STATE ---
        let smilesDrawer;
        let currentMolecule = null;
        let streak = 0;

        // --- 3. INITIALIZATION ---
        function init() {
            // Setup SmilesDrawer with custom dark theme colors
            smilesDrawer = new SmilesDrawer.Drawer({
                width: document.getElementById('molecule-canvas').clientWidth,
                height: document.getElementById('molecule-canvas').clientHeight,
                compactDrawing: false,
                themes: { 
                    dark: { 
                        C: '#e2e8f0', // slate-200
                        O: '#F43F5E', // rose-500
                        N: '#34D399', // emerald-400
                        Cl: '#38BDF8',// sky-400
                        Br: '#A78BFA',// violet-400
                        BACKGROUND: 'transparent' 
                    } 
                }
            });

            // Handle resize
            window.addEventListener('resize', () => {
                const canvas = document.getElementById('molecule-canvas');
                canvas.width = canvas.parentElement.clientWidth;
                canvas.height = canvas.parentElement.clientHeight;
                if (currentMolecule) drawMolecule(currentMolecule.smiles);
            });

            // Handle Enter key for submission
            document.getElementById('iupac-input').addEventListener('keypress', function (e) {
                if (e.key === 'Enter') evaluateAnswer();
            });

            generateRandomMolecule();
        }

        function drawMolecule(smiles) {
            const canvas = document.getElementById('molecule-canvas');
            SmilesDrawer.parse(smiles, function(tree) {
                smilesDrawer.draw(tree, 'molecule-canvas', 'dark', false);
            }, function(err) {
                console.error("SmilesDrawer Parse Error:", err);
            });
        }

        function generateRandomMolecule() {
            // Pick a random molecule different from the current one
            let newMol;
            do {
                newMol = MOLECULE_DB[Math.floor(Math.random() * MOLECULE_DB.length)];
            } while (currentMolecule && newMol.smiles === currentMolecule.smiles && MOLECULE_DB.length > 1);
            
            currentMolecule = newMol;
            
            // Reset UI
            document.getElementById('iupac-input').value = '';
            document.getElementById('formula-display').innerText = currentMolecule.formula;
            document.getElementById('feedback-panel').classList.add('hidden');
            document.getElementById('iupac-input').classList.remove('border-iupac-error', 'border-iupac-success');
            
            // Reset Hints
            for(let i=1; i<=3; i++) {
                document.getElementById(`btn-hint-${i}`).classList.remove('hidden');
                document.getElementById(`hint-${i}-content`).classList.add('hidden');
            }

            drawMolecule(currentMolecule.smiles);
            document.getElementById('iupac-input').focus();
        }

        // --- 4. ALGORITHMIC RULE-BASED IUPAC ENGINE ---
        
        function evaluateAnswer() {
            const inputEl = document.getElementById('iupac-input');
            const panel = document.getElementById('feedback-panel');
            let rawInput = inputEl.value.trim();
            
            if (!rawInput) return;

            // Normalization algorithm: remove spaces, lowercase, standard hyphens
            let normalizedInput = rawInput.toLowerCase().replace(/\s+/g, '');
            // Convert standard dashes to simple hyphens
            normalizedInput = normalizedInput.replace(/[—–]/g, '-');

            // 1. Check Exact Match (against array of accepted formats)
            const acceptedNormalized = currentMolecule.exactNames.map(n => n.replace(/\s+/g, '').toLowerCase());
            
            if (acceptedNormalized.includes(normalizedInput)) {
                handleSuccess(currentMolecule.exactNames[0]);
                return;
            }

            // 2. Syntax Rule Engine (Common formatting mistakes)
            let syntaxFeedback = checkSyntaxRules(normalizedInput);
            if (syntaxFeedback) {
                handleError(syntaxFeedback, "Syntax Error");
                return;
            }

            // 3. Structural Rule Engine (Specific molecular mistakes)
            let structuralFeedback = checkStructuralMistakes(normalizedInput);
            if (structuralFeedback) {
                handleError(structuralFeedback, "Structural Rule Check");
                return;
            }

            // 4. Default Fallback Error
            handleError("Name does not match the structure. Use the step-by-step hints to deduce the correct name.", "Incorrect");
        }

        function checkSyntaxRules(input) {
            // Rule: Numbers and letters must be separated by hyphens
            if (/[0-9][a-z]|[a-z][0-9]/.test(input) && !input.includes('-')) {
                return "IUPAC Rule: Always separate numbers and letters with a hyphen (e.g., 2-methyl).";
            }
            
            // Rule: Multiple numbers must be separated by commas
            if (/[0-9][0-9]/.test(input) && !input.includes(',')) {
                return "IUPAC Rule: Separate consecutive numbers with commas (e.g., 2,3-dimethyl).";
            }

            // Rule: Check alphabetical order of common substituents
            if (input.includes('methyl') && input.includes('ethyl')) {
                let mIndex = input.indexOf('methyl');
                let eIndex = input.indexOf('ethyl');
                if (mIndex < eIndex) {
                    return "IUPAC Rule: Substituents must be listed in alphabetical order. 'Ethyl' comes before 'Methyl'.";
                }
            }
            
            // Rule: Missing multiplier prefix (di, tri) if multiple identical numbers exist
            const numberMatches = input.match(/\d/g);
            if (numberMatches && numberMatches.length > 1 && !input.match(/(di|tri|tetra)/)) {
                return "IUPAC Rule: If you specify multiple locants (e.g., 2,3), you must use a multiplier prefix like 'di-' or 'tri-'.";
            }

            return null; // Passes syntax rules
        }

        function checkStructuralMistakes(input) {
            // Check dictionary for exact wrong patterns mapped by teacher
            if (currentMolecule.wrongPatterns[input]) {
                return currentMolecule.wrongPatterns[input];
            }
            return null;
        }

        // --- 5. UI FEEDBACK CONTROLLERS ---

        function handleSuccess(correctName) {
            streak++;
            document.getElementById('streak-counter').innerText = streak;
            
            const inputEl = document.getElementById('iupac-input');
            inputEl.classList.remove('border-slate-700', 'border-iupac-error');
            inputEl.classList.add('border-iupac-success');
            
            const panel = document.getElementById('feedback-panel');
            panel.classList.remove('hidden', 'bg-slate-800', 'border-slate-700', 'text-slate-400', 'bg-rose-950/30', 'border-rose-900', 'text-rose-400');
            panel.classList.add('bg-emerald-950/30', 'border-emerald-900', 'text-emerald-400', 'animate-success');
            
            panel.innerHTML = `
                <div class="font-bold flex items-center gap-2 mb-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    Correct!
                </div>
                The systematic name is <strong>${correctName}</strong>.
                <button onclick="generateRandomMolecule()" class="mt-3 bg-emerald-800 hover:bg-emerald-700 text-white text-xs px-4 py-2 rounded transition-colors w-full">Next Molecule</button>
            `;
        }

        function handleError(msg, title) {
            streak = 0;
            document.getElementById('streak-counter').innerText = streak;

            const inputEl = document.getElementById('iupac-input');
            inputEl.classList.remove('border-slate-700', 'border-iupac-success');
            inputEl.classList.add('border-iupac-error', 'animate-shake');
            
            // Remove animation class after it plays to allow re-triggering
            setTimeout(() => inputEl.classList.remove('animate-shake'), 300);

            const panel = document.getElementById('feedback-panel');
            panel.classList.remove('hidden', 'bg-slate-800', 'border-slate-700', 'text-slate-400', 'bg-emerald-950/30', 'border-emerald-900', 'text-emerald-400');
            panel.classList.add('bg-rose-950/30', 'border-rose-900', 'text-rose-400');
            
            panel.innerHTML = `
                <div class="font-bold flex items-center gap-2 mb-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                    ${title}
                </div>
                ${msg}
            `;
        }

        // --- 6. HINT SYSTEM ---
        window.showHint = function(level) {
            const btn = document.getElementById(`btn-hint-${level}`);
            const content = document.getElementById(`hint-${level}-content`);
            
            btn.classList.add('hidden');
            content.classList.remove('hidden');
            content.innerText = currentMolecule.hints[level];
            
            // Auto-focus back to input for better UX
            document.getElementById('iupac-input').focus();
        };

        // Bootstrap the app
        window.onload = init;

    </script>
</body>
</html>
