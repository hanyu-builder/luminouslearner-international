<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>How to Separate Sea Water - Simple Distillation Animation</title>
  <meta name="description" content="Simple distillation of sea water animation. Interactive thermodynamic process simulator highlighting phase changes, evaporation, and condensation.">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for in-browser JSX transpilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { background-color: #0F172A; margin: 0; overflow: hidden; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    
    /* Custom Scrollbar */
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(30, 41, 59, 0.5); }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(71, 85, 105, 0.8); border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 1); }

    /* Drag over state */
    .drag-over {
      stroke: #38bdf8 !important;
      stroke-width: 4px !important;
      fill: rgba(56, 189, 248, 0.3) !important;
    }

    /* Animations */
    @keyframes boil-bubble {
      0% { transform: translateY(0) scale(0.5); opacity: 0; }
      20% { opacity: 0.8; }
      100% { transform: translateY(-40px) scale(1.5); opacity: 0; }
    }
    .anim-bubble { animation: boil-bubble 1s infinite ease-in; }

    @keyframes steam-flow {
      0% { stroke-dashoffset: 20; opacity: 0.6; }
      50% { opacity: 0.9; }
      100% { stroke-dashoffset: 0; opacity: 0.6; }
    }
    .anim-steam {
      stroke-dasharray: 6 14;
      animation: steam-flow 0.5s linear infinite;
    }

    @keyframes drip {
      0% { transform: translateY(0); opacity: 1; }
      80% { transform: translateY(60px); opacity: 1; }
      100% { transform: translateY(65px); opacity: 0; }
    }
    .anim-drip { animation: drip 0.8s infinite ease-in; }

    @keyframes flicker-blue {
      0% { transform: scale(1, 1); opacity: 0.9; }
      50% { transform: scale(0.98, 1.05) translate(0, -2px); opacity: 1; }
      100% { transform: scale(1.02, 0.95) translate(0, 1px); opacity: 0.9; }
    }
    .anim-flame {
      animation: flicker-blue 0.1s infinite alternate;
      /* Using 0,0 since we isolate the translation in an outer group */
      transform-origin: 0px 0px; 
    }

    /* Fade-in for UI */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .anim-fade-in { animation: fadeIn 0.5s ease-out forwards; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- ICON COMPONENTS ---
    const SvgIcon = ({ children, size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
    );
    const Activity = (p) => <SvgIcon {...p}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12" /></SvgIcon>;
    const Info = (p) => <SvgIcon {...p}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></SvgIcon>;
    const Flame = (p) => <SvgIcon {...p}><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></SvgIcon>;
    const Droplets = (p) => <SvgIcon {...p}><path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7 6.74 7 3c-1.14 3.74-2.14 5.12-3.29 6.06S2 11.09 2 12.25c0 2.22 1.8 4.05 4 4.05z"/><path d="M17 21.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S17 11.74 17 8c-1.14 3.74-2.14 5.12-3.29 6.06S12 16.09 12 17.25c0 2.22 1.8 4.05 4 4.05z"/></SvgIcon>;
    const CheckCircle2 = (p) => <SvgIcon {...p}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></SvgIcon>;
    const AlertTriangle = (p) => <SvgIcon {...p}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></SvgIcon>;
    const Thermometer = (p) => <SvgIcon {...p}><path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/></SvgIcon>;
    const RotateCcw = (p) => <SvgIcon {...p}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></SvgIcon>;
    const Wind = (p) => <SvgIcon {...p}><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/></SvgIcon>;

    function App() {
      // --- STATE MANAGEMENT ---
      const [ports, setPorts] = useState({ top: null, bottom: null });
      const [dragOverPort, setDragOverPort] = useState(null);
      
      // Process: 'setup' | 'heating' | 'distilling' | 'complete' | 'verify_setup' | 'verify_heating' | 'verify_boiling'
      const [processState, setProcessState] = useState('setup');
      const [temperature, setTemperature] = useState(25);
      const [flaskVol, setFlaskVol] = useState(100);
      const [beakerVol, setBeakerVol] = useState(0);
      const [verifyTemp, setVerifyTemp] = useState(25);
      
      const [feedback, setFeedback] = useState({ status: 'idle', message: 'Connect the cooling hoses to the Liebig condenser ports.' });

      // Sea water boils at an elevated temperature due to impurities
      const SEA_WATER_BOILING_POINT = 102; 
      const PURE_WATER_BOILING_POINT = 100;

      // --- DRAG & DROP LOGIC (Distillation Phase) ---
      const handleDragStart = (e, hoseType) => {
        if (processState !== 'setup') return e.preventDefault();
        e.dataTransfer.setData('hose', hoseType);
      };

      const handleDragOver = (e, portId) => {
        e.preventDefault();
        if (processState === 'setup') setDragOverPort(portId);
      };

      const handleDragLeave = () => setDragOverPort(null);

      const handleDrop = (e, portId) => {
        e.preventDefault();
        setDragOverPort(null);
        if (processState !== 'setup') return;

        const hoseType = e.dataTransfer.getData('hose');
        if (!hoseType) return;

        setPorts(prev => ({ ...prev, [portId]: hoseType }));
        setFeedback({ status: 'idle', message: 'Hose connected. Ensure flow direction is correct before igniting.' });
      };

      const removeHose = (portId) => {
        if (processState !== 'setup') return;
        setPorts(prev => ({ ...prev, [portId]: null }));
      };

      // --- THERMODYNAMIC ENGINE (React Lifecycle) ---
      
      const igniteBurner = () => {
        if (ports.top !== 'water_out' || ports.bottom !== 'water_in') {
          setFeedback({ 
            status: 'error', 
            message: 'Incorrect Setup! Water must enter at the BOTTOM and exit at the TOP to completely fill the cooling jacket against gravity.' 
          });
          return;
        }
        setProcessState('heating');
        setFeedback({ status: 'success', message: 'Burner ignited! Applying heat to the sea water mixture.' });
      };

      // 1. Heat up distillation flask
      useEffect(() => {
        let timer;
        if (processState === 'heating') {
          timer = setInterval(() => {
            setTemperature(prev => {
              if (prev >= SEA_WATER_BOILING_POINT) return SEA_WATER_BOILING_POINT;
              return prev + 2;
            });
          }, 100);
        }
        return () => clearInterval(timer);
      }, [processState]);

      // Trigger distillation when boiling (102°C for Sea Water)
      useEffect(() => {
        if (processState === 'heating' && temperature >= SEA_WATER_BOILING_POINT) {
          setProcessState('distilling');
          setFeedback({ status: 'success', message: `Boiling point reached at ${SEA_WATER_BOILING_POINT}°C! (Boiling point is elevated due to dissolved salt). Water is vaporizing.` });
        }
      }, [temperature, processState]);

      // 2. Transfer Volume during distillation
      useEffect(() => {
        let timer;
        if (processState === 'distilling') {
          timer = setInterval(() => {
            setFlaskVol(prev => {
              if (prev <= 0) return 0;
              return prev - 1;
            });
            setBeakerVol(prev => Math.min(100, prev + 1));
          }, 150);
        }
        return () => clearInterval(timer);
      }, [processState]);

      // End distillation naturally
      useEffect(() => {
        if (processState === 'distilling' && flaskVol <= 0) {
          setProcessState('complete');
          setFeedback({ status: 'success', message: 'Distillation complete! Pure liquid water separated from solid sodium chloride.' });
        }
      }, [flaskVol, processState]);

      // Helper to skip waiting
      const finishDistillationEarly = () => {
        setFlaskVol(0);
        setBeakerVol(100);
        setProcessState('complete');
        setFeedback({ status: 'success', message: 'Distillation complete! Pure liquid water separated from solid sodium chloride.' });
      };

      // 3. Purity Verification Setup
      const startVerification = () => {
        setProcessState('verify_setup');
        setFeedback({ status: 'idle', message: 'Purity Test: Ignite the burner to measure the boiling point of the collected liquid.' });
      };

      const igniteVerifyBurner = () => {
        setProcessState('verify_heating');
        setFeedback({ status: 'success', message: 'Heating collected liquid...' });
      };

      // 4. Heat up Verification Beaker
      useEffect(() => {
        let timer;
        if (processState === 'verify_heating') {
          timer = setInterval(() => {
            setVerifyTemp(prev => {
              if (prev >= PURE_WATER_BOILING_POINT) return PURE_WATER_BOILING_POINT;
              return prev + 2;
            });
          }, 100);
        }
        return () => clearInterval(timer);
      }, [processState]);

      // Conclude Verification Test
      useEffect(() => {
        if (processState === 'verify_heating' && verifyTemp >= PURE_WATER_BOILING_POINT) {
          setProcessState('verify_boiling');
          setFeedback({ status: 'success', message: `Purity Confirmed! The liquid boils at exactly ${PURE_WATER_BOILING_POINT}°C, proving it is chemically pure water.` });
        }
      }, [verifyTemp, processState]);

      // Reset Entire Lab
      const resetLab = () => {
        setPorts({ top: null, bottom: null });
        setProcessState('setup');
        setTemperature(25);
        setVerifyTemp(25);
        setFlaskVol(100);
        setBeakerVol(0);
        setFeedback({ status: 'idle', message: 'Connect the cooling hoses to the Liebig condenser ports.' });
      };

      const currentTemp = processState.startsWith('verify') ? verifyTemp : temperature;
      const isBoilingState = (processState === 'distilling' || processState === 'verify_boiling');

      return (
        <div className="min-h-screen bg-slate-900 text-slate-100 flex flex-col font-sans overflow-hidden selection:bg-cyan-500/30">
          
          {/* HEADER */}
          <header className="flex justify-between items-center px-6 py-4 bg-slate-800/80 border-b border-slate-700 shadow-lg shrink-0">
            <div className="flex items-center gap-3">
              <Droplets className="text-cyan-400" size={28} />
              <div>
                <h1 className="text-2xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">
                  How to Separate Sea Water
                </h1>
                <p className="text-xs text-slate-400 font-medium font-mono">Simple Distillation Animation Engine</p>
              </div>
            </div>
            
            <button 
              onClick={resetLab}
              className="flex items-center gap-2 px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs font-bold text-slate-200 transition-colors"
            >
              <RotateCcw size={14} /> Reset Lab
            </button>
          </header>

          <main className="flex-1 flex gap-4 p-4 overflow-hidden max-h-[calc(100vh-80px)]">
            
            {/* LEFT PANEL: Controls & Connections */}
            <div className="w-1/4 flex flex-col gap-4 shrink-0">
              
              {!processState.startsWith('verify') ? (
                <>
                  {/* Distillation Theory */}
                  <div className="bg-slate-800/50 border border-slate-700 rounded-2xl p-4 flex flex-col shadow-inner anim-fade-in overflow-y-auto custom-scrollbar">
                    <h2 className="text-xs uppercase tracking-widest text-slate-400 font-bold mb-4 flex items-center gap-2 border-b border-slate-700 pb-2">
                      <Info size={16} /> Thermodynamic Theory
                    </h2>
                    
                    <div className="flex flex-col gap-3">
                      <div className="p-3 bg-slate-900 border border-slate-700 rounded-xl shadow-sm border-l-4 border-l-rose-500">
                        <strong className="text-rose-400 text-sm font-bold uppercase tracking-wider block mb-1">1. Evaporation</strong>
                        <p className="text-[11px] text-slate-400 leading-relaxed mb-1">
                          Heating the sea water boils the volatile solvent (water). The non-volatile solute (NaCl) remains behind.
                        </p>
                        <p className="text-[11px] text-amber-300 leading-relaxed font-semibold">
                          * Boiling Point Elevation: Impurities increase boiling point. Sea water boils at ~102°C!
                        </p>
                      </div>
                      
                      <div className="p-3 bg-slate-900 border border-slate-700 rounded-xl shadow-sm border-l-4 border-l-blue-500">
                        <strong className="text-blue-400 text-sm font-bold uppercase tracking-wider block mb-1">2. Condensation</strong>
                        <p className="text-[11px] text-slate-400 leading-relaxed">
                          Vapor enters the Liebig condenser. Cold water in the outer jacket removes heat energy, liquefying the vapor back into pure liquid.
                        </p>
                      </div>
                    </div>
                  </div>

                  {/* Hoses & Ignition Controls */}
                  <div className="flex-1 bg-slate-800 rounded-2xl border border-slate-700 p-5 flex flex-col shadow-xl anim-fade-in">
                     <h2 className="text-xs uppercase tracking-widest text-slate-200 font-bold mb-4 flex items-center gap-2">
                      <Wind size={16} className="text-cyan-400" /> Hose Inventory
                     </h2>
                     <p className="text-[10px] text-slate-400 mb-4">Drag hoses to the condenser ports to establish a cooling current.</p>
                     
                     <div className="flex flex-col gap-3">
                        {/* Hose In */}
                        <div 
                          draggable={processState === 'setup' && !Object.values(ports).includes('water_in')}
                          onDragStart={(e) => handleDragStart(e, 'water_in')}
                          className={`p-3 rounded-lg border-2 flex items-center justify-between transition-all ${
                            Object.values(ports).includes('water_in') 
                            ? 'bg-slate-900 border-slate-700 opacity-40 cursor-not-allowed' 
                            : 'bg-slate-800 border-cyan-500 hover:bg-slate-700 cursor-grab active:cursor-grabbing shadow-[0_0_10px_rgba(6,182,212,0.2)]'
                          }`}
                        >
                           <div>
                             <div className="text-sm font-bold text-cyan-400">Cold Water Source</div>
                             <div className="text-[10px] text-slate-400 font-mono">FLOW IN</div>
                           </div>
                           <div className="w-8 h-8 rounded-full bg-cyan-900 flex items-center justify-center border border-cyan-500">
                             <Droplets size={16} className="text-cyan-400" />
                           </div>
                        </div>

                        {/* Hose Out */}
                        <div 
                          draggable={processState === 'setup' && !Object.values(ports).includes('water_out')}
                          onDragStart={(e) => handleDragStart(e, 'water_out')}
                          className={`p-3 rounded-lg border-2 flex items-center justify-between transition-all ${
                            Object.values(ports).includes('water_out') 
                            ? 'bg-slate-900 border-slate-700 opacity-40 cursor-not-allowed' 
                            : 'bg-slate-800 border-rose-400 hover:bg-slate-700 cursor-grab active:cursor-grabbing shadow-[0_0_10px_rgba(251,113,133,0.2)]'
                          }`}
                        >
                           <div>
                             <div className="text-sm font-bold text-rose-400">Waste Drain</div>
                             <div className="text-[10px] text-slate-400 font-mono">FLOW OUT</div>
                           </div>
                           <div className="w-8 h-8 rounded-full bg-rose-900 flex items-center justify-center border border-rose-500">
                             <Activity size={16} className="text-rose-400" />
                           </div>
                        </div>
                     </div>

                     <div className="flex flex-col gap-3 mt-auto">
                       <button 
                         onClick={igniteBurner}
                         disabled={processState !== 'setup'}
                         className={`w-full py-4 rounded-xl font-bold uppercase tracking-widest flex items-center justify-center gap-2 transition-all shadow-lg ${
                           processState === 'setup' 
                           ? 'bg-orange-600 hover:bg-orange-500 text-white shadow-orange-900/50' 
                           : 'bg-slate-900 text-slate-600 border border-slate-700 cursor-not-allowed'
                         }`}
                       >
                         <Flame size={18} /> {processState === 'setup' ? 'Ignite Burner' : 'Heating Active'}
                       </button>

                       {processState === 'distilling' && (
                         <button 
                           onClick={finishDistillationEarly}
                           className="w-full py-2 bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg text-xs font-bold transition-colors shadow-lg"
                         >
                           Fast-Forward & Finish
                         </button>
                       )}

                       {processState === 'complete' && (
                         <button 
                           onClick={startVerification}
                           className="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-sm font-bold transition-colors shadow-lg shadow-emerald-900/50"
                         >
                           Verify Water Purity
                         </button>
                       )}
                     </div>
                  </div>
                </>
              ) : (
                /* Verification View Controls */
                <div className="flex-1 bg-slate-800 rounded-2xl border border-slate-700 p-5 flex flex-col shadow-xl anim-fade-in">
                   <h2 className="text-xs uppercase tracking-widest text-slate-200 font-bold mb-4 flex items-center gap-2">
                    <Thermometer size={16} className="text-emerald-400" /> Purity Verification
                   </h2>
                   <div className="p-4 bg-slate-900 rounded-xl border border-slate-700 shadow-inner mb-4">
                     <p className="text-xs text-slate-300 leading-relaxed mb-2">
                       Pure substances have sharp, exact boiling points. By measuring the boiling point of our collected distillate, we can verify its purity.
                     </p>
                     <p className="text-xs text-slate-400 leading-relaxed border-l-2 border-emerald-500 pl-2">
                       Pure water boils at exactly <strong>100°C</strong>. Impurities (like salt) would elevate this boiling point.
                     </p>
                   </div>
                   
                   <button 
                     onClick={igniteVerifyBurner}
                     disabled={processState !== 'verify_setup'}
                     className={`mt-auto w-full py-4 rounded-xl font-bold uppercase tracking-widest flex items-center justify-center gap-2 transition-all shadow-lg ${
                       processState === 'verify_setup' 
                       ? 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-emerald-900/50' 
                       : 'bg-slate-900 text-slate-600 border border-slate-700 cursor-not-allowed'
                     }`}
                   >
                     <Flame size={18} /> {processState === 'verify_setup' ? 'Ignite Burner' : 'Heating Active'}
                   </button>
                </div>
              )}
            </div>

            {/* RIGHT PANEL: Interactive Canvas & Dashboard */}
            <div className="w-3/4 flex flex-col gap-4">
              
              {/* Dashboard HUD */}
              <div className="flex gap-4 shrink-0">
                 <div className="flex-1 bg-slate-900 border border-slate-700 rounded-2xl p-4 shadow-inner flex items-center justify-between">
                    <div className="flex items-center gap-3">
                      <Thermometer className={isBoilingState ? 'text-rose-500' : 'text-slate-400'} size={24} />
                      <div>
                        <div className="text-[10px] uppercase font-bold text-slate-500 tracking-widest">Temperature</div>
                        <div className={`font-mono text-2xl font-black ${isBoilingState ? 'text-rose-400' : 'text-slate-200'}`}>{currentTemp}°C</div>
                      </div>
                    </div>
                    {isBoilingState && <span className="text-xs font-bold text-rose-500 bg-rose-950 px-2 py-1 rounded animate-pulse">BOILING POINT</span>}
                 </div>

                 <div className={`flex-[2] rounded-2xl border p-4 shadow-lg flex items-center gap-3 transition-all duration-300 ${
                   feedback.status === 'error' ? 'bg-rose-900/30 border-rose-500 text-rose-200' : 
                   feedback.status === 'success' ? 'bg-emerald-900/30 border-emerald-500 text-emerald-200' : 
                   'bg-slate-800 border-slate-700 text-slate-300'
                 }`}>
                    {feedback.status === 'error' ? <AlertTriangle className="shrink-0 text-rose-400" /> : 
                     feedback.status === 'success' ? <CheckCircle2 className="shrink-0 text-emerald-400" /> : 
                     <Activity className="shrink-0 text-slate-500" />}
                    <p className="text-sm font-medium">{feedback.message}</p>
                 </div>
              </div>

              {/* Central SVG Canvas */}
              <div className="flex-1 bg-slate-800/80 border border-slate-700 rounded-2xl p-4 flex items-center justify-center relative shadow-xl overflow-hidden">
                 <div className="absolute top-4 left-6 text-slate-500 text-xs uppercase font-bold tracking-widest z-10">
                   {processState.startsWith('verify') ? 'Purity Verification Station' : 'Distillation Apparatus'}
                 </div>

                 <svg viewBox="0 0 500 400" className="w-full h-full max-h-[500px] overflow-visible">
                    <defs>
                      <linearGradient id="coolWater" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0%" stopColor="rgba(34, 211, 238, 0.4)" />
                        <stop offset="100%" stopColor="rgba(56, 189, 248, 0.6)" />
                      </linearGradient>
                      <linearGradient id="seaWater" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stopColor="rgba(30, 64, 175, 0.6)" />
                        <stop offset="100%" stopColor="rgba(30, 58, 138, 0.8)" />
                      </linearGradient>
                    </defs>

                    {/* === DISTILLATION APPARATUS === */}
                    {!processState.startsWith('verify') ? (
                      <g className="anim-fade-in">
                        {/* --- BURNER --- */}
                        <g transform="translate(60, 310)">
                           <rect x="10" y="20" width="20" height="60" fill="#475569" stroke="#334155" strokeWidth="2" />
                           <path d="M 0,80 L 40,80 L 45,90 L -5,90 Z" fill="#334155" />
                           {(processState === 'heating' || processState === 'distilling') && (
                             <g transform="translate(20, 20)">
                               {/* Isolated animation group to prevent transform coordinate collision */}
                               <g className="anim-flame">
                                 <path d="M 0,0 Q -15,-20 0,-40 Q 15,-20 0,0" fill="#38bdf8" opacity="0.6" />
                                 <path d="M 0,0 Q -8,-10 0,-20 Q 8,-10 0,0" fill="#60a5fa" />
                               </g>
                             </g>
                           )}
                        </g>

                        {/* --- STANDS & CLAMPS --- */}
                        <rect x="30" y="380" width="100" height="10" fill="#1e293b" />
                        <rect x="40" y="100" width="8" height="280" fill="#334155" />
                        <rect x="48" y="200" width="22" height="6" fill="#64748b" />

                        {/* --- THERMOMETER --- */}
                        {/* Pedagogical Note: The bulb is accurately placed directly parallel to the side-arm (y=140 to 145) to measure vapor, not the bulk liquid. */}
                        <rect x="78" y="40" width="4" height="110" fill="rgba(255,255,255,0.4)" stroke="#94a3b8" strokeWidth="1" rx="2" />
                        <rect x="79" y={140 - (temperature / 102) * 80} width="2" height={(temperature / 102) * 80} fill="#ef4444" className="transition-all duration-300" />
                        <circle cx="80" cy="140" r="4" fill="#ef4444" />
                        
                        <text x="88" y="138" fill="#94a3b8" fontSize="8" fontStyle="italic">Bulb at side-arm</text>

                        {/* --- ROUND BOTTOM FLASK --- */}
                        <g>
                           {/* Liquid Contents */}
                           {flaskVol > 0 && (
                             <g>
                               {/* Base Sea Water */}
                               <circle cx="80" cy="260" r="38" fill="url(#seaWater)" style={{ clipPath: 'polygon(0 50%, 100% 50%, 100% 100%, 0 100%)', transform: `scale(1, ${flaskVol/100})`, transformOrigin: '80px 298px' }} className="transition-all duration-300" />
                               
                               {/* Anti-bumping granules */}
                               <g fill="#94a3b8" opacity={flaskVol/100}>
                                  <polygon points="65,295 68,290 71,296" />
                                  <polygon points="75,298 77,294 80,297" />
                                  <polygon points="85,296 88,292 90,298" />
                               </g>

                               {/* Salt Deposits (Appear as water boils away) */}
                               <circle cx="80" cy="290" r="20" fill="#f8fafc" opacity={1 - (flaskVol/100)} filter="blur(2px)" />
                               <circle cx="70" cy="295" r="5" fill="#e2e8f0" opacity={1 - (flaskVol/100)} />
                               <circle cx="90" cy="292" r="8" fill="#e2e8f0" opacity={1 - (flaskVol/100)} />

                               {/* Boiling Bubbles */}
                               {processState === 'distilling' && (
                                 <g fill="#fff">
                                    <circle cx="70" cy="280" r="3" className="anim-bubble" style={{animationDelay: '0s'}} />
                                    <circle cx="85" cy="290" r="4" className="anim-bubble" style={{animationDelay: '0.3s'}} />
                                    <circle cx="90" cy="270" r="2" className="anim-bubble" style={{animationDelay: '0.6s'}} />
                                    <circle cx="75" cy="275" r="3" className="anim-bubble" style={{animationDelay: '0.9s'}} />
                                 </g>
                               )}
                             </g>
                           )}
                           
                           {/* Glass Body */}
                           <path d="M 70 120 L 70 225 A 40 40 0 1 0 90 225 L 90 150 L 110 150 L 90 140 L 90 120 Z" fill="rgba(255,255,255,0.1)" stroke="#cbd5e1" strokeWidth="3" strokeLinejoin="round" />
                           
                           {/* Steam Animation in Flask */}
                           {processState === 'distilling' && (
                             <path d="M 80 250 L 80 145" fill="none" stroke="rgba(255,255,255,0.7)" strokeWidth="6" strokeLinecap="round" className="anim-steam" />
                           )}
                        </g>

                        {/* --- CONDENSER & SIDE ARM --- */}
                        {processState === 'distilling' && (
                           <path d="M 80 145 L 105 145 L 310 204 L 310 215" fill="none" stroke="rgba(255,255,255,0.7)" strokeWidth="4" strokeLinecap="round" className="anim-steam" />
                        )}

                        <g transform="translate(100, 140) rotate(17)">
                           {/* Inner Tube */}
                           <rect x="0" y="-5" width="220" height="10" fill="rgba(255,255,255,0.05)" stroke="#cbd5e1" strokeWidth="2" />
                           
                           {/* Outer Cooling Jacket */}
                           {ports.top && ports.bottom && processState !== 'setup' ? (
                             <rect x="20" y="-15" width="180" height="30" fill="url(#coolWater)" stroke="#94a3b8" strokeWidth="2" rx="4" />
                           ) : (
                             <rect x="20" y="-15" width="180" height="30" fill="rgba(255,255,255,0.1)" stroke="#94a3b8" strokeWidth="2" rx="4" />
                           )}

                           {/* TOP PORT (Water OUT) */}
                           <g transform="translate(30, -25)">
                             <rect x="0" y="0" width="12" height="10" fill="rgba(255,255,255,0.2)" stroke="#94a3b8" strokeWidth="2" />
                             <rect 
                               x="-10" y="-15" width="32" height="30" fill="transparent" stroke="transparent" strokeWidth="2" rx="4"
                               className={`transition-all cursor-pointer ${dragOverPort === 'top' ? 'drag-over' : ''} ${ports.top ? 'stroke-rose-500 fill-rose-500/20' : 'hover:stroke-slate-500 hover:stroke-dashed'}`}
                               onDragOver={(e) => handleDragOver(e, 'top')}
                               onDragLeave={handleDragLeave}
                               onDrop={(e) => handleDrop(e, 'top')}
                               onClick={() => removeHose('top')}
                             />
                             {ports.top && (
                               <path d="M 6 -15 L 6 -60" fill="none" stroke={ports.top === 'water_out' ? '#f43f5e' : '#0ea5e9'} strokeWidth="8" strokeLinecap="round" />
                             )}
                           </g>

                           {/* BOTTOM PORT (Water IN) */}
                           <g transform="translate(180, 15)">
                             <rect x="0" y="0" width="12" height="10" fill="rgba(255,255,255,0.2)" stroke="#94a3b8" strokeWidth="2" />
                             <rect 
                               x="-10" y="5" width="32" height="30" fill="transparent" stroke="transparent" strokeWidth="2" rx="4"
                               className={`transition-all cursor-pointer ${dragOverPort === 'bottom' ? 'drag-over' : ''} ${ports.bottom ? 'stroke-cyan-500 fill-cyan-500/20' : 'hover:stroke-slate-500 hover:stroke-dashed'}`}
                               onDragOver={(e) => handleDragOver(e, 'bottom')}
                               onDragLeave={handleDragLeave}
                               onDrop={(e) => handleDrop(e, 'bottom')}
                               onClick={() => removeHose('bottom')}
                             />
                             {ports.bottom && (
                               <path d="M 6 25 L 6 80" fill="none" stroke={ports.bottom === 'water_in' ? '#0ea5e9' : '#f43f5e'} strokeWidth="8" strokeLinecap="round" />
                             )}
                           </g>
                        </g>

                        {/* Condenser vertical delivery tube adapter */}
                        <path d="M 310 204 L 310 215" fill="none" stroke="#cbd5e1" strokeWidth="3" strokeLinecap="round" />

                        {/* Drip Animation (Drops precisely into the beaker opening at Y=270) */}
                        {processState === 'distilling' && (
                          <circle cx="310" cy="215" r="3" fill="#38bdf8" className="anim-drip" />
                        )}

                        {/* --- COLLECTING BEAKER --- */}
                        <g transform="translate(280, 270)">
                           {beakerVol > 0 && (
                             <rect x="5" y={60 - (beakerVol/100)*50} width="50" height={(beakerVol/100)*50} fill="rgba(56, 189, 248, 0.4)" rx="2" className="transition-all duration-300" />
                           )}
                           <path d="M 0,0 L 5,60 Q 5,65 10,65 L 50,65 Q 55,65 55,60 L 60,0" fill="rgba(255,255,255,0.1)" stroke="#cbd5e1" strokeWidth="3" />
                           <line x1="-5" y1="0" x2="65" y2="0" stroke="#cbd5e1" strokeWidth="3" strokeLinecap="round" />
                        </g>
                      </g>

                    ) : (

                      /* === PURITY VERIFICATION STATION === */
                      <g className="anim-fade-in" transform="translate(170, 50)">
                        {/* Tripod Stand */}
                        <rect x="-30" y="250" width="160" height="8" fill="#1e293b" />
                        <rect x="-20" y="258" width="6" height="80" fill="#334155" />
                        <rect x="114" y="258" width="6" height="80" fill="#334155" />
                        
                        {/* Verification Burner */}
                        <g transform="translate(40, 260)">
                           <rect x="0" y="20" width="20" height="60" fill="#475569" stroke="#334155" strokeWidth="2" />
                           <path d="M -10,80 L 30,80 L 35,90 L -15,90 Z" fill="#334155" />
                           {processState === 'verify_heating' || processState === 'verify_boiling' ? (
                             <g transform="translate(10, 20)">
                               <g className="anim-flame">
                                 <path d="M 0,0 Q -15,-20 0,-40 Q 15,-20 0,0" fill="#38bdf8" opacity="0.6" />
                                 <path d="M 0,0 Q -8,-10 0,-20 Q 8,-10 0,0" fill="#60a5fa" />
                               </g>
                             </g>
                           ) : null}
                        </g>
                        
                        {/* Beaker with collected pure water */}
                        <g transform="translate(20, 150)">
                           {/* Pure Water */}
                           <rect x="5" y="50" width="50" height="50" fill="rgba(56, 189, 248, 0.4)" rx="2" />
                           
                           {/* Anti-bumping granules in verification beaker */}
                           <g fill="#94a3b8">
                              <polygon points="20,95 23,90 26,96" />
                              <polygon points="35,98 37,94 40,97" />
                           </g>

                           {/* Boiling Bubbles */}
                           {processState === 'verify_boiling' && (
                             <g fill="#fff">
                                <circle cx="20" cy="90" r="2" className="anim-bubble" style={{animationDelay: '0s'}} />
                                <circle cx="35" cy="85" r="3" className="anim-bubble" style={{animationDelay: '0.2s'}} />
                                <circle cx="40" cy="95" r="2" className="anim-bubble" style={{animationDelay: '0.4s'}} />
                                <circle cx="25" cy="80" r="3" className="anim-bubble" style={{animationDelay: '0.6s'}} />
                             </g>
                           )}
                           {/* Glass Outline */}
                           <path d="M 0,0 L 5,100 Q 5,105 10,105 L 50,105 Q 55,105 55,100 L 60,0" fill="rgba(255,255,255,0.1)" stroke="#cbd5e1" strokeWidth="3" />
                           <line x1="-5" y1="0" x2="65" y2="0" stroke="#cbd5e1" strokeWidth="3" strokeLinecap="round" />
                        </g>

                        {/* Verification Thermometer */}
                        <rect x="48" y="-20" width="4" height="200" fill="rgba(255,255,255,0.4)" stroke="#94a3b8" strokeWidth="1" rx="2" />
                        {/* Scale: min 0C at height 0, max 100C at height 120. */}
                        <rect x="49" y={180 - (verifyTemp * 1.2)} width="2" height={verifyTemp * 1.2} fill="#ef4444" className="transition-all duration-300" />
                        <circle cx="50" cy="180" r="4" fill="#ef4444" />
                      </g>
                    )}
                 </svg>
              </div>

            </div>

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
