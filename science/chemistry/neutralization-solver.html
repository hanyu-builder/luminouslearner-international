<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neutralization Calculation Practice | Acid-Base Solver</title>
    <meta name="description" content="Neutralization calculation practice simulator. Solve acid-base titration problems using dynamic stoichiometric equivalence equations.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: { 850: '#151e2e', 900: '#0F172A', 950: '#020617' },
                        chem: {
                            acid: '#EF4444', // Red
                            base: '#3B82F6', // Blue
                            math: '#10B981'  // Emerald
                        }
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- KaTeX for Math Typesetting -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js" crossorigin="anonymous"></script>

    <style>
        body { margin: 0; background-color: #020617; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .bg-grid {
            background-image: radial-gradient(circle at 2px 2px, rgba(30, 41, 59, 0.4) 1px, transparent 0);
            background-size: 30px 30px;
        }

        /* KaTeX Overrides for Dark Mode */
        .katex { color: #e2e8f0; }
        .katex-display { margin: 0; padding: 10px 0; overflow-x: auto; overflow-y: hidden; }
    </style>
</head>
<body class="text-slate-200 selection:bg-emerald-500 selection:text-white min-h-screen bg-grid flex items-center justify-center p-4 md:p-8">

    <div id="root" class="w-full max-w-6xl"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Database ---
        const REACTIONS = [
            {
                id: 'hcl_naoh',
                name: 'Hydrochloric Acid + Sodium Hydroxide',
                acid: 'HCl', base: 'NaOH',
                na: 1, nb: 1,
                latexEq: '\\text{HCl}_{\\text{(aq)}} + \\text{NaOH}_{\\text{(aq)}} \\rightarrow \\text{NaCl}_{\\text{(aq)}} + \\text{H}_2\\text{O}_{\\text{(l)}}'
            },
            {
                id: 'h2so4_naoh',
                name: 'Sulfuric Acid + Sodium Hydroxide',
                acid: 'H₂SO₄', base: 'NaOH',
                na: 1, nb: 2,
                latexEq: '\\text{H}_2\\text{SO}_{4\\text{(aq)}} + 2\\text{NaOH}_{\\text{(aq)}} \\rightarrow \\text{Na}_2\\text{SO}_{4\\text{(aq)}} + 2\\text{H}_2\\text{O}_{\\text{(l)}}'
            },
            {
                id: 'h3po4_koh',
                name: 'Phosphoric Acid + Potassium Hydroxide',
                acid: 'H₃PO₄', base: 'KOH',
                na: 1, nb: 3,
                latexEq: '\\text{H}_3\\text{PO}_{4\\text{(aq)}} + 3\\text{KOH}_{\\text{(aq)}} \\rightarrow \\text{K}_3\\text{PO}_{4\\text{(aq)}} + 3\\text{H}_2\\text{O}_{\\text{(l)}}'
            },
            {
                id: 'hno3_caoh2',
                name: 'Nitric Acid + Calcium Hydroxide',
                acid: 'HNO₃', base: 'Ca(OH)₂',
                na: 2, nb: 1,
                latexEq: '2\\text{HNO}_{3\\text{(aq)}} + \\text{Ca(OH)}_{2\\text{(aq)}} \\rightarrow \\text{Ca(NO}_3)_{2\\text{(aq)}} + 2\\text{H}_2\\text{O}_{\\text{(l)}}'
            }
        ];

        // --- Icons ---
        const Calculator = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="16" y1="14" x2="16" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></svg>;
        const Beaker = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4.5 3h15"/><path d="M6 3v16a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V3"/><path d="M6 14h12"/></svg>;
        const AlertCircle = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>;

        // --- KaTeX Wrapper Component ---
        const Latex = ({ math, block = false }) => {
            const containerRef = useRef(null);
            useEffect(() => {
                if (containerRef.current && window.katex) {
                    try {
                        katex.render(math, containerRef.current, {
                            displayMode: block,
                            throwOnError: false,
                            strict: false
                        });
                    } catch (e) { console.error(e); }
                }
            }, [math, block]);
            return <span ref={containerRef} />;
        };

        function App() {
            // State
            const [activeReactionId, setActiveReactionId] = useState('h2so4_naoh');
            
            const [ca, setCa] = useState('0.100'); // Molarity Acid
            const [va, setVa] = useState('25.0');  // Volume Acid
            const [cb, setCb] = useState('');      // Molarity Base (Unknown)
            const [vb, setVb] = useState('20.0');  // Volume Base
            
            const [solution, setSolution] = useState(null);
            const [error, setError] = useState('');

            const rxn = REACTIONS.find(r => r.id === activeReactionId);

            // --- Engine Logic ---
            const handleSolve = () => {
                setError('');
                setSolution(null);

                const v_ca = parseFloat(ca);
                const v_va = parseFloat(va);
                const v_cb = parseFloat(cb);
                const v_vb = parseFloat(vb);

                const isCaEmpty = isNaN(v_ca) || ca.trim() === '';
                const isVaEmpty = isNaN(v_va) || va.trim() === '';
                const isCbEmpty = isNaN(v_cb) || cb.trim() === '';
                const isVbEmpty = isNaN(v_vb) || vb.trim() === '';

                const emptyCount = [isCaEmpty, isVaEmpty, isCbEmpty, isVbEmpty].filter(Boolean).length;

                if (emptyCount !== 1) {
                    setError('Exactly ONE field must be left blank to solve for the unknown.');
                    return;
                }

                // Formula: (C_A * V_A) / n_A = (C_B * V_B) / n_B
                const { na, nb } = rxn;
                let ans = 0;
                let target = '';
                let derivation = [];

                derivation.push(`\\frac{C_A \\times V_A}{n_A} = \\frac{C_B \\times V_B}{n_B}`);
                derivation.push(`\\text{From the equation: } n_A = ${na}, n_B = ${nb}`);

                if (isCaEmpty) {
                    target = 'C_A';
                    ans = (na * v_cb * v_vb) / (nb * v_va);
                    derivation.push(`C_A = \\frac{n_A \\times C_B \\times V_B}{n_B \\times V_A}`);
                    derivation.push(`C_A = \\frac{${na} \\times ${v_cb} \\times ${v_vb}}{${nb} \\times ${v_va}}`);
                } else if (isVaEmpty) {
                    target = 'V_A';
                    ans = (na * v_cb * v_vb) / (nb * v_ca);
                    derivation.push(`V_A = \\frac{n_A \\times C_B \\times V_B}{n_B \\times C_A}`);
                    derivation.push(`V_A = \\frac{${na} \\times ${v_cb} \\times ${v_vb}}{${nb} \\times ${v_ca}}`);
                } else if (isCbEmpty) {
                    target = 'C_B';
                    ans = (nb * v_ca * v_va) / (na * v_vb);
                    derivation.push(`C_B = \\frac{n_B \\times C_A \\times V_A}{n_A \\times V_B}`);
                    derivation.push(`C_B = \\frac{${nb} \\times ${v_ca} \\times ${v_va}}{${na} \\times ${v_vb}}`);
                } else if (isVbEmpty) {
                    target = 'V_B';
                    ans = (nb * v_ca * v_va) / (na * v_cb);
                    derivation.push(`V_B = \\frac{n_B \\times C_A \\times V_A}{n_A \\times C_B}`);
                    derivation.push(`V_B = \\frac{${nb} \\times ${v_ca} \\times ${v_va}}{${na} \\times ${v_cb}}`);
                }

                derivation.push(`\\mathbf{${target} = ${ans.toFixed(4)}}`);

                setSolution({ target, ans, derivation });
            };

            const clearFields = () => {
                setCa(''); setVa(''); setCb(''); setVb('');
                setSolution(null); setError('');
            };

            return (
                <div className="w-full bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl overflow-hidden flex flex-col min-h-[600px]">
                    
                    {/* Header */}
                    <header className="p-6 md:p-8 border-b border-slate-800 bg-slate-950 flex flex-col md:flex-row justify-between items-center gap-6">
                        <div className="flex items-center gap-4">
                            <div className="p-3 bg-emerald-500/20 rounded-xl text-emerald-400">
                                <Calculator />
                            </div>
                            <div>
                                <h1 className="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-emerald-400 to-teal-400">
                                    Neutralization Solver
                                </h1>
                                <p className="text-sm text-slate-400 mt-1">C₁V₁ = C₂V₂ Equivalence Engine</p>
                            </div>
                        </div>
                        
                        <div className="w-full md:w-auto">
                            <label className="text-xs font-semibold text-slate-500 uppercase tracking-wider block mb-2">Select Titration System</label>
                            <select 
                                className="w-full md:w-80 bg-slate-900 border border-slate-700 rounded-xl p-3 text-slate-200 outline-none focus:border-emerald-500 transition-colors shadow-inner font-medium text-sm cursor-pointer"
                                value={activeReactionId}
                                onChange={(e) => {
                                    setActiveReactionId(e.target.value);
                                    setSolution(null);
                                }}
                            >
                                {REACTIONS.map(r => (
                                    <option key={r.id} value={r.id}>{r.name}</option>
                                ))}
                            </select>
                        </div>
                    </header>

                    {/* Main Content Grid */}
                    <div className="grid grid-cols-1 lg:grid-cols-2 flex-grow">
                        
                        {/* Left Panel: Inputs */}
                        <section className="p-6 md:p-8 border-b lg:border-b-0 lg:border-r border-slate-800 bg-slate-900/50 flex flex-col">
                            
                            <div className="mb-6 flex justify-between items-center">
                                <h2 className="text-xs font-bold text-slate-400 uppercase tracking-widest flex items-center gap-2">
                                    <Beaker className="w-4 h-4 text-slate-500" /> Experimental Parameters
                                </h2>
                                <button onClick={clearFields} className="text-xs text-slate-500 hover:text-slate-300 transition-colors">Clear All</button>
                            </div>

                            <div className="space-y-6">
                                {/* Acid Inputs */}
                                <div className="bg-red-500/5 border border-red-500/20 rounded-2xl p-5">
                                    <h3 className="text-sm font-bold text-red-400 mb-4">{rxn.acid} (Acid)</h3>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="text-[10px] uppercase text-slate-500 font-bold mb-1 block">Molarity (C_A) [mol/dm³]</label>
                                            <input type="number" step="0.001" placeholder="Unknown" value={ca} onChange={e=>setCa(e.target.value)}
                                                className="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-slate-200 focus:border-red-500 outline-none shadow-inner font-mono text-sm placeholder-slate-600" />
                                        </div>
                                        <div>
                                            <label className="text-[10px] uppercase text-slate-500 font-bold mb-1 block">Volume (V_A) [cm³]</label>
                                            <input type="number" step="0.1" placeholder="Unknown" value={va} onChange={e=>setVa(e.target.value)}
                                                className="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-slate-200 focus:border-red-500 outline-none shadow-inner font-mono text-sm placeholder-slate-600" />
                                        </div>
                                    </div>
                                </div>

                                {/* Base Inputs */}
                                <div className="bg-blue-500/5 border border-blue-500/20 rounded-2xl p-5">
                                    <h3 className="text-sm font-bold text-blue-400 mb-4">{rxn.base} (Base)</h3>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="text-[10px] uppercase text-slate-500 font-bold mb-1 block">Molarity (C_B) [mol/dm³]</label>
                                            <input type="number" step="0.001" placeholder="Unknown" value={cb} onChange={e=>setCb(e.target.value)}
                                                className="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-slate-200 focus:border-blue-500 outline-none shadow-inner font-mono text-sm placeholder-slate-600" />
                                        </div>
                                        <div>
                                            <label className="text-[10px] uppercase text-slate-500 font-bold mb-1 block">Volume (V_B) [cm³]</label>
                                            <input type="number" step="0.1" placeholder="Unknown" value={vb} onChange={e=>setVb(e.target.value)}
                                                className="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-slate-200 focus:border-blue-500 outline-none shadow-inner font-mono text-sm placeholder-slate-600" />
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Action Button & Error */}
                            <div className="mt-8 mt-auto pt-4">
                                {error && (
                                    <div className="mb-4 bg-rose-500/10 border border-rose-500/30 text-rose-400 px-4 py-3 rounded-xl flex items-start gap-3 text-xs animate-in fade-in">
                                        <AlertCircle className="shrink-0 mt-0.5 w-4 h-4" />
                                        <p>{error}</p>
                                    </div>
                                )}
                                <button 
                                    onClick={handleSolve}
                                    className="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold py-4 rounded-xl transition-all shadow-lg active:scale-[0.98]"
                                >
                                    Check Answer / Solve
                                </button>
                            </div>

                        </section>

                        {/* Right Panel: Algorithmic Output */}
                        <section className="p-6 md:p-8 bg-slate-950 flex flex-col relative overflow-hidden">
                            
                            {/* Balanced Equation */}
                            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl mb-6 relative">
                                <span className="absolute top-0 left-0 bg-slate-800 text-[9px] text-slate-400 px-2 py-1 rounded-br-lg rounded-tl-2xl uppercase tracking-widest font-bold">Reaction</span>
                                <div className="mt-2 text-center text-lg md:text-xl text-slate-200">
                                    <Latex math={rxn.latexEq} block={true} />
                                </div>
                                <div className="mt-4 flex justify-center gap-6 text-sm">
                                    <span className="bg-red-500/10 text-red-400 px-3 py-1 rounded-lg border border-red-500/20 font-mono">n_A = {rxn.na}</span>
                                    <span className="bg-blue-500/10 text-blue-400 px-3 py-1 rounded-lg border border-blue-500/20 font-mono">n_B = {rxn.nb}</span>
                                </div>
                            </div>

                            {/* Solution Output */}
                            {!solution ? (
                                <div className="flex-grow flex flex-col items-center justify-center border-2 border-dashed border-slate-800 rounded-2xl text-slate-500 p-8 text-center bg-slate-900/30">
                                    <Calculator className="w-12 h-12 opacity-20 mb-4" />
                                    <h3 className="font-bold text-slate-400">Awaiting Variables</h3>
                                    <p className="text-sm mt-2 max-w-sm">Leave exactly one field blank on the left and click "Solve" to see the algorithmic breakdown.</p>
                                </div>
                            ) : (
                                <div className="flex-grow bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl flex flex-col animate-in fade-in slide-in-from-bottom-4 duration-500">
                                    <h3 className="text-xs font-bold text-slate-400 uppercase tracking-widest border-b border-slate-800 pb-3 mb-4">
                                        Step-by-Step Resolution
                                    </h3>
                                    
                                    <div className="space-y-6 text-base md:text-lg text-slate-300 overflow-x-auto no-scrollbar pb-4 flex-grow">
                                        {solution.derivation.map((step, idx) => (
                                            <div key={idx} className={`${idx === solution.derivation.length - 1 ? 'text-emerald-400 scale-110 transform origin-left ml-4 mt-8' : ''} transition-all`}>
                                                <Latex math={step} block={true} />
                                            </div>
                                        ))}
                                    </div>
                                    
                                    <div className="mt-auto pt-4 border-t border-slate-800 text-center">
                                        <p className="text-sm text-slate-500">The unknown parameter <span className="font-mono font-bold text-slate-300">{solution.target}</span> was successfully calculated based on the stoichiometric ratio.</p>
                                    </div>
                                </div>
                            )}

                        </section>
                    </div>

                </div>
            );
        }

        // --- Render Application ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
