<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Methanol Synthesis Process Simulation</title>
  <meta name="description" content="Interactive methanol synthesis process simulation. Explore the thermodynamic compromise between pressure, temperature, and catalytic efficiency in syngas conversion.">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for in-browser JSX transpilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { background-color: #0F172A; margin: 0; overflow: hidden; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    
    /* Custom Scrollbar */
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(30, 41, 59, 0.5); }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(71, 85, 105, 0.8); border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 1); }

    /* Flowing Gas Animation */
    @keyframes flow {
      from { stroke-dashoffset: 20; }
      to { stroke-dashoffset: 0; }
    }
    .animate-flow {
      stroke-dasharray: 4 6;
      animation: flow linear infinite;
    }

    /* Range Slider Styling */
    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      background: transparent;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 20px;
      width: 20px;
      border-radius: 50%;
      background: #06b6d4;
      cursor: pointer;
      margin-top: -8px;
      box-shadow: 0 0 10px rgba(6, 182, 212, 0.5);
      border: 2px solid #fff;
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 4px;
      cursor: pointer;
      background: #334155;
      border-radius: 2px;
    }
    input[type=range]:focus {
      outline: none;
    }
    
    /* Transitions */
    .fade-value { transition: color 0.3s ease; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- ICON COMPONENTS ---
    const SvgIcon = ({ children, size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
    );
    const Activity = (p) => <SvgIcon {...p}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12" /></SvgIcon>;
    const Info = (p) => <SvgIcon {...p}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></SvgIcon>;
    const Settings = (p) => <SvgIcon {...p}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></SvgIcon>;
    const Gauge = (p) => <SvgIcon {...p}><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></SvgIcon>;
    const DollarSign = (p) => <SvgIcon {...p}><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></SvgIcon>;

    // --- THERMODYNAMIC ENGINE ---
    // Methanol Synthesis: CO + 2H2 ⇌ CH3OH (Exothermic, ΔH = -90.8 kJ/mol)

    const calcEquilibriumYield = (temp, pressure) => {
      // Lower Temp favors forward reaction (Exothermic)
      // Higher Pressure favors forward reaction (3 moles gas -> 1 mole gas)
      const tEffect = (temp - 250) * -0.25; 
      const pEffect = Math.log10(pressure / 50) * 35;
      const baseYield = 70; // Assumed at 250C and 50 atm
      let yieldPercent = baseYield + tEffect + pEffect;
      return Math.max(2, Math.min(99.9, yieldPercent));
    };

    const calcReactionRate = (temp, isModernCatalyst) => {
      // Activation temperature: Modern Cu/ZnO ~220C, Old ZnO/Cr2O3 ~340C
      const activationT = isModernCatalyst ? 210 : 340;
      // Sigmoid function mapping 0 to 100
      const rate = 100 / (1 + Math.exp(-(temp - activationT) / 25));
      return Math.max(0.1, Math.min(100, rate));
    };

    const calcCostPenalty = (pressure) => {
      // Exponentially increasing cost for high-pressure compressors & piping
      // Base cost is low up to 100 atm, then skyrockets
      if (pressure <= 80) return 0;
      return Math.pow((pressure - 80) / 40, 1.8) * 3; // Tuned penalty curve
    };

    function App() {
      // State Parameters
      const [temperature, setTemperature] = useState(250); // °C (Range: 150 - 450)
      const [pressure, setPressure] = useState(50);        // atm (Range: 10 - 350)
      const [isModernCatalyst, setIsModernCatalyst] = useState(true);

      // Calculations
      const yieldPct = calcEquilibriumYield(temperature, pressure);
      const ratePct = calcReactionRate(temperature, isModernCatalyst);
      const rawEfficiency = (yieldPct * ratePct) / 100;
      
      const costPenalty = calcCostPenalty(pressure);
      const economicScore = Math.max(0, rawEfficiency - costPenalty);

      // Reactor visual dynamically shifts from cool steel to glowing red hot based on Temp
      const getReactorGlow = () => {
        if (temperature < 200) return 'rgba(56, 189, 248, 0.1)'; // Cool blue
        if (temperature < 300) return 'rgba(234, 179, 8, 0.3)';  // Warm yellow
        if (temperature < 400) return 'rgba(249, 115, 22, 0.5)'; // Hot orange
        return 'rgba(239, 68, 68, 0.7)';                         // Danger red
      };

      // Flow speed visual based on production efficiency
      const getFlowSpeed = () => {
        if (rawEfficiency < 5) return '0s'; // Stopped
        const speed = Math.max(0.2, 2 - (rawEfficiency / 100) * 1.8);
        return `${speed}s`;
      };

      // --- NATIVE SVG GRAPH ENGINE ---
      const generateGraphPoints = () => {
        const pointsYield = [];
        const pointsRate = [];
        const pointsEcon = [];
        const minT = 150, maxT = 450, steps = 60;
        
        for (let i = 0; i <= steps; i++) {
          const t = minT + (i / steps) * (maxT - minT);
          const x = (i / steps) * 100; // % width
          
          const yld = calcEquilibriumYield(t, pressure);
          const rte = calcReactionRate(t, isModernCatalyst);
          const eff = (yld * rte) / 100;
          const econ = Math.max(0, eff - calcCostPenalty(pressure));
          
          // SVG Y goes top-down, so invert (100 - val)
          pointsYield.push(`${x},${100 - yld}`);
          pointsRate.push(`${x},${100 - rte}`);
          pointsEcon.push(`${x},${100 - econ}`);
        }
        return { yield: pointsYield.join(' '), rate: pointsRate.join(' '), econ: pointsEcon.join(' ') };
      };

      const graphData = useMemo(() => generateGraphPoints(), [pressure, isModernCatalyst]);
      const currentXPos = ((temperature - 150) / 300) * 100;

      return (
        <div className="min-h-screen bg-slate-900 flex flex-col font-sans overflow-hidden selection:bg-cyan-500/30">
          
          {/* HEADER */}
          <header className="flex justify-between items-center px-6 py-4 bg-slate-800/80 border-b border-slate-700 shadow-lg shrink-0">
            <div className="flex items-center gap-3">
              <Activity className="text-cyan-400" size={28} />
              <div>
                <h1 className="text-2xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">
                  Methanol Synthesis Process Simulation
                </h1>
                <p className="text-xs text-slate-400 font-medium">Thermodynamic & Kinetic Optimization Engine</p>
              </div>
            </div>
            <div className="hidden lg:flex items-center gap-4 bg-slate-900 border border-slate-700 px-4 py-2 rounded-xl shadow-inner">
              <div className="text-[10px] text-slate-500 uppercase tracking-widest font-bold text-right leading-tight">
                Process<br/>Profitability
              </div>
              <div className={`text-2xl font-black font-mono flex items-center fade-value ${economicScore > 60 ? 'text-emerald-400' : economicScore > 30 ? 'text-amber-400' : 'text-rose-500'}`}>
                <DollarSign size={20} className="mr-1 opacity-70" />
                {economicScore.toFixed(1)}
              </div>
            </div>
          </header>

          <main className="flex-1 flex gap-4 p-4 overflow-hidden max-h-[calc(100vh-80px)]">
            
            {/* LEFT PANEL: Theory & Information */}
            <div className="w-1/4 bg-slate-800/50 border border-slate-700 rounded-2xl p-5 flex flex-col overflow-y-auto custom-scrollbar shadow-inner shrink-0">
              <h2 className="text-sm uppercase tracking-widest text-slate-400 font-bold mb-4 flex items-center gap-2">
                <Info size={16} /> Chemistry Rules
              </h2>
              
              <div className="bg-slate-900/50 rounded-xl p-4 border border-slate-700 mb-4">
                <p className="text-[10px] text-slate-400 uppercase font-bold tracking-wider mb-2">Target Reaction (Syngas)</p>
                <div className="font-mono text-sm text-slate-200 text-center font-bold tracking-wider">
                  <span className="text-blue-400">CO</span>(g) + <span className="text-cyan-400">2H₂</span>(g) ⇌ <span className="text-emerald-400">CH₃OH</span>(g)
                </div>
                <div className="mt-2 text-center text-xs text-rose-400 font-bold border-t border-slate-700/50 pt-2">
                  ΔH = -90.8 kJ/mol (Exothermic)
                </div>
              </div>

              <div className="flex flex-col gap-3 text-sm">
                <div className="p-3 bg-slate-800 rounded-lg border-l-4 border-l-rose-500">
                  <strong className="text-slate-200">Temperature Compromise</strong>
                  <p className="text-xs text-slate-400 mt-1">Because the reaction is exothermic, <span className="text-rose-400">lower temperatures</span> favor a higher equilibrium yield. However, if the temperature is too low, the reaction <span className="text-rose-400">rate</span> drops to zero.</p>
                </div>

                <div className="p-3 bg-slate-800 rounded-lg border-l-4 border-l-blue-500">
                  <strong className="text-slate-200">Pressure Principle</strong>
                  <p className="text-xs text-slate-400 mt-1">3 moles of reactant gas form 1 mole of product gas. By Le Chatelier's principle, <span className="text-blue-400">higher pressures</span> force the reaction forward, increasing yield.</p>
                </div>

                <div className="p-3 bg-slate-800 rounded-lg border-l-4 border-l-amber-500">
                  <strong className="text-slate-200">The Industrial Shift</strong>
                  <p className="text-xs text-slate-400 mt-1">The classic BASF process required massive pressures (<span className="text-amber-400">300+ atm</span>) to compensate for the high temperatures needed by older catalysts. The modern ICI process uses a Copper catalyst that activates at just <span className="text-emerald-400">250°C</span>, allowing plants to operate at vastly cheaper, safer pressures (50-100 atm).</p>
                </div>
              </div>
            </div>

            {/* CENTER PANEL: Interactive Reactor Schematic */}
            <div className="w-1/3 bg-slate-800/80 border border-slate-700 rounded-2xl p-6 shadow-xl flex flex-col relative overflow-hidden">
              
              <div className="flex flex-col xl:flex-row justify-between items-center gap-4 z-20 w-full shrink-0">
                <div className="text-slate-500 text-xs uppercase font-bold tracking-widest w-full text-center xl:text-left">
                  Reactor Schematic
                </div>
                
                <div className="flex justify-center gap-3 w-full xl:justify-end">
                  <div className="bg-slate-900 border border-slate-700 rounded-lg p-2 text-center w-20 shadow-inner shrink-0">
                    <div className="text-[9px] uppercase text-slate-500 font-bold">Eq. Yield</div>
                    <div className="text-lg font-mono font-black text-blue-400">{yieldPct.toFixed(0)}<span className="text-xs opacity-50">%</span></div>
                  </div>
                  <div className="bg-slate-900 border border-slate-700 rounded-lg p-2 text-center w-20 shadow-inner shrink-0">
                    <div className="text-[9px] uppercase text-slate-500 font-bold">Kinetics</div>
                    <div className="text-lg font-mono font-black text-rose-400">{ratePct.toFixed(0)}<span className="text-xs opacity-50">%</span></div>
                  </div>
                </div>
              </div>

              {/* Main SVG Schematic */}
              <div className="flex-1 w-full flex items-center justify-center relative mt-4 xl:mt-8">
                <svg viewBox="0 0 400 400" className="w-full h-full max-h-[350px]">
                  {/* Inlet Pipe 1 (CO) */}
                  <path d="M 0,100 L 120,100" fill="none" stroke="#334155" strokeWidth="20" strokeLinecap="round" />
                  <path d="M 0,100 L 120,100" fill="none" stroke="#60a5fa" strokeWidth="6" className={rawEfficiency > 5 ? 'animate-flow' : ''} style={{ animationDuration: getFlowSpeed() }} />
                  <text x="10" y="85" fill="#60a5fa" fontSize="14" fontWeight="bold">CO(g)</text>

                  {/* Inlet Pipe 2 (H2) */}
                  <path d="M 0,300 L 120,300" fill="none" stroke="#334155" strokeWidth="20" strokeLinecap="round" />
                  <path d="M 0,300 L 120,300" fill="none" stroke="#22d3ee" strokeWidth="6" className={rawEfficiency > 5 ? 'animate-flow' : ''} style={{ animationDuration: getFlowSpeed() }} />
                  <text x="10" y="285" fill="#22d3ee" fontSize="14" fontWeight="bold">H₂(g)</text>

                  {/* Central Reactor Vessel */}
                  <rect x="120" y="50" width="160" height="300" rx="30" fill={getReactorGlow()} className="transition-colors duration-500" filter="blur(15px)" />
                  <rect x="120" y="50" width="160" height="300" rx="30" fill="#1e293b" stroke="#475569" strokeWidth="8" />
                  
                  {/* Catalyst Beds */}
                  <g className="transition-all duration-300" opacity={isModernCatalyst ? 1 : 0.5}>
                    <rect x="135" y="90" width="130" height="40" rx="5" fill={isModernCatalyst ? "#047857" : "#b45309"} opacity="0.6" />
                    <rect x="135" y="160" width="130" height="40" rx="5" fill={isModernCatalyst ? "#047857" : "#b45309"} opacity="0.6" />
                    <rect x="135" y="230" width="130" height="40" rx="5" fill={isModernCatalyst ? "#047857" : "#b45309"} opacity="0.6" />
                    <text x="200" y="115" fill="#fff" fontSize="12" fontWeight="bold" textAnchor="middle" opacity="0.8">
                      {isModernCatalyst ? 'Cu/ZnO Bed' : 'ZnO/Cr₂O₃ Bed'}
                    </text>
                  </g>

                  {/* Internal Mixing Lines */}
                  {rawEfficiency > 5 && (
                    <g opacity={rawEfficiency / 100}>
                      <path d="M 170,140 Q 200,150 230,140" fill="none" stroke="#34d399" strokeWidth="2" className="animate-flow" style={{ animationDuration: '0.5s' }} />
                      <path d="M 170,210 Q 200,220 230,210" fill="none" stroke="#34d399" strokeWidth="2" className="animate-flow" style={{ animationDuration: '0.6s', animationDirection: 'reverse' }} />
                    </g>
                  )}

                  {/* Outlet Pipe (Methanol) */}
                  <path d="M 280,200 L 400,200" fill="none" stroke="#334155" strokeWidth="24" strokeLinecap="round" />
                  <path d="M 280,200 L 400,200" fill="none" stroke="#10b981" strokeWidth={Math.max(2, (rawEfficiency / 100) * 14)} className={rawEfficiency > 5 ? 'animate-flow' : ''} style={{ animationDuration: getFlowSpeed() }} />
                  <text x="310" y="180" fill="#10b981" fontSize="14" fontWeight="bold">CH₃OH(g)</text>
                </svg>
              </div>

              {/* Bottom Master Efficiency Gauge */}
              <div className="bg-slate-900 border border-slate-700 rounded-xl p-4 mt-auto flex items-center justify-between shadow-inner">
                <div className="flex items-center gap-3">
                  <div className={`p-3 rounded-full fade-value ${rawEfficiency > 50 ? 'bg-emerald-900/50 text-emerald-400' : 'bg-slate-800 text-slate-500'}`}>
                    <Gauge size={24} />
                  </div>
                  <div>
                    <h3 className="text-sm font-bold text-slate-200 uppercase tracking-widest">Theoretical Prod.</h3>
                    <p className="text-xs text-slate-500">Yield × Kinetic Rate</p>
                  </div>
                </div>
                <div className="text-right">
                  <span className={`text-3xl font-black font-mono fade-value ${rawEfficiency > 60 ? 'text-emerald-400' : rawEfficiency > 30 ? 'text-amber-400' : 'text-rose-500'}`}>
                    {rawEfficiency.toFixed(1)}<span className="text-xl opacity-50">%</span>
                  </span>
                </div>
              </div>

            </div>

            {/* RIGHT PANEL: Controls & Optimization Graph */}
            <div className="w-5/12 bg-slate-800 rounded-2xl border border-slate-700 flex flex-col overflow-hidden shadow-xl shrink-0">
              <div className="p-4 bg-slate-700/50 border-b border-slate-600 flex items-center gap-2">
                <Settings size={18} className="text-amber-400" />
                <h2 className="text-sm uppercase tracking-widest text-slate-200 font-bold">Optimization Parameters</h2>
              </div>
              
              <div className="p-5 flex flex-col gap-6 h-full overflow-y-auto custom-scrollbar">
                
                {/* Sliders */}
                <div className="flex flex-col gap-5 bg-slate-900 p-4 rounded-xl border border-slate-700 shadow-inner">
                  {/* Temperature Slider */}
                  <div>
                    <div className="flex justify-between items-end mb-2">
                      <label className="text-xs font-bold text-rose-400 uppercase tracking-wider">Temperature</label>
                      <span className="font-mono font-bold text-lg">{temperature}°C</span>
                    </div>
                    <input 
                      type="range" min="150" max="450" step="5" 
                      value={temperature} onChange={(e) => setTemperature(Number(e.target.value))}
                    />
                  </div>

                  {/* Pressure Slider */}
                  <div>
                    <div className="flex justify-between items-end mb-2">
                      <label className="text-xs font-bold text-blue-400 uppercase tracking-wider flex items-center gap-2">
                        Pressure 
                        {costPenalty > 10 && <span className="text-[9px] bg-rose-500/20 text-rose-400 px-2 py-0.5 rounded-full border border-rose-500/50">High Cost Warning</span>}
                      </label>
                      <span className="font-mono font-bold text-lg">{pressure} atm</span>
                    </div>
                    <input 
                      type="range" min="10" max="350" step="10" 
                      value={pressure} onChange={(e) => setPressure(Number(e.target.value))}
                    />
                  </div>

                  {/* Catalyst Toggle */}
                  <div className="pt-2 border-t border-slate-700">
                    <label className="text-xs font-bold text-emerald-400 uppercase tracking-wider mb-2 block">Catalyst Configuration</label>
                    <div className="flex gap-2">
                      <button 
                        onClick={() => setIsModernCatalyst(true)}
                        className={`flex-1 py-2 px-2 text-[10px] font-bold rounded transition-all leading-tight ${isModernCatalyst ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-900/50' : 'bg-slate-800 text-slate-500 border border-slate-700 hover:bg-slate-700'}`}
                      >
                        Modern ICI Process<br/>(Cu/ZnO/Al₂O₃)
                      </button>
                      <button 
                        onClick={() => setIsModernCatalyst(false)}
                        className={`flex-1 py-2 px-2 text-[10px] font-bold rounded transition-all leading-tight ${!isModernCatalyst ? 'bg-amber-600 text-white shadow-lg shadow-amber-900/50' : 'bg-slate-800 text-slate-500 border border-slate-700 hover:bg-slate-700'}`}
                      >
                        Classic BASF Process<br/>(ZnO/Cr₂O₃)
                      </button>
                    </div>
                  </div>
                </div>

                {/* SVG Optimization Graph */}
                <div className="flex-1 flex flex-col">
                  <div className="flex justify-between items-center mb-2">
                    <p className="text-[10px] text-slate-500 uppercase tracking-widest font-bold">Economic Efficiency vs Temp</p>
                    <div className="flex gap-2 text-[9px] font-bold">
                      <span className="text-blue-400 flex items-center gap-1"><div className="w-2 h-2 bg-blue-400 rounded-full"></div> Yield</span>
                      <span className="text-rose-400 flex items-center gap-1"><div className="w-2 h-2 bg-rose-400 rounded-full"></div> Rate</span>
                      <span className="text-amber-400 flex items-center gap-1"><div className="w-2 h-2 bg-amber-400 rounded-full"></div> Econ Peak</span>
                    </div>
                  </div>
                  
                  <div className="flex-1 bg-slate-900 border border-slate-700 rounded-xl relative p-2 shadow-inner min-h-[220px]">
                    <svg viewBox="0 0 100 100" preserveAspectRatio="none" className="w-full h-full overflow-visible py-4">
                      {/* Grid Lines */}
                      <line x1="0" y1="25" x2="100" y2="25" stroke="#334155" strokeWidth="0.5" strokeDasharray="2 2" />
                      <line x1="0" y1="50" x2="100" y2="50" stroke="#334155" strokeWidth="0.5" strokeDasharray="2 2" />
                      <line x1="0" y1="75" x2="100" y2="75" stroke="#334155" strokeWidth="0.5" strokeDasharray="2 2" />
                      
                      {/* X-Axis Labels (Temp) */}
                      <text x="0" y="110" fill="#64748b" fontSize="6" textAnchor="start">150°C</text>
                      <text x="50" y="110" fill="#64748b" fontSize="6" textAnchor="middle">300°C</text>
                      <text x="100" y="110" fill="#64748b" fontSize="6" textAnchor="end">450°C</text>

                      {/* Data Lines */}
                      <polyline points={graphData.yield} fill="none" stroke="#60a5fa" strokeWidth="2" strokeOpacity="0.5" strokeDasharray="2 2"/>
                      <polyline points={graphData.rate} fill="none" stroke="#fb7185" strokeWidth="2" strokeOpacity="0.5" strokeDasharray="2 2"/>
                      
                      {/* Production/Economic Area */}
                      <polygon points={`0,100 ${graphData.econ} 100,100`} fill="rgba(245, 158, 11, 0.2)" />
                      <polyline points={graphData.econ} fill="none" stroke="#f59e0b" strokeWidth="3" />

                      {/* Current Selection Indicator */}
                      <g transform={`translate(${currentXPos}, 0)`}>
                        <line x1="0" y1="0" x2="0" y2="100" stroke="#f8fafc" strokeWidth="0.5" strokeDasharray="2 1" opacity="0.5" />
                        <circle cx="0" cy={100 - Math.max(0, Math.min(100, economicScore))} r="3" fill="#f59e0b" stroke="#fff" strokeWidth="1" />
                      </g>
                    </svg>
                  </div>
                </div>

              </div>
            </div>

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
