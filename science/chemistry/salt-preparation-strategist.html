<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salt Preparation Strategist</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for in-browser JSX transpilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Custom Scrollbar */
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(30, 41, 59, 0.5); 
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(71, 85, 105, 0.8); 
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(100, 116, 139, 1); 
    }
  </style>
</head>
<body class="bg-slate-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- ICON COMPONENTS (Replaces lucide-react for standalone HTML) ---
    const SvgIcon = ({ children, size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        {children}
      </svg>
    );

    const Activity = (p) => <SvgIcon {...p}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12" /></SvgIcon>;
    const Award = (p) => <SvgIcon {...p}><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></SvgIcon>;
    const Beaker = (p) => <SvgIcon {...p}><path d="M4.5 3h15"/><path d="M6 3v16a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V3"/><path d="M14 9h4"/></SvgIcon>;
    const CheckCircle2 = (p) => <SvgIcon {...p}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></SvgIcon>;
    const Filter = (p) => <SvgIcon {...p}><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></SvgIcon>;
    const Flame = (p) => <SvgIcon {...p}><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></SvgIcon>;
    const FlaskConical = (p) => <SvgIcon {...p}><path d="M10 2v7.31L2 20.24a2 2 0 0 0 1.76 2.76h16.48a2 2 0 0 0 1.76-2.76L14 9.31V2"/><path d="M8.5 2h7"/><path d="M10 10l5.5-5.5"/></SvgIcon>;
    const Info = (p) => <SvgIcon {...p}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></SvgIcon>;
    const Pipette = (p) => <SvgIcon {...p}><path d="m2 22 1-1h3l9-9"/><path d="M3 21v-3l9-9"/><path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3l.4.4Z"/></SvgIcon>;
    const RefreshCw = (p) => <SvgIcon {...p}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></SvgIcon>;
    const TestTube2 = (p) => <SvgIcon {...p}><path d="M21 7 6.82 21.18a2.83 2.83 0 0 1-3.99-.01v0a2.83 2.83 0 0 1 0-4L17 3"/><path d="m16 2 6 6"/><path d="M12 16H4"/></SvgIcon>;
    const Wind = (p) => <SvgIcon {...p}><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/></SvgIcon>;
    const XCircle = (p) => <SvgIcon {...p}><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></SvgIcon>;

    // --- SCIENTIFIC DATA & LOGIC ---
    const ITEMS = {
      acids: [
        { id: 'HCl', name: 'Hydrochloric Acid (aq)', type: 'acid', color: 'bg-red-500', text: 'text-red-100', border: 'border-red-400' },
        { id: 'H2SO4', name: 'Sulfuric Acid (aq)', type: 'acid', color: 'bg-red-600', text: 'text-red-100', border: 'border-red-500' },
        { id: 'HNO3', name: 'Nitric Acid (aq)', type: 'acid', color: 'bg-rose-500', text: 'text-rose-100', border: 'border-rose-400' }
      ],
      alkalis: [
        { id: 'NaOH', name: 'Sodium Hydroxide (aq)', type: 'alkali', color: 'bg-blue-500', text: 'text-blue-100', border: 'border-blue-400' },
        { id: 'KOH', name: 'Potassium Hydroxide (aq)', type: 'alkali', color: 'bg-blue-600', text: 'text-blue-100', border: 'border-blue-500' },
        { id: 'NH3', name: 'Aqueous Ammonia (aq)', type: 'alkali', color: 'bg-cyan-600', text: 'text-cyan-100', border: 'border-cyan-400' } 
      ],
      insolubles: [
        { id: 'CuO', name: 'Copper(II) Oxide (s)', type: 'insoluble', color: 'bg-stone-700', text: 'text-stone-100', border: 'border-stone-500' },
        { id: 'Mg', name: 'Magnesium Ribbon (s)', type: 'insoluble', color: 'bg-slate-500', text: 'text-slate-100', border: 'border-slate-400' },
        { id: 'CuCO3', name: 'Copper(II) Carbonate (s)', type: 'insoluble', color: 'bg-emerald-700', text: 'text-emerald-100', border: 'border-emerald-500' },
        { id: 'CaCO3', name: 'Calcium Carbonate (s)', type: 'insoluble', color: 'bg-teal-700', text: 'text-teal-100', border: 'border-teal-500' } 
      ],
      salts_aq: [
        { id: 'AgNO3', name: 'Silver Nitrate (aq)', type: 'salt_aq', color: 'bg-purple-500', text: 'text-purple-100', border: 'border-purple-400' },
        { id: 'NaCl', name: 'Sodium Chloride (aq)', type: 'salt_aq', color: 'bg-purple-600', text: 'text-purple-100', border: 'border-purple-500' },
        { id: 'BaCl2', name: 'Barium Chloride (aq)', type: 'salt_aq', color: 'bg-fuchsia-600', text: 'text-fuchsia-100', border: 'border-fuchsia-500' },
        { id: 'Na2SO4', name: 'Sodium Sulfate (aq)', type: 'salt_aq', color: 'bg-violet-500', text: 'text-violet-100', border: 'border-violet-400' },
        { id: 'Pb(NO3)2', name: 'Lead(II) Nitrate (aq)', type: 'salt_aq', color: 'bg-indigo-500', text: 'text-indigo-100', border: 'border-indigo-400' },
        { id: 'KI', name: 'Potassium Iodide (aq)', type: 'salt_aq', color: 'bg-indigo-600', text: 'text-indigo-100', border: 'border-indigo-500' }
      ],
      methods_reaction: [
        { id: 'Indicator', name: 'Titration (Indicator)', type: 'reaction', icon: Pipette, color: 'bg-orange-500' },
        { id: 'FilterReact', name: 'Filter (Excess/Precipitate)', type: 'reaction', icon: Filter, color: 'bg-amber-600' }
      ],
      methods_isolation: [
        { id: 'Evaporate', name: 'Evaporate & Crystallize', type: 'isolation', icon: Flame, color: 'bg-rose-500' },
        { id: 'Dry', name: 'Wash & Dry Solid', type: 'isolation', icon: Wind, color: 'bg-sky-500' }
      ]
    };

    const ALL_ITEMS = [
      ...ITEMS.acids, ...ITEMS.alkalis, ...ITEMS.insolubles, ...ITEMS.salts_aq, ...ITEMS.methods_reaction, ...ITEMS.methods_isolation
    ].reduce((acc, item) => ({ ...acc, [item.id]: item }), {});

    const TARGETS = [
      {
        name: 'Copper(II) Sulfate', formula: 'CuSO4 (Crystals)', soluble: true, baseSoluble: false,
        req1: ['H2SO4'], req2: ['CuO', 'CuCO3'], reqReaction: ['FilterReact'], reqIsolation: ['Evaporate'],
        explanation: 'CuSO4 is a soluble salt. The base is insoluble. React acid with excess insoluble base, FILTER excess, then EVAPORATE to crystallize.'
      },
      {
        name: 'Sodium Chloride', formula: 'NaCl (Crystals)', soluble: true, baseSoluble: true,
        req1: ['HCl'], req2: ['NaOH'], reqReaction: ['Indicator'], reqIsolation: ['Evaporate'],
        explanation: 'Both reactants are soluble liquids. Use TITRATION to find the exact endpoint, then EVAPORATE the resulting solution to crystallize NaCl.'
      },
      {
        name: 'Silver Chloride', formula: 'AgCl (s)', soluble: false, baseSoluble: null,
        req1: ['AgNO3'], req2: ['NaCl', 'HCl'], reqReaction: ['FilterReact'], reqIsolation: ['Dry'],
        explanation: 'AgCl is an insoluble salt. Mix two soluble reagents to form a precipitate, FILTER to collect it, then WASH & DRY.'
      },
      {
        name: 'Barium Sulfate', formula: 'BaSO4 (s)', soluble: false, baseSoluble: null,
        req1: ['BaCl2'], req2: ['Na2SO4', 'H2SO4'], reqReaction: ['FilterReact'], reqIsolation: ['Dry'],
        explanation: 'BaSO4 is an insoluble salt. Mix two soluble reagents to form a precipitate, FILTER to collect it, then WASH & DRY.'
      },
      {
        name: 'Magnesium Nitrate', formula: 'Mg(NO3)2 (Crystals)', soluble: true, baseSoluble: false,
        req1: ['HNO3'], req2: ['Mg'], reqReaction: ['FilterReact'], reqIsolation: ['Evaporate'],
        explanation: 'Mg(NO3)2 is soluble. Add excess insoluble Mg metal to acid, FILTER unreacted metal, then EVAPORATE to crystallize.'
      },
      {
        name: 'Ammonium Sulfate', formula: '(NH4)2SO4 (Crystals)', soluble: true, baseSoluble: true,
        req1: ['NH3'], req2: ['H2SO4'], reqReaction: ['Indicator'], reqIsolation: ['Evaporate'],
        explanation: 'Ammonia is a soluble alkali. Both reactants are soluble, requiring TITRATION. Then EVAPORATE to get Ammonium Sulfate crystals.'
      },
      {
        name: 'Lead(II) Iodide', formula: 'PbI2 (s)', soluble: false, baseSoluble: null,
        req1: ['Pb(NO3)2'], req2: ['KI'], reqReaction: ['FilterReact'], reqIsolation: ['Dry'],
        explanation: 'Lead(II) Iodide is an insoluble yellow precipitate. Start with soluble Lead(II) Nitrate, FILTER the precipitate, then WASH & DRY.'
      },
      {
        name: 'Calcium Chloride', formula: 'CaCl2 (Crystals)', soluble: true, baseSoluble: false,
        req1: ['HCl'], req2: ['CaCO3'], reqReaction: ['FilterReact'], reqIsolation: ['Evaporate'],
        explanation: 'React acid with insoluble Calcium Carbonate until effervescence (fizzing) stops. FILTER excess carbonate, then EVAPORATE.'
      }
    ];

    function App() {
      const [currentTargetIndex, setCurrentTargetIndex] = useState(0);
      const [benchChemicals, setBenchChemicals] = useState([null, null]);
      const [benchReaction, setBenchReaction] = useState(null);
      const [benchIsolation, setBenchIsolation] = useState(null);
      const [feedback, setFeedback] = useState({ status: 'idle', message: '' });
      const [score, setScore] = useState(0);
      const [streak, setStreak] = useState(0);

      const target = TARGETS[currentTargetIndex];

      const handleDragStart = (e, itemId) => {
        e.dataTransfer.setData('itemId', itemId);
      };

      const handleDrop = (e, zoneType, index = null) => {
        e.preventDefault();
        const itemId = e.dataTransfer.getData('itemId');
        const item = ALL_ITEMS[itemId];
        if (!item) return;

        if (zoneType === 'chemical' && item.type !== 'reaction' && item.type !== 'isolation') {
          const newBench = [...benchChemicals];
          if (newBench.includes(itemId)) return;
          newBench[index] = itemId;
          setBenchChemicals(newBench);
          setFeedback({ status: 'idle', message: '' });
        } else if (zoneType === 'reaction' && item.type === 'reaction') {
          setBenchReaction(itemId);
          setFeedback({ status: 'idle', message: '' });
        } else if (zoneType === 'isolation' && item.type === 'isolation') {
          setBenchIsolation(itemId);
          setFeedback({ status: 'idle', message: '' });
        }
      };

      const handleDragOver = (e) => {
        e.preventDefault();
      };

      const removeChemical = (index) => {
        const newBench = [...benchChemicals];
        newBench[index] = null;
        setBenchChemicals(newBench);
        setFeedback({ status: 'idle', message: '' });
      };

      const removeMethod = (type) => {
        if (type === 'reaction') setBenchReaction(null);
        if (type === 'isolation') setBenchIsolation(null);
        setFeedback({ status: 'idle', message: '' });
      };

      const checkSynthesis = () => {
        const c1 = benchChemicals[0];
        const c2 = benchChemicals[1];
        const rMethod = benchReaction;
        const iMethod = benchIsolation;

        if (!c1 || !c2 || !rMethod || !iMethod) {
          setFeedback({ status: 'error', message: 'Missing components! Need two reagents, a reaction method, and an isolation method.' });
          return;
        }

        const hasCorrectReagents = 
          (target.req1.includes(c1) && target.req2.includes(c2)) ||
          (target.req1.includes(c2) && target.req2.includes(c1));

        const hasCorrectReaction = target.reqReaction.includes(rMethod);
        const hasCorrectIsolation = target.reqIsolation.includes(iMethod);

        if (hasCorrectReagents && hasCorrectReaction && hasCorrectIsolation && c1 !== c2) {
          setFeedback({ status: 'success', message: `Success! ${target.explanation}` });
          setScore(s => s + 100 + (streak * 20));
          setStreak(s => s + 1);
        } else {
          let msg = "Synthesis failed. ";
          if (!hasCorrectReagents) {
            msg += "Incorrect reagents for this specific salt. ";
          } else if (!hasCorrectReaction) {
            msg += "Correct reagents, but the wrong Reaction Method was chosen! ";
          } else if (!hasCorrectIsolation) {
            msg += "Correct reagents & reaction, but the wrong Isolation Method to get the final solid! ";
          }
          
          setFeedback({ status: 'error', message: msg });
          setStreak(0);
        }
      };

      const nextTarget = () => {
        let nextIndex = Math.floor(Math.random() * TARGETS.length);
        while (nextIndex === currentTargetIndex) {
          nextIndex = Math.floor(Math.random() * TARGETS.length);
        }
        setCurrentTargetIndex(nextIndex);
        setBenchChemicals([null, null]);
        setBenchReaction(null);
        setBenchIsolation(null);
        setFeedback({ status: 'idle', message: '' });
      };

      const DraggableItem = ({ item }) => {
        const Icon = item.icon || Beaker;
        return (
          <div
            draggable
            onDragStart={(e) => handleDragStart(e, item.id)}
            className={`flex items-center gap-2 p-2 rounded-lg cursor-grab active:cursor-grabbing border-2 ${item.color} ${item.border} ${item.text || 'text-white'} shadow-md hover:scale-105 transition-transform`}
            title={item.name}
          >
            <Icon size={18} className="opacity-80 flex-shrink-0" />
            <span className="text-sm font-semibold truncate leading-tight">{item.id}</span>
          </div>
        );
      };

      return (
        <div className="min-h-screen bg-slate-900 text-slate-100 flex flex-col font-sans overflow-hidden selection:bg-cyan-500/30">
          
          {/* HEADER */}
          <header className="flex justify-between items-center px-6 py-4 bg-slate-800/80 border-b border-slate-700 shadow-lg">
            <div className="flex items-center gap-3">
              <Activity className="text-cyan-400" size={28} />
              <h1 className="text-2xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">
                Salt Preparation Strategist
              </h1>
            </div>
            <div className="flex items-center gap-6">
              <div className="flex flex-col items-end">
                <span className="text-xs text-slate-400 uppercase font-bold tracking-wider">Score</span>
                <span className="text-xl font-mono text-emerald-400">{score}</span>
              </div>
              {streak > 1 && (
                <div className="flex items-center gap-1 text-orange-400 animate-pulse">
                  <Award size={18} />
                  <span className="text-sm font-bold">{streak}x Streak!</span>
                </div>
              )}
            </div>
          </header>

          {/* MAIN WORKSPACE */}
          <main className="flex-1 flex gap-4 p-4 overflow-hidden max-h-[calc(100vh-80px)]">
            
            {/* LEFT PANEL: Routing Algorithm */}
            <div className="w-1/4 bg-slate-800/50 border border-slate-700 rounded-2xl p-4 flex flex-col overflow-y-auto custom-scrollbar shadow-inner">
              <h2 className="text-sm uppercase tracking-widest text-slate-400 font-bold mb-4 flex items-center gap-2">
                <Info size={16} /> Routing Logic
              </h2>
              
              <div className="flex-1 flex flex-col gap-3 text-sm">
                <div className={`p-3 rounded-lg border-2 transition-all duration-500 ${target.soluble === true ? 'border-cyan-500 bg-cyan-900/20' : target.soluble === false ? 'border-purple-500 bg-purple-900/20' : 'border-slate-600 bg-slate-800'}`}>
                  <p className="font-semibold text-slate-200">1. Is Target Salt Soluble?</p>
                  <div className="flex mt-2 gap-2 text-xs">
                    <span className={`px-2 py-1 rounded ${target.soluble ? 'bg-cyan-500 text-slate-900 font-bold' : 'bg-slate-700 text-slate-400'}`}>YES</span>
                    <span className={`px-2 py-1 rounded ${target.soluble === false ? 'bg-purple-500 text-slate-900 font-bold' : 'bg-slate-700 text-slate-400'}`}>NO</span>
                  </div>
                </div>

                <div className={`ml-6 p-3 rounded-lg border-l-4 transition-all duration-500 ${target.soluble === false ? 'border-purple-400 bg-purple-900/10 opacity-100' : 'border-slate-600 opacity-40'}`}>
                  <p className="font-bold text-purple-300">➜ PRECIPITATION</p>
                  <p className="text-xs text-slate-400 mt-1">Mix 2 soluble salts. Filter to collect precipitate.</p>
                </div>

                <div className={`ml-6 p-3 rounded-lg border-l-4 transition-all duration-500 ${target.soluble ? 'border-cyan-400 bg-cyan-900/10 opacity-100' : 'border-slate-600 opacity-40'}`}>
                  <p className="font-semibold text-slate-200">2. Is Base/Metal Soluble?</p>
                  <div className="flex mt-2 gap-2 text-xs">
                    <span className={`px-2 py-1 rounded ${target.baseSoluble === true ? 'bg-blue-500 text-slate-900 font-bold' : 'bg-slate-700 text-slate-400'}`}>YES</span>
                    <span className={`px-2 py-1 rounded ${target.baseSoluble === false ? 'bg-stone-500 text-slate-900 font-bold' : 'bg-slate-700 text-slate-400'}`}>NO</span>
                  </div>
                </div>

                <div className={`ml-12 p-3 rounded-lg border-l-4 transition-all duration-500 ${target.baseSoluble === true ? 'border-blue-400 bg-blue-900/10 opacity-100' : 'border-slate-600 opacity-40'}`}>
                  <p className="font-bold text-blue-300">➜ TITRATION</p>
                  <p className="text-xs text-slate-400 mt-1">Acid + Alkali. Requires indicator.</p>
                </div>

                <div className={`ml-12 p-3 rounded-lg border-l-4 transition-all duration-500 ${target.baseSoluble === false ? 'border-stone-400 bg-stone-900/10 opacity-100' : 'border-slate-600 opacity-40'}`}>
                  <p className="font-bold text-stone-300">➜ EXCESS METHOD</p>
                  <p className="text-xs text-slate-400 mt-1">Acid + Insoluble solid. Filter excess.</p>
                </div>

                <div className={`mt-2 p-3 rounded-lg border-2 transition-all duration-500 border-slate-500 bg-slate-800`}>
                  <p className="font-semibold text-slate-200">3. Isolation Method</p>
                  <div className="text-xs text-slate-300 mt-1 flex flex-col gap-1">
                    <span className={target.soluble === false ? 'text-purple-300 font-bold' : 'opacity-60'}>• If Insoluble: Wash & Dry</span>
                    <span className={target.soluble === true ? 'text-cyan-300 font-bold' : 'opacity-60'}>• If Soluble: Evaporate & Crystallize</span>
                  </div>
                </div>

              </div>
            </div>

            {/* CENTER PANEL: Workbench */}
            <div className="w-2/4 flex flex-col gap-4">
              <div className="bg-slate-800 rounded-2xl p-6 border-2 border-slate-600 text-center shadow-xl relative overflow-hidden shrink-0">
                <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-500 via-purple-500 to-cyan-500"></div>
                <h3 className="text-slate-400 text-sm font-bold tracking-widest uppercase mb-1">Target Synthesis</h3>
                <h2 className="text-3xl font-black text-white">{target.name}</h2>
                <p className="text-xl font-mono text-cyan-300 mt-2">{target.formula}</p>
              </div>

              <div className="flex-1 bg-slate-800/80 rounded-2xl p-4 border border-slate-700 shadow-inner flex flex-col items-center justify-center gap-6 relative">
                <div className="absolute top-4 left-4 text-slate-500 text-xs uppercase font-bold tracking-widest">Laboratory Bench</div>
                
                <div className="flex items-center justify-center gap-6 w-full mt-4">
                  <div 
                    onDragOver={handleDragOver}
                    onDrop={(e) => handleDrop(e, 'chemical', 0)}
                    className={`w-32 h-32 rounded-2xl border-2 border-dashed flex flex-col items-center justify-center transition-colors ${benchChemicals[0] ? 'border-slate-500 bg-slate-700/50' : 'border-slate-600 bg-slate-800/50 hover:bg-slate-700/30'} relative group`}
                  >
                    {benchChemicals[0] ? (
                      <>
                        <FlaskConical size={40} className={ALL_ITEMS[benchChemicals[0]].text} />
                        <span className="mt-2 font-mono font-bold text-center leading-tight">{benchChemicals[0]}</span>
                        <button onClick={() => removeChemical(0)} className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-1 opacity-0 group-hover:opacity-100 transition-opacity"><XCircle size={16} /></button>
                      </>
                    ) : (
                      <span className="text-slate-500 text-sm font-medium text-center px-2">Drop Reactant 1</span>
                    )}
                  </div>

                  <div className="text-4xl font-black text-slate-600">+</div>

                  <div 
                    onDragOver={handleDragOver}
                    onDrop={(e) => handleDrop(e, 'chemical', 1)}
                    className={`w-32 h-32 rounded-2xl border-2 border-dashed flex flex-col items-center justify-center transition-colors ${benchChemicals[1] ? 'border-slate-500 bg-slate-700/50' : 'border-slate-600 bg-slate-800/50 hover:bg-slate-700/30'} relative group`}
                  >
                    {benchChemicals[1] ? (
                      <>
                        <TestTube2 size={40} className={ALL_ITEMS[benchChemicals[1]].text} />
                        <span className="mt-2 font-mono font-bold text-center leading-tight">{benchChemicals[1]}</span>
                        <button onClick={() => removeChemical(1)} className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-1 opacity-0 group-hover:opacity-100 transition-opacity"><XCircle size={16} /></button>
                      </>
                    ) : (
                      <span className="text-slate-500 text-sm font-medium text-center px-2">Drop Reactant 2</span>
                    )}
                  </div>
                </div>

                <div className="flex w-full px-6 gap-4 mt-2">
                  <div 
                    onDragOver={handleDragOver}
                    onDrop={(e) => handleDrop(e, 'reaction')}
                    className={`flex-1 h-20 rounded-xl border-2 border-dashed flex flex-col items-center justify-center gap-1 transition-colors ${benchReaction ? 'border-orange-500 bg-orange-900/20' : 'border-slate-600 bg-slate-800/50 hover:bg-slate-700/30'} relative group p-2 text-center`}
                  >
                    <span className="absolute top-1 left-2 text-[10px] text-slate-500 uppercase font-bold tracking-wider">1. Reaction</span>
                    {benchReaction ? (
                      <div className="flex items-center gap-2 mt-3">
                        {React.createElement(ALL_ITEMS[benchReaction].icon, { size: 20, className: 'text-orange-400 flex-shrink-0' })}
                        <span className="font-bold text-sm text-orange-200 leading-tight">{ALL_ITEMS[benchReaction].name}</span>
                        <button onClick={() => removeMethod('reaction')} className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-1 opacity-0 group-hover:opacity-100 transition-opacity"><XCircle size={16} /></button>
                      </div>
                    ) : (
                      <span className="text-slate-500 text-sm font-medium mt-3">Drop Method</span>
                    )}
                  </div>

                  <div 
                    onDragOver={handleDragOver}
                    onDrop={(e) => handleDrop(e, 'isolation')}
                    className={`flex-1 h-20 rounded-xl border-2 border-dashed flex flex-col items-center justify-center gap-1 transition-colors ${benchIsolation ? 'border-rose-500 bg-rose-900/20' : 'border-slate-600 bg-slate-800/50 hover:bg-slate-700/30'} relative group p-2 text-center`}
                  >
                    <span className="absolute top-1 left-2 text-[10px] text-slate-500 uppercase font-bold tracking-wider">2. Isolation</span>
                    {benchIsolation ? (
                      <div className="flex items-center gap-2 mt-3">
                        {React.createElement(ALL_ITEMS[benchIsolation].icon, { size: 20, className: 'text-rose-400 flex-shrink-0' })}
                        <span className="font-bold text-sm text-rose-200 leading-tight">{ALL_ITEMS[benchIsolation].name}</span>
                        <button onClick={() => removeMethod('isolation')} className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-1 opacity-0 group-hover:opacity-100 transition-opacity"><XCircle size={16} /></button>
                      </div>
                    ) : (
                      <span className="text-slate-500 text-sm font-medium mt-3">Drop Method</span>
                    )}
                  </div>
                </div>

              </div>

              <div className="flex gap-4 h-24 shrink-0">
                <button 
                  onClick={checkSynthesis}
                  disabled={feedback.status === 'success'}
                  className="w-1/3 bg-cyan-600 hover:bg-cyan-500 disabled:opacity-50 disabled:cursor-not-allowed text-white font-black uppercase tracking-widest rounded-2xl transition-colors shadow-lg shadow-cyan-900/50 flex flex-col items-center justify-center gap-1"
                >
                  <Activity size={24} />
                  Synthesize
                </button>
                
                <div className={`flex-1 rounded-2xl p-4 flex items-center border ${
                  feedback.status === 'idle' ? 'bg-slate-800 border-slate-700 text-slate-400' :
                  feedback.status === 'success' ? 'bg-emerald-900/30 border-emerald-500 text-emerald-300' :
                  'bg-rose-900/30 border-rose-500 text-rose-300'
                }`}>
                  {feedback.status === 'idle' && <p className="text-sm">Place reagents, reaction, and isolation methods on the bench to begin.</p>}
                  {feedback.status === 'success' && (
                    <div className="flex gap-3 items-start">
                      <CheckCircle2 className="shrink-0 text-emerald-400" />
                      <div>
                        <p className="font-bold">Protocol Successful!</p>
                        <p className="text-[11px] mt-1 opacity-90 leading-tight">{feedback.message.replace('Success! ', '')}</p>
                        <button onClick={nextTarget} className="mt-2 text-xs bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1 rounded flex items-center gap-1">
                          <RefreshCw size={12} /> Next Target
                        </button>
                      </div>
                    </div>
                  )}
                  {feedback.status === 'error' && (
                    <div className="flex gap-3 items-start">
                      <XCircle className="shrink-0 text-rose-400" />
                      <div>
                        <p className="font-bold">Protocol Failed</p>
                        <p className="text-xs mt-1 opacity-90 leading-tight">{feedback.message}</p>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>

            {/* RIGHT PANEL: Inventory */}
            <div className="w-1/4 bg-slate-800 rounded-2xl border border-slate-700 flex flex-col overflow-hidden shadow-xl">
              <div className="p-3 bg-slate-700/50 border-b border-slate-600 shrink-0">
                <h2 className="text-sm uppercase tracking-widest text-slate-300 font-bold text-center">Inventory</h2>
              </div>
              
              <div className="flex-1 overflow-y-auto p-4 flex flex-col gap-5 custom-scrollbar">
                <div>
                  <h3 className="text-[10px] font-bold text-slate-400 uppercase mb-2 border-b border-slate-700 pb-1 tracking-wider">1. Reaction Methods</h3>
                  <div className="flex flex-col gap-2">
                    {ITEMS.methods_reaction.map(item => <DraggableItem key={item.id} item={item} />)}
                  </div>
                </div>

                <div>
                  <h3 className="text-[10px] font-bold text-slate-400 uppercase mb-2 border-b border-slate-700 pb-1 tracking-wider">2. Isolation Methods</h3>
                  <div className="flex flex-col gap-2">
                    {ITEMS.methods_isolation.map(item => <DraggableItem key={item.id} item={item} />)}
                  </div>
                </div>

                <div>
                  <h3 className="text-[10px] font-bold text-slate-400 uppercase mb-2 border-b border-slate-700 pb-1 tracking-wider mt-2">Acids (aq)</h3>
                  <div className="grid grid-cols-2 gap-2">
                    {ITEMS.acids.map(item => <DraggableItem key={item.id} item={item} />)}
                  </div>
                </div>

                <div>
                  <h3 className="text-[10px] font-bold text-slate-400 uppercase mb-2 border-b border-slate-700 pb-1 tracking-wider">Alkalis (aq)</h3>
                  <div className="grid grid-cols-2 gap-2">
                    {ITEMS.alkalis.map(item => <DraggableItem key={item.id} item={item} />)}
                  </div>
                </div>

                <div>
                  <h3 className="text-[10px] font-bold text-slate-400 uppercase mb-2 border-b border-slate-700 pb-1 tracking-wider">Metals & Insolubles (s)</h3>
                  <div className="grid grid-cols-2 gap-2">
                    {ITEMS.insolubles.map(item => <DraggableItem key={item.id} item={item} />)}
                  </div>
                </div>

                <div>
                  <h3 className="text-[10px] font-bold text-slate-400 uppercase mb-2 border-b border-slate-700 pb-1 tracking-wider">Aqueous Salts (aq)</h3>
                  <div className="grid grid-cols-2 gap-2">
                    {ITEMS.salts_aq.map(item => <DraggableItem key={item.id} item={item} />)}
                  </div>
                </div>
              </div>
            </div>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
