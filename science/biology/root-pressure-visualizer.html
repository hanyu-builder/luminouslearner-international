<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Root Pressure & Osmosis Simulator</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0f172a;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // --- Inline Icon Components ---
    const Activity = ({ className }) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>);
    const Zap = ({ className }) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>);
    const Droplets = ({ className }) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7 2.99 7 2.99s-2.29 6.08-3.29 7.08c-1.14.93-1.71 2.03-1.71 3.19 0 2.22 1.8 4.05 4 4.05z"/><path d="M12.56 6.6A10.97 10.97 0 0 0 14 6c2.65 0 5.16.96 7 2.68V12a9 9 0 0 1-9 9c-2.65 0-5.16-.96-7-2.68"/></svg>);
    const ArrowUp = ({ className }) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>);
    const Info = ({ className }) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>);
    const Play = ({ className }) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="5 3 19 12 5 21 5 3"/></svg>);
    const Pause = ({ className }) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>);
    const AlertTriangle = ({ className }) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>);

    /* SCIENTIFIC MODEL & CONCEPTS
      ---------------------------
      Topic: Root Pressure & Osmotic Water Uptake
      
      Concepts:
      1. Active Transport: Endodermis cells use ATP to actively pump mineral ions into the xylem.
      2. Osmosis: Minerals in the xylem lower its water potential. Water from the soil (higher potential) flows in.
      3. Root Pressure: Influx of water creates hydrostatic pressure, pushing water UP the stem (guttation).
      4. Pathways:
         - Symplastic: Through cytoplasm/plasmodesmata.
         - Apoplastic: Through cell walls. Blocked by waterproof Casparian Strip, forcing regulation.
    */

    const CANVAS_WIDTH = 800;
    const CANVAS_HEIGHT = 600;
    const ROW_TOP = 230;
    const ROW_BOTTOM = 370;
    const ROW_CENTER = 300;

    function App() {
      // --- UI & Control State ---
      const [atpActive, setAtpActive] = useState(true);
      const [soilMinerals, setSoilMinerals] = useState(20); 
      const [isRunning, setIsRunning] = useState(true);
      
      // Real-time metrics for UI
      const [metrics, setMetrics] = useState({
        xylemConc: 0,
        osmoticGradient: 0,
        waterLevel: 0
      });

      // --- Canvas & Simulation State ---
      const canvasRef = useRef(null);
      const requestRef = useRef();
      
      const simState = useRef({
        particles: [], 
        lastSpawn: 0,
        xylemSoluteAccumulation: 50, 
        waterColumnHeight: 50 
      });

      // --- Physics & Render Loop ---
      const render = useCallback((time) => {
        if (!isRunning) {
          requestRef.current = requestAnimationFrame(render);
          return;
        }

        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const state = simState.current;

        ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

        // --- 1. System Dynamics Math ---
        if (atpActive) {
          state.xylemSoluteAccumulation = Math.min(100, state.xylemSoluteAccumulation + 0.1);
        } else {
          state.xylemSoluteAccumulation = Math.max(10, state.xylemSoluteAccumulation - 0.2); 
        }

        const gradient = state.xylemSoluteAccumulation - soilMinerals;
        
        // Water column height drops to 0 if gradient is negative (plasmolysis)
        const targetHeight = Math.max(0, gradient * 4); 
        state.waterColumnHeight += (targetHeight - state.waterColumnHeight) * 0.02;

        // --- 2. Draw Cellular Anatomy ---
        
        // Background/Soil
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
        
        ctx.fillStyle = '#1e293b'; 
        ctx.fillRect(0, 0, 150, CANVAS_HEIGHT);
        ctx.fillStyle = '#64748b';
        ctx.font = '14px sans-serif'; ctx.fillText('SOIL (Hypotonic)', 20, 30);

        // -- Central Cell Row (X: 50 to 650) --
        
        // Root Hair & Epidermis (X: 150 - 250, root hair extends to 30)
        ctx.fillStyle = 'rgba(22, 101, 52, 0.2)'; 
        ctx.strokeStyle = '#15803d'; 
        ctx.lineWidth = 6;
        
        // Root Hair protrusion
        ctx.beginPath(); 
        ctx.moveTo(150, ROW_TOP); ctx.lineTo(30, ROW_TOP); ctx.lineTo(30, ROW_BOTTOM); ctx.lineTo(150, ROW_BOTTOM);
        ctx.stroke();
        ctx.fillRect(30, ROW_TOP, 120, ROW_BOTTOM - ROW_TOP);
        
        // Epidermis Body
        ctx.strokeRect(150, ROW_TOP, 100, ROW_BOTTOM - ROW_TOP);
        ctx.fillRect(150, ROW_TOP, 100, ROW_BOTTOM - ROW_TOP);
        ctx.fillStyle = '#86efac'; ctx.fillText('EPIDERMIS', 155, ROW_TOP - 15);

        // Cortex (X: 250 - 450)
        ctx.fillStyle = 'rgba(20, 83, 45, 0.3)';
        ctx.fillRect(250, ROW_TOP, 200, ROW_BOTTOM - ROW_TOP);
        ctx.strokeRect(250, ROW_TOP, 100, ROW_BOTTOM - ROW_TOP); // Cell 1
        ctx.strokeRect(350, ROW_TOP, 100, ROW_BOTTOM - ROW_TOP); // Cell 2
        ctx.fillStyle = '#86efac'; ctx.fillText('CORTEX', 260, ROW_TOP - 15);

        // Endodermis (X: 450 - 550) - Active Transport Zone
        ctx.fillStyle = atpActive ? 'rgba(234, 179, 8, 0.2)' : 'rgba(20, 83, 45, 0.3)';
        ctx.fillRect(450, ROW_TOP, 100, ROW_BOTTOM - ROW_TOP);
        ctx.strokeStyle = atpActive ? '#eab308' : '#15803d';
        ctx.strokeRect(450, ROW_TOP, 100, ROW_BOTTOM - ROW_TOP);
        ctx.fillStyle = atpActive ? '#fef08a' : '#86efac'; 
        ctx.fillText('ENDODERMIS', 455, ROW_TOP - 15);

        // Casparian Strip (Blocks apoplast) - Thick red lines on top/bottom of endodermis
        ctx.strokeStyle = '#ef4444'; 
        ctx.lineWidth = 10;
        ctx.beginPath(); ctx.moveTo(480, ROW_TOP); ctx.lineTo(520, ROW_TOP); ctx.stroke(); // Top wall
        ctx.beginPath(); ctx.moveTo(480, ROW_BOTTOM); ctx.lineTo(520, ROW_BOTTOM); ctx.stroke(); // Bottom wall
        
        ctx.fillStyle = '#fca5a5'; ctx.font = '10px sans-serif'; 
        ctx.fillText('CASPARIAN STRIP', 455, ROW_TOP + 20);
        ctx.fillText('CASPARIAN STRIP', 455, ROW_BOTTOM - 15);

        // Xylem (X: 550 - 650)
        ctx.fillStyle = 'rgba(15, 23, 42, 0.8)';
        ctx.fillRect(550, 0, 100, CANVAS_HEIGHT);
        
        ctx.strokeStyle = '#713f12'; 
        ctx.lineWidth = 8;
        ctx.beginPath(); ctx.moveTo(550, 0); ctx.lineTo(550, CANVAS_HEIGHT); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(650, 0); ctx.lineTo(650, CANVAS_HEIGHT); ctx.stroke();
        
        ctx.fillStyle = '#cbd5e1'; ctx.font = '14px sans-serif'; 
        ctx.fillText('XYLEM (Hypertonic)', 560, 30);

        // Xylem Water Column
        ctx.fillStyle = 'rgba(56, 189, 248, 0.3)'; 
        const renderHeight = Math.min(CANVAS_HEIGHT, state.waterColumnHeight);
        ctx.fillRect(554, CANVAS_HEIGHT - renderHeight, 92, renderHeight);
        
        // Draw Plasmodesmata (Gaps in cell walls for symplast)
        ctx.fillStyle = '#0f172a'; // Background color to "cut" holes
        const pSize = 16;
        const walls = [150, 250, 350, 450, 550];
        walls.forEach(wx => {
           ctx.fillRect(wx - 4, ROW_CENTER - pSize/2, 8, pSize);
        });

        // --- 3. Particle System (Flow Dynamics) ---
        
        const flowRate = Math.max(0, gradient * 0.05); // 0 flow if gradient is negative
        
        if (flowRate > 0 && time - state.lastSpawn > (100 / flowRate)) {
          // Spawn Water
          const isSymplast = Math.random() > 0.5;
          state.particles.push({
            id: Math.random(),
            type: 'water',
            path: isSymplast ? 'symplast' : 'apoplast',
            x: 20,
            y: isSymplast ? ROW_CENTER + (Math.random()*12-6) : (Math.random() > 0.5 ? ROW_TOP + 4 : ROW_BOTTOM - 4),
            speed: flowRate + Math.random(),
            stuck: false
          });

          // Spawn Minerals from soil
          if (Math.random() < (soilMinerals / 100)) {
            state.particles.push({
              id: Math.random(),
              type: 'mineral',
              path: 'symplast', 
              x: 20,
              y: ROW_CENTER + (Math.random()*20-10),
              speed: flowRate * 0.8 + Math.random(),
              stuck: false
            });
          }
          state.lastSpawn = time;
        }

        let activeParticles = [];

        state.particles.forEach(p => {
          if (!p.stuck) {
            if (p.x < 560) { 
              p.x += p.speed;
              
              // Casparian Strip Collision Check
              if (p.path === 'apoplast' && p.x > 440 && p.x < 480) {
                // Must divert into the symplast (center of cell)
                if (p.y < ROW_CENTER - 10) p.y += 2;
                if (p.y > ROW_CENTER + 10) p.y -= 2;
                
                if (Math.abs(p.y - ROW_CENTER) <= 12) p.path = 'symplast';
              }

              // Active Transport Check at Endodermis
              if (p.type === 'mineral' && p.x > 450 && p.x < 550) {
                if (!atpActive) {
                  p.stuck = true; 
                } else {
                  p.x += 1.5; // Active pumping speed boost
                }
              }

            } else if (p.x >= 560 && p.x < 600) {
              // Entering Xylem, transition to upward flow
              p.x += (600 - p.x) * 0.1;
              p.y -= p.speed * 0.8; // Decreased upward speed in xylem
            } else {
              // Flowing up the Xylem stem
              p.y -= p.speed * 1.2; // Decreased upward speed in xylem
            }
          }

          // Render Particle
          if (p.y > -20 && p.y <= CANVAS_HEIGHT) { 
            ctx.beginPath();
            if (p.type === 'water') {
              ctx.fillStyle = p.path === 'symplast' ? '#0284c7' : '#7dd3fc'; 
              ctx.arc(p.x, p.y, 3.5, 0, Math.PI * 2); // Slightly increased water size
              ctx.fill();
            } else {
              ctx.fillStyle = '#fbbf24'; 
              const renderX = p.stuck ? p.x + (Math.random()*2-1) : p.x;
              ctx.arc(renderX, p.y, 6, 0, Math.PI * 2); // Noticeably larger mineral ions
              ctx.fill();
              
              // Add a white stroke to make minerals pop out clearly
              ctx.lineWidth = 1.5;
              ctx.strokeStyle = '#ffffff';
              ctx.stroke();
            }
            activeParticles.push(p);
          }
        });

        state.particles = activeParticles;

        // Draw Particle Legend Overlays directly on canvas
        if (atpActive) {
           ctx.fillStyle = '#eab308'; ctx.font = 'bold 12px sans-serif'; 
           ctx.fillText('ACTIVE PUMPING (ATP)', 445, ROW_TOP - 40);
           // Draw little arrows pointing into xylem
           ctx.beginPath(); ctx.moveTo(520, ROW_CENTER); ctx.lineTo(540, ROW_CENTER); ctx.lineTo(530, ROW_CENTER-5); ctx.moveTo(540, ROW_CENTER); ctx.lineTo(530, ROW_CENTER+5); ctx.stroke();
        }

        requestRef.current = requestAnimationFrame(render);
      }, [isRunning, atpActive, soilMinerals]);

      useEffect(() => {
        requestRef.current = requestAnimationFrame(render);
        return () => cancelAnimationFrame(requestRef.current);
      }, [render]);

      useEffect(() => {
        const interval = setInterval(() => {
          const state = simState.current;
          const gradient = state.xylemSoluteAccumulation - soilMinerals;
          setMetrics({
            xylemConc: state.xylemSoluteAccumulation,
            osmoticGradient: gradient,
            waterLevel: state.waterColumnHeight
          });
        }, 200);
        return () => clearInterval(interval);
      }, [soilMinerals]);

      return (
        <div className="flex flex-col h-screen max-h-[1000px] min-h-[750px] bg-slate-900 text-slate-100 font-sans overflow-hidden">
          
          <header className="flex items-center justify-between p-4 bg-slate-800 border-b border-slate-700 shadow-md z-10 shrink-0">
            <div className="flex items-center gap-3">
              <ArrowUp className="text-emerald-400 w-8 h-8" />
              <div>
                <h1 className="text-xl md:text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-emerald-400 to-sky-400">
                  Root Pressure Visualizer
                </h1>
                <p className="text-xs text-slate-400">Osmosis, Active Transport & Water Potential</p>
              </div>
            </div>
            
            <div className="flex items-center gap-4 bg-slate-900 p-2 rounded-xl border border-slate-700">
              <button 
                onClick={() => setIsRunning(!isRunning)}
                className={`flex items-center gap-2 px-4 py-2 rounded-lg font-bold transition-all text-sm ${
                  isRunning ? 'bg-rose-500/20 text-rose-400 hover:bg-rose-500/30' : 'bg-emerald-500/20 text-emerald-400 hover:bg-emerald-500/30'
                }`}
              >
                {isRunning ? <Pause className="w-4 h-4" /> : <Play className="w-4 h-4" />}
                {isRunning ? 'PAUSE' : 'PLAY'}
              </button>
            </div>
          </header>

          <main className="flex-1 flex flex-col lg:flex-row relative">
            
            <aside className="w-full lg:w-[380px] p-6 bg-slate-800/50 border-r border-slate-700 overflow-y-auto flex flex-col gap-6 z-10 shrink-0">
              
              <div>
                <h2 className="text-lg font-semibold mb-4 text-slate-200 flex items-center gap-2">
                  <Activity className="w-5 h-5 text-indigo-400" />
                  Plant Physiology Controls
                </h2>
                
                {/* ATP Toggle */}
                <div className={`mb-6 p-4 rounded-xl border transition-colors ${atpActive ? 'bg-amber-900/20 border-amber-500/50' : 'bg-slate-900 border-slate-700'}`}>
                  <div className="flex items-center justify-between mb-2">
                    <span className="flex items-center gap-2 text-sm font-bold text-slate-200">
                      <Zap className={`w-5 h-5 ${atpActive ? 'text-amber-400' : 'text-slate-500'}`}/> 
                      Active Transport (ATP)
                    </span>
                    <button 
                      onClick={() => setAtpActive(!atpActive)}
                      className={`relative inline-flex h-6 w-11 items-center rounded-full transition-colors ${atpActive ? 'bg-amber-500' : 'bg-slate-600'}`}
                    >
                      <span className={`inline-block h-4 w-4 transform rounded-full bg-white transition-transform ${atpActive ? 'translate-x-6' : 'translate-x-1'}`} />
                    </button>
                  </div>
                  <p className="text-xs text-slate-400">
                    Endodermis cells consume ATP to actively pump mineral ions into the xylem against the concentration gradient.
                  </p>
                </div>

                {/* Soil Mineral Slider */}
                <div className="mb-6 bg-slate-900 p-4 rounded-xl border border-slate-700">
                  <label className="flex justify-between text-sm mb-2 text-slate-300">
                    <span className="flex items-center gap-1 font-bold">Soil Solute Concentration</span>
                    <span className="font-mono text-emerald-400">{soilMinerals}%</span>
                  </label>
                  <input 
                    type="range" min="0" max="100" step="5"
                    value={soilMinerals}
                    onChange={(e) => setSoilMinerals(parseFloat(e.target.value))}
                    className="w-full accent-emerald-500 cursor-pointer"
                  />
                  <p className="text-xs text-slate-500 mt-2">
                    Increasing soil minerals (e.g. over-fertilization) lowers soil water potential (makes it more negative). Water flows towards the lower potential.
                  </p>
                </div>
              </div>

              {/* Physics Dashboard */}
              <div className="mt-auto">
                <h2 className="text-lg font-semibold mb-3 text-slate-200 flex items-center gap-2">
                  <Droplets className="w-5 h-5 text-sky-400" />
                  Hydrostatic Metrics
                </h2>
                <div className="bg-slate-900 rounded-xl p-4 border border-slate-700 space-y-4">
                  
                  <div className="flex justify-between items-center text-sm">
                    <span className="text-slate-400">Xylem Solute Conc.</span>
                    <span className="font-mono text-amber-400 font-bold">{metrics.xylemConc.toFixed(1)}%</span>
                  </div>
                  
                  <div className="h-px bg-slate-800 w-full"></div>
                  
                  <div className="flex justify-between items-center text-sm">
                    <span className="text-slate-400">Osmotic Gradient (Δ)</span>
                    <span className={`font-mono font-bold ${metrics.osmoticGradient > 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                      {metrics.osmoticGradient > 0 ? '+' : ''}{metrics.osmoticGradient.toFixed(1)}
                    </span>
                  </div>

                  {metrics.osmoticGradient <= 0 && (
                    <div className="flex items-center gap-2 text-xs text-rose-400 bg-rose-500/10 p-2 rounded border border-rose-500/20">
                      <AlertTriangle className="w-5 h-5 shrink-0" /> 
                      Soil is hypertonic! Water potential reversed. Root pressure lost (Wilting/Plasmolysis).
                    </div>
                  )}

                  <div className="h-px bg-slate-800 w-full"></div>

                  <div>
                    <div className="flex justify-between items-center text-sm mb-1">
                      <span className="text-white font-bold">Root Pressure Generated</span>
                      <span className="font-mono text-sky-400 font-bold">
                        {Math.max(0, metrics.waterLevel / 5).toFixed(1)} kPa
                      </span>
                    </div>
                    <div className="w-full h-2 bg-slate-800 rounded-full overflow-hidden">
                      <div 
                        className="h-full bg-sky-500 transition-all duration-300" 
                        style={{ width: `${Math.min(100, Math.max(0, metrics.waterLevel / 4))}%` }}
                      />
                    </div>
                  </div>

                </div>
              </div>
            </aside>

            <div className="flex-1 relative flex flex-col p-4 bg-slate-950">
              
              <div className="flex flex-wrap gap-4 mb-4 bg-slate-800/80 p-3 rounded-xl border border-slate-700 text-xs text-slate-300 items-center justify-center shadow-md">
                <span className="font-semibold text-white mr-2"><Info className="inline w-4 h-4 mb-0.5 text-blue-400"/> Legend:</span>
                <div className="flex items-center gap-1.5"><div className="w-3 h-3 rounded-full bg-[#0284c7]"></div> Symplastic Water (Cytoplasm)</div>
                <div className="flex items-center gap-1.5"><div className="w-3 h-3 rounded-full bg-[#7dd3fc]"></div> Apoplastic Water (Cell Walls)</div>
                <div className="flex items-center gap-1.5"><div className="w-4 h-4 rounded-full bg-[#fbbf24] border-[1.5px] border-white"></div> Mineral Ions</div>
                <div className="flex items-center gap-1.5"><div className="w-3 h-1 bg-[#ef4444]"></div> Casparian Strip</div>
              </div>

              <div className="flex-1 w-full bg-[#0f172a] rounded-xl border-2 border-slate-700 overflow-hidden relative shadow-2xl shadow-sky-900/10">
                <canvas 
                  ref={canvasRef} 
                  width={CANVAS_WIDTH} 
                  height={CANVAS_HEIGHT} 
                  className="absolute top-0 left-0 w-full h-full object-contain"
                />
              </div>

            </div>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
