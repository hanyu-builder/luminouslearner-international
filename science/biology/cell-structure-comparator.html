<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Biology Virtual Labs - Cell Structure Comparator</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Three.js Core and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        body {
            background-color: #0F172A; 
            color: #F8FAFC;
            touch-action: none; 
            user-select: none;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1E293B; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748B; }

        #threejs-container canvas {
            outline: none;
            cursor: grab;
        }
        #threejs-container canvas:active {
            cursor: grabbing;
        }

        /* Tooltip animation */
        @keyframes float {
            0% { transform: translateY(0px) translateX(-50%); }
            50% { transform: translateY(-5px) translateX(-50%); }
            100% { transform: translateY(0px) translateX(-50%); }
        }
        .tooltip-float {
            animation: float 3s ease-in-out infinite;
        }
        
        /* Custom Checkbox */
        .organelle-checkbox {
            appearance: none;
            width: 16px;
            height: 16px;
            border: 2px solid #475569;
            border-radius: 4px;
            background-color: transparent;
            cursor: pointer;
            position: relative;
        }
        .organelle-checkbox:checked {
            background-color: #3b82f6;
            border-color: #3b82f6;
        }
        .organelle-checkbox:checked::after {
            content: '';
            position: absolute;
            left: 4px;
            top: 0px;
            width: 5px;
            height: 10px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }
    </style>
</head>
<body class="h-screen w-screen flex justify-center items-center p-2 md:p-4 antialiased">

    <!-- Main Application Container -->
    <div class="w-full h-full max-w-[1400px] max-h-[950px] flex flex-col bg-slate-900 rounded-2xl shadow-2xl overflow-hidden relative border border-slate-700/50">
        
        <!-- Header -->
        <header class="p-4 md:px-6 border-b border-slate-700 flex flex-col md:flex-row justify-between items-center bg-slate-800/80 backdrop-blur-sm z-10 shrink-0 gap-3 md:gap-0">
            <div>
                <h1 class="text-2xl md:text-3xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-500 flex items-center gap-3">
                    <i class="fa-solid fa-microscope text-emerald-400"></i> Cell Structure Comparator
                </h1>
                <p class="text-[10px] md:text-xs font-medium text-slate-400 uppercase tracking-widest mt-1">Interactive 3D Virtual Lab</p>
            </div>
            
            <!-- Cell Type Selector -->
            <div class="flex bg-slate-900/80 p-1 rounded-xl border border-slate-700 shadow-inner">
                <button id="btn-animal" class="cell-tab active px-4 py-2 rounded-lg text-sm font-bold transition-all bg-blue-500/20 text-blue-400 border border-blue-500/50 shadow-[0_0_10px_rgba(59,130,246,0.2)]">
                    <i class="fa-solid fa-paw mr-1"></i> Animal
                </button>
                <button id="btn-plant" class="cell-tab px-4 py-2 rounded-lg text-sm font-bold transition-all text-slate-400 hover:text-slate-200 border border-transparent">
                    <i class="fa-solid fa-leaf mr-1"></i> Plant
                </button>
                <button id="btn-prokaryote" class="cell-tab px-4 py-2 rounded-lg text-sm font-bold transition-all text-slate-400 hover:text-slate-200 border border-transparent">
                    <i class="fa-solid fa-capsules mr-1"></i> Prokaryote
                </button>
            </div>
        </header>

        <!-- Main Layout (Sidebar + 3D View) -->
        <main class="flex flex-col md:flex-row flex-1 overflow-hidden relative z-0">
            
            <!-- Left Sidebar (Controls & Info) -->
            <aside class="w-full md:w-[350px] lg:w-[400px] flex flex-col gap-4 p-4 shrink-0 h-full overflow-y-auto bg-slate-800/30 border-r border-slate-700">
                
                <!-- Educational Info Panel -->
                <div class="bg-slate-800 rounded-xl p-5 border border-slate-700 shadow-lg relative overflow-hidden flex flex-col min-h-[250px]">
                    <div class="absolute top-0 left-0 w-1 h-full bg-emerald-500" id="info-accent"></div>
                    
                    <h3 class="text-xs uppercase tracking-widest text-slate-400 font-bold mb-1">Organelle Scanner</h3>
                    <h2 id="info-title" class="text-2xl font-black text-white mb-2 flex items-center gap-2">
                        <i class="fa-solid fa-crosshairs text-emerald-400"></i> Hover an object
                    </h2>
                    
                    <div class="bg-slate-900/50 rounded-lg p-3 border border-slate-700/50 flex-1 flex flex-col justify-center items-center text-center" id="info-empty">
                        <i class="fa-solid fa-magnifying-glass text-3xl text-slate-600 mb-2"></i>
                        <p class="text-sm text-slate-400">Rotate the 3D model and interact with the organelles to view their functions.</p>
                    </div>

                    <div class="hidden flex-1 flex-col gap-3" id="info-content">
                        <p id="info-desc" class="text-sm text-slate-300 leading-relaxed"></p>
                        <div class="mt-auto pt-3 border-t border-slate-700">
                            <span class="text-[10px] text-slate-500 uppercase font-bold tracking-wider">Found In:</span>
                            <div id="info-tags" class="flex flex-wrap gap-2 mt-1">
                                <!-- Tags injected via JS -->
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Visibility Toggles -->
                <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 shadow-inner flex flex-col flex-1">
                    <div class="flex justify-between items-center border-b border-slate-700 pb-2 mb-3">
                        <h3 class="text-xs uppercase tracking-widest text-slate-400 font-bold"><i class="fa-solid fa-eye mr-1"></i> Visibility Controls</h3>
                        <button id="toggle-all-btn" class="text-xs text-blue-400 hover:text-blue-300 font-semibold">Toggle All</button>
                    </div>
                    
                    <div id="visibility-list" class="flex flex-col gap-2 overflow-y-auto pr-2">
                        <!-- Checkboxes populated by JS based on cell type -->
                    </div>
                </div>
            </aside>

            <!-- 3D Canvas Area -->
            <section class="flex-1 relative bg-slate-950 shadow-inner overflow-hidden" id="threejs-container">
                <!-- Background Grid styling -->
                <div class="absolute inset-0 pointer-events-none opacity-10" style="background-image: radial-gradient(#94a3b8 1px, transparent 1px); background-size: 30px 30px;"></div>
                
                <!-- Floating 3D Tooltip -->
                <div id="floating-tooltip" class="absolute pointer-events-none opacity-0 transition-opacity duration-200 z-20 left-1/2 top-1/2 -translate-x-1/2 -translate-y-full pb-4 tooltip-float">
                    <div class="bg-slate-900/90 backdrop-blur border border-slate-600 text-white px-3 py-1.5 rounded-lg shadow-xl text-sm font-bold whitespace-nowrap flex items-center gap-2">
                        <span id="tooltip-dot" class="w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_8px_#34d399]"></span>
                        <span id="tooltip-text">Nucleus</span>
                    </div>
                </div>

                <!-- Interaction Hint -->
                <div class="absolute bottom-6 left-1/2 -translate-x-1/2 bg-slate-900/80 backdrop-blur px-4 py-2 rounded-full border border-slate-700 text-xs text-slate-300 font-mono shadow-lg pointer-events-none flex items-center gap-3">
                    <span class="flex items-center gap-1"><i class="fa-solid fa-arrow-pointer text-blue-400"></i> Hover</span>
                    <span class="w-1 h-1 rounded-full bg-slate-600"></span>
                    <span class="flex items-center gap-1"><i class="fa-solid fa-hand text-emerald-400"></i> Drag/Rotate</span>
                    <span class="w-1 h-1 rounded-full bg-slate-600"></span>
                    <span class="flex items-center gap-1"><i class="fa-solid fa-magnifying-glass-plus text-purple-400"></i> Scroll/Zoom</span>
                </div>
                
                <button id="reset-cam-btn" class="absolute top-4 right-4 bg-slate-800/80 hover:bg-slate-700 text-slate-300 p-2 px-3 rounded-lg border border-slate-600 transition-colors text-xs font-semibold backdrop-blur shadow-lg z-10 flex items-center gap-2">
                    <i class="fa-solid fa-video"></i> Reset Camera
                </button>
            </section>
        </main>
    </div>

    <!-- Core Simulation Script -->
    <script>
        /**
         * CELL STRUCTURE COMPARATOR
         * Procedural 3D Modeling, Raycasting, and Educational UI
         */

        // ==========================================
        // DATABASE: ORGANELLE KNOWLEDGE BASE
        // ==========================================
        const ORGANELLE_DATA = {
            'membrane': { name: 'Cell Membrane', color: '#3b82f6', desc: 'A semi-permeable lipid bilayer that controls the movement of substances in and out of the cell.', types: ['Animal', 'Plant', 'Prokaryote'] },
            'nucleus': { name: 'Nucleus', color: '#a855f7', desc: 'The command center of the cell containing genetic material (DNA). It coordinates cell activities like growth and reproduction.', types: ['Animal', 'Plant'] },
            'nucleolus': { name: 'Nucleolus', color: '#c026d3', desc: 'A dense structure inside the nucleus responsible for producing and assembling ribosomes.', types: ['Animal', 'Plant'] },
            'mitochondria': { name: 'Mitochondrion', color: '#f97316', desc: 'The powerhouse of the cell. Generates most of the chemical energy (ATP) needed to power the cell\'s biochemical reactions.', types: ['Animal', 'Plant'] },
            'golgi': { name: 'Golgi Apparatus', color: '#ec4899', desc: 'Modifies, sorts, and packages proteins and lipids for transport inside or outside the cell.', types: ['Animal', 'Plant'] },
            'er': { name: 'Endoplasmic Reticulum', color: '#8b5cf6', desc: 'A network of membranous tubules. Rough ER (with ribosomes) synthesizes proteins; Smooth ER synthesizes lipids.', types: ['Animal', 'Plant'] },
            'ribosome': { name: 'Ribosomes', color: '#fcd34d', desc: 'Tiny structures that act as the site of protein synthesis. Can be free-floating or attached to the Rough ER.', types: ['Animal', 'Plant', 'Prokaryote'] },
            'cellwall': { name: 'Cell Wall', color: '#22c55e', desc: 'A rigid outer layer that provides structural support and protection. Made of cellulose in plants and peptidoglycan in bacteria.', types: ['Plant', 'Prokaryote'] },
            'chloroplast': { name: 'Chloroplast', color: '#10b981', desc: 'Site of photosynthesis. Contains chlorophyll, which absorbs sunlight to convert carbon dioxide and water into glucose.', types: ['Plant'] },
            'vacuole': { name: 'Large Central Vacuole', color: '#06b6d4', desc: 'A large fluid-filled sac that stores water, nutrients, and waste products. It helps maintain turgor pressure in plant cells.', types: ['Plant'] },
            'nucleoid': { name: 'Nucleoid DNA', color: '#ef4444', desc: 'An irregularly shaped region within a prokaryote that contains all or most of the genetic material, not enclosed by a membrane.', types: ['Prokaryote'] },
            'capsule': { name: 'Capsule', color: '#eab308', desc: 'A sticky outer layer found in some prokaryotes that provides protection against phagocytosis and prevents dehydration.', types: ['Prokaryote'] },
            'flagellum': { name: 'Flagellum', color: '#94a3b8', desc: 'A whip-like structure that allows a cell to move. Acts like a microscopic motor.', types: ['Prokaryote'] },
            'cytoplasm': { name: 'Cytoplasm', color: '#cbd5e1', desc: 'The jelly-like substance filling the cell, where organelles are suspended and many chemical reactions occur.', types: ['Animal', 'Plant', 'Prokaryote'] }
        };

        // ==========================================
        // THREE.JS SETUP
        // ==========================================
        const container = document.getElementById('threejs-container');
        const tooltip = document.getElementById('floating-tooltip');
        const tooltipText = document.getElementById('tooltip-text');
        const tooltipDot = document.getElementById('tooltip-dot');
        
        let scene, camera, renderer, controls;
        let cellGroups = { animal: null, plant: null, prokaryote: null };
        let activeCellType = 'animal'; // 'animal', 'plant', 'prokaryote'
        let raycaster, mouse;
        let clickableObjects = []; // Meshes the raycaster checks
        let hoveredObject = null;

        function initThree() {
            // Basic Setup
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0F172A, 0.005); // Blend into background
            
            let w = container.clientWidth;
            let h = container.clientHeight;
            camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 1000);
            camera.position.set(0, 20, 50);

            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(w, h);
            renderer.setPixelRatio(window.devicePixelRatio);
            // Softer shadows
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxDistance = 150;
            controls.minDistance = 10;

            // Lighting setup for depth and gloss
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);
            
            const mainLight = new THREE.DirectionalLight(0xffffff, 0.8);
            mainLight.position.set(20, 40, 30);
            mainLight.castShadow = true;
            mainLight.shadow.mapSize.width = 1024;
            mainLight.shadow.mapSize.height = 1024;
            scene.add(mainLight);

            const backLight = new THREE.DirectionalLight(0xffffff, 0.3);
            backLight.position.set(-20, -20, -20);
            scene.add(backLight);

            // Raycaster
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Build Models
            buildAnimalCell();
            buildPlantCell();
            buildProkaryoteCell();

            // Set Initial State
            switchCellType('animal');

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            container.addEventListener('mousemove', onMouseMove);
            container.addEventListener('click', onClick);
            
            document.getElementById('reset-cam-btn').addEventListener('click', () => {
                // Smoothly reset camera (simple implementation jumps)
                camera.position.set(0, 20, 50);
                controls.target.set(0,0,0);
            });

            // Start Loop
            animate();
        }

        // ==========================================
        // PROCEDURAL MODEL GENERATORS
        // ==========================================
        
        // Helper: Creates a mesh, adds shadows, attaches data, and adds to clickable array
        function createOrganelle(geometry, material, id, group) {
            const mesh = new THREE.Mesh(geometry, material);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.userData = { id: id, originalEmissive: material.emissive ? material.emissive.getHex() : 0x000000 };
            
            // Outer membranes are often large and transparent, blocking raycasts to inner objects.
            // We only make the outer shells clickable if they are specifically targeted, but usually 
            // we want to look inside. We will add all to clickable, but handle transparency in raycasting if needed.
            clickableObjects.push(mesh);
            group.add(mesh);
            return mesh;
        }

        function buildAnimalCell() {
            const group = new THREE.Group();
            
            // 1. Cell Membrane (Transparent Outer Sphere)
            // Cut in half so we can see inside easily
            const memGeo = new THREE.SphereGeometry(18, 32, 32, 0, Math.PI * 2, 0, Math.PI * 0.6);
            const memMat = new THREE.MeshPhysicalMaterial({ 
                color: 0x3b82f6, transparent: true, opacity: 0.25, side: THREE.DoubleSide, 
                roughness: 0.2, metalness: 0.1, clearcoat: 1.0
            });
            createOrganelle(memGeo, memMat, 'membrane', group);

            // 2. Nucleus
            const nucGeo = new THREE.SphereGeometry(4, 32, 32);
            const nucMat = new THREE.MeshLambertMaterial({ color: 0xa855f7 });
            const nucleus = createOrganelle(nucGeo, nucMat, 'nucleus', group);
            nucleus.position.set(0, 0, 0);

            // Nucleolus
            const nucOlusGeo = new THREE.SphereGeometry(1.5, 16, 16);
            const nucOlusMat = new THREE.MeshLambertMaterial({ color: 0xc026d3 });
            const nucleolus = createOrganelle(nucOlusGeo, nucOlusMat, 'nucleolus', group);
            nucleolus.position.set(1.5, 1.5, 1);

            // 3. Mitochondria (Multiple)
            // Replaced CapsuleGeometry with scaled SphereGeometry for better compatibility with r128
            const mitoGeo = new THREE.SphereGeometry(1.2, 16, 16);
            mitoGeo.scale(1, 2.5, 1); // Elongates the sphere to form an organic capsule shape
            const mitoMat = new THREE.MeshLambertMaterial({ color: 0xf97316 });
            
            const mitoPositions = [
                {p: [8, 2, 5], r: [0.5, 0.2, 1]},
                {p: [-7, -3, 6], r: [-0.4, 1.2, 0]},
                {p: [2, -6, -8], r: [1.2, 0, 0.5]},
                {p: [-5, 5, -5], r: [0.1, 0.8, 2]}
            ];
            mitoPositions.forEach(pos => {
                let m = createOrganelle(mitoGeo, mitoMat, 'mitochondria', group);
                m.position.set(...pos.p); m.rotation.set(...pos.r);
            });

            // 4. ER (Endoplasmic Reticulum) - Abstract ribbons around nucleus
            const erGeo = new THREE.TorusGeometry(6, 0.6, 16, 50, Math.PI * 1.5);
            const erMat = new THREE.MeshLambertMaterial({ color: 0x8b5cf6 });
            const er1 = createOrganelle(erGeo, erMat, 'er', group);
            er1.rotation.set(Math.PI/2, 0.2, 0);
            const er2 = createOrganelle(erGeo, erMat, 'er', group);
            er2.rotation.set(Math.PI/2.5, -0.4, Math.PI);

            // 5. Golgi - Stacked flattened curved cylinders
            const golgiGroup = new THREE.Group();
            const golgiMat = new THREE.MeshLambertMaterial({ color: 0xec4899 });
            for(let i=0; i<4; i++) {
                let g = createOrganelle(new THREE.TorusGeometry(3 + i*0.5, 0.4, 16, 30, Math.PI*0.8), golgiMat, 'golgi', golgiGroup);
                g.position.set(0, i*0.8, 0);
            }
            golgiGroup.position.set(-8, 2, -2);
            golgiGroup.rotation.set(0.5, -0.5, 0);
            group.add(golgiGroup);

            // 6. Ribosomes (Tiny dots)
            const riboGeo = new THREE.SphereGeometry(0.3, 8, 8);
            const riboMat = new THREE.MeshLambertMaterial({ color: 0xfcd34d });
            for(let i=0; i<30; i++) {
                let r = createOrganelle(riboGeo, riboMat, 'ribosome', group);
                // Random position within membrane
                let rVec = new THREE.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).normalize().multiplyScalar(Math.random() * 15 + 2);
                r.position.copy(rVec);
            }

            cellGroups.animal = group;
            scene.add(group);
        }

        function buildPlantCell() {
            const group = new THREE.Group();

            // 1. Cell Wall (Hexagonal Prism / Box)
            // Cut half to see inside
            const shape = new THREE.Shape();
            shape.moveTo(8, 12); shape.lineTo(8, -12); shape.lineTo(-8, -12); shape.lineTo(-8, 12); shape.lineTo(8, 12);
            // Create a hollow box effect by rendering outer faces but cutting top off. 
            // For simplicity, use BoxGeometry with cut materials.
            const wallGeo = new THREE.BoxGeometry(20, 24, 20);
            const wallMat = new THREE.MeshPhysicalMaterial({ 
                color: 0x22c55e, transparent: true, opacity: 0.3, side: THREE.DoubleSide, roughness: 0.6
            });
            createOrganelle(wallGeo, wallMat, 'cellwall', group);

            // 2. Large Central Vacuole
            const vacGeo = new THREE.BoxGeometry(12, 16, 12);
            const vacMat = new THREE.MeshPhysicalMaterial({
                color: 0x06b6d4, transparent: true, opacity: 0.6, transmission: 0.5, roughness: 0.1
            });
            const vacuole = createOrganelle(vacGeo, vacMat, 'vacuole', group);
            vacuole.position.set(0, 0, 0);

            // 3. Nucleus (Pushed to the side)
            const nucGeo = new THREE.SphereGeometry(3.5, 32, 32);
            const nucMat = new THREE.MeshLambertMaterial({ color: 0xa855f7 });
            const nucleus = createOrganelle(nucGeo, nucMat, 'nucleus', group);
            nucleus.position.set(-6, -6, 6);

            // 4. Chloroplasts (Green disks)
            const chloroGeo = new THREE.CylinderGeometry(1.5, 1.5, 0.8, 16);
            const chloroMat = new THREE.MeshLambertMaterial({ color: 0x10b981 });
            const chloroPositions = [
                {p: [6, 8, 6], r: [0.2, 0, 0]}, {p: [-6, 5, -6], r: [1.2, 0.4, 0]},
                {p: [7, -5, -5], r: [-0.5, 0, 0.2]}, {p: [2, 9, -7], r: [0, 0.8, 0]}
            ];
            chloroPositions.forEach(pos => {
                let c = createOrganelle(chloroGeo, chloroMat, 'chloroplast', group);
                c.position.set(...pos.p); c.rotation.set(...pos.r);
            });

            // 5. Mitochondria
            // Replaced CapsuleGeometry with scaled SphereGeometry for better compatibility with r128
            const mitoGeo = new THREE.SphereGeometry(0.9, 16, 16);
            mitoGeo.scale(1, 2.5, 1);
            const mitoMat = new THREE.MeshLambertMaterial({ color: 0xf97316 });
            createOrganelle(mitoGeo, mitoMat, 'mitochondria', group).position.set(5, -8, 5);
            createOrganelle(mitoGeo, mitoMat, 'mitochondria', group).position.set(-5, 8, 5);

            cellGroups.plant = group;
            scene.add(group);
        }

        function buildProkaryoteCell() {
            const group = new THREE.Group();

            // 1. Capsule / Cell Wall
            // Replaced CapsuleGeometry with scaled SphereGeometry for better compatibility with r128
            const capGeo = new THREE.SphereGeometry(6, 32, 32);
            capGeo.scale(1, 2.2, 1); // Scale Y to elongate the sphere into a rod/capsule shape
            // Rotate to lie flat
            capGeo.rotateZ(Math.PI / 2);
            const capMat = new THREE.MeshPhysicalMaterial({
                color: 0xeab308, transparent: true, opacity: 0.35, side: THREE.DoubleSide
            });
            createOrganelle(capGeo, capMat, 'capsule', group);

            // 2. Nucleoid DNA (Tangled mess)
            const nucGroup = new THREE.Group();
            const dnaMat = new THREE.LineBasicMaterial({ color: 0xef4444, linewidth: 3 });
            // Generate random walk points
            const points = [];
            let currentPoint = new THREE.Vector3(0,0,0);
            for(let i=0; i<150; i++) {
                points.push(currentPoint.clone());
                let dir = new THREE.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).normalize().multiplyScalar(0.8);
                currentPoint.add(dir);
                // Keep constrained in center
                if(currentPoint.length() > 4) currentPoint.multiplyScalar(0.8);
            }
            const dnaGeo = new THREE.BufferGeometry().setFromPoints(points);
            const dnaLine = new THREE.Line(dnaGeo, dnaMat);
            // We use a helper mesh for raycasting lines easily
            const nucHitGeo = new THREE.SphereGeometry(4, 16, 16);
            const nucHitMat = new THREE.MeshBasicMaterial({visible: false});
            const nucHitbox = createOrganelle(nucHitGeo, nucHitMat, 'nucleoid', nucGroup);
            
            nucGroup.add(dnaLine);
            nucGroup.position.set(-2, 0, 0);
            group.add(nucGroup);

            // 3. Ribosomes
            const riboGeo = new THREE.SphereGeometry(0.4, 8, 8);
            const riboMat = new THREE.MeshLambertMaterial({ color: 0xfcd34d });
            for(let i=0; i<40; i++) {
                let r = createOrganelle(riboGeo, riboMat, 'ribosome', group);
                let x = (Math.random()-0.5) * 18;
                let y = (Math.random()-0.5) * 8;
                let z = (Math.random()-0.5) * 8;
                // constrain to capsule shape roughly
                if (Math.hypot(y, z) < 5) r.position.set(x, y, z);
            }

            // 4. Flagellum (Tail)
            const path = new THREE.CatmullRomCurve3([
                new THREE.Vector3(10, 0, 0),
                new THREE.Vector3(14, 2, 1),
                new THREE.Vector3(18, -2, -1),
                new THREE.Vector3(22, 1, 0),
                new THREE.Vector3(26, -1, 1)
            ]);
            const flagGeo = new THREE.TubeGeometry(path, 20, 0.4, 8, false);
            const flagMat = new THREE.MeshLambertMaterial({ color: 0x94a3b8 });
            createOrganelle(flagGeo, flagMat, 'flagellum', group);

            cellGroups.prokaryote = group;
            scene.add(group);
        }

        // ==========================================
        // UI & INTERACTION LOGIC
        // ==========================================

        function switchCellType(type) {
            activeCellType = type;
            
            // Hide all, show active
            cellGroups.animal.visible = false;
            cellGroups.plant.visible = false;
            cellGroups.prokaryote.visible = false;
            cellGroups[type].visible = true;

            // Update Tabs UI
            document.querySelectorAll('.cell-tab').forEach(btn => {
                btn.className = "cell-tab px-4 py-2 rounded-lg text-sm font-bold transition-all text-slate-400 hover:text-slate-200 border border-transparent";
            });
            const activeBtn = document.getElementById(`btn-${type}`);
            let themeColor = type === 'animal' ? 'blue' : (type === 'plant' ? 'green' : 'yellow');
            activeBtn.className = `cell-tab active px-4 py-2 rounded-lg text-sm font-bold transition-all bg-${themeColor}-500/20 text-${themeColor}-400 border border-${themeColor}-500/50 shadow-[0_0_10px_rgba(var(--tw-colors-${themeColor}-500),0.2)]`;

            // Clear tooltip and info panel
            clearHighlight();
            populateVisibilityList(type);
        }

        // Setup Tab Listeners
        document.getElementById('btn-animal').addEventListener('click', () => switchCellType('animal'));
        document.getElementById('btn-plant').addEventListener('click', () => switchCellType('plant'));
        document.getElementById('btn-prokaryote').addEventListener('click', () => switchCellType('prokaryote'));

        // Build Sidebar Checkboxes dynamically
        function populateVisibilityList(type) {
            const list = document.getElementById('visibility-list');
            list.innerHTML = '';
            
            // Find unique organelles in this cell
            let uniqueIds = new Set();
            clickableObjects.forEach(mesh => {
                if(mesh.parent === cellGroups[type] || mesh.parent.parent === cellGroups[type]) {
                    uniqueIds.add(mesh.userData.id);
                }
            });

            uniqueIds.forEach(id => {
                const data = ORGANELLE_DATA[id];
                if(!data) return;
                
                const div = document.createElement('div');
                div.className = "flex items-center justify-between p-2 rounded hover:bg-slate-700/50 transition-colors";
                
                div.innerHTML = `
                    <label class="flex items-center gap-3 cursor-pointer text-sm text-slate-300 font-medium">
                        <input type="checkbox" checked class="organelle-checkbox" data-id="${id}">
                        <div class="w-3 h-3 rounded-full shadow-sm" style="background-color: ${data.color}"></div>
                        ${data.name}
                    </label>
                `;
                
                // Add toggle listener
                div.querySelector('input').addEventListener('change', (e) => {
                    const isChecked = e.target.checked;
                    // Find all meshes of this type in active group and toggle
                    clickableObjects.forEach(mesh => {
                        if((mesh.parent === cellGroups[type] || mesh.parent.parent === cellGroups[type]) && mesh.userData.id === id) {
                            // If it's the nucleoid hit sphere, we need to toggle the whole group
                            if(mesh.parent.type === "Group" && id === 'nucleoid') {
                                mesh.parent.visible = isChecked;
                            } else {
                                mesh.visible = isChecked;
                            }
                        }
                    });
                });
                
                list.appendChild(div);
            });
        }

        // Toggle All Button
        document.getElementById('toggle-all-btn').addEventListener('click', (e) => {
            const checkboxes = document.querySelectorAll('.organelle-checkbox');
            // Check if any are unchecked. If so, check all. Else, uncheck all.
            const anyUnchecked = Array.from(checkboxes).some(cb => !cb.checked);
            
            checkboxes.forEach(cb => {
                if(cb.checked !== anyUnchecked) {
                    cb.checked = anyUnchecked;
                    cb.dispatchEvent(new Event('change'));
                }
            });
        });

        // ==========================================
        // RAYCASTING & HIGHLIGHTING
        // ==========================================

        function onMouseMove(event) {
            // Calculate mouse position in normalized device coordinates
            const rect = container.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            // Update Tooltip position (CSS coordinates)
            tooltip.style.left = `${event.clientX - rect.left}px`;
            tooltip.style.top = `${event.clientY - rect.top - 15}px`;
        }

        function onClick(event) {
            if (hoveredObject) {
                updateInfoPanel(hoveredObject.userData.id);
            }
        }

        function clearHighlight() {
            if (hoveredObject) {
                // Revert to original emissive color
                if (hoveredObject.material && hoveredObject.material.emissive) {
                    hoveredObject.material.emissive.setHex(hoveredObject.userData.originalEmissive);
                }
                hoveredObject = null;
            }
            tooltip.style.opacity = '0';
        }

        function handleRaycast() {
            // Only raycast against visible objects
            raycaster.setFromCamera(mouse, camera);
            
            // Filter clickable objects to only those in the currently active cell group
            const activeMeshes = clickableObjects.filter(mesh => {
                let p = mesh;
                while(p) {
                    if(!p.visible) return false;
                    p = p.parent;
                }
                return (mesh.parent === cellGroups[activeCellType] || mesh.parent.parent === cellGroups[activeCellType]);
            });

            // Important: We want to interact with inner objects. Outer membranes block raycasts.
            // If the ray hits a membrane first, check the *second* object it hits as well.
            const intersects = raycaster.intersectObjects(activeMeshes);

            if (intersects.length > 0) {
                // Find the first non-transparent outer shell, OR the outer shell if it's the only thing.
                let targetHit = intersects[0];
                for(let i=0; i<intersects.length; i++) {
                    let id = intersects[i].object.userData.id;
                    if(id !== 'membrane' && id !== 'cellwall' && id !== 'capsule' && id !== 'vacuole') {
                        targetHit = intersects[i];
                        break; // Found an inner solid organelle
                    }
                }

                if (hoveredObject !== targetHit.object) {
                    clearHighlight();
                    hoveredObject = targetHit.object;
                    
                    // Highlight effect (Emissive glow)
                    if (hoveredObject.material && hoveredObject.material.emissive) {
                        // Blend current color to create a highlight
                        hoveredObject.material.emissive.setHex(0x444444);
                    }

                    // Show Tooltip
                    const orgData = ORGANELLE_DATA[hoveredObject.userData.id];
                    if (orgData) {
                        tooltipText.innerText = orgData.name;
                        tooltipDot.style.backgroundColor = orgData.color;
                        tooltipDot.style.boxShadow = `0 0 8px ${orgData.color}`;
                        tooltip.style.opacity = '1';
                    }
                }
            } else {
                clearHighlight();
            }
        }

        function updateInfoPanel(organelleId) {
            const data = ORGANELLE_DATA[organelleId];
            if (!data) return;

            document.getElementById('info-empty').classList.add('hidden');
            document.getElementById('info-content').classList.remove('hidden');
            document.getElementById('info-content').classList.add('animate-fade-in');

            document.getElementById('info-title').innerHTML = `
                <span class="w-4 h-4 rounded-full inline-block shadow-md mr-1" style="background-color: ${data.color}"></span>
                ${data.name}
            `;
            document.getElementById('info-desc').innerText = data.desc;
            document.getElementById('info-accent').style.backgroundColor = data.color;

            // Generate Tags
            const tagsDiv = document.getElementById('info-tags');
            tagsDiv.innerHTML = '';
            data.types.forEach(type => {
                let badgeColor = type === 'Animal' ? 'blue' : (type === 'Plant' ? 'green' : 'yellow');
                tagsDiv.innerHTML += `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-${badgeColor}-900/50 text-${badgeColor}-400 border border-${badgeColor}-700/50">${type}</span>`;
            });
        }

        // ==========================================
        // RENDER LOOP
        // ==========================================

        function animate() {
            requestAnimationFrame(animate);
            controls.update(); // required if controls.enableDamping or controls.autoRotate are set
            
            // Subtle floating animation for cells
            if(cellGroups.animal) cellGroups.animal.position.y = Math.sin(Date.now() * 0.001) * 0.5;
            if(cellGroups.plant) cellGroups.plant.position.y = Math.sin(Date.now() * 0.001) * 0.5;
            if(cellGroups.prokaryote) cellGroups.prokaryote.position.y = Math.sin(Date.now() * 0.001) * 0.5;

            handleRaycast();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            const w = container.clientWidth;
            const h = container.clientHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }

        // Add simple fade animation utility
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
            .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        `;
        document.head.appendChild(style);

        // Start Application
        window.onload = initThree;

    </script>
</body>
</html>
