<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phototropism Simulator</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React and ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for in-browser JSX transpilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#0F172A] text-slate-200 overflow-hidden m-0 p-0">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        /**
         * EXPERT EDUCATIONAL WEB DEVELOPER - PHOTOTROPISM SIMULATOR
         * Target: P4 to S3 Students (Ages 9-15)
         * Core Concept: Auxin redistribution algorithm causing differential growth and light-tracking.
         * Primary SEO Keyword: Phototropism
         */

        function App() {
          // --- STATE ---
          const [isPlaying, setIsPlaying] = useState(false);
          const [time, setTime] = useState(0); // 0 to 100 (Growth Stage)
          const [showHeatmap, setShowHeatmap] = useState(false);
          const [experiment, setExperiment] = useState('normal'); // New experimental setup state
          
          // --- REFS FOR CANVAS ENGINE ---
          // Decouple the 60fps canvas loop from React's render cycle for performance
          const timeRef = useRef(0);
          const stateRef = useRef({ isPlaying, showHeatmap, experiment });
          
          useEffect(() => {
              stateRef.current = { isPlaying, showHeatmap, experiment };
          }, [isPlaying, showHeatmap, experiment]);
          
          // Metrics for UI Dashboard
          const [metrics, setMetrics] = useState({
            auxinLeft: 50,
            auxinRight: 50,
            bendDirection: 'Straight',
            stemLength: 0
          });

          // Canvas & Refs
          const canvasRef = useRef(null);
          const animRef = useRef(null);
          
          // Use Ref for draggable sun to avoid React re-render lag
          const sunRef = useRef({ x: 600, y: 150, isDragging: false });

          // Sunlight controls
          const moveSun = useCallback((direction) => {
            const canvas = canvasRef.current;
            if (!canvas || !canvas.parentElement) return;
            const W = canvas.parentElement.clientWidth;
            const H = canvas.parentElement.clientHeight;
            if (direction === 'left') {
              sunRef.current.x = W * 0.15;
              sunRef.current.y = H * 0.2;
            } else if (direction === 'center') {
              sunRef.current.x = W * 0.5;
              sunRef.current.y = H * 0.1;
            } else if (direction === 'right') {
              sunRef.current.x = W * 0.85;
              sunRef.current.y = H * 0.15;
            }
            // Stop growth and wait for user to hit Play
            setTime(0);
            timeRef.current = 0;
            setIsPlaying(false);
          }, []);

          // --- CANVAS ECOLOGY & PHYSICS ENGINE ---
          useEffect(() => {
            const canvas = canvasRef.current;
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            
            // Initialize sun position relative to canvas size on first load
            if (sunRef.current.x === 600 && canvas.parentElement) {
               sunRef.current.x = canvas.parentElement.clientWidth * 0.75;
               sunRef.current.y = canvas.parentElement.clientHeight * 0.2;
            }

            // Dragging Handlers attached natively for performance
            const handlePointerDown = (e) => {
              const rect = canvas.getBoundingClientRect();
              const x = e.clientX - rect.left;
              const y = e.clientY - rect.top;
              
              // Hitbox for sun
              const dist = Math.hypot(sunRef.current.x - x, sunRef.current.y - y);
              if (dist < 60) {
                sunRef.current.isDragging = true;
                canvas.style.cursor = 'grabbing';
              }
            };

            const handlePointerMove = (e) => {
              if (!sunRef.current.isDragging) return;
              const rect = canvas.getBoundingClientRect();
              const logicalW = canvas.parentElement.clientWidth;
              const logicalH = canvas.parentElement.clientHeight;
              sunRef.current.x = Math.max(50, Math.min(logicalW - 50, e.clientX - rect.left));
              sunRef.current.y = Math.max(50, Math.min(logicalH - 100, e.clientY - rect.top));
            };

            const handlePointerUp = () => {
              sunRef.current.isDragging = false;
              canvas.style.cursor = 'default';
            };

            canvas.addEventListener('pointerdown', handlePointerDown);
            window.addEventListener('pointermove', handlePointerMove);
            window.addEventListener('pointerup', handlePointerUp);

            // Color Helper for Heatmap
            const getHeatmapColor = (value) => {
              // value: 0 (Low) to 1 (High)
              // Hue: 240 (Blue) to 0 (Red)
              const hue = (1.0 - value) * 240;
              return `hsl(${hue}, 100%, 50%)`;
            };

            let frameCounter = 0;

            // --- RENDER LOOP ---
            const render = () => {
              const parent = canvas.parentElement;
              if (!parent) return;
              
              const logicalW = parent.clientWidth;
              const logicalH = parent.clientHeight;
              const dpr = window.devicePixelRatio || 1;

              // Sync physical canvas size with logical CSS size to prevent stretching/distortion
              if (canvas.width !== Math.floor(logicalW * dpr) || canvas.height !== Math.floor(logicalH * dpr)) {
                  canvas.width = Math.floor(logicalW * dpr);
                  canvas.height = Math.floor(logicalH * dpr);
              }

              const W = logicalW;
              const H = logicalH;
              
              ctx.save();
              ctx.scale(dpr, dpr);

              // Read state safely without triggering React re-renders
              const { isPlaying, showHeatmap, experiment } = stateRef.current;
              
              // 1. Update Time
              if (isPlaying) {
                timeRef.current += 0.2;
                if (timeRef.current >= 100) {
                    timeRef.current = 100;
                    setIsPlaying(false);
                } else {
                    // Sync UI slider every 10 frames to avoid lag
                    frameCounter++;
                    if (frameCounter % 10 === 0) setTime(Math.round(timeRef.current));
                }
              }

              const t = timeRef.current;

              ctx.clearRect(0, 0, W, H);

              // 2. Draw Background & Soil
              const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
              bgGrad.addColorStop(0, '#0f172a');
              bgGrad.addColorStop(1, '#1e293b');
              ctx.fillStyle = bgGrad;
              ctx.fillRect(0, 0, W, H);

              ctx.fillStyle = '#3f271d'; // Soil
              ctx.fillRect(0, H - 60, W, 60);
              ctx.fillStyle = '#4ade80'; // Grass line
              ctx.fillRect(0, H - 60, W, 8);

              // 3. Mathematical Plant Growth Algorithm (Iterative Kinematics)
              const segments = 40;
              const micaIndex = segments - 8; // Position where mica is inserted
              const baseX = W / 2;
              const baseY = H - 60;
              
              let currentX = baseX;
              let currentY = baseY;
              let currentAngle = 0; // 0 is straight UP (Math is rotated)
              
              const pts = [{ x: currentX, y: currentY, angle: currentAngle, al: 0.5, ar: 0.5 }];
              
              let tipAuxinL = 0.5;
              let tipAuxinR = 0.5;
              let totalLength = 0;

              for (let i = 1; i <= segments; i++) {
                // Vector to sun
                const dx = sunRef.current.x - currentX;
                const dy = currentY - sunRef.current.y; // Standard Cartesian (up is positive)
                
                // Angle to sun relative to vertical
                let angleToSun = Math.atan2(dx, dy);
                
                // Difference between current heading and sun
                let angleDiff = angleToSun - currentAngle;
                // Normalize
                while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;

                // Auxin Distribution: Shifts AWAY from light
                const auxinGradient = Math.sin(angleDiff); 
                
                let a_L_tip = 0.5 + auxinGradient * 0.45; // 0.05 to 0.95
                let a_R_tip = 0.5 - auxinGradient * 0.45;

                // Override Auxin production based on cap / tip removal
                if (experiment === 'tip-removed') { a_L_tip = 0.1; a_R_tip = 0.1; }
                if (experiment === 'opaque-cap') { a_L_tip = 0.5; a_R_tip = 0.5; }

                let a_L = a_L_tip;
                let a_R = a_R_tip;

                // Simulate Mica blocking downward flow
                if (i < micaIndex) {
                    if (experiment === 'mica-left') a_L = 0.1; // Blocked on left
                    if (experiment === 'mica-right') a_R = 0.1; // Blocked on right
                }

                // Differential Growth (Bending)
                const bendAmount = (a_L - a_R) * 0.04 * (t / 100);
                
                currentAngle += bendAmount;

                // Segment Elongation (No tip = almost no elongation)
                const segLength = (experiment === 'tip-removed') ? 1.0 : 1 + (t * 0.12);
                totalLength += segLength;

                currentX += Math.sin(currentAngle) * segLength;
                currentY -= Math.cos(currentAngle) * segLength;

                pts.push({ x: currentX, y: currentY, angle: currentAngle, al: a_L, ar: a_R });

                // Capture stem concentrations for UI (Sample middle of stem to show mica effects)
                if (i === Math.floor(segments / 2)) {
                  tipAuxinL = a_L;
                  tipAuxinR = a_R;
                }
              }

              const tipX = currentX;
              const tipY = currentY;

              // Sync Metrics to React (throttled visually)
              if (Math.random() < 0.1) {
                let dir = 'Straight';
                // Shortened strings to keep the UI boxes tidy
                if (tipAuxinL - tipAuxinR > 0.1) dir = 'Right ➔';
                if (tipAuxinR - tipAuxinL > 0.1) dir = 'Left ←';
                
                setMetrics({
                  auxinLeft: Math.round(tipAuxinL * 100),
                  auxinRight: Math.round(tipAuxinR * 100),
                  bendDirection: dir,
                  stemLength: Math.round(totalLength)
                });
              }

              // 4. Draw Light Rays from Sun to Plant Tip
              ctx.beginPath();
              ctx.moveTo(sunRef.current.x, sunRef.current.y);
              ctx.lineTo(tipX - 20, tipY + 20);
              ctx.lineTo(tipX + 20, tipY + 20);
              ctx.fillStyle = 'rgba(253, 224, 71, 0.15)'; // Yellow transparent
              ctx.fill();

              // 5. Draw Sun (Bulletproof rendering without shadowBlur to fix browser glitches)
              const sx = sunRef.current.x;
              const sy = sunRef.current.y;
              
              // Glow using radial gradient (Safe on all devices)
              const glow = ctx.createRadialGradient(sx, sy, 10, sx, sy, 50);
              glow.addColorStop(0, 'rgba(253, 224, 71, 1)'); // Core yellow
              glow.addColorStop(0.5, 'rgba(253, 224, 71, 0.4)');
              glow.addColorStop(1, 'rgba(253, 224, 71, 0)');
              
              ctx.beginPath();
              ctx.arc(sx, sy, 50, 0, Math.PI * 2);
              ctx.fillStyle = glow;
              ctx.fill();
              
              // Solid Sun Core
              ctx.beginPath();
              ctx.arc(sx, sy, 20, 0, Math.PI * 2);
              ctx.fillStyle = '#fef08a';
              ctx.fill();
              ctx.lineWidth = 2;
              ctx.strokeStyle = '#eab308';
              ctx.stroke();
              
              // Animated Sun Rays
              ctx.strokeStyle = '#fde047';
              ctx.lineWidth = 4;
              ctx.lineCap = 'round';
              const rayCount = 12;
              const timeOffset = Date.now() / 1500; // Slow rotation
              for (let i = 0; i < rayCount; i++) {
                  const angle = (Math.PI * 2 / rayCount) * i + timeOffset;
                  ctx.beginPath();
                  ctx.moveTo(sx + Math.cos(angle) * 28, sy + Math.sin(angle) * 28);
                  ctx.lineTo(sx + Math.cos(angle) * 45, sy + Math.sin(angle) * 45);
                  ctx.stroke();
              }

              // 6. Draw Plant Stem
              if (!showHeatmap) {
                // NORMAL MODE (Realistic Green Stem)
                ctx.beginPath();
                for (let i = 0; i < pts.length; i++) {
                  const p = pts[i];
                  const thickness = 16 - (12 * (i / segments));
                  
                  // Left Edge
                  const nx = -Math.cos(p.angle);
                  const ny = -Math.sin(p.angle);
                  const edgeX = p.x + nx * (thickness / 2);
                  const edgeY = p.y + ny * (thickness / 2);
                  
                  if (i === 0) ctx.moveTo(edgeX, edgeY);
                  else ctx.lineTo(edgeX, edgeY);
                }
                
                const tipP = pts[pts.length-1];
                if (experiment !== 'tip-removed') {
                    // Cap
                    ctx.arc(tipP.x, tipP.y, 2, Math.PI + tipP.angle, tipP.angle);
                } else {
                    // Flat cut
                    ctx.lineTo(tipP.x + Math.cos(tipP.angle)*(2), tipP.y + Math.sin(tipP.angle)*(2));
                }

                for (let i = pts.length - 1; i >= 0; i--) {
                  const p = pts[i];
                  const thickness = 16 - (12 * (i / segments));
                  
                  // Right Edge
                  const nx = Math.cos(p.angle);
                  const ny = Math.sin(p.angle);
                  const edgeX = p.x + nx * (thickness / 2);
                  const edgeY = p.y + ny * (thickness / 2);
                  ctx.lineTo(edgeX, edgeY);
                }
                
                const stemGrad = ctx.createLinearGradient(baseX - 10, baseY, tipX, tipY);
                stemGrad.addColorStop(0, '#15803d');
                stemGrad.addColorStop(1, '#4ade80');
                ctx.fillStyle = stemGrad;
                ctx.fill();

                // Draw simple leaves at tip
                if (t > 10 && experiment !== 'tip-removed') {
                  const tipAngle = pts[pts.length-1].angle;
                  ctx.save();
                  ctx.translate(tipX, tipY);
                  ctx.rotate(tipAngle);
                  ctx.fillStyle = '#22c55e';
                  ctx.beginPath(); ctx.ellipse(-8, -10, 6, 15, -Math.PI/4, 0, Math.PI*2); ctx.fill();
                  ctx.beginPath(); ctx.ellipse(8, -10, 6, 15, Math.PI/4, 0, Math.PI*2); ctx.fill();
                  ctx.restore();
                }

              } else {
                // HEATMAP MODE (Left/Right Polygons colored by Auxin)
                for (let i = 0; i < pts.length - 1; i++) {
                  const p1 = pts[i];
                  const p2 = pts[i+1];
                  const thick1 = 20 - (16 * (i / segments));
                  const thick2 = 20 - (16 * ((i+1) / segments));
                  
                  // Normals
                  const n1x = Math.cos(p1.angle); const n1y = Math.sin(p1.angle);
                  const n2x = Math.cos(p2.angle); const n2y = Math.sin(p2.angle);

                  // Left Quad
                  ctx.beginPath();
                  ctx.moveTo(p1.x - n1x*(thick1/2), p1.y - n1y*(thick1/2)); // Bottom Left
                  ctx.lineTo(p2.x - n2x*(thick2/2), p2.y - n2y*(thick2/2)); // Top Left
                  ctx.lineTo(p2.x, p2.y); // Top Center
                  ctx.lineTo(p1.x, p1.y); // Bottom Center
                  ctx.fillStyle = getHeatmapColor(p1.al);
                  ctx.fill();
                  // Stroke to hide seams
                  ctx.strokeStyle = getHeatmapColor(p1.al); ctx.lineWidth=1; ctx.stroke();

                  // Right Quad
                  ctx.beginPath();
                  ctx.moveTo(p1.x, p1.y); // Bottom Center
                  ctx.lineTo(p2.x, p2.y); // Top Center
                  ctx.lineTo(p2.x + n2x*(thick2/2), p2.y + n2y*(thick2/2)); // Top Right
                  ctx.lineTo(p1.x + n1x*(thick1/2), p1.y + n1y*(thick1/2)); // Bottom Right
                  ctx.fillStyle = getHeatmapColor(p1.ar);
                  ctx.fill();
                  ctx.strokeStyle = getHeatmapColor(p1.ar); ctx.lineWidth=1; ctx.stroke();
                }
              }

              // Draw Caps & Mica (Overlays for both Normal and Heatmap modes)
              const tipP = pts[pts.length - 1];
              if (experiment === 'opaque-cap' || experiment === 'transparent-cap') {
                  ctx.save();
                  ctx.translate(tipP.x, tipP.y);
                  ctx.rotate(tipP.angle);
                  ctx.fillStyle = experiment === 'opaque-cap' ? '#334155' : 'rgba(255,255,255,0.6)';
                  ctx.strokeStyle = experiment === 'opaque-cap' ? '#1e293b' : 'rgba(255,255,255,0.9)';
                  ctx.lineWidth = 2;
                  ctx.beginPath();
                  ctx.rect(-12, -22, 24, 25);
                  ctx.fill();
                  ctx.stroke();
                  ctx.restore();
              }

              if (experiment === 'mica-left' || experiment === 'mica-right') {
                  const micaP = pts[micaIndex];
                  ctx.save();
                  ctx.translate(micaP.x, micaP.y);
                  ctx.rotate(micaP.angle);
                  ctx.strokeStyle = '#000000';
                  ctx.lineWidth = 4;
                  ctx.beginPath();
                  if (experiment === 'mica-left') {
                      ctx.moveTo(0, 0);
                      ctx.lineTo(-20, 0);
                  } else {
                      ctx.moveTo(0, 0);
                      ctx.lineTo(20, 0);
                  }
                  ctx.stroke();
                  ctx.restore();
              }

              ctx.restore(); // Restore DPR scaling

              animRef.current = requestAnimationFrame(render);
            };

            animRef.current = requestAnimationFrame(render);

            return () => {
              canvas.removeEventListener('pointerdown', handlePointerDown);
              window.removeEventListener('pointermove', handlePointerMove);
              window.removeEventListener('pointerup', handlePointerUp);
              cancelAnimationFrame(animRef.current);
            };
          }, []); // EMPTY DEPENDENCY ARRAY - Fixes the infinite resizing loop!

          // --- DYNAMIC INSIGHT TEXTS ---
          const insights = {
            'normal': "Notice how the plant bends towards the light. Auxin moves away from the light source, accumulating on the shaded side. This causes cells there to elongate faster, forcing the stem to bend.",
            'tip-removed': "With the apex (tip) cut off, there is no source of Auxin. Without Auxin, the stem cells cannot elongate, and the plant neither grows nor bends towards the light. This proves the tip produces the hormone!",
            'opaque-cap': "The tip is covered, so it cannot detect the light direction. Auxin is produced but travels straight down evenly (50/50). The plant grows straight up, proving the tip is the photoreceptor.",
            'transparent-cap': "The transparent cap allows light to reach the tip. The plant bends normally! This acts as a 'control' to prove the cap's physical weight isn't what stops the bending in the opaque experiment.",
            'mica-left': "Mica is an impermeable barrier. Inserted on the left, it stops Auxin from traveling down that side. If the sun is on the right, Auxin tries to go left but is blocked—so the plant won't bend!",
            'mica-right': "Inserted on the right, Mica blocks downward Auxin flow on that side. If the sun is on the left, Auxin goes to the shaded right side but gets blocked. No bending occurs!"
          };

          // --- UI RENDERING ---
          const customCSS = `
            .custom-scrollbar::-webkit-scrollbar { width: 6px; }
            .custom-scrollbar::-webkit-scrollbar-track { background: #1e293b; border-radius: 4px; }
            .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
          `;

          return (
            <div className="bg-[#0F172A] h-screen w-full text-slate-200 flex flex-col font-sans overflow-hidden select-none">
              <style>{customCSS}</style>

              {/* HEADER */}
              <header className="h-16 border-b border-slate-700/50 flex items-center justify-between px-6 bg-slate-800/30 shrink-0 shadow-sm z-10">
                <div className="flex items-center gap-3">
                  <div className="w-8 h-8 rounded bg-yellow-500/20 flex items-center justify-center border border-yellow-400/50 shadow-lg">
                    <svg className="w-5 h-5 text-yellow-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                  </div>
                  <h1 className="text-xl font-bold text-white tracking-wide">Phototropism <span className="text-yellow-400 font-light">Simulator</span></h1>
                </div>
                
                <div className="flex items-center gap-4">
                  <button 
                    onClick={() => { setTime(0); timeRef.current = 0; setIsPlaying(false); }}
                    className="px-4 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-sm font-semibold transition-colors border border-slate-600"
                  >
                    Reset Growth
                  </button>
                  <button 
                    onClick={() => setIsPlaying(!isPlaying)}
                    className={`px-6 py-2 rounded-full text-sm font-bold flex items-center gap-2 transition-all ${
                      isPlaying ? 'bg-amber-500/10 text-amber-500 border border-amber-500/50 hover:bg-amber-500/20' 
                                : 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/50 hover:bg-emerald-500/20 shadow-[0_0_15px_rgba(16,185,129,0.2)]'
                    }`}
                  >
                    {isPlaying ? '❚❚ Pause Growth' : '▶ Play Growth'}
                  </button>
                </div>
              </header>

              {/* MAIN CONTENT */}
              <main className="flex-1 flex gap-4 p-4 min-h-0 overflow-hidden">
                
                {/* LEFT PANEL: CONTROLS & DASHBOARD */}
                <aside className="w-[420px] flex flex-col gap-4 shrink-0 overflow-y-auto custom-scrollbar pr-2 pb-2">
                  
                  {/* Educational Insight Banner (Relocated) */}
                  <div className="bg-slate-800/85 border border-slate-600 p-4 rounded-xl shadow-lg shrink-0 transition-all duration-300">
                    <h4 className="text-yellow-400 text-xs font-bold uppercase tracking-wider mb-2 flex items-center gap-2">
                      <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                      Teacher's Insight
                    </h4>
                    <p className="text-xs text-slate-200 leading-relaxed">
                      {time === 0 && !isPlaying ? "Choose your sunlight direction and experimental setup below, then click '▶ Play Growth' to observe the results!" : insights[experiment]}
                    </p>
                  </div>

                  {/* Controls */}
                  <div className="bg-slate-800/60 p-4 rounded-2xl border border-slate-700/50 shadow-lg flex flex-col gap-4 shrink-0">
                    <h2 className="text-sm font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2 mb-1">
                      <svg className="w-4 h-4 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" /></svg>
                      Simulation Controls
                    </h2>

                    {/* Sunlight Direction Controls */}
                    <div className="bg-slate-900/50 p-4 rounded-xl border border-slate-700">
                      <label className="text-sm font-semibold text-yellow-400 mb-2 flex items-center gap-2">
                        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
                        Sunlight Direction
                      </label>
                      <div className="grid grid-cols-3 gap-2">
                        <button onClick={() => moveSun('left')} className="py-2 bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-600 text-xs font-bold text-slate-300 transition-colors">← Left</button>
                        <button onClick={() => moveSun('center')} className="py-2 bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-600 text-xs font-bold text-slate-300 transition-colors">↓ Center</button>
                        <button onClick={() => moveSun('right')} className="py-2 bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-600 text-xs font-bold text-slate-300 transition-colors">→ Right</button>
                      </div>
                      <p className="text-[10px] text-slate-400 mt-2 text-center">You can also freely drag the sun!</p>
                    </div>

                    {/* Experiment Setup Dropdown */}
                    <div className="bg-slate-900/50 p-4 rounded-xl border border-slate-700">
                      <label className="text-sm font-semibold text-emerald-400 mb-2 block">Experimental Setup</label>
                      <select 
                          value={experiment} 
                          onChange={(e) => { 
                              setExperiment(e.target.value); 
                              setTime(0); 
                              timeRef.current = 0; 
                              setIsPlaying(false); 
                          }}
                          className="w-full bg-slate-800 border border-slate-600 text-slate-200 text-sm rounded-lg focus:ring-emerald-500 focus:border-emerald-500 block p-2.5 outline-none font-medium"
                      >
                          <option value="normal"> Normal Shoot</option>
                          <option value="tip-removed"> Tip Removed</option>
                          <option value="opaque-cap"> Opaque Cap</option>
                          <option value="transparent-cap"> Transparent Cap</option>
                          <option value="mica-left"> Mica on Left Side</option>
                          <option value="mica-right"> Mica on Right Side</option>
                      </select>
                    </div>

                    {/* Heatmap Toggle */}
                    <div className={`p-4 rounded-xl border transition-all duration-300 ${showHeatmap ? 'bg-indigo-900/30 border-indigo-500/50' : 'bg-slate-900/50 border-slate-700'}`}>
                      <div className="flex justify-between items-center">
                        <div>
                          <label className={`text-sm font-bold ${showHeatmap ? 'text-indigo-400' : 'text-slate-300'}`}>Auxin Concentration Heatmap</label>
                          <p className="text-[10px] text-slate-400 mt-1">Visualize the invisible hormone distribution.</p>
                        </div>
                        <button 
                          onClick={() => setShowHeatmap(!showHeatmap)}
                          className={`relative inline-flex h-7 w-14 items-center rounded-full transition-colors focus:outline-none ${showHeatmap ? 'bg-indigo-500' : 'bg-slate-600'}`}
                        >
                          <span className={`inline-block h-5 w-5 transform rounded-full bg-white transition-transform ${showHeatmap ? 'translate-x-8' : 'translate-x-1'}`} />
                        </button>
                      </div>
                      
                      {/* Heatmap Legend */}
                      {showHeatmap && (
                        <div className="mt-4">
                          <div className="h-2 w-full rounded-full bg-gradient-to-r from-blue-500 via-yellow-500 to-red-500"></div>
                          <div className="flex justify-between text-[10px] text-slate-400 font-bold mt-1 uppercase">
                            <span>Low Auxin</span>
                            <span>High Auxin</span>
                          </div>
                        </div>
                      )}
                    </div>

                    {/* Time Scrubber */}
                    <div className="bg-slate-900/50 p-4 rounded-xl border border-slate-700">
                      <div className="flex justify-between items-end mb-2">
                        <label className="text-sm font-semibold text-emerald-400">Growth Stage (Time)</label>
                        <span className="text-xs font-bold text-white bg-slate-800 px-2 py-1 rounded border border-slate-600">{Math.round(time)}%</span>
                      </div>
                      <input 
                        type="range" min="0" max="100" step="1"
                        value={time} 
                        onChange={(e) => { 
                          const v = parseFloat(e.target.value);
                          setTime(v); 
                          timeRef.current = v;
                          setIsPlaying(false); 
                        }}
                        className="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-emerald-500"
                      />
                    </div>
                  </div>

                  {/* Biological Metrics Dashboard */}
                  {/* Changed from flex-1 min-h-[220px] to shrink-0 to prevent layout squishing */}
                  <div className="bg-slate-800/60 p-4 rounded-2xl border border-slate-700/50 shadow-lg shrink-0 flex flex-col gap-3">
                    <h2 className="text-sm font-bold text-slate-300 uppercase tracking-wider mb-1">Cross-Section Metrics (Stem)</h2>

                    <div className="bg-slate-900/50 p-4 rounded-xl border border-slate-700/50 relative">
                       <h3 className="text-xs font-bold text-slate-400 text-center mb-3">Auxin Hormone Distribution</h3>
                       
                       <div className="flex justify-between items-end px-4 relative">
                         {/* Left Side */}
                         <div className="text-center w-1/3">
                           <span className="block text-2xl font-black text-white font-mono">{metrics.auxinLeft}%</span>
                           <span className="text-[10px] uppercase text-slate-500 font-bold">Left Side</span>
                         </div>
                         
                         {/* Scale Balance Visualization */}
                         <div className="absolute left-1/2 bottom-2 transform -translate-x-1/2 w-16 h-8 flex items-end justify-center">
                            <div className="w-0.5 h-full bg-slate-600"></div>
                            <div 
                              className="absolute bottom-0 w-20 h-1 bg-white transition-transform duration-300 origin-center"
                              style={{ transform: `rotate(${(metrics.auxinRight - metrics.auxinLeft) * 0.4}deg)` }}
                            ></div>
                         </div>

                         {/* Right Side */}
                         <div className="text-center w-1/3">
                           <span className="block text-2xl font-black text-white font-mono">{metrics.auxinRight}%</span>
                           <span className="text-[10px] uppercase text-slate-500 font-bold">Right Side</span>
                         </div>
                       </div>
                    </div>

                    <div className="grid grid-cols-2 gap-3 mt-1">
                       <div className="bg-slate-900/50 p-3 rounded-xl border border-slate-700/50 flex flex-col justify-center text-center">
                        <span className="text-[10px] font-bold text-slate-500 uppercase mb-1">Cellular Action</span>
                        {/* Shrunk text size and streamlined phrasing to prevent overflow */}
                        <span className="text-xs font-bold text-emerald-400 leading-tight">
                          {metrics.auxinLeft > metrics.auxinRight ? 'Left cells stretch more' : 
                           metrics.auxinRight > metrics.auxinLeft ? 'Right cells stretch more' : 
                           'Symmetrical growth'}
                        </span>
                      </div>
                      <div className="bg-slate-900/50 p-3 rounded-xl border border-slate-700/50 flex flex-col justify-center text-center">
                        <span className="text-[10px] font-bold text-slate-500 uppercase mb-1">Resulting Bend</span>
                        <span className="text-sm font-black text-white">{metrics.bendDirection}</span>
                      </div>
                    </div>

                  </div>

                </aside>

                {/* RIGHT PANEL: VISUALIZATION */}
                <section className="flex-1 bg-slate-900 rounded-3xl border-4 border-slate-800 relative shadow-2xl flex flex-col overflow-hidden">
                  
                  <div className="flex-1 relative w-full h-full">
                    {/* The Canvas */}
                    <canvas ref={canvasRef} className="w-full h-full absolute inset-0 block" />
                  </div>

                </section>
              </main>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
