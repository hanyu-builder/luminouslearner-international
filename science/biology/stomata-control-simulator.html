<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stomata & Guard Cell Simulator</title>
    <meta name="description" content="Interactive visualization of stomatal regulation, turgor pressure, osmosis, and gas exchange.">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background-color: #0B1121; /* Deep slate */
            font-family: 'Inter', sans-serif;
            color: #F8FAFC;
            overflow-x: hidden;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up { animation: fadeUp 0.4s ease-out forwards; }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col p-3 md:p-5 gap-5">
    <div id="root" class="flex-1 flex flex-col max-w-[1600px] mx-auto w-full h-full min-h-0 gap-5"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // --- INLINE SVG ICONS ---
        const Icons = {
            Sun: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>,
            Moon: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>,
            Droplets: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7 2.99 7 2.99s-2.29 6.08-3.29 7.08c-1.14.93-1.71 2.03-1.71 3.19 0 2.22 1.8 4.05 4 4.05z"/><path d="M12.56 6.6A10.97 10.97 0 0 0 14 6c2.65 0 5.16.96 7 2.68V12a9 9 0 0 1-9 9c-2.65 0-5.16-.96-7-2.68"/></svg>,
            Zap: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>,
            Activity: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>,
            Info: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>,
            Beaker: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4.5 3h15"/><path d="M6 3v16a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V3"/><path d="M6 14h12"/></svg>,
            Maximize: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>,
            Wind: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/></svg>,
            Flame: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>,
            AlertTriangle: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
        };

        const App = () => {
            // --- UI & Environment State ---
            const [isLight, setIsLight] = useState(true);
            const [pumpActive, setPumpActive] = useState(true);
            const [droughtStress, setDroughtStress] = useState(false); // New condition
            
            // Real-time metrics
            const [metrics, setMetrics] = useState({
                turgor: 80,      
                aperture: 12,    
                kConcentration: 100,
                conductance: 80 
            });

            // --- Canvas & Physics State ---
            const canvasRef = useRef(null);
            const requestRef = useRef();
            const dimsRef = useRef({ width: 800, height: 600 });
            
            const stateRef = useRef({
                turgor: 80, 
                kParticles: [],
                waterParticles: [],
                gasParticles: [], // For CO2 / O2 exchange
                initialized: false,
                isLight: true,
                pumpActive: true,
                droughtStress: false
            });

            // Keep ref updated with latest state for the render loop
            useEffect(() => {
                stateRef.current.isLight = isLight;
                stateRef.current.pumpActive = pumpActive;
                stateRef.current.droughtStress = droughtStress;
            }, [isLight, pumpActive, droughtStress]);

            // Initialize Particles
            const initParticles = (w, h) => {
                const kParticles = [];
                const waterParticles = [];
                
                // 80 Potassium ions
                for (let i = 0; i < 80; i++) {
                    kParticles.push({
                        id: `k_${i}`,
                        isLeft: i % 2 === 0,
                        targetPhase: 1, 
                        currentPhase: 1, // 0 = outside, 1 = inside guard cell
                        angle: (Math.random() * Math.PI) - (Math.PI / 2),
                        radiusOffset: Math.random() * 20 - 10,
                        speed: 0.015 + Math.random() * 0.02
                    });
                }

                // 120 Water molecules
                for (let i = 0; i < 120; i++) {
                    waterParticles.push({
                        id: `w_${i}`,
                        isLeft: i % 2 === 0,
                        targetPhase: 1,
                        currentPhase: 1,
                        angle: (Math.random() * Math.PI) - (Math.PI / 2),
                        radiusOffset: Math.random() * 30 - 15,
                        speed: 0.01 + Math.random() * 0.015
                    });
                }

                stateRef.current.kParticles = kParticles;
                stateRef.current.waterParticles = waterParticles;
                stateRef.current.gasParticles = [];
                stateRef.current.initialized = true;
            };

            // --- Primary Render Loop ---
            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                
                // Resize handling
                const resizeCanvas = () => {
                    const parent = canvas.parentElement;
                    if (!parent) return;
                    const rect = parent.getBoundingClientRect();
                    const width = rect.width || 800;
                    const height = rect.height || 600;
                    
                    dimsRef.current.width = width;
                    dimsRef.current.height = height;

                    const dpr = window.devicePixelRatio || 1;
                    canvas.width = width * dpr;
                    canvas.height = height * dpr;
                    ctx.scale(dpr, dpr);
                    
                    if (!stateRef.current.initialized) initParticles(width, height);
                };
                
                resizeCanvas();
                const resizeObserver = new ResizeObserver(() => resizeCanvas());
                resizeObserver.observe(canvas.parentElement);

                let lastMetricUpdate = 0;

                const render = (time) => {
                    const w = dimsRef.current.width;
                    const h = dimsRef.current.height;
                    const cx = w / 2;
                    const cy = h / 2;
                    const state = stateRef.current;

                    ctx.clearRect(0, 0, w, h);
                    
                    // 0. Background Epidermal Cells
                    ctx.fillStyle = '#064e3b'; // Emerald 900
                    ctx.fillRect(0, 0, w, h);
                    ctx.strokeStyle = 'rgba(16, 185, 129, 0.15)'; // Faint green walls
                    ctx.lineWidth = 4;
                    ctx.lineJoin = 'round';
                    
                    const cellScale = 150;
                    for (let x = -cellScale; x < w + cellScale; x += cellScale) {
                        for (let y = -cellScale; y < h + cellScale; y += cellScale) {
                            ctx.beginPath();
                            const xOff = (y % (cellScale*2) === 0) ? cellScale/2 : 0;
                            const drawX = x + xOff;
                            ctx.moveTo(drawX, y);
                            ctx.quadraticCurveTo(drawX + cellScale/2, y + 20, drawX + cellScale, y);
                            ctx.quadraticCurveTo(drawX + cellScale - 20, y + cellScale/2, drawX + cellScale, y + cellScale);
                            ctx.quadraticCurveTo(drawX + cellScale/2, y + cellScale - 20, drawX, y + cellScale);
                            ctx.quadraticCurveTo(drawX + 20, y + cellScale/2, drawX, y);
                            ctx.stroke();
                        }
                    }

                    // --- 1. Update Physics Math ---
                    // ABA (Drought) forces the pump to deactivate regardless of manual setting or light.
                    const effectivePumpActive = state.pumpActive && !state.droughtStress;
                    const targetTurgor = effectivePumpActive ? 100 : 0;
                    
                    state.turgor += (targetTurgor - state.turgor) * 0.03; // Smooth easing
                    const t = Math.max(0, state.turgor / 100);
                    
                    const stomaLength = Math.min(h * 0.7, 400); 
                    const topY = cy - stomaLength / 2;
                    const bottomY = cy + stomaLength / 2;
                    
                    const maxAperture = 50; 
                    const apertureHalfWidth = 1 + (t * maxAperture); 
                    const outerHalfWidth = 40 + (t * 70); 

                    // 1.5 Draw Stomatal Cavity
                    ctx.beginPath();
                    ctx.moveTo(cx, topY);
                    ctx.bezierCurveTo(cx - apertureHalfWidth * 1.5, topY, cx - apertureHalfWidth * 1.5, bottomY, cx, bottomY);
                    ctx.bezierCurveTo(cx + apertureHalfWidth * 1.5, bottomY, cx + apertureHalfWidth * 1.5, topY, cx, topY);
                    ctx.fillStyle = '#022c22'; 
                    ctx.fill();

                    // --- 2. Update & Draw Particles (K+ and Water) ---
                    state.kParticles.forEach(p => {
                        p.targetPhase = effectivePumpActive ? 1 : 0;
                        p.currentPhase += (p.targetPhase - p.currentPhase) * p.speed;
                    });

                    const avgKPhase = state.kParticles.reduce((acc, p) => acc + p.currentPhase, 0) / state.kParticles.length;
                    state.waterParticles.forEach(p => {
                        // Water targets wherever K+ mostly is (Osmosis)
                        p.targetPhase = avgKPhase > 0.5 ? 1 : 0;
                        p.currentPhase += (p.targetPhase - p.currentPhase) * p.speed * 0.8;
                    });

                    const drawCellParticle = (p, color, size, glow) => {
                        const dir = p.isLeft ? -1 : 1;
                        const y = cy + Math.sin(p.angle) * (stomaLength/2 - 30);
                        const yFrac = (y - topY) / stomaLength;
                        const widthMultiplier = Math.sin(yFrac * Math.PI);
                        
                        const cxInner = cx + (apertureHalfWidth * dir * widthMultiplier);
                        const cxOuter = cx + (outerHalfWidth * dir * widthMultiplier);
                        const cxGuardCenter = (cxInner + cxOuter) / 2;
                        const cxOutside = cx + (outerHalfWidth * 2.5 * dir); 
                        
                        const x = cxOutside + (cxGuardCenter - cxOutside) * p.currentPhase + p.radiusOffset;

                        ctx.fillStyle = color;
                        if (glow) {
                            ctx.shadowColor = color;
                            ctx.shadowBlur = 5;
                        } else {
                            ctx.shadowBlur = 0;
                        }
                        ctx.beginPath();
                        ctx.arc(x, y + Math.sin(time*0.002 + p.id.charCodeAt(2))*2, size, 0, Math.PI*2);
                        ctx.fill();
                        ctx.shadowBlur = 0; 
                    };

                    state.kParticles.forEach(p => drawCellParticle(p, '#facc15', 3.5, true)); 
                    state.waterParticles.forEach(p => drawCellParticle(p, '#38bdf8', 2.5, false)); 


                    // --- 3. Render Guard Cells ---
                    const drawGuardCell = (isLeft) => {
                        const dir = isLeft ? -1 : 1;
                        const cpInnerX = cx + (apertureHalfWidth * 1.5 * dir);
                        const cpOuterX = cx + (outerHalfWidth * 1.5 * dir);
                        
                        const gradient = ctx.createLinearGradient(cx, cy, cx + (outerHalfWidth * 1.5 * dir), cy);
                        gradient.addColorStop(0, '#15803d'); 
                        gradient.addColorStop(1, '#22c55e'); 

                        ctx.beginPath();
                        ctx.moveTo(cx, topY);
                        ctx.bezierCurveTo(cpOuterX, topY, cpOuterX, bottomY, cx, bottomY);
                        ctx.bezierCurveTo(cpInnerX, bottomY, cpInnerX, topY, cx, topY);
                        ctx.fillStyle = gradient;
                        ctx.fill();
                        
                        ctx.strokeStyle = '#4ade80';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(cx, topY);
                        ctx.bezierCurveTo(cpOuterX, topY, cpOuterX, bottomY, cx, bottomY);
                        ctx.stroke();

                        ctx.strokeStyle = '#065f46';
                        ctx.lineWidth = 10;
                        ctx.lineCap = 'round';
                        ctx.beginPath();
                        ctx.moveTo(cx, bottomY);
                        ctx.bezierCurveTo(cpInnerX, bottomY, cpInnerX, topY, cx, topY);
                        ctx.stroke();

                        ctx.fillStyle = '#14532d'; 
                        ctx.strokeStyle = '#22c55e';
                        ctx.lineWidth = 1;
                        for(let i=1; i<=6; i++) {
                            const yFrac = i / 7;
                            const baseCy = topY + stomaLength * yFrac;
                            const orbitOffset = Math.sin(time * 0.001 + i) * (t * 5); 
                            const finalCy = baseCy + orbitOffset;

                            const widthMult = Math.sin(yFrac * Math.PI);
                            const cxInner = cx + (apertureHalfWidth * dir * widthMult);
                            const cxOuter = cx + (outerHalfWidth * dir * widthMult);
                            const finalCx = (cxInner + cxOuter) / 2 + orbitOffset;
                            
                            ctx.beginPath();
                            ctx.ellipse(finalCx, finalCy, 6, 10, isLeft ? -0.2 : 0.2, 0, Math.PI*2);
                            ctx.fill();
                            ctx.stroke();
                        }
                    };

                    drawGuardCell(true);  // Left
                    drawGuardCell(false); // Right

                    // --- 4. Gas Exchange Particles ---
                    if (t > 0.2) {
                        if (Math.random() < t * 0.3) {
                            const isCO2 = Math.random() > 0.4; 
                            state.gasParticles.push({
                                type: isCO2 ? 'co2' : 'h2o',
                                x: cx + (Math.random() * apertureHalfWidth * 2 - apertureHalfWidth),
                                y: cy + (Math.random() * stomaLength * 0.4 - stomaLength * 0.2),
                                size: isCO2 ? 3 : 2,
                                speedY: isCO2 ? (Math.random() * 0.5 + 0.2) : -(Math.random() * 0.8 + 0.4), 
                                life: 1.0,
                                wobble: Math.random() * Math.PI * 2
                            });
                        }
                    }

                    for (let i = state.gasParticles.length - 1; i >= 0; i--) {
                        const gp = state.gasParticles[i];
                        gp.y += gp.speedY;
                        gp.x += Math.sin(time * 0.005 + gp.wobble) * 0.5;
                        gp.life -= 0.005; 

                        if (gp.life <= 0) {
                            state.gasParticles.splice(i, 1);
                            continue;
                        }

                        ctx.globalAlpha = gp.life;
                        ctx.fillStyle = gp.type === 'co2' ? '#94a3b8' : '#e0f2fe'; 
                        ctx.beginPath();
                        ctx.arc(gp.x, gp.y, gp.size, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.globalAlpha = 1.0;
                    }

                    // --- 5. Draw Light Rays ---
                    if (state.isLight) {
                        const rayGrad = ctx.createLinearGradient(0, 0, 0, h);
                        rayGrad.addColorStop(0, 'rgba(253, 224, 71, 0.15)');
                        rayGrad.addColorStop(1, 'rgba(253, 224, 71, 0.0)');
                        
                        ctx.fillStyle = rayGrad;
                        ctx.beginPath();
                        ctx.moveTo(cx - 150, 0);
                        ctx.lineTo(cx + 150, 0);
                        ctx.lineTo(cx + 400, h);
                        ctx.lineTo(cx - 400, h);
                        ctx.fill();
                    }

                    // --- 6. Sync UI Metrics ---
                    if (time - lastMetricUpdate > 100) {
                        setMetrics({
                            turgor: state.turgor,
                            aperture: t * 15, 
                            kConcentration: avgKPhase * 100,
                            conductance: t * 100 
                        });
                        lastMetricUpdate = time;
                    }

                    requestRef.current = requestAnimationFrame(render);
                };

                requestRef.current = requestAnimationFrame(render);

                return () => {
                    resizeObserver.disconnect();
                    cancelAnimationFrame(requestRef.current);
                };
            }, []); 

            const toggleLight = () => {
                const newLight = !isLight;
                setIsLight(newLight);
                setPumpActive(newLight); 
            };

            return (
                <>
                    {/* Header & Alerts */}
                    <div className="flex flex-col gap-4 shrink-0 animate-fade-up">
                        <header className="flex items-center justify-between p-4 bg-slate-800/80 backdrop-blur border border-slate-700 rounded-2xl shadow-md z-10 shrink-0">
                            <div className="flex items-center gap-4">
                                <div className="w-12 h-12 rounded-xl bg-emerald-900/50 flex items-center justify-center border border-emerald-500/30">
                                    <Icons.Maximize className="text-emerald-400 w-6 h-6" />
                                </div>
                                <div>
                                    <h1 className="text-xl md:text-2xl font-black bg-clip-text text-transparent bg-gradient-to-r from-emerald-400 to-green-300">
                                        Stomata Control Simulator
                                    </h1>
                                    <p className="text-xs md:text-sm text-slate-400 font-bold uppercase tracking-widest mt-0.5">Turgor Pressure & Gas Exchange</p>
                                </div>
                            </div>
                        </header>

                        {/* Drought Alert Panel */}
                        {droughtStress && (
                            <div className="bg-rose-900/30 border border-rose-500/50 rounded-xl p-3 md:p-4 flex items-start gap-3 text-rose-200 shadow-md">
                                <Icons.AlertTriangle className="w-5 h-5 md:w-6 md:h-6 shrink-0 mt-0.5 text-rose-400" />
                                <div>
                                    <h3 className="font-bold text-rose-400 text-sm">Drought Stress Emergency (ABA Pathway Activated)</h3>
                                    <p className="text-xs mt-1 leading-relaxed opacity-90">
                                        The plant is experiencing a severe water shortage! Roots have synthesized the emergency hormone <strong>Abscisic Acid (ABA)</strong>. ABA travels to the leaves and forces the guard cell ion channels to open, rapidly dumping K⁺ and water to shut the stoma and prevent fatal dehydration—overriding normal light signals.
                                    </p>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Main Content Area */}
                    <main className="flex-1 flex flex-col lg:flex-row relative gap-5 min-h-0 animate-fade-up" style={{ animationDelay: '0.1s' }}>
                        
                        {/* Left Sidebar: Controls & Info */}
                        <aside className="w-full lg:w-[420px] flex flex-col gap-5 z-10 shrink-0 h-[600px] lg:h-full overflow-y-auto custom-scrollbar pr-2">
                            
                            {/* Environmental Controls */}
                            <div className="glass-panel p-5 rounded-2xl shadow-md border-slate-700">
                                <h2 className="text-sm font-bold uppercase tracking-widest text-slate-300 mb-4 flex items-center gap-2">
                                    <Icons.Sun className="text-yellow-400 w-5 h-5" /> Environment Triggers
                                </h2>
                                
                                <div className="bg-slate-900/80 p-4 rounded-xl border border-slate-700 shadow-inner">
                                    <div className="flex justify-between items-center mb-3">
                                        <span className="text-sm font-bold text-white">Light / Dark Cycle</span>
                                        <button 
                                            onClick={toggleLight}
                                            className={`flex items-center gap-2 px-4 py-1.5 rounded-lg font-bold transition-all shadow-md text-xs ${
                                                isLight ? 'bg-yellow-500/20 text-yellow-400 border border-yellow-500/50 hover:bg-yellow-500/30' : 'bg-indigo-900/50 text-indigo-400 border border-indigo-500/50 hover:bg-indigo-900/80'
                                            }`}
                                        >
                                            {isLight ? <Icons.Sun className="w-3 h-3" /> : <Icons.Moon className="w-3 h-3" />}
                                            {isLight ? 'DAY (ON)' : 'NIGHT (OFF)'}
                                        </button>
                                    </div>
                                    <p className="text-xs text-slate-400 leading-relaxed">
                                        Blue light triggers photoreceptors in the guard cells, initiating the opening process for photosynthesis.
                                    </p>
                                </div>

                                <div className="bg-slate-900/80 p-4 rounded-xl border border-slate-700 shadow-inner mt-4">
                                    <div className="flex justify-between items-center mb-3">
                                        <span className="text-sm font-bold text-white">Soil Moisture</span>
                                        <button 
                                            onClick={() => setDroughtStress(!droughtStress)}
                                            className={`flex items-center gap-2 px-3 py-1.5 rounded-lg font-bold transition-all shadow-md text-xs ${
                                                droughtStress ? 'bg-rose-500/20 text-rose-400 border border-rose-500/50 hover:bg-rose-500/30' : 'bg-sky-900/50 text-sky-400 border border-sky-500/50 hover:bg-sky-900/80'
                                            }`}
                                        >
                                            {droughtStress ? <Icons.Flame className="w-3 h-3" /> : <Icons.Droplets className="w-3 h-3" />}
                                            {droughtStress ? 'DROUGHT' : 'WATERED'}
                                        </button>
                                    </div>
                                    <p className="text-xs text-slate-400 leading-relaxed">
                                        {droughtStress
                                            ? "Drought induces Abscisic Acid (ABA) release, forcing stomata to close to prevent fatal dehydration."
                                            : "Sufficient soil moisture. Guard cells can freely open for photosynthesis."}
                                    </p>
                                </div>
                            </div>

                            {/* Biological Mechanics */}
                            <div className="glass-panel p-5 rounded-2xl shadow-md border-slate-700">
                                <h2 className="text-sm font-bold uppercase tracking-widest text-slate-300 mb-4 flex items-center gap-2">
                                    <Icons.Activity className="text-sky-400 w-5 h-5" /> Cellular Mechanics
                                </h2>
                                
                                <div className="space-y-4">
                                    {/* K+ Pump Control */}
                                    <div className={`p-4 rounded-xl border transition-all duration-500 shadow-inner ${droughtStress ? 'bg-rose-900/10 border-rose-500/30' : (pumpActive ? 'bg-amber-900/20 border-amber-500/50' : 'bg-slate-900/80 border-slate-700')}`}>
                                        <div className="flex items-center justify-between mb-2">
                                            <span className={`flex items-center gap-2 text-sm font-bold ${droughtStress ? 'text-rose-400' : (pumpActive ? 'text-amber-400' : 'text-slate-400')}`}>
                                                <Icons.Zap className={`w-4 h-4 ${droughtStress ? 'text-rose-500' : (pumpActive ? 'text-amber-400' : 'text-slate-500')}`}/> 
                                                {droughtStress ? 'Pump Blocked (ABA)' : 'K⁺ Ion Pump Active'}
                                            </span>
                                            <button 
                                                onClick={() => setPumpActive(!pumpActive)}
                                                disabled={droughtStress}
                                                className={`relative inline-flex h-6 w-11 items-center rounded-full transition-colors focus:outline-none ${droughtStress ? 'bg-slate-700 cursor-not-allowed opacity-50' : (pumpActive ? 'bg-amber-500' : 'bg-slate-600')}`}
                                            >
                                                <span className={`inline-block h-4 w-4 transform rounded-full bg-white transition-transform ${(!droughtStress && pumpActive) ? 'translate-x-6' : 'translate-x-1'}`} />
                                            </button>
                                        </div>
                                        <p className="text-xs text-slate-400 leading-relaxed">
                                            {droughtStress 
                                                ? "Abscisic Acid (ABA) forces ion channels open, rapidly ejecting Potassium (K⁺) and preventing the pump from working." 
                                                : "Actively pumps Potassium (K⁺) ions into the guard cell, making it hypertonic compared to surrounding epidermal cells."}
                                        </p>
                                    </div>

                                    {/* Osmosis Status */}
                                    <div className="bg-slate-900/80 p-4 rounded-xl border border-slate-700 shadow-inner">
                                        <div className="flex items-center justify-between mb-2">
                                            <div className="flex items-center gap-2 text-sm font-bold text-sky-400">
                                                <Icons.Droplets className="w-4 h-4" /> Guard Cell Water Vol.
                                            </div>
                                            <span className="text-xs font-mono font-bold text-slate-300">{metrics.kConcentration.toFixed(0)}%</span>
                                        </div>
                                        <div className="w-full h-2 bg-slate-800 rounded-full overflow-hidden mb-3">
                                            <div 
                                                className={`h-full transition-all duration-300 ${metrics.kConcentration > 50 ? 'bg-sky-500' : 'bg-slate-500'}`} 
                                                style={{ width: `${metrics.kConcentration}%` }}
                                            />
                                        </div>
                                        <p className="text-xs text-slate-400 leading-relaxed">
                                            {metrics.kConcentration > 50 
                                                ? "Water rushes IN to balance the high K⁺ concentration via osmosis, inflating the cell." 
                                                : "Water rushes OUT as K⁺ leaves the cell, causing it to become flaccid."}
                                        </p>
                                    </div>
                                </div>
                            </div>

                            {/* Physics Dashboard */}
                            <div className="glass-panel p-5 rounded-2xl shadow-md border-slate-700 mt-auto">
                                <h2 className="text-sm font-bold uppercase tracking-widest text-slate-300 mb-4 flex items-center gap-2">
                                    <Icons.Beaker className="text-emerald-400 w-5 h-5" /> Live Biometrics
                                </h2>
                                <div className="grid grid-cols-2 gap-3 mb-3">
                                    <div className="bg-slate-900/80 rounded-xl p-3 border border-slate-700 text-center shadow-inner flex flex-col justify-center">
                                        <span className="block text-[10px] uppercase font-bold text-slate-400 mb-1">Turgor Pressure</span>
                                        <span className={`font-mono text-2xl font-black ${metrics.turgor > 70 ? 'text-emerald-400' : 'text-slate-300'}`}>
                                            {metrics.turgor.toFixed(0)}<span className="text-[10px] text-slate-500 ml-1">kPa</span>
                                        </span>
                                    </div>
                                    <div className="bg-slate-900/80 rounded-xl p-3 border border-slate-700 text-center shadow-inner flex flex-col justify-center">
                                        <span className="block text-[10px] uppercase font-bold text-slate-400 mb-1">Pore Aperture</span>
                                        <span className={`font-mono text-2xl font-black ${metrics.aperture > 10 ? 'text-emerald-400' : 'text-slate-300'}`}>
                                            {metrics.aperture.toFixed(1)}<span className="text-[10px] text-slate-500 ml-1">μm</span>
                                        </span>
                                    </div>
                                </div>
                                
                                {/* Gas Exchange Rate */}
                                <div className="bg-slate-900/80 rounded-xl p-3 border border-slate-700 flex items-center justify-between shadow-inner">
                                    <div className="flex items-center gap-2">
                                        <Icons.Wind className={`w-5 h-5 ${metrics.conductance > 20 ? 'text-sky-300' : 'text-slate-600'}`} />
                                        <div>
                                            <div className="text-[10px] uppercase font-bold text-slate-400">Gas Exchange</div>
                                            <div className="text-[10px] text-slate-500">CO₂ In / H₂O & O₂ Out</div>
                                        </div>
                                    </div>
                                    <span className={`font-mono text-lg font-black ${metrics.conductance > 20 ? 'text-sky-300' : 'text-slate-500'}`}>
                                        {metrics.conductance.toFixed(0)}<span className="text-[10px] text-slate-500 ml-1">%</span>
                                    </span>
                                </div>
                            </div>
                        </aside>

                        {/* Right Area: Interactive Canvas */}
                        <div className="flex-1 relative flex flex-col glass-panel rounded-2xl p-1 border-slate-700 overflow-hidden shadow-2xl h-[500px] lg:h-auto">
                            
                            {/* Educational Legend Overlay */}
                            <div className="absolute top-4 left-4 right-4 z-10 flex flex-wrap gap-2 md:gap-4 bg-slate-900/90 backdrop-blur p-2.5 md:p-3 rounded-xl border border-slate-700 text-[10px] md:text-xs text-slate-300 items-center justify-center shadow-lg pointer-events-none">
                                <span className="font-bold text-white mr-1 flex items-center gap-1"><Icons.Info className="w-4 h-4 text-emerald-400"/> Microscopic View:</span>
                                <div className="flex items-center gap-1.5"><div className="w-2.5 h-2.5 rounded-full bg-[#facc15] shadow-[0_0_5px_#facc15]"></div> K⁺ Ions</div>
                                <div className="flex items-center gap-1.5"><div className="w-2.5 h-2.5 rounded-full bg-[#38bdf8]"></div> H₂O (Osmosis)</div>
                                <div className="flex items-center gap-1.5"><div className="w-3 h-1 border-t-[3px] border-[#065f46]"></div> Inelastic Inner Wall</div>
                                <div className="hidden md:flex items-center gap-1.5"><div className="w-3 h-1 border-t border-[#4ade80]"></div> Elastic Outer Wall</div>
                                <div className="flex items-center gap-1.5 ml-2 border-l border-slate-600 pl-3"><div className="w-2 h-2 rounded-full bg-slate-400"></div> CO₂ </div>
                                <div className="flex items-center gap-1.5"><div className="w-2 h-2 rounded-full bg-sky-100"></div> O₂ / Vapor</div>
                            </div>

                            {/* Canvas Container */}
                            <div className="flex-1 w-full h-full rounded-xl overflow-hidden relative shadow-inner bg-[#022c22]">
                                <canvas 
                                    ref={canvasRef} 
                                    className="absolute inset-0 w-full h-full block"
                                />
                            </div>

                        </div>
                    </main>
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
