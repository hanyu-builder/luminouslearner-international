<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Quality & Biodiversity Simulator</title>
    <meta name="description" content="Multi-variable tracking linking DO, Nitrates, pH, Turbidity, and Temperature to Macroinvertebrate Indicator Species.">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background-color: #0B1121; /* Deepest blue/slate */
            font-family: 'Inter', sans-serif;
            color: #F8FAFC;
        }
        
        /* Custom Scrollbar for inner elements */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* Custom Range Slider */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            height: 6px;
            border-radius: 4px;
            cursor: pointer;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 18px; width: 18px;
            border-radius: 50%;
            background: currentColor;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            margin-top: -6px;
            border: 2px solid #fff;
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:active { transform: scale(1.2); }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 6px;
            border-radius: 4px;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up { animation: fadeUp 0.4s ease-out forwards; }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col p-3 md:p-5 gap-5">
    <div id="root" class="flex-1 flex flex-col max-w-[1600px] mx-auto w-full h-full min-h-0 gap-5"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- INLINE SVG ICONS ---
        const Icons = {
            ActivitySquare: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M17 12h-2l-2 5l-2-10l-2 5H7"/></svg>,
            Eye: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>,
            FlaskConical: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10 2v7.31L2 20.24a2 2 0 0 0 1.69 3.12h16.62a2 2 0 0 0 1.69-3.12L14 9.31V2"/><path d="M8.5 2h7"/><path d="M14 9.31V6"/><path d="M4.53 16h14.94"/></svg>,
            RotateCcw: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>,
            Bug: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m8 2 1.88 1.88"/><path d="M14.12 3.88 16 2"/><path d="M9 7.13v-1a3 3 0 1 1 6 0v1"/><path d="M12 20c-3.3 0-6-2.7-6-6v-3a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v3c0 3.3-2.7 6-6 6"/><path d="M12 20v-9"/><path d="M6.53 9C4.6 8.8 3 7.1 3 5"/><path d="M6 13H2"/><path d="M3 21c0-2.1 1.7-3.9 3.8-4"/><path d="M20.97 5c0 2.1-1.6 3.8-3.5 4"/><path d="M22 13h-4"/><path d="M17.2 17c2.1.1 3.8 1.9 3.8 4"/></svg>,
            AlertTriangle: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>,
            MapPin: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>,
            // Preset Icons
            Mountain: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m8 3 4 8 5-5 5 15H2L8 3z"/></svg>,
            Leaf: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 20A7 7 0 0 1 14 6c7 0 7 0 7 7 0 7-7 7-7 7z"/><path d="M14 6v6a3 3 0 0 0 3 3"/></svg>,
            Factory: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 20a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8l-7 5V8l-7 5V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M17 18h1"/><path d="M12 18h1"/><path d="M7 18h1"/></svg>
        };

        // --- SCIENTIFIC DATA & SPECIES LOGIC ---
        const SPECIES_GUIDE = [
            {
                id: 'stonefly',
                name: 'Stonefly Nymph',
                desc: 'Order: Plecoptera. Highly sensitive. Found only in cold, very clean, high oxygen water.',
                tolerance: 'Very Low',
                habitat: 'pelagic', // Swims in water column
                minDO: 8, maxNitrate: 10, minPh: 6.5, maxPh: 8.5, maxTurbidity: 20, maxTemp: 15,
                color: '#10B981', emoji: '🪲'
            },
            {
                id: 'mayfly',
                name: 'Mayfly Nymph',
                desc: 'Order: Ephemeroptera. Sensitive. Requires cool, clean water with low pollution.',
                tolerance: 'Low',
                habitat: 'pelagic',
                minDO: 6, maxNitrate: 25, minPh: 6.0, maxPh: 8.5, maxTurbidity: 40, maxTemp: 20,
                color: '#34D399', emoji: '🦗'
            },
            {
                id: 'shrimp',
                name: 'Freshwater Shrimp',
                desc: 'Order: Amphipoda. Moderate tolerance. Can survive in slightly polluted, warmer water.',
                tolerance: 'Moderate',
                habitat: 'mid',
                minDO: 4, maxNitrate: 45, minPh: 5.5, maxPh: 9.0, maxTurbidity: 65, maxTemp: 25,
                color: '#FBBF24', emoji: '🦐'
            },
            {
                id: 'bloodworm',
                name: 'Bloodworm (Midge)',
                desc: 'Order: Diptera. High tolerance. Contains hemoglobin to thrive in low oxygen, murky water.',
                tolerance: 'High',
                habitat: 'benthic', // Bottom dweller
                minDO: 1, maxNitrate: 80, minPh: 4.5, maxPh: 9.5, maxTurbidity: 90, maxTemp: 32,
                color: '#EF4444', emoji: '🪱'
            },
            {
                id: 'maggot',
                name: 'Rat-tailed Maggot',
                desc: 'Order: Diptera. Very high tolerance. Survives in hot sewage and anaerobic conditions using a breathing tube.',
                tolerance: 'Very High',
                habitat: 'benthic', // Bottom dweller
                minDO: 0, maxNitrate: 100, minPh: 3.0, maxPh: 10.0, maxTurbidity: 100, maxTemp: 35,
                color: '#94A3B8', emoji: '🦠'
            }
        ];

        // --- REAL-WORLD SCENARIOS ---
        const PRESETS = [
            { name: "Mountain Stream", icon: "Mountain", nitrate: 2, phLevel: 7.2, turbidity: 5, temperature: 10, highlight: 'text-sky-400' },
            { name: "Farm Runoff", icon: "Leaf", nitrate: 85, phLevel: 6.5, turbidity: 60, temperature: 22, highlight: 'text-emerald-400' },
            { name: "Urban River", icon: "Factory", nitrate: 60, phLevel: 5.5, turbidity: 80, temperature: 28, highlight: 'text-amber-400' },
        ];

        // Custom Slider Component
        const ParameterSlider = ({ label, value, min, max, step, unit, onChange, colorHex, leftLabel, rightLabel }) => {
            const percentage = ((value - min) / (max - min)) * 100;
            return (
                <div className="mb-4">
                    <div className="flex justify-between items-center mb-1.5">
                        <label className="text-[13px] font-bold text-slate-200">{label}</label>
                        <span className="font-mono font-black text-sm" style={{ color: colorHex }}>{value.toFixed(step < 1 ? 1 : 0)} {unit}</span>
                    </div>
                    <input 
                        type="range" min={min} max={max} step={step} value={value} 
                        onChange={(e) => onChange(parseFloat(e.target.value))}
                        style={{ 
                            color: colorHex, 
                            background: `linear-gradient(to right, ${colorHex} ${percentage}%, #334155 ${percentage}%)` 
                        }}
                    />
                    <div className="flex justify-between text-[10px] text-slate-500 font-semibold mt-1">
                        <span>{leftLabel}</span>
                        <span>{rightLabel}</span>
                    </div>
                </div>
            );
        };

        const App = () => {
            // --- STATE ---
            const [nitrate, setNitrate] = useState(5);   // 0 to 100 ppm
            const [phLevel, setPhLevel] = useState(7.2); // 0 to 14
            const [turbidity, setTurbidity] = useState(5); // 0 to 100 %
            const [temperature, setTemperature] = useState(12); // 0 to 35 °C

            const canvasRef = useRef(null);
            const animRef = useRef(null);
            
            // Mutable Physics State references (Decoupled from React State for smooth rendering)
            const bugsRef = useRef([]);
            const particlesRef = useRef([]);
            const dimsRef = useRef({ width: 800, height: 600 });
            const stateRef = useRef({ nitrate, turbidity, activeSpecies: [] });

            // --- DERIVED METRICS (CALCULATED DO) ---
            const calculatedDO = useMemo(() => {
                // Base DO from temp (colder water holds more oxygen)
                let doBase = 14.0 - (temperature * 0.22); 
                
                // Eutrophication penalty: High nitrates cause algal blooms, bacteria use O2 to decompose them
                let nitratePenalty = (nitrate / 100) * 5.0; 
                
                // Turbidity penalty: Blocks light for photosynthesis, water absorbs more heat
                let turbidityPenalty = (turbidity / 100) * 2.5; 
                
                return Math.max(0, doBase - nitratePenalty - turbidityPenalty);
            }, [temperature, nitrate, turbidity]);

            // --- BIOLOGICAL EVALUATION ---
            const activeSpecies = useMemo(() => {
                return SPECIES_GUIDE.filter(sp => {
                    return calculatedDO >= sp.minDO && 
                           nitrate <= sp.maxNitrate && 
                           phLevel >= sp.minPh && phLevel <= sp.maxPh &&
                           turbidity <= sp.maxTurbidity &&
                           temperature <= sp.maxTemp;
                });
            }, [calculatedDO, nitrate, phLevel, turbidity, temperature]);

            // Sync State Ref for Canvas Loop
            useEffect(() => {
                stateRef.current = { nitrate, turbidity, activeSpecies };
            }, [nitrate, turbidity, activeSpecies]);

            // Calculate overall quality metrics
            const biodiversityIndex = activeSpecies.length;
            let qualityStatus = 'Toxic / Dead Zone';
            let qualityColor = 'text-slate-500';
            let qualityBorder = 'border-slate-700';

            if (biodiversityIndex === 5) { qualityStatus = 'Excellent'; qualityColor = 'text-emerald-400'; qualityBorder = 'border-emerald-500/50'; }
            else if (biodiversityIndex === 4) { qualityStatus = 'Good'; qualityColor = 'text-lime-400'; qualityBorder = 'border-lime-500/50'; }
            else if (biodiversityIndex === 3) { qualityStatus = 'Fair'; qualityColor = 'text-amber-400'; qualityBorder = 'border-amber-500/50'; }
            else if (biodiversityIndex > 0) { qualityStatus = 'Poor'; qualityColor = 'text-red-400'; qualityBorder = 'border-red-500/50'; }

            // Educational Trigger: Hypoxia
            const showHypoxiaWarning = calculatedDO < 4.0;

            // --- CANVAS SIMULATION ENGINE ---
            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                
                // Safe, continuous Resize handling
                const resizeCanvas = () => {
                    const parent = canvas.parentElement;
                    if (!parent) return;
                    const rect = parent.getBoundingClientRect();
                    
                    // Fallbacks ensure canvas never drops to 0x0 size and crashes
                    const width = rect.width || 800;
                    const height = rect.height || 600;
                    
                    dimsRef.current.width = width;
                    dimsRef.current.height = height;

                    const dpr = window.devicePixelRatio || 1;
                    canvas.width = width * dpr;
                    canvas.height = height * dpr;
                    ctx.scale(dpr, dpr);
                };
                
                resizeCanvas();
                const resizeObserver = new ResizeObserver(() => resizeCanvas());
                resizeObserver.observe(canvas.parentElement);

                // Bug Physics Class
                class Bug {
                    constructor(species, w, h) {
                        this.species = species;
                        this.x = Math.random() * w;
                        
                        this.habitat = species.habitat;
                        this.baseY = this.getTargetY(h);
                        this.y = this.baseY;
                        
                        // SLOW DOWN MOVEMENT!
                        this.speedX = (Math.random() * 0.4 + 0.1) * (Math.random() > 0.5 ? 1 : -1); 
                        this.wobbleSpeed = Math.random() * 0.0015 + 0.0005; // Gentle wave
                        this.wobbleAmp = Math.random() * 8 + 4; // Gentle amplitude
                        this.timeOff = Math.random() * 10000;
                    }
                    getTargetY(h) {
                        if (this.habitat === 'benthic') return h * 0.85 + Math.random() * (h * 0.1); 
                        if (this.habitat === 'mid') return h * 0.5 + Math.random() * (h * 0.3);
                        return h * 0.2 + Math.random() * (h * 0.5); 
                    }
                    update(time, w, h) {
                        this.x += this.speedX;
                        
                        // Adapt dynamically if window is resized
                        const idealY = this.getTargetY(h);
                        this.baseY += (idealY - this.baseY) * 0.01; // Smoothly drift to new correct depth
                        
                        this.y = this.baseY + Math.sin(time * this.wobbleSpeed + this.timeOff) * this.wobbleAmp;
                        
                        // Smooth Boundaries wrap-around
                        if (this.x < -40) this.x = w + 40;
                        if (this.x > w + 40) this.x = -40;
                    }
                    draw(ctx) {
                        ctx.font = '26px Arial';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        
                        ctx.save();
                        ctx.translate(this.x, this.y);
                        if (this.speedX > 0) ctx.scale(-1, 1);
                        
                        ctx.shadowColor = 'rgba(0,0,0,0.6)';
                        ctx.shadowBlur = 4;
                        ctx.shadowOffsetY = 2;
                        ctx.fillText(this.species.emoji, 0, 0);
                        ctx.restore();

                        ctx.font = '11px Inter';
                        ctx.fillStyle = 'rgba(255,255,255,0.9)';
                        ctx.fillText(this.species.name, this.x, this.y + 22);
                    }
                }

                // Particle Class (Algae / Silt)
                class Particle {
                    constructor(type, w, h) {
                        this.type = type; // 'algae' or 'silt'
                        this.x = Math.random() * w;
                        this.y = Math.random() * h;
                        this.size = Math.random() * 2 + 1;
                        this.speedY = type === 'algae' ? -(Math.random() * 0.5 + 0.1) : (Math.random() * 1 + 0.2);
                        this.wobbleSpeed = Math.random() * 0.002 + 0.001;
                        this.wobbleOff = Math.random() * Math.PI * 2;
                    }
                    update(time, w, h) {
                        this.y += this.speedY;
                        this.x += Math.sin(time * this.wobbleSpeed + this.wobbleOff) * 0.3;
                        if (this.type === 'algae' && this.y < -10) this.y = h + 10;
                        if (this.type === 'silt' && this.y > h + 10) this.y = -10;
                    }
                    draw(ctx) {
                        ctx.fillStyle = this.type === 'algae' ? 'rgba(74, 222, 128, 0.6)' : 'rgba(168, 162, 158, 0.5)';
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
                        ctx.fill();
                    }
                }

                // Primary Render Loop - Decoupled from React Renders for smooth physics
                const render = (time) => {
                    const w = dimsRef.current.width;
                    const h = dimsRef.current.height;
                    const { nitrate: curNitrate, turbidity: curTurbidity, activeSpecies: curSpecies } = stateRef.current;
                    
                    ctx.clearRect(0, 0, w, h);

                    // 1. Sync Bugs Smoothly (Preserves existing bugs)
                    const activeIds = new Set(curSpecies.map(sp => sp.id));
                    bugsRef.current = bugsRef.current.filter(b => activeIds.has(b.species.id)); // Remove dead
                    
                    curSpecies.forEach(sp => {
                        const count = bugsRef.current.filter(b => b.species.id === sp.id).length;
                        for (let i = count; i < 3; i++) {
                            bugsRef.current.push(new Bug(sp, w, h)); // Add missing
                        }
                    });

                    // 2. Sync Particles Smoothly
                    const targetAlgae = Math.floor(curNitrate * 1.5);
                    const targetSilt = Math.floor(curTurbidity * 2);
                    let currentAlgae = particlesRef.current.filter(p => p.type === 'algae');
                    let currentSilt = particlesRef.current.filter(p => p.type === 'silt');
                    
                    if (currentAlgae.length < targetAlgae) {
                        for(let i=currentAlgae.length; i<targetAlgae; i++) particlesRef.current.push(new Particle('algae', w, h));
                    } else if (currentAlgae.length > targetAlgae) {
                        let toRemove = currentAlgae.length - targetAlgae;
                        particlesRef.current = particlesRef.current.filter(p => {
                            if (p.type === 'algae' && toRemove > 0) { toRemove--; return false; }
                            return true;
                        });
                    }
                    
                    if (currentSilt.length < targetSilt) {
                        for(let i=currentSilt.length; i<targetSilt; i++) particlesRef.current.push(new Particle('silt', w, h));
                    } else if (currentSilt.length > targetSilt) {
                        let toRemove = currentSilt.length - targetSilt;
                        particlesRef.current = particlesRef.current.filter(p => {
                            if (p.type === 'silt' && toRemove > 0) { toRemove--; return false; }
                            return true;
                        });
                    }

                    // 3. Draw Water Background
                    const isAlgae = curNitrate > 30;
                    const turbidityFactor = curTurbidity / 100;
                    
                    let r = 20, g = 100, b = 180; // Base healthy blue
                    
                    if (isAlgae) {
                        g = 140 + (curNitrate/100)*60;
                        b = Math.max(40, b - (curNitrate/100)*120);
                    }
                    
                    r = r + turbidityFactor * 100;
                    g = g - turbidityFactor * 30;
                    b = b - turbidityFactor * 100;

                    const bgGrad = ctx.createLinearGradient(0, 0, 0, h);
                    bgGrad.addColorStop(0, `rgb(${r}, ${g}, ${b})`);
                    bgGrad.addColorStop(1, `rgb(${Math.max(0,r-40)}, ${Math.max(0,g-50)}, ${Math.max(0,b-60)})`);
                    
                    ctx.fillStyle = bgGrad;
                    ctx.fillRect(0, 0, w, h);

                    // Draw Sludge/Benthic bottom if turbid/polluted
                    if (curTurbidity > 20 || curNitrate > 40) {
                        const sludgeGrad = ctx.createLinearGradient(0, h - 80, 0, h);
                        sludgeGrad.addColorStop(0, 'rgba(41, 37, 36, 0)');
                        sludgeGrad.addColorStop(1, `rgba(41, 37, 36, ${Math.min(0.95, turbidityFactor + curNitrate/150)})`);
                        ctx.fillStyle = sludgeGrad;
                        ctx.fillRect(0, h - 80, w, 80);
                    }

                    // 4. Update & Draw Entities
                    particlesRef.current.forEach(p => { p.update(time, w, h); p.draw(ctx); });
                    bugsRef.current.forEach(bug => { bug.update(time, w, h); bug.draw(ctx); });

                    animRef.current = requestAnimationFrame(render);
                };

                animRef.current = requestAnimationFrame(render);

                return () => {
                    resizeObserver.disconnect();
                    cancelAnimationFrame(animRef.current);
                };
            }, []); // Empty dependency array ensures loop never restarts! Reads state smoothly.

            const handleReset = () => {
                setNitrate(5);
                setPhLevel(7.2);
                setTurbidity(5);
                setTemperature(12);
            };

            return (
                <>
                    {/* TOP HEADER & ALERTS */}
                    <div className="flex flex-col gap-4 shrink-0 animate-fade-up">
                        
                        <div className="flex flex-col md:flex-row gap-4">
                            <div className="glass-panel p-4 md:p-5 rounded-2xl flex-1 flex flex-col justify-center items-start border-slate-700 shadow-md">
                                <h1 className="text-2xl md:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-500 flex items-center gap-3">
                                    <Icons.ActivitySquare className="text-emerald-400 w-7 h-7" />
                                    Water Quality Lab
                                </h1>
                                <p className="text-xs md:text-sm text-slate-400 uppercase tracking-widest font-bold mt-1">Ecosystem & Indicator Species Mapping</p>
                            </div>

                            <div className={`glass-panel p-4 md:p-5 rounded-2xl border shadow-md flex flex-col sm:flex-row items-start sm:items-center justify-between w-full md:w-auto gap-4 md:gap-8 ${qualityBorder} transition-colors duration-500`}>
                                <div>
                                    <h2 className="text-[10px] sm:text-xs font-bold uppercase tracking-widest text-slate-400 mb-1">Overall Quality</h2>
                                    <div className={`text-2xl sm:text-3xl font-black ${qualityColor} transition-colors duration-500 drop-shadow-md`}>
                                        {qualityStatus}
                                    </div>
                                </div>
                                
                                <div className="flex gap-3 w-full sm:w-auto">
                                    <div className="bg-slate-900/80 px-4 py-2 sm:px-4 sm:py-3 rounded-xl border border-slate-700 flex flex-col items-center shadow-inner flex-1 sm:flex-none">
                                        <span className="text-[10px] sm:text-[11px] font-bold text-sky-400 uppercase tracking-widest mb-1">Calculated DO</span>
                                        <div className="text-xl sm:text-2xl font-black font-mono text-white">
                                            {calculatedDO.toFixed(1)} <span className="text-[10px] sm:text-xs text-slate-500">mg/L</span>
                                        </div>
                                    </div>

                                    <div className="bg-slate-900/80 px-4 py-2 sm:px-4 sm:py-3 rounded-xl border border-slate-700 flex flex-col items-center shadow-inner flex-1 sm:flex-none">
                                        <span className="text-[10px] sm:text-[11px] font-bold text-emerald-400 uppercase tracking-widest mb-1">Biodiversity</span>
                                        <div className="text-xl sm:text-2xl font-black font-mono text-white">
                                            {biodiversityIndex} <span className="text-[10px] sm:text-xs text-slate-500">/ 5</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {showHypoxiaWarning && (
                            <div className="bg-rose-900/30 border border-rose-500/50 rounded-xl p-3 md:p-4 flex items-start gap-3 text-rose-200 shadow-md">
                                <Icons.AlertTriangle className="w-5 h-5 md:w-6 md:h-6 shrink-0 mt-0.5 text-rose-400" />
                                <div>
                                    <h3 className="font-bold text-rose-400 text-sm">Hypoxia Alert: Critical Oxygen Depletion</h3>
                                    <p className="text-xs mt-1 leading-relaxed opacity-90">
                                        The combination of abiotic factors (high temperature, turbidity, or nitrates) has driven Dissolved Oxygen levels dangerously low. Sensitive macroinvertebrates will suffocate under these conditions.
                                    </p>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* MAIN TWO-COLUMN LAYOUT */}
                    <div className="flex flex-col lg:flex-row gap-5 flex-1 min-h-0 animate-fade-up">
                        
                        {/* LEFT COLUMN: Controls & Guide */}
                        <div className="flex flex-col gap-5 w-full lg:w-[420px] xl:w-[480px] shrink-0 h-[600px] lg:h-full">
                            
                            {/* Abiotic Parameters & Scenarios */}
                            <div className="w-full glass-panel rounded-2xl p-5 border-slate-700 flex flex-col shrink-0 shadow-md">
                                <div className="flex justify-between items-center mb-4 border-b border-slate-700 pb-3">
                                    <h2 className="text-base md:text-lg font-black text-white flex items-center gap-2">
                                        <Icons.FlaskConical className="text-emerald-400 w-5 h-5" /> Abiotic Parameters
                                    </h2>
                                    <button onClick={handleReset} className="text-[10px] md:text-xs font-bold text-slate-400 hover:text-white flex items-center gap-1 transition-colors bg-slate-800/50 px-2 py-1 rounded border border-slate-700">
                                        <Icons.RotateCcw className="w-3 h-3"/> Reset
                                    </button>
                                </div>

                                {/* PRESETS SECTION */}
                                <div className="mb-6 flex flex-col gap-2">
                                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest flex items-center gap-1">
                                        <Icons.MapPin className="w-3 h-3"/> Real-world Scenarios
                                    </span>
                                    <div className="grid grid-cols-3 gap-2">
                                        {PRESETS.map(env => {
                                            const PresetIcon = Icons[env.icon];
                                            return (
                                                <button 
                                                    key={env.name}
                                                    onClick={() => {
                                                        setNitrate(env.nitrate);
                                                        setPhLevel(env.phLevel);
                                                        setTurbidity(env.turbidity);
                                                        setTemperature(env.temperature);
                                                    }}
                                                    className="bg-slate-800/80 hover:bg-slate-700 border border-slate-700 hover:border-slate-500 rounded-lg p-2 flex flex-col items-center justify-center text-center gap-1 transition-all"
                                                >
                                                    <PresetIcon className={`w-5 h-5 ${env.highlight}`} />
                                                    <span className="text-[10px] font-bold text-slate-300 leading-tight">{env.name}</span>
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>

                                <div className="flex flex-col gap-1">
                                    <ParameterSlider 
                                        label="Nitrate Level" value={nitrate} min={0} max={100} step={1} unit="ppm" 
                                        onChange={setNitrate} colorHex="#10b981" leftLabel="Clean (0)" rightLabel="Eutrophic (100)" 
                                    />
                                    <ParameterSlider 
                                        label="Turbidity (Suspended Solids)" value={turbidity} min={0} max={100} step={1} unit="%" 
                                        onChange={setTurbidity} colorHex="#f59e0b" leftLabel="Clear (0)" rightLabel="Cloudy (100)" 
                                    />
                                    <ParameterSlider 
                                        label="pH Level" value={phLevel} min={0} max={14} step={0.1} unit="" 
                                        onChange={setPhLevel} colorHex="#f472b6" leftLabel="Acidic (0)" rightLabel="Alkaline (14)" 
                                    />
                                    <ParameterSlider 
                                        label="Temperature" value={temperature} min={0} max={35} step={1} unit="°C" 
                                        onChange={setTemperature} colorHex="#f97316" leftLabel="Freezing (0)" rightLabel="Hot (35)" 
                                    />
                                </div>
                            </div>

                            {/* Indicator Species Guide - SCROLLABLE */}
                            <div className="glass-panel rounded-2xl border-slate-700 flex flex-col flex-1 min-h-0 shadow-md">
                                <div className="p-4 border-b border-slate-700/60 bg-slate-800/30 rounded-t-2xl shrink-0">
                                    <h2 className="text-sm font-bold uppercase tracking-widest text-slate-300 flex items-center gap-2">
                                        <Icons.Bug className="text-emerald-400 w-5 h-5" /> Indicator Species Guide
                                    </h2>
                                </div>
                                
                                {/* Scrollable Content Area */}
                                <div className="flex-1 overflow-y-auto custom-scrollbar p-4">
                                    <div className="flex flex-col gap-3">
                                        {SPECIES_GUIDE.map(sp => {
                                            const isActive = activeSpecies.some(activeSp => activeSp.id === sp.id);
                                            
                                            return (
                                                <div key={sp.id} className={`p-4 rounded-xl border transition-all duration-500 ${isActive ? 'bg-slate-800/80 border-slate-600 shadow-md' : 'bg-slate-900/50 border-slate-800 opacity-60 grayscale'}`}>
                                                    <div className="flex justify-between items-start mb-2">
                                                        <div className="flex gap-3 items-center">
                                                            <div className="w-10 h-10 rounded-full flex items-center justify-center text-2xl bg-slate-900 border border-slate-700 shadow-inner shrink-0">
                                                                {sp.emoji}
                                                            </div>
                                                            <div>
                                                                <h3 className="font-bold text-white leading-tight">{sp.name}</h3>
                                                                <p className="text-[10px] text-slate-400 mt-0.5">{sp.desc}</p>
                                                            </div>
                                                        </div>
                                                        {isActive ? (
                                                            <span className="text-[10px] font-bold text-emerald-400 bg-emerald-950/50 px-2 py-0.5 rounded border border-emerald-800 shrink-0 mt-1">Present</span>
                                                        ) : (
                                                            <span className="text-[10px] font-bold text-rose-400 bg-rose-950/50 px-2 py-0.5 rounded border border-rose-800 shrink-0 mt-1">Absent</span>
                                                        )}
                                                    </div>

                                                    <div className="border-t border-slate-700/50 pt-2 mt-2 grid grid-cols-3 gap-2">
                                                        <div>
                                                            <div className="text-[9px] text-slate-500 font-semibold">Tolerance:</div>
                                                            <div className="text-[10px] font-bold text-slate-300">{sp.tolerance}</div>
                                                        </div>
                                                        <div>
                                                            <div className="text-[9px] text-slate-500 font-semibold">Min DO:</div>
                                                            <div className="text-[10px] font-mono font-bold" style={{color: sp.color}}>{sp.minDO} mg/L</div>
                                                        </div>
                                                        <div>
                                                            <div className="text-[9px] text-slate-500 font-semibold">Max Temp:</div>
                                                            <div className="text-[10px] font-mono font-bold text-orange-400">{sp.maxTemp} °C</div>
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>

                        </div>

                        {/* RIGHT COLUMN: SIMULATOR CANVAS */}
                        <div className="w-full h-[500px] lg:h-auto glass-panel rounded-2xl p-1 flex flex-col relative overflow-hidden border-slate-700 flex-1 shadow-lg">
                            <div className="absolute top-4 left-4 z-10 bg-slate-900/80 backdrop-blur px-3 py-1.5 rounded-lg border border-slate-700 text-xs font-bold text-slate-300 flex items-center gap-2 shadow-md pointer-events-none">
                                <Icons.Eye className="w-4 h-4 text-cyan-400"/> River Ecosystem View
                            </div>
                            <div className="flex-1 w-full h-full rounded-xl overflow-hidden shadow-inner relative bg-[#0f172a]">
                                {/* The canvas now renders natively to its container size with DPR adjustments */}
                                <canvas ref={canvasRef} className="absolute inset-0 w-full h-full block" />
                            </div>
                        </div>

                    </div>
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
