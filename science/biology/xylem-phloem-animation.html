<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Xylem vs Phloem Transport Simulator</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel (to compile JSX in the browser) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0f172a; /* matches tailwind slate-900 */
    }
  </style>
</head>
<body>
  <!-- The div where React will mount -->
  <div id="root"></div>

  <!-- React Application Code -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // --- Inline Icon Components (Replacing lucide-react imports) ---
    const Droplets = ({ className }) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7 2.99 7 2.99s-2.29 6.08-3.29 7.08c-1.14.93-1.71 2.03-1.71 3.19 0 2.22 1.8 4.05 4 4.05z"/><path d="M12.56 6.6A10.97 10.97 0 0 0 14 6c2.65 0 5.16.96 7 2.68V12a9 9 0 0 1-9 9c-2.65 0-5.16-.96-7-2.68"/></svg>);
    const ArrowDownUp = ({ className }) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m3 16 4 4 4-4"/><path d="M7 20V4"/><path d="m21 8-4-4-4 4"/><path d="M17 4v16"/></svg>);
    const Wind = ({ className }) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/></svg>);
    const Layers = ({ className }) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 12 12 17 22 12"/><polyline points="2 17 12 22 22 17"/></svg>);
    const Info = ({ className }) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>);
    const ArrowRightCircle = ({ className }) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="m12 16 4-4-4-4"/></svg>);

    /* SCIENTIFIC MODEL & CONCEPTS
      ---------------------------
      Topic: Vascular Tissue Transport (Xylem vs Phloem)
      
      1. Xylem (Cohesion-Tension Theory):
         - Fluid: Water & dissolved minerals (Blue).
         - Direction: Unidirectional (Roots -> Leaves).
         - Mechanism: Transpiration pull creates negative pressure (tension) at the top. Water molecules stick 
                      together (cohesion) and to the lignified walls (adhesion), pulling a continuous column upward.
         - Structure: Dead cells forming continuous tubes with thick, lignin-reinforced walls.

      2. Phloem (Pressure Flow Hypothesis / Mass Flow):
         - Fluid: Sap (Water + Sucrose) (Blue + Orange).
         - Direction: Bidirectional (Source -> Sink). Can be Leaves->Roots (summer) or Roots->Shoots (spring).
         - Mechanism: Active transport loads sucrose into the sieve tube at the "Source". This lowers water potential, 
                      causing water to flow in from the adjacent Xylem via osmosis. This creates high hydrostatic 
                      pressure, pushing the sap toward the "Sink" where sucrose is unloaded and water returns to Xylem.
         - Structure: Living cells, sieve plates (porous ends), companion cells (with nuclei).
    */

    // --- Engine Constants ---
    const CANVAS_WIDTH = 800;
    const CANVAS_HEIGHT = 600;

    function App() {
      // --- UI State ---
      const [view, setView] = useState('longitudinal'); // 'longitudinal' | 'cross-section'
      const [transpirationTension, setTranspirationTension] = useState(5); // 1 to 10
      const [phloemGradient, setPhloemGradient] = useState(5); // -5 (Roots are Source) to 5 (Leaves are Source)
      
      // --- Canvas & Simulation State ---
      const canvasRef = useRef(null);
      const requestRef = useRef();
      
      // Mutable state for the particle physics engine
      const simState = useRef({
        waterParticles: [],
        sapParticles: [],
        osmosisParticles: [], // Water moving horizontally between vessels
        lastTime: 0
      });

      // --- Particle Generators ---
      const spawnWater = (tension) => {
        if (Math.random() < tension * 0.1) {
          simState.current.waterParticles.push({
            id: Math.random(),
            x: 220 + Math.random() * 100, // Inside Xylem bounds
            y: CANVAS_HEIGHT + 10,
            speed: (tension * 0.5) + (Math.random() * 0.5),
            wobbleOffset: Math.random() * Math.PI * 2
          });
        }
      };

      const spawnSap = (gradient) => {
        if (gradient === 0) return; // No flow if no gradient

        const isLeavesSource = gradient > 0;
        const absGradient = Math.abs(gradient);
        
        // Spawn Sucrose + Water in Phloem
        if (Math.random() < absGradient * 0.15) {
          simState.current.sapParticles.push({
            id: Math.random(),
            type: Math.random() > 0.4 ? 'sucrose' : 'water',
            x: 480 + Math.random() * 80, // Inside Phloem bounds
            y: isLeavesSource ? -10 : CANVAS_HEIGHT + 10,
            speed: (isLeavesSource ? 1 : -1) * (absGradient * 0.4 + Math.random() * 0.5)
          });
        }

        // Spawn Osmosis Water jumping between Xylem and Phloem
        if (Math.random() < absGradient * 0.05) {
          const sourceY = isLeavesSource ? Math.random() * 150 : CANVAS_HEIGHT - Math.random() * 150;
          const sinkY = isLeavesSource ? CANVAS_HEIGHT - Math.random() * 150 : Math.random() * 150;
          
          // Xylem -> Phloem at Source (Water follows sucrose)
          simState.current.osmosisParticles.push({ 
            x: 350, y: sourceY, vx: 2, life: 100, type: 'source' 
          });
          // Phloem -> Xylem at Sink (Water recycled back to xylem)
          simState.current.osmosisParticles.push({ 
            x: 450, y: sinkY, vx: -2, life: 100, type: 'sink' 
          });
        }
      };

      // --- Main Render & Physics Loop ---
      const render = useCallback((time) => {
        if (!simState.current.lastTime) simState.current.lastTime = time;
        const deltaTime = time - simState.current.lastTime;
        simState.current.lastTime = time;

        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');

        // Clear Canvas
        ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

        if (view === 'cross-section') {
          drawCrossSection(ctx);
        } else {
          drawLongitudinal(ctx, time);
        }

        requestRef.current = requestAnimationFrame(render);
      }, [view, transpirationTension, phloemGradient]);

      const drawLongitudinal = (ctx, time) => {
        // --- 1. Draw Vessel Structures ---
        
        // Xylem (Left)
        ctx.fillStyle = 'rgba(15, 23, 42, 0.5)'; 
        ctx.fillRect(200, 0, 140, CANVAS_HEIGHT);
        
        ctx.lineWidth = 10;
        ctx.strokeStyle = '#713f12'; 
        ctx.beginPath();
        ctx.moveTo(200, 0); ctx.lineTo(200, CANVAS_HEIGHT);
        ctx.moveTo(340, 0); ctx.lineTo(340, CANVAS_HEIGHT);
        ctx.stroke();

        ctx.lineWidth = 4;
        ctx.strokeStyle = 'rgba(113, 63, 18, 0.4)';
        for(let y = 0; y < CANVAS_HEIGHT; y += 40) {
          ctx.beginPath();
          ctx.ellipse(270, y, 70, 10, 0, 0, Math.PI);
          ctx.stroke();
        }

        // Phloem (Right)
        ctx.fillStyle = 'rgba(20, 83, 45, 0.1)';
        ctx.fillRect(460, 0, 120, CANVAS_HEIGHT);
        
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#15803d';
        ctx.beginPath();
        ctx.moveTo(460, 0); ctx.lineTo(460, CANVAS_HEIGHT);
        ctx.moveTo(580, 0); ctx.lineTo(580, CANVAS_HEIGHT);
        ctx.stroke();

        ctx.strokeStyle = '#22c55e';
        ctx.lineWidth = 3;
        ctx.setLineDash([8, 4]); 
        for(let y = 150; y < CANVAS_HEIGHT; y += 150) {
          ctx.beginPath();
          ctx.moveTo(460, y);
          ctx.lineTo(580, y);
          ctx.stroke();
        }
        ctx.setLineDash([]); 

        // Companion Cells
        ctx.fillStyle = 'rgba(22, 101, 52, 0.2)';
        ctx.strokeStyle = '#166534';
        ctx.lineWidth = 2;
        for(let y = 50; y < CANVAS_HEIGHT; y += 150) {
          ctx.fillRect(580, y, 40, 100);
          ctx.strokeRect(580, y, 40, 100);
          ctx.fillStyle = '#14532d';
          ctx.beginPath(); ctx.arc(600, y + 50, 8, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = 'rgba(22, 101, 52, 0.2)'; 
        }

        // --- 2. Update & Draw Particles ---
        spawnWater(transpirationTension);
        spawnSap(phloemGradient);

        // Xylem Water
        ctx.fillStyle = '#38bdf8'; 
        simState.current.waterParticles = simState.current.waterParticles.filter(p => {
          p.y -= p.speed;
          const wobble = Math.sin((time * 0.005) + p.wobbleOffset) * 1.5;
          ctx.beginPath();
          ctx.arc(p.x + wobble, p.y, 4, 0, Math.PI * 2);
          ctx.fill();
          return p.y > -10;
        });

        // Phloem Sap
        simState.current.sapParticles = simState.current.sapParticles.filter(p => {
          p.y += p.speed;
          const nearPlate = (p.y % 150 < 10) || (p.y % 150 > 140);
          const renderX = nearPlate ? 520 + (p.x - 520) * 0.5 : p.x; 

          ctx.fillStyle = p.type === 'sucrose' ? '#fbbf24' : '#38bdf8'; 
          ctx.beginPath();
          ctx.arc(renderX, p.y, p.type === 'sucrose' ? 5 : 3, 0, Math.PI * 2);
          ctx.fill();
          return p.y > -20 && p.y < CANVAS_HEIGHT + 20;
        });

        // Osmosis Particles
        simState.current.osmosisParticles = simState.current.osmosisParticles.filter(p => {
          p.x += p.vx;
          p.life -= 1.5; 
          ctx.fillStyle = `rgba(56, 189, 248, ${p.life / 100})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
          ctx.fill();
          return p.life > 0;
        });

        // --- 3. Draw Labels & Arrows ---
        ctx.fillStyle = '#cbd5e1';
        ctx.textAlign = 'center';
        
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText('XYLEM', 270, 30);
        ctx.font = '12px sans-serif';
        ctx.fillStyle = '#94a3b8';
        ctx.fillText('Unidirectional (Passive)', 270, 50);
        
        ctx.fillStyle = '#cbd5e1';
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText('PHLOEM', 520, 30);
        ctx.font = '12px sans-serif';
        ctx.fillStyle = '#94a3b8';
        ctx.fillText('Bidirectional', 520, 50);

        ctx.font = '11px sans-serif';
        ctx.fillStyle = '#4ade80';
        ctx.fillText('Companion', 645, 90);
        ctx.fillText('Cell (Living)', 645, 105);

        if (phloemGradient !== 0) {
           ctx.fillStyle = 'rgba(56, 189, 248, 0.6)';
           ctx.font = 'italic 11px sans-serif';
           const isLeavesSource = phloemGradient > 0;
           ctx.fillText('Osmosis', 400, isLeavesSource ? 75 : CANVAS_HEIGHT - 75);
           ctx.fillText('Osmosis', 400, isLeavesSource ? CANVAS_HEIGHT - 75 : 75);
        }

        if (phloemGradient !== 0) {
          const isLeavesSource = phloemGradient > 0;
          ctx.fillStyle = '#fbbf24';
          ctx.font = 'bold 14px sans-serif';
          ctx.fillText('SOURCE (High Solute)', 705, isLeavesSource ? 30 : CANVAS_HEIGHT - 45);
          ctx.fillStyle = '#f87171'; 
          ctx.font = '11px sans-serif';
          ctx.fillText('Active Loading (Requires ATP)', 705, isLeavesSource ? 48 : CANVAS_HEIGHT - 27);
          
          ctx.fillStyle = '#94a3b8';
          ctx.font = 'bold 14px sans-serif';
          ctx.fillText('SINK (Low Solute)', 705, isLeavesSource ? CANVAS_HEIGHT - 45 : 30);
          ctx.fillStyle = '#f87171';
          ctx.font = '11px sans-serif';
          ctx.fillText('Active Unloading', 705, isLeavesSource ? CANVAS_HEIGHT - 27 : 48);
          
          ctx.strokeStyle = 'rgba(251, 191, 36, 0.3)';
          ctx.lineWidth = 6;
          drawArrow(ctx, 420, isLeavesSource ? 110 : CANVAS_HEIGHT - 110, 420, isLeavesSource ? CANVAS_HEIGHT - 110 : 110);
        }
      };

      const drawCrossSection = (ctx) => {
        const cx = CANVAS_WIDTH / 2;
        const cy = CANVAS_HEIGHT / 2;
        
        ctx.fillStyle = '#064e3b';
        ctx.beginPath(); ctx.arc(cx, cy, 220, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#0f172a';
        ctx.beginPath(); ctx.arc(cx, cy, 200, 0, Math.PI*2); ctx.fill();

        ctx.fillStyle = '#1e293b'; 
        ctx.beginPath(); ctx.arc(cx, cy, 80, 0, Math.PI*2); ctx.fill();

        const numBundles = 8;
        for (let i = 0; i < numBundles; i++) {
          const angle = (i / numBundles) * Math.PI * 2;
          const bx = cx + Math.cos(angle) * 140;
          const by = cy + Math.sin(angle) * 140;

          ctx.save();
          ctx.translate(bx, by);
          ctx.rotate(angle + Math.PI/2);

          ctx.fillStyle = '#475569';
          ctx.beginPath(); ctx.ellipse(0, -40, 30, 15, 0, 0, Math.PI*2); ctx.fill();

          ctx.fillStyle = '#15803d'; 
          ctx.beginPath(); ctx.ellipse(0, -15, 25, 20, 0, 0, Math.PI*2); ctx.fill();
          
          ctx.fillStyle = '#94a3b8';
          ctx.fillRect(-25, 5, 50, 4);

          ctx.fillStyle = '#713f12';
          ctx.beginPath();
          ctx.moveTo(-20, 10);
          ctx.lineTo(20, 10);
          ctx.lineTo(10, 50);
          ctx.lineTo(-10, 50);
          ctx.fill();

          ctx.fillStyle = 'rgba(56, 189, 248, 0.4)'; 
          ctx.beginPath(); ctx.arc(0, 20, 8, 0, Math.PI*2); ctx.fill();
          ctx.beginPath(); ctx.arc(-10, 35, 6, 0, Math.PI*2); ctx.fill();
          ctx.beginPath(); ctx.arc(10, 35, 6, 0, Math.PI*2); ctx.fill();
          ctx.strokeStyle = '#0f172a';
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.arc(0, 20, 8, 0, Math.PI*2); ctx.stroke();
          ctx.beginPath(); ctx.arc(-10, 35, 6, 0, Math.PI*2); ctx.stroke();
          ctx.beginPath(); ctx.arc(10, 35, 6, 0, Math.PI*2); ctx.stroke();

          ctx.restore();
        }

        ctx.fillStyle = '#cbd5e1';
        ctx.font = '14px sans-serif';
        ctx.textAlign = 'left';
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 1;
        
        ctx.beginPath(); ctx.moveTo(cx + 125, cy - 65); ctx.lineTo(cx + 250, cy - 150); ctx.lineTo(cx + 270, cy - 150); ctx.stroke();
        ctx.fillStyle = '#22c55e';
        ctx.fillText('Phloem (Outer)', cx + 275, cy - 146);
        
        ctx.beginPath(); ctx.moveTo(cx + 90, cy - 40); ctx.lineTo(cx + 250, cy - 80); ctx.lineTo(cx + 270, cy - 80); ctx.stroke();
        ctx.fillStyle = '#fbbf24'; 
        ctx.fillText('Xylem (Inner)', cx + 275, cy - 76);

        ctx.beginPath(); ctx.moveTo(cx + 110, cy - 50); ctx.lineTo(cx + 250, cy + 20); ctx.lineTo(cx + 270, cy + 20); ctx.stroke();
        ctx.fillStyle = '#94a3b8';
        ctx.fillText('Vascular Cambium', cx + 275, cy + 24);
      };

      const drawArrow = (ctx, fromX, fromY, toX, toY) => {
        const headlen = 15;
        const angle = Math.atan2(toY - fromY, toX - fromX);
        ctx.beginPath();
        ctx.moveTo(fromX, fromY);
        ctx.lineTo(toX, toY);
        ctx.lineTo(toX - headlen * Math.cos(angle - Math.PI / 6), toY - headlen * Math.sin(angle - Math.PI / 6));
        ctx.moveTo(toX, toY);
        ctx.lineTo(toX - headlen * Math.cos(angle + Math.PI / 6), toY - headlen * Math.sin(angle + Math.PI / 6));
        ctx.stroke();
      };

      useEffect(() => {
        requestRef.current = requestAnimationFrame(render);
        return () => cancelAnimationFrame(requestRef.current);
      }, [render]);

      return (
        <div className="flex flex-col h-screen max-h-[1000px] min-h-[750px] bg-slate-900 text-slate-100 font-sans overflow-hidden">
          <header className="flex items-center justify-between p-4 bg-slate-800 border-b border-slate-700 shadow-md z-10 shrink-0">
            <div className="flex items-center gap-3">
              <Droplets className="text-sky-400 w-8 h-8" />
              <div>
                <h1 className="text-xl md:text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-sky-400 to-emerald-400">
                  Xylem vs Phloem Transport
                </h1>
                <p className="text-xs text-slate-400">Plant Anatomy & Fluid Dynamics</p>
              </div>
            </div>
          </header>

          <main className="flex-1 flex flex-col lg:flex-row relative overflow-hidden">
            <aside className="w-full lg:w-[420px] p-6 bg-slate-800/50 border-r border-slate-700 overflow-y-auto flex flex-col gap-6 z-10 shrink-0">
              <div className="flex bg-slate-900 p-1 rounded-xl border border-slate-700">
                <button
                  onClick={() => setView('longitudinal')}
                  className={`flex-1 py-2 text-sm font-semibold rounded-lg flex items-center justify-center gap-2 transition-all ${
                    view === 'longitudinal' ? 'bg-slate-700 text-white shadow' : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  <ArrowDownUp className="w-4 h-4" /> Longitudinal
                </button>
                <button
                  onClick={() => setView('cross-section')}
                  className={`flex-1 py-2 text-sm font-semibold rounded-lg flex items-center justify-center gap-2 transition-all ${
                    view === 'cross-section' ? 'bg-slate-700 text-white shadow' : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  <Layers className="w-4 h-4" /> Cross-Section
                </button>
              </div>

              {view === 'longitudinal' && (
                <div className="animate-in fade-in duration-300 space-y-6">
                  <div className="bg-slate-900 p-4 rounded-xl border border-slate-700 relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-1 h-full bg-sky-500"></div>
                    <h2 className="text-md font-semibold mb-3 text-sky-400 flex items-center gap-2">
                      <Wind className="w-4 h-4" />
                      Xylem: Transpiration Pull
                    </h2>
                    <label className="flex justify-between text-xs mb-2 text-slate-300">
                      <span>Tension / Evaporation Rate</span>
                      <span className="font-mono">{transpirationTension * 10}%</span>
                    </label>
                    <input 
                      type="range" min="1" max="10" step="1"
                      value={transpirationTension}
                      onChange={(e) => setTranspirationTension(parseInt(e.target.value))}
                      className="w-full accent-sky-500 cursor-pointer mb-2"
                    />
                    <p className="text-xs text-slate-500 leading-relaxed">
                      Water is pulled up through dead, lignified tubes due to the cohesive properties of water and negative pressure (tension) created by evaporation at the leaves.
                    </p>
                  </div>

                  <div className="bg-slate-900 p-4 rounded-xl border border-slate-700 relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-1 h-full bg-amber-500"></div>
                    <h2 className="text-md font-semibold mb-3 text-emerald-400 flex items-center gap-2">
                      <ArrowRightCircle className="w-4 h-4" />
                      Phloem: Pressure Flow
                    </h2>
                    <label className="flex justify-between text-xs mb-2 text-slate-300">
                      <span>Sucrose Concentration Gradient</span>
                      <span className="font-mono">
                        {phloemGradient > 0 ? `Leaves +${phloemGradient}` : phloemGradient < 0 ? `Roots +${Math.abs(phloemGradient)}` : 'Equilibrium'}
                      </span>
                    </label>
                    <input 
                      type="range" min="-5" max="5" step="1"
                      value={phloemGradient}
                      onChange={(e) => setPhloemGradient(parseInt(e.target.value))}
                      className="w-full accent-emerald-500 cursor-pointer mb-3"
                    />
                    
                    <div className="grid grid-cols-3 gap-1 text-center text-xs text-slate-400 mb-3">
                      <div className={phloemGradient < 0 ? 'text-amber-400 font-bold' : ''}>Roots to Shoots</div>
                      <div className={phloemGradient === 0 ? 'text-slate-200 font-bold' : ''}>Zero Flow</div>
                      <div className={phloemGradient > 0 ? 'text-emerald-400 font-bold' : ''}>Leaves to Roots</div>
                    </div>

                    <p className="text-xs text-slate-500 leading-relaxed">
                      <strong>Active transport (requires ATP)</strong> loads sucrose at the "Source", drawing water from the xylem via osmosis. This increases hydrostatic pressure, pushing sap to the "Sink".
                    </p>
                  </div>
                </div>
              )}

              {view === 'cross-section' && (
                 <div className="animate-in fade-in duration-300 bg-slate-900 p-5 rounded-xl border border-slate-700">
                   <h2 className="text-md font-semibold mb-3 text-slate-200 flex items-center gap-2">
                      <Info className="w-5 h-5 text-indigo-400" />
                      Anatomy Notes (Dicot Stem)
                   </h2>
                   <ul className="text-sm text-slate-400 space-y-3 list-disc pl-4">
                     <li><strong className="text-slate-200">Vascular Bundles</strong> are arranged in a ring around the central pith.</li>
                     <li><strong className="text-yellow-500">Xylem</strong> is always located on the inner side of the bundle to provide structural support.</li>
                     <li><strong className="text-emerald-400">Phloem</strong> is located on the outer side.</li>
                     <li>The <strong className="text-indigo-300">Vascular Cambium</strong> is a layer of meristematic cells between them, responsible for secondary growth (thickening of the stem).</li>
                   </ul>
                 </div>
              )}

              <div className="mt-auto">
                 <div className="bg-slate-800 p-3 rounded-xl border border-slate-700 flex flex-wrap gap-x-4 gap-y-2 text-xs">
                    <span className="font-semibold text-slate-300 w-full mb-1">Visual Legend:</span>
                    <div className="flex items-center gap-1.5"><div className="w-3 h-3 rounded-full bg-sky-400"></div> Water (H₂O)</div>
                    <div className="flex items-center gap-1.5"><div className="w-3 h-3 rounded-full bg-amber-400"></div> Sucrose</div>
                    <div className="flex items-center gap-1.5"><div className="w-3 h-1 bg-yellow-900"></div> Lignin Wall</div>
                    <div className="flex items-center gap-1.5"><div className="w-3 h-1 border-t-2 border-dashed border-green-500"></div> Sieve Plate</div>
                 </div>
              </div>
            </aside>

            <div className="flex-1 relative p-4 flex flex-col justify-center items-center bg-slate-950">
              <div className="w-full max-w-[800px] aspect-[4/3] bg-[#0f172a] rounded-xl border-2 border-slate-700 overflow-hidden relative shadow-2xl">
                <canvas 
                  ref={canvasRef} 
                  width={CANVAS_WIDTH} 
                  height={CANVAS_HEIGHT} 
                  className="absolute top-0 left-0 w-full h-full object-contain"
                />
              </div>
            </div>
          </main>
        </div>
      );
    }

    // --- Mount the React App ---
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
