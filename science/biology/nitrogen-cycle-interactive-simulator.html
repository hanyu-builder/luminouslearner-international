<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Nitrogen Cycle Simulator</title>
    <meta name="description" content="Interactive Nitrogen Cycle Simulator. Pathway mapping of nitrogen fixation, nitrification, and denitrification.">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background-color: #020617; /* Slate 950 */
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            user-select: none;
        }
        
        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

        /* Dynamic Path Animations */
        @keyframes flow {
            from { stroke-dashoffset: 24; }
            to { stroke-dashoffset: 0; }
        }
        .animate-flow {
            stroke-dasharray: 12 12;
            animation: flow 0.8s linear infinite;
        }
        
        /* Drop Zones */
        .drop-zone { transition: all 0.3s ease; }
        .drop-zone:hover, .drop-zone.active { filter: brightness(1.3) drop-shadow(0 0 12px rgba(255,255,255,0.6)); cursor: pointer; }
        
        /* Draggable items */
        .drag-item { transition: transform 0.2s, box-shadow 0.2s; cursor: grab; }
        .drag-item:active { cursor: grabbing; transform: scale(0.95); }
        .drag-item.used { opacity: 0.4; cursor: not-allowed; filter: grayscale(1); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useRef } = React;

        // --- ICON WRAPPER COMPONENT ---
        const Icon = ({ name, className = "" }) => {
            const [svgHtml, setSvgHtml] = useState('');
            useEffect(() => {
                if (window.lucide && window.lucide.icons) {
                    const iconNode = window.lucide.icons[name];
                    if (iconNode) {
                        const svgElement = window.lucide.createElement(iconNode);
                        svgElement.setAttribute('class', className);
                        setSvgHtml(svgElement.outerHTML);
                    }
                }
            }, [name, className]);
            
            if (!svgHtml) return <span className={className}></span>;
            return <span dangerouslySetInnerHTML={{ __html: svgHtml }} className={`inline-flex items-center justify-center ${className}`} />;
        };

        // --- SCIENTIFIC DATA DICTIONARY ---
        const CYCLE_AGENTS = {
            fixer: {
                id: 'fixer',
                name: 'Nitrogen-Fixing Bacteria',
                example: 'Rhizobium (in root nodules)',
                role: 'Converts atmospheric Nitrogen gas (N₂) into Ammonium (NH₄⁺).',
                color: '#ec4899', // Pink
                icon: '🦠'
            },
            decomposer: {
                id: 'decomposer',
                name: 'Decomposers (Ammonification)',
                example: 'Fungi & Aerobic Bacteria',
                role: 'Breaks down dead organic matter, releasing Ammonium (NH₄⁺) back into the soil.',
                color: '#a855f7', // Purple
                icon: '🍄'
            },
            nitro1: {
                id: 'nitro1',
                name: 'Nitrifying Bacteria (Step 1)',
                example: 'Nitrosomonas',
                role: 'Converts Ammonium (NH₄⁺) into Nitrite (NO₂⁻).',
                color: '#eab308', // Yellow
                icon: '🧫'
            },
            nitro2: {
                id: 'nitro2',
                name: 'Nitrifying Bacteria (Step 2)',
                example: 'Nitrobacter',
                role: 'Converts Nitrite (NO₂⁻) into Nitrate (NO₃⁻), the form most plants can easily absorb.',
                color: '#f97316', // Orange
                icon: '🔬'
            },
            denitro: {
                id: 'denitro',
                name: 'Denitrifying Bacteria',
                example: 'Pseudomonas',
                role: 'Converts Nitrate (NO₃⁻) back into Nitrogen gas (N₂), returning it to the atmosphere.',
                color: '#06b6d4', // Cyan
                icon: '💨'
            },
            lightning: {
                id: 'lightning',
                name: 'Lightning (Abiotic Fixation)',
                example: 'Atmospheric Electrical Discharge',
                role: 'High energy breaks N₂ bonds, combining with oxygen to form Nitrates (NO₃⁻) that fall in rain.',
                color: '#facc15', // Yellow
                icon: '⚡'
            }
        };

        const POOLS = {
            atm: { id: 'atm', label: 'N₂ (Nitrogen Gas)', x: 600, y: 120, color: '#e2e8f0' },
            nh4: { id: 'nh4', label: 'NH₄⁺ (Ammonium)', x: 200, y: 620, color: '#ec4899' },
            no2: { id: 'no2', label: 'NO₂⁻ (Nitrite)', x: 550, y: 660, color: '#eab308' },
            no3: { id: 'no3', label: 'NO₃⁻ (Nitrate)', x: 900, y: 620, color: '#f97316' },
            plant: { id: 'plant', label: 'Organic N (Plants)', x: 800, y: 320, color: '#22c55e' }
        };

        const App = () => {
            // --- STATE ---
            const [unlockedPaths, setUnlockedPaths] = useState({
                fixer: false,
                decomposer: false,
                nitro1: false,
                nitro2: false,
                denitro: false,
                lightning: false,
                assimilation: true // Natural plant root uptake, unlocked by default
            });
            const [activeMessage, setActiveMessage] = useState({ text: "Drag the correct biological and environmental agents to the empty dashed nodes!", type: "info" });
            const [isPlaying, setIsPlaying] = useState(false);
            const [draggedId, setDraggedId] = useState(null);

            // --- DRAG AND DROP HANDLERS ---
            const handleDragStart = (e, id) => {
                setDraggedId(id);
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', id);
            };

            const handleDragOver = (e) => {
                e.preventDefault(); 
                e.dataTransfer.dropEffect = 'move';
            };

            const handleDrop = (e, targetZoneId) => {
                e.preventDefault();
                if (!draggedId) return;

                if (draggedId === targetZoneId) {
                    // Correct match!
                    setUnlockedPaths(prev => {
                        const newState = { ...prev, [targetZoneId]: true };
                        
                        // Check if all unlocked to auto-play
                        if (newState.fixer && newState.decomposer && newState.nitro1 && newState.nitro2 && newState.denitro && newState.lightning) {
                            setTimeout(() => setIsPlaying(true), 800);
                            setActiveMessage({ text: "Ecosystem Complete! The Nitrogen Cycle is fully functional and flowing.", type: 'success' });
                        } else {
                            setActiveMessage({ text: `Success! ${CYCLE_AGENTS[targetZoneId].name} placed correctly.`, type: 'success' });
                        }
                        
                        return newState;
                    });
                } else {
                    // Incorrect match
                    setActiveMessage({ text: `Oops! ${CYCLE_AGENTS[draggedId].name} does not belong there. Check its ecological role.`, type: 'error' });
                }
                setDraggedId(null);
            };

            const handleReset = () => {
                setUnlockedPaths({ fixer: false, decomposer: false, nitro1: false, nitro2: false, denitro: false, lightning: false, assimilation: true });
                setIsPlaying(false);
                setActiveMessage({ text: "Drag the correct biological and environmental agents to the empty dashed nodes!", type: "info" });
            };

            const isCycleComplete = unlockedPaths.fixer && unlockedPaths.decomposer && unlockedPaths.nitro1 && unlockedPaths.nitro2 && unlockedPaths.denitro && unlockedPaths.lightning;

            // Orb Animation Component
            const FlowOrbs = ({ pathId, color }) => {
                return (
                    <g>
                        {[0, 1, 2].map(i => (
                            <circle key={i} r="4" fill={color} filter="url(#glow)">
                                <animateMotion dur="3s" repeatCount="indefinite" begin={`${i}s`}>
                                    <mpath href={`#${pathId}`} />
                                </animateMotion>
                            </circle>
                        ))}
                    </g>
                );
            };

            return (
                <div className="flex flex-col h-screen max-h-[1000px] min-h-[750px] bg-[#020617] text-slate-100 font-sans overflow-hidden p-2 md:p-4">
                    
                    {/* Main Container */}
                    <div className="w-full h-full max-w-[1500px] mx-auto flex flex-col gap-4 border border-slate-700 bg-[#0F172A] rounded-2xl overflow-hidden shadow-2xl relative">
                        
                        {/* HEADER */}
                        <header className="flex items-center justify-between p-4 bg-slate-800 border-b border-slate-700 shadow-md z-10 shrink-0">
                            <div className="flex items-center gap-3">
                                <Icon name="Recycle" className="text-indigo-400 w-8 h-8" />
                                <div>
                                    <h1 className="text-xl md:text-2xl font-black bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-cyan-500 tracking-wide">
                                        Nitrogen Cycle Simulator
                                    </h1>
                                    <p className="text-[10px] text-slate-400 uppercase tracking-widest font-bold mt-0.5">Biogeochemical Pathways & Microbes</p>
                                </div>
                            </div>
                            
                            <div className="flex items-center gap-4">
                                <button 
                                    onClick={handleReset}
                                    className="px-4 py-2 bg-slate-900 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-bold transition-colors border border-slate-600 flex items-center gap-2"
                                >
                                    <Icon name="RotateCcw" className="w-4 h-4" /> Reset Board
                                </button>
                                <button 
                                    onClick={() => isCycleComplete && setIsPlaying(!isPlaying)}
                                    disabled={!isCycleComplete}
                                    className={`px-6 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2 transition-all ${
                                        !isCycleComplete ? 'bg-slate-800 text-slate-500 cursor-not-allowed opacity-50' :
                                        isPlaying ? 'bg-amber-600 text-white shadow-lg shadow-amber-900/50 hover:bg-amber-500' 
                                                  : 'bg-emerald-600 text-white shadow-lg shadow-emerald-900/50 hover:bg-emerald-500'
                                    }`}
                                >
                                    {isPlaying ? <><Icon name="Pause" className="w-4 h-4"/> Pause Flow</> : <><Icon name="Play" className="w-4 h-4"/> Run Cycle</>}
                                </button>
                            </div>
                        </header>

                        {/* MAIN CONTENT */}
                        <main className="flex-1 flex flex-col lg:flex-row relative min-h-0">
                            
                            {/* LEFT PANEL: BACTERIA BANK & INFO */}
                            <aside className="w-full lg:w-[400px] p-5 bg-slate-800/40 border-r border-slate-700 overflow-y-auto flex flex-col gap-5 z-10 shrink-0 custom-scrollbar">
                                
                                {/* Status Message */}
                                <div className={`p-4 rounded-xl border flex items-start gap-3 transition-colors duration-300 shadow-md ${
                                    activeMessage.type === 'success' ? 'bg-emerald-900/30 border-emerald-500/50 text-emerald-300' :
                                    activeMessage.type === 'error' ? 'bg-red-900/30 border-red-500/50 text-red-300 animate-pulse' :
                                    'bg-indigo-900/30 border-indigo-500/50 text-indigo-300'
                                }`}>
                                    <span className="text-xl mt-0.5">
                                        {activeMessage.type === 'success' ? '✅' : activeMessage.type === 'error' ? '❌' : 'ℹ️'}
                                    </span>
                                    <p className="text-xs font-semibold leading-relaxed mt-1">{activeMessage.text}</p>
                                </div>

                                {/* Draggable Bacteria Bank */}
                                <div className="bg-slate-900/80 p-5 rounded-2xl border border-slate-700 shadow-inner flex-1 flex flex-col">
                                    <h2 className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2 border-b border-slate-700 pb-2">
                                        <Icon name="Zap" className="w-4 h-4 text-amber-400" /> Cycle Agents Bank
                                    </h2>
                                    
                                    <div className="flex flex-col gap-3 overflow-y-auto pr-1 custom-scrollbar">
                                        {Object.values(CYCLE_AGENTS).map((agent) => (
                                            <div 
                                                key={agent.id}
                                                draggable={!unlockedPaths[agent.id]}
                                                onDragStart={(e) => handleDragStart(e, agent.id)}
                                                className={`relative p-3.5 rounded-xl border flex flex-col gap-1.5 ${
                                                    unlockedPaths[agent.id] 
                                                        ? 'bg-slate-950 border-slate-800 opacity-40 cursor-not-allowed grayscale' 
                                                        : `bg-slate-800 border-slate-600 drag-item hover:shadow-lg`
                                                }`}
                                                style={!unlockedPaths[agent.id] ? { borderLeftWidth: '4px', borderLeftColor: agent.color } : {}}
                                            >
                                                <div className="flex items-center justify-between">
                                                    <h3 className="font-bold text-slate-100 flex items-center gap-2 text-sm">
                                                        <span className="text-lg drop-shadow-md">{agent.icon}</span> {agent.name}
                                                    </h3>
                                                    {unlockedPaths[agent.id] && <span className="text-emerald-400 font-bold text-[10px] uppercase bg-emerald-950/50 px-2 py-0.5 rounded">Deployed ✓</span>}
                                                </div>
                                                <span className="text-[9px] text-slate-400 font-mono italic bg-slate-950/50 w-max px-1.5 rounded">{agent.example}</span>
                                                <p className="text-[11px] text-slate-300 leading-relaxed mt-1 font-medium">{agent.role}</p>
                                            </div>
                                        ))}
                                    </div>

                                    {/* Educational Prompt */}
                                    {!isCycleComplete && (
                                        <div className="mt-4 bg-amber-950/20 p-3.5 rounded-xl border border-amber-900/30 text-[11px] text-amber-200/80 italic leading-relaxed">
                                            <strong>Did you know?</strong> With the exception of high-energy <strong>lightning strikes</strong>, atmospheric nitrogen (N₂) is completely inaccessible to plants and animals. We rely almost entirely on specific microscopic organisms as the true chemical engineers of the ecosystem!
                                        </div>
                                    )}
                                </div>
                            </aside>

                            {/* RIGHT PANEL: SVG CYCLE MAPPER */}
                            <section className="flex-1 bg-[#070B14] relative shadow-2xl flex justify-center items-center overflow-hidden">
                                
                                <svg 
                                    viewBox="0 0 1200 750" 
                                    className="w-full h-full max-h-[850px] touch-none"
                                >
                                    <defs>
                                        <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
                                            <stop offset="0%" stopColor="#1e293b" />
                                            <stop offset="100%" stopColor="#334155" />
                                        </linearGradient>
                                        <linearGradient id="soil" x1="0%" y1="0%" x2="0%" y2="100%">
                                            <stop offset="0%" stopColor="#451a03" />
                                            <stop offset="100%" stopColor="#1c0a00" />
                                        </linearGradient>
                                        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                                            <feGaussianBlur stdDeviation="6" result="blur" />
                                            <feComposite in="SourceGraphic" in2="blur" operator="over" />
                                        </filter>
                                    </defs>

                                    {/* --- BACKGROUND ENV --- */}
                                    <rect x="0" y="0" width="1200" height="300" fill="url(#sky)" />
                                    <rect x="0" y="300" width="1200" height="450" fill="url(#soil)" />
                                    <line x1="0" y1="300" x2="1200" y2="300" stroke="#16a34a" strokeWidth="8" />

                                    {/* --- VISUAL ELEMENTS (PLANT & RABBIT) --- */}
                                    <g id="ecosystem">
                                        {/* Stem & Leaves */}
                                        <path d="M 800 300 L 800 150" fill="none" stroke="#22c55e" strokeWidth="12" strokeLinecap="round" />
                                        <path d="M 800 210 Q 730 170 720 120" fill="none" stroke="#22c55e" strokeWidth="8" strokeLinecap="round" />
                                        <path d="M 800 180 Q 880 140 890 90" fill="none" stroke="#22c55e" strokeWidth="8" strokeLinecap="round" />
                                        <ellipse cx="720" cy="120" rx="24" ry="12" fill="#4ade80" transform="rotate(-30 720 120)" />
                                        <ellipse cx="890" cy="90" rx="24" ry="12" fill="#4ade80" transform="rotate(30 890 90)" />
                                        <ellipse cx="800" cy="150" rx="24" ry="12" fill="#4ade80" transform="rotate(-90 800 150)" />
                                        
                                        {/* Roots */}
                                        <path d="M 800 300 Q 800 420 720 480" fill="none" stroke="#b45309" strokeWidth="6" strokeLinecap="round" />
                                        <path d="M 800 300 Q 830 400 880 460" fill="none" stroke="#b45309" strokeWidth="5" strokeLinecap="round" />
                                        <path d="M 770 380 Q 730 430 690 420" fill="none" stroke="#b45309" strokeWidth="4" strokeLinecap="round" />
                                        
                                        {/* Legume Root Nodules (Nitrogen Fixation Sites) */}
                                        <g id="nodules" opacity={unlockedPaths.fixer ? 1 : 0.4}>
                                            <circle cx="770" cy="380" r="8" fill="#fcd34d" />
                                            <circle cx="780" cy="340" r="9" fill="#fcd34d" />
                                            <circle cx="830" cy="410" r="7" fill="#fcd34d" />
                                            <circle cx="740" cy="440" r="8" fill="#fcd34d" />
                                            <text x="770" y="510" textAnchor="middle" fill="#fcd34d" fontSize="14" fontWeight="bold">Root Nodules</text>
                                        </g>

                                        {/* Bunny (Consumer) */}
                                        <text x="890" y="285" fontSize="48" className="drop-shadow-lg">🐇</text>
                                        <path d="M 890 280 Q 850 250 820 270" fill="none" stroke="#94a3b8" strokeWidth="2" strokeDasharray="4 4" />
                                    </g>

                                    {/* --- PATHWAYS (ARROWS) --- */}
                                    <g id="pathways" fill="none" strokeWidth="8" opacity="0.6">
                                        
                                        {/* 1. N2 to NH4+ (Fixation via Roots) */}
                                        <path id="path-fixer" d="M 540 150 C 350 250, 200 400, 200 560" stroke={unlockedPaths.fixer ? CYCLE_AGENTS.fixer.color : '#334155'} className={isPlaying && unlockedPaths.fixer ? "animate-flow" : ""} />
                                        
                                        {/* 2. Plant/Animal to NH4+ (Ammonification/Decomposition) */}
                                        <path id="path-decomp" d="M 800 350 C 700 480, 500 500, 260 600" stroke={unlockedPaths.decomposer ? CYCLE_AGENTS.decomposer.color : '#334155'} className={isPlaying && unlockedPaths.decomposer ? "animate-flow" : ""} />
                                        
                                        {/* 3. NH4+ to NO2- (Nitrification 1) */}
                                        <path id="path-nitro1" d="M 260 620 Q 400 680, 490 660" stroke={unlockedPaths.nitro1 ? CYCLE_AGENTS.nitro1.color : '#334155'} className={isPlaying && unlockedPaths.nitro1 ? "animate-flow" : ""} />
                                        
                                        {/* 4. NO2- to NO3- (Nitrification 2) */}
                                        <path id="path-nitro2" d="M 610 660 Q 750 680, 840 620" stroke={unlockedPaths.nitro2 ? CYCLE_AGENTS.nitro2.color : '#334155'} className={isPlaying && unlockedPaths.nitro2 ? "animate-flow" : ""} />

                                        {/* 5. NO3- to N2 (Denitrification) */}
                                        <path id="path-denitro" d="M 940 580 C 1100 400, 900 150, 660 120" stroke={unlockedPaths.denitro ? CYCLE_AGENTS.denitro.color : '#334155'} className={isPlaying && unlockedPaths.denitro ? "animate-flow" : ""} />

                                        {/* 6. NO3- to Plant (Assimilation - always unlocked) */}
                                        <path id="path-assim" d="M 880 580 Q 820 480, 810 380" stroke={POOLS.plant.color} strokeDasharray="10 10" className={isPlaying ? "animate-flow" : ""} />

                                        {/* 7. N2 to NO3- (Lightning Abiotic Fixation) - Jagged Bolt Path */}
                                        <path id="path-lightning" d="M 640 160 L 710 260 L 680 280 L 820 450 L 790 470 L 880 580" stroke={unlockedPaths.lightning ? CYCLE_AGENTS.lightning.color : '#334155'} strokeLinejoin="miter" strokeLinecap="square" className={isPlaying && unlockedPaths.lightning ? "animate-flow" : ""} />
                                    </g>

                                    {/* --- ANIMATED GLOWING ORBS --- */}
                                    {isPlaying && unlockedPaths.fixer && <FlowOrbs pathId="path-fixer" color={CYCLE_AGENTS.fixer.color} />}
                                    {isPlaying && unlockedPaths.decomposer && <FlowOrbs pathId="path-decomp" color={CYCLE_AGENTS.decomposer.color} />}
                                    {isPlaying && unlockedPaths.nitro1 && <FlowOrbs pathId="path-nitro1" color={CYCLE_AGENTS.nitro1.color} />}
                                    {isPlaying && unlockedPaths.nitro2 && <FlowOrbs pathId="path-nitro2" color={CYCLE_AGENTS.nitro2.color} />}
                                    {isPlaying && unlockedPaths.denitro && <FlowOrbs pathId="path-denitro" color={CYCLE_AGENTS.denitro.color} />}
                                    {isPlaying && unlockedPaths.lightning && <FlowOrbs pathId="path-lightning" color={CYCLE_AGENTS.lightning.color} />}
                                    {isPlaying && <FlowOrbs pathId="path-assim" color={POOLS.plant.color} />}


                                    {/* --- STATIC POOL NODES --- */}
                                    {Object.values(POOLS).map(pool => (
                                        <g key={pool.id} transform={`translate(${pool.x}, ${pool.y})`}>
                                            <circle r={pool.id === 'atm' ? 60 : 50} fill="#0f172a" stroke={pool.color} strokeWidth="5" filter={isPlaying ? "url(#glow)" : ""} />
                                            <text y={pool.id === 'atm' ? "-75" : "-65"} textAnchor="middle" fill={pool.color} fontSize="16" fontWeight="900" className="drop-shadow-md tracking-wider">{pool.label}</text>
                                            <text y="10" textAnchor="middle" fill="#fff" fontSize={pool.id === 'atm' ? 32 : 24} fontWeight="black" className="font-mono">
                                                {pool.id.toUpperCase().replace('ATM', 'N₂').replace('NH4', 'NH₄⁺').replace('NO2', 'NO₂⁻').replace('NO3', 'NO₃⁻').replace('PLANT', '🌿')}
                                            </text>
                                        </g>
                                    ))}

                                    {/* --- INTERACTIVE DROP ZONES (BACTERIA SLOTS) --- */}
                                    
                                    {/* Zone 1: Fixer (Atmosphere to Ammonium on roots) */}
                                    <g transform="translate(300, 380)">
                                        {unlockedPaths.fixer ? (
                                            <g filter="url(#glow)">
                                               <circle r="35" fill={CYCLE_AGENTS.fixer.color} />
                                               <text y="10" textAnchor="middle" fill="#fff" fontSize="32">{CYCLE_AGENTS.fixer.icon}</text>
                                               <text y="55" textAnchor="middle" fill={CYCLE_AGENTS.fixer.color} fontSize="16" fontWeight="900" className="drop-shadow-md">Fixation</text>
                                            </g>
                                        ) : (
                                            <g className="drop-zone" onDragOver={handleDragOver} onDrop={(e) => handleDrop(e, 'fixer')}>
                                                <circle r="35" fill="#1e293b" stroke="#64748b" strokeWidth="3" strokeDasharray="6 6" />
                                                <text y="10" textAnchor="middle" fill="#64748b" fontSize="32">?</text>
                                                <text y="55" textAnchor="middle" fill="#94a3b8" fontSize="14" fontWeight="bold">Drop Fixer Here</text>
                                            </g>
                                        )}
                                    </g>

                                    {/* Zone 2: Decomposer (Plant to Ammonium) */}
                                    <g transform="translate(550, 430)">
                                        {unlockedPaths.decomposer ? (
                                            <g filter="url(#glow)">
                                               <circle r="35" fill={CYCLE_AGENTS.decomposer.color} />
                                               <text y="10" textAnchor="middle" fill="#fff" fontSize="32">{CYCLE_AGENTS.decomposer.icon}</text>
                                               <text y="55" textAnchor="middle" fill={CYCLE_AGENTS.decomposer.color} fontSize="16" fontWeight="900" className="drop-shadow-md">Ammonification</text>
                                            </g>
                                        ) : (
                                            <g className="drop-zone" onDragOver={handleDragOver} onDrop={(e) => handleDrop(e, 'decomposer')}>
                                                <circle r="35" fill="#1e293b" stroke="#64748b" strokeWidth="3" strokeDasharray="6 6" />
                                                <text y="10" textAnchor="middle" fill="#64748b" fontSize="32">?</text>
                                                <text y="55" textAnchor="middle" fill="#94a3b8" fontSize="14" fontWeight="bold">Drop Decomposer</text>
                                            </g>
                                        )}
                                    </g>

                                    {/* Zone 3: Nitro 1 (Ammonium to Nitrite) */}
                                    <g transform="translate(375, 665)">
                                        {unlockedPaths.nitro1 ? (
                                            <g filter="url(#glow)">
                                               <circle r="35" fill={CYCLE_AGENTS.nitro1.color} />
                                               <text y="10" textAnchor="middle" fill="#fff" fontSize="32">{CYCLE_AGENTS.nitro1.icon}</text>
                                               <text y="55" textAnchor="middle" fill={CYCLE_AGENTS.nitro1.color} fontSize="16" fontWeight="900" className="drop-shadow-md">Nitrification 1</text>
                                            </g>
                                        ) : (
                                            <g className="drop-zone" onDragOver={handleDragOver} onDrop={(e) => handleDrop(e, 'nitro1')}>
                                                <circle r="35" fill="#1e293b" stroke="#64748b" strokeWidth="3" strokeDasharray="6 6" />
                                                <text y="10" textAnchor="middle" fill="#64748b" fontSize="32">?</text>
                                            </g>
                                        )}
                                    </g>

                                    {/* Zone 4: Nitro 2 (Nitrite to Nitrate) */}
                                    <g transform="translate(725, 665)">
                                        {unlockedPaths.nitro2 ? (
                                            <g filter="url(#glow)">
                                               <circle r="35" fill={CYCLE_AGENTS.nitro2.color} />
                                               <text y="10" textAnchor="middle" fill="#fff" fontSize="32">{CYCLE_AGENTS.nitro2.icon}</text>
                                               <text y="55" textAnchor="middle" fill={CYCLE_AGENTS.nitro2.color} fontSize="16" fontWeight="900" className="drop-shadow-md">Nitrification 2</text>
                                            </g>
                                        ) : (
                                            <g className="drop-zone" onDragOver={handleDragOver} onDrop={(e) => handleDrop(e, 'nitro2')}>
                                                <circle r="35" fill="#1e293b" stroke="#64748b" strokeWidth="3" strokeDasharray="6 6" />
                                                <text y="10" textAnchor="middle" fill="#64748b" fontSize="32">?</text>
                                            </g>
                                        )}
                                    </g>

                                    {/* Zone 5: Denitro (Nitrate to Atmosphere) */}
                                    <g transform="translate(1000, 350)">
                                        {unlockedPaths.denitro ? (
                                            <g filter="url(#glow)">
                                               <circle r="35" fill={CYCLE_AGENTS.denitro.color} />
                                               <text y="10" textAnchor="middle" fill="#fff" fontSize="32">{CYCLE_AGENTS.denitro.icon}</text>
                                               <text y="55" textAnchor="middle" fill={CYCLE_AGENTS.denitro.color} fontSize="16" fontWeight="900" className="drop-shadow-md">Denitrification</text>
                                            </g>
                                        ) : (
                                            <g className="drop-zone" onDragOver={handleDragOver} onDrop={(e) => handleDrop(e, 'denitro')}>
                                                <circle r="35" fill="#1e293b" stroke="#64748b" strokeWidth="3" strokeDasharray="6 6" />
                                                <text y="10" textAnchor="middle" fill="#64748b" fontSize="32">?</text>
                                                <text y="55" textAnchor="middle" fill="#94a3b8" fontSize="14" fontWeight="bold">Drop Denitrifier</text>
                                            </g>
                                        )}
                                    </g>

                                    {/* Zone 6: Lightning (Atmosphere to Nitrate) */}
                                    <g transform="translate(720, 210)">
                                        {unlockedPaths.lightning ? (
                                            <g filter="url(#glow)">
                                               <circle r="35" fill={CYCLE_AGENTS.lightning.color} />
                                               <text y="10" textAnchor="middle" fill="#fff" fontSize="32">{CYCLE_AGENTS.lightning.icon}</text>
                                               <text y="55" textAnchor="middle" fill={CYCLE_AGENTS.lightning.color} fontSize="16" fontWeight="900" className="drop-shadow-md">Abiotic Fixation</text>
                                            </g>
                                        ) : (
                                            <g className="drop-zone" onDragOver={handleDragOver} onDrop={(e) => handleDrop(e, 'lightning')}>
                                                <circle r="35" fill="#1e293b" stroke="#64748b" strokeWidth="3" strokeDasharray="6 6" />
                                                <text y="10" textAnchor="middle" fill="#64748b" fontSize="32">?</text>
                                                <text y="55" textAnchor="middle" fill="#94a3b8" fontSize="14" fontWeight="bold">Drop Lightning</text>
                                            </g>
                                        )}
                                    </g>

                                </svg>
                                
                                {/* Overlay Status (Bottom right) */}
                                {isCycleComplete && (
                                    <div className={`absolute bottom-6 right-6 px-5 py-3 rounded-2xl backdrop-blur-md border font-black shadow-2xl transition-all duration-500 tracking-wider ${isPlaying ? 'bg-emerald-900/90 border-emerald-400 text-emerald-400 animate-pulse' : 'bg-slate-800/90 border-slate-500 text-slate-300'}`}>
                                        {isPlaying ? 'CYCLE ACTIVE: Nitrogen is flowing! ⚡' : 'CYCLE COMPLETE: Ready to run.'}
                                    </div>
                                )}

                            </section>
                        </main>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
