<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedigree Detective Virtual Lab</title>
    <!-- SEO Keyword: Pedigree -->
    <meta name="description" content="Interactive biology virtual lab: Pedigree Detective. Build family trees and algorithmic test Autosomal Dominant, Recessive, and X-Linked traits.">
    
    <!-- Tailwind CSS for UI styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- D3.js for Graph Rendering -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    
    <style>
        /* Base Deep Slate Theme */
        body {
            overflow: hidden;
            background-color: #0F172A; 
            background-image: radial-gradient(circle at 50% 50%, #1E293B 0%, #0F172A 100%);
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Custom Radio Buttons */
        .hypo-radio:checked + label {
            background-color: rgba(56, 189, 248, 0.2);
            border-color: #38BDF8;
            color: #38BDF8;
        }

        /* SVG Graph Styles */
        .node {
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .node:hover .shape {
            stroke: #38BDF8 !important;
            stroke-width: 4px !important;
            filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.6));
        }
        .pedigree-line {
            fill: none;
            stroke: #64748B;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .gen-label {
            font-family: monospace;
            font-size: 24px;
            font-weight: bold;
            fill: #475569;
        }

        /* Violation Highlighting */
        .violation-shape {
            stroke: #EF4444 !important;
            stroke-width: 4px !important;
            filter: drop-shadow(0 0 12px rgba(239, 68, 68, 0.9));
        }
    </style>
</head>
<body class="h-screen max-h-[1000px] w-full flex flex-col md:flex-row text-slate-200 font-sans p-4 gap-4 box-border">

    <!-- Left UI Panel: Controls -->
    <aside class="w-full md:w-[420px] h-full glass-panel p-6 flex flex-col shadow-2xl z-20 overflow-y-auto rounded-2xl border border-slate-700 shrink-0">
        <div class="mb-4 border-b border-slate-700 pb-4">
            <h1 class="text-2xl font-bold text-sky-400 mb-1 leading-tight">Pedigree Detective</h1>
            <p class="text-xs text-slate-400 uppercase tracking-widest font-semibold">Inheritance Validator</p>
        </div>

        <!-- Educational Content -->
        <div class="mb-5 text-sm text-slate-300 space-y-2 bg-slate-900/50 p-4 rounded-xl border border-slate-800 shadow-inner">
            <p>
                Click any individual on the <strong class="text-sky-300">Pedigree chart</strong> to toggle their affected status. 
            </p>
            <ul class="text-xs space-y-1 ml-4 list-disc text-slate-400 marker:text-slate-500">
                <li><strong class="text-slate-200">Square:</strong> Male &nbsp;|&nbsp; <strong class="text-slate-200">Circle:</strong> Female</li>
                <li><strong class="text-sky-400">Filled:</strong> Affected &nbsp;|&nbsp; <strong class="text-slate-500">Empty:</strong> Unaffected</li>
            </ul>
        </div>

        <!-- Interactive Controls -->
        <div class="space-y-4 flex-grow">
            <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Test Inheritance Hypothesis</h3>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <input type="radio" name="hypothesis" id="auto-dom" value="Autosomal Dominant" class="hidden hypo-radio">
                    <label for="auto-dom" class="block w-full p-2 text-center rounded-lg border border-slate-700 cursor-pointer transition-all hover:bg-slate-800 text-xs font-semibold">
                        Auto Dominant
                    </label>
                </div>
                <div>
                    <input type="radio" name="hypothesis" id="auto-rec" value="Autosomal Recessive" class="hidden hypo-radio" checked>
                    <label for="auto-rec" class="block w-full p-2 text-center rounded-lg border border-slate-700 cursor-pointer transition-all hover:bg-slate-800 text-xs font-semibold">
                        Auto Recessive
                    </label>
                </div>
                <div>
                    <input type="radio" name="hypothesis" id="x-dom" value="X-Linked Dominant" class="hidden hypo-radio">
                    <label for="x-dom" class="block w-full p-2 text-center rounded-lg border border-slate-700 cursor-pointer transition-all hover:bg-slate-800 text-xs font-semibold">
                        X-Linked Dominant
                    </label>
                </div>
                <div>
                    <input type="radio" name="hypothesis" id="x-rec" value="X-Linked Recessive" class="hidden hypo-radio">
                    <label for="x-rec" class="block w-full p-2 text-center rounded-lg border border-slate-700 cursor-pointer transition-all hover:bg-slate-800 text-xs font-semibold">
                        X-Linked Recessive
                    </label>
                </div>
            </div>

            <!-- Algorithmic Validation Output -->
            <div id="validation-panel" class="mt-6 p-4 rounded-xl border-2 transition-colors duration-300">
                <div class="flex items-center gap-2 mb-2">
                    <span id="validation-icon" class="text-xl">✅</span>
                    <h4 id="validation-title" class="font-bold text-lg">Valid Pattern</h4>
                </div>
                <p id="validation-reason" class="text-sm font-medium"></p>
            </div>
        </div>

        <button id="reset-btn" class="w-full py-3 mt-4 bg-slate-700 hover:bg-slate-600 text-white rounded-lg transition-colors font-semibold shadow-lg">
            Clear Pedigree
        </button>
    </aside>

    <!-- Right Simulation Panel (D3 Canvas) -->
    <main class="flex-grow h-full relative bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden shadow-inner flex items-center justify-center" id="canvas-container">
        <!-- SVG injected by D3 -->
        <div id="d3-container" class="w-full h-full relative"></div>
    </main>

    <script>
        /**
         * EDUCATIONAL WEB SIMULATOR LOGIC
         * Core Concept: Pedigree rendering and algorithmic validation of inheritance patterns.
         * Engine: D3.js for SVG graph generation and updates.
         */

        // --- Data Structure ---
        // Fixed 3-generation layout to ensure valid, recognizable pedigree geometry
        let nodesData = [
            { id: 1, sex: 'M', x: 200, y: 100, affected: false },
            { id: 2, sex: 'F', x: 350, y: 100, affected: false },
            { id: 3, sex: 'M', x: 650, y: 100, affected: false },
            { id: 4, sex: 'F', x: 800, y: 100, affected: false },
            
            { id: 5, sex: 'M', x: 125, y: 300, affected: false, parents: [1,2] },
            { id: 6, sex: 'F', x: 275, y: 300, affected: false, parents: [1,2] },
            { id: 7, sex: 'M', x: 425, y: 300, affected: false, parents: [1,2] },
            
            // Fixed biological reproduction issue: 8 is now Female
            { id: 8, sex: 'F', x: 575, y: 300, affected: false, parents: [3,4] }, 
            { id: 9, sex: 'F', x: 725, y: 300, affected: false, parents: [3,4] },
            { id: 10, sex: 'M', x: 875, y: 300, affected: false, parents: [3,4] },

            { id: 11, sex: 'F', x: 350, y: 500, affected: false, parents: [7,8] },
            { id: 12, sex: 'F', x: 500, y: 500, affected: true,  parents: [7,8] }, // Default Affected to show carrier scenario
            { id: 13, sex: 'M', x: 650, y: 500, affected: false, parents: [7,8] }
        ];

        const marriages = [
            { id: 'm1', p1: 1, p2: 2, y: 100 },
            { id: 'm2', p1: 3, p2: 4, y: 100 },
            { id: 'm3', p1: 7, p2: 8, y: 300 }
        ];

        // --- DOM Elements ---
        const validationPanel = document.getElementById('validation-panel');
        const validationTitle = document.getElementById('validation-title');
        const validationReason = document.getElementById('validation-reason');
        const validationIcon = document.getElementById('validation-icon');
        const radios = document.querySelectorAll('input[name="hypothesis"]');
        const resetBtn = document.getElementById('reset-btn');

        // --- D3.js Setup ---
        const container = document.getElementById('d3-container');
        const svg = d3.select('#d3-container')
                      .append('svg')
                      .attr('width', '100%')
                      .attr('height', '100%')
                      .attr('viewBox', '0 0 1000 600')
                      .attr('preserveAspectRatio', 'xMidYMid meet');

        const gLines = svg.append('g').attr('class', 'lines-layer');
        const gNodes = svg.append('g').attr('class', 'nodes-layer');
        const gLabels = svg.append('g').attr('class', 'labels-layer');

        function initGraph() {
            drawLines();
            drawLabels();
            updateNodes();
            validateHypothesis();
        }

        function drawLabels() {
            gLabels.append('text').attr('x', 50).attr('y', 110).attr('class', 'gen-label').text('I');
            gLabels.append('text').attr('x', 50).attr('y', 310).attr('class', 'gen-label').text('II');
            gLabels.append('text').attr('x', 50).attr('y', 510).attr('class', 'gen-label').text('III');
        }

        function drawLines() {
            gLines.selectAll('*').remove();

            marriages.forEach(m => {
                const p1 = nodesData.find(n => n.id === m.p1);
                const p2 = nodesData.find(n => n.id === m.p2);
                
                // 1. Marriage Line (Horizontal)
                gLines.append('line')
                    .attr('x1', p1.x).attr('y1', p1.y)
                    .attr('x2', p2.x).attr('y2', p2.y)
                    .attr('class', 'pedigree-line');

                // Find Children
                const children = nodesData.filter(n => n.parents && n.parents.includes(m.p1) && n.parents.includes(m.p2));
                
                if (children.length > 0) {
                    const midX = (p1.x + p2.x) / 2;
                    const descentY = p1.y + 100; // Drop distance before horizontal sibling branch
                    
                    // 2. Descent Line (Vertical)
                    gLines.append('line')
                        .attr('x1', midX).attr('y1', p1.y)
                        .attr('x2', midX).attr('y2', descentY)
                        .attr('class', 'pedigree-line');

                    // 3. Sibling Line (Horizontal)
                    const minX = d3.min(children, c => c.x);
                    const maxX = d3.max(children, c => c.x);
                    
                    // Only draw sibling horizontal line if there's more than 1 child or child is offset
                    if (children.length > 1 || minX !== midX) {
                         gLines.append('line')
                            .attr('x1', minX).attr('y1', descentY)
                            .attr('x2', maxX).attr('y2', descentY)
                            .attr('class', 'pedigree-line');
                    }

                    // 4. Individual Child Lines (Vertical)
                    children.forEach(c => {
                        gLines.append('line')
                            .attr('x1', c.x).attr('y1', descentY)
                            .attr('x2', c.x).attr('y2', c.y - 25) // Stop at node border
                            .attr('class', 'pedigree-line');
                    });
                }
            });
        }

        function updateNodes() {
            const nodes = gNodes.selectAll('.node').data(nodesData, d => d.id);

            const nodeEnter = nodes.enter()
                .append('g')
                .attr('class', 'node')
                .attr('id', d => `node-${d.id}`) // Add explicit ID for violation highlighting
                .attr('transform', d => `translate(${d.x}, ${d.y})`)
                .on('click', function(event, d) {
                    d.affected = !d.affected;
                    updateNodes();
                    validateHypothesis();
                });

            // Add Shapes based on Sex
            nodeEnter.each(function(d) {
                const el = d3.select(this);
                if (d.sex === 'M') {
                    el.append('rect')
                      .attr('x', -22).attr('y', -22)
                      .attr('width', 44).attr('height', 44)
                      .attr('class', 'shape');
                } else {
                    el.append('circle')
                      .attr('cx', 0).attr('cy', 0)
                      .attr('r', 24)
                      .attr('class', 'shape');
                }
            });

            // Add ID Labels
            nodeEnter.append('text')
                .attr('y', 45)
                .attr('text-anchor', 'middle')
                .attr('fill', '#94A3B8')
                .attr('font-size', '12px')
                .text(d => d.id);

            // Update Merge (Styles for Affected/Unaffected)
            const allNodes = nodeEnter.merge(nodes);
            
            allNodes.select('.shape')
                .transition().duration(300)
                .attr('fill', d => d.affected ? '#0EA5E9' : '#1E293B') // sky-500 vs slate-800
                .attr('stroke', d => d.affected ? '#0284C7' : '#94A3B8')
                .attr('stroke-width', d => d.affected ? 0 : 3);
        }

        // --- Algorithmic Validation Logic ---
        
        function getNode(id) {
            return nodesData.find(n => n.id === id);
        }

        // Helper to instantly highlight the nodes that break the rule
        function highlightViolations(ids) {
            ids.forEach(id => {
                if(id) d3.select(`#node-${id} .shape`).classed('violation-shape', true);
            });
        }

        function validateHypothesis() {
            // Reset all violation highlights
            d3.selectAll('.shape').classed('violation-shape', false);

            const mode = document.querySelector('input[name="hypothesis"]:checked').value;
            let isValid = true;
            let reason = `This family tree is mathematically consistent with ${mode} inheritance.`;
            let violatingNodes = [];

            // Define family groups for checking logic
            const families = [
                { p1: getNode(1), p2: getNode(2), children: [getNode(5), getNode(6), getNode(7)] },
                { p1: getNode(3), p2: getNode(4), children: [getNode(8), getNode(9), getNode(10)] },
                { p1: getNode(7), p2: getNode(8), children: [getNode(11), getNode(12), getNode(13)] }
            ];

            // Run rules against all families
            for (let fam of families) {
                const p1 = fam.p1;
                const p2 = fam.p2;
                const kids = fam.children;
                const mother = p1.sex === 'F' ? p1 : p2;
                const father = p1.sex === 'M' ? p1 : p2;

                if (mode === 'Autosomal Dominant') {
                    // Rule: Unaffected parents CANNOT have affected children
                    if (!p1.affected && !p2.affected) {
                        for (let kid of kids) {
                            if (kid.affected) {
                                isValid = false;
                                reason = `Invalid: Affected child (${kid.id}) born to unaffected parents (${p1.id} & ${p2.id}). Autosomal Dominant traits cannot skip generations; at least one parent must be affected.`;
                                violatingNodes = [p1.id, p2.id, kid.id];
                                break;
                            }
                        }
                    }
                } 
                else if (mode === 'Autosomal Recessive') {
                    // Rule: Two affected parents MUST have 100% affected children
                    if (p1.affected && p2.affected) {
                        for (let kid of kids) {
                            if (!kid.affected) {
                                isValid = false;
                                reason = `Invalid: Unaffected child (${kid.id}) born to two affected parents (${p1.id} & ${p2.id}). In Autosomal Recessive, affected parents only have recessive alleles to pass on.`;
                                violatingNodes = [p1.id, p2.id, kid.id];
                                break;
                            }
                        }
                    }
                }
                else if (mode === 'X-Linked Dominant') {
                    // Rule 1: Affected father MUST have 100% affected daughters
                    if (father.affected) {
                        for (let kid of kids) {
                            if (kid.sex === 'F' && !kid.affected) {
                                isValid = false;
                                reason = `Invalid: Affected father (${father.id}) has unaffected daughter (${kid.id}). In X-Linked Dominant, a father passes his affected X chromosome to all daughters.`;
                                violatingNodes = [father.id, kid.id];
                                break;
                            }
                        }
                    }
                    // Rule 2: Affected son MUST have affected mother
                    if (isValid) {
                        for (let kid of kids) {
                            if (kid.sex === 'M' && kid.affected && !mother.affected) {
                                isValid = false;
                                reason = `Invalid: Affected son (${kid.id}) has unaffected mother (${mother.id}). Males inherit their only X chromosome from their mother.`;
                                violatingNodes = [mother.id, kid.id];
                                break;
                            }
                        }
                    }
                    // Rule 3: Unaffected parents CANNOT have affected children (same as auto dom)
                    if (isValid && !p1.affected && !p2.affected) {
                        for (let kid of kids) {
                            if (kid.affected) {
                                isValid = false;
                                reason = `Invalid: Affected child (${kid.id}) born to unaffected parents (${p1.id} & ${p2.id}). Dominant traits cannot skip generations.`;
                                violatingNodes = [p1.id, p2.id, kid.id];
                                break;
                            }
                        }
                    }
                }
                else if (mode === 'X-Linked Recessive') {
                    // Rule 1: Affected mother MUST have 100% affected sons
                    if (mother.affected) {
                        for (let kid of kids) {
                            if (kid.sex === 'M' && !kid.affected) {
                                isValid = false;
                                reason = `Invalid: Affected mother (${mother.id}) has unaffected son (${kid.id}). In X-Linked Recessive, mothers pass their only X chromosome to sons.`;
                                violatingNodes = [mother.id, kid.id];
                                break;
                            }
                        }
                    }
                    // Rule 2: Affected daughter MUST have affected father
                    if (isValid) {
                        for (let kid of kids) {
                            if (kid.sex === 'F' && kid.affected && !father.affected) {
                                isValid = false;
                                reason = `Invalid: Affected daughter (${kid.id}) has unaffected father (${father.id}). Females need two copies, meaning the father must express the trait.`;
                                violatingNodes = [father.id, kid.id];
                                break;
                            }
                        }
                    }
                    // Rule 3: Two affected parents = 100% affected children
                    if (isValid && mother.affected && father.affected) {
                        for (let kid of kids) {
                            if (!kid.affected) {
                                isValid = false;
                                reason = `Invalid: Two affected parents (${mother.id} & ${father.id}) have unaffected child (${kid.id}).`;
                                violatingNodes = [mother.id, father.id, kid.id];
                                break;
                            }
                        }
                    }
                }
                
                // Stop checking if we found a violation
                if (!isValid) {
                    highlightViolations(violatingNodes);
                    break; 
                }
            }

            // Update UI
            if (isValid) {
                validationPanel.className = "mt-6 p-4 rounded-xl border-2 border-emerald-500 bg-emerald-900/30 text-emerald-300";
                validationTitle.innerText = "Valid Pattern";
                validationIcon.innerText = "✅";
                validationReason.innerText = reason;
            } else {
                validationPanel.className = "mt-6 p-4 rounded-xl border-2 border-rose-500 bg-rose-900/30 text-rose-300";
                validationTitle.innerText = "Impossible Pattern";
                validationIcon.innerText = "❌";
                validationReason.innerText = reason;
            }
        }

        // --- Event Listeners ---
        radios.forEach(radio => {
            radio.addEventListener('change', validateHypothesis);
        });

        resetBtn.addEventListener('click', () => {
            nodesData.forEach(n => n.affected = false);
            updateNodes();
            validateHypothesis();
        });

        // --- Boot ---
        window.addEventListener('load', initGraph);

    </script>
</body>
</html>
