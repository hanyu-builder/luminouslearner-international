<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Quadrat Sampling Simulator</title>
    <meta name="description" content="Interactive Quadrat Sampling & Population Ecology Simulator. Visualize spatial distributions and estimate population density.">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background-color: #020617; /* Slate 950 */
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            user-select: none;
        }
        
        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

        /* Custom Sliders */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
            width: 100%;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px; width: 16px;
            border-radius: 50%;
            background: currentColor;
            cursor: pointer;
            margin-top: -5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 6px;
            cursor: pointer; border-radius: 4px;
            background: #1e293b;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useRef, useCallback } = React;

        // --- ICON WRAPPER COMPONENT ---
        // Maps the requested Lucide icons from the CDN so they work in standalone React
        const Icon = ({ name, className = "" }) => {
            const [svgHtml, setSvgHtml] = useState('');
            useEffect(() => {
                if (window.lucide && window.lucide.icons) {
                    const iconNode = window.lucide.icons[name];
                    if (iconNode) {
                        const svgElement = window.lucide.createElement(iconNode);
                        svgElement.setAttribute('class', className);
                        setSvgHtml(svgElement.outerHTML);
                    }
                }
            }, [name, className]);
            
            if (!svgHtml) return <span className={className}></span>;
            return <span dangerouslySetInnerHTML={{ __html: svgHtml }} className={`inline-flex items-center justify-center ${className}`} />;
        };

        /* SCIENTIFIC MODEL & CONCEPTS
          ---------------------------
          Topic: Quadrat Sampling
          
          Math & Formulas:
          1. Area of 1 Quadrat = Side * Side
          2. Total Area Sampled = Number of Quadrats * Area of 1 Quadrat
          3. Sampled Density = Total Organisms Counted / Total Area Sampled
          4. Estimated Population = Sampled Density * Total Field Area
          
          Ecological Distributions:
          - Random: Individuals are independent of each other (wind-dispersed).
          - Clumped (Patchy): Individuals group around resources or drop seeds nearby.
          - Uniform: Individuals maximize space between each other due to intense competition.
        */

        // --- Engine & Field Constants ---
        const FIELD_SIZE_M = 20; // 20m x 20m field
        const FIELD_AREA = FIELD_SIZE_M * FIELD_SIZE_M; // 400 m^2

        const HABITAT_PROFILES = {
          meadow: {
            id: 'meadow',
            name: 'Open Meadow (Distributions)',
            desc: 'A flat field testing the 3 core distributions: Random, Clumped, and Uniform.',
            bg: '#064E3B', // Emerald 900
            species: {
              A: { id: 'A', name: 'Dandelion', emoji: '🌼', distribution: 'random', trueCount: 80, size: 0.6 },
              B: { id: 'B', name: 'Wild Thistle', emoji: '🪻', distribution: 'clustered', trueCount: 40, size: 0.8 },
              C: { id: 'C', name: 'Sagebrush', emoji: '🌵', distribution: 'uniform', trueCount: 25, size: 1.0 } // 5x5 grid
            }
          },
          gradient: {
            id: 'gradient',
            name: 'Forest Edge (Ecotone)',
            desc: 'An environmental gradient. Shade on the left transitions to full sun on the right.',
            bg: 'gradient', 
            species: {
              A: { id: 'A', name: 'Shade Fern', emoji: '🌿', distribution: 'skew_left', trueCount: 100, size: 0.7 },
              B: { id: 'B', name: 'Edge Shrub', emoji: '🌳', distribution: 'center', trueCount: 20, size: 1.2 },
              C: { id: 'C', name: 'Sun Daisy', emoji: '🌻', distribution: 'skew_right', trueCount: 120, size: 0.6 }
            }
          },
          intertidal: {
            id: 'intertidal',
            name: 'Rocky Shore (Marine)',
            desc: 'Marine Zonation. Dry rocks on the top transition into deep tidal waters at the bottom.',
            bg: 'marine_gradient', 
            species: {
              A: { id: 'A', name: 'Ghost Crab', emoji: '🦀', distribution: 'random', trueCount: 25, size: 0.7 },
              B: { id: 'B', name: 'Barnacles', emoji: '🐚', distribution: 'skew_top', trueCount: 180, size: 0.4 },
              C: { id: 'C', name: 'Starfish', emoji: '🌟', distribution: 'skew_bottom', trueCount: 35, size: 0.8 }
            }
          }
        };

        const App = () => {
          // --- UI & Sampling State ---
          const [activeHabitat, setActiveHabitat] = useState('meadow');
          const [isManualMode, setIsManualMode] = useState(false);
          
          const [quadratSize, setQuadratSize] = useState(2); // 1, 2, 4 meters (side length)
          const [quadratCount, setQuadratCount] = useState(5); // 1 to 20
          
          const [sampled, setSampled] = useState(false);
          const [showTruePop, setShowTruePop] = useState(false); // God Mode
          
          // --- Simulation State ---
          const [plants, setPlants] = useState([]);
          const [quadrats, setQuadrats] = useState([]);
          const [results, setResults] = useState({});
          
          const canvasRef = useRef(null);

          // --- Field Generation (Ecology Model) ---
          const generateField = useCallback(() => {
            const newPlants = [];
            const profile = HABITAT_PROFILES[activeHabitat];
            
            Object.values(profile.species).forEach(sp => {
              if (sp.distribution === 'uniform') {
                // Grid-like with slight random jitter (simulating competition/territory)
                const gridSize = Math.ceil(Math.sqrt(sp.trueCount));
                const spacing = FIELD_SIZE_M / gridSize;
                
                let count = 0;
                for (let row = 0; row < gridSize; row++) {
                  for (let col = 0; col < gridSize; col++) {
                    if (count >= sp.trueCount) break;
                    const jitterX = (Math.random() - 0.5) * (spacing * 0.4);
                    const jitterY = (Math.random() - 0.5) * (spacing * 0.4);
                    newPlants.push({
                      x: Math.max(0, Math.min(FIELD_SIZE_M, col * spacing + spacing/2 + jitterX)),
                      y: Math.max(0, Math.min(FIELD_SIZE_M, row * spacing + spacing/2 + jitterY)),
                      speciesId: sp.id, emoji: sp.emoji, size: sp.size
                    });
                    count++;
                  }
                }
              } else {
                for (let i = 0; i < sp.trueCount; i++) {
                  let px = 0; let py = 0;

                  if (sp.distribution === 'random') {
                    px = Math.random() * FIELD_SIZE_M;
                    py = Math.random() * FIELD_SIZE_M;
                  } else if (sp.distribution === 'clustered') {
                    const numClusters = 5;
                    const clusterId = i % numClusters;
                    const cx = ((clusterId * 7 + 13) % 16) + 2;
                    const cy = ((clusterId * 11 + 5) % 16) + 2;
                    const offsetX = (Math.random() + Math.random() + Math.random() - 1.5) * 3;
                    const offsetY = (Math.random() + Math.random() + Math.random() - 1.5) * 3;
                    px = Math.max(0, Math.min(FIELD_SIZE_M, cx + offsetX));
                    py = Math.max(0, Math.min(FIELD_SIZE_M, cy + offsetY));
                  } else if (sp.distribution === 'skew_left') {
                    px = (Math.random() * Math.random() * Math.random()) * FIELD_SIZE_M;
                    py = Math.random() * FIELD_SIZE_M;
                  } else if (sp.distribution === 'skew_right') {
                    px = (1.0 - (Math.random() * Math.random() * Math.random())) * FIELD_SIZE_M;
                    py = Math.random() * FIELD_SIZE_M;
                  } else if (sp.distribution === 'skew_top') {
                    px = Math.random() * FIELD_SIZE_M;
                    py = (Math.random() * Math.random() * Math.random()) * FIELD_SIZE_M;
                  } else if (sp.distribution === 'skew_bottom') {
                    px = Math.random() * FIELD_SIZE_M;
                    py = (1.0 - (Math.random() * Math.random() * Math.random())) * FIELD_SIZE_M;
                  } else if (sp.distribution === 'center') {
                    px = ((Math.random() + Math.random() + Math.random() + Math.random()) / 4) * FIELD_SIZE_M;
                    py = Math.random() * FIELD_SIZE_M;
                  }
                  
                  newPlants.push({
                    x: px, y: py,
                    speciesId: sp.id, emoji: sp.emoji, size: sp.size
                  });
                }
              }
            });
            
            setPlants(newPlants);
            setQuadrats([]);
            setSampled(false);
            setShowTruePop(false);
            setResults({});
          }, [activeHabitat]);

          useEffect(() => {
            generateField();
          }, [generateField]);

          // --- Auto-Sampling Logic ---
          const conductAutoSampling = () => {
            const newQuadrats = [];
            const maxPos = FIELD_SIZE_M - quadratSize;
            
            for (let i = 0; i < quadratCount; i++) {
              newQuadrats.push({
                id: i + 1,
                x: Math.random() * maxPos,
                y: Math.random() * maxPos,
                size: quadratSize
              });
            }
            
            setQuadrats(newQuadrats);
            calculateResults(newQuadrats);
          };

          // --- Manual Quadrat Drop ---
          const handleCanvasClick = (e) => {
            if (!isManualMode) return;
            
            const rect = canvasRef.current.getBoundingClientRect();
            const scale = FIELD_SIZE_M / rect.width;
            const clickX = (e.clientX - rect.left) * scale;
            const clickY = (e.clientY - rect.top) * scale;
            
            // Center the quadrat on the click, bounded by field edges
            let qx = clickX - quadratSize / 2;
            let qy = clickY - quadratSize / 2;
            qx = Math.max(0, Math.min(FIELD_SIZE_M - quadratSize, qx));
            qy = Math.max(0, Math.min(FIELD_SIZE_M - quadratSize, qy));

            const newQuadrats = [...quadrats, { id: quadrats.length + 1, x: qx, y: qy, size: quadratSize }];
            setQuadrats(newQuadrats);
            calculateResults(newQuadrats);
          };

          const clearManualQuadrats = () => {
            setQuadrats([]);
            calculateResults([]);
          };

          // --- Math & Extrapolation Engine ---
          const calculateResults = (currentQuadrats) => {
            if (currentQuadrats.length === 0) {
              setSampled(false);
              setResults({});
              return;
            }

            const areaOfOne = quadratSize * quadratSize;
            const totalAreaSampled = currentQuadrats.length * areaOfOne;
            const profile = HABITAT_PROFILES[activeHabitat];
            
            const counts = { A: 0, B: 0, C: 0 };
            
            plants.forEach(plant => {
              const inQuadrat = currentQuadrats.some(q => 
                plant.x >= q.x && plant.x <= q.x + q.size &&
                plant.y >= q.y && plant.y <= q.y + q.size
              );
              if (inQuadrat) counts[plant.speciesId]++;
            });

            const newResults = {};
            Object.keys(profile.species).forEach(key => {
              const sp = profile.species[key];
              const density = counts[key] / totalAreaSampled;
              const estimate = Math.round(density * FIELD_AREA);
              const actual = sp.trueCount;
              const error = Math.abs(estimate - actual) / actual * 100;
              
              newResults[key] = {
                sampledCount: counts[key],
                density: density,
                estimate: estimate,
                actual: actual,
                error: error
              };
            });
            
            setResults({
              ...newResults,
              totalAreaSampled,
              percentCovered: (totalAreaSampled / FIELD_AREA) * 100,
              totalCounted: Object.values(counts).reduce((a, b) => a + b, 0)
            });
            
            setSampled(true);
          };

          // --- Canvas Rendering ---
          useEffect(() => {
            const canvas = canvasRef.current;
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            
            const scale = width / FIELD_SIZE_M; 
            const profile = HABITAT_PROFILES[activeHabitat];

            // 1. Draw Field Background
            if (profile.bg === 'gradient') {
              const grad = ctx.createLinearGradient(0, 0, width, 0);
              grad.addColorStop(0, '#022C22'); // Dark Shade
              grad.addColorStop(0.4, '#064E3B'); // Mid Forest
              grad.addColorStop(0.7, '#65A30D'); // Light Edge
              grad.addColorStop(1, '#84CC16'); // Bright Meadow
              ctx.fillStyle = grad;
            } else if (profile.bg === 'marine_gradient') {
              const grad = ctx.createLinearGradient(0, 0, 0, height);
              grad.addColorStop(0, '#A8A29E'); // Dry Rock 
              grad.addColorStop(0.3, '#57534E'); // Wet Rock 
              grad.addColorStop(0.6, '#0284C7'); // Shallow Water 
              grad.addColorStop(1, '#1E3A8A'); // Deep Water 
              ctx.fillStyle = grad;
            } else {
              ctx.fillStyle = profile.bg;
            }
            ctx.fillRect(0, 0, width, height);

            // Subtle 1m Grid
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)'; 
            ctx.lineWidth = 1;
            for(let i = 0; i <= FIELD_SIZE_M; i++) {
              ctx.beginPath();
              ctx.moveTo(i * scale, 0); ctx.lineTo(i * scale, height);
              ctx.moveTo(0, i * scale); ctx.lineTo(width, i * scale);
              ctx.stroke();
            }

            // 2. Draw Plants
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            plants.forEach(p => {
              let isCounted = false;
              if (quadrats.length > 0) {
                isCounted = quadrats.some(q => 
                  p.x >= q.x && p.x <= q.x + q.size &&
                  p.y >= q.y && p.y <= q.y + q.size
                );
              }

              const px = p.x * scale;
              const py = p.y * scale;
              // Fixed scaling to prevent massive overlaps: font size matches real-world meter bounds
              const fontSize = Math.max(12, p.size * scale);

              ctx.font = `${fontSize}px Inter`;
              
              if (sampled && quadrats.length > 0) {
                if (isCounted) {
                  ctx.shadowColor = '#FFFFFF';
                  ctx.shadowBlur = 10;
                  ctx.globalAlpha = 1.0;
                  ctx.fillText(p.emoji, px, py);
                  ctx.shadowBlur = 0; 
                } else {
                  ctx.globalAlpha = 0.2;
                  ctx.fillText(p.emoji, px, py);
                  ctx.globalAlpha = 1.0;
                }
              } else {
                ctx.globalAlpha = 1.0;
                ctx.fillText(p.emoji, px, py);
              }
            });

            // 3. Draw Quadrats (Point-Intercept Frame Style)
            quadrats.forEach(q => {
              const px = q.x * scale;
              const py = q.y * scale;
              const pSize = q.size * scale;
              
              // Semi-transparent background
              ctx.fillStyle = 'rgba(56, 189, 248, 0.15)'; 
              ctx.fillRect(px, py, pSize, pSize);
              
              // Outer border
              ctx.strokeStyle = '#38BDF8'; // Sky 400
              ctx.lineWidth = 3;
              ctx.strokeRect(px, py, pSize, pSize);
              
              // Internal Grid Lines (Crosshairs)
              ctx.strokeStyle = 'rgba(56, 189, 248, 0.5)';
              ctx.lineWidth = 1;
              ctx.beginPath();
              const subDivisions = 4;
              const step = pSize / subDivisions;
              for (let i = 1; i < subDivisions; i++) {
                ctx.moveTo(px + (i * step), py);
                ctx.lineTo(px + (i * step), py + pSize);
                ctx.moveTo(px, py + (i * step));
                ctx.lineTo(px + pSize, py + (i * step));
              }
              ctx.stroke();

              // Label
              ctx.fillStyle = '#FFFFFF';
              ctx.font = 'bold 12px Inter';
              ctx.shadowBlur = 4;
              ctx.shadowColor = '#000000';
              ctx.textAlign = 'left';
              ctx.fillText(`Q${q.id}`, px + 5, py + 15);
              ctx.shadowBlur = 0;
            });

          }, [plants, quadrats, sampled, activeHabitat]);

          const activeProfile = HABITAT_PROFILES[activeHabitat];

          return (
            <div className="flex flex-col h-screen max-h-[1000px] min-h-[750px] bg-[#020617] text-slate-100 font-sans overflow-hidden p-2 md:p-4">
              
              {/* Main Container */}
              <div className="w-full h-full max-w-[1400px] mx-auto flex flex-col gap-4 border border-slate-700 bg-[#0F172A] rounded-2xl overflow-hidden shadow-2xl">
                
                {/* Header */}
                <header className="flex items-center justify-between p-4 bg-slate-800 border-b border-slate-700 shadow-md z-10 shrink-0">
                  <div className="flex items-center gap-3">
                    <Icon name="LayoutGrid" className="text-sky-400 w-8 h-8" />
                    <div>
                      <h1 className="text-xl md:text-2xl font-black bg-clip-text text-transparent bg-gradient-to-r from-sky-400 to-blue-500 tracking-wide">
                        Quadrat Sampling Simulator
                      </h1>
                      <p className="text-[10px] text-slate-400 uppercase tracking-widest font-bold mt-0.5">Population Ecology & Density Estimation</p>
                    </div>
                  </div>

                  <div className="flex items-center bg-slate-900 px-4 py-2 rounded-xl border border-slate-700 shadow-inner">
                    <div className="text-[10px] text-slate-400 uppercase tracking-wider text-right mr-3 hidden sm:block">
                      Total Field<br/>Area
                    </div>
                    <div className="text-2xl font-black font-mono text-sky-300 drop-shadow-md">
                      400 <span className="text-sm">m²</span>
                    </div>
                  </div>
                </header>

                {/* Main Content Area */}
                <main className="flex-1 flex flex-col lg:flex-row relative min-h-0">
                  
                  {/* Left Sidebar: Controls & Data */}
                  <aside className="w-full lg:w-[400px] p-5 bg-slate-800/40 border-r border-slate-700 overflow-y-auto flex flex-col gap-5 z-10 shrink-0 custom-scrollbar">
                    
                    {/* Habitat & Mode Toggles */}
                    <div className="space-y-3">
                      <label className="text-[10px] text-slate-500 font-bold uppercase tracking-wider block border-b border-slate-700 pb-1">Environment Profile</label>
                      <div className="flex bg-slate-900 p-1 rounded-lg border border-slate-700 shadow-inner overflow-hidden">
                        <button onClick={() => setActiveHabitat('meadow')} className={`flex-1 py-2 rounded text-[9px] font-bold uppercase tracking-wider transition-colors ${activeHabitat === 'meadow' ? 'bg-sky-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}>
                           Meadow
                        </button>
                        <button onClick={() => setActiveHabitat('gradient')} className={`flex-1 py-2 rounded text-[9px] font-bold uppercase tracking-wider transition-colors ${activeHabitat === 'gradient' ? 'bg-sky-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}>
                           Ecotone
                        </button>
                        <button onClick={() => setActiveHabitat('intertidal')} className={`flex-1 py-2 rounded text-[9px] font-bold uppercase tracking-wider transition-colors ${activeHabitat === 'intertidal' ? 'bg-sky-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}>
                           Intertidal
                        </button>
                      </div>
                      <p className="text-[10px] text-slate-400 leading-tight bg-slate-900/50 p-2 rounded border border-slate-800 border-l-2 border-l-sky-500">{activeProfile.desc}</p>
                    </div>

                    {/* Interaction Mode */}
                    <div className="space-y-3 pt-2">
                      <label className="text-[10px] text-slate-500 font-bold uppercase tracking-wider block border-b border-slate-700 pb-1">Interaction Method</label>
                      <div className="flex bg-slate-900 p-1 rounded-lg border border-slate-700 shadow-inner">
                        <button onClick={() => { setIsManualMode(false); clearManualQuadrats(); }} className={`flex-1 py-2 flex items-center justify-center gap-1.5 rounded text-[10px] font-bold uppercase tracking-wider transition-colors ${!isManualMode ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}>
                           <Icon name="Calculator" className="w-3 h-3"/> Auto-Generate
                        </button>
                        <button onClick={() => { setIsManualMode(true); clearManualQuadrats(); }} className={`flex-1 py-2 flex items-center justify-center gap-1.5 rounded text-[10px] font-bold uppercase tracking-wider transition-colors ${isManualMode ? 'bg-amber-500 text-slate-900 shadow' : 'text-slate-400 hover:text-white'}`}>
                           <Icon name="MousePointer2" className="w-3 h-3"/> Manual Drop
                        </button>
                      </div>
                    </div>
                    
                    {/* Controls */}
                    <div>
                      <h2 className="text-sm font-bold uppercase tracking-widest mb-3 text-slate-400 flex items-center gap-2 border-b border-slate-700 pb-2 mt-4">
                        <Icon name="Grid" className="w-4 h-4 text-sky-400" />
                        Sampling Parameters
                      </h2>
                      
                      {!isManualMode ? (
                        <div className="space-y-5 bg-slate-900/80 p-4 rounded-xl border border-slate-700 shadow-inner">
                          {/* Quadrat Size */}
                          <div>
                            <label className="flex justify-between text-sm mb-2 text-slate-200 font-semibold">
                              <span>Quadrat Frame Size</span>
                              <span className="font-mono text-sky-400 bg-slate-950 px-2 py-0.5 rounded border border-slate-800">{quadratSize}x{quadratSize} m</span>
                            </label>
                            <input 
                              type="range" min="1" max="4" step="1"
                              value={quadratSize}
                              onChange={(e) => { setQuadratSize(parseInt(e.target.value)); setSampled(false); }}
                              className="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-sky-500"
                            />
                            <p className="text-[10px] text-slate-500 mt-2 text-right font-mono">Area: {quadratSize * quadratSize} m²</p>
                          </div>

                          {/* Quadrat Count */}
                          <div>
                            <label className="flex justify-between text-sm mb-2 text-slate-200 font-semibold">
                              <span>Number to Drop (N)</span>
                              <span className="font-mono text-sky-400 bg-slate-950 px-2 py-0.5 rounded border border-slate-800">{quadratCount}</span>
                            </label>
                            <input 
                              type="range" min="1" max="25" step="1"
                              value={quadratCount}
                              onChange={(e) => { setQuadratCount(parseInt(e.target.value)); setSampled(false); }}
                              className="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-sky-500"
                            />
                          </div>
                          
                          <button 
                            onClick={conductAutoSampling}
                            className="w-full py-3 bg-sky-600 hover:bg-sky-500 active:scale-95 text-white font-bold rounded-lg transition-all flex justify-center items-center gap-2 shadow-lg shadow-sky-900/50 border border-sky-400"
                          >
                            <Icon name="Calculator" className="w-4 h-4" /> Throw Quadrats & Calculate
                          </button>
                        </div>
                      ) : (
                        <div className="space-y-4 bg-amber-950/20 p-4 rounded-xl border border-amber-900/40 text-sm text-slate-300">
                          <h3 className="font-bold text-amber-400 mb-2 flex items-center gap-2"><Icon name="MousePointer2" className="w-4 h-4"/> Custom Survey Mode</h3>
                          <p className="text-[11px] leading-relaxed mb-4">
                            <strong>Click anywhere on the field</strong> to drop a quadrat. Try aiming only for thick clusters to see how <strong>Sampling Bias</strong> destroys the accuracy of your population estimate!
                          </p>
                          
                          <div>
                            <label className="flex justify-between text-xs mb-2 text-slate-200 font-semibold">
                              <span>Quadrat Frame Size</span>
                              <span className="font-mono text-amber-400">{quadratSize}x{quadratSize} m</span>
                            </label>
                            <input 
                              type="range" min="1" max="4" step="1"
                              value={quadratSize}
                              onChange={(e) => { setQuadratSize(parseInt(e.target.value)); }}
                              className="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-amber-500"
                            />
                          </div>

                          <button 
                            onClick={clearManualQuadrats}
                            className="w-full py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-lg transition-all border border-slate-600 text-xs mt-2"
                          >
                            Clear Placed Quadrats
                          </button>
                        </div>
                      )}
                    </div>

                    {/* Results Dashboard */}
                    {sampled && quadrats.length > 0 && results && Object.keys(results).length > 0 && (
                      <div className="animate-in fade-in slide-in-from-bottom-4 duration-500 flex-grow flex flex-col pb-6 pt-2">
                        <div className="flex justify-between items-center mb-3 border-b border-slate-700 pb-2">
                          <h2 className="text-sm font-bold uppercase tracking-widest text-slate-400 flex items-center gap-2">
                            <Icon name="BarChart2" className="w-4 h-4 text-emerald-400" />
                            Data Analysis
                          </h2>
                          
                          {/* God Mode Toggle */}
                          <button 
                            onClick={() => setShowTruePop(!showTruePop)}
                            className={`flex items-center gap-1.5 px-2.5 py-1.5 rounded text-[9px] font-bold uppercase tracking-wider transition-colors border ${showTruePop ? 'bg-rose-500/20 text-rose-400 border-rose-500/50 shadow-[0_0_10px_rgba(244,63,94,0.3)]' : 'bg-slate-800 text-slate-400 border-slate-600 hover:bg-slate-700 hover:text-white'}`}
                          >
                            {showTruePop ? <Icon name="EyeOff" className="w-3 h-3"/> : <Icon name="Eye" className="w-3 h-3"/>}
                            {showTruePop ? 'Hide Actual' : 'Reveal True Population'}
                          </button>
                        </div>
                        
                        {isManualMode && (activeHabitat === 'gradient' || activeHabitat === 'intertidal') && (
                          <div className="mb-3 p-2 bg-amber-950/30 border border-amber-900/50 rounded flex items-start gap-2 text-[9px] text-amber-300 font-bold">
                            <Icon name="Info" className="w-3 h-3 shrink-0 mt-0.5"/>
                            Warning: Extrapolating targeted manual samples across an environmental gradient will produce extreme Sampling Bias! Look at the individual belt breakdown below to see Zonation.
                          </div>
                        )}

                        <div className="bg-slate-900 rounded-xl border border-slate-700 overflow-hidden shadow-inner flex-grow flex flex-col">
                          
                          {/* Mathematical Formula Banner */}
                          <div className="p-3 bg-slate-950 border-b border-slate-800 flex flex-col items-center justify-center text-center">
                            <span className="text-[9px] text-slate-500 uppercase font-bold tracking-widest mb-1">
                              Sampled: {results.totalAreaSampled.toLocaleString()} m² ({results.percentCovered.toFixed(1)}%)
                            </span>
                            <div className="text-[11px] font-mono text-slate-300">
                              Estimate = <span className="text-sky-400">(Count / Area)</span> × 400 m²
                            </div>
                          </div>
                          
                          <div className="p-4 space-y-4 overflow-y-auto custom-scrollbar">
                            {Object.values(activeProfile.species).map(sp => {
                              const res = results[sp.id];
                              if(!res) return null;
                              return (
                                <div key={sp.id} className="space-y-2">
                                  <div className="flex justify-between items-center">
                                    <span className="text-sm font-bold flex items-center gap-2 text-slate-200">
                                      <span className="text-lg drop-shadow-md">{sp.emoji}</span>
                                      {sp.name}
                                    </span>
                                    
                                    {/* Only show error if God Mode is on */}
                                    {showTruePop && (
                                      <span className={`text-[10px] font-bold px-2 py-0.5 rounded border ${res.error < 15 ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30' : res.error < 40 ? 'bg-amber-500/20 text-amber-400 border-amber-500/30' : 'bg-rose-500/20 text-rose-400 border-rose-500/30'}`}>
                                        {res.error.toFixed(1)}% Error
                                      </span>
                                    )}
                                  </div>

                                  <div className="grid grid-cols-2 gap-2 text-xs">
                                    <div className="bg-slate-800 p-2 rounded-lg border border-slate-700 flex flex-col">
                                      <span className="text-[9px] text-slate-400 uppercase font-bold mb-0.5">Sampled Count</span>
                                      <div className="font-mono text-sky-400">
                                        <span className="text-lg font-bold">{res.sampledCount}</span> 
                                        <span className="text-[9px] ml-1">({res.density.toFixed(2)} /m²)</span>
                                      </div>
                                    </div>
                                    <div className="bg-slate-800 p-2 rounded-lg border border-slate-700 flex flex-col">
                                      <span className="text-[9px] text-slate-400 uppercase font-bold mb-0.5">Estimated Pop.</span>
                                      <span className="text-lg font-mono text-white font-bold">{res.estimate.toLocaleString()}</span>
                                    </div>
                                  </div>
                                  
                                  {/* Only show actual pop if God Mode is on */}
                                  {showTruePop && (
                                    <div className="bg-slate-950 p-2 rounded-lg border border-slate-800 flex justify-between items-center animate-in fade-in">
                                      <span className="text-[10px] text-slate-500 uppercase font-bold">True Population</span>
                                      <span className="font-mono text-slate-300 font-bold">{res.actual.toLocaleString()}</span>
                                    </div>
                                  )}
                                </div>
                              );
                            })}
                          </div>

                        </div>
                      </div>
                    )}

                  </aside>

                  {/* Right Area: Interactive Field Canvas */}
                  <div className="flex-1 relative flex flex-col p-4 bg-[#070B14]">
                    
                    <div className="flex justify-between items-center mb-3">
                      {/* Educational Legend */}
                      <div className="flex flex-wrap items-center gap-3 sm:gap-5 bg-slate-800/50 backdrop-blur-md px-4 py-2 rounded-xl border border-slate-700/50 text-slate-300 shadow-sm">
                        <span className="font-bold text-slate-400 flex items-center gap-1.5 uppercase tracking-widest text-[9px]">
                          <Icon name="Sprout" className="w-3.5 h-3.5 text-emerald-500/80"/> Legend
                        </span>
                        <div className="hidden sm:block w-px h-3 bg-slate-700/80"></div> {/* Divider */}
                        {Object.values(activeProfile.species).map(sp => (
                          <div key={sp.id} className="flex items-center gap-1.5 font-medium text-[11px]" title={`${sp.distribution} distribution`}>
                            <span className="text-sm drop-shadow-sm">{sp.emoji}</span>
                            <span className="text-slate-200">{sp.name}</span> 
                          </div>
                        ))}
                      </div>

                      <button 
                        onClick={generateField}
                        className="flex items-center gap-2 px-4 py-2 bg-slate-800/50 backdrop-blur-md hover:bg-slate-700 active:scale-95 text-slate-300 hover:text-white rounded-xl transition-all text-[10px] uppercase tracking-wider font-bold border border-slate-700/50 shadow-sm"
                      >
                        <Icon name="RefreshCw" className="w-3.5 h-3.5" /> <span className="hidden sm:inline">Scatter Populations</span><span className="sm:hidden">Scatter</span>
                      </button>
                    </div>

                    {/* Container for aspect-ratio locked canvas */}
                    <div 
                      className="flex-1 w-full bg-slate-900 rounded-xl border-2 border-slate-700 overflow-hidden relative shadow-2xl shadow-sky-900/10 flex items-center justify-center touch-none"
                      onClick={handleCanvasClick}
                    >
                      {/* Internal resolution maps perfectly to scaling logic */}
                      <canvas 
                        ref={canvasRef} 
                        width={800} 
                        height={800} 
                        className={`max-h-full max-w-full aspect-square object-contain shadow-[inset_0_0_50px_rgba(0,0,0,0.8)] ${isManualMode ? 'cursor-crosshair' : ''}`}
                      />
                      
                      {/* Empty State Overlay */}
                      {(!sampled || quadrats.length === 0) && (
                        <div className="absolute inset-0 flex items-center justify-center pointer-events-none bg-slate-950/50 backdrop-blur-sm">
                           <div className="bg-slate-800/90 p-6 rounded-2xl border border-slate-600 shadow-2xl flex flex-col items-center max-w-sm text-center">
                              <Icon name="Target" className="w-12 h-12 text-indigo-400 mb-3 animate-pulse" />
                              <h3 className="text-white font-black text-xl mb-2 tracking-wide">Ready to Sample</h3>
                              <p className="text-xs text-slate-300 leading-relaxed">
                                {isManualMode 
                                  ? "Click anywhere on the field to manually drop a quadrat frame." 
                                  : <>Adjust parameters on the left and click <strong className="text-indigo-400">Throw Quadrats</strong> to randomly sample the field.</>}
                              </p>
                           </div>
                        </div>
                      )}
                    </div>

                  </div>
                </main>
              </div>

            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
