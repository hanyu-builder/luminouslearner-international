<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Interactive Sustainable Fisheries Management Simulator. Learn Beverton-Holt population dynamics, harvest quotas, and mesh size regulations.">
    <title>Biology Virtual Labs - Sustainable Fisheries</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background-color: #020617; /* Slate 950 */
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            user-select: none;
        }
        
        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

        /* Custom Sliders */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
            width: 100%;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 18px; width: 18px;
            border-radius: 50%;
            background: currentColor;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            border: 2px solid #fff;
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:active { transform: scale(1.15); }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 6px;
            cursor: pointer; border-radius: 4px;
            background: #1e293b;
        }

        /* Swimming Animations for Ocean View */
        @keyframes swimRight {
            0% { transform: translateX(0) translateY(0) scaleX(1); opacity: 0; }
            10% { opacity: 1; }
            45% { transform: translateX(120px) translateY(-10px) scaleX(1); }
            50% { transform: translateX(120px) translateY(-10px) scaleX(-1); }
            90% { opacity: 1; }
            100% { transform: translateX(0) translateY(0) scaleX(-1); opacity: 0; }
        }
        
        @keyframes swimLeft {
            0% { transform: translateX(0) translateY(0) scaleX(-1); opacity: 0; }
            10% { opacity: 1; }
            45% { transform: translateX(-100px) translateY(15px) scaleX(-1); }
            50% { transform: translateX(-100px) translateY(15px) scaleX(1); }
            90% { opacity: 1; }
            100% { transform: translateX(0) translateY(0) scaleX(1); opacity: 0; }
        }

        .fish-right { animation: swimRight linear infinite; }
        .fish-left { animation: swimLeft linear infinite; }
        
        @keyframes bob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .animate-bob { animation: bob 4s ease-in-out infinite; }

        .glass-panel {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="h-screen w-screen flex justify-center items-center p-2 md:p-4">
    <div id="root" class="w-full h-full max-w-[1500px] max-h-[950px]"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- ICON WRAPPER COMPONENT ---
        const Icon = ({ name, className = "", size=20 }) => {
            const [svgHtml, setSvgHtml] = useState('');
            useEffect(() => {
                if (window.lucide && window.lucide.icons) {
                    const iconNode = window.lucide.icons[name];
                    if (iconNode) {
                        const svgElement = window.lucide.createElement(iconNode);
                        svgElement.setAttribute('class', className);
                        svgElement.setAttribute('width', size);
                        svgElement.setAttribute('height', size);
                        setSvgHtml(svgElement.outerHTML);
                    }
                }
            }, [name, className, size]);
            if (!svgHtml) return <span className={className} style={{ width: size, height: size, display: 'inline-block' }}></span>;
            return <span dangerouslySetInnerHTML={{ __html: svgHtml }} className={`inline-flex items-center justify-center ${className}`} />;
        };

        // --- SIMULATION CONSTANTS ---
        const SIM_YEARS = 20;
        const CARRYING_CAPACITY = 1000; // Max biomass
        const MSY_ESTIMATE = 180; // Rough estimate of Maximum Sustainable Yield

        const App = () => {
            // --- STATE ---
            const [isPlaying, setIsPlaying] = useState(false);
            const [year, setYear] = useState(0);
            
            // Management Controls
            const [quota, setQuota] = useState(150); // Target catch in tons
            const [meshSize, setMeshSize] = useState('large'); // 'large' or 'small'

            // --- DETERMINISTIC BEVERTON-HOLT MODEL ---
            // Pre-calculate the entire 20-year timeline whenever inputs change.
            const timeline = useMemo(() => {
                const data = [];
                // Initial Population (Tons)
                let currAdults = 600; 
                let currJuv = 200;

                data.push({
                    year: 0,
                    adults: currAdults,
                    juv: currJuv,
                    totalBiomass: currAdults + currJuv,
                    catch: 0,
                    status: 'Healthy',
                    warning: null
                });

                for (let y = 1; y <= SIM_YEARS; y++) {
                    let catchAdults = 0;
                    let catchJuv = 0;
                    let warning = null;

                    // 1. Harvesting Logic
                    if (meshSize === 'large') {
                        // Large mesh allows juveniles to escape. Only adults are caught.
                        catchAdults = Math.min(quota, currAdults);
                    } else {
                        // Small mesh catches both indiscriminately based on their proportion in the water.
                        const totalFish = currAdults + currJuv;
                        if (totalFish > 0) {
                            const actualCatch = Math.min(quota, totalFish);
                            catchAdults = actualCatch * (currAdults / totalFish);
                            catchJuv = actualCatch * (currJuv / totalFish);
                            if (actualCatch > 50) warning = 'Growth Overfishing (Juveniles Killed)';
                        }
                    }

                    // Apply Catch
                    let survAdults = Math.max(0, currAdults - catchAdults);
                    let survJuv = Math.max(0, currJuv - catchJuv);

                    // 2. Population Dynamics (Survival & Maturation)
                    // Natural Mortality: 70% of adults survive. 85% of surviving juveniles become adults.
                    const nextAdults = (survAdults * 0.70) + (survJuv * 0.85);

                    // 3. Reproduction (Beverton-Holt Equation)
                    // R = (r * S) / (1 + ((r-1)/K) * S)
                    const maxGrowthRate = 2.4; 
                    let nextJuv = (maxGrowthRate * survAdults) / (1 + ((maxGrowthRate - 1) / CARRYING_CAPACITY) * survAdults);

                    // Population Collapse Check (Allee Effect / Minimum Viable Population)
                    if (nextAdults + nextJuv < 15) {
                        currAdults = 0;
                        currJuv = 0;
                    } else {
                        currAdults = nextAdults;
                        currJuv = nextJuv;
                    }

                    const totalBiomass = currAdults + currJuv;
                    
                    // Determine Ecological Status
                    let status = 'Sustainable';
                    if (totalBiomass === 0) {
                        status = 'Collapsed';
                        warning = 'Complete Ecosystem Collapse';
                    } else if (totalBiomass < 300) {
                        status = 'Critically Low';
                        if (!warning) warning = 'Recruitment Overfishing (Breeding Stock Depleted)';
                    } else if (totalBiomass < 600) {
                        status = 'Declining';
                    }

                    data.push({
                        year: y,
                        adults: currAdults,
                        juv: currJuv,
                        totalBiomass: totalBiomass,
                        catch: catchAdults + catchJuv,
                        status: status,
                        warning: warning
                    });
                }
                return data;
            }, [quota, meshSize]);

            const currentState = timeline[year];

            // --- PLAYBACK LOOP ---
            useEffect(() => {
                let interval;
                if (isPlaying) {
                    interval = setInterval(() => {
                        setYear(prev => {
                            if (prev >= SIM_YEARS) {
                                setIsPlaying(false);
                                return prev;
                            }
                            return prev + 1;
                        });
                    }, 500); // Half second per year
                }
                return () => clearInterval(interval);
            }, [isPlaying]);

            // --- HELPERS ---
            const handleReset = () => {
                setYear(0);
                setIsPlaying(false);
            };

            const setYearWithPause = (val) => {
                setYear(val);
                setIsPlaying(false);
            };

            // --- SVG CHART COMPONENT ---
            const TimelineChart = () => {
                const width = 800;
                const height = 280;
                const padX = 50;
                const padY = 30;

                const maxBiomass = Math.max(CARRYING_CAPACITY * 1.1, ...timeline.map(d => d.totalBiomass));
                
                // Map data to coordinates
                const getX = (y) => padX + (y / SIM_YEARS) * (width - padX * 2);
                const getY = (val) => height - padY - (val / maxBiomass) * (height - padY * 2);

                const biomassPath = timeline.map((d, i) => `${i === 0 ? 'M' : 'L'} ${getX(d.year)} ${getY(d.totalBiomass)}`).join(' ');
                const catchPath = timeline.map((d, i) => `${i === 0 ? 'M' : 'L'} ${getX(d.year)} ${getY(d.catch)}`).join(' ');
                
                // Fill polygon for area under the curve
                const biomassArea = `${biomassPath} L ${getX(SIM_YEARS)} ${height - padY} L ${getX(0)} ${height - padY} Z`;

                const capacityY = getY(CARRYING_CAPACITY);
                const msyY = getY(MSY_ESTIMATE);
                const currX = getX(year);

                return (
                    <div className="w-full glass-panel rounded-2xl border border-slate-700/50 p-4 shadow-xl relative flex-1 flex flex-col min-h-[300px]">
                        <div className="flex justify-between items-center mb-2 z-10 relative">
                            <h3 className="text-xs font-bold text-slate-300 uppercase tracking-widest flex items-center gap-2">
                                <Icon name="LineChart" className="text-sky-400" size={16}/> 20-Year Population Projection
                            </h3>
                            
                            {/* Legend */}
                            <div className="flex justify-center gap-5 text-[10px] font-bold uppercase tracking-wider bg-slate-900/50 px-3 py-1.5 rounded-lg border border-slate-700">
                                <div className="flex items-center gap-2 text-sky-400">
                                    <span className="w-3 h-3 bg-sky-500/20 border border-sky-400 rounded-sm"></span> Total Biomass
                                </div>
                                <div className="flex items-center gap-2 text-amber-400">
                                    <span className="w-4 h-0.5 bg-amber-400 rounded"></span> Annual Catch
                                </div>
                            </div>
                        </div>

                        <div className="flex-1 relative w-full h-full">
                            <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-full absolute inset-0 overflow-visible">
                                <defs>
                                    <linearGradient id="biomassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                                        <stop offset="0%" stopColor="#38bdf8" stopOpacity="0.4" />
                                        <stop offset="100%" stopColor="#38bdf8" stopOpacity="0.0" />
                                    </linearGradient>
                                </defs>

                                {/* Background Grid */}
                                {[0, 0.25, 0.5, 0.75, 1].map(tick => {
                                    const y = getY(maxBiomass * tick);
                                    return (
                                        <g key={`grid-${tick}`}>
                                            <line x1={padX} y1={y} x2={width - padX} y2={y} stroke="#334155" strokeWidth="1" strokeDasharray="2 4" />
                                            <text x={padX - 10} y={y + 3} fill="#64748b" fontSize="10" textAnchor="end" className="font-mono">{Math.round(maxBiomass * tick)}t</text>
                                        </g>
                                    );
                                })}

                                {/* X-Axis Labels */}
                                {[0, 5, 10, 15, 20].map(yr => (
                                    <text key={`x-${yr}`} x={getX(yr)} y={height - padY + 15} fill="#64748b" fontSize="10" textAnchor="middle" className="font-mono">Yr {yr}</text>
                                ))}

                                {/* Carrying Capacity Line */}
                                <line x1={padX} y1={capacityY} x2={width - padX} y2={capacityY} stroke="#10b981" strokeWidth="2" strokeDasharray="6 4" opacity="0.6" />
                                <text x={width - padX} y={capacityY - 8} fill="#10b981" fontSize="10" textAnchor="end" fontWeight="bold">Carrying Capacity (K)</text>

                                {/* Danger Zone / MSY Area */}
                                <rect x={padX} y={msyY} width={width - padX * 2} height={height - padY - msyY} fill="#ef4444" opacity="0.05" />
                                <line x1={padX} y1={msyY} x2={width - padX} y2={msyY} stroke="#ef4444" strokeWidth="1" strokeDasharray="4 4" opacity="0.6" />
                                <text x={width - padX} y={msyY - 5} fill="#ef4444" fontSize="9" textAnchor="end">Danger Zone (&lt; MSY)</text>

                                {/* Data Paths */}
                                <path d={biomassArea} fill="url(#biomassGrad)" />
                                <path d={biomassPath} fill="none" stroke="#38bdf8" strokeWidth="3" style={{ filter: 'drop-shadow(0 0 4px rgba(56,189,248,0.5))' }} />
                                <path d={catchPath} fill="none" stroke="#fbbf24" strokeWidth="2" strokeDasharray="4 4" />

                                {/* Interactive Scrubber Background (Clickable Area) */}
                                <rect x={padX} y={0} width={width - padX*2} height={height} fill="transparent" cursor="pointer"
                                    onClick={(e) => {
                                        const rect = e.target.getBoundingClientRect();
                                        const ratio = (e.clientX - rect.left) / rect.width;
                                        const targetYear = Math.max(0, Math.min(SIM_YEARS, Math.round(ratio * SIM_YEARS)));
                                        setYearWithPause(targetYear);
                                    }}
                                />

                                {/* Current Year Scrubber */}
                                <line x1={currX} y1={padY - 10} x2={currX} y2={height - padY} stroke="#f8fafc" strokeWidth="1.5" />
                                
                                {/* Points on Scrubber */}
                                <circle cx={currX} cy={getY(currentState.totalBiomass)} r="5" fill="#0f172a" stroke="#38bdf8" strokeWidth="2" />
                                <circle cx={currX} cy={getY(currentState.catch)} r="4" fill="#0f172a" stroke="#fbbf24" strokeWidth="2" />

                                {/* Floating Tooltip */}
                                <g transform={`translate(${currX < width/2 ? currX + 15 : currX - 110}, ${padY})`}>
                                    <rect x="0" y="0" width="95" height="45" rx="4" fill="rgba(15, 23, 42, 0.9)" stroke="#475569" strokeWidth="1" />
                                    <text x="8" y="15" fill="#fff" fontSize="10" fontWeight="bold">Year {year}</text>
                                    <text x="8" y="28" fill="#38bdf8" fontSize="9">Bio: {Math.round(currentState.totalBiomass)}t</text>
                                    <text x="8" y="39" fill="#fbbf24" fontSize="9">Catch: {Math.round(currentState.catch)}t</text>
                                </g>
                            </svg>
                        </div>
                    </div>
                );
            };

            return (
                <div className="w-full h-full flex flex-col bg-slate-900 rounded-2xl overflow-hidden shadow-2xl border border-slate-700">
                    
                    {/* HEADER */}
                    <header className="h-16 md:h-20 border-b border-slate-700/80 flex items-center justify-between px-4 md:px-6 bg-slate-800/80 backdrop-blur-md shrink-0 shadow-sm z-20">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded-xl bg-sky-500/20 flex items-center justify-center border border-sky-400/50 shadow-lg">
                                <Icon name="Ship" className="text-sky-400" size={24}/>
                            </div>
                            <div>
                                <h1 className="text-xl md:text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-indigo-400 tracking-tight">
                                    Sustainable Fisheries
                                </h1>
                                <p className="text-[9px] md:text-xs text-slate-400 font-bold uppercase tracking-widest mt-0.5">Management & Population Modeling</p>
                            </div>
                        </div>
                        
                        <div className="flex items-center gap-3 md:gap-5 bg-slate-900 p-2 rounded-xl border border-slate-700 shadow-inner">
                            <div className="font-mono text-lg md:text-xl font-black text-white px-3 flex flex-col items-center">
                                <span className="text-[8px] text-slate-500 uppercase tracking-widest mb-0.5">Timeline</span>
                                YEAR {year.toString().padStart(2, '0')}
                            </div>
                            <div className="h-8 w-px bg-slate-700 hidden md:block"></div>
                            <div className="flex gap-2">
                                <button 
                                    onClick={() => isPlaying ? setIsPlaying(false) : setIsPlaying(true)}
                                    className={`w-10 h-10 md:w-auto md:px-5 md:py-2 rounded-lg text-sm font-bold flex items-center justify-center gap-2 transition-all shadow-md ${
                                        isPlaying ? 'bg-amber-500 hover:bg-amber-400 text-slate-900' : 'bg-emerald-600 hover:bg-emerald-500 text-white border border-emerald-500'
                                    }`}
                                    title={isPlaying ? "Pause" : "Play Simulation"}
                                >
                                    {isPlaying ? <><Icon name="Pause" size={16}/><span className="hidden md:inline">Pause</span></> : <><Icon name="Play" size={16}/><span className="hidden md:inline">Run Simulation</span></>}
                                </button>
                                <button 
                                    onClick={handleReset}
                                    className="w-10 h-10 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition-colors border border-slate-600 flex items-center justify-center"
                                    title="Reset Timeline"
                                >
                                    <Icon name="RotateCcw" size={16}/>
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* MAIN CONTENT */}
                    <main className="flex-1 flex flex-col lg:flex-row relative z-0 overflow-hidden">
                        
                        {/* LEFT PANEL: CONTROLS & DIAGNOSTICS */}
                        <aside className="w-full lg:w-[420px] flex flex-col gap-5 shrink-0 bg-slate-800/30 border-r border-slate-700/80 p-5 overflow-y-auto custom-scrollbar z-10">
                            
                            {/* Policy Controls */}
                            <div className="glass-panel p-5 rounded-2xl border border-slate-700 shadow-lg flex flex-col gap-6">
                                <h2 className="text-sm font-bold text-slate-200 uppercase tracking-wider flex items-center gap-2 border-b border-slate-700 pb-2">
                                    <Icon name="Settings2" className="text-amber-400" size={18}/> Fishery Policies
                                </h2>

                                {/* Quota Slider */}
                                <div className="bg-slate-900/50 p-4 rounded-xl border border-slate-700 shadow-inner">
                                    <div className="flex justify-between items-end mb-3">
                                        <div>
                                            <label className="text-sm font-black text-amber-400 block">Harvest Quota</label>
                                            <span className="text-[10px] text-slate-400 font-semibold uppercase tracking-widest">(Target catch per year)</span>
                                        </div>
                                        <span className="text-sm font-black font-mono text-white bg-slate-950 px-2 py-1 rounded border border-slate-700">{quota} <span className="text-xs text-slate-400">tons</span></span>
                                    </div>
                                    <input 
                                        type="range" min="0" max="600" step="10"
                                        value={quota} onChange={(e) => { setQuota(parseInt(e.target.value)); setIsPlaying(false); }}
                                        className="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-amber-500"
                                    />
                                    <div className="flex justify-between mt-1 text-[9px] text-slate-500 font-bold uppercase">
                                        <span>0</span><span>MSY (~180)</span><span>Max (600)</span>
                                    </div>
                                </div>

                                {/* Mesh Size Toggle */}
                                <div className="bg-slate-900/50 p-4 rounded-xl border border-slate-700 shadow-inner">
                                    <label className="text-sm font-black text-sky-400 block mb-1">Net Mesh Size</label>
                                    <span className="text-[10px] text-slate-400 font-semibold uppercase tracking-widest block mb-3">(Regulatory Gear)</span>
                                    
                                    <div className="flex gap-2">
                                        <button 
                                            onClick={() => { setMeshSize('large'); setIsPlaying(false); }}
                                            className={`flex-1 py-2.5 text-xs font-bold rounded-lg transition-all border flex flex-col items-center gap-1 ${
                                                meshSize === 'large' ? 'bg-sky-600 border-sky-400 text-white shadow-[0_0_15px_rgba(2,132,199,0.3)]' : 'bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-700'
                                            }`}
                                        >
                                            <Icon name="Maximize" size={16}/>
                                            Large (Adults Only)
                                        </button>
                                        <button 
                                            onClick={() => { setMeshSize('small'); setIsPlaying(false); }}
                                            className={`flex-1 py-2.5 text-xs font-bold rounded-lg transition-all border flex flex-col items-center gap-1 ${
                                                meshSize === 'small' ? 'bg-rose-600 border-rose-400 text-white shadow-[0_0_15px_rgba(225,29,72,0.3)]' : 'bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-700'
                                            }`}
                                        >
                                            <Icon name="Minimize" size={16}/>
                                            Small (All Ages)
                                        </button>
                                    </div>
                                    
                                    <div className="mt-3 p-2 bg-slate-950/50 border border-slate-800 rounded text-[10px] text-slate-400 leading-relaxed font-medium">
                                        {meshSize === 'large' 
                                            ? <span className="text-emerald-400"><i className="fa-solid fa-check-circle mr-1"></i> Sustainable Practice: Allows juveniles to escape and reach reproductive maturity before being caught.</span>
                                            : <span className="text-rose-400"><i className="fa-solid fa-triangle-exclamation mr-1"></i> High Risk Practice: Indiscriminate. Catches young fish before they can breed.</span>
                                        }
                                    </div>
                                </div>
                            </div>

                            {/* Diagnostics Dashboard */}
                            <div className="glass-panel p-5 rounded-2xl border border-slate-700 shadow-lg flex-1 flex flex-col relative overflow-hidden">
                                
                                <h2 className="text-sm font-bold text-slate-200 uppercase tracking-wider mb-3 flex items-center gap-2">
                                    <Icon name="ActivitySquare" className="text-emerald-400" size={18}/> Status: Year {year}
                                </h2>

                                {/* Ecological Warning Banner (Very important pedagogy) */}
                                {currentState.warning && (
                                    <div className="mb-4 bg-rose-950/40 border border-rose-500/50 p-3 rounded-xl flex items-start gap-3 animate-fade-in shadow-[0_0_15px_rgba(225,29,72,0.1)]">
                                        <Icon name="AlertTriangle" className="text-rose-500 shrink-0 mt-0.5" size={16} />
                                        <div>
                                            <h4 className="text-xs font-black text-rose-400 uppercase tracking-widest mb-1">Ecological Warning</h4>
                                            <p className="text-[11px] text-rose-300/80 font-medium leading-tight">{currentState.warning}</p>
                                        </div>
                                    </div>
                                )}

                                {/* Stock Status Indicator */}
                                <div className={`p-4 rounded-xl border flex items-center justify-between transition-colors duration-500 shadow-inner mb-4 ${
                                    currentState.status === 'Sustainable' ? 'bg-emerald-950/30 border-emerald-500/40 text-emerald-400' :
                                    currentState.status === 'Declining' ? 'bg-amber-950/30 border-amber-500/40 text-amber-400' :
                                    currentState.status === 'Critically Low' ? 'bg-orange-950/30 border-orange-500/40 text-orange-400' :
                                    'bg-red-950/40 border-red-500/50 text-red-400 animate-pulse'
                                }`}>
                                    <div className="flex flex-col">
                                        <span className="text-[10px] font-bold uppercase tracking-widest text-slate-400">Stock Viability</span>
                                        <span className="text-xl font-black uppercase tracking-wider">{currentState.status}</span>
                                    </div>
                                    {currentState.status === 'Sustainable' && <Icon name="TrendingUp" size={28}/>}
                                    {currentState.status === 'Declining' && <Icon name="TrendingDown" size={28}/>}
                                    {currentState.status === 'Critically Low' && <Icon name="AlertCircle" size={28}/>}
                                    {currentState.status === 'Collapsed' && <Icon name="Skull" size={28}/>}
                                </div>

                                {/* Numbers Breakdown */}
                                <div className="grid grid-cols-2 gap-3 mb-4">
                                    <div className="bg-slate-900 p-3 rounded-xl border border-slate-700/50 text-center shadow-inner flex flex-col justify-center">
                                        <span className="block text-[9px] font-bold text-slate-500 uppercase tracking-widest mb-1">Total Biomass</span>
                                        <span className="text-2xl font-black text-sky-400 font-mono">{Math.round(currentState.totalBiomass)}<span className="text-xs text-sky-600 ml-1">t</span></span>
                                    </div>
                                    <div className="bg-slate-900 p-3 rounded-xl border border-slate-700/50 text-center shadow-inner flex flex-col justify-center">
                                        <span className="block text-[9px] font-bold text-slate-500 uppercase tracking-widest mb-1">Actual Catch</span>
                                        <span className="text-2xl font-black text-amber-400 font-mono">{Math.round(currentState.catch)}<span className="text-xs text-amber-600 ml-1">t</span></span>
                                    </div>
                                </div>

                                {/* Demographics Bar */}
                                <div className="mt-auto">
                                    <div className="flex justify-between text-[10px] font-bold uppercase tracking-widest mb-1.5 px-1">
                                        <span className="text-indigo-400">Adults ({Math.round(currentState.adults)}t)</span>
                                        <span className="text-cyan-400">Juveniles ({Math.round(currentState.juv)}t)</span>
                                    </div>
                                    <div className="w-full h-3 bg-slate-900 rounded-full overflow-hidden flex border border-slate-700 shadow-inner">
                                        <div className="h-full bg-gradient-to-r from-indigo-600 to-indigo-400 transition-all duration-300" style={{ width: `${(currentState.adults / Math.max(1, currentState.totalBiomass)) * 100}%` }}></div>
                                        <div className="h-full bg-gradient-to-r from-cyan-400 to-cyan-300 transition-all duration-300" style={{ width: `${(currentState.juv / Math.max(1, currentState.totalBiomass)) * 100}%` }}></div>
                                    </div>
                                </div>

                            </div>
                        </aside>

                        {/* RIGHT PANEL: VISUALIZATIONS */}
                        <section className="flex-1 flex flex-col gap-4 p-4 lg:p-6 overflow-y-auto custom-scrollbar bg-[#0B1121]">
                            
                            <TimelineChart />

                            {/* Ocean Visualizer */}
                            <div className="w-full flex-1 min-h-[300px] bg-gradient-to-b from-sky-900 via-blue-950 to-[#020617] rounded-2xl border border-slate-700 relative shadow-inner overflow-hidden flex flex-col">
                                
                                {/* Water Surface */}
                                <div className="h-6 w-full bg-sky-400/20 backdrop-blur-sm border-b border-sky-300/30 relative">
                                    <div className="absolute top-[-10px] left-10 text-3xl animate-bob">⛵</div>
                                </div>

                                <div className="flex-1 relative">
                                    {/* Fishing Net Overlay (Visualizes mesh size) */}
                                    <svg className={`absolute inset-0 w-full h-full pointer-events-none transition-opacity duration-500 ${currentState.catch > 0 ? 'opacity-30' : 'opacity-0'}`}>
                                        <defs>
                                            <pattern id="netLarge" width="60" height="60" patternUnits="userSpaceOnUse">
                                                <path d="M 0 0 L 60 60 M 60 0 L 0 60" fill="none" stroke="#cbd5e1" strokeWidth="2" />
                                            </pattern>
                                            <pattern id="netSmall" width="20" height="20" patternUnits="userSpaceOnUse">
                                                <path d="M 0 0 L 20 20 M 20 0 L 0 20" fill="none" stroke="#cbd5e1" strokeWidth="1.5" />
                                            </pattern>
                                        </defs>
                                        <path 
                                            d="M 10% 0 C 10% 40%, 30% 90%, 50% 90% C 70% 90%, 90% 40%, 90% 0 Z" 
                                            fill={`url(#${meshSize === 'large' ? 'netLarge' : 'netSmall'})`} 
                                            stroke="#94a3b8" 
                                            strokeWidth="4" 
                                        />
                                    </svg>

                                    {/* Procedural Fish Renderer */}
                                    {/* Cap visual rendering for performance, but scale opacity/numbers based on population */}
                                    {Array.from({ length: Math.min(40, Math.ceil(currentState.adults / 25)) }).map((_, i) => (
                                        <div 
                                            key={`adult-${i}-${year}`} 
                                            className={`absolute text-3xl drop-shadow-lg ${i % 2 === 0 ? 'fish-right' : 'fish-left'}`}
                                            style={{ 
                                                top: `${10 + Math.random() * 70}%`, 
                                                left: `${20 + Math.random() * 60}%`,
                                                animationDuration: `${5 + Math.random() * 4}s`,
                                                animationDelay: `${-Math.random() * 5}s`,
                                                filter: `brightness(${0.8 + Math.random()*0.4})`
                                            }}
                                        >
                                            🐟
                                        </div>
                                    ))}
                                    
                                    {Array.from({ length: Math.min(50, Math.ceil(currentState.juv / 15)) }).map((_, i) => (
                                        <div 
                                            key={`juv-${i}-${year}`} 
                                            className={`absolute text-xl drop-shadow-md opacity-80 ${i % 2 === 0 ? 'fish-left' : 'fish-right'}`}
                                            style={{ 
                                                top: `${30 + Math.random() * 60}%`, 
                                                left: `${10 + Math.random() * 80}%`,
                                                animationDuration: `${4 + Math.random() * 3}s`,
                                                animationDelay: `${-Math.random() * 4}s`,
                                                filter: 'hue-rotate(160deg) saturate(1.5)' // Juveniles look cyan
                                            }}
                                        >
                                            🐟
                                        </div>
                                    ))}

                                    {/* Collapse Warning Overlay */}
                                    {currentState.status === 'Collapsed' && (
                                        <div className="absolute inset-0 bg-red-950/60 flex items-center justify-center backdrop-blur-sm z-20 transition-all duration-1000">
                                            <div className="bg-slate-900 p-8 rounded-2xl border-4 border-red-500 text-center shadow-[0_0_100px_rgba(239,68,68,0.5)] transform -rotate-3 scale-110">
                                                <h2 className="text-4xl font-black text-red-500 mb-2 tracking-widest uppercase">Ecosystem Collapse</h2>
                                                <p className="text-slate-300 font-medium">The population dropped below the minimum viable threshold.<br/>Extinction is irreversible.</p>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>

                        </section>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
