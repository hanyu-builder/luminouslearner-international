<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sustainable Fisheries Management</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React and ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for in-browser JSX transpilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#0F172A] text-slate-200 overflow-hidden m-0 p-0">
    <!-- React mounts here -->
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        /**
         * EXPERT EDUCATIONAL WEB DEVELOPER - SUSTAINABLE FISHERIES MANAGEMENT
         * Target: P4 to S3 Students (Ages 9-15)
         * Core Concept: Beverton-Holt population dynamic modeling & Harvest Quotas.
         * Primary SEO Keyword: Sustainable Fisheries Management
         */

        const SIM_YEARS = 20;
        const CARRYING_CAPACITY = 1000; // Max biomass
        
        function App() {
          // --- STATE ---
          const [isPlaying, setIsPlaying] = useState(false);
          const [year, setYear] = useState(0);
          
          // Controls
          const [quota, setQuota] = useState(150); // Target catch in tons
          const [meshSize, setMeshSize] = useState('large'); // 'large' (adults only) or 'small' (all ages)

          // --- DETERMINISTIC BEVERTON-HOLT MODEL ---
          // Pre-calculate the entire 20-year timeline whenever inputs change.
          const timeline = useMemo(() => {
            const data = [];
            // Initial Population (Tons)
            let currAdults = 600; 
            let currJuv = 200;

            data.push({
              year: 0,
              adults: currAdults,
              juv: currJuv,
              totalBiomass: currAdults + currJuv,
              catch: 0,
              status: 'Healthy'
            });

            for (let y = 1; y <= SIM_YEARS; y++) {
              let catchAdults = 0;
              let catchJuv = 0;

              // 1. Harvesting Logic
              if (meshSize === 'large') {
                // Large mesh allows juveniles to escape. Only adults are caught.
                catchAdults = Math.min(quota, currAdults);
              } else {
                // Small mesh catches both indiscriminately based on their proportion.
                const totalFish = currAdults + currJuv;
                if (totalFish > 0) {
                  const actualCatch = Math.min(quota, totalFish);
                  catchAdults = actualCatch * (currAdults / totalFish);
                  catchJuv = actualCatch * (currJuv / totalFish);
                }
              }

              // Apply Catch
              let survAdults = Math.max(0, currAdults - catchAdults);
              let survJuv = Math.max(0, currJuv - catchJuv);

              // 2. Population Dynamics (Survival & Maturation)
              // 70% of adults survive naturally. 90% of juveniles survive and become adults.
              const nextAdults = (survAdults * 0.7) + (survJuv * 0.9);

              // 3. Reproduction (Beverton-Holt Equation)
              // R = (r * S) / (1 + ((r-1)/K) * S)
              const maxGrowthRate = 2.5; 
              let nextJuv = (maxGrowthRate * survAdults) / (1 + ((maxGrowthRate - 1) / CARRYING_CAPACITY) * survAdults);

              // Population Collapse Check (Allee Effect / Minimum Viable Population)
              if (nextAdults + nextJuv < 10) {
                currAdults = 0;
                currJuv = 0;
              } else {
                currAdults = nextAdults;
                currJuv = nextJuv;
              }

              const totalBiomass = currAdults + currJuv;
              let status = 'Healthy';
              if (totalBiomass < 200) status = 'Collapsed';
              else if (totalBiomass < 500) status = 'Overfished';

              data.push({
                year: y,
                adults: currAdults,
                juv: currJuv,
                totalBiomass: totalBiomass,
                catch: catchAdults + catchJuv,
                status: status
              });
            }
            return data;
          }, [quota, meshSize]);

          const currentState = timeline[year];

          // --- PLAYBACK LOOP ---
          useEffect(() => {
            let interval;
            if (isPlaying) {
              interval = setInterval(() => {
                setYear(prev => {
                  if (prev >= SIM_YEARS) {
                    setIsPlaying(false);
                    return prev;
                  }
                  return prev + 1;
                });
              }, 500); // Half second per year
            }
            return () => clearInterval(interval);
          }, [isPlaying]);

          // --- HELPERS ---
          const handleReset = () => {
            setYear(0);
            setIsPlaying(false);
          };

          const handleInput = (setter) => (e) => {
            setter(e);
            if (year === SIM_YEARS) setYear(0); // Auto-reset if changing after a full run
          };

          // --- UI RENDERING ---
          const customCSS = `
            .custom-scrollbar::-webkit-scrollbar { width: 6px; }
            .custom-scrollbar::-webkit-scrollbar-track { background: #1e293b; border-radius: 4px; }
            .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
            
            @keyframes swim {
              0% { transform: translateX(0px) translateY(0px); }
              50% { transform: translateX(-10px) translateY(-5px); }
              100% { transform: translateX(0px) translateY(0px); }
            }
            .animate-swim { animation: swim 3s ease-in-out infinite; }
            .animate-swim-fast { animation: swim 2s ease-in-out infinite; }
          `;

          // --- SVG CHART COMPONENT ---
          const TimelineChart = () => {
            const width = 600;
            const height = 200;
            const padX = 40;
            const padY = 20;

            const maxBiomass = Math.max(CARRYING_CAPACITY * 1.1, ...timeline.map(d => d.totalBiomass));
            
            // Map data to coordinates
            const getX = (y) => padX + (y / SIM_YEARS) * (width - padX * 2);
            const getY = (val) => height - padY - (val / maxBiomass) * (height - padY * 2);

            const biomassPath = timeline.map((d, i) => `${i === 0 ? 'M' : 'L'} ${getX(d.year)} ${getY(d.totalBiomass)}`).join(' ');
            const catchPath = timeline.map((d, i) => `${i === 0 ? 'M' : 'L'} ${getX(d.year)} ${getY(d.catch)}`).join(' ');
            const capacityY = getY(CARRYING_CAPACITY);

            // Scrubber line
            const currX = getX(year);

            return (
              <div className="w-full bg-slate-900/60 rounded-xl border border-slate-700/50 p-4 shadow-inner relative">
                <div className="absolute top-2 left-4 text-xs font-bold text-slate-400 uppercase tracking-wider">
                  20-Year Population Projection
                </div>
                <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-full min-h-[200px]">
                  {/* Axes */}
                  <line x1={padX} y1={height - padY} x2={width - padX} y2={height - padY} stroke="#475569" strokeWidth="2" />
                  <line x1={padX} y1={padY} x2={padX} y2={height - padY} stroke="#475569" strokeWidth="2" />
                  
                  {/* Y-Axis Labels */}
                  <text x={padX - 5} y={padY + 5} fill="#64748b" fontSize="10" textAnchor="end">{Math.round(maxBiomass)}t</text>
                  <text x={padX - 5} y={height - padY} fill="#64748b" fontSize="10" textAnchor="end">0</text>
                  
                  {/* X-Axis Labels */}
                  <text x={width - padX} y={height - padY + 15} fill="#64748b" fontSize="10" textAnchor="end">Year 20</text>

                  {/* Carrying Capacity Line */}
                  <line x1={padX} y1={capacityY} x2={width - padX} y2={capacityY} stroke="#10b981" strokeDasharray="4 4" opacity="0.5" />
                  <text x={width - padX} y={capacityY - 5} fill="#10b981" fontSize="10" textAnchor="end" opacity="0.8">Carrying Capacity</text>

                  {/* Data Paths */}
                  <path d={biomassPath} fill="none" stroke="#38bdf8" strokeWidth="3" />
                  <path d={catchPath} fill="none" stroke="#fbbf24" strokeWidth="2" strokeDasharray="2 2" />

                  {/* Current Year Scrubber */}
                  <line x1={currX} y1={padY} x2={currX} y2={height - padY} stroke="#f8fafc" strokeWidth="1.5" />
                  <circle cx={currX} cy={getY(currentState.totalBiomass)} r="4" fill="#fff" stroke="#38bdf8" strokeWidth="2" />
                  <circle cx={currX} cy={getY(currentState.catch)} r="3" fill="#fff" stroke="#fbbf24" strokeWidth="2" />
                </svg>

                {/* Legend */}
                <div className="flex justify-center gap-6 mt-2 text-xs font-bold">
                  <div className="flex items-center gap-2 text-sky-400"><span className="w-4 h-1 bg-sky-400 rounded"></span> Total Biomass</div>
                  <div className="flex items-center gap-2 text-amber-400"><span className="w-4 h-0.5 bg-amber-400 rounded border-t border-dashed border-amber-400"></span> Actual Catch</div>
                </div>
              </div>
            );
          };

          return (
            <div className="bg-[#0F172A] min-h-screen max-h-[950px] w-full text-slate-200 flex flex-col font-sans overflow-hidden">
              <style>{customCSS}</style>

              {/* HEADER */}
              <header className="h-16 border-b border-slate-700/50 flex items-center justify-between px-6 bg-slate-800/30 shrink-0 shadow-sm">
                <div className="flex items-center gap-3">
                  <div className="w-8 h-8 rounded bg-sky-500/20 flex items-center justify-center border border-sky-400/50 shadow-lg">
                    <svg className="w-5 h-5 text-sky-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z" />
                    </svg>
                  </div>
                  <h1 className="text-xl font-bold text-white tracking-wide">Sustainable Fisheries <span className="text-sky-400 font-light">Management</span></h1>
                </div>
                
                <div className="flex items-center gap-4">
                  <div className="font-mono text-xl font-black text-white bg-slate-900 px-4 py-1.5 rounded-lg border border-slate-700">
                    YEAR {year.toString().padStart(2, '0')}
                  </div>
                  <button 
                    onClick={handleReset}
                    className="px-4 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-sm font-semibold transition-colors border border-slate-600"
                  >
                    Reset
                  </button>
                  <button 
                    onClick={() => setIsPlaying(!isPlaying)}
                    className={`px-6 py-2 rounded-full text-sm font-bold flex items-center gap-2 transition-all ${
                      isPlaying ? 'bg-amber-500/10 text-amber-500 border border-amber-500/50 hover:bg-amber-500/20' 
                                : 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/50 hover:bg-emerald-500/20 shadow-[0_0_15px_rgba(16,185,129,0.2)]'
                    }`}
                  >
                    {isPlaying ? '⏸ Pause Time' : '▶ Run Simulation'}
                  </button>
                </div>
              </header>

              {/* MAIN CONTENT */}
              <main className="flex-1 flex gap-6 p-6 overflow-hidden">
                
                {/* LEFT PANEL: DASHBOARD & CONTROLS */}
                <aside className="w-[380px] flex flex-col gap-5 shrink-0 overflow-y-auto custom-scrollbar pr-2">
                  
                  {/* Controls */}
                  <div className="bg-slate-800/60 p-5 rounded-2xl border border-slate-700/50 shadow-lg flex flex-col gap-6">
                    <h2 className="text-sm font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2 mb-2">
                      <svg className="w-4 h-4 text-orange-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" /></svg>
                      Fishery Policies
                    </h2>

                    {/* Quota Slider */}
                    <div className="bg-slate-900/50 p-4 rounded-xl border border-slate-700">
                      <div className="flex justify-between items-end mb-2">
                        <div>
                          <label className="text-sm font-semibold text-amber-400 block">Harvest Quota</label>
                          <span className="text-[10px] text-slate-400">(Target catch per year)</span>
                        </div>
                        <span className="text-sm font-bold text-white bg-slate-800 px-2 py-1 rounded border border-slate-600">{quota} tons</span>
                      </div>
                      <input 
                        type="range" min="0" max="600" step="10"
                        value={quota} onChange={handleInput((e) => setQuota(parseInt(e.target.value)))}
                        className="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-amber-500"
                      />
                    </div>

                    {/* Mesh Size Toggle */}
                    <div className="bg-slate-900/50 p-4 rounded-xl border border-slate-700">
                      <div>
                        <label className="text-sm font-semibold text-sky-400 block mb-2">Net Mesh Size (Regulation)</label>
                      </div>
                      <div className="flex gap-2">
                        <button 
                          onClick={handleInput(() => setMeshSize('large'))}
                          className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all ${
                            meshSize === 'large' ? 'bg-sky-600 text-white shadow-md' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'
                          }`}
                        >
                          Large (Adults Only)
                        </button>
                        <button 
                          onClick={handleInput(() => setMeshSize('small'))}
                          className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all ${
                            meshSize === 'small' ? 'bg-red-600 text-white shadow-md' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'
                          }`}
                        >
                          Small (All Ages)
                        </button>
                      </div>
                      <p className="text-[10px] text-slate-400 mt-2 leading-tight">
                        {meshSize === 'large' ? "Allows juveniles to escape and reproduce before being caught." : "Indiscriminate fishing. Catches young fish before they can breed (Growth Overfishing)."}
                      </p>
                    </div>
                  </div>

                  {/* Real-time Status Dashboard */}
                  <div className="bg-slate-800/60 p-5 rounded-2xl border border-slate-700/50 shadow-lg flex-1 flex flex-col gap-4">
                    <h2 className="text-sm font-bold text-slate-300 uppercase tracking-wider mb-2">Current Year Status</h2>

                    {/* Stock Status Indicator */}
                    <div className={`p-3 rounded-xl border font-bold flex items-center justify-between transition-colors duration-500 ${
                      currentState.status === 'Healthy' ? 'bg-emerald-900/30 border-emerald-500/50 text-emerald-400' :
                      currentState.status === 'Overfished' ? 'bg-amber-900/30 border-amber-500/50 text-amber-400' :
                      'bg-red-900/30 border-red-500/50 text-red-400 animate-pulse'
                    }`}>
                      <span className="text-sm">Stock Viability:</span>
                      <span className="text-lg uppercase tracking-wider">{currentState.status}</span>
                    </div>

                    <div className="grid grid-cols-2 gap-3 mt-2">
                      <div className="bg-slate-900/50 p-3 rounded-xl border border-slate-700/50 text-center">
                        <span className="block text-[10px] font-bold text-slate-500 uppercase">Total Biomass</span>
                        <span className="text-2xl font-black text-sky-400 font-mono">{Math.round(currentState.totalBiomass)}<span className="text-sm">t</span></span>
                      </div>
                      <div className="bg-slate-900/50 p-3 rounded-xl border border-slate-700/50 text-center">
                        <span className="block text-[10px] font-bold text-slate-500 uppercase">Actual Catch</span>
                        <span className="text-2xl font-black text-amber-400 font-mono">{Math.round(currentState.catch)}<span className="text-sm">t</span></span>
                      </div>
                    </div>

                    <div className="bg-slate-900/30 p-3 rounded-xl border border-slate-700/30 mt-auto">
                      <div className="flex justify-between text-xs mb-1">
                        <span className="text-indigo-300 font-bold">Adults: {Math.round(currentState.adults)}t</span>
                        <span className="text-cyan-300 font-bold">Juveniles: {Math.round(currentState.juv)}t</span>
                      </div>
                      <div className="w-full h-2 bg-slate-800 rounded-full overflow-hidden flex">
                        <div className="h-full bg-indigo-500" style={{ width: `${(currentState.adults / Math.max(1, currentState.totalBiomass)) * 100}%` }}></div>
                        <div className="h-full bg-cyan-500" style={{ width: `${(currentState.juv / Math.max(1, currentState.totalBiomass)) * 100}%` }}></div>
                      </div>
                    </div>
                  </div>
                </aside>

                {/* RIGHT PANEL: VISUALIZATION */}
                <section className="flex-1 flex flex-col gap-6">
                  
                  {/* Interactive Chart */}
                  <TimelineChart />

                  {/* Ocean Visualizer */}
                  <div className="flex-1 bg-gradient-to-b from-sky-800 to-indigo-950 rounded-3xl border-4 border-slate-800 relative shadow-2xl overflow-hidden">
                    
                    {/* Water Surface Line */}
                    <div className="absolute top-0 left-0 w-full h-4 bg-sky-400/20 backdrop-blur-sm border-b border-sky-300/30"></div>

                    {/* Fishing Net Overlay (Visualizes current catch effort & mesh size) */}
                    <svg className="absolute inset-0 w-full h-full pointer-events-none opacity-40">
                      <defs>
                        <pattern id="netLarge" width="40" height="40" patternUnits="userSpaceOnUse">
                          <path d="M 0 0 L 40 40 M 40 0 L 0 40" fill="none" stroke="#cbd5e1" strokeWidth="2" />
                        </pattern>
                        <pattern id="netSmall" width="15" height="15" patternUnits="userSpaceOnUse">
                          <path d="M 0 0 L 15 15 M 15 0 L 0 15" fill="none" stroke="#cbd5e1" strokeWidth="1.5" />
                        </pattern>
                      </defs>
                      {/* Only show net if catching */}
                      {currentState.catch > 0 && (
                        <path 
                          d="M 100 0 C 100 200, 300 400, 400 400 C 500 400, 700 200, 700 0 Z" 
                          fill={`url(#${meshSize === 'large' ? 'netLarge' : 'netSmall'})`} 
                          stroke="#94a3b8" 
                          strokeWidth="4" 
                          className="animate-pulse"
                        />
                      )}
                    </svg>

                    {/* Fish Icons Generator */}
                    {/* Max render capped for performance, visually representative */}
                    {Array.from({ length: Math.min(30, Math.ceil(currentState.adults / 20)) }).map((_, i) => (
                      <div 
                        key={`adult-${i}`} 
                        className="absolute text-3xl animate-swim"
                        style={{ 
                          top: `${20 + Math.random() * 60}%`, 
                          left: `${10 + Math.random() * 80}%`,
                          animationDelay: `${Math.random() * 2}s`
                        }}
                      >
                        🐟
                      </div>
                    ))}
                    
                    {Array.from({ length: Math.min(40, Math.ceil(currentState.juv / 10)) }).map((_, i) => (
                      <div 
                        key={`juv-${i}`} 
                        className="absolute text-xl animate-swim-fast opacity-80"
                        style={{ 
                          top: `${40 + Math.random() * 50}%`, 
                          left: `${5 + Math.random() * 90}%`,
                          animationDelay: `${Math.random() * 2}s`,
                          filter: 'hue-rotate(180deg)' // Make juveniles look slightly different
                        }}
                      >
                        🐟
                      </div>
                    ))}

                    {/* Collapse Warning Overlay */}
                    {currentState.status === 'Collapsed' && (
                      <div className="absolute inset-0 bg-red-900/60 flex items-center justify-center backdrop-blur-sm z-10">
                        <div className="bg-slate-900 p-6 rounded-2xl border-2 border-red-500 text-center shadow-[0_0_50px_rgba(239,68,68,0.4)] transform -rotate-3">
                          <h2 className="text-3xl font-black text-red-500 mb-2">STOCK COLLAPSE</h2>
                          <p className="text-slate-300">The population dropped below the minimum viable threshold.<br/>Reproduction has ceased.</p>
                        </div>
                      </div>
                    )}

                  </div>

                </section>
              </main>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
