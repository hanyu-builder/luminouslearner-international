<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Transect Sampling Simulator</title>
    <meta name="description" content="Interactive Transect Sampling & Zonation Analysis Simulator. Ecology and Population Statistics.">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background-color: #020617; /* Slate 950 */
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            user-select: none;
        }
        
        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useRef, useCallback } = React;

        // --- ICON WRAPPER COMPONENT ---
        // Maps the requested Lucide icons from the CDN so they work in standalone React
        const Icon = ({ name, className = "" }) => {
            const [svgHtml, setSvgHtml] = useState('');
            useEffect(() => {
                if (window.lucide && window.lucide.icons) {
                    const iconNode = window.lucide.icons[name];
                    if (iconNode) {
                        const svgElement = window.lucide.createElement(iconNode);
                        svgElement.setAttribute('class', className);
                        setSvgHtml(svgElement.outerHTML);
                    }
                }
            }, [name, className]);
            
            if (!svgHtml) return <span className={className}></span>;
            return <span dangerouslySetInnerHTML={{ __html: svgHtml }} className={`inline-flex items-center justify-center ${className}`} />;
        };

        /* SCIENTIFIC MODEL & CONCEPTS
          ---------------------------
          Topic: Transect Sampling & Zonation Analysis
          
          Math & Formulas:
          1. Area of one Belt Transect = Length * Width
          2. Species Density = Total Count Sampled / Total Area Sampled
          3. Estimated Total Population = Species Density * Total Field Area
          
          Ecological Distributions:
          - Random: Uniformly scattered.
          - Clustered: Grouped due to seed dispersal or localized resources.
          - Gradient (Zonation): Distribution strongly skewed by a changing abiotic factor.
        */

        // --- Engine & Field Constants ---
        const FIELD_SIZE_M = 100; // 100m x 100m field
        const FIELD_AREA = FIELD_SIZE_M * FIELD_SIZE_M; // 10,000 m^2
        const TRANSECT_WIDTH_M = 2; // 2 meter wide belt transect

        const HABITAT_PROFILES = {
          uniform: {
            id: 'uniform',
            name: 'Uniform Field',
            desc: 'A flat, homogeneous environment. Best for studying Random vs. Clustered dispersion.',
            bg: '#064E3B', // Solid Emerald 900
            species: {
              A: { id: 'A', name: 'Dandelion', emoji: '🌼', distribution: 'random', trueCount: 600, size: 1.2 },
              B: { id: 'B', name: 'Wild Thistle', emoji: '🪻', distribution: 'clustered', trueCount: 250, size: 1.4 },
              C: { id: 'C', name: 'Rare Orchid', emoji: '🌸', distribution: 'random', trueCount: 30, size: 1.1 }
            }
          },
          gradient: {
            id: 'gradient',
            name: 'Forest/Meadow Ecotone',
            desc: 'An Ecotone. A dense, shady forest on the left transitions into a sunny meadow on the right.',
            bg: 'gradient', 
            species: {
              A: { id: 'A', name: 'Shade Fern', emoji: '🌿', distribution: 'skew_left', trueCount: 450, size: 1.5 },
              B: { id: 'B', name: 'Edge Shrub', emoji: '🌳', distribution: 'center', trueCount: 120, size: 2.0 },
              C: { id: 'C', name: 'Sun Daisy', emoji: '🌻', distribution: 'skew_right', trueCount: 500, size: 1.2 }
            }
          },
          intertidal: {
            id: 'intertidal',
            name: 'Rocky Shore Intertidal',
            desc: 'Marine Zonation. Dry rocks on the left transition into deep tidal waters on the right.',
            bg: 'marine_gradient', 
            species: {
              A: { id: 'A', name: 'Barnacles', emoji: '🐚', distribution: 'skew_left', trueCount: 700, size: 1.0 },
              B: { id: 'B', name: 'Mussels', emoji: '🦪', distribution: 'center_cluster', trueCount: 350, size: 1.3 },
              C: { id: 'C', name: 'Sea Kelp', emoji: '🌿', distribution: 'skew_right', trueCount: 200, size: 1.8 }
            }
          }
        };

        const App = () => {
          // --- UI & Sampling State ---
          const [activeHabitat, setActiveHabitat] = useState('uniform');
          const [isManualMode, setIsManualMode] = useState(false);
          
          const [transectLength, setTransectLength] = useState(20); 
          const [transectCount, setTransectCount] = useState(5); 
          
          const [showTruePop, setShowTruePop] = useState(false); 
          const [sampled, setSampled] = useState(false);
          
          // --- Simulation State ---
          const [plants, setPlants] = useState([]);
          const [transects, setTransects] = useState([]);
          const [results, setResults] = useState({});
          
          // --- Manual Drag State ---
          const [dragStart, setDragStart] = useState(null);
          const [dragCurrent, setDragCurrent] = useState(null);

          const canvasRef = useRef(null);

          // --- Field Generation (Ecology Model) ---
          const generateField = useCallback(() => {
            const newPlants = [];
            const profile = HABITAT_PROFILES[activeHabitat];
            
            Object.values(profile.species).forEach(sp => {
              for (let i = 0; i < sp.trueCount; i++) {
                let px = 0;
                let py = Math.random() * FIELD_SIZE_M;

                // Apply Probability Density Functions
                if (sp.distribution === 'random') {
                  px = Math.random() * FIELD_SIZE_M;
                } else if (sp.distribution === 'clustered') {
                  const numClusters = 6;
                  const clusterId = i % numClusters;
                  const cx = ((clusterId * 17 + 43) % 80) + 10;
                  const cy = ((clusterId * 31 + 17) % 80) + 10;
                  const offsetX = (Math.random() + Math.random() + Math.random() - 1.5) * 10;
                  const offsetY = (Math.random() + Math.random() + Math.random() - 1.5) * 10;
                  px = Math.max(0, Math.min(FIELD_SIZE_M, cx + offsetX));
                  py = Math.max(0, Math.min(FIELD_SIZE_M, cy + offsetY));
                } else if (sp.distribution === 'center_cluster') {
                  // Clustered heavily in the middle of the X gradient (Mid-Tide zone)
                  const numClusters = 8;
                  const clusterId = i % numClusters;
                  const cx = (FIELD_SIZE_M / 2) + (Math.random() * 20 - 10); // tightly bound to center X
                  const cy = ((clusterId * 23 + 11) % 90) + 5; // spread along Y
                  const offsetX = (Math.random() + Math.random() - 1.0) * 8;
                  const offsetY = (Math.random() + Math.random() - 1.0) * 8;
                  px = Math.max(0, Math.min(FIELD_SIZE_M, cx + offsetX));
                  py = Math.max(0, Math.min(FIELD_SIZE_M, cy + offsetY));
                } else if (sp.distribution === 'skew_left') {
                  const val = Math.random() * Math.random() * Math.random();
                  px = val * FIELD_SIZE_M;
                } else if (sp.distribution === 'skew_right') {
                  const val = 1.0 - (Math.random() * Math.random() * Math.random());
                  px = val * FIELD_SIZE_M;
                } else if (sp.distribution === 'center') {
                  const val = (Math.random() + Math.random() + Math.random() + Math.random()) / 4;
                  px = val * FIELD_SIZE_M;
                }
                
                newPlants.push({
                  x: px, y: py,
                  speciesId: sp.id,
                  emoji: sp.emoji,
                  size: sp.size
                });
              }
            });
            
            setPlants(newPlants);
            setTransects([]);
            setSampled(false);
            setShowTruePop(false);
            setResults({});
          }, [activeHabitat]);

          // Initialize field on load or habitat change
          useEffect(() => {
            generateField();
          }, [generateField]);

          // --- Auto-Sampling Logic ---
          const conductAutoSampling = () => {
            const newTransects = [];
            let attempts = 0;
            
            while (newTransects.length < transectCount && attempts < 1000) {
              attempts++;
              const startX = Math.random() * (FIELD_SIZE_M - transectLength);
              const startY = Math.random() * (FIELD_SIZE_M - TRANSECT_WIDTH_M);
              
              const isOverlapping = newTransects.some(t => Math.abs(t.startY - startY) < TRANSECT_WIDTH_M);
              if (!isOverlapping) {
                newTransects.push({ id: newTransects.length + 1, startX, startY, length: transectLength, width: TRANSECT_WIDTH_M });
              }
            }
            
            setTransects(newTransects);
            calculateResults(newTransects);
          };

          // --- Math & Extrapolation Engine ---
          const calculateResults = (currentTransects) => {
            if (currentTransects.length === 0) {
              setSampled(false);
              setResults({});
              return;
            }

            const totalAreaSampled = currentTransects.reduce((sum, t) => sum + (t.length * t.width), 0);
            const profile = HABITAT_PROFILES[activeHabitat];
            
            // Aggregate Counts
            const counts = {};
            Object.keys(profile.species).forEach(k => counts[k] = 0);
            
            // Per-Transect Breakdown Data
            const transectDetails = currentTransects.map(t => {
              const tCounts = {};
              Object.keys(profile.species).forEach(k => tCounts[k] = 0);
              return { ...t, counts: tCounts };
            });

            // Count plants inside the transects
            plants.forEach(plant => {
              currentTransects.forEach((t, index) => {
                if (plant.x >= t.startX && plant.x <= t.startX + t.length &&
                    plant.y >= t.startY && plant.y <= t.startY + t.width) {
                  counts[plant.speciesId]++;
                  transectDetails[index].counts[plant.speciesId]++;
                }
              });
            });

            const newResults = {};
            Object.keys(profile.species).forEach(key => {
              const sp = profile.species[key];
              const density = counts[key] / totalAreaSampled;
              const estimate = Math.round(density * FIELD_AREA);
              const actual = sp.trueCount;
              const error = Math.abs(estimate - actual) / actual * 100;
              
              newResults[key] = {
                sampledCount: counts[key],
                estimate: estimate,
                actual: actual,
                error: error
              };
            });
            
            setResults({
              ...newResults,
              totalAreaSampled,
              percentSampled: (totalAreaSampled / FIELD_AREA) * 100,
              transectDetails // Attach the individual belt data
            });
            setSampled(true);
          };

          // --- Manual Drag Handlers (Omnidirectional) ---
          const handleMouseDown = (e) => {
            if (!isManualMode) return;
            const rect = canvasRef.current.getBoundingClientRect();
            const scale = FIELD_SIZE_M / rect.width;
            const x = (e.clientX - rect.left) * scale;
            const y = (e.clientY - rect.top) * scale;
            setDragStart({ x, y });
            setDragCurrent({ x, y });
          };

          const handleMouseMove = (e) => {
            if (!dragStart || !isManualMode) return;
            const rect = canvasRef.current.getBoundingClientRect();
            const scale = FIELD_SIZE_M / rect.width;
            const x = Math.max(0, Math.min(FIELD_SIZE_M, (e.clientX - rect.left) * scale));
            const y = Math.max(0, Math.min(FIELD_SIZE_M, (e.clientY - rect.top) * scale));
            setDragCurrent({ x, y });
          };

          const handleMouseUp = () => {
            if (!dragStart || !dragCurrent || !isManualMode) return;
            
            const dx = dragCurrent.x - dragStart.x;
            const dy = dragCurrent.y - dragStart.y;
            
            let startX, startY, length, width;

            // Determine if drag was mostly horizontal or vertical
            if (Math.abs(dx) > Math.abs(dy)) {
              // Horizontal Drag
              length = Math.abs(dx); 
              width = TRANSECT_WIDTH_M; 
              startX = Math.min(dragStart.x, dragCurrent.x);
              startY = Math.max(0, dragStart.y - TRANSECT_WIDTH_M / 2);
            } else {
              // Vertical Drag (Top to Bottom)
              length = TRANSECT_WIDTH_M; 
              width = Math.abs(dy); 
              startX = Math.max(0, dragStart.x - TRANSECT_WIDTH_M / 2);
              startY = Math.min(dragStart.y, dragCurrent.y);
            }
            
            // Only accept if they dragged a reasonable distance (>1 meter)
            if (Math.max(Math.abs(dx), Math.abs(dy)) > 1) {
              const newTransects = [...transects, { id: transects.length + 1, startX, startY, length, width }];
              setTransects(newTransects);
              calculateResults(newTransects);
            }
            
            setDragStart(null);
            setDragCurrent(null);
          };

          const clearManualTransects = () => {
            setTransects([]);
            calculateResults([]);
          };

          // --- Canvas Rendering ---
          useEffect(() => {
            const canvas = canvasRef.current;
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            
            const scale = width / FIELD_SIZE_M; 
            const profile = HABITAT_PROFILES[activeHabitat];

            // 1. Draw Field Background
            if (profile.bg === 'gradient') {
              const grad = ctx.createLinearGradient(0, 0, width, 0);
              grad.addColorStop(0, '#022C22'); // Dark Shade
              grad.addColorStop(0.4, '#064E3B'); // Mid Forest
              grad.addColorStop(0.7, '#65A30D'); // Light Edge
              grad.addColorStop(1, '#84CC16'); // Bright Meadow
              ctx.fillStyle = grad;
            } else if (profile.bg === 'marine_gradient') {
              const grad = ctx.createLinearGradient(0, 0, width, 0);
              grad.addColorStop(0, '#A8A29E'); // Dry Rock 
              grad.addColorStop(0.3, '#57534E'); // Wet Rock 
              grad.addColorStop(0.6, '#0284C7'); // Shallow Water 
              grad.addColorStop(1, '#1E3A8A'); // Deep Water 
              ctx.fillStyle = grad;
            } else {
              ctx.fillStyle = profile.bg;
            }
            ctx.fillRect(0, 0, width, height);
            
            // Grid lines for scale (every 10m)
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)'; 
            ctx.lineWidth = 1;
            for(let i = 0; i <= FIELD_SIZE_M; i += 10) {
              ctx.beginPath();
              ctx.moveTo(i * scale, 0); ctx.lineTo(i * scale, height);
              ctx.moveTo(0, i * scale); ctx.lineTo(width, i * scale);
              ctx.stroke();
            }

            // 2. Draw Plants (Emojis)
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            plants.forEach(p => {
              // Determine if "caught" in a transect
              let isCounted = false;
              if (transects.length > 0) {
                isCounted = transects.some(t => 
                  p.x >= t.startX && p.x <= t.startX + t.length &&
                  p.y >= t.startY && p.y <= t.startY + t.width
                );
              }

              const px = p.x * scale;
              const py = p.y * scale;
              const fontSize = p.size * scale * 2;

              ctx.font = `${fontSize}px Inter`;
              
              if (sampled && transects.length > 0) {
                if (isCounted) {
                  ctx.shadowColor = '#FFFFFF';
                  ctx.shadowBlur = 15;
                  ctx.globalAlpha = 1.0;
                  ctx.fillText(p.emoji, px, py);
                  ctx.shadowBlur = 0; 
                } else {
                  ctx.globalAlpha = 0.15;
                  ctx.fillText(p.emoji, px, py);
                  ctx.globalAlpha = 1.0;
                }
              } else {
                ctx.globalAlpha = 1.0;
                ctx.fillText(p.emoji, px, py);
              }
            });

            // 3. Draw Completed Transects
            transects.forEach(t => {
              ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
              ctx.strokeStyle = '#FFFFFF';
              ctx.lineWidth = 2;
              ctx.setLineDash([5, 5]);
              
              ctx.beginPath();
              ctx.rect(t.startX * scale, t.startY * scale, t.length * scale, t.width * scale);
              ctx.fill();
              ctx.stroke();
              
              // Draw Label
              ctx.setLineDash([]);
              ctx.fillStyle = '#FFFFFF';
              ctx.font = 'bold 12px Inter';
              ctx.shadowBlur = 4;
              ctx.shadowColor = '#000000';
              ctx.textAlign = 'left';
              ctx.fillText(`Belt ${t.id}`, t.startX * scale + 5, t.startY * scale + 15);
              ctx.shadowBlur = 0;
            });
            ctx.setLineDash([]); 

            // 4. Draw Ghost Transect during Drag
            if (dragStart && dragCurrent) {
              const dx = dragCurrent.x - dragStart.x;
              const dy = dragCurrent.y - dragStart.y;
              
              let sx, sy, l, w;
              if (Math.abs(dx) > Math.abs(dy)) {
                l = Math.abs(dx); w = TRANSECT_WIDTH_M;
                sx = Math.min(dragStart.x, dragCurrent.x); sy = dragStart.y - TRANSECT_WIDTH_M / 2;
              } else {
                l = TRANSECT_WIDTH_M; w = Math.abs(dy);
                sx = dragStart.x - TRANSECT_WIDTH_M / 2; sy = Math.min(dragStart.y, dragCurrent.y);
              }
              
              ctx.fillStyle = 'rgba(250, 204, 21, 0.3)'; // Yellow highlight
              ctx.strokeStyle = '#FACC15';
              ctx.lineWidth = 2;
              ctx.setLineDash([5, 5]);
              ctx.beginPath();
              ctx.rect(sx * scale, sy * scale, l * scale, w * scale);
              ctx.fill();
              ctx.stroke();
              ctx.setLineDash([]);
            }

          }, [plants, transects, sampled, dragStart, dragCurrent, activeHabitat]);

          const activeProfile = HABITAT_PROFILES[activeHabitat];

          return (
            <div className="flex flex-col h-screen max-h-[1000px] min-h-[750px] bg-[#020617] text-slate-100 font-sans overflow-hidden p-2 md:p-4">
              
              {/* Main Container */}
              <div className="w-full h-full max-w-[1400px] mx-auto flex flex-col gap-4 border border-slate-700 bg-[#0F172A] rounded-2xl overflow-hidden shadow-2xl">
                
                {/* Header */}
                <header className="flex items-center justify-between p-4 bg-slate-800 border-b border-slate-700 shadow-md z-10 shrink-0">
                  <div className="flex items-center gap-3">
                    <Icon name="Map" className="text-emerald-400 w-8 h-8" />
                    <div>
                      <h1 className="text-xl md:text-2xl font-black bg-clip-text text-transparent bg-gradient-to-r from-emerald-400 to-teal-500 tracking-wide">
                        Transect Sampling Simulator
                      </h1>
                      <p className="text-[10px] text-slate-400 uppercase tracking-widest font-bold mt-0.5">Ecology & Population Statistics</p>
                    </div>
                  </div>

                  <div className="flex items-center bg-slate-900 px-4 py-2 rounded-xl border border-slate-700 shadow-inner">
                    <div className="text-[10px] text-slate-400 uppercase tracking-wider text-right mr-3 hidden sm:block">
                      Total Field<br/>Area
                    </div>
                    <div className="text-2xl font-black font-mono text-emerald-300 drop-shadow-md">
                      10,000 <span className="text-sm">m²</span>
                    </div>
                  </div>
                </header>

                {/* Main Content Area */}
                <main className="flex-1 flex flex-col lg:flex-row relative min-h-0">
                  
                  {/* Left Sidebar: Controls & Data */}
                  <aside className="w-full lg:w-[400px] p-5 bg-slate-800/40 border-r border-slate-700 overflow-y-auto flex flex-col gap-5 z-10 shrink-0 custom-scrollbar">
                    
                    {/* Habitat & Mode Toggles */}
                    <div className="space-y-3">
                      <label className="text-[10px] text-slate-500 font-bold uppercase tracking-wider block border-b border-slate-700 pb-1">Environment Profile</label>
                      <div className="flex bg-slate-900 p-1 rounded-lg border border-slate-700 shadow-inner overflow-hidden">
                        <button onClick={() => setActiveHabitat('uniform')} className={`flex-1 py-2 rounded text-[9px] font-bold uppercase tracking-wider transition-colors ${activeHabitat === 'uniform' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}>
                           Uniform
                        </button>
                        <button onClick={() => setActiveHabitat('gradient')} className={`flex-1 py-2 rounded text-[9px] font-bold uppercase tracking-wider transition-colors ${activeHabitat === 'gradient' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}>
                           Ecotone
                        </button>
                        <button onClick={() => setActiveHabitat('intertidal')} className={`flex-1 py-2 rounded text-[9px] font-bold uppercase tracking-wider transition-colors ${activeHabitat === 'intertidal' ? 'bg-sky-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}>
                           Intertidal
                        </button>
                      </div>
                      <p className="text-[10px] text-slate-400 leading-tight bg-slate-900/50 p-2 rounded border border-slate-800 border-l-2 border-l-emerald-500">{activeProfile.desc}</p>
                    </div>

                    {/* Interaction Mode */}
                    <div className="space-y-3 pt-2">
                      <label className="text-[10px] text-slate-500 font-bold uppercase tracking-wider block border-b border-slate-700 pb-1">Interaction Method</label>
                      <div className="flex bg-slate-900 p-1 rounded-lg border border-slate-700 shadow-inner">
                        <button onClick={() => { setIsManualMode(false); clearManualTransects(); }} className={`flex-1 py-2 flex items-center justify-center gap-1.5 rounded text-[10px] font-bold uppercase tracking-wider transition-colors ${!isManualMode ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}>
                           <Icon name="Calculator" className="w-3 h-3"/> Auto-Generate
                        </button>
                        <button onClick={() => { setIsManualMode(true); clearManualTransects(); }} className={`flex-1 py-2 flex items-center justify-center gap-1.5 rounded text-[10px] font-bold uppercase tracking-wider transition-colors ${isManualMode ? 'bg-amber-500 text-slate-900 shadow' : 'text-slate-400 hover:text-white'}`}>
                           <Icon name="MousePointer2" className="w-3 h-3"/> Manual Draw
                        </button>
                      </div>
                    </div>
                    
                    {/* Auto Mode Controls */}
                    {!isManualMode ? (
                      <div className="space-y-5 bg-slate-900/80 p-4 rounded-xl border border-slate-700 shadow-inner">
                        <div>
                          <label className="flex justify-between text-sm mb-2 text-slate-200 font-semibold">
                            <span>Belt Length (L)</span>
                            <span className="font-mono text-indigo-400 bg-slate-950 px-2 py-0.5 rounded border border-slate-800">{transectLength} m</span>
                          </label>
                          <input 
                            type="range" min="10" max="100" step="10"
                            value={transectLength}
                            onChange={(e) => { setTransectLength(parseInt(e.target.value)); setSampled(false); }}
                            className="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-indigo-500"
                          />
                        </div>

                        <div>
                          <label className="flex justify-between text-sm mb-2 text-slate-200 font-semibold">
                            <span>Number of Transects (N)</span>
                            <span className="font-mono text-indigo-400 bg-slate-950 px-2 py-0.5 rounded border border-slate-800">{transectCount}</span>
                          </label>
                          <input 
                            type="range" min="1" max="20" step="1"
                            value={transectCount}
                            onChange={(e) => { setTransectCount(parseInt(e.target.value)); setSampled(false); }}
                            className="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-indigo-500"
                          />
                        </div>
                        
                        <button 
                          onClick={conductAutoSampling}
                          className="w-full py-3 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-bold rounded-lg transition-all flex justify-center items-center gap-2 shadow-lg shadow-indigo-900/50 border border-indigo-500"
                        >
                          <Icon name="Calculator" className="w-4 h-4" /> Scatter Random Belts
                        </button>
                      </div>
                    ) : (
                      <div className="bg-amber-950/20 p-4 rounded-xl border border-amber-900/40 text-sm text-slate-300">
                          <h3 className="font-bold text-amber-400 mb-2 flex items-center gap-2"><Icon name="MousePointer2" className="w-4 h-4"/> Custom Survey Mode</h3>
                          <p className="text-[11px] leading-relaxed mb-4">
                            <strong>Click and drag</strong> to draw your own 2m-wide belt transects. Drag horizontally to sample across the gradient, or drag vertically (top-to-bottom) to isolate specific habitats like the deep shade or sunny meadow!
                          </p>
                          <button 
                            onClick={clearManualTransects}
                            className="w-full py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-lg transition-all border border-slate-600 text-xs"
                          >
                            Clear Placed Belts
                          </button>
                      </div>
                    )}

                    {/* Results Dashboard */}
                    {sampled && transects.length > 0 && (
                      <div className="animate-in fade-in slide-in-from-bottom-4 duration-500 flex-grow flex flex-col pt-2">
                        <div className="flex justify-between items-center mb-3 border-b border-slate-700 pb-2">
                          <h2 className="text-sm font-bold uppercase tracking-widest text-slate-400 flex items-center gap-2">
                            <Icon name="BarChart2" className="w-4 h-4 text-emerald-400" />
                            Data Analysis
                          </h2>
                          
                          {/* God Mode Toggle */}
                          <button 
                            onClick={() => setShowTruePop(!showTruePop)}
                            className={`flex items-center gap-1.5 px-2.5 py-1.5 rounded text-[9px] font-bold uppercase tracking-wider transition-colors border ${showTruePop ? 'bg-rose-500/20 text-rose-400 border-rose-500/50 shadow-[0_0_10px_rgba(244,63,94,0.3)]' : 'bg-slate-800 text-slate-400 border-slate-600 hover:bg-slate-700 hover:text-white'}`}
                          >
                            {showTruePop ? <Icon name="EyeOff" className="w-3 h-3"/> : <Icon name="Eye" className="w-3 h-3"/>}
                            {showTruePop ? 'Hide Actual' : 'Reveal True Population'}
                          </button>
                        </div>
                        
                        {isManualMode && (activeHabitat === 'gradient' || activeHabitat === 'intertidal') && (
                          <div className="mb-3 p-2 bg-amber-950/30 border border-amber-900/50 rounded flex items-start gap-2 text-[9px] text-amber-300 font-bold">
                            <Icon name="Info" className="w-3 h-3 shrink-0 mt-0.5"/>
                            Warning: Extrapolating targeted manual samples across an environmental gradient will produce extreme Sampling Bias! Look at the individual belt breakdown below to see Zonation.
                          </div>
                        )}

                        <div className="bg-slate-900 rounded-xl border border-slate-700 overflow-hidden shadow-inner flex-grow flex flex-col">
                          
                          {/* Mathematical Formula Banner */}
                          <div className="p-3 bg-slate-950 border-b border-slate-800 flex flex-col items-center justify-center text-center">
                            <span className="text-[9px] text-slate-500 uppercase font-bold tracking-widest mb-1">Total Sampled Area: {results.totalAreaSampled.toLocaleString()} m²</span>
                            <div className="text-[11px] font-mono text-slate-300">
                              Estimate = <span className="text-emerald-400">(Count / Area)</span> × 10,000 m²
                            </div>
                          </div>
                          
                          {/* Overall Estimates */}
                          <div className="p-4 space-y-4">
                            {Object.values(activeProfile.species).map(sp => {
                              const res = results[sp.id];
                              return (
                                <div key={sp.id} className="space-y-2">
                                  <div className="flex justify-between items-center">
                                    <span className="text-sm font-bold flex items-center gap-2 text-slate-200">
                                      <span className="text-lg drop-shadow-md">{sp.emoji}</span>
                                      {sp.name}
                                    </span>
                                    
                                    {/* Only show error if God Mode is on */}
                                    {showTruePop && (
                                      <span className={`text-[10px] font-bold px-2 py-0.5 rounded border ${res.error < 15 ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30' : res.error < 40 ? 'bg-amber-500/20 text-amber-400 border-amber-500/30' : 'bg-rose-500/20 text-rose-400 border-rose-500/30'}`}>
                                        {res.error.toFixed(1)}% Error
                                      </span>
                                    )}
                                  </div>

                                  <div className="grid grid-cols-2 gap-2 text-xs">
                                    <div className="bg-slate-800 p-2 rounded-lg border border-slate-700 flex flex-col">
                                      <span className="text-[9px] text-slate-400 uppercase font-bold mb-0.5">Sampled Count</span>
                                      <span className="text-lg font-mono text-emerald-400 font-bold">{res.sampledCount}</span>
                                    </div>
                                    <div className="bg-slate-800 p-2 rounded-lg border border-slate-700 flex flex-col">
                                      <span className="text-[9px] text-slate-400 uppercase font-bold mb-0.5">Estimated Pop.</span>
                                      <span className="text-lg font-mono text-white font-bold">{res.estimate.toLocaleString()}</span>
                                    </div>
                                  </div>
                                  
                                  {/* Only show actual pop if God Mode is on */}
                                  {showTruePop && (
                                    <div className="bg-slate-950 p-2 rounded-lg border border-slate-800 flex justify-between items-center animate-in fade-in">
                                      <span className="text-[10px] text-slate-500 uppercase font-bold">True Population</span>
                                      <span className="font-mono text-slate-300 font-bold">{res.actual.toLocaleString()}</span>
                                    </div>
                                  )}
                                </div>
                              );
                            })}
                          </div>

                          {/* Individual Belt Breakdown (ZONATION DATA) */}
                          {results.transectDetails && results.transectDetails.length > 0 && (
                            <div className="border-t border-slate-700 bg-slate-900/50 p-4 flex-1">
                              <h3 className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3 flex items-center gap-1.5"><Icon name="Map" className="w-3 h-3"/> Individual Belt Breakdown</h3>
                              <div className="space-y-2 max-h-48 overflow-y-auto custom-scrollbar pr-1">
                                {results.transectDetails.map(t => (
                                  <div key={t.id} className="bg-slate-800/80 p-2.5 rounded-lg border border-slate-700 text-xs shadow-sm">
                                    <div className="flex justify-between items-center mb-1.5">
                                        <span className="font-bold text-slate-200">Belt {t.id}</span>
                                        <span className="text-[9px] text-slate-400 font-mono">X:{Math.round(t.startX)}m, Y:{Math.round(t.startY)}m</span>
                                    </div>
                                    <div className="flex flex-wrap gap-3">
                                        {Object.keys(t.counts).map(spId => (
                                          <div key={spId} className="flex items-center gap-1 bg-slate-900 px-1.5 py-0.5 rounded border border-slate-700/50">
                                              <span className="text-[10px] drop-shadow-sm">{activeProfile.species[spId].emoji}</span>
                                              <span className="font-bold font-mono text-slate-300 text-[10px]">{t.counts[spId]}</span>
                                          </div>
                                        ))}
                                    </div>
                                  </div>
                                ))}
                              </div>
                            </div>
                          )}

                        </div>
                      </div>
                    )}

                  </aside>

                  {/* Right Area: Interactive Field Canvas */}
                  <div className="flex-1 relative flex flex-col p-4 bg-[#070B14]">
                    
                    <div className="flex justify-between items-center mb-3">
                      {/* Educational Legend */}
                      <div className="flex flex-wrap items-center gap-3 sm:gap-5 bg-slate-800/50 backdrop-blur-md px-4 py-2 rounded-xl border border-slate-700/50 text-slate-300 shadow-sm">
                        <span className="font-bold text-slate-400 flex items-center gap-1.5 uppercase tracking-widest text-[9px]">
                          <Icon name="Trees" className="w-3.5 h-3.5 text-emerald-500/80"/> Legend
                        </span>
                        <div className="hidden sm:block w-px h-3 bg-slate-700/80"></div> {/* Divider */}
                        {Object.values(activeProfile.species).map(sp => (
                          <div key={sp.id} className="flex items-center gap-1.5 font-medium text-[11px]" title={`${sp.distribution} distribution`}>
                            <span className="text-sm drop-shadow-sm">{sp.emoji}</span>
                            <span className="text-slate-200">{sp.name}</span> 
                          </div>
                        ))}
                      </div>

                      <button 
                        onClick={generateField}
                        className="flex items-center gap-2 px-4 py-2 bg-slate-800/50 backdrop-blur-md hover:bg-slate-700 active:scale-95 text-slate-300 hover:text-white rounded-xl transition-all text-[10px] uppercase tracking-wider font-bold border border-slate-700/50 shadow-sm"
                      >
                        <Icon name="RefreshCw" className="w-3.5 h-3.5" /> <span className="hidden sm:inline">Scatter Populations</span><span className="sm:hidden">Scatter</span>
                      </button>
                    </div>

                    {/* Container for aspect-ratio locked canvas */}
                    <div 
                      className="flex-1 w-full bg-slate-900 rounded-xl border-2 border-slate-700 overflow-hidden relative shadow-2xl shadow-emerald-900/10 flex items-center justify-center touch-none"
                      onMouseDown={handleMouseDown}
                      onMouseMove={handleMouseMove}
                      onMouseUp={handleMouseUp}
                      onMouseLeave={handleMouseUp}
                      onTouchStart={(e) => {
                        const touch = e.touches[0];
                        handleMouseDown({ clientX: touch.clientX, clientY: touch.clientY });
                      }}
                      onTouchMove={(e) => {
                        const touch = e.touches[0];
                        handleMouseMove({ clientX: touch.clientX, clientY: touch.clientY });
                      }}
                      onTouchEnd={handleMouseUp}
                    >
                      {/* Internal resolution maps perfectly to scaling logic */}
                      <canvas 
                        ref={canvasRef} 
                        width={800} 
                        height={800} 
                        className={`max-h-full max-w-full aspect-square object-contain shadow-[inset_0_0_50px_rgba(0,0,0,0.8)] ${isManualMode ? 'cursor-crosshair' : ''}`}
                      />
                      
                      {/* Empty State Overlay */}
                      {(!sampled || transects.length === 0) && (
                        <div className="absolute inset-0 flex items-center justify-center pointer-events-none bg-slate-950/50 backdrop-blur-sm">
                           <div className="bg-slate-800/90 p-6 rounded-2xl border border-slate-600 shadow-2xl flex flex-col items-center max-w-sm text-center">
                              <Icon name="Target" className="w-12 h-12 text-indigo-400 mb-3 animate-pulse" />
                              <h3 className="text-white font-black text-xl mb-2 tracking-wide">Field Ready for Sampling</h3>
                              <p className="text-xs text-slate-300 leading-relaxed">
                                {isManualMode 
                                  ? "Click and drag your mouse across the field to manually lay down belt transects." 
                                  : <>Adjust parameters on the left and click <strong className="text-indigo-400">Scatter Random Belts</strong>.</>}
                              </p>
                           </div>
                        </div>
                      )}
                    </div>

                  </div>
                </main>
              </div>

            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
