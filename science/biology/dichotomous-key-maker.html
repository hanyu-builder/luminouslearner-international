<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Interactive Dichotomous Key Simulator. Learn binary decision tree algorithms for taxonomic species identification.">
    <title>Biology Virtual Labs - Dichotomous Key Simulator</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- D3.js for Tree Visualization -->
    <script src="https://d3js.org/d3.v7.min.js"></script>

    <style>
        body {
            background-color: #0F172A; /* Deep Slate */
            color: #F8FAFC;
            font-family: 'Inter', system-ui, sans-serif;
            overflow-x: hidden;
            user-select: none;
            margin: 0;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1E293B; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }

        /* SVG Tree Styling */
        .link {
            fill: none;
            stroke: #334155; /* Slate 700 */
            stroke-width: 3px;
            transition: stroke 0.4s ease, stroke-width 0.4s ease;
        }
        .link.active-path {
            stroke: #10b981; /* Emerald 500 */
            stroke-width: 5px;
            filter: drop-shadow(0px 0px 5px rgba(16, 185, 129, 0.6));
        }
        .link.error-path {
            stroke: #ef4444; /* Red 500 */
            stroke-width: 5px;
        }
        
        .node circle {
            fill: #1e293b;
            stroke: #64748b;
            stroke-width: 3px;
            transition: all 0.4s ease;
        }
        .node.active-node circle {
            fill: #10b981;
            stroke: #34d399;
            stroke-width: 4px;
            filter: drop-shadow(0px 0px 8px rgba(16, 185, 129, 0.8));
        }
        .node.history-node circle {
            fill: #064e3b;
            stroke: #10b981;
        }
        
        .node text {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 700;
            fill: #94a3b8;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
            pointer-events: none;
            transition: fill 0.3s;
        }
        .node.active-node text, .node.history-node text {
            fill: #ffffff;
        }

        .upload-overlay {
            background: linear-gradient(to top, rgba(15,23,42,1) 0%, rgba(15,23,42,0) 100%);
        }

        /* Animations */
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }
        .animate-shake { animation: shake 0.4s ease-in-out; }
    </style>
</head>
<body class="min-h-screen w-full flex justify-center items-start p-2 md:p-6 bg-[#020617]">

    <!-- Root Container for React -->
    <div id="root" class="w-full max-w-[1500px] flex flex-col bg-slate-900 rounded-2xl shadow-[0_0_50px_rgba(0,0,0,0.8)] overflow-hidden border border-slate-700/50 relative mx-auto my-auto min-h-[850px]"></div>

    <script type="text/babel">
        const { useState, useMemo, useRef, useEffect } = React;

        // ==========================================
        // EXPANDED DICHOTOMOUS KEY DATA STRUCTURE
        // ==========================================
        const INITIAL_KEY = {
            id: "root",
            label: "Start",
            question: "Does the organism possess a spinal column (backbone)?",
            children: [
                {
                    id: "vert",
                    trait: "Has Backbone",
                    label: "Vertebrate",
                    question: "Does the organism have fur or hair?",
                    children: [
                        {
                            id: "mammal",
                            trait: "Has Fur/Hair",
                            label: "Mammal",
                            question: "Does it have retractable claws and a short muzzle?",
                            children: [
                                {
                                    id: "feline", trait: "Retractable Claws (Feline)", label: "Feline", result: "Family: Felidae", icon: "fa-cat", desc: "Includes lions, tigers, and domestic cats."
                                },
                                {
                                    id: "canine", trait: "Non-retractable Claws (Canine)", label: "Canine", result: "Family: Canidae", icon: "fa-dog", desc: "Includes wolves, foxes, and domestic dogs."
                                }
                            ]
                        },
                        {
                            id: "no-fur",
                            trait: "No Fur/Hair",
                            label: "Other Vertebrate",
                            question: "Does it have feathers and wings?",
                            children: [
                                {
                                    id: "bird", trait: "Has Feathers", label: "Bird", result: "Class: Aves", icon: "fa-crow", desc: "Warm-blooded, egg-laying vertebrates with wings."
                                },
                                {
                                    id: "no-feathers", trait: "No Feathers", label: "Ectotherm", question: "Does it have dry, scaly skin?",
                                    children: [
                                        {
                                            id: "reptile", trait: "Dry, Scaly Skin", label: "Reptile", result: "Class: Reptilia", icon: "fa-dragon", desc: "Cold-blooded air-breathing vertebrates (snakes, lizards)."
                                        },
                                        {
                                            id: "amphibian-fish", trait: "Moist Skin or Wet Scales", label: "Amphibian/Fish", question: "Does it primarily use gills to breathe underwater as an adult?",
                                            children: [
                                                {
                                                    id: "fish", trait: "Gills & Fins", label: "Fish", result: "Class: Osteichthyes", icon: "fa-fish", desc: "Aquatic vertebrates with gills."
                                                },
                                                {
                                                    id: "amphibian", trait: "Lungs & Limbs (Adult)", label: "Amphibian", result: "Class: Amphibia", icon: "fa-frog", desc: "Starts in water (gills), moves to land (lungs)."
                                                }
                                            ]
                                        }
                                    ]
                                }
                            ]
                        }
                    ]
                },
                {
                    id: "invert",
                    trait: "No Backbone",
                    label: "Invertebrate",
                    question: "Does it possess an exoskeleton and jointed legs?",
                    children: [
                        {
                            id: "arthropod",
                            trait: "Jointed Legs",
                            label: "Arthropod",
                            question: "How many legs does it have?",
                            children: [
                                {
                                    id: "insect", trait: "6 Legs (3 pairs)", label: "Insect", result: "Class: Insecta", icon: "fa-bug", desc: "Includes butterflies, beetles, and ants."
                                },
                                {
                                    id: "arachnid", trait: "8 Legs (4 pairs)", label: "Arachnid", result: "Class: Arachnida", icon: "fa-spider", desc: "Includes spiders, scorpions, and ticks."
                                }
                            ]
                        },
                        {
                            id: "soft-body",
                            trait: "No Jointed Legs",
                            label: "Soft-Bodied",
                            question: "Does it have a muscular foot or a hard calcium shell?",
                            children: [
                                {
                                    id: "mollusk", trait: "Has Shell/Foot", label: "Mollusk", result: "Phylum: Mollusca", icon: "fa-disease", desc: "Soft-bodied invertebrates often with a shell (snails, octopus)."
                                },
                                {
                                    id: "annelid", trait: "No Shell/Foot", label: "Worm", result: "Phylum: Annelida / Nematoda", icon: "fa-worm", desc: "Elongated soft-bodied invertebrates."
                                }
                            ]
                        }
                    ]
                }
            ]
        };

        // Built-in Practice Specimens with Target Leaf IDs for Validation
        const SAMPLE_SPECIMENS = [
            { id: 'frog', name: 'Frog', emoji: '🐸', targetId: 'amphibian' },
            { id: 'tiger', name: 'Tiger', emoji: '🐅', targetId: 'feline' },
            { id: 'butterfly', name: 'Butterfly', emoji: '🦋', targetId: 'insect' },
            { id: 'spider', name: 'Tarantula', emoji: '🕷️', targetId: 'arachnid' },
            { id: 'bird', name: 'Eagle', emoji: '🦅', targetId: 'bird' },
            { id: 'fish', name: 'Salmon', emoji: '🐟', targetId: 'fish' },
            { id: 'dog', name: 'Wolf', emoji: '🐺', targetId: 'canine' },
            { id: 'snake', name: 'Snake', emoji: '🐍', targetId: 'reptile' }
        ];

        // ==========================================
        // D3 TREE COMPONENT
        // ==========================================
        const D3TreeVisualization = ({ data, history, currentNodeId }) => {
            // Increased canvas size to fit the expanded tree properly
            const width = 1200;
            const height = 800;
            const margin = { top: 40, right: 180, bottom: 40, left: 100 };

            const { nodes, links } = useMemo(() => {
                const root = d3.hierarchy(data);
                const treeLayout = d3.tree().size([height - margin.top - margin.bottom, width - margin.left - margin.right]);
                treeLayout(root);
                return { nodes: root.descendants(), links: root.links() };
            }, [data]);

            const isNodeInHistory = (id) => history.includes(id);
            const isNodeActive = (id) => currentNodeId === id;
            const isLinkActive = (sourceId, targetId) => isNodeInHistory(sourceId) && (isNodeInHistory(targetId) || isNodeActive(targetId));

            return (
                <svg viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="xMidYMid meet" className="w-full h-full min-h-[500px]">
                    <g transform={`translate(${margin.left},${margin.top})`}>
                        {/* Links */}
                        {links.map((link, i) => {
                            const pathData = d3.linkHorizontal().x(d => d.y).y(d => d.x)(link);
                            const active = isLinkActive(link.source.data.id, link.target.data.id);
                            
                            return (
                                <g key={`link-${i}`}>
                                    <path d={pathData} className={`link ${active ? 'active-path' : ''}`} />
                                    <text
                                        x={(link.source.y + link.target.y) / 2}
                                        y={(link.source.x + link.target.x) / 2 - 10}
                                        textAnchor="middle"
                                        fill={active ? "#34d399" : "#64748b"}
                                        fontSize="12px"
                                        fontWeight="bold"
                                        style={{ textShadow: "0 2px 4px rgba(0,0,0,0.9)" }}
                                    >
                                        {link.target.data.trait}
                                    </text>
                                </g>
                            );
                        })}

                        {/* Nodes */}
                        {nodes.map((node, i) => {
                            const id = node.data.id;
                            const isHistory = isNodeInHistory(id);
                            const isActive = isNodeActive(id);
                            const isLeaf = !node.children;
                            
                            let nodeClass = "node";
                            if (isActive) nodeClass += " active-node";
                            else if (isHistory) nodeClass += " history-node";

                            return (
                                <g key={`node-${id}`} className={nodeClass} transform={`translate(${node.y},${node.x})`}>
                                    {isLeaf ? (
                                        <rect x={isActive ? -14 : -10} y={isActive ? -14 : -10} width={isActive ? 28 : 20} height={isActive ? 28 : 20} rx="4" />
                                    ) : (
                                        <circle r={isActive ? 16 : 10} />
                                    )}
                                    <text 
                                        dy={isLeaf ? "5" : "-18"} 
                                        x={isLeaf ? 22 : 0} 
                                        textAnchor={isLeaf ? "start" : "middle"}
                                    >
                                        {node.data.label}
                                    </text>
                                </g>
                            );
                        })}
                    </g>
                </svg>
            );
        };

        // ==========================================
        // MAIN APP COMPONENT
        // ==========================================
        const App = () => {
            const [currentNode, setCurrentNode] = useState(INITIAL_KEY);
            const [history, setHistory] = useState([]);
            
            const [selectedSpecimen, setSelectedSpecimen] = useState(null); // Holds active Practice Specimen
            const [uploadedImage, setUploadedImage] = useState(null);
            const [feedback, setFeedback] = useState({ message: "Observe the specimen and select a path.", type: "info" });
            
            const fileInputRef = useRef(null);

            // --- VALIDATION HELPER ---
            // Checks if the targetLeafId exists anywhere downstream of the current testing node
            const isTargetDescendant = (node, targetId) => {
                if (node.id === targetId) return true;
                if (node.children) {
                    return node.children.some(child => isTargetDescendant(child, targetId));
                }
                return false;
            };

            // --- ACTION HANDLERS ---
            const handleChoice = (childNode) => {
                // If a practice specimen is selected, ACTIVATE QUIZ ENGINE
                if (selectedSpecimen) {
                    const isCorrectPath = isTargetDescendant(childNode, selectedSpecimen.targetId);
                    
                    if (!isCorrectPath) {
                        setFeedback({ message: `Incorrect Observation! Look closely at the ${selectedSpecimen.name}. Does it really have that trait?`, type: "error" });
                        return; // Block progression
                    }
                }

                // If correct or free exploration mode:
                setFeedback({ message: "Correct observation. Proceed to the next trait.", type: "success" });
                setHistory([...history, currentNode.id]);
                setCurrentNode(childNode);
            };

            const handleReset = () => {
                setCurrentNode(INITIAL_KEY);
                setHistory([]);
                setFeedback({ message: "Observe the specimen and select a path.", type: "info" });
            };

            const clearSpecimen = () => {
                setUploadedImage(null);
                setSelectedSpecimen(null);
                if (fileInputRef.current) fileInputRef.current.value = "";
                handleReset();
            };

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const url = URL.createObjectURL(file);
                    setUploadedImage(url);
                    setSelectedSpecimen(null); // Clear practice selection to disable quiz mode
                    handleReset();
                    setFeedback({ message: "Free Exploration Mode: Trace your custom image.", type: "info" });
                }
            };

            const handleSampleSelect = (sample) => {
                setUploadedImage(null);
                setSelectedSpecimen(sample);
                handleReset();
                setFeedback({ message: `Quiz Mode Active! Identify the ${sample.name}.`, type: "info" });
            };

            const isLeaf = !currentNode.children || currentNode.children.length === 0;

            return (
                <div className="w-full h-full flex flex-col relative flex-1">
                    {/* Header */}
                    <header className="p-4 md:px-8 border-b border-slate-700 flex flex-col md:flex-row justify-between items-center bg-slate-800/80 backdrop-blur-sm z-10 shrink-0 gap-4 md:gap-0">
                        <div>
                            <h1 className="text-2xl md:text-3xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-teal-400 flex items-center gap-3">
                                <i className="fa-solid fa-code-branch text-emerald-400"></i> Dichotomous Key Simulator
                            </h1>
                            <p className="text-[10px] md:text-xs font-medium text-slate-400 uppercase tracking-widest mt-1">Binary Decision Tree & Taxonomic Identification</p>
                        </div>
                        
                        {/* Status Dashboard */}
                        <div className="flex gap-4 md:gap-6 bg-slate-950 p-2 px-4 md:px-6 rounded-xl border border-slate-700 shadow-inner items-center">
                            <div className="text-center flex flex-col items-center">
                                <div className="text-xl md:text-2xl font-mono font-black text-emerald-400">{history.length}</div>
                                <div className="text-[9px] md:text-[10px] text-slate-500 uppercase tracking-wider font-bold mt-1">Depth Level</div>
                            </div>
                            <div className="w-px bg-slate-700 h-8"></div>
                            <div className="text-center flex flex-col items-center min-w-[80px]">
                                <div className={`text-sm md:text-base font-black ${isLeaf ? 'text-teal-400' : 'text-amber-400'} uppercase tracking-widest mt-1`}>
                                    {isLeaf ? 'Identified' : 'Analyzing'}
                                </div>
                                <div className="text-[9px] md:text-[10px] text-slate-500 uppercase tracking-wider font-bold mt-1">Status</div>
                            </div>
                        </div>
                    </header>

                    {/* Main Workspace (Stacked on small screens, side-by-side on large) */}
                    <main className="flex flex-col lg:flex-row flex-1 overflow-hidden relative z-0">
                        
                        {/* Left Column: Specimen & Interaction */}
                        <aside className="w-full lg:w-[420px] flex flex-col gap-4 p-4 shrink-0 overflow-y-auto bg-slate-800/30 border-r border-slate-700 z-20">
                            
                            {/* Specimen View Panel */}
                            <div className="bg-slate-800 rounded-xl border border-slate-700 shadow-lg relative overflow-hidden flex flex-col shrink-0 group">
                                <div className="p-3 border-b border-slate-700 flex justify-between items-center bg-slate-900/50">
                                    <h3 className="text-[10px] uppercase tracking-widest text-slate-400 font-bold"><i className="fa-solid fa-microscope text-cyan-400"></i> Reference Specimen</h3>
                                    
                                    <div className="flex gap-2">
                                        {(uploadedImage || selectedSpecimen) && (
                                            <button onClick={clearSpecimen} className="text-[10px] text-rose-400 hover:text-rose-300 px-2 py-1 font-bold transition-colors">
                                                Clear
                                            </button>
                                        )}
                                        <button 
                                            onClick={() => fileInputRef.current.click()}
                                            className="text-[10px] bg-slate-700 hover:bg-slate-600 text-white px-2 py-1 rounded font-bold transition-colors"
                                        >
                                            Upload Image
                                        </button>
                                        <input 
                                            type="file" accept="image/*" className="hidden" 
                                            ref={fileInputRef} onChange={handleImageUpload}
                                        />
                                    </div>
                                </div>
                                
                                <div className="relative h-44 bg-slate-950 flex items-center justify-center overflow-hidden">
                                    {uploadedImage ? (
                                        <img src={uploadedImage} alt="Specimen" className="object-cover w-full h-full opacity-80" />
                                    ) : selectedSpecimen ? (
                                        <div className="text-[80px] drop-shadow-2xl">{selectedSpecimen.emoji}</div>
                                    ) : (
                                        <div className="text-center text-slate-600 flex flex-col items-center">
                                            <i className="fa-solid fa-image text-3xl mb-2"></i>
                                            <span className="text-xs font-bold uppercase tracking-widest">No Specimen Selected</span>
                                        </div>
                                    )}
                                    <div className="absolute bottom-0 left-0 w-full h-1/3 upload-overlay pointer-events-none"></div>
                                </div>
                                
                                {/* Quick Sample Specimens (The Quiz Bank) */}
                                <div className="p-3 bg-slate-900/80 border-t border-slate-700 flex flex-col justify-between gap-2">
                                    <span className="text-[9px] text-emerald-400 font-bold uppercase tracking-wider pl-1">Practice Quiz Specimens:</span>
                                    <div className="flex flex-wrap gap-2">
                                        {SAMPLE_SPECIMENS.map(sample => (
                                            <button 
                                                key={sample.id}
                                                onClick={() => handleSampleSelect(sample)}
                                                className={`w-9 h-9 rounded flex items-center justify-center text-lg transition-transform hover:scale-110 ${selectedSpecimen?.id === sample.id ? 'bg-emerald-600 border-emerald-400 border-2' : 'bg-slate-800 border-slate-600 border hover:bg-slate-700'}`}
                                                title={`Test identifying a ${sample.name}`}
                                            >
                                                {sample.emoji}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            {/* Identification Interface & Feedback */}
                            <div className="bg-slate-800 rounded-xl p-5 border border-slate-700 shadow-inner flex flex-col gap-4 flex-1 relative overflow-hidden">
                                <div className={`absolute top-0 left-0 w-1 h-full transition-colors duration-500 ${isLeaf ? 'bg-teal-500' : 'bg-emerald-500'}`}></div>
                                
                                <h3 className="text-[10px] uppercase tracking-widest text-slate-400 font-bold border-b border-slate-700 pb-2">
                                    Morphological Node Analysis
                                </h3>

                                {/* Dynamic Feedback Banner */}
                                <div className={`px-3 py-2 rounded-lg text-[11px] font-bold border transition-colors ${
                                    feedback.type === 'error' ? 'bg-red-950/50 border-red-500/50 text-red-400 animate-shake' : 
                                    feedback.type === 'success' ? 'bg-emerald-950/50 border-emerald-500/50 text-emerald-400' : 
                                    'bg-slate-900 border-slate-700 text-slate-300'
                                }`}>
                                    {feedback.type === 'error' && <i className="fa-solid fa-triangle-exclamation mr-1.5"></i>}
                                    {feedback.type === 'success' && <i className="fa-solid fa-check mr-1.5"></i>}
                                    {feedback.message}
                                </div>

                                {!isLeaf ? (
                                    // Question Node
                                    <div className="flex flex-col flex-1 animate-fade-in mt-2">
                                        <div className="flex items-center gap-3 mb-4">
                                            <div className="w-10 h-10 rounded-full bg-emerald-500/20 border-2 border-emerald-400 flex justify-center items-center shrink-0">
                                                <i className="fa-solid fa-magnifying-glass text-emerald-400"></i>
                                            </div>
                                            <h2 className="text-lg font-black text-white leading-tight">
                                                {currentNode.question}
                                            </h2>
                                        </div>

                                        <div className="flex flex-col gap-3 mt-auto">
                                            {currentNode.children.map((child, idx) => (
                                                <button 
                                                    key={child.id}
                                                    onClick={() => handleChoice(child)}
                                                    className="w-full bg-slate-900 hover:bg-slate-700 border border-slate-600 hover:border-emerald-500 text-left p-4 rounded-xl transition-all group flex items-center justify-between shadow-sm active:scale-95"
                                                >
                                                    <div>
                                                        <div className="text-sm font-bold text-slate-200 group-hover:text-emerald-400 transition-colors">{child.trait}</div>
                                                        <div className="text-[10px] text-slate-500 mt-1 uppercase tracking-wider">Branch {idx === 0 ? 'A' : 'B'}</div>
                                                    </div>
                                                    <i className="fa-solid fa-chevron-right text-slate-600 group-hover:text-emerald-500 transition-colors"></i>
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                ) : (
                                    // Result Node (Leaf)
                                    <div className="flex flex-col flex-1 animate-fade-in text-center items-center justify-center py-4">
                                        <div className="w-20 h-20 rounded-full bg-teal-500/20 border-4 border-teal-400 flex justify-center items-center mb-4 shadow-[0_0_30px_rgba(45,212,191,0.3)]">
                                            <i className={`fa-solid ${currentNode.icon} text-3xl text-teal-400`}></i>
                                        </div>
                                        <h3 className="text-xs font-bold text-teal-400 uppercase tracking-widest mb-1">Species Identified</h3>
                                        <h2 className="text-2xl font-black text-white mb-2">{currentNode.label}</h2>
                                        <div className="bg-slate-950 border border-slate-700 px-4 py-2 rounded-lg font-mono text-sm text-slate-300 mb-4 inline-block">
                                            {currentNode.result}
                                        </div>
                                        <p className="text-xs text-slate-400 leading-relaxed max-w-[280px]">
                                            {currentNode.desc}
                                        </p>
                                    </div>
                                )}

                                {/* Reset Controls */}
                                <div className="mt-2 border-t border-slate-700 pt-4 flex gap-2">
                                    <button 
                                        onClick={handleReset} 
                                        className="w-full bg-slate-700 hover:bg-slate-600 text-white py-2 rounded-lg text-xs font-bold transition-all border border-slate-500 flex justify-center items-center gap-2"
                                    >
                                        <i className="fa-solid fa-rotate-left"></i> Restart Key
                                    </button>
                                </div>
                            </div>
                        </aside>

                        {/* Right Column: D3.js Tree Canvas */}
                        <section className="flex-1 p-0 lg:p-4 bg-slate-950 flex flex-col relative overflow-hidden min-h-[500px]">
                            <div className="w-full h-full lg:border border-slate-700 shadow-inner lg:rounded-xl relative overflow-hidden bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black">
                                
                                {/* D3 Graph injected via React Component */}
                                <D3TreeVisualization data={INITIAL_KEY} history={history} currentNodeId={currentNode.id} />
                                
                                {/* Legend Overlay */}
                                <div className="absolute bottom-6 left-6 z-10 bg-slate-900/90 border border-slate-700 p-3 rounded-lg backdrop-blur-sm pointer-events-none shadow-lg hidden md:block">
                                    <h4 className="text-[9px] uppercase font-bold text-slate-400 mb-2 border-b border-slate-700 pb-1">Taxonomic Tree Legend</h4>
                                    <div className="flex flex-col gap-1.5 text-[10px] font-bold">
                                        <div className="flex items-center gap-2"><div className="w-3 h-3 rounded-full bg-[#1e293b] border border-[#64748b]"></div> <span className="text-slate-400">Unexplored Trait Node</span></div>
                                        <div className="flex items-center gap-2"><div className="w-3 h-3 rounded-full bg-[#064e3b] border border-[#10b981]"></div> <span className="text-emerald-500">Confirmed Trait Path</span></div>
                                        <div className="flex items-center gap-2"><div className="w-3 h-3 rounded-full bg-[#10b981] border border-[#34d399] shadow-[0_0_5px_#10b981]"></div> <span className="text-white">Current Focus Node</span></div>
                                    </div>
                                </div>

                            </div>
                        </section>
                    </main>
                </div>
            );
        };

        // Render the React app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
