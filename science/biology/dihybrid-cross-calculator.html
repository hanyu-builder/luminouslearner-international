<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Dihybrid Cross Simulator</title>
    <meta name="description" content="Interactive biology virtual lab for Dihybrid Crosses and Independent Assortment.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM (UMD versions for browser) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (Standalone version to compile JSX in the browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            background-color: #0F172A; /* Deep Slate */
            color: #F8FAFC;
            margin: 0;
            padding: 0;
        }
        /* Custom Scrollbar for better UI inside WordPress iFrames */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748B; }
    </style>
</head>
<body class="p-2 sm:p-4 flex items-center justify-center min-h-screen bg-[#0F172A]">
    
    <!-- React Mount Point -->
    <div id="root" class="w-full max-w-[1450px]"></div>

    <!-- React Application Code -->
    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        // --- INLINE ICONS (Replacing lucide-react for standalone HTML compatibility) ---
        const DnaIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M2 15c6.667-6 13.333 0 20-6"/><path d="M9 22c1.798-1.998 2.518-3.995 2.808-5.993"/><path d="M15 2c-1.798 1.998-2.518 3.995-2.808 5.993"/><path d="m17 6-2.5-2.5"/><path d="m14 8-1-1"/><path d="m7 18 2.5 2.5"/><path d="m3.5 14.5.5.5"/><path d="m20 9 .5.5"/><path d="m6.5 12.5 2 2"/><path d="m11.5 16.5 2 2"/><path d="m10.5 7.5 2 2"/><path d="m15.5 10.5 2 2"/></svg>
        );
        const BeakerIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M4.5 3h15"/><path d="M6 3v16a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V3"/><path d="M6 14h12"/></svg>
        );
        const SearchIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        );
        const RotateCcwIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        );
        const CheckCircleIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        );
        const XCircleIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
        );

        // --- GENETIC PRESETS ---
        const PRESETS = {
            peas: {
                name: "Mendel's Garden Peas",
                trait1: {
                    name: "Seed Shape",
                    domSymbol: "R", recSymbol: "r",
                    domName: "Round", recName: "Wrinkled"
                },
                trait2: {
                    name: "Seed Color",
                    domSymbol: "Y", recSymbol: "y",
                    domName: "Yellow", recName: "Green"
                },
                renderOffspring: (pheno) => {
                    const isYellow = pheno.trait2 === "Yellow";
                    const isRound = pheno.trait1 === "Round";
                    const color = isYellow ? "#FACC15" : "#4ADE80";
                    const stroke = isYellow ? "#CA8A04" : "#16A34A";
                    
                    return (
                        <svg className="w-12 h-12" viewBox="0 0 100 100">
                            {isRound ? (
                                <circle cx="50" cy="50" r="32" fill={color} stroke={stroke} strokeWidth="6" />
                            ) : (
                                <path d="M50 15 C55 25, 65 20, 70 30 C80 35, 75 45, 85 50 C75 55, 80 65, 70 70 C65 80, 55 75, 50 85 C45 75, 35 80, 30 70 C20 65, 25 55, 15 50 C25 45, 20 35, 30 30 C35 20, 45 25, 50 15 Z" fill={color} stroke={stroke} strokeWidth="6" />
                            )}
                            <circle cx="40" cy="40" r="6" fill="#FFFFFF" opacity="0.4" />
                        </svg>
                    );
                }
            },
            dragons: {
                name: "Fantasy Dragon Hatchery",
                trait1: {
                    name: "Breath Type",
                    domSymbol: "B", recSymbol: "b",
                    domName: "Fire-Breathing", recName: "Ice-Breathing"
                },
                trait2: {
                    name: "Wings",
                    domSymbol: "W", recSymbol: "w",
                    domName: "Winged", recName: "Wingless"
                },
                renderOffspring: (pheno) => {
                    const isFire = pheno.trait1 === "Fire-Breathing";
                    const isWinged = pheno.trait2 === "Winged";
                    const color = isFire ? "#EF4444" : "#38BDF8";
                    
                    return (
                        <svg className="w-12 h-12" viewBox="0 0 100 100">
                            {isWinged && (
                                <g fill={isFire ? "#B91C1C" : "#0284C7"}>
                                    <path d="M 25,50 C 10,25 5,45 15,60 C 25,55 20,50 25,50 Z" />
                                    <path d="M 75,50 C 90,25 95,45 85,60 C 75,55 80,50 75,50 Z" />
                                </g>
                            )}
                            <path d="M35,30 L65,30 L70,55 L50,75 L30,55 Z" fill={color} stroke="#0F172A" strokeWidth="4" />
                            <circle cx="42" cy="45" r="4" fill="#FFFFFF" />
                            <circle cx="58" cy="45" r="4" fill="#FFFFFF" />
                            <circle cx="46" cy="65" r="2" fill="#000" />
                            <circle cx="54" cy="65" r="2" fill="#000" />
                        </svg>
                    );
                }
            },
            superheroes: {
                name: "Superhero Training Academy",
                trait1: {
                    name: "Power Set",
                    domSymbol: "S", recSymbol: "s",
                    domName: "Super Strength", recName: "Normal Strength"
                },
                trait2: {
                    name: "Mobility",
                    domSymbol: "F", recSymbol: "f",
                    domName: "Flight", recName: "Grounded"
                },
                renderOffspring: (pheno) => {
                    const isStrong = pheno.trait1 === "Super Strength";
                    const isFlyer = pheno.trait2 === "Flight";
                    
                    return (
                        <svg className="w-12 h-12" viewBox="0 0 100 100">
                            {isFlyer && (
                                <path d="M 25,25 L 15,80 L 50,70 L 85,80 L 75,25 Z" fill="#EF4444" opacity="0.9" />
                            )}
                            <circle cx="50" cy="45" r="20" fill="#3B82F6" stroke="#1D4ED8" strokeWidth="4" />
                            <polygon points="50,35 60,43 50,55 40,43" fill="#FACC15" />
                            {isStrong && (
                                <g fill="#3B82F6" stroke="#1D4ED8" strokeWidth="3">
                                    <path d="M 30,45 C 15,40 20,60 30,55 Z" />
                                    <path d="M 70,45 C 85,40 80,60 70,55 Z" />
                                </g>
                            )}
                        </svg>
                    );
                }
            }
        };

        // --- PUZZLE/CHALLENGE SETS ---
        const CHALLENGES = [
            {
                targetRatio: "9 : 3 : 3 : 1",
                desc: "Achieve the classic Mendelian dihybrid phenotypic ratio (Heterozygous cross).",
            },
            {
                targetRatio: "1 : 1 : 1 : 1",
                desc: "Perform a test cross that yields all four phenotypes in equal proportions.",
            },
            {
                targetRatio: "0 : 0 : 0 : 1",
                desc: "Cross two parents to produce offspring that express BOTH recessive traits 100% of the time.",
            }
        ];

        // Mathematical GCD to simplify ratios strictly
        const gcd = (a, b) => b === 0 ? a : gcd(b, a % b);

        function App() {
            const [activePresetKey, setActivePresetKey] = useState("peas");
            const [mode, setMode] = useState("calculator"); // "calculator" or "detective"
            const [activeChallengeIdx, setActiveChallengeIdx] = useState(0);
            const [puzzleSolved, setPuzzleSolved] = useState(null);

            const [parent1, setParent1] = useState({ t1_1: "R", t1_2: "r", t2_1: "Y", t2_2: "y" });
            const [parent2, setParent2] = useState({ t1_1: "R", t1_2: "r", t2_1: "Y", t2_2: "y" });

            const [selectedCell, setSelectedCell] = useState(null);

            const activePreset = PRESETS[activePresetKey];

            // Sync state whenever the active preset changes
            useEffect(() => {
                const keys = PRESETS[activePresetKey];
                setParent1({
                    t1_1: keys.trait1.domSymbol, t1_2: keys.trait1.recSymbol,
                    t2_1: keys.trait2.domSymbol, t2_2: keys.trait2.recSymbol
                });
                setParent2({
                    t1_1: keys.trait1.domSymbol, t1_2: keys.trait1.recSymbol,
                    t2_1: keys.trait2.domSymbol, t2_2: keys.trait2.recSymbol
                });
                setSelectedCell(null);
                setPuzzleSolved(null);
            }, [activePresetKey]);

            // Generate 4 Gametes (FOIL method)
            const getGametes = (p) => [
                p.t1_1 + p.t2_1,
                p.t1_1 + p.t2_2,
                p.t1_2 + p.t2_1,
                p.t1_2 + p.t2_2
            ];

            const p1Gametes = useMemo(() => getGametes(parent1), [parent1]);
            const p2Gametes = useMemo(() => getGametes(parent2), [parent2]);

            // Combine Gametes and correctly sort dominant alleles first
            const combineGametes = (g1, g2) => {
                const t1 = [g1[0], g2[0]].sort().join('');
                const t2 = [g1[1], g2[1]].sort().join('');
                return t1 + t2;
            };

            const getPhenotype = (genotype) => {
                const isT1Dom = genotype[0] === activePreset.trait1.domSymbol || genotype[1] === activePreset.trait1.domSymbol;
                const isT2Dom = genotype[2] === activePreset.trait2.domSymbol || genotype[3] === activePreset.trait2.domSymbol;

                return {
                    trait1: isT1Dom ? activePreset.trait1.domName : activePreset.trait1.recName,
                    trait2: isT2Dom ? activePreset.trait2.domName : activePreset.trait2.recName,
                    isT1Dom,
                    isT2Dom
                };
            };

            const gridCells = useMemo(() => {
                const cells = [];
                p2Gametes.forEach((g2) => {
                    p1Gametes.forEach((g1) => {
                        const genotype = combineGametes(g1, g2);
                        const phenotype = getPhenotype(genotype);
                        cells.push({ g1, g2, genotype, phenotype });
                    });
                });
                return cells;
            }, [p1Gametes, p2Gametes, activePreset]);

            // Calculate Strict Biological Ratio: Dom/Dom : Dom/Rec : Rec/Dom : Rec/Rec
            const exactRatioStats = useMemo(() => {
                const buckets = [0, 0, 0, 0]; // DD, DR, RD, RR
                
                gridCells.forEach(c => {
                    const p = c.phenotype;
                    if (p.isT1Dom && p.isT2Dom) buckets[0]++;
                    else if (p.isT1Dom && !p.isT2Dom) buckets[1]++;
                    else if (!p.isT1Dom && p.isT2Dom) buckets[2]++;
                    else buckets[3]++;
                });

                const nonZeros = buckets.filter(c => c > 0);
                const divisor = nonZeros.length > 0 ? nonZeros.reduce((acc, val) => gcd(acc, val)) : 1;
                const simplifiedRatio = buckets.map(c => c / divisor).join(' : ');

                return { buckets, simplifiedRatio };
            }, [gridCells]);

            // Breakdown for the UI list
            const phenotypeSummary = useMemo(() => {
                const counts = {};
                gridCells.forEach((c) => {
                    const key = `${c.phenotype.trait1} & ${c.phenotype.trait2}`;
                    if (!counts[key]) {
                        counts[key] = {
                            count: 0,
                            trait1: c.phenotype.trait1,
                            trait2: c.phenotype.trait2,
                            isT1Dom: c.phenotype.isT1Dom,
                            isT2Dom: c.phenotype.isT2Dom
                        };
                    }
                    counts[key].count++;
                });
                return Object.values(counts).sort((a, b) => b.count - a.count);
            }, [gridCells]);

            const genotypeSummary = useMemo(() => {
                const counts = {};
                gridCells.forEach((c) => {
                    if (!counts[c.genotype]) counts[c.genotype] = 0;
                    counts[c.genotype]++;
                });
                return Object.entries(counts).sort((a, b) => b[1] - a[1]);
            }, [gridCells]);

            const handleParentAlleleChange = (parentNum, alleleKey, value) => {
                setPuzzleSolved(null);
                if (parentNum === 1) {
                    setParent1(prev => ({ ...prev, [alleleKey]: value }));
                } else {
                    setParent2(prev => ({ ...prev, [alleleKey]: value }));
                }
            };

            const verifyChallenge = () => {
                const challenge = CHALLENGES[activeChallengeIdx];
                if (exactRatioStats.simplifiedRatio === challenge.targetRatio) {
                    setPuzzleSolved(true);
                } else {
                    setPuzzleSolved(false);
                }
            };

            return (
                <div className="w-full min-h-[850px] bg-[#0F172A] text-slate-100 rounded-2xl shadow-2xl flex flex-col md:flex-row border border-slate-700 overflow-hidden relative">
                    
                    {/* LEFT SIDEBAR */}
                    <aside className="w-full md:w-[420px] bg-slate-800/80 backdrop-blur border-r border-slate-700 p-6 flex flex-col h-full overflow-y-auto shrink-0 z-10">
                        <div className="mb-5">
                            <h1 className="text-3xl font-extrabold text-amber-400 mb-1 flex items-center gap-3">
                                <DnaIcon className="w-8 h-8" /> Dihybrid Cross
                            </h1>
                            <p className="text-xs text-slate-400 uppercase tracking-widest">Independent Assortment Lab</p>
                        </div>

                        {/* Dynamic Preset / Lab Selector */}
                        <div className="mb-6">
                            <label className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 block">Experimental Model</label>
                            <select 
                                value={activePresetKey} 
                                onChange={(e) => setActivePresetKey(e.target.value)}
                                className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-slate-200 outline-none focus:ring-2 focus:ring-amber-500 cursor-pointer"
                            >
                                <option value="peas">Mendel's Pea Garden (Classic)</option>
                                <option value="dragons">Fantasy Dragon Hatchery</option>
                                <option value="superheroes">Superhero Academy</option>
                            </select>
                        </div>

                        {/* Mode Switcher */}
                        <div className="grid grid-cols-2 gap-2 mb-6 bg-slate-900/60 p-1 rounded-xl border border-slate-800 text-xs">
                            <button 
                                onClick={() => { setMode("calculator"); setPuzzleSolved(null); }}
                                className={`py-2 rounded-lg font-bold transition-all flex items-center justify-center gap-2 ${mode === 'calculator' ? 'text-white bg-slate-800 border border-slate-700 shadow-md' : 'text-slate-400 hover:text-white'}`}
                            >
                                <BeakerIcon className="w-4 h-4" /> Explorer Lab
                            </button>
                            <button 
                                onClick={() => { setMode("detective"); setPuzzleSolved(null); }}
                                className={`py-2 rounded-lg font-bold transition-all flex items-center justify-center gap-2 ${mode === 'detective' ? 'text-white bg-slate-800 border border-slate-700 shadow-md' : 'text-slate-400 hover:text-white'}`}
                            >
                                <SearchIcon className="w-4 h-4" /> Ratio Detective
                            </button>
                        </div>

                        {/* GAME / CHALLENGE PANEL */}
                        {mode === 'detective' && (
                            <div className="mb-6 border-l-4 border-amber-500 bg-amber-500/10 p-4 rounded-r-xl border border-amber-500/20 shadow-inner">
                                <div className="flex justify-between items-center mb-1">
                                    <span className="text-[10px] font-bold text-amber-400 uppercase tracking-widest">Detective Challenge</span>
                                    <div className="flex gap-1">
                                        {CHALLENGES.map((_, idx) => (
                                            <button 
                                                key={idx} 
                                                onClick={() => { setActiveChallengeIdx(idx); setPuzzleSolved(null); }}
                                                className={`w-6 h-6 rounded-full text-[11px] font-bold flex items-center justify-center transition-colors ${activeChallengeIdx === idx ? 'bg-amber-500 text-slate-950' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'}`}
                                            >
                                                {idx + 1}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                <h4 className="text-sm font-extrabold text-white mt-2">Target Ratio: {CHALLENGES[activeChallengeIdx].targetRatio}</h4>
                                <p className="text-[10px] text-slate-400 mt-0.5 font-mono tracking-tighter">(DomDom : DomRec : RecDom : RecRec)</p>
                                <p className="text-xs text-slate-300 mt-2 leading-relaxed">{CHALLENGES[activeChallengeIdx].desc}</p>
                                
                                {puzzleSolved === true && (
                                    <div className="mt-3 bg-emerald-950/80 border border-emerald-500/40 text-emerald-400 p-2.5 rounded-lg text-xs font-bold flex items-center justify-center gap-2">
                                        <CheckCircleIcon className="w-4 h-4" /> Solved! Excellent Detective Work!
                                    </div>
                                )}
                                {puzzleSolved === false && (
                                    <div className="mt-3 bg-rose-950/80 border border-rose-500/40 text-rose-400 p-2.5 rounded-lg text-xs font-bold flex items-center justify-center gap-2">
                                        <XCircleIcon className="w-4 h-4" /> Not quite right. Keep adjusting alleles!
                                    </div>
                                )}
                            </div>
                        )}

                        {/* PARENT GENOTYPE SELECTOR */}
                        <div className="space-y-4 flex-grow">
                            <label className="text-xs font-bold text-slate-400 uppercase tracking-wider block border-b border-slate-700 pb-2">Parent Allele Assembly</label>
                            
                            {/* Parent 1 */}
                            <div className="bg-slate-900/40 p-4 rounded-xl border border-slate-700">
                                <h3 className="text-sm font-bold text-slate-200 mb-3 flex items-center gap-2">
                                    <span className="w-2 h-2 rounded-full bg-cyan-400"></span> Parent 1 Genotype: 
                                    <span className="text-cyan-400 font-mono text-base font-extrabold ml-1 bg-slate-950 px-2.5 py-0.5 rounded border border-slate-800">
                                        {parent1.t1_1}{parent1.t1_2}{parent1.t2_1}{parent1.t2_2}
                                    </span>
                                </h3>
                                <div className="grid grid-cols-2 gap-4 text-xs">
                                    <div>
                                        <span className="text-slate-400 block mb-1 truncate">{activePreset.trait1.name}</span>
                                        <div className="flex gap-1.5">
                                            <select value={parent1.t1_1} onChange={(e) => handleParentAlleleChange(1, 't1_1', e.target.value)} className="w-full bg-slate-800 p-2 rounded-lg text-white font-mono border border-slate-700 outline-none focus:border-cyan-500">
                                                <option value={activePreset.trait1.domSymbol}>{activePreset.trait1.domSymbol}</option>
                                                <option value={activePreset.trait1.recSymbol}>{activePreset.trait1.recSymbol}</option>
                                            </select>
                                            <select value={parent1.t1_2} onChange={(e) => handleParentAlleleChange(1, 't1_2', e.target.value)} className="w-full bg-slate-800 p-2 rounded-lg text-white font-mono border border-slate-700 outline-none focus:border-cyan-500">
                                                <option value={activePreset.trait1.domSymbol}>{activePreset.trait1.domSymbol}</option>
                                                <option value={activePreset.trait1.recSymbol}>{activePreset.trait1.recSymbol}</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div>
                                        <span className="text-slate-400 block mb-1 truncate">{activePreset.trait2.name}</span>
                                        <div className="flex gap-1.5">
                                            <select value={parent1.t2_1} onChange={(e) => handleParentAlleleChange(1, 't2_1', e.target.value)} className="w-full bg-slate-800 p-2 rounded-lg text-white font-mono border border-slate-700 outline-none focus:border-cyan-500">
                                                <option value={activePreset.trait2.domSymbol}>{activePreset.trait2.domSymbol}</option>
                                                <option value={activePreset.trait2.recSymbol}>{activePreset.trait2.recSymbol}</option>
                                            </select>
                                            <select value={parent1.t2_2} onChange={(e) => handleParentAlleleChange(1, 't2_2', e.target.value)} className="w-full bg-slate-800 p-2 rounded-lg text-white font-mono border border-slate-700 outline-none focus:border-cyan-500">
                                                <option value={activePreset.trait2.domSymbol}>{activePreset.trait2.domSymbol}</option>
                                                <option value={activePreset.trait2.recSymbol}>{activePreset.trait2.recSymbol}</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Parent 2 */}
                            <div className="bg-slate-900/40 p-4 rounded-xl border border-slate-700">
                                <h3 className="text-sm font-bold text-slate-200 mb-3 flex items-center gap-2">
                                    <span className="w-2 h-2 rounded-full bg-pink-400"></span> Parent 2 Genotype: 
                                    <span className="text-pink-400 font-mono text-base font-extrabold ml-1 bg-slate-950 px-2.5 py-0.5 rounded border border-slate-800">
                                        {parent2.t1_1}{parent2.t1_2}{parent2.t2_1}{parent2.t2_2}
                                    </span>
                                </h3>
                                <div className="grid grid-cols-2 gap-4 text-xs">
                                    <div>
                                        <span className="text-slate-400 block mb-1 truncate">{activePreset.trait1.name}</span>
                                        <div className="flex gap-1.5">
                                            <select value={parent2.t1_1} onChange={(e) => handleParentAlleleChange(2, 't1_1', e.target.value)} className="w-full bg-slate-800 p-2 rounded-lg text-white font-mono border border-slate-700 outline-none focus:border-pink-500">
                                                <option value={activePreset.trait1.domSymbol}>{activePreset.trait1.domSymbol}</option>
                                                <option value={activePreset.trait1.recSymbol}>{activePreset.trait1.recSymbol}</option>
                                            </select>
                                            <select value={parent2.t1_2} onChange={(e) => handleParentAlleleChange(2, 't1_2', e.target.value)} className="w-full bg-slate-800 p-2 rounded-lg text-white font-mono border border-slate-700 outline-none focus:border-pink-500">
                                                <option value={activePreset.trait1.domSymbol}>{activePreset.trait1.domSymbol}</option>
                                                <option value={activePreset.trait1.recSymbol}>{activePreset.trait1.recSymbol}</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div>
                                        <span className="text-slate-400 block mb-1 truncate">{activePreset.trait2.name}</span>
                                        <div className="flex gap-1.5">
                                            <select value={parent2.t2_1} onChange={(e) => handleParentAlleleChange(2, 't2_1', e.target.value)} className="w-full bg-slate-800 p-2 rounded-lg text-white font-mono border border-slate-700 outline-none focus:border-pink-500">
                                                <option value={activePreset.trait2.domSymbol}>{activePreset.trait2.domSymbol}</option>
                                                <option value={activePreset.trait2.recSymbol}>{activePreset.trait2.recSymbol}</option>
                                            </select>
                                            <select value={parent2.t2_2} onChange={(e) => handleParentAlleleChange(2, 't2_2', e.target.value)} className="w-full bg-slate-800 p-2 rounded-lg text-white font-mono border border-slate-700 outline-none focus:border-pink-500">
                                                <option value={activePreset.trait2.domSymbol}>{activePreset.trait2.domSymbol}</option>
                                                <option value={activePreset.trait2.recSymbol}>{activePreset.trait2.recSymbol}</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Action Button for Detective Verification */}
                        {mode === 'detective' && (
                            <button 
                                onClick={verifyChallenge}
                                className="w-full mt-6 py-3.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold rounded-xl transition-all shadow-lg shadow-amber-900/20 active:scale-95 flex items-center justify-center gap-2"
                            >
                                Verify Detective Hypothesis
                            </button>
                        )}
                    </aside>

                    {/* RIGHT VIEWPORT: Interactive Punnett Grid & Live Ratios */}
                    <section className="flex-grow flex flex-col p-6 overflow-y-auto">
                        
                        {/* Header Summary */}
                        <div className="flex justify-between items-end mb-6">
                            <div>
                                <h2 className="text-2xl font-bold text-white tracking-wide">
                                    Dihybrid Cross: <span className="text-cyan-400">{parent1.t1_1}{parent1.t1_2}{parent1.t2_1}{parent1.t2_2}</span> × <span className="text-pink-400">{parent2.t1_1}{parent2.t1_2}{parent2.t2_1}{parent2.t2_2}</span>
                                </h2>
                                <p className="text-sm text-slate-400 mt-1">Independent gamete sorting forms a 16-combination genetic profile.</p>
                            </div>
                            <div className="bg-slate-800 px-4 py-2 rounded-xl border border-slate-700 flex flex-col items-end">
                                <div className="text-[10px] text-slate-400 font-mono tracking-tighter uppercase mb-1">DomDom : DomRec : RecDom : RecRec</div>
                                <div className="text-sm font-semibold text-slate-300 flex items-center gap-2">
                                    Strict Ratio: <span className="text-amber-400 font-mono text-lg">{exactRatioStats.simplifiedRatio}</span>
                                </div>
                            </div>
                        </div>

                        {/* Dynamic Layout: Punnett Grid alongside Detail/Summary Column */}
                        <div className="grid grid-cols-1 xl:grid-cols-12 gap-6 items-start">
                            
                            {/* Punnett Square Matrix (4x4) */}
                            <div className="xl:col-span-7 bg-slate-900/60 p-4 rounded-2xl border border-slate-800">
                                <div className="grid grid-cols-5 gap-2 text-center items-center">
                                    
                                    {/* Top Left corner (Blank or Cross logo) */}
                                    <div className="text-sm font-bold text-slate-500">P1 \ P2</div>
                                    
                                    {/* Column Headers (Parent 1 Gametes) */}
                                    {p1Gametes.map((g1, idx) => (
                                        <div key={idx} className="bg-cyan-950/40 border border-cyan-800/40 py-3 rounded-lg text-sm font-mono font-extrabold text-cyan-300 shadow-inner">
                                            {g1}
                                        </div>
                                    ))}

                                    {/* Rows */}
                                    {p2Gametes.map((g2, rIdx) => (
                                        <React.Fragment key={rIdx}>
                                            {/* Row Header (Parent 2 Gamete) */}
                                            <div className="bg-pink-950/40 border border-pink-800/40 py-6 rounded-lg text-sm font-mono font-extrabold text-pink-300 shadow-inner">
                                                {g2}
                                            </div>

                                            {/* 4 Cells for this row */}
                                            {[0, 1, 2, 3].map((cIdx) => {
                                                const cellIdx = rIdx * 4 + cIdx;
                                                const cell = gridCells[cellIdx];
                                                const isSelected = selectedCell === cellIdx;

                                                return (
                                                    <button 
                                                        key={cIdx} 
                                                        onClick={() => setSelectedCell(cellIdx)}
                                                        className={`aspect-square rounded-xl border flex flex-col items-center justify-center p-2 transition-all ${
                                                            isSelected 
                                                                ? 'border-amber-400 bg-amber-500/10 shadow-lg shadow-amber-500/20 scale-105 z-10' 
                                                                : 'border-slate-700/50 hover:border-slate-500 bg-slate-800/80 hover:bg-slate-700'
                                                        }`}
                                                    >
                                                        {/* Dynamic Render based on active Presets */}
                                                        {activePreset.renderOffspring(cell.phenotype)}
                                                        
                                                        <span className="text-xs font-mono font-bold text-slate-200 mt-2">
                                                            {cell.genotype}
                                                        </span>
                                                    </button>
                                                );
                                            })}
                                        </React.Fragment>
                                    ))}

                                </div>
                            </div>

                            {/* Right Column: Detailed Inspector and Ratio Breakdowns */}
                            <div className="xl:col-span-5 space-y-6">
                                
                                {/* OFFSPRING DETAIL CARD (Interactive Inspector) */}
                                <div className="bg-slate-800/60 p-5 rounded-2xl border border-slate-700 min-h-[180px] flex flex-col justify-between shadow-lg">
                                    {selectedCell !== null ? (
                                        <div>
                                            <div className="flex justify-between items-start mb-3">
                                                <span className="px-3 py-1 bg-slate-900 border border-slate-700 rounded-md font-mono text-xs text-slate-400 flex items-center gap-2">
                                                    <SearchIcon className="w-3 h-3"/> Offspring {selectedCell + 1} of 16
                                                </span>
                                                <button 
                                                    onClick={() => setSelectedCell(null)}
                                                    className="text-slate-400 hover:text-white text-xs font-semibold flex items-center gap-1 bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded transition-colors"
                                                >
                                                    <RotateCcwIcon className="w-3 h-3"/> Clear Focus
                                                </button>
                                            </div>
                                            
                                            <div className="flex gap-5 items-center mt-4">
                                                <div className="bg-slate-900 p-3 rounded-xl border border-slate-700 shadow-inner">
                                                    {activePreset.renderOffspring(gridCells[selectedCell].phenotype)}
                                                </div>
                                                <div>
                                                    <h3 className="text-xl font-bold text-white font-mono tracking-wider">
                                                        Genotype: <span className="text-amber-400">{gridCells[selectedCell].genotype}</span>
                                                    </h3>
                                                    <p className="text-sm text-slate-300 mt-1">
                                                        Phenotype: <span className="text-cyan-400 font-semibold">{gridCells[selectedCell].phenotype.trait1}</span>, <span className="text-pink-400 font-semibold">{gridCells[selectedCell].phenotype.trait2}</span>
                                                    </p>
                                                </div>
                                            </div>

                                            <div className="mt-5 bg-slate-900/60 p-3.5 rounded-xl border border-slate-800 text-xs text-slate-300 leading-relaxed shadow-inner">
                                                <strong>Genetic Details:</strong> This zygote inherited gamete <span className="text-cyan-400 font-mono font-bold bg-cyan-950 px-1 rounded">{gridCells[selectedCell].g1}</span> from Parent 1 and <span className="text-pink-400 font-mono font-bold bg-pink-950 px-1 rounded">{gridCells[selectedCell].g2}</span> from Parent 2.
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="flex-grow flex flex-col items-center justify-center text-center py-8">
                                            <SearchIcon className="w-10 h-10 text-slate-500 mb-3" />
                                            <h4 className="text-base font-bold text-slate-300">Inspect Offspring</h4>
                                            <p className="text-xs text-slate-500 max-w-[240px] mt-2">Click any square in the Punnett Grid to inspect its specific alleles and traits.</p>
                                        </div>
                                    )}
                                </div>

                                {/* LIVE PHENOTYPE RATIO METRIC */}
                                <div className="bg-slate-800/60 p-5 rounded-2xl border border-slate-700 shadow-lg">
                                    <h3 className="text-xs font-bold text-slate-300 uppercase tracking-widest mb-4 flex items-center gap-2">
                                        <span>📊</span> Phenotypic Distribution
                                    </h3>
                                    
                                    <div className="space-y-4">
                                        {phenotypeSummary.map((p, idx) => {
                                            const percentage = ((p.count / 16) * 100).toFixed(1);
                                            return (
                                                <div key={idx} className="space-y-1.5">
                                                    <div className="flex justify-between text-sm font-semibold text-slate-300">
                                                        <span>{p.trait1} & {p.trait2}</span>
                                                        <span className="font-mono text-amber-400 bg-slate-900 px-2 rounded border border-slate-700">
                                                            {p.count}/16 <span className="text-xs text-slate-500">({percentage}%)</span>
                                                        </span>
                                                    </div>
                                                    <div className="w-full bg-slate-900 h-2.5 rounded-full overflow-hidden border border-slate-800">
                                                        <div 
                                                            className="h-full rounded-full transition-all duration-500"
                                                            style={{ 
                                                                width: `${percentage}%`,
                                                                backgroundColor: p.isT1Dom && p.isT2Dom ? '#10B981' : p.isT1Dom ? '#3B82F6' : p.isT2Dom ? '#FACC15' : '#EF4444'
                                                            }}
                                                        ></div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>

                                {/* LIVE GENOTYPIC RATIO METRIC */}
                                <div className="bg-slate-800/60 p-5 rounded-2xl border border-slate-700 shadow-lg">
                                    <h3 className="text-xs font-bold text-slate-300 uppercase tracking-widest mb-3 flex items-center gap-2">
                                        <DnaIcon className="w-4 h-4 text-slate-400"/> Genotypic Distribution
                                    </h3>
                                    
                                    <div className="max-h-[160px] overflow-y-auto pr-2 text-sm space-y-2">
                                        {genotypeSummary.map(([gen, count]) => (
                                            <div key={gen} className="flex justify-between items-center py-1.5 border-b border-slate-700/50 last:border-0">
                                                <span className="font-mono text-cyan-300 font-bold bg-slate-900 px-2 py-0.5 rounded border border-slate-700">{gen}</span>
                                                <span className="text-slate-400 font-semibold text-xs">{count} of 16 <span className="text-slate-500">({(count/16*100).toFixed(1)}%)</span></span>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                            </div>
                        </div>

                    </section>

                </div>
            );
        }

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
