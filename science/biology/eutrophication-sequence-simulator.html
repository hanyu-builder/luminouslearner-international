<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Eutrophication Sequence Simulator</title>
    <meta name="description" content="Time-series ecological model of nutrient pollution leading to anoxia.">

    <script src="https://cdn.tailwindcss.com"></script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background-color: #0F172A; /* Slate 900 */
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            user-select: none;
        }
        
        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1e293b; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }

        /* Custom Sliders */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
            width: 100%;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px; width: 16px;
            border-radius: 50%;
            background: currentColor;
            cursor: pointer;
            margin-top: -5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 6px;
            cursor: pointer; border-radius: 4px;
            background: #0f172a;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useRef, useMemo } = React;

        /**
         * EUTROPHICATION SEQUENCE SIMULATOR
         * Target: P4 to S3 Students (Ages 9-15)
         * Core Concept: Time-series ecological model of nutrient pollution leading to anoxia.
         */

        const App = () => {
          // --- STATE ---
          const [isPlaying, setIsPlaying] = useState(false);
          const [day, setDay] = useState(0); // 0 to 100
          const [fertilizerLevel, setFertilizerLevel] = useState(5); // 1 to 10

          const canvasRef = useRef(null);
          const animClockRef = useRef(0);

          // --- DETERMINISTIC ECOLOGICAL MODEL ---
          // We pre-calculate the entire 100-day timeline based on the current fertilizer level.
          // This enables the predictive graph and the interactive time scrubber.
          const timeline = useMemo(() => {
            const data = [];
            let state = {
              algae: 5,        // 0-100% surface coverage
              light: 100,      // 0-100% penetration to bottom
              plants: 100,     // 0-100% health of benthic plants
              bacteria: 5,     // 0-100% population of aerobic decomposers
              do: 100,         // 0-100% Dissolved Oxygen
              fishAlive: true
            };

            const fertMultiplier = fertilizerLevel * 0.35;

            for (let t = 0; t <= 100; t++) {
              // 1. Nutrient Loading & Algal Bloom
              // Algae grows rapidly based on fertilizer, caps at 100
              state.algae = Math.min(100, state.algae + fertMultiplier);

              // 2. Light Blockage
              // Algae blocks sunlight from reaching the bottom
              state.light = Math.max(0, 100 - (state.algae * 1.1));

              // 3. Benthic Plant Death
              // Plants die if light drops below 40%
              if (state.light < 40) {
                state.plants = Math.max(0, state.plants - 3);
              } else {
                state.plants = Math.min(100, state.plants + 1);
              }

              // 4. Decomposition
              // Dead plants (and eventually dead algae) feed aerobic bacteria
              const deadOrganicMatter = (100 - state.plants) + (state.algae > 80 ? (state.algae - 80) : 0);
              state.bacteria = Math.min(100, 5 + deadOrganicMatter * 1.5);

              // 5. Anoxia (Oxygen Depletion)
              // Bacteria consume massive amounts of Dissolved Oxygen
              state.do = Math.max(0, 100 - (state.bacteria * 0.95));

              // 6. Fish Kill
              // Fish suffocate if DO drops below 25%
              if (state.do < 25) {
                state.fishAlive = false;
              } else if (t === 0) {
                state.fishAlive = true; // Reset at day 0
              }

              data.push({ ...state, day: t });
            }
            return data;
          }, [fertilizerLevel]);

          const currentState = timeline[day];

          // --- SIMULATION PLAYBACK LOOP ---
          useEffect(() => {
            let interval;
            if (isPlaying) {
              interval = setInterval(() => {
                setDay(prev => {
                  if (prev >= 100) {
                    setIsPlaying(false);
                    return 100;
                  }
                  return prev + 1;
                });
              }, 150); // 150ms per day
            }
            return () => clearInterval(interval);
          }, [isPlaying]);

          // --- STAGE DETECTION LOGIC ---
          const getStage = () => {
            if (currentState.do < 25) return 4; // Anoxia
            if (currentState.bacteria > 40) return 3; // Decomposition
            if (currentState.algae > 50) return 2; // Algal Bloom
            return 1; // Nutrient Load
          };
          const currentStage = getStage();

          const STAGE_INFO = [
            { id: 1, title: 'Nutrient Loading', desc: 'Excess nitrates and phosphates from fertilizer runoff enter the water.', color: 'text-emerald-400', border: 'border-emerald-500/50' },
            { id: 2, title: 'Algal Bloom', desc: 'Nutrients trigger explosive algae growth at the surface, blocking sunlight.', color: 'text-lime-400', border: 'border-lime-500/50' },
            { id: 3, title: 'Decomposition', desc: 'Deprived of light, bottom plants die. Bacteria multiply rapidly to decompose them.', color: 'text-amber-400', border: 'border-amber-500/50' },
            { id: 4, title: 'Anoxia', desc: 'Aerobic bacteria consume all the Dissolved Oxygen (DO). Fish suffocate and die.', color: 'text-red-500', border: 'border-red-500/50' }
          ];

          // --- CANVAS VISUAL RENDERER ---
          useEffect(() => {
            const canvas = canvasRef.current;
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let animationId;

            const W = canvas.width;
            const H = canvas.height;
            
            // Fish setup (independent of the time scrubber so they always wiggle)
            const fishFlock = [
              { x: W*0.3, y: H*0.4, offset: 0, speed: 0.5, scale: 1 },
              { x: W*0.6, y: H*0.5, offset: Math.PI, speed: 0.6, scale: 0.8 },
              { x: W*0.4, y: H*0.6, offset: Math.PI/2, speed: 0.4, scale: 1.2 }
            ];

            const render = () => {
              animClockRef.current += 0.05;
              const clock = animClockRef.current;
              const s = timeline[day]; // Current ecological state

              ctx.clearRect(0, 0, W, H);

              // 1. BACKGROUND (Water & Light)
              // Water gets murkier as algae increases
              const murkiness = s.algae / 100;
              const waterR = Math.floor(14 + (murkiness * 20));
              const waterG = Math.floor(165 + (murkiness * 50));
              const waterB = Math.floor(233 - (murkiness * 100));
              ctx.fillStyle = `rgb(${waterR}, ${waterG}, ${waterB})`;
              ctx.fillRect(0, 0, W, H);

              // Sunbeams (Fade based on light penetration)
              if (s.light > 10) {
                ctx.save();
                ctx.globalAlpha = (s.light / 100) * 0.3;
                ctx.fillStyle = '#fef08a';
                ctx.beginPath();
                ctx.moveTo(W*0.2, 0); ctx.lineTo(W*0.4, H); ctx.lineTo(W*0.6, H); ctx.lineTo(W*0.5, 0);
                ctx.fill();
                ctx.restore();
              }

              // 2. BENTHIC PLANTS (Bottom)
              const plantHealth = s.plants / 100;
              for (let i = 0; i < 8; i++) {
                const px = 50 + i * 90;
                const py = H;
                
                // Plant swaying
                const sway = Math.sin(clock + i) * 10 * plantHealth;
                
                // Color shifts from green to brown as they die
                const pR = Math.floor(34 + ((1-plantHealth) * 100));
                const pG = Math.floor(197 - ((1-plantHealth) * 100));
                const pB = Math.floor(94 - ((1-plantHealth) * 50));
                
                ctx.strokeStyle = `rgb(${pR}, ${pG}, ${pB})`;
                ctx.lineWidth = 6;
                ctx.lineCap = 'round';
                
                ctx.beginPath();
                ctx.moveTo(px, py);
                ctx.quadraticCurveTo(px + sway, py - 50, px + sway/2, py - 100 * plantHealth);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(px + 20, py);
                ctx.quadraticCurveTo(px + 20 + sway, py - 30, px + 30 + sway/2, py - 60 * plantHealth);
                ctx.stroke();
              }

              // 3. BACTERIA (Decomposers on the bottom)
              const numBacteria = Math.floor((s.bacteria / 100) * 150);
              ctx.fillStyle = 'rgba(217, 119, 6, 0.8)'; // Amber
              for(let i = 0; i < numBacteria; i++) {
                // Pseudorandom positions based on index so they don't jitter wildly every frame
                const bx = (Math.sin(i * 123.45) * 0.5 + 0.5) * W;
                const by = H - 10 - (Math.cos(i * 67.89) * 0.5 + 0.5) * 80;
                // Wiggle
                const wx = bx + Math.sin(clock * 2 + i) * 2;
                const wy = by + Math.cos(clock * 2 + i) * 2;
                ctx.beginPath(); ctx.arc(wx, wy, 2, 0, Math.PI*2); ctx.fill();
              }

              // 4. FISH
              fishFlock.forEach((fish, i) => {
                ctx.save();
                
                if (s.fishAlive) {
                  // Swimming
                  const fx = fish.x + Math.sin(clock * fish.speed + fish.offset) * 150;
                  const fy = fish.y + Math.cos(clock * fish.speed * 0.5 + fish.offset) * 20;
                  // Flip direction based on movement
                  const dir = Math.cos(clock * fish.speed + fish.offset) > 0 ? 1 : -1;
                  
                  ctx.translate(fx, fy);
                  ctx.scale(dir * fish.scale, fish.scale);
                  
                  // Draw Fish
                  ctx.fillStyle = '#f8fafc'; // White/silver body
                  ctx.beginPath(); ctx.ellipse(0, 0, 20, 10, 0, 0, Math.PI*2); ctx.fill();
                  // Tail
                  const tailWag = Math.sin(clock * 5 + i) * 5;
                  ctx.fillStyle = '#cbd5e1';
                  ctx.beginPath(); ctx.moveTo(-15, 0); ctx.lineTo(-25, -10 + tailWag); ctx.lineTo(-25, 10 + tailWag); ctx.fill();
                  // Eye
                  ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.arc(10, -2, 2, 0, Math.PI*2); ctx.fill();

                } else {
                  // Dead floating
                  // Float to top
                  const floatY = Math.max(40, fish.y - (day * 2));
                  const fx = fish.x + Math.sin(clock * 0.5 + fish.offset) * 10; // Gentle drift
                  
                  ctx.translate(fx, floatY);
                  ctx.scale(fish.scale, -fish.scale); // Upside down
                  
                  ctx.fillStyle = '#94a3b8'; // Grey out
                  ctx.beginPath(); ctx.ellipse(0, 0, 20, 10, 0, 0, Math.PI*2); ctx.fill();
                  ctx.beginPath(); ctx.moveTo(-15, 0); ctx.lineTo(-25, -10); ctx.lineTo(-25, 10); ctx.fill();
                  // Dead eye (X)
                  ctx.strokeStyle = '#0f172a'; ctx.lineWidth=1;
                  ctx.beginPath(); ctx.moveTo(8, -4); ctx.lineTo(12, 0); ctx.moveTo(12, -4); ctx.lineTo(8, 0); ctx.stroke();
                }
                ctx.restore();
              });

              // 5. ALGAL BLOOM (Surface)
              if (s.algae > 0) {
                const algaeThickness = (s.algae / 100) * 40;
                ctx.fillStyle = `rgba(21, 128, 61, ${0.4 + (s.algae/100) * 0.6})`; // Deep green, opacity scales
                
                ctx.beginPath();
                ctx.moveTo(0, 0);
                for (let x = 0; x <= W; x += 20) {
                  const wave = Math.sin(x * 0.05 + clock) * 5 * (s.algae/100);
                  ctx.lineTo(x, algaeThickness + wave);
                }
                ctx.lineTo(W, 0);
                ctx.fill();
              }

              // 6. FERTILIZER RUNOFF ANIMATION (When slider > 0 and day < 20)
              if (fertilizerLevel > 0 && day < 30) {
                ctx.fillStyle = 'rgba(132, 204, 22, 0.6)'; // Toxic green runoff
                for(let i=0; i<fertilizerLevel * 3; i++) {
                  const rx = (clock * 50 + i * 20) % 150; // Flows in from left
                  const ry = 10 + Math.sin(rx * 0.1) * 10;
                  ctx.beginPath(); ctx.arc(rx, ry, 3, 0, Math.PI*2); ctx.fill();
                }
              }

              animationId = requestAnimationFrame(render);
            };

            render();
            return () => cancelAnimationFrame(animationId);
          }, [day, timeline, fertilizerLevel]);


          // --- SVG DO GRAPH COMPONENT ---
          const DOGraph = () => {
            const width = 380;
            const height = 120;
            const padding = { top: 10, right: 10, bottom: 20, left: 30 };
            
            // Generate SVG Path for DO timeline
            const pathData = timeline.map((d, i) => {
              const x = padding.left + (i / 100) * (width - padding.left - padding.right);
              const y = height - padding.bottom - (d.do / 100) * (height - padding.top - padding.bottom);
              return `${i === 0 ? 'M' : 'L'} ${x} ${y}`;
            }).join(' ');

            // Current Scrubber Position
            const currentX = padding.left + (day / 100) * (width - padding.left - padding.right);
            const anoxiaY = height - padding.bottom - (25 / 100) * (height - padding.top - padding.bottom);

            return (
              <div className="bg-slate-900/60 p-4 rounded-2xl border border-slate-700/50 shadow-inner">
                <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 flex justify-between">
                  <span>Dissolved Oxygen (DO) Forecast</span>
                  <span className={currentState.do < 25 ? 'text-red-400' : 'text-cyan-400'}>{Math.round(currentState.do)}%</span>
                </h3>
                <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-[120px] overflow-visible">
                  {/* Axes */}
                  <line x1={padding.left} y1={height-padding.bottom} x2={width-padding.right} y2={height-padding.bottom} stroke="#475569" />
                  <line x1={padding.left} y1={padding.top} x2={padding.left} y2={height-padding.bottom} stroke="#475569" />
                  
                  {/* Labels */}
                  <text x={padding.left - 5} y={padding.top + 5} fill="#64748b" fontSize="10" textAnchor="end">100</text>
                  <text x={padding.left - 5} y={height - padding.bottom} fill="#64748b" fontSize="10" textAnchor="end">0</text>
                  <text x={width - padding.right} y={height - padding.bottom + 15} fill="#64748b" fontSize="10" textAnchor="end">100 Days</text>

                  {/* Anoxia Danger Line */}
                  <line x1={padding.left} y1={anoxiaY} x2={width-padding.right} y2={anoxiaY} stroke="#ef4444" strokeDasharray="4 4" strokeWidth="1" opacity="0.6"/>
                  <text x={width - padding.right} y={anoxiaY - 5} fill="#ef4444" fontSize="9" textAnchor="end" opacity="0.8">Anoxia (25%)</text>

                  {/* Data Line */}
                  <path d={pathData} fill="none" stroke="#06b6d4" strokeWidth="3" />
                  
                  {/* Current Time Indicator */}
                  <line x1={currentX} y1={padding.top} x2={currentX} y2={height - padding.bottom} stroke="#f8fafc" strokeWidth="2" />
                  <circle cx={currentX} cy={height - padding.bottom - (currentState.do/100)*(height-padding.top-padding.bottom)} r="4" fill="#fff" stroke="#06b6d4" strokeWidth="2" />
                </svg>
              </div>
            );
          };

          return (
            <div className="bg-[#0F172A] min-h-screen max-h-[950px] w-full text-slate-200 flex flex-col font-sans overflow-hidden">

              {/* HEADER */}
              <header className="h-16 border-b border-slate-700/50 flex items-center justify-between px-6 bg-slate-800/30 shrink-0">
                <div className="flex items-center gap-3">
                  <div className="w-8 h-8 rounded bg-emerald-500/20 flex items-center justify-center border border-emerald-400/50">
                    <svg className="w-5 h-5 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                    </svg>
                  </div>
                  <h1 className="text-xl font-bold text-white tracking-wide">Eutrophication Sequence</h1>
                </div>
                
                <div className="flex items-center gap-6">
                  <div className="font-mono text-xl font-black text-white bg-slate-900 px-4 py-1.5 rounded-lg border border-slate-700">
                    DAY {day.toString().padStart(3, '0')}
                  </div>
                  <button 
                    onClick={() => setIsPlaying(!isPlaying)}
                    className={`px-6 py-2 rounded-full text-sm font-bold flex items-center gap-2 transition-all ${
                      isPlaying ? 'bg-amber-500/10 text-amber-500 border border-amber-500/50 hover:bg-amber-500/20' 
                                : 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/50 hover:bg-emerald-500/20'
                    }`}
                  >
                    {isPlaying ? '⏸ Pause Time' : '▶ Play Sequence'}
                  </button>
                </div>
              </header>

              {/* MAIN CONTENT */}
              <main className="flex-1 flex gap-6 p-6 overflow-hidden">
                
                {/* LEFT PANEL: CONTROLS & GRAPH */}
                <aside className="w-[420px] flex flex-col gap-5 shrink-0 overflow-y-auto custom-scrollbar pr-2">
                  
                  {/* Controls */}
                  <div className="bg-slate-800/60 p-5 rounded-2xl border border-slate-700/50 shadow-lg flex flex-col gap-5">
                    <div>
                      <div className="flex justify-between items-end mb-2">
                        <label className="text-sm font-bold text-emerald-400">Fertilizer Runoff Level</label>
                        <span className="text-xs font-bold text-emerald-100 bg-emerald-900/50 px-2 py-1 rounded border border-emerald-800">{fertilizerLevel * 10}%</span>
                      </div>
                      <input 
                        type="range" min="0" max="10" step="1"
                        value={fertilizerLevel} onChange={(e) => { setFertilizerLevel(parseInt(e.target.value)); if(day===100) setDay(0); }}
                        className="w-full h-2 bg-slate-900 rounded-lg appearance-none cursor-pointer accent-emerald-500"
                      />
                      <p className="text-[10px] text-slate-400 mt-2 leading-tight">Adjust nitrates/phosphates entering the lake. Notice how it reshapes the DO forecast below.</p>
                    </div>

                    {/* Time Scrubber */}
                    <div className="pt-3 border-t border-slate-700/50">
                       <div className="flex justify-between items-end mb-2">
                        <label className="text-sm font-bold text-slate-300">Time Scrubber</label>
                      </div>
                      <input 
                        type="range" min="0" max="100" step="1"
                        value={day} onChange={(e) => { setDay(parseInt(e.target.value)); setIsPlaying(false); }}
                        className="w-full h-2 bg-slate-900 rounded-lg appearance-none cursor-pointer accent-indigo-500"
                      />
                    </div>
                  </div>

                  {/* DO Graph */}
                  <DOGraph />

                  {/* Stages Educational Panel */}
                  <div className="flex-1 flex flex-col gap-2">
                    <h3 className="text-xs font-bold text-slate-500 uppercase tracking-widest px-2">The 4 Stages</h3>
                    {STAGE_INFO.map((stg) => (
                      <div 
                        key={stg.id} 
                        className={`p-3 rounded-xl transition-all duration-300 border ${
                          currentStage === stg.id 
                            ? `bg-slate-800 ${stg.border} shadow-md opacity-100 scale-100` 
                            : 'bg-slate-900/40 border-slate-800 opacity-60 scale-[0.98]'
                        }`}
                      >
                        <h4 className={`text-sm font-bold flex items-center gap-2 ${currentStage === stg.id ? stg.color : 'text-slate-400'}`}>
                          <span className="bg-slate-950 w-5 h-5 rounded-full flex items-center justify-center text-[10px] border border-slate-700">
                            {stg.id}
                          </span>
                          {stg.title}
                        </h4>
                        {currentStage === stg.id && (
                          <p className="text-xs text-slate-300 mt-2 leading-relaxed ml-7">
                            {stg.desc}
                          </p>
                        )}
                      </div>
                    ))}
                  </div>

                </aside>

                {/* RIGHT PANEL: VISUAL SIMULATOR */}
                <section className="flex-1 bg-slate-900 rounded-3xl border border-slate-700/50 relative shadow-2xl flex justify-center items-center overflow-hidden p-4">
                  
                  <div className="w-full h-full max-w-[800px] max-h-[800px] aspect-square relative rounded-xl overflow-hidden shadow-inner border border-slate-800">
                    <canvas 
                      ref={canvasRef} 
                      width={800} 
                      height={800} 
                      className="w-full h-full block bg-[#0B1121]" 
                    />
                    
                    {/* Real-time Status Overlay */}
                    <div className="absolute top-4 right-4 bg-slate-900/80 backdrop-blur border border-slate-700 p-3 rounded-xl text-xs space-y-2 pointer-events-none w-40">
                      <div className="flex justify-between">
                        <span className="text-slate-400">Algae Cover</span>
                        <span className="text-lime-400 font-mono font-bold">{Math.round(currentState.algae)}%</span>
                      </div>
                      <div className="flex justify-between">
                        <span className="text-slate-400">Light at Bottom</span>
                        <span className="text-yellow-400 font-mono font-bold">{Math.round(currentState.light)}%</span>
                      </div>
                       <div className="flex justify-between">
                        <span className="text-slate-400">Plant Health</span>
                        <span className={currentState.plants > 50 ? 'text-emerald-400 font-mono font-bold' : 'text-amber-500 font-mono font-bold'}>{Math.round(currentState.plants)}%</span>
                      </div>
                       <div className="flex justify-between border-t border-slate-700 pt-2 mt-2">
                        <span className="text-slate-400">Bacteria Pop.</span>
                        <span className="text-orange-400 font-mono font-bold">{Math.round(currentState.bacteria)}%</span>
                      </div>
                    </div>
                    
                    {/* Anoxia Alert Overlay */}
                    {!currentState.fishAlive && (
                      <div className="absolute inset-0 bg-red-900/10 flex items-center justify-center pointer-events-none animate-pulse">
                        <div className="bg-red-950/90 border-2 border-red-500 text-red-500 px-8 py-4 rounded-2xl font-black text-2xl shadow-[0_0_50px_rgba(239,68,68,0.3)] backdrop-blur-sm transform -rotate-6">
                          ANOXIA: DEAD ZONE
                        </div>
                      </div>
                    )}
                  </div>
                </section>

              </main>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
