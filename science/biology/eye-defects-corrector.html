<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Biology Virtual Labs - Eye Defects Corrector</title>
    <!-- SEO Keyword: Eye Defects -->
    <meta name="description" content="Interactive optometry virtual lab simulating eye defects (myopia, hyperopia), lens corrections, and ciliary accommodation using ray-tracing optics.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background-color: #0F172A; /* Deep Slate */
            color: #F8FAFC;
            font-family: 'Inter', system-ui, sans-serif;
            overflow: hidden;
            user-select: none;
            touch-action: none;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1E293B; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }

        /* Custom Sliders */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
            width: 100%;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 18px; width: 18px;
            border-radius: 50%;
            background: currentColor;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:active { transform: scale(1.2); }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px;
            cursor: pointer; border-radius: 4px;
            background: #334155;
        }

        #canvas-container {
            background-color: #0B0F19;
            border-radius: 0.75rem;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 45px rgba(0,0,0,0.8);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            outline: none;
        }

        /* Preset Button Styles */
        .preset-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="h-screen w-screen flex justify-center items-center p-2 md:p-4">

    <!-- Main Container -->
    <div class="w-full h-full max-w-[1400px] max-h-[950px] flex flex-col bg-slate-900 rounded-2xl shadow-[0_0_50px_rgba(0,0,0,0.6)] overflow-hidden border border-slate-700/50 relative">
        
        <!-- Header -->
        <header class="p-4 md:px-6 border-b border-slate-700 flex flex-col md:flex-row justify-between items-center bg-slate-800/80 backdrop-blur-sm z-10 shrink-0 gap-4 md:gap-0">

                </h1>
                <p class="text-[10px] md:text-xs font-medium text-slate-400 uppercase tracking-widest mt-1">Ray-Tracing Optometry & Refraction Lab</p>
            </div>
            
            <!-- Live Status indicators -->
            <div class="flex gap-4 md:gap-8 bg-slate-950 p-2 px-4 md:px-6 rounded-xl border border-slate-700 shadow-inner items-center">
                <div class="text-center flex flex-col items-center">

        </header>

        <!-- Main Workspace -->
        <main class="flex flex-col md:flex-row flex-1 overflow-hidden relative z-0">
            
            <!-- Controls Sidebar (Left) -->
            <aside class="w-full md:w-[380px] flex flex-col gap-4 p-4 shrink-0 h-full overflow-y-auto bg-slate-800/30 border-r border-slate-700 custom-scrollbar">
                
                <!-- Snellen Retina Projection Screen -->
                <div class="bg-slate-950 rounded-xl p-4 border border-slate-700 shadow-inner flex flex-col items-center relative overflow-hidden shrink-0">
                    <div class="absolute top-2 left-2 text-[8px] text-slate-500 font-bold uppercase tracking-widest">Retina Projection View</div>
                    
                    <!-- Projected Letter E with Dynamic Blur -->
                    <div class="w-32 h-32 rounded-full border-4 border-slate-800 bg-[#070b13] flex items-center justify-center overflow-hidden relative mt-3 shadow-inner">
                        <div id="projected-image" class="text-7xl font-black text-white select-none transition-all duration-75">E</div>

                    </div>
                    
                    <span id="focus-quality" class="text-[10px] uppercase tracking-widest font-black text-emerald-400 mt-2 bg-emerald-950/40 px-2 py-0.5 rounded border border-emerald-800/30">Perfect Focus</span>
                </div>

                <!-- QUICK DIAGNOSTIC PRESETS (NEW PEDAGOGICAL UPGRADE) -->
                <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 shadow-inner flex flex-col gap-2">
                    <h3 class="text-[10px] uppercase tracking-widest text-slate-400 font-bold border-b border-slate-700 pb-1.5 mb-1">

                <!-- Eyeball Anatomy Controls -->
                <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 shadow-inner flex flex-col gap-4">
                    <div class="flex justify-between items-center border-b border-slate-700 pb-1.5">
                        <h3 class="text-[10px] uppercase tracking-widest text-slate-400 font-bold">Eyeball Anatomy</h3>
                        
                        <!-- Ciliary Accommodation Toggle (NEW UPGRADE) -->

                    <!-- Eyeball Length Slider -->

                            <label class="text-xs font-bold text-slate-200">Eyeball Length</label>
                            <span id="val-length" class="font-mono text-cyan-400 font-bold bg-cyan-950/30 px-2 py-0.5 rounded text-xs border border-cyan-800/50">Normal</span>
                        </div>
                        <input type="range" id="slider-length" min="180" max="320" value="250" class="text-cyan-500">
                    </div>

                    <!-- Cornea Curvature Slider -->
                    <div>
                        <div class="flex justify-between items-end mb-2">
                            <label class="text-xs font-bold text-slate-200">Cornea Curvature</label>
                            <span id="val-curvature" class="font-mono text-purple-400 font-bold bg-purple-950/30 px-2 py-0.5 rounded text-xs border border-purple-800/50">Normal</span>
                        </div>
                        <input type="range" id="slider-curvature" min="15" max="55" value="35" class="text-purple-500">

                </div>

                <!-- INSTANT LENS SELECTOR (NEW PEDAGOGICAL UPGRADE) -->
                <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 shadow-inner flex flex-col gap-2">
                    <h3 class="text-[10px] uppercase tracking-widest text-slate-400 font-bold border-b border-slate-700 pb-1.5 mb-1">
                        <i class="fa-solid fa-glasses"></i> Quick Lens Applicator
                    </h3>
                    <div class="grid grid-cols-3 gap-1.5">
                        <button onclick="applyLensType('concave')" class="preset-btn py-2 text-[10px] font-bold bg-slate-900 border border-slate-700 rounded-lg hover:border-cyan-500 text-cyan-400">
                            Apply Concave
                        </button>
                        <button onclick="applyLensType('convex')" class="preset-btn py-2 text-[10px] font-bold bg-slate-900 border border-slate-700 rounded-lg hover:border-pink-500 text-pink-400">
                            Apply Convex
                        </button>
                        <button onclick="applyLensType(null)" class="preset-btn py-2 text-[10px] font-bold bg-slate-900 border border-slate-700 rounded-lg hover:border-slate-500 text-slate-400">
                            Clear Lens
                        </button>
                    </div>
                </div>

                <!-- Corrective Lens Power -->
                <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 shadow-inner flex flex-col gap-3 transition-all opacity-40 pointer-events-none" id="lens-power-panel">
                    <h3 class="text-[10px] uppercase tracking-widest text-slate-400 font-bold border-b border-slate-700 pb-2">Lens Adjustment</h3>
                    <div>
                        <div class="flex justify-between items-end mb-2">
                            <label class="text-xs font-bold text-slate-200">Corrective Diopter / Power</label>
                            <span id="val-lens-power" class="font-mono text-emerald-400 font-bold bg-emerald-950/30 px-2 py-0.5 rounded text-xs border border-emerald-800/50">0.00 D</span>
                        </div>
                        <input type="range" id="slider-lens-power" min="-25" max="25" value="0" class="text-emerald-500">
                    </div>
                </div>

                <!-- Reset button -->
                <button onclick="resetSimulation()" class="mt-auto w-full bg-slate-700 hover:bg-slate-600 text-slate-300 py-3 rounded-xl text-sm font-bold transition-all border border-slate-600 flex justify-center items-center gap-2 shadow-lg">
                    <i class="fa-solid fa-rotate-right"></i> Reset Optometry Lab
                </button>
            </aside>

            <!-- Canvas Area (Right) -->
            <section class="flex-1 p-2 md:p-4 bg-slate-950 flex flex-col relative overflow-hidden">
                <!-- Overlay details -->
                <div class="absolute top-6 left-6 z-10 text-slate-500/50 font-black text-xs uppercase tracking-widest pointer-events-none">Lab Bench Optics Board</div>
                
                <div class="absolute top-6 right-6 z-10 text-right">
                    <span class="text-[10px] uppercase font-bold text-slate-500">Lens Shelf</span>
                </div>

                <div id="canvas-wrapper" class="w-full h-full border border-slate-700 shadow-inner">
                    <canvas id="opticsCanvas"></canvas>
                </div>
            </section>

    <!-- Application Script -->
    <script>
        /**
         * EYE DEFECTS CORRECTOR
         * Mathematical thin-lens ray tracing simulation.
         */

        const canvas = document.getElementById('opticsCanvas');
        const ctx = canvas.getContext('2d');
        const wrapper = document.getElementById('canvas-wrapper');

        let width, height;
        let animationFrameId;

        // --- Optical State ---
        let opticalState = {
            eyeballLength: 250,      // Adjustable distance from cornea to retina (180 to 320)
            corneaPower: 0.0035,     // Cornea Curvature power (0.0015 to 0.0055)
            activeLensType: null,    // 'concave', 'convex', or null
            lensPower: 0.0,          // Corrective lens power (-0.0025 to +0.0025)
            blurRadius: 0,
            accommodated: false      // Ciliary muscle accommodation state (thickens eye lens, modifies light path)
        };

        // UI Handles
        const DOM = {
            sliderLength: document.getElementById('slider-length'),
            valLength: document.getElementById('val-length'),
            sliderCurvature: document.getElementById('slider-curvature'),
            valCurvature: document.getElementById('val-curvature'),
            sliderLensPower: document.getElementById('slider-lens-power'),
            valLensPower: document.getElementById('val-lens-power'),
            lensPowerPanel: document.getElementById('lens-power-panel'),
            projectedImage: document.getElementById('projected-image'),
            focusQuality: document.getElementById('focus-quality'),
            statDefect: document.getElementById('stat-defect'),
            statLens: document.getElementById('stat-lens'),
            toggleAccommodation: document.getElementById('toggle-accommodation')
        };

        // --- Draggable Corrective Lenses ---
        let draggableLenses = [];
        let activeDragLens = null;
        let dragOffset = { x: 0, y: 0 };

        // Hardcoded Optical coordinates
        const OPTICS_Y = 240; // Center axis of rays and eye
        const X_LENS_SLOT = 160;
        const X_CORNEA = 360;

        // Colors
        const COLORS = {
            ray: 'rgba(251, 243, 219, 0.75)', // Soft warm white light
            rayGlow: 'rgba(251, 191, 36, 1)',  // Amber glow
            sclera: '#f8fafc',
            retina: '#fda4af',
            cornea: 'rgba(56, 189, 248, 0.25)',
            lens: 'rgba(56, 189, 248, 0.35)', // Crystalline Lens
            concave: '#38bdf8',
            convex: '#ec4899',
            glowingPoint: '#f59e0b'
        };

        // ==========================================
        // INITIALIZATION
        // ==========================================

        function initSimulation() {
            resizeCanvas();
            initLenses();
            updateUI();
        }

        function resizeCanvas() {
            const rect = wrapper.getBoundingClientRect();
            width = rect.width || 800;
            height = rect.height || 500;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
        }

        function initLenses() {
            draggableLenses = [
                {
                    type: 'concave',
                    x: width - 95,
                    y: 110,
                    originalX: width - 95,
                    originalY: 110,
                    width: 40,
                    height: 90,
                    isSnapped: false,
                    label: 'Concave'
                },
                {
                    type: 'convex',
                    x: width - 95,
                    y: 240,
                    originalX: width - 95,
                    originalY: 240,
                    width: 40,
                    height: 90,
                    isSnapped: false,
                    label: 'Convex'
                }
            ];
        }

        // ==========================================
        // OPTICAL COMPUTATIONS (The Mathematics)
        // ==========================================

        function calculateRayTracing() {
            let rays = [];
            
            // Adjust light paths depending on whether eye is focused on far object (parallel) or accommodating near object (diverging)
            let startYPositions = [-35, -17, 0, 17, 35];
            
            startYPositions.forEach(offset => {
                let rayPoints = [];
                let x = 0;
                let y = OPTICS_Y + offset;
                
                // If accommodated, light diverges from a point source at x=10, y=OPTICS_Y
                if (opticalState.accommodated) {
                    x = 10;
                    y = OPTICS_Y;
                }
                
                rayPoints.push({ x: x, y: y });

                // Step 1: Travel to corrective lens position
                x = X_LENS_SLOT;
                if (opticalState.accommodated) {
                    y = OPTICS_Y + (offset * (X_LENS_SLOT - 10) / (X_CORNEA - 10));
                } else {
                    y = OPTICS_Y + offset;
                }
                rayPoints.push({ x: x, y: y });

                // Step 2: Refract at corrective lens (if snapped and active)
                const currentOffset = y - OPTICS_Y;
                let slope = 0;
                
                if (opticalState.accommodated) {
                    // Pre-existing divergence slope
                    slope = (offset) / (X_CORNEA - 10);
                }

                if (opticalState.activeLensType) {
                    // Refraction delta slope = -h * Power
                    slope -= currentOffset * opticalState.lensPower;
                }

                // Step 3: Travel from corrective lens to Cornea / Eye Lens
                x = X_CORNEA;
                y = rayPoints[1].y + slope * (X_CORNEA - X_LENS_SLOT);
                rayPoints.push({ x: x, y: y });

                // Step 4: Refract at Cornea and Crystalline Lens combined
                const hCornea = y - OPTICS_Y;
                
                // Ciliary Accommodation increases the combined lens power (thickens lens to converge rays more)
                let accommodationFactor = opticalState.accommodated ? 0.0016 : 0;
                let totalRefractivePower = opticalState.corneaPower + accommodationFactor;

                const newSlope = slope - hCornea * totalRefractivePower;

                // Step 5: Travel to back of eyeball (retina)
                const xRetina = X_CORNEA + opticalState.eyeballLength;
                
                x = xRetina;
                y = OPTICS_Y + hCornea + newSlope * (xRetina - X_CORNEA);
                rayPoints.push({ x: x, y: y });

                rays.push({
                    points: rayPoints,
                    hRetina: y - OPTICS_Y,
                    slopeAfterCornea: newSlope,
                    hCornea: hCornea
                });
            });

            // Calculate focal point where marginal rays intersect (Focus occurs where height is 0)
            const marginalRay = rays[0];
            const xFocus = X_CORNEA - marginalRay.hCornea / marginalRay.slopeAfterCornea;

            const xRetina = X_CORNEA + opticalState.eyeballLength;
            const focusError = Math.abs(xFocus - xRetina);

            // Compute blur circle size (spread of rays at retina)
            const spread = Math.abs(rays[0].hRetina - rays[4].hRetina);
            opticalState.blurRadius = spread * 0.45; // scaled down for visual blur representation

            return {
                rays: rays,
                xFocus: xFocus,
                focusError: focusError
            };
        }

        // ==========================================
        // DRAWING LOGIC (Canvas)
        // ==========================================

        function drawEyeball(xRetina) {
            const rX = opticalState.eyeballLength / 2;
            const rY = 95;
            const eCenterX = X_CORNEA + rX;

            ctx.save();

            // 1. Draw Vitreous Humor (translucent light blue eyeball body)
            ctx.fillStyle = 'rgba(56, 189, 248, 0.04)';
            ctx.beginPath();
            ctx.ellipse(eCenterX, OPTICS_Y, rX, rY, 0, -Math.PI*0.48, Math.PI*0.48);
            ctx.lineTo(X_CORNEA, OPTICS_Y + rY);
            ctx.closePath();
            ctx.fill();

            // 2. Sclera Outer Boundary (White coat)
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.ellipse(eCenterX, OPTICS_Y, rX, rY, 0, -Math.PI * 0.48, Math.PI * 0.48);
            ctx.stroke();

            // 3. Retina Inner Lining (Faint pink light-receptive back coat)
            ctx.strokeStyle = 'rgba(251, 113, 133, 0.35)';
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.ellipse(eCenterX, OPTICS_Y, rX - 2.5, rY - 2.5, 0, -Math.PI * 0.42, Math.PI * 0.42);
            ctx.stroke();

            // Fovea Centralis (Yellow spot in the middle of retina)
            ctx.fillStyle = '#f59e0b';
            ctx.beginPath();
            ctx.arc(X_CORNEA + opticalState.eyeballLength, OPTICS_Y, 5, 0, Math.PI * 2);
            ctx.fill();

            // 4. Cornea (Bulging transparent protective cap)
            const bulge = Math.max(10, opticalState.corneaPower * 8000);
            ctx.fillStyle = COLORS.cornea;
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(X_CORNEA, OPTICS_Y - 95);
            ctx.quadraticCurveTo(X_CORNEA - bulge, OPTICS_Y, X_CORNEA, OPTICS_Y + 95);
            ctx.quadraticCurveTo(X_CORNEA + 15, OPTICS_Y, X_CORNEA, OPTICS_Y - 95);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // 5. Crystalline Lens (Eye Natural Lens - NEW UPGRADE)
            // Visually thickens or flattens based on Accommodation state!
            const lensThick = opticalState.accommodated ? 16 : 8;
            ctx.fillStyle = COLORS.lens;
            ctx.strokeStyle = '#06b6d4';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.ellipse(X_CORNEA + 20, OPTICS_Y, lensThick, 32, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // 6. Iris & Pupil
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(X_CORNEA - 1, OPTICS_Y - 95, 6, 50); // Top iris
            ctx.fillRect(X_CORNEA - 1, OPTICS_Y + 45, 6, 50); // Bottom iris

            // 7. Ciliary Muscles (NEW UPGRADE)
            // Contracts (moves closer to lens) or relaxes
            const ciliarySqueeze = opticalState.accommodated ? 3 : 0;
            ctx.fillStyle = '#e2e8f0';
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 1;
            // Top muscle
            ctx.beginPath();
            ctx.ellipse(X_CORNEA + 20, OPTICS_Y - 38 + ciliarySqueeze, 8, 4, 0, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();
            // Bottom muscle
            ctx.beginPath();
            ctx.ellipse(X_CORNEA + 20, OPTICS_Y + 38 - ciliarySqueeze, 8, 4, 0, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();

            // Suspensory Ligaments (lines connecting ciliary muscles to crystalline lens)
            ctx.strokeStyle = '#64748b';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(X_CORNEA + 20, OPTICS_Y - 38 + ciliarySqueeze);
            ctx.lineTo(X_CORNEA + 20, OPTICS_Y - 32);
            ctx.moveTo(X_CORNEA + 20, OPTICS_Y + 38 - ciliarySqueeze);
            ctx.lineTo(X_CORNEA + 20, OPTICS_Y + 32);
            ctx.stroke();

            // 8. Labels pointed directly to Anatomies (NEW UPGRADE)
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.font = 'bold 8px Inter';
            ctx.textAlign = 'left';
            ctx.fillText('Cornea', X_CORNEA - 10, OPTICS_Y - 102);
            ctx.fillText('Iris', X_CORNEA + 15, OPTICS_Y - 80);
            ctx.fillText('Ciliary Muscle', X_CORNEA + 32, OPTICS_Y - 35);
            ctx.fillText('Crystalline Lens', X_CORNEA + 32, OPTICS_Y + 5);
            ctx.fillText('Retina / Fovea', X_CORNEA + opticalState.eyeballLength - 70, OPTICS_Y + 110);
            
            // Pointer line to Retina
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(X_CORNEA + opticalState.eyeballLength - 5, OPTICS_Y + 15);
            ctx.lineTo(X_CORNEA + opticalState.eyeballLength - 30, OPTICS_Y + 105);
            ctx.stroke();

            ctx.restore();
        }

        function drawOpticsScene() {
            ctx.clearRect(0, 0, width, height);

            // Calculate Ray-Tracing Metrics
            const optics = calculateRayTracing();

            // 1. Draw Lab Bench Guideline Grids
            ctx.save();
            ctx.strokeStyle = 'rgba(71, 85, 105, 0.1)';
            ctx.lineWidth = 1;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(0, OPTICS_Y);
            ctx.lineTo(width, OPTICS_Y); // Central Optical Axis
            ctx.stroke();
            ctx.restore();

            // 2. Draw Corrective Lens Slot bracket
            ctx.save();
            ctx.strokeStyle = 'rgba(148, 163, 184, 0.2)';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(X_LENS_SLOT, OPTICS_Y - 70);
            ctx.lineTo(X_LENS_SLOT, OPTICS_Y + 70);
            ctx.stroke();
            
            // Text tag for corrective lens slot
            ctx.fillStyle = 'rgba(148, 163, 184, 0.5)';
            ctx.font = '8px Inter';
            ctx.textAlign = 'center';
            ctx.fillText('Corrective Lens Slot', X_LENS_SLOT, OPTICS_Y - 75);
            ctx.restore();

            // 3. Draw Eyeball Structure
            drawEyeball(X_CORNEA + opticalState.eyeballLength);

            // 4. Draw Light Rays with custom glowing trails
            optics.rays.forEach(ray => {
                ctx.save();
                ctx.strokeStyle = COLORS.ray;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(ray.points[0].x, ray.points[0].y);
                for (let i = 1; i < ray.points.length; i++) {
                    ctx.lineTo(ray.points[i].x, ray.points[i].y);
                }
                ctx.stroke();
                ctx.restore();
            });

            // 5. Draw Glowing Focus Node point
            if (optics.xFocus > X_CORNEA && optics.xFocus < width - 150) {
                ctx.save();
                ctx.fillStyle = COLORS.glowingPoint;
                ctx.shadowColor = COLORS.glowingPoint;
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.arc(optics.xFocus, OPTICS_Y, 5, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 9px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('Focal Point', optics.xFocus, OPTICS_Y - 12);
                ctx.restore();
            }

            // 6. Draw Lens shelf/holders & Lenses
            drawDraggableLenses();

            // Real-time metrics updates
            updateMetrics(optics);
        }

        function drawDraggableLenses() {
            // Draw Shelf boundaries
            ctx.save();
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(width - 150, 40, 140, 270);
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 2;
            ctx.strokeRect(width - 150, 40, 140, 270);
            ctx.restore();

            draggableLenses.forEach(lens => {
                ctx.save();
                ctx.shadowBlur = 10;
                ctx.shadowColor = lens.type === 'concave' ? COLORS.concave : COLORS.convex;
                ctx.fillStyle = lens.type === 'concave' ? 'rgba(56, 189, 248, 0.15)' : 'rgba(236, 72, 153, 0.15)';
                ctx.strokeStyle = lens.type === 'concave' ? COLORS.concave : COLORS.convex;
                ctx.lineWidth = 3;

                ctx.beginPath();
                if (lens.type === 'concave') {
                    // Concave shape (thinner in middle)
                    ctx.moveTo(lens.x - lens.width / 2, lens.y - lens.height / 2);
                    ctx.quadraticCurveTo(lens.x - 3, lens.y, lens.x - lens.width / 2, lens.y + lens.height / 2);
                    ctx.lineTo(lens.x + lens.width / 2, lens.y + lens.height / 2);
                    ctx.quadraticCurveTo(lens.x + 3, lens.y, lens.x + lens.width / 2, lens.y - lens.height / 2);
                } else {
                    // Convex shape (thicker in middle)
                    ctx.moveTo(lens.x, lens.y - lens.height / 2);
                    ctx.quadraticCurveTo(lens.x + lens.width / 2, lens.y, lens.x, lens.y + lens.height / 2);
                    ctx.quadraticCurveTo(lens.x - lens.width / 2, lens.y, lens.x, lens.y - lens.height / 2);
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Lens Label Text
                ctx.fillStyle = '#94a3b8';
                ctx.font = '10px Inter';
                ctx.textAlign = 'center';
                ctx.fillText(lens.label, lens.x, lens.y + lens.height / 2 + 15);

                ctx.restore();
            });
        }

        // ==========================================
        // USER INTERACTION & LENS DRAG LOGIC
        // ==========================================

        function getMousePos(evt) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return {
                x: (evt.clientX - rect.left) * scaleX,
                y: (evt.clientY - rect.top) * scaleY
            };
        }

        function handlePointerDown(e) {
            e.preventDefault();
            const pos = getMousePos(e);

            // Check if user clicked a lens
            for (let i = 0; i < draggableLenses.length; i++) {
                let lens = draggableLenses[i];
                if (pos.x > lens.x - lens.width / 2 && pos.x < lens.x + lens.width / 2 &&
                    pos.y > lens.y - lens.height / 2 && pos.y < lens.y + lens.height / 2) {
                    
                    activeDragLens = lens;
                    dragOffset.x = pos.x - lens.x;
                    dragOffset.y = pos.y - lens.y;
                    
                    // Unsnap if previously snapped
                    if (lens.isSnapped) {
                        lens.isSnapped = false;
                        opticalState.activeLensType = null;
                    }
                    break;
                }
            }
        }

        function handlePointerMove(e) {
            if (!activeDragLens) return;
            e.preventDefault();
            const pos = getMousePos(e);

            activeDragLens.x = pos.x - dragOffset.x;
            activeDragLens.y = pos.y - dragOffset.y;
        }

        function handlePointerUp(e) {
            if (!activeDragLens) return;
            e.preventDefault();

            // Check if dropped near the corrective lens slot (magnetic snap)
            const dist = Math.hypot(activeDragLens.x - X_LENS_SLOT, activeDragLens.y - OPTICS_Y);
            if (dist < 65) {
                snapLens(activeDragLens);
            } else {
                // Not close enough, return to its home shelf
                activeDragLens.x = activeDragLens.originalX;
                activeDragLens.y = activeDragLens.originalY;
                activeDragLens.isSnapped = false;
                opticalState.activeLensType = null;
            }

            activeDragLens = null;
            updateUI();
        }

        function snapLens(lensObj) {
            lensObj.x = X_LENS_SLOT;
            lensObj.y = OPTICS_Y;
            lensObj.isSnapped = true;
            opticalState.activeLensType = lensObj.type;

            // Return other lens back to shelf
            draggableLenses.forEach(other => {
                if (other !== lensObj) {
                    other.x = other.originalX;
                    other.y = other.originalY;
                    other.isSnapped = false;
                }
            });

            // Set convenient initial slider strength based on lens type
            if (lensObj.type === 'concave') {
                DOM.sliderLensPower.value = -12;
            } else {
                DOM.sliderLensPower.value = 12;
            }
            DOM.sliderLensPower.dispatchEvent(new Event('input'));
        }

        canvas.addEventListener('mousedown', handlePointerDown);
        window.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('mouseup', handlePointerUp);
        
        canvas.addEventListener('touchstart', handlePointerDown, {passive: false});
        window.addEventListener('touchmove', handlePointerMove, {passive: false});
        window.addEventListener('touchend', handlePointerUp);

        // ==========================================
        // STATE ENGINE & METRIC SYNCING
        // ==========================================

        function updateUI() {
            // 1. Snapped Lens adjustments
            if (opticalState.activeLensType) {
                DOM.lensPowerPanel.classList.remove('opacity-40', 'pointer-events-none');
                DOM.statLens.innerText = opticalState.activeLensType === 'concave' ? 'Concave (Diverge)' : 'Convex (Converge)';
                DOM.statLens.className = opticalState.activeLensType === 'concave' ? 'text-lg md:text-2xl font-mono font-black text-cyan-400' : 'text-lg md:text-2xl font-mono font-black text-pink-400';
            } else {
                DOM.lensPowerPanel.classList.add('opacity-40', 'pointer-events-none');
                DOM.statLens.innerText = 'None';
                DOM.statLens.className = 'text-lg md:text-2xl font-mono font-black text-slate-400';
            }

            // 2. Sync slider text readouts
            const lengthVal = parseInt(DOM.sliderLength.value);
            opticalState.eyeballLength = lengthVal;
            if (lengthVal > 265) {
                DOM.valLength.innerText = 'Elongated (Myopic)';
                DOM.valLength.className = 'font-mono text-cyan-400 font-bold bg-cyan-950/30 px-2 py-0.5 rounded text-xs border border-cyan-800/50';
            } else if (lengthVal < 235) {
                DOM.valLength.innerText = 'Shortened (Hyperopic)';
                DOM.valLength.className = 'font-mono text-pink-400 font-bold bg-pink-950/30 px-2 py-0.5 rounded text-xs border border-pink-800/50';
            } else {
                DOM.valLength.innerText = 'Normal';
                DOM.valLength.className = 'font-mono text-slate-400 font-bold bg-slate-950 px-2 py-0.5 rounded text-xs border border-slate-800';
            }

            const curvatureVal = parseInt(DOM.sliderCurvature.value);
            opticalState.corneaPower = curvatureVal * 0.0001; 
            if (curvatureVal > 40) {
                DOM.valCurvature.innerText = 'Steep (Myopic)';
                DOM.valCurvature.className = 'font-mono text-cyan-400 font-bold bg-cyan-950/30 px-2 py-0.5 rounded text-xs border border-cyan-800/50';
            } else if (curvatureVal < 30) {
                DOM.valCurvature.innerText = 'Flat (Hyperopic)';
                DOM.valCurvature.className = 'font-mono text-pink-400 font-bold bg-pink-950/30 px-2 py-0.5 rounded text-xs border border-pink-800/50';
            } else {
                DOM.valCurvature.innerText = 'Normal';
                DOM.valCurvature.className = 'font-mono text-slate-400 font-bold bg-slate-950 px-2 py-0.5 rounded text-xs border border-slate-800';
            }
        }

        function updateMetrics(optics) {
            const rawPowerVal = parseInt(DOM.sliderLensPower.value);
            opticalState.lensPower = rawPowerVal * 0.0001;
            DOM.valLensPower.innerText = `${(rawPowerVal / 4).toFixed(2)} D`;

            // Calculate live focus quality & apply CSS Blur to the projected Snellen "E"
            let blurValue = Math.min(15, opticalState.blurRadius);
            DOM.projectedImage.style.filter = `blur(${blurValue}px)`;

            // Diagnostics mapping
            let diagnosis = "Emmetropia (Normal)";
            let diagColor = "text-emerald-400";
            
            const xRetina = X_CORNEA + opticalState.eyeballLength;

            // Determine biological defect state
            if (optics.xFocus < xRetina - 10) {
                diagnosis = "Myopia (Short Sight)";
                diagColor = "text-cyan-400";
            } else if (optics.xFocus > xRetina + 10) {
                diagnosis = "Hyperopia (Long Sight)";
                diagColor = "text-pink-400";
            }

            DOM.statDefect.innerText = diagnosis;
            DOM.statDefect.className = `text-lg md:text-2xl font-mono font-black ${diagColor}`;

            // Focus status tag
            if (blurValue < 1.0) {
                DOM.focusQuality.innerText = "Perfect Focus";
                DOM.focusQuality.className = "text-[10px] uppercase tracking-widest font-black text-emerald-400 mt-2 bg-emerald-950/40 px-2 py-0.5 rounded border border-emerald-800/30";
                
                DOM.statDefect.innerText = "Emmetropia (In Focus)";
                DOM.statDefect.className = `text-lg md:text-2xl font-mono font-black text-emerald-400`;
            } else {
                DOM.focusQuality.innerText = "Out of Focus";
                DOM.focusQuality.className = "text-[10px] uppercase tracking-widest font-black text-rose-400 mt-2 bg-rose-950/40 px-2 py-0.5 rounded border border-rose-800/30";
            }
        }

        // ==========================================
        // QUICK PRESETS & ACTIONS
        // ==========================================

        function applyPreset(condition) {
            if (condition === 'emmetropia') {
                DOM.sliderLength.value = 250;
                DOM.sliderCurvature.value = 35;
            } else if (condition === 'myopia') {
                // Elongated eyeball + steeper cornea
                DOM.sliderLength.value = 290;
                DOM.sliderCurvature.value = 45;
            } else if (condition === 'hyperopia') {
                // Shortened eyeball + flatter cornea
                DOM.sliderLength.value = 210;
                DOM.sliderCurvature.value = 25;
            }
            updateUI();
        }

        function applyLensType(type) {
            if (!type) {
                // Clear any snapped lenses
                draggableLenses.forEach(l => {
                    l.x = l.originalX;
                    l.y = l.originalY;
                    l.isSnapped = false;
                });
                opticalState.activeLensType = null;
                updateUI();
                return;
            }

            const targetLens = draggableLenses.find(l => l.type === type);
            if (targetLens) {
                snapLens(targetLens);
            }
            updateUI();
        }

        // --- Controller Listeners ---

        DOM.sliderLength.addEventListener('input', () => { updateUI(); });
        DOM.sliderCurvature.addEventListener('input', () => { updateUI(); });
        DOM.sliderLensPower.addEventListener('input', () => { /* updated inside frame loop */ });
        DOM.toggleAccommodation.addEventListener('change', (e) => {
            opticalState.accommodated = e.target.checked;
        });

        function resetSimulation() {
            DOM.sliderLength.value = 250;
            DOM.sliderCurvature.value = 35;
            DOM.sliderLensPower.value = 0;
            DOM.toggleAccommodation.checked = false;
            opticalState.accommodated = false;
            opticalState.activeLensType = null;
            
            initLenses();
            updateUI();
        }

        // --- Main Frame Loop ---
        function loop() {
            drawOpticsScene();
            animationFrameId = requestAnimationFrame(loop);
        }

        // Trigger on load
        window.onload = () => {
            initSimulation();
            loop();
        };

    </script>
</body>
</html>
