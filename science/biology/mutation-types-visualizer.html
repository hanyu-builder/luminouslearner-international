<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gene Mutation Virtual Lab</title>
    <meta name="description" content="Interactive biology virtual lab exploring DNA mutations, frameshifts, and real-world clinical genetics.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM (UMD versions for browser) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (Standalone version to compile JSX in the browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            background-color: #0F172A; /* Deep Slate */
            color: #F8FAFC;
            margin: 0;
            padding: 0;
            background-image: radial-gradient(circle at 50% 50%, #1E293B 0%, #0F172A 100%);
        }
        /* Custom Scrollbar for better UI */
        ::-webkit-scrollbar { height: 8px; width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748B; }
    </style>
</head>
<body class="p-2 sm:p-4 flex items-center justify-center min-h-screen">
    
    <!-- React Mount Point -->
    <div id="root" class="w-full max-w-[1450px]"></div>

    <!-- React Application Code -->
    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        // --- INLINE ICONS ---
        const DnaIcon = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M2 15c6.667-6 13.333 0 20-6"/><path d="M9 22c1.798-1.998 2.518-3.995 2.808-5.993"/><path d="M15 2c-1.798 1.998-2.518 3.995-2.808 5.993"/><path d="m17 6-2.5-2.5"/><path d="m14 8-1-1"/><path d="m7 18 2.5 2.5"/><path d="m3.5 14.5.5.5"/><path d="m20 9 .5.5"/><path d="m6.5 12.5 2 2"/><path d="m11.5 16.5 2 2"/><path d="m10.5 7.5 2 2"/><path d="m15.5 10.5 2 2"/></svg>;
        const AlertIcon = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>;
        const BookIcon = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>;
        const SearchIcon = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>;

        // --- BIOLOGICAL DICTIONARY ---
        const getAminoAcid = (codon) => {
            const map = {
                'UUU': 'Phe', 'UUC': 'Phe', 'UUA': 'Leu', 'UUG': 'Leu',
                'CUU': 'Leu', 'CUC': 'Leu', 'CUA': 'Leu', 'CUG': 'Leu',
                'AUU': 'Ile', 'AUC': 'Ile', 'AUA': 'Ile', 'AUG': 'Met',
                'GUU': 'Val', 'GUC': 'Val', 'GUA': 'Val', 'GUG': 'Val',
                'UCU': 'Ser', 'UCC': 'Ser', 'UCA': 'Ser', 'UCG': 'Ser',
                'CCU': 'Pro', 'CCC': 'Pro', 'CCA': 'Pro', 'CCG': 'Pro',
                'ACU': 'Thr', 'ACC': 'Thr', 'ACA': 'Thr', 'ACG': 'Thr',
                'GCU': 'Ala', 'GCC': 'Ala', 'GCA': 'Ala', 'GCG': 'Ala',
                'UAU': 'Tyr', 'UAC': 'Tyr', 'UAA': 'STOP', 'UAG': 'STOP',
                'CAU': 'His', 'CAC': 'His', 'CAA': 'Gln', 'CAG': 'Gln',
                'AAU': 'Asn', 'AAC': 'Asn', 'AAA': 'Lys', 'AAG': 'Lys',
                'GAU': 'Asp', 'GAC': 'Asp', 'GAA': 'Glu', 'GAG': 'Glu',
                'UGU': 'Cys', 'UGC': 'Cys', 'UGA': 'STOP', 'UGG': 'Trp',
                'CGU': 'Arg', 'CGC': 'Arg', 'CGA': 'Arg', 'CGG': 'Arg',
                'AGU': 'Ser', 'AGC': 'Ser', 'AGA': 'Arg', 'AGG': 'Arg',
                'GGU': 'Gly', 'GGC': 'Gly', 'GGA': 'Gly', 'GGG': 'Gly'
            };
            return map[codon] || '---';
        };

        const AA_COLORS = {
            'Met': 'bg-emerald-500 text-white border border-emerald-400',
            'STOP': 'bg-rose-500 text-white border border-rose-400',
            'UTR': 'bg-slate-800 text-slate-500 border border-slate-700 opacity-60',
            '---': 'bg-slate-800 text-slate-500 border border-slate-700'
        };
        const getDefaultColor = () => 'bg-indigo-500/20 text-indigo-300 border border-indigo-500/50';

        // --- CLINICAL PRESETS ---
        const PRESETS = {
            "demo": {
                name: "Standard Demo (Random Gene)",
                seq: "ATGCGTACGGTCTAA",
                desc: "A simple DNA sequence demonstrating start and stop mechanics."
            },
            "hba": {
                name: "Hemoglobin Beta Chain (Normal vs. Sickle Cell)",
                seq: "ATGGTGCACCTGACTCCTGAGGAGAAGTCTGCC",
                desc: "This is the start of the normal Hemoglobin gene. Try substituting the 17th base (the 'A' in GAG) with a 'T'. Watch how the amino acid changes from Glutamic Acid (Glu) to Valine (Val), causing Sickle Cell Anemia!"
            },
            "cftr": {
                name: "CFTR Gene (Cystic Fibrosis)",
                seq: "ATGGAGAACTTCATCGAAATCTTTCCCGGA",
                desc: "Try deleting a base in this sequence. Notice how a 'Frameshift' mutation completely ruins every single amino acid downstream of the deletion, destroying the protein's function."
            }
        };

        function App() {
            // --- STATE ---
            const [activePreset, setActivePreset] = useState("hba");
            const [dnaInput, setDnaInput] = useState(PRESETS["hba"].seq);
            const [selectedIndex, setSelectedIndex] = useState(16); // Target the 17th base by default for the HbA demo
            const [mutationType, setMutationType] = useState('sub'); // 'sub', 'ins', 'del'
            const [mutationBase, setMutationBase] = useState('T');

            // Handle Preset Change
            const handlePresetChange = (e) => {
                const key = e.target.value;
                setActivePreset(key);
                setDnaInput(PRESETS[key].seq);
                setSelectedIndex(0); // Reset index
            };

            // --- LOGIC & ALGORITHMS ---
            const originalDNA = dnaInput.toUpperCase().replace(/[^ATCG]/g, '');

            const mutatedDNA = useMemo(() => {
                if (!originalDNA) return '';
                const idx = Math.min(selectedIndex, originalDNA.length - 1);
                const before = originalDNA.slice(0, idx);
                const after = originalDNA.slice(idx + 1);
                const afterIns = originalDNA.slice(idx);

                switch (mutationType) {
                    case 'sub': return before + mutationBase + after;
                    case 'del': return before + after;
                    case 'ins': return before + mutationBase + afterIns;
                    default: return originalDNA;
                }
            }, [originalDNA, selectedIndex, mutationType, mutationBase]);

            // Translate DNA (Coding Strand) -> mRNA -> Protein
            const translateSequence = (dnaSeq) => {
                const mrna = dnaSeq.replace(/T/g, 'U');
                const codons = [];
                const aminoAcids = [];
                let hasStopped = false;
                
                for (let i = 0; i < mrna.length; i += 3) {
                    const codon = mrna.slice(i, i + 3);
                    codons.push(codon);
                    
                    if (codon.length === 3) {
                        if (hasStopped) {
                            // If ribosome hit a STOP earlier, subsequent bases are Untranslated Region (UTR)
                            aminoAcids.push('UTR');
                        } else {
                            const aa = getAminoAcid(codon);
                            aminoAcids.push(aa);
                            if (aa === 'STOP') hasStopped = true;
                        }
                    } else {
                        aminoAcids.push('---');
                    }
                }
                return { mrna, codons, aminoAcids };
            };

            const origData = useMemo(() => translateSequence(originalDNA), [originalDNA]);
            const mutData = useMemo(() => translateSequence(mutatedDNA), [mutatedDNA]);

            // --- HANDLERS ---
            const handleDNAChange = (e) => {
                const val = e.target.value.toUpperCase().replace(/[^ATCG]/g, '');
                setDnaInput(val);
                if (selectedIndex >= val.length) setSelectedIndex(Math.max(0, val.length - 1));
            };

            // Intelligent Algorithm Analysis
            const getMutationExplanation = () => {
                if (!originalDNA) return null;

                if (mutationType === 'ins' || mutationType === 'del') {
                    return (
                        <div>
                            <strong className="text-rose-400 block mb-1">Frameshift Mutation</strong>
                            The reading frame has shifted. Because the ribosome reads in chunks of 3, inserting or deleting a base catastrophically alters all downstream codons, usually resulting in a non-functional protein.
                        </div>
                    );
                }

                if (mutationType === 'sub') {
                    // Find which codon was affected
                    const codonIdx = Math.floor(selectedIndex / 3);
                    const origAA = origData.aminoAcids[codonIdx];
                    const mutAA = mutData.aminoAcids[codonIdx];

                    // Check if it happened in a UTR (after a stop codon)
                    if (origAA === 'UTR') {
                        return (
                            <div>
                                <strong className="text-slate-400 block mb-1">Untranslated Region (UTR) Mutation</strong>
                                This mutation occurred after the STOP codon. It will not affect the amino acid sequence of the protein.
                            </div>
                        );
                    }

                    if (origAA === mutAA) {
                        return (
                            <div>
                                <strong className="text-emerald-400 block mb-1">Silent Mutation</strong>
                                The DNA base changed, but because the genetic code is redundant (wobble effect), it codes for the EXACT SAME amino acid. The protein remains completely normal.
                            </div>
                        );
                    }

                    if (mutAA === 'STOP') {
                        return (
                            <div>
                                <strong className="text-rose-400 block mb-1">Nonsense Mutation</strong>
                                The mutation created a premature STOP codon. The ribosome will detach early, creating a truncated (shortened) and likely non-functional protein.
                            </div>
                        );
                    }

                    return (
                        <div>
                            <strong className="text-fuchsia-400 block mb-1">Missense Mutation</strong>
                            A single amino acid changed (from <span className="font-bold text-slate-200">{origAA}</span> to <span className="font-bold text-slate-200">{mutAA}</span>). Depending on the chemical properties of the new amino acid, the protein might misfold (e.g., Sickle Cell Anemia).
                        </div>
                    );
                }
            };

            // --- RENDER HELPERS ---
            const renderSequence = (data, isMutated = false) => {
                return (
                    <div className="flex gap-3 pb-2 w-max">
                        {data.codons.map((codon, cIdx) => {
                            const origAA = origData.aminoAcids[cIdx];
                            const currAA = data.aminoAcids[cIdx];
                            
                            // Determine if this specific amino acid was changed by the mutation
                            let isAAChanged = false;
                            if (isMutated) {
                                if (mutationType === 'sub' && origAA !== currAA && currAA !== undefined && currAA !== 'UTR') isAAChanged = true;
                                if ((mutationType === 'ins' || mutationType === 'del') && cIdx >= Math.floor(selectedIndex / 3) && currAA !== 'UTR') isAAChanged = true;
                            }
                            
                            return (
                                <div key={cIdx} className="flex flex-col items-center">
                                    {/* Amino Acid Block */}
                                    <div className={`px-3 py-1.5 rounded text-xs font-bold uppercase tracking-widest mb-3 transition-all min-w-[50px] text-center
                                        ${isAAChanged ? 'bg-fuchsia-600 text-white shadow-[0_0_15px_rgba(192,38,211,0.6)] border border-fuchsia-400 z-10 scale-110' : (AA_COLORS[currAA] || getDefaultColor())}
                                    `}>
                                        {currAA}
                                    </div>
                                    
                                    {/* Codon Bases */}
                                    <div className="flex gap-1">
                                        {codon.split('').map((base, bIdx) => {
                                            const globalIdx = cIdx * 3 + bIdx;
                                            
                                            // Determine highlighting
                                            let isSelected = !isMutated && globalIdx === selectedIndex;
                                            let isMutatedBase = false;
                                            
                                            if (isMutated) {
                                                if (mutationType === 'sub' && globalIdx === selectedIndex) isMutatedBase = true;
                                                if (mutationType === 'ins' && globalIdx === selectedIndex) isMutatedBase = true;
                                            }

                                            return (
                                                <div 
                                                    key={bIdx}
                                                    onClick={() => !isMutated && setSelectedIndex(globalIdx)}
                                                    className={`
                                                        w-9 h-11 flex items-center justify-center font-mono font-bold text-xl rounded border transition-all cursor-pointer select-none
                                                        ${isSelected ? 'border-sky-400 bg-sky-900 shadow-[0_0_15px_rgba(56,189,248,0.5)] transform -translate-y-2' : ''}
                                                        ${!isSelected && !isMutatedBase ? 'border-slate-700 bg-slate-800 hover:bg-slate-700 text-slate-300' : ''}
                                                        ${isMutatedBase ? 'border-rose-400 bg-rose-900 text-rose-300 shadow-[0_0_15px_rgba(244,63,94,0.6)] transform -translate-y-2 z-10' : ''}
                                                    `}
                                                >
                                                    {base}
                                                </div>
                                            );
                                        })}
                                    </div>
                                    
                                    {/* Connection Line */}
                                    <div className={`w-0.5 h-3 mt-1 ${isAAChanged ? 'bg-fuchsia-500' : 'bg-slate-700'}`}></div>
                                </div>
                            );
                        })}
                    </div>
                );
            };

            return (
                <div className="w-full max-w-[1450px] min-h-[850px] bg-slate-900/80 backdrop-blur-xl text-slate-200 font-sans rounded-2xl shadow-[0_0_50px_rgba(0,0,0,0.6)] flex flex-col lg:flex-row border border-slate-700 overflow-hidden relative">
                    
                    {/* LEFT COLUMN: Controls */}
                    <aside className="w-full lg:w-[420px] flex flex-col bg-slate-800/50 border-r border-slate-700 shrink-0">
                        <div className="p-6 border-b border-slate-700 bg-slate-800/80 shadow-md">
                            <h1 className="text-2xl font-bold text-sky-400 mb-1 flex items-center gap-2">
                                <DnaIcon className="w-6 h-6" /> Gene Mutation
                            </h1>
                            <p className="text-[10px] text-slate-400 uppercase tracking-widest font-semibold">Protein Synthesis Lab</p>
                        </div>

                        <div className="p-6 overflow-y-auto flex-grow space-y-6">
                            
                            {/* Clinical Presets */}
                            <div>
                                <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2 block flex items-center gap-1.5"><BookIcon className="w-3 h-3"/> Load Clinical Sample</label>
                                <select 
                                    value={activePreset} 
                                    onChange={handlePresetChange}
                                    className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-slate-200 outline-none focus:ring-2 focus:ring-sky-500 cursor-pointer shadow-inner"
                                >
                                    {Object.entries(PRESETS).map(([key, data]) => (
                                        <option key={key} value={key}>{data.name}</option>
                                    ))}
                                </select>
                                <p className="text-[11px] text-slate-400 mt-2 italic leading-relaxed">
                                    {PRESETS[activePreset].desc}
                                </p>
                            </div>

                            {/* DNA Input */}
                            <div className="bg-slate-900/60 p-4 rounded-xl border border-slate-700/50 shadow-inner">
                                <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-2">Original DNA Sequence (Coding Strand)</label>
                                <input
                                    type="text"
                                    value={dnaInput}
                                    onChange={handleDNAChange}
                                    className="w-full bg-slate-950 border border-slate-700 focus:border-sky-500 rounded-lg p-3 font-mono text-center outline-none transition-colors tracking-[0.2em] text-sky-300"
                                    placeholder="ATGCGTACGGTCTAA"
                                />
                                <div className="text-[10px] text-slate-500 mt-2 text-right">T converts to U during transcription</div>
                            </div>

                            {/* Mutation Controls */}
                            <div className="bg-slate-800 rounded-xl p-5 border border-slate-700 shadow-lg relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-1 h-full bg-rose-500"></div>
                                <h3 className="text-xs font-bold text-white uppercase tracking-wider mb-4 flex items-center gap-2">
                                    <AlertIcon className="w-4 h-4 text-rose-400" /> Inject Mutation
                                </h3>
                                
                                <div className="mb-4">
                                    <div className="flex justify-between items-end mb-1">
                                        <label className="text-[10px] uppercase text-slate-400 font-bold">Target Base Index</label>
                                        <span className="text-rose-400 font-mono text-xs font-bold bg-rose-950/50 px-2 rounded border border-rose-900/50">Base {selectedIndex + 1}</span>
                                    </div>
                                    <input 
                                        type="range" 
                                        min="0" 
                                        max={Math.max(0, originalDNA.length - 1)} 
                                        value={selectedIndex} 
                                        onChange={(e) => setSelectedIndex(parseInt(e.target.value))}
                                        className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-rose-500 mt-2"
                                    />
                                    <div className="text-[9px] text-slate-500 mt-1 italic">Or click directly on a base in the Original Sequence grid.</div>
                                </div>

                                <div className="grid grid-cols-3 gap-2 mb-4">
                                    {['sub', 'ins', 'del'].map((type) => (
                                        <button
                                            key={type}
                                            onClick={() => setMutationType(type)}
                                            className={`py-2 rounded-lg text-[10px] font-bold uppercase tracking-wider transition-all ${
                                                mutationType === type 
                                                ? 'bg-rose-600 border border-rose-400 text-white shadow-[0_0_15px_rgba(225,29,72,0.4)]' 
                                                : 'bg-slate-900 border border-slate-700 text-slate-400 hover:bg-slate-800'
                                            }`}
                                        >
                                            {type === 'sub' ? 'Substitute' : type === 'ins' ? 'Insert' : 'Delete'}
                                        </button>
                                    ))}
                                </div>

                                {mutationType !== 'del' && (
                                    <div className="bg-slate-900/50 p-3 rounded-lg border border-slate-700/50">
                                        <label className="text-[10px] font-bold uppercase text-slate-400 block mb-2 text-center">Inject New Nucleotide</label>
                                        <div className="flex gap-2">
                                            {['A', 'T', 'C', 'G'].map(base => (
                                                <button
                                                    key={base}
                                                    onClick={() => setMutationBase(base)}
                                                    className={`flex-1 py-2 rounded-md font-mono font-bold text-lg border transition-all ${
                                                        mutationBase === base
                                                        ? 'bg-sky-500 border-sky-400 text-white shadow-[0_0_10px_rgba(14,165,233,0.5)] scale-105'
                                                        : 'bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-700'
                                                    }`}
                                                >
                                                    {base}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </aside>

                    {/* RIGHT COLUMN: Visualizer */}
                    <main className="flex-1 flex flex-col overflow-hidden bg-slate-950 p-4 md:p-6 gap-4">
                        
                        {/* Original Sequence View */}
                        <div className="bg-slate-900/80 rounded-2xl border border-slate-800 p-5 flex flex-col overflow-x-auto shadow-inner h-1/2 relative">
                            <h2 className="text-xs font-bold text-sky-400 uppercase tracking-widest border-b border-slate-800 pb-2 mb-2 sticky left-0">Original Transcript</h2>
                            <div className="flex-1 overflow-x-auto overflow-y-hidden flex items-center">
                                {renderSequence(origData, false)}
                            </div>
                        </div>

                        {/* Mutated Sequence View */}
                        <div className="bg-slate-900/80 rounded-2xl border border-slate-800 p-5 flex flex-col overflow-x-auto shadow-inner h-1/2 relative">
                            <h2 className="text-xs font-bold text-rose-400 uppercase tracking-widest border-b border-slate-800 pb-2 mb-2 sticky left-0 flex items-center gap-2">
                                Mutated Transcript
                                <span className="text-[10px] font-normal text-slate-500 ml-2 tracking-normal border border-slate-700 bg-slate-800 px-2 py-0.5 rounded-full">
                                    Compared to Original
                                </span>
                            </h2>
                            <div className="flex-1 overflow-x-auto overflow-y-hidden flex items-center">
                                {renderSequence(mutData, true)}
                            </div>
                        </div>

                        {/* Algorithmic Analysis Floating Box */}
                        <div className="absolute bottom-6 right-6 md:bottom-10 md:right-10 pointer-events-none z-20 bg-slate-900/95 p-5 rounded-2xl backdrop-blur-xl border border-slate-700 shadow-[0_10px_40px_rgba(0,0,0,0.5)] max-w-md">
                            <h4 className="text-[10px] text-fuchsia-400 uppercase font-bold mb-2 tracking-widest flex items-center gap-2">
                                <SearchIcon className="w-3 h-3"/> Translation Analysis
                            </h4>
                            <div className="text-sm text-slate-300 leading-relaxed font-medium">
                                {getMutationExplanation()}
                            </div>
                        </div>

                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
