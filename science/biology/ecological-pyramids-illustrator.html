<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Biology Virtual Labs | Ecological Pyramids</title>
    <meta name="description" content="Interactive Ecological Pyramids Illustrator. Visualize Energy, Biomass, and Numbers pyramids with real-time thermodynamic validation and trophic efficiency calculations.">
    
    <!-- React & Tailwind -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Framer Motion -->
    <script src="https://unpkg.com/framer-motion@10.12.16/dist/framer-motion.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0F172A; color: #f8fafc; margin: 0; overflow: hidden; }
        
        .glass-panel {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: #475569; border-radius: 4px; }
        
        /* Custom Sliders */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
            width: 100%;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px; width: 16px;
            border-radius: 50%;
            background: currentColor;
            cursor: pointer;
            margin-top: -5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 6px;
            cursor: pointer; border-radius: 4px;
            background: #334155;
        }

        .canvas-bg {
            background-image: radial-gradient(#334155 1px, transparent 1px);
            background-size: 24px 24px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { motion, AnimatePresence } = window.Motion;

        // --- ICONS ---
        const Icon = ({ name, className = "", size = 20 }) => {
            const [svgHtml, setSvgHtml] = useState('');
            useEffect(() => {
                if (window.lucide && window.lucide.icons) {
                    const pascalName = name.split('-').map(part => part.charAt(0).toUpperCase() + part.slice(1)).join('');
                    const iconData = window.lucide.icons[pascalName];
                    if (iconData) {
                        const svgElement = window.lucide.createElement(iconData);
                        svgElement.setAttribute('class', className);
                        svgElement.setAttribute('width', size);
                        svgElement.setAttribute('height', size);
                        setSvgHtml(svgElement.outerHTML);
                    }
                }
            }, [name, className, size]);
            if (!svgHtml) return <span className={className} style={{ width: size, height: size, display: 'inline-block' }}></span>;
            return <span dangerouslySetInnerHTML={{ __html: svgHtml }} className="flex items-center justify-center" />;
        };

        // --- SCIENTIFIC PRESETS & DATA MODELS ---
        const PRESETS = {
            energy: {
                id: 'energy',
                icon: 'zap',
                title: "Energy Pyramid",
                unit: "kcal/m²/yr",
                description: "Shows the flow of energy. MUST always be upright due to the 2nd Law of Thermodynamics (energy is lost as heat).",
                data: [
                    { id: 't4', level: 'Apex Predators', default: 10, color: '#f43f5e', max: 500 },     // Rose
                    { id: 't3', level: 'Secondary Consumers', default: 100, color: '#f59e0b', max: 5000 },  // Amber
                    { id: 't2', level: 'Primary Consumers', default: 1000, color: '#3b82f6', max: 50000 }, // Blue
                    { id: 't1', level: 'Primary Producers', default: 10000, color: '#10b981', max: 100000 }  // Emerald
                ]
            },
            biomass_terrestrial: {
                id: 'biomass_terrestrial',
                icon: 'leaf',
                title: "Biomass (Forest)",
                unit: "g/m²",
                description: "Dry weight of living matter. In terrestrial ecosystems, producers (like massive trees) hold the vast majority of the biomass.",
                data: [
                    { id: 't4', level: 'Apex Predators', default: 1, color: '#f43f5e', max: 50 },
                    { id: 't3', level: 'Secondary Consumers', default: 10, color: '#f59e0b', max: 500 },
                    { id: 't2', level: 'Primary Consumers', default: 100, color: '#3b82f6', max: 2000 },
                    { id: 't1', level: 'Primary Producers', default: 1000, color: '#10b981', max: 10000 }
                ]
            },
            biomass_aquatic: {
                id: 'biomass_aquatic',
                icon: 'droplets',
                title: "Biomass (Aquatic) - Inverted",
                unit: "g/m²",
                description: "Can be inverted! Phytoplankton reproduce rapidly but are eaten quickly by a much larger standing biomass of zooplankton.",
                data: [
                    { id: 't4', level: 'Apex Predators (Sharks)', default: 2, color: '#f43f5e', max: 10 },
                    { id: 't3', level: 'Secondary Consumers (Fish)', default: 6, color: '#f59e0b', max: 20 },
                    { id: 't2', level: 'Primary Consumers (Zooplankton)', default: 21, color: '#3b82f6', max: 50 },
                    { id: 't1', level: 'Producers (Phytoplankton)', default: 4, color: '#10b981', max: 50 }
                ]
            },
            numbers_grassland: {
                id: 'numbers_grassland',
                icon: 'hash',
                title: "Numbers (Grassland)",
                unit: "individuals",
                description: "Counts individual organisms. A typical grassland has millions of blades of grass supporting fewer herbivores.",
                data: [
                    { id: 't4', level: 'Apex Predators', default: 1, color: '#f43f5e', max: 10 },
                    { id: 't3', level: 'Secondary Consumers', default: 50, color: '#f59e0b', max: 500 },
                    { id: 't2', level: 'Primary Consumers', default: 2000, color: '#3b82f6', max: 10000 },
                    { id: 't1', level: 'Primary Producers', default: 500000, color: '#10b981', max: 1000000 }
                ]
            },
            numbers_tree: {
                id: 'numbers_tree',
                icon: 'tree-deciduous',
                title: "Numbers (Single Tree) - Spindle",
                unit: "individuals",
                description: "A single large oak tree can support thousands of herbivorous insects, which support fewer birds. Forms a spindle shape.",
                data: [
                    { id: 't4', level: 'Apex Predators', default: 2, color: '#f43f5e', max: 10 },
                    { id: 't3', level: 'Secondary Consumers', default: 15, color: '#f59e0b', max: 100 },
                    { id: 't2', level: 'Primary Consumers', default: 2000, color: '#3b82f6', max: 5000 },
                    { id: 't1', level: 'Producers (Oak Tree)', default: 1, color: '#10b981', max: 10 }
                ]
            }
        };

        const App = () => {
            // --- STATE ---
            const [activePreset, setActivePreset] = useState('energy');
            const [pyramidData, setPyramidData] = useState([]);

            // Load preset data on change
            useEffect(() => {
                const preset = PRESETS[activePreset];
                setPyramidData(preset.data.map(d => ({ ...d, value: d.default })));
            }, [activePreset]);

            // --- HANDLERS ---
            const handleValueChange = (index, newValue) => {
                const updatedData = [...pyramidData];
                updatedData[index].value = Math.max(0, Number(newValue)); // Prevent negative
                setPyramidData(updatedData);
            };

            const applyTenPercentRule = () => {
                if (pyramidData.length === 0) return;
                const updatedData = [...pyramidData];
                // Base off the producer value (index 3)
                const baseValue = updatedData[3].value || 10000;
                updatedData[3].value = baseValue;
                updatedData[2].value = baseValue * 0.1;
                updatedData[1].value = baseValue * 0.01;
                updatedData[0].value = baseValue * 0.001;
                setPyramidData(updatedData);
            };

            // --- DERIVED CALCULATIONS ---
            const { maxVal, isEnergyViolation } = useMemo(() => {
                if (pyramidData.length === 0) return { maxVal: 1, isEnergyViolation: false };
                
                const max = Math.max(...pyramidData.map(d => d.value), 0.001);
                
                // Thermodynamics Check: If it's an energy pyramid, check for inversion
                let violation = false;
                if (activePreset === 'energy') {
                    for (let i = 0; i < pyramidData.length - 1; i++) {
                        // Data is top-down (t4, t3, t2, t1). So index i is higher trophic level than i+1
                        // Higher trophic level energy MUST be LESS than lower trophic level
                        if (pyramidData[i].value >= pyramidData[i+1].value && pyramidData[i].value !== 0) {
                            violation = true;
                            break;
                        }
                    }
                }
                return { maxVal: max, isEnergyViolation: violation };
            }, [pyramidData, activePreset]);

            // SVG Constants
            const SVG_WIDTH = 800;
            const SVG_HEIGHT = 600;
            const BAR_HEIGHT = 80;
            const GAP = 15;
            const START_Y = 100; // Top padding

            if (pyramidData.length === 0) return null;

            return (
                <div className="flex flex-col h-screen max-h-[1000px] w-full bg-[#0F172A] text-slate-200 overflow-hidden">
                    
                    {/* HEADER */}
                    <header className="px-6 py-4 border-b border-slate-800 bg-slate-900/80 backdrop-blur z-20 flex flex-col lg:flex-row lg:items-center justify-between gap-4 shrink-0 shadow-lg">
                        <div>
                            <h1 className="text-2xl md:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-500 flex items-center gap-3">
                                <Icon name="mountain" size={28} className="text-emerald-400"/> Ecological Pyramids
                            </h1>
                            <p className="text-[10px] md:text-xs font-medium text-slate-400 uppercase tracking-widest mt-1">Interactive Trophic Models & Thermodynamics</p>
                        </div>
                        
                        {/* Preset Toggles */}
                        <div className="flex flex-wrap gap-2 bg-slate-950 p-1.5 rounded-xl border border-slate-700 shadow-inner">
                            {Object.values(PRESETS).map(preset => (
                                <button 
                                    key={preset.id}
                                    onClick={() => setActivePreset(preset.id)}
                                    className={`flex items-center gap-1.5 px-3 py-2 text-xs font-bold uppercase tracking-wider rounded-lg transition-all ${activePreset === preset.id ? 'bg-slate-700 text-white shadow-md' : 'text-slate-500 hover:text-slate-300 hover:bg-slate-800'}`}
                                >
                                    <Icon name={preset.icon} size={16} /> 
                                    <span className="hidden sm:inline">{preset.title.split(' ')[0]}</span>
                                </button>
                            ))}
                        </div>
                    </header>

                    {/* MAIN CONTENT SPLIT */}
                    <main className="flex-1 flex flex-col md:flex-row overflow-hidden relative z-0">
                        
                        {/* LEFT COMPARTMENT: CONTROLS & DATA */}
                        <aside className="w-full md:w-[420px] bg-slate-800/30 border-r border-slate-700 p-5 flex flex-col shadow-2xl z-10 overflow-y-auto custom-scrollbar shrink-0">
                            
                            {/* Info Card */}
                            <div className="p-5 rounded-xl border border-slate-700 bg-slate-800 shadow-lg mb-6">
                                <div className="flex items-center gap-2 mb-2 text-white">
                                    <Icon name={PRESETS[activePreset].icon} size={20} className="text-emerald-400" />
                                    <h2 className="text-lg font-black tracking-wide">{PRESETS[activePreset].title}</h2>
                                </div>
                                <p className="text-xs text-slate-300 leading-relaxed">
                                    {PRESETS[activePreset].description}
                                </p>
                                {activePreset === 'energy' && (
                                    <button 
                                        onClick={applyTenPercentRule}
                                        className="mt-4 w-full py-2 bg-emerald-600/20 hover:bg-emerald-600/40 text-emerald-400 border border-emerald-500/50 rounded-lg text-xs font-bold transition-colors flex items-center justify-center gap-2"
                                    >
                                        <Icon name="wand-2" size={14} /> Auto-Balance (10% Rule)
                                    </button>
                                )}
                            </div>

                            {/* Interactive Inputs */}
                            <div className="flex-1 flex flex-col gap-4">
                                <div className="flex justify-between items-end border-b border-slate-700 pb-2">
                                    <h3 className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Trophic Levels</h3>
                                    <span className="text-[10px] text-slate-500 font-mono font-bold bg-slate-900 px-2 py-0.5 rounded border border-slate-800">Unit: {PRESETS[activePreset].unit}</span>
                                </div>

                                {/* Render inputs bottom-up conceptually, so reverse the array */}
                                {[...pyramidData].reverse().map((layer, reversedIndex) => {
                                    const originalIndex = pyramidData.length - 1 - reversedIndex;
                                    
                                    return (
                                        <div key={layer.id} className="bg-slate-900/60 p-4 rounded-xl border border-slate-700 transition-colors shadow-inner relative overflow-hidden">
                                            <div className="absolute top-0 left-0 w-1 h-full" style={{ backgroundColor: layer.color }}></div>
                                            
                                            <div className="flex justify-between items-center mb-3 pl-2">
                                                <label className="text-xs font-bold uppercase tracking-wider" style={{ color: layer.color }}>
                                                    {layer.level}
                                                </label>
                                            </div>
                                            
                                            <div className="pl-2 space-y-3">
                                                <div className="flex items-center gap-3">
                                                    <input
                                                        type="number"
                                                        min="0"
                                                        step="any"
                                                        value={layer.value}
                                                        onChange={(e) => handleValueChange(originalIndex, e.target.value)}
                                                        className="w-24 bg-slate-800 border border-slate-600 rounded-lg px-2 py-1.5 text-white font-mono text-sm focus:outline-none focus:border-white transition-colors"
                                                    />
                                                    <input 
                                                        type="range" 
                                                        min="0" 
                                                        max={layer.max} 
                                                        value={layer.value} 
                                                        onChange={(e) => handleValueChange(originalIndex, e.target.value)}
                                                        style={{ color: layer.color }}
                                                    />
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </aside>

                        {/* RIGHT COMPARTMENT: INTERACTIVE SVG ILLUSTRATOR */}
                        <section className="flex-1 relative flex items-center justify-center bg-[#0B0F19] canvas-bg p-4 overflow-hidden">
                            
                            {/* Thermodynamics Warning Overlay */}
                            <AnimatePresence>
                                {isEnergyViolation && (
                                    <motion.div 
                                        initial={{ opacity: 0, y: -20 }} 
                                        animate={{ opacity: 1, y: 0 }} 
                                        exit={{ opacity: 0, y: -20 }}
                                        className="absolute top-6 left-1/2 transform -translate-x-1/2 bg-red-950/90 border-2 border-red-500 text-red-200 px-5 py-3 rounded-xl flex items-center gap-3 shadow-[0_0_30px_rgba(239,68,68,0.5)] z-20"
                                    >
                                        <Icon name="alert-triangle" size={24} className="text-red-400" />
                                        <div>
                                            <h4 className="font-bold text-sm">Violation of Thermodynamics</h4>
                                            <p className="text-xs text-red-300/80">Energy MUST decrease at higher trophic levels (Lost as heat).</p>
                                        </div>
                                    </motion.div>
                                )}
                            </AnimatePresence>

                            {/* Main Canvas */}
                            <svg viewBox={`0 0 ${SVG_WIDTH} ${SVG_HEIGHT}`} className="w-full h-full max-h-[800px] drop-shadow-2xl overflow-visible">
                                <defs>
                                    {/* Glassmorphism Gradients */}
                                    {pyramidData.map((layer) => (
                                        <linearGradient key={`grad-${layer.id}`} id={`grad-${layer.id}`} x1="0%" y1="0%" x2="100%" y2="0%">
                                            <stop offset="0%" stopColor={layer.color} stopOpacity="0.7" />
                                            <stop offset="50%" stopColor={layer.color} stopOpacity="1" />
                                            <stop offset="100%" stopColor={layer.color} stopOpacity="0.7" />
                                        </linearGradient>
                                    ))}
                                    {/* Arrow marker for paths */}
                                    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                                        <polygon points="0 0, 10 3.5, 0 7" fill="#34D399" />
                                    </marker>
                                    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                                        <polygon points="0 0, 10 3.5, 0 7" fill="#F87171" />
                                    </marker>
                                </defs>

                                {/* Draw Pyramid Layers & Flow Arrows */}
                                {pyramidData.map((layer, idx) => {
                                    // Scientific Geometry Calculation: Proportional width
                                    let calculatedWidth = (layer.value / maxVal) * (SVG_WIDTH - 250); // Leave room for arrows
                                    if (layer.value > 0 && calculatedWidth < 6) calculatedWidth = 6;
                                    if (layer.value === 0) calculatedWidth = 0;

                                    const xPos = (SVG_WIDTH - calculatedWidth) / 2;
                                    const yPos = START_Y + idx * (BAR_HEIGHT + GAP);

                                    // Efficiency Calculations (Upward flow)
                                    let efficiency = null;
                                    let loss = null;
                                    if (idx < pyramidData.length - 1) { // If not the bottom layer
                                        const prevLayer = pyramidData[idx + 1]; // The layer below it
                                        if (prevLayer.value > 0) {
                                            efficiency = ((layer.value / prevLayer.value) * 100);
                                            loss = 100 - efficiency;
                                        }
                                    }

                                    return (
                                        <g key={layer.id}>
                                            {/* The Geometric Block using Framer Motion for smooth transitions */}
                                            <motion.rect
                                                initial={false}
                                                animate={{ x: xPos, width: calculatedWidth, y: yPos }}
                                                transition={{ type: "spring", stiffness: 100, damping: 20 }}
                                                height={BAR_HEIGHT}
                                                rx="6" 
                                                fill={`url(#grad-${layer.id})`}
                                                className="shadow-2xl"
                                                style={{ filter: 'drop-shadow(0px 15px 25px rgba(0,0,0,0.5))' }}
                                            />

                                            {/* Inner Text Label */}
                                            <AnimatePresence>
                                                {calculatedWidth > 150 && (
                                                    <motion.text 
                                                        initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }}
                                                        x={SVG_WIDTH / 2} 
                                                        y={yPos + BAR_HEIGHT / 2 + 6} 
                                                        textAnchor="middle" 
                                                        fill="rgba(0,0,0,0.6)" 
                                                        fontSize="16" 
                                                        fontWeight="900"
                                                        className="pointer-events-none"
                                                    >
                                                        {layer.level}
                                                    </motion.text>
                                                )}
                                            </AnimatePresence>

                                            {/* Floating Value */}
                                            <motion.text 
                                                animate={{ x: xPos + calculatedWidth + 15, y: yPos + BAR_HEIGHT / 2 + 5 }}
                                                transition={{ type: "spring", stiffness: 100, damping: 20 }}
                                                textAnchor="start" 
                                                fill={layer.color} 
                                                fontSize="16" 
                                                fontWeight="900"
                                                className="pointer-events-none font-mono drop-shadow-md"
                                            >
                                                {Number(layer.value).toLocaleString(undefined, {maximumFractionDigits: 1})}
                                            </motion.text>

                                            {/* ENERGY FLOW ARROWS (Only for Energy/Biomass, not numbers usually, but good for all conceptually here) */}
                                            {efficiency !== null && !isEnergyViolation && (
                                                <g className="transition-opacity duration-500">
                                                    {/* Upward Transfer Arrow (Green) */}
                                                    <path 
                                                        d={`M ${SVG_WIDTH - 60} ${yPos + BAR_HEIGHT + GAP/2} C ${SVG_WIDTH - 20} ${yPos + BAR_HEIGHT + GAP/2}, ${SVG_WIDTH - 20} ${yPos + BAR_HEIGHT/2}, ${SVG_WIDTH - 60} ${yPos + BAR_HEIGHT/2}`}
                                                        fill="none"
                                                        stroke="#34D399"
                                                        strokeWidth="3"
                                                        strokeDasharray="4 4"
                                                        markerEnd="url(#arrowhead-green)"
                                                        opacity="0.9"
                                                    />
                                                    <text x={SVG_WIDTH - 15} y={yPos + BAR_HEIGHT - 5} fill="#34D399" fontSize="12" fontWeight="bold" textAnchor="start" className="font-mono drop-shadow-md">
                                                        {efficiency.toFixed(1)}% IN
                                                    </text>

                                                    {/* Outward Heat Loss Arrow (Red) - Only if efficiency < 100% */}
                                                    {loss > 0 && (
                                                        <g>
                                                            <path 
                                                                d={`M 80 ${yPos + BAR_HEIGHT + GAP/2} C 40 ${yPos + BAR_HEIGHT + GAP/2}, 40 ${yPos + BAR_HEIGHT/2 + 20}, 20 ${yPos + BAR_HEIGHT/2 + 20}`}
                                                                fill="none"
                                                                stroke="#F87171"
                                                                strokeWidth="2.5"
                                                                opacity="0.9"
                                                                markerEnd="url(#arrowhead-red)"
                                                            />
                                                            <text x="10" y={yPos + BAR_HEIGHT/2 + 15} fill="#FCA5A5" fontSize="11" fontWeight="bold" textAnchor="start" className="font-mono drop-shadow-md">
                                                                {loss.toFixed(1)}% LOST (Heat/Waste)
                                                            </text>
                                                        </g>
                                                    )}
                                                </g>
                                            )}
                                        </g>
                                    );
                                })}
                            </svg>
                        </section>

                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
