<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <!-- SEO Keyword Integrated -->
    <title>Ohms Law IV Curve Simulator & Physics Grapher</title>
    <meta name="description" content="Interactive Ohms law IV curve simulator. Visualize V=IR, plot Current-Voltage graphs, and differentiate between Ohmic and Non-Ohmic conductors like filament lamps and diodes.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js for real-time IV characteristic graphing -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { background-color: #0F172A; } /* Deep Slate */
        
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(71, 85, 105, 0.5);
        }

        /* Math equation block */
        .math-box {
            background-color: #0f172a;
            border: 1px solid #334155;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; display: block; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        
        /* Interactive Component Highlighting */
        .svg-component { transition: all 0.3s ease; }
        .svg-glow { filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.8)); }
        
        /* D3/Chart.js styling overrides */
        .tick text {
            fill: #94a3b8;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }
    </style>
</head>
<body class="text-slate-200 h-screen w-screen overflow-hidden flex items-center justify-center p-4 font-sans">

    <!-- Main Simulator Container -->
    <main class="w-full max-w-[1400px] h-full max-h-[900px] flex flex-col glass-panel rounded-2xl shadow-2xl p-6 relative">
        
        <!-- Header -->
        <header class="flex justify-between items-end border-b border-slate-600 pb-4 mb-6 shrink-0">
            <div>
                <h1 class="text-3xl font-bold text-white tracking-wide">Ohm's Law <i>I</i>-<i>V</i> Grapher</h1>
                <p class="text-slate-400 mt-1 text-sm">Analyze characteristic curves of Ohmic and Non-Ohmic conductors.</p>
            </div>
            <div class="text-right flex gap-3 hidden md:flex items-center">
                <div class="math-box text-sm font-mono text-emerald-400 px-4 py-2 rounded-lg" title="Ohm's Law">
                    V = I &times; R
                </div>
                <div class="math-box text-sm font-mono text-violet-400 px-4 py-2 rounded-lg" title="Resistance">
                    R = V / I
                </div>
                <div class="math-box text-sm font-mono text-sky-400 px-4 py-2 rounded-lg" title="Conductance">
                    Slope &prop; 1/R
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <div class="flex-1 flex flex-col lg:flex-row gap-6 min-h-0">
            
            <!-- Left Column: Controls & Circuit Diagram -->
            <div class="w-full lg:w-4/12 flex flex-col gap-4 h-full shrink-0 overflow-y-auto pr-2 custom-scrollbar">
                
                <!-- Component Selector -->
                <div class="bg-slate-800/80 rounded-xl p-5 border border-slate-700 shrink-0">
                    <h2 class="text-sm font-semibold text-amber-400 mb-4 border-b border-slate-700 pb-2">
                        <i class="fa-solid fa-microchip mr-2"></i> Test Component
                    </h2>
                    
                    <select id="componentSelect" class="w-full bg-slate-900 text-white border border-slate-600 rounded-lg p-2 focus:ring-2 focus:ring-amber-500 outline-none transition cursor-pointer font-medium mb-3">
                        <option value="resistor">Fixed Resistor (Ohmic)</option>
                        <option value="lamp">Filament Lamp (Non-Ohmic)</option>
                        <option value="diode">Semiconductor Diode (Non-Ohmic)</option>
                    </select>

                    <div id="componentDesc" class="text-xs text-slate-400 leading-relaxed bg-slate-900/50 p-3 rounded border border-slate-700">
                        <!-- Description injected via JS -->
                    </div>
                </div>

                <!-- Variable Power Supply -->
                <div class="bg-slate-800/80 rounded-xl p-5 border border-slate-700 shrink-0">
                    <h2 class="text-sm font-semibold text-rose-400 mb-4 border-b border-slate-700 pb-2">
                        <i class="fa-solid fa-battery-half mr-2"></i> Variable Power Supply
                    </h2>
                    
                    <div class="mb-2 bg-slate-900/50 p-4 rounded-lg border border-slate-600 shadow-inner">
                        <div class="flex justify-between text-sm font-medium text-slate-300 mb-2">
                            <label>Applied Voltage (<i>V</i>)</label>
                            <span id="vValue" class="font-mono text-white font-bold">0.0 V</span>
                        </div>
                        <input type="range" id="vSlider" min="-10" max="10" step="0.1" value="0" class="w-full cursor-pointer accent-sky-500">
                        <div class="flex justify-between text-[10px] text-slate-500 mt-2 font-bold uppercase">
                            <span class="text-blue-400 hover:text-blue-300 transition cursor-pointer" onclick="document.getElementById('vSlider').value=-10; document.getElementById('vSlider').dispatchEvent(new Event('input'))">-10V</span>
                            <span class="text-slate-400 hover:text-white transition cursor-pointer" onclick="document.getElementById('vSlider').value=0; document.getElementById('vSlider').dispatchEvent(new Event('input'))">0V</span>
                            <span class="text-red-400 hover:text-red-300 transition cursor-pointer" onclick="document.getElementById('vSlider').value=10; document.getElementById('vSlider').dispatchEvent(new Event('input'))">+10V</span>
                        </div>
                    </div>
                </div>

                <!-- Schematic Circuit Diagram -->
                <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700 flex-1 flex flex-col relative min-h-[220px]">
                    <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-widest mb-2 absolute top-4 left-4 z-10">Circuit Diagram</h3>
                    
                    <div class="flex-1 w-full flex items-center justify-center mt-4 relative">
                        <svg viewBox="0 0 400 220" class="w-full h-full max-w-[300px]">
                            <!-- Base Wires -->
                            <path d="M 200 180 L 80 180 L 80 50 L 160 50" fill="none" stroke="#475569" stroke-width="4"/>
                            <path d="M 240 50 L 320 50 L 320 180 L 200 180" fill="none" stroke="#475569" stroke-width="4"/>
                            
                            <!-- Animated Current Flow Lines -->
                            <!-- Path 1: From positive terminal (left side) up to component -->
                            <path id="flow-left" class="animated-wire" d="M 185 180 L 80 180 L 80 50 L 160 50" fill="none" stroke="#facc15" stroke-width="2" stroke-dasharray="8 8" stroke-linecap="round"/>
                            <!-- Path 2: From component down to negative terminal (right side) -->
                            <path id="flow-right" class="animated-wire" d="M 240 50 L 320 50 L 320 180 L 215 180" fill="none" stroke="#facc15" stroke-width="2" stroke-dasharray="8 8" stroke-linecap="round"/>
                            
                            <!-- Voltmeter Parallel Branch -->
                            <path d="M 120 50 L 120 110 L 170 110" fill="none" stroke="#64748b" stroke-width="2"/>
                            <path d="M 230 110 L 280 110 L 280 50" fill="none" stroke="#64748b" stroke-width="2"/>
                            <!-- Nodes -->
                            <circle cx="120" cy="50" r="4" fill="#cbd5e1"/>
                            <circle cx="280" cy="50" r="4" fill="#cbd5e1"/>

                            <!-- Variable Power Supply (Bottom) -->
                            <g transform="translate(200, 180)">
                                <line x1="-15" y1="-15" x2="-15" y2="15" stroke="#ef4444" stroke-width="4"/>
                                <line x1="15" y1="-10" x2="15" y2="10" stroke="#3b82f6" stroke-width="6"/>
                                <line x1="-30" y1="20" x2="30" y2="-20" stroke="#f8fafc" stroke-width="2"/>
                                <polygon points="30,-20 20,-20 30,-10" fill="#f8fafc"/>
                                <text x="-25" y="-20" fill="#ef4444" font-size="14" font-weight="bold" font-family="sans-serif">+</text>
                                <text x="25" y="-20" fill="#3b82f6" font-size="14" font-weight="bold" font-family="sans-serif">-</text>
                            </g>

                            <!-- Ammeter (Left) -->
                            <g transform="translate(80, 115)">
                                <circle cx="0" cy="0" r="18" fill="#0f172a" stroke="#f59e0b" stroke-width="3"/>
                                <text x="0" y="5" fill="#f59e0b" font-size="16" font-family="sans-serif" font-weight="bold" text-anchor="middle">A</text>
                            </g>

                            <!-- Voltmeter (Center Parallel) -->
                            <g transform="translate(200, 110)">
                                <circle cx="0" cy="0" r="18" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
                                <text x="0" y="5" fill="#38bdf8" font-size="16" font-family="sans-serif" font-weight="bold" text-anchor="middle">V</text>
                            </g>

                            <!-- Component Symbols (Dynamically Switched) -->
                            <g transform="translate(200, 50)" id="svg-component-container" class="svg-component svg-glow">
                                <!-- Resistor -->
                                <g id="sym-resistor">
                                    <rect x="-40" y="-12" width="80" height="24" fill="#1e293b" stroke="#fff" stroke-width="3"/>
                                </g>
                                <!-- Filament Lamp -->
                                <g id="sym-lamp" style="display: none;">
                                    <circle cx="0" cy="0" r="18" fill="#1e293b" stroke="#fff" stroke-width="3"/>
                                    <line x1="-12" y1="-12" x2="12" y2="12" stroke="#fff" stroke-width="3"/>
                                    <line x1="-12" y1="12" x2="12" y2="-12" stroke="#fff" stroke-width="3"/>
                                </g>
                                <!-- Diode -->
                                <g id="sym-diode" style="display: none;">
                                    <polygon points="-15,-15 15,0 -15,15" fill="#1e293b" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
                                    <line x1="15" y1="-15" x2="15" y2="15" stroke="#fff" stroke-width="3"/>
                                    <line x1="-40" y1="0" x2="-15" y2="0" stroke="#fff" stroke-width="3"/>
                                    <line x1="15" y1="0" x2="40" y2="0" stroke="#fff" stroke-width="3"/>
                                </g>
                            </g>
                        </svg>
                    </div>
                </div>

            </div>

            <!-- Right Column: Graph & Meters -->
            <div class="w-full lg:w-8/12 flex flex-col gap-4 h-full min-h-0">
                
                <!-- Digital Meters -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 shrink-0">
                    <div class="bg-slate-800/80 rounded-xl p-3 lg:p-4 border border-slate-700 flex flex-col justify-center items-center shadow-[inset_0_0_20px_rgba(56,189,248,0.1)]">
                        <div class="text-[10px] lg:text-xs text-sky-400 font-bold uppercase tracking-widest mb-1"><i class="fa-solid fa-v mr-1"></i> Voltmeter</div>
                        <div class="text-2xl lg:text-3xl font-mono text-white tracking-wider" id="meterV">0.00 V</div>
                    </div>
                    <div class="bg-slate-800/80 rounded-xl p-3 lg:p-4 border border-slate-700 flex flex-col justify-center items-center shadow-[inset_0_0_20px_rgba(245,158,11,0.1)]">
                        <div class="text-[10px] lg:text-xs text-amber-400 font-bold uppercase tracking-widest mb-1"><i class="fa-solid fa-a mr-1"></i> Ammeter</div>
                        <div class="text-2xl lg:text-3xl font-mono text-white tracking-wider" id="meterI">0.0 mA</div>
                    </div>
                    <!-- New Ohmmeter -->
                    <div class="bg-slate-800/80 rounded-xl p-3 lg:p-4 border border-slate-700 flex flex-col justify-center items-center shadow-[inset_0_0_20px_rgba(139,92,246,0.1)]">
                        <div class="text-[10px] lg:text-xs text-violet-400 font-bold uppercase tracking-widest mb-1" title="R = V / I"><i class="fa-solid fa-omega mr-1"></i> Resistance</div>
                        <div class="text-2xl lg:text-3xl font-mono text-white tracking-wider" id="meterR">--- &Omega;</div>
                    </div>
                </div>

                <!-- I-V Characteristic Graph (Chart.js) -->
                <div class="flex-1 bg-slate-800/80 rounded-xl p-4 border border-slate-700 flex flex-col relative min-h-0">
                    <div class="flex justify-between items-center mb-2 shrink-0">
                        <h3 class="text-sm font-semibold text-slate-300">
                            $I-V$ Characteristic Curve
                        </h3>
                        <div class="flex items-center gap-2 text-xs text-slate-400 font-mono">
                            <span class="w-3 h-3 rounded-full bg-emerald-400 shadow-[0_0_8px_#34d399]"></span> Operating Point
                        </div>
                    </div>
                    <div class="flex-1 relative w-full h-full min-h-0 bg-slate-900 rounded-lg shadow-inner">
                        <canvas id="ivChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Simulation Physics & UI Logic -->
    <script>
        /**
         * PHYSICS BACKGROUND
         * ------------------------------------------
         * Current (I) vs Voltage (V) Characteristics:
         * * 1. Fixed Resistor (Ohmic): 
         * - Obeys Ohm's Law: I = V / R
         * - Graph is a straight line through the origin. Constant slope (1/R).
         * * 2. Filament Lamp (Non-Ohmic):
         * - As V increases, I increases, causing temperature to rise.
         * - Higher temp = atoms vibrate more = higher resistance (R increases).
         * - Curve flattens out at higher voltages (S-shaped curve).
         * - Modeled empirically as I ∝ sqrt(|V|)
         * * 3. Semiconductor Diode (Non-Ohmic):
         * - Forward Bias: Conducts only after threshold voltage (~0.6V). Current rises exponentially.
         * - Reverse Bias: High resistance, near-zero current.
         * - Breakdown: If reversed too much (e.g. Zener), breaks down at specific negative V.
         */

        // --- State ---
        const state = {
            voltage: 0.0,
            current: 0.0,
            resistance: 0.0,
            component: 'resistor',
            
            // Full theoretical curve data for Chart.js background line
            curveData: [] 
        };

        // Component Descriptions
        const DESCRIPTIONS = {
            resistor: "<strong class='text-white'>Ohmic Conductor:</strong> Current is directly proportional to Voltage (<i>I</i> &prop; <i>V</i>). Resistance remains perfectly constant, yielding a straight line.",
            lamp: "<strong class='text-white'>Non-Ohmic (Heating):</strong> As current increases, the filament heats up. The hot atomic lattice scatters electrons more, causing resistance (<i>R</i> = <i>V</i>/<i>I</i>) to increase.",
            diode: "<strong class='text-white'>Non-Ohmic (Semiconductor):</strong> Only allows current in one direction. Requires a forward threshold (~0.6V) to conduct. Exhibits breakdown at high reverse voltages (-5V)."
        };

        // DOM Elements
        const DOM = {
            vSlider: document.getElementById('vSlider'),
            vValue: document.getElementById('vValue'),
            componentSelect: document.getElementById('componentSelect'),
            componentDesc: document.getElementById('componentDesc'),
            
            meterV: document.getElementById('meterV'),
            meterI: document.getElementById('meterI'),
            meterR: document.getElementById('meterR'),
            
            symResistor: document.getElementById('sym-resistor'),
            symLamp: document.getElementById('sym-lamp'),
            symDiode: document.getElementById('sym-diode'),
            
            animatedWires: document.querySelectorAll('.animated-wire')
        };

        // --- Physics Math Models ---
        function calculateCurrent(v, type) {
            if (type === 'resistor') {
                // R = 50 ohms -> I = V / 50 (in Amps) -> * 1000 for mA -> I = 20 * V
                return 20 * v;
            } 
            else if (type === 'lamp') {
                // S-curve model: I = k * sqrt(|V|) * sign(V)
                return Math.sign(v) * 60 * Math.sqrt(Math.abs(v));
            } 
            else if (type === 'diode') {
                // Breakdown Region
                if (v < -5) {
                    return -10 * Math.pow(v + 5, 2);
                }
                // Reverse Bias Leakage (approx 0)
                if (v >= -5 && v <= 0.6) {
                    return 0;
                }
                // Forward Bias Exponential-like curve
                if (v > 0.6) {
                    return 10 * Math.pow(v - 0.6, 2);
                }
            }
            return 0;
        }

        // --- Animated Circuit Flow ---
        let dashOffset = 0;
        let lastTime = 0;
        
        function animateCircuit(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;

            // Speed of dots is proportional to the current magnitude.
            // If current is negative, dashOffset moves in reverse (flowing backwards).
            if (Math.abs(state.current) > 0.01) {
                // Scaling factor for visual speed
                dashOffset -= state.current * dt * 2.0; 
                
                DOM.animatedWires.forEach(wire => {
                    wire.style.strokeDashoffset = dashOffset;
                    wire.style.opacity = 1;
                });
            } else {
                // Hide dots if no current is flowing
                DOM.animatedWires.forEach(wire => {
                    wire.style.opacity = 0;
                });
            }
            
            requestAnimationFrame(animateCircuit);
        }

        // --- Chart.js Setup ---
        const ctx = document.getElementById('ivChart').getContext('2d');
        
        // Custom plugin to draw fixed Axis lines at 0,0
        const quadrantAxesPlugin = {
            id: 'quadrantAxes',
            beforeDraw: (chart) => {
                const {ctx, chartArea: {top, bottom, left, right}, scales: {x, y}} = chart;
                ctx.save();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#475569'; // slate-600

                // X-axis (Y=0)
                const y0 = y.getPixelForValue(0);
                if(y0 >= top && y0 <= bottom) {
                    ctx.beginPath();
                    ctx.moveTo(left, y0);
                    ctx.lineTo(right, y0);
                    ctx.stroke();
                }

                // Y-axis (X=0)
                const x0 = x.getPixelForValue(0);
                if(x0 >= left && x0 <= right) {
                    ctx.beginPath();
                    ctx.moveTo(x0, top);
                    ctx.lineTo(x0, bottom);
                    ctx.stroke();
                }
                ctx.restore();
            }
        };

        const ivChart = new Chart(ctx, {
            type: 'scatter',
            plugins: [quadrantAxesPlugin],
            data: {
                datasets: [
                    {
                        label: 'Characteristic Curve',
                        data: [], // Full curve generated on component switch
                        borderColor: 'rgba(148, 163, 184, 0.4)', // slate-400 transparent
                        borderWidth: 2,
                        pointRadius: 0,
                        showLine: true,
                        tension: 0.2
                    },
                    {
                        label: 'Operating Point',
                        data: [{x: 0, y: 0}], // The single dot
                        backgroundColor: '#34d399', // emerald-400
                        borderColor: '#059669', // emerald-600
                        pointRadius: 8,
                        pointHoverRadius: 10,
                        showLine: false,
                        // Add glow effect native to chart point
                        pointShadowOffsetX: 0,
                        pointShadowOffsetY: 0,
                        pointShadowBlur: 15,
                        pointShadowColor: 'rgba(52, 211, 153, 0.8)'
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: { duration: 150 }, // Quick animation for slider feel
                scales: {
                    x: {
                        type: 'linear',
                        title: { display: true, text: 'Voltage (V)', color: '#94a3b8', font: {weight: 'bold'} },
                        min: -10.5,
                        max: 10.5,
                        ticks: { color: '#64748b' },
                        grid: { display: false } // Custom axes drawn via plugin
                    },
                    y: {
                        title: { display: true, text: 'Current (mA)', color: '#94a3b8', font: {weight: 'bold'} },
                        // Y limits dynamically updated based on component
                        ticks: { color: '#64748b' },
                        grid: { display: false }
                    }
                },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            label: (context) => `V: ${context.parsed.x.toFixed(1)}V, I: ${context.parsed.y.toFixed(1)}mA`
                        }
                    }
                }
            }
        });

        // --- Logic & Updates ---

        function generateCurveData(type) {
            let data = [];
            // Generate dense points for smooth curve
            for (let v = -10.5; v <= 10.5; v += 0.1) {
                data.push({ x: v, y: calculateCurrent(v, type) });
            }
            return data;
        }

        function switchComponent(type) {
            state.component = type;
            DOM.componentDesc.innerHTML = DESCRIPTIONS[type];
            
            // Switch SVG Symbol
            DOM.symResistor.style.display = type === 'resistor' ? 'block' : 'none';
            DOM.symLamp.style.display = type === 'lamp' ? 'block' : 'none';
            DOM.symDiode.style.display = type === 'diode' ? 'block' : 'none';

            // Generate new theoretical curve
            state.curveData = generateCurveData(type);
            ivChart.data.datasets[0].data = state.curveData;

            // Adjust Y Axis to fit the specific curve nicely
            if (type === 'resistor') {
                ivChart.options.scales.y.min = -220;
                ivChart.options.scales.y.max = 220;
            } else if (type === 'lamp') {
                ivChart.options.scales.y.min = -220;
                ivChart.options.scales.y.max = 220;
            } else if (type === 'diode') {
                ivChart.options.scales.y.min = -300;
                ivChart.options.scales.y.max = 1000;
            }

            // Trigger physics update for current slider value
            updatePhysics();
        }

        function updatePhysics() {
            state.voltage = parseFloat(DOM.vSlider.value);
            state.current = calculateCurrent(state.voltage, state.component);

            // Calculate Resistance R = V / I
            // I is in mA, so we multiply by 1000 to get Ohms
            if (Math.abs(state.current) < 0.01) {
                state.resistance = Infinity;
            } else {
                state.resistance = (state.voltage / state.current) * 1000;
            }

            // Update DOM Readouts
            let vStr = (state.voltage > 0 ? "+" : "") + state.voltage.toFixed(1) + " V";
            let iStr = (state.current > 0 ? "+" : "") + state.current.toFixed(1) + " mA";
            let rStr = state.resistance === Infinity ? "--- Ω" : Math.abs(state.resistance).toFixed(1) + " Ω";
            
            DOM.vValue.textContent = vStr;
            DOM.meterV.textContent = vStr;
            DOM.meterI.textContent = iStr;
            DOM.meterR.innerHTML = rStr;

            // Slider color coding
            if (state.voltage > 0) {
                DOM.vSlider.style.accentColor = '#ef4444'; // Red
            } else if (state.voltage < 0) {
                DOM.vSlider.style.accentColor = '#3b82f6'; // Blue
            } else {
                DOM.vSlider.style.accentColor = '#94a3b8'; // Slate
            }

            // Update Chart Dot
            ivChart.data.datasets[1].data = [{ x: state.voltage, y: state.current }];
            ivChart.update();
            
            // Highlight SVG
            const svgContainer = document.getElementById('svg-component-container');
            if (Math.abs(state.current) > 0.01) {
                svgContainer.classList.add('svg-glow');
            } else {
                svgContainer.classList.remove('svg-glow');
            }
        }

        // --- Event Listeners ---
        DOM.componentSelect.addEventListener('change', (e) => {
            switchComponent(e.target.value);
        });

        DOM.vSlider.addEventListener('input', updatePhysics);

        // --- Initialization ---
        switchComponent('resistor');
        requestAnimationFrame(animateCircuit); // Start animation loop

    </script>
</body>
</html>
