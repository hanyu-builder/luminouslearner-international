<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Domestic Electricity Cost Calculator & Simulator</title>
    <meta name="description" content="Domestic electricity cost calculator. Estimate energy consumption, calculate financial impact, and manage household appliances.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { background-color: #020617; } /* Slate 950 */
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="text-slate-200 font-sans overflow-hidden h-screen w-screen bg-slate-950 flex flex-col">

    <!-- React Mount Point -->
    <div id="root" class="flex-1 min-h-0 flex flex-col"></div>

    <!-- React Application Logic -->
    <script type="text/babel" data-type="module">
        const { useState, useMemo } = React;

        // --- Pre-defined Appliance Library (Mapped to FontAwesome classes) ---
        const APPLIANCE_LIBRARY = [
            { id: 'ac', name: 'Air Conditioner', powerW: 1500, icon: 'fa-wind', defaultHours: 8 },
            { id: 'heater', name: 'Space Heater', powerW: 2000, icon: 'fa-fire', defaultHours: 4 },
            { id: 'water_heater', name: 'Water Heater', powerW: 4000, icon: 'fa-droplet', defaultHours: 3 },
            { id: 'fridge', name: 'Refrigerator', powerW: 150, icon: 'fa-snowflake', defaultHours: 24 },
            { id: 'led', name: 'LED Bulb', powerW: 10, icon: 'fa-lightbulb', defaultHours: 5 },
            { id: 'incandescent', name: 'Incandescent Bulb', powerW: 60, icon: 'fa-lightbulb', defaultHours: 5 },
            { id: 'tv', name: 'Television', powerW: 100, icon: 'fa-tv', defaultHours: 4 },
            { id: 'desktop', name: 'Gaming PC', powerW: 450, icon: 'fa-computer', defaultHours: 4 },
            { id: 'laptop', name: 'Laptop', powerW: 50, icon: 'fa-laptop', defaultHours: 8 },
            { id: 'microwave', name: 'Microwave', powerW: 1000, icon: 'fa-wave-square', defaultHours: 0.5 },
            { id: 'washer', name: 'Washing Machine', powerW: 500, icon: 'fa-shirt', defaultHours: 1 },
            { id: 'coffee', name: 'Coffee Maker', powerW: 800, icon: 'fa-mug-hot', defaultHours: 0.25 },
        ];

        function App() {
            // --- State ---
            const [rateStr, setRateStr] = useState("0.15"); 
            const [currency, setCurrency] = useState('$');
            
            // Custom Appliance State
            const [customName, setCustomName] = useState('My Appliance');
            const [customPower, setCustomPower] = useState('100');
            
            // Active appliances in the user's "Home"
            const [myAppliances, setMyAppliances] = useState([
                { instanceId: 'init-1', ...APPLIANCE_LIBRARY[0], quantity: 1, hours: 8 },
                { instanceId: 'init-2', ...APPLIANCE_LIBRARY[3], quantity: 1, hours: 24 },
                { instanceId: 'init-3', ...APPLIANCE_LIBRARY[4], quantity: 5, hours: 6 },
            ]);

            // --- Calculations ---
            const totals = useMemo(() => {
                let dailyKWh = 0;
                const numericRate = parseFloat(rateStr) || 0;
                
                myAppliances.forEach(app => {
                    const kw = app.powerW / 1000;
                    const kwh = kw * app.hours * app.quantity;
                    dailyKWh += kwh;
                });

                const dailyCost = dailyKWh * numericRate;

                return {
                    daily: { kwh: dailyKWh, cost: dailyCost },
                    monthly: { kwh: dailyKWh * 30, cost: dailyCost * 30 },
                    yearly: { kwh: dailyKWh * 365, cost: dailyCost * 365 },
                    rate: numericRate
                };
            }, [myAppliances, rateStr]);

            // --- Handlers ---
            const handleAddAppliance = (libraryItem) => {
                const newAppliance = {
                    ...libraryItem,
                    instanceId: `app-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`,
                    quantity: 1,
                    hours: libraryItem.defaultHours
                };
                setMyAppliances([newAppliance, ...myAppliances]); 
            };

            const handleAddCustom = (e) => {
                e.preventDefault();
                const pwr = parseFloat(customPower) || 0;
                if (!customName.trim() || pwr <= 0) return;
                
                handleAddAppliance({
                    id: 'custom',
                    name: customName,
                    powerW: pwr,
                    icon: 'fa-plug',
                    defaultHours: 1
                });
                
                setCustomName('My Appliance');
                setCustomPower('100');
            };

            const handleUpdateAppliance = (instanceId, field, value) => {
                setMyAppliances(prev => prev.map(app => {
                    if (app.instanceId === instanceId) {
                        return { ...app, [field]: value };
                    }
                    return app;
                }));
            };

            const handleRemoveAppliance = (instanceId) => {
                setMyAppliances(prev => prev.filter(app => app.instanceId !== instanceId));
            };
            
            const handleClearAll = () => {
                if(confirm("Are you sure you want to clear all appliances?")) {
                    setMyAppliances([]);
                }
            }

            const getHeatColor = (pct) => {
                if (pct >= 40) return "bg-rose-500";
                if (pct >= 20) return "bg-amber-500";
                if (pct >= 5)  return "bg-sky-500";
                return "bg-emerald-500";
            };

            // --- Helper Components ---
            const StatCard = ({ title, energy, cost, iconClass, borderClass, textClass }) => (
                <div className={`bg-slate-800/80 p-4 lg:p-5 rounded-xl border-l-4 ${borderClass} shadow-lg relative overflow-hidden group`}>
                    <div className="absolute -right-4 -top-4 p-4 opacity-10 group-hover:opacity-20 transition-opacity text-6xl lg:text-8xl">
                        <i className={`fa-solid ${iconClass}`}></i>
                    </div>
                    <h3 className="text-slate-400 text-[10px] lg:text-xs font-bold uppercase tracking-widest mb-2 lg:mb-3 relative z-10">{title}</h3>
                    <div className="space-y-1 lg:space-y-2 relative z-10">
                        <div className="flex items-baseline gap-2">
                            <span className="text-xl lg:text-2xl font-mono text-white font-bold">{energy.toFixed(1)}</span>
                            <span className="text-xs text-slate-500 font-mono">kWh</span>
                        </div>
                        <div className="flex items-baseline gap-2">
                            <span className={`text-2xl lg:text-3xl font-mono font-bold ${textClass}`}>
                                {currency}{cost.toFixed(2)}
                            </span>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="h-full w-full p-2 md:p-4 lg:p-6 flex flex-col min-h-0">
                    
                    {/* Main Container - Locks height to prevent full-page scroll */}
                    <main className="max-w-[1400px] w-full h-full mx-auto bg-slate-900/80 backdrop-blur-md rounded-2xl border border-slate-800 shadow-2xl flex flex-col flex-1 min-h-0">
                        
                        {/* Header (Fixed) */}
                        <header className="p-4 lg:p-6 border-b border-slate-800 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-slate-900 rounded-t-2xl shrink-0">
                            <div>
                                <h1 className="text-xl md:text-2xl lg:text-3xl font-bold text-white flex items-center gap-3">
                                    <i className="fa-solid fa-calculator text-sky-400"></i>
                                    Domestic Electricity Cost
                                </h1>
                                <p className="text-slate-400 text-xs md:text-sm mt-1">Identify energy vampires and calculate household usage.</p>
                            </div>
                            
                            <div className="flex flex-wrap gap-2 lg:gap-3">
                                <div className="bg-slate-950 border border-slate-700 px-3 lg:px-4 py-2 rounded-lg flex items-center gap-3 shadow-inner">
                                    <i className="fa-solid fa-bolt text-emerald-400 text-lg"></i>
                                    <div className="flex flex-col">
                                        <span className="text-[9px] lg:text-[10px] text-slate-500 uppercase font-bold tracking-wider">Electrical Energy</span>
                                        <span className="font-mono text-xs lg:text-sm text-emerald-300">kWh = kW &times; h</span>
                                    </div>
                                </div>
                                <div className="bg-slate-950 border border-slate-700 px-3 lg:px-4 py-2 rounded-lg flex items-center gap-3 shadow-inner">
                                    <i className="fa-solid fa-dollar-sign text-amber-400 text-lg"></i>
                                    <div className="flex flex-col">
                                        <span className="text-[9px] lg:text-[10px] text-slate-500 uppercase font-bold tracking-wider">Financial Cost</span>
                                        <span className="font-mono text-xs lg:text-sm text-amber-300">Cost = kWh &times; Rate</span>
                                    </div>
                                </div>
                            </div>
                        </header>

                        {/* Content Body */}
                        <div className="p-4 lg:p-6 flex flex-col gap-4 lg:gap-6 flex-1 min-h-0">
                            
                            {/* Top Dashboard: Totals (Fixed) */}
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-3 md:gap-4 shrink-0">
                                <StatCard 
                                    title="Daily Estimate" 
                                    energy={totals.daily.kwh} 
                                    cost={totals.daily.cost} 
                                    iconClass="fa-sun" 
                                    borderClass="border-emerald-500" 
                                    textClass="text-emerald-400"
                                />
                                <StatCard 
                                    title="Monthly Estimate (30 Days)" 
                                    energy={totals.monthly.kwh} 
                                    cost={totals.monthly.cost} 
                                    iconClass="fa-calendar-days" 
                                    borderClass="border-sky-500" 
                                    textClass="text-sky-400"
                                />
                                <StatCard 
                                    title="Yearly Estimate (365 Days)" 
                                    energy={totals.yearly.kwh} 
                                    cost={totals.yearly.cost} 
                                    iconClass="fa-globe" 
                                    borderClass="border-rose-500" 
                                    textClass="text-rose-400"
                                />
                            </div>

                            {/* Lower Section: 2 Columns */}
                            {/* Mobile: Container scrolls. Desktop: Container is fixed, inner columns scroll individually */}
                            <div className="flex flex-col lg:flex-row gap-4 lg:gap-6 flex-1 min-h-0 overflow-y-auto lg:overflow-hidden custom-scrollbar pr-1 lg:pr-0 pb-4 lg:pb-0">
                                
                                {/* Left Col: Active Appliances (Simulator) */}
                                <div className="w-full lg:w-8/12 flex flex-col gap-4 shrink-0 lg:shrink lg:flex-1 lg:min-h-0">
                                    <div className="bg-slate-800/50 rounded-xl border border-slate-700 p-4 lg:p-5 flex flex-col lg:flex-1 lg:min-h-0">
                                        
                                        <div className="flex justify-between items-center mb-4 border-b border-slate-700 pb-3 shrink-0">
                                            <h2 className="text-base lg:text-lg font-semibold text-white flex items-center gap-2">
                                                <i className="fa-solid fa-house-chimney text-amber-400"></i> My Home
                                            </h2>
                                            <div className="flex gap-3 items-center">
                                                <span className="text-[10px] lg:text-xs font-mono bg-slate-900 px-3 py-1 rounded text-slate-400 border border-slate-700">
                                                    Total Items: {myAppliances.reduce((acc, curr) => acc + curr.quantity, 0)}
                                                </span>
                                                {myAppliances.length > 0 && (
                                                    <button onClick={handleClearAll} className="text-xs text-rose-400 hover:text-rose-300 font-semibold px-2">
                                                        Clear All
                                                    </button>
                                                )}
                                            </div>
                                        </div>

                                        {myAppliances.length === 0 ? (
                                            <div className="flex flex-col items-center justify-center h-48 text-slate-500 bg-slate-900/50 rounded-lg border border-slate-800 border-dashed shrink-0">
                                                <i className="fa-solid fa-plug-circle-xmark text-3xl mb-2 opacity-50"></i>
                                                <p>No appliances added.</p>
                                                <p className="text-xs mt-1">Select from the library on the right to start building your circuit.</p>
                                            </div>
                                        ) : (
                                            /* Inner Scrollbar applied on large screens only */
                                            <div className="lg:flex-1 lg:overflow-y-auto custom-scrollbar lg:pr-2 space-y-3 lg:space-y-4">
                                                {myAppliances.map((app) => {
                                                    const appKWh = (app.powerW / 1000) * app.hours * app.quantity;
                                                    const appCost = appKWh * totals.rate;
                                                    const pctOfTotal = totals.daily.kwh > 0 ? (appKWh / totals.daily.kwh) * 100 : 0;
                                                    
                                                    const heatColor = getHeatColor(pctOfTotal);
                                                    
                                                    return (
                                                        <div key={app.instanceId} className="bg-slate-900/80 p-3 lg:p-4 rounded-lg border border-slate-700 flex flex-col sm:flex-row gap-4 items-start sm:items-center relative group shadow-sm hover:border-slate-500 transition-colors">
                                                            
                                                            {/* Icon & Info */}
                                                            <div className="flex items-center gap-4 w-full sm:w-1/3 shrink-0">
                                                                <div className="p-3 bg-slate-800 rounded-lg text-slate-300 border border-slate-700 group-hover:border-sky-500/50 transition-colors w-10 h-10 lg:w-12 lg:h-12 flex justify-center items-center shrink-0">
                                                                    <i className={`fa-solid ${app.icon} text-lg lg:text-xl`}></i>
                                                                </div>
                                                                <div className="flex flex-col min-w-0">
                                                                    <span className="font-semibold text-slate-200 text-sm truncate" title={app.name}>{app.name}</span>
                                                                    <div className="flex items-center gap-2">
                                                                        <span className="text-[10px] text-slate-500 font-mono bg-slate-800 px-1.5 py-0.5 rounded" title="Instantaneous Power">
                                                                            {app.powerW}W
                                                                        </span>
                                                                    </div>
                                                                </div>
                                                            </div>

                                                            {/* Controls */}
                                                            <div className="flex flex-wrap sm:flex-nowrap items-center gap-4 w-full justify-between">
                                                                
                                                                {/* Quantity */}
                                                                <div className="flex flex-col w-16 shrink-0">
                                                                    <label className="text-[10px] text-slate-400 uppercase tracking-wider mb-1">Qty</label>
                                                                    <input 
                                                                        type="number" 
                                                                        min="0" 
                                                                        max="999"
                                                                        value={app.quantity}
                                                                        onChange={(e) => handleUpdateAppliance(app.instanceId, 'quantity', Math.max(0, parseInt(e.target.value) || 0))}
                                                                        className="bg-slate-950 border border-slate-600 rounded px-2 py-1.5 w-full text-sm font-mono text-white outline-none focus:border-sky-500 transition-colors"
                                                                    />
                                                                </div>

                                                                {/* Hours / Day */}
                                                                <div className="flex flex-col flex-1 min-w-[120px]">
                                                                    <div className="flex justify-between mb-1">
                                                                        <label className="text-[10px] text-slate-400 uppercase tracking-wider">Usage / Day</label>
                                                                        <span className="text-xs font-mono text-sky-300">{app.hours.toFixed(1)} h</span>
                                                                    </div>
                                                                    <input 
                                                                        type="range" 
                                                                        min="0" 
                                                                        max="24" 
                                                                        step="0.5"
                                                                        value={app.hours}
                                                                        onChange={(e) => handleUpdateAppliance(app.instanceId, 'hours', parseFloat(e.target.value))}
                                                                        className="w-full accent-sky-500 cursor-pointer"
                                                                    />
                                                                </div>

                                                                {/* Contribution Bar & Remove */}
                                                                <div className="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end mt-2 sm:mt-0">
                                                                    <div className="flex flex-col items-end w-24 lg:w-28">
                                                                        <span className="text-[11px] lg:text-xs font-mono text-white font-bold" title="Daily Energy">
                                                                            {appKWh.toFixed(2)} kWh
                                                                        </span>
                                                                        <span className="text-[9px] lg:text-[10px] font-mono text-slate-400">
                                                                            {currency}{appCost.toFixed(2)} /day
                                                                        </span>
                                                                        
                                                                        {/* Energy Vampire Heat Bar */}
                                                                        <div className="w-full h-1.5 bg-slate-800 rounded-full mt-1 overflow-hidden" title={`${pctOfTotal.toFixed(1)}% of total daily usage`}>
                                                                            <div 
                                                                                className={`h-full rounded-full transition-all ${heatColor}`}
                                                                                style={{ width: `${pctOfTotal}%` }}
                                                                            ></div>
                                                                        </div>
                                                                    </div>
                                                                    <button 
                                                                        onClick={() => handleRemoveAppliance(app.instanceId)}
                                                                        className="p-2 text-slate-500 hover:text-rose-500 hover:bg-rose-500/10 rounded transition-colors shrink-0"
                                                                        title="Remove Appliance"
                                                                    >
                                                                        <i className="fa-solid fa-trash-can"></i>
                                                                    </button>
                                                                </div>

                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        )}
                                    </div>
                                </div>

                                {/* Right Col: Library & Settings */}
                                <div className="w-full lg:w-4/12 flex flex-col gap-4 shrink-0 lg:shrink lg:flex-1 lg:min-h-0">
                                    
                                    {/* Global Settings */}
                                    <div className="bg-slate-800/50 rounded-xl border border-slate-700 p-4 lg:p-5 shrink-0">
                                        <h2 className="text-sm font-semibold text-white flex items-center gap-2 mb-4 border-b border-slate-700 pb-2">
                                            <i className="fa-solid fa-gear text-slate-400"></i> Tariff Settings
                                        </h2>
                                        
                                        <div className="flex gap-4 items-center">
                                            <div className="flex flex-col w-1/3">
                                                <label className="text-[10px] text-slate-400 uppercase tracking-wider mb-1">Currency</label>
                                                <select 
                                                    value={currency} 
                                                    onChange={(e) => setCurrency(e.target.value)}
                                                    className="bg-slate-900 border border-slate-600 rounded p-2 text-sm text-white outline-none focus:border-amber-500 font-mono"
                                                >
                                                    <option value="$">$ (USD/AUD)</option>
                                                    <option value="€">€ (EUR)</option>
                                                    <option value="£">£ (GBP)</option>
                                                    <option value="₹">₹ (INR)</option>
                                                    <option value="¥">¥ (JPY/CNY)</option>
                                                </select>
                                            </div>
                                            <div className="flex flex-col w-2/3">
                                                <label className="text-[10px] text-slate-400 uppercase tracking-wider mb-1">Rate (per kWh)</label>
                                                <div className="flex items-center bg-slate-900 border border-slate-600 rounded px-3 focus-within:border-amber-500 transition-colors">
                                                    <span className="text-slate-500 font-mono">{currency}</span>
                                                    <input 
                                                        type="number" 
                                                        min="0.01" 
                                                        step="0.01"
                                                        value={rateStr}
                                                        onChange={(e) => setRateStr(e.target.value)}
                                                        className="bg-transparent w-full p-2 text-sm font-mono text-white outline-none"
                                                    />
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Appliance Library */}
                                    <div className="bg-slate-800/50 rounded-xl border border-slate-700 p-4 lg:p-5 flex flex-col lg:flex-1 lg:min-h-0">
                                        <h2 className="text-sm font-semibold text-white flex items-center gap-2 mb-4 border-b border-slate-700 pb-2 shrink-0">
                                            <i className="fa-solid fa-book text-sky-400"></i> Appliance Library
                                        </h2>
                                        
                                        {/* Inner Scrollbar applied on large screens only */}
                                        <div className="lg:flex-1 lg:overflow-y-auto custom-scrollbar lg:pr-1 grid grid-cols-1 gap-2">
                                            {APPLIANCE_LIBRARY.map((libItem) => {
                                                return (
                                                    <button
                                                        key={libItem.id}
                                                        onClick={() => handleAddAppliance(libItem)}
                                                        className="flex items-center justify-between p-3 bg-slate-900/50 hover:bg-slate-700 border border-slate-700 hover:border-slate-500 rounded-lg transition-all text-left group shrink-0"
                                                    >
                                                        <div className="flex items-center gap-3">
                                                            <div className="text-slate-400 group-hover:text-sky-400 transition-colors w-6 text-center">
                                                                <i className={`fa-solid ${libItem.icon}`}></i>
                                                            </div>
                                                            <div className="flex flex-col">
                                                                <span className="text-sm font-medium text-slate-200">{libItem.name}</span>
                                                                <span className="text-[10px] text-slate-500 font-mono">Rated: {libItem.powerW} W</span>
                                                            </div>
                                                        </div>
                                                        <div className="text-emerald-400 opacity-0 group-hover:opacity-100 transition-opacity bg-emerald-400/10 p-1.5 rounded-md">
                                                            <i className="fa-solid fa-plus"></i>
                                                        </div>
                                                    </button>
                                                );
                                            })}
                                        </div>

                                        {/* Custom Appliance Adder */}
                                        <div className="mt-4 pt-4 border-t border-slate-700 shrink-0">
                                            <h3 className="text-[10px] text-slate-400 uppercase tracking-widest font-bold mb-2">Add Custom</h3>
                                            <form onSubmit={handleAddCustom} className="flex gap-2">
                                                <input 
                                                    type="text" 
                                                    value={customName}
                                                    onChange={(e)=>setCustomName(e.target.value)}
                                                    placeholder="Name"
                                                    className="bg-slate-900 border border-slate-600 rounded p-2 text-xs text-white outline-none focus:border-sky-500 flex-1 min-w-0"
                                                    required
                                                />
                                                <div className="flex items-center bg-slate-900 border border-slate-600 rounded px-2 focus-within:border-sky-500 w-20 lg:w-24 shrink-0">
                                                    <input 
                                                        type="number" 
                                                        value={customPower}
                                                        onChange={(e)=>setCustomPower(e.target.value)}
                                                        min="1"
                                                        placeholder="Watts"
                                                        className="bg-transparent w-full py-2 text-xs font-mono text-white outline-none"
                                                        required
                                                    />
                                                    <span className="text-slate-500 text-xs font-mono ml-1">W</span>
                                                </div>
                                                <button type="submit" className="bg-sky-600 hover:bg-sky-500 text-white rounded px-3 py-2 transition-colors shrink-0">
                                                    <i className="fa-solid fa-plus"></i>
                                                </button>
                                            </form>
                                        </div>

                                    </div>

                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
