<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High Voltage Transmission Simulator</title>
    <meta name="description" content="Interactive high voltage power grid simulator. Discover why power is transmitted at high voltages to minimize I²R heat loss.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap');
        
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #F8FAFC; overflow-x: hidden; }
        .math-font { font-family: 'JetBrains Mono', monospace; }
        .no-select { user-select: none; -webkit-user-select: none; }
        
        /* Glassmorphism Components */
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        /* Themed Range Sliders */
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; margin: 8px 0; }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 6px; border-radius: 4px; background: #334155; border: 1px solid #1e293b;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%;
            cursor: pointer; margin-top: -8px; transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.15); }

        #slider-v::-webkit-slider-thumb { background: #38bdf8; border: 2px solid #93c5fd; box-shadow: 0 0 12px rgba(56,189,248,0.8); }
        #slider-v::-webkit-slider-runnable-track { background: linear-gradient(90deg, #0284c7, #38bdf8); }

        #slider-d::-webkit-slider-thumb { background: #a855f7; border: 2px solid #d8b4fe; box-shadow: 0 0 12px rgba(168,85,247,0.8); }
        #slider-d::-webkit-slider-runnable-track { background: linear-gradient(90deg, #6b21a8, #a855f7); }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* Custom SVG Animations */
        @keyframes flowDash {
            to { stroke-dashoffset: -40; }
        }
        @keyframes pulseGlow {
            0%, 100% { filter: drop-shadow(0 0 8px var(--glow-color)); }
            50% { filter: drop-shadow(0 0 20px var(--glow-color)); }
        }
        .wire-glow {
            animation: pulseGlow 2s ease-in-out infinite;
        }
        .wire-flow {
            animation: flowDash linear infinite;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col no-select lg:overflow-hidden bg-slate-950">

    <!-- React Mount Point -->
    <div id="root" class="flex-grow flex flex-col h-full min-h-0"></div>

    <!-- React Application Logic -->
    <script type="text/babel" data-type="module">
        const { useState, useMemo } = React;

        // --- Custom Inline SVGs ---
        const FactoryIcon = ({ className }) => (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M2 20a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8l-7 5V8l-7 5V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z" />
                <path d="M17 18h1" />
                <path d="M12 18h1" />
                <path d="M7 18h1" />
            </svg>
        );

        const TransformerIcon = ({ className }) => (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <rect x="4" y="4" width="16" height="16" rx="2" ry="2" />
                <path d="M4 8h16" />
                <path d="M4 16h16" />
                <path d="M8 4v16" />
                <path d="M16 4v16" />
                <path d="M7 12a1 1 0 0 0 0-2 1 1 0 0 0 0 2Z" fill="currentColor"/>
                <path d="M17 14a1 1 0 0 0 0-2 1 1 0 0 0 0 2Z" fill="currentColor"/>
            </svg>
        );

        const PylonIcon = ({ className }) => (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M12 2L7 22M12 2L17 22" />
                <path d="M5 8L19 8" />
                <path d="M6 14L18 14" />
                <path d="M9 14L15 8" />
                <path d="M15 14L9 8" />
                <path d="M12 2V22" />
                {/* Insulators */}
                <circle cx="5" cy="9" r="1" fill="currentColor" />
                <circle cx="19" cy="9" r="1" fill="currentColor" />
            </svg>
        );

        const CityIcon = ({ className }) => (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M10 9h4" />
                <path d="M10 13h4" />
                <path d="M10 17h4" />
                <path d="M6 13h-2" />
                <path d="M6 17h-2" />
                <path d="M18 13h2" />
                <path d="M18 17h2" />
                <path d="M8 21V7a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v14" />
                <path d="M4 21v-6a2 2 0 0 1 2-2h2" />
                <path d="M20 21v-6a2 2 0 0 0-2-2h-2" />
                <path d="M2 21h20" />
            </svg>
        );

        export default function App() {
            // --- Physics Constants ---
            const POWER_IN_MW = 100; // Fixed input power: 100 Megawatts
            const R_PER_KM = 0.05;   // Ohms per km of transmission line

            // --- State ---
            // Transmission Voltage in kilovolts (kV). Range: 10kV to 500kV
            const [voltageKV, setVoltageKV] = useState(250);
            // Distance in km. Range: 10 to 500km
            const [distanceKm, setDistanceKm] = useState(150);

            // --- Physics Calculations ---
            const calcs = useMemo(() => {
                const P_in_W = POWER_IN_MW * 1_000_000;
                const V_volts = voltageKV * 1_000;
                const R_ohms = distanceKm * R_PER_KM;
                
                // Ideal Transformer (100% efficient assumed for simplicity): P_in = P_trans
                // I = P / V
                const I_amps = P_in_W / V_volts;
                
                // P_loss = I^2 * R
                let P_loss_W = (I_amps ** 2) * R_ohms;
                
                // Cap loss at 100% of input (represents total line failure/short)
                if (P_loss_W > P_in_W) P_loss_W = P_in_W;
                
                const P_out_W = P_in_W - P_loss_W;
                
                return {
                    R_ohms,
                    I_amps,
                    P_loss_MW: P_loss_W / 1_000_000,
                    P_out_MW: P_out_W / 1_000_000,
                    efficiency: (P_out_W / P_in_W) * 100,
                    lossRatio: P_loss_W / P_in_W // 0 to 1
                };
            }, [voltageKV, distanceKm]);

            // --- Visual Mapping ---
            // Wire color shifts from green (efficient) to bright red (high loss)
            const getWireColor = () => {
                if (calcs.lossRatio < 0.05) return '#10b981'; // emerald-500
                if (calcs.lossRatio < 0.20) return '#eab308'; // yellow-500
                if (calcs.lossRatio < 0.60) return '#f97316'; // orange-500
                return '#ef4444'; // red-500
            };

            // Particle speed inversely proportional to voltage (higher V = lower I = slower drift velocity)
            const particleDuration = Math.max(0.3, 500 / calcs.I_amps).toFixed(2) + "s";

            return (
                <div className="flex-1 flex flex-col min-h-0">
                    
                    {/* Header Section */}
                    <header className="bg-slate-900 border-b border-slate-800 py-3 px-6 z-20 shadow-lg shrink-0">
                        <div className="max-w-[1500px] mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-4">
                                <div className="bg-sky-500/20 p-2.5 rounded-lg border border-sky-500/50 hidden md:block">
                                    <i className="fa-solid fa-bolt-lightning text-sky-400 text-xl"></i>
                                </div>
                                <div>
                                    <h1 className="text-xl md:text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-sky-400 via-indigo-400 to-purple-400 tracking-tight">
                                        High Voltage Transmission
                                    </h1>
                                    <p className="text-slate-400 text-xs mt-0.5 font-medium flex items-center gap-3">
                                        <span>Current: <span className="math-font text-slate-300">I = P / V</span></span>
                                        <span className="w-1 h-1 bg-slate-600 rounded-full"></span>
                                        <span>Heat Loss: <span className="math-font text-slate-300">P<sub>loss</sub> = I²R</span></span>
                                    </p>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Main Workspace */}
                    <main className="flex-grow flex justify-center p-3 md:p-4 w-full overflow-y-auto lg:overflow-hidden custom-scrollbar min-h-0">
                        <div className="max-w-[1500px] w-full flex flex-col lg:flex-row gap-5 min-h-full lg:h-full">

                            {/* LEFT PANEL: Visualizer & Analytics */}
                            <section className="flex-[2] flex flex-col gap-5 min-h-[500px] lg:min-h-0 lg:h-full">
                                
                                {/* Grid Visualizer */}
                                <div className="glass-panel p-2 md:p-4 rounded-3xl flex flex-col relative flex-[1.5] w-full border-t border-t-slate-700/50 min-h-[300px] overflow-hidden">
                                    <div className="absolute top-4 left-6 z-20 pointer-events-none">
                                        <h2 className="text-sm font-bold text-slate-300 uppercase tracking-widest bg-slate-900/80 backdrop-blur px-3 py-1.5 rounded-lg border border-slate-700 shadow">Grid Architecture</h2>
                                    </div>

                                    {/* Responsive 2D Landscape */}
                                    <div className="flex-1 w-full relative flex items-center justify-between px-4 sm:px-12 mt-8">
                                        
                                        {/* SVG Wire Background */}
                                        <svg className="absolute inset-0 w-full h-full pointer-events-none z-0" style={{ '--glow-color': getWireColor() }}>
                                            {/* Static Glowing Wire */}
                                            <line 
                                                x1="10%" y1="50%" x2="90%" y2="50%" 
                                                stroke={getWireColor()} strokeWidth="6" 
                                                className="wire-glow transition-colors duration-300"
                                            />
                                            {/* Animated Current Flow (Only if efficiency > 0) */}
                                            {calcs.efficiency > 0 && (
                                                <line 
                                                    x1="10%" y1="50%" x2="90%" y2="50%" 
                                                    stroke="#ffffff" strokeWidth="3" strokeDasharray="15 25"
                                                    className="wire-flow opacity-80"
                                                    style={{ animationDuration: particleDuration }}
                                                />
                                            )}
                                        </svg>

                                        {/* Nodes Layer */}
                                        <div className="z-10 flex flex-col items-center">
                                            <div className="bg-slate-800 p-3 sm:p-4 rounded-full border-4 border-slate-600 shadow-lg relative">
                                                <FactoryIcon className="w-8 h-8 sm:w-12 sm:h-12 text-slate-300" />
                                                <div className="absolute -bottom-2 -right-4 sm:-right-2 bg-emerald-500 text-slate-900 text-[9px] sm:text-[10px] font-bold px-2 py-1 rounded-md whitespace-nowrap shadow">100 MW</div>
                                            </div>
                                            <span className="mt-4 font-semibold text-slate-300 text-xs sm:text-sm text-center">Power Plant<br/><span className="text-slate-500 text-[10px]">Gen: 15kV</span></span>
                                        </div>

                                        <div className="z-10 flex flex-col items-center -ml-4 sm:-ml-10 mt-12">
                                            <div className="bg-slate-800 p-2 sm:p-3 rounded-lg border-2 border-sky-500 shadow-[0_0_15px_rgba(14,165,233,0.3)]">
                                                <TransformerIcon className="w-6 h-6 sm:w-8 sm:h-8 text-sky-400" />
                                            </div>
                                            <span className="mt-2 font-bold text-sky-400 text-[10px] text-center bg-slate-900/80 px-2 py-1 rounded border border-slate-700">Step-Up</span>
                                        </div>

                                        {/* Pylons */}
                                        <div className="z-10 flex flex-col items-center opacity-60 mt-16 hidden md:flex">
                                            <PylonIcon className="w-12 h-16 text-slate-400" />
                                        </div>
                                        <div className="z-10 flex flex-col items-center opacity-60 mt-16 hidden lg:flex">
                                            <PylonIcon className="w-12 h-16 text-slate-400" />
                                        </div>

                                        <div className="z-10 flex flex-col items-center -mr-4 sm:-mr-10 mt-12">
                                            <div className="bg-slate-800 p-2 sm:p-3 rounded-lg border-2 border-indigo-500 shadow-[0_0_15px_rgba(99,102,241,0.3)]">
                                                <TransformerIcon className="w-6 h-6 sm:w-8 sm:h-8 text-indigo-400" />
                                            </div>
                                            <span className="mt-2 font-bold text-indigo-400 text-[10px] text-center bg-slate-900/80 px-2 py-1 rounded border border-slate-700">Step-Down</span>
                                        </div>

                                        <div className="z-10 flex flex-col items-center transition-all duration-500" style={{ opacity: Math.max(0.1, calcs.efficiency / 100) }}>
                                            <div className={`bg-slate-800 p-3 sm:p-4 rounded-full border-4 ${calcs.efficiency > 0 ? 'border-slate-600' : 'border-red-900/50'} shadow-lg relative transition-all duration-300`} style={{ boxShadow: calcs.efficiency > 0 ? `0 0 ${calcs.efficiency * 0.5}px rgba(250, 204, 21, ${calcs.efficiency/100})` : 'none' }}>
                                                <CityIcon className={`w-8 h-8 sm:w-12 sm:h-12 ${calcs.efficiency > 50 ? 'text-yellow-400' : 'text-slate-500'}`} />
                                            </div>
                                            <span className="mt-4 font-semibold text-slate-300 text-xs sm:text-sm text-center">City Grid<br/><span className="text-slate-500 text-[10px]">Use: 240V</span></span>
                                        </div>

                                    </div>
                                    
                                    {/* Warning Banner Overlay */}
                                    {calcs.efficiency === 0 && (
                                        <div className="absolute inset-0 bg-red-950/40 backdrop-blur-[2px] flex items-center justify-center z-30">
                                            <div className="bg-red-900/90 border border-red-500 px-6 py-4 rounded-xl shadow-2xl flex flex-col items-center text-center animate-pulse">
                                                <i className="fa-solid fa-triangle-exclamation text-3xl text-red-400 mb-2"></i>
                                                <h3 className="text-red-100 font-bold text-lg">TOTAL BLACKOUT</h3>
                                                <p className="text-red-300 text-xs mt-1">100% of generated power was lost as heat.</p>
                                                <p className="text-red-300 text-xs">Increase voltage or decrease distance.</p>
                                            </div>
                                        </div>
                                    )}
                                </div>

                                {/* Results Dashboard */}
                                <div className="glass-panel p-4 rounded-3xl flex-1 border-t border-slate-700/50 flex flex-col justify-center">
                                    <h3 className="text-xs uppercase tracking-widest text-slate-400 font-bold mb-4">Transmission Results</h3>
                                    <div className="grid grid-cols-3 gap-2 sm:gap-4">
                                        
                                        <div className="col-span-3 bg-slate-900 p-4 rounded-xl border border-slate-700 flex flex-col justify-center relative overflow-hidden shadow-inner">
                                            <div className="flex justify-between items-end mb-3">
                                                <span className="text-xs text-slate-400 uppercase font-bold tracking-widest flex items-center gap-2">
                                                    Efficiency
                                                    <span className="hidden sm:inline-block text-[9px] text-slate-500 normal-case font-mono font-normal tracking-normal bg-slate-800 px-2 py-0.5 rounded border border-slate-700">η = P_out / P_in</span>
                                                </span>
                                                <span className="text-2xl font-bold text-white math-font">{calcs.efficiency.toFixed(1)}%</span>
                                            </div>
                                            <div className="w-full h-3 bg-slate-800 rounded-full overflow-hidden border border-slate-700">
                                                <div 
                                                    className="h-full rounded-full transition-all duration-500 ease-out"
                                                    style={{ width: `${calcs.efficiency}%`, backgroundColor: getWireColor() }}
                                                ></div>
                                            </div>
                                        </div>

                                        <div className="bg-slate-900 p-3 sm:p-4 rounded-xl border border-blue-900/30 flex flex-col justify-center items-center relative overflow-hidden shadow-inner">
                                            <div className="absolute top-0 w-full h-1 bg-blue-500"></div>
                                            <span className="text-[9px] sm:text-[10px] text-slate-400 uppercase tracking-widest mb-1 font-bold text-center">Generated <span className="hidden sm:inline">(P_in)</span></span>
                                            <span className="text-lg sm:text-xl font-bold text-blue-400 math-font drop-shadow-[0_0_8px_rgba(59,130,246,0.3)]">{POWER_IN_MW.toFixed(0)} <span className="text-[10px] sm:text-xs text-blue-500">MW</span></span>
                                        </div>

                                        <div className="bg-slate-900 p-3 sm:p-4 rounded-xl border border-red-900/30 flex flex-col justify-center items-center relative overflow-hidden shadow-inner">
                                            <div className="absolute top-0 w-full h-1 bg-red-500"></div>
                                            <span className="text-[9px] sm:text-[10px] text-slate-400 uppercase tracking-widest mb-1 font-bold text-center">Lost <span className="hidden sm:inline">(P_loss)</span></span>
                                            <span className="text-lg sm:text-xl font-bold text-red-400 math-font drop-shadow-[0_0_8px_rgba(239,68,68,0.3)]">{calcs.P_loss_MW.toFixed(1)} <span className="text-[10px] sm:text-xs text-red-500">MW</span></span>
                                        </div>
                                        
                                        <div className="bg-slate-900 p-3 sm:p-4 rounded-xl border border-emerald-900/30 flex flex-col justify-center items-center relative overflow-hidden shadow-inner">
                                            <div className="absolute top-0 w-full h-1 bg-emerald-500"></div>
                                            <span className="text-[9px] sm:text-[10px] text-slate-400 uppercase tracking-widest mb-1 font-bold text-center">Delivered <span className="hidden sm:inline">(P_out)</span></span>
                                            <span className="text-lg sm:text-xl font-bold text-emerald-400 math-font drop-shadow-[0_0_8px_rgba(16,185,129,0.3)]">{calcs.P_out_MW.toFixed(1)} <span className="text-[10px] sm:text-xs text-emerald-500">MW</span></span>
                                        </div>

                                    </div>
                                </div>
                            </section>

                            {/* RIGHT PANEL: Controls & Theory */}
                            <section className="flex-[1] flex flex-col gap-5 lg:h-full overflow-y-auto custom-scrollbar pr-1 lg:pr-2 pb-2">
                                
                                {/* Controls */}
                                <div className="glass-panel rounded-3xl p-5 flex-shrink-0 border-t border-slate-700/50 shadow-lg">
                                    <div className="flex justify-between items-center mb-5 border-b border-slate-700/50 pb-2">
                                        <h2 className="text-sm font-bold uppercase tracking-widest text-slate-300 flex items-center gap-2">
                                            <i className="fa-solid fa-sliders text-slate-400"></i>
                                            Grid Controls
                                        </h2>
                                        <span className="text-[10px] text-emerald-400 font-bold bg-emerald-950/30 px-2 py-1 rounded border border-emerald-900/50">P_in = {POWER_IN_MW} MW</span>
                                    </div>
                                    
                                    <div className="space-y-6">
                                        {/* Voltage Slider */}
                                        <div className="bg-slate-900/60 p-4 rounded-xl border border-sky-900/30 shadow-inner">
                                            <div className="flex justify-between items-end mb-2">
                                                <label htmlFor="slider-v" className="text-xs font-bold text-sky-400 uppercase tracking-wider">Transmission Voltage</label>
                                                <span className="font-mono text-sky-300 bg-sky-950/40 px-2 py-0.5 rounded text-sm border border-sky-900/50">{voltageKV} kV</span>
                                            </div>
                                            <input 
                                                id="slider-v" type="range" min="10" max="500" step="10" value={voltageKV} 
                                                onChange={(e) => setVoltageKV(Number(e.target.value))}
                                            />
                                        </div>

                                        {/* Distance Slider */}
                                        <div className="bg-slate-900/60 p-4 rounded-xl border border-purple-900/30 shadow-inner">
                                            <div className="flex justify-between items-end mb-2">
                                                <label htmlFor="slider-d" className="text-xs font-bold text-purple-400 uppercase tracking-wider">City Distance</label>
                                                <span className="font-mono text-purple-300 bg-purple-950/40 px-2 py-0.5 rounded text-sm border border-purple-900/50">{distanceKm} km</span>
                                            </div>
                                            <input 
                                                id="slider-d" type="range" min="10" max="500" step="10" value={distanceKm} 
                                                onChange={(e) => setDistanceKm(Number(e.target.value))}
                                            />
                                            <p className="text-[9px] text-slate-500 mt-2 font-mono text-right">R = {R_PER_KM} Ω/km</p>
                                        </div>
                                    </div>
                                </div>

                                {/* Math Breakdown */}
                                <div className="glass-panel rounded-3xl p-5 flex-shrink-0 lg:flex-grow flex flex-col border-t border-slate-700/50 shadow-lg">
                                    <h3 className="text-sm uppercase tracking-widest text-slate-300 font-bold border-b border-slate-700 pb-2 mb-4">
                                        <i className="fa-solid fa-square-root-variable text-amber-400 mr-2"></i> Equations
                                    </h3>
                                    
                                    <div className="flex flex-col gap-3 font-mono text-[11px] overflow-y-auto custom-scrollbar pr-1">
                                        
                                        <div className="bg-slate-900/60 p-3 rounded-xl border border-slate-800">
                                            <div className="text-slate-500 mb-1 font-bold uppercase tracking-widest text-[9px]">1. Calculate Line Resistance</div>
                                            <div className="flex justify-between items-center text-slate-300">
                                                <span>R = Dist × 0.05</span>
                                                <span className="text-purple-400 font-bold text-sm">{calcs.R_ohms.toFixed(1)} Ω</span>
                                            </div>
                                        </div>

                                        <div className="bg-slate-900/60 p-3 rounded-xl border border-slate-800">
                                            <div className="text-slate-500 mb-1 font-bold uppercase tracking-widest text-[9px]">2. Calculate Line Current</div>
                                            <div className="flex justify-between items-center text-slate-300">
                                                <span>I = P_in / V</span>
                                                <span className="text-sky-400 font-bold text-sm">{calcs.I_amps.toFixed(0)} A</span>
                                            </div>
                                            <div className="text-[9px] text-slate-500 mt-1">100,000,000 W / {(voltageKV*1000).toLocaleString()} V</div>
                                        </div>

                                        <div className="bg-slate-900/60 p-3 rounded-xl border border-red-900/30 shadow-[inset_0_0_15px_rgba(239,68,68,0.05)]">
                                            <div className="text-red-400/70 mb-1 font-bold uppercase tracking-widest text-[9px]">3. Calculate Joule Heat Loss</div>
                                            <div className="flex justify-between items-center text-slate-300">
                                                <span>P_loss = I² × R</span>
                                                <span className="text-red-400 font-bold text-sm">{calcs.P_loss_MW.toFixed(2)} MW</span>
                                            </div>
                                            <div className="text-[9px] text-slate-500 mt-1">({calcs.I_amps.toFixed(0)})² × {calcs.R_ohms.toFixed(1)} Ω</div>
                                        </div>

                                        <div className="bg-slate-900/60 p-3 rounded-xl border border-emerald-900/30 shadow-[inset_0_0_15px_rgba(16,185,129,0.05)]">
                                            <div className="text-emerald-400/70 mb-1 font-bold uppercase tracking-widest text-[9px]">4. Calculate Efficiency</div>
                                            <div className="flex justify-between items-center text-slate-300">
                                                <span>η = P_out / P_in</span>
                                                <span className="text-emerald-400 font-bold text-sm">{calcs.efficiency.toFixed(1)}%</span>
                                            </div>
                                            <div className="text-[9px] text-slate-500 mt-1">{calcs.P_out_MW.toFixed(1)} MW / {POWER_IN_MW} MW</div>
                                        </div>

                                        <div className="mt-auto pt-2 text-[10px] text-slate-400 leading-relaxed font-sans bg-slate-800/50 p-3 rounded border border-slate-700/50">
                                            Notice that because current (I) is <strong>squared</strong> in the loss equation, stepping up the voltage by a factor of 10 reduces the power lost as heat by a factor of <strong>100</strong>!
                                        </div>

                                    </div>
                                </div>

                            </section>
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
