<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mass Defect & Binding Energy Calculator</title>
    <meta name="description" content="Interactive mass defect and binding energy calculator. Explore nuclear fusion, fission, and the E=mc² mass-energy equivalence.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0F172A; 
            color: #F8FAFC; 
        }
        .math-font { font-family: 'JetBrains Mono', monospace; }
        
        /* Custom Scrollbar for better UI inside iframes */
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100">

    <!-- React Mount Point -->
    <div id="root" class="min-h-screen"></div>

    <!-- React Application Logic -->
    <script type="text/babel" data-type="module">
        const { useState, useMemo } = React;

        // --- Custom Inline SVGs (Replacing lucide-react) ---
        const ArrowRight = ({ className }) => (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
            </svg>
        );

        const Zap = ({ className }) => (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
            </svg>
        );

        const Scale = ({ className }) => (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/>
                <path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/>
                <path d="M7 21h10"/><path d="M12 3v18"/>
                <path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/>
            </svg>
        );

        const Info = ({ className }) => (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>
            </svg>
        );

        const Activity = ({ className }) => (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
            </svg>
        );

        // --- Scientific Constants & Exact Isotopic Data ---
        const U_TO_MEV = 931.5; // 1 u = 931.5 MeV/c^2
        const M_PROTON_ATOM = 1.007825; // Mass of 1H atom (used to balance electrons)
        const M_NEUTRON = 1.008665;     // Mass of free neutron

        const ISOTOPES = {
            'n': { name: 'Neutron', symbol: 'n', mass: 1.008665, A: 1, Z: 0, color: 'bg-slate-500' },
            'H1': { name: 'Proton', symbol: 'H', mass: 1.007825, A: 1, Z: 1, color: 'bg-red-500' },
            'H2': { name: 'Deuterium', symbol: 'H', mass: 2.014102, A: 2, Z: 1, color: 'bg-rose-400' },
            'H3': { name: 'Tritium', symbol: 'H', mass: 3.016049, A: 3, Z: 1, color: 'bg-pink-500' },
            'He4': { name: 'Helium-4', symbol: 'He', mass: 4.002603, A: 4, Z: 2, color: 'bg-orange-500' },
            'U235': { name: 'Uranium-235', symbol: 'U', mass: 235.043930, A: 235, Z: 92, color: 'bg-purple-500' },
            'Ba141': { name: 'Barium-141', symbol: 'Ba', mass: 140.914411, A: 141, Z: 56, color: 'bg-indigo-500' },
            'Kr92': { name: 'Krypton-92', symbol: 'Kr', mass: 91.926156, A: 92, Z: 36, color: 'bg-cyan-500' },
            'Fe56': { name: 'Iron-56', symbol: 'Fe', mass: 55.934937, A: 56, Z: 26, color: 'bg-emerald-500' },
        };

        const REACTIONS = [
            {
                id: 'fusion_dt',
                name: 'D-T Fusion (Sun/Stars)',
                reactants: [{ id: 'H2', count: 1 }, { id: 'H3', count: 1 }],
                products: [{ id: 'He4', count: 1 }, { id: 'n', count: 1 }],
                desc: 'Light nuclei fuse, releasing immense energy. This powers stars and is the basis for thermonuclear fusion research.',
                type: 'fusion'
            },
            {
                id: 'fission_u235',
                name: 'U-235 Fission (Nuclear Power)',
                reactants: [{ id: 'U235', count: 1 }, { id: 'n', count: 1 }],
                products: [{ id: 'Ba141', count: 1 }, { id: 'Kr92', count: 1 }, { id: 'n', count: 3 }],
                desc: 'A heavy nucleus splits into lighter fragments when struck by a neutron, releasing energy and more neutrons to sustain a chain reaction.',
                type: 'fission'
            },
            {
                id: 'binding_he4',
                name: 'Helium-4 Binding Energy',
                reactants: [{ id: 'H1', count: 2 }, { id: 'n', count: 2 }],
                products: [{ id: 'He4', count: 1 }],
                desc: 'The theoretical assembly of an Alpha particle from bare nucleons. The missing mass is the Strong Nuclear Force holding it together.',
                type: 'binding'
            },
            {
                id: 'binding_fe56',
                name: 'Iron-56 Binding Energy',
                reactants: [{ id: 'H1', count: 26 }, { id: 'n', count: 30 }],
                products: [{ id: 'Fe56', count: 1 }],
                desc: 'Iron-56 has one of the highest binding energies per nucleon, making it the most stable endpoint of stellar nucleosynthesis.',
                type: 'binding'
            }
        ];

        // Utility: Calculate absolute Binding Energy of a single isotope
        const calculateIsotopeBE = (iso) => {
            if (iso.A === 1) return 0; // Free protons/neutrons have 0 binding energy
            const constituentMass = (iso.Z * M_PROTON_ATOM) + ((iso.A - iso.Z) * M_NEUTRON);
            const massDefect = constituentMass - iso.mass;
            return massDefect * U_TO_MEV;
        };

        function App() {
            const [activeReactionId, setActiveReactionId] = useState(REACTIONS[0].id);

            const rx = useMemo(() => REACTIONS.find(r => r.id === activeReactionId), [activeReactionId]);
            
            const calcData = useMemo(() => {
                let massReactants = 0;
                let massProducts = 0;
                let totalNucleons = 0;
                let beReactants = 0;
                let beProducts = 0;
                
                rx.reactants.forEach(item => {
                    const iso = ISOTOPES[item.id];
                    massReactants += iso.mass * item.count;
                    totalNucleons += iso.A * item.count;
                    beReactants += calculateIsotopeBE(iso) * item.count;
                });
                
                rx.products.forEach(item => {
                    const iso = ISOTOPES[item.id];
                    massProducts += iso.mass * item.count;
                    beProducts += calculateIsotopeBE(iso) * item.count;
                });

                const massDefect = massReactants - massProducts;
                const energyMeV = massDefect * U_TO_MEV;
                const conversionPercent = (massDefect / massReactants) * 100;
                
                // Average Binding Energy per Nucleon before and after
                const avgBeReactants = beReactants / totalNucleons;
                const avgBeProducts = beProducts / totalNucleons;

                return { 
                    massReactants, 
                    massProducts, 
                    massDefect, 
                    energyMeV, 
                    conversionPercent,
                    avgBeReactants,
                    avgBeProducts
                };
            }, [rx]);

            // UI Components for displaying isotopes in formal nuclear notation
            const ParticleBadge = ({ item, isProduct }) => {
                const iso = ISOTOPES[item.id];
                return (
                    <div className={`flex flex-col items-center bg-slate-800 border ${isProduct ? 'border-blue-500/30 shadow-[0_0_15px_rgba(59,130,246,0.1)]' : 'border-rose-500/30'} rounded-lg p-3 min-w-[90px]`}>
                        <div className={`w-12 h-12 rounded-full ${iso.color} flex items-center justify-center font-bold shadow-lg text-white mb-2 relative`}>
                            {/* Formal Isotope Notation A/Z X */}
                            <div className="flex items-center">
                                <div className="flex flex-col text-[10px] leading-[10px] text-right mr-0.5">
                                    <span>{iso.A}</span>
                                    <span>{iso.Z}</span>
                                </div>
                                <span className="text-lg">{iso.symbol}</span>
                            </div>
                        </div>
                        <div className="text-xs font-mono text-slate-300 font-bold">{item.count > 1 ? `${item.count} × ` : ''}{iso.name}</div>
                        <div className="text-[10px] font-mono text-slate-400 mt-1">{iso.mass.toFixed(5)} u</div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen bg-[#0F172A] text-slate-100 p-4 md:p-6 lg:p-8 font-sans overflow-y-auto custom-scrollbar">
                    
                    <div className="max-w-6xl mx-auto flex flex-col gap-6">
                        
                        {/* 1. Simulator Title */}
                        <header className="flex flex-col gap-2 mb-2">
                            <h1 className="text-3xl md:text-4xl font-extrabold bg-gradient-to-r from-emerald-400 to-blue-400 bg-clip-text text-transparent tracking-tight">
                                Mass Defect Calculator
                            </h1>
                            <p className="text-slate-400 text-sm font-mono tracking-wider">ΔE = Δm · c²</p>
                        </header>

                        {/* 2. Select Reaction Section */}
                        <section className="bg-slate-800/60 border border-slate-700 p-5 md:p-6 rounded-2xl shadow-lg">
                            <h2 className="text-xs font-semibold text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                                Select Reaction
                            </h2>
                            
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3 mb-5">
                                {REACTIONS.map(reaction => (
                                    <button
                                        key={reaction.id}
                                        onClick={() => setActiveReactionId(reaction.id)}
                                        className={`w-full text-left px-4 py-3 rounded-xl border text-sm transition-all duration-200 ${
                                            activeReactionId === reaction.id 
                                                ? 'bg-emerald-500/10 border-emerald-500/50 text-emerald-400 shadow-[0_0_15px_rgba(16,185,129,0.1)]' 
                                                : 'bg-slate-900 border-slate-700 text-slate-300 hover:border-slate-500 hover:bg-slate-800'
                                        }`}
                                    >
                                        <div className="font-bold">{reaction.name}</div>
                                    </button>
                                ))}
                            </div>

                            <div className="bg-slate-900/80 p-4 rounded-xl border border-slate-700 flex items-start gap-3 shadow-inner">
                                <Info className="w-5 h-5 text-blue-400 flex-shrink-0 mt-0.5" />
                                <p className="text-sm text-slate-300 leading-relaxed">
                                    {rx.desc}
                                </p>
                            </div>
                        </section>

                        {/* 3. Display Section (Visual Reaction Equation) */}
                        <section className="w-full bg-[#0B1120] border border-slate-700 rounded-2xl p-6 md:p-10 flex flex-col lg:flex-row items-center justify-center gap-6 shadow-2xl relative">
                            
                            {/* Reactants */}
                            <div className="flex flex-wrap justify-center items-center gap-3">
                                {rx.reactants.map((item, idx) => (
                                    <React.Fragment key={`r-${idx}`}>
                                        <ParticleBadge item={item} isProduct={false} />
                                        {idx < rx.reactants.length - 1 && <div className="text-slate-500 font-bold text-2xl mx-1">+</div>}
                                    </React.Fragment>
                                ))}
                            </div>

                            {/* Yield Arrow */}
                            <div className="flex flex-col items-center justify-center px-4 py-2">
                                <ArrowRight className="w-8 h-8 text-emerald-500" />
                            </div>

                            {/* Products */}
                            <div className="flex flex-wrap justify-center items-center gap-3">
                                {rx.products.map((item, idx) => (
                                    <React.Fragment key={`p-${idx}`}>
                                        <ParticleBadge item={item} isProduct={true} />
                                        {idx < rx.products.length - 1 && <div className="text-slate-500 font-bold text-2xl mx-1">+</div>}
                                    </React.Fragment>
                                ))}
                            </div>
                        </section>

                        {/* 4. Conversion Constant */}
                        <div className="text-center -mt-3 mb-2">
                             <div className="inline-block font-mono text-sm text-emerald-400 bg-slate-800/80 py-2.5 px-6 rounded-xl border border-slate-700 shadow-lg">
                                    <span className="text-slate-400">1 u = </span>931.5 MeV/c²
                             </div>
                        </div>

                        {/* 5. Core Calculation Breakdown */}
                        <section className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                            
                            {/* Left Col: Step by step Math */}
                            <div className="bg-slate-800/40 rounded-2xl border border-slate-700 p-6 flex flex-col">
                                <h3 className="text-sm font-semibold uppercase tracking-widest text-slate-400 mb-6 flex items-center gap-2">
                                    <Scale className="w-4 h-4" /> Mass & Energy Balance
                                </h3>
                                
                                <div className="space-y-4 font-mono text-sm">
                                    <div className="flex justify-between items-end border-b border-slate-700 pb-2">
                                        <span className="text-slate-300">Σ Mass Reactants</span>
                                        <span className="text-rose-400 font-bold">{calcData.massReactants.toFixed(6)} u</span>
                                    </div>
                                    <div className="flex justify-between items-end border-b border-slate-700 pb-2">
                                        <span className="text-slate-300">Σ Mass Products</span>
                                        <span className="text-blue-400 font-bold">{calcData.massProducts.toFixed(6)} u</span>
                                    </div>
                                    
                                    <div className="pt-2 flex justify-between items-end">
                                        <span className="text-slate-100 font-bold">Mass Defect (Δm)</span>
                                        <div className="text-right">
                                            <span className="text-amber-400 font-bold text-xl block">{calcData.massDefect.toFixed(6)} u</span>
                                            <span className="text-[10px] text-slate-500 uppercase font-sans tracking-widest font-bold">Missing Mass</span>
                                        </div>
                                    </div>
                                </div>

                                {/* Mass Conversion Efficiency Visualization */}
                                <div className="mt-8 bg-slate-900 p-4 rounded-xl border border-slate-700/50 shadow-inner">
                                    <div className="flex justify-between text-[10px] text-slate-400 mb-2 uppercase font-sans tracking-wider font-bold">
                                        <span>Efficiency</span>
                                        <span className="text-emerald-400">{calcData.conversionPercent.toFixed(3)}% Converted</span>
                                    </div>
                                    <div className="h-4 w-full bg-slate-800 rounded-full overflow-hidden flex relative mb-1">
                                        <div className="bg-blue-500 h-full" style={{ width: `${100 - Math.min(calcData.conversionPercent * 30, 95)}%` }}></div>
                                        <div className="bg-amber-400 h-full relative" style={{ width: `${Math.min(calcData.conversionPercent * 30, 95)}%` }}>
                                             <div className="absolute inset-0 opacity-50" style={{ backgroundImage: 'repeating-linear-gradient(45deg, transparent, transparent 5px, rgba(0,0,0,0.2) 5px, rgba(0,0,0,0.2) 10px)'}}></div>
                                        </div>
                                    </div>
                                    <div className="text-[9px] text-slate-500 text-center uppercase font-bold tracking-widest mt-2">
                                        Yellow bar visually exaggerated for clarity
                                    </div>
                                </div>
                            </div>

                            {/* Right Col: Deep Physics Insights */}
                            <div className="flex flex-col gap-6">
                                
                                {/* Huge Energy Output */}
                                <div className="flex-1 bg-emerald-900/10 rounded-2xl border border-emerald-500/20 p-6 flex flex-col items-center justify-center relative overflow-hidden group shadow-lg">
                                    <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-48 h-48 bg-emerald-500/20 blur-[80px] rounded-full"></div>
                                    
                                    <Zap className="w-10 h-10 text-emerald-400 mb-3 animate-pulse relative z-10" />
                                    
                                    <div className="text-center relative z-10">
                                        <h3 className="text-xs font-semibold uppercase tracking-widest text-emerald-500/70 mb-1">
                                            Total Energy Release (ΔE)
                                        </h3>
                                        <div className="text-5xl font-mono font-black text-emerald-400 tracking-tighter drop-shadow-[0_0_15px_rgba(52,211,153,0.4)]">
                                            {calcData.energyMeV.toFixed(2)} <span className="text-xl text-emerald-500/80">MeV</span>
                                        </div>
                                    </div>
                                </div>

                                {/* Binding Energy Pedagogical Link */}
                                <div className="bg-purple-900/10 rounded-2xl border border-purple-500/20 p-5 flex flex-col relative overflow-hidden shadow-lg">
                                     <h3 className="text-xs font-semibold uppercase tracking-widest text-purple-400 mb-4 flex items-center gap-2">
                                        <Activity className="w-4 h-4" /> Avg Binding Energy / Nucleon
                                     </h3>
                                     
                                     <div className="flex justify-between items-center font-mono">
                                            <div className="text-center">
                                                <div className="text-sm text-slate-400 mb-1">Reactants</div>
                                                <div className="text-lg font-bold text-slate-200">{calcData.avgBeReactants.toFixed(2)}</div>
                                            </div>
                                            
                                            <div className="flex flex-col items-center text-purple-500 px-4">
                                                <ArrowRight className="w-5 h-5 mb-1" />
                                                <span className="text-[10px] font-sans uppercase font-bold tracking-widest text-purple-400/70">Stability</span>
                                            </div>

                                            <div className="text-center">
                                                <div className="text-sm text-slate-400 mb-1">Products</div>
                                                <div className="text-lg font-bold text-purple-400">{calcData.avgBeProducts.toFixed(2)}</div>
                                            </div>
                                     </div>

                                     <p className="text-[10px] text-purple-300/60 mt-4 leading-relaxed text-center font-sans tracking-wide">
                                         Reactions release energy because the resulting products are bound tighter (higher BE/A) than the reactants.
                                     </p>
                                </div>

                            </div>
                        </section>

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
