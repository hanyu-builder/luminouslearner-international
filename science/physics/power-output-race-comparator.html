<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Physics power output calculator and race simulator. Visualize mechanical work and power (P = W/t) with interactive climbing runners and industrial cranes.">
    <title>Power Output Race Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0F172A; /* Deep slate */
            color: #F8FAFC;
            overflow: hidden; /* Prevent desktop scrolling */
        }
        .math-font {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Custom Sliders */
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 18px; width: 18px; border-radius: 50%;
            cursor: pointer; margin-top: -7px; transition: transform 0.1s;
        }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px; cursor: pointer; background: #475569; border-radius: 2px;
        }

        /* Slider specific colors */
        #slider-ma::-webkit-slider-thumb, #slider-pa::-webkit-slider-thumb, #slider-ta::-webkit-slider-thumb { background: #FB7185; box-shadow: 0 0 10px rgba(251, 113, 133, 0.6); }
        #slider-mb::-webkit-slider-thumb, #slider-pb::-webkit-slider-thumb, #slider-tb::-webkit-slider-thumb { background: #38BDF8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.6); }
        #slider-h::-webkit-slider-thumb { background: #A78BFA; box-shadow: 0 0 10px rgba(167, 139, 250, 0.6); }

        /* Hide Scrollbar */
        ::-webkit-scrollbar { display: none; }
        
        .bar-transition { transition: height 0.1s ease-out, background-color 0.3s; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-2 md:p-4 w-full h-full text-slate-100">

    <div class="w-full max-w-[1400px] h-full md:h-[900px] bg-slate-800/80 rounded-3xl shadow-2xl border border-slate-700 flex flex-col overflow-hidden backdrop-blur-md">
        
        <header class="bg-slate-900/70 p-4 border-b border-slate-700 flex justify-between items-center z-20 shrink-0">
            <div class="flex items-center gap-3">
                <div class="bg-fuchsia-500/20 p-2 rounded-lg border border-fuchsia-500/50 hidden md:block">
                    <svg class="w-6 h-6 text-fuchsia-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                </div>
                <div>
                    <h1 class="text-2xl md:text-3xl font-bold bg-gradient-to-r from-fuchsia-400 to-rose-400 bg-clip-text text-transparent">
                        Power Output Simulator
                    </h1>
                    <p class="text-slate-400 text-xs md:text-sm mt-1 font-medium">Rate of Energy Transfer (<span class="math-font text-slate-200 font-bold"><i>P</i> = <i>W</i> / <i>t</i></span>)</p>
                </div>
            </div>
            <div class="flex gap-3">
                <button id="btn-start" class="bg-emerald-600 hover:bg-emerald-500 px-6 py-2.5 rounded-lg text-sm font-bold transition border border-emerald-400 text-white shadow-[0_0_15px_rgba(16,185,129,0.4)] flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path></svg>
                    Start Race
                </button>
                <button id="btn-reset" class="bg-slate-700 hover:bg-slate-600 px-5 py-2.5 rounded-lg text-sm font-bold transition border border-slate-500 text-white shadow-md">
                    Reset
                </button>
            </div>
        </header>

        <div class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-0 min-h-0 relative">
            
            <div class="lg:col-span-3 bg-slate-900/50 border-r border-slate-700 p-5 flex flex-col gap-5 overflow-y-auto z-10 custom-scrollbar pr-3">
                
                <h2 class="text-sm font-bold text-slate-300 uppercase tracking-widest flex items-center gap-2 mb-1">
                    <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    Setup
                </h2>

                <div class="bg-slate-800/80 p-3.5 rounded-xl border border-slate-700 shadow-md">
                    <label class="text-slate-300 text-[10px] uppercase font-bold tracking-widest block mb-2">Scenario</label>
                    <select id="select-scenario" class="w-full bg-slate-900 border border-slate-600 text-white text-sm font-semibold rounded-lg p-2.5 outline-none focus:border-fuchsia-500 transition cursor-pointer">
                        <option value="runners">Sprinters (Set Time, Find Power)</option>
                        <option value="cranes">Cranes (Set Power, Find Time)</option>
                    </select>
                </div>

                <div class="bg-slate-800/80 p-4 rounded-xl border border-purple-900/50 relative overflow-hidden shadow-md">
                    <div class="absolute left-0 top-0 w-1 h-full bg-purple-500"></div>
                    <div class="flex justify-between items-end mb-2 pl-2">
                        <label class="text-purple-200 text-xs uppercase font-bold tracking-widest">Target Height (h)</label>
                        <span class="text-sm font-bold text-purple-400 math-font"><span id="val-h">10.0</span> m</span>
                    </div>
                    <input type="range" id="slider-h" class="pl-2" min="5.0" max="20.0" step="1.0" value="10.0">
                </div>

                <div class="h-px w-full bg-slate-700 my-1"></div>

                <div class="bg-slate-800/80 p-4 rounded-xl border border-rose-900/50 relative overflow-hidden shadow-inner">
                    <div class="absolute left-0 top-0 w-1 h-full bg-rose-500"></div>
                    <h3 class="text-xs text-rose-400 font-bold mb-3 uppercase tracking-widest pl-1" id="title-A">Runner A (Red)</h3>
                    
                    <div class="mb-3 pl-1">
                        <div class="flex justify-between items-end mb-1">
                            <label class="text-slate-300 text-[10px] uppercase font-bold tracking-widest">Mass (m)</label>
                            <span class="text-sm font-bold text-slate-200 math-font"><span id="val-ma">70</span> kg</span>
                        </div>
                        <input type="range" id="slider-ma" min="30" max="150" step="5" value="70">
                    </div>

                    <div class="pl-1 input-runners">
                        <div class="flex justify-between items-end mb-1">
                            <label class="text-slate-300 text-[10px] uppercase font-bold tracking-widest">Target Time (t)</label>
                            <span class="text-sm font-bold text-slate-200 math-font"><span id="val-ta">5.0</span> s</span>
                        </div>
                        <input type="range" id="slider-ta" min="2.0" max="15.0" step="0.5" value="5.0">
                    </div>

                    <div class="pl-1 input-cranes hidden">
                        <div class="flex justify-between items-end mb-1">
                            <label class="text-slate-300 text-[10px] uppercase font-bold tracking-widest">Engine Power (P)</label>
                            <span class="text-sm font-bold text-slate-200 math-font"><span id="val-pa">1000</span> W</span>
                        </div>
                        <input type="range" id="slider-pa" min="100" max="3000" step="50" value="1000">
                    </div>
                </div>

                <div class="bg-slate-800/80 p-4 rounded-xl border border-sky-900/50 relative overflow-hidden shadow-inner">
                    <div class="absolute left-0 top-0 w-1 h-full bg-sky-500"></div>
                    <h3 class="text-xs text-sky-400 font-bold mb-3 uppercase tracking-widest pl-1" id="title-B">Runner B (Blue)</h3>
                    
                    <div class="mb-3 pl-1">
                        <div class="flex justify-between items-end mb-1">
                            <label class="text-slate-300 text-[10px] uppercase font-bold tracking-widest">Mass (m)</label>
                            <span class="text-sm font-bold text-slate-200 math-font"><span id="val-mb">50</span> kg</span>
                        </div>
                        <input type="range" id="slider-mb" min="30" max="150" step="5" value="50">
                    </div>

                    <div class="pl-1 input-runners">
                        <div class="flex justify-between items-end mb-1">
                            <label class="text-slate-300 text-[10px] uppercase font-bold tracking-widest">Target Time (t)</label>
                            <span class="text-sm font-bold text-slate-200 math-font"><span id="val-tb">3.5</span> s</span>
                        </div>
                        <input type="range" id="slider-tb" min="2.0" max="15.0" step="0.5" value="3.5">
                    </div>

                    <div class="pl-1 input-cranes hidden">
                        <div class="flex justify-between items-end mb-1">
                            <label class="text-slate-300 text-[10px] uppercase font-bold tracking-widest">Engine Power (P)</label>
                            <span class="text-sm font-bold text-slate-200 math-font"><span id="val-pb">1500</span> W</span>
                        </div>
                        <input type="range" id="slider-pb" min="100" max="3000" step="50" value="1500">
                    </div>
                </div>

            </div>

            <div class="lg:col-span-6 relative flex flex-col justify-center items-center bg-[#020617] overflow-hidden border-r border-slate-700" id="canvas-wrapper">
                
                <div class="absolute top-5 left-1/2 -translate-x-1/2 pointer-events-none bg-black/60 backdrop-blur px-8 py-3 rounded-full border border-white/10 shadow-xl z-10 flex flex-col items-center">
                    <span class="text-[10px] text-fuchsia-400 uppercase font-bold tracking-widest mb-1">Race Clock</span>
                    <span class="text-4xl font-bold text-white math-font tracking-wider drop-shadow"><span id="race-clock">0.00</span><span class="text-xl text-slate-400 ml-1">s</span></span>
                </div>

                <canvas id="simCanvas" class="w-full h-full absolute inset-0"></canvas>
            </div>

            <div class="lg:col-span-3 bg-slate-900/50 flex flex-col p-5 gap-5 overflow-y-auto z-10 custom-scrollbar pr-3">
                
                <div>
                    <h2 class="text-sm font-bold text-slate-300 uppercase tracking-widest mb-2 flex items-center gap-2">
                        <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        Accumulated Work (W)
                    </h2>
                    <div class="flex items-end justify-around h-36 bg-slate-800/80 p-4 rounded-2xl border border-slate-700 relative shadow-inner">
                        <div class="absolute left-3 bottom-4 text-[9px] font-bold text-slate-500 math-font">0J</div>
                        <div class="absolute left-3 top-4 text-[9px] font-bold text-slate-500 math-font" id="max-work-lbl">30000J</div>

                        <div class="flex flex-col items-center justify-end h-full w-14 z-10">
                            <span class="text-sm font-bold text-white math-font mb-1 drop-shadow" id="lbl-wa">0</span>
                            <div class="w-full bg-rose-500 rounded-t-md bar-transition shadow-[0_0_10px_rgba(244,63,94,0.3)]" id="bar-wa" style="height: 0%;"></div>
                            <span class="text-[10px] text-rose-400 mt-2 font-bold uppercase tracking-wider">A</span>
                        </div>

                        <div class="flex flex-col items-center justify-end h-full w-14 z-10">
                            <span class="text-sm font-bold text-white math-font mb-1 drop-shadow" id="lbl-wb">0</span>
                            <div class="w-full bg-sky-500 rounded-t-md bar-transition shadow-[0_0_10px_rgba(14,165,233,0.3)]" id="bar-wb" style="height: 0%;"></div>
                            <span class="text-[10px] text-sky-400 mt-2 font-bold uppercase tracking-wider">B</span>
                        </div>
                    </div>
                </div>

                <div>
                    <h2 class="text-sm font-bold text-slate-300 uppercase tracking-widest mb-2 flex items-center gap-2">
                        <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        Power Output (P)
                    </h2>
                    <div class="flex items-end justify-around h-44 bg-slate-950 p-4 rounded-2xl border border-slate-800 relative shadow-inner">
                        <div class="absolute left-3 bottom-4 text-[9px] font-bold text-slate-500 math-font">0W</div>
                        <div class="absolute left-3 top-4 text-[9px] font-bold text-slate-500 math-font" id="max-pow-lbl">6000W</div>

                        <div class="flex flex-col items-center justify-end h-full w-14 z-10">
                            <span class="text-sm font-bold text-white math-font mb-1 drop-shadow" id="lbl-pa">0</span>
                            <div class="w-full bg-rose-500/40 border-2 border-rose-500 rounded-t-md bar-transition" id="bar-pa" style="height: 0%;"></div>
                            <span class="text-[10px] text-rose-400 mt-2 font-bold uppercase tracking-wider">A</span>
                        </div>

                        <div class="flex flex-col items-center justify-end h-full w-14 z-10">
                            <span class="text-sm font-bold text-white math-font mb-1 drop-shadow" id="lbl-pb">0</span>
                            <div class="w-full bg-sky-500/40 border-2 border-sky-500 rounded-t-md bar-transition" id="bar-pb" style="height: 0%;"></div>
                            <span class="text-[10px] text-sky-400 mt-2 font-bold uppercase tracking-wider">B</span>
                        </div>
                    </div>
                </div>

                <div class="h-px w-full bg-slate-700 my-1"></div>

                <div class="mt-auto">
                    <h3 class="text-[11px] text-slate-400 font-bold uppercase tracking-widest mb-2">Physics Concept</h3>
                    <div id="theory-text" class="text-[11px] text-slate-300 leading-relaxed bg-slate-800/60 p-3.5 rounded-xl border border-slate-700/80 shadow-inner">
                        </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        /**
         * POWER OUTPUT RACE ENGINE
         * * Simulates two objects climbing stairs or being pulled by cranes.
         * * Calculates accumulated Work (mgh) in real-time as height increases.
         * * Calculates total Power (W/t) required for the race based on inputs.
         */

        // --- DOM Elements ---
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const canvasWrapper = document.getElementById('canvas-wrapper');
        
        const selectScenario = document.getElementById('select-scenario');
        const inputRunners = document.querySelectorAll('.input-runners');
        const inputCranes = document.querySelectorAll('.input-cranes');
        
        const titleA = document.getElementById('title-A');
        const titleB = document.getElementById('title-B');

        const sliderH = document.getElementById('slider-h');
        const sliderMA = document.getElementById('slider-ma');
        const sliderTA = document.getElementById('slider-ta');
        const sliderPA = document.getElementById('slider-pa');
        const sliderMB = document.getElementById('slider-mb');
        const sliderTB = document.getElementById('slider-tb');
        const sliderPB = document.getElementById('slider-pb');
        
        const valH = document.getElementById('val-h');
        const valMA = document.getElementById('val-ma');
        const valTA = document.getElementById('val-ta');
        const valPA = document.getElementById('val-pa');
        const valMB = document.getElementById('val-mb');
        const valTB = document.getElementById('val-tb');
        const valPB = document.getElementById('val-pb');

        const btnStart = document.getElementById('btn-start');
        const btnReset = document.getElementById('btn-reset');
        const raceClock = document.getElementById('race-clock');

        // Bar Chart Elements
        const barWa = document.getElementById('bar-wa');
        const barWb = document.getElementById('bar-wb');
        const lblWa = document.getElementById('lbl-wa');
        const lblWb = document.getElementById('lbl-wb');
        const maxWorkLbl = document.getElementById('max-work-lbl');

        const barPa = document.getElementById('bar-pa');
        const barPb = document.getElementById('bar-pb');
        const lblPa = document.getElementById('lbl-pa');
        const lblPb = document.getElementById('lbl-pb');
        const maxPowLbl = document.getElementById('max-pow-lbl');

        const theoryText = document.getElementById('theory-text');

        // --- Physics Constants & State ---
        const g = 9.81; // m/s^2
        const STEPS = 10; // visual stairs
        
        let width = 0, height = 0;
        let lastTime = 0;
        let animationId;

        // Interaction State
        let isRacing = false;
        let elapsedRealTime = 0; 

        // Competitor State
        class Competitor {
            constructor(id, color) {
                this.id = id;
                this.color = color;
                this.m = 0;
                this.t_target = 0;
                this.p_target = 0;
                this.h_current = 0; 
                this.finished = false;
            }
        }

        let state = {
            scenario: 'runners',
            h: 10
        };

        let compA = new Competitor('A', '#FB7185');
        let compB = new Competitor('B', '#38BDF8');

        function resize() {
            const rect = canvasWrapper.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            width = rect.width;
            height = rect.height;
            draw();
        }
        window.addEventListener('resize', resize);

        // --- Math & Kinematics ---
        function getInputs() {
            state.scenario = selectScenario.value;
            state.h = parseFloat(sliderH.value);
            valH.innerText = state.h.toFixed(1);

            compA.m = parseFloat(sliderMA.value);
            compB.m = parseFloat(sliderMB.value);
            valMA.innerText = compA.m;
            valMB.innerText = compB.m;

            if (state.scenario === 'runners') {
                // Time is input, Power is calculated
                compA.t_target = parseFloat(sliderTA.value);
                compB.t_target = parseFloat(sliderTB.value);
                valTA.innerText = compA.t_target.toFixed(1);
                valTB.innerText = compB.t_target.toFixed(1);
                
                compA.p_target = (compA.m * g * state.h) / compA.t_target;
                compB.p_target = (compB.m * g * state.h) / compB.t_target;

                titleA.innerText = "Runner A (Red)";
                titleB.innerText = "Runner B (Blue)";

                theoryText.innerHTML = `
                    <strong>Work (<i>W</i> = <i>mgh</i>)</strong> only depends on mass and height. A heavy person walking slowly does more work than a light person running fast.<br><br>
                    <strong>Power (<i>P</i> = <i>W</i>/<i>t</i>)</strong> is the <em>rate</em> of doing work. You are setting the <strong>Time</strong>. A lighter person can generate more power if they complete the task in a significantly shorter time!
                `;

            } else {
                // Power is input, Time is calculated
                compA.p_target = parseFloat(sliderPA.value);
                compB.p_target = parseFloat(sliderPB.value);
                valPA.innerText = compA.p_target;
                valPB.innerText = compB.p_target;
                
                compA.t_target = (compA.m * g * state.h) / compA.p_target;
                compB.t_target = (compB.m * g * state.h) / compB.p_target;

                titleA.innerText = "Crane Engine A (Red)";
                titleB.innerText = "Crane Engine B (Blue)";

                theoryText.innerHTML = `
                    <strong>Work (<i>W</i> = <i>mgh</i>)</strong> only depends on the mass of the crate and the height it is lifted.<br><br>
                    <strong>Time (<i>t</i> = <i>W</i>/<i>P</i>)</strong> depends on the capacity of the engine. You are setting the <strong>Power</strong> limit of the crane. An engine with high power can accomplish the required work in a fraction of the time.
                `;
            }
        }

        function updateCharts() {
            // Maximums for visual scaling
            const maxMass = 150;
            const maxHeight = 20;
            const visualMaxW = Math.ceil((maxMass * g * maxHeight) / 5000) * 5000; // Round to nearest 5000
            maxWorkLbl.innerText = visualMaxW + "J";

            const visualMaxPow = 6000; // Based on max sliders
            maxPowLbl.innerText = visualMaxPow + "W";

            // Current Work = m * g * h_current
            const wa = compA.m * g * compA.h_current;
            const wb = compB.m * g * compB.h_current;
            
            barWa.style.height = `${(wa / visualMaxW) * 100}%`;
            barWb.style.height = `${(wb / visualMaxW) * 100}%`;
            lblWa.innerText = Math.floor(wa);
            lblWb.innerText = Math.floor(wb);

            // Total Power
            // Display immediately to show what they are aiming for, but fade opacity if not finished
            let paDisplay = isRacing || compA.finished ? compA.p_target : 0;
            let pbDisplay = isRacing || compB.finished ? compB.p_target : 0;
            
            // If idle and not finished, show preview via ghost bars
            if (!isRacing && !compA.finished && !compB.finished) {
                paDisplay = compA.p_target;
                pbDisplay = compB.p_target;
            }

            barPa.style.height = `${Math.min(100, (paDisplay / visualMaxPow) * 100)}%`;
            barPb.style.height = `${Math.min(100, (pbDisplay / visualMaxPow) * 100)}%`;
            lblPa.innerText = Math.floor(paDisplay);
            lblPb.innerText = Math.floor(pbDisplay);
        }

        // --- Render Engine ---

        function drawStairs() {
            const stairW = width * 0.8 / STEPS;
            const stairH = (height * 0.7) / STEPS; 
            
            const startX = width * 0.1;
            const startY = height * 0.85;

            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 4;
            ctx.lineJoin = 'round';
            ctx.beginPath();
            
            ctx.moveTo(0, startY);
            ctx.lineTo(startX, startY);

            let cx = startX;
            let cy = startY;
            for(let i=0; i<STEPS; i++) {
                ctx.lineTo(cx, cy - stairH); 
                ctx.lineTo(cx + stairW, cy - stairH); 
                cx += stairW;
                cy -= stairH;
            }
            
            ctx.lineTo(width, cy);
            ctx.lineTo(width, height);
            ctx.lineTo(0, height);
            ctx.closePath();
            
            ctx.fillStyle = '#1E293B';
            ctx.fill();
            ctx.stroke();

            // Height Markers
            ctx.fillStyle = '#94A3B8';
            ctx.font = '14px JetBrains Mono';
            ctx.textAlign = 'right';
            ctx.fillText('0m', startX - 15, startY + 5);
            ctx.fillText(`${state.h}m`, cx - 15, cy + 5);
            
            ctx.strokeStyle = 'rgba(148, 163, 184, 0.3)';
            ctx.lineWidth = 2;
            ctx.setLineDash([8, 8]);
            ctx.beginPath();
            ctx.moveTo(startX, cy);
            ctx.lineTo(cx, cy);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function drawRunner(runner, offsetIdx) {
            const startX = width * 0.1;
            const startY = height * 0.85;
            const totalW = width * 0.8;
            const totalH = height * 0.7;

            const pxX = startX + (runner.h_current / state.h) * totalW;
            const pxY = startY - (runner.h_current / state.h) * totalH;

            const rW = 20 + (runner.m / 150) * 25; // Scale width with mass
            const rH = 45;

            // Stagger depth visually (Isometric fake)
            const zOffsetX = offsetIdx === 0 ? -20 : 20;
            const zOffsetY = offsetIdx === 0 ? -10 : 10;

            const finalX = pxX + zOffsetX;
            const finalY = pxY + zOffsetY;

            ctx.fillStyle = runner.color;
            ctx.shadowBlur = 15;
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
