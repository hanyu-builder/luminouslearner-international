<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U-Value Thermal Transmittance Calculator</title>
    <meta name="description" content="Interactive U-Value and heat loss calculator for building materials.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: { 900: '#0F172A', 800: '#1E293B', 700: '#334155', 600: '#475569' }
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM via CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for in-browser JSX transpilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { margin: 0; padding: 0; background-color: #0F172A; }
        
        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #64748b; }

        /* Custom Range Slider */
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%;
            background: #94A3B8; cursor: pointer; margin-top: -6px;
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:active { transform: scale(1.2); }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px; cursor: pointer; background: #334155; border-radius: 2px;
        }
        input[type=range]:focus { outline: none; }
    </style>
</head>
<body class="text-slate-200 font-sans h-screen max-h-[1000px] overflow-hidden selection:bg-orange-500 selection:text-white">
    
    <!-- React Root -->
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        // --- Material Database ---
        const MATERIALS = {
          brick: { name: 'Brickwork', k: 0.77, color: '#9A3412', pattern: 'brick' },
          concrete: { name: 'Dense Concrete', k: 1.50, color: '#94A3B8', pattern: 'solid' },
          aerated_concrete: { name: 'Aerated Concrete', k: 0.15, color: '#CBD5E1', pattern: 'dotted' },
          mineral_wool: { name: 'Mineral Wool', k: 0.035, color: '#D97706', pattern: 'wool' },
          pir: { name: 'PIR Insulation Board', k: 0.022, color: '#FEF08A', pattern: 'solid' },
          timber: { name: 'Timber', k: 0.13, color: '#B45309', pattern: 'wood' },
          plasterboard: { name: 'Plasterboard', k: 0.16, color: '#F1F5F9', pattern: 'solid' },
        };

        // Standard surface thermal resistances (m²K/W)
        const R_SI = 0.13; // Internal surface resistance
        const R_SE = 0.04; // External surface resistance

        function App() {
          // --- State ---
          const [layers, setLayers] = useState([
            { id: 'l1', mat: 'plasterboard', d: 12.5 },
            { id: 'l2', mat: 'mineral_wool', d: 100 },
            { id: 'l3', mat: 'aerated_concrete', d: 100 },
            { id: 'l4', mat: 'brick', d: 102 }
          ]);
          
          const [tempIn, setTempIn] = useState(20);
          const [tempOut, setTempOut] = useState(-5);
          const [area, setArea] = useState(50); // m²

          // --- Physics Calculations ---
          const telemetry = useMemo(() => {
            let totalR = R_SI + R_SE;
            let totalThickness = 0;
            
            // Calculate R for each layer (R = d / k), d converted to meters
            const layersData = layers.map(layer => {
              const material = MATERIALS[layer.mat];
              const thicknessM = layer.d / 1000;
              const rValue = thicknessM / material.k;
              totalR += rValue;
              totalThickness += layer.d;
              
              return {
                ...layer,
                material,
                rValue,
                thicknessM
              };
            });

            const uValue = 1 / totalR;
            const deltaT = tempIn - tempOut;
            const heatLossFlux = uValue * deltaT; // W/m²
            const totalHeatLoss = heatLossFlux * area; // W

            // Calculate temperature profile for the graph
            let currentTemp = tempIn;
            const tempProfile = [];
            
            // 1. Inside Air
            tempProfile.push({ xOffset: 0, temp: currentTemp });
            
            // 2. Inside Surface (after R_si drop)
            currentTemp -= (heatLossFlux * R_SI);
            tempProfile.push({ xOffset: 0, temp: currentTemp }); // Surface edge

            // 3. Through each layer
            let accumulatedThickness = 0;
            layersData.forEach(layer => {
              accumulatedThickness += layer.d;
              currentTemp -= (heatLossFlux * layer.rValue);
              // Store the percentage across the physical wall (0 to 1)
              tempProfile.push({ 
                xOffset: totalThickness > 0 ? (accumulatedThickness / totalThickness) : 0, 
                temp: currentTemp 
              });
            });

            // 4. Outside Air (after R_se drop, should equal tempOut)
            tempProfile.push({ xOffset: 1, temp: tempOut });

            return {
              totalR,
              uValue,
              heatLossFlux,
              totalHeatLoss,
              totalThickness,
              layersData,
              tempProfile,
              deltaT
            };
          }, [layers, tempIn, tempOut, area]);

          // --- Handlers ---
          const updateLayer = (id, field, value) => {
            setLayers(layers.map(l => l.id === id ? { ...l, [field]: value } : l));
          };

          const removeLayer = (id) => {
            setLayers(layers.filter(l => l.id !== id));
          };

          const addLayer = () => {
            setLayers([...layers, { id: Date.now().toString(), mat: 'mineral_wool', d: 50 }]);
          };

          const moveLayer = (index, direction) => {
            if (index + direction < 0 || index + direction >= layers.length) return;
            const newLayers = [...layers];
            const temp = newLayers[index];
            newLayers[index] = newLayers[index + direction];
            newLayers[index + direction] = temp;
            setLayers(newLayers);
          };

          return (
            <div className="h-full flex flex-col">
              
              <h1 className="sr-only">U value thermal transmittance calculator</h1>

              {/* Header */}
              <header className="bg-slate-800 border-b border-slate-700 p-4 flex justify-between items-center shrink-0 shadow-md z-10">
                <div>
                  <h2 className="text-2xl font-bold bg-gradient-to-r from-orange-400 to-blue-400 bg-clip-text text-transparent">
                    U-Value Calculator
                  </h2>
                  <p className="text-sm text-slate-400 mt-1">Thermal Transmittance & Heat Loss Analysis</p>
                </div>
                
                {/* PEDAGOGICAL FIX: Native HTML Math Formulas instead of LaTeX */}
                <div className="hidden md:flex gap-4">
                   <div className="bg-slate-900 px-4 py-2 rounded-lg border border-slate-700 shadow-inner flex items-center gap-5 text-sm font-mono text-slate-300">
                      
                      {/* R = d/k */}
                      <div className="flex items-center gap-1.5">
                         <span>R =</span>
                         <div className="flex flex-col items-center leading-[1] text-[11px]">
                            <span className="border-b border-slate-400 w-full text-center pb-[2px]">d</span>
                            <span className="pt-[2px]">k</span>
                         </div>
                      </div>
                      
                      <div className="w-px h-6 bg-slate-700"></div>
                      
                      {/* U = 1/ER */}
                      <div className="flex items-center gap-1.5 text-orange-400 font-bold">
                         <span>U =</span>
                         <div className="flex flex-col items-center leading-[1] text-[11px]">
                            <span className="border-b border-orange-400 w-full text-center pb-[2px]">1</span>
                            <span className="pt-[2px]">ΣR</span>
                         </div>
                      </div>
                      
                      <div className="w-px h-6 bg-slate-700"></div>
                      
                      {/* Q = U * A * dT */}
                      <span className="text-blue-400 font-bold">Q = U &times; A &times; ΔT</span>
                      
                   </div>
                </div>
              </header>

              {/* Main Workspace */}
              <main className="flex-1 flex flex-col md:flex-row overflow-hidden p-4 gap-4">
                
                {/* Left Panel: Environment & Layers */}
                <aside className="w-full md:w-96 flex flex-col gap-4 overflow-y-auto custom-scrollbar shrink-0 z-10 pr-1">
                  
                  {/* Environment Settings */}
                  <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-lg shrink-0">
                    <h3 className="text-sm font-bold text-slate-400 uppercase tracking-widest border-b border-slate-600 pb-2 mb-4">Environment Params</h3>
                    <div className="grid grid-cols-2 gap-4">
                      <div className="bg-slate-900/50 p-2 rounded border border-orange-500/30 border-l-2 border-l-orange-500">
                        <label className="block text-xs text-slate-400 mb-1">Inside Temp (°C)</label>
                        <input type="number" value={tempIn} onChange={e => setTempIn(Number(e.target.value))} className="w-full bg-transparent text-orange-400 font-mono font-bold outline-none" />
                      </div>
                      <div className="bg-slate-900/50 p-2 rounded border border-blue-500/30 border-r-2 border-r-blue-500">
                        <label className="block text-xs text-slate-400 mb-1 text-right">Outside Temp (°C)</label>
                        <input type="number" value={tempOut} onChange={e => setTempOut(Number(e.target.value))} className="w-full bg-transparent text-blue-400 font-mono font-bold outline-none text-right" />
                      </div>
                      <div className="bg-slate-900/50 p-2 rounded border border-slate-700 col-span-2 flex justify-between items-center">
                        <label className="text-xs text-slate-400">Total Wall Area (m²)</label>
                        <input type="number" value={area} onChange={e => setArea(Number(e.target.value))} className="w-20 bg-transparent text-white font-mono font-bold outline-none text-right" />
                      </div>
                    </div>
                  </div>

                  {/* Wall Assembly Layers */}
                  <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-lg flex-1 flex flex-col min-h-0">
                    <div className="flex justify-between items-end border-b border-slate-600 pb-2 mb-3 shrink-0">
                      <h3 className="text-sm font-bold text-slate-400 uppercase tracking-widest">Wall Assembly</h3>
                      <span className="text-[10px] text-slate-500 font-bold tracking-wider">INSIDE &rarr; OUTSIDE</span>
                    </div>
                    
                    <div className="flex-1 overflow-y-auto custom-scrollbar space-y-3 pr-2">
                      {layers.map((layer, index) => (
                        <div key={layer.id} className="bg-slate-900 border border-slate-700 rounded-lg p-3 relative group">
                          
                          {/* Order Number Badge */}
                          <div className="absolute top-3 left-2 w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-bold bg-slate-800 text-slate-400 shadow-inner border border-slate-700">
                              {index + 1}
                          </div>
                          
                          <div className="pl-8 flex flex-col gap-3">
                            <div className="flex justify-between items-center gap-2">
                              <select 
                                value={layer.mat} 
                                onChange={e => updateLayer(layer.id, 'mat', e.target.value)}
                                className="flex-1 bg-slate-800 text-white text-sm rounded px-2 py-1.5 outline-none border border-slate-600 focus:border-orange-500 cursor-pointer"
                              >
                                {Object.entries(MATERIALS).map(([key, mat]) => (
                                  <option key={key} value={key}>{mat.name}</option>
                                ))}
                              </select>
                              
                              {/* Reorder & Delete Buttons */}
                              <div className="flex gap-1">
                                <button onClick={() => moveLayer(index, -1)} disabled={index === 0} className="p-1.5 text-slate-400 hover:text-white bg-slate-800 rounded border border-slate-700 disabled:opacity-30 disabled:cursor-not-allowed">
                                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m18 15-6-6-6 6"/></svg>
                                </button>
                                <button onClick={() => moveLayer(index, 1)} disabled={index === layers.length - 1} className="p-1.5 text-slate-400 hover:text-white bg-slate-800 rounded border border-slate-700 disabled:opacity-30 disabled:cursor-not-allowed">
                                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                                </button>
                                <button onClick={() => removeLayer(layer.id)} className="p-1.5 text-slate-400 hover:text-red-400 bg-slate-800 rounded border border-slate-700 ml-1">
                                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
                                </button>
                              </div>
                            </div>

                            <div>
                              <label className="flex justify-between text-xs text-slate-400 mb-1">
                                <span>Thickness (d)</span>
                                <span className="text-white font-mono">{layer.d} mm</span>
                              </label>
                              <input 
                                type="range" min="5" max="300" step="1" 
                                value={layer.d} onChange={e => updateLayer(layer.id, 'd', Number(e.target.value))}
                              />
                            </div>
                          </div>
                        </div>
                      ))}
                      
                      {layers.length === 0 && (
                        <div className="text-center text-slate-500 text-sm py-6 border-2 border-dashed border-slate-700 rounded-lg">
                          No layers added.<br/>Heat is flowing freely!
                        </div>
                      )}
                    </div>

                    <button onClick={addLayer} className="w-full mt-3 bg-slate-700 hover:bg-slate-600 text-white font-bold py-2 rounded-lg border border-slate-500 transition-colors flex justify-center items-center gap-2 shrink-0 shadow-lg">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 5v14M5 12h14"/></svg>
                      Add Material Layer
                    </button>
                  </div>
                </aside>

                {/* Right Content Area: Results & Visualization */}
                <div className="flex-1 flex flex-col gap-4 overflow-hidden min-w-0 z-10">
                    
                    {/* Top Panel: Telemetry Dashboard */}
                    <section className="shrink-0 bg-slate-800 rounded-xl border border-slate-700 shadow-lg p-5">
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            
                            <div className="bg-slate-900 p-4 rounded-lg border border-slate-700 relative overflow-hidden group">
                                <div className="absolute top-0 left-0 h-1 w-full bg-gradient-to-r from-orange-400 to-orange-600"></div>
                                <span className="block text-[11px] text-slate-400 uppercase tracking-wider mb-1 font-bold">U-Value (Transmittance)</span>
                                <div className="flex items-baseline gap-2">
                                    <span className="text-4xl font-mono font-bold text-white drop-shadow-[0_0_8px_rgba(255,255,255,0.3)]">
                                      {telemetry.uValue.toFixed(3)}
                                    </span>
                                    <span className="text-sm text-slate-500">W/(m²K)</span>
                                </div>
                            </div>

                            <div className="bg-slate-900 p-4 rounded-lg border border-slate-700 relative overflow-hidden">
                                <div className="absolute top-0 left-0 h-1 w-full bg-slate-500"></div>
                                <span className="block text-[11px] text-slate-400 uppercase tracking-wider mb-1 font-bold">Total R-Value (Resistance)</span>
                                <div className="flex items-baseline gap-2">
                                    <span className="text-3xl font-mono font-bold text-slate-300">
                                      {telemetry.totalR.toFixed(2)}
                                    </span>
                                    <span className="text-sm text-slate-500">m²K/W</span>
                                </div>
                            </div>

                            <div className="bg-slate-900 p-4 rounded-lg border border-slate-700 relative overflow-hidden">
                                <div className="absolute top-0 left-0 h-1 w-full bg-gradient-to-r from-blue-400 to-blue-600"></div>
                                <span className="block text-[11px] text-slate-400 uppercase tracking-wider mb-1 font-bold">Total Heat Loss (Q)</span>
                                <div className="flex items-baseline gap-2">
                                    <span className="text-3xl font-mono font-bold text-blue-400">
                                      {telemetry.totalHeatLoss.toFixed(0)}
                                    </span>
                                    <span className="text-sm text-slate-500">Watts</span>
                                </div>
                            </div>

                        </div>
                    </section>

                    {/* Bottom Panel: Dynamic Cross Section */}
                    <section className="flex-1 bg-slate-800 rounded-xl border border-slate-700 shadow-inner p-4 flex flex-col relative min-h-0 overflow-hidden">
                        <h3 className="text-sm font-bold text-slate-400 uppercase tracking-widest border-b border-slate-600 pb-2 mb-4 shrink-0">
                          Wall Cross-Section & Temperature Gradient
                        </h3>
                        
                        <div className="flex-1 relative flex overflow-hidden rounded-lg bg-slate-950 border border-slate-800">
                            
                            {/* SVG Patterns for Materials */}
                            <svg className="absolute w-0 h-0">
                              <defs>
                                <pattern id="brick" patternUnits="userSpaceOnUse" width="40" height="20" patternTransform="scale(0.8)">
                                  <rect width="40" height="20" fill="none" />
                                  <path d="M0 10h40M20 0v10M0 10v10M40 10v10" stroke="rgba(255,255,255,0.2)" strokeWidth="1" />
                                </pattern>
                                <pattern id="wool" patternUnits="userSpaceOnUse" width="20" height="20">
                                  <path d="M0 10 Q5 0 10 10 T20 10" fill="none" stroke="rgba(255,255,255,0.3)" strokeWidth="1" />
                                  <path d="M0 20 Q5 10 10 20 T20 20" fill="none" stroke="rgba(255,255,255,0.3)" strokeWidth="1" />
                                </pattern>
                                <pattern id="wood" patternUnits="userSpaceOnUse" width="10" height="40">
                                  <path d="M5 0 Q0 20 5 40" fill="none" stroke="rgba(0,0,0,0.3)" strokeWidth="1" />
                                </pattern>
                                <pattern id="dotted" patternUnits="userSpaceOnUse" width="10" height="10">
                                  <circle cx="2" cy="2" r="1" fill="rgba(0,0,0,0.3)" />
                                  <circle cx="7" cy="7" r="1" fill="rgba(0,0,0,0.3)" />
                                </pattern>
                              </defs>
                            </svg>

                            {/* Environment Indicators (Left/Right) */}
                            <div className="absolute left-0 top-0 bottom-0 w-16 bg-gradient-to-r from-orange-500/20 to-transparent flex items-start p-2 pointer-events-none z-10">
                               <span className="text-orange-400 font-bold text-xs">IN<br/>{tempIn}°C</span>
                            </div>
                            <div className="absolute right-0 top-0 bottom-0 w-16 bg-gradient-to-l from-blue-500/20 to-transparent flex justify-end items-start p-2 pointer-events-none z-10">
                               <span className="text-blue-400 font-bold text-xs text-right">OUT<br/>{tempOut}°C</span>
                            </div>

                            {/* Physical Layers Rendering */}
                            <div className="absolute inset-y-0 left-16 right-16 flex z-0">
                                {telemetry.layersData.map((layer, i) => {
                                  // Visual width proportional to physical thickness, but clamp minimum for visibility
                                  const proportionalWidth = telemetry.totalThickness > 0 ? (layer.d / telemetry.totalThickness) * 100 : 0;
                                  
                                  return (
                                    <div 
                                      key={layer.id} 
                                      className="h-full border-r border-slate-900/50 flex flex-col items-center justify-end pb-2 relative"
                                      style={{ 
                                        width: `${proportionalWidth}%`, 
                                        minWidth: '40px', // Minimum physical width so very thin layers are visible
                                        backgroundColor: layer.material.color
                                      }}
                                    >
                                      {/* Apply SVG Pattern Overlay */}
                                      {layer.material.pattern !== 'solid' && (
                                        <div className="absolute inset-0 opacity-50" style={{ background: `url(#${layer.material.pattern})` }}></div>
                                      )}
                                      
                                      <span className="bg-slate-900/80 px-1 py-0.5 rounded text-[9px] font-mono text-white whitespace-nowrap overflow-hidden text-ellipsis max-w-[90%] z-10 shadow">
                                        {layer.d}mm
                                      </span>
                                    </div>
                                  )
                                })}
                            </div>

                            {/* Temperature Gradient Overlay (SVG) */}
                            <div className="absolute inset-y-0 left-16 right-16 z-20 pointer-events-none">
                              <svg className="w-full h-full" preserveAspectRatio="none">
                                {/* Map temperatures to Y-coordinates.
                                  Max Temp = 10% height (top)
                                  Min Temp = 90% height (bottom)
                                */}
                                {(() => {
                                  const maxT = Math.max(tempIn, tempOut);
                                  const minT = Math.min(tempIn, tempOut);
                                  const tempRange = maxT - minT || 1; // Prevent div by zero
                                  
                                  const getY = (t) => {
                                     const normalized = (maxT - t) / tempRange;
                                     return `${10 + (normalized * 80)}%`;
                                  };

                                  // Generate Polyline points
                                  const points = telemetry.tempProfile.map(pt => {
                                     const xPx = pt.xOffset * 100; // SVG uses % width
                                     return `${xPx},${getY(pt.temp).replace('%','')}`;
                                  });

                                  return (
                                    <>
                                      {/* Gradient definition for the line */}
                                      <defs>
                                        <linearGradient id="tempGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                                          <stop offset="0%" stopColor="#FB923C" /> {/* orange-400 */}
                                          <stop offset="100%" stopColor="#60A5FA" /> {/* blue-400 */}
                                        </linearGradient>
                                      </defs>

                                      {/* The segmented gradient line */}
                                      <polyline 
                                        fill="none" 
                                        stroke="url(#tempGrad)" 
                                        strokeWidth="4" 
                                        points={points.map(p => {
                                          const [x, y] = p.split(',');
                                          return `${x}%,${y}%`;
                                        }).join(' ')}
                                        style={{ filter: 'drop-shadow(0px 2px 4px rgba(0,0,0,0.5))' }}
                                      />
                                      
                                      {/* Nodes at interfaces */}
                                      {telemetry.tempProfile.map((pt, i) => {
                                        const isEdge = (i === 0 || i === telemetry.tempProfile.length - 1);
                                        if (isEdge) return null; // Don't draw nodes on the very edges of the air

                                        return (
                                          <g key={i}>
                                            {/* Vertical drop line to connect the label to the node */}
                                            <line 
                                              x1={`${pt.xOffset * 100}%`} y1="0%" 
                                              x2={`${pt.xOffset * 100}%`} y2={`${getY(pt.temp)}`} 
                                              stroke="#64748b" strokeWidth="1" strokeDasharray="3 3" opacity="0.6"
                                            />
                                            <circle 
                                              cx={`${pt.xOffset * 100}%`} 
                                              cy={`${getY(pt.temp)}`} 
                                              r="4" 
                                              fill="white" 
                                              stroke="#334155" 
                                              strokeWidth="2"
                                            />
                                          </g>
                                        )
                                      })}
                                    </>
                                  );
                                })()}
                              </svg>
                            </div>

                            {/* Aligned Temperature Labels (HTML Overlay) */}
                            <div className="absolute top-2 left-16 right-16 z-30 pointer-events-none">
                              {telemetry.tempProfile.map((pt, i) => {
                                const isEdge = (i === 0 || i === telemetry.tempProfile.length - 1);
                                if (isEdge) return null;
                                return (
                                  <div 
                                    key={`lbl-${i}`}
                                    className="absolute -translate-x-1/2 bg-slate-900/95 border border-slate-600 px-1.5 py-0.5 rounded text-[10px] font-mono font-bold text-slate-200 shadow-md"
                                    style={{ left: `${pt.xOffset * 100}%` }}
                                  >
                                    {pt.temp.toFixed(1)}°
                                  </div>
                                )
                              })}
                            </div>

                        </div>
                    </section>
                </div>

              </main>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
